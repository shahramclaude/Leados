openapi: 3.1.0
info:
  title: LEADOS API
  version: 0.1.0
  description: Representative slice of the LEADOS API surface (events, findings,
    decisions, automation runs, board packs) used to prove out the Part 11 QE
    pipeline.
servers:
  - url: /
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API token (see API_TOKEN env var). Required for all mutating requests.
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error
      description: Standard error envelope.
    Health:
      type: object
      properties:
        ok:
          type: boolean
        service:
          type: string
          enum:
            - leados
        database:
          type: string
          enum:
            - connected
            - unreachable
        error:
          type: string
      required:
        - ok
        - service
        - database
    EventRecord:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
        version:
          type: integer
        payload: {}
        createdAt:
          type: string
      required:
        - id
        - type
        - version
        - createdAt
    Finding:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        summary:
          type: string
        impact:
          type: number
        confidence:
          type: number
        effort:
          type: number
        score:
          type: number
        status:
          type: string
          enum:
            - open
            - resolved
            - dismissed
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - title
        - summary
        - impact
        - confidence
        - effort
        - score
        - status
        - createdAt
        - updatedAt
    Decision:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        context:
          type: string
        priorAlpha:
          type: number
        priorBeta:
          type: number
        posteriorAlpha:
          type: number
        posteriorBeta:
          type: number
        beliefMean:
          type: number
        status:
          type: string
          enum:
            - open
            - decided
            - abandoned
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - title
        - context
        - priorAlpha
        - priorBeta
        - posteriorAlpha
        - posteriorBeta
        - beliefMean
        - status
        - createdAt
        - updatedAt
    AutomationRun:
      type: object
      properties:
        id:
          type: integer
        kind:
          type: string
        seed:
          type: integer
        trials:
          type: integer
        input: {}
        result: {}
        status:
          type: string
          enum:
            - completed
            - failed
        createdAt:
          type: string
      required:
        - id
        - kind
        - seed
        - trials
        - status
        - createdAt
    BoardPack:
      type: object
      properties:
        id:
          type: integer
        periodLabel:
          type: string
        summary:
          type: object
          properties:
            generatedAt:
              type: string
            totals:
              type: object
              properties:
                events:
                  type: number
                findings:
                  type: number
                openFindings:
                  type: number
                decisions:
                  type: number
                decidedDecisions:
                  type: number
                automationRuns:
                  type: number
              required:
                - events
                - findings
                - openFindings
                - decisions
                - decidedDecisions
                - automationRuns
            topFindings:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: number
                  title:
                    type: string
                  score:
                    type: number
                required:
                  - id
                  - title
                  - score
            recentDecisions:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: number
                  title:
                    type: string
                  beliefMean:
                    type: number
                  status:
                    type: string
                required:
                  - id
                  - title
                  - beliefMean
                  - status
          required:
            - generatedAt
            - totals
            - topFindings
            - recentDecisions
        createdAt:
          type: string
      required:
        - id
        - periodLabel
        - summary
        - createdAt
  parameters: {}
paths:
  /api/health:
    get:
      summary: Service + database health check
      responses:
        "200":
          description: Health status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/events:
    get:
      summary: List recent events (paginated)
      parameters:
        - schema:
            type: string
          required: false
          name: limit
          in: query
        - schema:
            type: string
          required: false
          name: cursor
          in: query
      responses:
        "200":
          description: A page of events
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/EventRecord"
                  nextCursor:
                    type:
                      - string
                      - "null"
                  total:
                    type: integer
                required:
                  - items
                  - nextCursor
                  - total
    post:
      summary: Record a new event
      security: &a1
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                version:
                  type: number
                payload: {}
              required:
                - type
                - version
      responses:
        "201":
          description: Event recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventRecord"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing/malformed auth header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/findings:
    get:
      summary: List findings (paginated)
      responses:
        "200":
          description: A page of findings
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Finding"
                  nextCursor:
                    type:
                      - string
                      - "null"
                  total:
                    type: integer
                required:
                  - items
                  - nextCursor
                  - total
    post:
      summary: Create a finding (ICE score computed server-side)
      security: *a1
      responses:
        "201":
          description: Finding created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Finding"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing/malformed auth header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/findings/{id}:
    get:
      summary: Get a finding by id
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
      responses:
        "200":
          description: Finding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Finding"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/decisions:
    get:
      summary: List decisions (paginated)
      responses:
        "200":
          description: A page of decisions
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Decision"
                  nextCursor:
                    type:
                      - string
                      - "null"
                  total:
                    type: integer
                required:
                  - items
                  - nextCursor
                  - total
    post:
      summary: Create a decision with a Beta(1,1) prior belief
      security: *a1
      responses:
        "201":
          description: Decision created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Decision"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing/malformed auth header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/decisions/{id}:
    get:
      summary: Get a decision by id
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
      responses:
        "200":
          description: Decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Decision"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      summary: Update a decision's belief with new evidence (Bayesian update)
      security: *a1
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
      responses:
        "200":
          description: Decision updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Decision"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing/malformed auth header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/automation/runs:
    get:
      summary: List automation runs (paginated)
      responses:
        "200":
          description: A page of runs
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AutomationRun"
                  nextCursor:
                    type:
                      - string
                      - "null"
                  total:
                    type: integer
                required:
                  - items
                  - nextCursor
                  - total
  /api/automation/run:
    post:
      summary: Trigger a Monte Carlo forecast automation run
      security: *a1
      responses:
        "201":
          description: Run completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationRun"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing/malformed auth header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/boardpack:
    get:
      summary: Get the latest board pack (generates one if none exists)
      responses:
        "200":
          description: Board pack
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardPack"
    post:
      summary: Force-generate a new board pack
      security: *a1
      responses:
        "201":
          description: Board pack generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardPack"
        "401":
          description: Missing/malformed auth header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/onboarding:
    get:
      summary: Get onboarding status
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  completed:
                    type: boolean
                  orgName:
                    type:
                      - string
                      - "null"
                required:
                  - completed
                  - orgName
    post:
      summary: Complete onboarding
      security: *a1
      responses:
        "201":
          description: Onboarding completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  orgName:
                    type: string
                required:
                  - orgName
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing/malformed auth header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/self-test:
    get:
      summary: Run the smoke subset of the real test suites in-process
      responses:
        "200":
          description: Self-test results
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  checks:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        pass:
                          type: boolean
                        detail:
                          type: string
                      required:
                        - name
                        - pass
                        - detail
                required:
                  - ok
                  - checks
webhooks: {}
