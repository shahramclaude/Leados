openapi: 3.1.0
info:
  title: LEADOS API
  version: 1.0.0
  description: |-
    LEADOS public API. See docs/API.md for the full guide (auth, pagination,
    errors, webhooks, realtime, deprecation policy).

    v1 freeze date: 2026-02-01. Pre-v1 shim sunset date: 2026-08-01.

    Deprecated legacy path -> v1 path mapping:
      GET /api/leads -> GET /api/v1/leads
      POST /api/leads -> POST /api/v1/leads
      GET /api/leads/{id} -> GET /api/v1/leads/{id}
      PATCH /api/leads/{id} -> PATCH /api/v1/leads/{id}
      DELETE /api/leads/{id} -> DELETE /api/v1/leads/{id}
      GET /api/contacts -> GET /api/v1/contacts
      POST /api/contacts -> POST /api/v1/contacts
      GET /api/contacts/{id} -> GET /api/v1/contacts/{id}
      GET /api/deals -> GET /api/v1/deals
      POST /api/deals -> POST /api/v1/deals
      GET /api/deals/{id} -> GET /api/v1/deals/{id}
servers:
  - url: /api
    description: Same-origin deployment
components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      description: "API key issued via POST /v1/api-keys (admin-only). Send as
        `Authorization: Bearer <key>`."
  schemas:
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details: {}
            correlationId:
              type: string
          required:
            - code
            - message
            - correlationId
      required:
        - error
  parameters: {}
paths:
  /v1/api-keys:
    post:
      operationId: createApiKey
      summary: "Admin-only: mint a new API key with the given scopes"
      tags:
        - Admin
      security:
        - ApiKeyAuth:
            - admin
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                scopes:
                  type: array
                  items:
                    type: string
                    enum:
                      - leads:read
                      - leads:write
                      - contacts:read
                      - contacts:write
                      - deals:read
                      - deals:write
                      - webhooks:read
                      - webhooks:write
                      - automation:read
                      - automation:write
                      - admin
                  minItems: 1
              required:
                - name
                - scopes
      responses:
        "201":
          description: "Admin-only: mint a new API key with the given scopes"
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  scopes:
                    type: array
                    items:
                      type: string
                      enum:
                        - leads:read
                        - leads:write
                        - contacts:read
                        - contacts:write
                        - deals:read
                        - deals:write
                        - webhooks:read
                        - webhooks:write
                        - automation:read
                        - automation:write
                        - admin
                  prefix:
                    type: string
                  apiKey:
                    type: string
                    description: Returned once, at creation time only.
                  createdAt:
                    type: string
                required:
                  - id
                  - name
                  - scopes
                  - prefix
                  - apiKey
                  - createdAt
        "400":
          description: Validation or filter/sort error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing/invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Insufficient scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Idempotency-Key conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/leads:
    get:
      operationId: listLeads
      summary: List leads (cursor-paginated, filterable, sortable)
      tags:
        - Leads
      security:
        - ApiKeyAuth:
            - leads:read
      parameters:
        - schema:
            type: string
          required: false
          name: cursor
          in: query
        - schema:
            type: string
          required: false
          name: limit
          in: query
        - schema:
            type: string
          required: false
          name: sort
          in: query
        - schema:
            type: string
          required: false
          name: status
          in: query
        - schema:
            type: string
          required: false
          name: score[gte]
          in: query
        - schema:
            type: string
          required: false
          name: score[lte]
          in: query
      responses:
        "200":
          description: List leads (cursor-paginated, filterable, sortable)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        email:
                          type: string
                          format: email
                        company:
                          type:
                            - string
                            - "null"
                        status:
                          type: string
                          enum:
                            - new
                            - contacted
                            - qualified
                            - won
                            - lost
                        score:
                          type: integer
                        ownerId:
                          type:
                            - string
                            - "null"
                        createdAt:
                          type: string
                        updatedAt:
                          type: string
                      required:
                        - id
                        - name
                        - email
                        - company
                        - status
                        - score
                        - ownerId
                        - createdAt
                        - updatedAt
                  page:
                    type: object
                    properties:
                      cursor:
                        type:
                          - string
                          - "null"
                      hasMore:
                        type: boolean
                      limit:
                        type: integer
                    required:
                      - cursor
                      - hasMore
                      - limit
                required:
                  - data
                  - page
        "400":
          description: Validation or filter/sort error
          content:
            application/json:
