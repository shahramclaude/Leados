# LeadOS CI — canonical zero-build application gate.
#
# WHY THIS FILE DOES NOT RUN `next build`
# ---------------------------------------
# Per ADR-0006 and ADR-0007, the single canonical LeadOS application is the
# zero-build browser app rooted at `index.html` + `app/**` (served by
# `scripts/serve.mjs` and verified by `tests/app/*.test.mjs`). The legacy
# Next.js / Vite trees (`src/**`, the root `*.ts`/`*.tsx` files, and
# `deprecated/**`) are a frozen, archive-in-place quarantine. ADR-0007 records
# that the legacy tree "does not build, and did not before this change", and
# `src/db/schema.ts` is an intentional 3-line stub that exports nothing while
# quarantined modules import hundreds of tables from it.
#
# The previous workflow ran `npm run build` (i.e. `next build`). That compiled
# the quarantined legacy tree instead of the product, so it failed on `main` and
# on every pull request regardless of the change under review — a permanently
# red check that carried no information about the actual app. This workflow
# instead runs exactly the gates that `npm run verify:canonical` runs locally:
# the canonical-boundary audit (proves `app/**` imports nothing from the
# quarantined trees and performs no network calls), the internal docs-link
# audit, the ADR-0007-scoped lint, and the full canonical test suite.

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  canonical:

    runs-on: ubuntu-latest
    timeout-minutes: 120

    # NODE VERSION: 22.x only, deliberately.
    # README.md already states the tooling requirement as "use Node 22+ (verified
    # with Node 22.22.3)"; Node 18 is past end-of-life (2025-04-30). A Node 20 leg
    # was added and measured rather than assumed: it passed boundary, links and
    # lint, then failed the canonical test suite. That failure could not be
    # diagnosed in the environment that built this workflow (GitHub Actions job
    # logs are stored on a blob host unreachable from it), and a grep of app/,
    # tests/ and scripts/ found no Node 21+/22+-only API in use other than
    # `structuredClone` (Node 17+), so the gap is in a dependency floor or a
    # `node:test` reporter difference rather than in product code. Rather than
    # ship a permanently red leg — the exact failure mode this workflow exists to
    # remove — CI now claims only the runtime the repository documents and has
    # verified. See ADR-0072 and ROADMAP.md (Session 112) for the open item.
    #
    # Note: `fail-fast` is irrelevant with a single matrix entry and has been
    # removed rather than left as a misleading default.

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'

    - run: npm ci

    - name: Canonical boundary (ADR-0006 / ADR-0007)
      run: npm run check:boundary

    - name: Internal documentation links
      run: npm run check:links

    - name: Lint (canonical app only)
      run: npm run lint

    - name: Canonical application tests
      run: npm test
