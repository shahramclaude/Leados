        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    get:
      tags:
        - Automation
      summary: List runs
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
