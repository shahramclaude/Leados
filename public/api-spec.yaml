    patch:
      tags:
        - Decisions
      summary: Update a decision
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
        - schema:
            type: string
            description: Dedupe key for safe retries of this write
          required: false
          description: Dedupe key for safe retries of this write
          name: Idempotency-Key
          in: header
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDecisionInput"
      responses:
        "200":
          description: Updated decision
          content:
            application/json:
