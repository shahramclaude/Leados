          description: Field to sort by, prefix with `-` for descending
          name: sort
          in: query
      responses:
        "200":
          description: Page of runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunList"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
