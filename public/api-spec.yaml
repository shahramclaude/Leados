openapi: 3.1.0
info:
  title: LEADOS Platform API
  version: 1.0.0
  description: LEADOS public API v1. See docs/API.md for the full guide (auth,
    pagination, idempotency, webhooks, realtime, automation, deprecation
    policy).
servers:
  - url: /
    description: Current deployment
tags:
  - name: Decisions
  - name: Findings
  - name: Automation
  - name: Realtime
  - name: Webhooks
  - name: Integrations
  - name: Auth
  - name: Platform
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "API token issued via POST /api/v1/tokens. Example: `Authorization:
        Bearer lead_sk_...`"
  schemas:
    DecisionList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Decision"
        page:
          $ref: "#/components/schemas/PageMeta"
      required:
        - items
        - page
    Decision:
      type: object
      properties:
        id:
          type: string
          format: uuid
        orgId:
          type: string
        title:
          type: string
        status:
          type: string
          enum:
            - open
            - decided
            - deferred
            - abandoned
        owner:
          type:
            - string
            - "null"
        description:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - orgId
        - title
        - status
        - owner
        - description
        - createdAt
        - updatedAt
    PageMeta:
      type: object
      properties:
        nextCursor:
          type:
            - string
            - "null"
          example: eyJjcmVhdGVkQXQiOi4uLn0
        limit:
          type: integer
      required:
        - nextCursor
        - limit
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - BAD_REQUEST
                - UNAUTHORIZED
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT
                - RATE_LIMITED
                - IDEMPOTENCY_MISMATCH
                - VALIDATION_ERROR
                - INTERNAL_ERROR
              example: NOT_FOUND
            message:
              type: string
              example: Decision not found
            details: {}
            correlationId:
              type: string
              example: req_8f1c2e...
          required:
            - code
            - message
            - correlationId
      required:
        - error
    CreateDecisionInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        status:
          type: string
          enum:
            - open
            - decided
            - deferred
            - abandoned
        owner:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 5000
      required:
        - title
    UpdateDecisionInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        status:
          type: string
          enum:
            - open
            - decided
            - deferred
            - abandoned
        owner:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 5000
    FindingList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Finding"
        page:
          $ref: "#/components/schemas/PageMeta"
      required:
        - items
        - page
    Finding:
      type: object
      properties:
        id:
          type: string
          format: uuid
        orgId:
          type: string
        decisionId:
          type:
            - string
            - "null"
          format: uuid
        summary:
          type: string
        severity:
          type: string
          enum:
            - info
            - warning
            - critical
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - orgId
        - decisionId
        - summary
        - severity
        - createdAt
    CreateFindingInput:
      type: object
      properties:
        decisionId:
          type: string
          format: uuid
        summary:
          type: string
          minLength: 1
          maxLength: 2000
        severity:
          type: string
          enum:
            - info
            - warning
            - critical
      required:
        - summary
    Run:
      type: object
      properties:
        id:
          type: string
          format: uuid
        orgId:
          type: string
        type:
          $ref: "#/components/schemas/RunType"
        status:
          type: string
          enum:
            - queued
            - running
            - completed
            - failed
        input:
          type: object
          additionalProperties: {}
        output:
          type:
            - object
            - "null"
          additionalProperties: {}
        error:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completedAt:
          type:
            - string
            - "null"
          format: date-time
      required:
        - id
        - orgId
        - type
        - status
        - input
        - output
        - error
        - createdAt
        - updatedAt
        - completedAt
    RunType:
      type: string
      enum:
        - sync_crm
        - digest_summary
        - recalculate_scores
    TriggerRunInput:
      type: object
      properties:
        type:
          $ref: "#/components/schemas/RunType"
        input:
          type: object
          additionalProperties: {}
          default: {}
      required:
        - type
    RunList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Run"
        page:
          $ref: "#/components/schemas/PageMeta"
      required:
        - items
        - page
    WebhookSubscription:
      type: object
      properties:
        id:
          type: string
          format: uuid
        orgId:
          type: string
        url:
          type: string
          format: uri
        eventTypes:
          type: array
          items:
            type: string
        active:
          type: boolean
        description:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - orgId
        - url
        - eventTypes
        - active
        - description
        - createdAt
    CreateWebhookSubscriptionResponse:
      allOf:
        - $ref: "#/components/schemas/WebhookSubscription"
        - type: object
          properties:
            secret:
              type: string
              description: Shown once. Used to verify the X-Leados-Signature HMAC header.
          required:
            - secret
    CreateWebhookSubscriptionInput:
      type: object
      properties:
        url:
          type: string
          format: uri
        eventTypes:
          type: array
          items:
            type: string
          minItems: 1
        description:
          type: string
          maxLength: 500
      required:
        - url
        - eventTypes
    WebhookDeliveryList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WebhookDelivery"
        page:
          $ref: "#/components/schemas/PageMeta"
      required:
        - items
        - page
    WebhookDelivery:
      type: object
      properties:
        id:
          type: string
          format: uuid
        subscriptionId:
          type: string
          format: uuid
        eventType:
          type: string
        status:
          type: string
          enum:
            - pending
            - delivered
            - retrying
            - dead_letter
        attempt:
          type: integer
        maxAttempts:
          type: integer
        responseStatus:
          type:
            - integer
            - "null"
        nextRetryAt:
          type:
            - string
            - "null"
          format: date-time
        createdAt:
          type: string
          format: date-time
        deliveredAt:
          type:
            - string
            - "null"
          format: date-time
      required:
        - id
        - subscriptionId
        - eventType
        - status
        - attempt
        - maxAttempts
        - responseStatus
        - nextRetryAt
        - createdAt
        - deliveredAt
    SlackNotifyInput:
      type: object
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 4000
        channelOverride:
          type: string
      required:
        - message
    CreateApiTokenResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        token:
          type: string
          description: Shown once — store it securely.
        prefix:
          type: string
        scopes:
          type: array
          items:
            type: string
        rateLimitPerMinute:
          type: integer
      required:
        - id
        - name
        - token
        - prefix
        - scopes
        - rateLimitPerMinute
    CreateApiTokenInput:
      type: object
      properties:
        orgId:
          type: string
          minLength: 1
          maxLength: 200
        name:
          type: string
          minLength: 1
          maxLength: 200
        scopes:
          type: array
          items:
            type: string
            enum:
              - read
              - write
              - webhooks
              - realtime
              - automation
          minItems: 1
        rateLimitPerMinute:
          type: integer
          minimum: 1
          maximum: 6000
      required:
        - orgId
        - name
        - scopes
    Stats:
      type: object
      properties:
        status:
          type: string
          enum:
            - operational
            - degraded
            - down
        uptimeSeconds:
          type: number
        apiVersion:
          type: string
          enum:
            - v1
        counts:
          type: object
          properties:
            decisions:
              type: integer
            findings:
              type: integer
            runs:
              type: integer
            webhookSubscriptions:
              type: integer
          required:
            - decisions
            - findings
            - runs
            - webhookSubscriptions
        webhookHealth:
          type: object
          properties:
            delivered:
              type: integer
            retrying:
              type: integer
            deadLetter:
              type: integer
          required:
            - delivered
            - retrying
            - deadLetter
        generatedAt:
          type: string
          format: date-time
      required:
        - status
        - uptimeSeconds
        - apiVersion
        - counts
        - webhookHealth
        - generatedAt
  parameters: {}
paths:
  /api/v1/decisions:
    get:
      tags:
        - Decisions
      summary: List decisions (cursor-paginated)
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            description: Opaque cursor from a previous page's `page.nextCursor`
          required: false
          description: Opaque cursor from a previous page's `page.nextCursor`
          name: cursor
          in: query
        - schema:
            type: string
            description: Page size, 1-100 (default 25)
          required: false
          description: Page size, 1-100 (default 25)
          name: limit
          in: query
        - schema:
            type: string
            description: Field to sort by, prefix with `-` for descending
          required: false
          description: Field to sort by, prefix with `-` for descending
          name: sort
          in: query
      responses:
        "200":
          description: Page of decisions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionList"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      tags:
        - Decisions
      summary: Create a decision
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            description: Dedupe key for safe retries of this write
          required: false
          description: Dedupe key for safe retries of this write
          name: Idempotency-Key
          in: header
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDecisionInput"
      responses:
        "201":
          description: Decision created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Decision"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/decisions/{id}:
    get:
      tags:
        - Decisions
      summary: Get a decision (supports ETag / If-None-Match)
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
      responses:
        "200":
          description: Decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Decision"
        "304":
          description: Not modified
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Conflict
          content:
            application/json:
