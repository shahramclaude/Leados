<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LeadOS — Leadership Operating System</title>
<style>
/* ============ DESIGN SYSTEM — LeadOS v12 (dark ops console, zero network — NO CDN, runs from file://) ============ */
:root{
--bg:#0c0f14;--bg2:#10141b;--panel:#131822;--panel2:#171e2b;--panel3:#1c2434;
--line:#232c3d;--line2:#2d3a52;--ink:#e8edf6;--ink2:#9aa8bf;--ink3:#5d6c85;
--acc:#e9b44c;--acc2:#f4cd7e;--acc-dim:#5a4a22;
--red:#e5484d;--red-dim:#4a1d20;--amber:#f0a13c;--amber-dim:#463015;
--green:#3fb68b;--green-dim:#123a2c;--blue:#5b9cf5;--blue-dim:#16283f;
--violet:#9a7ff0;--violet-dim:#241f3d;
--mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
--sans:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
--r:10px;--r2:14px}
html{color-scheme:dark}
body,h1,h2,h3,h4,p,ul,ol,dl,dd,figure,table{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
*,*::before,*::after{box-sizing:border-box}
::selection{background:var(--acc-dim);color:var(--acc2)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(233,180,76,.12)}
textarea{resize:vertical;min-height:70px}
label{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin:10px 0 4px}
svg.i{flex:none;vertical-align:-3px}
kbd.k{font-family:var(--mono);font-size:10px;background:var(--panel3);border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--ink2)}
#app{display:grid;grid-template-columns:230px 1fr;grid-template-rows:52px 1fr;height:100vh}
#topbar{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--bg2);border-bottom:1px solid var(--line)}
#brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15px}
#brand .logo{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--acc),#a97a25);display:grid;place-items:center;color:#181206}
#saved{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink3)}
#saved.bad{color:var(--red);font-weight:700}
#nav{overflow-y:auto;padding:14px 10px 30px;background:var(--bg2);border-right:1px solid var(--line)}
#nav .grp{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);padding:14px 10px 6px;font-weight:700}
#nav a{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-weight:500;margin:1px 0;border:1px solid transparent}
#nav a:hover{background:var(--panel);color:var(--ink)}
#nav a.on{background:var(--panel2);color:var(--acc2);border-color:var(--line)}
#nav a .bdg{margin-left:auto;font-family:var(--mono);font-size:10px;background:var(--panel3);border-radius:20px;padding:0 7px;line-height:18px;color:var(--ink2)}
#nav a .bdg.hot{background:var(--red-dim);color:var(--red)}
#main{overflow-y:auto;padding:26px 30px 110px;scroll-behavior:smooth}
.wrap{max-width:1120px;margin:0 auto}
#datestamp{font-family:var(--mono);font-size:11px;color:var(--ink3)}
.ph{display:flex;align-items:flex-end;gap:14px;margin:0 0 18px;flex-wrap:wrap}
.ph h1{font-size:24px;font-weight:800;letter-spacing:-.01em}
.ph .sub{color:var(--ink2);font-size:13px;margin-bottom:2px}
.ph .sp{flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:16px 18px;margin-bottom:14px}
.card.tight{padding:12px 14px}
.card.hl{border-color:var(--line2);background:var(--panel2)}
.ctitle{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-bottom:10px;display:flex;align-items:center;gap:7px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.row.wrap{flex-wrap:wrap}
.muted{color:var(--ink2)}.dim{color:var(--ink3)}.small{font-size:12px}.tiny{font-size:11px}.mono{font-family:var(--mono)}
strong{font-weight:700}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:9px;font-weight:600;font-size:13px;border:1px solid var(--line2);background:var(--panel2);transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--acc);color:var(--acc2)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#181206}
.btn.pri:hover{background:var(--acc2)}
.btn.dan{border-color:var(--red);color:var(--red);background:transparent}
.btn.dan:hover{background:var(--red-dim)}
.btn.ok{border-color:var(--green);color:var(--green)}
.btn.ok:hover{background:var(--green-dim)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:7px}
.btn.gh{border-color:transparent;background:transparent;color:var(--ink2)}
.btn.gh:hover{color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;border:1px solid var(--line2);color:var(--ink2);line-height:1.6;white-space:nowrap}
.chip.red{background:var(--red-dim);border-color:transparent;color:#ff9d9f}
.chip.amber{background:var(--amber-dim);border-color:transparent;color:#ffc87e}
.chip.green{background:var(--green-dim);border-color:transparent;color:#7fe3bd}
.chip.blue{background:var(--blue-dim);border-color:transparent;color:#9cc4fb}
.chip.violet{background:var(--violet-dim);border-color:transparent;color:#c4b3f8}
.chip.gold{background:var(--acc-dim);border-color:transparent;color:var(--acc2)}
.chip.plain{background:var(--panel3);border-color:transparent}
table.tb{width:100%;border-collapse:collapse;font-size:13px}
.tb th{text-align:left;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);padding:8px 10px;border-bottom:1px solid var(--line);font-weight:700}
.tb td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tb tr:last-child td{border-bottom:0}
.tb tr.hov:hover td{background:var(--panel2)}
.tb tr.clk{cursor:pointer}
.bar{height:7px;border-radius:6px;background:var(--panel3);overflow:hidden;min-width:50px}
.bar>i{display:block;height:100%;border-radius:6px;background:var(--green);transition:width .4s}
.bar>i.warn{background:var(--amber)}.bar>i.bad{background:var(--red)}.bar>i.gold{background:var(--acc)}.bar>i.blue{background:var(--blue)}
.listit{display:flex;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);align-items:flex-start}
.listit:last-child{border-bottom:0}
.tick{width:8px;height:8px;border-radius:8px;margin-top:7px;flex:none}
.empty{padding:34px 20px;text-align:center;color:var(--ink3);border:1px dashed var(--line2);border-radius:var(--r2);font-size:13px}
.empty .big{font-size:15px;color:var(--ink2);font-weight:600;margin-bottom:4px}
.stat{padding:14px 16px}.stat .n{font-size:26px;font-weight:800;font-family:var(--mono);letter-spacing:-.02em}
.stat .l{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.hr{height:1px;background:var(--line);margin:14px 0;border:0}
.pace{display:flex;align-items:center;gap:16px;border-radius:var(--r2);padding:14px 18px;border:1px solid;margin-bottom:18px;flex-wrap:wrap}
.pace.GREEN{background:var(--green-dim);border-color:#1e5c46}
.pace.STEADY{background:var(--blue-dim);border-color:#274b75}
.pace.LOADED{background:var(--amber-dim);border-color:#7a531d}
.pace.REDLINE{background:var(--red-dim);border-color:#7a2b2e}
.pace .word{font-weight:800;letter-spacing:.1em;font-size:13px;font-family:var(--mono)}
.steps{display:flex;gap:0;margin:6px 0 14px;flex-wrap:wrap}
.step{flex:1;min-width:90px;text-align:center;position:relative;padding-top:22px;font-size:11px;color:var(--ink3);font-weight:600}
.step::before{content:'';position:absolute;top:8px;left:50%;transform:translateX(-50%);width:14px;height:14px;border-radius:20px;background:var(--panel3);border:2px solid var(--line2)}
.step::after{content:'';position:absolute;top:14px;left:calc(-50% + 9px);width:calc(100% - 18px);height:2px;background:var(--line2)}
.step:first-child::after{display:none}
.step.done{color:var(--green)}.step.done::before{background:var(--green);border-color:var(--green)}.step.done::after{background:var(--green)}
.step.now{color:var(--acc2)}.step.now::before{background:var(--acc);border-color:var(--acc);box-shadow:0 0 0 4px rgba(233,180,76,.18)}
.step.halt{color:var(--red)}.step.halt::before{background:var(--red);border-color:var(--red)}
#modalHost{position:fixed;inset:0;display:none;z-index:80}
#modalHost.on{display:block}
.mback{position:absolute;inset:0;background:rgba(5,7,10,.72)}
.mbox{position:relative;margin:5vh auto 0;max-width:640px;width:calc(100% - 40px);max-height:86vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:22px 24px;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:pop .18s ease-out}
.mbox.wide{max-width:900px}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}}
.mbox h2{font-size:17px;font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:10px}
.mbox .msub{color:var(--ink2);font-size:12.5px;margin-bottom:10px}
.mfoot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
#toasts{position:fixed;right:18px;bottom:18px;z-index:100;display:flex;flex-direction:column;gap:8px;max-width:380px}
.toast{background:var(--panel2);border:1px solid var(--line2);border-left:3px solid var(--acc);border-radius:10px;padding:11px 14px;font-size:13px;box-shadow:0 12px 34px rgba(0,0,0,.5);animation:pop .2s;display:flex;gap:9px;align-items:flex-start}
.toast.ok{border-left-color:var(--green)}.toast.bad{border-left-color:var(--red)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.check{display:flex;gap:9px;align-items:flex-start;padding:8px 0;font-size:13px}
.check input{width:auto;margin-top:3px}
.note{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:8px;padding:10px 13px;font-size:12.5px;color:var(--ink2);margin:10px 0}
.note.warn{border-left-color:var(--amber);background:var(--amber-dim);color:#ffd9a1}
.note.bad{border-left-color:var(--red);background:var(--red-dim);color:#ffb4b5}
.note.ok{border-left-color:var(--green);background:var(--green-dim);color:#a9ecd2}
.sig{font-family:var(--mono);font-size:10px;padding:1px 7px;border-radius:5px;font-weight:700;letter-spacing:.05em}
.sig.live{background:var(--green-dim);color:var(--green)}
.sig.pend{background:var(--panel3);color:var(--ink3)}
.qcard{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--panel2);cursor:pointer;font-size:13px}
.qcard:hover{border-color:var(--acc)}
.qcard.sel{border-color:var(--acc);background:var(--acc-dim)}
.wireline{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.wireline:last-child{border-bottom:0}
.wireline .wk{font-family:var(--mono);font-size:10px;color:var(--ink3);min-width:104px;text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.slabar{display:flex;align-items:center;gap:9px}
.slab{position:relative;height:8px;flex:1;background:var(--panel3);border-radius:6px;min-width:60px}
.slab>i{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
.gridbox{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.perscell{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--panel2);cursor:pointer}
.perscell:hover{border-color:var(--acc)}
.triad{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;width:96px}
.triad div{aspect-ratio:1;border-radius:4px;border:1px solid var(--line2);display:grid;place-items:center;font-size:9px;color:var(--ink3);cursor:pointer;background:var(--panel3)}
.triad div.hot{background:var(--acc);color:#181206;border-color:var(--acc);font-weight:800}
.triad div.stale{opacity:.4}
.lessonck{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:var(--panel2)}
.lessonck .opt{display:block;padding:7px 10px;border-radius:7px;cursor:pointer;margin-top:4px;border:1px solid transparent;font-size:13px}
.lessonck .opt:hover{background:var(--panel3)}
.lessonck .opt.right{border-color:var(--green);background:var(--green-dim)}
.lessonck .opt.wrong{border-color:var(--red);background:var(--red-dim)}
.topnav2{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab2{padding:7px 13px;border-radius:9px;border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink2);cursor:pointer}
.tab2.on{background:var(--panel2);color:var(--acc2);border-color:var(--line2)}
.capline{position:fixed;left:0;right:0;bottom:0;background:var(--bg2);border-top:1px solid var(--line2);padding:10px 16px;z-index:60;display:none;gap:10px;align-items:center}
.capline.on{display:flex}
.capline input{background:var(--panel);border-color:var(--line2);font-family:var(--mono);font-size:13px}
#palette{position:fixed;inset:0;z-index:90;display:none;background:rgba(5,7,10,.6)}
#palette.on{display:block}
.pbox{max-width:560px;margin:12vh auto 0;background:var(--panel);border:1px solid var(--line2);border-radius:14px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.pbox input{border:0;border-radius:0;border-bottom:1px solid var(--line);padding:14px 16px;font-size:15px;background:var(--panel)}
.pitem{display:flex;gap:10px;align-items:center;padding:10px 16px;cursor:pointer;color:var(--ink2);border-left:2px solid transparent}
.pitem:hover,.pitem.sel{background:var(--panel2);color:var(--ink);border-left-color:var(--acc)}
.pitem .mono{margin-left:auto;font-size:10px;color:var(--ink3)}
.qa-pass{color:var(--green)}.qa-fail{color:var(--red);font-weight:700}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px;border:2px solid var(--bg)}
@media(max-width:960px){#app{grid-template-columns:64px 1fr}#nav a span.t,#nav .grp{display:none}#nav a .bdg{display:none}.grid2,.grid3,.grid4,.frow,.frow3{grid-template-columns:1fr}#main{padding:18px 14px 120px}}
</style>
</head>
<body>
<div id="app">
  <header id="topbar"></header>
  <nav id="nav"></nav>
  <main id="main"><div class="wrap" id="view"></div></main>
</div>
<div class="capline" id="capline"></div>
<div id="palette"></div>
<div id="modalHost"></div>
<div id="toasts"></div>
<script>
'use strict';
/* ================= UTIL ================= */
const U={
esc:s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),
uid:p=>(p||'x')+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,7),
today:()=>new Date().toISOString().slice(0,10),
now:()=>new Date().toISOString(),
addD:(iso,n)=>{const d=new Date((iso||U.today())+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)},
dB:(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5),
age:iso=>U.dB(iso,U.today()),
fmt:iso=>{if(!iso)return '—';const d=new Date(iso+'T12:00:00');return isNaN(d)?'—':d.toLocaleDateString('en-US',{month:'short',day:'numeric'})},
fmtY:iso=>{if(!iso)return '—';const d=new Date(iso+'T12:00:00');return isNaN(d)?'—':d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})},
dow:iso=>new Date(iso+'T12:00:00').toLocaleDateString('en-US',{weekday:'short'}),
clamp:(v,a,b)=>Math.max(a,Math.min(b,v)),
avg:a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0,
sum:a=>a.reduce((x,y)=>x+y,0),
pct:(a,b)=>b?Math.round(100*a/b):0,
plural:(n,w)=>n+' '+w+(n===1?'':'s'),
href:p=>{location.hash=p},
copy:t=>{try{navigator.clipboard.writeText(t)}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(_){}ta.remove()}},
download:(name,text)=>{const b=new Blob([text],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),800)},
titleCase:s=>String(s||'').replace(/\w\S*/g,t=>t[0].toUpperCase()+t.slice(1)),
num:(v,fb)=>{const n=parseFloat(v);return isNaN(n)?(fb==null?0:fb):n}
};
/* ICON — inline lucide-style stroke icons, zero network dependency (file must run from disk) */
const IC={
home:'<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
zap:'<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>',
brief:'<rect width="20" height="14" x="2" y="7" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>',
branch:'<line x1="6" x2="6" y1="3" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/>',
users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
user:'<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
msgs:'<path d="M14 9a2 2 0 0 1-2 2H6l-4 4V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2z"/><path d="M18 9h2a2 2 0 0 1 2 2v11l-4-4h-6a2 2 0 0 1-2-2v-1"/>',
msq:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
compass:'<circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>',
dele:'<path d="M7 17 17 7"/><path d="M7 7h10v10"/>',
flag:'<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" x2="4" y1="22" y2="15"/>',
pulse:'<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>',
rotate:'<path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/>',
calck:'<rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/><path d="m9 16 2 2 4-4"/>',
book:'<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
db:'<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/>',
check:'<polyline points="20 6 9 17 4 12"/>',
x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',

/* flight risk: weighted driver ledger 0..100 */

const last=st.sessions.filter(s=>s.personId===p.id&&(s.kind==='1:1'||s.kind==='tour')).map(s=>s.at).sort().pop();
const cad=p.cadenceDays||14;const gap=last?U.age(last):999;
if(gap>cad*1.5){const w=18;score+=w;dr.push([last?('No 1:1 in '+gap+'d (cadence '+cad+'d)'):'Never had a recorded session',w]);}
const broken=st.commitments.filter(c=>c.direction==='owe'&&c.personId===p.id&&c.status==='broken').length;
if(broken){const w=Math.min(20,broken*10);score+=w;dr.push([U.plural(broken,'commitment')+' you made to them broke',w]);}
const cases=st.cases.filter(c=>c.status==='open'&&c.scope&&c.scope.kind==='person'&&c.scope.id===p.id);
if(cases.length){const w=Math.min(20,cases.length*8+Math.max.apply(null,cases.map(c=>c.sev))*2);score+=w;dr.push([U.plural(cases.length,'open case')+' on record (max sev '+Math.max.apply(null,cases.map(c=>c.sev))+')',w]);}

if(!nb||!nb.at){score+=10;dr.push(['Nine-box never stamped — effort invisible',10]);}
else if(U.age(nb.at)>120){score+=7;dr.push(['Nine-box stamp stale ('+U.age(nb.at)+'d; halves their bench stamp)',7]);}
const bounced=st.delegations.filter(d=>d.personId===p.id&&d.verdict==='bounced').length;
if(bounced){score+=8;dr.push([U.plural(bounced,'delegation')+' bounced back — disengagement or overload',8]);}
const owed=st.commitments.filter(c=>c.direction==='owed'&&c.personId===p.id&&c.status==='broken').length;
if(owed){const w=Math.min(12,owed*6);score+=w;dr.push(['They broke '+U.plural(owed,'commitment')+' to you — reliability wobble',w]);}

krCurrent(g){const cs=(g.checkins||[]).slice().sort((a,b)=>a.at<b.at?-1:1);return cs.length?cs[cs.length-1].value:g.start;},
/* KR score: direction-aware % toward target */

/* confidence slope per week across check-ins */
confSlope(g){const cs=(g.checkins||[]).filter(c=>c.confidence!=null);if(cs.length<2)return 0;

let num=0,den=0;pts.forEach(p=>{num+=(p.x-mx)*(p.y-my);den+=(p.x-mx)*(p.x-mx)});

goalStatus(st,g){

/* GROW live quality */
growQuality(g){let score=0;const notes=[];

aarQuality(a){let score=0;const notes=[];

/* SBI/AID/COIN lint — deliver blocked under 2/3 substantive parts */
fbLint(model,parts){const M={SBI:['s','b','i'],AID:['a','i','d'],COIN:['c','o','i','n']}[model]||['s','b','i'];
const filled=M.filter(k=>(parts[k]||'').trim().length>=20);
const vague=[];const VAGUE=['always','never','attitude','lazy','bad attitude','unprofessional','whatever'];
M.forEach(k=>{const t=(parts[k]||'').toLowerCase();VAGUE.forEach(v=>{if(t.indexOf(v)>=0)vague.push('"'+v+'" in '+k.toUpperCase());});});
const need=Math.ceil(M.length*2/3);

/* trust equation + band + weakest-numerator fix */
trustEq(t){const c=+t.c,r=+t.r,i=+t.i,so=Math.max(1,+t.so);
const score=Math.round((c+r+i)/so*10)/10;

const M={c:['Credibility','Show your work: cite the evidence behind your next three claims to them.'],
r:['Reliability','Make one small promise this week and keep it visibly. Broken micro-promises sink reliability faster than missed deadlines.'],
i:['Intimacy','Ask one question next 1:1 that has nothing to do with the work, and remember the answer.']};
let weakest='c';['c','r','i'].forEach(k=>{if(+t[k]<+t[weakest])weakest=k;});

/* feedback balance 90d: praise share, zone 60-85% */
fbBalance(st,personId){const cut=U.addD(U.today(),-90);

if(personId)list=list.filter(f=>f.personId===personId);

calibration(st){const rated=st.decisions.filter(d=>d.decided&&d.rating!=null);

cynefin(type,sev){const M={

eisenhower(sev,slaDue){const left=slaDue?U.dB(U.today(),slaDue):99;

:{q:'Q4',label:'Drop or defer',advice:'Quadrant IV — say no in pixels so it stays no.'};},

caseSLA(c){const total=Math.max(1,Math.abs(U.dB(c.opened,c.slaDue))||1);

nineBox(nb){if(!nb||!nb.at)return{label:'UNSTAMPED',stale:true,perf:0,pot:0};

const L={'3,3':'STAR','3,2':'CORE HIGH','3,1':'WORKHORSE','2,3':'GROWTH','2,2':'CORE','2,1':'EFFECTIVE?','1,3':'ENIGMA','1,2':'QUESTION','1,1':'MISFIT'};

/* estimated-aware morale slope: estimates never move the needle */
moodSlope(series){const pts=(series||[]).filter(p=>p&&!p.est&&p.v!=null&&!isNaN(p.v));

/* ================= ENG — the case spine: classify, commit, propagate, close, verify, sweep ================= */
const SLA={1:30,2:14,3:10,4:3,5:1};
const ETHICS=['harass','discriminat','racis','sexis','safety','unsafe','medical','fmla','fraud','legal','lawsuit','retaliat','self-harm','suicid','threat','assault','accommodat','disabilit','religio','pregnan'];
const TYPES={
performance:{label:'Underperformance',fail:'Fixing the person instead of the pattern; feedback delivered once and assumed stuck.'},
conflict:{label:'Conflict',fail:'Solving for who is right instead of what the structure makes inevitable.'},
crisis:{label:'Crisis',fail:'Diagnosing in the fire; comms after the rumor.'},
'goal-risk':{label:'Goal at risk',fail:'Reporting the slip instead of naming the constraint class.'},
ramp:{label:'Ramp trouble',fail:'Rescuing repeatedly and calling it coaching — gates exist to name capability.'},
'feedback-breakdown':{label:'Feedback breakdown',fail:'Redelivering the same message louder instead of fixing the agreement.'},
'delegation-fail':{label:'Delegation failure',fail:'Silently re-taking the task — the rung collapses and nobody logs it.'},
'decision-stall':{label:'Decision stall',fail:'Waiting for consensus that is actually fear wearing a tie.'},
'morale-dip':{label:'Morale dip',fail:'Explaining the dip with one story before telemetry and tours agree.'},
escalation:{label:'HR escalation',fail:'Investigating it yourself. That is the only failure mode here, and it is fatal.'},
other:{label:'Other',fail:'Treating the first explanation as the cause.'}};
const PLAYBOOKS={
performance:[{d:1,t:'Write two SBI evidence entries from the last 30 days'},{d:3,t:'Deliver the correction in the next 1:1 — one measurable ask, one date'}],
conflict:[{d:1,t:'Hold individual hearings with each party (mediation stage 1)'},{d:3,t:'Name the structural cause in the joint session, or escalate the frame'}],
crisis:[{d:0,t:'Stabilize: one owner, one next step, one timebox — inside the hour'}],
'goal-risk':[{d:2,t:'Name the constraint class: scope, dependency, or capability — write it on the goal'}],
ramp:[{d:2,t:'Map the rescue pattern: which ramp gate is actually red?'},{d:7,t:'Decide at the next gate: extend ramp with a written plan, or change scope'}],
'feedback-breakdown':[ {d:2,t:'Review the delivered SBI: was the ask measurable and dated?'},{d:5,t:'Renegotiate the agreement face to face — new ask, new date, written'}],
'delegation-fail':[ {d:2,t:'Re-contract: skill/will re-scored, new rung, new boundary'}],
'decision-stall':[ {d:1,t:'Write what waiting is protecting — then decide or delegate the decision'}],
'morale-dip':[ {d:2,t:'Two listening tours this week, no memos — log what you hear verbatim'}],
escalation:[{d:0,t:'Contact HR today — deliver the verbatim record, investigate nothing yourself'}],
other:[{d:2,t:'Write the second explanation for this case before acting on the first'}]};
const ENG={
classify(text){const t=(' '+(text||'')+' ').toLowerCase();
const trip=ETHICS.filter(k=>t.indexOf(k)>=0);return{trip};},
normTitle(t){return String(t||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();},
managerOf(st,p){return p&&p.managerId?st.people.find(x=>x.id===p.managerId):null;},
wire(kind,label,route,ref){return{id:U.uid('w'),kind,label,route:route||null,ref:ref||null,at:U.now()};},
commitCase(st,o){const title=String(o.title||'').trim();
if(!title)throw new Error('A case needs a title.');
const detail=String(o.detail||'').trim();
const type=TYPES[o.type]?o.type:'other';
const sev=U.clamp(Math.round(+o.sev)||3,1,5);
const scope=(o.scope&&o.scope.id)?o.scope:null;
const dup=st.cases.find(c=>c.status==='open'&&c.type===type&&ENG.normTitle(c.title)===ENG.normTitle(title)&&JSON.stringify(c.scope||null)===JSON.stringify(scope||null));
if(dup)return{dup};
const id=U.uid('c');const today=U.today();
const c={id,type,title,detail,scope,sev,status:'open',opened:today,slaDue:U.addD(today,SLA[sev]),links:[],wires:[]};
if(o.trip&&o.trip.length)c.trip=o.trip;
const person=scope&&scope.kind==='person'?st.people.find(p=>p.id===scope.id):null;
const teamLead=scope&&scope.kind==='team'?st.people.find(p=>p.id===scope.id):null;
const mgr=person?ENG.managerOf(st,person):null;
const push=(kind,label,route,ref)=>c.wires.push(ENG.wire(kind,label,route,ref));
if(type==='escalation'){
/* SEALED — exactly three writes: case record, verbatim evidence, HR task due today. Nothing else. Audit ethics-wires enforces. */
if(person){const ev={id:U.uid('e'),at:U.now(),text:'[Escalation intake, verbatim] '+detail,caseId:id};person.evidence.push(ev);push('evidence','Verbatim record → '+person.name+'\'s evidence ledger (sealed)','#/person/'+person.id,ev.id);}
const t={id:U.uid('t'),title:'Contact HR today about: "'+title+'" — do not investigate beyond verbatim facts',due:today,caseId:id,origin:'hr',done:false,route:'#/case/'+id};
st.tasks.push(t);push('hr-task','HR contact task dated today — unsnoozable while open','#/today',t.id);
}else{
if(person&&detail){const ev={id:U.uid('e'),at:U.now(),text:'[Case intake] '+detail,caseId:id};person.evidence.push(ev);push('evidence','Intake verbatim → '+person.name+'\'s evidence ledger','#/person/'+person.id,ev.id);}
if(person&&type==='performance'){const fbid=U.uid('f');st.feedback.push({id:fbid,personId:person.id,kind:'correction',model:'SBI',parts:{s:'',b:detail.slice(0,140),i:''},status:'draft',created:today,caseId:id});push('sbi','Correction draft opened (72h clock)','#/feedback',fbid);}

const tnLead=teamLead||mgr;
if(tnLead){const tnid=U.uid('tn');st.teamNotes.push({id:tnid,at:today,text:'Case opened: '+title+' ('+TYPES[type].label+', sev '+sev+')',scope:{kind:'team',id:tnLead.id},caseId:id});push('team-note','Note on #/org for '+tnLead.name+'\'s team','#/org',tnid);}
if(o.goalId){const g=st.goals.find(x=>x.id===o.goalId);if(g){g.atRisk=id;push('goal-flag','At-risk flag → "'+g.title+'"','#/goals',g.id);}}

if(type==='crisis'){const did=U.uid('dc');st.decisions.push({id:did,title:'[Stub from crisis] '+title,type:2,context:'Opened from case: '+title,premortem:[],owner:'You',deadline:U.addD(today,7),at:today,reHistory:[],caseId:id,decided:false});push('decision-stub','Stub with gate → #/decisions','#/decisions',did);}
(PLAYBOOKS[type]||PLAYBOOKS.other).forEach(pb=>{const tid=U.uid('t');
st.tasks.push({id:tid,title:pb.t,due:U.addD(today,pb.d),caseId:id,origin:'playbook',done:false,route:'#/case/'+id});
push('playbook','d'+pb.d+' · '+pb.t.toLowerCase().slice(0,48),'#/today',tid);});
st.cases.filter(x=>x.status==='open'&&x.id!==id&&JSON.stringify(x.scope||null)===JSON.stringify(scope||null)).forEach(x=>{
if(!x.links.includes(id))x.links.push(id);c.links.push(x.id);});
}

closeCase(st,id,outcome,lesson){const c=st.cases.find(x=>x.id===id);if(!c)return;
if(!outcome||!outcome.trim())throw new Error('Closure needs a recorded outcome.');
if(!lesson||!lesson.trim())throw new Error('Closure needs a lesson — the loop is the tuition.');
c.status='closed';c.closedAt=U.today();c.outcome=outcome.trim();c.lesson=lesson.trim();
let cancelled=0;
st.tasks.filter(t=>t.caseId===id&&!t.done&&t.origin==='playbook').forEach(t=>{t.done=true;t.cancelled=true;t.doneAt=U.now();cancelled++;});
st.goals.forEach(g=>{if(g.atRisk===id)g.atRisk=null;});
st.feedback.forEach(f=>{if(f.caseId===id&&f.status==='draft'){f.status='cancelled';}});
st.lessons.push({id:U.uid('l'),at:U.today(),text:c.lesson,source:TYPES[c.type].label+' case: '+c.title});
c.verifyAt=U.addD(U.today(),30);c.verified=false;
const vt={id:U.uid('t'),title:'Verify fix held (+30d): "'+c.title+'". Held, or re-open on the record?',due:c.verifyAt,caseId:id,origin:'verify',done:false,route:'#/case/'+id};
st.tasks.push(vt);
c.wires.push(ENG.wire('closure-verify','Verification armed +30d · '+cancelled+' orphan task'+(cancelled===1?'':'s')+' cancelled · goal flags cleared','#/case/'+id,vt.id));
if(c.sev>=4&&c.type!=='escalation')c.wires.push(ENG.wire('aar-arm','AAR armed — tuition owed until it exists','#/aar'));
},
verifyCase(st,id,held){const c=st.cases.find(x=>x.id===id);if(!c)return;
st.tasks.filter(t=>t.caseId===id&&t.origin==='verify'&&!t.done).forEach(t=>{t.done=true;t.doneAt=U.now();});
if(held){c.verified=true;c.verifiedAt=U.today();c.wires.push(ENG.wire('closure-verify','+30d verification: HELD','#/case/'+id));}
else{c.status='open';c.verified=false;c.slaDue=U.addD(U.today(),SLA[c.sev]);c.reopenedAt=U.today();
c.wires.push(ENG.wire('re-open','+30d verification FAILED — re-opened, SLA clock restarted','#/case/'+id));}},
/* machine arm: lapsed corrections become cases. Idempotent via lapsedCaseId. */
sweep(st){let fired=0;const grace=U.addD(U.today(),-7);
st.feedback.forEach(f=>{
if(f.kind!=='correction'||f.status!=='delivered'||!f.verifyAt||f.lapsedCaseId)return;
if(f.verifyAt<grace){
const p=st.people.find(x=>x.id===f.personId);
const r=ENG.commitCase(st,{title:'Correction lapsed (+21d, grace spent): "'+(f.parts.s||f.parts.b||'correction').slice(0,42)+'"',
detail:'The correction delivered '+U.fmt(f.deliveredAt)+' to '+(p?p.name:'?')+' was never verified held past its +21d checkpoint and 7d grace. The machine opens this so the breakdown is worked, not forgotten.',
type:'feedback-breakdown',sev:3,scope:{kind:'person',id:f.personId}});
if(r.case){f.lapsedCaseId=r.case.id;fired++;}}});
return fired;}
};

/* ================= IMPORT — v:6-only; merge re-mints ids and rewires the graph ================= */
const IMPORT={
validate(rec){if(!rec||typeof rec!=='object'||Array.isArray(rec))return'Not a LeadOS record (not an object).';
if(+rec.v!==6)return'Record version is v:'+(rec.v==null?'?':rec.v)+' — imports are v:6-only. No silent downgrades, no guesses.';
if(!Array.isArray(rec.people)||!Array.isArray(rec.cases))return'Record shape wrong (people/cases arrays missing). Failing loudly, state untouched.';
return null;},
merge(inc){const COLL=['people','tasks','cases','feedback','goals','decisions','aars','sessions','agenda','delegations','mediations','commitments','teamNotes','lessons','rituals','meetings','pulses','safety','capabilities'];
const map={};let n=0;
COLL.forEach(k=>{(inc[k]||[]).forEach(x=>{if(x&&x.id){const nid=U.uid(k.slice(0,2));map[x.id]=nid;x.id=nid;n++;ST[k].push(x);}});});
const R=id=>id&&map[id]?map[id]:id;
ST.people.forEach(p=>{p.managerId=R(p.managerId);(p.evidence||[]).forEach(e=>{e.caseId=R(e.caseId);});});
ST.cases.forEach(c=>{if(c.scope)c.scope.id=R(c.scope.id);c.links=(c.links||[]).map(R);(c.wires||[]).forEach(w=>{w.ref=R(w.ref);});});
ST.tasks.forEach(t=>{t.caseId=R(t.caseId);});
ST.sessions.forEach(s=>{s.personId=R(s.personId);});
ST.feedback.forEach(f=>{f.personId=R(f.personId);f.caseId=R(f.caseId);f.lapsedCaseId=R(f.lapsedCaseId);});
ST.delegations.forEach(d=>{d.personId=R(d.personId);});
ST.mediations.forEach(m=>{m.a=R(m.a);m.b=R(m.b);});
ST.goals.forEach(g=>{g.ownerId=R(g.ownerId);g.atRisk=R(g.atRisk);});
ST.decisions.forEach(d=>{d.caseId=R(d.caseId);});
ST.agenda.forEach(a=>{a.personId=R(a.personId);a.source=String(a.source||'').replace(/^(case|cascade):(.+)$/,function(mm,p1,p2){return p1+':'+(map[p2]||p2);});});
ST.commitments.forEach(c=>{c.personId=R(c.personId);});
ST.teamNotes.forEach(t=>{if(t.scope)t.scope.id=R(t.scope.id);t.caseId=R(t.caseId);});
ST.aars.forEach(a=>{a.caseId=R(a.caseId);});
ST.rituals.forEach(r=>{r.devCaseId=R(r.devCaseId);});
ST.capabilities.forEach(c=>{c.holders=(c.holders||[]).map(R);});
if(inc.transition&&inc.transition.stakeholders)inc.transition.stakeholders.forEach(s=>{s.id=U.uid('sk');s.linkedId=R(s.linkedId);ST.transition.stakeholders.push(s);});
if(inc.transition&&inc.transition.wins)(inc.transition.wins||[]).forEach(w=>{w.id=U.uid('w');ST.transition.wins.push(w);});
return n;}};

const skips=ST.people.filter(p=>p.managerId).map(p=>{const last=st=>{const l=ST.sessions.filter(s=>s.personId===p.id&&s.kind==='skip').map(s=>s.at).sort().pop();return l;}();

ACTIONS['medAdd']=(d,t)=>{const v=formVals(t);
if(!v.title.trim()||!v.a||!v.b||v.a===v.b){toast('Two different parties and a title.','bad');return;}
commit(st=>{st.mediations.push({id:U.uid('m'),title:v.title.trim(),a:v.a,b:v.b,stage:0,movedAt:U.today(),at:U.today(),notes:{}});},'Mediation open at stage 0 — ground rules.');Modal.close();};
ACTIONS['medNote']=(d)=>{const inp=document.getElementById('mednote_'+d.id);const txt=inp?inp.value.trim():'';
if(!txt){toast('Write the note first.','bad');return;}
commit(st=>{const m=st.mediations.find(x=>x.id===d.id);if(!m)return;
m.notes=m.notes||{};m.notes[m.stage]={text:txt,at:U.today()};m.movedAt=U.today();},'Note filed for stage '+d.id+' — stages advance on evidence, not elapsed time.');};
ACTIONS['medAdvance']=d=>{const m=ST.mediations.find(x=>x.id===d.id);if(!m||m.halted)return;
if((m.stage===2||m.stage===5)&&!(m.notes&&m.notes[m.stage]&&m.notes[m.stage].text)){toast('Stage '+m.stage+' is gated on a written note. Friction is the point.','bad');return;}
if(m.stage===5){commit(st=>{m.stage=6;m.movedAt=U.today();
const txt=m.notes[5].text;
[m.a,m.b].forEach(pid=>{const p=st.people.find(x=>x.id===pid);if(p)p.evidence.push({id:U.uid('e'),at:U.now(),text:'[Mediation agreement — '+m.title+'] '+txt,caseId:null});});
st.tasks.push({id:U.uid('t'),title:'Mediation follow-up (+14d): "'+m.title+'" — is the agreement holding? Ask both parties separately.',due:U.addD(U.today(),14),caseId:null,origin:'mediation',done:false,route:'#/mediation'});},'Agreement closed — filed to BOTH parties\' ledgers, follow-up armed +14d.');return;}
commit(st=>{m.stage=Math.min(5,m.stage+1);m.movedAt=U.today();},'Advanced to stage '+Math.min(5,m.stage+1)+' — '+MEDSTAGES[Math.min(5,m.stage+1)]+'.');};
ACTIONS['medHalt']=d=>{const m=ST.mediations.find(x=>x.id===d.id);if(!m)return;
Modal.open('<h2>'+icon('lock',17)+'Halt to HR — one write, no resume</h2><div class="msub">Protected-class content surfaced? The mediation protocol dies here and the machine writes exactly the sealed escalation set. This cannot be undone by anyone with a keyboard and regret.</div><div data-form><label>verbatim reason (sealed)</label><textarea name="why" placeholder="Facts only, verbatim where possible."></textarea></div><div class="mfoot"><button class="btn gh" data-a="modalClose">keep mediating</button><button class="btn dan" data-a="medHaltDo" data-id="'+m.id+'">halt now</button></div>');};
ACTIONS['medHaltDo']=(d,t)=>{const v=formVals(t);const m=ST.mediations.find(x=>x.id===d.id);if(!m)return;
const r=ENG.commitCase(ST,{title:'[Mediation halt] '+m.title,detail:'Mediation halted at stage '+m.stage+'. '+(v.why||'(no note)')+' Original: '+m.title+'.',type:'escalation',sev:4,scope:{kind:'person',id:m.a},trip:['mediation-halt']});
if(r.case){commit(st=>{m.halted=true;m.haltCaseId=r.case.id;},'Halted. Sealed escalation '+r.case.id+' written; this protocol does not resume.','bad');}
else toast('An identical escalation is already open — the halt stands.','bad');
Modal.close();};

{id:'g4',t:'Health baseline taken',d:'Pulse + safety scan so day-90 comparisons are evidence, not vibes.',sig:st=>st.pulses.length>=1&&st.safety.length>=1},
{id:'g5',t:'Goals current',d:'Every active goal checked-in within 21d; nothing expired-ungraded.',sig:st=>st.goals.length>0&&st.goals.every(g=>g.status==='graded'||((g.checkins||[]).length&&U.age(g.checkins[g.checkins.length-1].at)<=21&&g.deadline>=U.today()))},
{id:'g6',t:'Decision hygiene',d:'Nothing rotting past deadline; premortems on one-way doors.',sig:st=>!st.decisions.some(d=>!d.decided&&d.deadline<U.today())},
{id:'g7',t:'Bench assessed',d:'Nine-box stamped and fresh for every person.',sig:st=>st.people.length>0&&st.people.every(p=>p.nineBox&&p.nineBox.at&&U.age(p.nineBox.at)<=120)},
{id:'g8',t:'Delegation moving',d:'At least one verdict on the record — the bench has begun.',sig:st=>st.delegations.some(d=>d.verdict)},
{id:'g9',t:'Operating cadence real',d:'Three stamped rituals. A cadence is real when it repeats, not when it is announced.',sig:st=>st.rituals.length>=3},
{id:'g10',t:'Skip-levels underway',d:'Two+ skip-levels in the last 60d.',sig:st=>st.sessions.filter(s=>s.kind==='skip'&&U.age(s.at)<=60).length>=2},
{id:'g11',t:'Fire discipline',d:'No sev≥4 case left open longer than 14 days.',sig:st=>!st.cases.some(c=>c.status==='open'&&c.sev>=4&&U.age(c.opened)>14)},

V.transition=function(){const tr=st_t();function st_t(){return ST.transition;}
const ts=FW.transitionScore(ST);
const sk=tr.stakeholders.slice().sort((a,b)=>(a.stance-b.stance)||(b.influence-a.influence));
const skRow=s=>{const stc=['hostile','skeptic','neutral','ally','champion'][U.clamp(s.stance+2,0,4)];
const linked=s.linkedId?ST.people.find(p=>p.id===s.linkedId):null;
return'<tr class="hov"><td><strong>'+U.esc(s.name)+'</strong>'+(linked?' <span class="chip blue tiny">→ '+U.esc(linked.name)+'</span>':'')+'<div class="tiny dim">'+U.esc(s.role)+'</div></td>'
+'<td><select data-c="skSet" data-id="'+s.id+'" data-f="influence">'+[1,2,3,4,5].map(n=>'<option'+(s.influence===n?' selected':'')+'>'+n+'</option>').join('')+'</select></td>'
+'<td><select data-c="skSet" data-id="'+s.id+'" data-f="stance">'+[-2,-1,0,1,2].map(n=>'<option'+(s.stance===n?' selected':'')+' value="'+n+'">'+['hostile','skeptic','neutral','ally','champion'][n+2]+'</option>').join('')+'</select></td>'
+'<td class="mono tiny">'+(s.touredAt?U.fmt(s.touredAt):'—')+'</td>'
+'<td>'+(!s.touredAt?'<button class="btn sm" data-a="skTour" data-id="'+s.id+'">stamp tour</button>':'<span class="chip green tiny">toured</span>')+'</td></tr>';};
return pageHead('Transition','<span class="mono tiny">DAY '+ts.day+' OF 90 · GATE SIGNALS ARE HINTS (LIVE/PENDING); THE NOTE IS THE EVIDENCE · CLOSING AGAINST PENDING IS ALLOWED AND VISIBLE</span>',
'<div class="row"><span class="chip '+(ts.onPace?'green':'amber')+'">'+ts.closed+'/12 gates'+(ts.onPace?' · on pace':' · behind pace ('+ts.expect+' expected)')+'</span><button class="btn" data-a="openTour">'+icon('eye',13)+'log a tour</button></div>')
+'<div class="card tight"><div class="ctitle">'+icon('flag',14)+'the 12 gates — machine signal + mandatory note</div>'
+'<table class="tb"><thead><tr><th>gate</th><th>signal</th><th>evidence note</th><th></th></tr></thead><tbody>'
+GATES.map(g=>{const st8=tr.gates[g.id];const live=g.sig(ST);
return'<tr><td style="max-width:260px"><strong>'+g.t+'</strong><div class="tiny dim">'+g.d+'</div></td>'
+'<td><span class="sig '+(live?'live':'pend')+'">'+(live?'LIVE':'PENDING')+'</span></td>'
+'<td>'+(st8&&st8.closed?'<div class="tiny">'+U.esc(st8.note)+'</div><div class="tiny dim mono">closed '+U.fmt(st8.at)+(st8.vsPending?' · <span style="color:var(--amber)">against PENDING signal — allowed, visible</span>':'')+'</div>':'<input id="gn_'+g.id+'" placeholder="evidence note — mandatory, machine can\'t see the room" style="padding:5px 8px;font-size:12px">')+'</td>'
+'<td>'+(st8&&st8.closed?'<span class="chip green tiny">'+icon('check',11)+'closed</span>':'<button class="btn sm" data-a="gateClose" data-id="'+g.id+'">close</button>')+'</td></tr>';}).join('')+'</tbody></table></div>'
+'<div class="grid2"><div class="card tight"><div class="ctitle">'+icon('users',14)+'stakeholder map — hostile-first order</div>'
+'<table class="tb"><thead><tr><th>name</th><th>infl</th><th>stance</th><th>toured</th><th></th></tr></thead><tbody>'+(sk.length?sk.map(skRow).join(''):'<tr><td colspan="5" class="dim">Add stakeholders below.</td></tr>')+'</tbody></table>'
+'<div class="row" data-form style="margin-top:8px"><input name="skn" placeholder="name" style="flex:1.4"><input name="skr" placeholder="role" style="flex:1.4"><button class="btn sm" data-a="skAdd">'+icon('plus',13)+'add</button></div></div>'
+'<div class="card"><div class="ctitle">'+icon('spark',14)+'win ledger — early wins are transition capital</div>'
+((tr.wins||[]).slice().reverse().map(w=>'<div class="listit"><span class="tick" style="background:var(--green)"></span><div style="flex:1" class="small">'+U.esc(w.text)+'<div class="tiny dim mono">'+U.fmt(w.at)+(w.fromTour?' · from tour':'')+'</div></div></div>').join('')||'<div class="empty">No wins banked yet.</div>')
+'<div class="row" data-form style="margin-top:8px"><input name="wint" placeholder="bank a win (specific, verifiable)" style="flex:1"><button class="btn sm" data-a="winAdd">'+icon('plus',13)+'</button></div></div></div>';};
ACTIONS['gateClose']=d=>{const g=GATES.find(x=>x.id===d.id);const inp=document.getElementById('gn_'+d.id);
const note=inp?inp.value.trim():'';
if(!note){toast('The note is mandatory — the machine cannot verify what happened in a room. That is exactly why the note exists.','bad');return;}

ACTIONS['skSet']=(d,t)=>commit(st=>{const s=st.transition.stakeholders.find(x=>x.id===d.id);if(s)s[d.f]=+t.value;},'Map updated. Hostile-first order re-sorts itself.');
ACTIONS['openTour']=()=>{Modal.open('<h2>'+icon('eye',17)+'Log a listening tour</h2><div class="msub">The [TOUR] prefix keeps tour notes distinct in the session stream. A tour can bank a win.</div>'

ACTIONS['skTour']=d=>{commit(st=>{const s=st.transition.stakeholders.find(x=>x.id===d.id);if(s)s.touredAt=U.today();
st.sessions.push({id:U.uid('s'),personId:null,kind:'tour',at:U.today(),notes:'[TOUR] '+((ST.transition.stakeholders.find(x=>x.id===d.id)||{}).name||'')+' toured — notes pending on #/transition.',mood:null,agendaDone:[]});},'Tour stamped. Log the notes with "log a tour" next time for the verbatim.');};
ACTIONS['winAdd']=(d,t)=>{const v=formVals(t.closest('[data-form]'));if(!v.wint.trim()){toast('A win needs words.','bad');return;}

return'<div class="card"><div class="row between wrap"><div><strong>'+U.esc(g.title)+'</strong> <span class="tiny dim">'+U.esc(g.ownerId?(ST.people.find(p=>p.id===g.ownerId)||{name:'?'}).name:'you')+' · due '+U.fmt(g.deadline)+'</span>'
+(g.atRisk?' <span class="chip red tiny">flagged by <a href="#/case/'+g.atRisk+'">case</a></span>':'')+'</div>'

+(g.status==='graded'?'<span class="chip blue tiny">graded '+g.grade+'</span>':'')+'</div>'

+(act.length?act.map(row).join(''):'<div class="empty">No active goals. Set one before the quarter sets it for you.</div>')

ACTIONS['openGoalNew']=()=>{Modal.open('<h2>'+icon('target',17)+'New goal</h2><div class="msub">Direction matters: "up" and "down" score differently. Start and target are numbers — adjectives are not KRs.</div>'

ACTIONS['goalCheckin']=(d,t)=>{const v=formVals(t);
commit(st=>{const g=st.goals.find(x=>x.id===d.id);if(!g)return;

ACTIONS['openGrade']=d=>{const g=ST.goals.find(x=>x.id===d.id);if(!g)return;

+(ST.examples?'<div class="note warn" style="margin-top:10px">'+icon('warn',13)+'Example org loaded. Field contracts match the write paths, so every instrument is visibly live. Erase it when your real org arrives.</div>':'')+'</div>'
+'<div class="card"><div class="ctitle">'+icon('db',14)+'storage — '+kb+' KB of ~5120 KB ('+pctB+'%)</div>'
+'<div class="bar" style="margin:8px 0"><i class="'+(pctB>75?'bad':pctB>50?'warn':'')+'" style="width:'+Math.max(2,pctB)+'%"></i></div>'
+'<div class="small muted">Synchronous, unencrypted, one profile. Cleared with site data. <strong>No sync, no recovery.</strong> '+U.plural(ST.log.length,'log entry')+' · '+U.plural(ST.sessions.length,'session')+' · '+U.plural(ST.cases.length,'case')+'.</div>'
+'<div class="row" style="margin-top:8px"><button class="btn pri" data-a="doExport">'+icon('down',14)+'export now (v:6)</button><span class="tiny dim">last: '+(ST.exports.lastAt?U.fmtY(ST.exports.lastAt):'never')+'</span></div></div></div>'
+'<div class="card"><div class="ctitle">'+icon('shield',14)+'integrity — '+AUDITS.length+' executable audit classes · repair only where mechanically unambiguous · <a href="#" data-a="auditRun">re-run</a></div>'
+aud.map(a=>'<div class="listit"><span class="tick" style="background:'+(a.faults.length?'var(--red)':'var(--green)')+'"></span><div style="flex:1"><span class="mono tiny">'+a.id+'</span> <span class="small">'+U.esc(a.label)+'</span>'
+(a.faults.length?'<div class="tiny" style="color:var(--red);margin-top:3px">'+a.faults.slice(0,4).map(f=>U.esc(f.m)).join('<br>')+(a.faults.length>4?'<br>…+'+(a.faults.length-4)+' more':'')+'</div>':'<div class="tiny dim">clear</div>')+'</div>'
+(a.repair&&a.faults.length?'<button class="btn sm" data-a="auditRepair" data-id="'+a.id+'">safe-repair</button>':'')+'</div>').join('')
+(faults.length?'<div class="note bad">'+icon('warn',13)+faults.length+' class(es) faulting. Safe-repairs act on records and log every action; what is not mechanically unambiguous stays human.</div>':'<div class="note ok">'+icon('check',13)+'All '+AUDITS.length+' classes clear — verified by execution, not by hope.</div>')+'</div>'
+'<div class="grid2"><div class="card"><div class="ctitle">'+icon('up',14)+'import — v:6-only · wrong shapes fail loudly without touching state</div>'
+'<div data-form><label>paste a LeadOS export (or choose file)</label><textarea name="imp" rows="4" placeholder="{&quot;v&quot;:6,…}"></textarea><input type="file" name="impfile" accept=".json,application/json" style="margin-top:6px"></div>'
+'<div class="mfoot"><button class="btn" data-a="impMerge">merge — re-mint ids, rewire the graph</button><button class="btn dan" data-a="impReplace">replace wholesale…</button></div></div>'
+'<div class="card"><div class="ctitle">'+icon('trash',14)+'prune — counts computed before the click</div>'
+'<div class="listit"><span class="tick"></span><div style="flex:1">'+U.plural(agOld,'consumed agenda item')+' older than 30d</div><button class="btn sm" data-a="pruneAgenda" '+(agOld?'':'disabled')+'>prune</button></div>'
+'<div class="listit"><span class="tick"></span><div style="flex:1">'+U.plural(tkOld,'done task')+' older than 60d (case wires keep labels; audit orphan-wires can clean refs)</div><button class="btn sm" data-a="pruneTasks" '+(tkOld?'':'disabled')+'>prune</button></div>'
+'<div class="listit"><span class="tick"></span><div style="flex:1">'+U.plural(lgOver,'log entry')+' beyond the 400 cap</div><button class="btn sm" data-a="pruneLog" '+(lgOver?'':'disabled')+'>prune</button></div>'
+'<div class="hr"></div><div class="row">'
+(ST.examples?'<button class="btn dan" data-a="eraseExample">erase example org…</button>':'<button class="btn" data-a="loadExample">load example org</button>')+'</div></div></div>'
+'<div class="card tight"><div class="ctitle">'+icon('target',14)+'QA harness — executes the engine, audits, storage parser and import against live code; nothing here is ceremonial</div>'
+'<div class="row"><button class="btn" data-a="qaRun">run the QA suite</button><span class="tiny dim">append ?qa=1 to the URL to run it on every boot</span></div>'
+'<div id="qaOut" style="margin-top:8px">'+(window._qa?window._qa.map(q=>'<div class="tiny '+(q.ok?'qa-pass':'qa-fail')+'">'+(q.ok?'PASS':'FAIL')+' · '+U.esc(q.name)+(q.detail?' — '+U.esc(q.detail):'')+'</div>').join(''):'<div class="tiny dim">Not run this session.</div>')+'</div></div>'
+'<div class="card tight"><div class="ctitle">'+icon('hist',14)+'system log ('+ST.log.length+')</div><div class="mono tiny dim" style="max-height:180px;overflow-y:auto">'
+(ST.log.length?ST.log.slice().reverse().slice(0,80).map(l=>U.fmt((l.at||'').slice(0,10))+' '+((l.at||'').slice(11,16))+' — '+U.esc(l.t)).join('<br>'):'empty')+'</div></div>';};
ACTIONS['meSave']=(d,t)=>{const v=formVals(t.closest('[data-form]'));
commit(st=>{st.me.name=(v.mname||'').trim();st.me.title=(v.mtitle||'').trim();st.me.org=(v.morg||'').trim();st.me.startDate=v.mstart||st.me.startDate;},'Identity saved — the 90-day clock reads start date directly.');};
ACTIONS['doExport']=()=>{const name='leados-v6-export-'+U.today()+'.json';
U.download(name,JSON.stringify(ST,null,2));
commit(st=>{st.exports.lastAt=U.today();},'Exported — '+name+'. This file is your only copy outside this browser; treat it that way.');};
function impRead(t,cb){const v=formVals(t.closest('[data-form]'));
const file=t.closest('[data-form]').querySelector('[name="impfile"]');
if(file&&file.files&&file.files[0]){const r=new FileReader();r.onload=()=>cb(r.result);r.onerror=()=>toast('File unreadable.','bad');r.readAsText(file.files[0]);return;}
cb((v.imp||'').trim());}
function impValidate(raw){if(!raw){toast('Nothing to import — paste an export or choose a file.','bad');return null;}
let rec;try{rec=JSON.parse(raw);}catch(e){toast('Import refused: not JSON. State untouched.','bad');return null;}
const err=IMPORT.validate(rec);if(err){toast('Import refused: '+err,'bad');return null;}
return rec;}
ACTIONS['impMerge']=(d,t)=>{impRead(t,raw=>{const rec=impValidate(raw);if(!rec)return;
Modal.open('<h2>'+icon('up',17)+'Merge import</h2><div class="msub">'+U.plural((rec.people||[]).length,'person')+', '+U.plural((rec.cases||[]).length,'case')+', '+U.plural((rec.sessions||[]).length,'session')+'. IDs are re-minted and every cross-reference (scopes, wires, links, source strings) is rewired — verified by QA test 9. A post-import audit runs immediately.</div>'
+'<div class="mfoot"><button class="btn gh" data-a="modalClose">cancel</button><button class="btn pri" data-a="impMergeDo">merge it</button></div>');
window._impData=rec;});};
ACTIONS['impMergeDo']=()=>{const inc=window._impData;window._impData=null;if(!inc)return;
let n=0;
commit(st=>{n=IMPORT.merge(JSON.parse(JSON.stringify(inc)));store.logEvent('Import merged '+n+' records (ids re-minted, graph rewired)');},'Merged '+n+' records. Post-import audit: '+INTEGRITY.runCached().filter(a=>a.faults.length).length+' class(es) flagging.');Modal.close();U.href('#/data');};
ACTIONS['impReplace']=(d,t)=>{impRead(t,raw=>{const rec=impValidate(raw);if(!rec)return;
Modal.open('<h2>'+icon('warn',17)+'Replace wholesale?</h2><div class="msub">Current state is DISCARDED and replaced by the import. Export first if you are not certain — this app keeps no undo.</div>'
+'<div class="mfoot"><button class="btn gh" data-a="modalClose">cancel</button><button class="btn dan" data-a="impReplaceDo">replace everything</button></div>');
window._impData=rec;});};
ACTIONS['impReplaceDo']=()=>{const inc=window._impData;window._impData=null;if(!inc)return;
commit(st=>{Object.keys(st).forEach(k=>delete st[k]);Object.assign(st,JSON.parse(JSON.stringify(inc)));store.guard(st);
store.logEvent('Import replaced wholesale');},'Replaced. Post-import audit: '+INTEGRITY.runCached().filter(a=>a.faults.length).length+' class(es) flagging.');Modal.close();U.href('#/data');};
ACTIONS['pruneAgenda']=()=>{let n=0;commit(st=>{const keep=st.agenda.filter(a=>!(a.consumed&&U.age((a.at||'').slice(0,10))>30));n=st.agenda.length-keep.length;st.agenda=keep;},'Pruned '+n+' consumed agenda item(s).');};
ACTIONS['pruneTasks']=()=>{let n=0;commit(st=>{const keep=st.tasks.filter(t=>!(t.done&&U.age((t.doneAt||U.today()).slice(0,10))>60));n=st.tasks.length-keep.length;st.tasks=keep;},'Pruned '+n+' done task(s). Case ledgers keep their labels; orphaned refs are audit-repairable.');};
ACTIONS['pruneLog']=()=>{let n=0;commit(st=>{n=Math.max(0,st.log.length-400);st.log=st.log.slice(-400);},'Log trimmed by '+n+'.');};
ACTIONS['auditRun']=()=>{INTEGRITY.invalidate();commit(()=>{},'Audits re-run: '+INTEGRITY.runCached().filter(a=>a.faults.length).length+' class(es) flagging.');};
ACTIONS['auditRepair']=d=>{const a=AUDITS.find(x=>x.id===d.id);if(!a||!a.repair)return;
let msg='';
const ok=commit(st=>{msg=a.repair(st);store.logEvent('AUDIT REPAIR '+a.id+': '+msg);},null,{quiet:true,silent:true});
if(ok)toast('['+a.id+'] '+msg+' Logged. Fault classes now: '+INTEGRITY.runCached().filter(x=>x.faults.length).length,'ok');};
ACTIONS['eraseExample']=()=>{Modal.open('<h2>'+icon('warn',17)+'Erase the example org?</h2><div class="msub">Wipes people, cases, sessions — everything. Your identity fields reset too. Export first if a single byte matters.</div><div class="mfoot"><button class="btn gh" data-a="modalClose">keep it</button><button class="btn dan" data-a="eraseExampleDo">erase everything</button></div>');};
ACTIONS['eraseExampleDo']=()=>{commit(st=>{const b=store.blank();Object.keys(st).forEach(k=>delete st[k]);Object.assign(st,b);st.examples=false;
store.logEvent('Example org erased — clean slate');},'Erased. Clean slate — every instrument honest and empty.');Modal.close();U.href('#/today');};
ACTIONS['loadExample']=()=>{const hasData=ST.people.length||ST.cases.length;
const go=()=>{commit(st=>{const b=store.blank();Object.keys(st).forEach(k=>delete st[k]);Object.assign(st,b);seed.call(null);},'Example org loaded — tense on purpose: advisories, not broken records.');Modal.close();U.href('#/today');};
if(hasData){Modal.open('<h2>'+icon('warn',17)+'Load example over existing data?</h2><div class="msub">This REPLACES everything current with the example org.</div><div class="mfoot"><button class="btn gh" data-a="modalClose">cancel</button><button class="btn dan" data-a="loadExampleForce">replace</button></div>');}
else go();};
ACTIONS['loadExampleForce']=()=>{commit(st=>{const b=store.blank();Object.keys(st).forEach(k=>delete st[k]);Object.assign(st,b);seed();},'Example org loaded.');Modal.close();U.href('#/today');};
ACTIONS['modalClose']=()=>Modal.close();
/* ================= QA HARNESS — executes real code paths; report is honest about coverage ================= */
window.LEADOS_QA=function(){const out=[];const T=(name,fn)=>{try{const d=fn();out.push({name,ok:d!==false&&!(d&&d.err),detail:(d&&d.detail)||''});}
catch(e){out.push({name,ok:false,detail:'threw: '+e.message});}};
const clone=o=>JSON.parse(JSON.stringify(o));
T('blank state: advisories + pace + nbm do not throw',()=>{const s=store.guard(store.blank());
ADV.compute(s);FW.pace(s);FW.nbm(s,[]);FW.ritualAgenda(s);return{detail:ADV.list.length+' advisories on blank'};});
T('happy path: case commit propagates wires, tasks, agenda, cascade, evidence',()=>{const s=store.guard(store.blank());
s.people.push({id:'p1',name:'Ana Silva',role:'Lead',isLead:true,managerId:null,hired:U.today(),cadenceDays:7,evidence:[],trust:{c:3,r:3,i:3,so:2}});
s.people.push({id:'p2',name:'Bob Ray',role:'IC',isLead:false,managerId:'p1',hired:U.today(),cadenceDays:14,evidence:[],trust:{c:3,r:3,i:3,so:2}});
const r=ENG.commitCase(s,{title:'Bob missed three releases',detail:'R1 R2 R3 slipped',type:'performance',sev:3,scope:{kind:'person',id:'p2'}});
const kinds=(r.case.wires||[]).map(w=>w.kind).sort().join(',');
return r.case&&r.case.wires.length>=5&&s.tasks.filter(t=>t.caseId===r.case.id&&!t.done).length>=2&&s.agenda.length===2&&s.people[1].evidence.length===1?{detail:'wires: '+kinds}:{err:true,detail:'wires: '+kinds};});
T('duplicate refusal: second identical open case is refused, routed',()=>{const s=store.guard(store.blank());
s.people.push({id:'p2',name:'Bob Ray',role:'IC',isLead:false,managerId:null,hired:U.today(),cadenceDays:14,evidence:[]});
const a=ENG.commitCase(s,{title:'same thing',detail:'x',type:'conflict',sev:2,scope:{kind:'person',id:'p2'}});
const b=ENG.commitCase(s,{title:'SAME thing!',detail:'y',type:'conflict',sev:2,scope:{kind:'person',id:'p2'}});
return b.dup&&b.dup.id===a.case.id&&s.cases.length===1?true:{err:true,detail:'cases: '+s.cases.length};});
T('ethics: keyword reclassifies, seal holds, audit catches violation, repair revokes',()=>{const s=store.guard(store.blank());
s.people.push({id:'p2',name:'Bob Ray',role:'IC',isLead:false,managerId:null,hired:U.today(),cadenceDays:14,evidence:[]});
const cls=ENG.classify('he made a harassment joke');
const r=ENG.commitCase(s,{title:'harassment joke in channel',detail:'verbatim',type:'escalation',sev:4,scope:{kind:'person',id:'p2'},trip:cls.trip});
if(!cls.trip.length)return{err:true,detail:'classifier missed trip-word'};
if(r.case.wires.length!==2)return{err:true,detail:'seal wrote '+r.case.wires.length+' wires, expected 2'};
const hrTask=s.tasks.filter(t=>t.origin==='hr'&&t.due===U.today());
if(hrTask.length!==1)return{err:true,detail:'HR task missing or not dated today'};
r.case.wires.push({id:'w-x',kind:'agenda',label:'INJECTED',route:'#/x',ref:null,at:U.now()});
const faults=AUDITS[1].run(s);
if(!faults.length)return{err:true,detail:'audit missed injected wire'};
AUDITS[1].repair(s);
return r.case.wires.length===2&&AUDITS[1].run(s).length===0?true:{err:true,detail:'repair incomplete'};});
T('malformed: empty title throws; no partial writes',()=>{const s=store.guard(store.blank());
let threw=false;try{ENG.commitCase(s,{title:'  ',detail:'x',type:'other',sev:3,scope:null});}catch(e){threw=true;}
return threw&&s.cases.length===0&&s.tasks.length===0?true:{err:true,detail:'threw='+threw+' cases='+s.cases.length};});
T('corrupted storage: garbage → corrupt (backup key returned by load path), newer version → too-new, older version → additive migrate',()=>{
const a=store.parseRecord('not json{{{');
const b=store.parseRecord(JSON.stringify({v:99,people:[]}));
const c=store.parseRecord(JSON.stringify({v:3,people:[{id:'x',name:'Old',evidence:[]}],cases:[]}));
if(!(a.err==='corrupt'))return{err:true,detail:'garbage parsed?!'};
if(!(b.err==='too-new'))return{err:true,detail:'v99 accepted'};
if(!c.ok)return{err:true,detail:'v3 refused'};
const mig=store.guard(clone(c.ok));
return mig.v===6&&Array.isArray(mig.boss.asks)&&Array.isArray(mig.rituals)?{detail:'v3→v6 additive'}:{err:true,detail:'migration shape wrong'};});
T('boundary: moodSlope empty → null; all-estimated → null; estimates injected do not move slope',()=>{
const z=FW.moodSlope([]);const y=FW.moodSlope([{at:'2025-01-01',v:5,est:true},{at:'2025-01-08',v:1,est:true}]);
const base=[{at:'2025-01-01',v:3,est:false},{at:'2025-01-15',v:5,est:false}];
const withEst=base.concat([{at:'2025-01-08',v:5,est:true}]);
return z===null&&y===null&&FW.moodSlope(base)===FW.moodSlope(withEst)?true:{err:true};});
T('machine arm idempotent: sweep fires once per lapsed correction',()=>{const s=store.guard(store.blank());
s.people.push({id:'p2',name:'Bob Ray',role:'IC',isLead:false,managerId:null,hired:U.today(),cadenceDays:14,evidence:[]});
s.feedback.push({id:'f1',personId:'p2',kind:'correction',model:'SBI',parts:{s:'x'.repeat(30),b:'y'.repeat(30),i:'z'.repeat(30)},status:'delivered',deliveredAt:U.addD(U.today(),-40),verifyAt:U.addD(U.today(),-34)});
const n1=ENG.sweep(s),n2=ENG.sweep(s);
return n1===1&&n2===0&&s.cases.length===1&&s.feedback[0].lapsedCaseId===s.cases[0].id?true:{err:true,detail:n1+'/'+n2};});
T('import merge: ids re-minted, graph rewired (scope, links, wire refs, source strings)',()=>{
const keep=ST;let ok=true,detail='';
try{ST=store.guard(store.blank());
ST.people.push({id:'p1',name:'Ana Silva',role:'L',isLead:false,managerId:null,hired:U.today(),cadenceDays:14,evidence:[]});
const inc=clone({v:6,people:[{id:'q1',name:'Zed',role:'IC',isLead:false,managerId:null,hired:U.today(),cadenceDays:14,evidence:[]}],cases:[{id:'qc1',type:'conflict',title:'x',detail:'d',scope:{kind:'person',id:'q1'},sev:2,status:'open',opened:U.today(),slaDue:U.today(),links:[],wires:[{id:'qw',kind:'playbook',label:'l',route:'#/today',ref:'qt1',at:U.now()}]}],tasks:[{id:'qt1',title:'t',due:U.today(),caseId:'qc1',origin:'playbook',done:false,route:'#'}],agenda:[{id:'qa1',personId:'q1',text:'a',source:'case:qc1',at:U.now(),consumed:false}]});
IMPORT.merge(inc);
const mp=ST.people.find(p=>p.name==='Zed'),mc=ST.cases[0],mt=ST.tasks[0],mag=ST.agenda[0];
ok=mp&&mc.scope.id===mp.id&&mt.caseId===mc.id&&mc.wires[0].ref===mt.id&&mag.personId===mp.id&&mag.source==='case:'+mc.id;
detail=ok?'rewired':'scope='+mc.scope.id+' vs '+mp.id;}
finally{ST=keep;}
return ok?true:{err:true,detail};});
T('XSS: esc() neutralizes tag + quote injection',()=>{const r=U.esc("<img src=x onerror=alert(1)> ' title=\"");
return r.indexOf('<img')<0&&r.indexOf('"')<0&&r.indexOf("'")<0?true:{err:true,detail:r};});
T('quota: failed write surfaces WRITE FAILED + recovers',()=>{
let patched=false;const orig=localStorage.setItem.bind(localStorage);
try{Object.defineProperty(localStorage,'setItem',{value(){throw new DOMException('full','QuotaExceededError')},configurable:true});patched=true;}
catch(e){try{localStorage.setItem=()=>{throw new DOMException('full','QuotaExceededError')};patched=true;}catch(e2){}}
if(!patched)return{detail:'could not patch setItem in this browser — verify manually on #/data',ok:true};
const saved=store.save();
const okFailed=saved===false&&!!store.lastError;
Object.defineProperty(localStorage,'setItem',{value:orig,configurable:true});
const recovered=store.save()===true&&!store.lastError;
return okFailed&&recovered?true:{err:true,detail:'failed='+okFailed+' recovered='+recovered};});
T('rule registry: every firing advisory resolves to a registered rule',()=>{
const firing=ADV.compute(ST);
const bad=firing.filter(a=>!RLS.find(x=>x.id===a.id));
return bad.length?{err:true,detail:'unregistered: '+bad.map(x=>x.id).join(',')}:{detail:firing.length+' firing on live state'};});
return out;};
ACTIONS['qaRun']=()=>{const res=window.LEADOS_QA();window._qa=res;
const fails=res.filter(r=>!r.ok);
const el=document.getElementById('qaOut');
if(el)el.innerHTML=res.map(q=>'<div class="tiny '+(q.ok?'qa-pass':'qa-fail')+'">'+(q.ok?'PASS':'FAIL')+' · '+U.esc(q.name)+(q.detail?' — '+U.esc(q.detail):'')+'</div>').join('');
toast(fails.length?fails.length+' QA FAILURE(S) — read them, they are real':'QA: '+(res.length-fails.length)+'/'+res.length+' pass',fails.length?'bad':'ok');};
/*@P10@*/
</script>
