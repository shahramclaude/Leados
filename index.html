<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeadOS pt-4 — Universal Leadership OS</title>
<meta name="description" content="LeadOS: a universal leadership and management operating system. 15 domains, event-sourced, append-only, single localStorage key, zero network.">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="top">
  <div class="wrap top-in">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 2 9 4.9-9 4.9-9-4.9Z"/><path d="m3 11.9 9 4.9 9-4.9"/><path d="m3 16.9 9 4.9 9-4.9"/></svg>
      <div>
        <strong>LeadOS</strong>
        <span>Universal Leadership OS</span>
      </div>
    </div>
    <div id="sysline" class="sysline" aria-live="polite"></div>
  </div>
</header>

<nav class="wrap" aria-label="Primary">
  <div id="nav" class="nav"></div>
</nav>

<main id="view" class="wrap view" aria-live="polite"></main>

<div id="wall" class="wall" hidden role="alertdialog" aria-label="Authority wall"></div>

<footer class="wrap foot">
  <span><b>LeadOS pt-4</b> · lineage pt · schema v4</span>
  <span>append-only event store · nothing derived persisted</span>
  <span>one localStorage key: leados:data</span>
  <span>no framework · no build · no network</span>
</footer>

<noscript>
  <div style="max-width:640px;margin:60px auto;padding:24px;font-family:sans-serif;color:#e8ecf3">
    LeadOS is a local, event-sourced application and requires JavaScript. Nothing leaves this browser.
  </div>
</noscript>

<!-- Load order is the doctrine: contract -> wall -> derivation -> content -> authority -> render -->
<script src="js/events.js"></script>
<script src="js/store.js"></script>
<script src="js/engine.js"></script>
<script src="js/playbooks.js"></script>
<script src="js/health.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
