rampMilestones(p){if(!p.start)return null;const tenure=age(p.start);if(tenure>120)return null;
 const L={associate:['Week 1–2: environment, access, one shipped triviality, buddy assigned','Day 30: independently shipping small work; questions per day dropping','Day 60: owns a small feature end-to-end with review','Day 90: full load; knows where the bodies are buried'],mid:['Week 1: context map + shipped fix','Day 30: productive in the codebase; rituals understood','Day 60: owns a workstream with light review','Day 90: full scope; first visible win'],senior:['Week 1: system walkthrough + relationships with leads','Day 30: first design contribution; ownership of an area named','Day 60: drives one cross-cutting improvement','Day 90: trusted with the ugly problems; outside hires ask for them'],lead:['Week 1–2: listen-only 1:1s with every member; read everything','Day 30: map of people, promises, debt; cadence restored; nothing restructured yet','Day 60: first structural move with rationale stated; 9-box drafted','Day 90: team knows the standards and has seen them applied once']}[p.level||'mid'];
 const days=[30,60,90];const miles=[{label:'Day 30',d:30,ask:L[1]},{label:'Day 60',d:60,ask:L[2]},{label:'Day 90',d:90,ask:L[3]}].map(m=>{const date=addDays(p.start,m.d);return{label:m.label,date,ask:m.ask,hit:tenure>=m.d,soon:! (tenure>=m.d)&&db(todayStr(),date)<=7};});
 return{tenure,week1:{ask:L[0],hit:tenure>=14},miles};},
/* ── hiring cascade ── */
acceptCascade(candId){const cd=get('candidates',candId);if(!cd||cd.status!=='open')return;
 const pid=uid('p');const p={id:pid,name:cd.name,role:cd.role,teamId:cd.teamId||null,level:cd.level||'mid',start:todayStr(),salary:cd.salary||({lead:160000,senior:140000,mid:105000,associate:82000}[cd.level||'mid']),criticalFor:[],motivation:'',notes:'Source: '+(cd.source||'?')+' · hired '+fmt(todayStr())+(cd.scorecard?' · loop composite '+FW.hireComposite(cd.scorecard).avg+'/5':''),signals:{comp:0,stalled:0,burnout:0,conflict:0,disengaged:0,tenure:0,churn:0,market:0},trust:null,sl2:{competence:({lead:7,senior:7,mid:5,associate:3}[cd.level]||5),commitment:8},nineBox:null,archived:false,leave:false,frHistory:[],devPlan:null,moods:[],managerId:null};
 mut(()=>{S.people[pid]=p;cd.status='hired';cd.closedAt=todayStr();
 Engine.scheduleOneOnOne(pid,addDays(todayStr(),2));
 Engine.mkTask({title:'Onboarding: '+cd.name.split(' ')[0]+' — buddy assigned with charter + environment ready',due:addDays(todayStr(),1),personId:pid,auto:'cascade'});
 Engine.mkTask({title:'Onboarding: share the 30/60/90 plan with '+cd.name.split(' ')[0]+' and say the expectations out loud',due:addDays(todayStr(),3),personId:pid,auto:'cascade'});
 S.journal[uid('j')]={id:uid('j'),date:todayStr(),kind:'event',text:'Hired '+cd.name+' ('+cd.role+', '+(LEVELS[cd.level]||'')+') — ramp live, first 1:1 '+fmt(addDays(todayStr(),2))+'.',caseId:null};});
 toast(cd.name+' hired — person minted, 30/60/90 ramp live, first 1:1 booked.','ok');go('/person/'+pid);},
hireComposite(sc){const dims=sc.dims||{};const vals=Object.values(dims);const avg=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0;
 return{avg:+avg.toFixed(1),verdict:avg>=4?'STRONG HIRE':avg>=3.4?'HIRE':avg>=2.6?'LEAN NO':'NO HIRE',cls:avg>=4?'ok':avg>=3.4?'acc':avg>=2.6?'warn':'risk'};},
/* ── digests & briefs ── */
catchUp(from){const r={from,casesOpened:list('cases').filter(c=>c.opened>=from),casesClosed:list('cases').filter(c=>c.closedAt&&c.closedAt>=from),
 sessions:list('oneonones').filter(o=>o.status==='done'&&o.date>=from),feedback:list('feedback').filter(f=>f.status==='delivered'&&f.deliveredAt>=from),
 hires:activePeople().filter(p=>p.start&&p.start>=from),tasksDone:list('tasks').filter(t=>t.done&&t.doneAt>=from),
 decisionsReviewed:list('decisions').filter(d=>d.status==='reviewed'&&d.reviewedAt&&d.reviewedAt>=from)};
 const movers=activePeople().map(p=>{const h=(p.frHistory||[]).filter(x=>x.d>=from);if(h.length<1)return null;const first=h[0].v,last=h[h.length-1].v;return Math.abs(last-first)>=10?{p,from:first,to:last}:null;}).filter(Boolean);
 r.movers=movers;r.pressureNow=openCases().reduce((a,c)=>a+c.severity,0);return r;},
weeklyDigest(){return Engine.catchUp(addDays(todayStr(),-7));},
upwardBrief(){const wk=Engine.weeklyDigest();const lines=[];const goals=list('goals').filter(g=>!g.status||g.status==='open');
 lines.push('WEEK OF '+fmtF(todayStr()).toUpperCase()+' — LEADERSHIP BRIEF','');
 lines.push('OUTCOMES');if(goals.length)goals.forEach(g=>{const h=FW.okrHealth(g);lines.push('· '+g.objective+' — '+Math.round(clamp(h.prog,0,1)*100)+'% progress, confidence '+h.conf+'/10'+(h.trend?(h.trend>0?' (rising)':' (falling)'):''));});else lines.push('· No goals on record.');
 lines.push('','PEOPLE');lines.push('· '+wk.sessions.length+' 1:1s held · '+wk.feedback.length+' feedback delivered · '+wk.hires.length+' hire(s) landed'+(wk.hires.length?': '+wk.hires.map(p=>p.name).join(', '):''));
 const deps=list('cases').filter(c=>c.type==='departure'&&c.opened>=addDays(todayStr(),-30));if(deps.length)lines.push('· Departures in flight: '+deps.map(c=>(get('people',c.personId)||{}).name||c.title).join(', '));
 lines.push('','RISKS (by severity)');const top=openCases().filter(c=>!c.escalated).sort((a,b)=>b.severity-a.severity).slice(0,3);
 if(top.length)top.forEach(c=>lines.push('· Severity '+c.severity+' — '+c.title+' ['+CASE_TYPES[c.type].l+', opened '+fmt(c.opened)+', on playbook]'));
 else lines.push('· No open cases above the line.');
 const escs=openCases().filter(c=>c.escalated);if(escs.length)lines.push('· '+escs.length+' matter(s) in HR-grade process — details held in the appropriate channel, by design.');
 lines.push('','ASKS / DECISIONS QUEUED');const gates=list('decisions').filter(d=>d.status!=='reviewed'&&d.reviewDate&&d.reviewDate<=addDays(todayStr(),7));
 if(gates.length)gates.forEach(d=>lines.push('· '+d.title+' — review gate '+fmt(d.reviewDate)));else lines.push('· None this week.');
 lines.push('','— Generated by LeadCore. Named individuals appear only where the fact is already public (hires, departures); risk items are described, not adjudicated, by construction.');
 return lines.join('\n');},
/* ── HR packet — grievance-readable by construction ── */
hrPacket(p){const fr=FW.flightRisk(p);const ev=list('evidence').filter(e=>e.personId===p.id).sort((a,b)=>a.date<b.date?-1:1);
 const fb=list('feedback').filter(f=>f.personId===p.id);const cs=list('cases').filter(c=>c.personId===p.id);
 const oos=list('oneonones').filter(o=>o.personId===p.id&&o.status==='done').sort((a,b)=>a.date<b.date?-1:1);
 const dxs=list('diagnoses').filter(d=>d.personId===p.id);const pls=list('plans').filter(x=>x.personId===p.id);
 let h='<div class="pcard"><h2 style="margin:0 0 6px;font-size:16px">'+esc(p.name)+' — personnel record summary</h2><p style="margin:0;color:#444">'+esc(p.role||'')+' · '+(LEVELS[p.level]||'')+' · team '+esc((teamOf(p)||{}).name||'—')+' · started '+fmtF(p.start)+' · salary on record '+money(p.salary)+'</p></div>';
 h+='<div class="pcard"><h3 style="font-size:13px;margin:0 0 6px">Current instruments</h3><p style="margin:0">Flight-risk composite '+fr.score+'/100 ('+fr.band.label+') · trust '+(p.trust?(FW.trust(p.trust).score+'/10'):'unassessed')+' · SL2 '+FW.sl2(p).level+' · nine-box '+(p.nineBox?FW.nineBox(p.nineBox.perf,p.nineBox.potential).label+' ('+fmt(p.nineBox.at)+')':'unstamped')+'</p></div>';
 h+='<div class="pcard"><h3 style="font-size:13px;margin:0 0 6px">Evidence log ('+ev.length+')</h3>'+(ev.length?ev.map(e=>'<p style="margin:0 0 4px"><b>'+fmt(e.date)+'</b> ['+esc(e.kind)+(e.verbatim?' · verbatim':'')+'] '+esc(e.text)+'</p>').join(''):'<p>None on record.</p>')+'</div>';
 h+='<div class="pcard"><h3 style="font-size:13px;margin:0 0 6px">Feedback delivered ('+fb.filter(f=>f.status==='delivered').length+')</h3>'+(fb.filter(f=>f.status==='delivered').map(f=>'<p style="margin:0 0 4px"><b>'+fmt(f.deliveredAt)+'</b> ['+f.kind+'] S: '+esc(f.s)+' · B: '+esc(f.b)+' · I: '+esc(f.i)+'</p>').join('')||'<p>None delivered.</p>')+'</div>';
 h+='<div class="pcard"><h3 style="font-size:13px;margin:0 0 6px">Cases ('+cs.length+')</h3>'+(cs.map(c=>'<p style="margin:0 0 4px"><b>'+fmt(c.opened)+'</b> '+esc(CASE_TYPES[c.type].l)+' — '+esc(c.title)+' — '+(c.status==='closed'?'closed '+fmt(c.closedAt)+': '+esc(c.outcome||''):'OPEN')+'</p>').join('')||'<p>None.</p>')+'</div>';
 h+='<div class="pcard"><h3 style="font-size:13px;margin:0 0 6px">Diagnoses & improvement plans</h3>'+(dxs.map(d=>'<p style="margin:0 0 4px"><b>'+fmt(d.created)+'</b> 4-cause: '+Object.keys(d.causes).filter(k=>d.causes[k]).join(', ')+' ('+d.status+')</p>').join('')||'')+(pls.map(pl=>'<p style="margin:0 0 4px"><b>'+fmt(pl.created)+'</b> Plan: '+esc(pl.focus)+' — '+(pl.checkpoints||[]).length+' checkpoints, verdict: '+(pl.verdict||'in flight')+'</p>').join('')||'')+((!dxs.length&&!pls.length)?'<p>None.</p>':'')+'</div>';
 h+='<div class="pcard"><h3 style="font-size:13px;margin:0 0 6px">1:1 cadence ('+oos.length+' held)</h3>'+(oos.slice(-8).map(o=>'<p style="margin:0 0 4px"><b>'+fmt(o.date)+'</b> mood '+(o.mood||'—')+'/5 · '+(o.commitments||[]).length+' commitments</p>').join('')||'<p>None held.</p>')+'</div>';
 return h;}
};

let ADV_LAST={};
function mentorScan(){const out=[];S.telemetry.ruleRuns++;
 RULES.forEach(r=>{if(r.w<=0)return;try{const hits=r.test()||[];hits.forEach(h=>{const key=h.key;
  out.push({rid:r.id,key,w:r.w,hard:!!r.hard,ic:r.ic,rule:r.t,label:h.label,detail:h.detail,route:h.route,acts:h.acts||[['go','Open']]});});}catch(e){console.warn('rule '+r.id+' faulted',e);}});
 out.sort((a,b)=>b.w-a.w);ADV_LAST={};out.forEach(a=>{ADV_LAST[a.key]=a;});
 const active=out.filter(a=>a.hard||!(S.snoozes[a.key]&&S.snoozes[a.key]>todayStr()));
 const deferred=out.filter(a=>!a.hard&&S.snoozes[a.key]&&S.snoozes[a.key]>todayStr());
 return{all:out,active,deferred};}
const Mentor={
pressure(scan){scan=scan||mentorScan();return scan.active.reduce((a,x)=>a+x.w,0);},
snapshot(scan){const td=todayStr();if(S.settings.lastTrendDay===td)return;scan=scan||mentorScan();
 mut(()=>{S.settings.lastTrendDay=td;S.trends[td]={adv:scan.active.length,pressure:Mentor.pressure(scan),open:openCases().length,overdue:openTasks().filter(t=>od(t.due)>0).length};
 const keys=Object.keys(S.trends).filter(k=>k.indexOf('h:')!==0).sort();while(keys.length>60){delete S.trends[keys.shift()];}
 list('teams').forEach(t=>{S.trends['h:'+t.id+':'+weekKey()]=FW.teamHealth(t).score;});});},
dailyBrief(scan){scan=scan||mentorScan();Mentor.snapshot(scan);const td=todayStr();const dt=new Date();const hr=dt.getHours();
 const greet=hr<12?'morning':hr<17?'afternoon':'evening';
 const todays11=list('oneonones').filter(o=>o.status==='scheduled'&&o.date===td&&get('people',o.personId)&&!get('people',o.personId).archived);
 const dueToday=openTasks().filter(t=>t.due===td&&t.auto!=='verify');
 const overdue=openTasks().filter(t=>od(t.due)>0);
 const broken=[],chase=[];list('oneonones').forEach(o=>{if(o.status!=='done')return;(o.commitments||[]).forEach(cm=>{if(cm.done||!cm.due||od(cm.due)<=0)return;const p=get('people',o.personId);const row={cm,p,oo:o};(cm.owedBy==='me'?broken:chase).push(row);});});
 const strip=[];for(let i=0;i<7;i++){const d=addDays(td,i);strip.push({d,today:i===0,ones:list('oneonones').filter(o=>o.date===d&&o.status==='scheduled').length,skips:list('skips').filter(s=>s.date===d&&s.status==='scheduled').length,tasks:openTasks().filter(t=>t.due===d).length});}
 let welcome=null;if(window.LAST_SEEN_PREV&&age(LAST_SEEN_PREV)>=4)welcome=Engine.catchUp(LAST_SEEN_PREV);
 const dow=dt.getDay();const friday=dow===5;
 return{greet,scan,todays11,dueToday,overdue,broken,chase,strip,welcome,friday,rep:REPS[(dow+6)%7],load:FW.leaderLoad()};}
};

function parseRoute(){const h=(location.hash||'#/today').replace(/^#/,'');const seg=h.split('/').filter(Boolean);return{path:'/'+(seg[0]||'today'),arg:seg.slice(1).join('/')||null};}

function render(){const app=document.getElementById('app-root');
 if(!document.getElementById('side')){app.innerHTML='<div class="app"><aside class="side" id="side"></aside><div class="main"><div class="topbar" id="topbar"></div><div class="view" id="view"></div></div></div><div id="modal-root"></div>';}
 const r=parseRoute();const scan=mentorScan();window.__SCAN=scan;
 const overdueN=openTasks().filter(t=>od(t.due)>0).length;const q=quotaInfo();
 document.getElementById('side').innerHTML='<div class="brand" onclick="go(\'/today\')"><div class="brand-mark">L</div><div><div class="brand-name">LeadCore</div><div class="brand-sub">leadership os · offline</div></div></div>'
 +NAV.map(n=>{if(n[0]==='g')return'<div class="navgroup">'+n[1]+'</div>';const on=(r.path===n[0]);let badge='';if(n[3]==='adv'&&scan.active.length)badge='<span class="nbadge">'+scan.active.length+'</span>';if(n[3]==='cases'&&openCases().length)badge='<span class="nbadge amber">'+openCases().length+'</span>';
 return'<div class="navlink'+(on?' on':'')+'" onclick="go(\''+n[0]+'\')">'+ic(n[2])+n[1]+badge+'</div>';}).join('')
 +'<div class="side-foot"><div>storage '+(q.bytes/1024).toFixed(0)+'KB / ~5MB</div><div class="quota'+(q.pct>70?' hot':'')+'"><i style="width:'+q.pct+'%"></i></div><div style="margin-top:6px">'+S.telemetry.writes+' writes · '+S.telemetry.ruleRuns+' rule runs</div></div>';
 const tmeta=r.arg?null:(ROUTE_TITLES[r.path]||[r.path.slice(1)]);
 let crumb=ROUTE_TITLES[r.path]?ROUTE_TITLES[r.path][0]:r.path;
 if(r.path==='/case'&&r.arg){const c=get('cases',r.arg);crumb=c?c.title:'case';}
 if(r.path==='/person'&&r.arg){const p=get('people',r.arg);crumb=p?p.name:'person';}

 document.getElementById('topbar').innerHTML='<button class="btn btn-ghost mob-toggle" data-action="menu">'+ic('menu')+'</button><div class="crumb">'+esc(crumb)+'<small>'+(tmeta?tmeta[1]:'workspace')+'</small></div><div class="sp"></div>'

 +'<button class="btn" data-action="palette">'+ic('search')+'<span class="mini" style="color:var(--faint)">⌘K</span></button>'
 +'<button class="btn btn-acc" data-action="case-open">'+ic('plus')+'Register case</button>';
 const v=document.getElementById('view');const fn=Routes[r.path];
 try{v.innerHTML=fn?fn(r.arg):empty('compass','Unknown route','No view is registered at '+esc(r.path)+'.');}
 catch(e){console.error(e);S.telemetry.viewErrors++;S.telemetry.lastViewError=String(e&&e.message||e);v.innerHTML='<div class="card stop">'+reco('risk','<b>View fault</b> — '+esc(String(e&&e.message||e))+'. The rest of the app is intact; this renderer degraded gracefully and the fault was counted in telemetry.')+'</div>';}
 if(window.innerWidth<1020)document.getElementById('side').classList.remove('open');
 document.querySelectorAll('input[type=range]').forEach(rangeFill);}

 items.push({t:'Action — Export JSON',ic:'download',run:()=>Actions['export'](),tag:'data'});
 items.push({t:'Action — Run weekly review',ic:'review',run:()=>go('/review'),tag:'0'});
 modal(modalHead('Command','people · teams · cases · modules · actions')+'<input class="in" id="pal-in" placeholder="Type to filter…" autocomplete="off"><div id="pal-list" style="margin-top:10px;max-height:46vh;overflow-y:auto"></div>','wide');
 const render2=q=>{const ql=(q||'').toLowerCase();const f=items.filter(i=>!ql||i.t.toLowerCase().includes(ql)||(i.tag||'').toLowerCase().includes(ql)).slice(0,14);
 document.getElementById('pal-list').innerHTML=f.map((i,ix)=>'<div class="pal-item'+(ix===0?' on':'')+'" data-pal="'+items.indexOf(i)+'">'+ic(i.ic)+'<span>'+esc(i.t)+'</span><span class="k mini">'+esc(i.tag||'')+'</span></div>').join('')||'<div class="empty">Nothing matches.</div>';
 document.querySelectorAll('[data-pal]').forEach(el=>el.onclick=()=>{closeModal();items[+el.dataset.pal].run();});};
 setTimeout(()=>{const inp=document.getElementById('pal-in');render2('');inp.focus();inp.oninput=()=>render2(inp.value);inp.onkeydown=e=>{if(e.key==='Enter'){const first=document.querySelector('[data-pal]');if(first){closeModal();items[+first.dataset.pal].run();}}};},60);}
/* ── advisory action dispatch ── */
Actions['adv-do']=(key,el)=>{const a=ADV_LAST[key];if(!a)return;const act=a.acts[+el.dataset.arg||0];if(!act)return;const[doWhat,,p1,p2]=act;
 if(doWhat==='go')return go(a.route||'/today');
 if(doWhat==='case')return openCaseIntake(p1||null,p2||null,null);
 if(doWhat==='book')return mut(()=>{Engine.scheduleOneOnOne(p1,addDays(todayStr(),FW.cadenceFor(get('people',p1)).days));toast('Session booked. Protect the slot like it is a promise — it is.','ok');});
 if(doWhat==='compose-for')return openFeedbackComposer(p1);
 if(doWhat==='ritual')return openTalentRitual();
 if(doWhat==='vok')return mut(()=>{const t=get('tasks',p1);if(t){t.done=true;t.doneAt=todayStr();t.note='closure verified — holds';}toast('Verified. The lesson stands.','ok');});
 if(doWhat==='vreopen')return mut(()=>{const t=get('tasks',p1);if(t){t.done=true;t.doneAt=todayStr();t.note='verification failed — case re-opened';}Engine.reopenCase(t.caseId);});
 if(doWhat==='cpnow')return openCheckpoint(p1);
 if(doWhat==='relevel')return relevelDelegation(p1);
 if(doWhat==='risknow')return openRiskForm(p1);
 if(doWhat==='touch')return touchStakeholder(p1);
 if(doWhat==='judge')return judgeGoal(p1);
 if(doWhat==='exportnow')return Actions['export']();
 if(doWhat==='integrityrun')return openIntegrityAudit(Integrity.audit(true));
 if(doWhat==='goal-new')return openGoalForm(null,p2||p1);
 if(doWhat==='retro')return openRetroForm(p2||p1);
 if(doWhat==='devplan')return openDevPlan(p1);
 go(a.route||'/today');};
Actions['adv-snooze']=(key,el)=>{const d=+el.dataset.arg||3;mut(()=>{S.snoozes[key]=addDays(todayStr(),d);});toast('Deferred '+d+' days. It returns — deferral is a date, not a deletion.','ok');};
Actions['adv-unsnooze']=(key)=>{mut(()=>{delete S.snoozes[key];});};
Actions['task-toggle']=(id)=>{mut(()=>{const t=get('tasks',id);if(!t)return;t.done=!t.done;t.doneAt=t.done?todayStr():null;
 if(t.done)list('retros').forEach(r=>(r.items||[]).forEach(i=>{if(i.taskId===id){i.done=true;i.doneAt=todayStr();}}));});};
Actions['menu']=()=>document.getElementById('side').classList.toggle('open');
Actions['palette']=openPalette;
Actions['close']=closeModal;
/* ── TODAY ── */
Routes['/today']=function(){const b=Mentor.dailyBrief();const top=b.scan.active.slice(0,3);
 let hx=pageHead('Good '+b.greet+'.','Today is '+fmtF(todayStr())+' — '+b.scan.active.length+' advisory'+(b.scan.active.length===1?'':'ies')+' active · load '+b.load.score+'/100'+(b.friday?' · <b style="color:var(--acc2)">Friday — run the <a href="#/review">weekly review</a> before you log off.</b>':''),
 btn('case-open','','Register case','plus','btn-acc'));
 if(b.welcome){const w=b.welcome;hx+='<div class="card hl" style="margin-bottom:14px"><div class="card-title">'+ic('spark')+'Welcome back — '+age(w.from)+' days away, here is what moved<span class="sub">sequenced · no judgment attached</span></div><div class="grid g3">'
 +stat(w.casesOpened.length+' / '+w.casesClosed.length,'cases opened / closed',w.casesOpened.slice(0,2).map(c=>esc(c.title)).join(' · ')||'no new cases')
 +stat(w.sessions.length+' · '+w.feedback.length,'1:1s held · feedback delivered',w.decisionsReviewed.length+' decisions reviewed')
 +stat(w.pressureNow,'case pressure now',(w.movers.length?w.movers.map(m=>esc(m.p.name.split(' ')[0])+' flight '+(m.to>m.from?'▲':'▼')+' '+Math.abs(m.to-m.from):'').join(' · '):'no flight moves >10pts')+(w.hires.length?' · hired: '+w.hires.map(p=>esc(p.name.split(' ')[0])).join(', '):''))
 +'</div><div style="margin-top:10px;font-size:12px;color:var(--dim)">'+w.tasksDone.length+' tasks completed in the window. Everything below is ranked as of this minute — nothing waited for you to notice.</div></div>';}
 hx+='<div class="grid g3">'
 +card('zap','Focus — engine-ranked',top.length?top.map(a=>{const fr=5-Math.min(4,Math.floor(a.w/20));return'<div class="adv" style="padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer" onclick="go(\'/inbox\')"><span class="focus-num" style="font-size:22px">'+('')+'</span><div style="flex:1"><b style="font-size:12.5px">'+esc(a.label)+'</b><div class="mini" style="margin-top:2px">'+esc(a.rule)+' · w'+a.w+(a.hard?' · cannot snooze':'')+'</div></div>'+ic('chev','width:14px;color:var(--faint)')+'</div>';}).join('')+btn('goto-inbox','','Open full inbox ('+b.scan.active.length+')','inbox','btn-ghost'):'<div class="mini" style="padding:8px 0">No active advisories. The silence is earned — see the inbox for what the instruments still want.</div>')
 +card('clock','Due & overdue',(b.overdue.length?'<div class="mini" style="color:var(--risk);margin-bottom:6px">'+b.overdue.length+' overdue</div>':'')+b.overdue.slice(0,4).map(t=>taskRow(t)).join('')+(b.dueToday.length?'<div class="mini" style="margin:8px 0 4px">due today</div>':'')+b.dueToday.slice(0,4).map(t=>taskRow(t)).join('')+((!b.overdue.length&&!b.dueToday.length)?'<div class="mini">Nothing due. Spend the capacity on the Q2 column, not on inventing work.</div>':''))
 +card('refresh','Commitments — yours & theirs',(b.broken.length?'<div class="mini" style="color:var(--risk);margin-bottom:4px">broken by you — own these first, out loud</div>':'')+b.broken.slice(0,3).map(r=>'<div class="adv" style="padding:8px 4px;font-size:12.5px">'+esc(r.cm.text)+' <span class="mini">→ '+esc((r.p||{}).name||'')+' · '+od(r.cm.due)+'d over</span></div>').join('')+(b.chase.length?'<div class="mini" style="color:var(--warn);margin:6px 0 4px">owed to you — chase once, by name</div>':'')+b.chase.slice(0,3).map(r=>'<div class="adv" style="padding:8px 4px;font-size:12.5px">'+esc(r.cm.text)+' <span class="mini">← '+esc((r.p||{}).name||'')+'</span> <button class="btn btn-sm btn-ghost" data-action="chase-inject" data-id="'+(r.p?r.p.id:'')+'" data-arg="'+esc(r.cm.text)+'">agenda</button></div>').join('')+((!b.broken.length&&!b.chase.length)?'<div class="mini">No broken commitments on either side. Reliability is a visible act — people set their watch by you.</div>':''))
 +'</div>';
 hx+='<div class="h-sec" style="margin-top:22px">Week ahead <small>1:1s · skips · tasks due</small></div><div class="wk-strip">'+b.strip.map(d=>'<div class="wk-day'+(d.today?' today':'')+'"><div class="d">'+dparse(d.d).toLocaleDateString('en',{weekday:'short'})+'</div><div class="n">'+dparse(d.d).getDate()+'</div><div class="row"><i style="background:var(--acc)"></i>'+d.ones+' 1:1</div><div class="row"><i style="background:var(--info)"></i>'+d.skips+' skip</div><div class="row"><i style="background:'+(d.tasks?'var(--risk)':'var(--line2)')+'"></i>'+d.tasks+' tasks</div></div>').join('')+'</div>';
 hx+='<div class="h-sec" style="margin-top:22px">Today’s 1:1s <small>prepared, not improvised</small></div>';
 if(b.todays11.length){hx+='<div class="grid g'+(b.todays11.length>2?'3':'2')+'">'+b.todays11.map(o=>{const p=get('people',o.personId);const ag=Engine.autoAgenda(o.personId);
 return'<div class="card"><div style="display:flex;gap:12px;align-items:center;margin-bottom:10px"><div style="width:38px;height:38px;border-radius:50%;background:var(--acc-dim);color:var(--acc2);display:grid;place-items:center;font-family:var(--font-m);font-weight:700">'+initials(p.name)+'</div><div><a href="#/person/'+p.id+'" style="font-weight:600;font-size:14px;color:var(--txt)">'+esc(p.name)+'</a><div class="mini">'+esc(p.role||'')+' · cadence '+FW.cadenceFor(p).days+'d</div></div><span style="margin-left:auto">'+chip(ag.length+' agenda pre-baked',ag.length?'acc':'info','listc')+'</span></div>'+(ag.length?ag.slice(0,3).map(i=>'<div class="ag-row"><span class="src">'+i.src+'</span><span>'+esc(i.text.slice(0,90))+(i.text.length>90?'…':'')+'</span></div>').join(''):'<div class="mini">Clean agenda — bring the second question.</div>')+'<div style="display:flex;gap:6px;margin-top:12px">'+btn('goto','/oneonones','Open runner','play','btn-acc btn-sm')+btn('agenda-print',o.id,'Print agenda','printer','btn-sm')+'</div></div>';}).join('')+'</div>';}
 else hx+=card('oneonones','No sessions today','<div class="mini">No 1:1s scheduled today. '+(directs().length?'The open runner is in <a href="#/oneonones">1:1 sessions</a> — or book from any person page.':'Add your first person in <a href="#/people">People</a>.')+'</div>');
 hx+='<div class="grid g3" style="margin-top:14px">'
 +card('batt','Load index','<div style="display:flex;gap:16px;align-items:center">'+ring(b.load.score,b.load.band.cls==='risk'?'risk':b.load.band.cls==='warn'?'warn':'ok')+'<div style="flex:1">'+chip(b.load.band.label,b.load.band.cls)+'<div class="mini" style="margin-top:6px">'+b.load.reasoning[0]+'</div><div class="mini" style="margin-top:4px;color:var(--dim)">'+b.load.actions[0]+'</div><div style="margin-top:8px"><a href="#/self" style="font-size:11.5px">full breakdown →</a></div></div></div>')
 +card('sprout','Rep of the day','<b style="font-size:13.5px">'+b.rep[0]+'</b><div style="font-size:12.5px;color:var(--dim);margin-top:6px;line-height:1.6">'+b.rep[1]+'</div><div class="mini" style="margin-top:8px">Skill compounds through reps, not reads. The <a href="#/academy">Academy</a> tracks the rest.</div>')
 +card('review','The loop','<div style="font-size:12.5px;color:var(--dim);line-height:1.7">Cases → lessons → review → better priors. That loop is the leadership-course substitute; the app carries the cadence, you bring the honesty.</div><div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap">'+btn('goto','/review','Weekly review','review','btn-sm')+btn('goto','/academy','Academy','academy','btn-sm')+'</div>')
 +'</div>';
 return hx;};
Actions['goto']=(id,el)=>go(el.dataset.arg||id);
Actions['goto-inbox']=()=>go('/inbox');
Actions['chase-inject']=(pid,el)=>{const p=get('people',pid);if(!p)return;mut(()=>{Engine.injectAgenda(pid,'Chase commitment owed TO you (overdue): '+(el.dataset.arg||'the commitment'),'chase');});toast('Injected into the next 1:1 with '+p.name.split(' ')[0]+'. Chase once, by name, on the record.','ok');};
/* ── INBOX ── */
Routes['/inbox']=function(){const scan=mentorScan();const press=Mentor.pressure(scan);
 let hx=pageHead('Mentor inbox','52 detectors over every collection · weighted, ranked, executable · deferral has dates, never silence',btn('goto','/review','Weekly review','review'));
 hx+='<div class="grid g4" style="margin-bottom:16px">'+stat(scan.active.length,'active advisories',scan.all.length?scan.all.length+' total incl. deferred':'')+stat(press,'advisory pressure','Σ weights — watch the trend in the review')+stat(scan.deferred.length,'deferred','returning on dates you chose')+stat(scan.active.filter(a=>a.hard).length,'unsnoozable','resolve or own openly — the integrity class')+'</div>';
 if(!scan.active.length)hx+=card('check','Zero active advisories',reco('ok','<b>The silence is earned.</b> Every instrument below the surface keeps running — cadence coverage, safety scans, export age, integrity. If it finds something, it lands here with a weight and an action, not a vibe.')+'<div class="mini" style="margin-top:8px">'+scan.deferred.length+' deferred item(s) still have return dates — see below.</div>');
 scan.active.filter(a=>a.hard).concat(scan.active.filter(a=>!a.hard)).forEach(a=>{hx+=advCard(a);});
 if(scan.deferred.length){hx+='<div class="h-sec" style="margin-top:26px">Deferred lane <small>returns on the date — never deleted</small></div>';
 hx+=scan.deferred.map(a=>'<div class="card adv" style="margin-bottom:8px;opacity:.75"><span style="color:var(--faint)">'+ic(a.ic)+'</span><div style="flex:1"><b style="font-size:12.5px">'+esc(a.label)+'</b><span class="mini"> · '+esc(a.rule)+' · returns '+fmt(S.snoozes[a.key])+' ('+db(todayStr(),S.snoozes[a.key])+'d)</span></div><button class="btn btn-sm btn-ghost" data-action="adv-unsnooze" data-id="'+a.key+'">bring back now</button></div>').join('');}
 return hx;};
