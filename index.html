<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeadOS pt-7 — Universal Leadership OS</title>
<style>
/* LeadOS design system — editorial paper. One accent hue, severity by
   weight/texture, never a second hue. Motion ≤160ms. No network, no CDN,
   no fonts fetched: system stacks only (doctrine: offline forever). */
:root{
  --paper:#F7F4EF; --paper2:#F1EDE4; --card:#FCFAF6;
  --ink:#1C1917; --ink2:#4A453E; --muted:#7A736A; --faint:#A39B8E;
  --hair:#E3DED0; --hair2:#D8D2C2;
  --accent:#B3291E; --accent-ink:#8F2017;
  --ok:#3E6B4F;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
::selection{background:rgba(179,41,30,.16)}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--hair2);
  border-radius:3px;padding:7px 9px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(179,41,30,.35);outline-offset:1px}
label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:block;margin:0 0 4px}

#app{display:flex;min-height:100vh}

/* ---------- rail ---------- */
.rail{width:224px;flex:0 0 224px;border-right:1px solid var(--hair);padding:22px 16px;display:flex;
  flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;background:var(--paper)}
.brand{display:flex;align-items:baseline;gap:8px;padding:2px 8px 18px;border-bottom:1px solid var(--hair);margin-bottom:14px}
.brand b{font-family:var(--serif);font-size:21px;font-weight:700;letter-spacing:-.01em}
.brand span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:1px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:4px;text-decoration:none;
  color:var(--ink2);font-size:13px;transition:background .12s ease,color .12s ease}
.nav a svg{flex:0 0 auto;opacity:.72}
.nav a:hover{background:var(--paper2)}
.nav a.on{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--hair)}
.nav a.on svg{opacity:1;color:var(--accent)}
.nav .n{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted)}
.nav a.on .n{color:var(--accent)}
.railfoot{margin-top:auto;border-top:1px solid var(--hair);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.gate{display:flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 8px}
.gate i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.gate.bad i{background:var(--accent)}
.keystat{font-family:var(--mono);font-size:10.5px;color:var(--faint);padding:0 8px;line-height:1.7;word-break:break-all}

/* ---------- view host ---------- */
main{flex:1;min-width:0;padding:34px 40px 90px;max-width:1180px}
.view{animation:fade .14s ease}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view{animation:none}}
.vhead{margin-bottom:26px}
.kicker{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:8px}
.vhead h1{font-family:var(--serif);font-size:38px;font-weight:700;letter-spacing:-.02em;line-height:1.05}
.vhead .sub{color:var(--muted);margin-top:10px;max-width:72ch}
.vhead .sub b{color:var(--ink2);font-weight:600}

.sect{margin:34px 0 10px;display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--hair);padding-bottom:8px}
.sect h2{font-family:var(--serif);font-size:20px;font-weight:700;letter-spacing:-.01em}
.sect .meta{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:960px){.grid2,.grid3{grid-template-columns:1fr}}

.card{background:var(--card);border:1px solid var(--hair);border-radius:5px;padding:16px 18px}
.card h3{font-family:var(--serif);font-size:16px;font-weight:700}
.muted{color:var(--muted)} .small{font-size:12px}
.mono{font-family:var(--mono);font-size:12px}
.hr{border:0;border-top:1px solid var(--hair);margin:18px 0}

/* pills & severity — weight/texture language, one hue */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;
  font-weight:600;padding:2px 8px;border-radius:99px;border:1px solid var(--hair2);color:var(--muted);white-space:nowrap}
.sev{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:3px;white-space:nowrap}
.sev.s1,.sev.s2{color:var(--muted);border:1px solid var(--hair2)}
.sev.s3{color:var(--accent);border:1px solid rgba(179,41,30,.45)}
.sev.s4{color:#fff;background:var(--accent);border:1px solid var(--accent)}
.sev.s5{color:#fff;background:var(--accent-ink);border:1px solid var(--accent-ink);box-shadow:0 0 0 2px rgba(179,41,30,.18)}
.conf{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--muted);border-bottom:1px dotted var(--faint);padding-bottom:1px}
.conf.HIGH{color:var(--ink);border-bottom-color:var(--ink)}
.conf.MEDIUM{color:var(--ink2)}
.chip{padding:6px 12px;border:1px solid var(--hair2);border-radius:99px;font-size:11px;letter-spacing:.07em;
  text-transform:uppercase;font-weight:600;color:var(--muted);transition:all .12s ease;background:transparent}
.chip:hover{border-color:var(--faint);color:var(--ink2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chips{display:flex;flex-wrap:wrap;gap:7px}

/* findings */
.fin{border:1px solid var(--hair);border-radius:5px;background:var(--card);padding:14px 16px;display:flex;flex-direction:column;gap:9px}
.fin+.fin{margin-top:10px}
.fin .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fin .rule{font-family:var(--mono);font-size:11px;color:var(--muted)}
.fin .title{font-weight:600;font-size:13.5px}
.fin .key{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--faint)}
.basis{border-left:2px solid var(--hair2);padding:2px 0 2px 12px;display:flex;flex-direction:column;gap:3px}
.basis div{font-family:var(--mono);font-size:11.5px;color:var(--ink2);line-height:1.55}
.basis div.lbl{color:var(--muted)}
.fin .foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.playlink{font-size:11px;color:var(--accent);text-decoration:none;border-bottom:1px solid rgba(179,41,30,.35)}
.playlink:hover{border-bottom-color:var(--accent)}

/* heatmap */
.heatgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:14px}
@media (max-width:1100px){.heatgrid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:700px){.heatgrid{grid-template-columns:repeat(2,1fr)}}
.hcell{border:1px solid var(--hair2);border-radius:5px;padding:13px 14px 12px;cursor:pointer;background:var(--card);
  transition:transform .12s ease, box-shadow .12s ease;position:relative;overflow:hidden;text-align:left;width:100%}
.hcell:hover{transform:translateY(-1px);box-shadow:0 2px 10px rgba(28,25,23,.07)}
.hcell.sel{box-shadow:0 0 0 2px var(--ink)}
.hcell .d{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);font-weight:600}
.hcell .s{font-family:var(--serif);font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin-top:2px}
.hcell .c{font-family:var(--mono);font-size:10px;color:var(--ink2);margin-top:2px}
.hcell .bar{position:absolute;left:0;bottom:0;height:3px;background:currentColor;opacity:.55}
.heatmath{margin-top:16px}
.heatrow{display:flex;gap:10px;align-items:baseline;font-family:var(--mono);font-size:11.5px;color:var(--ink2);
  padding:6px 0;border-bottom:1px dashed var(--hair)}
.heatrow b{color:var(--ink)}
.heatrow .w{margin-left:auto;color:var(--ink)}
.excl{font-family:var(--mono);font-size:11px;color:var(--muted);padding:5px 0;border-bottom:1px dashed var(--hair)}
.callout{border:1px solid rgba(179,41,30,.4);background:rgba(179,41,30,.05);border-radius:5px;padding:12px 15px;
  font-size:12.5px;color:var(--ink2);display:flex;gap:10px;align-items:flex-start}
.callout svg{flex:0 0 auto;margin-top:1px;color:var(--accent)}

/* insights */
.ins{border:1px solid var(--hair);border-left:3px solid var(--hair2);border-radius:5px;background:var(--card);
  padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.ins+.ins{margin-top:12px}
.ins.k-pattern{border-left-color:var(--accent)}
.ins.k-cluster{border-left-color:var(--ink)}
.ins.k-benchmark-gap{border-left-style:double;border-left-width:5px;border-left-color:var(--accent)}
.ins .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ins .kind{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.ins h3{font-family:var(--serif);font-size:17px;font-weight:700}
.ins .body{color:var(--ink2);font-size:13px;line-height:1.65;white-space:pre-wrap}
.ins .keys{font-family:var(--mono);font-size:10.5px;color:var(--muted);line-height:1.7;word-break:break-word}
.ins .foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ins.acked{opacity:.62;background:var(--paper2)}
.fin.focus{outline:2px solid var(--accent);outline-offset:2px}
.pill[data-act]{cursor:pointer}
.pill[data-act]:hover{border-color:var(--ink);color:var(--ink)}
.spark{font-family:var(--mono);font-size:13px;letter-spacing:.08em}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--ink);border-radius:4px;padding:7px 13px;
  font-size:12px;font-weight:600;background:var(--ink);color:var(--paper);transition:opacity .12s ease}
.btn:hover{opacity:.86}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--hair2)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.warn{border-color:var(--accent);color:var(--accent);background:transparent}
.btn.warn:hover{background:rgba(179,41,30,.06);opacity:1}
.btn.sm{padding:4px 9px;font-size:11px}

/* tables */
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
.t th{text-align:left;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  font-weight:600;padding:8px 10px;border-bottom:1px solid var(--hair2)}
.t td{padding:8px 10px;border-bottom:1px solid var(--hair);vertical-align:top}
.t td.mono{font-family:var(--mono);font-size:11.5px}
.t tr:hover td{background:var(--paper2)}

/* forms */
.fgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 14px;margin-top:12px}
@media (max-width:700px){.fgrid{grid-template-columns:1fr}}
.fgrid .full{grid-column:1/-1}
.formnote{font-size:11.5px;color:var(--muted);margin-top:10px}
.caphead{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}

/* health */
.check{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--hair);font-size:12.5px}
.check .id{font-family:var(--mono);font-size:11px;color:var(--muted);flex:0 0 52px;padding-top:1px}
.check .st{flex:0 0 auto;margin-top:1px}
.check.ok .st{color:var(--ok)} .check.bad .st{color:var(--accent)}
.check .why{color:var(--muted);font-size:11.5px}
.check .why b{color:var(--ink2)}
.claim{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--hair);font-size:12.5px;align-items:baseline}
.claim .cid{font-family:var(--mono);font-size:11px;color:var(--muted);flex:0 0 40px}

/* authority wall overlay */
#gatewall{position:fixed;inset:0;background:var(--paper);z-index:50;display:flex;align-items:center;justify-content:center;padding:30px}
#gatewall .box{max-width:640px;border:1px solid var(--accent);border-radius:6px;background:var(--card);padding:28px 30px}
#gatewall h1{font-family:var(--serif);font-size:24px;margin:0 0 10px}
#gatewall pre{font-family:var(--mono);font-size:11.5px;background:var(--paper2);padding:12px;border-radius:4px;overflow:auto;max-height:240px;white-space:pre-wrap}

.empty{border:1px dashed var(--hair2);border-radius:5px;padding:26px;text-align:center;color:var(--muted);font-size:13px}
.totop{display:none}
footer.colophon{margin-top:60px;border-top:1px solid var(--hair);padding-top:14px;font-size:11px;color:var(--faint);
  display:flex;gap:18px;flex-wrap:wrap;font-family:var(--mono)}

@media (max-width:760px){
  #app{flex-direction:column}
  .rail{width:100%;flex:none;height:auto;position:static;border-right:0;border-bottom:1px solid var(--hair);
    flex-direction:column;padding:14px 12px}
  .nav{flex-direction:row;overflow-x:auto;padding-bottom:4px}
  .nav a{white-space:nowrap}
  .nav .n{display:none}
  .railfoot{display:none}
  main{padding:24px 18px 70px}
  .vhead h1{font-size:29px}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="gatewall" hidden></div>
<script>
'use strict';
/* ============================================================================
   LEADOS pt-7 — universal leadership operating system, single-file delivery.
   Internal modules (doctrinal load order, one classic script):
     1 UTIL · 2 EVENTS (registry+validate) · 3 STORE (persistence wall, v5)
     4 ENGINE (fold + selectors) · 5 RULES (R1–R40, pure) · 6 CORRELATE
     (clusters · authoritative heatmap · insights · benchmark-gap · patterns)
     7 HEALTH (executed T/G suites + claims) · 8 PLAYBOOKS · 9 UI.
   Divergence from the upstream 10-file structure is documented in README.md —
   this delivery is exactly the three files the brief asks for.
============================================================================ */
const LeadOS = window.LeadOS = window.LeadOS || {};
/* Module registry — the single-file analog of the brief's script list.
   Each logical "file" registers exactly one namespace, in this load order.
   The boot guard halts rendering if any entry is missing (data untouched). */
LeadOS.EXPECTED_MODULES=['util','events','store','engine','rules','correlate','conversations','decisions','execution','external','calibration','finIntel','health','playbooks','ui'];

/* ==================== 1 · UTIL ==================== */
(function(){
const DAY = 86400000;
const days = (b,a)=>Math.floor((b-a)/DAY);
const iso = t => (typeof t==='number'&&isFinite(t)) ? new Date(t).toISOString().slice(0,10) : 'undated';
const isoT = t => (typeof t==='number'&&isFinite(t)) ? new Date(t).toISOString().replace('.000Z','Z') : 'undated';
const rd = (n,p)=>{ const m=Math.pow(10,p||2); return Math.round(n*m)/m; };
const rd3 = n=>rd(n,3);
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const sum=a=>a.reduce((x,y)=>x+y,0);
const uniq=a=>a.filter((x,i)=>a.indexOf(x)===i);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const deepEq=(a,b)=>{
  if(a===b) return true;
  if(typeof a!==typeof b||a===null||b===null) return false;
  if(Array.isArray(a)!==Array.isArray(b)) return false;
  if(typeof a!=='object') return a===b;
  const ka=Object.keys(a),kb=Object.keys(b);
  if(ka.length!==kb.length) return false;
  return ka.every(k=>deepEq(a[k],b[k]));
};
function slope(ys){ let n=ys.length,sx=0,sy=0,sxy=0,sxx=0;
  ys.forEach((y,i)=>{sx+=i;sy+=y;sxy+=i*y;sxx+=i*i;});
  const d=n*sxx-sx*sx; return d===0?0:(n*sxy-sx*sy)/d; }
function median(a){ const s=a.slice().sort((x,y)=>x-y); const n=s.length;
  return n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2; }
const maxAt=(arr,sel)=>{let t=null;(arr||[]).forEach(x=>{const v=sel?sel(x):x.at;
  if(typeof v==='number'&&isFinite(v)&&(t===null||v>t))t=v;});return t;};
let __uidC=0;
const uid=p=>(p||'id')+'-'+(++__uidC).toString(36)+'-'+Math.random().toString(36).slice(2,8);
LeadOS.util={DAY,days,iso,isoT,rd,rd3,clamp,sum,uniq,esc,deepEq,slope,median,maxAt,uid};
})();

/* ==================== 2 · EVENTS — registry & append-gate ====================
   87 event types under contract in this file. Upstream claims 92; the delta
   is types whose payload contracts could NOT be byte-verified this session
   (upstream events.js unread) — they are not registered rather than guessed.
   validate() is the mandatory gate for every append (store.append). */
(function(){
const LeadOS = window.LeadOS;
/* kinds: s string · n finite number · b boolean · a array · o object · ms epoch ms · any */
const KIND_OK = {
  s:v=>typeof v==='string'&&v.length>0,
  n:v=>typeof v==='number'&&isFinite(v),
  b:v=>typeof v==='boolean',
  a:v=>Array.isArray(v),
  o:v=>!!v&&typeof v==='object'&&!Array.isArray(v),
  ms:v=>typeof v==='number'&&isFinite(v)&&v>0,
  any:()=>true
};
const CAD=['revenue','ops','board','compliance'];
/* def: r=required fields · o=optional (type-checked when present) · e=enums · c=creates-family · refs/refArrays for the import gate */
const D=(r,o,e,c,refs,refArrays)=>({r:r||{},o:o||{},e:e||{},c:c||null,refs:refs||null,refArrays:refArrays||null});
const REGISTRY = {
  'store.initialized':      D({schemaVersion:'n'},{lineageTag:'s'}),
  'settings.changed':       D({key:'s',value:'any'}),
  /* heritage / operating rhythm (pt-1 lineage — reconstructed, see README) */
  'cadence.review':         D({kind:'s'},{note:'s'},{kind:CAD}),
  'review.completed':       D({kind:'s',outcome:'s'},{notes:'s'},{kind:CAD}),
  'decision.logged':        D({id:'s',title:'s'},{domain:'s',owner:'s'},null,'decisions'),
  'decision.decided':       D({decisionId:'s',choice:'s'},null,null,null,{decisionId:'decisions'}),
  'risk.raised':            D({id:'s',title:'s',likelihood:'n',impact:'n'},{owner:'s'},null,'regRisks'),
  'risk.reviewed':          D({riskId:'s'},{note:'s'},null,null,{riskId:'regRisks'}),
  'objective.set':          D({id:'s',objective:'s'},{keyResults:'a',owner:'s'},null,'objectives'),
  'kr.added':               D({objectiveId:'s',kr:'s'},{target:'n',unit:'s'},null,null,{objectiveId:'objectives'}),
  'kr.progressLogged':      D({objectiveId:'s',current:'n'},{note:'s',kr:'s'},null,null,{objectiveId:'objectives'}),
  'objective.closed':       D({objectiveId:'s'},{score:'n',note:'s'},null,null,{objectiveId:'objectives'}),
  'task.created':           D({id:'s',title:'s',dueDate:'ms'},{owner:'s'},null,'tasks'),
  'task.done':              D({taskId:'s'},null,null,null,{taskId:'tasks'}),
  /* finance */
  'fin.budget.set':         D({id:'s',period:'s',amount:'n'},{currency:'s',category:'s',ownerId:'s'},null,'budgets'),
  'fin.budget.actuals':     D({budgetId:'s',actual:'n',period:'s'},{note:'s'},null,null,{budgetId:'budgets'}),
  'fin.forecast.logged':    D({period:'s',forecast:'n'},{metric:'s',actual:'any'}),
  'fin.kpi.logged':         D({metric:'s',value:'n'},{unit:'s',target:'n'}),
  'fin.risk.logged':        D({id:'s',title:'s',severity:'n',likelihood:'n'},{mitigationPlan:'s',ownerId:'s',reviewDate:'ms'},null,'finRisks'),
  'fin.risk.updated':       D({riskId:'s',status:'s'},{note:'s'},{status:['open','mitigated','accepted','closed']},null,{riskId:'finRisks'}),
  /* sales */
  'sales.deal.logged':      D({id:'s',title:'s',value:'n',stage:'s'},{currency:'s',ownerId:'s',closeDate:'ms',accountName:'s'},null,'deals'),
  'sales.deal.updated':     D({dealId:'s'},{stage:'s',value:'n',closeDate:'ms',lostReason:'s'},null,null,{dealId:'deals'}),
  'sales.deal.closed':      D({dealId:'s',result:'s'},{actualValue:'n',note:'s'},{result:['won','lost']},null,{dealId:'deals'}),
  'sales.pipeline.reviewed':D({period:'s'},{note:'s'}),
  'sales.quota.set':        D({id:'s',personId:'s',period:'s',target:'n'},{currency:'s'},null,'quotas'),
  'sales.quota.actuals':    D({quotaId:'s',actual:'n',period:'s'},null,null,null,{quotaId:'quotas'}),
  /* product & strategy */
  'product.roadmap.item':   D({id:'s',title:'s',quarter:'s',status:'s'},{pillar:'s',ownerId:'s',effort:'n',impact:'n'},null,'roadmap'),
  'product.roadmap.updated':D({itemId:'s'},{status:'s',quarter:'s',ownerId:'s'},null,null,{itemId:'roadmap'}),
  'product.metric.logged':  D({name:'s',value:'n'},{unit:'s'}),

/* Heat domain for a cross-domain composite: the most common limb domain,
   ties broken alphabetically — mechanical, and printed (never claimed to be
   the pattern's "location"). */
function corrDomain(def,pat){
  const counts={};
  (pat?pat.requires:[]).forEach(r=>{ const d=(META[r]||{domain:'system'}).domain; counts[d]=(counts[d]||0)+1; });
  const total=(pat?pat.requires.length:0);
  const best=Object.keys(counts).sort((a,b)=>(counts[b]-counts[a])||(a<b?-1:1))[0]||'system';
  return {domain:best,why:'charged to '+best+' ('+(counts[best]||0)+' of '+total+' limb domains) — a composite is not "located" anywhere; this is printed, not claimed'};
}
function corrFindings(P,today,received,patternsActive){
  const out=[], errs=[];
  CORR_DEFS.forEach(def=>{
    const pat=patternsActive.filter(p=>p.name===def.pattern)[0];
    if(!pat) return;
    try{
      const byKey={}; received.forEach(f=>{ byKey[f.key]=f; });
      const evid=U.maxAt([].concat.apply([],pat.members.map(m=>m.keys.map(k=>(byKey[k]||{}).evidenceAt).filter(x=>typeof x==='number'))),x=>x);
      const dom=corrDomain(def,pat);
      const limbs=pat.members.map(m=>'  '+m.rule+': '+m.count+' finding(s) ['+m.keys.join(', ')+']');
      out.push(fin(def.rule,{
        sev:def.sev, conf:def.conf, play:def.play,
        key:def.key, /* literal key — the pt-8 brief pins CORR:<PATTERN> exactly */
        title:'Pattern active: '+def.pattern.toLowerCase().replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase()),
        basis:['correlation rules run AFTER the individual rules — this pass received '+received.length+' already-computed, unsuppressed individual finding(s)',
          'trigger: pattern '+def.pattern+' active — every required limb verified against that received list:'].concat(limbs).concat([
          def.confWhy+(def.confNote?' · '+def.confNote:''),
          'resolved when all '+pat.requires.length+' constituent rules stop firing — findings are derived per read, so resolution is derivation, not a stored state',
          'heat domain: '+dom.why,

        domain:dom.domain, evidenceAt:evid}));
    }catch(e){ errs.push({rule:def.rule,message:e.message});

/* ENG findings: a throwing rule surfaces LOUDLY as a finding and in engErrors —

function engFinding(rule,e){

function individual(P,today){

/* Findings suppression — INTERPRETATION, printed (the brief pins
   suppressedCount but not the mechanism): signal.tagged with tag
   'suppress'|'unsuppress', eventId = the finding's stable key, LATEST append
   wins. Auditable (the tag event is in the log forever) and reversible
   (unsuppress). Suppressing every limb of a pattern makes the pattern go
   dormant — suppression is allowed to quiet cascades, and the dormant-listing
   disclosure shows WHY. */
function suppression(P){
  const map={};
  (P.signalTags||[]).forEach(t=>{
    if(t.tag!=='suppress'&&t.tag!=='unsuppress') return;
    map[t.eventId]={tag:t.tag,note:t.note||'',at:t.at,_ev:t._ev||null}; /* later append overwrites — latest wins */
  });
  return map;
}
/* THE ONE HARD OVERRIDE IN THE SUPPRESSION MODEL (pt-15, G84/G89):
   R88 non-compliance findings are UNSUPPRESSIBLE. A leader may silence any
   other signal; regulatory non-compliance is not theirs to silence, and the
   attempt is recorded rather than honored. */
const UNSUPPRESSIBLE_RULES={R88:'regulatory non-compliance — exempt from suppression by explicit doctrine; the suppression event remains in the log and is shown on the finding'};
function suppressionOverride(f){ return !!UNSUPPRESSIBLE_RULES[f.rule]; }
const sortFindings=out=>out.sort((a,b)=>(b.sev-a.sev)||(a.rule<b.rule?-1:a.rule>b.rule?1:0)||(a.key<b.key?-1:1));
/* runFull: one computation, used by BOTH the strict contract (run) and the
   view layer (correlate.run). Algorithm order is printed in CORR basis lines:
   individual → suppression → correlation pass (receives the visible list) →
   sort. Deterministic: same log + same injected today → identical output. */
function runFull(P,today){
  const ind=individual(P,today);
  const engList=ind.base.filter(f=>f.rule==='ENG');
  const indNormal=ind.base.filter(f=>f.rule!=='ENG');
  const sup=suppression(P);
  const isSup=f=>{
    if(!(sup[f.key]&&sup[f.key].tag==='suppress')) return false;
    if(suppressionOverride(f)){
      /* attempted and refused — the finding carries the refusal in its basis */
      if(f.basis.indexOf('SUPPRESSION ATTEMPTED AND REFUSED')===-1)
        f.basis.push('SUPPRESSION ATTEMPTED AND REFUSED: a suppress tag exists for '+f.key+' ('+(sup[f.key]._ev||'?')+', '+U.iso(sup[f.key].at)+') — '+UNSUPPRESSIBLE_RULES[f.rule]);
      return false;
    }
    return true;
  };
  const visibleBase=indNormal.filter(f=>!isSup(f));
  const pats=LeadOS.correlate.detectPatterns(P,today,visibleBase);
  const cf=corrFindings(P,today,visibleBase,pats.active);
  const corrVisible=cf.corr.filter(f=>!isSup(f)&&f.rule!=='ENG');
  const corrEng=cf.corr.filter(f=>f.rule==='ENG');
  const engAll=engList.concat(corrEng);
  const suppressedFindings=indNormal.concat(cf.corr.filter(f=>f.rule!=='ENG'))
    .filter(isSup)
    .map(f=>Object.assign({},f,{_supBy:sup[f.key]._ev,_supNote:sup[f.key].note,_supAt:sup[f.key].at}));
  const findings=sortFindings(visibleBase.concat(corrVisible).concat(engAll));
  /* suppression-quieted cascades, disclosed rather than hidden: patterns that
     WOULD fire on the unsuppressed list but are dormant on the visible list */
  const allPats=LeadOS.correlate.detectPatterns(P,today,indNormal);
  const quieted=pats.dormant.filter(d=>allPats.active.some(a=>a.name===d.name))
    .map(d=>({name:d.name,
      why:'dormant because limb finding(s) are suppressed — suppression quieted the cascade; printed, not hidden. Missing on the visible list: '+d.missing.join(', ')}));
  const clus=LeadOS.correlate.clusters(P,today,findings);
  const benches=LeadOS.correlate.benchmarkCompare(P);
  const ins=LeadOS.correlate.buildInsights(P,today,findings,clus,pats,benches);
  const ht=LeadOS.correlate.heat(P,today,findings);
  const nonPromoted=clus.list.filter(c=>!(c.severity>=4||c.findings.length>=3||c.domains.length>1));
  const engErrors=ind.errs.concat(cf.errs);
  return {
    /* the strict pt-8 contract keys: */
    findings:findings, suppressedCount:suppressedFindings.length, engErrors:engErrors,
    insights:ins, heatmap:ht,
    /* view-aid fields (same computation, printed): */
    suppressedFindings:suppressedFindings, clusters:clus, nonPromoted:nonPromoted,
    patterns:pats, quieted:quieted, benchmarks:benches, heat:ht
  };
}
/* The strict pt-8 contract — exactly five keys, in the brief's order. */
function run(P,today){
  const r=runFull(P,today);
  return {findings:r.findings,suppressedCount:r.suppressedCount,engErrors:r.engErrors,
    insights:r.insights,heatmap:r.heatmap};
}
LeadOS.rules={META:META,RULES:RULES,CORR_DEFS:CORR_DEFS,fin:fin,engFinding:engFinding,

/* ==================== 6 · CORRELATE — clusters · heat · insights ============

   HEAT — domain score = min(10, Σ over the domain's active findings of

     basis shows the gap; conf MEDIUM; source printed, not verified.
   DIVERGENCE FROM UPSTREAM (verified, disclosed in README): upstream's
   interpreted pt-5 heat used sev × decay^(ageDays) with NO conf weighting;
   the pt-7 brief's formula wins wherever the two differ.
   LABELED ASSUMPTION (brief names CONF_FACTOR without pinning values):
   CONF_FACTOR = HIGH 1.00 · MEDIUM 0.60 · LOW 0.30 — monotone in confidence,
   never amplifies a measured sev; printed everywhere heat is rendered. */
(function(){
const LeadOS = window.LeadOS, U = LeadOS.util, DAY = U.DAY;
const CONF_FACTOR = {HIGH:1.00, MEDIUM:0.60, LOW:0.30};
const CONF_FACTOR_WHY = 'ASSUMPTION (printed, leader-changeable in spirit): the brief references CONF_FACTOR[conf] without pinning values — HIGH 1.00 · MEDIUM 0.60 · LOW 0.30 chosen so confidence discounts but never amplifies a measured severity';
const BENCH_GAP_SEV = 3; /* brief pins trigger + conf, not severity — labeled */
const HEAT_LABEL = 'COMPOSITE SIGNAL, NOT A MEASUREMENT';

/* ---------- typed anchors (entity:/person:/metric:/line:) ---------- */
const ENTITY_BUCKETS=['finBudgets','finRisks','deals','quotas','roadmap','okrs','incidents','milestones',
  'pips','campaigns','vendors','experiments','techDebt','contracts','escalations','crises','equipment',
  'legalRiskById','decisions','objectives','tasks','regRisks','notes'];
function anchorsFor(f,P){
  const anchors={}, trail=[], persons=[];
  (f.refs||[]).forEach(ref=>{
    let found=false;
    ENTITY_BUCKETS.forEach(b=>{ if(P[b]&&P[b][ref]){ found=true; } });
    if(found) anchors['entity:'+ref]=true;
    else if(!P.rosterById[ref]) trail.push('ref '+ref+' resolves to no entity — recorded, not guessed');
    const q=P.quotas&&P.quotas[ref]; if(q&&q.personId){ anchors['person:'+q.personId]=true; persons.push(q.personId); trail.push('ref '+ref+' → quota.personId '+q.personId); }
    const d=P.deals&&P.deals[ref];    if(d&&d.ownerId){ anchors['person:'+d.ownerId]=true; persons.push(d.ownerId); trail.push('ref '+ref+' → deal.ownerId '+d.ownerId); }
    const pp=P.pips&&P.pips[ref];     if(pp&&pp.personId){ anchors['person:'+pp.personId]=true; persons.push(pp.personId); trail.push('ref '+ref+' → pip.personId '+pp.personId); }
    if(P.rosterById&&P.rosterById[ref]){ anchors['person:'+ref]=true; persons.push(ref); trail.push('ref '+ref+' is a roster person'); }
  });
  if(f.rule==='R23'&&P.kpiByMetric&&P.kpiByMetric[f.scope]){ anchors['metric:'+f.scope]=true; trail.push('scope '+f.scope+' is a folded fin KPI metric'); }
  if(f.rule==='R17'){ const m=String(f.scope).split(':')[0];
    if(P.slaByMetric&&P.slaByMetric[m]){ anchors['metric:'+m]=true; trail.push('scope '+f.scope+' → folded SLA metric '+m); } }
  if(f.rule==='R27'){ anchors['line:'+f.scope]=true; trail.push('scope '+f.scope+' → production line'); }
  return {anchors:anchors,trail:trail,persons:persons};
}

/* ---------- clusters: shared-anchor & windowed domain edges ---------- */
function clusters(P,today,findings){
  const set=LeadOS.engine.settings(P), win=set.correlationWindowDays;
  const recs=findings.map(f=>{
    const a=anchorsFor(f,P);
    let age=f.evidenceAt===null?null:U.days(today,f.evidenceAt);
    if(age!==null&&age<0) age=0; /* future-dated evidence: clamped, heat prints it */
    return {key:f.key,rule:f.rule,sev:f.sev,conf:f.conf,title:f.title,domain:f.domain,
      anchors:a.anchors,trail:a.trail,ageDays:age};
  });
  const parent=recs.map((_,i)=>i);
  const find=i=>{ while(parent[i]!==i){ parent[i]=parent[parent[i]]; i=parent[i]; } return i; };
  const edgeTrail=[];
  const union=(a,b,why)=>{ const ra=find(a),rb=find(b);
    if(ra!==rb){ parent[ra]=rb; edgeTrail.push(why); } };
  for(let i=0;i<recs.length;i++) for(let j=i+1;j<recs.length;j++){
    const A=recs[i],B=recs[j];
    const shared=Object.keys(A.anchors).filter(k=>B.anchors[k]);
    if(shared.length){ union(i,j,'edge '+A.key+' ↔ '+B.key+' via shared anchor '+shared.sort()[0]); continue; }
    if(A.domain===B.domain&&A.ageDays!==null&&B.ageDays!==null&&
       A.ageDays<=win&&B.ageDays<=win&&Math.abs(A.ageDays-B.ageDays)<=win){
      union(i,j,'edge '+A.key+' ↔ '+B.key+' via domain '+A.domain+', ages '+A.ageDays+'d & '+B.ageDays+'d within window '+win+'d');
    }
  }
  const groups={};
  recs.forEach((r,i)=>{ const root=find(i); (groups[root]=groups[root]||[]).push(r); });
  const list=Object.keys(groups).map(k=>groups[k]).filter(g=>g.length>=2).map(g=>{
    const keys=g.map(r=>r.key).sort();
    const domains=U.uniq(g.map(r=>r.domain)).sort();
    const counts={};
    g.forEach(r=>Object.keys(r.anchors).forEach(k=>{ counts[k]=(counts[k]||0)+1; }));
    const shared=Object.keys(counts).filter(k=>counts[k]>=2)
      .sort((a,b)=>(counts[b]-counts[a])||(a<b?-1:1));
    const anchor=shared[0]||null;
    const sev=Math.max.apply(null,g.map(r=>r.sev));
    const rules=U.uniq(g.map(r=>r.rule)).sort();
    const conf=anchor?'high':(g.length>=3?'medium':'low');
    const ages=g.map(r=>r.ageDays===null?'undated':r.ageDays+'d').join(', ');
    const confWhy=anchor
      ? 'anchor '+anchor+' verified in '+counts[anchor]+' of '+g.length+' findings via projections → high'
      : (g.length>=3
        ? g.length+' findings in domain scope within window '+win+'d (ages '+ages+') → medium; 2-point domain-only pairs stay low'
        : '2 findings, domain co-occurrence only (ages '+ages+' vs window '+win+'d) → low; no shared entity verified');
    const name=anchor
      ? 'Shared '+anchor.replace(/^entity:/,'').replace(/^person:/,'person ')+' — '+rules.join(' · ')
      : (domains.length===1?domains[0]:'cross-domain')+' co-occurrence within '+win+'d — '+rules.join(' · ');
    return {id:keys.join('+'),findings:keys,domains:domains,sharedEntity:anchor,
      severity:sev,confidence:conf,confWhy:confWhy,pattern:name,
      members:g.map(r=>({key:r.key,rule:r.rule,sev:r.sev,title:r.title,domain:r.domain,ageDays:r.ageDays}))};
  }).sort((a,b)=>(b.severity-a.severity)||(a.id<b.id?-1:1));
  return {list:list,windowDays:win,recs:recs,edgeTrail:edgeTrail};
}

/* ---------- HEAT — the pt-7 authoritative formula ---------- */
function heat(P,today,findings){
  const set=LeadOS.engine.settings(P);
  const win=set.correlationWindowDays, decay=set.heatmapDecayFactor;
  const cells={}, excluded=[], notes=[];
  findings.forEach(f=>{
    const d=LeadOS.engine.DOMAINS.indexOf(f.domain)!==-1?f.domain:'system';
    if(f.evidenceAt===null){
      excluded.push({key:f.key,domain:d,why:'undated evidence — excluded from heat, stated, never re-dated'}); return; }
    let age=U.days(today,f.evidenceAt), clamped=false;
    if(age<0){ notes.push(f.key+': future-dated evidence ('+(-age)+'d ahead) — age clamped to 0 for decay, disclosed'); age=0; clamped=true; }
    if(age>win){
      excluded.push({key:f.key,domain:d,why:'evidence '+age+'d old > correlationWindowDays '+win+'d — decays out of the picture'}); return; }
    const cf=CONF_FACTOR[f.conf];
    const dec=Math.pow(decay,age/7);
    const term=f.sev*cf*dec;
    if(!cells[d]) cells[d]={domain:d,contrib:[],raw:0};
    cells[d].raw+=term;
    cells[d].contrib.push({key:f.key,rule:f.rule,sev:f.sev,conf:f.conf,ageDays:age,
      confFactor:cf,decayVal:dec,term:term,
      math:'sev '+f.sev+' × conf '+f.conf+' ('+cf.toFixed(2)+') × '+decay+'^('+age+'/7) = '+U.rd3(dec)+(clamped?' [future-dated → clamped 0]':'')+' → '+U.rd3(term)});
  });
  /* G35: the map is COMPLETE over the canonical domains. A domain with no
     active findings scores exactly 0 — present in the map, labeled "no
     signal", never read as a measurement of health. */
  LeadOS.engine.DOMAINS.forEach(d=>{ if(!cells[d]) cells[d]={domain:d,contrib:[],raw:0}; });
  const list=Object.keys(cells).map(k=>cells[k]);
  list.forEach(c=>{
    c.contrib.sort((a,b)=>(b.term-a.term)||(a.key<b.key?-1:1));
    c.score=Math.min(10,Math.max(0,c.raw));
    c.capped=c.raw>10;
    if(!c.contrib.length) c.zeroWhy='no active findings — composite of nothing; labeled "no signal", not a measurement of health';
  });
  list.sort((a,b)=>(b.score-a.score)||(a.domain<b.domain?-1:1));
  return {
    formula:'score = min(10, Σ  sev × CONF_FACTOR[conf] × decay^(days/7) )',
    decaySource:'decay = heatmapDecayFactor ^ (days_since_finding / 7), weekly compounding',
    confFactor:CONF_FACTOR, confFactorWhy:CONF_FACTOR_WHY,
    decayFactor:decay, windowDays:win, complete:true,
    label:HEAT_LABEL, cells:list, excluded:excluded, notes:notes
  };
}
/* Trend (printed definition): same formula, bucketed by evidence age —
   "last 7d" = terms with ageDays ≤ 7; "prior 7d" = 7 < ageDays ≤ 14. */
function heatTrend(P,today,findings){
  const set=LeadOS.engine.settings(P), win=set.correlationWindowDays, decay=set.heatmapDecayFactor;
  const buckets={};
  findings.forEach(f=>{
    if(f.evidenceAt===null) return;
    let age=U.days(today,f.evidenceAt); if(age<0||age>win) return;
    const cf=CONF_FACTOR[f.conf], term=f.sev*cf*Math.pow(decay,age/7);
    const d=LeadOS.engine.DOMAINS.indexOf(f.domain)!==-1?f.domain:'system';
    if(!buckets[d]) buckets[d]={recent:0,prior:0};
    if(age<=7) buckets[d].recent+=term; else if(age<=14) buckets[d].prior+=term;
  });
  const out={};
  LeadOS.engine.DOMAINS.forEach(d=>{
    const b=buckets[d]||{recent:0,prior:0};
    out[d]={recent:Math.min(10,b.recent),prior:Math.min(10,b.prior),
      delta:U.rd(Math.min(10,b.recent)-Math.min(10,b.prior),2)};
  });
  return {def:'last 7d (ageDays ≤ 7) vs prior 7d (7 < ageDays ≤ 14), same formula, cap applied',byDomain:out};
}
/* 30-day history: the heat AS-OF each weekly snapshot, computed the only
   honest way — the log sliced at that instant, re-projected, re-run. */
function heatHistory(events,today,weeks){
  const n=weeks||4, snaps=[], domains={};
  LeadOS.engine.DOMAINS.forEach(d=>{ domains[d]=[]; });
  for(let w=n-1;w>=0;w--){
    const t=today-w*7*DAY;
    snaps.push(t);
    const evts=events.filter(e=>e.at<=t);
    const Px=LeadOS.engine.project(evts);
    const ht=LeadOS.rules.runFull(Px,t).heatmap;
    const score={}; ht.cells.forEach(c=>{ score[c.domain]=c.score; });
    LeadOS.engine.DOMAINS.forEach(d=>{ domains[d].push(U.rd(score[d]||0,2)); });
  }
  return {snapshots:snaps,domains:domains};
}

/* entity-shared enforcement (brief G34): a pattern claiming one shared subject
   may only fire when person-resolvable limbs do not point at DIFFERENT people.
   Org-level (unresolvable) limbs are silent on personhood, printed as such. */
function resolvePersons(f,P){
  const out={};
  try{ anchorsFor(f,P).persons.forEach(p=>{ out[p]=true; }); }catch(e){/* anchors never throw; belt-and-braces */}
  (f.refs||[]).forEach(ref=>{
    const o=P.objectives&&P.objectives[ref]; if(o&&o.owner) out[o.owner]=true;
    const d=P.decisions&&P.decisions[ref]; if(d&&d.owner) out[d.owner]=true;
  });
  return Object.keys(out);
}
function heritageNotes(def){
  return def.requires.filter(r=>HERITAGE_LABELS[r]).map(r=>{
    const n=HERITAGE_LABELS[r];
    return 'spec-vs-shipped · brief labels '+r+' "'+n.spec+'" (mentor lineage); shipped '+r+' is '+n.shipped+' — the trigger reads the SHIPPED rule. Ids are the contract; the difference is printed, never remapped silently.';
  });
}
function detectPatterns(P,today,findings){
  const byRule={};
  findings.forEach(f=>{ (byRule[f.rule]=byRule[f.rule]||[]).push(f); });
  const active=[], dormant=[];
  PATTERNS.forEach(def=>{
    const missing=def.requires.filter(r=>!byRule[r]);
    if(missing.length){ dormant.push({name:def.id,missing:missing,present:def.requires.filter(r=>byRule[r])}); return; }
    let sharedPerson; /* undefined = not entity-gated; null = gated, no person resolvable */
    if(def.entityShared){
      const distinct={};
      def.requires.forEach(r=>byRule[r].forEach(f=>{ resolvePersons(f,P).forEach(p=>{ distinct[p]=true; }); }));
      const people=Object.keys(distinct).sort();
      if(people.length>1){
        dormant.push({name:def.id,missing:[],present:def.requires.slice(),
          blockedBy:'entity-shared: limbs resolve to different people ('+people.join(' · ')+') — a shared-subject claim is not verifiable; printed, not inferred (G34)'});
        return;
      }
      sharedPerson=people[0]||null;
    }
    let windowRes=null;
    if(def.windowDays){
      const limbs=def.requires.map(r=>{
        const fn=EVIDENCE[r]; const t=fn?fn(P,today):null;
        if(t===null) return {rule:r,status:'undated',line:r+': evidence undated in the fold — the '+def.windowDays+'d limb is unverifiable, stated, never re-dated'};
        const age=U.days(today,t), fresh=age<=def.windowDays;
        return {rule:r,status:fresh?'fresh':'stale',
          line:r+': newest evidence '+U.iso(t)+' ('+age+'d old '+(fresh?'≤':'›')+' '+def.windowDays+'d window)'};
      });
      windowRes={days:def.windowDays,ok:limbs.every(l=>l.status==='fresh'),limbs:limbs};
    }
    active.push({
      name:def.id,sev:def.sev,conf:def.conf,sharedPerson:sharedPerson,
      confWhy:'medium — '+def.requires.length+' correlated signals, '+CONF_NOTE+' (uniform MEDIUM, printed)',
      narrative:def.narrative,play:def.play,requires:def.requires.slice(),
      members:def.requires.map(r=>({rule:r,count:byRule[r].length,keys:byRule[r].map(f=>f.key)})),
      window:windowRes,
      notes:heritageNotes(def).concat(def.notes||[])
    });
  });
  active.sort((a,b)=>(b.sev-a.sev)||(a.name<b.name?-1:1));
  dormant.sort((a,b)=>(a.name<b.name?-1:1));
  return {active:active,dormant:dormant,librarySize:PATTERNS.length};
}

/* ---------- benchmarks: latest-wins, gap rule, trend gate ---------- */
function internalSeriesFor(P,metric){
  /* the pt-7 brief's gap rule reads EXACTLY these two event types */
  const out=[];
  P.finKpis.forEach(r=>{ if(r.metric===metric) out.push({at:r.at,value:r.value,type:'fin.kpi.logged',_ev:r._ev}); });
  P.productMetrics.forEach(r=>{ if(r.name===metric) out.push({at:r.at,value:r.value,type:'product.metric.logged',_ev:r._ev}); });
  out.sort((a,b)=>(a.at-b.at)||(a.type<b.type?-1:1)); /* fin first on ties — deterministic, printed */
  return out;
}
function benchmarkCompare(P){
  const set=LeadOS.engine.settings(P), minP=set.trendMinPeriods;
  return Object.keys(P.benchmarkByMetric||{}).sort().map(m=>{
    const logs=P.benchmarkByMetric[m];
    const bench=logs[logs.length-1]; /* latest-wins by append order */
    const series=internalSeriesFor(P,m);
    const base={metric:m,benchmark:{value:bench.value,unit:bench.unit,source:bench.source,period:bench.period,type:bench.type||null,at:bench.at,_ev:bench._ev},
      benchmarksLogged:logs.length,series:series};
    if(!series.length) return Object.assign(base,{comparable:false,
      status:'no internal series for '+m+' (no fin.kpi.logged / product.metric.logged of that name) — comparison not inferred'});
    const last=series[series.length-1];
    const threshold=0.8*bench.value;
    const delta=bench.value-last.value;
    const pct=bench.value!==0?last.value/bench.value:null;
    let trend;
    if(series.length>=minP){
      const sl=U.slope(series.map(x=>x.value));
      trend={claimed:true,slope:U.rd3(sl),points:series.length,
        why:'slope '+U.rd3(sl)+' per point over '+series.length+' measured points (≥ trendMinPeriods '+minP+')'};
    } else {
      trend={claimed:false,points:series.length,
        why:'only '+series.length+' measured point(s) < trendMinPeriods '+minP+' — no trend claimed (printed why)'};
    }
    return Object.assign(base,{comparable:true,last:last,threshold:threshold,delta:delta,ratio:pct,
      gapFires:last.value<=threshold,trend:trend});
  });
}

/* ---------- INSIGHTS — spec shape, verbatim ---------- */
function buildInsights(P,today,findings,clus,pats,benches){
  const out=[];

    return {k:k,e:(typeof f.evidenceAt==='number')?f.evidenceAt:null,s:f.sev||null,c:f.conf||null}; }));

  /* kind: cluster */
  clus.list.forEach(c=>{

    if(!promoted) return; /* stays visible as a below-the-line correlation */
    out.push({
      id:'insight:cluster:'+c.id,
      kind:'cluster',
      title:c.pattern,
      body:[c.confWhy,'members: '+c.findings.join(', '),
        PROMO+' — this cluster: sev '+c.severity+', '+c.findings.length+' members, '+c.domains.length+' domain(s)'].join('\n'),
      findingKeys:c.findings.slice(),
      severity:c.severity,
      play:'playbook:'+c.domains[0],
      suppressedBy:null,
      _fp:'fp1:'+fpFindings(c.findings)

  });
  /* kind: pattern */
  pats.active.forEach(p=>{
    const keys=U.uniq([].concat.apply([],p.members.map(m=>m.keys))).sort();
    const lines=[p.narrative,'',p.confWhy,
      'requires: '+p.requires.join(' · ')+' — every limb verified against active findings at read time'];
    if(p.sharedPerson!==undefined&&p.sharedPerson!==null)
      lines.push('shared-subject check (G34): all person-resolvable limbs point to '+p.sharedPerson);
    else if(p.sharedPerson===null)
      lines.push('shared-subject check (G34): no limb resolves a person — org-level read, printed, not inferred');
    p.members.forEach(m=>lines.push('  '+m.rule+': '+m.count+' finding(s) ['+m.keys.join(', ')+']'));
    if(p.window){ lines.push('window limb ('+p.window.days+'d, evaluated as a printed sub-claim):');
      p.window.limbs.forEach(l=>lines.push('  '+l.line));
      if(!p.window.ok) lines.push('  → window NOT fully fresh — the pattern still fired on rule presence; the staleness is disclosed, never suppressed'); }
    p.notes.forEach(n=>lines.push(n));
    out.push({
      id:'insight:pattern:'+p.name,
      kind:'pattern',
      title:p.name.toLowerCase().replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase()),
      body:lines.join('\n'),
      findingKeys:keys,
      severity:p.sev,
      play:'interactive:'+p.play,
      suppressedBy:null,
      _fp:'fp1:'+fpFindings(keys)
    });
  });
  /* kind: benchmark-gap — the pt-7 trigger, verbatim */
  benches.forEach(b=>{
    if(!b.comparable||!b.gapFires) return;
    const bench=b.benchmark, last=b.last;
    const pctTxt=b.ratio===null?'n/a (benchmark is 0)':U.rd(b.ratio*100,1)+'%';
    out.push({
      id:'insight:benchmark-gap:'+b.metric,
      kind:'benchmark-gap',
      title:'Benchmark gap: '+b.metric+' at '+pctTxt+' of benchmark',
      body:['latest internal '+last.value+' ('+last.type+' '+last._ev+', '+U.iso(last.at)+') ≤ 80% of benchmark '+bench.value+' (0.8 × '+bench.value+' = '+U.rd3(b.threshold)+') → fires',
        'the gap: '+bench.value+' − '+last.value+' = '+U.rd3(b.delta)+(b.ratio===null?'':' ('+U.rd((1-b.ratio)*100,1)+'% of the benchmark)'),
        'benchmark: '+bench.value+' '+(bench.unit||'')+' · source "'+bench.source+'" · period '+bench.period+(bench.type?' · type '+bench.type:'')+' ('+(bench._ev||'?')+') — benchmark source PRINTED, NOT verified by LeadOS',
        'reads the benchmark as a target the metric should reach; for lower-is-better metrics this reading is inverted — a printed assumption, not inferred away',
        'conf MEDIUM'].join('\n'),
      findingKeys:[],
      severity:BENCH_GAP_SEV,
      play:last.type==='product.metric.logged'?'playbook:product':'playbook:finance',
      suppressedBy:null,
      _fp:'fp1:'+JSON.stringify({v:last.value,va:last.at,b:bench.value})
    });
  });
  out.sort((a,b)=>(b.severity-a.severity)||(a.id<b.id?-1:1));
  /* suppression by event — insight.acknowledged suppresses per read and stays audited.
     pt-10: fingerprinted acks suppress ONLY while constituents are identical;
     a changed state resurfaces the insight and keeps the stale ack visible. */
  const ackMap=P.insightAcks||{};
  const active=[], suppressed=[];
  out.forEach(i=>{
    const ack=ackMap[i.id];
    if(!ack){ active.push(i); return; }
    const legacy=!ack.fingerprint;
    if(legacy||ack.fingerprint===i._fp){
      i.suppressedBy=ack._ev||'(event id unavailable)'; i._ackNote=ack.note; i._ackAt=ack.at;
      if(legacy) i._legacyAck=true;
      suppressed.push(i);
    } else {
      i._staleAck={at:ack.at,note:ack.note,_ev:ack._ev,fingerprint:ack.fingerprint};
      active.push(i);
    }
  });
  const orphanAcks=Object.keys(ackMap).filter(id=>!out.some(i=>i.id===id))
    .map(id=>Object.assign({insightId:id},ackMap[id])).sort((a,b)=>a.insightId<b.insightId?-1:1);
  return {all:out,active:active,suppressed:suppressed,orphanAcks:orphanAcks,promotionRule:PROMO};
}

/* ============ ORGANIZATIONAL NETWORK ANALYSIS (pt-12) ====================
   EVERY output here is an APPROXIMATION DERIVED FROM YOUR OBSERVATIONS, not a
   sociometric study: the graph is only the edges you bothered to log. Each
   algorithm prints its own exactness class (exact / approximation). */
const NET_LABEL='approximation derived from YOUR logged observations — not a sociometric study; the graph contains only edges you recorded';
function analyzeNetwork(P,today){
  const set=LeadOS.engine.settings(P);
  const win=set.influenceNetworkDecayDays, decay=set.heatmapDecayFactor;
  const edges=[], dropped=[];
  (P.networkEdges||[]).forEach(e=>{
    const age=U.days(today,e.observed);
    if(age<0||age>win){ dropped.push({from:e.fromId,to:e.toId,type:e.type,ageDays:age,
      why:'observed '+U.iso(e.observed)+' · '+age+'d '+(age<0?'in the future':'> influenceNetworkDecayDays '+win)+' — excluded, stated'}); return; }
    const w=e.strength*Math.pow(decay,age/30);
    edges.push({from:e.fromId,to:e.toId,type:e.type,strength:e.strength,ageDays:age,weight:w,
      math:'strength '+e.strength+' × '+decay+'^('+age+'/30) = '+U.rd3(w)});
  });
  const nodes=U.uniq([].concat.apply([],edges.map(e=>[e.from,e.to]))).sort();
  const collab=edges.filter(e=>e.type==='collaboration');
  const adjOut={}, adjIn={}, undirected={};
  nodes.forEach(n=>{ adjOut[n]=[]; adjIn[n]=[]; undirected[n]=[]; });
  edges.forEach(e=>{ adjOut[e.from].push(e.to); adjIn[e.to].push(e.from);
    if(undirected[e.from].indexOf(e.to)===-1) undirected[e.from].push(e.to);
    if(undirected[e.to].indexOf(e.from)===-1) undirected[e.to].push(e.from); });
  const indegree=n=>(adjIn[n]||[]).length;
  const outdegree=n=>(adjOut[n]||[]).length;
  const weightedIn=n=>U.sum(edges.filter(e=>e.to===n).map(e=>e.weight));
  const weightedOut=n=>U.sum(edges.filter(e=>e.from===n).map(e=>e.weight));
  /* betweenness — SIMPLIFIED: BFS shortest paths per ordered pair, counting
     interior nodes on ONE shortest path per pair. Not exact Brandes (which
     credits all shortest paths fractionally). LABELED. */
  const bet={}; nodes.forEach(n=>{ bet[n]=0; });
  nodes.forEach(src=>{
    const prev={}, seen={}; seen[src]=true; let q=[src];
    while(q.length){ const nq=[];
      q.forEach(u=>(adjOut[u]||[]).forEach(v=>{ if(!seen[v]){ seen[v]=true; prev[v]=u; nq.push(v); } }));
      q=nq; }
    nodes.forEach(dst=>{ if(dst===src||!seen[dst]) return;
      let cur=prev[dst];
      while(cur!==undefined&&cur!==src){ bet[cur]++; cur=prev[cur]; } });
  });
  const betweenness=n=>bet[n]||0;
  const betRank=nodes.slice().sort((a,b)=>(bet[b]-bet[a])||(a<b?-1:1));
  const isolates=()=>{
    const touched={}; collab.forEach(e=>{ touched[e.from]=true; touched[e.to]=true; });
    return Object.keys(P.networkNodes||{}).concat(Object.keys(P.rosterById||{}))
      .filter((n,i,arr)=>arr.indexOf(n)===i).filter(n=>!touched[n]).sort();
  };
  /* Tarjan SCC over the collaboration subgraph — EXACT, O(V+E) */
  function stronglyConnected(){
    const cAdj={}; const cNodes=U.uniq([].concat.apply([],collab.map(e=>[e.from,e.to]))).sort();
    cNodes.forEach(n=>{ cAdj[n]=[]; });
    collab.forEach(e=>{ if(cAdj[e.from].indexOf(e.to)===-1) cAdj[e.from].push(e.to); });
    let idx=0; const index={},low={},onStack={},stack=[],out=[];
    function strong(v){
      index[v]=idx; low[v]=idx; idx++; stack.push(v); onStack[v]=true;
      (cAdj[v]||[]).forEach(w=>{
        if(index[w]===undefined){ strong(w); low[v]=Math.min(low[v],low[w]); }
        else if(onStack[w]) low[v]=Math.min(low[v],index[w]); });
      if(low[v]===index[v]){ const comp=[]; let w;
        do{ w=stack.pop(); onStack[w]=false; comp.push(w); }while(w!==v);
        out.push(comp.sort()); }
    }
    cNodes.forEach(n=>{ if(index[n]===undefined) strong(n); });
    return out.sort((a,b)=>(b.length-a.length)||(a[0]<b[0]?-1:1));
  }
  /* bridges — SIMPLIFIED: articulation NODES on the undirected projection,
     found by removal-and-reachability. Labeled; not Tarjan bridge-edges. */
  function reachableCount(skip){
    const ns=nodes.filter(n=>n!==skip);
    if(!ns.length) return 0;
    const seen={}; let q=[ns[0]]; seen[ns[0]]=true; let c=1;
    while(q.length){ const nq=[];
      q.forEach(u=>(undirected[u]||[]).forEach(v=>{ if(v!==skip&&!seen[v]){ seen[v]=true; c++; nq.push(v); } }));
      q=nq; }
    return c;
  }
  function bridges(){
    const whole=nodes.length?reachableCount(null):0;
    const connectedWhole=(whole===nodes.length);
    return nodes.filter(n=>{
      if(!connectedWhole) { /* already fragmented: a node still bridges if removing it adds a fragment */ }
      const before=nodes.length-1;
      return before>1&&reachableCount(n)<before;
    }).sort();
  }
  const blockedPairs=(P.pipelineChecks||[]).filter(c=>c.blocked===true);
  function informationBottlenecks(){
    const top=betRank.filter(n=>bet[n]>0);
    const half=top.length?bet[top[0]]/2:0;
    return top.filter(n=>bet[n]>=half&&blockedPairs.some(c=>c.from===n||c.to===n))
      .map(n=>({node:n,betweenness:bet[n],
        blocked:blockedPairs.filter(c=>c.from===n||c.to===n).map(c=>c.from+'→'+c.to+' ("'+c.topic+'")'),
        why:'betweenness '+bet[n]+' (top half of non-zero) AND blocked info.pipeline.check through them — '+NET_LABEL}));
  }
  const scc=stronglyConnected();
  return {
    label:NET_LABEL,
    decayNote:'edge weight = strength × '+decay+'^(age_days/30); window influenceNetworkDecayDays '+win+'d',
    windowDays:win,decayFactor:decay,
    nodes:nodes,edges:edges,droppedEdges:dropped,
    nodeCount:nodes.length,edgeCount:edges.length,
    indegree:indegree,outdegree:outdegree,weightedIn:weightedIn,weightedOut:weightedOut,
    betweenness:betweenness,betweennessRank:betRank,betweennessAll:bet,
    betweennessNote:'SIMPLIFIED: one BFS shortest path per ordered pair, interior nodes credited. NOT exact Brandes — labeled approximation',
    isolates:isolates,stronglyConnected:()=>scc,clusters:()=>scc.filter(c=>c.length>1),
    sccNote:'Tarjan over the collaboration subgraph — EXACT, O(V+E)',
    bridges:bridges,bridgesNote:'SIMPLIFIED: articulation NODES on the undirected projection (remove-and-count-reachable), not Tarjan bridge-edges — labeled approximation',
    informationBottlenecks:informationBottlenecks
  };
}
/* Culture scoring — a COMPOSITE OBSERVATION, never a measurement. */
const CULTURE_NEG_WEIGHT=2;
const CULTURE_WEIGHT_WHY='value-violated and villain-named carry 2× weight — a PRINTED ASSUMPTION from organizational-psychology literature (bad signals are stickier than good ones), NOT a coefficient measured in your org';
function scoreCulture(P,today,windowOverride){
  const set=LeadOS.engine.settings(P);
  const win=windowOverride||set.cultureSignalWindowDays;
  const since=today-win*DAY;
  const sig=(P.cultureSignals||[]).filter(s=>s.at<=today&&s.at>since);
  const heavy=t=>(t==='value-violated'||t==='villain-named');
  let pos=0,neg=0,neu=0,total=0;
  const terms=[], byType={};
  sig.forEach(s=>{
    const w=heavy(s.type)?CULTURE_NEG_WEIGHT:1;
    byType[s.type]=byType[s.type]||{positive:0,negative:0,neutral:0,count:0};
    byType[s.type][s.polarity]++; byType[s.type].count++;
    if(s.polarity==='positive') pos+=w; else if(s.polarity==='negative') neg+=w; else neu+=w;
    total+=w;
    terms.push(s.type+' ('+s.polarity+') × '+w+(heavy(s.type)?' [2× weight]':''));
  });
  if(!total) return {score:null,count:0,window:win,
    why:'no culture.signal events in the last '+win+'d — no score computed; absence is printed, never scored as neutral-good',
    byType:byType,label:'composite observation, not a measurement',weightWhy:CULTURE_WEIGHT_WHY};
  const raw=(pos-neg)/total*10;
  const score=U.clamp(raw,0,10);
  return {score:U.rd(score,2),raw:U.rd(raw,2),clamped:raw!==score,
    positiveWeighted:pos,negativeWeighted:neg,neutralWeighted:neu,totalWeighted:total,
    count:sig.length,window:win,byType:byType,terms:terms,
    math:'(positive '+pos+' − negative '+neg+') ÷ total '+total+' × 10 = '+U.rd(raw,2)+(raw!==score?' → clamped to '+U.rd(score,2)+' (bounded 0–10)':''),
    label:'composite observation, not a measurement',weightWhy:CULTURE_WEIGHT_WHY};
}
/* Meeting load — straight arithmetic over meeting.logged. */

      p.minutes+=m.duration_min; p.count++;

    return p; });

    distribution:{decision:pct('decision'),update:pct('update'),discussion:pct('discussion'),wasted:pct('wasted')},

function anchoringPattern(P,today){

  const rows=[], hits=[];

    const miss=Math.abs(prev.forecast-prev.actual)/Math.abs(prev.actual);
    const drift=Math.abs(cur.forecast-prev.forecast)/Math.abs(prev.forecast||1);
    const anchored=(miss>0.15&&drift<0.05);
    const row={period:cur.period,prevPeriod:prev.period,prevForecast:prev.forecast,prevActual:prev.actual,
      curForecast:cur.forecast,missPct:U.rd(miss*100,1),driftPct:U.rd(drift*100,1),anchored:anchored,
      line:prev.period+': forecast '+prev.forecast+' vs actual '+prev.actual+' = '+U.rd(miss*100,1)+'% miss → next forecast '+cur.forecast+' moved only '+U.rd(drift*100,1)+'%'};

  if(!list.length) return {claimed:false,label:OWN_BOOKS,why:'no fin.allocation.decision events'};
  const latest=list[list.length-1], prev=list[list.length-2]||null;
  const buckets=(latest.allocations||[]).map(a=>({bucket:a.bucket,amount:a.amount,
    pct:latest.total_budget?U.rd(a.amount/latest.total_budget*100,1):(a.pct_of_total||null),
    rationale:a.rationale||''}));
  const top=buckets.slice().sort((a,b)=>(b.pct||0)-(a.pct||0))[0]||null;
  let stability=null,stabilityMath='no prior allocation to compare against';
  if(prev){
    const prevMap={}; (prev.allocations||[]).forEach(a=>{ prevMap[a.bucket]=latest.total_budget?a.amount/(prev.total_budget||1)*100:0; });
    const shifts=buckets.map(b=>Math.abs((b.pct||0)-(prevMap[b.bucket]||0)));
    stability=U.rd(U.sum(shifts)/(shifts.length||1),1);
    stabilityMath='mean absolute shift per bucket vs '+prev.period+' = '+stability+'pp';
  }
  const unreviewed=(P.unreviewedCapex||[]).filter(c=>U.days(today,c.loggedAt)>90);
  return {claimed:true,label:OWN_BOOKS,
    period:latest.period,totalBudget:latest.total_budget,boardApproved:latest.board_approved,
    buckets:buckets,top:top,
    concentrationWhy:top?('top bucket "'+top.bucket+'" is '+top.pct+'% of a '+latest.total_budget+' budget — concentration is sometimes exactly right; it is always a risk worth naming'):'no buckets logged',
    stability:stability,stabilityMath:stabilityMath,

/* ---------- G-suite (live store) ---------- */
function runG(){
  const G=[];
  let raw=null,loadErr=null;
  try{ raw=LeadOS.store.exportRaw()||LeadOS.store.load(); }catch(e){ loadErr=e; }
  G.push(check('G1','exactly one localStorage key: leados:data',()=>{
    const keys=[]; for(let i=0;i<localStorage.length;i++) keys.push(localStorage.key(i));
    return eq(keys.sort(),['leados:data'])?{ok:true,why:'keys: '+keys.join(', ')}:{why:'unexpected keys: '+keys.join(', ')};
  }));
  G.push(check('G2','schema v6 · lineage pt · root/meta whitelists',()=>{
    if(loadErr) return {why:'store load threw: '+loadErr.message};
    if(!raw) return {why:'no raw store'};
    if(raw.schemaVersion!==LeadOS.store.SCHEMA_VERSION||raw.meta.lineage!=='pt') return {why:'schema '+raw.schemaVersion+' lineage '+raw.meta.lineage};
    const rootBad=Object.keys(raw).filter(k=>LeadOS.store.RAW_ROOT_WHITELIST.indexOf(k)===-1);
    const metaBad=Object.keys(raw.meta).filter(k=>LeadOS.store.META_WHITELIST.indexOf(k)===-1);
    if(rootBad.length||metaBad.length) return {why:'foreign keys root['+rootBad+'] meta['+metaBad+'] — derived data persisted?'};
    return {ok:true,why:'v'+raw.schemaVersion+' · pt · whitelists clean'};
  }));
  G.push(check('G3','append-only integrity: seq, ids, uniqueness',()=>{
    if(!raw) return {why:'no raw store'};
    const evts=raw.events, ids={};
    for(let i=0;i<evts.length;i++){ const e=evts[i];
      if(e.seq!==i+1) return {why:'seq break at index '+i+' (seq '+e.seq+')'};
      if(e.id!==pad(i+1)) return {why:'id mismatch at seq '+(i+1)+': '+e.id};
      if(ids[e.id]) return {why:'duplicate id '+e.id}; ids[e.id]=true;
      if(!LeadOS.events.REGISTRY[e.type]) return {why:'event '+e.id+' has unregistered type '+e.type};
      const v=LeadOS.events.validate(e.type,e.payload||{});
      if(!v.ok) return {why:'event '+e.id+' ('+e.type+') fails validation now: '+v.errors[0]}; }
    return {ok:true,why:evts.length+' events · seq/id chain intact · all registry-valid'};
  }));
  G.push(check('G4','every settings.changed key is a known default key',()=>{
    if(!raw) return {why:'no raw store'};
    const bad=raw.events.filter(e=>e.type==='settings.changed'&&!(e.payload.key in LeadOS.store.ALL_SETTING_DEFAULTS));
    return bad.length?{why:'unknown setting keys: '+bad.map(e=>e.payload.key).join(', ')}:{ok:true,why:'all setting keys known'};
  }));
  G.push(check('G5','migration repair accounting reconstructible from the log',()=>{
    if(!raw) return {why:'no raw store'};
    const byMig={};
    raw.events.forEach(e=>{ if(e.meta&&e.meta.repair&&e.meta.migration) byMig[e.meta.migration]=(byMig[e.meta.migration]||0)+1; });
    const recorded=raw.meta.migrationRepairs||{};
    for(const m of Object.keys(recorded)) if((byMig[m]||0)!==recorded[m]) return {why:'migration '+m+' recorded '+recorded[m]+' but log has '+(byMig[m]||0)+' repair events'};
    for(const m of Object.keys(byMig)) if(recorded[m]===undefined) return {why:'log has repairs for '+m+' but meta records none'};
    return {ok:true,why:'every recorded repair count == repair events in the log'};
  }));
  let P=null;
  G.push(check('G6','live projection purity: two folds identical',()=>{
    if(!raw) return {why:'no raw store'};
    P=LeadOS.engine.project(raw.events);
    const P2=LeadOS.engine.project(raw.events);
    return U.deepEq(P,P2)?{ok:true,why:'folds identical, nothing cached'}:{why:'folds diverged'};
  }));
  G.push(check('G7','live run: strict 5-key contract · findings valid · zero engine faults',()=>{
    if(!P) return {why:'no projection (see G6)'};
    const r=LeadOS.rules.run(P,Date.now());
    const keys=Object.keys(r).sort();
    if(JSON.stringify(keys)!==JSON.stringify(['engErrors','findings','heatmap','insights','suppressedCount']))
      return {why:'contract keys wrong: '+keys.join(', ')};
    if(!Array.isArray(r.findings)||typeof r.suppressedCount!=='number'||!Array.isArray(r.engErrors))
      return {why:'contract field types wrong'};
    if(r.engErrors.length) return {why:'engine fault live: '+r.engErrors[0].rule+': '+r.engErrors[0].message};
    const fs=r.findings;
    for(const f of fs){
      if(!f.rule||typeof f.sev!=='number'||f.sev<1||f.sev>5) return {why:'bad sev on '+f.key};
      if(['HIGH','MEDIUM','LOW'].indexOf(f.conf)===-1) return {why:'bad conf on '+f.key};
      if(!f.basis.length) return {why:'empty basis on '+f.key};
      if(!f.title) return {why:'missing title on '+(f.key||'?')}; }
    const fkeys=fs.map(f=>f.key), dup=fkeys.filter((k,i)=>fkeys.indexOf(k)!==i);
    if(dup.length) return {why:'duplicate finding keys: '+U.uniq(dup).join(', ')};
    return {ok:true,why:fs.length+' findings · '+r.suppressedCount+' suppressed · 0 engine faults · contract exact'};

  }));

const CV=()=>LeadOS.conversations;

const convHistory=(P,ids)=>{

};

  prefill(R,P,now,draft){
    draft=draft||{};

    const lines=[];
    if(!did){ lines.push('no decisions in the log — log one first (decision.logged)'); return lines; }
    const d=(P.decisions||{})[did];
    lines.push('decision '+did+(d?': '+d.title+' · logged '+U.iso(d.at)+(d.decided?' · DECIDED "'+d.choice+'"':' · still open'):''));
    const s=DEC().buildScenario(did,P);
    if(!s.scenarios.length){ lines.push(s.status); return lines; }
    lines.push('expected value per scenario:');
    s.scenarios.forEach(x=>lines.push('  '+x.name+': '+x.math+' (cost if true '+x.cost+')'));
    if(s.probabilityWarning) lines.push('  ! '+s.probabilityWarning);
    lines.push('minimax regret ('+s.regretLabel+'):');
    s.regret.forEach(r=>{ r.cells.forEach(c=>lines.push('  '+c.math)); lines.push('  → max regret for '+r.name+': '+r.maxRegret); });
    if(s.minimaxChoice) lines.push('minimax choice (lowest worst-case regret): '+s.minimaxChoice.name);
    lines.push('highest EV: '+s.recommended.name+' at '+s.recommended.ev);
    if(s.sensitivity) lines.push('sensitivity: '+s.sensitivity.formula+' → '+s.sensitivity.math+' · '+s.sensitivity.note);

  },

function prepHtml(prep){
  if(!prep) return '';
  if(prep.icf) return '<div class="basis">'+
    prep.icf.map(r=>'<div><b>'+r[0]+'</b> — '+esc(r.slice(1).join('  ||  '))+'</div>').join('')+
    '<div class="lbl">'+esc(prep.note)+'</div></div>';
  if(prep.line!==undefined&&prep.zopa!==undefined) return '<div class="basis"><div><b>'+esc(prep.line)+'</b></div>'+
    (prep.caveat?'<div class="lbl">'+esc(prep.caveat)+'</div>':'')+'</div>';
  if(prep.unknown) return '<div class="basis"><div>'+esc(prep.note)+'</div></div>';
  const kv=(k,v)=>'<div><b>'+k+'</b> '+esc(v)+'</div>';
  let h='<div class="basis">';
  h+=kv('opening →',prep.opening_line);
  h+='<div class="lbl">'+esc(prep.opening_note)+'</div>';
  h+=kv('their likely response →',prep.their_likely_response);
  h+='<div class="lbl">'+esc(prep.their_likely_note)+'</div>';
  (prep.your_reframes||[]).forEach(r=>{ h+='<div>if they say: "'+esc(r.ifTheySay)+'" → you say: "'+esc(r.youSay)+'"</div>'; });
  (prep.non_negotiables||[]).forEach(n=>{ h+=kv('non-negotiable ·',n); });
  if(prep.BATNA_check) h+=kv('BATNA check ·',prep.BATNA_check);
  else if(prep.BATNA_note) h+='<div class="lbl">'+esc(prep.BATNA_note)+'</div>';
  if(prep.model){ h+=kv('model ·',prep.model.id+' ('+prep.model.for+')');
    prep.model.limbs.forEach(l=>{ h+='<div>   '+l[0]+' — '+esc(l[1])+'</div>'; });
    if(prep.model_source) h+='<div class="lbl">'+esc(prep.model_source)+'</div>'; }
  if(prep.negotiationStyle) h+=kv('default negotiation style ·',prep.negotiationStyle);
  (prep.styles||[]).forEach(s=>{ h+=kv('style · '+s.personId+' →',(s.known?s.label+': '+s.notes:s.notes)); });
  (prep.debrief_questions||[]).forEach((q,i)=>{ h+=kv('debrief Q'+(i+1)+' ·',q); });
  h+='</div>';
  return h;
}
function playRunnerHtml(ctx,id){
  const spec=LeadOS.playbooks.INTERACTIVE[id];

  const gated=!spec.free&&!!spec.pattern;
  const on=!gated||ctx.R.patterns.active.some(p=>p.name===spec.pattern);
  const draft=ui.playDraft||{};

  let lines=[];
  try{ lines=spec.prefill(ctx.R,ctx.P,ctx.now,draft)||[]; }
  catch(e){ lines=['prefill threw: '+e.message+' — printed, not hidden']; }
  const fields=spec.fields(ctx.R,ctx.P);
  const fieldHtml=fields.map(fd=>{
    const lab='<label>'+esc(fd.label)+(fd.req?' *':'')+'</label>';
    const dv=draft[fd.key];
    if(fd.kind==='textarea') return '<div class="full">'+lab+'<textarea rows="3" data-pf="'+fd.key+'" data-kind="textarea">'+esc(dv||'')+'</textarea></div>';
    if(fd.kind==='yn') return '<div>'+lab+'<select data-pf="'+fd.key+'" data-kind="yn"><option value="">—</option>'+
      ['Y','N'].map(o=>'<option'+(dv===o?' selected':'')+'>'+o+'</option>').join('')+'</select></div>';
    if(fd.kind==='select') return '<div>'+lab+'<select data-pf="'+fd.key+'" data-kind="text"><option value="">—</option>'+
      (fd.options||[]).map(o=>'<option value="'+esc(o.value)+'"'+(dv===o.value?' selected':'')+'>'+esc(o.label)+'</option>').join('')+'</select></div>';
    if(fd.kind==='number') return '<div>'+lab+'<input type="number" step="any" data-pf="'+fd.key+'" data-kind="number" value="'+esc(dv===undefined?'':dv)+'"></div>';
    if(fd.kind==='date') return '<div>'+lab+'<input type="date" data-pf="'+fd.key+'" data-kind="date"></div>';
    if(fd.kind==='checks') return '<div class="full">'+lab+'<div style="display:flex;flex-direction:column;gap:5px;margin-top:4px">'+
      (fd.options&&fd.options.length?fd.options.map(o=>'<label style="display:flex;gap:8px;align-items:center;text-transform:none;letter-spacing:0;font-size:12px;color:var(--ink2)"><input type="checkbox" style="width:auto" data-pf="'+fd.key+'" value="'+esc(o.value)+'"> '+esc(o.label)+'</label>').join(''):'<span class="muted small">(none available — printed absence)</span>')+'</div></div>';
    return '<div>'+lab+'<input data-pf="'+fd.key+'" data-kind="text" value="'+esc(dv||'')+'"></div>';
  }).join('');
  let live='';
  if(spec.live){
    let lv=null;
    try{ lv=spec.live(draft,ctx.R,ctx.P); }catch(e){ lv=null; }
    live=lv?('<div class="sect" style="margin-top:16px"><h2>Live preparation</h2><span class="meta">regenerates as you type · '+esc(LeadOS.conversations.SCAFFOLD)+'</span></div>'+prepHtml(lv))
      :'<div class="formnote">Live preparation appears once the required fields are filled.</div>';
  }
  return '<div class="card" style="border-left:3px solid var(--accent);margin-bottom:18px">'+
    '<h3>'+esc(spec.title)+'</h3><div class="mono small muted">'+id+' · '+(gated?'gates on pattern '+spec.pattern:'always available (no pattern gate)')+' · emits event specs only — you review before anything is appended</div>'+

    (spec.notes||[]).map(n=>'<div class="callout" style="margin-top:12px">'+icon('alert')+'<div>'+esc(n)+'</div></div>').join('')+
    '<div class="sect" style="margin-top:16px"><h2>Prefill — read from the log</h2></div>'+
    '<div class="basis">'+lines.map(l=>'<div>'+esc(l)+'</div>').join('')+'</div>'+
    (on?'':'<div class="callout" style="margin-top:12px">'+icon('alert')+'<div>PATTERN '+esc(spec.pattern)+' IS NOT ACTIVE at read time — submission disabled; the prefill above shows what it would address, printed, not hidden.</div></div>')+
    '<div class="fgrid">'+fieldHtml+'</div>'+
    live+
    '<div style="margin-top:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">'+
      '<button class="btn sm" data-act="playsubmit" data-id="'+id+'"'+(on?'':' disabled style="opacity:.45;cursor:not-allowed"')+'>'+icon('check',13)+' review & append events</button>'+
      '<button class="btn ghost sm" data-act="playcancel">close runner</button>'+
      '<span class="formnote" style="display:inline">Nothing is written until you confirm the exact event specs.</span></div></div>';
