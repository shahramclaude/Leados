<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LeadOS · Leadership workspace</title>
    <meta
      name="description"
      content="LeadOS is a local-first leadership workspace: 1:1s, 30-60-90 onboarding scaffolding, timely SBI feedback, co-authored goals, outcome delegation with decision authority, evidence-backed performance reviews, GROW development, anonymous pulse, decisions, succession and conflict resolution with voluntary participation, owned commitments and verified follow-up. The browser copy can be encrypted with a passphrase."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0f2b28" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f2b28'/%3E%3Cpath d='M20 46V18h6v22h18v6z' fill='%237fd1b9'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./app/styles.css" />
    <meta name="application-name" content="LeadOS" />
    <meta name="leados-build" content="2026-10-25 · schema 6 · 30-60-90 onboarding milestone tracker, optional passphrase encryption (AES-256-GCM), longitudinal health trends, dated snapshots, safe CSV export and printable 1:1 prep sheets" />
  </head>
  <body>
    <a class="skip-link" href="#view">Skip to content</a>

    <div class="app">
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">L</span>
          <span class="brand-text">
            <span class="brand-name">LeadOS</span>
            <span class="brand-tag">Leadership workspace</span>
          </span>
        </div>
        <nav id="sidebar-nav" aria-label="Sections"><!-- rendered by app/main.js --></nav>
        <div class="sidebar-foot">
          <p class="sidebar-note">
            Records stay local unless you export. No account, application backend or telemetry.
          </p>
          <a class="sidebar-link" href="#/settings">Export or import your data</a>
        </div>
      </aside>

      <div class="main">
        <header class="topbar">
          <button class="nav-toggle" id="nav-toggle" type="button" aria-expanded="false" aria-controls="sidebar">
            <span aria-hidden="true">☰</span><span class="sr-only">Show navigation</span>
          </button>
          <div class="topbar-inner">
            <div id="topbar-meta" class="topbar-slot"><!-- rendered --></div>
            <div class="topbar-actions">
              <a class="btn btn-tiny btn-ghost" href="#/insights">Signals</a>
              <a class="btn btn-tiny btn-primary" href="#/oneonones">Log a 1:1</a>
            </div>
          </div>
        </header>

        <main id="view" class="view" tabindex="-1">
          <noscript>
            <div class="card">
              <h1 class="page-title">LeadOS needs JavaScript</h1>
              <p class="muted">
                This app runs entirely in your browser. Enable JavaScript for this page and reload — your data is
                stored locally and is not affected.
              </p>
            </div>
          </noscript>
        </main>
      </div>
    </div>

    <div id="modal-root"></div>
    <div id="toast-root" class="toast-root"></div>

    <script type="module" src="./app/main.js"></script>
  </body>
</html>
