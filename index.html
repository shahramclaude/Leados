<!DOCTYPE html>
<html lang="en" data-theme="obsidian">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeadOS pt-H demo — Emergent Intelligence Architecture (unofficial, single-file)</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style>
  :root[data-theme="obsidian"]{ --bg:#0b0d10; --surface:#14171a; --surface2:#1b1f23; --text:#e6e8ea; --muted:#8a9099; --accent:#5fb3ff; --border:#2a2f35; --sev2:#5fa8d3; --sev3:#d9a441; --sev4:#e2574c; --good:#52b788; }
  :root[data-theme="parchment"]{ --bg:#f4ecd8; --surface:#fbf6ea; --surface2:#efe4c8; --text:#2b2316; --muted:#7a6f55; --accent:#8a5a2b; --border:#d8c9a0; --sev2:#5a7a9a; --sev3:#b5832a; --sev4:#a33327; --good:#3f7d52; }
  :root[data-theme="terminal"]{ --bg:#030603; --surface:#061006; --surface2:#0a1a0a; --text:#39ff6a; --muted:#1f8f3f; --accent:#39ff6a; --border:#145225; --sev2:#39ff6a; --sev3:#e8e24a; --sev4:#ff5555; --good:#39ff6a; }
  *{box-sizing:border-box;}
  body{background:var(--bg); color:var(--text); font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; transition:background .15s,color .15s;}
  [data-theme="terminal"] body, [data-theme="terminal"] *{font-family:"Courier New",monospace !important;}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
  .surface{background:var(--surface); border:1px solid var(--border);}
  .surface2{background:var(--surface2); border:1px solid var(--border);}
  .muted{color:var(--muted);}
  .accent{color:var(--accent);}
  .border-base{border-color:var(--border);}
  a,button{color:inherit;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;}
  .badge{display:inline-flex;align-items:center;gap:.25rem;padding:.1rem .45rem;border-radius:4px;font-size:.68rem;border:1px solid var(--border);}
  .sev2{color:var(--sev2);border-color:var(--sev2);}
  .sev3{color:var(--sev3);border-color:var(--sev3);}
  .sev4{color:var(--sev4);border-color:var(--sev4);}
  .rail-item{display:flex;align-items:center;justify-content:space-between;padding:.4rem .6rem;border-radius:6px;cursor:pointer;font-size:.82rem;}
  .rail-item:hover{background:var(--surface2);}
  .rail-item.active{background:var(--surface2); border-left:2px solid var(--accent); padding-left:calc(.6rem - 2px);}
  .skip-link{position:absolute;left:-999px;top:0;background:var(--accent);color:#000;padding:.5rem 1rem;z-index:100;}
  .skip-link:focus{left:0;}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;}
  .spark{display:flex;align-items:flex-end;gap:2px;height:22px;}
  .spark div{width:4px;background:var(--accent);opacity:.8;}
  .fade-in{animation:fadein .15s ease-out;}
  @keyframes fadein{from{opacity:0;transform:translateY(2px);}to{opacity:1;transform:translateY(0);}}
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:flex;align-items:flex-start;justify-content:center;padding-top:8vh;}
  .kbd{font-family:ui-monospace,monospace;border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;padding:0 .3rem;font-size:.7rem;}
  .contextmenu{position:fixed;z-index:60;min-width:190px;}
  .toast{position:fixed;bottom:16px;right:16px;z-index:70;max-width:340px;}
  .bar-track{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;}
  .bar-fill{height:100%;background:var(--accent);}
  input,select,textarea{background:var(--surface2);border:1px solid var(--border);color:var(--text);}
</style>

<body class="min-h-screen">

<div id="banner-slot"></div>

<div class="flex min-h-screen">
  <nav id="rail" class="w-64 shrink-0 surface p-3 flex flex-col gap-3 min-h-screen" aria-label="Primary navigation"></nav>
  <main id="main" class="flex-1 p-5 max-w-6xl" aria-live="polite"></main>
</div>

<div id="overlay-slot"></div>

<script>
'use strict';
(function(){

/* =========================================================================
   LEADOS pt-H — single-file demo. window.LEADOS (not LeadOS: see docs).
   Storage key leados-pth-demo:data (not leados:data: see docs).
   ========================================================================= */
const LEADOS = window.LEADOS = window.LEADOS || {};
const KEY = 'leados-pth-demo:data';
LEADOS.store = LEADOS.store || {};

/* ---------------- utils ---------------- */
function uid(p){ return p+'-'+Math.random().toString(36).slice(2,9); }
function pad(n,w){ return String(n).padStart(w,'0'); }
function dayUTC(ts){ return Math.floor(new Date(ts).getTime()/86400000); }
function daysBetween(aTs,bTs){ return dayUTC(bTs)-dayUTC(aTs); }
function todayIso(){ return new Date().toISOString(); }
function isoDate(d){ return d.toISOString().slice(0,10); }
function inDaysIso(n){ return isoDate(new Date(Date.now()+n*86400000)); }
function inMonthsIso(n){ const d=new Date(); d.setMonth(d.getMonth()+Math.round(n)); return isoDate(d); }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function fmt1(n){ return (Math.round(n*10)/10).toFixed(1); }
function linSlope(points){
  const n=points.length; if(n<2) return 0;
  const mx=points.reduce((s,p)=>s+p.x,0)/n, my=points.reduce((s,p)=>s+p.y,0)/n;
  let num=0, den=0;
  points.forEach(p=>{ num+=(p.x-mx)*(p.y-my); den+=(p.x-mx)*(p.x-mx); });
  return den===0?0:num/den;
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------------- seed data ---------------- */
const DOMAINS = ['PEOPLE','ENGINEERING','OPS','SALES','FINANCE','STRATEGY','EXTERNAL','RESILIENCE'];
const PEOPLE = [
  { id:'p1', name:'Ana Ruiz',   role:'Eng Manager',      domain:'ENGINEERING', cadenceDays:14 },
  { id:'p2', name:'Cara Smith', role:'Ops Lead',         domain:'OPS',         cadenceDays:14 },
  { id:'p3', name:'Devon Lee',  role:'Sales Lead',       domain:'SALES',       cadenceDays:14 },
  { id:'p4', name:'Priya Patel',role:'Finance Lead',     domain:'FINANCE',     cadenceDays:21 },
  { id:'p5', name:'Sam Okafor', role:'Chief of Staff',   domain:'STRATEGY',    cadenceDays:21 },
  { id:'p6', name:'Jun Park',   role:'Staff Engineer',   domain:'ENGINEERING', cadenceDays:14 }
];
const GOALS = [
  { id:'g1', label:'Ship v2 platform',      domain:'ENGINEERING' },
  { id:'g2', label:'Expand EMEA pipeline',  domain:'SALES' },
  { id:'g3', label:'Improve NPS',           domain:'EXTERNAL' },
  { id:'g4', label:'Reduce infra cost',     domain:'FINANCE' }
];
const PLANS = [
  { id:'pl1', label:'Delegate release owners', domain:'ENGINEERING', owner:'p1' },
  { id:'pl2', label:'SLA improvement plan',    domain:'OPS',         owner:'p2' },
  { id:'pl3', label:'Pricing experiment',      domain:'SALES',       owner:'p3' }
];
const RISKS = [
  { id:'r1', label:'Vendor outage risk',      domain:'RESILIENCE' },
  { id:'r2', label:'Key-person dependency: Ana', domain:'RESILIENCE' }
];
const DEALS = [
  { id:'d1', label:'Acme Corp renewal',   domain:'SALES', owner:'p3' },
  { id:'d2', label:'Globex expansion',    domain:'SALES', owner:'p3' }
];
const ENTITY_LABELS = (()=>{
  const m = {};
  PEOPLE.forEach(p=>m[p.id]={label:p.name, type:'person', domain:p.domain});
  GOALS.forEach(g=>m[g.id]={label:g.label, type:'goal', domain:g.domain});
  PLANS.forEach(p=>m[p.id]={label:p.label, type:'plan', domain:p.domain});
  RISKS.forEach(r=>m[r.id]={label:r.label, type:'risk', domain:r.domain});
  DEALS.forEach(d=>m[d.id]={label:d.label, type:'deal', domain:d.domain});
  return m;
})();

function buildSeedEvents(today){
  const ev = []; let seq = 0;
  function add(daysAgo,type,domain,data){
    const ts = new Date(today.getTime()-daysAgo*86400000).toISOString();
    ev.push({ seq:++seq, ts, type, domain, data: data||{} });
  }
  const cadence = { p1:14,p2:14,p3:14,p4:21,p5:21,p6:14 };
  const lastGap = { p1:20,p2:9,p3:12,p4:6,p5:17,p6:11 }; // intentionally makes Ana (p1) overdue -> R1
  Object.keys(cadence).forEach(pid=>{
    let t = lastGap[pid];
    while(t < 92){ add(t,'oneonone.logged','PEOPLE',{personId:pid}); t += cadence[pid]; }
  });
  const moods = {
    p1:[4,4,3,3,2,2], p2:[3,3,4,4,4,4], p3:[4,4,4,3,4,4],
    p4:[4,4,4,4,5,5], p5:[3,4,4,4,4,5], p6:[4,3,4,4,4,4]
  };
  Object.keys(moods).forEach(pid=>{
    const arr = moods[pid], n = arr.length;
    arr.forEach((m,i)=>{ const daysAgo=(n-1-i)*7+3; add(daysAgo,'pulse.logged','PEOPLE',{personId:pid, mood:m, measured:true}); });
  });
  [75,50,25,8].forEach(d=>add(d,'conflict.logged','PEOPLE',{personId:'p1', withPersonId:'p2'}));
  for(let d=84; d>=0; d-=7) add(d,'sprint.review','ENGINEERING',{sprintId:'s'+d, velocity: 28+((d/7)%3)*3});
  for(let d=88; d>=0; d-=11) add(d,'plan.checkin','ENGINEERING',{planId:'pl1', personId:'p1'});
  for(let d=86; d>=0; d-=12) add(d,'plan.checkin','OPS',{planId:'pl2', personId:'p2'});
  [88,70].forEach(d=>add(d,'plan.checkin','SALES',{planId:'pl3', personId:'p3'})); // stalled -> R30
  for(let d=85; d>=0; d-=15) add(d,'okr.checkin','ENGINEERING',{goalId:'g1', ownerId:'p1'});
  for(let d=80; d>=0; d-=14) add(d,'okr.checkin','SALES',{goalId:'g2', ownerId:'p3'});
  [90,60].forEach(d=>add(d,'okr.checkin','EXTERNAL',{goalId:'g3', ownerId:'p5'})); // silent -> R20
  for(let d=82; d>=0; d-=18) add(d,'okr.checkin','FINANCE',{goalId:'g4', ownerId:'p4'});
  for(let d=84; d>=0; d-=10) add(d,'deal.updated','SALES',{dealId:'d1', ownerId:'p3'});
  [88,60,35].forEach(d=>add(d,'deal.updated','SALES',{dealId:'d2', ownerId:'p3'})); // stalled -> R40
  add(88,'risk.raised','RESILIENCE',{riskId:'r1', ownerId:'p2'});
  add(45,'incident.logged','RESILIENCE',{riskId:'r1', ownerId:'p2'}); // still open -> R50
  add(70,'risk.raised','RESILIENCE',{riskId:'r2', ownerId:'p1'});
  add(60,'risk.resolved','RESILIENCE',{riskId:'r2', ownerId:'p1'});
  for(let d=84; d>=0; d-=30) add(d,'finance.period.logged','FINANCE',{burnMultiple: 22-((84-d)/30)*2});

  ev.sort((a,b)=> new Date(a.ts)-new Date(b.ts));
  return ev.map((e,i)=>({ id:'e-'+pad(i+1,4), seq:i+1, ts:e.ts, type:e.type, domain:e.domain, data:e.data }));
}

/* ---------------- store (append-only, one localStorage key) ---------------- */
function freshMeta(){
  return {
    createdAt: todayIso(),
    viewHistory: {},       // view -> count   (persisted; brief did not specify storage, disclosed choice: localStorage)
    commandHistory: {},    // command id -> count (persisted; same disclosure)
    usageLog: [],          // {ts, view, bucket}  capped 500, persisted
    sessionLog: [],        // iso timestamps of session starts, persisted
    attentionHeatmap: {},  // domain -> decayed ms, persisted roll-up of sessionStorage attention (see docs)
    layoutPins: {},        // navId -> desired index
    layout: null           // last generated layout summary, for change-detection banner
  };
}
function seedStore(){
  const today = new Date();
  return {
    schemaVersion: 1,
    lineage: 'pt-H-demo',
    meta: freshMeta(),
    people: PEOPLE,
    events: buildSeedEvents(today)
  };
}
let STATE = loadOrSeed();
function loadOrSeed(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ const parsed = JSON.parse(raw); if(parsed && parsed.events && parsed.meta) return parsed; }
  }catch(e){ /* corrupt -> reseed, disclosed */ }
  const s = seedStore(); persist(s); return s;
}
function persist(s){ try{ localStorage.setItem(KEY, JSON.stringify(s)); }catch(e){ /* quota: demo stays in-memory */ } }
function appendEvent(type, domain, data){
  const ev = { id:'e-'+pad(STATE.events.length+1,4), seq: STATE.events.length+1, ts: todayIso(), type, domain, data: data||{} };
  STATE = { ...STATE, events:[...STATE.events, ev] };
  persist(STATE);
  return ev;
}
function updateMeta(patch){
  STATE = { ...STATE, meta: { ...STATE.meta, ...patch } };
  persist(STATE);
}
LEADOS.store = { KEY, getState:()=>STATE, appendEvent, updateMeta, reseed:()=>{ STATE=seedStore(); persist(STATE); } };

/* =========================================================================
   RULE ENGINE — 6 computed rules across domains (not the pasted brief's
   144; see README). Each finding: {rule, domain, entityId, label, sev, title, detail}
   ========================================================================= */
function lastEventFor(events, type, matchFn){
  let last=null;
  events.forEach(e=>{ if(e.type===type && matchFn(e)) { if(!last || new Date(e.ts)>new Date(last.ts)) last=e; } });
  return last;
}
function runEngine(state, today){
  const events = state.events;
  const findings = [];

  // R1: 1:1 cadence overdue
  PEOPLE.forEach(p=>{
    const last = lastEventFor(events,'oneonone.logged', e=>e.data.personId===p.id);
    const gap = last ? daysBetween(last.ts, today) : 999;
    if(gap > p.cadenceDays){
      findings.push({ rule:'R1', domain:'PEOPLE', entityId:p.id, label:p.name, sev:3,
        title:`1:1 overdue — ${p.name}`, detail:`${gap}d since last 1:1 (cadence ${p.cadenceDays}d)` });
    }
  });

  // R7: pulse/burnout trend (linear regression over weekly mood points)
  PEOPLE.forEach(p=>{
    const pts = events.filter(e=>e.type==='pulse.logged' && e.data.personId===p.id && e.data.measured)
      .sort((a,b)=>new Date(a.ts)-new Date(b.ts))
      .map((e,i)=>({x:i,y:e.data.mood}));
    if(pts.length<3) return;
    const slope = linSlope(pts);
    if(slope <= -0.5){
      findings.push({ rule:'R7', domain:'PEOPLE', entityId:p.id, label:p.name, sev:4,
        title:`Burnout trend — ${p.name}`, detail:`mood slope ${fmt1(slope)}/period over ${pts.length} measured pulses` });
    }
  });

  // R20: goal/OKR silent
  GOALS.forEach(g=>{
    const last = lastEventFor(events,'okr.checkin', e=>e.data.goalId===g.id);
    const gap = last ? daysBetween(last.ts, today) : 999;
    if(gap > 21){
      findings.push({ rule:'R20', domain:g.domain, entityId:g.id, label:g.label, sev:3,
        title:`Goal silent — ${g.label}`, detail:`${gap}d since last okr.checkin (threshold 21d)` });
    }
  });

  // R30: plan stalled
  PLANS.forEach(pl=>{
    const last = lastEventFor(events,'plan.checkin', e=>e.data.planId===pl.id);
    const gap = last ? daysBetween(last.ts, today) : 999;
    if(gap > 14){
      findings.push({ rule:'R30', domain:pl.domain, entityId:pl.id, label:pl.label, sev:2,
        title:`Plan stalled — ${pl.label}`, detail:`${gap}d since last plan.checkin (threshold 14d)` });
    }
  });

  // R40: deal stalled
  DEALS.forEach(d=>{
    const last = lastEventFor(events,'deal.updated', e=>e.data.dealId===d.id);
    const gap = last ? daysBetween(last.ts, today) : 999;
    if(gap > 21){
      findings.push({ rule:'R40', domain:d.domain, entityId:d.id, label:d.label, sev:3,
        title:`Deal stalled — ${d.label}`, detail:`${gap}d since last deal.updated (threshold 21d)` });
    }
  });

  // R50: risk open too long (raised, no resolved, >30d)
  RISKS.forEach(r=>{
    const raised = lastEventFor(events,'risk.raised', e=>e.data.riskId===r.id);
    const resolved = lastEventFor(events,'risk.resolved', e=>e.data.riskId===r.id);
    if(raised && (!resolved || new Date(resolved.ts) < new Date(raised.ts))){
      const gap = daysBetween(raised.ts, today);
      if(gap > 30){
        findings.push({ rule:'R50', domain:r.domain, entityId:r.id, label:r.label, sev:4,
          title:`Risk open ${gap}d — ${r.label}`, detail:`raised ${gap}d ago, no risk.resolved logged (threshold 30d)` });
      }
    }
  });

  return findings;
}
LEADOS.engine = { run: runEngine };

/* =========================================================================
   PART 1 — GENERATIVE LAYOUT ENGINE  (LEADOS.layoutGrammar)
   ========================================================================= */
const NAV_ITEMS = [
  { id:'today',       label:'Today',       glyph:'◎', domain:null,         util:true },
  { id:'roster',      label:'Roster',      glyph:'○', domain:'PEOPLE',     util:false },
  { id:'engineering', label:'Engineering', glyph:'◈', domain:'ENGINEERING',util:false },
  { id:'ops',         label:'Ops',         glyph:'◇', domain:'OPS',        util:false },
  { id:'sales',       label:'Sales',       glyph:'◇', domain:'SALES',      util:false },
  { id:'finance',     label:'Finance',     glyph:'◇', domain:'FINANCE',    util:false },
  { id:'strategy',    label:'Strategy',    glyph:'◆', domain:'STRATEGY',   util:false },
  { id:'external',    label:'External',    glyph:'◇', domain:'EXTERNAL',  util:false },
  { id:'resilience',  label:'Resilience',  glyph:'⬡', domain:'RESILIENCE', util:false },
  { id:'intelligence',label:'Intelligence',glyph:'⬡', domain:null,         util:true },
  { id:'forecast',    label:'Forecast',    glyph:'▲', domain:null,         util:true },
  { id:'data',        label:'Data',        glyph:'◫', domain:null,         util:true },
  { id:'health',      label:'Health',      glyph:'✓', domain:null,         util:true }
];
const GROUPS = {
  LEADERSHIP:  ['PEOPLE'],
  FINANCIAL:   ['FINANCE','SALES'],
  OPERATIONAL: ['OPS','ENGINEERING','RESILIENCE'],
  EXTERNAL:    ['STRATEGY','EXTERNAL']
};
const CONFIG_BY_GROUP = { LEADERSHIP:'A', FINANCIAL:'B', OPERATIONAL:'C', EXTERNAL:'D' };
const CONFIG_HEADER = {
  A:'LEADERSHIP HEAVY (people/growth dominate)',
  B:'FINANCIAL HEAVY (finance/sales dominate)',
  C:'OPERATIONAL HEAVY (ops/execution dominate)',
  D:'EXTERNAL HEAVY (market/strategy dominate)',
  E:'BALANCED (no dominant domain > 25%)'
};

function readAttentionHeatmap(){
  // sessionStorage = THIS session's running dwell time per domain.
  try{ return JSON.parse(sessionStorage.getItem('leados-pth-attention')||'{}'); }catch(e){ return {}; }
}
function normalizeMap(m){
  const max = Math.max(0, ...Object.values(m));
  const out = {};
  DOMAINS.forEach(d=> out[d] = max>0 ? (m[d]||0)/max : 0 );
  return out;
}
function analyzeTopology(state, today){
  const events = state.events;
  const findings = runEngine(state, today);
  const findingW = {}, activityW = {};
  DOMAINS.forEach(d=>{ findingW[d]=0; activityW[d]=0; });
  findings.forEach(f=> findingW[f.domain] = (findingW[f.domain]||0) + f.sev);
  events.forEach(e=>{
    if(daysBetween(e.ts, today) <= 30) activityW[e.domain] = (activityW[e.domain]||0) + 1;
  });
  // persisted, decayed roll-up of sessionStorage attention (see README "attention timing" note)
  const attentionW = { ...state.meta.attentionHeatmap };
  DOMAINS.forEach(d=>{ if(!(d in attentionW)) attentionW[d]=0; });

  const nf = normalizeMap(findingW), na = normalizeMap(activityW), nt = normalizeMap(attentionW);
  const domainScore = {};
  DOMAINS.forEach(d=>{ domainScore[d] = 0.4*nf[d] + 0.3*na[d] + 0.3*nt[d]; });

  // feature usage vector
  const typeFreq = {};
  events.forEach(e=> typeFreq[e.type] = (typeFreq[e.type]||0)+1 );
  const topEventType = Object.entries(typeFreq).sort((a,b)=>b[1]-a[1])[0];

  // temporal pattern: bucket session view log by hour-of-day bucket -> top view
  const bucketViewCounts = { morning:{}, afternoon:{}, evening:{} };
  (state.meta.usageLog||[]).forEach(r=>{
    const b = bucketViewCounts[r.bucket]; if(!b) return;
    b[r.view] = (b[r.view]||0)+1;
  });
  const temporalTop = {};
  Object.keys(bucketViewCounts).forEach(b=>{
    const entries = Object.entries(bucketViewCounts[b]).sort((a,b2)=>b2[1]-a[1]);
    temporalTop[b] = entries[0] ? entries[0][0] : null;
  });

  const totalEvents = events.length;
  const domainsTouched = DOMAINS.filter(d=> activityW[d]>0 || findingW[d]>0).length;

  return { domainScore, findingW, activityW, attentionW, typeFreq, topEventType, temporalTop, totalEvents, domainsTouched };
}

function pickConfiguration(topology){
  if(topology.totalEvents < 50 || topology.domainsTouched < 3) return { config:'E', group:null, share:0 };
  const sums = {};
  let grand = 0;
  Object.entries(GROUPS).forEach(([g, members])=>{
    sums[g] = members.reduce((s,d)=> s + topology.domainScore[d], 0);
    grand += sums[g];
  });
  let best=null, bestShare=0;
  Object.entries(sums).forEach(([g,s])=>{
    const share = grand>0 ? s/grand : 0;
    if(share > bestShare){ bestShare = share; best = g; }
  });
  if(best && bestShare > 0.25) return { config: CONFIG_BY_GROUP[best], group:best, share:bestShare };
  return { config:'E', group:best, share:bestShare };
}

function generateLayout(state, today){
  const topology = analyzeTopology(state, today);
  const pick = pickConfiguration(topology);
  const domainItems = NAV_ITEMS.filter(n=>!n.util);
  const utilItems = NAV_ITEMS.filter(n=>n.util && n.id!=='today');

  let ordered = [...domainItems].sort((a,b)=> (topology.domainScore[b.domain]||0) - (topology.domainScore[a.domain]||0));

  // apply pins: an item pinned to position i is placed there, rest fill in generated order
  const pins = state.meta.layoutPins || {};
  const pinned = Object.entries(pins).filter(([id])=> domainItems.some(d=>d.id===id));
  if(pinned.length){
    const withoutPinned = ordered.filter(it => !pins.hasOwnProperty(it.id));
    const result = new Array(ordered.length).fill(null);
    pinned.forEach(([id,pos])=>{
      const item = domainItems.find(d=>d.id===id);
      const slot = clamp(pos, 0, result.length-1);
      if(item && !result[slot]) result[slot] = item;
    });
    let wi = 0;
    for(let i=0;i<result.length;i++){
      if(!result[i]){ while(wi<withoutPinned.length && result.includes(withoutPinned[wi])) wi++; result[i]=withoutPinned[wi++]; }
    }
    ordered = result.filter(Boolean);
  }

  const config = pick.config;
  const visibleCount = config==='E' ? ordered.length : Math.min(5, ordered.length);
  const visible = ordered.slice(0, visibleCount);
  const folded = ordered.slice(visibleCount);

  const topDomains = [...DOMAINS].sort((a,b)=>topology.domainScore[b]-topology.domainScore[a]).slice(0,3);

  return { config, header: CONFIG_HEADER[config], group: pick.group, share: pick.share,
           visible, folded, utilItems, topology, topDomains };
}
LEADOS.layoutGrammar = { analyzeTopology, generateLayout, NAV_ITEMS, DOMAINS };

/* =========================================================================
   PART 2 — SEMANTIC RELATIONSHIP GRAPH  (LEADOS.entityGraph)
   ========================================================================= */
function extractRefs(data){
  const refs = [];
  Object.entries(data||{}).forEach(([key,val])=>{
    if(/Id$/.test(key) && typeof val==='string') refs.push({ id:val, field:key });
    if(/Ids$/.test(key) && Array.isArray(val)) val.forEach(id=>refs.push({ id, field:key }));
  });
  return refs;
}
function buildEntityGraph(state){
  const nodes = new Map(), edges = new Map();
  Object.entries(ENTITY_LABELS).forEach(([id,info])=> nodes.set(id, { ...info, id, events:[] }) );
  state.events.forEach(ev=>{
    const refs = extractRefs(ev.data).filter(r=>nodes.has(r.id));
    refs.forEach(r=> nodes.get(r.id).events.push(ev));
    for(let i=0;i<refs.length;i++){
      for(let j=i+1;j<refs.length;j++){
        if(refs[i].id===refs[j].id) continue;
        const key = [refs[i].id, refs[j].id].sort().join(':');
        if(!edges.has(key)) edges.set(key, { type:ev.type, weight:0, events:[] });
        const e = edges.get(key); e.weight++; e.events.push(ev.id);
      }
    }
  });
  return { nodes, edges };
}
function pageRankSimple(nodes, edges, iter){
  iter = iter || 20;
  const scores = new Map();
  nodes.forEach((_,id)=> scores.set(id, 1/nodes.size));
  for(let i=0;i<iter;i++){
    const newScores = new Map();
    nodes.forEach((_,id)=> newScores.set(id, 0.15/nodes.size));
    edges.forEach((edge,key)=>{
      const [a,b] = key.split(':');
      const contribution = 0.85 * edge.weight;
      newScores.set(b, (newScores.get(b)||0) + contribution*(scores.get(a)||0));
      newScores.set(a, (newScores.get(a)||0) + contribution*(scores.get(b)||0));
    });
    const total = [...newScores.values()].reduce((a,b)=>a+b,0) || 1;
    newScores.forEach((v,k)=> newScores.set(k, v/total));
    newScores.forEach((v,k)=> scores.set(k,v));
  }
  return scores;
}
function connectedClusters(nodes, edges, minWeight){
  minWeight = minWeight || 3;
  const adj = new Map();
  nodes.forEach((_,id)=> adj.set(id, []));
  edges.forEach((edge,key)=>{
    if(edge.weight < minWeight) return;
    const [a,b] = key.split(':');
    adj.get(a).push({ to:b, type:edge.type });
    adj.get(b).push({ to:a, type:edge.type });
  });
  const seen = new Set(), clusters = [];
  nodes.forEach((_,id)=>{
    if(seen.has(id) || adj.get(id).length===0) return;
    const stack=[id], members=new Set(), typeCount={};
    while(stack.length){
      const cur = stack.pop();
      if(members.has(cur)) continue;
      members.add(cur); seen.add(cur);
      adj.get(cur).forEach(n=>{ typeCount[n.type]=(typeCount[n.type]||0)+1; if(!members.has(n.to)) stack.push(n.to); });
    }
    if(members.size>1){
      const label = Object.entries(typeCount).sort((a,b)=>b[1]-a[1])[0];
      clusters.push({ members:[...members], label: label ? label[0] : 'unlabeled' });
    }
  });
  return clusters;
}
function detectLeadLag(eventsA, eventsB, windowDays){
  windowDays = windowDays || 21;
  const offsets = [];
  eventsA.forEach(ea=> eventsB.forEach(eb=>{
    const delta = dayUTC(eb.ts) - dayUTC(ea.ts);
    if(Math.abs(delta) <= windowDays) offsets.push(delta);
  }));
  if(offsets.length < 3) return { detected:false, n:offsets.length, reason:'fewer than 3 co-occurrences within window' };
  const mean = offsets.reduce((a,b)=>a+b,0)/offsets.length;
  const std = Math.sqrt(offsets.map(d=>(d-mean)**2).reduce((a,b)=>a+b,0)/offsets.length);
  if(std < 5 && Math.abs(mean) > 2){
    return { detected:true, lag:Math.round(mean), std:Math.round(std*10)/10, n:offsets.length };
  }
  return { detected:false, n:offsets.length, mean:Math.round(mean*10)/10, std:Math.round(std*10)/10, reason:'std ≥5d or |mean| ≤2d — no reliable periodic lag' };
}
function entityGraphInsights(state){
  const { nodes, edges } = buildEntityGraph(state);
  const scores = pageRankSimple(nodes, edges, 20);
  const centrality = [...nodes.keys()].map(id=>({ id, score:scores.get(id)||0, ...nodes.get(id) }))
    .filter(n=>n.events.length>0)
    .sort((a,b)=>b.score-a.score);
  const clusters = connectedClusters(nodes, edges, 3);
  const patterns = [];
  edges.forEach((edge,key)=>{
    if(edge.weight < 5) return;
    const [a,b] = key.split(':');
    const na = nodes.get(a), nb = nodes.get(b);
    if(!na || !nb) return;
    const res = detectLeadLag(na.events, nb.events, 21);
    patterns.push({ a, b, aLabel:na.label, bLabel:nb.label, ...res });
  });
  return { nodes, edges, centrality, clusters, patterns };
}
LEADOS.entityGraph = { buildEntityGraph, extractRefs, pageRankSimple, connectedClusters, detectLeadLag, entityGraphInsights };

/* =========================================================================
   PART 3 — PREDICTIVE SIGNAL ENGINE  (LEADOS.predict)
   NOTE: the pasted brief's Part 3 text was truncated mid-definition of
   buildPrefireCalendar() in the prompt. The bucketing scheme below
   (NOW / this week / next 2 weeks / next month / later / uncertain /
   not projectable) is this session's own reasonable completion of that
   cut-off spec, not a verified/recovered original — labeled here and in
   the docs.
   ========================================================================= */
function computeMoodSlope(measuredPulses){
  const pts = measuredPulses.map((p,i)=>({x:i,y:p.mood}));
  return linSlope(pts);
}
function projectFireDate(ruleId, state, today){
  const events = state.events;
  if(ruleId==='R1'){
    const out = {};
    PEOPLE.forEach(p=>{
      const last = lastEventFor(events,'oneonone.logged', e=>e.data.personId===p.id);
      if(!last){ out[p.id]=null; return; }
      const gap = daysBetween(last.ts, today);
      const daysUntilFire = p.cadenceDays - gap + 1;
      out[p.id] = daysUntilFire > 0 ? { date: inDaysIso(daysUntilFire), basis:`cadence ${p.cadenceDays}d − elapsed ${gap}d` } : { date:'NOW', basis:`already ${gap-p.cadenceDays}d over cadence` };
    });
    return out;
  }
  if(ruleId==='R7'){
    const out = {};
    PEOPLE.forEach(p=>{
      const measured = events.filter(e=>e.type==='pulse.logged' && e.data.personId===p.id && e.data.measured)
        .sort((a,b)=>new Date(a.ts)-new Date(b.ts));
      if(measured.length<3){ out[p.id]=null; return; }
      const slope = computeMoodSlope(measured);
      if(slope<=-0.5){ out[p.id] = { date:'NOW', basis:`slope ${fmt1(slope)}/period already past -0.5 threshold` }; return; }
      if(slope>=0){ out[p.id]=null; return; }
      out[p.id] = { uncertain:true, note:`slope ${fmt1(slope)}/period trending toward R7 threshold — not linearly projectable with confidence`, basis:'extrapolation requires assuming constant rate-of-change-of-slope, too uncertain to date' };
    });
    return out;
  }
  if(ruleId==='R20'){
    const out = {};
    GOALS.forEach(g=>{
      const last = lastEventFor(events,'okr.checkin', e=>e.data.goalId===g.id);
      const gap = last ? daysBetween(last.ts, today) : 999;
      const daysUntilFire = 21 - gap + 1;
      out[g.id] = daysUntilFire > 0 ? { date: inDaysIso(daysUntilFire), basis:`silent threshold 21d − elapsed ${gap}d` } : { date:'NOW', basis:`already ${gap-21}d past silent threshold` };
    });
    return out;
  }
  if(ruleId==='R40'){
    const out = {};
    DEALS.forEach(d=>{
      const last = lastEventFor(events,'deal.updated', e=>e.data.dealId===d.id);
      const gap = last ? daysBetween(last.ts, today) : 999;
      const daysUntilFire = 21 - gap + 1;
      out[d.id] = daysUntilFire > 0 ? { date: inDaysIso(daysUntilFire), basis:`stall threshold 21d − elapsed ${gap}d` } : { date:'NOW', basis:`already ${gap-21}d past stall threshold` };
    });
    return out;
  }
  return null; // R30/R50 treated as non-projectable (data-event-dependent), per brief's own "default: non-projectable" case
}
function bucketOf(dateStr, today){
  if(!dateStr) return null;
  if(dateStr==='NOW') return 'NOW';
  const gap = daysBetween(today.toISOString(), new Date(dateStr).toISOString());
  if(gap<=7) return 'THIS WEEK';
  if(gap<=14) return 'NEXT 2 WEEKS';
  if(gap<=30) return 'NEXT MONTH';
  return 'LATER';
}
function buildPrefireCalendar(state, today){
  const rules = ['R1','R7','R20','R40'];
  const buckets = { NOW:[], 'THIS WEEK':[], 'NEXT 2 WEEKS':[], 'NEXT MONTH':[], LATER:[], UNCERTAIN:[] };
  rules.forEach(ruleId=>{
    const proj = projectFireDate(ruleId, state, today);
    Object.entries(proj).forEach(([entityId,val])=>{
      if(!val) return;
      const label = (ENTITY_LABELS[entityId]||{}).label || entityId;
      if(val.uncertain){ buckets.UNCERTAIN.push({ ruleId, entityId, label, note:val.note, basis:val.basis }); return; }
      const b = bucketOf(val.date, today);
      if(b) buckets[b].push({ ruleId, entityId, label, date:val.date, basis:val.basis });
    });
  });
  return buckets;
}
LEADOS.predict = { projectFireDate, buildPrefireCalendar, computeMoodSlope };

let attentionTimerDomain = null, attentionTimerStart = 0;
function hourBucket(h){ if(h>=5 && h<12) return 'morning'; if(h>=12 && h<18) return 'afternoon'; return 'evening'; }
function flushAttention(domain, now){
  if(!domain) return;
  const elapsed = now - attentionTimerStart;
  if(elapsed<=0) return;
  const heat = (()=>{ try{ return JSON.parse(sessionStorage.getItem('leados-pth-attention')||'{}'); }catch(e){ return {}; } })();
  heat[domain] = (heat[domain]||0) + elapsed;
  try{ sessionStorage.setItem('leados-pth-attention', JSON.stringify(heat)); }catch(e){}
}
function trackViewDomain(domain){
  const now = Date.now();

  attentionTimerDomain = domain; attentionTimerStart = now;
}

  const vh = { ...STATE.meta.viewHistory, [view]: (STATE.meta.viewHistory[view]||0)+1 };

function rollAttentionIntoMeta(){
  const sessionHeat = readAttentionHeatmap();
  if(attentionTimerDomain) flushAttention(attentionTimerDomain, Date.now());

  DOMAINS.forEach(d=> decayed[d] = (STATE.meta.attentionHeatmap[d]||0) * 0.9 + (fresh[d]||0) );

}

  const centralityRows = ins.centrality.slice(0,8).map(c=>`

      <div class="w-32 text-xs truncate">${escapeHtml(c.label)}</div>
      <div class="bar-track flex-1"><div class="bar-fill" style="width:${(c.score/maxScore*100).toFixed(0)}%"></div></div>
      <div class="mono text-[11px] muted w-14 text-right">${(c.score).toFixed(3)}</div>
    </div>`).join('');

  const clusterCards = ins.clusters.length ? ins.clusters.map((c,i)=>`
    <div class="surface2 rounded-lg p-3">
      <div class="font-semibold text-sm mb-1">CLUSTER ${i+1} <span class="muted font-normal mono text-xs">label: ${c.label}</span></div>
      <div class="text-xs muted">${c.members.map(m=>escapeHtml((ENTITY_LABELS[m]||{}).label||m)).join(' · ')}</div>
    </div>`).join('') : `<div class="muted text-sm">No clusters at current edge-weight ≥3 threshold.</div>`;

  const patternCards = ins.patterns.length ? ins.patterns.map(p=>`
    <div class="surface2 rounded-lg p-3 text-sm">
      <div class="font-semibold">${escapeHtml(p.aLabel)} ↔ ${escapeHtml(p.bLabel)}</div>
      ${p.detected
        ? `<div class="mono text-xs muted mt-1">pattern: lag ${p.lag}d, std ${p.std}d, n=${p.n} — computed from seeded demo events, not scripted</div>`
        : `<div class="mono text-xs muted mt-1">no reliable lead/lag pattern (${p.reason}, n=${p.n}${p.std!==undefined? ', std '+p.std+'d':''})</div>`}
    </div>`).join('') : `<div class="muted text-sm">No entity pairs meet the edge-weight ≥5 threshold yet.</div>`;

  return `
  <h1 class="text-xl font-bold mb-1">Intelligence</h1>
  <div class="muted text-sm mb-4">Semantic relationship graph over people, goals, plans, risks, deals — edges built live from event co-occurrence.</div>

  <div class="mb-5">
    <label class="text-sm font-semibold block mb-1">@ Semantic search</label>
    <input id="semantic-search" class="rounded px-3 py-2 w-full max-w-md" placeholder="@ana, @cara, @devon ...">
    <div id="semantic-result" class="mt-2"></div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div class="surface rounded-lg p-3">
      <div class="font-semibold text-sm mb-2">CENTRALITY (simplified PageRank, 20 iterations)</div>
      ${centralityRows || '<div class="muted text-sm">No connected entities yet.</div>'}
    </div>
    <div class="surface rounded-lg p-3 flex flex-col gap-2">
      <div class="font-semibold text-sm">CO-OCCURRENCE CLUSTERS <span class="muted font-normal">(edge weight ≥3)</span></div>
      ${clusterCards}
    </div>
  </div>

  <div class="surface rounded-lg p-3 mt-4 flex flex-col gap-2">
    <div class="font-semibold text-sm">TEMPORAL PATTERNS <span class="muted font-normal">(edge weight ≥5, ±21d window)</span></div>
    ${patternCards}
  </div>
  `;
}
function wireIntelligenceSearch(){
  const inp = document.getElementById('semantic-search');
  if(!inp) return;
  inp.addEventListener('input', ()=>{
    const q = inp.value.replace('@','').trim().toLowerCase();
    const result = document.getElementById('semantic-result');
    if(!q){ result.innerHTML=''; return; }
    const person = PEOPLE.find(p=>p.name.toLowerCase().includes(q));
    if(!person){ result.innerHTML = `<div class="muted text-sm">No person match.</div>`; return; }
    result.innerHTML = renderPersonDossier(person.id);
  });
}
function renderPersonDossier(personId){
  const p = PEOPLE.find(pp=>pp.id===personId);
  const today = new Date();
  const findings = runEngine(STATE, today).filter(f=>f.entityId===personId || (ENTITY_LABELS[f.entityId]&&false));
  const ins = entityGraphInsights(STATE);
  const cluster = ins.clusters.find(c=>c.members.includes(personId));
  const coocc = [...ins.edges.entries()]
    .filter(([key])=> key.split(':').includes(personId))
    .map(([key,e])=>{ const other = key.split(':').find(id=>id!==personId); return { other, weight:e.weight }; })
    .sort((a,b)=>b.weight-a.weight);
  const patterns = ins.patterns.filter(p=>p.a===personId||p.b===personId);
  return `
  <div class="surface2 rounded-lg p-3 fade-in">
    <div class="font-semibold">${escapeHtml(p.name)} <span class="muted font-normal text-xs">${p.role} · ${p.domain}</span></div>
    <div class="mt-2 text-xs font-semibold muted uppercase">Active findings</div>
    <div class="flex flex-col gap-1 mt-1">${findings.length? findings.map(f=>`<span class="badge ${sevClass(f.sev)}">${f.rule} ${escapeHtml(f.title)}</span>`).join('') : '<span class="muted text-xs">none</span>'}</div>
    <div class="mt-2 text-xs font-semibold muted uppercase">Cluster</div>
    <div class="text-xs mt-1">${cluster? 'Member of cluster labeled "'+cluster.label+'" with '+cluster.members.filter(m=>m!==personId).map(m=>(ENTITY_LABELS[m]||{}).label||m).join(', ') : 'Not in any cluster at current threshold.'}</div>
    <div class="mt-2 text-xs font-semibold muted uppercase">Top co-occurring entities</div>
    <div class="text-xs mt-1">${coocc.length? coocc.slice(0,5).map(c=>`${(ENTITY_LABELS[c.other]||{}).label||c.other} (weight ${c.weight})`).join(' · ') : 'none'}</div>
    <div class="mt-2 text-xs font-semibold muted uppercase">Temporal patterns</div>
    <div class="text-xs mt-1">${patterns.length? patterns.map(p2=> p2.detected? `${(ENTITY_LABELS[p2.a]||{}).label} → ${(ENTITY_LABELS[p2.b]||{}).label}: lag ${p2.lag}d (n=${p2.n})` : `checked ${(ENTITY_LABELS[p2.a]||{}).label}↔${(ENTITY_LABELS[p2.b]||{}).label}: none found`).join('<br>') : 'no qualifying pairs'}</div>
  </div>`;
}

function viewForecast(){
  const buckets = buildPrefireCalendar(STATE, new Date());
  const order = ['NOW','THIS WEEK','NEXT 2 WEEKS','NEXT MONTH','LATER','UNCERTAIN'];
  return `
  <h1 class="text-xl font-bold mb-1">Forecast — Pre-fire Calendar</h1>
  <div class="muted text-sm mb-4">Projected from current trends only. Not forecasting, not ML — every date below is a deterministic extrapolation of a threshold rule, labeled with its formula.</div>
  <div class="flex flex-col gap-4">
  ${order.map(b=>{
    const items = buckets[b];
    if(!items || !items.length) return '';
    return `<div>
      <div class="text-xs font-semibold uppercase muted mb-1">${b}</div>
      <div class="flex flex-col gap-1">
        ${items.map(it=>`
          <div class="surface rounded-lg p-2 flex justify-between items-center text-sm">
            <div><span class="badge mono">${it.ruleId}</span> ${escapeHtml(it.label)}</div>
            <div class="mono text-[11px] muted text-right">${it.date? it.date : ''} ${it.note? escapeHtml(it.note): ''}<br><span>${escapeHtml(it.basis||'')}</span></div>
          </div>`).join('')}
      </div>
    </div>`;
  }).join('') || '<div class="muted text-sm">Nothing projectable right now.</div>'}
  </div>`;
}

function viewData(){
  const L = CURRENT_LAYOUT;
  const findings = runEngine(STATE, new Date());
  const ruleMeta = {
    R1:'1:1 cadence overdue', R7:'Pulse/burnout linear trend (slope ≤ -0.5/period)',
    R20:'Goal/OKR silent >21d', R30:'Plan stalled >14d (non-projectable here, data-event-dependent)',
    R40:'Deal stalled >21d', R50:'Risk open >30d (non-projectable here, data-event-dependent)'
  };
  const rulesTable = Object.entries(ruleMeta).map(([id,desc])=>{
    const c = findings.filter(f=>f.rule===id).length;
    return `<tr class="border-b border-base"><td class="py-1 mono">${id}</td><td class="py-1">${desc}</td><td class="py-1 text-right mono">${c}</td></tr>`;
  }).join('');
  const pins = STATE.meta.layoutPins||{};
  const pinRows = NAV_ITEMS.filter(n=>!n.util).map(n=>`
    <tr class="border-b border-base"><td class="py-1">${n.label}</td>
    <td class="py-1 mono">${pins.hasOwnProperty(n.id)? 'position '+(pins[n.id]+1) : '—'}</td>
    <td class="py-1 text-right"><button class="badge" data-unpin="${n.id}">${pins.hasOwnProperty(n.id)?'Unpin':'Right-click rail to pin'}</button></td></tr>`).join('');

  return `
  <h1 class="text-xl font-bold mb-3">Data</h1>

  <div class="surface rounded-lg p-3 mb-4">
    <div class="font-semibold text-sm mb-2">RULES (6 computed, not the brief's 144 — see README)</div>
    <table class="w-full text-sm"><thead><tr class="text-left muted text-xs"><th>Rule</th><th>Description</th><th class="text-right">Active</th></tr></thead>
    <tbody>${rulesTable}</tbody></table>
  </div>

  <div class="surface rounded-lg p-3 mb-4">
    <div class="font-semibold text-sm mb-2">LAYOUT &amp; PINS</div>
    <div class="text-xs muted mb-2">Current configuration: <span class="mono">${L.config}</span> — ${escapeHtml(L.header)} (dominant group share ${(L.share*100).toFixed(0)}%). Generated once at session start.</div>
    <table class="w-full text-sm"><thead><tr class="text-left muted text-xs"><th>Nav item</th><th>Pin</th><th></th></tr></thead>
    <tbody>${pinRows}</tbody></table>
  </div>

  <div class="surface rounded-lg p-3 flex gap-2 flex-wrap">
    <button id="export-json" class="badge">Export JSON</button>
    <button id="reset-seed" class="badge">Reset &amp; reseed</button>
  </div>
  `;
}
function wireDataView(){
  document.querySelectorAll('[data-unpin]').forEach(b=> b.onclick = ()=>{
    const pins = { ...STATE.meta.layoutPins }; delete pins[b.getAttribute('data-unpin')];
    updateMeta({ layoutPins: pins }); CURRENT_LAYOUT = generateLayout(STATE, new Date()); route();
  });
  const exp = document.getElementById('export-json');
  if(exp) exp.onclick = ()=>{
    const blob = new Blob([JSON.stringify(STATE,null,2)], { type:'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download='leados-pth-export.json'; a.click();
  };
  const rs = document.getElementById('reset-seed');
  if(rs) rs.onclick = ()=>{
    if(confirm('Type-confirm not implemented in this stub — click OK to reseed demo data.')){
      LEADOS.store.reseed(); sessionStorage.removeItem(SESSION_FLAG); initSession(); route();
      showToast('Store reseeded.');
    }
  };
}

function viewHealth(){
  const tests = runHealthSuite();
  return `<h1 class="text-xl font-bold mb-3">Health</h1>
  <div class="flex flex-col gap-2">
  ${tests.map(t=>`<div class="surface rounded-lg p-3 flex justify-between items-center">
    <div><span class="mono font-semibold">${t.id}</span> <span class="text-sm muted">${t.desc}</span></div>
    <span class="badge ${t.pass?'':'sev4'}">${t.pass?'PASS':'FAIL'}</span>
  </div>`).join('')}
  </div>`;
}
function runHealthSuite(){
  const out = [];
  out.push({ id:'T_STORE', desc:'store loads/creates under demo key', pass: !!STATE && !!STATE.events });
  out.push({ id:'T_APPEND_ONLY', desc:'append grows log by exactly 1, prior events untouched', pass:(()=>{
    const before = JSON.stringify(STATE.events);
    const lenBefore = STATE.events.length;
    appendEvent('health.check','RESILIENCE',{});
    const ok = STATE.events.length===lenBefore+1 && JSON.stringify(STATE.events.slice(0,lenBefore))===before;
    STATE = { ...STATE, events: STATE.events.slice(0,lenBefore) }; persist(STATE);
    return ok;
  })() });
  out.push({ id:'T_ENGINE', desc:'engine.run returns array without throwing', pass:(()=>{ try{ return Array.isArray(runEngine(STATE,new Date())); }catch(e){ return false; } })() });
  out.push({ id:'T_TOPOLOGY', desc:'generateLayout returns a valid configuration key', pass:(()=>{ try{ const l=generateLayout(STATE,new Date()); return ['A','B','C','D','E'].includes(l.config); }catch(e){ return false; } })() });
  out.push({ id:'T_GRAPH', desc:'entityGraphInsights runs and pageRank scores are finite', pass:(()=>{ try{ const ins=entityGraphInsights(STATE); return ins.centrality.every(c=>Number.isFinite(c.score)); }catch(e){ return false; } })() });
  out.push({ id:'T_PREDICT', desc:'projectFireDate(R1) returns an entry per person', pass:(()=>{ try{ const p=projectFireDate('R1',STATE,new Date()); return PEOPLE.every(pp=>p.hasOwnProperty(pp.id)); }catch(e){ return false; } })() });
  return out;
}

/* ---------------- command palette ---------------- */
function openPalette(){
  closeOverlays();
  const slot = document.getElementById('overlay-slot');
  const back = document.createElement('div');
  back.className='modal-backdrop';
  back.innerHTML = `
    <div class="surface rounded-lg w-full max-w-lg p-3 fade-in" role="dialog" aria-label="Command palette">
      <input id="palette-input" class="w-full rounded px-3 py-2 mb-2" placeholder="Type a command, @person, #domain, R### ...">
      <div id="palette-results" class="flex flex-col gap-1 max-h-80 overflow-auto"></div>
    </div>`;
  slot.appendChild(back);
  back.addEventListener('click', e=>{ if(e.target===back) closeOverlays(); });
  document.addEventListener('keydown', escClose);
  const input = document.getElementById('palette-input');
  input.focus();
  input.addEventListener('input', ()=> renderPaletteResults(input.value));
  renderPaletteResults('');
}
function escClose(e){ if(e.key==='Escape'){ closeOverlays(); document.removeEventListener('keydown', escClose); } }
const COMMANDS = [
  { id:'go-today', label:'Go to Today', run:()=>location.hash='#/today' },
  { id:'go-roster', label:'Go to Roster', run:()=>location.hash='#/roster' },
  { id:'go-intel', label:'Go to Intelligence', run:()=>location.hash='#/intelligence' },
  { id:'go-forecast', label:'Go to Forecast', run:()=>location.hash='#/forecast' },
  { id:'go-data', label:'Go to Data', run:()=>location.hash='#/data' },
  { id:'go-health', label:'Go to Health', run:()=>location.hash='#/health' },
  { id:'theme', label:'Cycle theme', run:cycleTheme },
  { id:'export', label:'Export JSON', run:()=>document.getElementById('export-json')?document.getElementById('export-json').click():showToast('Open #/data first.') }
];
function renderPaletteResults(q){
  const results = document.getElementById('palette-results');
  const hist = STATE.meta.commandHistory||{};
  if(q.startsWith('@')){
    const term = q.slice(1).toLowerCase();
    const matches = PEOPLE.filter(p=>p.name.toLowerCase().includes(term));
    results.innerHTML = matches.map(p=>`<button class="rail-item w-full text-left" data-person="${p.id}">@ ${escapeHtml(p.name)}</button>`).join('') || '<div class="muted text-sm p-2">No match.</div>';
    results.querySelectorAll('[data-person]').forEach(b=> b.onclick = ()=>{
      closeOverlays(); location.hash='#/intelligence';
      setTimeout(()=>{ const d=document.getElementById('semantic-result'); if(d) d.innerHTML = renderPersonDossier(b.getAttribute('data-person')); },30);
    });
    return;
  }
  if(q.startsWith('#')){
    const term = q.slice(1).toLowerCase();
    const matches = DOMAINS.filter(d=>d.toLowerCase().includes(term));
    results.innerHTML = matches.map(d=>`<button class="rail-item w-full text-left" data-domain-go="${d}">#${d}</button>`).join('') || '<div class="muted text-sm p-2">No match.</div>';
    results.querySelectorAll('[data-domain-go]').forEach(b=> b.onclick=()=>{ closeOverlays(); location.hash='#/today/'+b.getAttribute('data-domain-go'); });
    return;
  }
  let list = COMMANDS.filter(c=> c.label.toLowerCase().includes(q.toLowerCase()));
  list = list.sort((a,b)=> (hist[b.id]||0)-(hist[a.id]||0));
  results.innerHTML = list.map(c=>`<button class="rail-item w-full text-left" data-cmd="${c.id}">&gt; ${escapeHtml(c.label)} ${hist[c.id]?('<span class="muted text-[11px]"> · used '+hist[c.id]+'×</span>'):''}</button>`).join('') || '<div class="muted text-sm p-2">No match.</div>';
  results.querySelectorAll('[data-cmd]').forEach(b=> b.onclick=()=>{
    const cmd = COMMANDS.find(c=>c.id===b.getAttribute('data-cmd'));
    const h = { ...STATE.meta.commandHistory, [cmd.id]: (STATE.meta.commandHistory[cmd.id]||0)+1 };
    updateMeta({ commandHistory:h });
    closeOverlays(); cmd.run();
  });
}
document.addEventListener('keydown', e=>{
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); openPalette(); }
});

/* ---------------- router ---------------- */
function parseHash(){
  const h = (location.hash||'#/today').replace('#/','');
  const parts = h.split('/').filter(Boolean);
  return { view: parts[0]||'today', param: parts[1]||null };
}
function route(){
  const r = parseHash();
  logUsage(r.view);
  const navItem = NAV_ITEMS.find(n=>n.id===r.view);
  trackViewDomain(r.param || (navItem && navItem.domain) || null);
  renderBanner();
  renderRail(r);
  const main = document.getElementById('main');
  let html = '';
  switch(r.view){
    case 'today': html = viewToday(r.param); break;
    case 'roster': html = viewRoster(); break;
    case 'engineering': case 'ops': case 'sales': case 'finance': case 'strategy': case 'external': case 'resilience': {
      const dom = (NAV_ITEMS.find(n=>n.id===r.view)||{}).domain;
      html = viewToday(dom); break;
    }
    case 'intelligence': html = viewIntelligence(); break;
    case 'forecast': html = viewForecast(); break;
    case 'data': html = viewData(); break;
    case 'health': html = viewHealth(); break;
    default: html = viewToday(null);
  }
  main.innerHTML = `<div class="fade-in">${html}</div>`;
  wireIntelligenceSearch();
  wireDataView();
}
window.addEventListener('hashchange', route);
window.addEventListener('load', ()=>{
  initSession();
  route();
});
/* in case script runs after load event already fired */
if(document.readyState==='complete'){ initSession(); route(); }

})();
</script>
