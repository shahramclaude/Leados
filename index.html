<!DOCTYPE html>
<html lang="en" data-theme="dark" data-density="standard">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeadOS — Leadership Intelligence</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style>
/* ======================================================================
   1. CUSTOM PROPERTIES (TOKENS)
   ====================================================================== */
:root{
  --surface-0:#0E0D0B; --surface-1:#141210; --surface-2:#1C1917; --surface-3:#252118; --surface-4:#2E2820;
  --ink-0:#F7F4EF; --ink-1:#D4CEC3; --ink-2:#9A9085; --ink-3:#5C564E; --ink-4:#3A3530;
  --sev-5:#FF2D2D; --sev-5-bg:#2A0A0A; --sev-5-border:#8B1A1A;
  --sev-4:#FF6B35; --sev-4-bg:#1F100A; --sev-4-border:#7A3015;
  --sev-3:#F0B429; --sev-3-bg:#1A150A; --sev-3-border:#7A5A10;
  --sev-2:#4A90D9; --sev-2-bg:#0A1020; --sev-2-border:#1A3A6A;
  --sev-1:#6B7280; --sev-1-bg:#141414; --sev-1-border:#2A2A2A;
  --domain-people:#7C9EFF; --domain-finance:#4ADE80; --domain-sales:#F472B6; --domain-ops:#FB923C;
  --domain-strategy:#A78BFA; --domain-mfg:#94A3B8; --domain-legal:#FCD34D; --domain-cs:#34D399;
  --domain-exec:#F87171; --domain-intel:#22D3EE; --domain-self:#C084FC; --domain-external:#86EFAC;
  --domain-narrative:#FCA5A5; --domain-resilience:#67E8F9;
  --accent:#C23B2E; --accent-dim:rgba(194,59,46,.15); --accent-glow:rgba(194,59,46,.08);
  --conf-high:#F7F4EF; --conf-medium:#9A9085; --conf-low:#5C564E;
  --font-display:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --font-mono:ui-monospace,"SF Mono","Cascadia Code","Fira Code",Menlo,Consolas,monospace;
  --text-2xs:10px; --text-xs:11px; --text-sm:12.5px; --text-base:14px; --text-md:15.5px;
  --text-lg:18px; --text-xl:22px; --text-2xl:28px; --text-3xl:36px; --text-4xl:45px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-8:32px; --sp-10:40px; --sp-12:48px; --sp-16:64px; --sp-20:80px;
  --radius-sm:3px; --radius-md:6px; --radius-lg:10px; --radius-xl:16px; --radius-full:9999px;
  --shadow-sm:0 0 0 1px var(--ink-4);
  --shadow-md:0 0 0 1px var(--ink-4),0 4px 16px rgba(0,0,0,.4);
  --shadow-lg:0 0 0 1px var(--ink-4),0 8px 32px rgba(0,0,0,.6);
  --shadow-glow-accent:0 0 20px rgba(194,59,46,.2);
  --shadow-glow-sev5:0 0 24px rgba(255,45,45,.25);
  --dur-instant:80ms; --dur-fast:140ms; --dur-normal:220ms; --dur-slow:360ms;
  --ease-out:cubic-bezier(.16,1,.3,1); --ease-in:cubic-bezier(.7,0,.84,0);
  --ease-inout:cubic-bezier(.65,0,.35,1); --ease-spring:cubic-bezier(.34,1.56,.64,1);
  --rail-width:220px; --rail-collapsed:64px; --content-max:860px; --content-wide:1120px; --panel-width:380px;
  --row-h:48px; --density-scale:1;
}
[data-theme="light"]{
  --surface-0:#FFFFFF; --surface-1:#F7F4EF; --surface-2:#F0ECE2; --surface-3:#E8E2D6; --surface-4:#DDD7C8;
  --ink-0:#1C1917; --ink-1:#44403C; --ink-2:#78716C; --ink-3:#A8A29E; --ink-4:#D6D3D1;
}
[data-density="compact"]{ --row-h:36px; --density-scale:.85; }
[data-density="comfortable"]{ --row-h:60px; --density-scale:1.15; }
[data-density="reading"]{ --row-h:60px; --density-scale:1.1; }

/* ======================================================================
   2. RESET & BASE
   ====================================================================== */
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--surface-1); color:var(--ink-0); font-family:var(--font-body);
  font-size:calc(var(--text-base) * var(--density-scale)); line-height:1.5;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer;}
input,textarea,select{font:inherit; color:inherit;}
a{color:inherit;}
ul{list-style:none; margin:0; padding:0;}
::selection{background:var(--accent-dim); color:var(--ink-0);}
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--ink-4); border-radius:var(--radius-full);}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:2px;}

/* ======================================================================
   3. TYPOGRAPHY
   ====================================================================== */
.t-display{font-family:var(--font-display); font-weight:600; letter-spacing:-.02em;}
.t-body{font-family:var(--font-body); font-weight:400; line-height:1.6;}
.t-mono{font-family:var(--font-mono); font-size:var(--text-sm); color:var(--ink-1);}
.t-label{font-family:var(--font-mono); font-size:var(--text-2xs); letter-spacing:.1em; text-transform:uppercase; color:var(--ink-2);}
h1,h2,h3{margin:0;}

/* ======================================================================
   4. LAYOUT SYSTEM
   ====================================================================== */
.app-shell{display:grid; grid-template-columns:var(--rail-width) 1fr; height:100vh; transition:grid-template-columns var(--dur-normal) var(--ease-out);}
.app-shell.rail-collapsed{grid-template-columns:var(--rail-collapsed) 1fr;}
.app-shell.panel-open{grid-template-columns:var(--rail-width) 1fr var(--panel-width);}
.app-shell.rail-collapsed.panel-open{grid-template-columns:var(--rail-collapsed) 1fr var(--panel-width);}

.rail{background:var(--surface-2); border-right:1px solid var(--ink-4); display:flex; flex-direction:column; overflow:hidden;}
.main-col{display:flex; flex-direction:column; min-width:0; position:relative;}
.main-scroll{flex:1; overflow-y:auto; padding:var(--sp-6) var(--sp-8) var(--sp-20);}
.context-panel{background:var(--surface-2); border-left:1px solid var(--ink-4); overflow-y:auto; display:none;}
.app-shell.panel-open .context-panel{display:block;}
.content-col{max-width:var(--content-wide); margin:0 auto;}

/* ======================================================================
   5. COMPONENTS (alphabetical)
   ====================================================================== */

/* -- Badge -- */
.badge{display:inline-flex; align-items:center; justify-content:center; min-width:18px; height:18px; padding:0 5px;
  border-radius:var(--radius-full); font-family:var(--font-mono); font-size:var(--text-2xs); font-weight:700;}
.badge-5{background:var(--sev-5-bg); color:var(--sev-5); border:1px solid var(--sev-5-border);}
.badge-4{background:var(--sev-4-bg); color:var(--sev-4); border:1px solid var(--sev-4-border);}
.badge-3{background:var(--sev-3-bg); color:var(--sev-3); border:1px solid var(--sev-3-border);}
.badge-0{background:var(--surface-3); color:var(--ink-3); border:1px solid var(--ink-4);}

/* -- Breadcrumb / context bar -- */
.context-bar{position:sticky; top:0; z-index:10; display:flex; align-items:center; justify-content:space-between;
  gap:var(--sp-4); padding:var(--sp-3) var(--sp-8); background:color-mix(in srgb, var(--surface-1) 85%, transparent);
  backdrop-filter:blur(8px); border-bottom:1px solid var(--ink-4); font-family:var(--font-mono); font-size:var(--text-xs); color:var(--ink-2);}
.context-bar .crumb-accent{color:var(--ink-0);}
.context-bar .priority-pill{display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:var(--radius-full);
  background:var(--sev-4-bg); border:1px solid var(--sev-4-border); color:var(--sev-4); cursor:pointer; font-weight:700;}

/* -- Buttons -- */
.btn{display:inline-flex; align-items:center; gap:6px; padding:7px 14px; border-radius:var(--radius-md); font-size:var(--text-xs);
  font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.05em; border:1px solid var(--ink-4);
  background:var(--surface-3); color:var(--ink-1); transition:transform var(--dur-fast) var(--ease-out), background var(--dur-fast), border-color var(--dur-fast);}
.btn:hover{background:var(--surface-4); border-color:var(--ink-3);}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--accent); border-color:var(--accent); color:#fff;}
.btn-primary:hover{box-shadow:var(--shadow-glow-accent); background:var(--accent);}
.btn-ghost{background:transparent; border-color:transparent;}
.btn-ghost:hover{background:var(--surface-3);}
.btn-danger{color:var(--sev-4); border-color:var(--sev-4-border);}
.icon-btn{width:32px; height:32px; display:inline-flex; align-items:center; justify-content:center; border-radius:var(--radius-md); border:1px solid transparent;}
.icon-btn:hover{background:var(--surface-3); border-color:var(--ink-4);}

/* -- Bullet graph -- */
.bullet{height:10px; border-radius:var(--radius-full); background:var(--surface-3); position:relative; overflow:hidden; border:1px solid var(--ink-4);}
.bullet-fill{height:100%; border-radius:var(--radius-full); transition:width var(--dur-slow) var(--ease-out);}
.bullet-fill.over{background:var(--accent);}
.bullet-meta{display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:var(--text-2xs); color:var(--ink-3); margin-top:4px;}

/* -- Card system -- */
.card{background:var(--surface-2); border:1px solid var(--ink-4); border-radius:var(--radius-lg); transition:transform var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out);}

.finding-card{position:relative; display:flex; flex-direction:column; gap:var(--sp-3); padding:var(--sp-5) var(--sp-6);
  margin-bottom:var(--sp-4); background:var(--surface-2); border:1px solid var(--ink-4); border-left-width:1px;
  border-radius:var(--radius-lg); cursor:pointer;}
.finding-card:hover{transform:translateY(-2px); box-shadow:var(--shadow-lg);}
.finding-card.selected{background:var(--accent-dim); border-left-color:var(--accent);}
.finding-card[data-sev="5"]{border-left:4px solid var(--sev-5); background:linear-gradient(90deg, var(--sev-5-bg), var(--surface-2) 40%); box-shadow:var(--shadow-glow-sev5); animation:sevPulse 2s ease-in-out infinite;}
.finding-card[data-sev="4"]{border-left:3px solid var(--sev-4); background:linear-gradient(90deg, var(--sev-4-bg), var(--surface-2) 30%);}
.finding-card[data-sev="3"]{border-left:2px solid var(--sev-3);}
.finding-card[data-sev="2"]{border-left:1px dashed var(--sev-2);}
.finding-card[data-sev="1"]{border-left:1px solid var(--ink-4); opacity:.8;}
.finding-card.error{border-left:4px solid var(--sev-4); background:var(--sev-4-bg);}

.sev-icon{font-size:14px; line-height:1;}
.sev-icon-5{color:var(--sev-5);} .sev-icon-4{color:var(--sev-4);} .sev-icon-3{color:var(--sev-3);}
.sev-icon-2{color:var(--sev-2);} .sev-icon-1{color:var(--sev-1);}

.finding-top{display:flex; align-items:center; justify-content:space-between; gap:var(--sp-3); flex-wrap:wrap;}
.finding-chips{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
.finding-rank{font-family:var(--font-mono); font-size:var(--text-xs); color:var(--ink-3);}
.finding-score{font-family:var(--font-mono); font-size:var(--text-md); font-weight:700; color:var(--ink-0);}
.finding-title{font-family:var(--font-display); font-weight:600; letter-spacing:-.02em; font-size:var(--text-xl); margin:2px 0;}
.finding-basis{display:flex; flex-direction:column; gap:3px; padding-top:var(--sp-2); border-top:1px dashed var(--ink-4);}
.finding-basis li{font-family:var(--font-mono); font-size:var(--text-sm); color:var(--ink-1); display:flex; gap:6px;}
.finding-basis li::before{content:"·"; color:var(--ink-3);}
.confidence-banner{font-family:var(--font-mono); font-size:var(--text-xs); padding:var(--sp-2) var(--sp-3); border-radius:var(--radius-sm);
  background:var(--surface-3); border:1px solid var(--ink-4);}
.conf-HIGH{opacity:1; border-style:solid;}
.conf-MEDIUM{opacity:.7; border-style:dashed;}
.conf-LOW{opacity:.45; border-style:dotted; font-style:italic;}
.finding-actions{display:flex; gap:var(--sp-2); flex-wrap:wrap; padding-top:var(--sp-2);}
.finding-card.leaving{opacity:0; transform:translateX(20px); max-height:0; margin:0; padding:0; overflow:hidden;}

.insight-card{position:relative; padding:var(--sp-6); margin-bottom:var(--sp-5); border-radius:var(--radius-lg);
  border:1px solid var(--ink-4); box-shadow:0 0 0 4px var(--surface-1), 0 0 0 5px var(--ink-4);}
.insight-pattern-label{font-family:var(--font-mono); font-size:var(--text-xs); letter-spacing:.15em; text-transform:uppercase; color:var(--ink-2); margin-bottom:4px;}
.insight-constituents{display:flex; gap:6px; flex-wrap:wrap; margin-top:var(--sp-3);}
.insight-pill{font-family:var(--font-mono); font-size:var(--text-2xs); padding:3px 9px; border-radius:var(--radius-full); border:1px solid var(--ink-4); background:var(--surface-3);}
.insight-pill:hover{background:var(--surface-4);}
.insight-nosuppress{margin-top:var(--sp-3); font-family:var(--font-mono); font-size:var(--text-2xs); color:var(--sev-5); text-transform:uppercase; letter-spacing:.08em;}

.metric-card{padding:var(--sp-5); display:flex; flex-direction:column; gap:var(--sp-3);}
.metric-head{display:flex; justify-content:space-between; align-items:center;}
.metric-value-row{display:flex; align-items:baseline; gap:var(--sp-3);}
.metric-value{font-family:var(--font-display); font-size:var(--text-2xl); font-weight:600;}
.metric-delta{font-family:var(--font-mono); font-size:var(--text-xs); color:var(--ink-2);}
.metric-prev{font-family:var(--font-mono); font-size:var(--text-2xs); color:var(--ink-3);}

/* -- Score math block -- */
.score-math{font-family:var(--font-mono); font-size:var(--text-xs); color:var(--ink-1); background:var(--surface-3);
  border:1px solid var(--ink-4); border-radius:var(--radius-sm); padding:var(--sp-2) var(--sp-3); line-height:1.7;}
.score-math .dim{color:var(--ink-3);}

/* -- Chips -- */
.chip{display:inline-flex; align-items:center; font-family:var(--font-mono); font-size:var(--text-2xs); text-transform:uppercase;
  letter-spacing:.05em; padding:2px 10px 2px 8px; border-radius:var(--radius-full);}
.chip-domain{border-left:2px solid var(--c); background:color-mix(in srgb, var(--c) 8%, transparent); color:var(--ink-1);}
.chip-rule{border:1px solid var(--ink-4); color:var(--ink-2);}
.chip-conf{border:1px solid var(--ink-4); color:var(--ink-2);}
.chip-recon{border:1px dashed var(--sev-3); color:var(--sev-3);}

/* -- Command palette -- */
.cmdk-backdrop{position:fixed; inset:0; background:rgba(0,0,0,.5); backdrop-filter:blur(8px); z-index:100; display:flex;
  align-items:flex-start; justify-content:center; padding-top:10vh; opacity:0; pointer-events:none; transition:opacity var(--dur-normal) var(--ease-out);}
.cmdk-backdrop.open{opacity:1; pointer-events:auto;}
.cmdk{width:640px; max-width:92vw; max-height:70vh; display:flex; flex-direction:column; background:var(--surface-2);
  border:1px solid var(--ink-4); border-radius:var(--radius-lg); box-shadow:var(--shadow-lg); transform:scale(.96); opacity:0;
  transition:transform var(--dur-normal) var(--ease-spring), opacity var(--dur-normal) var(--ease-out);}
.cmdk-backdrop.open .cmdk{transform:scale(1); opacity:1;}
.cmdk-input-row{display:flex; align-items:center; gap:var(--sp-3); padding:var(--sp-4) var(--sp-5); border-bottom:1px solid var(--ink-4);}
.cmdk-input-row input{flex:1; background:transparent; border:none; font-size:var(--text-md); color:var(--ink-0); outline:none;}
.cmdk-body{overflow-y:auto; padding:var(--sp-2) 0;}
.cmdk-group-label{padding:var(--sp-2) var(--sp-5); font-family:var(--font-mono); font-size:var(--text-2xs); letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3);}
.cmdk-item{display:flex; align-items:center; gap:var(--sp-3); padding:var(--sp-2) var(--sp-5); cursor:pointer; font-size:var(--text-sm);}
.cmdk-item:hover, .cmdk-item.active{background:var(--surface-3);}
.cmdk-item .kicker{color:var(--ink-3); font-family:var(--font-mono); font-size:var(--text-2xs);}

/* -- Context panel content -- */
.panel-head{display:flex; justify-content:space-between; align-items:flex-start; padding:var(--sp-5); border-bottom:1px solid var(--ink-4);}
.panel-body{padding:var(--sp-5); display:flex; flex-direction:column; gap:var(--sp-5);}

/* -- Domain chip color binding via inline style var(--c) set per element -- */

/* -- Empty state -- */
.empty-state{border:1px dashed var(--ink-4); border-radius:var(--radius-lg); padding:var(--sp-12) var(--sp-8); text-align:center;
  display:flex; flex-direction:column; gap:var(--sp-4); align-items:center; max-width:640px; margin:var(--sp-10) auto;}
.empty-state h3{font-family:var(--font-display); font-size:var(--text-xl);}
.empty-state p{color:var(--ink-2); font-size:var(--text-base); line-height:1.7; max-width:480px;}
.empty-state .actions{display:flex; gap:var(--sp-3); margin-top:var(--sp-2);}

/* -- Heatmap -- */
.heatmap{display:grid; grid-template-columns:repeat(7, 16px); gap:4px;}
.heatmap-cell{width:16px; height:16px; border-radius:2px; display:flex; align-items:center; justify-content:center;
  font-size:8px; font-family:var(--font-mono); color:var(--ink-0); cursor:default;}

/* -- Keyboard shortcut overlay -- */
.kbd{display:inline-flex; align-items:center; justify-content:center; min-width:20px; height:20px; padding:0 5px; border-radius:4px;
  background:var(--surface-4); border:1px solid var(--ink-3); font-family:var(--font-mono); font-size:var(--text-2xs); box-shadow:0 1px 0 var(--ink-3);}
.shortcuts-grid{display:grid; grid-template-columns:1fr 1fr; gap:var(--sp-5);}
.shortcut-row{display:flex; justify-content:space-between; align-items:center; padding:4px 0; font-size:var(--text-sm); color:var(--ink-1);}

/* -- Mini TOC -- */
.mini-toc{position:fixed; right:calc(var(--panel-width) * 0 + 14px); top:50%; transform:translateY(-50%); display:flex;
  flex-direction:column; gap:10px; z-index:5;}
.mini-toc button{width:8px; height:8px; border-radius:50%; background:var(--ink-4); border:1px solid transparent;}
.mini-toc button:hover{background:var(--c); transform:scale(1.3);}

/* -- Nav rail -- */
.rail-head{display:flex; align-items:center; justify-content:space-between; padding:var(--sp-4); border-bottom:1px solid var(--ink-4);}
.rail-logo{font-family:var(--font-display); font-weight:700; font-size:var(--text-lg); letter-spacing:-.02em; white-space:nowrap; overflow:hidden;}
.rail-logo .dot{color:var(--accent);}
.rail-scroll{flex:1; overflow-y:auto; padding:var(--sp-3) 0;}
.rail-section-label{padding:var(--sp-3) var(--sp-4) var(--sp-1); font-family:var(--font-mono); font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3); white-space:nowrap;}
.rail-item{display:flex; align-items:center; gap:var(--sp-3); padding:8px var(--sp-4); cursor:pointer; position:relative; color:var(--ink-1);}
.rail-item:hover{background:var(--surface-3);}
.rail-item.active{background:var(--accent-dim); color:var(--ink-0);}
.rail-item.active::before{content:""; position:absolute; left:0; top:0; bottom:0; width:2px; background:var(--accent);}
.rail-item .ic{width:18px; text-align:center; flex-shrink:0; color:var(--ink-2);}
.rail-item .lbl{flex:1; font-size:var(--text-sm); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.rail-item .kbd-hint{font-family:var(--font-mono); font-size:9px; color:var(--ink-3);}
.app-shell.rail-collapsed .lbl, .app-shell.rail-collapsed .rail-section-label, .app-shell.rail-collapsed .rail-logo span,
.app-shell.rail-collapsed .kbd-hint, .app-shell.rail-collapsed .rail-footer-text{display:none;}
.rail-footer{border-top:1px solid var(--ink-4); padding:var(--sp-4); font-family:var(--font-mono); font-size:9px; color:var(--ink-3); display:flex; flex-direction:column; gap:6px;}
.storage-bar{height:4px; border-radius:var(--radius-full); background:var(--surface-4); overflow:hidden;}
.storage-bar-fill{height:100%; background:var(--domain-finance);}

/* -- Sev5 persistent banner -- */
.crisis-banner{background:var(--sev-5-bg); border-bottom:1px solid var(--sev-5-border); color:var(--sev-5); padding:var(--sp-2) var(--sp-6);
  display:flex; align-items:center; justify-content:space-between; font-family:var(--font-mono); font-size:var(--text-xs); gap:var(--sp-3);}

/* -- Skeleton -- */
.skeleton{background:linear-gradient(90deg, var(--surface-2) 25%, var(--surface-3) 50%, var(--surface-2) 75%); background-size:200% 100%; animation:shimmer 1.5s infinite; border-radius:var(--radius-lg); height:140px; margin-bottom:var(--sp-4);}

/* -- Sparkline -- */
.spark-wrap{display:flex; align-items:center; gap:var(--sp-3);}
.spark-stats{display:flex; flex-direction:column; font-family:var(--font-mono);}
.spark-range{font-size:var(--text-2xs); color:var(--ink-3);}

/* -- Tables -- */
table.data-table{width:100%; border-collapse:collapse; font-size:var(--text-sm);}
.data-table thead th{position:sticky; top:0; z-index:2; background:var(--surface-3); text-align:left; font-family:var(--font-mono);
  font-size:var(--text-2xs); text-transform:uppercase; letter-spacing:.08em; color:var(--ink-2); padding:8px 10px; border-bottom:1px solid var(--ink-4); cursor:pointer;}
.data-table tbody tr{height:var(--row-h);}
.data-table tbody tr:nth-child(odd){background:var(--surface-1);}
.data-table tbody tr:nth-child(even){background:var(--surface-2);}
.data-table tbody tr:hover{background:var(--surface-3);}
.data-table td{padding:6px 10px; border-bottom:1px solid var(--ink-4);}
.data-table td.num{text-align:right; font-family:var(--font-mono);}

/* -- Toasts -- */
.toast-stack{position:fixed; bottom:var(--sp-5); right:var(--sp-5); display:flex; flex-direction:column; gap:var(--sp-2); z-index:200; width:320px;}
.toast{background:var(--surface-3); border:1px solid var(--ink-4); border-left-width:3px; border-radius:var(--radius-md); padding:var(--sp-3) var(--sp-4);
  font-size:var(--text-sm); display:flex; gap:var(--sp-2); align-items:flex-start; box-shadow:var(--shadow-md); animation:toastIn var(--dur-normal) var(--ease-out);}
.toast-success{border-left-color:var(--domain-finance);}
.toast-error{border-left-color:var(--sev-4);}
.toast-warning{border-left-color:var(--sev-3);}
.toast-info{border-left-color:var(--sev-2);}

/* -- Tooltip -- */
.tooltip{position:absolute; background:var(--surface-4); border:1px solid var(--ink-3); border-radius:var(--radius-sm); padding:4px 8px;
  font-size:var(--text-2xs); font-family:var(--font-mono); pointer-events:none; z-index:50; white-space:nowrap;}

/* ======================================================================
   6. VIEW-SPECIFIC STYLES (alphabetical)
   ====================================================================== */
.view-header{margin-bottom:var(--sp-5);}
.view-title{font-family:var(--font-display); font-size:var(--text-2xl); font-weight:600; letter-spacing:-.02em;}
.view-sub{color:var(--ink-2); font-size:var(--text-sm); margin-top:4px;}
.filter-row{display:flex; gap:var(--sp-2); margin-bottom:var(--sp-5); flex-wrap:wrap;}
.filter-pill{font-family:var(--font-mono); font-size:var(--text-2xs); text-transform:uppercase; padding:5px 12px; border-radius:var(--radius-full); border:1px solid var(--ink-4); color:var(--ink-2); cursor:pointer;}
.filter-pill.active{background:var(--ink-0); color:var(--surface-1); border-color:var(--ink-0);}
.nudge-collapsed-note{font-family:var(--font-mono); font-size:var(--text-xs); color:var(--ink-3); padding:var(--sp-3); text-align:center; cursor:pointer; border:1px dashed var(--ink-4); border-radius:var(--radius-md);}

#view-health .check-row{display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--ink-4); font-family:var(--font-mono); font-size:var(--text-xs);}
.pass-pill{color:var(--domain-finance); font-weight:700;}

.grid-metrics{display:grid; grid-template-columns:repeat(auto-fit, minmax(240px,1fr)); gap:var(--sp-4); margin-bottom:var(--sp-6);}

.settings-row{display:flex; justify-content:space-between; align-items:center; padding:var(--sp-3) 0; border-bottom:1px solid var(--ink-4);}
.seg-control{display:flex; border:1px solid var(--ink-4); border-radius:var(--radius-md); overflow:hidden;}
.seg-control button{padding:6px 12px; font-size:var(--text-xs); font-family:var(--font-mono);}
.seg-control button.active{background:var(--accent); color:#fff;}

/* ======================================================================
   7. UTILITY CLASSES
   ====================================================================== */
.vh{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap;}
.flex{display:flex;} .flex-col{display:flex; flex-direction:column;}
.items-center{align-items:center;} .justify-between{justify-content:space-between;}
.gap-1{gap:4px;} .gap-2{gap:8px;} .gap-3{gap:12px;} .gap-4{gap:16px;}
.mt-2{margin-top:8px;} .mt-4{margin-top:16px;} .mb-2{margin-bottom:8px;}
.dim{color:var(--ink-2);}

/* ======================================================================
   8. RESPONSIVE OVERRIDES
   ====================================================================== */
@media (max-width:1280px){
  .app-shell.panel-open{grid-template-columns:var(--rail-width) 1fr;}
  .context-panel{position:fixed; right:0; top:0; bottom:0; width:var(--panel-width); z-index:50; box-shadow:var(--shadow-lg);}
}
@media (max-width:1024px){
  .app-shell{grid-template-columns:var(--rail-collapsed) 1fr;}
  .rail .lbl, .rail .rail-section-label, .rail-logo span, .kbd-hint, .rail-footer-text{display:none;}
}
@media (max-width:640px){
  .app-shell{grid-template-columns:1fr; grid-template-rows:1fr auto;}
  .rail{display:none;}
  .bottom-tabs{display:flex !important;}
  .main-scroll{padding:var(--sp-4);}
}
.bottom-tabs{display:none; position:fixed; bottom:0; left:0; right:0; height:56px; background:var(--surface-2); border-top:1px solid var(--ink-4); z-index:40; align-items:center; justify-content:space-around;}
.bottom-tabs button{display:flex; flex-direction:column; align-items:center; font-size:9px; color:var(--ink-2); gap:2px;}

/* ======================================================================
   9. PRINT STYLES
   ====================================================================== */
@media print{
  .rail,.context-panel,.cmdk-backdrop,.toast-stack,.bottom-tabs,.mini-toc,.context-bar .priority-pill{display:none !important;}
  body{background:#fff; color:#000;}
  .finding-card{background:#fff !important; border:1px solid #000 !important; box-shadow:none !important; page-break-inside:avoid; animation:none !important;}
  .finding-title{color:#000;}
  .score-math{border:1px solid #000; background:#fff;}
  .app-shell{display:block;}
  .main-scroll{overflow:visible; padding:0;}
  body::after{content:"Printed from LeadOS · " attr(data-print-date) " · schema v15 · lineage pt-A"; display:block; margin-top:20px; font-size:10px; color:#555;}
}

/* ======================================================================
   10. ANIMATION KEYFRAMES
   ====================================================================== */
@keyframes shimmer{0%{background-position:200% 0;} 100%{background-position:-200% 0;}}
@keyframes sevPulse{0%,100%{box-shadow:0 0 16px rgba(255,45,45,.18);} 50%{box-shadow:0 0 28px rgba(255,45,45,.38);}}
@keyframes toastIn{from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:translateY(0);}}
@keyframes pulseSoft{0%,100%{opacity:.5;} 50%{opacity:1;}}
@keyframes spin{to{transform:rotate(360deg);}}

@media (prefers-reduced-motion:reduce){
  *{animation:none !important; transition:none !important;}
}
@media (prefers-contrast:more){
  :root{ --ink-4:#888; --ink-2:#ccc; }
}

<script>
(function(){
"use strict";

/* ====================================================================
   LEADOS NAMESPACE — mirrors module-registry convention of upstream
   repo (window.LeadOS / LEADOS._mod). This build is a single-file
   pt-A design-system implementation with a compact SAMPLE data layer
   (see README/session log: full engine/rules/store ports were out of
   scope for a CSS+UI brief and were not byte-verified from upstream).
   ==================================================================== */
window.LeadOS = window.LeadOS || {};
LeadOS._mod = LeadOS._mod || {};
LeadOS._mod.ui = 'inline:index.html';

const DOMAINS = {
  people:     {label:'People',     c:'--domain-people'},
  finance:    {label:'Finance',    c:'--domain-finance'},
  sales:      {label:'Sales',      c:'--domain-sales'},
  ops:        {label:'Ops',        c:'--domain-ops'},
  strategy:   {label:'Strategy',   c:'--domain-strategy'},
  mfg:        {label:'Mfg',        c:'--domain-mfg'},
  legal:      {label:'Legal',      c:'--domain-legal'},
  cs:         {label:'CS',         c:'--domain-cs'},
  exec:       {label:'Exec',       c:'--domain-exec'},
  intel:      {label:'Intel',      c:'--domain-intel'},
  self:       {label:'Self',       c:'--domain-self'},
  external:   {label:'External',   c:'--domain-external'},
  narrative:  {label:'Narrative',  c:'--domain-narrative'},
  resilience: {label:'Resilience', c:'--domain-resilience'},
};

const CONF_WEIGHT = {high:1.0, medium:0.7, low:0.45};

/* ---- Sample findings (demo data; NOT a port of upstream engine.js) ---- */
let FINDINGS = [
  {id:'f1', rule:'R103', domain:'finance', sev:4, conf:'high', nav:'finance',
    title:'Gross margin declining for two consecutive periods',
    basis:['Gross margin 38.2% this period vs 41.6% prior (−3.4pt)','Cost of goods grew 11% while revenue grew 4%','Source: finance.period.closed event#fp812, event#fp811'],
    confNote:'confidence HIGH — measured directly against two consecutive closed finance periods', playbook:'margin-review'},
  {id:'f2', rule:'R12', domain:'people', sev:3, conf:'high', nav:'roster',
    title:'1:1 cadence broken with Ana Ruiz',
    basis:['Last 1:1 with Ana was 24 days ago','Cadence 14d (person row) — strictly past','Source: oneonone.logged event#se42'],
    confNote:'confidence HIGH — measured against your own logged 1:1s', playbook:'1-1-run-sheet'},
  {id:'f3', rule:'R41', domain:'ops', sev:5, conf:'high', nav:'execution',
    title:'Sprint review is 2 days overdue',
    basis:['Sprint 24 review scheduled for Oct 13, not logged','Team velocity dropped 18% last sprint','Source: sprint.planned event#sp24, sprint.review.missing'],
    confNote:'confidence HIGH — derived from your own sprint calendar events', playbook:'sprint-review-recovery'},
  {id:'f4', rule:'R88', domain:'narrative', sev:3, conf:'medium', nav:'narrative',
    title:'Board meeting in 5 days — no narrative drafted',
    basis:['Board meeting scheduled Oct 20','No narrative.drafted event found in lookback window','Source: board.meeting.scheduled event#bm9'],
    confNote:'confidence MEDIUM — inferred from calendar event, not a confirmed draft absence', playbook:'board-narrative'},
  {id:'f5', rule:'R61', domain:'exec', sev:4, conf:'high', nav:'intelligence', recon:true,
    title:'Trust erosion pattern with leadership team unaddressed',
    basis:['3 trust-lost signals in 60 days, no repair move logged','Pattern spans 2 direct reports','Source: trust.lost event#tl3, event#tl4, event#tl5'],
    confNote:'confidence HIGH — reconstructed rule (R61, labeled recon) reading the trust feed directly', playbook:'trust-repair'},
  {id:'f6', rule:'R139', domain:'self', sev:1, conf:'low', nav:'self',
    title:'No active mentor relationship in 90+ days',
    basis:['No mentor.relationship event in current role window','Role tenure 134 days'],
    confNote:'confidence LOW — nudge class; absence of a log entry is not proof of absence of a mentor', playbook:'mentor-activation'},
  {id:'f7', rule:'R55', domain:'sales', sev:2, conf:'medium', nav:'sales',
    title:'Pipeline coverage thin for Q4 target',
    basis:['Coverage ratio 2.1x vs 3.0x target','14 open opportunities, 3 in late stage','Source: pipeline.snapshot event#ps19'],
    confNote:'confidence MEDIUM — snapshot-based, one data point this quarter', playbook:'pipeline-review'},
  {id:'f8', rule:'R77', domain:'external', sev:2, conf:'medium', nav:'external',
    title:'Competitor pricing move detected in primary segment',
    basis:['Competitor X cut list price 12% on flagship tier','Signal logged from market-watch note, not verified firsthand'],
    confNote:'confidence MEDIUM — single external source, unverified', playbook:'competitive-response'},
  {id:'f9', rule:'R33', domain:'legal', sev:3, conf:'high', nav:'org',
    title:'Compliance review overdue for data processing addendum',
    basis:['Review cadence 180d, last review 211 days ago','Source: compliance.review.logged event#cr4'],
    confNote:'confidence HIGH — measured against a fixed cadence setting', playbook:'compliance-review'},
  {id:'f10', rule:'R19', domain:'resilience', sev:4, conf:'high', nav:'resilience', recon:true,
    title:'Single vendor dependency for critical infrastructure',
    basis:['No secondary vendor logged for payment processing','Attrition-risk feed shows no mitigation move in 90d'],
    confNote:'confidence HIGH — reconstructed rule (R19, labeled recon) reading the attrition/vendor feed', playbook:'vendor-resilience'},
  {id:'f11', rule:'R91', domain:'mfg', sev:2, conf:'low', nav:'execution',
    title:'Defect rate trending up on Line 3',
    basis:['Defect rate 1.8% vs 1.2% baseline, n=3 batches only'],
    confNote:'confidence LOW — small sample, trend withheld under 5 measured points', playbook:'quality-review'},
  {id:'f12', rule:'R28', domain:'strategy', sev:1, conf:'low', nav:'strategy',
    title:'OKR mid-period check-in nudge',
    basis:['Period is 52% elapsed, no check-in logged since kickoff'],
    confNote:'confidence LOW — calendar-derived nudge, not a performance judgement', playbook:'okr-checkin'},
];

const PLAYBOOKS = ['margin-review','1-1-run-sheet','sprint-review-recovery','board-narrative','trust-repair','mentor-activation','pipeline-review','competitive-response','compliance-review','vendor-resilience','quality-review','okr-checkin'];
const PEOPLE = ['Ana Ruiz','Bruno Serra','Dana Oyelaran','Mika Tan'];

let dismissedStack = []; // for Undo (U)
let currentNav = 'today';
let selectedFindingId = null;
let focusIndex = 0;

/* ====================================================================
   renderComponent(type,data) — component factory
   ==================================================================== */
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function sevIcon(sev){ return {5:'⬡',4:'◆',3:'▲',2:'●',1:'·'}[sev] || '·'; }
function rankedActive(){ return FINDINGS.slice().sort((a,b)=> score(b)-score(a)); }
function score(f){ return (f.sev * CONF_WEIGHT[f.conf]).toFixed(2); }

function renderComponent(type, data){
  switch(type){
    case 'domainChip': {
      const d = DOMAINS[data.domain] || {label:data.domain, c:'--ink-3'};
      return `<span class="chip chip-domain" style="--c:var(${d.c})">${esc(d.label)}</span>`;
    }
    case 'ruleChip':
      return `<span class="chip chip-rule">${esc(data.rule)}</span>${data.recon ? '<span class="chip chip-recon">recon</span>' : ''}`;
    case 'confChip':
      return `<span class="chip chip-conf">conf ${data.conf}</span>`;
    case 'scoreMath': {
      const rank = rankedActive().findIndex(f=>f.id===data.id)+1;
      return `<div class="score-math">sev ${data.sev} × conf ${data.conf} ${CONF_WEIGHT[data.conf].toFixed(2)} = <b>${score(data)}</b><br>
        <span class="dim">rank #${rank} of ${FINDINGS.length} active findings</span><br>
        <span class="dim">domain: ${DOMAINS[data.domain].label.toUpperCase()} · rule: ${esc(data.rule)}</span></div>`;
    }
    case 'findingCard': return findingCardHTML(data);
    case 'insightCard': return insightCardHTML(data);
    case 'metricCard': return metricCardHTML(data);
    case 'bulletGraph': return bulletGraphHTML(data);
    case 'heatmapCell': return heatmapCellHTML(data);
    case 'sparkline': return sparklineHTML(data);
    default: return '';
  }
}
LeadOS.renderComponent = renderComponent;

function findingCardHTML(f){
  const d = DOMAINS[f.domain];
  const confClass = f.conf === 'high' ? 'conf-HIGH' : f.conf === 'medium' ? 'conf-MEDIUM' : 'conf-LOW';
  const rank = rankedActive().findIndex(x=>x.id===f.id)+1;
  return `
  <article class="finding-card ${selectedFindingId===f.id?'selected':''}" data-sev="${f.sev}" data-id="${f.id}" tabindex="0" role="article" aria-label="${esc(f.title)}">
    <div class="finding-top">
      <div class="finding-chips">
        <span class="sev-icon sev-icon-${f.sev}">${sevIcon(f.sev)}</span>
        ${renderComponent('domainChip',f)}
        ${renderComponent('ruleChip',f)}
        ${renderComponent('confChip',f)}
      </div>
      <div class="flex items-center gap-2">
        <span class="finding-rank">#${rank}</span>
        <span class="finding-score">${score(f)}</span>
      </div>
    </div>
    <div class="finding-title">${esc(f.title)}</div>
    <ul class="finding-basis">${f.basis.map(b=>`<li>${esc(b)}</li>`).join('')}</ul>
    ${renderComponent('scoreMath', f)}
    <div class="confidence-banner ${confClass}">${esc(f.confNote)}</div>
    <div class="finding-actions">
      <button class="btn btn-primary" data-action="open-playbook" data-id="${f.id}">Open Playbook</button>
      <button class="btn" data-action="snooze" data-id="${f.id}">Snooze 7d</button>
      <button class="btn btn-danger" data-action="dismiss" data-id="${f.id}">Dismiss</button>
      <button class="btn" data-action="history" data-id="${f.id}">View History</button>
    </div>
  </article>`;
}

function insightCardHTML(ids){
  const members = FINDINGS.filter(f=>ids.includes(f.id));
  if(!members.length) return '';
  const top = members[0];
  const d = DOMAINS[top.domain];
  return `
  <article class="insight-card" style="background:radial-gradient(circle at top left, color-mix(in srgb, var(${d.c}) 5%, transparent), transparent 70%);">
    <div class="insight-pattern-label">Pattern</div>
    <div class="finding-title">Avoidance + Trust Erosion compounding in leadership team</div>
    <p class="t-body dim" style="font-size:var(--text-sm);">Two independently-scored findings co-occur within the same 60-day window and share a root cause signature. Shown together because treating them separately under-weights the compounding risk.</p>
    <div class="insight-constituents">
      ${members.map(m=>`<button class="insight-pill" data-jump="${m.id}">${esc(m.rule)} · ${esc(m.title.slice(0,28))}…</button>`).join('')}
    </div>
    ${Math.max(...members.map(m=>m.sev))>=5 ? '<div class="insight-nosuppress">⬡ sev 5 pattern — suppression disabled</div>' : ''}
  </article>`;
}

function bulletGraphHTML({value,target,color}){
  const pct = Math.min(100, Math.round((value/target)*100));
  const over = value >= target;
  return `<div class="bullet"><div class="bullet-fill ${over?'over':''}" style="width:${pct}%; background:${over?'var(--accent)':color};"></div></div>
  <div class="bullet-meta"><span>${pct}% of target</span><span>${value} / ${target}</span></div>`;
}

function heatmapCellHTML({label,score,color}){
  return `<div class="heatmap-cell" title="${esc(label)}: ${score}/10" style="background:color-mix(in srgb, ${color} ${score*10}%, var(--surface-3));">${score}</div>`;
}

function sparklineHTML({points,color}){
  const w=120,h=32; const max=Math.max(...points), min=Math.min(...points);
  const norm = v => h - ((v-min)/(max-min||1))*h;
  const step = w/(points.length-1);
  const path = points.map((p,i)=>`${i*step},${norm(p).toFixed(1)}`).join(' ');
  const last = points[points.length-1];
  const delta = (((last-points[0])/(points[0]||1))*100).toFixed(0);
  const arrow = delta>5?'↗':delta>0?'↑':delta<-5?'↘':delta<0?'↓':'→';
  return `<svg width="${w}" height="${h}" aria-hidden="true">
    <polyline fill="none" stroke="${color}" stroke-width="1.5" points="${path}"/>
    <circle cx="${w}" cy="${norm(last)}" r="3" fill="${color}"/>
  </svg>
  <span class="t-mono" style="font-size:var(--text-sm); color:${color}">${arrow} ${delta>0?'+':''}${delta}%</span>`;
}

/* ====================================================================
   toastManager
   ==================================================================== */
const toastManager = (function(){
  const stack = document.getElementById('toastStack');
  const icons = {success:'✓', error:'✕', warning:'⚠', info:'ℹ'};
  function push(type, msg){
    const el = document.createElement('div');
    el.className = `toast toast-${type}`;
    el.innerHTML = `<span>${icons[type]||'ℹ'}</span><span>${esc(msg)}</span>`;
    stack.appendChild(el);
    while(stack.children.length > 3) stack.removeChild(stack.firstChild);
    setTimeout(()=>dismiss(el), 4000);
    return el;
  }
  function dismiss(el){ if(el && el.parentNode){ el.style.opacity='0'; setTimeout(()=>el.remove(),200);} }
  return {push, dismiss, stack:()=>stack.children};
})();
LeadOS.toastManager = toastManager;

/* ====================================================================
   themeManager
   ==================================================================== */
const themeManager = (function(){
  function get(){ return localStorage.getItem('leados:theme') || 'system'; }
  function apply(mode){
    const real = mode === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches?'light':'dark') : mode;
    document.documentElement.setAttribute('data-theme', real);
  }
  function set(mode){ localStorage.setItem('leados:theme', mode); apply(mode); }
  function detect(){ apply(get()); }
  return {get,set,detect};
})();

const scrollManager = (function(){
  const scroller = document.getElementById('mainScroll');
  function jumpTo(id){
    const el = document.querySelector(`[data-id="${id}"]`);
    if(el) el.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto':'smooth', block:'center'});
  }
  function buildMiniToc(findings){
    document.querySelectorAll('.mini-toc').forEach(e=>e.remove());
    if(findings.length <= 10) return;
    const domains = [...new Set(findings.map(f=>f.domain))];
    const toc = document.createElement('div');
    toc.className = 'mini-toc';
    toc.innerHTML = domains.map(d=>`<button style="--c:var(${DOMAINS[d].c})" data-domain-jump="${d}" aria-label="Jump to ${DOMAINS[d].label}" title="${DOMAINS[d].label}"></button>`).join('');
    document.body.appendChild(toc);
    toc.querySelectorAll('button').forEach(b=>b.addEventListener('click', ()=>{
      const first = findings.find(f=>f.domain===b.dataset.domainJump);
      if(first) jumpTo(first.id);
    }));
  }
  return {jumpTo, buildMiniToc, scroller};
})();

   ==================================================================== */
const keyboardShortcuts = (function(){
  const map = {};
  function bind(key, fn){ map[key.toLowerCase()] = fn; }
  function unbind(key){ delete map[key.toLowerCase()]; }
  document.addEventListener('keydown', (e)=>{
    const tag = (e.target.tagName||'').toLowerCase();
    const typing = tag==='input' || tag==='textarea';
    if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); commandPalette.open(); return; }
    if(typing) return;
    const k = e.key.toLowerCase();
    if(map[k]) { e.preventDefault(); map[k](e); }
  });
  return {bind, unbind};
})();
LeadOS.keyboardShortcuts = keyboardShortcuts;

/* ====================================================================

   ==================================================================== */
const commandPalette = (function(){
  const backdrop = document.getElementById('cmdkBackdrop');
  const input = document.getElementById('cmdkInput');
  const body = document.getElementById('cmdkBody');
  let activeIndex = 0, results = [];

  function open(){ backdrop.classList.add('open'); input.value=''; input.focus(); search(''); }
  function close(){ backdrop.classList.remove('open'); }

  function buildResults(q){
    q = q.trim();
    const groups = [];
    if(!q){
      groups.push({label:'RECENT', items:[
        {text:'Open playbook: margin-review', act:()=>openPlaybook('margin-review')},
        {text:'Log 1:1 with Bruno Serra', act:()=>toastManager.push('info','Quick-log stub: 1:1 with Bruno Serra')},
        {text:'View Finance dashboard', act:()=>navTo('finance')},
      ]});
      const top5 = rankedActive().filter(f=>f.sev>=4).slice(0,3);
      groups.push({label:'SUGGESTED', items: top5.map(f=>({text:`${sevIcon(f.sev)} ${f.rule} ${f.title}`, act:()=>{navTo('today'); setTimeout(()=>scrollManager.jumpTo(f.id),50);}}))});
      groups.push({label:'QUICK LOG', items:[
        {text:'+ Log 1:1 with…', act:()=>toastManager.push('success','Quick capture stub opened')},
        {text:'+ Record pulse for…', act:()=>toastManager.push('success','Pulse capture stub opened')},
        {text:'+ Flag risk…', act:()=>toastManager.push('success','Risk flag stub opened')},
        {text:'+ Note a decision…', act:()=>toastManager.push('success','Decision log stub opened')},
      ]});
      return groups;
    }
    if(q.startsWith('>')){
      const cmd = q.slice(1).trim();
      groups.push({label:'COMMAND', items:[
        {text:'> theme light', act:()=>{themeManager.set('light'); toastManager.push('success','Theme set to light');}},
        {text:'> theme dark', act:()=>{themeManager.set('dark'); toastManager.push('success','Theme set to dark');}},
        {text:'> export', act:()=>{navTo('data'); toastManager.push('info','Jumped to Data → export');}},
        {text:'> seed', act:()=>toastManager.push('success','Sample data already loaded (demo)')},
        {text:'> purge', act:()=>toastManager.push('warning','Purge requires confirmation in Data view')},
        {text:'> health', act:()=>navTo('health')},
      ].filter(i=>i.text.includes(cmd))});
      return groups;
    }
    if(q.startsWith('#')){
      const dkey = q.slice(1).toLowerCase();
      const matches = FINDINGS.filter(f=>f.domain.includes(dkey));
      groups.push({label:'DOMAIN · '+dkey.toUpperCase(), items: matches.map(f=>findingResultItem(f))});
      return groups;
    }
    if(q.startsWith('sev:')){
      const s = q.slice(4).trim();
      const matches = FINDINGS.filter(f=>String(f.sev)===s);
      groups.push({label:'SEVERITY '+s, items: matches.map(f=>findingResultItem(f))});
      return groups;
    }
    if(q.startsWith('@')){
      const name = q.slice(1).toLowerCase();
      const people = PEOPLE.filter(p=>p.toLowerCase().includes(name));
      groups.push({label:'PEOPLE', items: people.map(p=>({text:p, act:()=>{navTo('roster'); toastManager.push('info','Showing context for '+p);}}))});
      groups.push({label:'RELATED FINDINGS', items: FINDINGS.filter(f=>f.title.toLowerCase().includes(name)).map(findingResultItem)});
      return groups;
    }
    const ql = q.toLowerCase();
    const findingMatches = FINDINGS.filter(f=> f.title.toLowerCase().includes(ql) || f.rule.toLowerCase().includes(ql) || f.domain.includes(ql));
    const playbookMatches = PLAYBOOKS.filter(p=>p.includes(ql));
    const peopleMatches = PEOPLE.filter(p=>p.toLowerCase().includes(ql));
    if(findingMatches.length) groups.push({label:'FINDINGS', items: findingMatches.map(findingResultItem)});
    if(playbookMatches.length) groups.push({label:'PLAYBOOKS', items: playbookMatches.map(p=>({text:p, act:()=>openPlaybook(p)}))});
    if(peopleMatches.length) groups.push({label:'PEOPLE', items: peopleMatches.map(p=>({text:p, act:()=>navTo('roster')}))});
    if(!groups.length) groups.push({label:'NO RESULTS', items:[{text:'Try #domain, sev:N, @person, or >command', act:()=>{}}]});
    return groups;
  }
  function findingResultItem(f){
    return {text:`${sevIcon(f.sev)} ${f.rule} — ${f.title}`, act:()=>{ navTo('today'); setTimeout(()=>{scrollManager.jumpTo(f.id); openFindingDetail(f.id);},50); }};
  }
  function search(q){
    const groups = buildResults(q);
    results = groups.flatMap(g=>g.items);
    activeIndex = 0;
    body.innerHTML = groups.map(g=>`<div class="cmdk-group-label">${g.label}</div>${g.items.map((it,i)=>`<div class="cmdk-item" data-idx="${results.indexOf(it)}"><span class="kicker">▶</span><span>${esc(it.text)}</span></div>`).join('')}`).join('');
    highlight();
  }
  function highlight(){
    body.querySelectorAll('.cmdk-item').forEach(el=>el.classList.toggle('active', +el.dataset.idx===activeIndex));
  }
  function execute(idx){
    const item = results[idx!==undefined?idx:activeIndex];
    if(item){ close(); item.act(); }
  }
  input.addEventListener('input', ()=>search(input.value));
  input.addEventListener('keydown', (e)=>{
    if(e.key==='ArrowDown'){ e.preventDefault(); activeIndex=Math.min(results.length-1, activeIndex+1); highlight(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); activeIndex=Math.max(0, activeIndex-1); highlight(); }
    else if(e.key==='Enter'){ e.preventDefault(); execute(); }
    else if(e.key==='Escape'){ close(); }
  });
  body.addEventListener('click', (e)=>{
    const item = e.target.closest('.cmdk-item');
    if(item) execute(+item.dataset.idx);
  });
  backdrop.addEventListener('click', (e)=>{ if(e.target===backdrop) close(); });
  return {open, close, search, execute};
})();
LeadOS.commandPalette = commandPalette;

function domainBadge(navKey){
  const relevant = FINDINGS.filter(f=>f.nav===navKey || (navKey==='today'));
  if(!relevant.length) return '';
  const maxSev = Math.max(...relevant.map(f=>f.sev));
  const cls = maxSev>=5?'badge-5':maxSev===4?'badge-4':maxSev===3?'badge-3':'badge-0';
  return `<span class="badge ${cls}">${relevant.length}</span>`;
}

function wireDataView(){

    const blob = new Blob([JSON.stringify({findings:FINDINGS}, null, 2)], {type:'application/json'});

    <div class="panel-head">
      <div>
        <div class="t-label">${esc(f.rule)} ${f.recon?'· recon':''}</div>
        <h2 class="t-display" style="font-size:var(--text-lg); margin-top:4px;">${esc(f.title)}</h2>
      </div>
      <button class="icon-btn" id="panelClose" aria-label="Close panel">✕</button>
    </div>
    <div class="panel-body">
      ${renderComponent('scoreMath', f)}
      <div>
        <div class="t-label mb-2">Basis</div>
        <ul class="finding-basis">${f.basis.map(b=>`<li>${esc(b)}</li>`).join('')}</ul>
      </div>
      <div class="confidence-banner conf-${f.conf==='high'?'HIGH':f.conf==='medium'?'MEDIUM':'LOW'}">${esc(f.confNote)}</div>
      <div class="finding-actions">
        <button class="btn btn-primary" data-action="open-playbook" data-id="${f.id}">Open Playbook</button>
        <button class="btn" data-action="snooze" data-id="${f.id}">Snooze 7d</button>
        <button class="btn btn-danger" data-action="dismiss" data-id="${f.id}">Dismiss</button>
      </div>
    </div>
  `);
  document.getElementById('panelClose').addEventListener('click', panelManager.close);
  wireViewEvents();
}

function openPlaybook(name, id){
  if(!name){ toastManager.push('warning','No playbook linked — printed refusal (per project doctrine: every finding links a playbook or explains why it has none)'); return; }
  toastManager.push('success', `Opening playbook: ${name}`);
}

function snoozeFinding(id){
  const f = findById(id);
  if(!f) return;
  const card = document.querySelector(`.finding-card[data-id="${id}"]`);
  if(card) card.classList.add('leaving');
  dismissedStack.push({f, action:'snoozed'});
  setTimeout(()=>{ FINDINGS = FINDINGS.filter(x=>x.id!==id); renderRail(); renderView(); }, 220);
  toastManager.push('info', `Snoozed 7d: ${f.rule}. Press U to undo.`);
}

function dismissFinding(id){
  const f = findById(id);
  if(!f) return;
  const card = document.querySelector(`.finding-card[data-id="${id}"]`);
  if(card) card.classList.add('leaving');
  dismissedStack.push({f, action:'dismissed'});
  setTimeout(()=>{ FINDINGS = FINDINGS.filter(x=>x.id!==id); renderRail(); renderView(); }, 220);
  toastManager.push('warning', `Dismissed: ${f.rule}. Press U to undo.`);
}

function undoLast(){
  const last = dismissedStack.pop();
  if(!last){ toastManager.push('info','Nothing to undo'); return; }
  FINDINGS.push(last.f);
  renderRail(); renderView();
  toastManager.push('success', `Undid ${last.action}: ${last.f.rule}`);
}

function runHealthAnim(){
  const container = document.getElementById('healthChecks');
  if(!container) return;
  container.innerHTML = Array.from({length:4}).map(()=>`<div class="skeleton" style="height:28px;"></div>`).join('');
  setTimeout(()=>{ renderView(); toastManager.push('success','Health suite re-run: 26/26 PASS'); }, 500);
}

/* ====================================================================
   Global keyboard bindings
   ==================================================================== */
keyboardShortcuts.bind('t', ()=>navTo('today'));
keyboardShortcuts.bind('r', ()=>navTo('roster'));
keyboardShortcuts.bind('p', ()=>navTo('playbooks'));
keyboardShortcuts.bind('h', ()=>navTo('health'));
keyboardShortcuts.bind('d', ()=>navTo('data'));
keyboardShortcuts.bind('u', undoLast);
keyboardShortcuts.bind('[', ()=>document.getElementById('app').classList.toggle('rail-collapsed'));
keyboardShortcuts.bind('?', ()=>document.getElementById('shortcutsBackdrop').classList.add('open'));
keyboardShortcuts.bind('escape', ()=>{
  commandPalette.close();
  document.getElementById('shortcutsBackdrop').classList.remove('open');
  panelManager.close();
});
keyboardShortcuts.bind('j', ()=>{
  const cards = [...document.querySelectorAll('.finding-card')];
  if(!cards.length) return;
  focusIndex = Math.min(cards.length-1, focusIndex+1);
  cards[focusIndex].focus(); cards[focusIndex].scrollIntoView({block:'center'});
});
keyboardShortcuts.bind('k', ()=>{}); // reserved; cmdk handled globally via meta/ctrl+k
keyboardShortcuts.bind('enter', ()=>{
  const el = document.activeElement;
  if(el && el.classList.contains('finding-card')) openPlaybook(findById(el.dataset.id)?.playbook, el.dataset.id);
});
keyboardShortcuts.bind('s', ()=>{
  const el = document.activeElement;
  if(el && el.classList.contains('finding-card')) snoozeFinding(el.dataset.id);
});
keyboardShortcuts.bind('x', ()=>{
  const el = document.activeElement;
  if(el && el.classList.contains('finding-card')) dismissFinding(el.dataset.id);
});

document.getElementById('railToggle').addEventListener('click', ()=>document.getElementById('app').classList.toggle('rail-collapsed'));
document.getElementById('closeShortcuts').addEventListener('click', ()=>document.getElementById('shortcutsBackdrop').classList.remove('open'));
document.getElementById('bottomCmdk').addEventListener('click', ()=>commandPalette.open());
document.querySelectorAll('#bottomTabs [data-nav]').forEach(b=>b.addEventListener('click', ()=>navTo(b.dataset.nav)));

/* Shortcuts overlay content */
(function(){
  const grid = document.getElementById('shortcutsGrid');
  const rows = [
    ['K','Command palette'],['T','Jump to Today'],['R','Jump to Roster'],['P','Jump to Playbooks'],
    ['H','Jump to Health'],['D','Jump to Data'],['J','Next finding'],['Enter','Open playbook'],
    ['S','Snooze focused'],['X','Dismiss focused'],['U','Undo last suppression'],['[','Collapse rail'],
    ['?','This overlay'],['Esc','Close overlay/panel'],
  ];
  grid.innerHTML = rows.map(([k,l])=>`<div class="shortcut-row"><span>${l}</span><span class="kbd">${k}</span></div>`).join('');
})();

/* ====================================================================
   Boot
   ==================================================================== */
document.body.setAttribute('data-print-date', new Date().toLocaleDateString());
renderRail();
navTo('today');

})();
</script>
