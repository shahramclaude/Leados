function emptyState(){

function normalize(st){
  st = st && typeof st==='object' ? st : {};

        const expected = d.revenue - d.cogs;

];
function checkInvariants(st){
  const violations=[];
  for(const inv of DATA_INVARIANTS){
    try{ if(!inv.check(st)) violations.push({name:inv.name, severity:inv.severity||'blocker'}); }
    catch(e){ violations.push({name:inv.name, severity:'warning', error:e.message}); }

// ---------------------------------------------------------------------------

// ---------------------------------------------------------------------------
const EVENT_VALIDATORS = {
  'oneonone.logged': (d,P)=>{
    if(!d.personId) return 'personId required';
    if(!P.peopleById[d.personId]) return 'personId not found in roster';
    if(P.peopleById[d.personId].archived) return 'person is archived — 1:1 with archived person unlikely';

  },
  'fin.pl.logged': (d)=>{
    const required=['revenue','cogs','gross_profit','opex_total','ebitda','net_income'];

// ---------------------------------------------------------------------------
// 5. PROJECTION — recomputed from the raw event array every call. Nothing
//    derived is cached in the store itself (append-only discipline).
// ---------------------------------------------------------------------------
function days(aIso,bIso){ return (Date.parse(bIso)-Date.parse(aIso))/86400000; }

function project(events, people){
  people = people || [];
  const peopleById = {}; people.forEach(p=>peopleById[p.id]=p);
  const lines = { broken: [] };
  people.forEach(p=>{ if(p.reportsTo && (p.reportsTo===p.id || !peopleById[p.reportsTo])) lines.broken.push({personId:p.id, reportsTo:p.reportsTo}); });

  const _skipped = { danglingPerson:0 };
  function checkPerson(id){ if(id && !peopleById[id]){ _skipped.danglingPerson++; return false;} return true; }

  const resolvedSignalIds = new Set(events.filter(e=>e.type==='signal.resolved').map(e=>e.data.signalId));
  const snoozeCounts = {};
  events.filter(e=>e.type==='finding.snoozed').forEach(e=>{ snoozeCounts[e.data.key]=(snoozeCounts[e.data.key]||0)+1; });

  const findings = events.filter(e=>e.type==='signal.raised' && !resolvedSignalIds.has(e.id))
    .map(e=>({ key:'signal:'+e.id, id:e.id, domain:e.data.domain, sev:e.data.severity, ts:e.ts,
      title:e.data.title, note:e.data.note||'', snoozeCount: snoozeCounts['signal:'+e.id]||0 }));

  const goalById={}; const goals=[];
  events.filter(e=>e.type==='goal.set').forEach(e=>{
    const g={ id:e.id, title:e.data.title, domain:e.data.domain||'org', ownerId:e.data.ownerId||null, ts:e.ts, lastProgressTs:e.ts, closed:false, result:null };
    if(e.data.ownerId) checkPerson(e.data.ownerId);
    goalById[g.id]=g; goals.push(g);
  });
  events.filter(e=>e.type==='goal.progress').forEach(e=>{ const g=goalById[e.data.goalId]; if(g) g.lastProgressTs=e.ts; });
  events.filter(e=>e.type==='goal.closed').forEach(e=>{ const g=goalById[e.data.goalId]; if(g){ g.closed=true; g.result=e.data.result||''; g.closedTs=e.ts; } });
  const openGoals = goals.filter(g=>!g.closed);

  const decisionById={}; const decisions=[];
  events.filter(e=>e.type==='decision.logged').forEach(e=>{
    const d={ id:e.id, title:e.data.title, domain:e.data.domain||'org', ts:e.ts, confidence:e.data.confidence,
      risk:e.data.risk, reversible:!!e.data.reversible, urgent:!!e.data.urgent, outcome:null };
    decisionById[d.id]=d; decisions.push(d);
  });
  events.filter(e=>e.type==='decision.outcome').forEach(e=>{ const d=decisionById[e.data.decisionId]; if(d){ d.outcome=e.data.outcome; d.outcomeTs=e.ts; } });
  const openDecisions = decisions.filter(d=>!d.outcome);

  const commitmentById={}; const commitments=[];
  events.filter(e=>e.type==='commitment.made').forEach(e=>{
    const c={ id:e.id, ownerId:e.data.ownerId||null, desc:e.data.desc, by_date:e.data.by_date, ts:e.ts, resolved:false };
    if(e.data.ownerId) checkPerson(e.data.ownerId);
    commitmentById[c.id]=c; commitments.push(c);
  });
  events.filter(e=>e.type==='commitment.resolved').forEach(e=>{ const c=commitmentById[e.data.commitmentId]; if(c){ c.resolved=true; c.resolvedTs=e.ts; } });
  const openCommitments = commitments.filter(c=>!c.resolved);

  const conflictById={}; const conflicts=[];
  events.filter(e=>e.type==='conflict.logged').forEach(e=>{
    const c={ id:e.id, title:e.data.title, parties:e.data.parties||'', ts:e.ts, resolved:false };
    conflictById[c.id]=c; conflicts.push(c);
  });
  events.filter(e=>e.type==='conflict.resolved').forEach(e=>{ const c=conflictById[e.data.conflictId]; if(c){ c.resolved=true; c.resolvedTs=e.ts; } });

  const successionCandidates = events.filter(e=>e.type==='succession.candidate.added')
    .map(e=>({ id:e.id, personId:e.data.personId, role:e.data.role, ts:e.ts }));
  successionCandidates.forEach(s=>checkPerson(s.personId));

  const growthPlans = []; const gpByPerson={};
  events.filter(e=>e.type==='growthplan.level.set').forEach(e=>{
    const key=e.data.personId+':'+(e.data.domain||'org');
    if(!gpByPerson[key]){ gpByPerson[key]={ id:key, personId:e.data.personId, domain:e.data.domain||'org', spine:[] }; growthPlans.push(gpByPerson[key]); }
    gpByPerson[key].spine.push({ d:e.data.level, ts:e.ts });
  });

  const financials = events.filter(e=>e.type==='fin.pl.logged').map(e=>e.data);
  const pulses = events.filter(e=>e.type==='pulse.recorded').map(e=>({...e.data, ts:e.ts}));
  const okrs = events.filter(e=>e.type==='strategy.okr.set').map(e=>({...e.data, ts:e.ts}));

  return {
    state:{events}, meta:{createdAt: events.length? events[0].ts : null},
    people, peopleById, lines, findings,
    goals, goalById, openGoals,
    decisions, decisionById, openDecisions,
    commitments, commitmentById, openCommitments,
    conflicts, conflictById, openConflicts: conflicts.filter(c=>!c.resolved),
    successionCandidates, growthPlans, financials, pulses, okrs,
    _skipped
  };
}

// 6. TEMPORAL FIELD — classify findings by age into 3 horizons.
//    FABRICATED (not found verbatim in the real src/lib files, but built to

function classifyAge(ageDays){
  if(ageDays < 30) return 'REACTIVE';
  if(ageDays <= 180) return 'STRATEGIC';
  return 'STRUCTURAL';
}
function buildTemporalProfile(P, today){
  const todayIso = new Date(today).toISOString();
  const ages = P.findings.map(f=> days(f.ts, todayIso));
  const buckets = { REACTIVE:0, STRATEGIC:0, STRUCTURAL:0 };
  ages.forEach(a=> buckets[classifyAge(a)]++ );
  const total = P.findings.length || 1;
  const proportions = {};
  Object.keys(buckets).forEach(k=> proportions[k] = { count:buckets[k], pct: Math.round(buckets[k]/total*1000)/10 });
  const avgFindingAgeDays = ages.length? Math.round(ages.reduce((a,b)=>a+b,0)/ages.length) : 0;
  const reactivePct = buckets.REACTIVE/total, strategicPct = buckets.STRATEGIC/total, structuralPct = buckets.STRUCTURAL/total;
  let mode = 'BALANCED';
  if (reactivePct > 0.6) mode = 'REACTIVE';                      // G_TEMPORAL rule, as specified in the brief
  else if (structuralPct > 0.4 && structuralPct >= strategicPct) mode = 'STRUCTURAL_STRESS';
  else if (strategicPct > 0.4) mode = 'STRATEGIC_DRIFT';
  return { proportions, avgFindingAgeDays, diagnosis:{ mode }, total: P.findings.length };
}

// 7. ORG PHYSICS — domainMath/heatmap/velocity/entropy/energy/resonance.
//    VERIFIED formulas/field names cross-checked against src/lib/physics.ts
//    fetched raw this session; that file's own header discloses IT is a

// ---------------------------------------------------------------------------
function domainMath(domain, P, asOf, excludeEventId){
  const asOfIso = new Date(asOf).toISOString();
  const rows = P.findings.filter(f=>f.domain===domain && Date.parse(f.ts)<=Date.parse(asOfIso) && f.id!==excludeEventId)
    .map(f=>{ const ageDays = Math.max(0, days(f.ts, asOfIso)); const weight = f.sev*Math.pow(DECAY, ageDays);
      return { key:f.key, sev:f.sev, ageDays:Math.round(ageDays*10)/10, weight, ts:f.ts, title:f.title }; });
  const rawScore = rows.reduce((a,r)=>a+r.weight,0);
  return { domain, asOf:asOfIso, score: Math.min(10, Math.round(rawScore*10)/10), rawScore, rows };
}
function heatmap(P, asOf){ const out={}; DOMAINS.forEach(d=> out[d]=domainMath(d,P,asOf)); return out; }
function measureVelocity(domain, P, today, lookbackDays){
  lookbackDays = lookbackDays || 30;
  const now = domainMath(domain,P,today);
  const past = domainMath(domain,P, new Date(Date.parse(new Date(today).toISOString()) - lookbackDays*86400000).toISOString());
  const perDay = (now.score - past.score)/lookbackDays;
  return { domain, perDay: Math.round(perDay*1000)/1000, projection30d: Math.round((now.score+perDay*30)*10)/10, now, past };

function measureResonanceRaw(dayNumbers, eventType){
  if (dayNumbers.length < 4) return null;

  const first = dayNumbers.slice(0,mid), second = dayNumbers.slice(mid);
  function freqPerWeek(arr){ const span = Math.max(1, arr[arr.length-1]-arr[0]); return arr.length/(span/7); }
  const firstFreq = freqPerWeek(first), secondFreq = freqPerWeek(second);
  const changeRatio = firstFreq>0 ? secondFreq/firstFreq : null;
  const direction = changeRatio!=null && changeRatio>1.2 ? 'AMPLIFYING' : changeRatio!=null && changeRatio<0.8 ? 'FADING' : 'STABLE';
  return { eventType, totalCount:dayNumbers.length, firstHalfFreqPerWeek:Math.round(firstFreq*10)/10,

  if (risk>=7 && !reversible && urgent) return 'CRISIS_DECIDE';

function createRateLimiter(maxPerWindow, windowMs){
  let hits = [];
  return { check(){
    const now = Date.now();
    hits = hits.filter(t => now - t < windowMs);
    hits.push(now);
    return hits.length <= maxPerWindow;
  }};
}

const LeadOS = {
  nav, render,
  snoozeFinding(signalId){ appendEvent(ST,'finding.snoozed',{key:'signal:'+signalId}); render(); },
  resolveFinding(signalId){ appendEvent(ST,'signal.resolved',{signalId}); render(); },
  generateSynthesis(){
    const P = project(ST.events, ST.people);
    const today = new Date();
    const moment = generateOrganizationalMoment(P, today);
    const five = computeFiveThingsThatMatter(P, today);
    const hardQuestion = generateHardestQuestion(P, today);
    const eventCountAtGeneration = ST.events.length; // snapshotted BEFORE the append, so staleness is measured correctly
    appendEvent(ST, 'synthesis.generated', { momentText: moment.text, mode: moment.mode, energyAssessment: moment.energyAssessment, five, hardQuestion, eventCountAtGeneration });
    render();
  },
  submitForm(i){
    const fd = FORM_DEFS[i];
    const data = {};
    fd.fields.forEach(f=>{
      const el = document.getElementById('f_'+i+'_'+f.k);
      if (f.t==='checkbox') data[f.k] = el.checked;
      else if (f.t==='number') data[f.k] = el.value===''? undefined : Number(el.value);
      else data[f.k] = el.value;
    });
    const errEl = document.getElementById('err_'+i);
    for (const f of fd.fields){ if (f.required && (data[f.k]===undefined || data[f.k]==='')){ errEl.textContent = f.k+' is required'; return; } }
    if (fd.type==='person.added'){ addPerson(ST, data); errEl.textContent=''; render(); return; }
    if (fd.type==='fin.pl.logged'){ data.gross_profit = data.revenue - data.cogs; data.ebitda = data.gross_profit - data.opex_total; }
    if (fd.type==='strategy.okr.set'){ data.keyResults = (data.keyResultsText||'').split('\n').map(s=>s.trim()).filter(Boolean).map(kr=>({kr})); delete data.keyResultsText; }
    const res = appendEvent(ST, fd.type, data);
    if (!res.ok){ errEl.textContent = res.error; return; }
    errEl.textContent = '';
    render();
  },
  exportLog(){
    const blob = new Blob([JSON.stringify(ST,null,2)], {type:'application/json'});
    const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='leados-pt-i-export.json'; a.click();
  },
  wipeLog(){
    if (!confirm('Wipe all local data and reseed?')) return;
    ST = emptyState(); save(ST); seedIfEmpty(ST); render();
  }
};
