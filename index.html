<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeadOS — pt-G demo (Adaptive Intelligence Interface)</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style>
/* ============================================================
   LEADOS pt-G — DESIGN TOKENS
   Dark-theme hex values below (--ink-0..3, --surface-1/2, --sev-5,
   --accent) are copied verbatim from the pt-G brief's own contrast
   table. Light ("Parchment") and Terminal theme values are this
   session's own invented palette (not specified in the brief) —
   FABRICATED, chosen only to keep the same contrast relationships.
   ============================================================ */
:root, [data-theme="dark"]{
  --surface-1:#141210; --surface-2:#1C1917; --surface-3:#242019; --surface-4:#2C2720;
  --ink-0:#F7F4EF; --ink-1:#D4CEC3; --ink-2:#9A9085; --ink-3:#5C564E; --ink-4:#3A342C;
  --accent:#C23B2E;
  --sev-5:#FF2D2D; --sev-4:#FF8A3D; --sev-3:#F2C94C; --sev-2:#6FCF97; --sev-1:#5B9BD5;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
[data-theme="light"]{
  --surface-1:#F7F4EF; --surface-2:#EFEAE1; --surface-3:#E4DDD0; --surface-4:#D9CFBC;
  --ink-0:#1E1A14; --ink-1:#3C362C; --ink-2:#6B6356; --ink-3:#938A7B; --ink-4:#C9C0B0;
  --accent:#9A3226;
  --sev-5:#B8281D; --sev-4:#A8591A; --sev-3:#7A631B; --sev-2:#2E7D4F; --sev-1:#2E5F8A;
}
[data-theme="terminal"]{
  --surface-1:#000000; --surface-2:#070707; --surface-3:#0E0E0E; --surface-4:#171717;
  --ink-0:#E8FFE8; --ink-1:#B8FFB8; --ink-2:#6FCF6F; --ink-3:#3C8C3C; --ink-4:#1F4D1F;
  --accent:#00FF66;
  --sev-5:#FF3B3B; --sev-4:#FFB13B; --sev-3:#FFF23B; --sev-2:#3BFF8F; --sev-1:#3BD1FF;
  --font-body: var(--font-mono);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--surface-1); color:var(--ink-0);
  font-family:var(--font-body); font-size:14px; line-height:1.5;
  min-height:100vh;
}
.mono{font-family:var(--font-mono);}
button{font-family:inherit; cursor:pointer;}
a{color:inherit;}

/* Skip link */
.skip-link{
  position:absolute; left:8px; top:-48px; z-index:10000;
  background:var(--accent); color:#fff; padding:10px 16px; border-radius:6px;
  transition:top .15s ease; font-size:13px; font-weight:600;
}
.skip-link:focus{ top:8px; }

/* Focus ring: inside, consistent */
:focus-visible{ outline:2px solid var(--accent); outline-offset:-2px; border-radius:2px; }
:focus:not(:focus-visible){ outline:none; }

.sr-only{
  position:absolute; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
}

/* ---------- Shell layout ---------- */
#shell{ display:flex; min-height:100vh; }
#rail{
  width:220px; flex:none; background:var(--surface-2); border-right:1px solid var(--ink-4);
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto;
  transition:width .18s ease;
}
body.focus-mode #rail{ width:64px; }
#rail .brand{ padding:18px 16px; border-bottom:1px solid var(--ink-4); }
#rail .brand .nm{ font-weight:800; letter-spacing:.06em; font-size:15px; }
#rail .brand .tag{ font:11px var(--font-mono); color:var(--ink-3); margin-top:2px; }
#rail nav{ flex:1; padding:10px 8px; }
.rail-link{
  display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:7px;
  color:var(--ink-1); text-decoration:none; font-size:13.5px; margin-bottom:2px;
}
.rail-link:hover{ background:var(--surface-3); }
.rail-link[aria-current="page"]{ background:var(--surface-4); color:var(--ink-0); font-weight:600; }
.rail-link .ic{ width:18px; text-align:center; flex:none; color:var(--ink-2); }
.rail-link .lb{ flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
body.focus-mode .rail-link .lb{ display:none; }
.rail-badge{
  font:10px var(--font-mono); background:var(--surface-4); color:var(--ink-1);
  border-radius:9px; padding:1px 6px; flex:none;
}
#rail .rail-footer{
  padding:10px 14px; border-top:1px solid var(--ink-4); font:10px var(--font-mono); color:var(--ink-3);
}

#main{ flex:1; min-width:0; display:flex; flex-direction:column; }
#topbar{
  display:flex; align-items:center; gap:10px; padding:12px 20px; border-bottom:1px solid var(--ink-4);
  background:var(--surface-1); position:sticky; top:0; z-index:40;
}
#topbar h1{ font-size:16px; margin:0; flex:1; }
.btn{
  background:var(--surface-3); color:var(--ink-1); border:1px solid var(--ink-4);
  padding:6px 10px; border-radius:6px; font-size:12.5px; display:inline-flex; align-items:center; gap:6px;
}
.btn:hover{ background:var(--surface-4); color:var(--ink-0); }
.btn.primary{ background:var(--accent); color:#fff; border-color:var(--accent); }
.btn.danger{ color:var(--sev-5); border-color:var(--sev-5); }
.kbd{ font:10px var(--font-mono); background:var(--surface-4); border:1px solid var(--ink-4); padding:1px 5px; border-radius:4px; }

#content-wrap{ flex:1; display:flex; min-width:0; }
#content{ flex:1; min-width:0; padding:20px 24px; max-width:860px; }
body.wide-mode #content{ max-width:1120px; }
#panel{
  width:380px; flex:none; border-left:1px solid var(--ink-4); background:var(--surface-2);
  padding:18px; overflow-y:auto; position:relative; display:none;
}
#panel.open{ display:block; }
#panel-resizer{
  width:6px; cursor:col-resize; background:transparent; flex:none; display:none;
}
#panel.open ~ #panel-resizer, #panel-resizer.active{ display:block; }

h2{ font-size:14px; letter-spacing:.03em; text-transform:uppercase; color:var(--ink-2); margin:0 0 12px; }

/* ---------- Finding card ---------- */
.fin{
  border:1px solid var(--ink-4); border-left-width:4px; border-radius:8px; background:var(--surface-2);
  padding:14px 16px; margin-bottom:10px;
}
.fin.sevhot{ border-left-color:var(--sev-5); }
.fin.sev4{ border-left-color:var(--sev-4); }
.fin.sevmid{ border-left-color:var(--sev-3); }
.fin.sevlow{ border-left-color:var(--sev-2); }
.fin:focus-visible{ outline:2px solid var(--accent); outline-offset:-2px; }
.fin-header{ display:flex; gap:8px; align-items:center; margin-bottom:6px; flex-wrap:wrap; }
.chip{
  font:10.5px var(--font-mono); text-transform:uppercase; letter-spacing:.04em;
  background:var(--surface-4); color:var(--ink-2); border-radius:4px; padding:2px 6px;
}
.chip.conf-high{ color:var(--sev-2); }
.chip.conf-medium{ color:var(--sev-3); }
.chip.conf-low{ color:var(--ink-3); }
.fin-rank{ margin-left:auto; font:11px var(--font-mono); color:var(--ink-3); }
.fin-title{ font-size:14.5px; font-weight:600; margin:4px 0 8px; }
.fin-basis{ font:12px var(--font-mono); color:var(--ink-2); background:var(--surface-1); border:1px solid var(--ink-4); border-radius:6px; padding:8px 10px; margin-bottom:8px; }
.fin-basis p{ margin:2px 0; }
.story{ font-size:12.5px; color:var(--ink-1); margin:6px 0 2px; }
.source-line{ font:10.5px var(--font-mono); color:var(--ink-3); margin-bottom:8px; }
.fin-act{ display:flex; gap:8px; flex-wrap:wrap; }
.fin-act button{ font-size:11.5px; padding:5px 9px; }

/* ---------- Metric card ---------- */
.metric-card{
  border:1px solid var(--ink-4); border-radius:10px; background:var(--surface-2); padding:16px;
}
.metric-card .mv{ font:28px var(--font-mono); font-weight:700; }
.metric-card .ml{ font-size:12px; color:var(--ink-2); text-transform:uppercase; letter-spacing:.04em; }
.metric-card svg{ display:block; margin:8px 0; }
.anomaly-toggle{ font:11px var(--font-mono); color:var(--ink-3); background:none; border:none; padding:0; text-decoration:underline dotted; }
.compare-line{ font-size:11.5px; margin:2px 0; }
.compare-line.ext-low{ color:var(--ink-3); border-bottom:1px dotted var(--ink-3); display:inline-block; }
.compare-line.ext-med{ color:var(--ink-2); font-style:italic; }

/* ---------- Score math block ---------- */
.score-math{
  font:11.5px var(--font-mono); background:var(--surface-1); border:1px solid var(--ink-4);
  border-radius:6px; padding:10px 12px; white-space:pre-wrap; color:var(--ink-1);
}

/* ---------- Settings ---------- */
.settings-group{ border:1px solid var(--ink-4); border-radius:8px; margin-bottom:10px; background:var(--surface-2); }
.settings-group > summary{ padding:10px 14px; font-weight:600; cursor:pointer; list-style:none; }
.settings-group > summary::-webkit-details-marker{ display:none; }
.setting-row{ display:flex; align-items:center; gap:12px; padding:8px 14px; border-top:1px solid var(--ink-4); }
.setting-row label{ flex:1; font-size:13px; }
.setting-row input[type=number]{
  width:90px; background:var(--surface-1); border:1px solid var(--ink-4); color:var(--ink-0);
  padding:5px 8px; border-radius:5px; font:13px var(--font-mono);
}
.setting-hint{ font:11px var(--font-mono); color:var(--ink-3); padding:0 14px 8px; }
.preview-box{ font:11.5px var(--font-mono); background:var(--surface-1); border:1px dashed var(--ink-4); border-radius:6px; padding:8px 10px; margin:0 14px 10px; color:var(--ink-1); }

table.rules-table{ width:100%; border-collapse:collapse; font-size:12.5px; }
table.rules-table th, table.rules-table td{ text-align:left; padding:6px 8px; border-bottom:1px solid var(--ink-4); }
table.rules-table th{ color:var(--ink-2); font-size:11px; text-transform:uppercase; letter-spacing:.03em; }
.status-ACTIVE{ color:var(--sev-2); }
.status-MUTED{ color:var(--ink-3); }
.status-NODATA, .status-INACTIVE{ color:var(--ink-3); }

/* ---------- Command palette ---------- */
.cmd-overlay{
  position:fixed; inset:0; z-index:9000; background:rgba(14,13,11,.75);
  backdrop-filter:blur(8px) saturate(.8); -webkit-backdrop-filter:blur(8px) saturate(.8);
  display:flex; align-items:flex-start; justify-content:center; padding-top:max(80px,10vh);
  opacity:0; pointer-events:none; transition:opacity .16s ease-out;
}
.cmd-overlay.open{ opacity:1; pointer-events:all; }
.cmd-panel{
  width:min(640px, calc(100vw - 48px)); background:var(--surface-4); border:1px solid var(--ink-4);
  border-radius:12px; box-shadow:0 24px 64px rgba(0,0,0,.7); overflow:hidden;
  transform:scale(.96) translateY(-8px); transition:transform .18s cubic-bezier(.34,1.56,.64,1);
}
.cmd-overlay.open .cmd-panel{ transform:scale(1) translateY(0); }
.cmd-input-row{ display:flex; align-items:center; gap:10px; padding:14px 18px; border-bottom:1px solid var(--ink-4); }
.cmd-input{ flex:1; background:transparent; border:none; outline:none; font:16px var(--font-body); color:var(--ink-0); }
.cmd-input::placeholder{ color:var(--ink-3); }
.cmd-results{ max-height:min(440px,60vh); overflow-y:auto; padding:6px 0; }
.cmd-group-header{ font:10px var(--font-mono); letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); padding:10px 18px 4px; }
.cmd-item{ display:flex; align-items:center; gap:10px; padding:9px 18px; }
.cmd-item:hover, .cmd-item.focused{ background:var(--surface-3); }
.cmd-item-icon{ width:18px; text-align:center; color:var(--ink-2); flex:none; }
.cmd-item-text{ flex:1; min-width:0; }
.cmd-item-label{ font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cmd-item-sublabel{ font:10.5px var(--font-mono); color:var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cmd-footer{ border-top:1px solid var(--ink-4); padding:7px 18px; display:flex; gap:14px; font:10px var(--font-mono); color:var(--ink-3); }
.cmd-item[data-danger="true"] .cmd-item-label{ color:var(--sev-5); }

/* ---------- Modal (about, playbook, confirm) ---------- */
.modal-overlay{ position:fixed; inset:0; z-index:9500; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; padding:20px; }
.modal-overlay.open{ display:flex; }
.modal{ width:min(560px,100%); max-height:85vh; overflow-y:auto; background:var(--surface-2); border:1px solid var(--ink-4); border-radius:10px; padding:20px; }
.modal h2{ margin-top:0; }
textarea{ width:100%; min-height:90px; background:var(--surface-1); border:1px solid var(--ink-4); color:var(--ink-0); border-radius:6px; padding:8px; font-family:var(--font-body); }
input[type=text]{ width:100%; background:var(--surface-1); border:1px solid var(--ink-4); color:var(--ink-0); border-radius:6px; padding:7px 9px; font-family:var(--font-body); }

/* ---------- Toasts ---------- */
#toasts{ position:fixed; bottom:18px; right:18px; z-index:9700; display:flex; flex-direction:column; gap:8px; }
.toast{ background:var(--surface-4); border:1px solid var(--ink-4); border-radius:8px; padding:10px 14px; font-size:12.5px; display:flex; gap:10px; align-items:center; box-shadow:0 8px 24px rgba(0,0,0,.4); }
.toast button{ background:none; border:none; color:var(--accent); font-weight:600; font-size:12px; }

/* Layout-state banners */
.banner{ padding:8px 16px; font:12px var(--font-mono); border-bottom:1px solid var(--ink-4); display:flex; align-items:center; gap:10px; }
.banner.crisis{ background:var(--sev-5); color:#fff; animation:pulse 1.4s infinite; }
@keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.75;} }
.banner.board{ background:var(--sev-3); color:#141210; }

.offline-badge{ font:10px var(--font-mono); color:var(--ink-3); border:1px solid var(--ink-4); padding:2px 6px; border-radius:4px; }

/* print-only helper shown on screen hidden, shown in print */
.print-only{ display:none; }

/* ============ PRINT ============ */
@media print{
  #rail, .cmd-overlay, #toasts, #panel-resizer, .btn, .fin-act, #topbar .btn, .no-print{ display:none !important; }
  #content{ max-width:none !important; padding:0 !important; }
  body{ background:#fff !important; color:#000 !important; }
  .fin{ border:1px solid #ccc !important; background:#fff !important; page-break-inside:avoid; }
  .fin.sevhot{ border-left:4pt solid #000 !important; }
  .fin.sev4{ border-left:3pt solid #000 !important; }
  .fin.sevmid{ border-left:2pt solid #000 !important; }
  .fin.sevlow{ border-left:1pt dotted #000 !important; }
  .fin-basis{ background:#f6f6f6 !important; color:#333 !important; max-height:none !important; }
  .score-math{ background:#f6f6f6 !important; color:#222 !important; border:1pt solid #ccc !important; }
  .print-only{ display:block !important; border-top:1pt solid #999; margin-top:10pt; padding-top:6pt; font:8pt var(--font-mono); color:#777; }
  @page{
    margin:2cm;
    /* Margin-box content is Chromium 131+ / Safari 18.2+ only (verified via
       web search this session) — Firefox ignores it entirely. Because of
       that gap, .print-only above duplicates the same footer as normal
       flowed content so Firefox prints still carry it. */
    @bottom-center{ content: "LeadOS pt-G · printed " attr(data-print-date) " · schema v" attr(data-schema); font-family:monospace; font-size:8pt; color:#888; }
    @top-right{ content: "Page " counter(page) " of " counter(pages); font-family:monospace; font-size:8pt; color:#888; }
  }
}
</style>
</head>
<body>
<a href="#main" class="skip-link">Skip to main content</a>

<div id="shell">
  <nav id="rail" role="navigation" aria-label="Main navigation">
    <div class="brand">
      <div class="nm">LEADOS</div>
      <div class="tag mono">pt-G demo</div>
    </div>
    <nav id="rail-links"></nav>
    <div class="rail-footer" id="layout-state-label">STANDARD MODE</div>
  </nav>

  <div id="main">
    <div id="topbar">
      <button class="btn" id="cmd-trigger" aria-haspopup="dialog" aria-label="Open command palette">⌘ <span class="kbd">K</span></button>
      <h1 id="route-title">Today</h1>
      <span class="offline-badge" title="No service worker in this single-file build — disclosed gap, see README">OFFLINE — expected</span>
      <button class="btn" id="theme-dark" aria-label="Switch to Obsidian dark theme">◉ Dark</button>
      <button class="btn" id="theme-light" aria-label="Switch to Parchment light theme">○ Light</button>
      <button class="btn" id="theme-terminal" aria-label="Switch to Terminal mono theme">▪ Term</button>
      <button class="btn" id="about-trigger">verified vs fabricated →</button>
    </div>
    <div id="banner-zone"></div>
    <div id="content-wrap">
      <main id="content" tabindex="-1" aria-live="polite" aria-label="LeadOS main content"></main>
      <aside id="panel" aria-label="Detail panel"></aside>
      <div id="panel-resizer" title="Drag to resize panel"></div>
    </div>
  </div>
</div>

<!-- Command palette -->
<div class="cmd-overlay" id="cmd-overlay" role="dialog" aria-modal="true" aria-label="Command palette">
  <div class="cmd-panel" id="cmd-panel">
    <div class="cmd-input-row">
      <span class="cmd-input-icon" aria-hidden="true">⌕</span>
      <input class="cmd-input" id="cmd-input" type="text" placeholder="Search, > command, @ person, # domain, R### rule…" aria-label="Command palette search">
      <span class="kbd">esc</span>
    </div>
    <div class="cmd-results" id="cmd-results" role="listbox"></div>
    <div class="cmd-footer">
      <span><span class="kbd">↑↓</span> navigate</span>
      <span><span class="kbd">↵</span> select</span>
      <span><span class="kbd">esc</span> close</span>
    </div>
  </div>
</div>

<!-- Generic modal -->
<div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-label="Dialog">
  <div class="modal" id="modal-body"></div>
</div>

<div id="toasts" aria-live="polite"></div>

<div class="print-only" id="print-footer"></div>

<script>
(function(){
'use strict';

/* ======================================================================
   SECTION: STORE  (mirrors the verified real repo's doctrine: one
   localStorage key, append-only events, nothing derived persisted.
   Key name deliberately distinct from the real repo's 'leados:data' so
   this demo can never collide with a real install on the same origin.)
   ====================================================================== */
var LEADOS = window.LEADOS = window.LEADOS || {};
var KEY = 'leados-ptg-demo:data';
var SCHEMA_VERSION = 1;

function nowIso(){ return new Date().toISOString(); }
function daysAgoIso(d){ return new Date(Date.now() - d*86400000).toISOString(); }
function daysBetween(aIso,bIso){ return Math.round((new Date(bIso)-new Date(aIso))/86400000); }

LEADOS.store = {
  _raw: null,
  load: function(){
    if (this._raw) return this._raw;
    var text = localStorage.getItem(KEY);
    if (text === null){
      this._raw = { schemaVersion: SCHEMA_VERSION, meta:{ createdAt: Date.now(), seeded:false, mutedRules:[] }, events: [] };
      this.save();
      return this._raw;
    }
    try { this._raw = JSON.parse(text); }
    catch(e){ throw new Error('LeadOS: store at '+KEY+' is corrupt and was left untouched.'); }
    if (!this._raw.meta) this._raw.meta = { createdAt: Date.now(), seeded:false, mutedRules:[] };
    if (!this._raw.meta.mutedRules) this._raw.meta.mutedRules = [];
    if (!Array.isArray(this._raw.events)) this._raw.events = [];
    return this._raw;
  },
  save: function(){ localStorage.setItem(KEY, JSON.stringify(this._raw)); },
  append: function(type, payload){
    var raw = this.load();
    var ev = { id: 'e'+(raw.events.length+1), ts: nowIso(), type: type, data: payload };
    raw.events.push(ev);
    this.save();
    return ev;
  },
  state: function(){ return this.load(); },
  muteRule: function(id){ var raw=this.load(); if(raw.meta.mutedRules.indexOf(id)===-1){ raw.meta.mutedRules.push(id); this.append('rule.muted',{ruleId:id}); this.save(); } },
  unmuteRule: function(id){ var raw=this.load(); var i=raw.meta.mutedRules.indexOf(id); if(i>-1){ raw.meta.mutedRules.splice(i,1); this.append('rule.unmuted',{ruleId:id}); this.save(); } },
  purge: function(){ localStorage.removeItem(KEY); this._raw=null; this.load(); },
  seed: function(){
    var raw = this.load();
    if (raw.meta.seeded) return;
    raw.meta.seeded = true;
    // ---- FABRICATED DEMO DATA. Labeled. Numbers chosen to mirror the
    // worked examples in the pt-G brief's narrative spec (same scenario
    // shapes), but computed fresh by this demo's own engine — not copy-
    // pasted output strings from the brief.
    this.append('person.added', {id:'p1', name:'Ana Ruiz'});
    this.append('person.added', {id:'p2', name:'Bruno Serra'});
    this.append('person.added', {id:'p3', name:'Cara Lind'});
    this.append('oneonone.logged', {personId:'p1', at: daysAgoIso(21)});
    this.append('oneonone.logged', {personId:'p2', at: daysAgoIso(19)});
    this.append('oneonone.logged', {personId:'p3', at: daysAgoIso(5)});
    [40,30,15,3].forEach(function(d,i){
      var loads=[7,8,9,9];
      LEADOS.store.append('pulse.recorded', {personId:'p3', load:loads[i], at: daysAgoIso(d)});
    });
    this.append('fin.pl.logged', {period:'Q1-2026', grossMarginPct:68});
    this.append('fin.pl.logged', {period:'Q2-2026', grossMarginPct:63});
    this.append('fin.pl.logged', {period:'Q3-2026', grossMarginPct:58});
    this.append('fin.unit.logged', {period:'Q3-2026', segment:'SMB', ltvCac:1.5, cacPaybackMonths:24});
    this.append('cs.nps.logged', {period:'Q1-2026', score:45});

/* ======================================================================
   SECTION: EVENTS — project(events) folds the append-only log into the
   current-state shape the engine reads. Nothing here is persisted.
   ====================================================================== */
LEADOS.events = {
  project: function(raw){
    var P = { people:{}, oneonones:{}, pulses:[], finPl:[], finUnit:[], nps:[], sprints:[], settings:{}, mutedRules:{} };
    (raw.events||[]).forEach(function(ev){
      var d = ev.data||{};
      switch(ev.type){
        case 'person.added': P.people[d.id] = {id:d.id, name:d.name}; break;
        case 'oneonone.logged': (P.oneonones[d.personId]=P.oneonones[d.personId]||[]).push(d.at); break;
        case 'pulse.recorded': P.pulses.push(d); break;
        case 'fin.pl.logged': P.finPl.push(d); break;
        case 'fin.unit.logged': P.finUnit.push(d); break;
        case 'cs.nps.logged': P.nps.push(d); break;
        case 'sprint.review': P.sprints.push(d); break;
        case 'settings.changed': P.settings[d.key] = d.value; break;
        case 'rule.muted': P.mutedRules[d.ruleId] = true; break;
        case 'rule.unmuted': delete P.mutedRules[d.ruleId]; break;
      }
    });
    return P;
  }
};

/* ======================================================================
   SECTION: STATS — small shared math helpers used by rules + narratives
   ====================================================================== */
var STATS = {
  mean: function(a){ return a.reduce(function(s,v){return s+v;},0)/a.length; },
  stddev: function(a){ var m=STATS.mean(a); return Math.sqrt(STATS.mean(a.map(function(v){return (v-m)*(v-m);}))); },
  linreg: function(values){
    var n=values.length, xs=values.map(function(_,i){return i;});
    var mx=STATS.mean(xs), my=STATS.mean(values);
    var num=0, den=0;
    for (var i=0;i<n;i++){ num += (xs[i]-mx)*(values[i]-my); den += (xs[i]-mx)*(xs[i]-mx); }
    var slope = den===0?0:num/den;
    var intercept = my - slope*mx;
    return {slope:slope, intercept:intercept};
  },
  best: function(arr,key){ return arr.reduce(function(b,c){ return c[key]>b[key]?c:b; }); },
  worst: function(arr,key){ return arr.reduce(function(b,c){ return c[key]<b[key]?c:b; }); }
};

/* ======================================================================
   SECTION: ENGINE — six fully-computed rules (R1, R7, R103, R110, R120,
   R130) across People / Finance / Customer / Delivery domains, plus a
   roster of inactive "stub" rule IDs shown in the Settings > Rules table
   to illustrate the management UI at a believable small scale.
   DISCLOSED: the pt-G brief specifies 144 rules / 22 modules. This demo
   implements 6 real ones. Everything below this line is computed from
   the seeded events above — not hand-written finding text.
   ====================================================================== */
var STUB_RULE_IDS = ['R2','R5','R9','R14','R27','R29','R41','R58','R67','R81','R92','R101','R127','R130b'];

function confWeight(c){ return c==='HIGH'?1:c==='MEDIUM'?0.7:0.4; }

var RULES = [
  { id:'R1', domain:'PEOPLE', title:'1:1 cadence overdue', sevRange:'2-4', conf:'HIGH',
    run:function(P, today, settings){
      var cadence = settings.oneOnOneCadenceDays || 14;
      var out=[];
      Object.keys(P.people).forEach(function(pid){
        var log = (P.oneonones[pid]||[]).slice().sort();
        var last = log[log.length-1];
        if (!last) return;
        var gap = daysBetween(last, today);
        if (gap > cadence){
          var ratio = gap/cadence;
          var sev = ratio>1.5?4:3;
          out.push({
            key:'R1:'+pid, rule:'R1', domain:'PEOPLE', sev:sev, conf:'HIGH',
            title:'1:1 with '+P.people[pid].name+' is overdue — '+gap+'d since last (cadence '+cadence+'d)',
            basis:['Last 1:1: '+last.slice(0,10)+' ('+gap+' days ago)','Cadence setting: '+cadence+'d · gap/cadence = '+ratio.toFixed(2)],
            source:'oneonone.logged', play:true,
            story:'1:1 with '+P.people[pid].name+' is '+gap+'d since last contact, '+ (gap-cadence) + 'd past the '+cadence+'d cadence setting. Source: oneonone.logged.',
            math:{base:sev*confWeight('HIGH'), mult:ratio, label:'overdue ratio'}
          });
        }
      });
      return out;
    }},
  { id:'R7', domain:'PEOPLE', title:'Pulse load trigger', sevRange:'3-4', conf:'MEDIUM',
    run:function(P, today, settings){
      var threshold = settings.pulseLoadAlertThreshold || 8.0;
      var byPerson={};
      P.pulses.forEach(function(p){ (byPerson[p.personId]=byPerson[p.personId]||[]).push(p); });
      var out=[];
      Object.keys(byPerson).forEach(function(pid){
        var recs = byPerson[pid];
        var loads = recs.map(function(r){return r.load;});
        var m = STATS.mean(loads);
        if (m >= threshold){
          var name = (LEADOS.events.project(LEADOS.store.state()).people[pid]||{}).name || pid;
          var spanDays = Math.max.apply(null, recs.map(function(r){return daysBetween(r.at, today);}));
          out.push({
            key:'R7:'+pid, rule:'R7', domain:'PEOPLE', sev:4, conf:'MEDIUM',
            title:'Load trigger A for '+name+' — mean '+m.toFixed(1)+'/10 over '+recs.length+' pulses',
            basis:['Pulses: '+loads.join(', ')+' (most recent last)','Trigger A threshold: ≥'+threshold.toFixed(1)],
            source:'pulse.recorded', play:false,
            story:'Mean load of '+m.toFixed(1)+'/10 across '+recs.length+' measured pulses in '+spanDays+' days for '+name+'. R7 trigger A threshold is ≥'+threshold.toFixed(1)+'. Source: pulse.recorded, last '+spanDays+'d.',
            math:{base:4*confWeight('MEDIUM'), mult:1, label:'no multiplier'}
          });
        }
      });
      return out;
    }},
  { id:'R103', domain:'FINANCE', title:'Gross margin floor breach + decline', sevRange:'3-5', conf:'HIGH',
    run:function(P, today, settings){
      var floor = settings.grossMarginFloorPct!=null?settings.grossMarginFloorPct:60;
      var minPeriods = settings.trendMinPeriods || 3;
      var series = P.finPl.slice();
      if (series.length < minPeriods) return [];
      var last = series[series.length-1];
      var declining = true;
      for (var i=1;i<series.length;i++){ if (series[i].grossMarginPct >= series[i-1].grossMarginPct){ declining=false; break; } }
      if (last.grossMarginPct < floor && declining){
        var below = (floor - last.grossMarginPct);
        var drop = series[0].grossMarginPct - last.grossMarginPct;
        return [{
          key:'R103:'+last.period, rule:'R103', domain:'FINANCE', sev:5, conf:'HIGH',
          title:'Gross margin crossed the '+floor+'% floor — '+series.length+' consecutive periods declining',
          basis:[series.map(function(s){return s.period+': '+s.grossMarginPct.toFixed(1)+'%';}).join(' → '),
                 'Slope: '+((series[series.length-1].grossMarginPct-series[0].grossMarginPct)/(series.length-1)).toFixed(1)+'pp/period · Current: '+below.toFixed(1)+'pp below the '+floor+'% floor.'],
          source:'fin.pl.logged', play:true,
          story:'Gross margin of '+last.grossMarginPct.toFixed(1)+'% is '+below.toFixed(1)+'pp below the '+floor+'% floor setting and has declined '+drop.toFixed(1)+'pp over '+series.length+' periods ('+series[0].period+'→'+last.period+'). Source: fin.pl.logged, '+series.length+' periods.',
          math:{base:5*confWeight('HIGH'), mult:1, label:'no multiplier'}
        }];
      }
      return [];
    }},
  { id:'R110', domain:'FINANCE', title:'LTV:CAC below convention threshold', sevRange:'2-4', conf:'MEDIUM',
    run:function(P, today, settings){
      var threshold = settings.ltvCacConventionThreshold!=null?settings.ltvCacConventionThreshold:3.0;
      var out=[];
      P.finUnit.forEach(function(u){
        if (u.ltvCac < threshold){
          out.push({
            key:'R110:'+u.period+':'+u.segment, rule:'R110', domain:'FINANCE', sev:4, conf:'MEDIUM',
            title:'LTV:CAC '+u.ltvCac.toFixed(2)+' below '+threshold.toFixed(1)+' convention — '+u.segment+' segment',
            basis:['LTV:CAC = '+u.ltvCac.toFixed(2)+' · convention threshold = '+threshold.toFixed(1)+' (LeadOS convention, not verified data)','CAC payback: '+u.cacPaybackMonths+' months'],
            source:'fin.unit.logged', play:true,
            story:'LTV:CAC of '+u.ltvCac.toFixed(2)+' is below the '+threshold.toFixed(1)+' SaaS convention threshold for the '+u.segment+' segment. CAC is recovering costs in '+u.cacPaybackMonths+' months (payback period). Source: fin.unit.logged, '+u.period+'.',
            math:{base:4*confWeight('MEDIUM'), mult:1, label:'no multiplier'}
          });
        }
      });
      return out;
    }},
  { id:'R120', domain:'CUSTOMER', title:'NPS declining, two consecutive periods', sevRange:'2-3', conf:'MEDIUM',
    run:function(P, today, settings){
      var alertBelow = settings.npsAlertThreshold!=null?settings.npsAlertThreshold:30;
      var s = P.nps.slice();
      if (s.length < 3) return [];
      var last = s[s.length-1], mid = s[s.length-2], first=s[s.length-3];
      var decl1 = mid.score < first.score, decl2 = last.score < mid.score;
      if (decl1 && decl2 && last.score < alertBelow){
        return [{
          key:'R120:'+last.period, rule:'R120', domain:'CUSTOMER', sev:3, conf:'MEDIUM',
          title:'NPS '+last.score+' in '+last.period+', down from '+mid.score+' ('+(last.score-mid.score)+')',
          basis:[first.period+': '+first.score+' → '+mid.period+': '+mid.score+' → '+last.period+': '+last.score,
                 'Two consecutive declining periods, latest below alert threshold '+alertBelow+'.'],
          source:'cs.nps.logged', play:false,
          story:'NPS of '+last.score+' in '+last.period+', down from '+mid.score+' in '+mid.period+' ('+(last.score-mid.score)+' points). Two consecutive declining periods with latest below '+alertBelow+'. Source: cs.nps.logged, n=2 periods.',
          math:{base:3*confWeight('MEDIUM'), mult:1, label:'no multiplier'}
        }];
      }
      return [];
    }},
  { id:'R130', domain:'DELIVERY', title:'Sprint velocity declining trend', sevRange:'2-4', conf:'MEDIUM',
    run:function(P, today, settings){
      var minPeriods = settings.trendMinPeriods || 3;
      var s = P.sprints.slice();
      if (s.length < minPeriods) return [];
      var values = s.map(function(x){return x.velocity;});
      var reg = STATS.linreg(values);
      if (reg.slope < 0){
        var last = values[values.length-1];
        var periodsToZero = reg.slope<0 ? Math.ceil(-last/reg.slope) : null;
        return [{
          key:'R130:sprint'+s.length, rule:'R130', domain:'DELIVERY', sev:3, conf:'MEDIUM',
          title:'Sprint velocity declining — '+last+' pts, slope '+reg.slope.toFixed(1)+'/sprint',
          basis:['Last '+s.length+' sprints: '+values.join(', '),'Linear regression slope: '+reg.slope.toFixed(2)+' pts/sprint (n='+s.length+')'],
          source:'sprint.review', play:true,
          story:'Sprint velocity of '+last+' points, declining at '+Math.abs(reg.slope).toFixed(1)+' points/sprint over the last '+s.length+' sprints (linear regression, n='+s.length+'). At this rate: projected 0 points in ~'+periodsToZero+' sprints. Labeled: linear extrapolation. Source: sprint.review, n='+s.length+'.',
          math:{base:3*confWeight('MEDIUM'), mult:1, label:'no multiplier'}
        }];
      }
      return [];
    }}
];

LEADOS.engine = {
  RULES: RULES,
  run: function(P, today, settingsOverride){
    var settings = Object.assign({}, P.settings, settingsOverride||{});
    var raw = LEADOS.store.state();
    var muted = raw.meta.mutedRules || [];
    var findings = [];
    RULES.forEach(function(r){
      if (muted.indexOf(r.id) > -1) return;
      var res = r.run(P, today, settings) || [];
      findings = findings.concat(res);
    });
    findings.forEach(function(f){
      f.score = (f.math.base * f.math.mult);
    });
    findings.sort(function(a,b){ return b.score - a.score; });
    findings.forEach(function(f,i){ f.rank = i+1; });
    return { findings: findings };
  }
};

/* ======================================================================
   SECTION: NARRATIVE (dataStory / anomaly / compareContext)
   ====================================================================== */
LEADOS.narrative = {
  anomaly: function(values, labels){
    if (values.length < 3) return 'Not enough periods to detect anomalies (need ≥3, have '+values.length+').';
    var m = STATS.mean(values.slice(0,-1));
    var sd = STATS.stddev(values.slice(0,-1));
    var last = values[values.length-1];
    if (sd>0 && Math.abs(last-m) > 2*sd){
      return 'Anomaly: '+labels[labels.length-1]+' value of '+last+' is '+(Math.abs(last-m)/sd).toFixed(1)+'x above the '+(values.length-1)+'-period mean of '+m.toFixed(1)+'.';
    }
    var priorChanges=[];
    for (var i=2;i<values.length;i++){ priorChanges.push(Math.abs((values[i-1]-values[i-2])/values[i-2])); }
    var lastChange = Math.abs((last-values[values.length-2])/values[values.length-2]);
    if (priorChanges.length && priorChanges.every(function(c){return c<0.05;}) && lastChange>0.2){
      return 'Step change detected at '+labels[labels.length-1]+': '+(lastChange*100).toFixed(0)+'% vs <5% prior variability.';
    }
    return 'No anomalies detected in this series (n='+values.length+').';
  },
  compareInternal: function(series, key, labelKey){
    var best = STATS.best(series, key), worst = STATS.worst(series, key);
    var avg = STATS.mean(series.map(function(s){return s[key];}));
    return [
      'Best period: '+best[key]+' in '+best[labelKey],
      'Worst period: '+worst[key]+' in '+worst[labelKey],
      'Average across '+series.length+' periods: '+avg.toFixed(1)
    ];
  }
};

function sparkline(values, w, h){
  w=w||180; h=h||40;
  var min=Math.min.apply(null,values), max=Math.max.apply(null,values);
  var range = (max-min)||1;
  var pts = values.map(function(v,i){
    var x = (i/(values.length-1))*w;
    var y = h - ((v-min)/range)*h;
    return x.toFixed(1)+','+y.toFixed(1);
  }).join(' ');
  return '<svg width="'+w+'" height="'+h+'" role="img" aria-label="Sparkline, values '+values.join(', ')+'"><polyline points="'+pts+'" fill="none" stroke="var(--accent)" stroke-width="2"/></svg>';
}

function renderSettingsPreview(){
  var raw = LEADOS.store.state();
  var P = LEADOS.events.project(raw);
  var before = LEADOS.engine.run(P, nowIso(), {});
  var after = LEADOS.engine.run(P, nowIso(), settingsDraft);
  var beforeKeys = {}; before.findings.forEach(function(f){beforeKeys[f.key]=f;});
  var afterKeys = {}; after.findings.forEach(function(f){afterKeys[f.key]=f;});
  var created = after.findings.filter(function(f){ return !beforeKeys[f.key]; });
  var resolved = before.findings.filter(function(f){ return !afterKeys[f.key]; });
  var lines = [];
  lines.push('With these draft settings: '+after.findings.length+' findings (was '+before.findings.length+').');
  created.forEach(function(f){ lines.push('NOW FIRES: '+f.title); });
  resolved.forEach(function(f){ lines.push('NO LONGER FIRES: '+f.title); });
  if (!created.length && !resolved.length) lines.push('No change in which findings fire — only magnitudes may shift.');
  document.getElementById('settings-preview').innerHTML = lines.map(function(l){return '<div>'+l+'</div>';}).join('');
}

function debounce(fn, ms){ var t; return function(){ var args=arguments, ctx=this; clearTimeout(t); t=setTimeout(function(){fn.apply(ctx,args);}, ms); }; }

var HEALTH_TESTS = [
  { id:'T_STORE', name:'Store key + schema version present', run:function(){
      var raw = LEADOS.store.state();
      return raw.schemaVersion === SCHEMA_VERSION ? {pass:true, detail:'schemaVersion='+raw.schemaVersion} : {pass:false, detail:'unexpected schema'};
  }},
  { id:'T_APPEND_ONLY', name:'Event log never shrinks on read', run:function(){
      var raw = LEADOS.store.state();
      var n1 = raw.events.length;
      LEADOS.events.project(raw);
      var n2 = LEADOS.store.state().events.length;
      return n1===n2 ? {pass:true, detail:n1+' events, unchanged by projection'} : {pass:false, detail:'event count changed on read'};
  }},
  { id:'T_ENGINE', name:'Engine returns ranked findings', run:function(){
      var P = LEADOS.events.project(LEADOS.store.state());
      var r = LEADOS.engine.run(P, nowIso());
      var ranked = r.findings.every(function(f,i){ return i===0 || f.score<=r.findings[i-1].score; });
      return ranked ? {pass:true, detail:r.findings.length+' findings, rank order verified'} : {pass:false, detail:'rank order violated'};
  }},
  { id:'T_MUTE', name:'Mute removes a rule\'s findings without deleting events', run:function(){
      var before = LEADOS.events.project(LEADOS.store.state());
      var r0 = LEADOS.engine.run(before, nowIso());
      var had = r0.findings.some(function(f){return f.rule==='R1';});
      LEADOS.store.muteRule('R1');
      var after = LEADOS.events.project(LEADOS.store.state());
      var r1 = LEADOS.engine.run(after, nowIso());
      var stillHas = r1.findings.some(function(f){return f.rule==='R1';});
      LEADOS.store.unmuteRule('R1');
      return (had && !stillHas) ? {pass:true, detail:'R1 suppressed while muted, event log intact'} : {pass:false, detail:'mute did not suppress as expected (had='+had+')'};
  }},
  { id:'T_ACCESS', name:'Keyboard path: finding cards are focusable with a valid data-key', run:function(){
      var cards = document.querySelectorAll('.fin[tabindex="0"]');
      if (!cards.length) return {pass:true, detail:'no findings currently rendered (route-dependent), skipped'};
      var ok = Array.prototype.every.call(cards, function(c){ return !!c.dataset.key; });
      return ok ? {pass:true, detail:cards.length+' finding cards all carry data-key'} : {pass:false, detail:'a finding card is missing data-key'};
  }},
  { id:'T_PRINT', name:'Print stylesheet rule present in document', run:function(){
      var found=false;
      try{
        Array.prototype.forEach.call(document.styleSheets, function(ss){
          try{ Array.prototype.forEach.call(ss.cssRules||[], function(r){ if (r.media && r.media.mediaText && r.media.mediaText.indexOf('print')>-1) found=true; }); }catch(e){}
        });
      }catch(e){}
      return found ? {pass:true, detail:'@media print rule found'} : {pass:false, detail:'no @media print rule found'};
  }}
];

/* ---- Modal helpers (with focus trap + restoration) ---- */
var _lastFocus = null;
function showModal(title, bodyHtml){
  _lastFocus = document.activeElement;
  document.getElementById('modal-body').innerHTML = '<h2>'+title+'</h2>'+bodyHtml;
  var overlay = document.getElementById('modal-overlay');
  overlay.classList.add('open');
  trapFocus(document.getElementById('modal-body'));
  requestAnimationFrame(function(){
    var f = document.getElementById('modal-body').querySelector('button, [href], input, select, textarea, [tabindex]');
    if (f) f.focus();
  });
}
function closeModal(){
  document.getElementById('modal-overlay').classList.remove('open');
  document.getElementById('modal-body').innerHTML = '';
  if (_lastFocus) _lastFocus.focus();
}
document.getElementById('modal-overlay').addEventListener('click', function(e){ if (e.target===this) closeModal(); });

function trapFocus(container){
  container.addEventListener('keydown', function(e){
    if (e.key==='Escape'){ closeModal(); return; }
    if (e.key!=='Tab') return;
    var focusable = container.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
    if (!focusable.length) return;
    var first=focusable[0], last=focusable[focusable.length-1];
    if (e.shiftKey){ if (document.activeElement===first){ last.focus(); e.preventDefault(); } }
    else { if (document.activeElement===last){ first.focus(); e.preventDefault(); } }
  });
}

/* ---- Toasts ---- */
function toast(msg, undoFn){
  var el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = '<span>'+msg+'</span>'+(undoFn?'<button>UNDO</button>':'');
  document.getElementById('toasts').appendChild(el);
  if (undoFn) el.querySelector('button').addEventListener('click', function(){ undoFn(); el.remove(); });
  setTimeout(function(){ el.remove(); }, 15000);
}

LEADOS.command = {
  isOpen:false, query:'', results:[], focusedIndex:0,
  history: JSON.parse(sessionStorage.getItem('leados-ptg-demo:cmdhist')||'[]'),
  _prevFocus:null,
  open: function(q){
    this.isOpen = true; this.query = q||'';
    this._prevFocus = document.activeElement;
    document.getElementById('cmd-overlay').classList.add('open');
    document.getElementById('cmd-input').value = this.query;
    this.search(this.query);
    requestAnimationFrame(function(){ document.getElementById('cmd-input').focus(); });
  },
  close: function(){
    this.isOpen = false; this.query=''; this.results=[]; this.focusedIndex=0;
    document.getElementById('cmd-overlay').classList.remove('open');
    if (this._prevFocus) this._prevFocus.focus();
  },
  search: function(q){
    this.query = q; this.results = this._computeResults(q); this.focusedIndex = 0; this.renderResults();
  },
  execute: function(r){
    this.history.unshift({query:this.query, result:r.id, ts:Date.now()});
    this.history = this.history.slice(0,20);
    sessionStorage.setItem('leados-ptg-demo:cmdhist', JSON.stringify(this.history));
    if (r.confirm){
      showModal('Confirm', '<p>'+r.confirm+'</p>'+
        (r.confirmInput?'<input type="text" id="confirm-input" placeholder="Type '+r.confirmInput+'"><br><br>':'')+
        '<button class="btn danger" id="confirm-go">Confirm</button> <button class="btn" id="confirm-cancel">Cancel</button>');
      document.getElementById('confirm-cancel').addEventListener('click', closeModal);
      document.getElementById('confirm-go').addEventListener('click', function(){
        if (r.confirmInput && document.getElementById('confirm-input').value !== r.confirmInput) return;
        closeModal(); r.action();
      });
      this.close();
      return;
    }
    r.action();
    this.close();
  },
  _computeResults: function(q){
    if (!q) return this._defaultResults();
    if (q[0]==='>') return this._commandResults(q.slice(1).trim());
    if (q[0]==='@') return this._personResults(q.slice(1));
    if (q[0]==='#') return this._domainResults(q.slice(1));
    if (/^R\d+/i.test(q)) return this._ruleResult(q.toUpperCase());
    return this._universalSearch(q);
  },
  _defaultResults: function(){
    var hist = this.history.slice(0,5).map(function(h){ return {group:'RECENT', id:'hist:'+h.result, label:h.query||h.result, icon:'↺', action:function(){ LEADOS.command.open(h.query); }}; });
    var sug = this._contextualSuggestions();
    var ql = [
      {group:'QUICK LOG', id:'qlog:1on1', icon:'◉', label:'Log 1:1 with…', action:function(){ var n=prompt('Person name:'); if(n) LEADOS.store.append('oneonone.logged',{personId:'ad-hoc',name:n,at:nowIso()}); render(); }},
      {group:'QUICK LOG', id:'qlog:pulse', icon:'●', label:'Record pulse for…', action:function(){ var n=prompt('Load 1-10:'); if(n) LEADOS.store.append('pulse.recorded',{personId:'ad-hoc',load:parseFloat(n),at:nowIso()}); render(); }},
      {group:'QUICK LOG', id:'qlog:note', icon:'◦', label:'Add a note', action:function(){ var n=prompt('Note:'); if(n) LEADOS.store.append('note.added',{text:n}); render(); }}
    ];
    return hist.concat(sug, ql);
  },
  _contextualSuggestions: function(){
    var P = LEADOS.events.project(LEADOS.store.state());
    var result = LEADOS.engine.run(P, nowIso());
    return result.findings.slice(0,3).map(function(f){
      return {group:'SUGGESTED', id:'sug:'+f.key, label:f.title, sublabel:f.rule+' · '+f.conf+' conf', severity:f.sev,
        action:function(){ location.hash='#/today'; setTimeout(function(){ openPanel(f.key); },50); } };
    });
  },
  _commandResults: function(q){
    var all = buildCommandRegistry();
    var keys = Object.keys(all).filter(function(k){ return k.indexOf(q.toLowerCase())>-1; });
    return keys.map(function(k){ var c=all[k]; return Object.assign({group:'COMMANDS', id:'cmd:'+k, label:c.label, sublabel:c.sublabel, icon:c.icon, danger:c.danger, confirm:c.confirm, confirmInput:c.confirmInput, action:c.action},{}); });
  },
  _personResults: function(q){
    var P = LEADOS.events.project(LEADOS.store.state());
    return Object.values(P.people).filter(function(p){ return p.name.toLowerCase().indexOf(q.toLowerCase())>-1; })
      .map(function(p){ return {group:'PEOPLE', id:'p:'+p.id, label:p.name, icon:'◉', action:function(){ LEADOS.command.open('@'+p.name); } }; });
  },
  _domainResults: function(q){
    var domains = ['PEOPLE','FINANCE','CUSTOMER','DELIVERY'];
    return domains.filter(function(d){ return d.toLowerCase().indexOf(q.toLowerCase())>-1; })
      .map(function(d){ return {group:'DOMAIN', id:'dom:'+d, label:d, icon:'#', action:function(){ location.hash = d==='FINANCE'?'#/finance':'#/today'; } }; });
  },
  _ruleResult: function(q){
    var r = RULES.find(function(r){ return r.id===q || r.id.toLowerCase()===q.toLowerCase(); });
    if (!r) return [{group:'RULES', id:'norule', label:'No rule '+q+' in this demo\'s 6-rule subset', action:function(){}}];
    return [{group:'RULES', id:'rule:'+r.id, label:'Explain '+r.id+': '+r.title, sublabel:'domain '+r.domain+' · sev '+r.sevRange+' · conf '+r.conf,
      action:function(){ location.hash='#/settings'; } }];
  },
  _universalSearch: function(q){
    var P = LEADOS.events.project(LEADOS.store.state());
    var result = LEADOS.engine.run(P, nowIso());
    var matches = result.findings.filter(function(f){ return f.title.toLowerCase().indexOf(q.toLowerCase())>-1; });
    return matches.map(function(f){ return {group:'FINDINGS', id:'f:'+f.key, label:f.title, sublabel:f.rule, action:function(){ location.hash='#/today'; setTimeout(function(){openPanel(f.key);},50); } }; });
  },
  renderResults: function(){
    var groups = {};
    this.results.forEach(function(r){ (groups[r.group]=groups[r.group]||[]).push(r); });
    var html = '';
    var self = this;
    var flatIndex = 0;
    Object.keys(groups).forEach(function(g){
      html += '<div class="cmd-group-header">'+g+'</div>';
      groups[g].forEach(function(r){
        var idx = flatIndex++;
        html += '<div class="cmd-item'+(idx===self.focusedIndex?' focused':'')+'" data-idx="'+idx+'" data-danger="'+(!!r.danger)+'" role="option">'+
          '<span class="cmd-item-icon" aria-hidden="true">'+(r.icon||'›')+'</span>'+
          '<div class="cmd-item-text"><div class="cmd-item-label">'+r.label+'</div>'+(r.sublabel?'<div class="cmd-item-sublabel">'+r.sublabel+'</div>':'')+'</div>'+
        '</div>';
      });
    });
    document.getElementById('cmd-results').innerHTML = html || '<div class="cmd-group-header">No results</div>';
    document.querySelectorAll('.cmd-item').forEach(function(el){
      el.addEventListener('click', function(){ self.execute(self.results[parseInt(el.dataset.idx)]); });
    });
  }
};

function buildCommandRegistry(){
  var reg = {
    'today':{label:'Go to Today', icon:'◎', action:function(){ location.hash='#/today'; }},
    'finance':{label:'Go to Finance', icon:'◇', action:function(){ location.hash='#/finance'; }},
    'settings':{label:'Go to Settings & Rules', icon:'⚙', action:function(){ location.hash='#/settings'; }},
    'health':{label:'Run Health Suite', icon:'⬡', action:function(){ location.hash='#/health'; }},
    'theme dark':{label:'Switch to Obsidian (dark)', icon:'◉', action:function(){ setTheme('dark'); }},
    'theme light':{label:'Switch to Parchment (light)', icon:'○', action:function(){ setTheme('light'); }},
    'theme terminal':{label:'Switch to Terminal (mono)', icon:'▪', action:function(){ setTheme('terminal'); }},
    'focus':{label:'Enter Focus Mode', sublabel:'Collapses rail to icons', icon:'◉', action:function(){ UI.focus=true; document.body.classList.add('focus-mode'); render(); }},
    'unfocus':{label:'Exit Focus Mode', icon:'◎', action:function(){ UI.focus=false; document.body.classList.remove('focus-mode'); render(); }},
    'wide':{label:'Toggle Wide Mode', icon:'⟺', action:function(){ document.body.classList.toggle('wide-mode'); }},
    'export':{label:'Export Full Store (JSON)', sublabel:'Backup your data', icon:'↓', action:triggerExport},
    'export pdf':{label:'Export as PDF (print)', icon:'⎙', action:function(){ document.body.setAttribute('data-print-date', new Date().toISOString().slice(0,10)); document.body.setAttribute('data-schema', SCHEMA_VERSION); document.getElementById('print-footer').textContent='LeadOS pt-G · printed '+new Date().toISOString().slice(0,10)+' · schema v'+SCHEMA_VERSION+' · INTERNAL — Not for distribution'; window.print(); }},
    'seed':{label:'Load Sample Set', sublabel:'One-time seeding of demo data', icon:'▶', confirm:'This seeds demo data (one time, ever). Continue?', action:function(){ LEADOS.store.seed(); render(); }},
    'purge':{label:'PURGE ALL DATA', sublabel:'Destroys all people and events', icon:'✕', danger:true, confirm:'PURGE ALL DATA? This cannot be undone. Type PURGE to confirm.', confirmInput:'PURGE', action:function(){ LEADOS.store.purge(); settingsDraft=null; render(); toast('Store purged. Run >seed to reload the demo data set.', null); }},
    'trace':{label:'Trace an Event Type', sublabel:'Enter an event type to see its raw log entries', icon:'↗', action:function(){ var t=prompt('Event type (e.g. fin.pl.logged):'); if (t) openTrace(t); }},
    'undo':{label:'Undo Last Snooze/Dismiss', icon:'↩', action:function(){ toast('No pending undo tracked by this demo beyond the 15s toast window.', null); }}
  };
  RULES.forEach(function(r){
    var raw = LEADOS.store.state();
    var muted = raw.meta.mutedRules.indexOf(r.id)>-1;
    reg['mute '+r.id.toLowerCase()] = {label:(muted?'Unmute ':'Mute ')+r.id, icon:'◦', action:function(){ muted?LEADOS.store.unmuteRule(r.id):LEADOS.store.muteRule(r.id); render(); }};
    reg['explain '+r.id.toLowerCase()] = {label:'Explain '+r.id+': '+r.title, icon:'?', action:function(){ location.hash='#/settings'; }};
  });
  return reg;
}

function setTheme(t){ document.documentElement.setAttribute('data-theme', t); localStorage.setItem('leados-ptg-demo:theme', t); }
function triggerExport(){
  var raw = LEADOS.store.state();
  var blob = new Blob([JSON.stringify(raw,null,2)], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'leados-ptg-demo-export.json'; a.click();
}

/* ---- Command palette wiring ---- */
document.getElementById('cmd-trigger').addEventListener('click', function(){ LEADOS.command.open(''); });
document.getElementById('cmd-input').addEventListener('input', function(e){ LEADOS.command.search(e.target.value); });
document.getElementById('cmd-overlay').addEventListener('click', function(e){ if (e.target===this) LEADOS.command.close(); });
document.getElementById('cmd-panel').addEventListener('keydown', function(e){
  if (e.key==='Escape'){ LEADOS.command.close(); }
  if (e.key==='ArrowDown'){ e.preventDefault(); LEADOS.command.focusedIndex = Math.min(LEADOS.command.focusedIndex+1, LEADOS.command.results.length-1); LEADOS.command.renderResults(); }
  if (e.key==='ArrowUp'){ e.preventDefault(); LEADOS.command.focusedIndex = Math.max(LEADOS.command.focusedIndex-1, 0); LEADOS.command.renderResults(); }
  if (e.key==='Enter'){ e.preventDefault(); var r = LEADOS.command.results[LEADOS.command.focusedIndex]; if (r) LEADOS.command.execute(r); }
});
trapFocus(document.getElementById('cmd-panel'));

/* ---- Global keyboard shortcuts ---- */
document.addEventListener('keydown', function(e){
  var tag = (document.activeElement.tagName||'').toLowerCase();
  var typing = tag==='input' || tag==='textarea';
  if ((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); LEADOS.command.isOpen?LEADOS.command.close():LEADOS.command.open(''); return; }
  if (typing) return;
  if (e.key==='Escape'){ if (LEADOS.command.isOpen) LEADOS.command.close(); return; }
  if (e.key==='t'||e.key==='T'){ location.hash='#/today'; }
  if (e.key==='f'||e.key==='F'){ location.hash='#/finance'; }
  if (e.key==='s' && !document.querySelector('.fin:focus')){ location.hash='#/settings'; }
  if (e.key==='h'||e.key==='H'){ location.hash='#/health'; }
  if (e.key==='j'||e.key==='J'){ moveFindingFocus(1); }
  if (e.key==='k'||e.key==='K'){ if (!e.metaKey && !e.ctrlKey) moveFindingFocus(-1); }
});
function moveFindingFocus(dir){
  var cards = Array.prototype.slice.call(document.querySelectorAll('.fin'));
  if (!cards.length) return;
  var idx = cards.indexOf(document.activeElement);
  var next = idx===-1 ? 0 : Math.max(0, Math.min(cards.length-1, idx+dir));
  cards[next].focus();
}

/* ---- Theme buttons ---- */
document.getElementById('theme-dark').addEventListener('click', function(){ setTheme('dark'); });
document.getElementById('theme-light').addEventListener('click', function(){ setTheme('light'); });
document.getElementById('theme-terminal').addEventListener('click', function(){ setTheme('terminal'); });

/* ---- Router / render ---- */
function render(){
  renderRail();
  var r = currentRoute();
  if (r==='finance') renderFinance();
  else if (r==='settings') renderSettings();
  else if (r==='health') renderHealth();
  else renderToday();
}
window.addEventListener('hashchange', render);
window.addEventListener('beforeprint', function(){
  document.body.setAttribute('data-print-date', new Date().toISOString().slice(0,10));
  document.body.setAttribute('data-schema', SCHEMA_VERSION);
  document.getElementById('print-footer').textContent = 'LeadOS pt-G · printed '+new Date().toISOString().slice(0,10)+' · schema v'+SCHEMA_VERSION+' · INTERNAL — From LeadOS local storage · Not for distribution';
});

/* ---- Init ---- */
(function init(){
  var savedTheme = localStorage.getItem('leados-ptg-demo:theme');
  if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
  LEADOS.store.seed();
  if (!location.hash) location.hash = '#/today';
  render();
})();

})();
</script>
