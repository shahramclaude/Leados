    <meta
      name="description"
      content="LeadOS is a local-first leadership and operational workspace: forecast calibration and reference-class learning across three scored prediction ledgers (decision probabilities scored with Brier/Murphy at outcome review, funding-time PERT snapshots scored against recorded delivery actuals, and settled operational-case costs scored as FAIR frequency × magnitude against opening forecasts frozen at case open — actuarial loss development, Flyvbjerg reference-class uplifts, RULE-FCT-01..04), non-persisted What-If scenario sandboxing, Pareto frontier dominance &amp; One-at-a-Time Tornado sensitivity analysis (#/scenarios, Common Random Numbers, Brooks's Law onboarding drag, Samuelson shadow pricing, RULE-SCN-01), organizational design, team topologies and change execution (Kotter 8-step track, Lewin force-field barriers, Conway/Team Topologies &amp; Sweller cognitive load, Galbraith 5-point Star, Tsebelis veto coalitions, coupled Monte Carlo J-curve economics, and Shewhart XmR statistical process control), cross-domain operational cases (AIAG-VDA FMEA risk, 3-point PERT financial and capacity exposure, 5-Whys systemic barriers, Mendelow stakeholder coalitions, and parallel event-driven propagation across DACI decisions, delegations, goals and blameless 1:1 coaching, including reversible case-closeout learning prompts (RULE-COACH-02)), 1:1s with prep-sheet carry-through, 30-60-90 onboarding, role-transition and return-to-work scaffolding, dated manager-owned follow-ups after recorded Day 30/60/90 check-ins, timely SBI feedback, co-authored goals, actionable check-ins on Today, outcome delegation with GROW development handoff, evidence-backed performance reviews, decision-review queues, anonymous pulse, succession-to-transition handoff, structured hiring with Sackett validity weights and pre-export retention/sensitivity disclosures, and conflict resolution with voluntary participation, owned commitments and verified follow-up. Capacity and flow are modelled from the same records: focused hours with transition ramps, future-joiner proration and an operational reserve, Little's Law WIP and Kingman queue-delay multipliers, three-point PERT effort and value with value-density funding decisions, and seeded Monte Carlo Beta-PERT + Critical-Chain owner-bottleneck P50/P80/P90 forecasts. Operational cases and active org changes automatically reserve their diverted person-days, releasing or completing them on closure; after five settled diverted-days cases show a ≥25% median under-reserve, RULE-CAP-06 transparently applies the median reserve uplift (P80 for high-priority cases) and re-runs deterministic/Monte Carlo capacity risk without rewriting the manager estimate or forecast baseline; deterministic or stochastic overload opens one explicit trade-off decision. Candid check-in blockers, operational incidents and organizational change friction do not auto-enter performance ratings. The browser copy can be encrypted with a passphrase."
    />
