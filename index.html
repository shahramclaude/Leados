<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeadOS — Sensory &amp; Memory Build</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style>
  :root{ --ink:#0f172a; }
  html{ scroll-behavior:smooth; }
  body{ font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }

  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }

</head>
<body class="bg-slate-100 text-slate-900 min-h-screen">

<div id="app" class="flex min-h-screen">

  <!-- Sidebar -->
  <aside class="w-60 shrink-0 bg-slate-950 text-slate-200 flex flex-col">
    <div class="px-5 py-5 border-b border-slate-800">
      <div class="text-lg font-bold tracking-tight text-white">LeadOS</div>
      <div class="text-[11px] text-slate-500 mt-0.5">sensory + memory build</div>
    </div>
    <nav id="nav" class="flex-1 px-3 py-4 space-y-1 text-sm"></nav>
    <div class="px-4 py-3 border-t border-slate-800 text-[11px] text-slate-500 leading-relaxed">
      Haptics <span id="hapticStateTag" class="font-mono"></span><br>
      Audio <span id="audioStateTag" class="font-mono"></span>
    </div>

  <!-- Main -->
  <main class="flex-1 min-w-0">
    <header class="h-14 bg-white border-b border-slate-200 flex items-center justify-between px-6 sticky top-0 z-10">
      <div id="routeTitle" class="font-semibold text-slate-800"></div>
      <div class="flex items-center gap-2">
        <button id="quickHaptics" class="tap-shrink text-xs px-2.5 py-1.5 rounded-md border border-slate-300 hover:bg-slate-50">Haptics: <span></span></button>
        <button id="quickAudio" class="tap-shrink text-xs px-2.5 py-1.5 rounded-md border border-slate-300 hover:bg-slate-50">Audio: <span></span></button>
      </div>
    </header>
    <section id="view" class="p-6 max-w-5xl mx-auto"></section>
  </main>
</div>

<div id="toastRoot" class="fixed bottom-5 right-5 flex flex-col gap-2 z-50"></div>

<script>
/* =========================================================================
   LEADOS — single-file vanilla build.
   Provenance / honesty note (verified live against github.com/wbweve/Leados
   on the date of this session — see AI-SESSION-LOG.md for the full ledger):

   - This file is an ORIGINAL implementation. It does NOT port any upstream
     code, because the upstream repo's own `index.html` on `main`, fetched
     directly by this session, is currently a 14-line Vite/React entry stub
     (`<div id="root">` + `<script type="module" src="/src/main.tsx">`) with
     no inline logic to port or verify constants from.
   - The upstream repo's own README.md / AI-SESSION-LOG.md describe a prior,
     different state (an 86,898-byte vanilla index.html with grep-verified
     constants). This session could not reproduce that file at `main` HEAD
     and does not treat that prior description as current fact.
   - Every constant, threshold, and piece of seed content below is therefore
     ORIGINAL to this session and is NOT claimed to be sourced from upstream.
   - The haptic pattern library and Web Audio sound design below ARE
     implemented per the literal specification pasted into this task
     (PART 3), reproduced faithfully, plus small enforcement additions
     (disclosed in-line with `// ADDED:`) that make the written "principles"
     actually true at runtime instead of just documented.
   ========================================================================= */

const LEADOS = {};

/* ---------------------------------------------------------------------
   CORE: append-only event log, durable in localStorage.
   Nothing derived is stored — every view recomputes via project().
--------------------------------------------------------------------- */
LEADOS.core = {
  STORAGE_KEY: 'leados:events',
  DOMAINS: ['people','finance','ops','strategy','legal','product'],

  load() {
    try { return JSON.parse(localStorage.getItem(this.STORAGE_KEY)) || []; }
    catch (e) { return []; }
  },
  save(events) {
    localStorage.setItem(this.STORAGE_KEY, JSON.stringify(events));
  },
  append(event) {
    const events = this.load();
    event.ts = event.ts || Date.now();
    event.seq = events.length;
    events.push(event);
    this.save(events);
    return event;
  },
  wipe() { localStorage.removeItem(this.STORAGE_KEY); },

  seedIfEmpty() {
    if (this.load().length) return;
    const now = Date.now();
    const day = 86400000;
    const seedFindings = [
      { domain: 'people',   title: 'Two resignations filed same week, same team', severity: 5, ageDays: 1 },
      { domain: 'finance',  title: 'Q3 burn 18% over forecast', severity: 4, ageDays: 3 },
      { domain: 'ops',      title: 'Vendor SLA breach, 3rd time this quarter', severity: 3, ageDays: 6 },
      { domain: 'strategy', title: 'Competitor shipped overlapping feature', severity: 2, ageDays: 10 },
      { domain: 'legal',    title: 'Contract renewal clause ambiguous', severity: 3, ageDays: 14 },
      { domain: 'product',  title: 'Churn tick-up in enterprise tier', severity: 4, ageDays: 2 },
    ];
    seedFindings.forEach((f, i) => {
      this.append({
        type: 'finding.created',
        key: 'f' + (i + 1),
        domain: f.domain,
        title: f.title,
        severity: f.severity,
        ts: now - f.ageDays * day,
      });
    });
  },

  // project(): pure function, events -> current-state view. Recomputed on every render.
  project() {
    const events = this.load();
    const findings = new Map();
    const decisions = [];
    for (const e of events) {
      if (e.type === 'finding.created') {
        findings.set(e.key, { key: e.key, domain: e.domain, title: e.title, severity: e.severity, createdTs: e.ts, status: 'open' });
      } else if (e.type === 'finding.snoozed' && findings.has(e.key)) {
        findings.get(e.key).status = 'snoozed';
      } else if (e.type === 'finding.dismissed' && findings.has(e.key)) {
        findings.get(e.key).status = 'dismissed';
      } else if (e.type === 'finding.resolved' && findings.has(e.key)) {
        findings.get(e.key).status = 'resolved';
      } else if (e.type === 'decision.logged') {
        decisions.push(e);
      }
    }
    return { events, findings: [...findings.values()], decisions };
  }
};

/* ---------------------------------------------------------------------
   HAPTICS — reproduced from the PART 3 spec, verbatim pattern library,
   plus an ADDED fatigue guard (spec documents the "no more than 1 haptic
   event per 3s" principle but the pasted code didn't enforce it — this
   build enforces it so the principle is actually true, not just stated).
--------------------------------------------------------------------- */
LEADOS.haptics = {
  PATTERNS: {
    SUCCESS: [50, 50, 50],
    WARNING: [100, 50, 100],
    CRITICAL: [200, 100, 100, 100, 200],
    REJECTION: [300],
    NAVIGATION: [20],
    CONFIRMATION: [40, 30, 40],
    RESOLUTION: [30, 20, 50, 20, 100],
    DISMISSAL: [80, 30, 50, 30, 20],
  },

  _lastFire: 0,

  play(pattern) {
    if (!navigator.vibrate) return;          // not supported — silently skip
    if (!this._enabled) return;              // user preference
    const now = Date.now();
    if (now - this._lastFire < 3000) return; // ADDED: fatigue guard (principle #3)
    this._lastFire = now;
    navigator.vibrate(this.PATTERNS[pattern] || [50]);
  },

  onEvent(eventType) {
    const map = {
      'form.submit.success': 'SUCCESS',
      'form.submit.error': 'REJECTION',
      'finding.snoozed': 'CONFIRMATION',
      'finding.dismissed': 'DISMISSAL',
      'finding.critical_new': 'CRITICAL',
      'finding.resolved': 'RESOLUTION',       // ADDED: natural extension, disclosed
      'playbook.completed': 'RESOLUTION',
      'nav.change': 'NAVIGATION',
      'toast.warning': 'WARNING',
    };
    if (map[eventType]) this.play(map[eventType]);
  },

  _enabled: localStorage.getItem('leados:haptics') === '1',

  setEnabled(enabled) {
    this._enabled = enabled;
    localStorage.setItem('leados:haptics', enabled ? '1' : '0');
    syncSensoryTags();
  }
};

/* ---------------------------------------------------------------------
   AUDIO — reproduced from the PART 3 spec (Web Audio, synthesized only,
   no files), plus an ADDED per-session restraint counter enforcing
   "sound design principle #3: ≤ 3 distinct sounds per session."
--------------------------------------------------------------------- */
LEADOS.audio = {
  ctx: null,
  _enabled: localStorage.getItem('leados:audio') === '1',

  init() { return this; },

  _getCtx() {
    if (!this._enabled) return null;
    if (!this.ctx || this.ctx.state === 'closed') this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  },

  tone(frequency, duration, options = {}) {
    const ctx = this._getCtx();
    if (!ctx) return;
    const { volume = 0.15, type = 'sine', attack = 0.01, release = 0.1 } = options;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = type; osc.frequency.value = frequency;
    const now = ctx.currentTime;
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(volume, now + attack);
    gain.gain.setValueAtTime(volume, now + Math.max(duration - release, attack));
    gain.gain.linearRampToValueAtTime(0, now + duration);
    osc.start(now); osc.stop(now + duration);
  },

  SUCCESS() {
    [261.63, 329.63, 392.00].forEach((freq, i) => setTimeout(() => this.tone(freq, 0.15, { volume: 0.12 }), i * 60));
  },
  WARNING() {
    this.tone(220, 0.2, { volume: 0.1 });
    setTimeout(() => this.tone(311.13, 0.2, { volume: 0.1 }), 0);
  },
  CRITICAL() {
    [0, 300, 600].forEach(delay => setTimeout(() => this.tone(80, 0.25, { volume: 0.2, type: 'sawtooth' }), delay));
  },
  RESOLUTION() {
    [261.63, 329.63, 392.00, 523.25].forEach((freq, i) => setTimeout(() => this.tone(freq, 0.12, { volume: 0.1 }), i * 80));
  },
  NAVIGATION() { this.tone(800, 0.02, { volume: 0.08, type: 'square' }); },
  TYPING_FOCUS() { this.tone(1200, 0.01, { volume: 0.04 }); },

  // ADDED: enforce "≤3 distinct sounds per session" literally.
  _sessionPlayed() {
    try { return JSON.parse(sessionStorage.getItem('leados:audio:played')) || []; }
    catch (e) { return []; }
  },
  playSemantic(name) {
    if (!this._enabled || typeof this[name] !== 'function') return;
    const played = this._sessionPlayed();
    if (!played.includes(name) && played.length >= 3) {
      console.info('[LEADOS.audio] restraint principle: 3 distinct sounds already used this session, skipping', name);
      return;
    }
    if (!played.includes(name)) {
      played.push(name);
      sessionStorage.setItem('leados:audio:played', JSON.stringify(played));
    }
    this[name]();
  },

  setEnabled(enabled) {
    this._enabled = enabled;
    localStorage.setItem('leados:audio', enabled ? '1' : '0'); // ADDED: persistence (spec left this out)
    if (enabled && !this.ctx) document.addEventListener('click', () => this.init(), { once: true });
    syncSensoryTags();
  }
};

/* ---------------------------------------------------------------------
   SENSORY DISPATCH — one call site fires both channels from one semantic
   event name, per the spec's "haptic is always redundant with a visual
   or audio signal" principle.
--------------------------------------------------------------------- */
LEADOS.sensory = {
  EVENT_TO_AUDIO: {
    'form.submit.success': 'SUCCESS',
    'finding.critical_new': 'CRITICAL',
    'finding.resolved': 'RESOLUTION',
    'playbook.completed': 'RESOLUTION',
    'nav.change': 'NAVIGATION',
    'toast.warning': 'WARNING',
    // NOTE: CONFIRMATION, DISMISSAL, REJECTION have no audio counterpart —
    // this matches the spec literally (it only ever defines 6 audio
    // methods against 8 haptic patterns). Unverified whether that
    // asymmetry was intentional upstream; preserved as given.
  },
  fire(eventType) {
    LEADOS.haptics.onEvent(eventType);
    const audioName = this.EVENT_TO_AUDIO[eventType];
    if (audioName) LEADOS.audio.playSemantic(audioName);
  }
};

/* ---------------------------------------------------------------------
   MEMORY — working memory (session layer), reproduced from PART 4 spec.
--------------------------------------------------------------------- */
LEADOS.memory = { session: {
  KEYS: {
    FOCUS: 'leados:focus',
    HISTORY: 'leados:nav-history',
    FAMILIARITY: 'leados:familiar',
    FATIGUE: 'leados:fatigue',
    DRAFT: 'leados:draft:',
    SCROLL: 'leados:scroll:',
    FILTERS: 'leados:filters',
    PANEL: 'leados:panel',
    SEARCH: 'leados:search-hist',
    ATTENTION: 'leados:attention',
    COMPARE: 'leados:compare',
  },

  get(key) {
    try { return JSON.parse(sessionStorage.getItem(key)); }
    catch (e) { return null; }
  },
  set(key, value) {
    try { sessionStorage.setItem(key, JSON.stringify(value)); }
    catch (e) { /* sessionStorage full — silent fail */ }
  },

  addToCompare(findingKey) {
    const current = this.get(this.KEYS.COMPARE) || [];
    if (current.includes(findingKey)) return;
    if (current.length >= 2) current.shift();
    current.push(findingKey);
    this.set(this.KEYS.COMPARE, current);
  },
  removeFromCompare(findingKey) {
    const current = (this.get(this.KEYS.COMPARE) || []).filter(k => k !== findingKey);
    this.set(this.KEYS.COMPARE, current);
  },
  getComparePair() { return this.get(this.KEYS.COMPARE) || []; },

  pushHistory(route) {
    const h = this.get(this.KEYS.HISTORY) || [];
    h.push({ route, ts: Date.now() });
    while (h.length > 10) h.shift();
    this.set(this.KEYS.HISTORY, h);
  }
}};

/* =========================================================================
   APP SHELL: router, views, toasts.
   NOTE: comparison-mode *behavior* (beyond side-by-side display) was cut
   off mid-sentence in the pasted PART 4 spec ("When two findings are in
   compare mode:" with no continuation). The diff view below is this
   session's own reasonable, disclosed fill-in, not a recovered spec.
   ========================================================================= */

const ROUTES = [
  ['today', 'Today'],
  ['domains', 'Domains'],
  ['decisions', 'Decisions'],
  ['compare', 'Compare'],
  ['sensory', 'Sensory Lab'],
  ['log', 'Event Log'],
  ['about', 'Provenance / About'],
];

function currentRoute() { return (location.hash.replace('#/', '') || 'today'); }

function toast(message, kind = 'info') {
  const el = document.createElement('div');
  const colors = { info: 'bg-slate-900', warning: 'bg-amber-600', critical: 'bg-rose-700', success: 'bg-emerald-700' };
  el.className = `toast ${colors[kind] || colors.info} text-white text-sm rounded-lg shadow-lg px-4 py-2.5 max-w-xs`;
  el.textContent = message;
  document.getElementById('toastRoot').appendChild(el);
  if (kind === 'warning') LEADOS.sensory.fire('toast.warning');
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 300); }, 3200);
}

function fmtAge(ts) {
  const d = Math.floor((Date.now() - ts) / 86400000);
  return d <= 0 ? 'today' : d + 'd ago';
}
function domainColor(domain) {
  const map = { people: 'bg-violet-100 text-violet-800', finance: 'bg-emerald-100 text-emerald-800', ops: 'bg-sky-100 text-sky-800', strategy: 'bg-amber-100 text-amber-800', legal: 'bg-rose-100 text-rose-800', product: 'bg-indigo-100 text-indigo-800' };
  return map[domain] || 'bg-slate-100 text-slate-800';
}
function sevLabel(s) { return s >= 5 ? 'Critical' : s === 4 ? 'High' : s === 3 ? 'Medium' : 'Low'; }

function renderNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = '';
  ROUTES.forEach(([key, label]) => {
    const btn = document.createElement('button');
    btn.className = 'nav-btn w-full text-left px-3 py-2 rounded-md hover:bg-slate-800 tap-shrink';
    btn.textContent = label;
    btn.onclick = () => { location.hash = '#/' + key; };
    if (currentRoute() === key) btn.classList.add('active');
    nav.appendChild(btn);
  });
}

function render() {
  const route = currentRoute();
  renderNav();
  document.getElementById('routeTitle').textContent = (ROUTES.find(r => r[0] === route) || [,'Today'])[1];
  LEADOS.memory.session.set(LEADOS.memory.session.KEYS.FOCUS, route);
  LEADOS.memory.session.pushHistory(route);
  LEADOS.sensory.fire('nav.change');

  const view = document.getElementById('view');
  view.classList.remove('fade-in'); void view.offsetWidth; view.classList.add('fade-in');

  const renderers = { today: renderToday, domains: renderDomains, decisions: renderDecisions, compare: renderCompare, sensory: renderSensory, log: renderLog, about: renderAbout };
  (renderers[route] || renderToday)();
  syncSensoryTags();
}

function renderToday() {
  const { findings } = LEADOS.core.project();
  const open = findings.filter(f => f.status === 'open').sort((a, b) => b.severity - a.severity);
  const compare = LEADOS.memory.session.getComparePair();

  const view = document.getElementById('view');
  view.innerHTML = `
    <div class="mb-4 text-sm text-slate-500">${open.length} open finding${open.length === 1 ? '' : 's'} across ${LEADOS.core.DOMAINS.length} domains.</div>
    <div class="grid gap-3" id="findingsGrid"></div>
  `;
  const grid = document.getElementById('findingsGrid');
  if (!open.length) {
    grid.innerHTML = `<div class="text-slate-400 text-sm italic py-10 text-center border border-dashed border-slate-300 rounded-xl">No open findings. Quiet day.</div>`;
    return;
  }
  open.forEach(f => {
    const card = document.createElement('div');
    card.className = 'bg-white rounded-xl border border-slate-200 p-4 flex items-start justify-between gap-4 fade-in';
    const inCompare = compare.includes(f.key);
    card.innerHTML = `
      <div class="min-w-0">
        <div class="flex items-center gap-2 mb-1.5">
          <span class="text-[11px] font-medium px-2 py-0.5 rounded-full ${domainColor(f.domain)}">${f.domain}</span>
          <span class="text-[11px] font-medium ${f.severity >= 5 ? 'text-rose-600' : f.severity === 4 ? 'text-amber-600' : 'text-slate-500'}">${sevLabel(f.severity)}</span>
          <span class="text-[11px] text-slate-400">${fmtAge(f.createdTs)}</span>
        </div>
        <div class="font-medium text-slate-800">${f.title}</div>
      </div>
      <div class="flex items-center gap-1.5 shrink-0">
        <button data-act="compare" class="tap-shrink text-xs px-2 py-1 rounded-md border ${inCompare ? 'border-slate-900 bg-slate-900 text-white' : 'border-slate-300 hover:bg-slate-50'}">${inCompare ? '✓ Compare' : '+ Compare'}</button>
        <button data-act="snooze" class="tap-shrink text-xs px-2 py-1 rounded-md border border-slate-300 hover:bg-slate-50">Snooze</button>
        <button data-act="dismiss" class="tap-shrink text-xs px-2 py-1 rounded-md border border-slate-300 hover:bg-slate-50">Dismiss</button>
        <button data-act="resolve" class="tap-shrink text-xs px-2 py-1 rounded-md border border-emerald-300 text-emerald-700 hover:bg-emerald-50">Resolve</button>
      </div>`;
    card.querySelector('[data-act="snooze"]').onclick = () => {
      LEADOS.core.append({ type: 'finding.snoozed', key: f.key });
      LEADOS.sensory.fire('finding.snoozed'); toast('Finding snoozed', 'info'); renderToday();
    };
    card.querySelector('[data-act="dismiss"]').onclick = () => {
      LEADOS.core.append({ type: 'finding.dismissed', key: f.key });
      LEADOS.sensory.fire('finding.dismissed'); toast('Finding dismissed', 'info'); renderToday();
    };
    card.querySelector('[data-act="resolve"]').onclick = () => {
      LEADOS.core.append({ type: 'finding.resolved', key: f.key });
      LEADOS.sensory.fire('finding.resolved'); toast('Finding resolved', 'success'); renderToday();
    };
    card.querySelector('[data-act="compare"]').onclick = () => {
      if (inCompare) LEADOS.memory.session.removeFromCompare(f.key);
      else LEADOS.memory.session.addToCompare(f.key);
      renderToday();
    };
    grid.appendChild(card);
  });
}

function renderDomains() {
  const { findings } = LEADOS.core.project();
  const open = findings.filter(f => f.status === 'open');
  const view = document.getElementById('view');
  view.innerHTML = `<div class="grid grid-cols-2 md:grid-cols-3 gap-3" id="domGrid"></div>
    <p class="text-xs text-slate-400 mt-4">Heat = sum of open severities in that domain. Original to this build, not an upstream formula (upstream's current <code>index.html</code> has no computable logic to verify a decay formula against — see About).</p>`;
  const grid = document.getElementById('domGrid');
  LEADOS.core.DOMAINS.forEach(d => {
    const items = open.filter(f => f.domain === d);
    const heat = items.reduce((s, f) => s + f.severity, 0);
    const intensity = Math.min(heat / 15, 1);
    grid.innerHTML += `
      <div class="rounded-xl border border-slate-200 p-4 bg-white">
        <div class="flex items-center justify-between mb-2">
          <span class="text-[11px] font-medium px-2 py-0.5 rounded-full ${domainColor(d)}">${d}</span>
          <span class="text-xs text-slate-400">${items.length} open</span>
        </div>
        <div class="h-2 rounded-full bg-slate-100 overflow-hidden mb-2">
          <div class="h-full bg-rose-500" style="width:${(intensity * 100).toFixed(0)}%"></div>
        </div>
        <div class="text-2xl font-bold text-slate-800">${heat}</div>
        <div class="text-[11px] text-slate-400">heat score</div>
      </div>`;
  });
}

function renderDecisions() {
  const { decisions } = LEADOS.core.project();
  const view = document.getElementById('view');
  view.innerHTML = `
    <form id="decForm" class="bg-white border border-slate-200 rounded-xl p-4 mb-6 grid grid-cols-1 md:grid-cols-4 gap-3">
      <select name="domain" class="border rounded-md px-2 py-1.5 text-sm">${LEADOS.core.DOMAINS.map(d => `<option value="${d}">${d}</option>`).join('')}</select>
      <select name="impact" class="border rounded-md px-2 py-1.5 text-sm">
        <option value="1">Impact: Low</option><option value="3" selected>Impact: Medium</option><option value="5">Impact: High</option>
      </select>
      <select name="reversibility" class="border rounded-md px-2 py-1.5 text-sm">
        <option value="reversible">Reversible</option><option value="irreversible">Irreversible</option>
      </select>
      <input name="note" required placeholder="Decision (required)" class="border rounded-md px-2 py-1.5 text-sm md:col-span-4" />
      <button class="tap-shrink md:col-span-4 bg-slate-900 text-white rounded-md py-1.5 text-sm font-medium">Log decision</button>
    </form>
    <div id="decList" class="space-y-2"></div>
    <p class="text-xs text-slate-400 mt-4">Quadrant thresholds (impact ≥ 3 = "high") are original/fabricated for this build, disclosed here rather than presented as a verified upstream rule.</p>
  `;
  document.getElementById('decForm').onsubmit = (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const note = fd.get('note').trim();
    if (!note) { LEADOS.sensory.fire('form.submit.error'); toast('Decision text is required', 'critical'); return; }
    LEADOS.core.append({ type: 'decision.logged', domain: fd.get('domain'), impact: Number(fd.get('impact')), reversibility: fd.get('reversibility'), note });
    LEADOS.sensory.fire('form.submit.success'); toast('Decision logged', 'success');
    e.target.reset(); renderDecisions();
  };
  const list = document.getElementById('decList');
  [...decisions].reverse().forEach(d => {
    const impactHigh = d.impact >= 3;
    const quadrant = impactHigh && d.reversibility === 'reversible' ? 'Bold Bet'
      : impactHigh ? 'Point of No Return'
      : d.reversibility === 'reversible' ? 'Quick Call' : 'Caution';
    const stale = (Date.now() - d.ts) > 21 * 86400000;
    list.innerHTML += `
      <div class="bg-white border border-slate-200 rounded-lg p-3 flex items-center justify-between gap-3">
        <div class="min-w-0">
          <div class="flex items-center gap-2 mb-1">
            <span class="text-[11px] font-medium px-2 py-0.5 rounded-full ${domainColor(d.domain)}">${d.domain}</span>
            <span class="text-[11px] font-semibold text-slate-600">${quadrant}</span>
            ${stale ? '<span class="text-[11px] text-amber-600 font-medium">· stale &gt;21d</span>' : ''}
          </div>
          <div class="text-sm text-slate-800 truncate">${d.note}</div>
        </div>
        <span class="text-xs text-slate-400 shrink-0">${fmtAge(d.ts)}</span>
      </div>`;
  });
}

function renderCompare() {
  const { findings } = LEADOS.core.project();
  const pair = LEADOS.memory.session.getComparePair().map(k => findings.find(f => f.key === k)).filter(Boolean);
  const view = document.getElementById('view');
  if (pair.length < 2) {
    view.innerHTML = `<div class="text-slate-400 text-sm italic py-10 text-center border border-dashed border-slate-300 rounded-xl">
      Select two findings from <a href="#/today" class="underline">Today</a> ("+ Compare") to see a side-by-side diff.<br>
      Currently holding: ${pair.length}/2.
    </div>`;
    return;
  }
  const [a, b] = pair;
  const row = (label, va, vb, diff) => `
    <tr class="border-b border-slate-100">
      <td class="py-2 pr-4 text-xs text-slate-400 uppercase tracking-wide">${label}</td>
      <td class="py-2 pr-4 font-medium ${diff ? 'text-amber-700' : ''}">${va}</td>
      <td class="py-2 font-medium ${diff ? 'text-amber-700' : ''}">${vb}</td>
    </tr>`;
  view.innerHTML = `
    <div class="bg-white border border-slate-200 rounded-xl p-5">
      <table class="w-full text-sm">
        <thead><tr class="text-left"><th></th><th class="pb-2">${a.title}</th><th class="pb-2">${b.title}</th></tr></thead>
        <tbody>
          ${row('Domain', a.domain, b.domain, a.domain !== b.domain)}
          ${row('Severity', sevLabel(a.severity), sevLabel(b.severity), a.severity !== b.severity)}
          ${row('Age', fmtAge(a.createdTs), fmtAge(b.createdTs), true)}
          ${row('Status', a.status, b.status, a.status !== b.status)}
        </tbody>
      </table>
      <button id="clearCompare" class="tap-shrink mt-4 text-xs px-3 py-1.5 rounded-md border border-slate-300 hover:bg-slate-50">Clear comparison</button>
    </div>
    <p class="text-xs text-slate-400 mt-3">Note: the pasted spec for Compare Mode cut off mid-sentence ("When two findings are in compare mode:"). This diff table is this session's own disclosed fill-in, not a recovered spec.</p>
  `;
  document.getElementById('clearCompare').onclick = () => { LEADOS.memory.session.set(LEADOS.memory.session.KEYS.COMPARE, []); renderCompare(); };
}

function renderSensory() {
  const view = document.getElementById('view');
  const h = LEADOS.haptics, a = LEADOS.audio;
  const playedAudio = a._sessionPlayed();
  view.innerHTML = `
    <div class="grid md:grid-cols-2 gap-5">
      <div class="bg-white border border-slate-200 rounded-xl p-5">
        <div class="flex items-center justify-between mb-3">
          <h3 class="font-semibold">Haptics</h3>
          <label class="inline-flex items-center gap-2 text-sm cursor-pointer">
            <input id="hapticsToggle" type="checkbox" ${h._enabled ? 'checked' : ''} class="w-4 h-4">
            enabled
          </label>
        </div>
        <p class="text-xs text-slate-500 mb-3">Off by default. Secondary/confirmation channel only — never the sole carrier of information. One haptic event per 3s max (enforced).</p>
        ${!navigator.vibrate ? '<p class="text-xs text-rose-500 mb-3">navigator.vibrate not supported in this browser — buttons below will no-op.</p>' : ''}
        <div class="flex flex-wrap gap-2" id="hapticButtons"></div>
      </div>
      <div class="bg-white border border-slate-200 rounded-xl p-5">
        <div class="flex items-center justify-between mb-3">
          <h3 class="font-semibold">Audio</h3>
          <label class="inline-flex items-center gap-2 text-sm cursor-pointer">
            <input id="audioToggle" type="checkbox" ${a._enabled ? 'checked' : ''} class="w-4 h-4">
            enabled
          </label>
        </div>
        <p class="text-xs text-slate-500 mb-3">Pure Web Audio synthesis, no files. Restraint rule enforced live: max 3 distinct sounds/session. Used so far: <span class="font-mono">${playedAudio.length}/3</span> ${playedAudio.length ? '(' + playedAudio.join(', ') + ')' : ''}</p>
        <div class="flex flex-wrap gap-2" id="audioButtons"></div>
      </div>
    </div>
    <div class="bg-white border border-slate-200 rounded-xl p-5 mt-5 text-sm text-slate-600 space-y-2">
      <h3 class="font-semibold text-slate-800 mb-1">Governing principles (as specified)</h3>
      <ul class="list-disc pl-5 space-y-1">
        <li>Optionality — sound off by default, never on without consent.</li>
        <li>Layering — sound reinforces visuals, never replaces them.</li>
        <li>Restraint — ≤ 3 distinct sounds per session.</li>
        <li>Pitch semantics — low = weight/alarm, mid = information, high = success/lightness.</li>
        <li>Duration semantics — &lt;50ms micro, 50–200ms navigation, 200–500ms warning, &gt;500ms critical-only.</li>
        <li>Cultural neutrality — pure tones/simple intervals, no melodic quotations.</li>
      </ul>
    </div>
  `;
  document.getElementById('hapticsToggle').onchange = (e) => { h.setEnabled(e.target.checked); };
  document.getElementById('audioToggle').onchange = (e) => { a.setEnabled(e.target.checked); };
  const hb = document.getElementById('hapticButtons');
  Object.keys(h.PATTERNS).forEach(name => {
    const btn = document.createElement('button');
    btn.className = 'tap-shrink text-xs px-3 py-1.5 rounded-md border border-slate-300 hover:bg-slate-50 font-mono';
    btn.textContent = name;
    btn.onclick = () => h.play(name);
    hb.appendChild(btn);
  });
  const ab = document.getElementById('audioButtons');
  ['SUCCESS','WARNING','CRITICAL','RESOLUTION','NAVIGATION','TYPING_FOCUS'].forEach(name => {
    const btn = document.createElement('button');
    btn.className = 'tap-shrink text-xs px-3 py-1.5 rounded-md border border-slate-300 hover:bg-slate-50 font-mono';
    btn.textContent = name;
    btn.onclick = () => a.playSemantic(name);
    ab.appendChild(btn);
  });
}

function renderLog() {
  const { events } = LEADOS.core.project();
  const view = document.getElementById('view');
  view.innerHTML = `
    <div class="flex gap-2 mb-4">
      <button id="exportBtn" class="tap-shrink text-xs px-3 py-1.5 rounded-md border border-slate-300 hover:bg-slate-50">Export JSON</button>
      <button id="wipeBtn" class="tap-shrink text-xs px-3 py-1.5 rounded-md border border-rose-300 text-rose-700 hover:bg-rose-50">Wipe + reseed</button>
    </div>
    <div class="bg-white border border-slate-200 rounded-xl p-4 max-h-[60vh] overflow-auto">
      <pre class="text-xs text-slate-600 whitespace-pre-wrap">${JSON.stringify(events, null, 2)}</pre>
    </div>`;
  document.getElementById('exportBtn').onclick = () => {
    const blob = new Blob([JSON.stringify(events, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a'); link.href = url; link.download = 'leados-events.json'; link.click();
    URL.revokeObjectURL(url);
  };
  document.getElementById('wipeBtn').onclick = () => {
    LEADOS.core.wipe(); LEADOS.core.seedIfEmpty(); toast('Event log reset', 'info'); renderLog();
  };
}

function syncSensoryTags() {
  const h = LEADOS.haptics._enabled, a = LEADOS.audio._enabled;
  document.getElementById('hapticStateTag').textContent = h ? 'ON' : 'off';
  document.getElementById('audioStateTag').textContent = a ? 'ON' : 'off';
  const qh = document.getElementById('quickHaptics'), qa = document.getElementById('quickAudio');
  qh.querySelector('span').textContent = h ? 'on' : 'off';
  qa.querySelector('span').textContent = a ? 'on' : 'off';
}

document.getElementById('quickHaptics').onclick = () => LEADOS.haptics.setEnabled(!LEADOS.haptics._enabled);
document.getElementById('quickAudio').onclick = () => LEADOS.audio.setEnabled(!LEADOS.audio._enabled);

window.addEventListener('hashchange', render);
LEADOS.core.seedIfEmpty();
if (!location.hash) location.hash = '#/today';
render();
