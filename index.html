   This file intentionally does NOT literally run the real repo's React/TypeScript code —

  const STORE_KEY = "leados-keyboard:data"; // deliberately distinct from leados:data (real) and
                                             // leados-moment:data (prior disclosed sandbox) so this
                                             // build can never collide with either on one origin.

  // ---------------------------------------------------------------- utilities
  const $ = (sel, root=document) => root.querySelector(sel);
  const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
  const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const uid = () => Math.random().toString(36).slice(2,9);
  const isTypingTarget = (el) => el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.isContentEditable);

  // ---------------------------------------------------------------- store (append-only event log)
  function loadEvents(){
    try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; } catch(e){ return []; }
  }
  function saveEvents(events){ localStorage.setItem(STORE_KEY, JSON.stringify(events)); }
  function append(type, data){
    const events = loadEvents();
    const nextId = events.length ? Math.max(...events.map(e=>e.id)) + 1 : 1;
    events.push({ id: nextId, type, data, ts: new Date().toISOString() });
    saveEvents(events);
    return events;
  }

  const DOMAINS = ["Strategy","Operations","People","Finance","Market","Culture"]; // ⚠️ fabricated

  const CONF_FACTOR = { low: 0.8, med: 1.0, high: 1.2 }; // ⚠️ fabricated

  function seedIfEmpty(){
    if (loadEvents().length) return;
    const now = Date.now();
    const mk = (daysAgo) => new Date(now - daysAgo*86400000).toISOString();
    const seedFindings = [
      { title:"Second consecutive quarter avoiding the pricing conversation with Ops", domain:"Operations", severity:"critical", conf:"high", kind:"structural", tags:["avoidance"], play:"Put pricing on next 1:1 agenda explicitly, not as a side note.", energyCost:3, patternMultiplier:1.6, prefireMultiplier:1.4, domainImprovement:8, createdDaysAgo:34 },
      { title:"Same escalation path bypassed by three different reports this month", domain:"Operations", severity:"high", conf:"high", kind:"structural", tags:["avoidance","structural"], play:"Name the pattern in the next staff meeting, not 1:1 by 1:1.", energyCost:2, patternMultiplier:1.5, prefireMultiplier:1.2, domainImprovement:6, createdDaysAgo:21 },
      { title:"Market-share narrative hasn't been updated since the competitor launch", domain:"Market", severity:"high", conf:"med", kind:"strategic", tags:["drift"], play:"Commission a 1-page re-read of the competitive set this week.", energyCost:4, patternMultiplier:1.1, prefireMultiplier:1.3, domainImprovement:7, createdDaysAgo:12 },
      { title:"Finance forecast confidence stated as 'high' three times, missed twice", domain:"Finance", severity:"med", conf:"high", kind:"reactive", tags:["overconfidence"], play:"Ask for the forecast's own error bars before the next board update.", energyCost:2, patternMultiplier:1.2, prefireMultiplier:1.0, domainImprovement:5, createdDaysAgo:8 },
      { title:"No named successor for the Finance director role", domain:"Finance", severity:"critical", conf:"med", kind:"structural", tags:["succession-gap"], play:"Open a succession candidate slate for this role this week.", energyCost:3, patternMultiplier:1.0, prefireMultiplier:1.5, domainImprovement:9, createdDaysAgo:40 },
      { title:"A dissenting voice in the Culture review was cut off twice in the transcript", domain:"Culture", severity:"high", conf:"med", kind:"reactive", tags:["suppression"], play:"Follow up 1:1 and explicitly invite the point back onto the agenda.", energyCost:2, patternMultiplier:1.3, prefireMultiplier:1.1, domainImprovement:6, createdDaysAgo:5 },
      { title:"People engagement score down two straight cycles, no owner assigned", domain:"People", severity:"high", conf:"med", kind:"reactive", tags:["drift"], play:"Assign a single owner and a 30-day check-in.", energyCost:3, patternMultiplier:1.2, prefireMultiplier:1.1, domainImprovement:6, createdDaysAgo:18 },
      { title:"Growth plan for the Ops lead hasn't moved a level in two review cycles", domain:"Operations", severity:"med", conf:"low", kind:"strategic", tags:["growth-stall"], play:"Revisit the growth plan milestones in the next 1:1.", energyCost:2, patternMultiplier:1.0, prefireMultiplier:1.0, domainImprovement:4, createdDaysAgo:50 },
      { title:"Strategy offsite follow-ups: 0 of 6 action items have an owner", domain:"Strategy", severity:"critical", conf:"high", kind:"strategic", tags:["drift"], play:"Assign owners to all six items before the next sync.", energyCost:4, patternMultiplier:1.3, prefireMultiplier:1.4, domainImprovement:9, createdDaysAgo:15 },
      { title:"Market pricing experiment results are two weeks overdue for a readout", domain:"Market", severity:"med", conf:"med", kind:"reactive", tags:[], play:"Request the readout directly, with a date.", energyCost:1, patternMultiplier:1.0, prefireMultiplier:1.0, domainImprovement:3, createdDaysAgo:3 },
      { title:"Culture survey verbatims flag 'leadership unavailable' for the third time", domain:"Culture", severity:"high", conf:"med", kind:"structural", tags:["avoidance"], play:"Block two visible office-hours slots this week.", energyCost:2, patternMultiplier:1.4, prefireMultiplier:1.2, domainImprovement:6, createdDaysAgo:9 },
      { title:"Finance headcount request sitting unanswered for 19 days", domain:"Finance", severity:"med", conf:"low", kind:"reactive", tags:[], play:"Give a yes/no/when by Friday.", energyCost:1, patternMultiplier:1.0, prefireMultiplier:1.0, domainImprovement:3, createdDaysAgo:19 },
      { title:"People: exit interview theme repeats 'unclear growth path' for new hires", domain:"People", severity:"med", conf:"med", kind:"strategic", tags:["drift"], play:"Draft a 90-day growth-path template this sprint.", energyCost:3, patternMultiplier:1.1, prefireMultiplier:1.0, domainImprovement:5, createdDaysAgo:27, snoozed:true },
    ];
    const events = [];
    seedFindings.forEach((f,i) => {
      events.push({ id:i+1, type:"finding.logged", data:{
        key:"f-"+uid(), title:f.title, domain:f.domain, severity:f.severity, conf:f.conf, kind:f.kind,
        tags:f.tags, play:f.play, energyCost:f.energyCost, patternMultiplier:f.patternMultiplier,
        prefireMultiplier:f.prefireMultiplier, domainImprovement:f.domainImprovement, status: f.snoozed ? "snoozed" : "active"
      }, ts: mk(f.createdDaysAgo) });
    });
    saveEvents(events);
  }

  // ---------------------------------------------------------------- projection
  function project(events){
    const findings = {};
    events.forEach(e => {
      if (e.type === "finding.logged") findings[e.data.key] = { ...e.data, id:e.id, ts:e.ts };
      if (e.type === "finding.snoozed" && findings[e.data.key]) findings[e.data.key].status = "snoozed";
      if (e.type === "finding.restored" && findings[e.data.key]) findings[e.data.key].status = "active";
    });
    const all = Object.values(findings);
    const active = all.filter(f => f.status !== "snoozed");
    const domainsOut = {};
    DOMAINS.forEach(d => {
      const ds = active.filter(f => f.domain === d);
      const sevWeight = { low:1, med:2, high:3, critical:5 };
      const raw = ds.reduce((s,f)=> s + (sevWeight[f.severity]||1), 0);
      domainsOut[d] = { count: ds.length, score: Math.max(0, 100 - raw*6) };
    });
    const succession = events.filter(e => e.type === "succession.added").map(e => e.data);
    const growthPlans = events.filter(e => e.type === "growthplan.moved").reduce((m,e)=>{ m[e.data.person] = e.data.level; return m; }, {});
    const signals = events.filter(e => e.type === "signal.logged").map(e=>e.data);
    const decisions = events.filter(e => e.type === "decision.logged").map(e=>e.data);
    return { events, findings: all, active, domains: domainsOut, succession, growthPlans, signals, decisions };
  }

  // ---------------------------------------------------------------- Five Things (leverage ranking)
  function computeFiveThings(P){
    const scored = P.active.map(f => {
      const confF = CONF_FACTOR[f.conf] ?? 1;
      const leverage = (f.domainImprovement * f.patternMultiplier * f.prefireMultiplier * confF) / f.energyCost;
      const leverageReason = `${f.domain} improvement ×${f.patternMultiplier.toFixed(1)} pattern ×${f.prefireMultiplier.toFixed(1)} pre-fire ×${confF.toFixed(1)} conf(${f.conf}) ÷ ${f.energyCost} energy`;
      return { finding:f, leverage: Math.round(leverage*100)/100, leverageReason, action:f.play, estimatedImpact:`+${f.domainImprovement} to ${f.domain} score (est.)`, energyCost:f.energyCost };
    });
    scored.sort((a,b) => b.leverage - a.leverage);
    return scored.slice(0,5);
  }

  // ---------------------------------------------------------------- Organizational Moment (3x3 template matrix, ⚠️ fabricated)
  function temporalMode(today){
    const third = Math.floor((today.getDate()-1)/10);
    return ["opening","midstream","closing"][Math.min(third,2)];
  }
  function energyAssessment(P){
    const capacity = 40;
    const used = P.active.reduce((s,f)=>s+f.energyCost,0);
    const balance = Math.round(100 - (used/capacity)*100);
    if (balance > 40) return { label:"surplus", balance };
    if (balance > 10) return { label:"balanced", balance };
    return { label:"depleted", balance };
  }
  function entropyScore(P){
    const counts = DOMAINS.map(d => P.domains[d].count);
    const total = counts.reduce((a,b)=>a+b,0) || 1;
    const probs = counts.map(c => c/total).filter(p=>p>0);
    const h = -probs.reduce((s,p)=> s + p*Math.log2(p), 0);
    const hmax = Math.log2(DOMAINS.length);
    return Math.round((h/hmax)*100);
  }
  function kindProportions(P){
    const total = P.active.length || 1;
    const count = k => P.active.filter(f=>f.kind===k).length;
    return {
      structural: Math.round((count("structural")/total)*100),
      strategic: Math.round((count("strategic")/total)*100),
      reactive: Math.round((count("reactive")/total)*100),
    };
  }
  const MOMENT_MATRIX = { // 3 temporal × 3 energy = 9 cells, ⚠️ fabricated this session
    opening: {
      surplus: (n)=>`The cycle is young and the margin is real: ${n.activeCount} active findings sit against a ${n.balance}% energy surplus. ${n.topDomain} is carrying ${n.topShare}% of the open load, which is more a signal of where attention has drifted than of crisis. With structural items at ${n.structural}%, strategic at ${n.strategic}%, and reactive at ${n.reactive}%, there is still room this cycle to work upstream, on the structural causes, before they harden into the reactive work that eats the surplus being spent now.`,
      balanced: (n)=>`Opening-cycle energy is holding at a ${n.balance}% balance, enough to be deliberate but not enough to be careless. ${n.activeCount} findings are active, concentrated ${n.topShare}% in ${n.topDomain}. The entropy reading of ${n.entropy}/100 suggests the load is ${n.entropy>60?"spread thin across domains":"clustered enough to be addressed directly"}. This is the window to set the cycle's two or three real priorities before reactive work claims the rest of the calendar.`,
      depleted: (n)=>`Energy is already tight this early — a ${n.balance}% balance against ${n.activeCount} active findings is a warning, not a crisis. ${n.topDomain} alone accounts for ${n.topShare}% of what's open. Reactive items are ${n.reactive}% of the load; that ratio, this early, usually means last cycle's deferred work has carried forward rather than cleared. The next two weeks matter more than usual for deciding what gets explicitly not done.`,
    },
    midstream: {
      surplus: (n)=>`Midstream, with a ${n.balance}% energy surplus still in hand and ${n.activeCount} active findings, the organization has more room than it is using. ${n.topDomain} holds ${n.topShare}% of the open load. Structural work sits at ${n.structural}% of the mix — the surplus is best spent there now, mid-cycle, while there is still runway to see a structural fix compound before the cycle closes.`,
      balanced: (n)=>`Midstream and balanced: ${n.balance}% energy against ${n.activeCount} active findings, entropy at ${n.entropy}/100. ${n.topDomain} remains the center of gravity at ${n.topShare}% of the load. This is the steadiest reading the organization gets — neither flush enough to be generous nor tight enough to force triage — which makes it the honest moment to ask whether the right ${n.structural}/${n.strategic}/${n.reactive} split of structural, strategic, and reactive work is actually being worked, not just logged.`,
      depleted: (n)=>`Midstream and already depleted — ${n.balance}% balance with ${n.activeCount} findings still active — means the second half of the cycle is being entered without reserve. ${n.topDomain} carries ${n.topShare}% of the load, and reactive items at ${n.reactive}% confirm the pattern: attention is going to what's loudest, not what's highest-leverage. The organizational moment here is a reallocation decision, not a new initiative.`,
    },
    closing: {
      surplus: (n)=>`Closing the cycle with a ${n.balance}% surplus and ${n.activeCount} findings still active is an unusual position — most cycles end depleted. ${n.topDomain} holds ${n.topShare}% of what remains open. The temptation at close is to spend the surplus on anything; the higher-leverage move is to carry the structural ${n.structural}% forward deliberately into next cycle's opening, rather than let it get buried under next cycle's reactive noise.`,
      balanced: (n)=>`The cycle is closing at a ${n.balance}% energy balance with ${n.activeCount} findings still active, concentrated ${n.topShare}% in ${n.topDomain}. Entropy at ${n.entropy}/100 says the open work is ${n.entropy>60?"scattered":"concentrated enough to name cleanly"}. What closes this cycle in reasonable shape and what gets explicitly carried forward, named as such, matters more right now than opening anything new.`,
      depleted: (n)=>`Closing depleted — ${n.balance}% balance against ${n.activeCount} active findings — is the most common and most dangerous moment: the instinct is to push through to a clean close. ${n.topDomain} alone is ${n.topShare}% of the load, reactive work is ${n.reactive}%, and both numbers say the same thing — this cycle should end with an honest list of what gets carried forward, not a forced resolution bought with energy that isn't there.`,
    },
  };
  function generateOrganizationalMoment(P, today){
    const mode = temporalMode(today);
    const ea = energyAssessment(P);
    const entropy = entropyScore(P);
    const kp = kindProportions(P);
    const domainCounts = DOMAINS.map(d => [d, P.domains[d].count]).sort((a,b)=>b[1]-a[1]);
    const [topDomain, topCount] = domainCounts[0];
    const topShare = P.active.length ? Math.round((topCount/P.active.length)*100) : 0;
    const n = { activeCount:P.active.length, balance:ea.balance, topDomain, topShare, entropy, ...kp };
    const text = MOMENT_MATRIX[mode][ea.label](n);
    return { text, mode, energyAssessment: ea.label };
  }

  // ---------------------------------------------------------------- The One Question (priority chain, ⚠️ fabricated)
  function generateHardestQuestion(P){
    const avoidance = P.active.filter(f => f.tags.includes("avoidance"));
    if (avoidance.length >= 2) {
      return { question:`What conversation has now been avoided ${avoidance.length} separate times, and what does the avoidance itself — not the topic — say about what's actually at stake?`, source:`${avoidance.length} findings tagged avoidance`, label:"Priority 1 · avoidance pattern" };
    }
    const structural = P.active.filter(f => f.kind === "structural" && (f.severity==="critical"||f.severity==="high"));
    if (structural.length >= 2) {
      return { question:`If the structural issues were fixed and nothing else changed, would the reactive work actually go down — or is the structure a symptom of something upstream that hasn't been named?`, source:`${structural.length} high/critical structural findings`, label:"Priority 2 · structural drift" };
    }
    const overconfident = P.active.filter(f => f.tags.includes("overconfidence"));
    if (overconfident.length) {
      return { question:`Where else is "high confidence" being treated as a finding rather than as a claim that itself needs checking?`, source:`${overconfident.length} overconfidence-tagged findings`, label:"Priority 3 · overconfidence" };
    }
    const ea = energyAssessment(P);
    if (ea.label === "depleted") {
      return { question:`What is being carried right now purely out of obligation, and who would actually be relieved — not disappointed — if it were set down?`, source:`energy balance at ${ea.balance}%`, label:"Priority 4 · energy depletion" };
    }
    const suppressed = P.active.filter(f => f.tags.includes("suppression"));
    if (suppressed.length) {
      return { question:`Whose dissent was made costly enough last time that it won't be offered again without being explicitly invited back?`, source:`${suppressed.length} suppression-tagged findings`, label:"Priority 5 · suppression" };
    }
    const successionGaps = P.active.filter(f => f.tags.includes("succession-gap"));
    if (successionGaps.length) {
      return { question:`If this role were vacated tomorrow, who would everyone assume was ready — and has that actually been said to them?`, source:`${successionGaps.length} succession-gap findings`, label:"Priority 6 · missing succession plan" };
    }
    const stalled = P.active.filter(f => f.tags.includes("growth-stall"));
    if (stalled.length) {
      return { question:`What would have to be true for the stalled growth plan to actually be the wrong plan, rather than a plan that just hasn't been revisited?`, source:`${stalled.length} growth-stall findings`, label:"Priority 7 · stalled growth plan" };
    }
    const top = computeFiveThings(P)[0];
    if (top) {
      return { question:`Given everything open right now, why isn't "${top.finding.title}" already the thing getting the most attention?`, source:`top-leverage finding (${top.leverage})`, label:"Priority 8 · default leverage question" };
    }
    return { question:`With nothing currently open, what's the next thing worth deliberately looking for?`, source:"no active findings", label:"Priority 8 · default (no data)" };
  }

  // ============================================================================
  // KEYBOARD SYSTEM STATE
  // ============================================================================
  const K = {
    route: "today",
    focusIndex: 0,          // index within whichever list is "active" for the current view
    expanded: null,         // key of an expanded finding/thing, or null
    paletteOpen: false,
    paletteMode: "search",  // "search" | "command"
    helpOpen: false,
    lastGPress: 0,          // for gg double-tap
    toastTimer: null,
  };

  function navigate(route){
    K.route = route; K.focusIndex = 0; K.expanded = null;
    window.location.hash = "#/" + route;
    render();
  }

  function toast(msg){
    clearTimeout(K.toastTimer);
    let el = $("#toast");
    if (!el){
      el = document.createElement("div");
      el.id = "toast";

  function paletteEntries(P){
    const routeEntries = NAV.map(n => ({ type:"route", label:"#/"+n.route, hint:n.label, run:()=>navigate(n.route) }));
    const findingEntries = P.active.map(f => ({ type:"finding", label:f.title, hint:f.domain, run:()=>{ navigate("today"); setTimeout(()=>{ const idx=P.active.findIndex(x=>x.key===f.key); K.focusIndex=Math.max(idx,0); render(); },0); } }));
    const commandEntries = [
      { type:"command", label:"go today", hint:"navigate", run:()=>navigate("today") },
      { type:"command", label:"go synthesis", hint:"navigate", run:()=>navigate("synthesis") },
      { type:"command", label:"export log", hint:"download JSON", run:()=>exportLog(P) },
      { type:"command", label:"wipe log", hint:"reset + reseed", run:()=>wipeLog() },
    ];
    return K.paletteMode === "command" ? commandEntries : [...routeEntries, ...findingEntries];
  }

  function wirePalette(P){
    const input = $("#palette-input");
    const results = $("#palette-results");
    if (!input) return;
    input.focus();
    let active = 0;
    const entries = paletteEntries(P);
    function draw(q){
      const needle = q.trim().toLowerCase();
      const matches = entries.filter(e => e.label.toLowerCase().includes(needle) || e.hint.toLowerCase().includes(needle));
      active = 0;
      results.innerHTML = matches.length ? matches.map((m,i)=> `
        <button data-i="${i}" class="palette-item w-full flex items-center justify-between rounded-lg px-3 py-2 text-left text-sm" style="${i===0?'background:var(--paper-2)':''}">
          <span class="font-mono-ui">${esc(m.label)}</span>
          <span class="text-xs" style="color:var(--ink-2)">${esc(m.hint)}</span>
        </button>`).join("") : `<div class="px-3 py-4 text-sm" style="color:var(--ink-2)">No matches.</div>`;
      $$(".palette-item", results).forEach(btn => btn.addEventListener("click", () => { matches[+btn.dataset.i].run(); closePalette(); }));
      input._matches = matches;
    }
    draw(K.paletteMode === "command" ? "" : "");
    input.addEventListener("input", () => draw(input.value));
    input.addEventListener("keydown", (e) => {
      const matches = input._matches || [];
      if (e.key === "ArrowDown"){ e.preventDefault(); active = Math.min(active+1, matches.length-1); highlight(); }
      else if (e.key === "ArrowUp"){ e.preventDefault(); active = Math.max(active-1, 0); highlight(); }
      else if (e.key === "Enter"){ e.preventDefault(); if (matches[active]){ matches[active].run(); closePalette(); } }
      else if (e.key === "Escape"){ closePalette(); }
    });
    function highlight(){ $$(".palette-item", results).forEach((b,i)=> b.style.background = i===active ? "var(--paper-2)" : ""); }
  }

  function openPalette(mode){ K.paletteOpen = true; K.paletteMode = mode; render(); setTimeout(()=> wirePalette(project(loadEvents())), 0); }

  function exportLog(P){
    const blob = new Blob([JSON.stringify(P.events, null, 2)], { type:"application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = "leados-keyboard-log.json"; a.click();
    URL.revokeObjectURL(url);
    toast("Log exported");
  }
  function wipeLog(){
    if (!confirm("Wipe the entire event log and reseed? This cannot be undone.")) return;
    localStorage.removeItem(STORE_KEY);
    seedIfEmpty();
    toast("Log wiped and reseeded");
    render();
  }

  // ============================================================================
  // HELP OVERLAY ("?")
  // ============================================================================
  function renderHelp(){
    const rows = [
      ["Navigation — no modifier, never writes data", [
        ["T / D / S / L / H / A / G", "Jump to Today / Domains / Synthesis / Lab / Health / About / Log"],
        ["J or ↓", "Next item in the active list"],
        ["K or ↑", "Previous item in the active list"],
        ["g g", "Jump to first item (press g twice)"],
        ["Shift+G", "Jump to last item"],
        ["1–5", "Jump to Five Thing #N (Synthesis view)"],
        ["Enter", "Expand / open the highlighted item"],
        ["/", "Open Command Palette in search mode"],
        [":", "Open Command Palette in command mode"],
        ["?", "Toggle this help overlay"],
        ["Esc", "Close palette / help / collapse expanded item"],
      ]],
      ["Actions — require ⌘/Ctrl, because they append to the event log", [
        ["⌘ / Ctrl + K", "Open Command Palette (muscle-memory alias of /)"],
        ["⌘ / Ctrl + Enter", "Submit the focused Lab form, or generate/regenerate Synthesis"],
        ["⌘ / Ctrl + S", "Snooze the highlighted finding"],
        ["⌘ / Ctrl + Shift + S", "Restore (un-snooze) the highlighted finding"],
        ["⌘ / Ctrl + E", "Export the event log as JSON (Log view)"],
        ["⌘ / Ctrl + Backspace", "Wipe the event log, with confirmation (Log view)"],
      ]],
    ];
    return `
    <div id="help-overlay" class="fixed inset-0 z-[70] flex items-center justify-center" style="background:rgba(20,18,13,0.5)">
      <div class="w-full max-w-xl max-h-[80vh] overflow-y-auto rounded-xl border shadow-2xl p-6" style="border-color:var(--line); background:var(--card)">
        <div class="flex items-center justify-between mb-4">
          <h2 class="font-serif-display text-lg">Keyboard map</h2>
          <kbd class="k">esc</kbd>
        </div>
        ${rows.map(([title, items]) => `
          <div class="mb-5">
            <div class="text-[11px] uppercase tracking-wide mb-2" style="color:var(--ink-2)">${esc(title)}</div>
            <div class="space-y-1.5">
              ${items.map(([k,v]) => `
                <div class="flex items-center justify-between text-sm">
                  <span class="flex gap-1 flex-wrap">${k.split(" ").map(part => part==='or'||part==='+'||part==='/' ? `<span style="color:var(--ink-2)">${part}</span>` : `<kbd class="k">${esc(part)}</kbd>`).join(" ")}</span>
                  <span style="color:var(--ink-1)">${esc(v)}</span>
                </div>`).join("")}
            </div>
          </div>`).join("")}
      </div>
    </div>`;
  }

  // ============================================================================
  // WRITE ACTIONS (all require the ⌘/Ctrl modifier path)
  // ============================================================================
  function snoozeFocused(P, restore){
    const list = activeList(P);
    const item = list[K.focusIndex];
    const key = item && item.finding ? item.finding.key : (item && item.key);
    if (!key) { toast("Nothing selected"); return; }
    append(restore ? "finding.restored" : "finding.snoozed", { key });
    toast(restore ? "Finding restored" : "Finding snoozed");
    render();
  }

  function generateSynthesis(P, today){
    const eventCountAtGeneration = P.events.length;
    const moment = generateOrganizationalMoment(P, today);
    const fiveThings = computeFiveThings(P);
    const hardestQuestion = generateHardestQuestion(P);
    append("synthesis.generated", { generatedAt: today.toISOString(), eventCountAtGeneration, moment, fiveThings, hardestQuestion });
    toast("Synthesis generated");
    render();
  }

  function submitLabForm(form){
    const data = Object.fromEntries(new FormData(form).entries());
    if (form.id === "form-signal") append("signal.logged", { text:data.text });
    if (form.id === "form-decision") append("decision.logged", { text:data.text });
    if (form.id === "form-succession") append("succession.added", { role:data.role, candidate:data.candidate });
    if (form.id === "form-growth") append("growthplan.moved", { person:data.person, level:data.level });
    form.reset();
    toast("Logged");
    render();
  }

  // ============================================================================
  // EVENT WIRING (per-render)
  // ============================================================================
  function wireEvents(P){
    $$("[data-nav]").forEach(el => el.addEventListener("click", () => navigate(el.dataset.nav)));
    const openBtn = $("#open-palette"); if (openBtn) openBtn.addEventListener("click", () => openPalette("search"));
    const genBtn = $("#gen-synthesis"); if (genBtn) genBtn.addEventListener("click", () => generateSynthesis(P, new Date()));
    const expBtn = $("#export-log"); if (expBtn) expBtn.addEventListener("click", () => exportLog(P));
    const wipeBtn = $("#wipe-log"); if (wipeBtn) wipeBtn.addEventListener("click", () => wipeLog());
    $$("form").forEach(f => f.addEventListener("submit", (e) => { e.preventDefault(); submitLabForm(f); }));
    if (K.paletteOpen) wirePalette(P);
    const overlay = $("#palette-overlay"); if (overlay) overlay.addEventListener("click", (e) => { if (e.target === overlay) closePalette(); });
    const help = $("#help-overlay"); if (help) help.addEventListener("click", (e) => { if (e.target === help) { K.helpOpen=false; render(); } });
  }

  // ============================================================================
  // GLOBAL KEYDOWN — THE COMPLETE KEYBOARD EXPERIENCE
  // ============================================================================
  document.addEventListener("keydown", (e) => {
    const typing = isTypingTarget(e.target);
    const mod = e.metaKey || e.ctrlKey;

    // Esc always wins, even while typing inside the palette input
    if (e.key === "Escape") {
      if (K.paletteOpen) { closePalette(); return; }
      if (K.helpOpen) { K.helpOpen = false; render(); return; }
      if (K.expanded) { K.expanded = null; render(); return; }
      return;
    }

    // ⌘/Ctrl+Enter — submit whichever Lab form (or Synthesis generate) has focus
    if (mod && e.key === "Enter") {
      e.preventDefault();
      const form = e.target.closest ? e.target.closest("form") : null;
      if (form) { submitLabForm(form); return; }
      if (K.route === "synthesis") { generateSynthesis(project(loadEvents()), new Date()); return; }
      return;
    }

    // ⌘/Ctrl+K — open palette (conventional alias; kept modifier-gated per spec naming)
    if (mod && (e.key === "k" || e.key === "K")) { e.preventDefault(); openPalette("search"); return; }
    // ⌘/Ctrl+E — export log
    if (mod && (e.key === "e" || e.key === "E")) { e.preventDefault(); exportLog(project(loadEvents())); return; }
    // ⌘/Ctrl+Backspace — wipe log
    if (mod && e.key === "Backspace") { e.preventDefault(); wipeLog(); return; }
    // ⌘/Ctrl+Shift+S — restore
    if (mod && e.shiftKey && (e.key === "s" || e.key === "S")) { e.preventDefault(); snoozeFocused(project(loadEvents()), true); return; }
    // ⌘/Ctrl+S — snooze
    if (mod && !e.shiftKey && (e.key === "s" || e.key === "S")) { e.preventDefault(); snoozeFocused(project(loadEvents()), false); return; }

    if (typing) return; // everything below is navigation-only and must not hijack typing

    if (e.key === "/") { e.preventDefault(); openPalette("search"); return; }
    if (e.key === ":") { e.preventDefault(); openPalette("command"); return; }
    if (e.key === "?") { e.preventDefault(); K.helpOpen = !K.helpOpen; render(); return; }

    // Mnemonics
    const mnemonic = { t:"today", d:"domains", s:"synthesis", l:"lab", h:"health", a:"about", g:"log" };
    const lower = e.key.toLowerCase();
    if (!mod && mnemonic[lower] && lower !== "g") { navigate(mnemonic[lower]); return; }

    const P = project(loadEvents());
    const list = activeList(P);

    // gg (double-tap) → first ; also serves Log's mnemonic as a single press is ambiguous with gg,
    // so a single "g" navigates to #/log immediately, and a second "g" within 400ms jumps to top instead.
    if (lower === "g" && !e.shiftKey) {
      const now = Date.now();
      if (now - K.lastGPress < 400) { K.focusIndex = 0; K.lastGPress = 0; render(); return; }
      K.lastGPress = now;
      navigate("log");
      return;
    }
    if (e.key === "G" && e.shiftKey) { clampFocus(list.length); K.focusIndex = Math.max(list.length-1, 0); render(); return; }

    if (lower === "j" || e.key === "ArrowDown") { e.preventDefault(); K.focusIndex++; clampFocus(list.length); render(); return; }
    if (lower === "k" || e.key === "ArrowUp") { e.preventDefault(); K.focusIndex--; clampFocus(list.length); render(); return; }

    if (/^[1-5]$/.test(e.key) && K.route === "synthesis") { K.focusIndex = +e.key - 1; clampFocus(list.length); render(); return; }

    if (e.key === "Enter") { K.expanded = K.expanded ? null : "x"; render(); return; }
  });

  window.addEventListener("hashchange", () => {
    const h = window.location.hash.replace("#/", "");
    if (NAV.some(n => n.route === h)) { K.route = h; K.focusIndex = 0; render(); }
  });

  // ============================================================================
  // INIT
  // ============================================================================
  seedIfEmpty();
  const initialHash = window.location.hash.replace("#/", "");
  K.route = NAV.some(n => n.route === initialHash) ? initialHash : "today";
  render();
</script>
</body>
</html>
