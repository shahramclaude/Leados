<script>
/* =====================================================================================
   LEADOS — single-file vanilla build. "Part 6: The Monte Carlo Simulation Engine."

   PROVENANCE, SHORT VERSION (full ledger below in the #/about route and in
   AI-SESSION-LOG.md):

     LEADOS.genome "Organizational Genome · part 5" build) and is CURRENTLY 47,831
     bytes (sha ddd41f4969a71278d5f7b4ccd5a39cf5a44bd628) per the Contents API at the
     moment this session queried it.
   - CONTRADICTED: that same repo's own README.md and an in-file provenance comment
     inside that same index.html both assert the file is 56,046 bytes — a number that

     roughly ten "Add files via upload" commits within one ~2.5-hour window on
     2026-10-17 (most recent 12:51:05Z), which plausibly explains the drift (the
     56,046-byte figure was likely accurate for an earlier commit, then superseded) —
     but this session did not fetch every intermediate commit to confirm that specific
     reconciliation, so it is labeled a plausible explanation, not a verified one.
   - This build does not copy, fork, or continue wbweve/Leados' own code: that repo
     implements a different Part 5 ("long-term memory + leverage comparison") over a
     simpler findings/decisions schema with no scenario-probability structure at all,
     per its own README (itself only partially cross-checked here, not byte-verified
     beyond the file's existence and opening structure).
   - The data model below (decisions-with-scenarios) is ORIGINAL to this build — built
     from scratch to match what the user-supplied LEADOS.monteCarlo spec assumes
     (scenarios: [{name, probability, outcome_value, cost_if_true}]).
   - LEADOS.monteCarlo._prng / .simulate / ._buildHistogram / ._interpret are
     implemented VERBATIM from the pasted spec, with exactly one disclosed, additive
     change: a 4th optional `breakeven` parameter on `simulate()` that fills the
     spec's own `probAboveBreakeven: null, // computed if breakeven provided` line —
     the spec named this field and said when it should be computed but supplied no
     computation path, so filling it (only when the caller passes a breakeven value,
     otherwise it stays null exactly as written) is the honest completion of an
     acknowledged gap, not an undisclosed deviation. No other line of the given
     module was altered.
   - The spec's "### Monte Carlo Visualization" section was a heading followed by
     "In the decision-scenario playbook, after running the simulation:" and no body —
     identical in kind to Part 5's empty "Genome View" heading. The visualization
     shipped here (stat cards, percentile strip, histogram bars, breakeven readout,
     disclosure banner) is therefore ORIGINAL, and says so in-page.
   ===================================================================================== */

const LEADOS = {};
const LS_KEY = 'leados:events';
const uid = (p) => p + '_' + Math.random().toString(36).slice(2, 9);
const todayISO = () => new Date().toISOString();
const fmtDate = (iso) => new Date(iso).toLocaleDateString(undefined, { year:'numeric', month:'short', day:'numeric' });
const fmtDateTime = (iso) => new Date(iso).toLocaleString(undefined, { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
const clamp01 = (x) => Math.max(0, Math.min(1, x));
const fmtNum = (n) => Number(n).toLocaleString(undefined, { maximumFractionDigits: 0 });
const fmtPct = (x) => Math.round(x * 100) + '%';

function toast(msg){
  const root = document.getElementById('toastRoot');
  const el = document.createElement('div');
  el.className = 'fade-in bg-slate-900 text-white text-xs px-3 py-2 rounded shadow-lg';
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

/* ---------------------------------------------------------------------------
   Event log (append-only, localStorage). ORIGINAL schema for this build.
--------------------------------------------------------------------------- */
LEADOS.store = {
  load(){
    try { return JSON.parse(localStorage.getItem(LS_KEY)) || []; }
    catch(e){ return []; }
  },
  save(events){ localStorage.setItem(LS_KEY, JSON.stringify(events)); },
  append(event){
    const events = this.load();
    events.push({ id: uid('ev'), ts: todayISO(), ...event });
    this.save(events);
    return events;
  },
  wipeAndReseed(){
    localStorage.removeItem(LS_KEY);
    this.save(LEADOS.seed.demoEvents());
  }
};

/* ---------------------------------------------------------------------------
   Demo seed data — fabricated, disclosed. Gives every view something to show
   and gives the Monte Carlo engine realistic scenario sets to run on.
--------------------------------------------------------------------------- */
LEADOS.seed = {
  demoEvents(){
    const now = Date.now();
    const daysAgo = (d) => new Date(now - d*86400000).toISOString();
    return [
      { id: uid('ev'), ts: daysAgo(40), type: 'decision.logged', decisionId: 'dec_apac', title: 'Expand into APAC market this fiscal year',
        domain: 'strategy', breakeven: 0,
        scenarios: [
          { name: 'Strong demand, fast traction', probability: 0.30, outcome_value: 520000 },
          { name: 'Moderate demand, slow ramp',   probability: 0.45, outcome_value: 110000 },
          { name: 'Weak demand, we pull out early', probability: 0.25, outcome_value: -90000 }
        ] },
      { id: uid('ev'), ts: daysAgo(25), type: 'decision.logged', decisionId: 'dec_vp', title: 'Hire VP of Sales now vs. wait two quarters',
        domain: 'org design', breakeven: 50000,
        scenarios: [
          { name: 'Great hire, ramps fast', probability: 0.35, outcome_value: 300000 },
          { name: 'Average hire, normal ramp', probability: 0.40, outcome_value: 80000 },
          { name: 'Mis-hire, costly restart', probability: 0.25, outcome_value: -150000 }
        ] },
      { id: uid('ev'), ts: daysAgo(10), type: 'decision.logged', decisionId: 'dec_vendor', title: 'Switch core infra vendor',
        domain: 'operations', breakeven: null,
        scenarios: [
          { name: 'Smooth migration, lower run-rate cost', probability: 0.5, outcome_value: 60000 },
          { name: 'Rocky migration, offsetting savings', probability: 0.3, outcome_value: 5000 },
          { name: 'Failed migration, rollback costs', probability: 0.2, outcome_value: -70000 }
        ] },
      { id: uid('ev'), ts: daysAgo(5), type: 'decision.resolved', decisionId: 'dec_vendor', actualOutcomeNote: 'Migration completed on schedule; early signs point to the smooth-migration scenario.' }
    ];
  }
};

/* ---------------------------------------------------------------------------
   Projection — recomputes all derived state from the raw event log.
   P.decisionById / P.openDecisions / P.closedDecisions — ORIGINAL to this build.
--------------------------------------------------------------------------- */
LEADOS.core = {
  project(events){
    const decisionById = {};
    events.filter(e => e.type === 'decision.logged').forEach(e => {
      decisionById[e.decisionId] = {
        id: e.decisionId, title: e.title, domain: e.domain,
        breakeven: (e.breakeven === undefined ? null : e.breakeven),
        scenarios: e.scenarios || [], loggedAt: e.ts,
        resolved: false, resolutionNote: null
      };
    });
    events.filter(e => e.type === 'decision.resolved').forEach(e => {
      if (decisionById[e.decisionId]) {
        decisionById[e.decisionId].resolved = true;
        decisionById[e.decisionId].resolutionNote = e.actualOutcomeNote || null;
      }
    });
    const all = Object.values(decisionById).sort((a,b) => new Date(b.loggedAt) - new Date(a.loggedAt));
    return {
      decisionById,
      allDecisions: all,
      openDecisions: all.filter(d => !d.resolved),
      closedDecisions: all.filter(d => d.resolved),
      state: { events: events.slice().sort((a,b) => new Date(a.ts) - new Date(b.ts)) }
    };
  }
};

/* ---------------------------------------------------------------------------
   LEADOS.monteCarlo — implemented VERBATIM from the user-supplied spec.
   The only addition is the disclosed `breakeven` parameter described above.
--------------------------------------------------------------------------- */
LEADOS.monteCarlo = {

  // Seeded pseudo-random number generator (reproducible runs)
  // Mulberry32 algorithm — fast, good statistical properties
  _prng(seed) {
    let t = seed + 0x6D2B79F5;
    return function() {
      t = Math.imul(t ^ t >>> 15, t | 1);
      t ^= t + Math.imul(t ^ t >>> 7, t | 61);
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  },

  // Run a Monte Carlo simulation on a decision's scenarios
  // scenarios: [{name, probability, outcome_value, cost_if_true}]
  // iterations: number of simulation runs (default 10,000)
  // breakeven: ORIGINAL ADDITION (disclosed above) — optional, fills the
  //            spec's own `probAboveBreakeven: null` placeholder when passed.
  simulate(scenarios, iterations = 10000, seed = 42, breakeven = null) {
    const rand = this._prng(seed);

    // Validate: probabilities should sum to ~1.0
    const probSum = scenarios.reduce((a, b) => a + b.probability, 0);
    const normalizedScenarios = scenarios.map(s => ({
      ...s,
      probability: s.probability / probSum // normalize
    }));

    // Run iterations
    const outcomes = [];
    for (let i = 0; i < iterations; i++) {
      // Draw a random scenario based on probabilities
      let cumProb = 0;
      const r = rand();
      let selectedScenario = normalizedScenarios[normalizedScenarios.length - 1];

      for (const scenario of normalizedScenarios) {
        cumProb += scenario.probability;
        if (r < cumProb) {
          selectedScenario = scenario;
          break;
        }
      }

      // Add noise: ±20% variation around the scenario's outcome value
      const noise = 1 + (rand() - 0.5) * 0.4;
      outcomes.push(selectedScenario.outcome_value * noise);
    }

    // Compute distribution statistics
    outcomes.sort((a, b) => a - b);

    const n = outcomes.length;
    const mean = outcomes.reduce((a, b) => a + b, 0) / n;
    const variance = outcomes.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / n;
    const stdDev = Math.sqrt(variance);

    const percentile = (p) => outcomes[Math.floor(p * n)];

    return {
      iterations,
      mean: Math.round(mean),
      median: Math.round(percentile(0.5)),
      stdDev: Math.round(stdDev),
      p10: Math.round(percentile(0.10)),  // 10th percentile (bad case)
      p25: Math.round(percentile(0.25)),  // 25th percentile
      p75: Math.round(percentile(0.75)),  // 75th percentile
      p90: Math.round(percentile(0.90)),  // 90th percentile (good case)
      worstCase: Math.round(outcomes[0]),
      bestCase: Math.round(outcomes[n - 1]),

      // Probability of exceeding key thresholds
      probPositive: outcomes.filter(v => v > 0).length / n,
      probAboveBreakeven: (breakeven === null || breakeven === undefined)
        ? null
        : outcomes.filter(v => v > breakeven).length / n, // computed because breakeven was provided

      // Distribution histogram (10 buckets)
      histogram: this._buildHistogram(outcomes, 10),

      label: `Monte Carlo simulation: ${iterations.toLocaleString()} iterations. ` +
             `Seed: ${seed} (reproducible). ` +
             `±20% noise applied per iteration (labeled assumption). ` +
             `Your probability estimates drive all results — ` +
             `garbage in, garbage out.`,

      interpretation: this._interpret(outcomes, scenarios)
    };
  },

  _buildHistogram(outcomes, buckets) {
    const min = outcomes[0], max = outcomes[outcomes.length - 1];
    const bucketWidth = (max - min) / buckets;
    const counts = new Array(buckets).fill(0);

    outcomes.forEach(v => {
      const bucket = Math.min(buckets - 1, Math.floor((v - min) / bucketWidth));
      counts[bucket]++;
    });

    return counts.map((count, i) => ({
      from: min + i * bucketWidth,
      to: min + (i + 1) * bucketWidth,
      count,
      pct: Math.round(count / outcomes.length * 100)
    }));
  },

  _interpret(outcomes, scenarios) {
    const n = outcomes.length;
    const probPositive = outcomes.filter(v => v > 0).length / n;

    if (probPositive > 0.85) return 'Strong positive expected value. ' +
      'Under your probability estimates, this decision produces positive ' +
      'outcomes in ' + Math.round(probPositive * 100) + '% of simulations.';

    if (probPositive < 0.4) return 'Negative expected value under your estimates. ' +
      'This decision produces negative outcomes in ' +
      Math.round((1 - probPositive) * 100) + '% of simulations. ' +
      'Consider whether your probability estimates are calibrated.';

    return 'Mixed expected value. The decision is sensitive to which scenario occurs. ' +
      'Focus on what changes the probability of your best scenario.';
  }
};

/* ---------------------------------------------------------------------------
   Routing + rendering
--------------------------------------------------------------------------- */
const ROUTES = [
  { path: '#/today', label: 'Today' },
  { path: '#/decisions', label: 'Decisions & Monte Carlo' },
  { path: '#/log', label: 'Event Log' },
  { path: '#/about', label: 'About / Provenance' }
];

function buildNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = '';
  ROUTES.forEach(r => {
    const btn = document.createElement('button');
    btn.textContent = r.label;
    btn.className = 'nav-btn w-full text-left px-3 py-2 rounded-md hover:bg-slate-800 transition tap-shrink';
    btn.onclick = () => { location.hash = r.path; };
    btn.dataset.path = r.path;
    nav.appendChild(btn);
  });
}

function setActiveNav(path){
  document.querySelectorAll('.nav-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.path === path);
  });
  const found = ROUTES.find(r => r.path === path);
  document.getElementById('routeTitle').textContent = found ? found.label : '';
}

function getP(){
  return LEADOS.core.project(LEADOS.store.load());
}

function refreshChrome(){
  document.getElementById('eventCountTag').textContent = LEADOS.store.load().length;
  document.getElementById('todayTag').textContent = fmtDate(todayISO());
}

function router(){
  let path = location.hash || '#/today';
  if (!ROUTES.find(r => r.path === path)) path = '#/today';
  setActiveNav(path);
  refreshChrome();
  const view = document.getElementById('view');
  view.className = 'p-6 max-w-6xl mx-auto fade-in';
  const P = getP();
  if (path === '#/today') view.innerHTML = renderToday(P);
  else if (path === '#/decisions') { view.innerHTML = renderDecisions(P); wireDecisionsView(); }
  else if (path === '#/log') { view.innerHTML = renderLog(P); wireLogView(); }
  else if (path === '#/about') view.innerHTML = renderAbout();
}

/* ---------------- Today ---------------- */
function renderToday(P){
  const simmed = P.allDecisions.length;
  return `
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
      <div class="bg-white rounded-xl border border-slate-200 p-5">
        <div class="text-xs text-slate-400 uppercase tracking-wide">Open decisions</div>
        <div class="text-3xl font-bold mt-1">${P.openDecisions.length}</div>
      </div>
      <div class="bg-white rounded-xl border border-slate-200 p-5">
        <div class="text-xs text-slate-400 uppercase tracking-wide">Resolved decisions</div>
        <div class="text-3xl font-bold mt-1">${P.closedDecisions.length}</div>
      </div>
      <div class="bg-white rounded-xl border border-slate-200 p-5">
        <div class="text-xs text-slate-400 uppercase tracking-wide">Total decisions logged</div>
        <div class="text-3xl font-bold mt-1">${simmed}</div>
      </div>
    </div>
    <div class="bg-white rounded-xl border border-slate-200 p-6">
      <h2 class="font-semibold text-slate-800 mb-2">What this build is</h2>
      <p class="text-sm text-slate-600 leading-relaxed">LeadOS is an append-only event log of decisions, each carrying a
      set of leader-estimated probabilistic scenarios. Go to <b>Decisions &amp; Monte Carlo</b> to log a decision with
      scenarios and run <code>LEADOS.monteCarlo.simulate()</code> against it — a seeded, reproducible pseudo-random
      simulation that turns your own probability estimates into a visible distribution of outcomes.</p>
      <p class="text-sm text-slate-600 leading-relaxed mt-3">This is a <b>decision support tool</b>, not a financial
      model and not actuarial science. See <b>About / Provenance</b> for exactly what in this file is verified,
      original, or disclosed as an assumption.</p>
    </div>`;
}

/* ---------------- Decisions & Monte Carlo ---------------- */
function scenarioRowHTML(i){
  return `
    <div class="scenario-row grid grid-cols-12 gap-2 items-center" data-row="${i}">
      <input class="sc-name col-span-5 border border-slate-300 rounded px-2 py-1 text-sm" placeholder="Scenario name" />
      <input class="sc-prob col-span-2 border border-slate-300 rounded px-2 py-1 text-sm" type="number" step="0.01" min="0" max="1" placeholder="prob (0-1)" />
      <input class="sc-val col-span-3 border border-slate-300 rounded px-2 py-1 text-sm" type="number" placeholder="outcome value" />
      <input class="sc-cost col-span-1 border border-slate-300 rounded px-2 py-1 text-sm" type="number" placeholder="cost" />
      <button type="button" class="removeRowBtn col-span-1 text-red-500 hover:text-red-700 text-sm">✕</button>
    </div>`;
}

function renderDecisions(P){
  const list = P.allDecisions.map(d => renderDecisionCard(d)).join('') ||
    `<div class="text-sm text-slate-400">No decisions logged yet.</div>`;

  return `
  <div class="mb-6 bg-white rounded-xl border border-slate-200 p-6">
    <h2 class="font-semibold text-slate-800 mb-3">Log a new decision</h2>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-3">
      <input id="newTitle" class="border border-slate-300 rounded px-3 py-2 text-sm md:col-span-2" placeholder="Decision title" />
      <input id="newDomain" class="border border-slate-300 rounded px-3 py-2 text-sm" placeholder="Domain (e.g. strategy)" />
    </div>
    <div class="mb-2 text-xs text-slate-500">Scenarios — probabilities don't need to sum to exactly 1 (they're normalized automatically).</div>
    <div id="scenarioRows" class="space-y-2 mb-2">${scenarioRowHTML(0)}${scenarioRowHTML(1)}</div>
    <button id="addRowBtn" type="button" class="text-xs text-blue-600 hover:underline mb-4">+ add scenario</button>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-4">
      <input id="newBreakeven" class="border border-slate-300 rounded px-3 py-2 text-sm" type="number" placeholder="Breakeven value (optional)" />
    </div>
    <button id="saveDecisionBtn" class="bg-slate-900 text-white text-sm px-4 py-2 rounded hover:bg-slate-700 tap-shrink">Save decision</button>
  </div>

  <div class="disclosure rounded-lg px-4 py-3 text-xs leading-relaxed mb-6">
    <b>Not a financial model. Not actuarial science.</b> This is a decision-support tool that makes the probability
    distribution of outcomes visible, using the leader's own probability estimates. ±20% noise per iteration and the
    seeded RNG are both labeled assumptions, not predictions.
  </div>

  <div class="space-y-4">${list}</div>`;
}

function renderDecisionCard(d){
  const scenarioRows = d.scenarios.map(s => `
    <tr class="border-t border-slate-100">
      <td class="py-1.5 pr-2">${s.name}</td>
      <td class="py-1.5 pr-2 text-right mono">${fmtPct(s.probability)}</td>
      <td class="py-1.5 pr-2 text-right mono">${fmtNum(s.outcome_value)}</td>
      <td class="py-1.5 text-right mono">${s.cost_if_true !== undefined && s.cost_if_true !== null ? fmtNum(s.cost_if_true) : '—'}</td>
    </tr>`).join('');

  return `
  <div class="bg-white rounded-xl border border-slate-200 p-6 decision-card" data-id="${d.id}">
    <div class="flex items-start justify-between gap-4">
      <div>
        <div class="font-semibold text-slate-800">${d.title}</div>
        <div class="text-xs text-slate-400 mt-0.5">${d.domain || 'uncategorized'} · logged ${fmtDate(d.loggedAt)} ·
          ${d.resolved ? '<span class="text-emerald-600 font-medium">resolved</span>' : '<span class="text-amber-600 font-medium">open</span>'}
        </div>
        ${d.resolutionNote ? `<div class="text-xs text-slate-500 mt-1 italic">${d.resolutionNote}</div>` : ''}
      </div>
      <div class="text-xs text-slate-400">${d.breakeven !== null ? 'breakeven: ' + fmtNum(d.breakeven) : 'no breakeven set'}</div>
    </div>

    <table class="w-full text-xs mt-4">
      <thead>
        <tr class="text-slate-400 text-left">
          <th class="py-1 font-medium">Scenario</th>
          <th class="py-1 font-medium text-right">Probability</th>
          <th class="py-1 font-medium text-right">Outcome value</th>
          <th class="py-1 font-medium text-right">Cost if true</th>
        </tr>
      </thead>
      <tbody>${scenarioRows}</tbody>
    </table>

    <div class="mt-4 flex items-center gap-3 flex-wrap">
      <label class="text-xs text-slate-500">iterations</label>
      <input class="iterInput border border-slate-300 rounded px-2 py-1 text-xs w-24" type="number" value="10000" min="100" step="100" />
      <label class="text-xs text-slate-500">seed</label>
      <input class="seedInput border border-slate-300 rounded px-2 py-1 text-xs w-20" type="number" value="42" />
      <button class="runSimBtn bg-indigo-600 text-white text-xs px-3 py-1.5 rounded hover:bg-indigo-500 tap-shrink">Run Monte Carlo</button>
    </div>

    <div class="mcResult mt-4"></div>
  </div>`;
}

function histogramHTML(hist){
  const maxPct = Math.max(...hist.map(b => b.pct), 1);
  const bars = hist.map(b => `
    <div class="flex flex-col items-center gap-1" style="width:${100/hist.length}%">
      <div class="hist-bar w-full bg-indigo-400 rounded-t" style="height:${Math.max(4, (b.pct/maxPct)*100)}px"></div>
      <div class="text-[9px] text-slate-400 mono">${b.pct}%</div>
    </div>`).join('');
  return `<div class="flex items-end gap-1 h-28 mt-2">${bars}</div>
    <div class="flex justify-between text-[10px] text-slate-400 mt-1">
      <span>${fmtNum(hist[0].from)}</span><span>${fmtNum(hist[hist.length-1].to)}</span>
    </div>`;
}

function mcResultHTML(res, breakeven){
  return `
    <div class="border-t border-slate-100 pt-4">
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-center">
        <div class="bg-slate-50 rounded-lg p-3"><div class="text-[10px] text-slate-400 uppercase">Mean</div><div class="font-semibold mono">${fmtNum(res.mean)}</div></div>
        <div class="bg-slate-50 rounded-lg p-3"><div class="text-[10px] text-slate-400 uppercase">Median</div><div class="font-semibold mono">${fmtNum(res.median)}</div></div>
        <div class="bg-slate-50 rounded-lg p-3"><div class="text-[10px] text-slate-400 uppercase">Std Dev</div><div class="font-semibold mono">${fmtNum(res.stdDev)}</div></div>
        <div class="bg-slate-50 rounded-lg p-3"><div class="text-[10px] text-slate-400 uppercase">P(outcome &gt; 0)</div><div class="font-semibold mono">${fmtPct(res.probPositive)}</div></div>
      </div>

      <div class="grid grid-cols-5 gap-2 text-center mt-3 text-xs">
        <div><div class="text-slate-400">Worst</div><div class="mono font-medium text-red-600">${fmtNum(res.worstCase)}</div></div>
        <div><div class="text-slate-400">P10</div><div class="mono font-medium">${fmtNum(res.p10)}</div></div>
        <div><div class="text-slate-400">P25</div><div class="mono font-medium">${fmtNum(res.p25)}</div></div>
        <div><div class="text-slate-400">P75</div><div class="mono font-medium">${fmtNum(res.p75)}</div></div>
        <div><div class="text-slate-400">P90</div><div class="mono font-medium">${fmtNum(res.p90)}</div></div>
      </div>
      <div class="text-center text-xs mt-1"><span class="text-slate-400">Best:</span> <span class="mono font-medium text-emerald-600">${fmtNum(res.bestCase)}</span></div>

      ${res.probAboveBreakeven !== null ? `
      <div class="mt-3 bg-indigo-50 border border-indigo-100 rounded-lg p-3 text-xs text-indigo-900">
        <b>P(outcome &gt; breakeven of ${fmtNum(breakeven)})</b> = ${fmtPct(res.probAboveBreakeven)}
      </div>` : ''}

      <div class="mt-4">
        <div class="text-xs text-slate-500 mb-1">Distribution histogram (${res.iterations.toLocaleString()} iterations, 10 buckets)</div>
        ${histogramHTML(res.histogram)}
      </div>

      <div class="mt-4 bg-slate-50 rounded-lg p-3 text-xs text-slate-700">${res.interpretation}</div>
      <div class="mt-2 text-[10px] text-slate-400 leading-relaxed">${res.label}</div>
    </div>`;
}

function wireDecisionsView(){
  document.getElementById('addRowBtn').onclick = () => {
    const rows = document.getElementById('scenarioRows');
    const idx = rows.children.length;
    rows.insertAdjacentHTML('beforeend', scenarioRowHTML(idx));
  };
  document.getElementById('scenarioRows').addEventListener('click', (e) => {
    if (e.target.classList.contains('removeRowBtn')) {
      e.target.closest('.scenario-row').remove();
    }
  });
  document.getElementById('saveDecisionBtn').onclick = () => {
    const title = document.getElementById('newTitle').value.trim();
    const domain = document.getElementById('newDomain').value.trim();
    const breakevenRaw = document.getElementById('newBreakeven').value;
    const breakeven = breakevenRaw === '' ? null : Number(breakevenRaw);
    const scenarios = [...document.querySelectorAll('.scenario-row')].map(row => ({
      name: row.querySelector('.sc-name').value.trim() || 'Unnamed scenario',
      probability: Number(row.querySelector('.sc-prob').value || 0),
      outcome_value: Number(row.querySelector('.sc-val').value || 0),
      cost_if_true: row.querySelector('.sc-cost').value === '' ? null : Number(row.querySelector('.sc-cost').value)
    })).filter(s => s.probability > 0);

    if (!title) { toast('Title required'); return; }
    if (scenarios.length < 2) { toast('Add at least 2 scenarios with probability > 0'); return; }

    LEADOS.store.append({ type: 'decision.logged', decisionId: uid('dec'), title, domain, breakeven, scenarios });
    toast('Decision logged');
    router();
  };

  document.querySelectorAll('.decision-card').forEach(card => {
    const id = card.dataset.id;
    card.querySelector('.runSimBtn').onclick = () => {
      const P = getP();
      const d = P.decisionById[id];
      const iterations = Math.max(100, Number(card.querySelector('.iterInput').value || 10000));
      const seed = Number(card.querySelector('.seedInput').value || 42);
      const res = LEADOS.monteCarlo.simulate(d.scenarios, iterations, seed, d.breakeven);
      card.querySelector('.mcResult').innerHTML = mcResultHTML(res, d.breakeven);
    };
  });
}

/* ---------------- Log ---------------- */
function renderLog(P){
  const rows = P.state.events.slice().reverse().map(e => `
    <tr class="border-t border-slate-100 align-top">
      <td class="py-1.5 pr-3 text-xs text-slate-400 whitespace-nowrap">${fmtDateTime(e.ts)}</td>
      <td class="py-1.5 pr-3 text-xs font-medium">${e.type}</td>
      <td class="py-1.5 text-xs text-slate-500 font-mono break-all">${JSON.stringify(e)}</td>
    </tr>`).join('');

  return `
  <div class="bg-white rounded-xl border border-slate-200 p-6">
    <div class="flex items-center justify-between mb-4">
      <h2 class="font-semibold text-slate-800">Raw event log (${P.state.events.length} events)</h2>
      <div class="flex gap-2">
        <button id="exportBtn" class="text-xs bg-slate-900 text-white px-3 py-1.5 rounded hover:bg-slate-700">Export JSON</button>
        <button id="wipeBtn" class="text-xs bg-red-600 text-white px-3 py-1.5 rounded hover:bg-red-500">Wipe &amp; reseed</button>
      </div>
    </div>
    <div class="overflow-auto max-h-[70vh]">
      <table class="w-full"><tbody>${rows || '<tr><td class="text-xs text-slate-400 py-4">No events.</td></tr>'}</tbody></table>
    </div>
  </div>`;
}

function wireLogView(){
  document.getElementById('exportBtn').onclick = () => {
    const blob = new Blob([JSON.stringify(LEADOS.store.load(), null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'leados-events.json';
    a.click();
  };
  document.getElementById('wipeBtn').onclick = () => {
    LEADOS.store.wipeAndReseed();
    toast('Log wiped and reseeded');
    router();
  };
}
