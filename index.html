<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeadOS · mf-4 — Leadership Operating System</title>
<meta name="description" content="Offline-first leadership mentor for newly appointed multi-team leaders. One localStorage key, an event store, a rules engine, and structured playbooks. No network.">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="splash" aria-hidden="true">
  <div class="splash-inner">
    <div class="splash-word">LeadOS</div>
    <div class="splash-sub mono">mf-4 · storage · engine · playbooks · arrival · conflict pairs</div>
  </div>
</div>

<div id="writefail" class="writefail mono" hidden>WRITE FAILED — STORAGE QUOTA · in-memory state intact · export a backup from #/data</div>

<div class="shell">
  <nav id="rail" aria-label="Primary">
    <div class="rail-brand">
      <span class="rail-mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 20V9l8-5 8 5v11" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M9 20v-6h6v6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></span>
      <span class="rail-name">LeadOS<span class="rail-ver mono">mf-4</span></span>
    </div>
    <div class="rail-links" id="rail-links"><!-- rendered by ui.js --></div>
    <div class="rail-foot mono">offline · one key ·<br>no network</div>
  </nav>

  <main id="view" tabindex="-1"><!-- rendered by ui.js --></main>
</div>

<div id="drawer" class="drawer" hidden>
  <div class="drawer-scrim" data-close-drawer></div>
  <div class="drawer-panel" role="dialog" aria-modal="true" aria-label="Playbook">
    <div class="drawer-head">
      <div id="drawer-title" class="drawer-title"></div>
      <button class="iconbtn" data-close-drawer aria-label="Close"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="1.8" fill="none"/></svg></button>
    </div>
    <div id="drawer-body" class="drawer-body"></div>
  </div>
</div>

<script src="js/store.js"></script>
<script src="js/events.js"></script>
<script src="js/engine.js"></script>
<script src="js/playbooks.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
