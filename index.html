<div id="app" class="min-h-screen"></div>
<script>
'use strict';
/* ===========================================================================
   SECTION 0 — CONSTANTS
   DOMAINS, DECAY, CORRELATION_WINDOW_DAYS, DECISION_STALENESS_DAYS below are
   VERIFIED: fetched raw this session from
   raw.githubusercontent.com/wbweve/Leados/main/src/lib/types.ts and
   .../src/lib/core.ts. types.ts literally exports
   DOMAINS=["people","finance","ops","strategy","legal","product"]; core.ts
   literally defines DECAY=0.85, CORRELATION_WINDOW_DAYS=90,
   DECISION_MAX_OPEN_DAYS=21 (renamed DECISION_STALENESS_DAYS here for
   this build's own code, same value). Those two files' own header
   comments disclose that THEY were written by a prior AI session "from
   the pasted brief," not extracted from the real product — so "verified"
   here means "verified that this earlier disclosed-fabrication exists
   with this exact value in the repo," not "verified as the real
   product's logic." See AI-SESSION-LOG.md §0 for the raw quotes.
   =========================================================================== */
var DOMAINS = ['people','finance','ops','strategy','legal','product'];
var DECAY = 0.85;
var CORRELATION_WINDOW_DAYS = 90;
var DECISION_STALENESS_DAYS = 21;
var SCHEMA_VERSION = 1;
var LINEAGE = 'pt-j';
// Distinct key, deliberately. The real repo independently uses at least
// THREE different keys across its own disclosed sessions
// (leados-pt-i:data in the committed root index.html; leados-moment:data
// in src/lib/core.ts; leados-orgphysics-sandbox:data / leados-synthesis:data
// referenced in core.ts's own comments but not independently re-fetched
// by this session). pt-J adds a fourth, isolated key rather than
// guessing which of those is "canonical" or silently merging into one.
var STORAGE_KEY = 'leados-pt-j:data';

/* ===========================================================================
   SECTION 1 — STORE (append-only event log)
   =========================================================================== */
function emptyState(){ return { meta:{ schemaVersion:SCHEMA_VERSION, lineage:LINEAGE, idSeq:0, createdAt:null }, people:[], events:[] }; }
function normalize(st){
  st = (st && typeof st==='object') ? st : {};
  st.meta = (st.meta && typeof st.meta==='object') ? st.meta : {};
  if (typeof st.meta.schemaVersion !== 'number') st.meta.schemaVersion = SCHEMA_VERSION;
  st.meta.lineage = LINEAGE;
  if (typeof st.meta.idSeq !== 'number') st.meta.idSeq = 0;
  st.people = Array.isArray(st.people) ? st.people : [];
  st.events = Array.isArray(st.events) ? st.events : [];
  return st;
}
function load(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return emptyState();
    return normalize(JSON.parse(raw));
  }catch(e){ return emptyState(); }
}
function save(st){ localStorage.setItem(STORAGE_KEY, JSON.stringify(st)); }
function mint(st, prefix){ st.meta.idSeq = (st.meta.idSeq||0) + 1; return prefix + st.meta.idSeq; }

/* ===========================================================================
   SECTION 2 — DATA INVARIANTS + EVENT VALIDATORS (run before append)
   =========================================================================== */
var DATA_INVARIANTS = [
  { name:'meta.schemaVersion is a number', check:function(st){ return typeof st.meta.schemaVersion === 'number'; } },
  { name:'meta.lineage === "pt-j"', check:function(st){ return st.meta.lineage === 'pt-j'; } },
  { name:'people is an array', check:function(st){ return Array.isArray(st.people); } },
  { name:'events is an array', check:function(st){ return Array.isArray(st.events); } },
  { name:'no person reportsTo itself', check:function(st){ return st.people.every(function(p){ return p.reportsTo !== p.id; }); } },
  { name:'event timestamps are parseable', check:function(st){ return st.events.every(function(e){ return !isNaN(new Date(e.ts).getTime()); }); } }
];
function checkInvariants(st){ return DATA_INVARIANTS.filter(function(inv){ return !inv.check(st); }).map(function(inv){ return inv.name; }); }

var EVENT_VALIDATORS = {
  'person.added': function(d){ if(!d.name) return 'name required'; return null; },
  'signal.raised': function(d){
    if (DOMAINS.indexOf(d.domain)===-1) return 'domain must be one of '+DOMAINS.join(', ');
    if (typeof d.severity!=='number' || d.severity<1 || d.severity>5) return 'severity must be 1-5';
    if (!d.title) return 'title required';
    return null;
  },
  'decision.logged': function(d){
    if (!d.title) return 'title required';
    if (typeof d.risk!=='number' || d.risk<0 || d.risk>10) return 'risk must be 0-10';
    if (typeof d.confidence!=='number' || d.confidence<0 || d.confidence>1) return 'confidence must be 0-1';
    return null;
  },
  'decision.outcome': function(d){ if(!d.decisionId) return 'decisionId required'; return null; },
  'commitment.made': function(d){
    if (!d.desc) return 'desc required';
    if (!d.by_date || isNaN(new Date(d.by_date).getTime())) return 'by_date must be a valid date';
    return null;
  },
  'commitment.resolved': function(d){ if(!d.commitmentId) return 'commitmentId required'; return null; },
  'signal.resolved': function(d){ if(!d.signalId) return 'signalId required'; return null; }
};
function validate(type, data){ var v = EVENT_VALIDATORS[type]; return v ? v(data) : null; }
function appendEvent(st, type, data){
  var err = validate(type, data);
  if (err) return { ok:false, error: err };
  var ev = { id: mint(st,'e'), ts: new Date().toISOString(), type: type, data: data };
  st.events.push(ev);
  if (!st.meta.createdAt) st.meta.createdAt = ev.ts;
  save(st);
  return { ok:true, event: ev };
}
function addPerson(st, data){
  var p = { id: mint(st,'p'), name:(data.name||'').trim()||'(unnamed)', role:data.role||'', createdAt:new Date().toISOString() };
  st.people.push(p); save(st); return p;
}

/* ===========================================================================
   SECTION 3 — PROJECTION (recomputed from the raw event log every call;
   nothing derived is cached in the store — append-only discipline)
   =========================================================================== */
function days(aIso,bIso){ return (Date.parse(bIso)-Date.parse(aIso))/86400000; }
function project(events){
  var resolved = {}; events.filter(function(e){return e.type==='signal.resolved';}).forEach(function(e){ resolved[e.data.signalId]=true; });
  var findings = events.filter(function(e){ return e.type==='signal.raised' && !resolved[e.id]; })
    .map(function(e){ return { key:'signal:'+e.id, id:e.id, domain:e.data.domain, sev:e.data.severity, ts:e.ts, title:e.data.title, note:e.data.note||'' }; });

  var decisionById = {}; var decisions = [];
  events.filter(function(e){return e.type==='decision.logged';}).forEach(function(e){
    var d = { id:e.id, title:e.data.title, domain:e.data.domain||'org', ts:e.ts, risk:e.data.risk, confidence:e.data.confidence, reversible:!!e.data.reversible, urgent:!!e.data.urgent, outcome:null };
    decisionById[d.id]=d; decisions.push(d);
  });
  events.filter(function(e){return e.type==='decision.outcome';}).forEach(function(e){
    var d = decisionById[e.data.decisionId]; if (d){ d.outcome = e.data.outcome; }
  });
  var openDecisions = decisions.filter(function(d){ return !d.outcome; });

  var commitmentById = {}; var commitments = [];
  events.filter(function(e){return e.type==='commitment.made';}).forEach(function(e){
    var c = { id:e.id, desc:e.data.desc, by_date:e.data.by_date, ts:e.ts, resolved:false };
    commitmentById[c.id]=c; commitments.push(c);
  });
  events.filter(function(e){return e.type==='commitment.resolved';}).forEach(function(e){
    var c = commitmentById[e.data.commitmentId]; if(c) c.resolved = true;
  });
  var openCommitments = commitments.filter(function(c){ return !c.resolved; });
  var people = [];
  // people captured via the people[] array on state (added separately below in render), not events here

  return { events:events, findings:findings, decisions:decisions, decisionById:decisionById, openDecisions:openDecisions,
           commitments:commitments, openCommitments:openCommitments };
}

/* ===========================================================================
   SECTION 4 — ORG PHYSICS (domain heatmap / velocity / entropy)
   FORMULA SHAPE carried forward from the disclosed-fabricated
   src/lib/physics.ts (verified this session by raw fetch: weight =
   severity * DECAY^ageDays, score = sum of weights clamped to 10). That
   file's own header already discloses it is not the real product's logic.
   =========================================================================== */
function domainMath(domain, P, asOf){
  var asOfIso = asOf.toISOString ? asOf.toISOString() : asOf;
  var rows = P.findings.filter(function(f){ return f.domain===domain; }).map(function(f){
    var age = Math.max(0, days(f.ts, asOfIso));
    var weight = f.sev * Math.pow(DECAY, age);
    return { key:f.key, sev:f.sev, ageDays: Math.round(age*10)/10, weight:weight, title:f.title };
  });
  var raw = rows.reduce(function(a,r){ return a+r.weight; }, 0);
  return { domain:domain, score: Math.min(10, Math.round(raw*10)/10), rows: rows };
}
function heatmap(P, asOf){ var out={}; DOMAINS.forEach(function(d){ out[d]=domainMath(d,P,asOf); }); return out; }
function measureVelocity(domain, P, today, lookback){
  lookback = lookback || 30;
  var now = domainMath(domain, P, today);
  var past = domainMath(domain, P, new Date(today.getTime() - lookback*86400000));
  var perDay = (now.score - past.score)/lookback;
  return { perDay: Math.round(perDay*1000)/1000, projection30d: Math.round((now.score+perDay*30)*10)/10 };
}
function measureOrgEntropy(P){
  var indicators = [];
  var totalDecisions = P.decisions.length;
  if (totalDecisions>0) indicators.push({ name:'Decision entropy', value: P.openDecisions.length/totalDecisions });
  var totalCommits = P.commitments.length;
  if (totalCommits>0){
    var overdue = P.commitments.filter(function(c){ return !c.resolved && days(c.by_date, new Date().toISOString())>0; }).length;
    indicators.push({ name:'Commitment entropy', value: overdue/totalCommits });
  }
  var composite = indicators.length ? indicators.reduce(function(a,b){return a+b.value;},0)/indicators.length : 0;
  return { compositeEntropy: Math.round(composite*100), indicators: indicators,
           interpretation: composite<0.3?'low — org is tracking its own commitments':composite<0.6?'moderate':'high — follow-through is slipping' };
}

/* ===========================================================================
   SECTION 5 — DECISION SURFACE
   FABRICATED quadrant model — not found under any name in the real repo.
   =========================================================================== */
function classifyDecision(d){
  var risk = d.risk||0, rev = !!d.reversible, urg = !!d.urgent;
  if (risk>=7 && !rev && urg) return 'CRISIS_DECIDE';
  if (risk>=7 && !rev && !urg) return 'DELIBERATE';
  if (rev && urg) return 'FAST_CHEAP';
  return 'DELEGATE_OR_DEFER';
}

/* ===========================================================================
   SECTION 6 — SYNTHESIS (generated only on explicit click / Cmd-Enter)
   FABRICATED text generation, disclosed. Persisted as an append-only
   synthesis.generated event; eventCountAtGeneration snapshotted BEFORE
   the append so the staleness badge is correct.
   =========================================================================== */
function generateSynthesisPayload(P, today){
  var findings = P.findings.slice().sort(function(a,b){ return b.sev-a.sev; });
  var top = findings.slice(0,5);
  var entropy = measureOrgEntropy(P);
  var momentText = findings.length===0
    ? 'No open findings. This is either genuine calm or a sign the signal pipeline has gone quiet — check the Log.'
    : 'The sharpest open finding is "'+findings[0].title+'" ('+findings[0].domain+', sev '+findings[0].sev+'). '+
      'Org entropy reads '+entropy.compositeEntropy+'/100 ('+entropy.interpretation+'). '+
      top.length+' finding(s) are feeding this read.';
  var hardQuestion = findings.length
    ? 'If you could only fix one thing this week, would it be "'+findings[0].title+'", or the thing you are avoiding because it has no open finding yet?'
    : 'What would have to be true for you to trust that silence right now actually means "no problems"?';
  return { momentText: momentText, five: top, hardQuestion: hardQuestion };
}

/* ===========================================================================
   SECTION 7 — LEADOS.cssolver
   "The CSS Constraint Satisfaction Layout Engine" — this part's actual
   deliverable (brief PART 1).

   HONESTY LABEL FOR THIS WHOLE SECTION: this is a SIMPLIFIED constraint
   solver, not a general-purpose arc-consistency + backtracking CSP engine
   over an arbitrary constraint graph. It does exactly three things, for
   real, on every solve:
     1. NODE CONSISTENCY — clamps each layout variable into [lo,hi] and
        computes a data-dependent "preferred" value (real arithmetic,
        not a stub).
     2. ONE ARC CONSTRAINT — repairs the single inter-variable constraint
        the brief names explicitly (card height × visible-card-count +
        gap × (count-1) <= available vertical space) via iterative
        projection, not a closed-form solve.
     3. REAL METRIC COMPUTATION — Fitts' Law acquisition time, WCAG
        contrast ratio (actual relative-luminance formula), and CIE
        Lab/LCH perceptual color distance (actual D65 sRGB->XYZ->Lab->LCH
        conversion) are computed from real numbers, not fabricated
        placeholders. Where a constant is an assumption rather than a
        measured/standardized value (e.g. the Fitts a/b regression
        constants, the 200px travel-distance assumption, the "arousal"
        proxy for severity color ordering), it is labeled FABRICATED /
        SIMPLIFIED at the point of use. Where the formula itself is a
        public, standardized spec (WCAG contrast; WCAG 2.5.5 = 44px AAA
        vs WCAG 2.2 2.5.8 = 24px AA target size; CIE Lab/LCH), it is
        labeled VERIFIED (general public specification, re-derived here,
        not re-fetched live from w3.org this session beyond one web
        search used to confirm the 44px/24px split).

   The brief's own constraint-language sample had two issues this build
   silently would NOT paper over without saying so:
     - an unescaped apostrophe inside a single-quoted JS string
       ('readability at arm's length...') — a literal syntax error.
       Fixed; disclosed here rather than reproduced broken.
     - severity-bar widths of [1,2,3,4] px, explicitly justified by a
       "pre-attentive discrimination / 1px JND" reason — four single-digit
       pixel widths are NOT reliably distinguishable at a glance on a
       real screen; that reason does not support that conclusion. This
       build uses [6,9,12,16,20] (5 severities, not 4) with larger steps,
       keeping the brief's intent (width encodes severity, pre-attentively)
       but not its specific numbers.
   =========================================================================== */
var LEADOS = window.LEADOS || {};
LEADOS.cssolver = (function(){

  var CONSTRAINTS = {
    layout: {
      'finding-card.height': {
        min: 64,
        max: function(viewport){ return viewport.height*0.7/3; },
        reason: 'scannability: >=3 cards per vertical saccade (saccade ~= 0.7x viewport height)'
      },
      'primary-button.size': {
        min: 44, // VERIFIED: WCAG 2.5.5 (AAA) target size = 44x44 CSS px; also Apple HIG minimum tap target.
        optimal: function(containerWidth){ return Math.max(44, Math.min(220, containerWidth*0.35)); },
        reason: "Fitts' Law acquisition time target < 300ms at ~200px travel distance"
      },
      'score-math.font-size': {
        min: 11, // 11px @ 96dpi ~= 2.9mm ~= 0.4 degree angular size at 40cm arm's length
        optimal: 13,
        reason: "readability at arm's length (40cm): >=0.4 degree minimum angular size"
      },
      'severity-bar.width': {
        values: [6,9,12,16,20], // FABRICATED adjustment of the brief's [1,2,3,4] — see header note
        reason: 'pre-attentive severity discrimination in <200ms: steps large enough to exceed JND at 96dpi'
      }
    },
    color: {
      'finding-content.contrast': { min: 7.0, wcag: 'AAA' },
      'supplementary.contrast': { min: 4.5, wcag: 'AA' },
      'domain-colors.perceptual-distance': { min: 30, colorspace: 'LCH(CIE76 Euclidean approx.)' },
      'severity-colors.arousal-ordering': { ordering: 'monotonic-ascending', dimension: 'chroma (FABRICATED arousal proxy)' }
    },
    typography: {
      'finding-title.max-chars': { max: 80, reason: 'wrap, never truncate; ~3 fixations @ 250ms' },
      'font-pairing.weight-contrast': { min:1.15, max:1.25, reason: 'mono/serif learnable visual-weight association' }
    }
  };

  // ---- color math: VERIFIED public formulas (WCAG contrast; CIE Lab/LCH, D65) ----
  function hexToRgb(hex){
    hex = hex.replace('#','');
    return { r: parseInt(hex.substr(0,2),16), g: parseInt(hex.substr(2,2),16), b: parseInt(hex.substr(4,2),16) };
  }
  function srgbToLinear(c8){ var c = c8/255; return c<=0.04045 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4); }
  function relLuminance(hex){
    var c = hexToRgb(hex);
    var R=srgbToLinear(c.r), G=srgbToLinear(c.g), B=srgbToLinear(c.b);
    return 0.2126*R + 0.7152*G + 0.0722*B;
  }
  function contrastRatio(hexA, hexB){
    var L1 = relLuminance(hexA), L2 = relLuminance(hexB);
    var lighter = Math.max(L1,L2), darker = Math.min(L1,L2);
    return (lighter+0.05)/(darker+0.05);
  }
  function xyzToLab(X,Y,Z){
    var Xn=0.95047, Yn=1.0, Zn=1.08883;
    function f(t){ return t>0.008856 ? Math.cbrt(t) : (7.787*t + 16/116); }
    var fx=f(X/Xn), fy=f(Y/Yn), fz=f(Z/Zn);
    return { L:116*fy-16, a:500*(fx-fy), b:200*(fy-fz) };
  }
  function hexToLch(hex){
    var c = hexToRgb(hex);
    var r=srgbToLinear(c.r), g=srgbToLinear(c.g), b=srgbToLinear(c.b);
    var X = r*0.4124564+g*0.3575761+b*0.1804375;
    var Y = r*0.2126729+g*0.7151522+b*0.0721750;
    var Z = r*0.0193339+g*0.1191920+b*0.9503041;
    var lab = xyzToLab(X,Y,Z);
    var C = Math.sqrt(lab.a*lab.a+lab.b*lab.b);
    var H = Math.atan2(lab.b, lab.a) * 180/Math.PI; if (H<0) H+=360;
    return { L:lab.L, C:C, H:H };
  }
  function lchDistance(c1,c2){ // CIE76-style Euclidean approx, NOT CIEDE2000 — disclosed simplification
    var a1=c1.C*Math.cos(c1.H*Math.PI/180), b1=c1.C*Math.sin(c1.H*Math.PI/180);
    var a2=c2.C*Math.cos(c2.H*Math.PI/180), b2=c2.C*Math.sin(c2.H*Math.PI/180);
    return Math.sqrt(Math.pow(c1.L-c2.L,2)+Math.pow(a1-a2,2)+Math.pow(b1-b2,2));
  }

  var DOMAIN_COLORS = { people:'#2e5c48', finance:'#8a3324', ops:'#1f5f8b', strategy:'#92661c', legal:'#5b3e8a', product:'#1c7a72' };
  var SEVERITY_COLORS = { 1:'#6b7a6f', 2:'#7a7a4a', 3:'#92661c', 4:'#b5451f', 5:'#c21f1f' };

  // FABRICATED: Fitts' Law regression constants a,b are illustrative, not
  // measured for this interface. The MT = a + b*log2(D/W+1) model itself
  // is a real, standard HCI result (Fitts 1954 / Shannon formulation).
  function fittsMs(width, distance){
    distance = distance || 200;
    var a = 50, b = 100;
    return a + b*Math.log2(distance/Math.max(1,width) + 1);
  }

  function clamp(v,lo,hi){ return Math.max(lo, Math.min(hi, v)); }

  function solve(viewport, data){
    viewport = viewport || { width: window.innerWidth, height: window.innerHeight };
    data = data || {};
    var findingCount = data.findingCount || 0;

    // ---- 1. NODE CONSISTENCY: per-variable domains + preferred values ----
    var railWidth = clamp(viewport.width*0.18, 180, 260);
    var panelWidth = clamp(viewport.width*0.26, 260, 380);
    var columnMax = Math.max(480, Math.min(1200, viewport.width - railWidth - 48));
    var containerWidth = columnMax;

    var cardHeightDomain = { lo: CONSTRAINTS.layout['finding-card.height'].min, hi: CONSTRAINTS.layout['finding-card.height'].max(viewport) };
    var availableListHeight = viewport.height*0.55;
    var desiredVisible = clamp(findingCount||3, 3, 8);
    var cardHeightPreferred = clamp(availableListHeight/desiredVisible - 10, cardHeightDomain.lo, cardHeightDomain.hi);

    var gapDomain = { lo:6, hi:20 };
    var gapPreferred = 10;

    var buttonDomain = { lo: CONSTRAINTS.layout['primary-button.size'].min, hi: 220 };
    var buttonPreferred = CONSTRAINTS.layout['primary-button.size'].optimal(containerWidth);

    var scoreFontDomain = { lo: CONSTRAINTS.layout['score-math.font-size'].min, hi: 16 };
    var scoreFontPreferred = CONSTRAINTS.layout['score-math.font-size'].optimal;

    var cardPaddingDomain = { lo:8, hi:16 };
    var titleFontDomain = { lo:14, hi:18 };
    var bodyFontDomain = { lo:13, hi:15 };
    var labelFontDomain = { lo:10, hi:12 };
    var sectionGapDomain = { lo:16, hi:32 };

    var assignment = {
      cardHeight: cardHeightPreferred,
      gap: gapPreferred,
      buttonSize: clamp(buttonPreferred, buttonDomain.lo, buttonDomain.hi),
      scoreFont: clamp(scoreFontPreferred, scoreFontDomain.lo, scoreFontDomain.hi),
      cardPadding: clamp(12, cardPaddingDomain.lo, cardPaddingDomain.hi),
      titleFont: clamp(15, titleFontDomain.lo, titleFontDomain.hi),
      bodyFont: clamp(13, bodyFontDomain.lo, bodyFontDomain.hi),
      labelFont: clamp(11, labelFontDomain.lo, labelFontDomain.hi),
      sectionGap: clamp(20, sectionGapDomain.lo, sectionGapDomain.hi)
    };

    // ---- 2. ARC CONSISTENCY (ONE real inter-variable constraint, repaired
    //    iteratively — not closed-form, not full backtracking): ----
    //    cardHeight * n + gap * (n-1) <= availableListHeight
    var n = Math.max(1, desiredVisible);
    var iterations = 0;
    while (iterations < 30) {
      var used = assignment.cardHeight*n + assignment.gap*Math.max(0,n-1);
      var violation = used - availableListHeight;
      if (violation <= 0.5) break;
      if (assignment.gap > gapDomain.lo){
        assignment.gap = clamp(assignment.gap - violation/Math.max(1,n-1), gapDomain.lo, gapDomain.hi);
      } else {
        assignment.cardHeight = clamp(assignment.cardHeight - violation/n, cardHeightDomain.lo, cardHeightDomain.hi);
      }
      iterations++;
    }

    // ---- 3. REAL METRIC COMPUTATION ----
    var fittsAcquisitionMs = fittsMs(assignment.buttonSize, 200);
    var cardsPerSaccade = (viewport.height*0.7) / assignment.cardHeight;

    var finContrast = contrastRatio('#16140f', '#f7f5ef'); // ink-0 on paper
    var suppContrast = contrastRatio('#857c6b', '#f7f5ef'); // ink-2 on paper
    var worstContrastRatio = Math.min(finContrast, suppContrast);
    var wcagLevel = finContrast>=7 ? 'AAA' : finContrast>=4.5 ? 'AA' : 'FAIL';

    var domainKeys = Object.keys(DOMAIN_COLORS);
    var lchByDomain = {}; domainKeys.forEach(function(k){ lchByDomain[k]=hexToLch(DOMAIN_COLORS[k]); });
    var minDist = Infinity;
    for (var i=0;i<domainKeys.length;i++){
      for (var j=i+1;j<domainKeys.length;j++){
        var dist = lchDistance(lchByDomain[domainKeys[i]], lchByDomain[domainKeys[j]]);
        if (dist<minDist) minDist = dist;
      }
    }

    var sevChroma = [1,2,3,4,5].map(function(s){ return hexToLch(SEVERITY_COLORS[s]).C; });
    var arousalMonotonic = sevChroma.every(function(c,idx){ return idx===0 || c >= sevChroma[idx-1]-0.001; });

    var monoWeight = 500, serifWeight = 400;
    var weightRatio = monoWeight/serifWeight;

    return {
      viewport: viewport, findingCount: findingCount,
      railWidth: Math.round(railWidth), panelWidth: Math.round(panelWidth), columnMax: Math.round(columnMax),
      cardHeight: Math.round(assignment.cardHeight), cardHeightDomain: cardHeightDomain,
      gap: Math.round(assignment.gap*10)/10, gapDomain: gapDomain,
      buttonSize: Math.round(assignment.buttonSize), buttonDomain: buttonDomain,
      scoreFont: Math.round(assignment.scoreFont*10)/10, scoreFontDomain: scoreFontDomain,
      cardPadding: Math.round(assignment.cardPadding), titleFont: Math.round(assignment.titleFont),
      bodyFont: Math.round(assignment.bodyFont), labelFont: Math.round(assignment.labelFont),
      sectionGap: Math.round(assignment.sectionGap),
      arcRepairIterations: iterations,
      fittsAcquisitionMs: Math.round(fittsAcquisitionMs),
      cardsPerSaccade: Math.round(cardsPerSaccade*10)/10,
      worstContrastRatio: Math.round(worstContrastRatio*100)/100,
      wcagLevel: wcagLevel,
      perceptualDistance: Math.round(minDist*10)/10,
      arousalMonotonic: arousalMonotonic, sevChroma: sevChroma.map(function(c){return Math.round(c*10)/10;}),
      weightRatio: Math.round(weightRatio*100)/100,
      checks: {
        fitts_lt_300ms: fittsAcquisitionMs < 300,
        scannability_ge_3: cardsPerSaccade >= 3,
        contrast_ok: finContrast >= 7.0 && suppContrast >= 4.5,
        perceptual_ge_30: minDist >= 30,
        arousal_monotonic: arousalMonotonic,
        weight_ratio_ok: weightRatio>=1.15 && weightRatio<=1.25
      }
    };
  }

  function generateCSS(s){
    return (
'/* CONSTRAINT SOLVER OUTPUT — generated for current context */\n'+
'/* Viewport: '+s.viewport.width+'x'+s.viewport.height+' | Findings: '+s.findingCount+' */\n'+
'/* Fitts acquisition: '+s.fittsAcquisitionMs+'ms (target <300ms) -> '+(s.checks.fitts_lt_300ms?'PASS':'FAIL')+' */\n'+
'/* Scannability: '+s.cardsPerSaccade+' cards/saccade (target >=3) -> '+(s.checks.scannability_ge_3?'PASS':'FAIL')+' */\n'+
'/* Contrast: '+s.worstContrastRatio+':1, WCAG '+s.wcagLevel+' -> '+(s.checks.contrast_ok?'PASS':'FAIL')+' */\n'+
'/* Domain color perceptual distance (min pairwise, LCH): '+s.perceptualDistance+' (target >=30) -> '+(s.checks.perceptual_ge_30?'PASS':'FAIL')+' */\n'+
'/* Arc-repair iterations used: '+s.arcRepairIterations+' */\n'+
':root{\n'+
'  --card-height-solved: '+s.cardHeight+'px;\n'+
'  --card-gap-solved: '+s.gap+'px;\n'+
'  --card-padding-solved: '+s.cardPadding+'px;\n'+
'  --button-size-solved: '+s.buttonSize+'px;\n'+
'  --score-font-solved: '+s.scoreFont+'px;\n'+
'  --title-font-solved: '+s.titleFont+'px;\n'+
'  --body-font-solved: '+s.bodyFont+'px;\n'+
'  --label-font-solved: '+s.labelFont+'px;\n'+
'  --rail-width-solved: '+s.railWidth+'px;\n'+
'  --panel-width-solved: '+s.panelWidth+'px;\n'+
'  --column-max-solved: '+s.columnMax+'px;\n'+
'  --section-gap-solved: '+s.sectionGap+'px;\n'+
'  --sev-bar-1: 6px; --sev-bar-2: 9px; --sev-bar-3: 12px; --sev-bar-4: 16px; --sev-bar-5: 20px;\n'+
'}\n'
    );
  }

  return { CONSTRAINTS: CONSTRAINTS, solve: solve, generateCSS: generateCSS,
           contrastRatio: contrastRatio, hexToLch: hexToLch, lchDistance: lchDistance, fittsMs: fittsMs,
           DOMAIN_COLORS: DOMAIN_COLORS, SEVERITY_COLORS: SEVERITY_COLORS, lastSolution: null };
})();
window.LEADOS = LEADOS;

function runHealthChecks(st){
  var out = []; function add(id,group,label,fn){ try{ var r=fn(); out.push({id:id,group:group,label:label,pass:!!r.pass,detail:r.detail}); } catch(e){ out.push({id:id,group:group,label:label,pass:false,detail:'threw: '+e.message}); } }
  var P = project(st.events);
  var today = new Date();

  add('T_INVARIANTS','T','clean state has zero invariant violations', function(){
    var v = checkInvariants(st); return { pass: v.length===0, detail: JSON.stringify(v) };
  });
  add('T_VALIDATOR_SIGNAL','T','signal.raised with severity=9 is rejected', function(){
    var err = EVENT_VALIDATORS['signal.raised']({domain:'ops',severity:9,title:'x'});
    return { pass: !!err, detail: String(err) };
  });
  add('T_VALIDATOR_DOMAIN','T','signal.raised with unknown domain is rejected', function(){
    var err = EVENT_VALIDATORS['signal.raised']({domain:'astrology',severity:3,title:'x'});
    return { pass: !!err, detail: String(err) };
  });
  add('T_VELOCITY','T','velocity computed correctly from two-point heatmap', function(){
    var synth = project([
      { id:'s1', ts:new Date(today.getTime()-30*86400000).toISOString(), type:'signal.raised', data:{domain:'ops',severity:1,title:'a'} },
      { id:'s2', ts:today.toISOString(), type:'signal.raised', data:{domain:'ops',severity:4,title:'b'} }
    ]);
    var v = measureVelocity('ops', synth, today, 30);
    var manual = Math.round(((domainMath('ops',synth,today).score - domainMath('ops',synth,new Date(today.getTime()-30*86400000)).score)/30)*1000)/1000;
    return { pass: v.perDay===manual, detail:'perDay='+v.perDay+' expected='+manual };
  });
  add('T_QUADRANT','T','high risk + irreversible + urgent -> CRISIS_DECIDE', function(){
    var q = classifyDecision({risk:9, reversible:false, urgent:true});
    return { pass: q==='CRISIS_DECIDE', detail:'quadrant='+q };
  });

  var sol = LEADOS.cssolver.solve({width:1440,height:900}, {findingCount:6});
  add('T_SOLVER_BOUNDS','T','all solved layout vars fall within their declared domains', function(){
    var ok = sol.cardHeight>=sol.cardHeightDomain.lo-0.01 && sol.cardHeight<=sol.cardHeightDomain.hi+0.01 &&
             sol.buttonSize>=sol.buttonDomain.lo-0.01 && sol.buttonSize<=sol.buttonDomain.hi+0.01 &&
             sol.gap>=sol.gapDomain.lo-0.01 && sol.gap<=sol.gapDomain.hi+0.01;
    return { pass: ok, detail: JSON.stringify({cardHeight:sol.cardHeight, buttonSize:sol.buttonSize, gap:sol.gap}) };
  });
  add('G_FITTS','G','larger button -> lower Fitts acquisition time (monotonic)', function(){
    var a = LEADOS.cssolver.fittsMs(44,200), b = LEADOS.cssolver.fittsMs(120,200);
    return { pass: b<a, detail: 'fitts(44)='+Math.round(a)+'ms fitts(120)='+Math.round(b)+'ms' };
  });
  add('G_CONTRAST','G','ink-0 on paper clears WCAG AAA (7:1)', function(){
    var c = LEADOS.cssolver.contrastRatio('#16140f','#f7f5ef');
    return { pass: c>=7.0, detail: c.toFixed(2)+':1' };
  });
  add('G_LCH_SYMMETRY','G','LCH perceptual distance is symmetric and non-negative', function(){
    var a = LEADOS.cssolver.hexToLch('#2e5c48'), b = LEADOS.cssolver.hexToLch('#8a3324');
    var d1 = LEADOS.cssolver.lchDistance(a,b), d2 = LEADOS.cssolver.lchDistance(b,a);
    return { pass: Math.abs(d1-d2)<0.001 && d1>=0, detail: 'd(a,b)='+d1.toFixed(2)+' d(b,a)='+d2.toFixed(2) };
  });
  add('G_ARC_CONSTRAINT','G','arc repair keeps card list within available vertical space at findingCount=12, small viewport', function(){
    var s = LEADOS.cssolver.solve({width:1024,height:640}, {findingCount:12});
    var n = Math.max(1, Math.min(8, 12));
    var used = s.cardHeight*n + s.gap*(n-1);
    var avail = 640*0.55;
    return { pass: used <= avail+1, detail: 'used='+Math.round(used)+' avail='+Math.round(avail) };
  });
  add('G_AROUSAL','G','severity color chroma is non-decreasing sev1..sev5', function(){
    return { pass: sol.arousalMonotonic, detail: JSON.stringify(sol.sevChroma) };
  });
  add('G_WEIGHT_RATIO','G','mono/serif font-weight ratio within [1.15,1.25]', function(){
    return { pass: sol.weightRatio>=1.15 && sol.weightRatio<=1.25, detail: sol.weightRatio };
  });
  return out;
}

  var alice = addPerson(st, {name:'Alice Chen', role:'VP Ops'});

  raw('signal.raised', {domain:'people', severity:3, title:'Attrition risk on eng team'}, 25);
  raw('signal.raised', {domain:'legal', severity:2, title:'Vendor contract renewal overdue'}, 60);
  raw('signal.raised', {domain:'product', severity:3, title:'Roadmap vs OKRs drift'}, 40);

function debugModeOn(){
  // Brief literally wrote "?>debug layout" — read as the garbled form of
  // a `?debug=layout` query flag. Honoring that literal interpretation,
  // plus a persisted toggle (localStorage) since re-typing a query string
  // by hand every reload is poor UX for something meant to be inspected.
  var qp = location.search.indexOf('debug=layout') !== -1;
  var flag = localStorage.getItem('leados-pt-j:debug') === '1';
  return qp || flag;
}

  return '<div class="p-6" id="content">'+
    '<h2 class="text-lg font-semibold mb-3">Decision Topology (risk &times; reversibility &times; urgency)</h2>'+
    '<div class="card overflow-hidden">'+
    '<table class="w-full finding-body"><thead><tr class="border-b" style="border-color:var(--line)">'+
      ['Decision','Age','Risk','Reversible','Urgent','Quadrant'].map(function(h){ return '<th class="text-left p-2 finding-label uppercase" style="color:var(--ink-2)">'+h+'</th>'; }).join('')+
    '</tr></thead><tbody>'+
    (rows.length ? rows.map(function(d){
      return '<tr class="border-b" style="border-color:var(--line)">'+
        '<td class="p-2">'+esc(d.title)+'</td><td class="p-2">'+d.ageDays+'d</td><td class="p-2">'+(d.risk!=null?d.risk:'&mdash;')+'</td>'+
        '<td class="p-2">'+(d.reversible?'yes':'no')+'</td><td class="p-2">'+(d.urgent?'yes':'no')+'</td><td class="p-2 pill">'+d.quadrant+'</td>'+
      '</tr>';
    }).join('') : '<tr><td class="p-4 finding-body" style="color:var(--ink-2)" colspan="6">No decisions logged.</td></tr>')+
    '</tbody></table></div>'+
    '<div class="finding-label mt-2" style="color:var(--ink-2)">Quadrant rule is this build\'s own construction (FABRICATED): CRISIS_DECIDE = risk&ge;7 &amp; irreversible &amp; urgent.</div>'+
    '<form class="card p-4 mt-4 grid grid-cols-2 gap-3" onsubmit="LeadOS.submitDecision(event)">'+
      '<div><label class="lbl">Title</label><input class="in" name="title" required></div>'+
      '<div><label class="lbl">Domain</label><select class="in" name="domain">'+DOMAINS.map(function(d){return '<option>'+d+'</option>';}).join('')+'</select></div>'+
      '<div><label class="lbl">Risk (0-10)</label><input class="in" type="number" min="0" max="10" name="risk" value="5"></div>'+
      '<div><label class="lbl">Confidence (0-1)</label><input class="in" type="number" step="0.05" min="0" max="1" name="confidence" value="0.5"></div>'+
      '<div><label class="lbl">Reversible</label><input type="checkbox" name="reversible"></div>'+
      '<div><label class="lbl">Urgent</label><input type="checkbox" name="urgent"></div>'+
      '<button class="btn btn-primary col-span-2" type="submit">Log decision</button>'+
    '</form>'+
    '<div id="err_decision" class="text-sm mt-2" style="color:var(--accent)"></div>'+
  '</div>';
}

function renderHealth(st){
  var checks = runHealthChecks(st);
  var tGroup = checks.filter(function(c){return c.group==='T';});
  var gGroup = checks.filter(function(c){return c.group==='G';});
  var violations = checkInvariants(st);
  function list(cs){ return cs.map(function(c){ return '<div class="flex items-center gap-2 py-1 border-b finding-body" style="border-color:var(--line)">'+
    '<span class="'+(c.pass?'badge-ok':'badge-bad')+'">'+(c.pass?'PASS':'FAIL')+'</span>'+
    '<span class="mono finding-label">'+c.id+'</span><span class="flex-1">'+esc(c.label)+'</span>'+
    '<span class="finding-label" style="color:var(--ink-2)">'+esc(c.detail)+'</span></div>'; }).join(''); }
  return '<div class="p-6" id="content">'+
    '<h2 class="text-lg font-semibold mb-2">Invariant check (live store)</h2>'+
    '<div class="card p-3 mb-4">'+(violations.length ? violations.map(function(v){return '<div class="badge-bad">'+esc(v)+'</div>';}).join('') : '<div class="badge-ok">No invariant violations.</div>')+'</div>'+
    '<h2 class="text-lg font-semibold mb-2">T_* unit checks ('+tGroup.filter(function(c){return c.pass;}).length+'/'+tGroup.length+' passing)</h2>'+
    '<div class="card p-3 mb-4">'+list(tGroup)+'</div>'+
    '<h2 class="text-lg font-semibold mb-2">G_* property/golden checks ('+gGroup.filter(function(c){return c.pass;}).length+'/'+gGroup.length+' passing)</h2>'+
    '<div class="card p-3">'+list(gGroup)+'</div>'+
  '</div>';
}

function renderLog(st){
  var evs = st.events.slice().reverse();
  return '<div class="p-6" id="content">'+
    '<div class="flex gap-2 mb-3"><button class="btn" onclick="LeadOS.exportLog()">Export JSON</button><button class="btn" onclick="LeadOS.wipeLog()">Wipe + reseed</button></div>'+
    '<div class="card divide-y" style="border-color:var(--line)">'+
    evs.map(function(e){ return '<div class="p-2 finding-body flex gap-3"><span class="finding-label" style="color:var(--ink-2)">'+fmtDate(e.ts)+'</span><span class="mono finding-label">'+e.type+'</span><span class="flex-1 truncate">'+esc(JSON.stringify(e.data))+'</span></div>'; }).join('')+
    '</div></div>';
}

function renderLayout(sol){
  var css = LEADOS.cssolver.generateCSS(sol);
  function chk(label, pass){ return '<div class="flex justify-between finding-body py-1 border-b" style="border-color:var(--line)"><span>'+label+'</span><span class="'+(pass?'badge-ok':'badge-bad')+'">'+(pass?'PASS':'FAIL')+'</span></div>'; }
  return '<div class="p-6" id="content">'+
    '<h2 class="text-lg font-semibold mb-2">LEADOS.cssolver — live constraint monitor</h2>'+
    '<p class="finding-body mb-4" style="color:var(--ink-2)">Recomputed on load, on window resize, and whenever the findings count changes. Resize the window to watch the numbers move.</p>'+
    '<div class="grid grid-cols-2 gap-4">'+
      '<div class="card p-4"><div class="finding-label uppercase mb-2" style="color:var(--ink-2)">Solved variables</div>'+
        ['cardHeight','gap','buttonSize','scoreFont','railWidth','panelWidth','columnMax','sectionGap'].map(function(k){
          return '<div class="flex justify-between mono finding-label py-0.5"><span>'+k+'</span><span>'+sol[k]+'</span></div>';
        }).join('')+
      '</div>'+
      '<div class="card p-4"><div class="finding-label uppercase mb-2" style="color:var(--ink-2)">Constraint checks</div>'+
        chk('Fitts acquisition &lt; 300ms ('+sol.fittsAcquisitionMs+'ms)', sol.checks.fitts_lt_300ms)+
        chk('Scannability &ge;3 cards/saccade ('+sol.cardsPerSaccade+')', sol.checks.scannability_ge_3)+
        chk('Contrast &ge;7:1 / 4.5:1 ('+sol.worstContrastRatio+':1, '+sol.wcagLevel+')', sol.checks.contrast_ok)+
        chk('Domain color distance &ge;30 LCH ('+sol.perceptualDistance+')', sol.checks.perceptual_ge_30)+
        chk('Severity color arousal monotonic', sol.checks.arousal_monotonic)+
        chk('Mono/serif weight ratio in [1.15,1.25] ('+sol.weightRatio+')', sol.checks.weight_ratio_ok)+
      '</div>'+
    '</div>'+
    '<div class="finding-label mt-3" style="color:var(--ink-2)">Arc-repair iterations used on last solve: '+sol.arcRepairIterations+'</div>'+
    '<div class="mt-4"><div class="finding-label uppercase mb-1" style="color:var(--ink-2)">Generated CSS (this exact output is what is injected into &lt;style id="cssolver-output"&gt;)</div>'+
    '<pre class="card p-3 mono finding-label overflow-auto" style="white-space:pre-wrap;">'+esc(css)+'</pre></div>'+
  '</div>';
}

function renderAbout(){
  return '<div class="p-6 max-w-3xl" id="content">'+
    '<h2 class="text-lg font-semibold mb-2">Verified vs. fabricated vs. simplified — this exact build</h2>'+
    '<p class="finding-body mb-3">This session fetched, directly, from github.com/wbweve/Leados: the repo file tree (REST API), the root <code>index.html</code>, root <code>App.tsx</code>, <code>src/App.tsx</code>, <code>src/lib/types.ts</code>, <code>src/lib/core.ts</code>, <code>src/lib/physics.ts</code>, the root <code>README.md</code>, and <code>package.json</code>. Full quotes are in AI-SESSION-LOG.md &sect;0.</p>'+
    '<h3 class="font-semibold mt-4">Verified this session (re-fetched directly, not trusted from a prior session\'s prose)</h3>'+
    '<ul class="list-disc ml-5 finding-body space-y-1">'+
      '<li>DOMAINS = people/finance/ops/strategy/legal/product &mdash; literal export in <code>src/lib/types.ts</code>.</li>'+
      '<li>DECAY=0.85, CORRELATION_WINDOW_DAYS=90, DECISION_MAX_OPEN_DAYS=21 &mdash; literal constants in <code>src/lib/core.ts</code>.</li>'+
      '<li>The repo has <b>three parallel lineages</b>: ~30 flat <code>.tsx</code> files at repo root, a separate <code>src/App.tsx</code> + <code>src/components</code> + <code>src/lib</code> tree, and the already-committed single-file <code>index.html</code> (vanilla JS, pt-I).</li>'+
      '<li>Root <code>App.tsx</code> route whitelist: exactly <code>["today","intelligence","data","health","about"]</code> (5 routes) &mdash; confirmed by raw fetch.</li>'+
      '<li><code>src/App.tsx</code> route whitelist: <code>["today","domains","synthesis","lab","health","about","log"]</code> (7 routes), and its own header comment already states it added <code>#/synthesis</code> beyond the root app, citing a raw-fetch of the root <code>App.tsx</code> consistent with what this session independently found.</li>'+
      '<li>At least three distinct <code>localStorage</code> keys already exist across sessions: <code>leados-pt-i:data</code> (root <code>index.html</code>), <code>leados-moment:data</code> (<code>src/lib/core.ts</code>), plus two more named only in that file\'s own comments (not independently re-fetched this session).</li>'+
      '<li><code>src/lib/physics.ts</code> really does implement <code>measureOrgEntropy</code>/<code>computeLeadershipEnergyBudget</code>/<code>measureResonance</code>/<code>domainMath</code>/<code>heatmap</code>/<code>measureVelocity</code> &mdash; and its own header discloses these are ported from a still-earlier, also-disclosed fabrication, not the real product\'s logic.</li>'+
    '</ul>'+
    '<h3 class="font-semibold mt-4">Unverified / not independently re-fetched this session</h3>'+
    '<ul class="list-disc ml-5 finding-body space-y-1">'+
      '<li>The exact byte contents of <code>leados-orgphysics-sandbox:data</code> / <code>leados-synthesis:data</code> keys &mdash; only seen referenced inside another file\'s comment, not fetched directly.</li>'+
      '<li>Whether the real product (pre-AI-session, if one exists) has any "org physics" or "synthesis" concept at all &mdash; every file touching that concept, across every lineage, self-discloses as an AI construction "from the pasted brief."</li>'+
    '</ul>'+
    '<h3 class="font-semibold mt-4">Fabricated / simplified in pt-J, disclosed at point of definition</h3>'+
    '<ul class="list-disc ml-5 finding-body space-y-1">'+
      '<li>LEADOS.cssolver is a simplified node-consistency + single-arc-repair solver, not a general CSP backtracking engine (see source comments, Section 7).</li>'+
      '<li>Fitts\' Law regression constants (a=50,b=100) and the 200px travel-distance assumption are illustrative, not measured for this UI. The Fitts model itself, and the WCAG 44px/24px AAA/AA target-size split, and the CIE Lab/LCH formulas, are real public specifications, independently re-derived in code here.</li>'+
      '<li>Severity-color "arousal" is a chroma proxy, not a PAD-model measurement. Domain/severity colors, the Decision Surface quadrant rule, and all synthesis text are this build\'s own construction.</li>'+
    '</ul>'+
    '<p class="finding-label mt-4" style="color:var(--ink-2)">Storage key: <span class="mono">leados-pt-j:data</span> &mdash; distinct from every key found above.</p>'+
  '</div>';
}

function render(){
  var route = routeFromHash();
  var P = project(ST.events);
  var body = '';
  if (route==='today') body = renderToday(P);
  else if (route==='domains') body = renderDomains(P);
  else if (route==='synthesis') body = renderSynthesis(ST, P);
  else if (route==='decision') body = renderDecision(P);
  else if (route==='health') body = renderHealth(ST);
  else if (route==='log') body = renderLog(ST);
  else if (route==='layout') body = renderLayout(LEADOS.cssolver.lastSolution || LEADOS.cssolver.solve());
  else body = renderAbout();
  document.getElementById('app').innerHTML =
    '<div class="flex min-h-screen">' + sidebar(route) +
    '<div class="flex-1 overflow-auto">'+
      '<div class="px-6 pt-4 pb-2 border-b flex items-center justify-between" style="border-color:var(--line)">'+
        '<div class="text-sm font-medium uppercase tracking-wide">'+route+'</div>'+
        '<div class="finding-label" style="color:var(--ink-2)">'+ST.events.length+' events</div>'+
      '</div>'+
      body +
    '</div></div>';
  applySolvedLayout();
}

/* ===========================================================================
   SECTION 11 — SOLVER WIRING (solve on load / resize / data change)
   =========================================================================== */
var resizeTimer = null;
function applySolvedLayout(){
  var P = project(ST.events);
  var viewport = { width: window.innerWidth, height: window.innerHeight };
  var data = { findingCount: P.findings.length };
  var sol = LEADOS.cssolver.solve(viewport, data);
  LEADOS.cssolver.lastSolution = sol;
  var styleEl = document.getElementById('cssolver-output');
  if (!styleEl){ styleEl = document.createElement('style'); styleEl.id = 'cssolver-output'; document.head.appendChild(styleEl); }
  styleEl.textContent = LEADOS.cssolver.generateCSS(sol);
  renderMonitor(sol);
}
function renderMonitor(sol){
  var el = document.getElementById('cssolver-monitor');
  if (!debugModeOn()){ if (el) el.remove(); return; }
  if (!el){ el = document.createElement('div'); el.id='cssolver-monitor'; document.body.appendChild(el); }
  function row(label, value, pass){ return '<div class="row"><span>'+label+'</span><span class="'+(pass===undefined?'':(pass?'pass':'fail'))+'">'+value+'</span></div>'; }
  el.innerHTML = '<h4>constraint monitor <span class="finding-label" style="font-weight:400;color:var(--ink-2)">'+sol.viewport.width+'&times;'+sol.viewport.height+'</span></h4>'+
    row('cardHeight', sol.cardHeight+'px') + row('gap', sol.gap+'px') + row('buttonSize', sol.buttonSize+'px') + row('scoreFont', sol.scoreFont+'px') +
    row('Fitts ms', sol.fittsAcquisitionMs, sol.checks.fitts_lt_300ms) +
    row('cards/saccade', sol.cardsPerSaccade, sol.checks.scannability_ge_3) +
    row('contrast', sol.worstContrastRatio+':1 '+sol.wcagLevel, sol.checks.contrast_ok) +
    row('domain &Delta;E min', sol.perceptualDistance, sol.checks.perceptual_ge_30) +
    row('arousal monotonic', sol.arousalMonotonic, sol.arousalMonotonic) +
    row('weight ratio', sol.weightRatio, sol.checks.weight_ratio_ok) +
    '<div class="finding-label mt-2" style="color:var(--ink-2)"><a href="#/layout" style="text-decoration:underline">full solver view &rarr;</a></div>';
}
window.addEventListener('resize', function(){ clearTimeout(resizeTimer); resizeTimer = setTimeout(applySolvedLayout, 150); });

/* ===========================================================================
   SECTION 12 — ACTIONS (window.LeadOS)
   =========================================================================== */
var LeadOS = {
  nav: nav,
  resolveFinding: function(signalId){ appendEvent(ST, 'signal.resolved', {signalId:signalId}); render(); },
  generateSynthesis: function(){
    var P = project(ST.events);
    var payload = generateSynthesisPayload(P, new Date());
    var eventCountAtGeneration = ST.events.length; // snapshot BEFORE append
    appendEvent(ST, 'synthesis.generated', { momentText: payload.momentText, five: payload.five, hardQuestion: payload.hardQuestion, eventCountAtGeneration: eventCountAtGeneration });
    render();
  },
  submitDecision: function(ev){
    ev.preventDefault();
    var f = ev.target;
    var data = {
      title: f.title.value, domain: f.domain.value,
      risk: Number(f.risk.value), confidence: Number(f.confidence.value),
      reversible: f.reversible.checked, urgent: f.urgent.checked
    };
    var res = appendEvent(ST, 'decision.logged', data);
    var errEl = document.getElementById('err_decision');
    if (!res.ok){ errEl.textContent = res.error; return; }
    errEl.textContent = ''; render();
  },
  exportLog: function(){
    var blob = new Blob([JSON.stringify(ST,null,2)], {type:'application/json'});
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'leados-pt-j-export.json'; a.click();
  },
  wipeLog: function(){
    if (!confirm('Wipe all local data and reseed?')) return;
    ST = emptyState(); save(ST); seedIfEmpty(ST); render();
  }
};
window.LeadOS = LeadOS;
window.nav = nav;
window.toggleDebug = toggleDebug;
window.addEventListener('hashchange', render);
document.addEventListener('keydown', function(e){
  if ((e.metaKey||e.ctrlKey) && e.key==='Enter' && routeFromHash()==='synthesis'){ e.preventDefault(); LeadOS.generateSynthesis(); }
});
render();
</script>
</body>
