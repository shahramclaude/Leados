    <meta name="leados-transport-decomposed" content="2026-10-31 · Session 95 · Schema v67 (unchanged) · ADR-0058: the drift decomposition now runs at three landmarks (14/30/60 days) over generalized fixed start cohorts, the flanks under their own 24-test Holm family, and is read as two transport axes — timing (any-exit log-rank) carries still-open and waiting-cost outputs, completion (day-30 exit-mix verdict) carries completion probabilities and the completion median. classTransport names the landmark shape (flat, early-only, sustained, crossing, not-assessed) and a headline (both-undermined, completion-only, timing-only, transport-supported, not-assessed); favorable shifts read as conservative, never as failures. Cost-of-waiting row confidence is capped only by a timing failure; Consequence Lab futures carry transport banners and frozen readings stamp both axes at freeze. RULE-SURV-08 challenges frozen survival readings by appended note (probabilities untouched) and opens one owned, typed-linked re-freeze task for an exposure certificate only when timing fails. SURV-11 names the completion-only case. A descriptive stability audit of a reference class, not causal transportability; no number is adjusted. CSV scope #53 gains eleven transport/profile columns, blank where refused." />
    <meta name="leados-drift-decomposition" content="2026-10-31 · Session 94 · Schema v67 (unchanged) · ADR-0057: the calendar drift check now decomposes by cause. kaplanMeier emits both Aalen-Johansen incidences (survival + completion + abandonment = 1 at every step), and driftDecomposition differences each cause's day-30 incidence between the fixed cohorts — exact partition, landmark Wald tests with delta-method variances, Fisher exact at the 0/1 boundary only for verified fully-observed cohorts, Holm across six classes times two causes, sparse-cause refusal below five pooled events. Nine verdicts; 'substitution' catches completions silently replaced by abandonments at unchanged exit speed, invisible to any-exit and cycle-time views. RULE-SURV-07 opens the week's single drift decision framed by the component that moved (intake review with recent abandonments as exhibits, or completion review), with two-way precedence against RULE-SURV-06, plus a positive-deviance capture task. Session 94 also corrected Session 89's mis-transcribed cumulative-incidence variance to the three-term delta-method form, exact at the multinomial anchor F(1-F)/n. Association, not cause; no person is scored." />
    <meta name="leados-calendar-drift" content="2026-10-31: Delivery Survival now checks fixed calendar cohorts with equal 30-day follow-up, Mantel-Cox log-rank and six-class Holm correction. Detected shifts lower financial forecast confidence and create linked review decisions and owned checks on scan. Descriptive, not causal; abandonment is an exit, not success." />
    <meta name="leados-performance-recovery" content="2026-10-30 · Session 88 · Schema v62 · ADR-0051: the Performance Recovery Terminal (#/performance) is a due-process audit of the LEADER'S record when someone is not delivering, plus the arithmetic of waiting. No rating, no potential score, no nine-box, no ranking, no sentiment or language analysis, and no adverse action: the app cannot terminate, demote, dock pay or change a role. A concern carries the declared expectation with its source and date, the observed gap, dated observations scored for SBI answerability (the feedback module's 0–4 scale, floor 3), conversations, support actions and the seven Mager–Pipe analysis questions. Six Leventhal/Colquitt procedural-justice rules (notice, accuracy, consistency, voice, bias suppression, support) plus a named diagnosis gate a formal plan; adoption is refused while a blocker stands unless the leader writes an override of at least 40 characters, stored verbatim and shown beside the plan forever. Adoption freezes a 5–95% probability scored once at review (Brier 1950), withheld below five resolved plans; review cannot be backdated or dated in the future and a not-met verdict opens exactly one decision about the next PROCESS step with no exit option. Waiting is priced from recorded pay (Reinertsen cost of delay, replacement-cost convention) or reported unpriced — never zero. RULE-PERF-01..05 on the shared post-commit spine are marker-idempotent support work: missing expectation → one owned task and one blameless 1:1 prompt; evidence floor met without a two-way conversation → the conversation task; plan adopted → one DACI decision on the support mechanism plus typed concern→person and decision→concern links and a dated check-in; not-met review → one next-step decision; explicit scan → one task for a passed review. v62 also splits coupledLoadAutoPropagate out of the continuity module's key, fixing a v61 collision in which pausing one paused both. CSV scope #52 exports one row per concern under opaque codes with no label, name, note or override text. Explicitly not legal advice." />
    <meta name="leados-delivery-survival" content="2026-10-30 · Session 89 · Schema v63 · ADR-0052: the Delivery Survival Terminal (#/survival) answers the one question every queue in every tool refuses — which of these open items has already taken longer than work like this normally takes, and if I wait N more days, what is the chance each one is still here? The curve is computed from records the workspace already keeps across six modules (funded portfolio work, operational cases, hiring requisitions, org-change programmes, delegations and decisions), with no new data entry to get a first reading. Kaplan–Meier (1958) product-limit survival with Greenwood (1926) variance and a Kalbfleisch–Prentice log–log band keeps OPEN items in the risk set instead of dropping them; the Aalen–Johansen (1978) cumulative incidence splits completion from abandonment, so the page prints both 'eventually completes' and 'eventually completes, with abandonment counted as a competing exit' and the difference is exactly the work the organisation starts and does not finish. Hazard in elapsed-time buckets (Nelson–Aalen, Katz log-rate ratio), a Mantel–Cox log-rank comparison of two classes on one degree of freedom, an empirical age percentile (share of past exits that took less time than this item already has — labelled a percentile and never a probability), and a frozen reading per class scored once with Brier (1950) against the class's own base rate, withheld below five settled items. Refusals, on the screen: no probability below the at-risk floor, no tail beyond the observed record drawn silently, no median that was never reached, no skill score from four items, no scoring of a person. An abandoned change carries no terminal date in this schema, so it is censored and counted separately as abandonedUndated rather than credited with an invented exit. RULE-SURV-01..05 on the shared post-commit spine are marker-idempotent: typed endangers edges from a frozen reading to the work it does not expect to finish plus one owned task per such item (max 5, recorded owner only), one repair task when a graded reading lost to its base rate, exactly one DACI decision per class per week when abandonment reaches the declared share of exits, one task per returned delegation with no recorded reason, one grading task per stale reading. survivalReadings and survivalMarkers only; every statistic is recomputed on read, so no stored number drifts from the records that produced it. CSV scope #53 exports 22 aggregate columns under opaque class codes with every figure blanked below the evidence floor. Schema v63 is additive 62→63; no new dependency, no network call." />
    <meta name="leados-cost-of-waiting" content="2026-10-31 · Session 90 · Schema v64 · ADR-0053: the Cost of Waiting Terminal (#/wait) turns the wait into money — the link Session 89 left as a sentence. Every open item across the six harvested classes (funded work, cases, requisitions, org changes, delegations, decisions) is priced per week: decisions from their own value at stake via the decision-tempo valuation spread over a declared erosion window (linear cost-of-delay, Reinertsen 2009), other classes from leader-declared weekly prices (waitPrices). Unpriced is reported as unpriced, never zero; currencies are never pooled. The legacy 'wait N more weeks' endpoint product = price × weeks × P(still open | current age) is a LOWER BOUND, not expected carrying cost; Schema v67 integrates the conditional survival curve with P = S(age+7w)/S(age) on the class Kaplan–Meier curve, withheld below the at-risk floor and flagged past the observed tail. Each row carries a confidence label (price source × class exits × at-risk now). RULE-WAIT-01..05 on the shared post-commit spine are marker-idempotent: a scan or a price declaration freezes the week's exposure certificate once (waitExposures, append-only audit), writes typed prices-delay edges to priced overdue items, opens exactly one triage DACI decision per currency per week when overdue priced exposure clears the declared threshold (priced by decision tempo in the same atomic transaction), one owned task per top priced overdue item for its recorded owner, and one declare-a-price task per unpriced overdue class; stale edges to closed items are reconciled on scan. WAIT-01..06 signals, a 'Cost of waiting' insights bucket, nav badge, CSV scope #54 (aggregate rows per class × currency, scenario cells blanked below the at-risk floor, no titles/IDs/owners). No person is scored; the terminal cannot close, expedite or defer anything itself. Schema v64 is additive 63→64; no new dependency, no network call." />
    <meta name="leados-leadership-parity" content="2026-10-31 · Session 91 · Schema v65 · ADR-0054: the Leadership Parity &amp; Standard Consistency Terminal (#/parity) audits the LEADER'S own allocation of attention, stretch opportunity, promise fulfillment, and standard consistency across active direct reports from dated workspace records (1:1s, SBI feedback, GROW/stretch delegations, recognition, succession, performance concerns, reviews) — never scoring, ranking, or profiling people, storing zero protected characteristics, and taking zero adverse actions. Finite-sample Gini, Atkinson (ε=0.5), and additive Theil T = T_between + T_within entropy separate legitimate role/tenure differentiation (LMX variety, with explicit early-ramp protection during a configurable ramp window so extra onboarding investment never flags as disparity) from unexplained within-cohort neglect (LMX disparity; Graen &amp; Uhl-Bien 1995; Buengeler et al. 2021). A Leader Promise &amp; Follow-Through Ledger computes dated leader-owned 1:1 action fulfillment with Wilson 95% score intervals, chronic carry rates, and overdue dispersion (Rousseau 1989; García-Selva et al. 2025 PSYCONES). A Standard Consistency &amp; Noise Audit checks formal performance-concern thresholds against peer delivery baselines, SBI specificity parity, and review-rating vs. longitudinal evidence concordance via tie-adjusted Kendall τ_b (Leventhal 1980; Kahneman, Sibony &amp; Sunstein 2021; Nordmo 2026). A Counterfactual 14-Day Rebalancing Planner allocates bounded weekly leader hours by steepest marginal reduction in within-cohort entropy, overdue leader promises, and standard inversions; frozen Parity Audits record ex-ante predictions scored once with Brier (1950) skill withheld below five graded audits. RULE-PAR-01..05 on the shared post-commit spine are marker-idempotent and pauseable via parityAutoPropagate while explicit scanParity always runs: overdue leader-promise tasks, blameless 1:1 cadence/SBI prompts on neglected post-ramp reports, one process-level DACI standard-consistency review decision with typed audits-parity edges when an open concern exhibits a peer-threshold inversion, one mechanism-level allocation DACI decision on material within-cohort disparity, and one grading task on stale frozen audits. PAR-01..06 signals, 'Leadership parity' insights bucket, nav badge, Today triage card, Person commitments-owed summary, CSV scope #55 (opaque cohort/channel aggregates only; zero names, IDs, or prose), plus five repaired pre-existing War-Game and Performance cross-module defects. Explicitly not legal advice." />
    <meta name="leados-consequence-lab" content="2026-10-31 · Session 93 · Schema v67 · ADR-0056: the Consequence Lab (#/consequences) traces the recorded operational ripple of an unmade decision across a bounded two-hop typed graph (people/candidates/conflicts/pulses excluded, broken links counted, 64-node/2000-edge cap flagged). Paths are associations, NEVER causal claims. It integrates the conditional Kaplan–Meier survival curve S(age+t)/S(age) exactly over +1/+2/+4-week horizons to price the expected time the call remains open: the old endpoint-only price × horizon × P(still open at end) is explicitly a LOWER bound, not the expected cost. Weekly prices come from the decision&#39;s own typed money (Reinertsen linear erosion) or a declared class price; unpriced stays null, currencies never mix. A parallel full-block ceiling on linked priced work is a conditional sensitivity, NOT an incremental loss and NEVER added to root cost. Forecasts refuse below the exit/at-risk floors and beyond the last observation; one prospective reading freezes aggregate graph/money and a still-open probability, scored once on the actual dated decision with Brier against a five-grade base-rate floor. RULE-CSQ-01..05 on the shared spine write mapped-context links, one leader-owned verification task on a fragile premise, one DACI coordination call when the priced root has other open calls in its graph, one due grading task and one blameless forecast-miss task; no option is selected, status changed or message sent. Five keyboard-accessible panels, real decision-card entry point, identity-free board brief, Insights/nav signals, CSV scope #57 aggregates blank below n=5. No new dependency or network call." />
    <meta name="leados-evidence" content="2026-10-31 · Session 92 · Schema v66 · ADR-0055: the Evidence Terminal (#/evidence) answers the question no other module could: several pre-registered studies of the same lever on the same metric have now closed — what do they say TOGETHER, is the disagreement real, and is one more study worth running? Two families are pooled with the same core. The effect family takes every scored, locked impact study's interrupted-time-series level shift as a percentage of the pre-period mean (dimensionless, so different metrics can be pooled), oriented so positive always means better while the un-oriented shift is kept beside it. The resolution family takes every declared probability that has since resolved — a study's expected confidence, a premise prior, a frozen support-plan probability — pooled on the log-odds scale with the Haldane–Anscombe correction, Wilson intervals, Brier skill against the base rate, and calibration-in-the-large. Pooling is DerSimonian–Laird random effects with tau-squared, Cochran's Q and I-squared, and BOTH intervals are computed so the WIDER of the z and Hartung–Knapp interval is reported: a small-study correction may only widen what the terminal claims. Five guards keep the pooled number honest: a pooling floor of three pre-registered studies (below it, counts only — exploratory studies are counted and shown, never pooled); tau-squared and I-squared withheld below four studies because three cannot separate real variance from noise; direction-awareness so a fall in a down-is-good metric like latency is an improvement and not a backfire; a count of OVERLAPPING STUDY WINDOWS, because two interrupted time series of the same team metric that share calendar time share observations and the pooled standard error is therefore optimistic — printed beside the estimate rather than assumed away; and a leave-one-out check that names any study whose deletion moves the answer. Egger's test refuses below ten studies because below that a funnel plot is a shape, not a signal. Ranking is on the lower bound plus the priced value of what one more trial would teach, with both limits asserted: an uninformative trial is worth exactly zero and a perfect one is worth EVPI; when no within-study noise was declared the value of a trial is null with a reason, never zero. A frozen review stores aggregates only — no title, hypothesis, note or identifier — so it cannot become a second unredacted copy behind the export boundary, and grading it reports coverage BESIDE mean absolute error, because an interval wide enough covers almost anything. RULE-EBM-01..05 on the shared post-commit spine are marker-idempotent and pauseable while an explicit scan always runs: one DACI decision per cell ever when a pooled interval stays on the harmful side of zero with a grounds-practice edge back to the evidence; one replication task when a supported result stands alone, counted on independent roots so three studies of which two are replications is still one finding; one pre-registration task where information value exceeds expected effect; typed recommends-for edges from the newest frozen review to open cases plus one owned delegation; and stale-edge reconciliation with grading work. EBM-01..08 signals, an Evidence insights bucket, nav badge, CSV scope #56 (opaque intervention, outcome and source codes; no titles, hypotheses, notes, names or free text; blank below every floor, never zero). No person is scored, ranked or named anywhere in the terminal; it never closes an item, never reassigns work and never alters a study. Schema v66 is additive 65→66; no new dependency, no network call." />
    <meta name="leados-schema-history-gap" content="2026-10-30: index.html meta entries were not written for Sessions 85–87 (Schema v59 Signal Path, v60 War-Game, v61 Coupled Load). Those modules ship and are covered by the suite; this note records the documentation gap rather than inventing provenance for them. Schema v62's entry is authoritative for the current state." />
    <meta name="leados-autopilot" content="2026-10-30 · Session 84 · Schema v58 · ADR-0049: Autopilot Studio (#/autopilot) lets a leader declare operating agreements in a closed vocabulary — 4 sources, 14 events, 5 bounded actions — rehearse each against current records on a disposable copy, and activate only by approving that exact preview via a digest-bound token. RULE-AP-01 evaluates first on the post-commit spine against the record as the action left it; one trigger fans out into a decision, owned task, coaching prompt, joined assumption and stakeholder drafts with typed automates provenance and desired-state idempotency. Nothing is sent, no option selected, no personnel effects exist; missing owners and full queues block whole runs with pauses, a 24-record batch ceiling rolls back with a receipt, and agreement output cannot chain. CSV scope #50 exports codes and counts only." />
    <meta name="leados-sequential-investigation" content="2026-10-30 · Session 81 · Schema v56 (unchanged) · ADR-0046: the Sequence tab (#/voi?panel=sequence) solves the order of declared investigations exactly by backward induction over up to three stages and six tests, conditions the belief by Bayes' rule after each settled test, and prints the decision tree, the stop and continue values, each test's raw net alone and the assumptions it rests on. RULE-SEQ-01 writes one advisory conditional-plan note; RULE-SEQ-02 opens one commit decision when the plan stops and revises it in place; RULE-SEQ-03 creates one owned, dated next-test task. Conditional independence is assumed, not checked; the planner is a read model and no record is migrated." />
    <meta name="leados-calibration-decision-bridge" content="2026-10-30 · Session 80 · Schema v56 · ADR-0045: Leader calibration now stress-tests open VOI frames in money and choice terms. Per-state historical one-vs-rest rates use a Jeffreys Beta(1/2,1/2) mean shrunk toward the current declaration by n/(n+10); missing bins below n=3 or incomplete payoffs are refused. State rates are renormalized to 100%, exact EVPI is recomputed, and every Wilson marginal lower/upper corner (up to 64 for six states) produces an explicitly non-simultaneous sensitivity envelope. The Calibration tab compares raw EVPI, scenario EVPI, range and option stability. RULE-LCAL-04 on the shared post-commit spine appends one non-prescriptive note plus up to three typed calibrates links to contributing settled forecast frames; no declared or frozen probability is changed. This is not a posterior or corrected belief, and within-frame state-pair clustering is not corrected." />
    <meta name="leados-decision-integrity" content="2026-10-30: investigation evidence requires explicit single-state equivalence; negative likelihood ratios use reciprocal evidence weights; shared-premise follow-up provenance is repairable by scan; portfolio stresses remain separated by currency. Review legacy investigation observations and generated decisions; they are not rewritten." />
    <meta name="leados-decision-portfolio" content="2026-10-30 · Session 78 · Schema v55 · ADR-0043: the Decision Portfolio Engine (#/portfolio) treats the leader's open decisions as a constrained scheduling problem instead of a list. A coupling graph (shared premises, typed resources, DACI approvers — derived from the typed link graph, never declared) identifies decision clusters that should be addressed together. A dependency DAG (derived from shared premises: when two decisions rest on the same assumption, the higher-CD3 decision is the predecessor) is topologically sorted into layers, and within each layer decisions are ranked by CD3 = Cost of Delay ÷ Duration (Reinertsen 2009). A decision load index (count 0.15, economic exposure 0.35, approver HHI 0.20, premise concentration 0.15, dependency depth 0.15) classifies the queue from light to critical. Sequencing regret measures the weighted-completion-time gap between the date-first order and the CD3-optimal order. A deferral simulation prices what waiting N weeks costs per cluster, including cascade to downstream dependencies. RULE-DPF-01..03 on the shared post-commit spine discover coupling links (couples), flag coupled decisions for review when one is resolved, and flag sequencing review when a premise observation arrives — all marker-idempotent. CSV scope #49 exports portfolio telemetry under opaque codes. No person is scored; the module measures the leader's queue, not the leader." />
    <meta name="leados-information-value" content="2026-10-30 · Session 77 · Schema v54 · ADR-0042: the Information Value Terminal (#/voi) answers the sentence that decides whether any other module is worth opening — how much is it worth to find this out before committing? A declared frame (2–6 states summing to exactly 100%, 2–5 options including doing nothing, a payoff per cell) is enumerated exactly, never sampled: expected value per option, EVPI = Σp·max − max Σp·payoff as the ceiling, EVPI as a share of the declared stake, the Savage minimax-regret table beside it, and a near-tie flag that says a little evidence moves the ranking; a blank payoff cell makes the option unpriced and EVPI null (never zero), and a probability sum that is not 100 is refused, never rescaled. An investigation declares sensitivity, specificity and two costs — the fee and what the waiting itself is worth — and EVSI (Bayes posteriors per signal, weighted by the declared signal probability, minus the value of deciding now) is priced against the total, with net value, efficiency as a share of the ceiling, and a break-even sensitivity solved by bisection because EVSI is monotone in accuracy (Blackwell); a coin flip (se+sp ≤ 100%) is refused at entry. Settling writes the standard diagnostic likelihood ratio (LR+ = se/(1−sp), LR− = (1−se)/sp, clamped at 20 because the belief ledger refuses certainty) as one dated observation on the premise the frame's states cite. The portfolio panel prices concentration, not covariance: a Herfindahl reading and a declared flip-stress of exactly two probabilities show how many open frames would change their preferred option if one shared premise is wrong, and RULE-VOI-04 opens exactly one de-risking decision rather than one per frame. Deciding freezes EVPI, the expected values and the declared distribution in the same write; observing the realised state scores that frozen distribution (multi-class Brier, log loss) and records the regret actually incurred. RULE-VOI-01..05 on the shared post-commit spine are marker-idempotent and write typed rests-on/informs provenance, one buy-information DACI decision priced per branch plus one owned scouting task when EVPI clears a money floor or a share of stake, one premise observation per settled test, one concentration decision and one dated outcome review. CSV scope #48 exports counts and ratios under opaque positional codes with no label, question, premise title, name, currency amount or individual payoff; the demo carries two priced frames over the workspace's own assumption ledger, one live investigation with a priced wait and one settled one." />
    <meta name="leados-structural-design" content="2026-10-30 · Session 76 · Schema v53 · ADR-0041: the Structural Design Terminal (#/orgdesign) measures the shape the rest of the workspace assumes — span, layers, Brooks/Graicunas coordination channels priced at recorded loaded cost with the unpriced share printed, a per-manager Kingman queue built from that manager's own completions and service times (insufficient below three, null at ρ ≥ 1), a channel-scaled counterfactual with per-manager P80 waits, a Pareto frontier instead of a composite score, and a reversible commit that freezes its prediction before anyone is told." />
    <meta name="leados-merit-pay-equity" content="2026-10-29 · Session 74 · Schema v51 · ADR-0039: the Merit &amp; Pay-Equity Terminal (#/merit) turns a fixed merit budget into a constrained decision: declared bands (a broken range is dropped, never repaired), three priced policies against the same budget (across the board, performance-weighted with an explicit missing-review fallback, and a marginal-retention-value allocator over replacement cost × modelled departure reduction) each printed with spend, band violations, the four-fifths ratio it would produce, expected departures, retained value and regret; a twofold log-pay Oaxaca–Blinder decomposition over level, tenure and last rating with an explicit rating-missing term and an adjusted-gap interval from the group coefficient's own standard error; the four-fifths screen applied to the decision with Wilson intervals and a reliability floor, framed as a screen and not a legal conclusion; NO protected characteristic stored anywhere, so the audit runs on a declared comparison (hire origin or reporting line) and prints that an unexplained gap is not proof of discrimination; a four-term retention hazard with no fitted coefficient, frozen at finalization, resolved by person.archived and graded with a Brier skill score only at five outcomes; RULE-COMP-01..05 opening exactly one DACI mechanism decision (never an individual adjustment) plus one owned evidence task, one relative-pay task per cycle, one dated outcome review and typed compensates/compares-pay-with links; CSV scope #45 exports ratios and counts under opaque cycle codes with no salary, name, note or label." />
    <meta name="leados-workforce-transition" content="2026-10-29 · Session 75 · Schema v52 · ADR-0040: the Workforce Transition Terminal (#/transition) turns a named reduction list into a priced decision and refuses to turn a screen into a verdict: exit cost is arithmetic over recorded pay and declared notice/severance conventions, so a person with no pay record is unpriced and null rather than zero; selection is a constrained greedy plus swap repair against a cost ceiling with a printed fractional-relaxation bound and a seeded weight ensemble that reports how much of the shortlist is a property of the weight table; a sole recorded steward of a critical dependency cannot be selected at all; the four-fifths screen runs on the decision with Wilson intervals, a declared group-size floor, printed coverage of candidates with no group code, and a fragility count stating how many selections must move at constant headcount before the direction of the disparity reverses (Raghavan &amp; Kim 2024); a failed screen prices the cheapest compliant swap set at unchanged headcount and opens exactly one DACI decision about the criteria and the target rather than a private swap of two names; continuity risk is read from recorded stewardship and open ownership into owned hand-over delegations dated before the last working day; survivors get a mechanical redistribution, an overload threshold and a four-term departure convention frozen before the change and scored with a Brier skill score withheld below five outcomes; four alternatives (declared criteria, voluntary severance priced as Akerlof adverse selection, internal redeployment marked unavailable when no requisition can receive it, and doing nothing) are compared by Pareto dominance because cash and capability are never converted into each other; RULE-TRN-01..06 are marker-idempotent on the shared post-commit spine, decide and finalize refuse an unowned programme, NO protected characteristic is stored, no WARN notice, release or severance agreement is generated, and CSV scope #46 exports counts and ratios under positional programme codes with no name, identifier, group code, note or per-person probability." />
    <meta name="leados-implementation-fidelity" content="2026-10-29 · Session 73 · Schema v50 · ADR-0038: the Implementation Fidelity Ledger (#/fidelity) records a declared delivery denominator before delivery and reads it two ways that are never merged — four stages derived from dated typed records (1:1s with notes, SBI-complete feedback, delegations with a dated check-in, key results that moved) and a dated human attestation per stage, with a written reason required when the two disagree; exposure is reach × dose × quality, grading is refused below 60% coverage, adaptation has no instrument and says so, RULE-FID-01..05 link and propagate idempotently, a scored Impact study freezes the delivery reading and the Bloom/LATE per-complier correction (null, never zero, when no counterfactual was fitted), demo cleanup keeps declared plans and nulls pointers, and CSV scope #44 exports derived telemetry only." />
    <meta name="leados-impact-execution" content="2026-10-29 · Session 72 · Schema v49 · ADR-0037: an optional exact typed intervention-record selection freezes bounded successful LeadOS root/step-event match counts at Impact scoring; the result is separate from outcome and causal evaluation; v48 studies are not backfilled; source pointers clear with demo cleanup; redacted JSON and Impact CSV (#32) scrub or omit trace/source IDs and free text." />
    <meta name="leados-propagation-lineage" content="2026-10-29 · Session 71 · Schema v48 · ADR-0036: exact typed deep links and a bounded successful-propagation ledger at #/propagation?tab=lineage; at most 250 transactions, 32 rule steps and 48 target/edge/event references per transaction; no record bodies or historical backfill; conflicts and pulses excluded; candidate-linked transactions omitted from redacted export; CSV scope #43 is counts/types-only." />

  <title>LeadOS · Leadership workspace</title>
    <meta
      name="description"
      content="Schema v67 adds the Consequence Lab (#/consequences): bounded two-hop typed decision ripples, exact conditional Kaplan–Meier waiting-time area instead of an endpoint-only lower bound, prospectively frozen and Brier-graded decision futures, and typed cross-module verification and coordination. LeadOS is a local-first leadership and operational workspace that also ships as one self-contained HTML file you can double-click on any PC without a server, install or internet; Schema v56 (unchanged) adds the Sequential Investigation Planner (#/voi?panel=sequence): the order of declared tests solved exactly over up to three stages, with Bayes conditioning after each settled test and three automation rules that write the plan, a commit decision and an owned next test; Schema v54 adds the Information Value Terminal (#/voi): EVPI and EVSI computed exactly over a declared payoff table, a total cost of learning that includes the wait, a break-even accuracy, a settled test written into the premise ledger as a diagnostic likelihood ratio, and a concentration reading that counts how many open decisions rest on one premise; Schema v53 added the Structural Design Terminal (#/orgdesign); Schema v52 added the Workforce Transition Terminal (#/transition) — priced exits, a weight-stability ensemble, a four-fifths screen that prints its own fragility instead of a verdict, priced compliance swaps and a frozen survivor prediction — Schema v51 added the Merit &amp; Pay-Equity Terminal (#/merit) and Schema v50 added the Implementation Fidelity Ledger (#/fidelity): a delivery plan declared before delivery, four stages read from dated typed records with explicit standards and a fifth (adaptation) that is honestly attested-only, a dated human attestation kept beside the record reading instead of averaged with it, multiplicative reach × dose × quality exposure, grading refused below 60% coverage, an over-claim calibration statistic with Wilson intervals, and RULE-FID-01..05 propagating a materially under-delivered settlement into one repair decision, one owned task and a frozen Bloom/LATE dilution correction on the linked Impact study (ADR-0038); Schema v49 adds a frozen, bounded Impact execution snapshot linked to an exact typed intervention record (ADR-0037), alongside Schema v48 successful-propagation lineage and typed cross-module deep links (ADR-0036); an Impact Ledger (#/impact, Schema v31) that makes a leader declare what an intervention is supposed to do before it runs, then decides whether the record can answer the question at all: twelve weekly vitals reconstructed from dated fields already on the records (an unobserved week is a gap, never a zero; an undated closure is excluded, never interpolated), segmented interrupted-time-series estimates with Newey-West HAC errors, a minimum detectable effect computed from the metric's own noise, in-space and in-time placebo inference that reports its finest attainable p and refuses to gate when it cannot reach alpha, a breakdown-trend fragility bound, and a pre-intervention power planner run live inside the declare dialog; a study declared after its own intervention date is graded retrospective forever and can never count as confirmation, scoring freezes the evaluation permanently, and RULE-IMP-01..06 propagate a confirmatory result atomically into typed evaluates/replicates links, exactly one 4-option DACI scale/stop decision, blameless mechanism-framed 1:1 check-ins and exactly one proposed replication (IMP-01..06 signals, CSV scope #32); a Coalition &amp; Incentive War Room (#/power, Schema v30) fusing exact Banzhaf/Shapley-Shubik voting-power indices, Riker minimum winning coalitions and Tsebelis veto players with 2x2 pure/mixed Nash equilibria, dominant strategies, Pareto frontier and price of anarchy, mechanism-design incentive-alignment transfers (revelation principle / DSIC), equilibrium-robustness confidence scoring and deterministic SBI/DESC influence scripts, propagated atomically into DACI decisions, blameless delegations, 1:1 talking points and decision-tempo by RULE-PWR-01..06 (PWR-01..06 signals, CSV scope #30); an Operational Resilience, Dependency &amp; Continuity Terminal (#/resilience, Schema v29) modeling directed service/vendor/system/process topologies with Simchi-Levi Time-to-Survive (TTS), Time-to-Recover (TTR) and currency-segmented Risk Exposure Index (REI), Avelino minimal-hitting-set Bus Factor with an explicit backup-steward verification firewall, Nth-party common-mode choke-point detection (EU DORA Art. 29), Herfindahl-Hirschman vendor &amp; stewardship concentration (HHI), Williamson supplier hold-up risk, zero-write disruption/departure stress testing, split-conformal drill TTR calibration (counts-only below n=5), deterministic continuity briefs, and six post-commit rules (RULE-RES-01..06, RES-01..07); a Forecast Integrity Terminal (#/forecasts) unifying every prediction ledger with Brier/Murphy scoring, reference-class ratios, exact sign tests, distribution-free conformal bands, board-ready briefs and event-driven outside-view challenges (RULE-FCI-01..04, FI-01..05, Schema v26); a Decision Tempo &amp; Timing Terminal (#/tempo) pricing each open decision&#39;s cost of delay (Reinertsen CD3, four delay profiles, value at stake derived from typed links, currencies never summed) against the exact preposterior value of waiting (Raiffa-Schlaifer EVSI, optimal decision date, switch probability), with measured decidedOn latency, split-conformal class bands (counts-only below n=5), five post-commit rules (RULE-DLY-01..05, Schema v28) that propose but never arm a timebox, DLY-01..06 signals and a deterministic board brief; principled negotiation workbench (#/negotiations, Fisher &amp; Ury BATNA, Raiffa ZOPA, Lax &amp; Sebenius value creation, Williamson ex-post settlement governance &amp; Perold implementation shortfall, RULE-NEG-01..07, NEG-01..09), forecast calibration and reference-class learning across five scored prediction ledgers (the fifth scores budget commitments as actual-vs-committed ratios) (decision probabilities scored with Brier/Murphy at outcome review, funding-time PERT snapshots scored against recorded delivery actuals, settled operational-case costs scored as FAIR frequency × magnitude against opening forecasts frozen at case open, and explicit negotiated-vs-realised deal-value reference classes segmented by currency and issue direction with counts-only cohorts below n=5 — RULE-NEG-07, NEG-09, Flyvbjerg outside-view learning; no FX conversion, inferred actuals or automatic target changes — alongside the existing RULE-FCT-01..04), non-persisted What-If scenario sandboxing, Pareto frontier dominance &amp; One-at-a-Time Tornado sensitivity analysis (#/scenarios, Common Random Numbers, Brooks's Law onboarding drag, Samuelson shadow pricing, RULE-SCN-01), organizational design, team topologies and change execution (Kotter 8-step track, Lewin force-field barriers, Conway/Team Topologies &amp; Sweller cognitive load, Galbraith 5-point Star, Tsebelis veto coalitions, coupled Monte Carlo J-curve economics, and Shewhart XmR statistical process control), cross-domain operational cases (AIAG-VDA FMEA risk, 3-point PERT financial and capacity exposure, 5-Whys systemic barriers, Mendelow stakeholder coalitions, and parallel event-driven propagation across DACI decisions, delegations, goals and blameless 1:1 coaching, including reversible case-closeout learning prompts (RULE-COACH-02)), 1:1s with prep-sheet carry-through, 30-60-90 onboarding, role-transition and return-to-work scaffolding, dated manager-owned follow-ups after recorded Day 30/60/90 check-ins, timely SBI feedback, co-authored goals, actionable check-ins on Today, outcome delegation with GROW development handoff and returned-commitment recovery lineage (RULE-NEG-05), evidence-backed performance reviews, decision-review queues, anonymous pulse, succession-to-transition handoff, structured hiring with Sackett validity weights and pre-export retention/sensitivity disclosures, budget envelopes with encumbrance accounting (#/finance, forecast at completion vs ceiling, commitments scored on recorded actuals — never copied from committed figures, no FX, ceilings never treated as spend targets, RULE-FIN-01..03, FIN-01..05), and conflict resolution with voluntary participation, owned commitments and verified follow-up. Capacity and flow are modelled from the same records: focused hours with transition ramps, future-joiner proration and an operational reserve, Little's Law WIP and Kingman queue-delay multipliers, three-point PERT effort and value with value-density funding decisions, and seeded Monte Carlo Beta-PERT + Critical-Chain owner-bottleneck P50/P80/P90 forecasts. Operational cases and active org changes automatically reserve their diverted person-days, releasing or completing them on closure; after five settled diverted-days cases show a ≥25% median under-reserve, RULE-CAP-06 transparently applies the median reserve uplift (P80 for high-priority cases) and re-runs deterministic/Monte Carlo capacity risk without rewriting the manager estimate or forecast baseline; deterministic or stochastic overload opens one explicit trade-off decision. Candid check-in blockers, operational incidents and organizational change friction do not auto-enter performance ratings. An Allocation Governor (#/allocation, Schema v33) learns where the next person-day should go: every funded item is classified Core, Adjacent or Exploratory (Nagji &amp; Tuff ambition horizons — unclassified stays unmeasured, never inferred), settled delivery actuals teach per-currency UCB1 arms what each horizon returns per person-day (Auer, Cesa-Bianchi &amp; Fischer; robust MAD-scaled exploration bonuses; counts-only below five settled bets; settled-without-actuals is an excluded evidence debt, never a zero), and when the exploratory share of recently funded classified effort falls below the leader&#39;s floor (March 1991 exploration starvation), RULE-ALLOC-01 opens exactly one DACI rebalancing decision that Decision Tempo prices in the same transaction, while RULE-ALLOC-02..04 queue bet-checkpoint and classification talking points and one evidence-closure delegation (ALLOC-01..05, CSV scope #33); nothing is ever auto-funded. A Cognitive Load &amp; Attention Governor (#/load, Schema v34) measures the person-side constraint entirely from records the leader already keeps, with no calendar, message, keystroke or meeting telemetry and no persisted rating: a per-role saturation index blending intrinsic utilization (0.40), WIP switching (0.25), extraneous coordination from strong-tie degree, span and stewardships (0.20) and open commitments (0.15) into five bands with a leader-owned threshold (default 80), a seeded Beta-PERT Monte Carlo overload probability against ramp-adjusted supply (unmeasured commitments counted, never sampled as zero), per-person Little&#39;s Law and Kingman expected-wait queueing with counts-only/provisional/high evidence floors and an explicit unstable state at rho&gt;=1, Brooks n(n-1)/2 channel density, one Goldratt system constraint and germane learning load protected rather than scored; RULE-LOAD-01..04 open one four-option DACI load-shedding decision with typed links (priced by Decision Tempo in the same transaction) and self-clearing, marker-idempotent WIP, commitment-size and ramp-protection talking points, pauseable via loadAutoPropagate while an explicit human scan always runs (LOAD-01..05 signals, opaque CSV scope #34). A Premise Sentinel / Assumption Ledger (#/premises, Schema v36) pre-registers load-bearing decision assumptions with a DACI anchor, owner, falsification signpost, Cromwell-clamped prior and leader-owned watch/breach thresholds; an eight-sensor declarative registry reads dated facts from cases, stakeholders, dependencies, budgets, portfolio actuals, forecast challenges, decision outcomes and cognitive-load bands through a two-hop typed graph, appends only keyed evidence, discounts its log-Bayes-factor by a policy half-life (Wald-style support/challenge boundaries and KL information gain in bits), and on a fresh breach declares Decision Tempo on the same event spine while atomically opening exactly one four-option DACI re-decision (hedge / pause / reverse / buy information), one owner verification delegation, one blameless 1:1 prompt, value-context-inheriting typed links, PREM-01..05 signals, a Today card, an opaque CSV scopes #35/#36, outcome-scored sensor calibration (Brier, calibration gap, directional accuracy, PSI forecast-mix diagnostic; counts-only below five), typed outcome lineage, a deterministic board brief and a review-cycle-governed human reaffirmation path — all local-first, surveillance-free and pauseable with an explicit scan that always runs. An Operating System Dynamics Lab (#/dynamics, Schema v37) is the first surface that models the team as a system rather than a snapshot: five stocks (delivery capacity, work in progress, quality debt, perceived pressure, dependency concentration) derived from records already on file, integrated with bounded RK4 at a one-week step with every clamp week counted; seven named loops ranked by a measured gain share rather than by raw flow volume; Senge archetypes detected from that measured dominance; a local stability verdict from numerically linearised eigenvalues (Faddeev-LeVerrier + Durand-Kerner); six playbook interventions and unlimited leader experiments compared against doing nothing, with the prediction frozen at adoption and a written reason required to retire one; and a hindcast against weekly WIP reconstructed from dated portfolio lifecycles, scored against naive persistence and gated by five refusal thresholds (the demo is honestly reported as no-better-than-persistence, MASE 2.53). RULE-DYN-01..03 propagate a structural decision priced by Decision Tempo in the same transaction, one blameless marker-leading 1:1 prompt and one owned checkpoint delegation carrying the frozen prediction; dynamicsAutoPropagate pauses the automatic side while an explicit scan always runs; DYN-01..05 signals, an opaque CSV scope #38 and a deterministic board brief carry the evidence, and no morale, sentiment or individual attrition is ever predicted. A local Early-Warning Watch (#/watch, Schema v40) screens reconstructed workspace series using nominal Shewhart scores and a Benjamini–Hochberg-style ranking, without claiming false-discovery control. A confirmed alert can carry explicitly entered owner, goal, stakeholder, action, FMEA and capacity context into a typed operational case and, when appropriate, a decision, delegation, goal check-in, capacity reserve, proposed timebox and unsent brief. A bounded transactional event queue connects case, decision, delegation and portfolio creation; failed rules are reported and can be retried. Future-week forecasts are deduplicated, first observations are frozen, and legacy, demo and late captures are excluded from skill; overlapping windows and mutable historical inputs limit interpretation. The browser copy can be encrypted with a passphrase. The After-Action Learning Ledger (Schema v44) lets a leader attach a separate, dated completed workspace artifact to a human-applied lesson, rechecks the linked record for stale edits, and automatically opens one 30-day practice-persistence follow-up (RULE-AAR-04); this corroborates record presence only, never causal effectiveness. The Leader Continuity Drill (Schema v45) simulates the leader’s own absence Under Schema v46 the correlated stress model removes the independence assumption the exact distribution needs: one shared cause per window takes the deputies recorded on one team offline together (0–100%, default 25%, a leader-owned convention), each deputy is individually away with 8%-per-14-days odds, and cover falls back to the next eligible deputy at 75% of recorded fit — lifting the measured P90 from 19 to 25 stalls and expected shortfall from 17,540 to 25,301 USD on the demo records, with both models printed side by side and never blended; a single-team deputy pool is reported as a finding, concentration is counted on the eligible pool rather than the plan’s nomination, a person is never eligible to cover contact with a stakeholder who is themselves, deputy unavailability is a zero-write deep-linkable stress (?stress=), and hand-over readiness counts recorded check-ins rather than intent, raising LCS-05 inside seven days when a cover delegation was never acknowledged; ADR-0034 adds three-stage hand-over implementation grading (separating paper-only completion from verified dated movement on the covered decisions, cases, delegations, stakeholders, goals and 1:1s, raising LCS-06), multi-shock and cross-team vendor/service common-mode contagion over Operational Resilience dependencies (Simchi-Levi TTR &gt; TTS shortfalls pulling primary and backup stewards across teams into simultaneous recovery, raising LCS-07, with unmodelled dependencies listed explicitly and never treated as 0% risk), causal mechanism attribution on closed drills (partitioning outcomes into model fit misses, dropped hand-over implementation batons, predicted structural stalls, unmodelled resilience and clean cover, plus execution-conditioned Brier and skill), and RULE-LCS-04 on the post-commit spine (auto-reallocating returned cover delegations to the next eligible deputy at the 75% backup fit convention or opening one DACI cover-gap decision, and drafting a pre-filled After-Action Review plus ritual follow-up delegation when a window drops implementation) from the dated obligations already on the record: three delegability states so non-delegable conversations and irreversible big bets are never covered on paper, an exact Poisson-binomial stall count (mean, P50/P80/P90, P(none)) beside a seeded per-currency Monte Carlo tail with coherent expected shortfall, exact branch-and-bound minimum set cover with a disclosed node cap and labelled greedy fallback, transactional commissioning through RULE-LCS-01 (one four-option DACI decision, up to four owned delegations with explicit authority, typed links, at most one blameless 1:1 prompt per deputy), stale-preview refusal and window-level idempotency, and a drill ledger that freezes the prediction before the absence and scores it afterwards with Brier, skill, precision, recall and Wilson intervals, counts-only below five predictions and three drills (RULE-LCS-02..04, LCS-01..07 signals, CSV scope #41); a Scorecard Integrity Lab (#/measurement, Schema v47) that models what a declared scorecard will actually make people do — a closed-form multitask principal–agent equilibrium with a gaming technology splitting effort into genuine work, cosmetic movement and the uncounted job that stops happening, priced against first-best value for the same hours, with seven deterministic redesigns ranked by modelled net value after a declared per-metric measurement cost, a prediction frozen at commit with an explicit falsifier margin and scored against a human-recorded observation (calibration refused below three), RULE-MTX-01..02 turning a distorted commit into exactly one four-option DACI redesign decision, at most two owned counter-metric/baseline tasks and one blameless 1:1 question, and a sound scorecard into nothing at all (MTX-01..06 signals, opaque CSV scope #42, additive v46-&gt;v47 migration, no message or calendar data and no person ever scored)."

    <meta name="leados-scorecard-integrity" content="2026-10-29 · Session 70 · Schema v47: Scorecard Integrity Lab (#/measurement) — model what a declared scorecard will make people do. A closed-form multitask principal–agent equilibrium (Holmström &amp; Milgrom 1991; Baker 1992 distortion; Banker–Datar 1989 LEN risk; Weitzman 1980 ratchet; Kerr 1975 / Campbell 1979 stakes) splits modelled effort into genuine work, cosmetic movement and the uncounted job that stops happening, prices the result against first-best value for the same hours, and searches seven deterministic redesigns (re-weight, paired guardrails, de-stake, measure-the-gap, combinations) ranked by modelled net value after a declared per-metric measurement cost. Committing freezes the prediction and a falsifier margin; a later human recorded observation scores it, and calibration is refused below three observations. RULE-MTX-01 opens exactly one DACI redesign decision, at most two owned tasks and one blameless 1:1 question; RULE-MTX-02 opens one calibration decision and a pre-filled review on a falsified prediction; a sound scorecard creates nothing. MTX-01..06 signals, opaque CSV scope #42, additive v46-&gt;v47 migration. No message, calendar, keystroke or sentiment data; no person is ever scored." />

    <meta name="leados-comms-outbox" content="2026-10-27 · Session 50: Stakeholder Comms Outbox (#/comms, Schema v32). Deterministic, template-based drafts generated from facts recorded on an operational case; every gap is shown as an explicit to-confirm item and gates approval; nothing is sent by the app; sent state is recorded by the leader or inferred from a logged stakeholder touch; a resolved case owes closure only to people who were briefed." />
    <meta name="leados-influence-network" content="2026-10-27 · Session 48: Influence Network Intelligence — surveillance-free Organizational Network Analysis derived only from the leader's own typed records. Newman bipartite co-affiliation projection with a relative strong-tie backbone; Freeman/Brandes degree, betweenness & closeness centrality; weighted PageRank influence; Burt structural-hole constraint; Watts–Strogatz clustering; Tarjan articulation points & bridges; Latora–Marchiori efficiency and a deterministic node-removal structural key-person stress test fused with continuity Bus Factor. A deterministic 5-tab SVG terminal (#/network), RULE-ORG-01..05 atomic post-commit fan-out into typed links, a blameless cross-training delegation, a DACI org-design decision, 1:1 talking points and signals, ORG-01..05 signals, CSV scope #31 (no names or free text), additive on Schema v30." />

    <meta name="leados-premise-sentinel" content="2026-10-27 · Session 53 Premise Sentinel / Assumption Ledger (#/premises, Schema v35): RAND Assumption-Based Planning signposts/shaping/hedging, Bayesian log-odds evidence with half-life decay, Wald-style SPRT boundaries, KL information gain, eight declarative cross-module sensors, RULE-PREM-01..04 on the generalized post-commit spine, one DACI re-decision + verification delegation + blameless 1:1 prompt on breach, Decision Tempo event declaration, typed premise graph, human review cycles, PREM-01..05 signals, opaque CSV scope #35, additive v34-&gt;v35 migration." />
    <meta name="leados-load-governor" content="2026-10-27 · Session 52 Cognitive Load &amp; Attention Governor (#/load, Schema v34): surveillance-free per-role saturation index (utilization 0.40 / WIP 0.25 / coordination 0.20 / commitments 0.15, five bands, leader-owned threshold), seeded Beta-PERT Monte Carlo overload probability with unmeasured-never-zero, per-person Little/Kingman queueing with evidence floors and unstable rho&gt;=1 reported without a fake wait, Brooks channel density, germane ramp protection, RULE-LOAD-01..04 event-driven on the post-commit spine (one four-option DACI shed decision with typed links, self-clearing talking points, pauseable, explicit scan always runs), LOAD-01..05 signals, opaque CSV scope #34, additive v33-&gt;v34 migration with zero new collections." />
    <meta name="leados-allocation-governor" content="2026-10-27 · Session 51 Allocation Governor (#/allocation, Schema v33): explore-vs-exploit terminal over the operating-plan portfolio — Nagji &amp; Tuff ambition horizons, UCB1 arms learned from settled delivery actuals (currency-segmented, counts-only below n=5, unobserved never zero), funded-flow exploration-starvation detection that opens one DACI rebalancing decision (RULE-ALLOC-01..04), ALLOC-01..05 signals, CSV scope #33. Also: blank FMEA ratings now persist as honestly unrated, and store.lastPropagations is wired so action results report real cross-module propagations." />

    <meta name="leados-capital-allocation" content="2026-10-28 · Session 58 · Schema v38: Structural Capital Allocation (#/capital) — a fixed effort-week budget allocated across six structural levers by marginal return on the binding constraint (capital budgeting, bounded integer allocation, pairwise complementarity pass), exact Shapley attribution over every coalition of funded levers, substitute/complement pair interactions, seeded Savage minimax regret against the named playbooks and doing nothing (32 lognormal parameter draws), and a trust ladder that only calls a recommendation actionable after out-of-sample validation. The do-nothing baseline is frozen with the prediction at adoption, RULE-SCA-01..04 open one DACI commitment decision priced by Decision Tempo in the same transaction, one owned out-of-sample checkpoint, typed checkpoint scoring lineage and a re-baselining decision when pooled skill turns negative; SCA-01..05 signals, opaque CSV scope #39, a deterministic board brief, and additive v37-&gt;v38 migration." />

    <meta name="leados-propagation-ledger" content="2026-10-28 · Session 61 · Schema v41 · ADR-0026: The Propagation Ledger (#/propagation). The generalized post-commit spine now measures and prices itself. Every (rule, event) pair records an outcome and a duration, so a leader can see that one write attempted 42 rule invocations, that 5 applied, and which two rules account for most of the wall clock — instead of being told only that 'automation propagated 6 things'. Copy-on-write savepoints replace the whole-workspace deep copy that ran before each rule (a rule that declines its event-type guard now copies nothing); decline collapse skips a re-run only when the rule already produced no write, no emission, no audit entry, no warning and no effect at an unchanged workspace version, and only for rules whose decline verdict has been proven independent of which entity the event named (tests/app/propagation-ledger.test.mjs probes it, so an unproven rule is never skipped). Durable propagation receipts persist a failed rule with the event that caused it, and can be re-run against current state — a rolled-back propagation is no longer a toast that disappears. Measured on the demo workspace: 1.7x on a single case.created and 6.8x on a four-event cascade at 362 records; 1.4x and 4.3x at 5,792 records. These are this machine's timings, not a general performance guarantee." />
    <meta name="leados-early-warning" content="2026-10-28 · Session 60 · Schema v40: Watch uses nominal step-up screening, not verified FDR control; a human-confirmed response can cascade through typed case, decision, delegation, goal, capacity, tempo and unsent comms links. Whole future-week forecasts capture first observations; legacy/demo and late captures are excluded from descriptive per-series skill." />
    <meta name="leados-after-action" content="2026-10-28 · Session 63 · Schema v43: The After-Action Review &amp; Learning Ledger (#/learning). Every other LeadOS terminal measures the work; this one measures whether the team converts what happened into a change in how it works. A review holds the four AAR questions (what was supposed to happen, what happened, why, what we keep, what changes), and the two evidence questions arrive pre-filled from the record that froze them at the time — a case's opening forecast snapshot and its settled actuals, a decision's recorded probability and its outcome — so the review cannot become a hindsight story. A lesson must name a class (estimation, scope, dependency, decision, escalation, quality, staffing, communication, process, premise) because recurrence is the only outcome measure learning has, and it must say what changes; 'nothing' is a first-class answer stored as an observation and never counted as learning. A change is only ever marked applied with a dated human note saying what is now different — closing the related delegation is not evidence. Recurrence is counted across distinct events, and the finding no other tool prints is a class that repeats while the change committed after the first sighting was never made; RULE-AAR-03 opens exactly one close-or-drop decision per class rather than one per event. RULE-AAR-01 drafts one review from the closing record the moment work ends (no cause, no lesson, no decision), RULE-AAR-02 turns a committed change into one owned delegation or DACI decision plus a blameless follow-up talking point, all inside the same atomic transaction on the shared post-commit spine. Coverage, latency and the applied rate are printed with their denominators; below three dated closures there is no percentage at all, and the composite index is withheld below two measurable components. Nothing rates a person: a lesson names a system, a decision or a practice. Additive v42-&gt;v43 migration that invents no review; no CSV scope, because the free text here is the most sensitive prose in the workspace." />
    <meta name="leados-strategy-coherence" content="2026-10-28 · Session 62 · Schema v42: The Strategy Coherence Terminal (#/strategy). The first LeadOS module that measures the distance between the strategy a leader declared and the work their own records say is funded. A bet carries a Rumelt kernel (diagnosis, guiding policy, coherent action), an explicit share of effort, at least one declared refusal (Porter's negative-space test) and a dated stop rule (falsifiability). Open records in cases, goals, delegations, plan items, decisions and changes are tagged to a bet; declared and measured shares are compared as a total variation distance in percentage points with the exact bounds 0 and 100 and no invented alignment score. A vintage boundary excludes work that predates the first adopted bet — relabelling history cannot improve the gap — and the terminal's own governance records are excluded so opening a rebalancing decision cannot worsen the gap it exists to close. Shares are effort-weighted only when at least half the tags carry an effort estimate; otherwise they count records and say so, and an unestimated tag is counted as one record, never as zero effort. Per-bet falsifiability is graded on six named checks; a stop-rule date passes without a verdict into exactly one DACI retire-or-renew decision rather than a silent retirement. RULE-SCO-01..04 on the shared post-commit spine: adoption fans out into a commitment decision (priced by Decision Tempo in the same transaction when a value at stake exists), an owned tagging delegation and a blameless 1:1 talking point; a say&#8211;do gap over the workspace convention opens one rebalancing decision with the over- and under-funded bets named; a bet without a dated stop rule gets one owned delegation; an overdue rule opens one retire-or-renew decision. SCO-01..06 signals, a deterministic plain-text board brief, and an additive v41-&gt;v42 migration that invents neither a bet nor a historical tag. There is deliberately no CSV export scope for this terminal yet: the numbers are only meaningful beside the declarations that produced them, and exporting the gap without them would be a claim without its evidence." />
