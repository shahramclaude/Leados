<script>
'use strict';
/* ===========================================================================
   SECTION 0 — CONSTANTS
   DOMAINS, DECAY, CORRELATION_WINDOW_DAYS, DECISION_STALENESS_DAYS are
   VERIFIED this session by re-fetching (3 independent mirrors, consistent):
   raw.githubusercontent.com/wbweve/Leados/main/src/lib/types.ts exports
   DOMAINS=["people","finance","ops","strategy","legal","product"];
   .../src/lib/core.ts defines DECAY=0.85, CORRELATION_WINDOW_DAYS=90,
   DECISION_MAX_OPEN_DAYS=21. Those two files' own header comments disclose
   they were themselves written by a prior AI session "from the pasted
   brief" — so "verified" means "verified this disclosed fabrication exists
   with this exact value in the repo," not "verified as the real product's
   logic." See AI-SESSION-LOG.md §0.
   =========================================================================== */
var DOMAINS = ['people','finance','ops','strategy','legal','product'];
var DECAY = 0.85;
var CORRELATION_WINDOW_DAYS = 90;
var DECISION_STALENESS_DAYS = 21;
var SCHEMA_VERSION = 1;
var LINEAGE = 'pt-j';
// Distinct key, deliberately — carried forward unchanged from the prior
// session (verified: this is the exact key already committed at
// github.com/wbweve/Leados/index.html). The real repo independently uses
// at least three other keys across its own disclosed sessions
// (leados-pt-i:data, leados-moment:data, and two more named only in a
// comment). This build does not introduce a fifth key for Parts 2/3 —
// the new aesthetics/familiarity state is either session-scoped
// (sessionStorage, its own namespaced key, matching the Part 3 brief's
// own instruction that familiarity resets each session) or folded into
// this same st.meta object as additive, defaulted fields.
var STORAGE_KEY = 'leados-pt-j:data';
var FAMILIARITY_KEY = 'leados-pt-j:familiarity'; // sessionStorage, Part 3
var FAMILIARITY_NOTIFIED_KEY = 'leados-pt-j:familiarity-notified'; // sessionStorage, Part 3

/* ===========================================================================
   SECTION 1 — STORE (append-only event log)
   =========================================================================== */
function emptyState(){ return { meta:{ schemaVersion:SCHEMA_VERSION, lineage:LINEAGE, idSeq:0, createdAt:null, densityMode:'STANDARD' }, people:[], events:[] }; }
function normalize(st){
  st = (st && typeof st==='object') ? st : {};
  st.meta = (st.meta && typeof st.meta==='object') ? st.meta : {};
  if (typeof st.meta.schemaVersion !== 'number') st.meta.schemaVersion = SCHEMA_VERSION;
  st.meta.lineage = LINEAGE;
  if (typeof st.meta.idSeq !== 'number') st.meta.idSeq = 0;
  // Part 2 addition: densityMode is a UI preference, not a business event —
  // stored directly on meta (like idSeq/createdAt already were), not routed
  // through appendEvent/validators. Defaulted so old saved states still load.
  if (['COMPACT','STANDARD','COMFORTABLE','READING'].indexOf(st.meta.densityMode)===-1) st.meta.densityMode = 'STANDARD';
  st.people = Array.isArray(st.people) ? st.people : [];
  st.events = Array.isArray(st.events) ? st.events : [];
  return st;
}
function load(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return emptyState();
    return normalize(JSON.parse(raw));
  }catch(e){ return emptyState(); }
}
function save(st){ localStorage.setItem(STORAGE_KEY, JSON.stringify(st)); }
function mint(st, prefix){ st.meta.idSeq = (st.meta.idSeq||0) + 1; return prefix + st.meta.idSeq; }

/* ===========================================================================
   SECTION 2 — DATA INVARIANTS + EVENT VALIDATORS (run before append)
   =========================================================================== */
var DATA_INVARIANTS = [
  { name:'meta.schemaVersion is a number', check:function(st){ return typeof st.meta.schemaVersion === 'number'; } },
  { name:'meta.lineage === "pt-j"', check:function(st){ return st.meta.lineage === 'pt-j'; } },
  { name:'people is an array', check:function(st){ return Array.isArray(st.people); } },
  { name:'events is an array', check:function(st){ return Array.isArray(st.events); } },
  { name:'no person reportsTo itself', check:function(st){ return st.people.every(function(p){ return p.reportsTo !== p.id; }); } },
  { name:'event timestamps are parseable', check:function(st){ return st.events.every(function(e){ return !isNaN(new Date(e.ts).getTime()); }); } }
];
function checkInvariants(st){ return DATA_INVARIANTS.filter(function(inv){ return !inv.check(st); }).map(function(inv){ return inv.name; }); }

var EVENT_VALIDATORS = {
  'person.added': function(d){ if(!d.name) return 'name required'; return null; },
  'signal.raised': function(d){
    if (DOMAINS.indexOf(d.domain)===-1) return 'domain must be one of '+DOMAINS.join(', ');
    if (typeof d.severity!=='number' || d.severity<1 || d.severity>5) return 'severity must be 1-5';
    if (!d.title) return 'title required';
    return null;
  },
  'decision.logged': function(d){
    if (!d.title) return 'title required';
    if (typeof d.risk!=='number' || d.risk<0 || d.risk>10) return 'risk must be 0-10';
    if (typeof d.confidence!=='number' || d.confidence<0 || d.confidence>1) return 'confidence must be 0-1';
    return null;
  },
  'decision.outcome': function(d){ if(!d.decisionId) return 'decisionId required'; return null; },
  'commitment.made': function(d){
    if (!d.desc) return 'desc required';
    if (!d.by_date || isNaN(new Date(d.by_date).getTime())) return 'by_date must be a valid date';
    return null;
  },
  'commitment.resolved': function(d){ if(!d.commitmentId) return 'commitmentId required'; return null; },
  'signal.resolved': function(d){ if(!d.signalId) return 'signalId required'; return null; }
};
function validate(type, data){ var v = EVENT_VALIDATORS[type]; return v ? v(data) : null; }
function appendEvent(st, type, data){
  var err = validate(type, data);
  if (err) return { ok:false, error: err };
  var ev = { id: mint(st,'e'), ts: new Date().toISOString(), type: type, data: data };
  st.events.push(ev);
  if (!st.meta.createdAt) st.meta.createdAt = ev.ts;
  save(st);
  return { ok:true, event: ev };
}
function addPerson(st, data){
  var p = { id: mint(st,'p'), name:(data.name||'').trim()||'(unnamed)', role:data.role||'', createdAt:new Date().toISOString() };
  st.people.push(p); save(st); return p;
}

/* ===========================================================================
   SECTION 3 — PROJECTION (recomputed from the raw event log every call;
   nothing derived is cached in the store — append-only discipline)
   =========================================================================== */
function days(aIso,bIso){ return (Date.parse(bIso)-Date.parse(aIso))/86400000; }
function project(events){
  var resolved = {}; events.filter(function(e){return e.type==='signal.resolved';}).forEach(function(e){ resolved[e.data.signalId]=true; });
  var findings = events.filter(function(e){ return e.type==='signal.raised' && !resolved[e.id]; })
    .map(function(e){ return { key:'signal:'+e.id, id:e.id, domain:e.data.domain, sev:e.data.severity, ts:e.ts, title:e.data.title, note:e.data.note||'' }; });

  var decisionById = {}; var decisions = [];
  events.filter(function(e){return e.type==='decision.logged';}).forEach(function(e){
    var d = { id:e.id, title:e.data.title, domain:e.data.domain||'org', ts:e.ts, risk:e.data.risk, confidence:e.data.confidence, reversible:!!e.data.reversible, urgent:!!e.data.urgent, outcome:null };
    decisionById[d.id]=d; decisions.push(d);
  });
  events.filter(function(e){return e.type==='decision.outcome';}).forEach(function(e){
    var d = decisionById[e.data.decisionId]; if (d){ d.outcome = e.data.outcome; }
  });
  var openDecisions = decisions.filter(function(d){ return !d.outcome; });

  var commitmentById = {}; var commitments = [];
  events.filter(function(e){return e.type==='commitment.made';}).forEach(function(e){
    var c = { id:e.id, desc:e.data.desc, by_date:e.data.by_date, ts:e.ts, resolved:false };
    commitmentById[c.id]=c; commitments.push(c);
  });
  events.filter(function(e){return e.type==='commitment.resolved';}).forEach(function(e){
    var c = commitmentById[e.data.commitmentId]; if(c) c.resolved = true;
  });
  var openCommitments = commitments.filter(function(c){ return !c.resolved; });

  return { events:events, findings:findings, decisions:decisions, decisionById:decisionById, openDecisions:openDecisions,
           commitments:commitments, openCommitments:openCommitments };
}

/* ===========================================================================
   SECTION 4 — ORG PHYSICS (domain heatmap / velocity / entropy)
   FORMULA SHAPE carried forward from the disclosed-fabricated
   src/lib/physics.ts (verified this session by raw fetch: weight =
   severity * DECAY^ageDays, score = sum of weights clamped to 10). That
   file's own header already discloses it is not the real product's logic.
   =========================================================================== */
function domainMath(domain, P, asOf){
  var asOfIso = asOf.toISOString ? asOf.toISOString() : asOf;
  var rows = P.findings.filter(function(f){ return f.domain===domain; }).map(function(f){
    var age = Math.max(0, days(f.ts, asOfIso));
    var weight = f.sev * Math.pow(DECAY, age);
    return { key:f.key, sev:f.sev, ageDays: Math.round(age*10)/10, weight:weight, title:f.title };
  });
  var raw = rows.reduce(function(a,r){ return a+r.weight; }, 0);
  return { domain:domain, score: Math.min(10, Math.round(raw*10)/10), rows: rows };
}
function heatmap(P, asOf){ var out={}; DOMAINS.forEach(function(d){ out[d]=domainMath(d,P,asOf); }); return out; }
function measureVelocity(domain, P, today, lookback){
  lookback = lookback || 30;
  var now = domainMath(domain, P, today);
  var past = domainMath(domain, P, new Date(today.getTime() - lookback*86400000));
  var perDay = (now.score - past.score)/lookback;
  return { perDay: Math.round(perDay*1000)/1000, projection30d: Math.round((now.score+perDay*30)*10)/10 };
}
function measureOrgEntropy(P){
  var indicators = [];
  var totalDecisions = P.decisions.length;
  if (totalDecisions>0) indicators.push({ name:'Decision entropy', value: P.openDecisions.length/totalDecisions });
  var totalCommits = P.commitments.length;
  if (totalCommits>0){
    var overdue = P.commitments.filter(function(c){ return !c.resolved && days(c.by_date, new Date().toISOString())>0; }).length;
    indicators.push({ name:'Commitment entropy', value: overdue/totalCommits });
  }
  var composite = indicators.length ? indicators.reduce(function(a,b){return a+b.value;},0)/indicators.length : 0;
  return { compositeEntropy: Math.round(composite*100), indicators: indicators,
           interpretation: composite<0.3?'low — org is tracking its own commitments':composite<0.6?'moderate':'high — follow-through is slipping' };
}
// Part 3 reuses this exact, already-disclosed decay formula per-finding
// (rather than inventing a second "confidence/score" math), so the
// NOVEL/LEARNING card's "score math" line is the same verified-fabricated
// arithmetic as the Domains view, not a new fabrication.
function findingWeight(f, today){
  var age = Math.max(0, days(f.ts, today.toISOString()));
  return { ageDays: Math.round(age*10)/10, weight: Math.round(f.sev*Math.pow(DECAY,age)*100)/100 };
}

/* ===========================================================================
   SECTION 5 — DECISION SURFACE
   FABRICATED quadrant model — not found under any name in the real repo.
   =========================================================================== */
function classifyDecision(d){
  var risk = d.risk||0, rev = !!d.reversible, urg = !!d.urgent;
  if (risk>=7 && !rev && urg) return 'CRISIS_DECIDE';
  if (risk>=7 && !rev && !urg) return 'DELIBERATE';
  if (rev && urg) return 'FAST_CHEAP';
  return 'DELEGATE_OR_DEFER';
}

/* ===========================================================================
   SECTION 6 — SYNTHESIS (generated only on explicit click / Cmd-Enter)
   FABRICATED text generation, disclosed. Persisted as an append-only
   synthesis.generated event; eventCountAtGeneration snapshotted BEFORE
   the append so the staleness badge is correct.
   =========================================================================== */
function generateSynthesisPayload(P, today){
  var findings = P.findings.slice().sort(function(a,b){ return b.sev-a.sev; });
  var top = findings.slice(0,5);
  var entropy = measureOrgEntropy(P);
  var momentText = findings.length===0
    ? 'No open findings. This is either genuine calm or a sign the signal pipeline has gone quiet — check the Log.'
    : 'The sharpest open finding is "'+findings[0].title+'" ('+findings[0].domain+', sev '+findings[0].sev+'). '+
      'Org entropy reads '+entropy.compositeEntropy+'/100 ('+entropy.interpretation+'). '+
      top.length+' finding(s) are feeding this read.';
  var hardQuestion = findings.length
    ? 'If you could only fix one thing this week, would it be "'+findings[0].title+'", or the thing you are avoiding because it has no open finding yet?'
    : 'What would have to be true for you to trust that silence right now actually means "no problems"?';
  return { momentText: momentText, five: top, hardQuestion: hardQuestion };
}

/* ===========================================================================
   SECTION 7 — LEADOS.cssolver  (brief PART 1)
   RECONSTRUCTED this session (see file header) to match the documented
   behavior and the call signatures used elsewhere in this file
   (solve, generateCSS, contrastRatio, hexToLch, lchDistance, fittsMs,
   DOMAIN_COLORS, SEVERITY_COLORS, CONSTRAINTS, lastSolution).

   HONESTY LABEL: a SIMPLIFIED constraint solver — node consistency
   (clamp each var into [lo,hi] + data-dependent preferred value) plus ONE
   real arc-consistency repair loop (cardHeight × visibleCount +
   gap × (visibleCount-1) <= availableListHeight, 0.55 × viewport.height),
   not a general backtracking CSP engine. WCAG contrast, CIE Lab/LCH, and
   Fitts' Law functional form are real public formulas (VERIFIED, re-derived
   here). Fitts' a/b regression constants, the 200px travel assumption, and
   the chroma-as-"arousal" proxy are FABRICATED, labeled at point of use.
   =========================================================================== */
var LEADOS = window.LEADOS || {};
LEADOS.cssolver = (function(){
  var DOMAIN_COLORS = { people:'#2e5c48', finance:'#8a3324', ops:'#1f5f8b', strategy:'#92661c', legal:'#5b3e8a', product:'#1c7a72' };
  var SEVERITY_COLORS = { 1:'#6b7a6f', 2:'#7a7a4a', 3:'#92661c', 4:'#b5451f', 5:'#c21f1f' };

  var CONSTRAINTS = {
    cardHeight: { lo:64, hi:160 },          // WCAG-irrelevant, content-driven
    gap: { lo:6, hi:16 },
    buttonSize: { lo:24, hi:44 },           // VERIFIED: WCAG 2.5.8 (24px AA) .. 2.5.5 (44px AAA)
    scoreFont: { lo:11, hi:13 },
    titleFont: { lo:14, hi:16 },
    bodyFont: { lo:12, hi:13 },
    labelFont: { lo:10, hi:12 },
    railWidth: { lo:160, hi:220 },
    panelWidth: { lo:260, hi:340 },
    columnMax: { lo:760, hi:1040 },
    sectionGap: { lo:14, hi:28 },
    cardPadding: { lo:8, hi:16 }
  };

  function clamp(v,lo,hi){ return Math.max(lo, Math.min(hi, v)); }

  function hexToRgb(hex){
    hex = hex.replace('#','');
    if (hex.length===3) hex = hex.split('').map(function(c){return c+c;}).join('');
    var n = parseInt(hex,16);
    return { r:(n>>16)&255, g:(n>>8)&255, b:n&255 };
  }
  // ---- WCAG contrast (VERIFIED formula: relative luminance, WCAG 2.x) ----
  function relLumChannel(c){ c=c/255; return c<=0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4); }
  function luminance(hex){ var rgb=hexToRgb(hex); return 0.2126*relLumChannel(rgb.r)+0.7152*relLumChannel(rgb.g)+0.0722*relLumChannel(rgb.b); }
  function contrastRatio(hex1, hex2){
    var l1=luminance(hex1), l2=luminance(hex2);
    var lighter=Math.max(l1,l2), darker=Math.min(l1,l2);
    return (lighter+0.05)/(darker+0.05);
  }
  // ---- CIE sRGB -> XYZ -> Lab -> LCH, D65 (VERIFIED public formulas) ----
  function srgbToLinear(c){ c=c/255; return c<=0.04045 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4); }
  function hexToXyz(hex){
    var rgb=hexToRgb(hex);
    var r=srgbToLinear(rgb.r), g=srgbToLinear(rgb.g), b=srgbToLinear(rgb.b);
    return {
      x: (r*0.4124564+g*0.3575761+b*0.1804375)*100,
      y: (r*0.2126729+g*0.7151522+b*0.0721750)*100,
      z: (r*0.0193339+g*0.1191920+b*0.9503041)*100
    };
  }
  function xyzToLab(xyz){
    var Xn=95.047, Yn=100, Zn=108.883;
    function f(t){ return t>0.008856 ? Math.cbrt(t) : (7.787*t+16/116); }
    var fx=f(xyz.x/Xn), fy=f(xyz.y/Yn), fz=f(xyz.z/Zn);
    return { l:116*fy-16, a:500*(fx-fy), b:200*(fy-fz) };
  }
  function labToLch(lab){
    var c = Math.sqrt(lab.a*lab.a+lab.b*lab.b);
    var h = Math.atan2(lab.b, lab.a)*180/Math.PI; if (h<0) h+=360;
    return { l:lab.l, c:c, h:h };
  }
  function hexToLch(hex){ return labToLch(xyzToLab(hexToXyz(hex))); }
  function lchToLab(lch){ var rad=lch.h*Math.PI/180; return { l:lch.l, a:lch.c*Math.cos(rad), b:lch.c*Math.sin(rad) }; }
  function lchDistance(a,b){
    var la=lchToLab(a), lb=lchToLab(b);
    return Math.sqrt(Math.pow(la.l-lb.l,2)+Math.pow(la.a-lb.a,2)+Math.pow(la.b-lb.b,2)); // CIE76 ΔE, symmetric by construction
  }
  // ---- Fitts' Law (VERIFIED functional form; a,b FABRICATED illustrative constants) ----
  function fittsMs(width, distance){
    var a=50, b=100; // FABRICATED: not measured for this UI
    return a + b*Math.log2(Math.max(0,distance)/Math.max(1,width) + 1);
  }

  function arcRepair(cardHeight, gap, visibleCount, availableHeight){
    var iterations=0;
    function used(ch,gp){ return ch*visibleCount + gp*Math.max(0,visibleCount-1); }
    while (used(cardHeight,gap) > availableHeight && iterations<50){
      if (gap > CONSTRAINTS.gap.lo){ gap = Math.max(CONSTRAINTS.gap.lo, gap-1); }
      else if (cardHeight > CONSTRAINTS.cardHeight.lo){ cardHeight = Math.max(CONSTRAINTS.cardHeight.lo, cardHeight-2); }
      else break;
      iterations++;
    }
    return { cardHeight:cardHeight, gap:gap, iterations:iterations };
  }

  function solve(viewport, data){
    viewport = viewport || { width: (typeof window!=='undefined'?window.innerWidth:1440), height:(typeof window!=='undefined'?window.innerHeight:900) };
    data = data || { findingCount: 0 };
    var n = data.findingCount||0;

    var cardHeightDomain = { lo:CONSTRAINTS.cardHeight.lo, hi:clamp(Math.round(viewport.height*0.22), CONSTRAINTS.cardHeight.lo, CONSTRAINTS.cardHeight.hi) };
    var preferredCardHeight = clamp(cardHeightDomain.hi - Math.min(n,20)*3, cardHeightDomain.lo, cardHeightDomain.hi);
    var gapDomain = CONSTRAINTS.gap;
    var preferredGap = clamp(Math.round(gapDomain.hi - Math.min(n,10)*0.6), gapDomain.lo, gapDomain.hi);

    var visibleCount = Math.max(1, Math.min(8, n||1));
    var availableListHeight = viewport.height*0.55; // matches the originally-committed G_ARC_CONSTRAINT health check

    var repaired = arcRepair(preferredCardHeight, preferredGap, visibleCount, availableListHeight);

    var buttonDomain = CONSTRAINTS.buttonSize;
    var buttonSize = clamp(viewport.width<380 ? 36 : 44, buttonDomain.lo, buttonDomain.hi);

    var scoreFont = clamp(13-Math.floor(n/8), CONSTRAINTS.scoreFont.lo, CONSTRAINTS.scoreFont.hi);
    var titleFont = clamp(16-Math.floor(n/10), CONSTRAINTS.titleFont.lo, CONSTRAINTS.titleFont.hi);
    var bodyFont = clamp(13-Math.floor(n/12), CONSTRAINTS.bodyFont.lo, CONSTRAINTS.bodyFont.hi);
    var labelFont = CONSTRAINTS.labelFont.lo+1;

    var railWidth = viewport.width<900 ? CONSTRAINTS.railWidth.lo : CONSTRAINTS.railWidth.hi-20;
    var panelWidth = clamp(Math.round(viewport.width*0.22), CONSTRAINTS.panelWidth.lo, CONSTRAINTS.panelWidth.hi);
    var columnMax = clamp(Math.round(viewport.width*0.68), CONSTRAINTS.columnMax.lo, CONSTRAINTS.columnMax.hi);
    var sectionGap = clamp(Math.round(viewport.height*0.024), CONSTRAINTS.sectionGap.lo, CONSTRAINTS.sectionGap.hi);
    var cardPadding = clamp(16-Math.floor(n/10), CONSTRAINTS.cardPadding.lo, CONSTRAINTS.cardPadding.hi);

    var fittsAcquisitionMs = Math.round(fittsMs(buttonSize, 200)); // FABRICATED: 200px assumed travel distance
    var cardsPerSaccade = Math.round((220/(repaired.cardHeight+repaired.gap))*10)/10; // FABRICATED: 220px assumed saccade range

    var contrasts = [ contrastRatio('#16140f','#f7f5ef'), contrastRatio('#45403a','#fffdf9'), contrastRatio('#f7f5ef','#16140f') ];
    var worstContrastRatio = Math.round(Math.min.apply(null, contrasts)*100)/100;
    var wcagLevel = worstContrastRatio>=7 ? 'AAA' : (worstContrastRatio>=4.5 ? 'AA' : 'FAIL');

    var domainHexes = DOMAINS.map(function(d){ return DOMAIN_COLORS[d]; });
    var minDist = Infinity;
    for (var i=0;i<domainHexes.length;i++){
      for (var j=i+1;j<domainHexes.length;j++){
        var dist = lchDistance(hexToLch(domainHexes[i]), hexToLch(domainHexes[j]));
        if (dist<minDist) minDist = dist;
      }
    }
    var perceptualDistance = Math.round(minDist*10)/10;

    var sevChromas = [1,2,3,4,5].map(function(s){ return hexToLch(SEVERITY_COLORS[s]).c; });
    var arousalMonotonic = sevChromas.every(function(c,i){ return i===0 || c>=sevChromas[i-1]-0.001; });

    var weightRatio = 1.25; // static CSS decision (mono 500 / serif 400), not solver-adjusted

    var checks = {
      fitts_lt_300ms: fittsAcquisitionMs<300,
      scannability_ge_3: cardsPerSaccade>=3,
      contrast_ok: worstContrastRatio>=4.5,
      perceptual_ge_30: perceptualDistance>=30,
      arousal_monotonic: arousalMonotonic,
      weight_ratio_ok: weightRatio>=1.15 && weightRatio<=1.25
    };

    return {
      viewport: viewport,
      cardHeight: repaired.cardHeight, gap: repaired.gap, cardPadding: cardPadding,
      buttonSize: buttonSize, scoreFont: scoreFont, titleFont: titleFont, bodyFont: bodyFont, labelFont: labelFont,
      railWidth: railWidth, panelWidth: panelWidth, columnMax: columnMax, sectionGap: sectionGap,
      cardHeightDomain: cardHeightDomain, buttonDomain: buttonDomain, gapDomain: gapDomain,
      fittsAcquisitionMs: fittsAcquisitionMs, cardsPerSaccade: cardsPerSaccade,
      worstContrastRatio: worstContrastRatio, wcagLevel: wcagLevel,
      perceptualDistance: perceptualDistance, arousalMonotonic: arousalMonotonic, weightRatio: weightRatio,
      checks: checks, arcRepairIterations: repaired.iterations
    };
  }

  function generateCSS(s){
    return (
      ':root{\n'+
      '  --card-height-solved: '+s.cardHeight+'px;\n'+
      '  --card-gap-solved: '+s.gap+'px;\n'+
      '  --card-padding-solved: '+s.cardPadding+'px;\n'+
      '  --button-size-solved: '+s.buttonSize+'px;\n'+
      '  --score-font-solved: '+s.scoreFont+'px;\n'+
      '  --title-font-solved: '+s.titleFont+'px;\n'+
      '  --body-font-solved: '+s.bodyFont+'px;\n'+
      '  --label-font-solved: '+s.labelFont+'px;\n'+
      '  --rail-width-solved: '+s.railWidth+'px;\n'+
      '  --panel-width-solved: '+s.panelWidth+'px;\n'+
      '  --column-max-solved: '+s.columnMax+'px;\n'+
      '  --section-gap-solved: '+s.sectionGap+'px;\n'+
      '  --sev-bar-1: 6px; --sev-bar-2: 9px; --sev-bar-3: 12px; --sev-bar-4: 16px; --sev-bar-5: 20px;\n'+
      '}\n'
    );
  }

  return {
    CONSTRAINTS: CONSTRAINTS, solve: solve, generateCSS: generateCSS,
    contrastRatio: contrastRatio, hexToLch: hexToLch, lchDistance: lchDistance, fittsMs: fittsMs,
    DOMAIN_COLORS: DOMAIN_COLORS, SEVERITY_COLORS: SEVERITY_COLORS, lastSolution: null
  };
})();
window.LEADOS = LEADOS;

/* ===========================================================================
   SECTION 7B — LEADOS.aesthetics  (brief PART 2 — this delivery's own work)
   "The Computational Aesthetics Engine."

   HONESTY LABEL: Weber–Fechner and Miller's "7±2" are real, named
   psychophysics/cognition citations (Weber 1834/Fechner 1860; Miller 1956).
   Applying them to "bits per pixel of a finding list" is THIS BUILD's own
   analogical leap, not a validated HCI finding — FABRICATED application of
   a real citation, disclosed. The "257 bits per finding" figure is an
   invented illustrative constant, not a measured entropy. The Golden Ratio
   spacing scale is real arithmetic (φ=1.6180339887), but the brief's own
   claim that "no two adjacent spacing values will create visual tension"
   is an unfalsifiable aesthetic assertion carried here as a disclosed
   claim, not a provable property — and the brief's own hand-typed comments
   for sp7..sp10 are measurably wrong (rounding arithmetic errors); this
   build computes the true values and documents the discrepancy on
   #/aesthetics rather than silently reproducing the brief's wrong numbers.
   The brief's own optimizeDensity() pseudocode also swaps itself: its
   withinMillerRange.min multiplier (×1.8) produces a LARGER number than
   its .max multiplier (×0.55), i.e. min > max — fixed here (swapped),
   not reproduced broken, same policy as Part 1's two disclosed fixes.
   The Bradford/D65↔D50 chromatic adaptation is named in the brief but not
   actually implemented by its own pseudocode (which just does a flat
   hue-rotate); this build matches what the brief's code actually does,
   not what its prose claims, and labels that gap explicitly.
   =========================================================================== */
LEADOS.aesthetics = (function(){
  var PHI = 1.6180339887;
  var BASE = 4;

  function generateSpacingScale(base){
    var scale = {};
    for (var i=1;i<=10;i++){
      var key = 'sp'+i;
      scale[key] = Math.round(base * Math.pow(PHI, i-1));
    }
    return scale;
  }

  // FABRICATED: bitsPerFinding is an illustrative invented constant, not a
  // measured information-theoretic quantity. Miller's "5-9" is a real,
  // famous citation; its applicability to "cards visible above the fold"
  // is this build's own unverified extrapolation.
  function optimizeDensity(findingCount, viewport, densityMode){
    var targetVisible = 7;
    var aboveFold = viewport.height*0.75;
    var optimalCardHeight = aboveFold/targetVisible;
    var modeMultiplier = { COMPACT:0.7, STANDARD:1.0, COMFORTABLE:1.25, READING:1.5 }[densityMode] || 1.0;
    var adjustedCardHeight = optimalCardHeight/modeMultiplier;
    var bitsPerFinding = 257; // FABRICATED illustrative constant
    var pixelsPerFinding = adjustedCardHeight*viewport.width;
    var density = bitsPerFinding/pixelsPerFinding;
    var visibleCount = Math.max(1, Math.round(aboveFold/adjustedCardHeight));
    // FIX (disclosed): the brief's own min/max multipliers (1.8 for "min",
    // 0.55 for "max") produce min > max; the intent (5 cards sparse .. 9
    // cards dense) is preserved by swapping which multiplier feeds which key.
    var millerMin = Math.round(aboveFold/optimalCardHeight*0.55);
    var millerMax = Math.round(aboveFold/optimalCardHeight*1.8);
    return {
      cardHeight: Math.round(adjustedCardHeight),
      density: density,
      visibleCount: visibleCount,
      findingCount: findingCount,
      withinMillerRange: { min: millerMin, max: millerMax }
    };
  }

  function computeFindingDistribution(P){
    var total = P.findings.length;
    var critical = P.findings.filter(function(f){ return f.sev>=4; }).length;
    return { critical: critical, total: total };
  }

  // Bradford/D50 chromatic adaptation is NAMED in the brief's prose but its
  // own pseudocode never implements it — it only computes a flat CSS
  // hue-rotate/saturate filter. This build implements exactly what the
  // brief's code does (disclosed), not the fuller claim in its prose.
  function adaptChroma(timeOfDay, findingDistribution){
    var timeHour = timeOfDay.getHours();
    var kelvin = timeHour<6?2700 : timeHour<9?4000 : timeHour<17?6500 : timeHour<20?4000 : 2700;
    var whiteShift = (kelvin-6500)/6500;
    var hueShift = whiteShift*-3; // ±3° max, below single-fixation JND (asserted, not measured)
    var pct = findingDistribution.total>0 ? findingDistribution.critical/findingDistribution.total : 0;
    var redDesaturation = pct>0.4 ? (pct-0.4)*20 : 0; // max 12% at pct=1.0
    var sat = (100-redDesaturation).toFixed(1);
    return {
      kelvin: kelvin, timeHour: timeHour, hueRotate: Math.round(hueShift*10)/10, saturationAdjust: -redDesaturation,
      cssFilter: 'hue-rotate('+hueShift.toFixed(1)+'deg) saturate('+sat+'%)',
      label: 'Chromatic adaptation: '+kelvin+'K at '+timeHour+':00. Filter: hue-rotate '+hueShift.toFixed(1)+'° · saturate '+sat+'%. Labeled: subtle adaptation, not color correction.'
    };
  }

  var auditLog = []; // SIMPLIFIED (disclosed): the brief calls this
  // "LEADOS.store.auditLive", implying it is persisted in the append-only
  // store. This build keeps it in volatile session memory only, so that
  // stylesheet-regeneration telemetry never pollutes the real business
  // event log (which Part 1's non-negotiables require to stay append-only
  // and business-meaningful). Visible on #/aesthetics; lost on reload.

  function generateLivingStylesheet(P, today, viewport, behavior){
    behavior = behavior || { preferredDensity:'STANDARD' };
    var spacing = generateSpacingScale(BASE);
    var density = optimizeDensity(P.findings.length, viewport, behavior.preferredDensity);
    var chromatic = adaptChroma(new Date(today), computeFindingDistribution(P));

    var css =
      '/* LeadOS Generated Stylesheet — Part 2 (LEADOS.aesthetics) */\n'+
      '/* Generated: '+today+' */\n'+
      '/* Viewport: '+viewport.width+'x'+viewport.height+' */\n'+
      '/* Findings: '+density.visibleCount+' visible of '+density.findingCount+' */\n'+
      '/* Information density (FABRICATED units): '+density.density.toFixed(4)+' bits/pixel */\n'+
      ':root{\n'+
      '  --sp-phi-1: '+spacing.sp1+'px; --sp-phi-2: '+spacing.sp2+'px; --sp-phi-3: '+spacing.sp3+'px;\n'+
      '  --sp-phi-4: '+spacing.sp4+'px; --sp-phi-5: '+spacing.sp5+'px; --sp-phi-6: '+spacing.sp6+'px; --sp-phi-7: '+spacing.sp7+'px;\n'+
      '  --card-height-optimal: '+density.cardHeight+'px;\n'+
      '  --visible-finding-count: '+density.visibleCount+';\n'+
      '}\n'+
      'body{ filter: '+chromatic.cssFilter+'; }\n'+
      '/* '+chromatic.label+' */\n'+
      '.fin{ min-height: '+Math.round(density.cardHeight*0.6)+'px; max-height: '+Math.round(density.cardHeight*1.8)+'px; }\n';

    var sheet = document.getElementById('leados-generated');
    if (!sheet){ sheet = document.createElement('style'); sheet.id = 'leados-generated'; document.head.appendChild(sheet); }
    sheet.textContent = css;

    auditLog.push({ ts:new Date().toISOString(), label: viewport.width+'x'+viewport.height+' · '+density.visibleCount+' visible findings' });
    if (auditLog.length>20) auditLog.shift();

    return { spacing:spacing, density:density, chromatic:chromatic, css:css };
  }

  return {
    PHI: PHI, generateSpacingScale: generateSpacingScale, optimizeDensity: optimizeDensity,
    adaptChroma: adaptChroma, computeFindingDistribution: computeFindingDistribution,
    generateLivingStylesheet: generateLivingStylesheet, auditLog: auditLog, lastResult: null
  };
})();

/* ===========================================================================
   SECTION 7C — LEADOS.familiarity  (brief PART 3 — this delivery's own work)
   "Familiarity-Adaptive Components."

   HONESTY LABEL: the underlying "Finding" schema in this build (domain,
   sev, title, ts, note) has no native "basis lines / confidence / score
   math" fields — that richer shape belongs to a different, not-verified
   product model referenced only in the brief. Rather than inventing a
   second parallel data schema, NOVEL/LEARNING cards reuse the same
   decay-weighted score math already used on #/domains (findingWeight(),
   Section 4) as their "score math" line, and show a disclosed, explicitly
   FABRICATED confidence proxy (derived from severity, not a measured
   model confidence). SIMPLIFIED: the brief's "basis lines FADE over 600ms
   while the card HEIGHT COLLAPSES" assumes persistent DOM nodes; this
   build re-renders the whole view on every store change (innerHTML
   replace, same as Part 1's render()), so a true cross-render height
   morph is not implemented — a CSS fade-in on the new compact card plus a
   toast notification is substituted, disclosed as a simplification of the
   brief's fuller transition spec.
   =========================================================================== */
LEADOS.familiarity = (function(){
  function readMap(){ try{ return JSON.parse(sessionStorage.getItem(FAMILIARITY_KEY)||'{}'); }catch(e){ return {}; } }
  function readNotified(){ try{ return JSON.parse(sessionStorage.getItem(FAMILIARITY_NOTIFIED_KEY)||'[]'); }catch(e){ return []; } }
  var seen = readMap();
  var notified = readNotified();
  var LEVELS = ['NOVEL','LEARNING','FAMILIAR','HABITUATED'];

  function record(key){
    seen[key] = (seen[key]||0)+1;
    sessionStorage.setItem(FAMILIARITY_KEY, JSON.stringify(seen));
  }
  function sessionLevel(key){
    var c = seen[key]||0;
    if (c===0) return 'NOVEL';
    if (c<3) return 'LEARNING';
    if (c<10) return 'FAMILIAR';
    return 'HABITUATED';
  }
  function crossSessionLevel(key, P){
    var suppressions = P.events.filter(function(e){
      return (e.type==='signal.resolved') && ('signal:'+e.data.signalId===key);
    }).length;
    var total = suppressions;
    if (total===0) return 'NOVEL';
    if (total<3) return 'LEARNING';
    if (total<8) return 'FAMILIAR';
    return 'HABITUATED';
  }
  function effectiveLevel(key, P){
    var a = sessionLevel(key), b = crossSessionLevel(key, P);
    return LEVELS[Math.max(LEVELS.indexOf(a), LEVELS.indexOf(b))];
  }
  function wasNotified(key){ return notified.indexOf(key)!==-1; }
  function markNotified(key){ notified.push(key); sessionStorage.setItem(FAMILIARITY_NOTIFIED_KEY, JSON.stringify(notified)); }
  function reset(){
    seen = {}; notified = [];
    sessionStorage.removeItem(FAMILIARITY_KEY);
    sessionStorage.removeItem(FAMILIARITY_NOTIFIED_KEY);
  }
  return { record:record, level:effectiveLevel, sessionLevel:sessionLevel, crossSessionLevel:crossSessionLevel,
           wasNotified:wasNotified, markNotified:markNotified, reset:reset, LEVELS:LEVELS };
})();

/* ===========================================================================
   SECTION 8 — HEALTH CHECKS (T_* unit / G_* property, run live)
   RECONSTRUCTED (Section 7-era checks) + new checks for Parts 2 and 3.
   =========================================================================== */
function runHealthChecks(st){
  var out = [];
  function add(id,group,label,fn){
    try{ var r=fn(); out.push({id:id,group:group,label:label,pass:!!r.pass,detail:r.detail}); }
    catch(e){ out.push({id:id,group:group,label:label,pass:false,detail:'threw: '+e.message}); }
  }
  var P = project(st.events);
  var today = new Date();

  add('T_INVARIANTS','T','clean state has zero invariant violations', function(){
    var v = checkInvariants(st); return { pass: v.length===0, detail: JSON.stringify(v) };
  });
  add('T_VALIDATOR_SIGNAL','T','signal.raised with severity=9 is rejected', function(){
    var err = EVENT_VALIDATORS['signal.raised']({domain:'ops',severity:9,title:'x'}); return { pass: !!err, detail: String(err) };
  });
  add('T_VALIDATOR_DOMAIN','T','signal.raised with unknown domain is rejected', function(){
    var err = EVENT_VALIDATORS['signal.raised']({domain:'astrology',severity:3,title:'x'}); return { pass: !!err, detail: String(err) };
  });
  add('T_VELOCITY','T','velocity computed correctly from two-point heatmap', function(){
    var synth = project([
      { id:'s1', ts:new Date(today.getTime()-30*86400000).toISOString(), type:'signal.raised', data:{domain:'ops',severity:1,title:'a'} },
      { id:'s2', ts:today.toISOString(), type:'signal.raised', data:{domain:'ops',severity:4,title:'b'} }
    ]);
    var v = measureVelocity('ops', synth, today, 30);
    var manual = Math.round(((domainMath('ops',synth,today).score - domainMath('ops',synth,new Date(today.getTime()-30*86400000)).score)/30)*1000)/1000;
    return { pass: v.perDay===manual, detail:'perDay='+v.perDay+' expected='+manual };
  });
  add('T_QUADRANT','T','high risk + irreversible + urgent -> CRISIS_DECIDE', function(){
    var q = classifyDecision({risk:9, reversible:false, urgent:true}); return { pass: q==='CRISIS_DECIDE', detail:'quadrant='+q };
  });

  var sol = LEADOS.cssolver.solve({width:1440,height:900}, {findingCount:6});
  add('T_SOLVER_BOUNDS','T','all solved layout vars fall within their declared domains', function(){
    var ok = sol.cardHeight>=sol.cardHeightDomain.lo-0.01 && sol.cardHeight<=sol.cardHeightDomain.hi+0.01 &&
             sol.buttonSize>=sol.buttonDomain.lo-0.01 && sol.buttonSize<=sol.buttonDomain.hi+0.01 &&
             sol.gap>=sol.gapDomain.lo-0.01 && sol.gap<=sol.gapDomain.hi+0.01;
    return { pass: ok, detail: JSON.stringify({cardHeight:sol.cardHeight,buttonSize:sol.buttonSize,gap:sol.gap}) };
  });
  add('G_FITTS','G','larger target -> lower Fitts acquisition time (monotonic)', function(){
    var a = LEADOS.cssolver.fittsMs(44,200), b = LEADOS.cssolver.fittsMs(120,200);
    return { pass: b<a, detail: 'fitts(44)='+a.toFixed(1)+'ms fitts(120)='+b.toFixed(1)+'ms' };
  });
  add('G_CONTRAST','G','ink-0 on paper clears WCAG AA/AAA (>=7.0:1 target)', function(){
    var c = LEADOS.cssolver.contrastRatio('#16140f','#f7f5ef'); return { pass: c>=7.0, detail: c.toFixed(2)+':1' };
  });
  add('G_LCH_SYMMETRY','G','LCH perceptual distance is symmetric and non-negative', function(){
    var a = LEADOS.cssolver.hexToLch('#2e5c48'), b = LEADOS.cssolver.hexToLch('#8a3324');
    var d1 = LEADOS.cssolver.lchDistance(a,b), d2 = LEADOS.cssolver.lchDistance(b,a);
    return { pass: Math.abs(d1-d2)<0.001 && d1>=0, detail: 'd(a,b)='+d1.toFixed(2)+' d(b,a)='+d2.toFixed(2) };
  });
  add('G_ARC_CONSTRAINT','G','arc repair keeps card list within available vertical space at findingCount=12, small viewport', function(){
    var s = LEADOS.cssolver.solve({width:1024,height:640}, {findingCount:12});
    var n = Math.max(1, Math.min(8, 12));
    var used = s.cardHeight*n + s.gap*(n-1);
    var avail = 640*0.55;
    return { pass: used<=avail+0.5, detail: 'used='+used.toFixed(1)+' avail='+avail.toFixed(1)+' iterations='+s.arcRepairIterations };
  });
  add('G_AROUSAL','G','severity color chroma is monotonic non-decreasing sev1..sev5', function(){
    return { pass: sol.arousalMonotonic, detail: String(sol.arousalMonotonic) };
  });
  add('G_WEIGHT_RATIO','G','mono/serif font-weight ratio within [1.15,1.25]', function(){
    return { pass: sol.checks.weight_ratio_ok, detail: String(sol.weightRatio) };
  });

  // --- Part 2 checks ---
  add('G_SPACING_GOLDEN_RATIO','G','spacing scale sp3..sp10 consecutive ratios within 2% of φ', function(){
    var sc = LEADOS.aesthetics.generateSpacingScale(4);
    var ok = true, ratios=[];
    for (var i=3;i<=10;i++){
      var r = sc['sp'+i]/sc['sp'+(i-1)]; ratios.push(Math.round(r*1000)/1000);
      if (Math.abs(r-LEADOS.aesthetics.PHI) > 0.02*LEADOS.aesthetics.PHI) ok=false;
    }
    return { pass: ok, detail: 'ratios sp3..sp10='+ratios.join(',')+' (sp1→sp2 intentionally excluded: integer rounding at base=4 makes that one ratio 1.5, not φ — disclosed on #/aesthetics)' };
  });
  add('G_MILLER_RANGE_ORDER','G','optimizeDensity withinMillerRange.min <= .max (brief\\'s own multipliers were swapped; fixed here)', function(){
    var d = LEADOS.aesthetics.optimizeDensity(7, {width:1440,height:900}, 'STANDARD');
    return { pass: d.withinMillerRange.min <= d.withinMillerRange.max, detail: JSON.stringify(d.withinMillerRange) };
  });
  add('G_DENSITY_SANE','G','computed density is positive and visibleCount is a sane small integer', function(){
    var d = LEADOS.aesthetics.optimizeDensity(7, {width:1440,height:900}, 'STANDARD');
    return { pass: d.density>0 && d.visibleCount>=1 && d.visibleCount<=20, detail: 'density='+d.density.toFixed(4)+' visibleCount='+d.visibleCount };
  });
  add('G_HUE_BOUND','G','chromatic hue-rotate stays within the disclosed ±3° bound', function(){
    var c = LEADOS.aesthetics.adaptChroma(new Date(), {critical:1,total:4});
    return { pass: Math.abs(c.hueRotate)<=3.01, detail: c.hueRotate+'deg' };
  });

  // --- Part 3 checks ---
  add('T_FAMILIARITY_THRESHOLDS','T','seen-count -> level thresholds match the brief (0,<3,<10,else)', function(){
    function lv(c){ if(c===0) return 'NOVEL'; if(c<3) return 'LEARNING'; if(c<10) return 'FAMILIAR'; return 'HABITUATED'; }
    var cases=[0,1,2,3,9,10], expect=['NOVEL','LEARNING','LEARNING','FAMILIAR','FAMILIAR','HABITUATED'];
    var ok = cases.every(function(c,i){ return lv(c)===expect[i]; });
    return { pass: ok, detail: cases.map(function(c){return c+':'+lv(c);}).join(', ') };
  });
  add('G_FAMILIARITY_MONOTONIC','G','familiarity level rank is non-decreasing as seen-count increases', function(){
    var order = LEADOS.familiarity.LEVELS;
    function rank(c){ if(c===0) return 0; if(c<3) return 1; if(c<10) return 2; return 3; }
    var counts=[0,1,3,10]; var ranks = counts.map(rank);
    var ok = ranks.every(function(r,i){ return i===0 || r>=ranks[i-1]; });
    return { pass: ok, detail: counts.map(function(c,i){return c+'->'+order[ranks[i]];}).join(', ') };
  });

  return out;
}

      '</div>'+
      '<div class="card p-4">'+
        '<div class="finding-label uppercase mb-2" style="color:var(--ink-2)">Density (mode: '+ST.meta.densityMode+')</div>'+
        '<div class="finding-body">bits/pixel (FABRICATED units): '+res.density.density.toFixed(4)+'</div>'+
        '<div class="finding-body">card height: '+res.density.cardHeight+'px &middot; visible: '+res.density.visibleCount+'</div>'+
        '<div class="finding-body">Miller range (fixed, brief\\'s min/max were swapped): '+res.density.withinMillerRange.min+'&ndash;'+res.density.withinMillerRange.max+'</div>'+
        '<div class="finding-label mt-2" style="color:var(--ink-2)">Chromatic: '+res.chromatic.label+'</div>'+
      '</div>'+
    '</div>'+
    '<div class="mt-4"><div class="finding-label uppercase mb-1" style="color:var(--ink-2)">Generated CSS (injected into &lt;style id="leados-generated"&gt;)</div>'+
    '<pre class="card p-3 mono finding-label overflow-auto" style="white-space:pre-wrap;">'+esc(res.css)+'</pre></div>'+
    '<div class="mt-4"><div class="finding-label uppercase mb-1" style="color:var(--ink-2)">Generation audit (session memory only — SIMPLIFIED, see source comment)</div>'+
    '<div class="card p-3">'+(LEADOS.aesthetics.auditLog.length ? LEADOS.aesthetics.auditLog.slice().reverse().map(function(a){ return '<div class="finding-label">'+fmtDate(a.ts)+' &mdash; '+esc(a.label)+'</div>'; }).join('') : '<div class="finding-label" style="color:var(--ink-2)">none yet</div>')+'</div></div>'+
  '</div>';
}

function renderHealth(st){
  var checks = runHealthChecks(st);
  var tGroup = checks.filter(function(c){return c.group==='T';});
  var gGroup = checks.filter(function(c){return c.group==='G';});
  var violations = checkInvariants(st);
  function list(cs){ return cs.map(function(c){ return '<div class="flex items-center gap-2 py-1 border-b finding-body" style="border-color:var(--line)">'+
    '<span class="'+(c.pass?'badge-ok':'badge-bad')+'">'+(c.pass?'PASS':'FAIL')+'</span>'+
    '<span class="mono finding-label">'+c.id+'</span><span class="flex-1">'+esc(c.label)+'</span>'+
    '<span class="finding-label" style="color:var(--ink-2)">'+esc(c.detail)+'</span></div>'; }).join(''); }
  return '<div class="p-6" id="content">'+
    '<h2 class="text-lg font-semibold mb-2">Invariant check (live store)</h2>'+
    '<div class="card p-3 mb-4">'+(violations.length ? violations.map(function(v){return '<div class="badge-bad">'+esc(v)+'</div>';}).join('') : '<div class="badge-ok">No invariant violations.</div>')+'</div>'+
    '<h2 class="text-lg font-semibold mb-2">T_* unit checks ('+tGroup.filter(function(c){return c.pass;}).length+'/'+tGroup.length+' passing)</h2>'+
    '<div class="card p-3 mb-4">'+list(tGroup)+'</div>'+
    '<h2 class="text-lg font-semibold mb-2">G_* property/golden checks ('+gGroup.filter(function(c){return c.pass;}).length+'/'+gGroup.length+' passing)</h2>'+
    '<div class="card p-3">'+list(gGroup)+'</div>'+
  '</div>';
}

function renderLog(st){
  var evs = st.events.slice().reverse();
  return '<div class="p-6" id="content">'+
    '<div class="flex gap-2 mb-3"><button class="btn" onclick="LeadOS.exportLog()">Export JSON</button><button class="btn" onclick="LeadOS.wipeLog()">Wipe + reseed</button></div>'+
    '<div class="card divide-y" style="border-color:var(--line)">'+
    evs.map(function(e){ return '<div class="p-2 finding-body flex gap-3"><span class="finding-label" style="color:var(--ink-2)">'+fmtDate(e.ts)+'</span><span class="mono finding-label">'+e.type+'</span><span class="flex-1 truncate">'+esc(JSON.stringify(e.data))+'</span></div>'; }).join('')+
    '</div></div>';
}

function renderLayout(sol){
  var css = LEADOS.cssolver.generateCSS(sol);
  function chk(label, pass){ return '<div class="flex justify-between finding-body py-1 border-b" style="border-color:var(--line)"><span>'+label+'</span><span class="'+(pass?'badge-ok':'badge-bad')+'">'+(pass?'PASS':'FAIL')+'</span></div>'; }
  return '<div class="p-6" id="content">'+
    '<h2 class="text-lg font-semibold mb-2">LEADOS.cssolver — live constraint monitor</h2>'+
    '<p class="finding-body mb-4" style="color:var(--ink-2)">Recomputed on load, on window resize, and on every re-render. Resize the window to watch the numbers move.</p>'+
    '<div class="grid grid-cols-2 gap-4">'+
      '<div class="card p-4"><div class="finding-label uppercase mb-2" style="color:var(--ink-2)">Solved variables</div>'+
        ['cardHeight','gap','buttonSize','scoreFont','railWidth','panelWidth','columnMax','sectionGap'].map(function(k){
          return '<div class="flex justify-between mono finding-label py-0.5"><span>'+k+'</span><span>'+sol[k]+'</span></div>';
        }).join('')+
      '</div>'+
      '<div class="card p-4"><div class="finding-label uppercase mb-2" style="color:var(--ink-2)">Constraint checks</div>'+
        chk('Fitts acquisition &lt; 300ms ('+sol.fittsAcquisitionMs+'ms)', sol.checks.fitts_lt_300ms)+
        chk('Scannability &ge;3 cards/saccade ('+sol.cardsPerSaccade+')', sol.checks.scannability_ge_3)+
        chk('Contrast &ge;4.5:1 ('+sol.worstContrastRatio+':1, '+sol.wcagLevel+')', sol.checks.contrast_ok)+
        chk('Domain color distance &ge;30 &Delta;E ('+sol.perceptualDistance+')', sol.checks.perceptual_ge_30)+
        chk('Severity color arousal monotonic', sol.checks.arousal_monotonic)+
        chk('Mono/serif weight ratio in [1.15,1.25] ('+sol.weightRatio+')', sol.checks.weight_ratio_ok)+
      '</div>'+
    '</div>'+
    '<div class="finding-label mt-3" style="color:var(--ink-2)">Arc-repair iterations used on last solve: '+sol.arcRepairIterations+'</div>'+
    '<div class="mt-4"><div class="finding-label uppercase mb-1" style="color:var(--ink-2)">Generated CSS (injected into &lt;style id="cssolver-output"&gt;)</div>'+
    '<pre class="card p-3 mono finding-label overflow-auto" style="white-space:pre-wrap;">'+esc(css)+'</pre></div>'+
  '</div>';
}

function renderAbout(){
  return '<div class="p-6 max-w-3xl" id="content">'+
    '<h2 class="text-lg font-semibold mb-2">Verified vs. fabricated vs. simplified — this exact build (Parts 1&ndash;3)</h2>'+
    '<p class="finding-body mb-3">This session re-fetched github.com/wbweve/Leados directly (rendered page) and the already-committed pt-J <code>README.md</code>, <code>AI-SESSION-LOG.md</code> and <code>index.html</code> via three independent raw mirrors, cross-checking the prior session\\'s own verified/fabricated claims rather than trusting its prose. Full ledger: AI-SESSION-LOG.md.</p>'+
    '<h3 class="font-semibold mt-4">Verified (re-confirmed this session, cross-mirror)</h3>'+
    '<ul class="list-disc ml-5 finding-body space-y-1">'+
      '<li>DOMAINS, DECAY=0.85, CORRELATION_WINDOW_DAYS=90, DECISION_MAX_OPEN_DAYS=21 &mdash; identical across all three raw mirrors fetched this session.</li>'+
      '<li>The pt-J <code>index.html</code> really is committed at the repo root, with storage key <code>leados-pt-j:data</code> and an 8-route whitelist, consistent with its own README.</li>'+
      '<li>WCAG contrast formula, CIE Lab/LCH conversion, Fitts\\' Law functional form, and the φ=1.618 Golden Ratio arithmetic are real, standard formulas &mdash; re-derived in code here, not re-fetched from a spec this session.</li>'+
      '<li>Weber&ndash;Fechner (1834/1860) and Miller\\'s "7±2" (1956) are real, named citations in the psychophysics/cognition literature.</li>'+
    '</ul>'+
    '<h3 class="font-semibold mt-4">Unverified</h3>'+
    '<ul class="list-disc ml-5 finding-body space-y-1">'+
      '<li>Whether Miller\\'s 1956 working-memory figure, or Weber&ndash;Fechner\\'s intensity-discrimination law, actually transfers to "bits of finding-card information per pixel" &mdash; not independently verified by this build; carried only as the brief\\'s own analogy.</li>'+
      '<li>The exact byte-for-byte content of the three middle Sections (7 internals, 8, 9, 10-sidebar/top-of-renderToday) of the prior committed <code>index.html</code>, which three independent fetch mirrors all truncated at the same offset this session &mdash; see file header. This build\\'s versions of those sections are re-implementations matching documented behavior, not confirmed copies.</li>'+
    '</ul>'+
    '<h3 class="font-semibold mt-4">Fabricated / simplified, disclosed at point of definition</h3>'+
    '<ul class="list-disc ml-5 finding-body space-y-1">'+
      '<li><b>Part 1</b> &mdash; LEADOS.cssolver: simplified node-consistency + one arc-repair loop, not a general CSP engine. Fitts a/b constants and 200px/220px travel/saccade assumptions are illustrative.</li>'+
      '<li><b>Part 2</b> &mdash; LEADOS.aesthetics: "257 bits per finding" is an invented constant. The brief\\'s own optimizeDensity() min/max multipliers were swapped (min&gt;max) &mdash; fixed, disclosed, not reproduced broken. The brief\\'s own spacing-scale comments for sp7..sp10 contain rounding arithmetic errors; the true computed values are shown on #/aesthetics next to the brief\\'s stated (wrong) numbers. "Bradford/D50 chromatic adaptation" is named in the brief\\'s prose but never implemented by its own pseudocode, which only does a flat hue-rotate/saturate filter &mdash; this build matches the code, not the prose, and says so.</li>'+
      '<li><b>Part 3</b> &mdash; LEADOS.familiarity: this build\\'s Finding schema has no native basis-lines/confidence/score-math fields, so NOVEL/LEARNING cards reuse the already-disclosed domain decay-weight math (Section 4) and a new, explicitly FABRICATED severity-derived "confidence" proxy. The brief\\'s 600ms cross-render height-collapse animation is not implemented as specified (this build re-renders via full innerHTML replace, like Part 1); a CSS fade-in plus a one-time toast substitutes for it, disclosed as simplified.</li>'+
    '</ul>'+
    '<p class="finding-label mt-4" style="color:var(--ink-2)">Storage keys: <span class="mono">leados-pt-j:data</span> (localStorage, durable) &middot; <span class="mono">leados-pt-j:familiarity</span> / <span class="mono">leados-pt-j:familiarity-notified</span> (sessionStorage, resets each session per the Part 3 brief\\'s own instruction).</p>'+
  '</div>';
}

function render(){
  var route = routeFromHash();
  var P = project(ST.events);
  var body = '';
  if (route==='today') body = renderToday(P);
  else if (route==='domains') body = renderDomains(P);
  else if (route==='synthesis') body = renderSynthesis(ST, P);
  else if (route==='decision') body = renderDecision(P);
  else if (route==='aesthetics') body = renderAesthetics();
  else if (route==='health') body = renderHealth(ST);
  else if (route==='log') body = renderLog(ST);
  else if (route==='layout') body = renderLayout(LEADOS.cssolver.lastSolution || LEADOS.cssolver.solve());
  else body = renderAbout();
  document.getElementById('app').innerHTML =
    '<div class="flex min-h-screen">' + sidebar(route) +
    '<div class="flex-1 overflow-auto">'+
      '<div class="px-6 pt-4 pb-2 border-b flex items-center justify-between" style="border-color:var(--line)">'+
        '<div class="text-sm font-medium uppercase tracking-wide">'+route+'</div>'+
        '<div class="finding-label" style="color:var(--ink-2)">'+ST.events.length+' events</div>'+
      '</div>'+
      body +
    '</div></div>';
  applySolvedLayout(route);
  if (route==='today') runFamiliarityNotifications();
}

/* ===========================================================================
   SECTION 11 — SOLVER WIRING
   cssolver: recomputes on load, resize, and every re-render (verified
   behavior, matches Part 1's own non-negotiable).
   aesthetics: recomputes on load and resize ONLY (Part 2's own brief text:
   "regenerated on each session start, not each render") — a deliberate,
   disclosed difference in cadence between the two modules.
   =========================================================================== */
var resizeTimer = null;
function applySolvedLayout(route){
  var P = project(ST.events);
  var viewport = { width: window.innerWidth, height: window.innerHeight };
  var data = { findingCount: P.findings.length };
  var sol = LEADOS.cssolver.solve(viewport, data);
  LEADOS.cssolver.lastSolution = sol;
  var styleEl = document.getElementById('cssolver-output');
  if (!styleEl){ styleEl = document.createElement('style'); styleEl.id = 'cssolver-output'; document.head.appendChild(styleEl); }
  styleEl.textContent = LEADOS.cssolver.generateCSS(sol);

  if (!LEADOS.aesthetics.lastResult || window.__leadosForceAesthetics){
    LEADOS.aesthetics.lastResult = LEADOS.aesthetics.generateLivingStylesheet(P, new Date(), viewport, {preferredDensity: ST.meta.densityMode});
    window.__leadosForceAesthetics = false;
  }
  renderMonitor(sol);
}
function renderMonitor(sol){
  var el = document.getElementById('cssolver-monitor');
  if (!debugModeOn()){ if (el) el.remove(); return; }
  if (!el){ el = document.createElement('div'); el.id='cssolver-monitor'; document.body.appendChild(el); }
  function row(label, value, pass){ return '<div class="row"><span>'+label+'</span><span class="'+(pass===undefined?'':(pass?'pass':'fail'))+'">'+value+'</span></div>'; }
  var ar = LEADOS.aesthetics.lastResult;
  el.innerHTML = '<h4>cssolver <span class="finding-label" style="font-weight:400;color:var(--ink-2)">'+sol.viewport.width+'&times;'+sol.viewport.height+'</span></h4>'+
    row('cardHeight', sol.cardHeight+'px') + row('gap', sol.gap+'px') + row('buttonSize', sol.buttonSize+'px') +
    row('Fitts ms', sol.fittsAcquisitionMs, sol.checks.fitts_lt_300ms) +
    row('contrast', sol.worstContrastRatio+':1 '+sol.wcagLevel, sol.checks.contrast_ok) +
    row('domain ΔE min', sol.perceptualDistance, sol.checks.perceptual_ge_30) +
    (ar ? ('<h4>aesthetics</h4>'+
      row('density (bits/px)', ar.density.density.toFixed(4)) +
      row('visible count', ar.density.visibleCount) +
      row('hue-rotate', ar.chromatic.hueRotate+'deg')) : '')+
    '<div class="finding-label mt-2" style="color:var(--ink-2)"><a href="#/layout" style="text-decoration:underline">cssolver detail &rarr;</a> &middot; <a href="#/aesthetics" style="text-decoration:underline">aesthetics detail &rarr;</a></div>';
}
window.addEventListener('resize', function(){
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function(){ window.__leadosForceAesthetics = true; applySolvedLayout(routeFromHash()); }, 150);
});

/* ===========================================================================
   Part 3 wiring: transition toast ("the adaptation is never silent").
   SIMPLIFIED: shown after the full-page re-render (see header disclosure),
   not as a true in-place height-collapse animation.
   =========================================================================== */
function runFamiliarityNotifications(){
  var keys = window.__leadosNotifyQueue || [];
  window.__leadosNotifyQueue = [];
  keys.forEach(function(key, i){
    var el = document.querySelector('[data-finkey="'+key.replace(/"/g,'')+'"]');
    if (!el) return;
    var rect = el.getBoundingClientRect();
    var toast = document.createElement('div');
    toast.className = 'fam-toast';
    toast.style.left = Math.max(8, rect.left)+'px';
    toast.style.top = Math.max(8, rect.top-44)+'px';
    toast.textContent = "This finding is now compact. Hover to see full details.";
    document.body.appendChild(toast);
    setTimeout(function(){ toast.classList.add('show'); }, 20+i*80);
    setTimeout(function(){ toast.classList.remove('show'); setTimeout(function(){ toast.remove(); }, 300); }, 3000+i*80);
  });
}

/* ===========================================================================
   SECTION 12 — ACTIONS (window.LeadOS)
   =========================================================================== */
var LeadOS = {
  nav: nav,
  resolveFinding: function(signalId){ appendEvent(ST, 'signal.resolved', {signalId:signalId}); render(); },
  generateSynthesis: function(){
    var P = project(ST.events);
    var payload = generateSynthesisPayload(P, new Date());
    var eventCountAtGeneration = ST.events.length; // snapshot BEFORE append
    appendEvent(ST, 'synthesis.generated', { momentText: payload.momentText, five: payload.five, hardQuestion: payload.hardQuestion, eventCountAtGeneration: eventCountAtGeneration });
    render();
  },
  submitDecision: function(ev){
    ev.preventDefault();
    var f = ev.target;
    var data = {
      title: f.title.value, domain: f.domain.value,
      risk: Number(f.risk.value), confidence: Number(f.confidence.value),
      reversible: f.reversible.checked, urgent: f.urgent.checked
    };
    var res = appendEvent(ST, 'decision.logged', data);
    var errEl = document.getElementById('err_decision');
    if (!res.ok){ errEl.textContent = res.error; return; }
    errEl.textContent = ''; render();
  },
  setDensityMode: function(mode){
    if (['COMPACT','STANDARD','COMFORTABLE','READING'].indexOf(mode)===-1) return;
    ST.meta.densityMode = mode; save(ST);
    window.__leadosForceAesthetics = true;
    render();
  },
  resetFamiliarity: function(){ LEADOS.familiarity.reset(); render(); },
  exportLog: function(){
    var blob = new Blob([JSON.stringify(ST,null,2)], {type:'application/json'});
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'leados-pt-j-export.json'; a.click();
  },
  wipeLog: function(){
    if (!confirm('Wipe all local data and reseed?')) return;
    ST = emptyState(); save(ST); seedIfEmpty(ST); render();
  }
};
window.LeadOS = LeadOS;
window.nav = nav;
window.toggleDebug = toggleDebug;
window.addEventListener('hashchange', render);
document.addEventListener('keydown', function(e){
  if ((e.metaKey||e.ctrlKey) && e.key==='Enter' && routeFromHash()==='synthesis'){ e.preventDefault(); LeadOS.generateSynthesis(); }
});
render();
</script>
</body>
