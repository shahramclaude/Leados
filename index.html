V.oneonones=(arg,ev)=>{
  const leads=U.arr(S.people).filter(p=>p.lead);
  const others=U.arr(S.people).filter(p=>!p.lead);
  const boardRow=p=>{
    const ss=U.arr(S.sessions).filter(x=>x.personId===p.id&&x.done).sort((a,b)=>b.date.localeCompare(a.date));
    const last=ss[0];const gap=last?D.days(last.date,D.today()):999;
    const fr=FW.flight(p,S);const win=fr.band==='HIGH'?7:18;
    const pin=U.arr(S.cases).filter(c=>c.agendaPin&&!c.closed).length;
    const agendaN=U.arr(S.cases).filter(c=>!c.closed&&(c.aboutId===p.id||c.personId===p.id)).length
      +U.arr(S.tasks).filter(t=>!t.done&&t.personId===p.id).length+pin;
    return '<div class="card lift print-in"><div class="hbar" style="align-items:flex-start">'+
      '<div class="grow"><div class="hbar"><span style="font-weight:620;font-size:14px">'+U.esc(p.name)+'</span>'+
      H.chip(gap>win?'overdue '+gap+'d (window '+win+'d)':last?'last '+D.ago(last.date)+' · window '+win+'d':'never · +first 1:1',gap>win?'red':gap>win-4?'amber':'green',fr.band==='HIGH'?'flight HIGH compresses the window to 7d':'')+
      (pin?H.chip(pin+' sealed pin','red','agenda pin from a sealed case — surfaces here, unsnoozable'):'')+'</div>'+
      '<div class="mut small" style="margin-top:5px">auto-agenda: '+agendaN+' item(s) assembled — the finish modal consumes it; discussed cases get notes.</div></div>'+
      '<div class="hbar"><button class="btn sm" data-a="go" data-r="#/person/'+p.id+'">dossier</button><button class="btn sm pri" data-a="oo-start" data-id="'+p.id+'">finish-log 1:1</button></div></div></div>';};
  return '<div class="vhead print-in"><h2>Cadence board — '+leads.length+' conduits to leads'+(others.length?' + '+others.length+' extended':'')+'</h2><p>You are a leader of leads: the 1:1s with your leads are the sensing network the whole app reads. <b>Sensors dark = signal lies.</b> untouched pulse sliders write <span class="mono">estimated:true</span>, enforced at write, excluded from every slope.</p></div>'+
  '<div class="grid g2">'+leads.map(boardRow).join('')+'</div>'+
  (others.length?'<div class="sect"><h3>extended org</h3><div class="grid g3">'+others.map(p=>'<div class="card"><div class="hbar"><div class="grow"><div class="t">'+U.esc(p.name)+'</div><div class="s">'+U.esc(p.role)+'</div></div><button class="btn sm" data-a="oo-start" data-id="'+p.id+'">log 1:1</button></div></div>').join('')+'</div></div>':'');
};

V.feedback=()=>{
  const all=U.arr(S.feedback).sort((a,b)=>b.created.localeCompare(a.created));
  const undeliv=all.filter(f=>!f.deliveredAt);
  const verif=all.filter(f=>f.kind==='correction'&&f.deliveredAt&&f.held==null);
  const people=U.arr(S.people);
  const bal=people.map(p=>{const fs=all.filter(f=>f.subjectId===p.id&&f.deliveredAt);
    const pr=fs.filter(f=>f.kind==='praise').length,co=fs.filter(f=>f.kind==='correction').length;
    return {p,pr,co,n:fs.length};}).filter(x=>x.n>0);
  const row=f=>{
    const age=D.days(f.created,D.today());
    const late=!f.deliveredAt&&age>=(f.kind==='praise'?2:3);
    return '<div class="row"><span class="dotc" style="background:'+(f.kind==='praise'?'var(--green)':f.kind==='correction'?'var(--amber)':'var(--blue)')+'"></span>'+
      '<div class="grow"><div class="t small">'+U.esc(ENG.pname(f.subjectId))+' — '+U.esc((f.sbi||'(draft SBI — open and write it)').slice(0,110))+'</div>'+
      '<div class="s">'+f.kind+' · written '+D.ago(f.created)+(f.deliveredAt?' · delivered '+D.ago(f.deliveredAt):late?' · <b style="color:var(--red2)">past its '+(f.kind==='praise'?'48':'72')+'h clock</b>':' · undelivered')+
      (f.kind==='correction'&&f.deliveredAt&&f.verifyAt?' · verify '+(f.held===true?'held':f.held===false?'failed':'+'+U.clamp(D.days(D.today(),f.verifyAt),0,99)+'d'):'')+
      (f.lapsedCaseId?' · breakdown case opened':'')+'</div></div>'+
      '<span class="hbar">'+(!f.deliveredAt?'<button class="btn sm" data-a="fb-edit" data-id="'+f.id+'">edit</button><button class="btn sm pri" data-a="fb-deliver" data-id="'+f.id+'">delivered</button>':'')+
      (verif.includes(f)?'<button class="btn sm" data-a="fb-verify" data-id="'+f.id+'" data-held="1">held</button><button class="btn sm danger" data-a="fb-verify" data-id="'+f.id+'" data-held="0">didn\u2019t hold</button>':'')+'</span></div>';};
  return '<div class="vhead print-in"><h2>Feedback — '+undeliv.length+' undelivered · '+verif.length+' awaiting verification</h2><p>SBI with a live specificity lint — <b>save blocks under 2/3</b>. Praise clock 48h, corrections 72h. Corrections come back after 21 days to answer one question: <b>did it hold?</b></p>'+
  '<div class="hbar" style="margin-top:10px"><button class="btn pri" data-a="fb-new">'+icon('plus')+'write feedback</button>'+H.chip('lint enforced at save')+H.chip('+21d verification on corrections')+'</div></div>'+H.griev+
  '<div class="grid g2">'+
  H.biz('<h3>Queue <span class="q" style="letter-spacing:0">ageing clocks live; late reads as afterthought or ambush</span></h3>'+(all.length?all.map(row).join(''):'<div class="mut small">empty — capture with <span class="mono">praise: @name …</span></div>'))+
  H.biz('<h3>Balance board <span class="q">sample size shown — small n, weak claim, said so</span></h3>'+
    (bal.length?bal.map(b=>'<div class="row"><div class="grow"><div class="t">'+U.esc(b.p.name)+'</div><div class="s">'+b.pr+' praise · '+b.co+' corrections · n='+b.n+(b.n<4?' — sample too small to read balance, stated honestly':'')+'</div></div><div style="width:120px">'+H.bar(b.n?b.pr/b.n*100:0,'var(--green)')+'</div></div>').join(''):'<div class="mut small">delivered feedback builds this board</div>')+
    '<div class="note" style="margin-top:10px"><b>Doctrine:</b> the machine never computes a “score” of a person from this board. Ratios are context for you, not verdicts on them.</div>')+
  '</div>';
};

V.goals=()=>{
  const gs=U.arr(S.goals);
  if(!gs.length)return '<div class="vhead print-in"><h2>No goals on record</h2><p>Direction lives here: KRs with direction-aware scoring, confidence as the leading indicator.</p></div>'+H.empty('target','Goals are where cases aim','Register a case with a goal link and the flag is bidirectional: the case owns it until its closure clears it.','<button class="btn pri" data-a="goal-new">'+icon('plus')+'new goal</button>');
  const card=g=>{
    const sc=FW.krScore(g),sl=FW.confSlope(g);
    const elapsed=U.clamp(D.days(g.created,D.today())/Math.max(D.days(g.created,g.due),1)*100,0,100);
    const ahead=sc>=elapsed;
    const expired=!g.graded&&g.due&&D.days(g.due,D.today())>0;
    return '<div class="card lift print-in"><div class="hbar" style="align-items:flex-start"><div class="grow">'+
      '<div style="font-weight:620;font-size:14.5px">'+U.esc(g.title)+'</div>'+
      '<div class="s mono mut" style="margin-top:4px">due '+g.due+' ('+D.inN(g.due)+')'+(g.teamId?' · '+ENG.tname(g.teamId):'')+(g.flaggedBy?' · flag owned by case '+g.flaggedBy:'')+'</div></div>'+
      (g.atRisk?H.chip('AT RISK','red','flagged by case '+g.flaggedBy+' — only that case\u2019s closure clears this'):'')+
      (g.graded?H.chip('graded: '+g.graded.grade,g.graded.grade==='hit'?'green':g.graded.grade==='partial'?'amber':'violet'):'')+
      (expired?H.chip('expired — grade owed','red'):'')+'</div>'+
      '<div style="margin:12px 0 8px">'+g.krs.map(k=>{
        const span=Math.abs(k.target-k.start)||1;
        const prog=U.clamp(((k.cur!=null?k.cur:k.start)-k.start)/(k.target-k.start)*100,0,100);
        return '<div style="margin-bottom:9px"><div class="hbar" style="justify-content:space-between"><span class="small">'+U.esc(k.t)+(k.dir==='down'?' <span class="mut">(down-metric — scoring flipped honestly)</span>':'')+'</span><span class="mono small mut2">'+(k.cur!=null?k.cur:k.start)+k.unit+' → '+k.target+k.unit+'</span></div>'+H.bar(prog,prog>=100?'var(--green)':'')+'</div>';}).join('')+'</div>'+
      '<div class="hbar" style="justify-content:space-between"><span class="mono small mut2">KR '+sc+'% · waterfall '+Math.round(elapsed)+'% elapsed → '+(ahead?'ahead of plan':'behind plan')+'</span>'+
      '<span class="mono small" style="color:'+(sl==null?'var(--tx3)':sl<-0.05?'var(--red2)':'var(--green)')+'">confidence '+(sl==null?'— (need 3 check-ins)':sl.toFixed(2)+'/d '+(sl<-0.05?'falling — the leading indicator':'steady'))+'</span></div>'+
      '<div class="hbar" style="margin-top:12px">'+(g.graded?'':'<button class="btn sm pri" data-a="checkin-open" data-id="'+g.id+'">check-in</button>')+
       (expired?'<button class="btn sm danger" data-a="grade-open" data-id="'+g.id+'">grade (needs causal lesson)</button>':'')+
       (g.graded?'<span class="mut small">'+U.esc(g.graded.lesson)+'</span>':'')+'</div>'+
      (g.checkins.length?'<div class="mut small mono" style="margin-top:8px">'+g.checkins.length+' check-ins · last '+D.ago(g.checkins[g.checkins.length-1].t)+(g.checkins[g.checkins.length-1].note?' — “'+U.esc(g.checkins[g.checkins.length-1].note)+'”':'')+'</div>':'')+'</div>';};
  return '<div class="vhead print-in"><h2>'+gs.filter(g=>!g.graded).length+' live · '+gs.filter(g=>g.graded).length+' graded</h2><p>Trajectory is printed as reasoning: <b>KR score vs waterfall elapsed vs confidence slope</b>. Expired goals are graded only with a causal lesson — “we tried hard” does not parse as cause.</p>'+
  '<div class="hbar" style="margin-top:10px"><button class="btn pri" data-a="goal-new">'+icon('plus')+'new goal</button></div></div>'+
  '<div class="grid g2">'+gs.map(card).join('')+'</div>';
};

V.decisions=()=>{
  const ds=U.arr(S.decisions).sort((a,b)=>(!!b.decidedAt)-(!!a.decidedAt)||(a.decideBy||'').localeCompare(b.decideBy||''));
  const open=ds.filter(d=>!d.decidedAt),done=ds.filter(d=>d.decidedAt);
  const graded=done.filter(d=>d.graded);
  const good=graded.filter(d=>d.graded.outcome==='good').length;
  const card=d=>'<div class="card lift print-in"><div class="hbar" style="align-items:flex-start">'+H.chip(d.type==='t1'?'type-1 · irreversible':'type-2 · reversible',d.type==='t1'?'red':'blue',d.type==='t1'?'walk through carefully: premortem ≥3 enforced':'reversible doors deserve speed, not ceremony')+
    '<div class="grow"><div style="font-weight:620;font-size:14px">'+U.esc(d.title)+'</div>'+
    '<div class="s mono mut" style="margin-top:3px">decide-by '+d.decideBy+' ('+D.inN(d.decideBy)+')'+(d.caseId?' · from case':'')+' · premortem '+(d.premortem||[]).filter(Boolean).length+'/3</div></div>'+
    (d.decidedAt?H.chip('decided '+D.ago(d.decidedAt),'green'):D.days(d.decideBy,D.today())>=0?H.chip('overdue','red'):H.chip('open','amber'))+'</div>'+
    (d.decidedAt?'<div class="note" style="margin-top:10px"><b>'+U.esc(d.choice)+'</b> — '+U.esc(d.rationale)+'</div>':'')+
    (d.premortem&&d.premortem.filter(Boolean).length?'<div class="mut small" style="margin-top:9px">premortem: '+d.premortem.filter(Boolean).map(x=>'“'+U.esc(x)+'”').join(' · ')+'</div>':'')+
    (d.graded?'<div class="mut small" style="margin-top:8px">graded '+d.graded.outcome+' '+D.ago(d.graded.t)+' — '+U.esc(d.graded.note)+'</div>':'')+
    (d.history&&d.history.length?'<div class="timeline" style="margin-top:10px">'+d.history.map(h=>'<div class="tl"><div class="when">'+h.t+'</div><div class="what small">'+U.esc(h.what)+'</div></div>').join('')+'</div>':'')+
    '<div class="hbar" style="margin-top:12px">'+(d.decidedAt?
      (d.graded?'':'<button class="btn sm" data-a="dec-grade" data-id="'+d.id+'">grade the outcome</button>'):
      '<button class="btn sm pri" data-a="decide-open" data-id="'+d.id+'">decide…</button><button class="btn sm" data-a="redate-open" data-id="'+d.id+'">re-date (reason required)</button>')+'</div></div>';
  return '<div class="vhead print-in"><h2>'+open.length+' open doors · '+done.length+' walked through</h2><p>Type-1s get premortems and care; type-2s get speed. Re-dates are allowed but the reason is written and <b>rendered in history</b>. Calibration shows its sample size.</p>'+
  '<div class="hbar" style="margin-top:10px"><button class="btn pri" data-a="decision-new">'+icon('plus')+'new decision</button>'+
  H.chip('calibration: '+good+'/'+graded.length+' good',graded.length<5?'ghost':'green','n='+graded.length+' — under 5 graded, treat as noise, stated here')+'</div></div>'+
  '<div class="grid g2">'+ds.map(card).join('')+'</div>'+(!ds.length?H.empty('door','No decision records','A decision without a record gets re-litigated. The record is the door closing once.'):'');
};

V.handoffs=()=>{
  const hs=U.arr(S.handoffs);
  const card=h=>{
    const silence=!h.acceptedAt?D.days(h.requestedAt,D.today()):null;
    return '<div class="card lift print-in"><div class="hbar" style="align-items:flex-start"><div class="grow">'+
      '<div style="font-weight:620;font-size:14px">'+U.esc(h.title)+'</div>'+
      '<div class="s mono mut" style="margin-top:4px">'+ENG.tname(h.fromTeam)+' → '+ENG.tname(h.toTeam)+' · requested '+D.ago(h.requestedAt)+' by '+ENG.pname(h.requestedBy)+'</div></div>'+
      (h.doneAt?H.chip('done '+D.ago(h.doneAt),'green'):h.acceptedAt?H.chip('accepted · building','blue'):H.chip('silence '+silence+'d',silence>=3?'red':'amber','after 3 days of silence the clock names it'))+'</div>'+
      '<div class="mut small" style="margin-top:10px">acceptance criteria: <b class="mut2">'+U.esc(h.criteria)+'</b></div>'+
      '<div class="timeline" style="margin-top:10px">'+h.ledger.map(l=>'<div class="tl"><div class="when">'+l.t+' · '+l.kind+'</div><div class="what small">'+U.esc(l.label)+'</div></div>').join('')+'</div>'+
      '<div class="hbar" style="margin-top:12px">'+
        (!h.acceptedAt?'<button class="btn sm pri" data-a="ho-accept" data-id="'+h.id+'">mark accepted</button><button class="btn sm" data-a="ho-counter" data-id="'+h.id+'">counter</button>':'')+
        (!h.doneAt?'<button class="btn sm '+(h.acceptedAt?'pri':'')+'" data-a="ho-done" data-id="'+h.id+'">mark done</button>':'')+'</div></div>';};
  return '<div class="vhead print-in"><h2>'+hs.filter(h=>!h.doneAt).length+' open handoffs</h2><p>Cross-team debt with an acceptance doctrine: <b>request writes an acceptance commitment onto the receiving lead automatically</b>. “Done” without “accepted” is refused at the button and labeled a ledger lie (audit class <span class="mono">handoff-lie</span> holds the line).</p>'+
  '<div class="hbar" style="margin-top:10px"><button class="btn pri" data-a="handoff-new">'+icon('plus')+'new handoff</button></div></div>'+
  (hs.length?'<div class="grid g2">'+hs.map(card).join('')+'</div>':H.empty('exchange','No handoffs','When work crosses a team boundary, the debt lives here — not in chat archaeology.'));
};

V.risks=()=>{
  const rs=U.arr(S.risks);
  const live=rs.filter(r=>!r.retired);
  const heatCells=[];
  for(let i=5;i>=1;i--)for(let p=1;p<=5;p++)heatCells.push({p,i,rs:live.filter(r=>FW.exposure(r).p===p&&FW.exposure(r).i===i)});
  const heat='[AX]IMPACT '+heatCells.map(c=>{
    const x=c.p*c.i;const col=x>=16?'rgba(224,96,79,.35)':x>=9?'rgba(224,164,87,.30)':x>=4?'rgba(127,168,201,.16)':'rgba(255,255,255,.03)';
    return '<div class="hcell" style="background:'+col+';border-color:rgba(255,255,255,.05)" title="P'+c.p+' × I'+c.i+' = '+x+'">'+c.rs.map(r=>'<div style="font-weight:600;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+U.esc(U.first(U.byId(S.people,r.owner)?ENG.pname(r.owner):'? ')+'· '+r.title.slice(0,18))+'</div>').join('')+(c.rs.length?'':'<span style="opacity:.18">'+x+'</span>')+'</div>';}).join('');
  const card=r=>{
    const e=FW.exposure(r);
    const gap=D.days(r.lastReview||r.created,D.today());
    return '<div class="card lift print-in"><div class="hbar" style="align-items:flex-start">'+H.chip('P'+e.p+' × I'+e.i+' = '+e.x,e.band==='SEVERE'?'red':e.band==='HIGH'?'amber':'blue')+
      H.chip('trend '+(r.trend||'→'),r.trend==='↑'?'red':r.trend==='↓'?'green':'ghost')+
      '<div class="grow"><div style="font-weight:620;font-size:14px">'+U.esc(r.title)+(r.retired?' '+H.chip('retired: '+r.retired.how,'ghost'):'')+'</div>'+
      '<div class="s mono mut" style="margin-top:3px">'+(((r.teams||[]).map(ENG.tname).join(' × '))||'org-wide')+' · owner '+(r.owner?ENG.pname(r.owner):'<b style="color:var(--red2)">UNOWNED</b>')+' · review every '+r.reviewEvery+'d · last '+gap+'d ago</div></div></div>'+
      '<p class="mut2 small" style="margin:10px 0 6px">'+U.esc(r.desc)+'</p>'+
      '<div class="note blue" style="font-size:11.5px"><b>early warning (observable):</b> '+U.esc(r.ewi||'— missing; audit risk-math counts this if exposure ≥9')+'</div>'+
      '<div style="margin-top:10px">'+(r.mitigations.length?r.mitigations.map(m=>'<div class="row"><button class="btn sm" data-a="mit-done" data-rid="'+r.id+'" data-id="'+m.id+'" '+(m.done?'disabled':'')+'>'+icon(m.done?'check':'clock',11)+'</button><div class="grow"><div class="t small" style="'+(m.done?'text-decoration:line-through;opacity:.5':'')+'">'+U.esc(m.title)+'</div><div class="s">'+ENG.pname(m.owner)+' · '+(m.date?D.inN(m.date):'undated')+'</div></div></div>').join(''):'<div class="mut small">no mitigation — '+(e.x>=9?'<b style="color:var(--red2)">naked exposure ≥9, advisory firing</b>':'watching')+'</div>')+'</div>'+
      (r.retired?'<div class="note" style="margin-top:10px"><b>graded retirement ('+r.retired.how+'):</b> '+U.esc(r.retired.lesson)+(r.retired.caseId?' · case <a href="#/case/'+r.retired.caseId+'" class="mut2 mono">'+r.retired.caseId+'</a>':'')+'</div>':'')+
      '<div class="hbar" style="margin-top:12px">'+(r.retired?'':
        '<button class="btn sm" data-a="mit-open" data-id="'+r.id+'">+ mitigation</button>'+
        '<button class="btn sm" data-a="risk-review" data-id="'+r.id+'">stamp review</button>'+
        '<button class="btn sm danger" data-a="risk-retire" data-id="'+r.id+'">retire…</button>')+'</div></div>';};
  return '<div class="vhead print-in"><h2>'+live.length+' live risks · '+rs.filter(r=>r.retired).length+' retired</h2><p>The register owns the sentence no module had: <b>what breaks between the teams while everyone is busy inside them.</b> Early warnings are written in observable terms or the audit says so. Materialize converts a realized risk into a case in one move.</p>'+
  '<div class="hbar" style="margin-top:10px"><button class="btn pri" data-a="risk-new">'+icon('plus')+'new risk</button>'+H.chip('exposure ≥9 needs an owned dated mitigation','amber')+H.chip('materialize → case + retire, one move')+'</div></div>'+
  (live.length?H.biz('<h3>Exposure map <span class="q">P across, I up · cells show owner · title opener</span></h3><div class="heat">'+heat.replace('[AX]','<div class="ax">I5→1 ↓ / P→</div>').replace('IMPACT','')+'</div><div class="mut small mono" style="margin-top:6px">P=1…5 left→right · I=1…5 bottom→top · color: red ≥16 · amber ≥9 · blue ≥4</div>'):'')+
  (rs.length?'<div class="grid g2 sect">'+rs.map(card).join('')+'</div>':H.empty('shield','No risks registered','A leader of leads who sees no cross-team risks has not looked between the teams yet.','<button class="btn pri" data-a="risk-new">register the first one</button>'));
};
V.talent=()=>{
  const seats=U.arr(S.seats);
  const seatCard=stt=>{
    const cover=U.byId(S.people,stt.cover);
    return '<div class="card lift print-in"><div class="hbar" style="align-items:flex-start"><div class="grow">'+
      '<div style="font-weight:620;font-size:14.5px">'+U.esc(stt.title)+'</div>'+
      '<div class="s mono mut" style="margin-top:4px">criticality '+stt.criticality+' · emergency cover: '+(cover?ENG.pname(cover.id):'<b style="color:var(--red2)">none named</b>')+'</div></div>'+
      '<button class="btn sm" data-a="slate-open" data-id="'+stt.id+'">manage slate</button></div>'+
      '<div style="margin-top:12px">'+(stt.slate&&stt.slate.length?stt.slate.map((s,ix)=>{
        const cand=U.byId(S.people,s.pid);
        if(!cand)return '<div class="row"><div class="grow mut small">dangling candidate — orphan-refs sees this</div></div>';
        const rd=FW.readiness(stt,cand,S);
        const disagree=s.assigned&&Math.abs(s.assigned-rd.score)>=20;
        return '<div class="row"><div class="grow"><div class="t">'+U.esc(cand.name)+' '+H.chip(s.when,s.when==='now'?'green':s.when==='<1yr'?'amber':'ghost')+'</div>'+
        '<div class="s">computed '+rd.score+'/100'+(s.assigned?' · assigned by you: '+s.assigned:'')+(disagree?' · <b style="color:var(--amber2)">your call, on the record — the gap is the conversation</b>':'')+'</div>'+
        '<div class="s mut" style="margin-top:2px">basis: '+rd.basis.map(U.esc).join(' · ')+'</div></div>'+
        '<span class="mono small" style="color:'+(rd.score>=66?'var(--green)':rd.score>=40?'var(--amber2)':'var(--red2)')+'">'+rd.score+'</span></div>';}).join(''):'<div class="mut small">empty slate — a seat with no names is a promise you have not made to anyone</div>')+'</div></div>';};
  return '<div class="vhead print-in"><h2>'+seats.length+' succession seats</h2><p>Readiness is computed with the <b>basis printed per row</b>. Stale nine-box halves the evidence (doctrine, not opinion). When your assigned number disagrees with the computed one, the disagreement is rendered — not smoothed.</p>'+
  '<div class="hbar" style="margin-top:10px"><button class="btn pri" data-a="seat-new">'+icon('plus')+'new seat</button></div></div>'+
  (seats.length?'<div class="grid g2">'+seats.map(seatCard).join('')+'</div>':H.empty('crown','No succession seats','Name the seats that would hurt if the occupant vanished tomorrow. That list IS succession planning; everything else is ceremony.','<button class="btn pri" data-a="seat-new">name the first seat</button>'));
};

V.delegation=()=>{
  const ds=U.arr(S.delegations);
  const card=d=>{
    const hd=FW.delegHealth(d,S);
    const gap=d.lastCheck?D.days(d.lastCheck,D.today()):null;
    return '<div class="card lift print-in"><div class="hbar" style="align-items:flex-start">'+
      H.chip('health '+hd.score+' · '+hd.band,hd.band==='HELD'?'green':hd.band==='LOOSENING'?'amber':'red')+
      '<div class="grow"><div style="font-weight:620;font-size:14.5px">'+U.esc(d.title)+' → <span class="mut2">'+U.esc(ENG.pname(d.toId))+'</span></div>'+
      '<div class="s mono mut" style="margin-top:3px">since '+d.created+' · check-in every '+d.checkEvery+'d · last '+(gap==null?'never':gap+'d ago')+(gap!=null&&gap>d.checkEvery?' — <b style="color:var(--red2)">overdue</b>':'')+'</div></div>'+
      (d.active?H.chip('active','blue'):H.chip('ended','ghost'))+'</div>'+
      '<div class="mut small" style="margin-top:10px">decision rights (written):</div>'+
      '<ul style="margin:4px 0 8px 18px;font-size:12.5px;color:var(--tx2)">'+(d.rights||[]).map(r=>'<li>'+U.esc(r)+'</li>').join('')+'</ul>'+
      (d.explicitNot&&d.explicitNot.length?'<div class="mut small">explicitly NOT theirs:<ul style="margin:4px 0 8px 18px;font-size:12.5px;color:var(--tx2)">'+d.explicitNot.map(r=>'<li>'+U.esc(r)+'</li>').join('')+'</ul>':'')+
      '<div class="mut small" style="margin-top:4px">health basis: '+hd.basis.map(U.esc).join(' · ')+'</div>'+
      (d.why?'<div class="note" style="margin-top:10px;font-size:11.5px"><b>why this exists:</b> '+U.esc(d.why)+'</div>':'')+
      ((d.takebacks||[]).length?'<div class="mut small" style="margin-top:8px">take-backs: '+d.takebacks.map(t=>'“'+U.esc(t.why)+'” ('+t.t+')').join(' · ')+'</div>':'')+
      '<div class="hbar" style="margin-top:12px">'+(d.active?
        '<button class="btn sm pri" data-a="dg-check-open" data-id="'+d.id+'">stamp check-in</button>'+
        '<button class="btn sm" data-a="dg-drift" data-id="'+d.id+'">'+(d.drift?'drift resolved':'report scope drift')+'</button>'+
        '<button class="btn sm danger" data-a="dg-takeback-open" data-id="'+d.id+'">take back…</button>'+
        '<button class="btn sm" data-a="dg-end" data-id="'+d.id+'">end (graduated)</button>':'')+'</div></div>';};
  return '<div class="vhead print-in"><h2>'+ds.filter(d=>d.active).length+' active delegations</h2><p>For a leader of leads this is the leverage instrument: <b>decision rights in writing, an explicit NOT list, a check-in cadence</b>. Take-backs require a recorded reason — unreasoned reversals are how you teach leads to pre-ask everything.</p>'+
  '<div class="hbar" style="margin-top:10px"><button class="btn pri" data-a="deleg-new">'+icon('plus')+'new delegation</button></div></div>'+
  (ds.length?'<div class="grid g2">'+ds.map(card).join('')+'</div>':H.empty('key','Nothing delegated on the record','If it is not written here, it is a rumor. Write the rights, the NOT list, and the cadence.','<button class="btn pri" data-a="deleg-new">write the first one</button>'));
};

V.conflicts=()=>{
  const ms=U.arr(S.meds);
  const stages=['positions','caucus','joint','agreement','verification','closed'];
  const stIdx=m=>m.closed?5:m.stage==='reopened'?1:m.agreement?(m.held?4:3):m.joint?2:(m.caucuses.length?1:0);
  const card=m=>{
    const ix=stIdx(m);
    const c=U.byId(S.cases,m.caseId);
    return '<div class="card lift print-in"><div class="hbar" style="align-items:flex-start"><div class="grow">'+
      '<div style="font-weight:620;font-size:14.5px">'+U.esc(ENG.pname(m.partyA))+' × '+U.esc(ENG.pname(m.partyB))+'</div>'+
      '<div class="s mono mut" style="margin-top:4px">opened '+D.ago(m.opened)+(c?' · case <a href="#/case/'+c.id+'" class="mut2">'+(c.title||'').slice(0,42)+'</a>':'')+(m.closed?' · closed '+m.closed:'')+'</div></div>'+
      (m.stage==='reopened'?H.chip('reopened','red'):m.closed?H.chip('resolved · held ×'+(m.heldCount||0),'green'):H.chip(m.stage,'amber'))+'</div>'+
      '<div class="hbar" style="margin:13px 0 4px;gap:4px">'+stages.map((s,i)=>'<div style="flex:1;height:4px;border-radius:2px;background:'+(i<=ix?'var(--amber)':'var(--ink3)')+';border:1px solid var(--line)" title="'+s+'"></div>').join('')+'</div>'+
      '<div class="mut small mono" style="margin-bottom:8px">'+stages[ix]+(m.agreement?' · verify '+D.inN(m.verifyAt||m.opened):'')+'</div>'+
      '<table class="tt"><tr><td class="mut" style="width:120px">position — '+U.esc(U.first(ENG.pname(m.partyA)))+'</td><td>'+U.esc(m.positions[m.partyA]||'— not on record yet')+'</td></tr>'+
      '<tr><td class="mut">position — '+U.esc(U.first(ENG.pname(m.partyB)))+'</td><td>'+U.esc(m.positions[m.partyB]||'— not on record yet')+'</td></tr></table>'+
      (m.caucuses.length?'<div class="timeline" style="margin-top:10px">'+m.caucuses.map(x=>'<div class="tl"><div class="when">'+x.t+' · caucus '+U.esc(ENG.pname(x.withId))+'</div><div class="what small">'+U.esc(x.note)+'</div></div>').join('')+'</div>':'')+
      (m.joint?'<div class="mut small" style="margin-top:8px">joint session '+m.joint.t+' — '+U.esc(m.joint.note)+'</div>':'')+
      (m.agreement?'<div class="note" style="margin-top:10px"><b>Agreement ('+m.agreement.t+(m.agreement.witness?' · witnessed by '+U.esc(m.agreement.witness):'')+'):</b> '+U.esc(m.agreement.text)+'</div>':'')+
      '<div class="hbar" style="margin-top:12px">'+
        (m.closed?'':
        '<button class="btn sm" data-a="med-step" data-id="'+m.id+'" data-mode="pos">record positions</button>'+
        '<button class="btn sm" data-a="med-step" data-id="'+m.id+'" data-mode="caucus">log caucus</button>'+
        '<button class="btn sm" data-a="med-step" data-id="'+m.id+'" data-mode="joint">joint session</button>'+
        '<button class="btn sm pri" data-a="med-step" data-id="'+m.id+'" data-mode="agree">agreement…</button>')+
        (m.agreement&&m.verifyAt&&D.days(m.verifyAt,D.today())>=0&&!m.closed?'<button class="btn sm pri" data-a="med-verify" data-id="'+m.id+'" data-held="1">held (+14d)</button><button class="btn sm danger" data-a="med-verify" data-id="'+m.id+'" data-held="0">failed — reopen honestly</button>':'')+'</div></div>';};
  return '<div class="vhead print-in"><h2>'+ms.filter(m=>!m.closed).length+' active mediations</h2><p>Peer conflicts between leads go positions → separate caucuses → joint → written agreement with a witness → +14d verification, twice. <b>Power-asymmetric or policy territory is not a mediation — it is a case, possibly a sealed one.</b> Conflict cases route here automatically.</p>'+
  '<div class="hbar" style="margin-top:10px"><button class="btn pri" data-a="med-new">'+icon('plus')+'open a mediation</button></div></div>'+
  (ms.length?'<div class="grid g2">'+ms.map(card).join('')+'</div>':H.empty('handshake','No mediations','When two of your leads collide, the pipeline here beats hallway arbitration.','<button class="btn pri" data-a="med-new">open one</button>'));
};

V.rituals=()=>{
  const cov=FW.ritualCov(S);
  const rs=U.arr(S.rituals);
  return '<div class="vhead print-in"><h2>'+rs.length+' rituals · '+cov.filter(c=>c.missing||c.overdue).length+' rhythm gaps</h2><p>The operating rhythm a leader of leads runs. Skipped rituals are how seams go dark — <b>cadence vs doctrine is computed, not felt</b>.</p>'+
  '<div class="hbar" style="margin-top:10px"><button class="btn pri" data-a="ritual-new">'+icon('plus')+'new ritual</button></div></div>'+
  '<div class="grid g2">'+
    H.biz('<h3>Cadence doctrine vs reality</h3>'+cov.map(c=>'<div class="row"><span class="dotc" style="background:'+(c.missing?'var(--red)':c.overdue?'var(--amber)':'var(--green)')+'"></span><div class="grow"><div class="t small">'+c.label+'</div><div class="s">'+(c.missing?'should run ~every '+c.every+'d':c.ritual.name+' · every '+c.ritual.everyDays+'d · last '+(c.ritual.lastDone?D.ago(c.ritual.lastDone):'never')+' · gap '+c.gap+'d')+'</div></div><span class="s mono">'+(c.missing?'missing':c.overdue?'overdue':'held')+'</span></div>').join(''))+
    H.biz('<h3>Rituals on the books</h3>'+(rs.length?rs.map(r=>'<div class="row"><div class="grow"><div class="t">'+U.esc(r.name)+'</div><div class="s">every '+r.everyDays+'d · last '+(r.lastDone?D.ago(r.lastDone):'never')+' · agenda: '+(r.agenda||[]).map(U.esc).join(' · ')+'</div></div><button class="btn sm pri" data-a="ritual-done" data-id="'+r.id+'">ran it · stamp</button></div>').join(''):'<div class="mut small">none — the doctrine column on the left tells you what to install</div>')+
    '<div class="note" style="margin-top:12px"><b>Staff meeting agenda auto-pull:</b> '+(function(){const nbm=buildNBM(R._cache||R.eval());return nbm?'top signal — “'+U.esc(nbm.label.slice(0,90))+'”, then seams, then commitment debt.':'no live signals — bring one people topic.';})()+'</div>')+
  '</div>';
};

V.review=()=>{
  const closed=U.arr(S.cases).filter(c=>c.closed&&D.days(c.closed,D.today())<=7);
  const opened=U.arr(S.cases).filter(c=>!c.closed&&D.days(c.opened,D.today())<=7);
  const tdone=U.arr(S.tasks).filter(t=>t.done&&t.doneAt&&D.days(t.doneAt,D.today())<=7);
  const tnew=U.arr(S.tasks).filter(t=>!t.done&&t.due&&D.days(t.due,D.today())>0);
  const fdel=U.arr(S.feedback).filter(f=>f.deliveredAt&&D.days(f.deliveredAt,D.today())<=7);
  const fund=()=>U.arr(S.feedback).filter(f=>!f.deliveredAt);
  const dmade=U.arr(S.decisions).filter(d=>d.decidedAt&&D.days(d.decidedAt,D.today())<=7);
  const rret=U.arr(S.risks).filter(r=>r.retired&&D.days(r.retired.t,D.today())<=7);
  const mprog=U.arr(S.meds).filter(m=>!m.closed);
  const rr=U.arr(S.rituals).filter(r=>r.lastDone&&D.days(r.lastDone,D.today())<=7);
  const wins=U.arr(S.lessons).filter(l=>l.type==='win'&&D.days(l.t,D.today())<=7);
  const rvs=U.arr(S.reviews).sort((a,b)=>b.t.localeCompare(a.t));
  const facts=[
    [opened.length,'cases opened'],[closed.length,'cases closed'],[tdone.length,'commitments kept'],
    [tnew.length,'commitments drifted (overdue now)'],[fdel.length,'feedback delivered'],[fund().length,'feedback still owed'],
    [dmade.length,'decisions made'],[rret.length,'risks retired'],[mprog.length,'mediations open'],[rr.length,'rituals run'],[wins.length,'wins logged']
  ];
  return '<div class="vhead print-in"><h2>Weekly review — assembled from the ledger, not from memory</h2><p>The machine lays out what the record says happened; <b>the narrative and the three priorities for next week are yours</b>. A review written from recall is fiction with confidence.</p></div>'+
  '<div class="grid g3 print-in">'+facts.map(f=>'<div class="card"><div class="knum" style="color:'+(f[1].includes('drift')||f[1].includes('owed')?(f[0]?'var(--red2)':'var(--green)'):'var(--amber2)')+'">'+f[0]+'</div><div class="mut small" style="margin-top:5px">'+f[1]+' · 7d</div></div>').join('')+'</div>'+
  '<div class="grid g2 sect print-in">'+
  H.biz('<h3>Write the narrative <span class="q">filed reviews become your leadership autobiography</span></h3>'+
    '<form data-f="review-new"><div class="field"><label>what actually happened — and your read on why</label><textarea name="text" required placeholder="The release-seam conflict moved because… My debt stood at… Next week the three things are…"></textarea>'+
    '<div class="hint">filed with the 7-day counts above attached. Read last week\u2019s before you file this one.</div></div>'+
    '<button class="btn pri">file the review</button></form>')+
  H.biz('<h3>Filed reviews</h3>'+(rvs.length?rvs.slice(0,4).map(r=>'<div class="row"><div class="grow"><div class="t small">'+U.esc(r.text.slice(0,140))+(r.text.length>140?'…':'')+'</div><div class="s">'+r.t+' · attached counts: '+r.counted.filter(c=>c[0]).map(c=>c[0]+' '+c[1]).join(', ')+'</div></div></div>').join(''):'<div class="mut small">none yet — the first one is the hardest and the most valuable</div>'))+
  '</div>';
};

V.transition=()=>{
  const hasId=!!(S.identity.clockStart);
  if(!hasId)return '<div class="vhead print-in"><h2>Transition 90</h2><p>The first-90-days instrument arms itself from <b>identity.clockStart</b> (your first day in the seat). Set it below or on #/data.</p></div>'+
    H.biz('<h3>Start the clock</h3><form data-f="trans-init"><div class="field"><label>your first day in this role</label><input type="date" name="clockStart" required max="'+D.today()+'"></div><button class="btn pri">arm the 90-day clock</button></form>');
  const tr=FW.transStage(S);
  const gateCard=(g,i)=>{
    const state=i<tr.stageIdx?'passed':i===tr.stageIdx?'current':'ahead';
    return '<div class="card print-in" style="'+(state==='current'?'border-color:rgba(224,164,87,.45)':'opacity:'+(state==='ahead'?.6:.85))+'"><h3>Gate '+(''+['I','II','III'][i])+' · '+g[0]+'</h3>'+
      '<p class="mut2 small" style="line-height:1.6">'+g[1]+'</p>'+
      '<div class="s mono mut" style="margin-top:8px">'+(state==='passed'?'passed — on the record':state==='current'?'current stage'+(tr.day?' · day '+tr.day+' of 90':''):'not yet — '+(i===1?'days 31–60':'days 61–90'))+'</div>'+
      (state==='current'?'<form data-f="trans-advance" style="margin-top:12px"><input type="hidden" name="stage" value="'+(i<2?(i===0?'align':'act'):'act')+'"><div class="field"><label>gate evidence — what did you actually do? (required)</label><textarea name="note" required placeholder="'+(i===0?'What you learned about the seams, in writing. Changing nothing structural was the discipline.':'Whose decision rights changed? What expectations were set with which lead?')+'"></textarea></div><button class="btn pri" '+(i===2?'disabled':'')+'>'+(i===2?'final gate — you are through it':'advance to “'+g[0]+'”'+(i===0?'':''))+(i<2?'':'')+'</button></form>':'')+'</div>';};
  return '<div class="vhead print-in"><h2>Day '+tr.day+' of 90 — stage “'+tr.stage+'”</h2><p>Three gates: learn → align → act. <b>Staying in a gate past its window fires a signal</b>, because silent gate-drift is how new-leader momentum dies. Advances require written evidence.</p></div>'+
    '<div class="bar" style="height:6px;margin:4px 0 20px"><i style="width:'+U.clamp(tr.day/90*100,0,100)+'%"></i></div>'+
    '<div class="grid g3">'+tr.gates.map((g,i)=>gateCard(g,i)).join('')+'</div>'+
    '<div class="sect">'+H.biz('<h3>Doctrine for a leader of leads</h3><div class="mut2 small" style="line-height:1.7">Gate I: your 1:1s ARE the learning — the conduit board and the flight models are your map. Gate II: the delegation module is where align becomes real (rights in writing). Gate III: move one visible thing per team and journal each as a case or decision — <b>the record is your 90-day proof to yourself</b>.</div>')+'</div>';
};

V.data=()=>{
  const fl=S.auditFaults||[];
  const kb=STORE.byteLen/1024;
  const pct=U.clamp(kb/(5*1024)*100,0,100);
  return '<div class="vhead print-in"><h2>The storage contract, executed</h2><p>key <span class="mono">leados.v6</span> (lineage, deliberately never renamed) · record <span class="mono">v'+S.v+'</span> · migrations additive &amp; announced in the system log · corrupt bytes quarantined, newer records held · <b>quota surfaced before the wall</b>.</p></div>'+
  '<div class="grid g2 print-in">'+
  H.biz('<h3>Identity <span class="q">drives the 90-day clock</span></h3>'+
    '<form data-f="identity-save"><div class="frow"><div class="field"><label>your name</label><input name="name" value="'+U.esc(S.identity.name)+'" placeholder="Alex Rivera"></div>'+
    '<div class="field"><label>role</label><input name="role" value="'+U.esc(S.identity.role)+'" placeholder="Engineering manager of managers"></div></div>'+
    '<div class="field"><label>first day in this seat (arms Transition 90)</label><input type="date" name="clockStart" value="'+U.esc(S.identity.clockStart||'')+'" max="'+D.today()+'"></div>'+
    '<button class="btn pri">save identity</button></form>')+
  H.biz('<h3>Storage <span class="q">'+Math.round(kb)+' KB of ~5 MB · wakes past ~70%</span></h3>'+
    '<div class="bar" style="height:8px"><i style="width:'+pct+'%;background:'+(pct>70?'var(--red)':pct>45?'var(--amber)':'var(--green)')+'"></i></div>'+
    '<div class="mut small mono" style="margin:8px 0 14px">'+(STORE.failed?'WRITE FAILED — record too big for the quota; export now, then prune':'writes OK · last export '+(S.settings.exportLast?D.ago(S.settings.exportLast):'never'))+'</div>'+
    '<div class="hbar"><button class="btn" data-a="data-export">'+icon('download')+'export JSON</button>'+
    '<label class="btn">'+icon('upload')+'import…<input type="file" accept=".json" data-a-change="data-import" style="display:none"></label>'+
    '<button class="btn" data-a="prune-open">prune…</button></div>'+
    '<div class="note" style="margin-top:12px">Import offers <b>replace</b> (after a typed confirm) or <b>merge</b> — merge re-mints every id and rewires the whole graph through one map, then re-runs the audits. Wrong shapes refuse loudly without touching state (t11).</div>'+
    (STORE.RECOVERY?'<div class="note red" style="margin-top:10px"><b>RECOVERY ('+STORE.RECOVERY.kind+').</b> Your held record is untouched. <span class="hbar" style="margin-top:8px"><button class="btn sm" data-a="data-damaged">download damaged bytes</button><button class="btn sm danger" data-a="data-clean">start clean (typed confirm)</button></span></div>':''))+
  '</div>'+
  '<div class="sect print-in"><h3>Executable audits — '+AUD.list.length+' classes · '+fl.length+' open fault(s)</h3>'+
  H.biz('<table class="tt"><tr><th>class</th><th>faults</th><th></th></tr>'+AUD.list.map(a=>{
    const af=fl.filter(f=>f.cls===a.id);
    return '<tr><td><b>'+a.name+'</b><div class="s mut" style="font-size:11px">'+af.map(f=>U.esc(f.msg)).slice(0,2).join('<br>')+'</div></td>'+
    '<td>'+(af.length?H.chip(af.length+' fault'+(af.length>1?'s':''),'red'):H.chip('clean','green'))+'</td>'+
    '<td style="text-align:right"><span class="hbar" style="justify-content:flex-end"><button class="btn sm" data-a="audit-run" data-id="'+a.id+'">run</button>'+(a.repair?'<button class="btn sm" data-a="audit-repair" data-id="'+a.id+'" title="mechanically unambiguous fixes only">safe-repair</button>':'<span class="mut small mono" title="this class requires judgment; the machine refuses to fake it">judgment — no auto-repair</span>')+'</span></td></tr>';}).join('')+'</table>')+'</div>'+
  '<div class="grid g2 sect print-in">'+
  H.biz('<h3>Example org</h3><div class="mut small" style="margin-bottom:12px">'+(S.seeded?'status: <b class="mut2">seeded — '+U.esc(S.seedTag)+'</b>. Erase it when your real org arrives; erase requires a typed confirm and cannot be undone except by import.':'status: real data (or clean). Load the tense example org only to rehearse — it writes over the in-memory state after a typed confirm.')+'</div>'+
    '<div class="hbar"><button class="btn" data-a="seed-load">load example org</button><button class="btn danger" data-a="seed-erase">erase example / reset</button></div>')+
  H.biz('<h3>System log <span class="q">migrations, recoveries, sweeps — the record\u2019s own voice</span></h3>'+
    '<div class="mono" style="font-size:10.5px;line-height:1.75;max-height:210px;overflow-y:auto;color:var(--tx2)">'+
    (S.syslog.length?S.syslog.slice(-80).reverse().map(l=>'<div><span style="color:var(--tx3)">'+l.t.slice(0,16).replace('T',' ')+'</span> <span style="color:'+(l.kind==='recovery'?'var(--red2)':l.kind==='migrate'?'var(--amber2)':'var(--blue)')+'">'+l.kind+'</span> '+U.esc(l.msg)+'</div>').join(''):'<span class="mut">— empty —</span>')+'</div>')+
  '</div>'+
  '<div class="sect print-in">'+H.biz('<h3>Event bus <span class="q">runtime fan-out — last 14 events (durable log lives on each case\u2019s ledger)</span></h3><div class="mono" style="font-size:10.5px;line-height:1.75;color:var(--tx2)">'+(S.evlog.length?S.evlog.slice(-14).reverse().map(e=>'<div><span style="color:var(--tx3)">'+e.t.slice(5,16).replace('T',' ')+'</span> '+e.ev+' <span style="color:var(--tx3)">'+e.ref.slice(0,14)+'</span></div>').join(''):'<span class="mut">— no events yet —</span>')+'</div>')+'</div>';
};

V.about=()=>{
  const res=TESTS.results||[];
  const fails=res.filter(r=>!r.ok);
  const counts=[['rules',R.list.length],['audit classes',AUD.list.length],['self-tests',TESTS.list.length],['routes',NAV.length+2],['pure FW models',Object.keys(FW).length],['event types emitted',(new Set(S.evlog.map(e=>e.ev))).size]];
  return '<div class="vhead print-in"><h2>LeadOS v15.0 — the judgment contract</h2><p>Vanilla JS. No network, no accounts, no backend, no credentials, no build step. Icons inline SVG, fonts system. <b>It runs from a double-clicked file and every byte is inspectable.</b></p></div>'+
  '<div class="grid g2 print-in">'+
  H.biz('<h3>What the machine does</h3><div class="mut2 small" style="line-height:1.8">Ranks your next move and prints the ranking. Fans one case out to every module that must feel it, and records each hop. Nags you about your own debt before anyone else\u2019s. Watches cadence, ageing, drift, exposure, verification. Journals lessons where the next version of you will trip over them.</div>')+
  H.biz('<h3>Refusals — hard-coded, not configurable</h3><div class="mut2 small" style="line-height:1.8">No PIP templates. No separation workflows. Ethics/HR words seal the case and cap the machine at exactly four wires. Undelivered feedback cannot be backdated. Estimates never move a slope. A handoff cannot be “done” before “accepted”. Advisory rules state why they exist and when they clear. The app never fakes certainty: sample sizes, staleness, and instrument boundaries are printed, not hidden.</div>')+
  '</div>'+
  '<div class="sect print-in"><h3>Live counts — printed from code, not from the README</h3>'+
  H.biz('<div class="hbar" style="gap:22px;flex-wrap:wrap">'+counts.map(c=>'<div><div class="knum" style="font-size:24px">'+c[1]+'</div><div class="mut small">'+c[0]+'</div></div>').join('')+'<div style="margin-left:auto" class="mut small mono">if this page and the README disagree, the file wins</div>')+'</div>'+
  '<div class="sect print-in"><h3>Self-test wall — '+res.filter(r=>r.ok).length+'/'+res.length+' green at boot'+(fails.length?' · <span style="color:var(--red2)">'+fails.length+' FAILING</span>':'')+'</h3>'+
  H.biz((res.length?res.map(r=>'<div class="row"><span class="dotc" style="background:'+(r.ok?'var(--green)':'var(--red)')+'"></span><div class="grow"><div class="t small">'+r.id+' — '+U.esc(r.t)+'</div>'+(r.err?'<div class="s" style="color:var(--red2)">'+U.esc(r.err)+'</div>':'')+'</div>'+H.chip(r.ok?'pass':'FAIL',r.ok?'green':'red')+'</div>').join(''):'<div class="mut small">not run yet</div>')+
  '<div class="hbar" style="margin-top:12px"><button class="btn" data-a="tests-rerun">re-run the wall</button><span class="mut small mono">fixtures run behind a write-guard (__TM) — they cannot touch your record</span></div>')+'</div>'+
  '<div class="grid g2 sect print-in">'+
  H.biz('<h3>Shortcuts</h3><table class="tt">'+
    '<tr><td class="mono">/ or Ctrl-K</td><td>palette</td></tr><tr><td class="mono">C</td><td>register case</td></tr>'+
    '<tr><td class="mono">1–9 · 0</td><td>jump: today · signal · cases · people · 1:1s · feedback · goals · decisions · handoffs · risks</td></tr>'+
    '<tr><td class="mono">Esc</td><td>close</td></tr></table>')+
  H.biz('<h3>Capture grammar</h3><div class="mut2 small mono" style="line-height:2">'+
   'case: … · commit: @name … by +3 · owe: @name … by friday<br>praise: @name … · note: @name … · win: … · risk: …<br>dates: today · tomorrow · +Nd · friday · YYYY-MM-DD</div>'+
   '<div class="mut small" style="margin-top:8px">unparseable → nothing written, said out loud. unknown verb → a prefilled case intake, not a silent drop. first-name collisions resolve to the first match, audibly.</div>')+
  '</div>'+
  '<div class="sect print-in">'+H.biz('<h3>Storage reality & known limits</h3><div class="mut2 small" style="line-height:1.8">ISO-day strings, no timezone nuance. Instruments (flight, trust, readiness, calibration) are advisory — sample sizes and staleness are shown; they never edit records. Capture matches first names. The feedback-breakdown auto-open runs at boot, idempotent via lapsedCaseId. Audits repair only mechanics, never judgment. Everything sits in one localStorage key (~5MB): export is a habit, not a feature.</div>')+'</div>';
};
