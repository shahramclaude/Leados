const SCRIPTS = [
{id:'sbi', title:'Critical feedback (SBI)', when:'Behavior you observed, standard it missed, impact it had.', params:[['person','Person'],['situation','When/where it happened'],['behavior','Observable behavior (a camera could see it)'],['impact','Actual impact on work/team'],['ask','The specific change you need']],
 render:v=>'OPEN — contract the conversation\n"I want to talk about something I observed because your growth matters to me, and I\u2019d be failing you if I stayed quiet. Ten minutes, then I want your view."\n\nSITUATION\n"'+v.situation+', in that setting…"\n\nBEHAVIOR — observable only, no adjectives, no diagnosis\n"…I noticed '+v.behavior+'. I counted/saw it directly; this is not secondhand."\n\nIMPACT — the why, stated plainly\n"The effect was '+v.impact+'. That matters to the team and honestly to how you\u2019re perceived."\n\nPAUSE — then ask\n"What\u2019s your read on it?" — listen for their model of the world. Where it differs from yours, THAT is the real topic.\n\nNEXT — one change, agreed\n"What I need going forward is: '+v.ask+'. What do you need from me to make that doable?"\n\nCLOSE\n"Thank you for hearing this straight. I\u2019m on your side — that\u2019s exactly why I didn\u2019t soften it. Let\u2019s look at it together in two weeks."',
 guard:['If they cry, go quiet, or get angry: slow down, stay in the room, do not retract the content. Retraction teaches them feedback is negotiable.','Never deliver this within an hour of the incident (heat) or in writing first (cowardice). Face to face within 48h.','One topic per conversation. Stacking three issues reads as an ambush.']},
{id:'retention', title:'Stay / retention conversation', when:'Flight risk is elevated. You are listening, not pitching.', params:[['person','Person'],['signals','What you have observed'],['lever','One lever you can realistically pull']],
 render:v=>'FRAME — honest and low-pressure\n"I want to be direct: I\u2019ve noticed '+v.signals+', and I want to understand where your head is before I assume anything. No trap here — whatever you say stays between us."\n\nTHE QUESTIONS (ask all, in order, and shut up after each)\n1. "What would have to change here for you to be excited about the next year?"\n2. "What\u2019s the most frustrating part of your week right now?"\n3. "Is there anything you\u2019ve stopped telling me because it seemed pointless?"\n4. "If you got a call tomorrow with your dream offer — what would it be?"\n\nLISTEN — take notes visibly. Do not solve, do not defend, do not pitch your retention plan.\n\nCOMMIT TO ONE THING\n"Here\u2019s what I can genuinely do: '+v.lever+'. I\u2019ll have something concrete to show you within two weeks — not a promise, a deliverable."\n\nCLOSE\n"You don\u2019t owe me a decision today. I\u2019d rather earn the next year than trap you in this one."',
 guard:['Do not counter-pitch comp in the first conversation — you\u2019ll overpay for a problem that isn\u2019t money.','If they reveal an offer in hand: ask for 48h before any decision, then decide what they are WORTH to you before you hear the number.','Everything you promise here lands in your credibility column. One undelivered lever and the next retention talk is a resignation meeting.']},
{id:'promotion', title:'Promotion conversation — yes AND not-yet branches', when:'Delivering a growth verdict. Both outcomes live in this script.', params:[['person','Person'],['verdict','YES or NOT-YET'],['gaps','The specific gap map (for not-yet) OR the new scope (for yes)']],
 render:v=>(v.verdict||'').toUpperCase().startsWith('Y') ?
'THE YES\n"This is earned, not granted: '+v.gaps+' — the evidence has been visible for months. Effective [date], the title and scope are yours."\n\nSET THE NEW BAR IMMEDIATELY\n"The job you just left is no longer your safety net. In the new role I expect [specific outcomes, 2-3]. The skills that got you here are 40% of what the next level needs."\n\nSUPPORT STRUCTURE\n"We\u2019ll do biweekly 1:1s for the first quarter, and I want you leading [X] by [date] with me watching, then without."\n\nWATCH-FORS YOU SHOULD SAY ALOUD\n"Your old peers are now your reports / your reports\u2019 peers. The fastest way new leads fail is trying to stay the hero of the craft they left."'
:
'THE NOT-YET — verdict first, no preamble\n"You asked for [level]. The answer is not yet — and I owe you exactly why, with dates."\n\nTHE GAP MAP — evidence-shaped, not feelings\n"Here is the bar, and here is where the evidence stands: '+v.gaps+'"\n\nCONVERT GAPS TO MILESTONES\n"Each gap becomes a milestone we both sign: [gap → observable proof → target date]. When the evidence exists, the conversation re-opens — I\u2019m committing to that in writing."\n\nPROTECT THE RELATIONSHIP\n"Not-yet is not no. The people I\u2019ve seen grow fastest are the ones who got a real map instead of a soft yes. I\u2019m betting you\u2019re one of them."\n\nSCHEDULE THE REVIEW NOW\n"Review date: [30/60/90 days]. If I miss it, you have my blessing to chase me."',
 guard:['A "not yet" without written milestones is a quiet no, and they will treat it as one — by interviewing elsewhere.','Never promote to retain under counter-offer pressure. You teach the whole team how pricing works here.']},
{id:'salary', title:'Compensation conversation', when:'A raise ask landed. Fairness perception is the actual product.', params:[['person','Person'],['answer','Approved / Not now with criteria / No with rationale'],['criteria','The criteria or rationale, dated']],
 render:v=>'OPEN — respect the nerve\n"Thanks for raising it directly instead of letting it calcify. Comp talk is uncomfortable; you handled it the right way."\n\nTHE ANSWER — first sentence, unhedged\n"'+v.answer+'. Here is exactly why: '+v.criteria+'"\n\nIF APPROVED — kill the lottery feeling\n"This reflects [specific contribution]. It\u2019s effective [date]. Two things: this sets no automatic precedent, and the conversation about what the NEXT level pays starts with what you\u2019d need to demonstrate — let\u2019s schedule it."\n\nIF NOT NOW — make it a contract\n"Not now is not never. The path is: '+v.criteria+'. I\u2019ll review it with you on [date]. Put it in my calendar."\n\nIF NO — clean and complete\n"I\u2019d rather disappoint you today with the truth than string you along. The rationale is [facts: band/parity/budget reality]. What I CAN move: [scope/growth/one-time]. You deserve to plan with real information."\n\nCLOSE — always\n"However this lands today: I\u2019d rather you raise comp with me than with a recruiter. That door stays open."',
 guard:['Never blame "HR" as a black box — if you didn\u2019t verify the constraint, you don\u2019t know it.','Do not discover internal pay inequity and sit on it. Either fix it or you now own it.']},
{id:'handoff', title:'Delegation handoff (by SL2 level)', when:'Moving real ownership. Authority level matches their development level.', params:[['person','Person'],['task','The outcome being delegated'],['level','Authority level 1-7'],['checkpoints','Checkpoint cadence'],['constraints','Hard constraints / escalation triggers']],
 render:v=>'HAND THE OUTCOME, NOT THE TASKS\n"I\u2019m handing you '+v.task+'. The outcome is what matters — how you get there is yours."\n\nSTATE THE AUTHORITY LEVEL PLAINLY (this is the part everyone skips)\n"Level '+v.level+': that means [L1-3: check with me before executing | L4: we decide together | L5-6: your call, inform me | L7: fully yours]. I\u2019ll hold that line — if I meddle below it, call me on it."\n\nCONTEXT TRANSFER\n"Why this matters: [business reason]. What done looks like: [verifiable]. Hard constraints: '+v.constraints+'"\n\nCHECKPOINTS — agreed, not imposed\n"We\u2019ll checkpoint '+v.checkpoints+'. At checkpoints you bring: status, decisions made, decisions needed from me."\n\nESCALATION TRIGGER — pre-negotiated\n"Come to me immediately if: '+v.constraints+'. Escalating on trigger is good judgement, not failure. Missing it is."\n\nCLOSE\n"What questions do you have that you\u2019d normally ask in week two? Ask them now."',
 guard:['Delegation without a stated authority level is how work comes back to your desk wearing a different hat.','If this person failed at this before: say what changed (support, scope, checkpoints) or the memory poisons the retry.']},
{id:'missed', title:'Missed commitment — same-side debrief', when:'Within 24-48h of the slip, privately. Sets the culture for how misses are handled.', params:[['person','Person'],['commitment','What was committed'],['cause','The real cause you found together'],['rule','The new early-warning rule']],
 render:v=>'FACTS FIRST, NO WEATHER REPORT\n"'+v.commitment+' was due [date] and didn\u2019t land. I want to understand it with you — this is a working session, not a trial."\n\nFIND THE CAUSE TOGETHER\n"Walk me through it — where did the estimate or the plan diverge from reality? What did you know on which day?"\n(Surface honestly: estimate skill? hidden blocker? overload? a dependency? YOUR late change?)\n\nOWN YOUR SHARE OUT LOUD IF ANY\n"If part of this was my doing — unclear ask, moved goalpost, stacked work — I\u2019ll say it here, and the fix is mine."\n\nRECOVERY + THE REAL DELIVERABLE: THE EARLY-WARNING RULE\n"New date: [date], and the standing rule becomes: '+v.rule+'" (e.g. "you flag risk to any date within 24h of seeing it — flagging early is always free, surprising me is never")\n\nCLOSE\n"Everyone misses. What I can\u2019t run is a team where I find out at the deadline. The rule protects you as much as me."',
 guard:['If this is the third miss with the same shape: it is no longer a missed-commitment case, it is a performance case — run the 4-cause diagnosis.','Never pair this with "and by the way, great work on X" — sandwiching makes both slices inedible.']},
{id:'mediation', title:'Conflict mediation structure', when:'After separate 1:1s with both parties. You facilitate; they own the fix.', params:[['a','Party A'],['b','Party B'],['issue','The neutral one-sentence issue'],['goal','Shared goal both care about']],
 render:v=>'CONTRACT THE SESSION\n"We\u2019re here to make '+v.goal+' work. Ground rules: facts before interpretations, no interrupted sentences, and we leave with one change each — not one winner."\n\nNEUTRAL RESTATEMENT — both must nod\n"The situation as I understand it: '+v.issue+'. Each of you: what did I get wrong in that sentence?"\n\nINTERESTS BEFORE POSITIONS\n"'+v.a+': what do you actually need here — not what you want them to do, but what you need to work well?"\n"'+v.b+': same question."\n(Writer\u2019s trick: needs are usually compatible; positions never are.)\n\nEACH OWNS ONE CHANGE — specific, observable, dated\n"'+v.a+', what are YOU willing to change starting this week?" then "'+v.b+', same."\n(If each says what the OTHER should do, redirect: "that\u2019s their column; what\u2019s yours?")\n\nAGREE THE REPAIR PROTOCOL\n"Next time this heat rises: [signal word / pause rule / bring to me within 48h].^ And we check together in two weeks."\n\nCLOSE\n"You don\u2019t have to like each other. You have to make '+v.goal+' work, and today you both showed you can."',
 guard:['If one party is simply wrong (factual, values, conduct): mediation is the wrong tool — adjudicate privately instead.','Never mediate across a power differential without explicit protection for the junior party.']},
{id:'badnews', title:'Delivering bad news upward / to stakeholders', when:'Miss, delay, incident. Speed and shape matter more than elegance.', params:[['what','What happened'],['impact','Impact (who, how much, until when)'],['plan','The fix plan with dates'],['ask','What you need from them, if anything']],
 render:v=>'LEAD WITH THE HEADLINE — no throat-clearing\n"'+v.what+'. Impact: '+v.impact+'. You\u2019re hearing it from me first, with a plan attached."\n\nFACTS ONLY, NO ADJECTIVES\n"What we know as of [time], what we don\u2019t know yet, when we\u2019ll know it. I\u2019ll flag anything that changes."\n\nTHE PLAN — dates or it\u2019s a wish\n"'+v.plan+'"\n\nYOUR ASK — specific\n"'+(v.ask ? v.ask : "Nothing needed from you beyond awareness — I\u2019ll report back [date].")+'"\n\nTHE LEARNING — one line, real\n"What I own in this: [specific]. What changes so it doesn\u2019t repeat: [systemic fix]."\n\nCLOSE\n"Questions now or in writing — I\u2019d rather answer hard questions today than soft ones at review time."',
 guard:['Never forward a stakeholder complaint to your team raw — you absorb context, you deliver signal.','Bad news early is a deposit in your credibility account; the same news late is a withdrawal with fees.']},
{id:'termination', title:'Separation / termination guardrails', when:'⚠ THE APP STOPS HERE. This is a checklist of principles, not a script to improvise from.', params:[['person','Person'],['reason','Performance-based? Restructure? (verify with HR)']],
 render:v=>'BEFORE ANYTHING — non-negotiables\n1. HR/People team involved BEFORE you schedule anything. This is their process; you are the messenger, not the author.\n2. Documentation: your evidence log (see Performance module) must already be dated and factual. If it isn\u2019t, you are not ready.\n3. Legal exposure is real: performance-based separations without documented warnings are the classic wrongful-treatment case.\n\nPRINCIPLES IF HR CONFIRMS IT PROCEEDS\n• Fast, private, dignified, factual. Under 10 minutes. This is not a negotiation or a feedback session.\n• The sentence HR gives you is the sentence you say. Do not improvise justifications.\n• Logistics handled with humanity: they leave with dignity (timing, exit path, reference policy per HR).\n\nYOUR TEAM, AFTER (same day, brief, private per team)\n"[Person] is no longer with the company as of [date]. I can\u2019t share details and I\u2019d ask you not to speculate. The work transition plan is [X]. Questions about your own role — my door is open, always."\n\nYOURSELF — this stays with you\nEnding someone\u2019s employment, when deserved and handled with dignity, is the job. If it stops feeling heavy, that is the day to worry about yourself.',
 guard:['THIS SITUATION IS BEYOND THIS APP. The tool tracks your tasks; the process belongs to professionals.','Never announce before HR confirms — reverse order creates legal and human damage you cannot undo.','Do not post-date the evidence log. Ever. It is discoverable, and fabrication is a career-ending event.']},
{id:'pip', title:'Formal improvement plan kickoff', when:'Diagnosis done, informal coaching exhausted, HR aware. 30-60 days, written.', params:[['person','Person'],['gaps','The 2-3 gaps with standards'],['support','What you commit to providing'],['date','Review date']],
 render:v=>'FRAME — honesty is kindness here\n"This is a formal improvement plan. It is exactly what it sounds like, and I won\u2019t pretend otherwise — you deserve clarity over choreography."\n\nTHE GAPS — standard, evidence, delta\n"'+v.gaps+'"\n(Each: the standard, the observed evidence, the measurable delta. No personality words.)\n\nWHAT SUCCESS LOOKS LIKE — verifiable\n"By '+v.date+': [each gap → observable proof]. I\u2019ll review evidence weekly with you, in this room, on the record."\n\nYOUR COMMITMENTS — real ones\n"What I commit: '+v.support+'" (weekly 1:1s, training, unblocking, realistic workload — if you don\u2019t invest, you\u2019re running an exit formality, and they can tell.)\n\nTHE FORK — say it plainly\n"Two honest outcomes: you meet the bar and this closes permanently — no asterisk on your record with me. Or the evidence says otherwise, and we handle that with dignity and process. Both are better than ambiguity."\n\nCARE, GENUINE\n"This is a hard week. That\u2019s allowed. My obligation is to be straight with you and to actually help — both start today."',
 guard:['A PIP that is secretly a firing queue poisons the tool for everyone — if the decision is made, do not run theatre.','Weekly written check-ins are protection for BOTH of you. Undocumented support does not exist.']},
{id:'oneone', title:'1:1 opener sets (by situation)', when:'First 5 minutes of a 1:1. Their agenda first, always.', params:[['mode','Situation: standard / new rapport / after conflict / underperformance cloud / morale check']],
 render:v=>({standard:
'"What\u2019s on your mind today?" (then silence — count to ten)\n"What\u2019s taking the most energy this week?"\n"Is there anything you\u2019re waiting on from me that I\u2019ve forgotten?",\n'new rapport':
'"What should I know about how you like to work and receive feedback?"\n"What did your best manager do that I should steal?"\n"What will you tell me when you disagree with me — and how will I know?",\n'after conflict':
'"How are you doing, actually — not about the work?"\n"Is there anything said that week that\u2019s still sitting with you?"\n"What would repair look like from where you sit?",\n'underperformance cloud':
'"Let\u2019s be honest about the room: things are heavy. How are you holding up?"\n"What\u2019s one thing I can do this week that would make the plan feel doable?"\n"What are you worried I\u2019m thinking?"',\n'morale check':
'"On a scale where 10 is \u201cI\u2019d recommend this team to a friend\u201d — where are you? What makes it not one higher?"\n"What should I stop, start, or keep doing?"\n"What\u2019s the thing we all know and nobody says?"'})[(v.mode||'standard').split(' ')[0].toLowerCase().replace('-','')==='new'?'new rapport':(v.mode||'standard').split(' ')[0].toLowerCase()] || 'Pick a mode.'},
 guard:['Your agenda goes second. Always. The 1:1 that opens with YOUR status report trains them to bring nothing.','Cancel a 1:1 twice and you have told them where they rank. Reschedule same-week, never skip.']},
{id:'skip', title:'Skip-level conversation', when:'Meeting your reports\u2019 reports. Intelligence gathering, not undermining.', params:[['person','Person'],['theirManager','Their manager'],['topics','What you want to learn']],
 render:v=>'SET THE FRAME — protect the manager in the middle\n"This is a regular skip-level, not a review of anyone. Nothing you say gets reported as yours, and nothing here changes your manager\u2019s authority over your work."\n\nLEARN, DON\u2019T PROBE FOR DIRT\n"'+v.topics+'"\n(Useful: "What should the org stop doing?" · "What takes longer than it should?" · "When did you last learn something here?"\nPoisonous: "How is '+v.theirManager+' doing?" — if it comes up naturally, listen; never solicit it.)\n\nCLOSE THE LOOP HONORABLY\n"Here\u2019s what I heard (themes only, no names). Here\u2019s one thing I\u2019ll look into. If you want something to reach '+v.theirManager+' directly, I\u2019ll encourage you to raise it with them first — and I\u2019ll back you."',
 guard:['Acting on skip-level intel without the middle manager breaks the chain you depend on. Themes upward, specifics through the chain.','If you discover something serious (conduct/ethics): the escalation test applies — HR channel, not your private fix.']}
];
/* ── 4b. CONTENT — question banks, lessons, scenarios ─────────── */

const LESSONS = [
{id:'l1', arc:'Foundations', title:'Your job changed: maker → multiplier', min:6,
 body:'<p>The craft that promoted you is now <b>40% of your value at most</b>. Your output is no longer your work — it is <b>the sum of your team\u2019s shipped outcomes, minus the friction you failed to remove.</b></p><p>Three shifts, all uncomfortable:</p><p>1️⃣ <b>Interesting → important.</b> You will spend your hour where the system needs you, not where you are clever.</p><p>2️⃣ <b>Answers → questions.</b> A manager who answers everything builds a team that asks everything.</p><p>3️⃣ <b>Credit out, blame in.</b> Wins belong to the team publicly; failures belong to you publicly, and get debriefed privately.</p><div class="reco">Weekly self-test: what did I ship with my own hands this week? If the list is long, I am micromanaging someone\u2019s growth to death.</div>',
 drill:{instruction:'List your last 5 work hours. Tag each M (maker) or L (leader/multiplier). Honest target for a manager of managers: 80% L.', items:['Hour audit done','Top maker-habit identified for delegation','One maker-task converted into someone\u2019s growth opportunity']},
 check:{q:'A senior engineer on your team asks how to solve a problem you could answer in 30 seconds. Best response?', options:['Answer — it is efficient and kind','Ask what they have tried, then think it through WITH them','Refuse to answer to force growth','Send a link to documentation'], answer:1, why:'Answering saves 30 seconds today and costs you 30 seconds forever. Thinking it through together transfers the reasoning — that is the multiplier move. Pure refusal is theater; you are still responsible for unblocking.'}},
{id:'l2', arc:'Foundations', title:'The trust equation', min:5,
 body:'<p>Maister\u2019s model: <b>Trust = (Credibility + Reliability + Intimacy) ÷ Self-orientation.</b></p><p><b>Credibility</b> — do they believe your words? <b>Reliability</b> — do they believe your actions? <b>Intimacy</b> — do they feel safe telling you things? And the killer divisor: <b>Self-orientation</b> — do they believe you act for them or for yourself?</p><p>The equation explains the classic failures: the brilliant jerk (high C, broken I, stratospheric S), the charming flake (high I, zero R), the agenda-hidden manager (everything ÷ huge S).</p><div class="reco">The fastest trust repair is always the denominator: make one decision that visibly costs you and benefits them, and say why.</div>',
 drill:{instruction:'Score yourself per direct report in the People workspace (Trust tab). The app tracks the weakest component per person.', items:['Scored all reports','Identified my highest self-orientation relationship','Planned one denominator-lowering act this week']},
 check:{q:'You keep every promise, you know the domain cold — and your report still does not bring you bad news early. Most likely gap?', options:['Credibility','Reliability','Intimacy','They are just introverted'], answer:2, why:'Early bad news is an intimacy behavior — people share risk where they feel safe, not where they admire competence. Self-orientation is the other suspect: if honesty historically cost them something, they learned.'}},
{id:'l3', arc:'Foundations', title:'1:1s people do not skip', min:7,
 body:'<p>The 1:1 is the highest-leverage tool you own, maybe the only irreplaceable one. Rules that separate real 1:1s from status theater:</p><p>1️⃣ <b>Their meeting.</b> They bring the agenda; yours goes second. Status belongs in async docs.</p><p>2️⃣ <b>Sacred cadence.</b> Cancel twice and you have announced their rank. Reschedule same-week, never skip.</p><p>3️⃣ <b>Commitments flow forward.</b> What you both promise carries to the next session automatically (the app does this for you — watch it).</p><p>4️⃣ <b>Career monthly at minimum.</b> A person who has not discussed their growth in 90 days is a flight risk you have not detected yet.</p><div class="reco">Cadence is not loyalty — it is instrumentation. The app computes the right cadence per person from risk, level, and case load. Deviate only with a reason.</div>',
 drill:{instruction:'Open the 1:1 module. Let the app assemble an agenda for one person — read every source line item it pulled in.', items:['Ran one auto-agenda','Carried one commitment forward','Asked one feedback-to-me question this week']},
 check:{q:'Your report arrives with no agenda, again. Best move?', options:['Skip — nothing to discuss means efficiency','Use the question bank and stay curious — silence is data','Convert it to status updates — at least it is useful','Shorten all future 1:1s'], answer:1, why:'An empty agenda usually means "nothing safe to say" or "you never act anyway" — both are early-warning signals. The question banks exist exactly for this. Silence is data; pursue it.'}},
{id:'l4', arc:'Foundations', title:'SBI: feedback that lands', min:6,
 body:'<p><b>Situation. Behavior. Impact.</b> The structure that keeps feedback factual instead of personal:</p><p>"Tuesday\u2019s design review <i>(Situation)</i> — you interrupted Priya four times before she finished <i>(Behavior — a camera could record it)</i> — the team stopped proposing alternatives and we shipped with the obvious option <i>(Impact — the cost, named)."</i></p><p>Why it works: people can argue with adjectives ("you\u2019re abrasive") but not with footage. Behavior is changeable; character verdicts are not.</p><div class="reco">Praise uses the same structure. "Great job" is junk food. "In Tuesday\u2019s review you asked the question everyone was avoiding — it reset the whole design" is nutrition.</div>',
 drill:{instruction:'Draft one real SBI in the Feedback module now — the app ages drafts and reminds you to deliver them.', items:['One SBI drafted from a real observation','Delivered it and logged the delivery','Reviewed feedback balance for that person']},
 check:{q:'Which is valid SBI behavior description?', options:['"You were disrespectful in the review"','"You rolled your eyes and sighed — very unprofessional"','"You said \u2018that will never work\u2019 before Ana finished presenting, twice"','"You have an attitude problem in meetings"'], answer:2, why:'Quotes and countable actions are footage. "Disrespectful", "unprofessional", and "attitude" are interpretations — arguable, unfixable, and they end the conversation in defense.'}},
{id:'l5', arc:'Foundations', title:'Radical candour quadrants', min:5,
 body:'<p>Kim Scott\u2019s 2×2: <b>Care Personally</b> × <b>Challenge Directly</b>.</p><p>🔹 High care + high challenge = <b>radical candour</b>. 🔹 Care, no challenge = <b>ruinous empathy</b> (the most common failure — it feels kind and produces surprise terminations). 🔹 Challenge, no care = <b>obnoxious aggression</b>. 🔹 Neither = <b>manipulative insincerity</b>, the silent team-killer.</p><p>The hard truth: withheld criticism is not kindness, it is debt you collect later — with interest, in front of HR.</p>',
 drill:{instruction:'Run the candour self-check in Your Leadership. Then pick the person you MOST avoid challenging — that avoidance has a name now.', items:['Self-check done','Named my ruinous-empathy relationship','Scheduled the avoided conversation']},
 check:{q:'A Likeable, long-tenured report underdelivers. You have hinted for months but never said it straight. Which quadrant are you in?', options:['Radical candour','Ruinous empathy','Manipulative insincerity','Obnoxious aggression'], answer:1, why:'You care and therefore avoid challenge — the classic ruinous empathy trap. It ends with them blindsided in a review they cannot appeal, by a manager who "was always so nice".'}},
{id:'l6', arc:'Leading people', title:'Situational leadership II', min:6,
 body:'<p>Blanchard: people are not a development level — <b>they are a development level per task</b>. Your top architect is a D4 at system design and possibly a D1 at client presentations.</p><p><b>D1</b> (low competence, high commitment) → <b>S1 Directing</b>: define it, show it, check daily. <b>D2</b> (some competence, wavering commitment — the hard middle) → <b>S2 Coaching</b>: high direction AND high support. <b>D3</b> (competent, variable motivation) → <b>S3 Supporting</b>: stop prescribing, ask, back their calls. <b>D4</b> → <b>S4 Delegating</b>: outcomes + checkpoints, get out of the way.</p><div class="reco">The two classic mismatches: S1-ing a D4 (they disengage or leave) and S4-ing a D1 (they drown, and it reads as abandonment). The app flags mismatches from your delegation levels.</div>',
 drill:{instruction:'In Delegation, run the SL2 calculator for one live task you are about to hand off. Let it set the authority level.', items:['Scored one live task','Matched authority level to D-level','Scheduled the right checkpoint cadence']},
 check:{q:'A motivated new hire (D1) gets their first real task. Correct style?', options:['Full delegation — trust is motivating','Supportive listening — confidence first','Clear direction with daily checks — D1 needs structure','Let them design the plan to build ownership'], answer:2, why:'Enthusiasm is not competence. D4 treatment of a D1 reads as abandonment when they hit the first wall — daily structure at D1 is care, not micromanagement.'}},
{id:'l7', arc:'Leading people', title:'Delegation that boomerangs back', min:6,
 body:'<p>Delegation fails in three places, and each has a different fix:</p><p>1️⃣ <b>The handoff</b> — task delegated without context, constraints, or a stated authority level. Fix: script it (the Delegation module generates the script).</p><p>2️⃣ <b>The checkpoints</b> — you either vanished (abandonment) or hovered (theft of ownership). Fix: pre-agreed cadence matching SL2 level.</p><p>3️⃣ <b>The failure response</b> — first failure, you snatch it back. That is how you train learned helplessness in exactly the people you cannot afford to lose.</p><div class="reco">After any delegated failure: re-delegate the same class of work within two weeks, at the corrected level. Confidence not rebuilt is confidence destroyed.</div>',
 drill:{instruction:'Open one past delegation that went sideways. Use the delegation-failure case type and let the playbook sequence the repair.', items:['Classified one past failure (handoff/checkpoint/response)','Re-delegated one thing this week','Stated an authority level out loud in the handoff']},
 check:{q:'You handed off the roadmap review. The owner missed two checkpoints and quality dropped. Your move?', options:['Take it back — reliability matters','Drop authority one level, keep them owning it, tighten checkpoints','Escalate to PIP — two misses is a pattern','Pretend it is fine to protect their confidence'], answer:1, why:'Owning the fix beats owning the verdict. One level down with tightened checkpoints treats it as a calibration miss; snatching it back teaches that trying ends careers.'}},
{id:'l8', arc:'Leading people', title:'Reading flight risk', min:7,
 body:'<p>Resignations are concluded 3-6 months before they are announced. The signals, in order of reliability:</p><p>1️⃣ <b>Energy withdrawal</b> — the brainstormer goes quiet; cameras off; "whatever you think" appears.</p><p>2️⃣ <b>Pattern breaks</b> — the punctual one slips; side conversations stop; the vacation calendar fills oddly.</p><p>3️⃣ <b>Growth-starvation</b> — no career conversation in 90+ days. This one you cause.</p><p>4️⃣ <b>Comp grievance</b> — raised once, handled slowly, never revived BY THEM (they revived it with a recruiter).</p><div class="reco">The app aggregates these into the flight-risk score — but you feed the signals. Update them monthly per person; a stale model is worse than none.</div>',
 drill:{instruction:'Open the person you would most hate to lose. Update their signal sliders honestly — then read the prescribed actions.', items:['Signals updated for 3 people','One stay-conversation scheduled','Replacement cost read for my critical person']},
 check:{q:'The first 48 hours after flight-risk signals appear are best spent on…', options:['Counter-offer preparation','A listening conversation with zero pitching','Quietly starting replacement hiring','Loosening their deadlines to reduce stress'], answer:1, why:'You cannot fix what you have not heard, and pitching before listening tells them the conversation was about your staffing, not their career. Offers prepared pre-listening are guesses with a salary attached.'}},
{id:'l9', arc:'Leading people', title:'Performance diagnosis: skill, will, system, clarity', min:8,
 body:'<p>Before ANY performance intervention, one question governs everything: <b>which of the four causes is it?</b></p><p><b>Clarity</b> — do they know the standard? (Your failure.) <b>System</b> — can the environment let them succeed? (Your failure.) <b>Skill</b> — do they know how? (Coachable.) <b>Will</b> — do they want to, in this role, now? (Structural.)</p><p>Three of four causes belong to management. Yet organizations reflexively coach skill. That is how a broken deploy pipeline becomes a junior\u2019s "performance problem".</p><div class="reco">Rule: you may not enter a performance conversation until the diagnosis says skill or will. The app enforces this — it literally blocks the coaching path when system/clarity show up.</div>',
 drill:{instruction:'Run the diagnosis wizard in Performance for one person whose output worries you — answer the four questions with evidence, not vibes.', items:['Diagnosis completed honestly','One system/clarity cause fixed before coaching','Documented the standard in writing']},
 check:{q:'A report\u2019s quality dropped right after you changed the tooling and moved a deadline without re-baselining. First move?', options:['SBI the quality drop at the next 1:1','Start weekly quality monitoring','Fix/clarify the target and system first — then observe','Ask HR about PIP timelines'], answer:2, why:'You changed the environment and kept the scoreboard. That is a system+clarity double-fault — manager-owned. Coaching them for your change teaches the whole team that accountability flows downhill.'}},
{id:'l10', arc:'Leading people', title:'Career conversations & growth maps', min:6,
 body:'<p>"Where do you want to be in two years?" fails because most people honestly do not know. Better instruments:</p><p>1️⃣ <b>Energy audit</b> — what work would you keep if you could drop the rest? (Reveals direction without demanding a destination.)</p><p>2️⃣ <b>Skills they envy</b> — whose job in the org do they read about with interest?</p><p>3️⃣ <b>The gap map</b> — for the target level: written bar, evidence today, 2-3 milestones that produce missing evidence. This is the same document you use for a "not yet" promotion answer.</p><div class="reco">A growth plan that produces no new evidence in 90 days is a bedtime story. The app surfaces stalled plans to the mentor inbox automatically.</div>',
 drill:{instruction:'Pick one person. Draft their gap map to the next level — bar, evidence, milestones with dates.', items:['One gap map written','Energy audit held in a 1:1','Milestones have owners and dates']},
 check:{q:'Your best IC asks to become a manager mostly because it is the only visible growth path. Honest response?', options:['Start management training — retention matters','Build/resurrect the senior-IC track and level with them about what management actually is','Promote on potential — sink or swim','Defer with "next cycle"'], answer:1, why:'Promoting a maker who dislikes management multiplies damage: you lose the craft and gain a reluctant manager. If your org lacks an IC ladder, that is your next leadership project — and the escalate-to-your-boss kind.'}},
{id:'l11', arc:'Leading teams', title:'Psychological safety, operationally', min:7,
 body:'<p>Edmondson\u2019s finding: the best teams REPORT MORE errors — because they hide fewer. Safety is not comfort; it is the cost of honesty, and the leader sets the price.</p><p>Operational levers that move it, in order:</p><p>1️⃣ <b>React to bad news with curiosity, always.</b> One public flinch = six months of filtered information.</p><p>2️⃣ <b>Go first with fallibility.</b> Admit your own error with its cost, regularly.</p><p>3️⃣ <b>Ritualize dissent.</b> "What are we not saying?" in every big decision — then wait ten full seconds.</p><div class="reco">Measure it with the 7-item pulse in the Team workspace. Track the weakest item, not the average — that is where your intervention lives.</div>',
 drill:{instruction:'Run the psych-safety pulse for your primary team (answer as you believe THEY would — or run it anon in the meeting).', items:['Pulse completed','Weakest item identified','One price-of-honesty behavior changed this week']},
 check:{q:'A junior reports a serious mistake in a full meeting. Your first sentence is…', options:['"We will discuss this after the meeting."','"Thank you for raising it fast — let\u2019s figure out what it teaches us."','"Who approved this?"','Dead silence while you think'], answer:1, why:'The room is pricing honesty in real time. Gratitude before analysis is not soft — it is the moment that decides whether you hear about the next mistake in week 1 or week 6.'}},
{id:'l12', arc:'Leading teams', title:'Five dysfunctions, in pyramid order', min:7,
 body:'<p>Lencioni\u2019s cascade, from the base up: <b>trust → conflict → commitment → accountability → results.</b> Each layer REQUIRES the one below.</p><p>The diagnostic rule that makes this model lethal: <b>fix the lowest broken layer only.</b> A results-problem sitting on a trust-problem is a trust-problem wearing a KPI costume. Push accountability onto a team that fears conflict and you get weaponized politeness.</p><p>So: no trust → you go first with vulnerability. No conflict → mine for it, praise dissenters. No commitment → read decisions back aloud before meetings end. Weak accountability → peer-held standards, public scoreboard. No results → collective metric over heroic individuals.</p>',
 drill:{instruction:'Score the five layers in the Team workspace. Read the app\u2019s lowest-layer verdict before intervening on anything above it.', items:['Layers scored','Lowest broken layer named','One intervention matched to THAT layer only']},
 check:{q:'Deadlines slip and nobody calls anyone out. Deathly polite meetings. Where is the dysfunction?', options:['Accountability layer','Commitment layer','Trust or conflict layer','Results layer'], answer:2, why:'Politeness is the signature of avoided conflict, which sits below accountability. Installing peer accountability onto a conflict-fearing team produces punishment ceremonies or quiet collapse — never standards.'}},
{id:'l13', arc:'Leading teams', title:'Tuckman navigation & team stages', min:5,
 body:'<p>Forming → Storming → Norming → Performing. Teams cannot skip storming; they can only delay it (into crisis season) or do it badly (forever).</p><p>Your job mutates by stage: in <b>forming</b> you are structure itself. In <b>storming</b> you are a conflict referee who protects quieter voices — friction HERE is progress. In <b>norming</b> you codify norms and start pushing decisions down; the bottleneck is now you. In <b>performing</b> you shield the team, raise the bar, and grow your own successor.</p><div class="reco">Restaffing resets the clock. Every significant membership change = partial re-forming, and pretending otherwise is why " mature" teams suddenly fight about Slack etiquette in month 9.</div>',
 drill:{instruction:'Let the app stage your team in the Team workspace — check whether your current management style matches the stage.', items:['Stage read for each team','One stage-matched behavior change','Noted the re-forming trigger list']},
 check:{q:'Two months after a merge of two teams, open arguments erupt in planning. Best interpretation?', options:['Leadership failure — restore order fast','Storming, on schedule — surface and mediate the conflicts','A personnel problem with the loudest member','Norming — let them self-resolve'], answer:1, why:'Post-merge friction is the system working through power and norms — suppressing it delays it into the worst quarter. Your job is to make storming productive, not absent.'}},
{id:'l14', arc:'Leading teams', title:'Meeting economics', min:5,
 body:'<p>A weekly 60-minute meeting with 8 people at a $95 blended rate costs <b>≈ $35,000/year</b> and 368 person-hours. It earns that only if it produces decisions a document cannot.</p><p>The audit: 🔹 <b>Decisions per session</b> — under 0.5 means it is a status theater; 🔹 <b>Could an async pre-read halve it?</b> 🔹 <b>Is the attendee list about the work or about prestige?</b> 🔹 <b>Default 25 or 50 minutes</b> — attention does not scale to the calendar slot.</p><div class="reco">The Portfolio module prices every recurring meeting and flags the ones producing no decisions. Cancel one this week — visibly. You just gave your team their Friday back and taught them meetings are auditable.</div>',
 drill:{instruction:'Price your recurring meetings in Portfolio → Meetings. Find the most expensive zero-decision one and act on the recommendation.', items:['All recurring meetings priced','One meeting killed or redesigned','Decisions from meetings now logged in the journal']},
 check:{q:'Your status meeting is beloved — everyone attends, everyone talks. Zero decisions in a month. You should…', options:['Keep it — morale value counts','Convert status to async doc, keep 15min for blockers-only decisions','Rotate the facilitator to freshen it','Shorten to 30 minutes, same content'], answer:1, why:'Beloved status meetings are social clubs billing project rates. Async the status, keep a short blocker-and-decision session — you keep the human contact AND the economics.'}},
{id:'l15', arc:'Judgement', title:'Cynefin + one-way doors: matching response to reality', min:8,
 body:'<p>Snowden\u2019s Cynefin: <b>clear</b> (best practice exists — apply it), <b>complicated</b> (analyzable — get experts, then decide), <b>complex</b> (people/culture — probe gently, sense, respond; plans are guesses), <b>chaotic</b> (crisis — act first to stabilize, sense after).</p><p>Pair it with Bezos\u2019 doors: <b>Type 1</b> (one-way, near-irreversible) deserves process, dissent, a premortem, a night of sleep. <b>Type 2</b> (reversible) deserves speed — decide at 70% information and review the outcome.</p><p>The twin organizational diseases: treating complex people-problems as complicated engineering (they probe back), and running Type 2 doors through Type 1 committees (everything slows to the pace of your most cautious stakeholder).</p><div class="reco">The case intake engine classifies Cynefin automatically and the decision journal enforces the Type 1/2 split. Your job is noticing when the classification looked wrong — and living with having overridden it.</div>',
 drill:{instruction:'Review your open cases: does any complex case (conflict/morale/motivation) have a plan-shaped response? Convert it to 1-2 safe-to-fail probes.', items:['Audited open cases for domain mismatch','One Type 2 decision delegated this week','Premortem run on the next Type 1']},
 check:{q:'Quarterly planning shows team morale sliding after a restructure. Smartest first move?', options:['Launch the engagement initiative from the playbook','Run small probes: listen-tour 1:1s, one symbolic fix, then sense the response','Wait for the survey data to confirm','Restructure again — clarity heals'], answer:1, why:'Morale is a complex system — cause and effect hide until you act. Playbooks assume linearity and read as theater; waiting wastes the window. Small probes generate the information that plans cannot.'}}
];

const SCENARIOS = [
{id:'sc1', title:'The resignation hint', role:'A team lead mentions in a 1:1: “a recruiter reached out, I took the call, mostly curiosity.” Your best senior, two big projects live.', r1:{prompt:'Your first move, this week?', options:[
 {t:'Prepare a counter-offer package so you are ready to move fast', s:1, branch:'counter', f:'Preparing money before listening tells you how this usually ends: you win the auction and lose the person in 8 months.'},
 {t:'Listening conversation — ask what would make them stay, pitch nothing', s:3, f:'Correct. You cannot retain what you have not heard, and anything you pitch now is a guess with a salary attached.'},
 {t:'Start de-risking: quietly cross-train their backup on both projects', s:2, f:'Reasonable as a SECOND move. As a first move it is pure defense — it changes nothing about why they took the call.'},
 {t:'Nothing — “mostly curiosity” is not a resignation, and panic is visible', s:0, f:'“Took the call” is already past the curiosity stage. Flight-risk scored: this is exactly the 48-hour window that matters.'}]},
 r2:{prompt:'They told you: growth has stalled, they feel invisible to leadership. Counter-offer is NOT the issue. You…', options:[
 {t:'Promise a promotion conversation at next cycle, 4 months out', s:1, f:'A vague future dated promise against a live offer. You will be scheduling their farewell in 6 weeks.'},
 {t:'Offer an immediate scope move (visible project, exec exposure) deliverable within 14 days, with a written growth map', s:3, f:'Right — a lever you can pull NOW plus a map for later. Retention is a deliverable, not a conversation.'},
 {t:'Arrange a skip-level so leadership “sees” them', s:1, f:'Visibility theater without scope change. Nice gesture, no mass.'},
 {t:'Accept it gracefully and plan the transition', s:1, f:'Sometimes correct — but you have not made a single real counter-move yet. One concrete lever before surrender.'}]},
 debrief:'Retention is won in the listening-first window with concrete near-term levers. Money answers comp problems; scope and growth answer stall problems. Diagnosing which problem you actually have is the whole game.'},
{id:'sc2', title:'The public blow-up', role:'In sprint review, your two senior engineers erupted at each other over architecture, in front of the team and two stakeholders. The room went silent. Both are looking at you.', r1:{prompt:'In the room, right now, you…', options:[
 {t:'Shut it down: “This is not the forum. We move on.”', s:1, f:'Stops the bleeding but buries the body. The team just watched conflict get suppressed; expect it to re-emerge in passive-aggressive code review.'},
 {t:'Mediate on the spot — let each finish their point, find the truth live', s:0, f:'Public mediation with an audience becomes performance. There are no clean outcomes with stakeholders watching and adrenaline running.'},
 {t:'Pause it with authority AND a promise: “This matters and we will resolve it properly — today, the three of us. For now, next agenda item.”', s:3, f:'Right — the room needs to see conflict taken seriously without being consumed by it. Authority plus a same-day commitment.'},
 {t:'Take a side quickly on the technical merits to end it', s:0, f:'You just taught the team that volume wins verdicts. Also: you adjudicated an architecture question you have not studied, publicly.'}]},
 r2:{prompt:'Same afternoon, the three of you. Opening move?', options:[
 {t:'Meet them jointly from minute one — airing it together builds honesty', s:1, f:'Joint-first makes you the appeal court and both came to WIN. Separately first, always.'},
 {t:'Hear each separately first, then joint session with a neutral restatement both must sign', s:3, f:'The textbook because it works: separate facts and feelings, then a shared reality before any ask.'},
 {t:'Tell them to work it out themselves — they are senior', s:1, f:'Delegation of conflict management works in performing teams with real safety. The blow-up just told you where your team actually is.'},
 {t:'Focus the joint session on whose architecture is right', s:1, f:'The architecture is the topic; the blow-up is about respect, voice, and who decides. Solve the wrong layer and it recurs.'}]},
 debrief:'Conflict in public is contained with authority + a visible promise; resolved in private, separately first. And ask what made voices the only mechanism left: usually it is an unowned decision process. Fix that too.'},
{id:'sc3', title:'The 48-hour deadline', role:'Your director asks for the Q3 roadmap estimate by Friday, for a board pre-read. It is Wednesday. Your leads say honest estimating needs two weeks. Guess-and-miss has burned this team before.', r1:{prompt:'You…', options:[
 {t:'All-hands estimating marathon, ship the number Friday, own the risk', s:1, f:'You will ship a fake number with a confident format. The org will plan on it. This is how death marches get their start date.'},
 {t:'Push back flatly: two weeks or nothing — quality matters to the board', s:1, f:'Principled and useless. The board pre-read is happening regardless; you just removed yourself from it. The number will now be invented WITHOUT your team\u2019s input.'},
 {t:'Deliver a ranged estimate Friday with explicit confidence levels and assumptions, flagged Type-2: “directional now, committed in two weeks after spikes”', s:3, f:'Right — serve the actual need (directional sizing) while refusing the fake precision. Ranges + assumptions + a hard date for commitment.'},
 {t:'Sandbag: estimate everything at 2x so the team is safe', s:0, f:'Sandbagging is lying with extra steps. It poisons portfolio planning and gets discovered exactly once — after which every number you give is discounted forever.'}]},
 r2:{prompt:'The director replies: “The board needs single dates, not ranges. Commit.” You…', options:[
 {t:'Commit to the midpoint dates — board optics matter, and you can renegotiate later', s:0, f:'“Renegotiate later” with a board-visible date is fiction. You just signed a public promise with private doubts — the defining feature of every blown quarter.'},
 {t:'Offer dates with explicit risk labels per initiative (green/yellow/red) and the spike results published in 2 weeks as a scheduled checkpoint', s:3, f:'Yes — dates, but honest ones. Boards accept risk-labeled dates from leaders they trust; they punish surprises from leaders who hid the range.'},
 {t:'Escalate to the leads and let them decide the dates', s:1, f:'Abdication. Your job is exactly this pressure boundary — protecting the estimate\u2019s honesty while serving the business. Passing pressure downhill is the one move worse than absorbing it badly.'},
 {t:'Refuse again, harder', s:1, f:'Twice-refused directors route around you. You are trading your seat at the table for a purity point.'}]},
 debrief:'The skill is pressure translation: serve the need for dates without manufacturing false certainty. Risk-labeled single dates + a committed re-baseline checkpoint is the professional answer. It survives contact with reality AND with the board.'},
{id:'sc4', title:'The toxic rainmaker', role:'Your top performer closes the most deals / ships the most code — and three people have now hinted at how he treats them. A fourth just requested a team transfer, citing “atmosphere”. His numbers are 30% of the team\u2019s output.', r1:{prompt:'First move?', options:[
 {t:'Gather specifics quietly before any confrontation — dates, incidents, patterns', s:2, f:'Right instinct, watch the trap: “quietly” cannot become “indefinitely”. Set yourself a 7-day deadline for the fact-file.'},
 {t:'SBI him immediately on the transfer request, name the pattern', s:3, f:'Correct — with real SBI: specific incidents you can verify, behavioral standard, team impact. The 30% output does not appear in the conversation. That is the point.'},
 {t:'Move the transfer requester — they asked, so grant it; problem eased', s:0, f:'You just relocated the victim and kept the cause. Four data points say he generates one transfer per quarter. The pipeline of leavers is the metric.'},
 {t:'Raise it gently at team level — “let\u2019s all be more careful with tone”', s:0, f:'Global feedback for an individual behavior. He will not recognize himself; everyone else will know exactly who you mean and that you lacked the nerve.'}]},
 r2:{prompt:'The SBI lands. He is contrite for 3 weeks, then a fifth incident. His sponsor is the VP who loves his numbers. You…', options:[
 {t:'Second warning, softer — the numbers genuinely matter this quarter', s:0, f:'You have now proven the standard is negotiable for revenue. Every decent person on the team just updated their model of you.'},
 {t:'Document formally, align with HR and YOUR manager first (pre-wire the VP problem), then final-stakes conversation with behavioral terms and dates', s:3, f:'Right. The political reality (VP sponsor) is managed upward BEFORE the confrontation — this is what “managing up” is actually for.'},
 {t:'Reduce his blast radius: isolate him from juniors, keep the output, skip the verdict', s:1, branch:'quarantine', f:'Containment recognizes the disease but refuses the treatment. You will spend management capital on quarantine logistics forever, and the team still sees the exemption.'},
 {t:'Start the exit process — five incidents is a verdict', s:2, f:'Possibly correct — but only WITH documentation and HR alignment in place. Verdict without paper is how you become the story.'}]},
 debrief:'Toxic rainmakers are a tax that compounds: each incident purchases output with the team\u2019s trust in you. The formula: facts first, SBI fast, formal stakes with HR + upward pre-wiring, and never let the 30% enter the behavior conversation.'},
{id:'sc5', title:'The whisper about layoffs', role:'You learn, genuinely off the record, that a restructure is being explored. Nothing is decided; you are not sure your own team is affected. Your most anxious report just asked you directly: “Are there layoffs coming?”', r1:{prompt:'You answer…', options:[
 {t:'“I have heard nothing.” (True-ish: nothing is decided)', s:0, f:'A technicality that detonates. When the announcement comes, they will remember this sentence verbatim. Trust takes the survivor hit.'},
 {t:'“I will always tell you what I can, when I can — and right now there is nothing decided that I could share even if I knew it. What I promise: you will never be surprised by me on purpose.”', s:3, f:'Right — no lie, no leak, and the promise that actually matters: process honesty. Then manage the anxiety, not the information.'},
 {t:'Share the rumor off the record — loyalty to your report first', s:0, f:'You just leaked unconfirmed restructure info to the most anxious person on the team. It will be “confirmed news” across the org by Friday, with your fingerprints.'},
 {t:'Deflect to performance: “Let\u2019s focus on your Q3 goals”', s:0, f:'They asked about their livelihood and got a calendar. Every person on the team will hear about this deflection.'}]},
 r2:{prompt:'Two weeks later the restructure is confirmed — your team loses one seat, decision largely yours, three weeks to decide. Communication to the team, before names?', options:[
 {t:'Say nothing until the name list is final and meetings are booked', s:1, f:'The rumor mill already knows — you learned of it in a hallway; so did everyone. Silence now reads as either cruelty or cowardice.'},
 {t:'Tell the team the fact + the process + the dates, without names and without false comfort: “One seat. Criteria are X. I will tell each person first, directly.”', s:3, f:'Right — people tolerate hard facts with an honest process; they do not tolerate discovering the process by rumor. Anxiety anyway; trust intact.'},
 {t:'Hint broadly to the most-affected person so they can “prepare”', s:0, f:'Pre-leaking creates a second class of citizen: the walking informed. It also leaks, and now you are the leaky manager during a layoff.'},
 {t:'Ask HR to announce it so the message is professional', s:1, f:'Outsourcing the hardest message of your tenure. The team will never forget who said it and who hid.'}]},
 debrief:'In uncertainty: never lie, never leak, manage anxiety not information. In confirmed hard news: fact + fair process + dates, delivered by you, to each person first. Your behavior during the layoff IS the culture the survivors work in.'},
{id:'sc6', title:'The pet project', role:'You personally championed the internal platform migration. Six weeks in, your best lead shows you clear data: it is 2x cost for marginal gain, and the team is grumbling. Killing it means telling your director your call was wrong.', r1:{prompt:'You…', options:[
 {t:'Give it four more weeks — data can be noisy early, and pivots this fast look panicky', s:1, f:'Sometimes true; check your motive. “Looks panicky” is ego accounting, not decision analysis. Set a kill-criteria date or this is just delay.'},
 {t:'Verify the data with the lead, then kill it fast and say why publicly', s:3, f:'Right — and the public part is the multiplier: you just bought a culture where bad news travels at full speed. That asset outlives the migration.'},
 {t:'Quietly descope it until it fades — no hard conversations needed', s:0, f:'The zombie-project strategy. Everyone knows it is dying; the slow fade costs the same money and all of the credibility.'},
 {t:'Hand the kill decision to the team — it is their data', s:1, f:'The decision is Type-1 politically (your director, your sponsorship). Outsourcing your hot potato to the team teaches them what leadership is for: nothing.'}]},
 r2:{prompt:'You take it to your director: “My sponsorship was wrong; the data says kill.” She asks: “Why should I trust your next big call?” You…', options:[
 {t:'“Because this call WAS mine too — sponsorship and conclusion. The process was right; the information changed. I will bring you the kill-criteria up front on the next one.”', s:3, f:'Exactly right — you are selling decision PROCESS, not infallibility. Directors fund leaders with feedback loops, not leaders with perfect records (those are either lucky or liars).'},
 {t:'Blame the early data: “The vendor benchmarks were misleading”', s:0, f:'You were paid to apply judgement to vendor benchmarks. This answer proves her point.'},
 {t:'Offer to keep a reduced version alive to preserve the original thesis', s:1, f:'Half-killing to save face — the sunk-cost fallacy wearing a compromise costume.'},
 {t:'Accept a demotion of scope on your role — accountability is accountability', s:1, f:'Over-correction as theater. She needs your judgement loop improved, not your shoulders lowered. Martyr moves are ego too.'}]},
 debrief:'Killing your own darling in public, fast, with the reasons on display, is the single highest-yield trust deposit a leader can make. The answer to “why trust you next time” is always the quality of the loop, never the perfection of the record.'}
];

/* ── 5. ENGINE — case intake, propagation, closure, brief ─────── */
const Engine = {

slaDays: sev => ({5:1,4:3,3:7,2:14,1:30}[sev] || 7),

preview(type, sev, personId) {
  const T = CASE_TYPES[type]; if (!T) return [];
  const out = [['tasks', T.playbook.length + ' dated playbook tasks']];
  if (personId) out.push(['people', 'evidence entry + signal flags (flight risk re-scores)']);
  out.push(['oneonones', personId ? '1:1 agenda injection (or auto-scheduled 1:1)' : '—']);
  if (personId && T.scriptId) out.push(['feedback', 'pre-filled SBI draft']);
  if (T.propagate.risk) out.push(['portfolio', 'risk-register entry P' + T.propagate.risk.prob + ' × I' + T.propagate.risk.impact]);
  if (T.propagate.comms) out.push(['portfolio', 'stakeholder comms draft']);
  if (T.propagate.decision) out.push(['decisions', 'decision record with review gate']);
  out.push(['inbox', 'mentor advisory (ranked)']);
  return out;
},

createCase(v) {
  const T = CASE_TYPES[v.type]; if (!T) return null;
  const sev = clamp(v.severity || T.severity, 1, 5);
  const created = todayStr();
  const due = addDays(created, Engine.slaDays(sev));
  const cyc = FW.cynefin((v.title || '') + ' ' + (v.details || ''), T.domain, sev);
  const esc_ = FW.escalationTest(v.type, sev, (v.title || '') + ' ' + (v.details || '') + ' ' + (v.context || ''));
  const quad = FW.eisenhower(sev, Engine.slaDays(sev), sev >= 4);
  const id = uid('c');
  const c = {
    id, type: v.type, title: v.title, details: v.details || '', personId: v.personId || null,
    teamId: v.teamId || (v.personId ? teamOf(v.personId) : null), severity: sev, status: 'open',
    createdAt: created, sla: due, domain: cyc.value, quadrant: quad.value,
    escalated: esc_.escalate, timeline: [{ at: created, text: 'Case registered (' + T.label + ')', tone: 'acc' }],
    prop: [], priorSignals: null, boosted: [], outcome: null, lesson: null, closedAt: null, reviewAt: null
  };
  const led = (mod, kind, rid, label) => c.prop.push({ mod, kind, id: rid, label });

  /* playbook tasks */
  T.playbook.forEach(([off, text]) => {
    const t = { id: uid('t'), title: text, due: addDays(created, off), done: false, source: 'playbook', caseId: id, personId: c.personId, teamId: c.teamId };
    S.tasks[t.id] = t; led('cases', 'task', t.id, text.slice(0, 54));
  });
  c.timeline.push({ at: created, text: T.playbook.length + ' playbook tasks scheduled through ' + fmtDateFull(addDays(created, T.playbook[T.playbook.length - 1][0])), tone: '' });

  /* person-linked propagation */
  if (c.personId) {
    const p = byId('people', c.personId);
    if (p) {
      const ev = { id: uid('e'), personId: p.id, kind: 'case', date: created, text: '[ ' + T.label + ' ]  ' + v.title + (v.details ? ' — ' + v.details.slice(0, 220) : ''), caseId: id, source: 'case' };
      S.evidence[ev.id] = ev; led('people', 'evidence', ev.id, 'evidence entry for ' + p.name);
      p.signals = p.signals || {};
      c.priorSignals = {}; c.boosted = [];
      Object.keys(T.personSignals || {}).forEach(k => {
        c.priorSignals[k] = p.signals[k] || 0;
        p.signals[k] = Math.max(p.signals[k] || 0, T.personSignals[k]);
        c.boosted.push(k);
      });
      if (c.boosted.length) { c.timeline.push({ at: created, text: 'Signal flags raised: ' + c.boosted.join(', ') + ' — flight risk re-scored to ' + FW.flightRisk(p).score, tone: 'risk' }); led('people', 'signals', p.id, 'flight-risk drivers raised'); }
      /* 1:1 agenda injection */
      const oo = Engine.ensureOneOnOne(p.id, sev >= 4 ? 2 : 7);
      if (oo) {
        oo.agenda.push({ id: uid('a'), text: '[Case: ' + T.label + '] ' + v.title + ' — open with their state of mind, facts second', source: 'case', caseId: id, done: false });
        led('oneonones', 'agenda', oo.id, 'agenda item in 1:1 on ' + fmtDateFull(oo.date));
        c.timeline.push({ at: created, text: 'Agenda item injected into 1:1 ' + fmtDateFull(oo.date), tone: '' });
      }
      /* SBI draft */
      const fb = { id: uid('f'), personId: p.id, caseId: id, kind: 'course', status: 'draft', createdAt: created, deliveredAt: null,
        s: created + ' — context: ' + T.label.toLowerCase(), b: v.details || v.title, i: '', next: '' };
      S.feedback[fb.id] = fb; led('feedback', 'draft', fb.id, 'SBI draft for ' + p.name);
      c.timeline.push({ at: created, text: 'SBI feedback draft pre-filled (Feedback module)', tone: '' });
    }
  }
  /* risk register */
  if (T.propagate.risk) {
    const r = { id: uid('r'), title: v.title, prob: T.propagate.risk.prob, impact: T.propagate.risk.impact, mitigation: '', owner: 'You', status: 'open', reviewAt: due, caseId: id };
    S.risks[r.id] = r; led('portfolio', 'risk', r.id, 'P' + r.prob + ' × I' + r.impact + ' in risk register');
  }
  /* comms draft */
  if (T.propagate.comms) {
    const cm = { id: uid('m'), audience: c.teamId ? 'Stakeholders of ' + teamName(c.teamId) : 'Relevant stakeholders', channel: 'written + follow-up live', date: addDays(created, 2), status: 'draft', message: 'Facts: ' + v.title + '\nImpact: [fill]\nPlan: [from playbook]\nNext update: [date]', caseId: id };
    S.comms[cm.id] = cm; led('portfolio', 'comms', cm.id, 'stakeholder comms draft');
  }
  /* decision gate */
  if (T.propagate.decision) {
    const d = { id: uid('d'), title: 'Decide response: ' + v.title, type: esc_.escalate ? 'one-way' : 'two-way', driver: 'You', approver: '', consulted: c.personId ? personName(c.personId) : '', informed: '', context: v.details || T.desc, options: '', choice: '', confidence: 0, premortem: ['', '', ''], date: created, reviewDate: due, status: 'open', outcome: '', grade: 0, caseId: id };
    S.decisions[d.id] = d; led('decisions', 'decision', d.id, 'decision record, review ' + fmtDateFull(due));
  }
  if (esc_.escalate) c.timeline.push({ at: created, text: '⚠ ESCALATION TEST HIT (' + esc_.trigger + ') — HR/professional channel mandatory before playbook steps', tone: 'risk' });
  S.cases[id] = c;
  save();
  return c;
},

closeCase(id, outcome, lesson) {
  const c = byId('cases', id); if (!c || c.status !== 'open') return;
  c.status = 'closed'; c.outcome = outcome; c.lesson = lesson; c.closedAt = todayStr(); c.reviewAt = addDays(todayStr(), 30);
  let cancelled = 0;
  list('tasks').forEach(t => { if (t.caseId === id && !t.done) { t.done = true; t.cancelled = true; cancelled++; } });
  if (c.personId && c.boosted) {
    const p = byId('people', c.personId);
    if (p && c.priorSignals) { Object.keys(c.priorSignals).forEach(k => { p.signals[k] = c.priorSignals[k]; }); }
  }
  const vt = { id: uid('t'), title: 'Case verification: did the outcome for “' + c.title.slice(0, 60) + '” hold?', due: c.reviewAt, done: false, source: 'verification', caseId: id, personId: c.personId, teamId: c.teamId };
  S.tasks[vt.id] = vt;
  const j = { id: uid('j'), date: todayStr(), kind: 'closure', caseId: id, personId: c.personId, text: 'CASE CLOSED — ' + c.title + '\nOutcome: ' + outcome + '\nLesson: ' + lesson };
  S.journal[j.id] = j;
  c.timeline.push({ at: todayStr(), text: 'Closed. ' + cancelled + ' orphaned tasks cancelled, signal flags restored, verification scheduled ' + fmtDate(c.reviewAt), tone: 'ok' });
  save();
},

reopenCase(id) {
  const c = byId('cases', id); if (!c || c.status !== 'closed') return;
  c.status = 'open'; c.closedAt = null;
  c.timeline.push({ at: todayStr(), text: 'Re-opened — closure verification failed. Playbook remains as history; add new tasks manually.', tone: 'risk' });
  save();
},

logTimeline(id, text, tone) { const c = byId('cases', id); if (c) { c.timeline.push({ at: todayStr(), text, tone: tone || '' }); save(); } },

ensureOneOnOne(personId, withinDays) {
  const future = list('oneonones').filter(o => o.personId === personId && o.status === 'scheduled' && o.date >= todayStr()).sort((a, b) => a.date < b.date ? -1 : 1);
  if (future.length) return future[0];
  const oo = { id: uid('o'), personId, date: addDays(todayStr(), withinDays || 7), status: 'scheduled', agenda: [], commitments: [], notes: '', mood: 0, grow: { g: '', r: '', o: '', w: '' } };
  S.oneonones[oo.id] = oo;
  return oo;
},

buildAgenda(personId) { /* auto-assemble agenda from every live source */
  const items = [];
  const p = byId('people', personId); if (!p) return items;
  const pastOo = list('oneonones').filter(o => o.personId === personId && o.status === 'done').sort((a, b) => a.date > b.date ? -1 : 1);
  pastOo.slice(0, 1).forEach(o => (o.commitments || []).filter(cm => !cm.done).forEach(cm => items.push({ text: '⤺ Carried commitment: ' + cm.text, source: 'carried', due: cm.due })));
  list('cases').filter(c => c.personId === personId && c.status === 'open').forEach(c => items.push({ text: '[Case: ' + CASE_TYPES[c.type].label + '] ' + c.title + ' (SLA ' + relDay(c.sla) + ')', source: 'case', caseId: c.id }));
  list('feedback').filter(f => f.personId === personId && f.status === 'draft').forEach(f => items.push({ text: 'Deliver pending feedback draft (' + ageOf(f.createdAt) + 'd old)', source: 'feedback', id: f.id }));
  list('delegations').filter(d => d.personId === personId && d.status === 'active').forEach(d => items.push({ text: 'Checkpoint: “' + d.task.slice(0, 50) + '” (authority L' + d.level + ')', source: 'delegation', id: d.id }));
  const cad = FW.cadence(p);
  items.push({ text: 'Growth check: last career conversation? (cadence model: ' + cad.value + ', ' + cad.band + ')', source: 'cadence' });
  const qb = QBANK[['opening', 'career', 'feedbackToYou', 'teamHealth', 'obstacles'][Math.floor(Math.random() * 5)]];
  items.push({ text: '❝ ' + qb[Math.floor(Math.random() * qb.length)], source: 'question' });
  return items;
},

teamHealth(teamId) {
  const t = byId('teams', teamId); if (!t) return null;
  const ps = (t.psych && t.psych.length === 7) ? FW.psychSafety(t.psych).score : null;
  const dys = FW.fiveDysfunctions(t.dys || {});
  const bf = FW.busFactor(teamId);
  const moraleCases = list('cases').filter(c => c.teamId === teamId && c.status === 'open' && (c.type === 'team_morale' || c.type === 'conflict')).length;
  const parts = [dys.score]; if (ps != null) parts.push(ps);
  let score = parts.reduce((a, b) => a + b, 0) / parts.length - moraleCases * 8 - Math.min(20, bf.score * 6);
  score = Math.round(clamp(score, 0, 100));
  return { score, band: score >= 75 ? 'strong' : score >= 55 ? 'workable' : score >= 35 ? 'strained' : 'critical', ps, dys, bf, stage: FW.tuckman(t) };
}
};

function mentorScan() {
  S.telemetry.ruleRuns++;
  let out = [];
  RULES.forEach(r => { try { const hits = r.run(); hits.forEach(h => out.push(Object.assign({ rule: r.id, w: r.w }, h))); } catch (e) { console.warn('rule ' + r.id, e); } });
  out.sort((a, b) => b.w - a.w);
  /* persist one trend point per day — the review needs history, not vibes */
  try {
    S.trends = S.trends || {};
    const tk = todayStr();
    if (!S.trends[tk]) {
      S.trends[tk] = { total: out.length, risk: out.filter(a => a.tone === 'risk').length, w: out.reduce((a, b) => a + (b.w || 0), 0) };
      const ks = Object.keys(S.trends).sort();
      while (ks.length > 60) { delete S.trends[ks.shift()]; }
    }
  } catch (e) {}
  return out;
}

  const adv = mentorScan();

  list('cases').filter(c => c.status === 'open').sort((a, b) => (isOverdue(a.sla) ? 1000 : 0 + b.severity) - (isOverdue(b.sla) ? 1000 : 0 + a.severity) || b.severity - a.severity)
    .slice(0, 2).forEach(c => focus.push({ icon: 'alarm-clock', title: c.title, why: (isOverdue(c.sla) ? 'SLA breached · ' : 'SLA ' + relDay(c.sla) + ' · ') + CASE_TYPES[c.type].label, link: '#/case/' + c.id, tone: isOverdue(c.sla) ? 'risk' : 'warn' }));
  list('oneonones').filter(o => o.status === 'scheduled' && o.date === todayStr()).forEach(o => focus.push({ icon: 'users', title: '1:1 with ' + personName(o.personId), why: 'today · agenda auto-assembled from ' + o.agenda.length + ' sources', link: '#/oneonones', tone: 'info' }));
  const overdue = list('tasks').filter(t => !t.done && t.due < todayStr());
  if (overdue.length) focus.push({ icon: 'list-todo', title: overdue.length + ' overdue item' + (overdue.length > 1 ? 's' : ''), why: 'oldest: ' + overdue.sort((a, b) => a.due < b.due ? -1 : 1)[0].title.slice(0, 44), link: '#/today', tone: 'warn' });
  const decs = list('decisions').filter(d => d.status === 'open' && d.reviewDate <= todayStr());
  if (decs.length) focus.push({ icon: 'scale', title: decs.length + ' decision' + (decs.length > 1 ? 's' : '') + ' at review gate', why: decs[0].title.slice(0, 50), link: '#/decisions', tone: 'info' });
  return { adv, focus: focus.slice(0, 5), load: FW.loadIndex() };
}

/* snoozes: stateless rules would resurrect dismissed advisories forever —
   the snooze ledger makes filtering a decision with a date, not an accident. */
function advSig(a) { return a.rule + '|' + String(a.text).replace(/<[^>]+>/g, '').slice(0, 48); }
function advVisible(list) { const t = todayStr(); return list.filter(a => !(S.snoozes && S.snoozes[advSig(a)] && S.snoozes[advSig(a)] >= t)); }
function advSnoozed(list) { const t = todayStr(); return list.filter(a => S.snoozes && S.snoozes[advSig(a)] && S.snoozes[advSig(a)] >= t); }
Actions['adv-snooze'] = d => { mut(() => { S.snoozes = S.snoozes || {}; S.snoozes[d.p1] = addDays(todayStr(), 3); }); toast('Snoozed until ' + fmtDate(addDays(todayStr(), 3)) + '. If it still matters in 3 days, it returns — snooze is not a verdict.'); };
Actions['adv-unsnooze'] = d => { mut(() => { delete S.snoozes[d.p1]; }); toast('Back in the queue.'); };

      { key: 'severity', label: 'Severity', type: 'range', min: 1, max: 5, def: 3, lo: '1 · minor', hi: '5 · critical' },
      { key: 'personId', label: 'Person (if about someone)', type: 'person', value: presetPerson || '' },
      { key: 'teamId', label: 'Team (if about a team)', type: 'team', value: presetTeam || '' }
    ],
    live: v => {
      if (!v.type) return '<span style="color:var(--faint)">Choose a case type to preview classification + propagation…</span>';
      const T = CASE_TYPES[v.type]; const sev = clamp(v.severity || T.severity, 1, 5);
      const cyc = FW.cynefin((v.title || '') + ' ' + (v.details || ''), T.domain, sev);
      const es = FW.escalationTest(v.type, sev, (v.title || '') + ' ' + (v.details || ''));
      const q = FW.eisenhower(sev, Engine.slaDays(sev), sev >= 4);
      return '<div class="pillrow" style="margin-bottom:8px">' +
        '<span class="chip info">cynefin: ' + cyc.value + '</span>' +
        '<span class="chip vio">' + q.value + '</span>' +
        '<span class="chip ' + (sev >= 4 ? 'risk' : 'warn') + '">SLA ' + Engine.slaDays(sev) + 'd (due ' + fmtDate(addDays(todayStr(), Engine.slaDays(sev))) + ')</span>' +
        (es.escalate ? '<span class="chip risk">⚠ escalation: ' + esc(es.trigger || 'threshold') + ' — HR channel required</span>' : '<span class="chip ok">within app scope</span>') + '</div>' +
        '<div style="color:var(--dim);margin-bottom:8px">' + cyc.reason[0] + ' <b>' + cyc.reason[1] + '</b></div>' +
        '<div style="font-size:10.5px;font-family:var(--font-m);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:5px">Engine will write:</div>' +
        '<div class="pillrow">' + Engine.preview(v.type, sev, v.personId).map(([m, t]) => '<span class="chip acc">' + m + ' · ' + t + '</span>').join('') + '</div>' +
        (es.escalate ? '<div class="reco risk" style="margin-top:10px">⚠ ' + es.actions.join('<br>') + '</div>' : '');
    },
    submitLabel: 'Register & propagate', onSubmit: v => {
      const c = Engine.createCase(v);
      if (!c) return;
      toast('Case registered — ' + c.prop.length + ' records written across the system.', 'ok');
      go('/case/' + c.id);
    }
  });
}

    (c.teamId ? '<span class="chip"><i data-lucide="users"></i>' + esc(teamName(c.teamId)) + '</span>' : '') +
    '<span style="font-size:11px;color:var(--faint);margin-left:auto">' + done + '/' + tasks.length + ' playbook steps · ' + c.prop.length + ' records · active ' + (lastAct === 0 ? 'today' : lastAct + 'd ago') + '</span></div>' +

function personForm(p) {
  return {
    title: p ? 'Edit ' + p.name : 'Add person', wide: true,
    fields: [
      { key: 'name', label: 'Name', required: true, value: p ? p.name : '' },
      { key: 'role', label: 'Role', value: p ? p.role : '', placeholder: 'e.g. Senior Engineer, Team Lead' },
      { key: 'teamId', label: 'Team', type: 'team', value: p ? p.teamId : '' },
      { key: 'level', label: 'Level', type: 'select', value: p ? p.level : 'mid', options: [['associate', 'Associate / junior'], ['mid', 'Mid'], ['senior', 'Senior'], ['lead', 'Lead / manager']] },
      { key: 'start', label: 'Started (in role)', type: 'date', value: p ? p.start : todayStr() },
      { key: 'onLeaveUntil', label: 'On leave until (optional)', type: 'date', value: p && p.onLeaveUntil ? p.onLeaveUntil : '', help: 'Parental, sabbatical, medical. Cadence / feedback / flight nags pause until this date; cases do NOT — risk is still risk.' },
      { key: 'salary', label: 'Base salary (replacement-cost model)', type: 'number', value: p ? p.salary : 90000 },
      { key: 'criticalFor', label: 'Critical skills owned (comma-separated — feeds bus factor)', value: p ? (p.criticalFor || []).join(', ') : '', placeholder: 'deploy pipeline, payments api' },
      { key: 'motivation', label: 'What drives them (your read)', value: p && p.motivation ? p.motivation : '', placeholder: 'mastery, recognition, stability, growth…' },
      { key: 'notes', label: 'Notes — factual only; disclosable in grievance processes', type: 'textarea', value: p ? p.notes : '' }
    ],
    submitLabel: p ? 'Save' : 'Add person',
    onSubmit: v => {
      mut(() => {
        const id = p ? p.id : uid('p');
        const rec = p || { id, signals: {}, trust: null, sl2: null, nineBox: null, archived: false };
        Object.assign(rec, { name: v.name, role: v.role, teamId: v.teamId || null, level: v.level, start: v.start, salary: v.salary, motivation: v.motivation, notes: v.notes, onLeaveUntil: v.onLeaveUntil || null, criticalFor: v.criticalFor ? v.criticalFor.split(',').map(s => s.trim()).filter(Boolean) : [] });
        S.people[id] = rec;
      });
      toast(p ? 'Saved.' : v.name + ' added — the mentor engine is already scanning.', 'ok');
      if (!p) go('/person/' + list('people').find(x => x.name === v.name).id);
    }
  };
}

}};

Actions['scenario-open'] = d => {

    '<div id="sc-fb"></div></div>', true);
    document.querySelectorAll('[data-sc-opt]').forEach(el => el.addEventListener('click', () => {
      const i = num(el.getAttribute('data-sc-opt'));
      const o = r.options[i];
