<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeadOS — Leadership Operating System · v5</title>
<meta name="description" content="Offline-first leadership operating system for a new manager-of-managers. One file. No backend. Judgment stays with you.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f3efe5; --card:#fcfaf3; --card2:#f7f2e6; --ink:#1a1508; --ink2:#57503d; --ink3:#8a8168;
  --line:#e3dac4; --line2:#d2c6a8; --amber:#b45309; --amber2:#d97706; --amberbg:#fdf3e3;
  --red:#b42318; --redbg:#fdf0ee; --green:#1e7a4e; --greenbg:#edf7f1; --blue:#1d4ed8; --bluebg:#eef3fe;
  --orange:#c2410c; --serif:'Fraunces',Georgia,'Times New Roman',serif; --sans:'Inter',-apple-system,'Segoe UI',Roboto,sans-serif; --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --r:14px; --shadow:0 1px 2px rgba(26,21,8,.05),0 8px 24px -18px rgba(26,21,8,.25);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(rgba(26,21,8,.028) 1px,transparent 1px);background-size:22px 22px}
h1,h2,h3,.h{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;margin:0}
h1{font-size:27px} h2{font-size:20px} h3{font-size:16px}
a{color:var(--amber);text-decoration:none;cursor:pointer} a:hover{text-decoration:underline}
button{font-family:inherit;cursor:pointer}
::selection{background:#f5d9a8}
/* ---------- shell ---------- */
#bar{position:sticky;top:0;z-index:60;background:rgba(243,239,229,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1480px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 18px}
.brand{display:flex;align-items:baseline;gap:8px;cursor:pointer;user-select:none}
.brand .b1{font-family:var(--serif);font-weight:700;font-size:20px;letter-spacing:-.02em}
.brand .b1 em{font-style:normal;color:var(--amber)}
.brand .b2{font-family:var(--mono);font-size:10px;color:var(--ink3);letter-spacing:.14em;text-transform:uppercase}
#bar .sp{flex:1}
.ibadge{position:relative;display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border:1px solid var(--line2);border-radius:99px;background:var(--card);color:var(--ink2);font-weight:600;font-size:12.5px}
.ibadge:hover{border-color:var(--amber)}
.ibadge .n{font-family:var(--mono);font-size:11px;background:var(--amber);color:#fff;border-radius:99px;padding:1px 7px}
.ibadge.hot .n{background:var(--red)} .ibadge.hot{border-color:#efb6ae}
.kbd{font-family:var(--mono);font-size:10px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--ink3);background:var(--card)}
#saveflag{font-family:var(--mono);font-size:10px;color:var(--ink3)}
#saveflag.bad{color:var(--red);font-weight:700}
#quota{width:76px;height:5px;border-radius:99px;background:var(--line);overflow:hidden}
#quota i{display:block;height:100%;background:var(--amber);width:0%}
/* ---------- nav ---------- */
#nav{max-width:1480px;margin:0 auto;display:flex;gap:2px;padding:7px 18px 0;overflow-x:auto;scrollbar-width:none}
#nav::-webkit-scrollbar{display:none}
.navg{display:flex;flex-direction:column;padding-bottom:0}
.navg .gl{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);padding:0 10px 3px}
.navg .gi{display:flex}
.nlink{white-space:nowrap;padding:7px 10px 9px;font-size:12.5px;font-weight:600;color:var(--ink2);border-radius:9px 9px 0 0;border:1px solid transparent;border-bottom:none;display:flex;gap:6px;align-items:center}
.nlink svg{opacity:.75}
.nlink:hover{color:var(--ink);background:var(--card2)}
.nlink.on{color:var(--ink);background:var(--card);border-color:var(--line)}
.nlink.on svg{opacity:1;color:var(--amber)}
/* ---------- main ---------- */
#main{max-width:1480px;margin:0 auto;padding:16px 18px 90px}
.page{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px 22px;margin-top:-1px}
.ph{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.ph .tt{flex:1;min-width:220px}
.ph .tt p{margin:4px 0 0;color:var(--ink2);font-size:13px;max-width:70ch}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--amber);margin-bottom:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card.tone{background:var(--card2)}
.card h3{margin-bottom:8px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
.g23{grid-template-columns:2fr 1.1fr} .g32{grid-template-columns:1.1fr 2fr}
@media(max-width:1080px){.g2,.g3,.g4,.g23,.g32{grid-template-columns:1fr}}
/* ---------- type ---------- */
.muted{color:var(--ink2)} .dim{color:var(--ink3)} .small{font-size:12.5px} .tiny{font-size:11px}
.mono{font-family:var(--mono)}
.pen{font-style:italic;color:var(--ink2)}
/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:10px;border:1px solid var(--line2);background:var(--card);color:var(--ink);font-weight:600;font-size:12.5px;transition:.15s}
.btn:hover{border-color:var(--amber);transform:translateY(-1px)}
.btn.pri{background:var(--ink);color:#f6f1e3;border-color:var(--ink)}
.btn.pri:hover{background:#000;border-color:#000}
.btn.amber{background:var(--amber);border-color:var(--amber);color:#fff}
.btn.amber:hover{background:#94450a}
.btn.danger{color:var(--red);border-color:#eec4be}
.btn.danger:hover{background:var(--redbg);border-color:var(--red)}
.btn.sm{padding:5px 10px;font-size:11.5px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.inp,.sel,.ta{width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--line2);background:#fff;font:inherit;font-size:13px;color:var(--ink)}
.inp:focus,.sel:focus,.ta:focus{outline:2px solid var(--amberbg);border-color:var(--amber)}
.ta{min-height:90px;resize:vertical;line-height:1.55}
.frm{display:grid;gap:12px}
.fin label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);display:block;margin-bottom:4px}
.fin .note{font-size:11.5px;color:var(--ink3);margin-top:3px}
.fin.req label::after{content:" *";color:var(--red)}
.fm2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fm3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:700px){.fm2,.fm3{grid-template-columns:1fr}}
/* ---------- pills/tags ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;font-weight:600;padding:2.5px 9px;border-radius:99px;border:1px solid var(--line2);color:var(--ink2);background:var(--card)}
.pill.red{background:var(--redbg);color:var(--red);border-color:#eec4be}
.pill.green{background:var(--greenbg);color:var(--green);border-color:#bfe0cd}
.pill.amber{background:var(--amberbg);color:var(--amber);border-color:#edd6ae}
.pill.blue{background:var(--bluebg);color:var(--blue);border-color:#c3d4f8}
.pill.ink{background:var(--ink);color:#f0ead8;border-color:var(--ink)}
.sev{display:inline-block;min-width:26px;text-align:center;font-family:var(--mono);font-size:10px;font-weight:700;border-radius:6px;padding:2px 6px;color:#fff}
.sev1{background:#73706a}.sev2{background:var(--blue)}.sev3{background:var(--amber2)}.sev4{background:var(--orange)}.sev5{background:var(--red)}
.dots{display:inline-flex;gap:3px}.dots i{width:8px;height:8px;border-radius:99px;background:var(--line2)}.dots i.f{background:var(--amber)}
.age{font-family:var(--mono);font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:99px}
.age.ok{background:var(--greenbg);color:var(--green)} .age.warn{background:var(--amberbg);color:var(--amber)} .age.bad{background:var(--redbg);color:var(--red)}
/* ---------- meter/spark ---------- */
.meter{height:7px;border-radius:99px;background:var(--line);overflow:hidden;min-width:60px}
.meter i{display:block;height:100%;border-radius:99px;background:var(--amber);transition:width .4s}
.meter.g i{background:var(--green)} .meter.r i{background:var(--red)} .meter.b i{background:var(--blue)}
.stat{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card)}
.stat .v{font-family:var(--serif);font-size:24px;font-weight:600;line-height:1.1}
.stat .l{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin-top:2px}
/* ---------- tables/lists ---------- */
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);text-align:left;padding:7px 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr.hover:hover{background:var(--card2);cursor:pointer}
.rline{display:flex;gap:12px;align-items:center;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:8px}
.rline:hover{border-color:var(--line2)}
.rline .grow{flex:1;min-width:150px}
.tl{border-left:2px solid var(--line2);margin-left:6px;padding-left:16px}
.tl .te{position:relative;padding:0 0 14px}
.tl .te::before{content:"";position:absolute;left:-21px;top:5px;width:8px;height:8px;border-radius:99px;background:var(--amber);border:2px solid var(--card)}
.empty{border:1.5px dashed var(--line2);border-radius:12px;padding:22px;text-align:center;color:var(--ink3);font-size:13px}
/* ---------- advisories ---------- */
.adv{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:12px;background:var(--card);margin-bottom:9px}
.adv.unso{border-left-color:var(--red);background:linear-gradient(0deg,rgba(180,35,24,.035),rgba(180,35,24,.035)),var(--card)}
.adv.pos{border-left-color:var(--green)}
.adv .body{flex:1}
.adv .t{font-weight:600;font-size:13px}
.adv .m{color:var(--ink2);font-size:12.5px;margin-top:1px}
.lockic{color:var(--red)}
/* ---------- modal/palette/toast ---------- */
#msc{position:fixed;inset:0;z-index:90;display:none}
#msc.open{display:block}
.mask{position:absolute;inset:0;background:rgba(26,21,8,.45);backdrop-filter:blur(3px)}
.mcard{position:absolute;left:50%;top:6vh;transform:translateX(-50%);width:min(680px,94vw);max-height:86vh;overflow:auto;background:var(--card);border:1px solid var(--line2);border-radius:18px;box-shadow:0 30px 80px -20px rgba(26,21,8,.5)}
.mcard .mh{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);padding:16px 20px;display:flex;align-items:flex-start;gap:10px;z-index:2}
.mcard .mh .tt{flex:1}
.mcard .mb{padding:18px 20px}
.mcard .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;position:sticky;bottom:0;background:var(--card)}
.xbtn{border:1px solid var(--line2);background:var(--card);border-radius:8px;width:28px;height:28px;display:grid;place-items:center;color:var(--ink2)}
.xbtn:hover{border-color:var(--red);color:var(--red)}
.pal{position:absolute;left:50%;top:12vh;transform:translateX(-50%);width:min(560px,92vw);background:var(--card);border:1px solid var(--line2);border-radius:16px;box-shadow:0 30px 80px -20px rgba(26,21,8,.55);overflow:hidden}
.pal input{width:100%;border:none;border-bottom:1px solid var(--line);background:transparent;padding:14px 16px;font:inherit;font-size:14.5px;outline:none}
.pal .plist{max-height:50vh;overflow:auto;padding:6px}
.pal .pi{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:9px;cursor:pointer}
.pal .pi:hover,.pal .pi.sel{background:var(--card2)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center}
.tst{background:var(--ink);color:#efe9d7;padding:10px 18px;border-radius:99px;font-size:12.5px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:tp .25s ease}
.tst.warn{background:var(--amber)} .tst.bad{background:var(--red)}
@keyframes tp{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
/* ---------- stepper / ninebox / misc ---------- */
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.steps .stp{display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:12px;font-weight:600;color:var(--ink3)}
.steps .stp .n{width:18px;height:18px;border-radius:99px;background:var(--line);color:var(--ink3);display:grid;place-items:center;font-family:var(--mono);font-size:10px;font-weight:700}
.steps .stp.done{color:var(--green);border-color:#bfe0cd}.steps .stp.done .n{background:var(--green);color:#fff}
.steps .stp.on{color:var(--amber);border-color:var(--amber);background:var(--amberbg)}.steps .stp.on .n{background:var(--amber);color:#fff}
.nine{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.nine .cell{border:1px solid var(--line);border-radius:10px;padding:10px;min-height:64px;background:var(--card);font-size:11px}
.nine .cell.hl{border-color:var(--amber);background:var(--amberbg)}
.qa{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--card)}
.opt{display:flex;gap:9px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:9px;margin-top:6px;cursor:pointer;background:#fff;font-size:12.5px}
.opt:hover{border-color:var(--amber)} .opt.pick{border-color:var(--amber);background:var(--amberbg)}
.opt.ok{border-color:var(--green);background:var(--greenbg)} .opt.bad{border-color:var(--red);background:var(--redbg)}
.verdict{font-family:var(--serif);font-style:italic;color:var(--ink2)}
.strip{display:flex;gap:6px}
.strip .d{flex:1;border:1px solid var(--line);border-radius:10px;text-align:center;padding:8px 4px;background:var(--card)}
.strip .d .dd{font-family:var(--mono);font-size:9px;color:var(--ink3);text-transform:uppercase}
.strip .d .n{font-weight:700;font-size:13px;margin-top:2px}
.strip .d.hot{border-color:#efb6ae;background:var(--redbg)}
details.qb{border:1px solid var(--line);border-radius:12px;background:var(--card)}
details.qb summary{padding:11px 14px;font-weight:600;cursor:pointer;list-style:none;display:flex;gap:8px;align-items:center}
details.qb[open] summary{border-bottom:1px solid var(--line)}
details.qb .qi{padding:10px 14px;font-size:12.5px;color:var(--ink2)}
.copyable{position:relative}
pre.mono{background:var(--ink);color:#efe8d4;border-radius:12px;padding:14px;font-size:11.5px;overflow:auto;line-height:1.6}
script mono,.mono{font-family:var(--mono)}
.status-dot{width:9px;height:9px;border-radius:99px;display:inline-block}
/* print */
@media print{
  #bar,#nav,.noprint,#toast,#msc{display:none!important}
  body{background:#fff} #main{padding:0;max-width:none} .page,.card{border:none;box-shadow:none;padding:0}
  .print-only{display:block!important}
}
.print-only{display:none}
@media(max-width:760px){h1{font-size:22px}.bar-in{padding:8px 12px}#main{padding:10px 10px 70px}}
</style>
</head>

<script>
"use strict";
/* ============================================================
   LeadOS v5 — Leadership Operating System
   1. STORE · 2. UTIL/DOM · 3. FW (pure models) · 4. CONTENT
   5. ENGINE (case spine) · 6. MENTOR (rules) · 7. VIEWS
   8. INTEGRITY · 9. SEED+BOOT
   ============================================================ */

/* ============ 1. STORE ============ */
const KEY='leados.v5';
function blank(){return{v:5,you:{name:'',role:'',start:'',tki:{a:2,c:2,co:2,av:2,cp:2},readiness:{}},people:{},teams:{},cases:{},tasks:{},sessions:{},feedback:{},decisions:{},risks:{},goals:{},stakes:{},comms:{},delegs:{},meds:{},coaches:{},negs:{},meets:{},aars:{},jobs:{},cands:{},journal:[],snoozes:{},
 meta:{lastOpen:null,prevOpen:null,weeklast:null,exports:[],press:[],energy:[],qb:{},scen:{},checklist:{},briefs:[],seed:null,saveFail:false,aarArm:{}}}}
function migrateV5(x){ if(!x||typeof x!=='object'||x.v!==5) throw new Error('Not a LeadOS v5 store (wrong shape). Import refused.'); return x }
let S=blank();
function save(){ try{ S.meta.saveFail=false; localStorage.setItem(KEY,JSON.stringify(S)); if(window.requestIdleCallback) requestIdleCallback(()=>topbarFail(false)); else topbarFail(false);}catch(e){ S.meta.saveFail=true; topbarFail(true); toast('Write failed — storage may be full. Export now (Data tab).','bad') } }
function topbarFail(b){ const f=document.getElementById('saveflag'); if(f){ f.textContent=b?'WRITE FAILED':'saved '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); f.classList.toggle('bad',!!b) } }
function load(){ try{ const x=localStorage.getItem(KEY); if(!x) return false; S=migrateV5(JSON.parse(x)); return true }catch(e){ console.warn('load refused:',e.message); return false } }
function uid(){ return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,7) }

/* ============ 2. UTIL / DOM ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const sum=a=>a.reduce((x,y)=>x+y,0);
const round=(v,n)=>{const m=Math.pow(10,n||0);return Math.round(v*m)/m};
function today(off){const d=new Date();d.setDate(d.getDate()+(off||0));return d.toISOString().slice(0,10)}
function dplus(iso,n){const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function ddiff(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5)}
function ageOf(d){return ddiff(d,today())}
function fmtD(d){ if(!d) return '—'; const n=ageOf(d); if(n===0)return 'today'; if(n===1)return 'yesterday'; if(n===-1)return 'tomorrow'; if(n<0)return 'in '+(-n)+'d'; return n+'d ago' }
function fmtDate(d){ if(!d)return '—'; return new Date(d+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'}) }
function money(v){ if(v>=1e6) return '$'+(v/1e6).toFixed(1)+'M'; if(v>=1e3) return '$'+Math.round(v/1e3)+'k'; return '$'+Math.round(v) }
function ageChip(d){ if(!d) return '<span class="age warn">never</span>'; const a=ageOf(d); const c=a>21?'bad':a>10?'warn':'ok'; return '<span class="age '+c+'">'+fmtD(d)+'</span>' }
function dueChip(d){ if(!d) return ''; const a=ddiff(today(),d); return a<0?'<span class="age bad">'+ (-a) +'d overdue</span>':a===0?'<span class="age warn">due today</span>':'<span class="age ok">'+a+'d</span>' }
function ic(n,s){ s=s||15; return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><use href="#i-'+n+'"/></svg>' }
function spark(arr,w,h){ w=w||90;h=h||26; if(!arr||!arr.length) return '<svg width='+w+' height='+h+'></svg>'; const mx=Math.max.apply(0,arr.concat([1])); const mn=Math.min.apply(0,arr.concat([0]));
 const pts=arr.map((v,i)=>[round(i*(w-4)/Math.max(1,arr.length-1)+2,1),round(h-3-((v-mn)/(mx-mn||1))*(h-8),1)]);
 return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'"><polyline fill="none" stroke="var(--amber)" stroke-width="2" points="'+pts.map(p=>p.join(',')).join(' ')+'"/><circle cx="'+pts[pts.length-1][0]+'" cy="'+pts[pts.length-1][1]+'" r="3" fill="var(--amber)"/></svg>' }
function meter(v,mx,cls){ mx=mx||100; return '<div class="meter '+(cls||'')+'"><i style="width:'+clamp(v/mx*100,0,100)+'%"></i></div>' }
function toast(msg,k){ const t=document.createElement('div'); t.className='tst '+(k||''); t.textContent=msg; $('#toast').appendChild(t); setTimeout(()=>{t.style.opacity=0;t.style.transition='.4s';setTimeout(()=>t.remove(),400)},3400) }
function copyText(txt,label){ (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast((label||'Copied')+' to clipboard')).catch(()=>{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast((label||'Copied')+' to clipboard')}catch(e){toast('Copy failed — select and copy manually','bad')}ta.remove()}) }
/* modal system */
let mstack=[];
function openModal(html,opts){ opts=opts||{}; const M=$('#msc'); M.classList.add('open'); M.innerHTML='<div class="mask" data-a="mclose"></div><div class="'+(opts.pal?'pal':'mcard')+'" role="dialog">'+html+'</div>'; mstack.push(opts.onClose||null); if(opts.pal){const i=M.querySelector('input');if(i)setTimeout(()=>i.focus(),30)} }
function closeModal(){ const M=$('#msc'); M.classList.remove('open'); M.innerHTML=''; const f=mstack.pop(); if(f)try{f()}catch(e){} }
function mhead(title,sub){ return '<div class="mh"><div class="tt"><h2>'+esc(title)+'</h2>'+(sub?'<div class="small muted" style="margin-top:2px">'+sub+'</div>':'')+'</div><button class="xbtn" data-a="mclose" aria-label="Close">'+ic('x')+'</button></div>' }
/* generic form modal */
function openForm(o){ /* o:{title,sub,fields:[{k,l,t,opts,req,val,ph,note,min,max,step}],ok,onOk,wide} */
 const F=o.fields.map(f=>{ const v=f.val==null?'':f.val;
  const ph=f.ph?(' placeholder="'+esc(f.ph)+'"'):'';
  let ctrl='';
  if(f.t==='ta') ctrl='<textarea class="ta" name="'+f.k+'"'+ph+'>'+esc(v)+'</textarea>';
  else if(f.t==='sel') ctrl='<select class="sel" name="'+f.k+'">'+f.opts.map(op=>'<option value="'+esc(op.v===undefined?op:op.v)+'"'+(String(op.v===undefined?op:op.v)===String(v)?' selected':'')+'>'+esc(op.l===undefined?op:op.l)+'</option>').join('')+'</select>';
  else if(f.t==='check') ctrl='<label class="row" style="gap:8px"><input type="checkbox" name="'+f.k+'" '+(v?'checked':'')+' style="width:16px;height:16px"> <span class="small">'+esc(f.cl||'Yes')+'</span></label>';
  else if(f.t==='date') ctrl='<input class="inp" type="date" name="'+f.k+'" value="'+esc(v)+'">';
  else if(f.t==='num') ctrl='<input class="inp" type="number" name="'+f.k+'" value="'+esc(v)+'"'+(f.min!=null?' min='+f.min:'')+(f.max!=null?' max='+f.max:'')+(f.step?(' step='+f.step):'')+ph+'>';
  else ctrl='<input class="inp" type="text" name="'+f.k+'" value="'+esc(v)+'"'+ph+'>';
  return '<div class="fin'+(f.req?' req':'')+'">'+('<label>'+esc(f.l)+'</label>')+ctrl+(f.note?'<div class="note">'+f.note+'</div>':'')+'</div>' }).join('');
 openModal(mhead(o.title,o.sub)+'<div class="mb"><form id="fmform" class="frm">'+F+'<div id="fmerr" class="small" style="color:var(--red);font-weight:600"></div></form></div><div class="mf"><button class="btn" data-a="mclose">Cancel</button><button class="btn amber" data-a="fmok"><strong>'+esc(o.ok||'Save')+'</strong></button></div>');
 window.__fmOnOk=vals=>{ try{ const r=o.onOk(vals); if(r===false)return false; return true }catch(e){ toast(e.message||'Invalid input','bad'); return false } };
 window.__fmValidate=o.validate||null;
}
function readForm(){ const el=document.getElementById('fmform'); if(!el) return null; const vals={}; new FormData(el).forEach((v,k)=>vals[k]=typeof v==='string'?v.trim():v); el.querySelectorAll('input[type=checkbox]').forEach(c=>vals[c.name]=c.checked); return vals }
function fmSubmit(){ const vals=readForm(); if(!vals) return; if(window.__fmValidate){ const err=window.__fmValidate(vals); if(err){ const e=document.getElementById('fmerr'); if(e)e.textContent=err; return } } if(window.__fmOnOk(vals)!==false){ closeModal(); save(); render() } }
function confirmBox(title,body,ok,fn,danger){ openModal(mhead(title)+'<div class="mb"><div class="small" style="line-height:1.65">'+body+'</div></div><div class="mf"><button class="btn" data-a="mclose">Cancel</button><button class="btn '+(danger?'danger':'pri')+'" id="cbx">'+esc(ok)+'</button></div>');
 setTimeout(()=>{const b=document.getElementById('cbx'); if(b)b.onclick=()=>{closeModal();fn();}},30) }
function textModal(title,body,opts){ opts=opts||{}; openModal(mhead(title)+(opts.sub?('<div class="small muted" style="padding:0 20px 0;margin-top:-10px">'+opts.sub+'</div>'):'')+'<div class="mb '+(opts.printable?'printme':'')+'">'+(opts.pre?('<pre class="mono">'+esc(body)+'</pre>'):body)+'</div><div class="mf noprint"><button class="btn" data-a="fmdl" data-v="'+esc(opts.dlname||'leados')+'">'+ic('down')+'Download .md</button><button class="btn" data-a="fmcopy">'+ic('copy')+'Copy</button>'+(opts.printable?'<button class="btn" data-a="fmprint">'+ic('print')+'Print</button>':'')+'<button class="btn pri" data-a="mclose">Done</button></div>');
 window.__fmText=typeof body==='string'?body.replace(/<[^>]+>/g,''):''; if(opts.rawtext) window.__fmText=opts.rawtext }
/* view helpers */
function ph(title,sub,actions){ return '<div class="ph"><div class="tt"><div class="eyebrow">LeadOS · v5</div><h1>'+esc(title)+'</h1>'+(sub?'<p>'+sub+'</p>':'')+'</div><div class="row">'+(actions||'')+'</div></div>' }
function sec(title,inner,extra){ return '<section class="card" style="margin-bottom:14px"><div class="row between" style="margin-bottom:10px"><h3>'+esc(title)+'</h3><div class="row">'+(extra||'')+'</div></div>'+inner+'</section>' }
function empty(t,sub){ return '<div class="empty"><div style="font-weight:600">'+esc(t)+'</div>'+(sub?'<div class="small" style="margin-top:3px">'+sub+'</div>':'')+'</div>' }
function dots(n,mx,cls){ let h='<span class="dots">'; for(let i=0;i<(mx||5);i++)h+='<i class="'+(i<n?'f':'')+'"></i>'; return h+'</span>' }

/* ============ 3. FW — pure models (no I/O, no mutation) ============ */
const FW={
 sevSLA:{1:30,2:21,3:10,4:5,5:2},
 cynefin(t){ const m={underperformance:'complicated',departure:'complex',conflict:'complex',ethics_hr:'chaotic',hiring:'complex',reorg:'complex',crisis:'chaotic',delegation:'clear',compensation:'complicated',promotion:'complicated',onboarding:'clear',team_conflict:'complex',rumor:'simple',goal_slip:'complicated',personal:'complex'}; return m[t]||'complex' },
 eisenhower(sev,slaDays){ const urgent=slaDays<=7; const imp=sev>=3; return imp?(urgent?'Q1 · do now':'Q2 · schedule'):(urgent?'Q3 · delegate':'Q4 · drop') },
 escScan(text){ const kws=['harass','discriminat','retaliat','assault','fraud','legal action','lawyer','safety hazard','unsafe','medical','self-harm','threaten','substance']; const t=(text||'').toLowerCase(); const hits=kws.filter(k=>t.includes(k)); return {hit:hits.length>0,kws:hits} },
 trust(p){ const t=p.trust||{c:2,r:2,i:2,s:2}; return round((t.c+t.r+t.i+(6-t.s))/16*100) },
 trustWeak(p){ const t=p.trust||{c:2,r:2,i:2,s:2}; const inv=6-t.s; const m={Credibility:t.c,Reliability:t.r,Intimacy:t.i,'Self-orientation (inv.)':inv}; let wk=null,wv=9; for(const k in m){ if(m[k]<wv){wv=m[k];wk=k} } return wk },
 nineBox(p){ if(!p.nineBox) return null; const {perf,pot}=p.nineBox; const L=v=>v<=1?'low':v===2?'mid':'high';
  const map={'low,low':'Risk — act','low,mid':'Inconsistent','low,high':'Puzzle — diagnose','mid,low':'Core — solid','mid,mid':'Core performer','mid,high':'Growth — invest','high,low':'Expert — keep engaged','high,mid':'High — stretch','high,high':'Star — succession'};
  return {band:map[L(perf)+','+L(pot)],label:['','①','②','③'][0]||'',perf,pot,label2:['low','mid','high'][perf-1]+' perf / '+['low','mid','high'][pot-1]+' pot'} },
 nineStale(p){ return !p.nineBox||ageOf(p.nineBox.d)>120 },
 flight(p,S){ let sc=0; const dr=[];
   const t=FW.trust(p); if(t<52){sc+=18;dr.push(['Trust equation low ('+t+'%)',18])}
   const pl=(p.pulse||[]).slice(-4); if(pl.length>=3){ const sl=pl[pl.length-1].b-pl[0].b; if(sl<=-1){sc+=16;dr.push(['Mood slope −'+Math.abs(sl)+' over '+pl.length+' pulses',16])} }
   const open=(S?Object.values(S.cases):[]).filter(c=>c.st==='open'&&c.sc&&c.sc.p===p.id&&['departure','compensation','personal'].includes(c.ty));
   if(open.length){ const w={departure:22,compensation:10,personal:8}; open.forEach(c=>{sc+=w[c.ty]||8;dr.push(['Open case: '+c.ty,w[c.ty]||8])}) }
   const lastSession=FW.lastSessionD(p,S); if(!lastSession||ageOf(lastSession)>21){sc+=12;dr.push(['No 1:1 in '+((lastSession?ageOf(lastSession):'∞'))+'d',12])}
   if(FW.nineStale(p)){sc+=6;dr.push(['Nine-box '+(p.nineBox?'stale ':'missing'),6])}
   const gates=(p.gates2013&&p.gates2013.missed)||0; if(gates){sc+=8;dr.push([gates+' ramp gate(s) missed',8])}
   const delegs=S?Object.values(S.delegs).filter(d=>d.p===p.id&&d.st==='active'):[]; if(delegs.length&&!delegs.some(d=>d.raised)){sc+=8;dr.push(['Delegation ladder stagnant',8])}
   if(p.salary&&p.salaryF==null){sc+=4;dr.push(['Band position unrecorded',4])}
   sc=clamp(sc,0,100); return {score:sc,band:sc<30?'low':sc<60?'watch':sc<80?'high':'critical',drivers:dr.sort((a,b)=>b[1]-a[1])} },
 lastSessionD(p,S){ const ss=Object.values(S.sessions).filter(s=>s.p===p.id&&s.d).map(s=>s.d).sort(); return ss[ss.length-1]||null },
 moodBlend(pl){ if(!pl||!pl.length) return null; return round(avg(pl.slice(-4).map(x=>x.b))) },
 edmondson(scores){ if(!scores||scores.length<7) return null; const rev={1:1,3:1,5:1}; let s=0; for(let i=0;i<7;i++){ let v=scores[i]; if(rev[i]) v=8-v; s+=v } return round(s/7/7*100) },
 dysf(team){ const d=team.dysf||[]; for(let i=0;i<5;i++){ if(!d[i]) return {stage:i,name:['Absence of trust','Fear of conflict','Lack of commitment','Avoidance of accountability','Inattention to results'][i],done:i} } return {stage:5,name:'All five resolved',done:5} },
 busFactor(team,S){ const caps=team.caps||[]; return caps.map(c=>{ const holders=(c.holders||[]).filter(id=>{const p=S.people[id];return p&&!p.arch&&!p.leave}); return {name:c.name,critical:!!c.critical,risk:c.critical&&holders.length<=1,holders:holders.length} }) },
 teamHealth(team,S){ const mem=Object.values(S.people).filter(p=>p.tid===team.id&&!p.arch);
   const ed=FW.edmondson((team.edmondson||{}).scores); const edN=ed==null?50:ed;
   const pulses=mem.map(p=>FW.moodBlend(p.pulse)).filter(x=>x!=null); const mo=pulses.length?avg(pulses)*20:50;
   const cp=FW.casePressure(S,{tid:team.id}); const cpN=clamp(100-cp,0,100);
   const dy=FW.dysf(team).done/5*100;
   const bus=FW.busFactor(team,S); const busN=bus.length?bus.filter(b=>!b.risk).length/bus.length*100:100;
   const h=round(edN*.25+mo*.25+cpN*.2+dy*.15+busN*.15);
   return {score:h,parts:{safety:edN,mood:mo,cases:cpN,dysf:dy,bus:busN}} },
 krScore(kr){ const b=kr.base,t=kr.tgt,c=kr.cur==null?b:kr.cur; if(t===b) return c>=t?100:0; const v=kr.dir==='down'?(b-c)/(b-t):(c-b)/(t-b); return clamp(round(v*100),0,150) },
 krBand(v){ return v>=100?'done':v>=70?'on track':v>=40?'at risk':'off' },
 bench(team,S){ const mem=Object.values(S.people).filter(p=>p.tid===team.id&&!p.arch&&!p.leave);
   return mem.map(p=>{ const nb=p.nineBox, t=FW.trust(p), dl=Object.values(S.delegs).filter(d=>d.p===p.id&&d.st==='active').length;
     const nbScore=nb?((nb.perf*3+nb.pot*3)+ (nb.perf===3&&nb.pot===3?2:0)):4;
     const score=round(nbScore*8+t*.3+clamp(dl,0,3)*4);
     const nextRep=!nb?'Stamp nine-box first':nb.perf<2||nb.pot<2?'Not a bench candidate yet':dl<2?'Give a delegated outcome (L5+)':'Ready for acting-lead rep';
     return {id:p.id,name:p.name,score,readiness:score>=80?'ready now':score>=60?'6–12 mo':score>=40?'12–24 mo':'develop',nextRep} }).sort((a,b)=>b.score-a.score) },
 slii(skill,will){ const d = skill<1.5&&will>=2?'D1 · Enthusiastic beginner → L1–L3 (direct)':skill<2.5&&will<2?'D2 · Disillusioned learner → L3–L4 (coach)':skill>=2.5&&will<2.5?'D3 · Capable but cautious → L4–L5 (support)':'D4 · Self-reliant achiever → L5–L7 (delegate)'; return d },

/* ============ 5. ENGINE ============ */
function jnote(src,tx){ S.journal.unshift({d:today(),src,tx}); if(S.journal.length>400)S.journal.length=400 }
function addTask(ti,due,ow,src,cs){ const id=uid(); S.tasks[id]={id,ti,due:due||today(3),ow:ow||'you',st:'open',src:src||{k:'manual'},cs:cs||null,cr:today()}; return id }
function personName(id){ const p=S.people[id]; return p?p.name:'(archived)' }
function teamOf(id){ return Object.values(S.teams).find(t=>t.leadId===id||id===t.id) }
function scopeOf(c){ return c.sc&&(c.sc.p?personName(c.sc.p):(c.sc.t?((S.teams[c.sc.t]||{}).name||'? team'):'org')) }
function classify(ty,facts,sev){ const T=CASE_TYPES[ty]; const esc=FW.escScan(facts); const forceEsc=esc.hit||T.esc; const sla=T.esc?0:(FW.sevSLA[sev||T.sev]||10);
 return {cynefin:FW.cynefin(ty),quad:FW.eisenhower(sev||T.sev,sla),sla,esc:forceEsc,kws:esc.kws,wires:forceEsc&&ty!=='ethics_hr'?['evidence','hr']:T.wires,type:forceEsc&&ty!=='ethics_hr'?'ethics_hr':ty} }
function ledger(c,k,rid){ c.wires.push({k,l:WIRE_LABEL[k],rid,route:routeFor(k,rid)}) }
function routeFor(k,rid){ const m={evidence:'#/person/'+rid,agenda:'#/oneonones',sbi:'#/feedback',risk:'#/portfolio',decision:'#/decisions',comms:'#/portfolio',kt:'#/team/'+rid,bench:'#/team/'+rid,backfill:'#/pipeline',prewire:'#/portfolio',goalcheck:'#/portfolio',med:'#/mediation',hr:'#/inbox',diagnosis:'#/performance',skip:'#/skips'}; return m[k]||'#/cases' }
/* wire kinds — every write lands in the case ledger */
const WIRES={
 evidence(c){ if(!c.sc||!c.sc.p)return; const p=S.people[c.sc.p]; if(!p)return; (p.ev=p.ev||[]).unshift({d:today(),tx:'Case opened ('+CASE_TYPES[c.ty].label+'): '+(c.facts||c.ti).slice(0,300),src:'case',rid:c.id}); ledger(c,'evidence',c.sc.p) },
 agenda(c){ (S.meta.agendaBank=S.meta.agendaBank||{}); const pid=c.sc&&c.sc.p; if(!pid)return; (S.meta.agendaBank[pid]=S.meta.agendaBank[pid]||[]).push({src:'case '+CASE_TYPES[c.ty].label,tx:'Case: '+c.ti}); ledger(c,'agenda',pid) },

 decision(c){ const id=uid(); S.decisions[id]={id,ti:'Call needed: '+c.ti,ty:2,daci:{d:'You'},cf:60,op:[],pm:[],dt:today(),rv:today(7),st:'open',rev:[],rid:c.id}; ledger(c,'decision',id) },
 diagnosis(c){ const id=addTask('4-cause diagnosis (system/clarity/skill/will) — blocks coaching: '+c.ti,today(1),'you',{k:'diagnosis'},c.id); c.wires.push({k:'diagnosis',l:WIRE_LABEL.diagnosis,rid:id,route:'#/performance'}) },
 comms(c){ const id=uid(); S.comms[id]={id,ti:'Re: '+c.ti,body:'Draft by case spine — edit before sending.\n\nWhat happened:\nWhat changes:\nWhat does NOT change:\nWhat happens next / when:\n',aud:'team',st:'draft',cr:today(),rid:c.id}; ledger(c,'comms',id) },
 kt(c){ const pid=c.sc&&c.sc.p; if(!pid)return; const p=S.people[pid]; const team=p?Object.values(S.teams).find(t=>t.id===p.tid):null; let n=0;
  if(team&&team.caps) for(const cap of team.caps){ if(cap.critical&&(cap.holders||[]).includes(pid)){ addTask('KT plan: '+cap.name+' — designate backup, run pairing reps ('+p.name+')',today(2),'you',{k:'kt'},c.id); n++ } }
  if(!n) addTask('KT map: list what only '+personName(pid)+' knows; assign backups',today(2),'you',{k:'kt'},c.id);
  ledger(c,'kt',(team&&team.id)||pid) },

 hr(c){ const id=addTask('(HR) Contact your HR partner about the escalation — describe verbatim facts only. Today.',today(),'you',{k:'hr'},c.id); S.tasks[id].hr=true; ledger(c,'hr','') }
};
function createCase(ty,scope,facts,sev,ti){ const cls=classify(ty,facts,sev); const T=CASE_TYPES[cls.type];
 // idempotency: refuse identical open duplicate
 const dup=Object.values(S.cases).find(c=>c.st==='open'&&c.ty===cls.type&&JSON.stringify(c.sc)===JSON.stringify(scope)&&c.ti.toLowerCase()===String(ti||T.label).toLowerCase());
 if(dup) return {dup};
 const c={id:uid(),ty:cls.type,sev:sev||T.sev,sc:scope,ti:ti||T.label,facts:facts||'',cr:today(),sla:today(cls.sla),st:'open',wires:[],ts:[],lk:[],tl:[{d:today(),k:'open',tx:'Case opened · '+cls.cynefin+' · '+cls.quad+' · SLA '+cls.sla+'d'}],cls:null};
 S.cases[c.id]=c;
 T.play.forEach(pl=>c.ts.push(addTask(pl[0]+' ['+T.label+']',today(pl[1]),'you',{k:'case',l:T.label},c.id)));
 (cls.esc?['evidence','hr']:cls.wires).forEach(k=>{ if(WIRES[k]){ try{WIRES[k](c)}catch(e){console.warn(k,e)} } });
 // cross-link related open cases (same scope = signal)
 for(const o of Object.values(S.cases)){ if(o.id!==c.id&&o.st==='open'&&JSON.stringify(o.sc)===JSON.stringify(c.sc)){ c.lk.push(o.id); o.lk.push(c.id); c.tl.push({d:today(),k:'link',tx:'Cross-linked with “'+o.ti+'” — two live cases on one scope'}); o.tl.push({d:today(),k:'link',tx:'Cross-linked with “'+c.ti+'”'}) } }
 if(c.sev>=4) S.meta.aarArm[c.id]=true;
 jnote('case','Opened '+T.label+' ('+scopeOf(c)+') — '+c.ti);
 return {c} }
function closeCase(id,out,les){ const c=S.cases[id]; if(!c)return; let cancelled=0;
 for(const tid of c.ts){ const t=S.tasks[tid]; if(t&&t.st==='open'){t.st='canc';t.why='case closed';cancelled++} }
 c.st='closed'; c.cls={out,les,d:today(),ver:today(30),vfd:null};
 c.tl.push({d:today(),k:'close',tx:'Closed: '+out+' — Lesson: '+les+'. Verification due +30d.'+(cancelled?' ('+cancelled+' task(s) cancelled)':'')});
 jnote('case','Closed '+CASE_TYPES[c.ty].label+' — '+c.ti+' · Lesson: '+les);
 jnote('lesson',les);
 if(c.sev>=4||S.meta.aarArm[c.id]) S.meta.aarArm[c.id]=true; }
function reopenCase(id){ const c=S.cases[id]; if(!c)return; c.st='open'; c.cls=null; c.tl.push({d:today(),k:'reopen',tx:'Re-opened — verification failed or recurred'}); jnote('case','Re-opened: '+c.ti) }
function verifyCase(id){ const c=S.cases[id]; if(!c||!c.cls)return; c.cls.vfd=today(); c.tl.push({d:today(),k:'verify',tx:'Closure verified — no recurrence in 30d'}); jnote('case','Closure verified: '+c.ti) }
function autoAgenda(pid){ const out=[]; const p=S.people[pid]; if(!p)return out;
 for(const c of Object.values(S.cases)){ if(c.st==='open'&&c.sc&&c.sc.p===pid) out.push({src:'case · '+CASE_TYPES[c.ty].label,tx:c.ti}) }
 for(const f of Object.values(S.feedback)){ if(f.p===pid&&f.st==='draft') out.push({src:'feedback draft · '+f.kind,tx:'Deliver: '+(f.b||'SBI draft').slice(0,60)}) }
 Object.values(S.delegs).filter(d=>d.p===pid&&d.st==='active').forEach(d=>{ (d.cp||[]).forEach((cp,i)=>{ if(!cp.done&&cp.d<=today()) out.push({src:'delegation checkpoint',tx:d.task+' — checkpoint due'}) }) });
 const bank=(S.meta.agendaBank||{})[pid]; if(bank&&bank.length) out.push(...bank);
 (S.meta.skipBank=S.meta.skipBank||{}); (S.meta.skipBank[pid]||[]).forEach(x=>out.push({src:'skip themes (de-identified)',tx:x}));
 return out.slice(0,9) }
function consumeAgenda(pid){ const b=(S.meta.agendaBank||{})[pid]||[]; const sk=(S.meta.skipBank||{})[pid]||[]; S.meta.agendaBank[pid]=[]; S.meta.skipBank[pid]=[]; return b.concat(sk) }
function deliverFeedback(id){ const f=S.feedback[id]; if(!f)return; f.st='deliv'; f.del=today();
 if(f.kind==='correct'){ f.vfdue=today(21) }
 const p=S.people[f.p]; if(p){ (p.ev=p.ev||[]).unshift({d:today(),tx:(f.kind==='correct'?'Correction delivered':'Recognition delivered')+' — S: '+f.s+' · B: '+f.b+' · I: '+f.i,src:'feedback',rid:id}) }
 jnote('feedback','Delivered '+f.kind+' to '+personName(f.p)) }
function verifyCorrection(id,v){ const f=S.feedback[id]; if(!f)return; f.vf=v; f.vfD=today();
 jnote('feedback','+21d verification on '+personName(f.p)+': '+(v==='ok'?'change held.':'change lapsed — back to plan.'));
 if(v==='lapse'){ createCase('underperformance',{p:f.p},'Correction lapsed after +21d verification: '+(f.b||''),3,'Lapsed correction — '+personName(f.p)) } }
function acceptCascade(jobId,cand){ const job=S.jobs[jobId]; if(!job)return; const pid=uid();
 S.people[pid]={id:pid,name:cand.name,role:job.role,tid:job.tid||'',mgr:'you',kind:job.tid?'ic':'lead',hire:today(),trust:{c:2,r:2,i:2,s:2},pulse:[],ev:[{d:today(),tx:'Accepted offer ('+job.role+') — auto-created by accept cascade',src:'pipeline'}],nineBox:null,gates2013:{armed:{g30:today(30),g60:today(60),g90:today(90)},done:{},missed:0},dev:[],leave:null,arch:false,salary:null,salaryF:null};
 const t=Object.values(S.teams).find(x=>x.id===job.tid); if(t){ t.members=t.members||[]; if(!t.members.includes(pid))t.members.push(pid) }
 addTask('Day-1 contract conversation — '+cand.name,today(),'you',{k:'pipeline'});
 addTask('Book first 1:1 — '+cand.name,dplus(today(),3),'you',{k:'pipeline'});
 job.st='closed'; job.filledBy=pid;
 if(job.rid&&S.cases[job.rid]){ S.cases[job.rid].tl.push({d:today(),k:'wire',tx:'Backfill accepted → '+cand.name+' created with 30/60/90 ramp gates'}) }
 jnote('pipeline','Accept cascade: '+cand.name+' → person + ramp gates + first 1:1 + day-1 contract'); return pid }
function premortemToRisks(did){ const d=S.decisions[did]; if(!d)return 0; let n=0; (d.pm||[]).forEach(m=>{ if(!m||!m.trim())return; const id=uid(); S.risks[id]={id,ti:'Premortem: '+m,p:3,i:d.ty===1?5:3,ow:'you',mit:'',rv:d.rv,st:'open',rid:did,cr:today()}; n++ }); return n }
function gateHit(pid,g){ const p=S.people[pid]; if(!p||!p.gates2013)return; p.gates2013.done[g]=today();
 p.gates2013.missed=['g30','g60','g90'].filter(k=>{ const due=p.gates2013.armed[k]; return due&&due<today()&&!p.gates2013.done[k] }).length;
 jnote('people','Ramp gate '+g+' hit — '+p.name+(p.gates2013.missed?' ('+p.gates2013.missed+' still open)':' — ramp clean')) }
function hrPacket(pid){ const p=S.people[pid]; if(!p)return '';
 let txt='HR PACKET — '+p.name+' ('+(p.role||'')+') — generated '+today()+'\n'+'='.repeat(48)+'\n';
 txt+='Trust: '+JSON.stringify(p.trust||{})+'\nNine-box: '+(p.nineBox?p.nineBox.perf+'/'+p.nineBox.pot+' ('+p.nineBox.d+')':'none')+'\n\nEVIDENCE LEDGER:\n';
 (p.ev||[]).forEach(e=>{ txt+='['+e.d+'] '+e.tx.replace(/\n/g,' ')+'\n' });
 txt+='\nRELATED CASES:\n';
 Object.values(S.cases).filter(c=>c.sc&&c.sc.p===pid).forEach(c=>{ txt+='['+c.cr+'] '+CASE_TYPES[c.ty].label+' · '+c.ti+' · '+c.st+(c.cls?' · closed '+c.cls.d:'')+'\n\n  FACTS (verbatim):\n  '+c.facts+'\n  TIMELINE:\n'+(c.tl||[]).map(t=>'  - ['+t.d+'] '+t.tx).join('\n')+'\n' });
 txt+='\nFEEDBACK RECORD:\n';
 Object.values(S.feedback).filter(f=>f.p===pid).forEach(f=>{ txt+='['+(f.del||f.cr)+'] '+f.kind.toUpperCase()+' S:'+f.s+' B:'+f.b+' I:'+f.i+(f.vf?(' · verified '+f.vf):'')+'\n' });
 txt+='\nWrite every note as if read aloud in a grievance room.\n'; return txt }
function catchUp(from){ let out=''; const n=d=>ddiff(d,today());
 const cs=Object.values(S.cases).filter(c=>c.cr>=from||c.st==='open');
 out+='CASES (since '+from+'): '+cs.length+' handled/open\n'+cs.slice(0,8).map(c=>'- ['+c.cr+'] '+CASE_TYPES[c.ty].label+' · '+c.ti+' · '+c.st).join('\n')+'\n';
 const jr=S.journal.filter(j=>j.d>=from).slice(0,14);
 out+='\nJOURNAL:\n'+(jr.length?jr.map(j=>'- ['+j.d+'] ['+j.src+'] '+j.tx).join('\n'):'(nothing logged)');
 const od=Object.values(S.tasks).filter(t=>t.st==='open'&&t.due<today());
 out+='\n\nOVERDUE NOW: '+od.length; return out }
function exportState(){ return JSON.stringify(S,null,1) }
function importState(txt){ let x; try{ x=JSON.parse(txt) }catch(e){ throw new Error('Not JSON.') } const m=migrateV5(x);
 const types=['people','teams','cases','tasks','sessions','feedback','decisions','risks','goals','stakes','comms','delegs','meds','coaches','negs','meets','aars','jobs','cands'];
 const taken=new Set(); types.forEach(t=>Object.keys(m[t]||{}).forEach(id=>{ if(taken.has(id)){ const nid=uid(); rewireId(m,t,id,nid); m[t][nid]=m[t][id]; delete m[t][id] } taken.add(id) }));
 Object.assign(S,m); jnote('data','Import accepted — post-import audit auto-ran'); return m }
function rewireId(m,type,oldId,newId){ const J=obj=>{ if(!obj)return; for(const k in obj){ if(obj[k]===oldId)obj[k]=newId; else if(Array.isArray(obj[k]))obj[k]=obj[k].map(v=>v===oldId?newId:v); else if(obj[k]&&typeof obj[k]==='object')J(obj[k]) } }; types__().forEach(t=>{ for(const id in (m[t]||{})) J(m[t][id]) }) }
function types__(){ return ['people','teams','cases','tasks','sessions','feedback','decisions','risks','goals','stakes','comms','delegs','meds','coaches','negs','meets','aars','jobs','cands'] }

const ADV={list:[]};
function quickFaults(){ const out=[]; const ids=new Set();
 for(const t of types__()){ for(const id in (S[t]||{})){ if(ids.has(id))out.push('Duplicate id '+id); ids.add(id) } }
 for(const c of Object.values(S.cases)){ for(const tid of c.ts||[]){ if(!S.tasks[tid])out.push('Case '+c.id.slice(0,6)+' references missing task') } }
 for(const t of Object.values(S.tasks)){ if(t.cs&&!S.cases[t.cs])out.push('Orphan task → case') }
 for(const s of Object.values(S.sessions)){ if(s.p&&!S.people[s.p])out.push('Session → missing person') }
 for(const f of Object.values(S.feedback)){ if(f.p&&!S.people[f.p])out.push('Feedback → missing person') }
 for(const rule of RULES){ if(!rule.id)out.push('Rule without id') }
 return out.slice(0,5) }
function scanMentor(){ const t=today(); const out=[];
 for(const r of RULES){ if(!r.run)continue; let res=null; try{res=r.run()}catch(e){continue} if(!res)continue;
  const sn=S.snoozes[r.id]; if(sn&&sn>=t&&!r.unso&&!res.u)continue;
  out.push({id:r.id,ti:r.ti,sev:r.sev,route:r.route,m:res.m,unso:!!(r.unso||res.u),pos:!!res.pos}) }
 out.sort((a,b)=>(b.unso-a.unso)||(b.sev-a.sev));
 ADV.list=out;
 // daily pressure snapshot
 if(!S.meta.press)S.meta.press=[]; const last=S.meta.press[S.meta.press.length-1];
 if(!last||last.d!==t){ S.meta.press.push({d:t,v:FW.pressure(S)}); if(S.meta.press.length>60)S.meta.press.shift(); save() }
 return out }
function feedbackBalance(){ const m={}; for(const f of Object.values(S.feedback)){ if(!m[f.p])m[f.p]={pos:0,total:0,name:personName(f.p)}; m[f.p].total++; if(f.kind!=='correct')m[f.p].pos++ }
 return Object.values(m).map(r=>Object.assign(r,{pct:r.total?Math.round(r.pos/r.total*100):0})) }
function snoozeRule(id,days){ S.snoozes[id]=today(days); save(); render() }

 (!m.b?'<div class="fm2"><div class="fin"><label>Party B</label><select class="sel" id="mb'+m.id+'">'+ppl().filter(p=>p.id!==m.a).map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join('')+'</select></div><button class="btn sm amber" data-a="medB:'+m.id+'" style="align-self:end">Set & begin</button></div>':'')+
 '<div class="steps">'+STAGES.map((s,i)=>'<span class="stp '+(m.stage>i+1||m.st==='done'?'done':m.stage===i+1?'on':'')+'"><span class="n">'+(i+1)+'</span>'+s+'</span>').join('')+'</div>'+
 (m.b&&m.st!=='done'?'<div class="frm"><div class="fin"><label>Stage '+m.stage+' notes</label><textarea class="ta" id="medn'+m.id+'">'+(esc((m.notes||{})[m.stage]||''))+'</textarea><div class="note">'+esc(QBANK.med[(m.stage-1)%QBANK.med.length])+'</div></div>'+
 ((m.stage===1||m.stage===4)?'<div class="adv unso" style="margin:4px 0"><span class="lockic">'+ic('lock')+'</span><div class="body"><div class="t">Hard-stop gate</div><div class="m">If ANY protected-class content surfaced (harassment, discrimination, retaliation, safety, medical) — stop this protocol now and convert to HR escalation.</div></div></div><label class="row small" style="gap:8px"><input type="checkbox" id="medg'+m.id+'" style="width:16px;height:16px">I confirm: no protected-class content surfaced — safe to proceed</label>':'')+
 '<div class="row"><button class="btn danger" data-a="medHalt:'+m.id+'">Protected content — halt to HR</button><span class="sp" style="flex:1"></span>'+(m.stage<6?'<button class="btn amber" data-a="medAdv:'+m.id+'">Advance to stage '+(m.stage+1)+'</button>':'')+'</div>'+
 (m.stage===6&&!m.agree?'<div class="fin" style="margin-top:8px"><label>Written agreement (who does what, by when)</label><textarea class="ta" id="meda'+m.id+'"></textarea><button class="btn pri" style="margin-top:6px" data-a="medAgree:'+m.id+'">Embed agreement + arm +14d verification</button></div>':'')+'</div>':'<span class="pill green">agreement verified '+(m.agree&&m.agree.vd?'(' +fmtDate(m.agree.vd)+')':'pending — verification task armed')+'</span>')+'</div>' }
Actions.medB=el=>{ const m=S.meds[el.dataset.v]; m.b=document.getElementById('mb'+m.id).value; m.st='armed'; save(); render() };
Actions.medAdv=el=>{ const m=S.meds[el.dataset.v]; const note=document.getElementById('medn'+m.id); if(note&&note.value.trim()){ (m.notes=m.notes||{})[m.stage]=note.value.trim() }
 if(m.stage===1||m.stage===4){ const g=document.getElementById('medg'+m.id); if(!g||!g.checked){ toast('The gate requires explicit confirmation','warn'); return } }
 if(m.stage<6){ m.stage++; m.cr=today(); } save(); render(); toast('Stage '+m.stage+' active') };
Actions.medHalt=el=>{ const m=S.meds[el.dataset.v]; m.stage=1; m.cr=today();
 const r=createCase('ethics_hr',{p:m.a},'Protected-class content surfaced during mediation between '+personName(m.a)+' and '+personName(m.b)+'. Protocol halted per gate. Verbatim notes preserved in mediation record.',5,'Escalation — halted mediation');
 save(); toast('Converted to HR escalation. Only record + evidence + HR task were written.','bad'); go(r.c?'#/case/'+r.c.id:'#/inbox'); render() };
Actions.medAgree=el=>{ const m=S.meds[el.dataset.v]; const a=document.getElementById('meda'+m.id).value.trim(); if(!a){toast('Write the agreement','warn');return}
 m.agree={terms:a,d:today(),vf:today(14)}; m.st='done';
 addTask('Mediation verification — '+personName(m.a)+' ⇄ '+personName(m.b)+': did the agreement hold?',today(14),'you',{k:'mediation'},m.rid);
 [[m.a],[m.b]].forEach(([pid])=>{ const p=S.people[pid]; if(p){(p.ev=p.ev||[]).unshift({d:today(),tx:'Mediation agreement (stage 6): '+a.slice(0,220),src:'mediation'})} });
 jnote('mediation','Agreement embedded: '+personName(m.a)+' ⇄ '+personName(m.b)); save(); render() };

V.delegation=function(){ const act=Object.values(S.delegs).filter(d=>d.st==='active'); const done=Object.values(S.delegs).filter(d=>d.st!=='active');
 let h=ph('Delegation','SLII: level follows skill × will — L1 report-only … L7 full ownership. Boundary conditions and checkpoints are part of the hand-off, not extras.','<button class="btn amber" data-a="delegNew">'+ic('plus')+'New delegation</button>');
 h+=sec('Active ('+act.length+')',act.length?act.map(d=>{ const mm=FW.mismatch(d.level,d.skill,d.will); const next=(d.cp||[]).find(c=>!c.done);
 return '<div class="card" style="margin-bottom:10px"><div class="row between"><strong>'+esc(d.task)+'</strong><span class="pill amber">L'+d.level+'</span></div>'+
 '<div class="row tiny dim" style="margin:6px 0">'+esc(personName(d.p))+' · skill '+d.skill+' · will '+d.will+' · '+FW.slii(d.skill,d.will)+'</div>'+
 (mm?'<div class="adv" style="margin:8px 0"><div class="body"><div class="m">'+esc(mm)+'</div></div></div>':'')+
 '<div class="tiny dim">Boundaries: '+esc(d.bound||'—')+'</div>'+
 '<div class="row" style="margin-top:8px;gap:6px;flex-wrap:wrap">'+(d.cp||[]).map((c,i)=>'<button class="btn sm '+(c.done?'':'danger')+'" data-a="delegCp:'+d.id+':'+i+'" '+(c.done?'disabled':'')+'>'+(c.done?ic('check'):'')+'CP'+(i+1)+' '+fmtDate(c.d)+( !c.done&&c.d<today()?' OVERDUE':'')+'</button>').join('')+'</div>'+
 '<div class="row" style="margin-top:8px"><button class="btn sm" data-a="delegDeb:'+d.id+'">'+ic('check')+'Debrief (L+/L=/L−)</button></div></div>' }).join(''):empty('No active delegations','The ladder is where bench strength is actually built.'));
 h+=sec('History',done.length?done.map(d=>'<div class="rline"><span class="pill '+(d.verdict==='raise'?'green':d.verdict==='lower'?'red':'')+'">'+(d.verdict==='raise'?'raised':d.verdict==='lower'?'lowered':'held')+'</span><div class="grow small">'+esc(d.task)+' — '+esc(personName(d.p))+'</div></div>').join(''):'<div class="dim small">None yet.</div>');
 return '<div class="page">'+h+'</div>' };
Actions.delegNew=()=>openForm({title:'New delegation',fields:[{k:'p',l:'Person',t:'sel',opts:ppl().map(p=>({v:p.id,l:p.name}))},{k:'task',l:'Outcome (verb + object)',req:1},{k:'skill',l:'Skill 0–3',t:'num',min:0,max:3,val:1},{k:'will',l:'Will 0–3',t:'num',min:0,max:3,val:2},{k:'level',l:'Level L1–L7',t:'num',min:1,max:7,val:3},{k:'bound',l:'Boundary conditions',t:'ta',req:1},{k:'cp1',l:'Checkpoint 1',t:'date',val:today(7)},{k:'cp2',l:'Checkpoint 2',t:'date',val:today(21)}],ok:'Delegate',onOk:v=>{ if(!v.task||!v.bound)return false; const id=uid(); S.delegs[id]={id,p:v.p,task:v.task,skill:+v.skill,will:+v.will,level:+v.level,bound:v.bound,cp:[{d:v.cp1,done:false},{d:v.cp2,done:false}],st:'active',cr:today(),raised:false}; jnote('delegation','Delegated L'+v.level+': '+v.task+' → '+personName(v.p)); toast(FW.slii(+v.skill,+v.will)) }});
Actions.delegCp=el=>{ const[id,i]=el.dataset.v.split(':'); S.delegs[id].cp[+i].done=true; save(); render() };
Actions.delegDeb=el=>{ const d=S.delegs[el.dataset.v]; openForm({title:'Debrief — '+d.task,fields:[{k:'verdict',l:'Verdict',t:'sel',opts:[{v:'raise',l:'Raise the ladder (earned more)'},{v:'hold',l:'Hold level'},{v:'lower',l:'Lower + tighten checkpoints'}],val:'hold'},{k:'lesson',l:'Lesson (journals)',t:'ta',req:1}],ok:'Close delegation',onOk:v=>{ if(!v.lesson)return false; d.st='done'; d.verdict=v.verdict; if(v.verdict==='raise')d.raised=true; jnote('delegation','Debrief '+d.task+' — '+v.verdict+'. '+v.lesson); jnote('lesson',v.lesson) }}) };
const pOpts=()=>ppl().map(p=>({v:p.id,l:p.name})).concat([{v:'',l:'—'}]);
/* ---------- PERFORMANCE ---------- */
V.performance=function(){ const list=ppl();
 let h=ph('Performance','Diagnose before coaching. System and clarity causes are manager-owned — coaching a clarity problem is cruelty with a smile. Nine-box board buckets at stamps, staleness ≥120d glows red.');
 h+=sec('4-cause diagnosis (gate for coaching)','<div class="row" style="gap:8px;flex-wrap:wrap">'+list.map(p=>{ const diagnosing=Object.values(S.tasks).find(t=>t.st==='open'&&t.src&&t.src.k==='diagnosis'&&t.cs&&S.cases[t.cs]&&S.cases[t.cs].sc&&S.cases[t.cs].sc.p===p.id); return '<span class="pill '+(diagnosing?'red':'')+'" style="padding:7px 12px">'+esc(p.name)+' <button class="btn sm" data-a="diag:'+p.id+'">'+ic('play')+'Run</button></span>' }).join('')+'</div><div class="tiny dim" style="margin-top:8px">Coaching tasks stay blocked until a diagnosis exists for the active case.</div>');
 const cells={}; list.filter(p=>p.nineBox).forEach(p=>{(cells[p.nineBox.pot+'-'+p.nineBox.perf]=cells[p.nineBox.pot+'-'+p.nineBox.perf]||[]).push(p)});
 h+=sec('Nine-box board','<div class="nine" style="grid-template-columns:80px repeat(3,1fr);align-items:stretch">'+'<div></div><div class="tiny dim" style="padding:4px">Perf 1</div><div class="tiny dim" style="padding:4px">Perf 2</div><div class="tiny dim" style="padding:4px">Perf 3</div>'+
 [3,2,1].map(pot=>'<div class="tiny dim" style="padding:8px 4px">Pot '+pot+'</div>'+[1,2,3].map(perf=>'<div class="cell">'+(cells[pot+'-'+perf]||[]).map(p=>'<a class="pill '+(FW.nineStale(p)?'red':'amber')+'" style="margin:2px" data-a="nav:#/person/'+p.id+'">'+esc(p.name)+'</a>').join('')+'</div>').join('')).join('')+'</div>');
 const stale=list.filter(p=>p.nineBox&&FW.nineStale(p)).length, missing=list.filter(p=>!p.nineBox).length, high=list.filter(p=>['high','critical'].includes(FW.flight(p,S).band)).length, nodev=list.filter(p=>!(p.dev||[]).length).length;
 h+=sec('Quarterly talent ritual — staleness counter (run it this week if any number isn\'t zero)','<div class="grid g4">'+[['Nine-box stale',stale,'#/people'],['Never stamped',missing,'#/performance'],['Flight high/critical',high,'#/people'],['No dev plan',nodev,'#/people']].map(x=>'<div class="stat" style="'+(x[1]?'border-color:#efb6ae':'')+'"><div class="v" style="color:'+(x[1]?'var(--red)':'var(--green)')+'">'+x[1]+'</div><div class="l">'+x[0]+'</div></div>').join('')+'</div>');
 return '<div class="page">'+h+'</div>' };
Actions.diag=el=>{ const pid=el.dataset.v; openForm({title:'4-cause diagnosis — '+personName(pid),sub:'Only ONE primary cause. System and clarity are yours to fix, not theirs to survive.',fields:[{k:'sys',l:'System/process obstacles',t:'ta'},{k:'cla',l:'Clarity — is the expectation explicit?',t:'ta'},{k:'ski',l:'Skill gap',t:'ta'},{k:'wil',l:'Will/motivation gap',t:'ta'},{k:'verdict',l:'Primary cause',t:'sel',opts:[{v:'system',l:'System (manager-owned)'},{v:'clarity',l:'Clarity (manager-owned)'},{v:'skill',l:'Skill (coaching OK)'},{v:'will',l:'Will (direct conversation)'}]}],ok:'Record diagnosis',onOk:v=>{ if((v.verdict==='system'||v.verdict==='clarity')&&!v[v.verdict==='system'?'sys':'cla']){ toast('Manager-owned cause needs specifics','warn'); return false }
 const p=S.people[pid]; (p.ev=p.ev||[]).unshift({d:today(),tx:'Diagnosis — primary cause: '+v.verdict+'. '+(v.sys||v.cla||v.ski||v.wil||'').slice(0,180),src:'diagnosis'});
 for(const t of Object.values(S.tasks)){ if(t.st==='open'&&t.src&&t.src.k==='diagnosis'&&t.cs&&S.cases[t.cs]&&S.cases[t.cs].sc&&S.cases[t.cs].sc.p===pid){ t.st='done'; if(S.cases[t.cs])S.cases[t.cs].tl.push({d:today(),k:'wire',tx:'4-cause diagnosis completed — primary cause: '+v.verdict+'. Coaching unblocked.'}) } }
 if(v.verdict==='system'||v.verdict==='clarity') addTask('(Manager-owned) Fix '+v.verdict+' cause for '+personName(pid)+': '+(v.sys||v.cla).slice(0,80),today(5),'you',{k:'diagnosis'});
 if(v.verdict==='will'){ (S.meta.agendaBank=S.meta.agendaBank||{}); (S.meta.agendaBank[pid]=S.meta.agendaBank[pid]||[]).push({src:'diagnosis',tx:'Will gap identified — direct conversation about what changed'}) }
 jnote('performance','Diagnosis '+personName(pid)+': '+v.verdict) }}) };
/* ---------- DECISIONS ---------- */
V.decisions=function(){ const list=Object.values(S.decisions).sort((a,b)=>(a.st===b.st?(a.rv<b.rv?-1:1):a.st==='open'?-1:1));
 let h=ph('Decision journal','Type-1 doors get a premortem — the engine refuses otherwise. Confidence is stamped at log time; outcomes grade your calibration drift. Re-dating requires a reason — silence is not a strategy.','<button class="btn amber" data-a="decModal">'+ic('plus')+'Log a decision</button>');
 h+=sec('Journal ('+list.length+')',list.length?list.map(d=>{ const overdue=d.st==='open'&&d.rv<today();
 return '<div class="card" style="margin-bottom:10px"><div class="row between"><div><strong>'+esc(d.ti)+'</strong> <span class="pill '+(d.ty===1?'red':'blue')+'">Type '+d.ty+'</span> '+(d.st==='open'?'<span class="pill amber">open</span>':'<span class="pill green">'+d.st+'</span>')+(d.out?'<span class="pill">outcome: '+d.out+'</span>':'')+'</div>'+(overdue?'<span class="age bad">gate passed '+fmtD(d.rv)+'</span>':'<span class="age">gate '+fmtDate(d.rv)+'</span>')+'</div>'+
 '<div class="small muted" style="margin-top:6px">D: '+esc(d.daci&&d.daci.d||'you')+' · confidence '+d.cf+'% · logged '+fmtDate(d.dt)+' · options '+(d.op||[]).length+' · premortem '+(d.pm||[]).filter(x=>x&&x.trim()).length+' modes'+(d.rev&&d.rev.length?' · re-dated ×'+d.rev.length:'')+'</div>'+
 (d.pm&&d.pm.length?'<div class="tiny dim" style="margin-top:4px">Premortem: '+d.pm.filter(x=>x&&x.trim()).map(x=>esc(x.slice(0,60))).join(' · ')+'</div>':'')+
 (d.st==='open'?'<div class="row" style="margin-top:8px"><button class="btn sm" data-a="decRisks:'+d.id+'">Premortem → risks</button><button class="btn sm" data-a="decRedate:'+d.id+'">Re-date (reason required)</button><button class="btn sm amber" data-a="decOut:'+d.id+'">Log outcome</button><button class="btn sm danger" data-a="decKill:'+d.id+'">Kill</button></div>':'')+'</div>' }).join(''):empty('No decisions logged','Decisions you don\'t log can\'t teach you.'));
 return '<div class="page">'+h+'</div>' };
Actions.decModal=()=>openForm({title:'Log a decision',fields:[{k:'ti',l:'Decision',t:'text',req:1},{k:'ty',l:'Door type',t:'sel',opts:[{v:2,l:'Type 2 — two-way door (decide fast)'},{v:1,l:'Type 1 — one-way door (premortem enforced)'}]},{k:'dr',l:'DACI — Driver',t:'text',val:'You'},{k:'cf',l:'Confidence 0–100',t:'num',min:0,max:100,val:60},{k:'op',l:'Options considered (one per line)',t:'ta'},{k:'pm',l:'Premortem: “it failed because…” (≥3 for Type 1, one per line)',t:'ta'},{k:'rv',l:'Review gate',t:'date',val:today(14)}],ok:'Log',validate:v=>{ if(+v.ty===1&&(v.pm||'').split('\n').filter(x=>x.trim()).length<3) return 'Type-1 refused: premortem needs at least 3 failure modes'; if(!v.ti)return 'Title required'; return null },
 onOk:v=>{ const id=uid(); S.decisions[id]={id,ti:v.ti,ty:+v.ty,daci:{d:v.dr},cf:+v.cf,op:(v.op||'').split('\n').filter(x=>x.trim()),pm:(v.pm||'').split('\n').filter(x=>x.trim()),dt:today(),rv:v.rv,st:'open',rev:[]}; jnote('decision','Logged Type '+v.ty+': '+v.ti+' @'+v.cf+'%'); toast(+v.ty===1?'Type-1 logged — premortem attached':'Logged'); }});
Actions.decRisks=el=>{ const n=premortemToRisks(el.dataset.v); save(); toast(n+' premortem modes now live as P×I risk rows'); render() };
Actions.decRedate=el=>{ const d=S.decisions[el.dataset.v]; openForm({title:'Re-date review gate — reason mandatory',fields:[{k:'rv',l:'New gate',t:'date',req:1},{k:'why',l:'Reason (the record keeps it)',t:'ta',req:1}],ok:'Re-date',onOk:v=>{ if(!v.why)return false; d.rev.push({from:d.rv,to:v.rv,why:v.why,d:today()}); d.rv=v.rv; jnote('decision','Re-dated “'+d.ti+'”: '+v.why) }}) };
Actions.decOut=el=>{ const d=S.decisions[el.dataset.v]; openForm({title:'Log outcome — '+d.ti,fields:[{k:'out',l:'Outcome vs expectation',t:'sel',opts:[{v:'better',l:'Better than expected'},{v:'expected',l:'As expected'},{v:'worse',l:'Worse'}]},{k:'lesson',l:'Lesson',t:'ta',req:1}],ok:'Close decision',onOk:v=>{ if(!v.lesson)return false; d.st='closed'; d.out=v.out;
 const cal=d.cf>=70&&v.out==='worse'?'overconfident':d.cf<=40&&v.out==='better'?'underconfident':'calibrated'; d.cal=cal;
 jnote('decision','Outcome “'+d.ti+'”: '+v.out+' — calibration '+cal); jnote('lesson',v.lesson); if(cal!=='calibrated')toast('Calibration flag: '+cal,'warn') }}) };
Actions.decKill=el=>{ S.decisions[el.dataset.v].st='killed'; save(); render() };

V.portfolio=function(){ const goals=Object.values(S.goals), risks=Object.values(S.risks).filter(r=>r.st==='open'), stakes=Object.values(S.stakes), comms=Object.values(S.comms);
 let h=ph('Portfolio & governance','OKRs score direction-aware. Red risks with blank mitigation are called out by name. Stakeholder stances and comms drafts the case spine wrote all live here.','<button class="btn" data-a="goalModal">'+ic('plus')+'Goal</button><button class="btn" data-a="riskModal">'+ic('plus')+'Risk</button><button class="btn" data-a="stakeModal">'+ic('plus')+'Stakeholder</button>');
 h+=sec('OKRs ('+goals.length+')',goals.length?goals.map(g=>{ const done=(g.krs||[]).length?avg(g.krs.map(k=>FW.krScore(k))):0; return '<div class="card" style="margin-bottom:10px;padding:12px"><div class="row between"><strong>'+esc(g.ob)+'</strong><span class="row">'+(g.graded?'<span class="pill green">'+esc(g.grade)+'</span>':(g.dl<today()?'<span class="pill red">expired — grade it</span> <button class="btn sm amber" data-a="goalGrade:'+g.id+'">Run grading ritual</button>':'<span class="pill amber">due '+fmtDate(g.dl)+'</span>'))+'</span></div>'+(g.krs||[]).map(k=>{ const s=FW.krScore(k); return '<div class="row" style="margin:6px 0;gap:8px"><span class="small" style="flex:1">'+esc(k.tx)+'</span>'+(k.hist&&k.hist.length>1?spark(k.hist.map(x=>x.v),60,18):'')+'<span class="tiny dim mono">'+(k.dir==='down'?'↓':'↑')+' '+k.cur+' → '+k.tgt+'</span><span class="pill '+(s>=100?'green':s>=70?'green':s>=40?'amber':'red')+'">'+s+'</span><button class="btn sm" data-a="krUpd:'+g.id+':'+k.id+'">update</button></div>' }).join('')+'<div class="tiny dim" style="margin-top:4px">Agg '+(Math.round(done))+'% · target date '+fmtDate(g.dl)+'</div></div>' }).join(''):empty('No goals','KRs that move monthly or they\'re fiction.'));
 h+='<div class="grid g2">';
 h+=sec('Risk register ('+risks.length+')',risks.length?'<table class="tbl"><tr><th>Risk</th><th>P×I</th><th>Mitigation</th><th>Review</th><th></th></tr>'+risks.sort((a,b)=>b.p*b.i-a.p*a.i).map(r=>{ const x=FW.px(r.p,r.i); return '<tr><td><strong>'+esc(r.ti.slice(0,50))+'</strong>'+(r.mit?'':'<br><span class="pill red tiny">no mitigation</span>')+'</td><td><span class="pill '+(x.band==='red'?'red':x.band==='amber'?'amber':'green')+'">'+r.p+'×'+r.i+'</span></td><td class="dim small">'+esc((r.mit||'—').slice(0,40))+'</td><td>'+dueChip(r.rv)+'</td><td><button class="btn sm" data-a="riskEdit:'+r.id+'">Edit</button> <button class="btn sm" data-a="adkar:'+r.id+'">ADKAR</button></td></tr>' }).join('')+'</table>':empty('No open risks','Premortems from decisions write here.'));
 h+=sec('Stakeholders — power × interest ('+stakes.length+')',(stakes.length?'<div class="grid g2" style="grid-template-columns:1fr 1fr;gap:8px">'+['manage closely','keep satisfied','keep informed','monitor'].map(st=>'<div class="card tone" style="padding:10px;min-height:70px"><div class="tiny dim" style="text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px">'+st.toUpperCase()+'</div>'+stakes.filter(s2=>s2.stance===st).map(s2=>'<div class="row between small" style="padding:2px 0"><span>'+esc(s2.name)+'</span>'+(s2.last?'<span class="age '+(st==='manage closely'&&ageOf(s2.last)>14?'bad':'ok')+'">'+fmtD(s2.last)+'</span>':'<span class="age warn">never</span>')+'</div>').join('')+'</div>').join('')+'</div>':'')+
 '<table class="tbl"><tr><th>Name</th><th>P×I</th><th>Play</th><th>Contact</th></tr>'+stakes.map(s=>'<tr><td><strong>'+esc(s.name)+'</strong></td><td>'+s.power+'×'+s.interest+'</td><td class="dim small">'+esc((s.play||'').slice(0,44))+'</td><td><button class="btn sm" data-a="stakeTouch:'+s.id+'">Log contact</button></td></tr>').join('')+'</table>');
 h+='</div>';

function scenStep(){ const {si,st,score}=window.__scen; const sc=SCENARIOS[si];
 if(st>=sc.stages.length){ const max=sc.stages.length*4; const v=score>=max?'masterclass':score>=max-2?'solid':score>=2?'passable — re-run it':'harmful — re-run now';
  const prev=S.meta.scen[si]; if(!prev||score>prev.score)S.meta.scen[si]={score,verdict:v,d:today()};
  jnote('simulator','“'+sc.ti+'” — '+score+'/'+max+' ('+v+')');
  openModal(mhead('Debrief — '+sc.ti,'Two-tier scoring: brilliant=4, safe=2, harmful=0.')+'<div class="mb"><div class="stat" style="margin-bottom:12px"><div class="v">'+score+' / '+max+'</div><div class="l">'+v+'</div></div><div class="small muted">The score journals either way. Mastery is the number climbing across runs, not a perfect first one.</div></div><div class="mf"><button class="btn pri" data-a="mclose">Done</button></div>');
  save(); render(); return }

 openModal(mhead(sc.ti+' — stage '+(st+1)+'/'+sc.stages.length,'Running score: '+score)+'<div class="mb"><div class="pen" style="font-size:14px;line-height:1.7;margin-bottom:12px">'+esc(sg.set)+'</div>'+

 {cls:'uniq-ids',name:'Unique ids across all collections',check(){const seen=new Set(),out=[];for(const t of types__())for(const id in (S[t]||{})){if(seen.has(id))out.push(id);seen.add(id)}return out}},

document.addEventListener('change',e=>{ const el=e.target.closest('[data-ch]'); if(!el)return; chHandle(el) });
function chHandle(el){ const ch=el.dataset.ch; const i=ch.indexOf(':'); const act=ch.slice(0,i); const rest=ch.slice(i+1);
 if(act==='trust'){ const[p,k]=rest.split(':'); const p2=S.people[p]; if(p2){ (p2.trust=p2.trust||{c:2,r:2,i:2,s:2})[k]=+el.value; save(); render() } }
 if(act==='tki'){ S.you.tki[rest]=+el.value; save(); const m=document.getElementById('tkiMirror'); if(m)m.textContent=tkiMirror() }
 if(act==='cstage'){ const c=S.cands[rest]; if(c){ c.stage=+el.value; c.entered=today(); if(c.stage<4)c.discussed=false; jnote('pipeline',c.name+' → stage '+c.stage); save(); render() } } }
document.addEventListener('keydown',e=>{ const typing=e.target&&(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.target.isContentEditable);
 if(e.key==='Escape'){ if(document.getElementById('msc').classList.contains('open'))closeModal(); return }
 if(typing)return;
 if(e.key==='/'||(e.key.toLowerCase()==='k'&&(e.ctrlKey||e.metaKey))){ e.preventDefault(); openPalette(); return }
 if(e.key.toLowerCase()==='c'){ e.preventDefault(); Actions.caseModal(); return }
 const idx=['1','2','3','4','5','6','7','8','9','0'].indexOf(e.key);
 if(idx>=0){ const r=['today','inbox','cases','people','oneonones','feedback','coach','decisions','academy','review'][idx]; go('#/'+r) } });
/* boot */
(function init(){
 window.addEventListener('hashchange',render);
 const had=load();
 if(!had){ try{ S=blank(); seed(); }catch(e){ console.error('seed failed',e); S=blank() } }
 S.meta.prevOpen=S.meta.lastOpen; S.meta.lastOpen=today();
 S.meta.exports=S.meta.exports||[]; S.meta.press=S.meta.press||[]; S.meta.energy=S.meta.energy||[]; S.meta.journal=S.journal||[];
 if(!location.hash)location.hash='#/today';
 save(); render();
})();



</script>
</body>
