    </div>

  <!-- MAIN -->

<script>
(function(){
'use strict';

/* =========================================================================
 * LEADOS — namespace. Spelled LEADOS (not the real repo's window.LeadOS)
 * for the same reason the Part 4/5 build used it: it matches this brief's
 * own convention rather than silently renaming to match a different repo.
 * ======================================================================= */
var LEADOS = window.LEADOS = window.LEADOS || {};
var KEY = 'leados-synthesis:data'; // deliberately distinct from leados:data (real repo),
                                    // leados-signals-api:data and leados-decision-surface:data (other sandbox builds)

/* ---------------------------- STORE --------------------------------- */
LEADOS.store = (function(){
  function genesis(){
    return { schemaVersion: 1, meta: { lineage: 'synthesis-sandbox', createdAt: Date.now() }, events: [] };
  }
  function load(){
    var text = localStorage.getItem(KEY);
    if (text === null){ var raw = genesis(); save(raw); return raw; }
    try { return JSON.parse(text); }
    catch(e){ throw new Error('LEADOS: store at ' + KEY + ' is corrupt and was left untouched.'); }
  }
  function save(raw){ localStorage.setItem(KEY, JSON.stringify(raw)); }
  LEADOS._appendCalls = { total: 0, byType: {} }; // instrumentation used by Health tab, never used for logic
  function append(type, payload){
    var raw = load();
    var seq = raw.events.length + 1;
    var ev = { seq: seq, id: 'e-' + String(seq).padStart(5,'0'), at: Date.now(), type: type, payload: payload };
    raw.events.push(ev);
    save(raw);
    LEADOS._appendCalls.total++;
    LEADOS._appendCalls.byType[type] = (LEADOS._appendCalls.byType[type] || 0) + 1;
    return ev;
  }
  function wipe(){ localStorage.removeItem(KEY); }

  // project() is a pure fold. It recomputes everything derived (findings,
  // domain scores) from the raw event array every call — nothing derived
  // is cached — EXCEPT synthesis.generated payloads, which are themselves
  // raw log entries (see README "The one disclosed exception").
  function project(events){
    var findings = {};
    var synthesisHistory = [];
    events.forEach(function(ev){
      if (ev.type === 'finding.created'){
        findings[ev.payload.id] = Object.assign({ resolved:false }, ev.payload);
      } else if (ev.type === 'finding.resolved'){
        if (findings[ev.payload.id]) findings[ev.payload.id].resolved = true;
      } else if (ev.type === 'synthesis.generated'){
        synthesisHistory.push(ev.payload);
      }
    });
    var findingList = Object.keys(findings).map(function(k){ return findings[k]; })
      .sort(function(a,b){ return a.createdAt - b.createdAt; });

    var domainList = LEADOS.domains.map(function(d){
      var open = findingList.filter(function(f){ return f.domain === d.key && !f.resolved; });
      var penalty = open.reduce(function(s,f){ return s + f.severity * 7; }, 0);
      var score = Math.max(0, Math.min(100, 100 - penalty));
      return Object.assign({}, d, {
        open: open,
        score: score,
        worsening: open.filter(function(f){ return f.trend === 'worsening'; }).length,
        improving: open.filter(function(f){ return f.trend === 'improving'; }).length
      });
    });

    return { findings: findingList, domainList: domainList, synthesisHistory: synthesisHistory };
  }

  return { KEY: KEY, load: load, save: save, append: append, wipe: wipe, project: project, genesis: genesis };
})();

/* ------------------------- DOMAIN MODEL (fabricated) ------------------ */
// 6 domains, fabricated for this sandbox — disclosed in the About tab.
LEADOS.domains = [
  { key:'revenue',  label:'Revenue',             color:'#f43f5e' },
  { key:'product',  label:'Product',              color:'#8b5cf6' },
  { key:'ops',      label:'Operations',           color:'#f59e0b' },
  { key:'people',   label:'People',               color:'#10b981' },
  { key:'risk',     label:'Risk & Compliance',    color:'#0ea5e9' },
  { key:'customer', label:'Customer',             color:'#ec4899' }
];
function domainLabel(key){ var d = LEADOS.domains.find(function(x){return x.key===key;}); return d ? d.label : key; }

// Compound pattern library — fabricated, *inspired by the concept* of the
// real repo's verified LeadOS.patterns (DEATH_SPIRAL, GOVERNANCE_GAP, ...)
// but not copied: names, thresholds and narratives below are invented for
// this sandbox. See About tab.
LEADOS.patternDefs = [
  { id:'revenue-squeeze', label:'Revenue Squeeze', domains:['revenue','customer'],
    narrative: function(fs){ return 'pricing or churn pressure in Revenue is compounding with deteriorating Customer signals ("' + fs.map(f=>f.title).slice(0,2).join('", "') + '")'; } },
  { id:'silent-attrition', label:'Silent Attrition', domains:['people','ops'],
    narrative: function(fs){ return 'People strain is showing up as Operations degradation before it shows up as resignations ("' + fs.map(f=>f.title).slice(0,2).join('", "') + '")'; } },
  { id:'execution-drag', label:'Execution Drag', domains:['product','ops'],
    narrative: function(fs){ return 'Product delivery is slipping in lockstep with Operations load ("' + fs.map(f=>f.title).slice(0,2).join('", "') + '")'; } },
  { id:'governance-blindspot', label:'Governance Blindspot', domains:['risk','people'],
    narrative: function(fs){ return 'Risk findings are accumulating in areas with thin People coverage ("' + fs.map(f=>f.title).slice(0,2).join('", "') + '")'; } }
];

function activePatterns(P){
  return LEADOS.patternDefs.map(function(def){
    var lists = def.domains.map(function(dk){ return P.findings.filter(function(f){ return !f.resolved && f.domain===dk; }); });
    var allWorsening = lists.every(function(list){ return list.some(function(f){ return f.trend==='worsening'; }); });
    var flat = lists.reduce(function(a,b){return a.concat(b);},[]);
    var severitySum = flat.reduce(function(s,f){ return s+f.severity; },0);
    return Object.assign({}, def, { active: allWorsening && severitySum >= 6, severitySum: severitySum, exampleFindings: flat });
  });
}

/* --------------------------- SEED DATA -------------------------------- */
function seedIfEmpty(){
  var raw = LEADOS.store.load();
  if (raw.events.length > 0) return;
  var seeds = [
    ['revenue',4,'Q3 pipeline coverage fell below 2x','worsening'],
    ['revenue',2,'Enterprise renewal slipped two weeks','flat'],
    ['customer',4,'NPS dropped 11 points in top segment','worsening'],
    ['customer',1,'Support backlog cleared to zero','improving'],
    ['ops',3,'On-call pages up 40% month over month','worsening'],
    ['ops',2,'Deploy frequency recovering post-incident','improving'],
    ['product',3,'Roadmap slip on flagship Q3 feature','worsening'],
    ['product',1,'Design system adoption crossed 80%','improving'],
    ['people',3,'Two regrettable resignations in platform team','worsening'],
    ['people',1,'Engagement survey response rate up','improving'],
    ['risk',4,'SOC2 control gap found in access reviews','worsening'],
    ['risk',2,'Vendor risk register now current','flat']
  ];
  seeds.forEach(function(s, i){
    LEADOS.store.append('finding.created', {
      id: 'f-' + String(i+1).padStart(3,'0'),
      domain: s[0], severity: s[1], title: s[2], trend: s[3],
      createdAt: Date.now() - (seeds.length - i) * 3600 * 1000
    });
  });
}

function countRelevantEvents(events){
  return events.filter(function(e){ return e.type==='finding.created' || e.type==='finding.resolved'; }).length;
}

/* ------------------------- SYNTHESIS GENERATION ------------------------
 * Three sections, generated ON DEMAND (button click), never recomputed on
 * render. The brief's own spec text was truncated before it named what the
 * three sections actually are — see README "Disclosed gap". This session's
 * own interpretation, labeled as such throughout: Situation / Interpretation
 * / Recommendation — a standard advisor structure (what's happening, what
 * it means together, what to do), chosen to match "the system speaking to
 * you as a strategic advisor."
 * ======================================================================= */
LEADOS.synthesis = (function(){

  function buildSituation(P){
    var sorted = P.domainList.slice().sort(function(a,b){ return a.score-b.score; });
    var worst = sorted[0], best = sorted[sorted.length-1];
    var open = P.findings.filter(function(f){ return !f.resolved; });
    var top3 = open.slice().sort(function(a,b){ return b.severity-a.severity; }).slice(0,3);
    var worsening = open.filter(function(f){ return f.trend==='worsening'; }).length;
    var improving = open.filter(function(f){ return f.trend==='improving'; }).length;
    var flat = open.length - worsening - improving;
    return {
      headline: open.length + ' open finding' + (open.length===1?'':'s') + ' across ' + P.domainList.length + ' domains. ' +
        worst.label + ' is the most strained domain at ' + worst.score + '/100; ' + best.label + ' is the strongest at ' + best.score + '/100.',
      body: [
        'Momentum: ' + worsening + ' open finding' + (worsening===1?'':'s') + ' trending worse, ' + improving + ' improving, ' + flat + ' flat. ' +
          (worsening > improving ? 'The organization is losing ground faster than it is gaining it.' : 'The organization is holding or gaining ground overall.'),
        top3.length ? 'Top findings by severity: ' + top3.map(function(f){ return '"' + f.title + '" (' + domainLabel(f.domain) + ', sev ' + f.severity + '/5, ' + f.trend + ')'; }).join('; ') + '.'
                     : 'No open findings currently logged.'
      ]
    };
  }

  function buildInterpretation(P, patterns){
    var active = patterns.filter(function(p){ return p.active; });
    if (!active.length){
      return { headline: 'No compound pattern meets the active threshold right now.',
        body: ['Findings are moving independently across domains — no cross-domain reinforcing pattern detected at this moment.'] };
    }
    var domainsTouched = Array.from(new Set(active.reduce(function(a,p){return a.concat(p.domains);},[])));
    return {
      headline: active.length + ' compound pattern' + (active.length>1?'s':'') + ' currently active, spanning ' + domainsTouched.length + ' domains.',
      body: active.map(function(p){
        return p.label + ' (' + p.domains.map(domainLabel).join(' + ') + '): ' + p.narrative(p.exampleFindings) + ' — combined severity ' + p.severitySum + '.';
      })
    };
  }

  var ACTION_HINTS = {
    revenue: 'tighten pipeline qualification before adding new top-of-funnel spend',
    customer: 'get a leader on the phone with the top three at-risk accounts this week',
    ops: 'freeze non-critical change while the on-call load stabilizes',
    product: 're-scope the slipping feature rather than silently extending the date',
    people: 'run stay-interviews with the team showing the strain, not just exit interviews later',
    risk: 'close the control gap before the next audit window, not after'
  };

  function buildRecommendation(P, patterns){
    var active = patterns.filter(function(p){ return p.active; });
    var worst2 = P.domainList.slice().sort(function(a,b){ return a.score-b.score; }).slice(0,2);
    var actions = [];
    if (active.length){
      actions.push('Assign an explicit owner to "' + active[0].label + '" this week — it is the compound pattern most likely to compound further if left unowned.');
    }
    worst2.forEach(function(d){
      var top = d.open.slice().sort(function(a,b){ return b.severity-a.severity; })[0];
      if (top) actions.push('In ' + d.label + ': address "' + top.title + '" first (sev ' + top.severity + '/5) — ' + ACTION_HINTS[d.key] + '.');
    });
    return { headline: actions.length ? 'Recommended moves, in order:' : 'No urgent action indicated by current data.', body: actions };
  }

  // The one disclosed exception to pure recompute: this result is persisted
  // as a new append-only event so "generated on demand, not on every
  // render" is actually true across reloads, not just within one session.
  function generate(onDone){
    var raw = LEADOS.store.load();
    var P = LEADOS.store.project(raw.events);
    var patterns = activePatterns(P);
    var sections = {
      situation: buildSituation(P),
      interpretation: buildInterpretation(P, patterns),
      recommendation: buildRecommendation(P, patterns)
    };
    var payload = {
      id: 'syn-' + Date.now(),
      generatedAt: Date.now(),
      basedOnEventCount: countRelevantEvents(raw.events),
      sections: sections
    };
    LEADOS.store.append('synthesis.generated', payload);
    if (onDone) onDone(payload);
  }

  return { buildSituation: buildSituation, buildInterpretation: buildInterpretation, buildRecommendation: buildRecommendation, generate: generate, activePatterns: activePatterns };
})();

/* ------------------------------ UI STATE -------------------------------- */
var UI = { loading:false, labForm: { domain:'revenue', severity:'3', trend:'worsening', title:'' }, healthResults: null };

function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
function fmtTime(ms){ return new Date(ms).toLocaleString(); }

var ROUTES = ['today','domains','synthesis','lab','health','log','about'];
function currentRoute(){
  var h = location.hash.replace('#/','');
  return ROUTES.indexOf(h) >= 0 ? h : 'today';
}

/* -------------------------------- RAIL ---------------------------------- */
function renderRail(){
  var raw = LEADOS.store.load();
  var P = LEADOS.store.project(raw.events);
  var latest = P.synthesisHistory[P.synthesisHistory.length-1];
  var staleBy = latest ? (countRelevantEvents(raw.events) - latest.basedOnEventCount) : null;
  var items = [
    ['today','Today'],
    ['domains','Domains'],
    ['synthesis','★ Synthesis'],
    ['lab','Lab'],
    ['health','Health'],
    ['log','Event Log'],
    ['about','Verified / Fabricated']
  ];
  var route = currentRoute();
  document.getElementById('rail').innerHTML = items.map(function(it){
    var badge = '';
    if (it[0]==='synthesis'){
      if (!latest) badge = '<span class="ml-auto text-[10px] px-1.5 py-0.5 rounded bg-indigo-500/30 text-indigo-200">new</span>';
      else if (staleBy > 0) badge = '<span class="ml-auto text-[10px] px-1.5 py-0.5 rounded bg-amber-500/30 text-amber-200">+' + staleBy + '</span>';
    }
    return '<a href="#/' + it[0] + '" class="rail-link flex items-center gap-2 px-3 py-2 rounded-lg border border-transparent text-slate-300 hover:bg-slate-800/60' +
      (route===it[0] ? ' active' : '') + '">' + it[1] + badge + '</a>';
  }).join('');
}

/* ------------------------------ VIEWS ------------------------------------ */
function viewToday(){
  var raw = LEADOS.store.load();
  var P = LEADOS.store.project(raw.events);
  var open = P.findings.filter(function(f){return !f.resolved;}).sort(function(a,b){return b.severity-a.severity;});
  return '' +
  '<div class="fade-in max-w-4xl">' +
    '<h1 class="text-xl font-semibold text-slate-100">Today</h1>' +
    '<p class="text-sm text-slate-400 mt-1">Open findings, most severe first. Fabricated sample data — see Verified / Fabricated.</p>' +
    '<div class="mt-5 space-y-2">' +
    (open.length ? open.map(function(f){
      return '<div class="rounded-lg border border-slate-800 bg-slate-900/50 p-3 flex items-start gap-3">' +
        '<span class="mt-0.5 text-[10px] px-1.5 py-0.5 rounded font-semibold ' + sevClass(f.severity) + '">SEV ' + f.severity + '</span>' +
        '<div class="flex-1">' +
          '<div class="text-sm text-slate-100">' + esc(f.title) + '</div>' +
          '<div class="text-xs text-slate-500 mt-0.5">' + domainLabel(f.domain) + ' · trending ' + f.trend + '</div>' +
        '</div>' +
        '<button onclick="LEADOS_resolve(\'' + f.id + '\')" class="text-xs px-2 py-1 rounded border border-slate-700 text-slate-300 hover:bg-slate-800">Resolve</button>' +
      '</div>';
    }).join('') : '<p class="text-sm text-slate-500">No open findings.</p>') +
    '</div>' +
  '</div>';
}

function sevClass(sev){
  if (sev>=4) return 'bg-rose-500/20 text-rose-300';
  if (sev===3) return 'bg-amber-500/20 text-amber-300';
  return 'bg-emerald-500/20 text-emerald-300';
}

function viewDomains(){
  var raw = LEADOS.store.load();
  var P = LEADOS.store.project(raw.events);
  return '' +
  '<div class="fade-in max-w-5xl">' +
    '<h1 class="text-xl font-semibold text-slate-100">Domains</h1>' +
    '<p class="text-sm text-slate-400 mt-1">Score = 100 − Σ(open finding severity × 7), clamped 0–100. A fabricated, simple scoring function for this sandbox.</p>' +
    '<div class="mt-5 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">' +
    P.domainList.map(function(d){
      return '<div class="rounded-xl border border-slate-800 bg-slate-900/50 p-4">' +
        '<div class="flex items-center justify-between">' +
          '<span class="text-sm font-medium text-slate-100">' + d.label + '</span>' +
          '<span class="text-lg font-bold mono" style="color:' + d.color + '">' + d.score + '</span>' +
        '</div>' +
        '<div class="mt-2 h-1.5 w-full bg-slate-800 rounded-full overflow-hidden">' +
          '<div class="h-full rounded-full" style="width:' + d.score + '%;background:' + d.color + '"></div>' +
        '</div>' +
        '<div class="mt-2 text-xs text-slate-500">' + d.open.length + ' open · ' + d.worsening + ' worsening · ' + d.improving + ' improving</div>' +
      '</div>';
    }).join('') +
    '</div>' +
  '</div>';
}

function sectionCard(title, sec, accent){
  if (!sec) return '';
  return '<div class="rounded-xl border border-slate-800 bg-slate-900/50 p-5">' +
    '<div class="text-[11px] font-semibold uppercase tracking-wide" style="color:' + accent + '">' + title + '</div>' +
    '<p class="mt-2 text-sm text-slate-100 font-medium">' + esc(sec.headline) + '</p>' +
    (sec.body && sec.body.length ? '<ul class="mt-3 space-y-2 text-sm text-slate-300 list-disc list-inside">' +
      sec.body.map(function(b){ return '<li>' + esc(b) + '</li>'; }).join('') + '</ul>' : '') +
  '</div>';
}

function viewSynthesis(){
  var raw = LEADOS.store.load();
  var P = LEADOS.store.project(raw.events);
  var history = P.synthesisHistory;
  var latest = history[history.length-1] || null;
  var currentCount = countRelevantEvents(raw.events);
  var staleBy = latest ? currentCount - latest.basedOnEventCount : null;

  var header = '' +
  '<div class="max-w-3xl">' +
    '<h1 class="text-xl font-semibold text-slate-100">★ Synthesis</h1>' +
    '<p class="text-sm text-slate-400 mt-1">Not a dashboard, not a finding list, not a chart. The system speaking as a strategic advisor — generated on demand, not on every render.</p>' +
  '</div>';

  var status = '<div class="max-w-3xl mt-4 flex flex-wrap items-center gap-3 text-xs">' +
    (latest ? ('<span class="text-slate-400">Last generated ' + fmtTime(latest.generatedAt) + ' · based on ' + latest.basedOnEventCount + ' finding events</span>')
            : '<span class="text-slate-500">Never generated yet.</span>') +
    (staleBy > 0 ? '<span class="px-2 py-1 rounded bg-amber-500/20 text-amber-300 font-medium">' + staleBy + ' change' + (staleBy===1?'':'s') + ' since this was generated</span>' : '') +
    '<button onclick="LEADOS_generate()" class="ml-auto px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold disabled:opacity-50" ' + (UI.loading?'disabled':'') + '>' +
      (UI.loading ? '<span class="inline-block w-3 h-3 border-2 border-white/40 border-t-white rounded-full spin align-[-1px] mr-1"></span> Generating…' : (latest ? 'Regenerate synthesis' : 'Generate synthesis')) +
    '</button>' +
  '</div>';

  var body;
  if (!latest){
    body = '<div class="max-w-3xl mt-6 rounded-xl border border-dashed border-slate-700 p-8 text-center text-sm text-slate-500">No synthesis generated yet. Click "Generate synthesis" above — it reads every finding currently logged and composes the three sections below.</div>';
  } else {
    body = '<div class="max-w-3xl mt-6 space-y-4">' +
      sectionCard('1 · Situation — what\'s actually happening', latest.sections.situation, '#818cf8') +
      sectionCard('2 · Interpretation — what it means together', latest.sections.interpretation, '#f59e0b') +
      sectionCard('3 · Recommendation — what to do about it', latest.sections.recommendation, '#34d399') +
    '</div>';
  }

  var hist = '';
  if (history.length > 1){
    hist = '<div class="max-w-3xl mt-6">' +
      '<details class="text-sm">' +
        '<summary class="cursor-pointer text-slate-400">History (' + history.length + ' generations, append-only — none ever edited)</summary>' +
        '<div class="mt-2 space-y-1 text-xs text-slate-500">' +
          history.slice().reverse().map(function(h){ return '<div class="mono">' + fmtTime(h.generatedAt) + ' · based on ' + h.basedOnEventCount + ' events · id ' + h.id + '</div>'; }).join('') +
        '</div>' +
      '</details>' +
    '</div>';
  }

  var disclose = '<div class="max-w-3xl mt-8 text-[11px] text-slate-600 border-t border-slate-800 pt-3">' +
    'The three section labels (Situation / Interpretation / Recommendation) are this delivery\'s own interpretation — the pasted brief\'s spec text was truncated before naming what the three sections actually are. See About tab.' +
  '</div>';

  return '<div class="fade-in">' + header + status + body + hist + disclose + '</div>';
}

function viewLab(){
  var raw = LEADOS.store.load();
  var P = LEADOS.store.project(raw.events);
  var open = P.findings.filter(function(f){ return !f.resolved; });
  var f = UI.labForm;
  return '' +
  '<div class="fade-in max-w-3xl">' +
    '<h1 class="text-xl font-semibold text-slate-100">Lab</h1>' +
    '<p class="text-sm text-slate-400 mt-1">Manually log or resolve findings to change the picture, then revisit Synthesis to see staleness and regenerate.</p>' +

/* ------------------------------- ACTIONS -------------------------------- */
window.LEADOS_resolve = function(id){
  LEADOS.store.append('finding.resolved', { id: id });
  renderApp();
};
window.LEADOS_logFinding = function(){
  var domain = document.getElementById('lab-domain').value;
  var severity = parseInt(document.getElementById('lab-severity').value, 10);
  var trend = document.getElementById('lab-trend').value;
  var title = document.getElementById('lab-title').value.trim() || 'Untitled finding';
  LEADOS.store.append('finding.created', { id: 'f-' + Date.now(), domain: domain, severity: severity, trend: trend, title: title, createdAt: Date.now() });
  UI.labForm = { domain: domain, severity: severity, trend: trend, title: '' };
  renderApp();
};
window.LEADOS_reseed = function(){
  LEADOS.store.wipe();
  seedIfEmpty();
  renderApp();
};
window.LEADOS_export = function(){
  var raw = LEADOS.store.load();
  var blob = new Blob([JSON.stringify(raw, null, 2)], { type:'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'leados-synthesis-export.json';
  a.click();
};
window.LEADOS_generate = function(){
  if (UI.loading) return;
  UI.loading = true;
  renderApp();
  setTimeout(function(){
    LEADOS.synthesis.generate(function(){
      UI.loading = false;
      renderApp();
    });
  }, 650); // simulated latency — disclosed as simulated in About tab; real computation here is cheap
};
window.LEADOS_runHealth = function(){
  UI.healthResults = runHealthChecks();
  renderApp();
};

/* ------------------------------ HEALTH CHECKS ---------------------------- */
function runHealthChecks(){
  var results = [];
  var raw = LEADOS.store.load();

  // 1. Rendering does not append events (synthesis is not regenerated on render)
  (function(){
    var before = LEADOS._appendCalls.byType['synthesis.generated'] || 0;
    viewSynthesis(); viewSynthesis(); viewToday(); viewDomains();
    var after = LEADOS._appendCalls.byType['synthesis.generated'] || 0;
    results.push({ name:'Rendering never appends synthesis.generated', pass: after===before,
      detail:'synthesis.generated append count before='+before+' after 4 renders='+after+'.' });
  })();

  // 2. Store key isolation
  (function(){
    var isolated = LEADOS.store.KEY === 'leados-synthesis:data';
    var realRepoKeyPresent = localStorage.getItem('leados:data') !== null;
    results.push({ name:'Store key isolated from real repo key', pass: isolated,
      detail:'This build uses "'+LEADOS.store.KEY+'". leados:data (real repo key) '+(realRepoKeyPresent?'is present in this browser but untouched.':'is not present in this browser.') });
  })();

  // 3. Synthesis history is append-only (regenerating adds, never mutates)
  (function(){
    var P1 = LEADOS.store.project(raw.events);
    var before = P1.synthesisHistory.slice();
    LEADOS.synthesis.generate(function(){});
    var raw2 = LEADOS.store.load();
    var P2 = LEADOS.store.project(raw2.events);
    var after = P2.synthesisHistory;
    var prevUnchanged = before.every(function(b,i){ return JSON.stringify(b)===JSON.stringify(after[i]); });
    results.push({ name:'Synthesis history is append-only', pass: after.length===before.length+1 && prevUnchanged,
      detail:'History length '+before.length+' -> '+after.length+'; all prior entries byte-identical: '+prevUnchanged+'.' });
  })();

  // 4. Staleness math: a candidate extra finding increases staleBy by exactly 1, computed WITHOUT saving
  (function(){
    var raw3 = LEADOS.store.load();
    var P3 = LEADOS.store.project(raw3.events);
    var latest = P3.synthesisHistory[P3.synthesisHistory.length-1];
    var before = latest ? countRelevantEvents(raw3.events) - latest.basedOnEventCount : null;
    var candidateEvents = raw3.events.concat([{ seq:raw3.events.length+1, id:'test', at:Date.now(), type:'finding.created', payload:{ id:'test-only', domain:'ops', severity:1, trend:'flat', title:'health-check probe (never saved)', createdAt:Date.now() } }]);
    var afterCount = countRelevantEvents(candidateEvents);
    var after = latest ? afterCount - latest.basedOnEventCount : null;
    var pass = (before===null && after===null) || (after === before + 1);
    results.push({ name:'Staleness count reacts correctly, computed non-destructively', pass: pass,
      detail: latest ? ('stale-by before='+before+', simulated after +1 finding='+after+' (simulation never written to storage).') : 'No synthesis generated yet to compare against — check skipped as not-applicable.' });
  })();

  // 5. Append-only doctrine: resolving a finding never deletes the original finding.created event
  (function(){
    var types = raw.events.map(function(e){return e.type;});
    var hasCreated = types.indexOf('finding.created') >= 0;
    results.push({ name:'finding.created events are never deleted on resolve', pass: hasCreated || raw.events.length===0,
      detail: 'finding.created events present in log: '+types.filter(function(t){return t==='finding.created';}).length+'.' });
  })();

  return results;
}

/* ------------------------------- ROUTER ---------------------------------- */
function renderApp(){
  seedIfEmpty();
  renderRail();
  var route = currentRoute();
  var html;
  if (route==='today') html = viewToday();
  else if (route==='domains') html = viewDomains();
  else if (route==='synthesis') html = viewSynthesis();
  else if (route==='lab') html = viewLab();
  else if (route==='health') html = viewHealth();
  else if (route==='log') html = viewLog();
  else html = viewAbout();
  document.getElementById('main').innerHTML = html;
}

window.addEventListener('hashchange', renderApp);
if (!location.hash) location.hash = '#/today';
renderApp();
