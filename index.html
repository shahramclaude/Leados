   - bullet, 1) numbered, **accent**. Persisted drill + scored check. */
const LESSONS = [
 { id:'l01', arc:'Foundations', title:'From doer to multiplier', mins:6,
   body:`Your old job rewarded output. This job rewards **output you never touched**.
## The identity swap
Every hour you spend doing work a report could do — even worse than you — is an hour stolen from the work only you can do: direction, unblocking, developing people, absorbing organizational noise. The math is brutal: a mediocre decision multiplied across seven people beats your personal excellence on one.
## The multiplier test
Before any task, ask: **if I do this myself, what do seven people NOT learn?** Delegating badly and recovering beats doing well and teaching nothing. Feeling useless after delegating is not a signal you are failing — it is the sensation of the role working.
> The failure mode is not laziness; it is rescue. Every rescue is a tax on someone's growth and interest on your calendar.
## This week
- List what you personally executed. Mark anything a report could have done at 70% quality. That list is your delegation queue.`,
   drill:'List three things you executed personally in the last two weeks. For each: who could have done it at 70% quality, and what would they have learned?',
   check:{ q:'A report does a task at 70% of your quality. The multiplier move is:', opts:['Do it yourself "this once" for speed','Delegate it and accept the 70%, coaching the gap next cycle','Split it — you do the hard half','Delay it until they are ready'], a:1, why:'Coached 70% compounds toward 120%. Rescue compounds toward a bottleneck called you.' } },
 { id:'l02', arc:'Foundations', title:'Managing managers: the altitude shift', mins:7,
   body:`You no longer fix problems. You build **people who fix problems**, and you fix the systems that produce problems.
## Your new unit of work
At first-line, your product was decisions. Now it is **decision-makers**. Every interaction with a lead is therapy for their judgement: you lend them your frame, not your answer. The day you answer faster than they can think, you have demoted them in place.
## Three altitude rules
1) **Never out-decide a lead in public.** Their team's model of "who really decides" is set by where answers come from.
2) **Ask for their recommendation before giving yours** — always, no exceptions worth the name. You are buying information about their thinking, which is the actual product.
3) **Judge leads on their team's behavior**, not on their personal output. A heroic lead is a failing system.
> Skip-level intelligence is fuel; weaponized skip-levels are arson. Whatever you learn below, you coach through the lead, never around them.
## The tell
If your leads quote you instead of reasoning like you, you are building a fan club, not a leadership bench.`,
   drill:'Write the three questions you will ask every lead before ever giving an answer. (Hint: "what do you recommend?", "what did you already try?", "what does your team think?")',
   check:{ q:'A lead brings you a problem their team caused. Your first move:', opts:['Call the team member directly — speed matters','Solve it with the lead present, as a demo','Ask the lead for their recommended fix and its tradeoffs','Set a policy so it never recurs'], a:2, why:'Their recommendation is diagnostic data about their judgement — the thing you actually manage.' } },
 { id:'l03', arc:'Foundations', title:'The trust equation', mins:6,
   body:`Trust = (Credibility + Reliability + Intimacy) ÷ **Self-orientation**. Three earnsiers, one killer.
## The numerator
**Credibility** — they believe what you say. Earned by admissions: "I don't know, I'll find out," followed by actually finding out.
**Reliability** — they believe you'll do it. Earned in kept micro-commitments, under 48 hours, no grand gestures.
**Intimacy** — they tell you the real thing. Earned by absorbing bad news without a flinch they can detect.
## The denominator
Self-orientation: the suspicion that you manage them for *your* benefit. One visible act of self-interest — credit taken, blame routed, a convenient rescope — raises the denominator and halves everything above it. Denominator repairs take quarters.
> Trust is metabolized asymmetrically: earned in drops, spent in buckets. Budget accordingly.
## The audit
The App person page scores all four sliders. Score honestly: the number is for your calibration, not your comfort.`,
   drill:'Pick your most senior lead. Score all four sliders honestly. Which numerator term is genuinely weakest — and what is one act under 48 hours that rebuilds it?',
   check:{ q:'You just visibly took credit for a lead\'s idea in front of your boss. The equation says:', opts:['Minor — the numerator barely moved','Denominator spiked; every term above it just got discounted','Fine, if you credit them later in private','Neutral — bosses expect it'], a:1, why:'Self-orientation divides the entire sum. Public credit-theft is the single most expensive trust event available.' } },
 { id:'l04', arc:'Foundations', title:'Calendar as org chart', mins:5,
   body:`Your team cannot read your strategy deck. They read your **calendar**. Time allocation is the only strategy document that is automatically true.
## The manager-of-managers split
Rough targets: 25% strategy & direction, 20% people development, 15% oversight & reviews, 20% stakeholders & upward, 10% hiring & org design, 10% your own development. Your actual week will drift toward whoever shouts loudest. The app measures the drift.
## Two mechanical rules
1) **Cancel by category, not by pain.** When overloaded, cut whole categories deliberately ("no status meetings this week") — never "whatever feels skippable today," which always resolves to 1:1s, i.e., your instrumentation.
2) **Q2 work gets a calendar block or it does not exist.** "When things calm down" is the scheduling of surrender.
> The seniority test: someone watching your calendar for a month should be able to state your strategy. Most managers fail this loudly.`,
   drill:'Reconstruct last week honestly into the six categories. Which category ate the development time? Name the person or meeting that took it.',
   check:{ q:'Overload week. What survives the cuts?', opts:['The crisis meetings and your boss\'s asks','The 1:1s and the development blocks','Whatever is already on the calendar','The external stakeholder work'], a:1, why:'Instrumentation and development are the compounding asset; everything else is throughput. Cut throughput first.' } },
 { id:'l05', arc:'Leading people', title:'The 1:1 as an operating system', mins:6,
   body:`The 1:1 is not a meeting. It is the **bus** everything else runs on: trust, feedback, calibration, early warning, growth. Skip it and every other module goes blind.
## The doctrines
1) Cadence is contractual. **Reschedule, never skip.** Two skips and you have announced their rank in your priorities.
2) The agenda loads itself: carried commitments, their topics, your evidence, the model's flags. Status updates are email-shaped and should be exiled there.
3) **Mood is data.** One number, every session, trended. A two-point drop is a case type.
4) GROW is the development spine: Goal, Reality, Options, Will. Rotate it in monthly; growth cannot live in annual reviews.
5) End with commitments — theirs AND yours — written, dated, carried forward automatically.
> The strongest tell of a failing 1:1: you talked more than they did. Instrument yourself.`,
   drill:'Design your ideal session skeleton: opening question, their block, your block, GROW rotation, commitments. Then audit: which part do you actually skip under pressure?',
   check:{ q:'Chaos week. Your options:', opts:['Cancel all 1:1s to buy hours','Shorten to 15 min each, keep cadence','Batch them into one group call','Move them all to next month'], a:1, why:'Cadence is the contract; duration is negotiable. Cancelled instrumentation is how small fires become quarter-eating ones.' } },
 { id:'l06', arc:'Leading people', title:'Feedback that lands: SBI and the freshness rule', mins:6,
   body:`Feedback decays. Same-week feedback is coaching; quarter-old feedback is **evidence in a case against you** — the one running silently in their head.
## SBI discipline
**Situation** — when and where, so you both share the frame. **Behavior** — observable, no character adjectives. "You were dismissive" is a trial; "you spoke over Ana twice when she presented the cost model" is data. **Impact** — the actual consequence, including the ones they could not see.
## Delivery rules
1) Ask their read after SBI and **count to seven** before rescuing the silence.
2) One topic per conversation. Feedback bundling is how every item gets discounted.
3) Praise at 2-5× correction — but real, specific praise. Generic positivity inflates the ratio and buys nothing.
4) The avoided conversation is always the expensive one. The app literally ages your drafts; a 10-day-old draft is a leadership confession.
> The sandwich (praise-correction-praise) fools nobody over twelve. It teaches people that compliments are just the smell of incoming correction.`,
   drill:'Draft one SBI right now for feedback you have been avoiding. Situation in 10 words, behavior with zero adjectives, impact in one sentence.',
   check:{ q:'The strongest reason to deliver correction fast is:', opts:['Fresher memory of the incident','Small drift is correctable; identity-level drift is a termination story','It looks decisive','HR requires it'], a:1, why:'Behavior corrected early is coaching. The same behavior corrected after a year of silence is "why am I only hearing this now?"' } },
 { id:'l07', arc:'Leading people', title:'Delegation levels L1–L7', mins:7,
   body:`Delegation fails on one axis: **authority mismatch**. You hand over the task and keep the authority — the boomerang — or you hand over authority the person hasn't earned — the shipwreck.
## The ladder
L1 Tell · L2 Sell · L3 Consult (they recommend, you decide) · L4 Agree (joint) · L5 Advise (they decide, you input) · L6 Inquire (they decide, report back) · L7 Delegate (full authority).
## The matching rule
Development level sets the band: D1→L1-2, D2→L2-3, D3→L4-5, D4→L5-7. The app's wizard flags mismatches before they fail. **Say the level out loud** at handoff — "asking for a recommendation" and "handing you the decision" produce identical sentences and opposite outcomes.
## Boundary conditions
Money, people changes, external comms, irreversibility. Write them at handoff. Boundaries are how you delegate L6 without becoming a headline.
> Taking work back at the first wobble is the most expensive management habit in existence. Rescue only at boundaries or checkpoints.`,
   drill:'Pick one thing on your plate right now. Name the person, the level, the boundary conditions, and the checkpoint cadence — then actually hand it off this week.',
   check:{ q:'A D4 (self-reliant) report gets L2 treatment ("sell me"). The predictable failure:', opts:['They deliver worse work','They disengage — authority mismatch reads as distrust at that level','They escalate constantly','Nothing; senior people don\'t mind'], a:1, why:'Over-controlling a ready person is micromanagement; the model flags it identically to the reverse error.' } },
 { id:'l08', arc:'Leading people', title:'Diagnosing performance: skill, will, system, clarity', mins:7,
   body:`Before any performance conversation: **which of the four causes is dominant?** Skill, will, system, clarity. Two of them are yours.
## The four
**Skill** — never done it, capability gap → training, pairing, small reps with feedback.
**Will** — capable, not choosing to → motivation/goal fit first, consequences second.
**System** — process, tooling, org blocks them → *your job to fix first*.
**Clarity** — they don't know what good looks like → *your job to define first*.
## The doctrine that saves careers (mostly yours)
**Manager-owned causes block the coaching path.** Coaching a person against a system defect teaches them the system is the real manager and you are decoration. Fix the environment, then re-diagnose. Half of "will problems" are system problems wearing a bad attitude.
## The pattern test
Three dated, specific examples — documented before the conversation, not after the decision. Pattern vs incident is the entire game. The app's evidence log exists because HR reads timelines, and so should you.
> If the diagnosis embarrasses you, that is the diagnosis working. System and clarity failures are signed by management.`,
   drill:'Think of your weakest current performer. Vote on all four causes honestly. If system or clarity wins — what is the one environmental fix you can ship this week?',
   check:{ q:'Diagnosis lands on "clarity". The correct sequence:', opts:['Coaching plan with weekly 1:1s','Define "what good looks like" together, then re-diagnose before any coaching','Training course enrollment','Document for HR immediately'], a:1, why:'Coaching someone who does not know the target is cruelty with a calendar invite.' } },
 { id:'l09', arc:'Leading teams', title:'Psychological safety is an engineering input', mins:6,
   body:`Safety is not comfort. It is the **information bandwidth** of your team — the rate at which bad news, risk, and dissent reach you. Low safety = you manage a simulation of your team.
## The mechanics
Safety is built in **responses to violations**: what happens in the 30 seconds after someone admits a mistake or disagrees with you publicly is the entire system. One punishment — a sigh, a rebuttal-then-theory, a task reassigned — and the channel contracts for a quarter.
## The Edmondson scan
Seven items, run as a pulse. The app scores it and names your weakest item. The weakest item is the address for action; averages are where problems hide.
## Leader behaviors that move it
Admit your mistakes first, with dates. Ask genuine questions you don't know the answer to. Thank dissent specifically ("that pushback saved us"). Never ask for candour while holding a visible weapon (review scores, assignment power) behind your back.
> The test is never the survey. It is whether the person with the least power in the room speaks first when something is wrong.`,
   drill:'Recall the last time someone brought you bad news or disagreement. Replay your exact first 30 seconds. What did your response teach the room?',
   check:{ q:'Your scan says safety is high, but nobody disagreed with you in the last three meetings:', opts:['Team is aligned — enjoy it','The channel is contracted somewhere; find where before the incident does','Hire more assertive people','Add a "disagreement" agenda item weekly'], a:1, why:'High self-report + zero observable dissent = the survey is measuring fear of the survey.' } },
 { id:'l10', arc:'Leading teams', title:'Conflict: mine it, don\'t smother it', mins:6,
   body:`Teams without conflict are not healthy; they are **withholding**. The question is never "how do I reduce conflict" but "how do I get it into the open, about ideas, with rules".
## The taxonomy
**Task conflict** — about the work. Gold; mine it. **Process conflict** — about who does what, how. Fix the structure, not the people. **Relationship conflict** — personal. Contain it, arbitrate it, and never let it wear a task costume.
## Your moves, in order
1) **Legitimize** — name the tension in the room: "we clearly disagree here, good, let's do it properly."
2) **Structure** — steelman rule: each side states the other's position to the other's satisfaction before rebutting.
3) **Commit** — end with a decision and a date. Conflict without closure is just attrition with minutes.
> The 50/50 compromise on a values breach punishes the innocent. Split differences on preferences; never on principles.
## The early warning
Watch for *routes around*: private channels, decisions appealed to you constantly, sarcasm as the only disagreement format. Conflict that can't breathe underground comes back as resignation letters.`,
   drill:'Write down the live tension in your org you have been "letting breathe". Task, process, or relationship? What structure would bring it into the open this week?',
   check:{ q:'Two senior reports feud over architecture. Both route every decision through you now. The root problem is probably:', opts:['Personality incompatibility','A structural collision (ownership/incentives) wearing a personality costume','Lack of respect between them','They are both wrong'], a:1, why:'Most recurring senior conflicts are role collisions. Re-map the boundary and the personalities mysteriously improve.' } },
 { id:'l11', arc:'Leading teams', title:'Five dysfunctions: fix from the bottom rung', mins:6,
   body:`Lencioni's ladder is **sequential**: absence of trust → fear of conflict → lack of commitment → avoidance of accountability → inattention to results. You fix it from the bottom. Off-sequence repair is cosmetic.
## Each rung's tell
**Trust**: meetings are performances; weaknesses are classified information. **Conflict**: harmony theater; the real meeting happens in hallways after. **Commitment**: decisions get "revisited" endlessly; ambiguity as armor. **Accountability**: standards enforced only by you, only downward, never peer-to-peer. **Results**: team wins celebrated; *team* win forgotten when individual status is available.
## The discipline
Score all five (the app does), find the **first failing rung**, and work only there. Building accountability rituals on a trustless team produces surveillance, not standards.
> Your behavior is the model: trust goes first (admit a real weakness), conflict goes second (disagree in the open and stay), and the ladder remembers.`,
   drill:'Score your senior team on all five rungs, 1-5. Find the first failing rung. What is one act you — not they — can perform this week on that rung?',
   check:{ q:'Your team won\'t commit to decisions but trusts each other deeply and debates fiercely. The rung to fix:', opts:['Trust — always start at the bottom regardless','Conflict — need more debate','Commitment — the first FAILING rung, exactly there','Results — set OKRs'], a:2, why:'Sequential means bottom-up but not bottom-always: you fix the first rung that is actually broken.' } },
 { id:'l12', arc:'Leading teams', title:'Meeting economics & comms design', mins:5,
   body:`A recurring meeting is a **subscription you charge to everyone's calendar**. Most teams audit budgets and never audit this one.
## The math
$/decision = attendees × loaded hourly rate × hours ÷ decisions made. Zero-decision meetings are status theater at $400+/hour. The app computes this per meeting; run the audit monthly.
## The hierarchy of comms
1) **Information** → written, async. Meetings cannot compete with documents at information transfer.
2) **Decisions** → meeting, but only with deciders + pre-read 24h early + a decision log at close.
3) **Conflict** → live, small, structured. Async conflict is how tone-deafness scales.
4) **Trust** → 1:1 or small groups only. Trust has never been built in a town hall.
> Every meeting you keep has an owner and an expiry question: "if this vanished for a month, who would actually protest, and about what?"
## The writing premium
A decision worth a meeting is worth a one-pager. Writing is thinking's quality gate — fuzzy meetings are usually fuzzy thoughts with a calendar invite.`,
   drill:'Inventory your recurring meetings. Compute $/decision for each (attendees × rate × time ÷ decisions). Flag every zero-decision subscription for the async-conversion experiment.',
   check:{ q:'A weekly meeting with 8 people produces zero decisions. The fix:', opts:['Shorter, 25 minutes','Convert to async writing for a month; let reality protest','Add an agenda template','Rotate the facilitator'], a:1, why:'Duration tweaks preserve the theater. Only conversion tests whether the meeting had a function at all.' } },
 { id:'l13', arc:'The system', title:'Decisions: doors, premortems, and the journal', mins:6,
   body:`Decision quality compounds — and it is only trainable if you **write predictions down**. Memory is an editor: it retroactively makes you right.
## Type 1 / Type 2 doors
Type 1: one-way, hard to reverse → slow down, premortem, consult, decide deliberately. Type 2: two-way, walk back through any time → decide fast, learn, iterate. **The classic error is Type 2 decisions getting Type 1 process** — velocity dies in committee.
## The premortem (Type 1 gates)
"It is 12 months later and this failed badly. Why?" Each stakeholder writes reasons silently, first. Sixty minutes of structured pessimism has killed more bad projects than any framework — the app refuses to let you skip it at the gate.
## Calibration
Log decision + confidence + review date. At review: grade the outcome honestly. The app shows your predicted-vs-actual gap. Overconfident by 20% after ten decisions? Your next big call needs a red team. That loop is the entire leadership course, self-administered.
> A decision without a review date is a hope with a committee.`,
   drill:'Log your last significant decision honestly: what you predicted, confidence, and what actually happened. What does the gap say?',
   check:{ q:'Reversible experiment, cheap to run, team wants it. Your move:', opts:['Full premortem + stakeholder consult','Decide today, review in 30 days','Pilot after next quarter\'s planning','Ask your manager'], a:1, why:'Type 2 doors get speed. Process ceremonials on reversible decisions is how organizations calcify.' } },
 { id:'l14', arc:'The system', title:'Stakeholders: power, interest, and the pre-wire', mins:6,
   body:`Politics is not dirty; it is **how organizations actually decide**. Refusing to map it doesn't exempt you — it just means other people read the map and you don't.
## The map
Power × Interest. Manage closely (high/high) — weekly touches, zero surprises, pre-wire every decision they can veto. Keep satisfied (high power, low interest) — brief before big moves; an uninterested person with power who becomes interested is a crisis. Keep informed (low power, high interest) — your intelligence network; cheap, genuine, regular. Monitor (low/low) — minimal effort, but not zero: power drifts.
## The pre-wire
Decisions are ratified in meetings and **made before them**. The person who learns about your proposal in the meeting where it lands will kill it to recover the status you just cost them. Brief each veto-holder alone first; the meeting becomes a formality of agreement.
## Stance management
Blockers → convert or route around. Skeptics → give them a real question to own; owned doubt becomes diligence. Champions → arm them with your narrative and deploy them where you aren't. Neutral → find their metric.
> Never surprise the manage-closely quadrant. Ever. That is the entire rule.`,
   drill:'Map your six most consequential stakeholders: power, interest, stance, last touch. Which manage-closely name is >21 days cold?',
   check:{ q:'Your proposal dies in a meeting you thought was won. The most likely root cause:', opts:['The idea was weak','You let a veto-holder first hear it in the room — the pre-wire failed','Bad luck','Politics is irrational, nothing to learn'], a:1, why:'Meetings ratify; they rarely decide. Status ambushes convert neutrals into executioners.' } },
 { id:'l15', arc:'The system', title:'Building your bench: leads who don\'t need you', mins:7,
   body:`Your succession plan is not an HR artifact. It is the **proof that your leadership system works**. If your org cannot run for three weeks without you, you haven't built a team — you've built a dependency with good people.
## The bench mechanics
1) **Delegate decisions, not tasks.** A lead who has never owned a consequential call is a coordinator with a title. Move them up the L-ladder deliberately: L3 for a quarter, then L5 on something real with boundaries, then L6.
2) **Let them watch you think**, then make you watch them. Trade places in reviews: they chair, you observe. Debrief the reasoning, not the outcomes.
3) **Grow past replacements.** The best signal of a D4 lead: they've built their own bench. Promote the people who make themselves replaceable — the insecurity of hoarding indispensability is how teams get blackmailed by their own leads.
## The skip-level instrument
Meet their reports monthly. Listen for: decisions that stall waiting for the lead, credit that evaporates upward, growth that's quietly stopped. Then coach through the lead — never around.
> The org you leave behind is the only artifact that outlasts your tenure. Build it on purpose.`,
   drill:'For each of your leads: current delegation level on their biggest responsibility, and the next level up with a date. If nobody has a date, you have a hobby, not a bench.',
   check:{ q:'A lead is thriving at L5 on core work. The bench-building move:', opts:['Keep them there — stability matters','L6 on something consequential with boundaries, plus them presenting to YOUR boss','Expand their scope horizontally','An intensive leadership course'], a:1, why:'Judgement grows by owning consequences in widening circles of authority — with visibility attached.' } }
];

 { id:'sc1', title:'The counter-offer', tag:'retention', time:'10 min',
   setup:'Dana — your best lead, flight risk model flashing 58 — asks to talk "about my future". She has an outside offer: +25% salary, staff title, equivalent scope. She says she has not decided and came to you first.',
   start:'n1',
   nodes:{
    n1:{ text:'She slides the summary across the table. "I want to stay. But I need to know staying is a decision, and not inertia." Your first move?',
      opts:[
       { t:'Counter immediately: "Whatever the number is, I\'ll match or beat it."', q:0, fb:'Speed reads as panic. You have priced her before you have understood her — and every offer from now on is a rescue.', to:'r2-intact' },
       { t:'"Thank you for coming to me first. Before any numbers: what would make staying the obvious choice?" — listen the full session.', q:2, fb:'You buy the only asset that matters: the real decision criteria. Numbers can be answered in 48 hours; misread criteria cannot.', to:'r2-intact' },
       { t:'Recite her value to the team, then: "I need a few days to build the package."', q:1, fb:'Reasonable — but you led with YOUR need, and she heard a delay tactic, however sincere.', to:'r2-intact' },
       { t:'"You should take it if it\'s right for you. I won\'t hold anyone back."', q:-1, fb:'Graceful exit speeches are for people who have decided. She hasn\'t — you just declined to fight and told her what your fight is worth.', to:'r2-damaged' } ] },
    'r2-damaged':{ text:'Two days of silence. Then: "I\'ve decided to take it — unless there\'s a reason not to." The room is cold. Your move?',
      opts:[
       { t:'Full-court rescue: counter + title + new project, everything, today.', q:0, fb:'An everything-offer now confirms the read: investment arrives only at gunpoint. Either she leaves anyway, or stays priced at hostage rates.', to:'end' },
       { t:'"I should have fought for you before the offer. Here is what I can actually deliver if you stay — and no hard feelings if you go." Then one specific growth plan, honestly resourced.', q:1, fb:'Late honesty is still honesty. Sometimes it saves it; sometimes it salvages the exit relationship, which also matters.', to:'end' },
       { t:'Accept cleanly and start transition planning immediately.', q:1, fb:'Knowing when the moment is gone is leadership too. A clean exit protects the team and the alumni relationship.', to:'end' },
       { t:'Guilt play: "After everything we\'ve invested in you..."', q:-2, fb:'You just converted a respectful goodbye into a story she tells about this place for years. Everyone still there is watching.', to:'end' } ] },
    'r2-intact':{ text:'She answers: "It\'s not the money — it\'s growth. I\'ve been the operational wall for two years. I want the architecture roadmap, and I want to present at review." You now know the criteria. Your move?',
      opts:[
       { t:'Promise all of it verbally today: the roadmap, the stage, and a comp review to match.', q:0, fb:'Verbal-everything is the beginning of the counter-offer auction: she takes your promises back to them, they improve, and you are now bidding on a person you already have.', to:'auction' },
       { t:'"Here is what I can commit in writing with dates: architecture ownership from [date], review slot at [date], comp review at band ceiling by [cycle]. Take both offers apart and decide on criteria, not adrenaline."', q:2, fb:'Written, dated, specific — you answered growth with facts and made her decision criteria the universe. This is how the auction never starts.', to:'end' },
       { t:'Match the offer on comp alone; growth discussion "once the dust settles".', q:-1, fb:'You paid 25% for the exact problem you didn\'t fix. She\'ll be back at this table in two quarters, priced higher.', to:'auction' } ] },
    auction:{ text:'The auction starts anyway: she relays their improved offer. HR is looped, your boss is asking what the plan is, and the team smells smoke.',
      opts:[
       { t:'One final written package covering growth + comp, with a 5-day no-renegotiation horizon, stated kindly and firmly.', q:1, fb:'Bounded finality recovers dignity on all sides. The auction ends when someone names the last round with a date.', to:'end' },
       { t:'Keep matching round by round until she says stay.', q:-2, fb:'Every match moves her price and teaches the whole org the retention business model: bring an offer, get a raise. You will see this quarterly now.', to:'end' },
       { t:'Withdraw: "The gap between us is structural. Take it — I\'ll make the transition honorable." Then fix her growth-path vacuum for everyone who remains.', q:1, fb:'Costly but clean. The retention system still has to be fixed — she was the alarm, not the fire.', to:'end' },
       { t:'Punish the market: block transfer talk internally, freeze her roadmap conversations "until decided".', q:-2, fb:'You have now confirmed every reason for leaving and broadcast it. The team\'s mental model of you just updated.', to:'end' } ] }

   verdicts:{ high:'You led with criteria, committed in writing, and never let it become a bidding war. That is retention as a system, not a panic.', mid:'You kept her — or lost her cleanly — but the process taught the org some expensive lessons about when investment arrives.', low:'This became an auction or an ambush. The person is secondary now; the signal to everyone watching is the real damage. Rebuild the stay-conversation cadence so decisions never reach your desk pre-armed.' } },
 { id:'sc2', title:'The dueling leads', tag:'conflict', time:'10 min',
   setup:'Your two senior leads — Rob and Marcus — clashed publicly over the migration sequence. Both now route every shared decision through you. Their teams went quiet. The migration is three weeks out.',
   start:'n1',
   nodes:{
    n1:{ text:'Both arrive at your desk, separately, same morning, each with a document proving the other is blocking progress. Your opening move?',
      opts:[
       { t:'Read both documents and rule on the migration sequence — the deadline is the deadline.', q:-1, fb:'You just ratified the escalation economy: whoever brings the better document wins the boss. The conflict is now officially about you, and it will recur at higher stakes.', to:'r2-damaged' },
       { t:'Refuse the arbitration: "I won\'t sequence this without both of you in the room. One hour, Thursday. Each of you will present the OTHER\'s plan first."', q:2, fb:'You killed the court-of-appeals business model and set the steelman rule. Ownership returns to where the knowledge lives.', to:'r2-intact' },
       { t:'Send them to "work it out" with a deadline and no structure.', q:0, fb:'Unstructured "work it out" between two armed principals produces either fake peace or an alliance failure. Conflict needs refereeing, not neglect.', to:'r2-damaged' },
       { t:'Split the migration: each leads half, minimal interface.', q:-1, fb:'The quarantine dodge: the technical seam is now a no-man\'s land, the feud is canonized into the architecture, and you have taught everyone that conflict pays in scope. The seam will fail at week 3.', to:'quarantine' } ] },
    'r2-intact':{ text:'Thursday. Rob presents Marcus\'s plan badly on purpose — a caricature. Marcus interrupts: "That\'s not what I said." The temperature spikes. Your move?',
      opts:[

       { t:'Let them argue it out — you said you wouldn\'t referee.', q:-1, fb:'Structure-absent "argument" between ranked rivals rewards volume and history. You ref-baked the cake and left it in the rain.', to:'end' },
       { t:'Adjourn: "clearly you need more time to prepare."', q:-1, fb:'Adjournment teaches that heat dissolves the process. The next meeting gets hotter, not better.', to:'end' },
       { t:'Rule for Marcus\'s plan since Rob caricatured it.', q:-1, fb:'You just paid the caricature artist\'s target. Conflict adjudicated on behavior-in-the-room, every room thereafter is a stage.', to:'end' } ] },
    'r2-damaged':{ text:'A week of appeals. The migration slips a week. Your boss asks why your office has a queue outside it. Reset move?',
      opts:[
       { t:'Convene both: "I created this market — appeals end today. Here is the decision process, and here is what never comes to me again." Then run the steelman session you skipped.', q:2, fb:'Owning your own structural error out loud is the fastest credibility repair available to managers of managers.', to:'end' },
       { t:'Escalate the technical call to the architect/CTO above you.', q:-1, fb:'You exported your job and announced it. Your leads now know your ceiling — and how to reach past you.', to:'end' },
       { t:'Issue a values memo about collaboration to the whole org.', q:-2, fb:'Collective punishment for a two-person conflict teaches thirty innocent people that memos are your ceiling of intervention.', to:'end' },
       { t:'Accept the queue — being the hub proves you\'re needed.', q:-2, fb:'Dependency-as-status is the most seductive failure of new managers-of-managers. You are the bottleneck you complain about.', to:'end' } ] },
    quarantine:{ text:'Week 3, the seam fails exactly as predicted: both halves live, the join dead. Each side\'s status says "our part is done." The teams now fear the other lead.',
      opts:[
       { t:'Joint incident review: one timeline, shared failure, both leads co-owning the fix and the communication. Then the postponed conversation about how you got here happens — with you in it.', q:2, fb:'The seam failed like a structural prophecy. Owning your architectural coda to a people problem is how the lesson becomes yours instead of just theirs.', to:'end' },
       { t:'Fix the seam yourself with your best two engineers, quietly.', q:-2, fb:'You bought three weeks of silence in exchange for teaching everyone that leadership conflict is resolved by heroic staff work invisible to the participants.', to:'end' },
       { t:'Reassign Rob off the migration — the team needs peace.', q:-2, fb:'The quarantine completes: a person is now geographically exiled for a structural error you made. Rob\'s team reads it as: conflict = reassignment risk.', to:'end' },
       { t:'Blame the integration plan publicly at the next review.', q:-2, fb:'You have now scapegoated a plan you authored, in public. The intelligent fraction of your org has begun quietly interviewing.', to:'end' } ] }
   },
   verdicts:{ high:'You refused the appeal-court business model, structured the conflict, and let the owners own. That is the manager-of-managers posture end to end.', mid:'The migration survived; the org learned a mixed lesson about what escalation buys.', low:'You became the supreme court or the quarantine authority — and the architecture now carries the scar of an unmanaged people problem. Referee structure BEFORE needing it; the next feud starts faster than you can rebuild credibility.' } },
 { id:'sc3', title:'The fading senior', tag:'performance', time:'10 min',
   setup:'Priya, historically strong, has missed three straight deliverables — unseen in four years. Two weeks ago her mother was hospitalized (mentioned once, quietly). Her lead wants "the performance conversation, documented". Stakeholders are asking about her project.',
   start:'n1',
   nodes:{
    n1:{ text:'The documentation request sits on your desk with three dated examples — procedurally correct, humanly thin. Your move first?',
      opts:[
       { t:'Approve the documentation path — patterns are patterns, and compassion that delays accountability helps nobody.', q:-1, fb:'Documentation without diagnosis converts a situational collapse into a character record. You have started an HR timeline against someone in a family crisis, and it will read that way — to HR too.', to:'r2-damaged' },
       { t:'Direct the lead: "Hold the documentation 72h. First, a human conversation: what changed, what support exists, what can we flex. Then we re-read the pattern."', q:2, fb:'You preserved both instruments: the person gets a human, the record gets accuracy. The 4-cause diagnosis just saved a career from a filing error.', to:'r2-intact' },
       { t:'Call Priya yourself, skip-level, to check on her — the lead is too hot.', q:0, fb:'Your instinct is human and your structure is arson: the lead now learns their people problems get taken from them. Coach the lead to have the conversation; be the backup, not the replacement.', to:'r2-intact' },
       { t:'Wait two more weeks to accumulate cleaner data.', q:-1, fb:'Quiet accumulation while someone drowns is not patience — it is surveillance with a kind face.', to:'r2-damaged' } ] },
    'r2-intact':{ text:'The conversation happens. Priya: her mother is terminal; she is the only child; she is sleeping 4 hours and cannot say it out loud in a work context. The plan that emerges: 6 weeks reduced scope, project handed to a peer, explicit return path, weekly human check-ins (not status). Stakeholders must be told something. What gets communicated?',
      opts:[
       { t:'"Priya is on reduced scope temporarily; [peer] owns delivery. Questions to me." No reason given, and you carry the heat personally.', q:2, fb:'You protected medical privacy completely and made yourself the interface for the cost. That is what the leadership abstraction layer is for.', to:'end' },
       { t:'Share the reason with key stakeholders under confidence — they deserve context for the slip.', q:-1, fb:'There is no such thing as confidential-told-once in an org chart. Her mother\'s illness is not currency to pay your stakeholders.', to:'end' },
       { t:'Vague framing: "personal reasons" to everyone including the taking-over peer.', q:1, fb:'Good instinct; one leak risk: the peer absorbing the project deserves the truth-shaped version (workload reality) if not the facts. Brief them with dignity-preserving honesty.', to:'end' },
       { t:'Announce a "support Priya" rally in the team channel.', q:-1, fb:'Public verklemming strips her of the right to be ordinary. Support that announces itself is for the giver.', to:'end' } ] },
    'r2-damaged':{ text:'The documentation email goes out. Priya requests a meeting, reads it silently, and says: "So that\'s who I am here, on my worst month of my life." She leaves the room composed. She will not say another true thing in this building. Recovery move?',
      opts:[
       { t:'Withdraw the document explicitly, in writing, own the sequencing error to her and to your lead, rebuild with the 72h-late human conversation.', q:2, fb:'Documents can be withdrawn by the same authority that issued them. What you cannot withdraw is the lesson her peers learned watching this — act at full speed.', to:'end' },
       { t:'Leave the document but add context notes about the circumstances.', q:-1, fb:'Annotated injustice is still injustice. The file now says "we knew, and proceeded."', to:'end' },
       { t:'Let it stand; give it three months to age out.', q:-2, fb:'You have priced her loyalty permanently and told the org what the system does with its wounded. Expect the next resignation within two quarters.', to:'end' },
       { t:'Offer her two weeks of "secret vacation" while the file cools.', q:-1, fb:'Cover-story accommodation inside a documented process is how grievances acquire plot twists. Clean beats clever.', to:'end' } ] }
   },
   verdicts:{ high:'Diagnosis before documentation, privacy as principle, yourself as the interface for the cost. You kept both the person and the standard.', mid:'The person survived the process, but the process revealed who it was built to protect.', low:'The record won and the relationship died. Documentation applied without diagnosis doesn\'t just fail the person — it audits you to everyone watching. Rebuild the reflex: human conversation FIRST, paper second, always.' } },
 { id:'sc4', title:'The skip-level leak', tag:'system', time:'8 min',
   setup:'In a routine skip-level, an engineer tells you: "We all know the reorg is coming. Tom told us weeks ago to prepare ourselves emotionally, whatever that means." No reorg is announced. One is being designed — by you and your boss.',
   start:'n1',
   nodes:{
    n1:{ text:'You did not tell Tom. The only other people who knew: your boss and HR. The leak exists, and your report Tom is either the source or a repeater. Your first move?',
      opts:[
       { t:'Confront Tom cold: "Who did you hear it from, and why did you spread it?"', q:-1, fb:'Interrogation before diagnosis: you\'ve decided the story and are shopping for confirmation. If he received it as rumor and repeated it in care for his team, you just convicted the wrong man with confidence.', to:'r2-damaged' },
       { t:'Private, exact: "In a skip-level I heard the reorg rumor attributed to you. Walk me through what you know and when." Then listen for source vs repeater.', q:2, fb:'Facts first, attribution second. You need the topology of the leak (source, vector, intent) before any consequence makes sense.', to:'r2-intact' },
       { t:'Ignore it — rumors are weather.', q:-1, fb:'A managed-change rumor left wild does maximum damage: the anxious update their CVs and the cynical pre-position. Containment is not optional.', to:'r2-damaged' },
       { t:'Immediately accelerate the announcement to regain control of the narrative.', q:-1, fb:'You just let a rumor set your company\'s reorg calendar. Half-built reorgs announced under pressure are how good people eat the chaos tax.', to:'r2-damaged' } ] },
    'r2-intact':{ text:'Tom, looking genuinely caught: "HR mentioned prep work for Q3 in a calibration call, half a sentence. I connected dots — wrong, apparently — and told my team something was coming so it wouldn\'t blindside them. I see how that read." Source: a careless half-sentence, vector: care, intent: protection. Your response?',
      opts:[
       { t:'"Your instinct to protect them is right; your method built a fog that protects no one. Here is what you say to them Friday, and here is the rule for half-sentences from calibrations: bring them to me first, always." Then fix the rumor with a partial-truth comms step.', q:2, fb:'You corrected the method without executing the motive, and you gave him the cleanup — leads who repair their own fog learn twice.', to:'end' },
       { t:'Formal warning; rumor-spreading by leads is a leadership-competence issue.', q:-1, fb:'You have made "telling me things early" the punishable act. Your leads now administer perfect silence and you fly blind forever.', to:'end' },
       { t:'Absorb it silently — HR\'s half-sentence was the true root cause.', q:0, fb:'Half right: the root IS upstream, and you should close it with HR. But Tom\'s correction is still owed — protection via rumor has a body count.', to:'end' },
       { t:'Tell Tom\'s team yourself that "nothing is confirmed" and leave Tom out of it.', q:-1, fb:'You just did the skip-level arson move: corrected a lead TO his team. His authority now has a visible crack exactly where his people can see it.', to:'end' } ] },
    'r2-damaged':{ text:'The fog thickens. Two engineers ask Tom directly; he denies everything badly. A resignation rumor starts. The reorg design isn\'t finished. Containment now costs double. Your move?',
      opts:[
       { t:'Own the fog: brief all leads on what\'s TRUE (org review exist, no decisions final, commit to a date when people will hear from you first), brief Tom privately on method, close the HR leak upstream.', q:2, fb:'Late containment done honestly still beats early containment done theatrically. A committed date is the only rumor-killer that scales.', to:'end' },
       { t:'Flat denial campaign: "no reorg is planned."', q:-2, fb:'When the announcement lands — and it will — the org\'s model of your word updates permanently. Plausible deniability has a half-life of one news cycle.', to:'end' },
       { t:'Find and make an example of one repeater.', q:-2, fb:'Punitive whack-a-rumor converts the entire org into intelligence agents against you. The fog learns to move rooms.', to:'end' },
       { t:'Say nothing until the design is done; stack-rank the anxious later.', q:-2, fb:'You are now managing by post-hoc cruelty. The people who retained lawyers during your silence will remember what your silence priced.', to:'end' } ] }
   },
   verdicts:{ high:'Facts before attribution, motive preserved while method corrected, rumor contained with committed dates. The leak made your system stronger.', mid:'Contained, eventually, with some authority spent on both ends.', low:'You interrogated before diagnosing or denied after leaking — either way the org\'s information model now routes AROUND you. Containment doctrine: true partial information with committed dates, never theatrical denial.' } },
 { id:'sc5', title:'The reorg wall', tag:'change', time:'10 min',
   setup:'The reorg you designed ships Monday: two teams merge, Tom\'s team absorbs Platform\'s charter, and Dana\'s team becomes a guild. Dana — who you retained two quarters ago — loses direct line management of four people. Her team got the announcement with everyone else.',
   start:'n1',
   nodes:{
    n1:{ text:'Dana\'s first reply, five words in the team channel: "Interesting. When was this settled?" — public, precise, and already read by forty people. Your move?',
      opts:[
       { t:'Answer in-channel, fast and straight: when it was decided, who was consulted, what changes for whom, and the office-hours link. No prose fog.', q:2, fb:'Speed + specificity in the open channel is how you pay the ambiguity tax down. Her question was fair; treat it as quality control, not insubordination.', to:'r2-intact' },
       { t:'Pull her into a private call before answering anything publicly.', q:-1, fb:'The public question festers while you manage the questioner. Forty people now watch you slow-walk a straight query — your first reorg behavior is being graded.', to:'r2-damaged' },
       { t:'Have HR post the FAQ and process questions there.', q:-1, fb:'Delegating YOUR reorg\'s first hard question to HR comms announces who designed it and who is hiding behind paperwork.', to:'r2-damaged' },
       { t:'DM her: "not the venue — take it offline."', q:-1, fb:'Venue-policing a legitimate question is status defense wearing process clothes. The channel reads it as: questions go elsewhere.', to:'r2-damaged' } ] },
    'r2-intact':{ text:'In office hours, Dana is direct: "I lose four people, my charter halves, my title stays. That is a demotion with the lights left on. Was this decided when you asked me to stay?" True: the reorg pre-dated her retention by a month. You knew. Your answer?',
      opts:[
       { t:'Own it completely: "Yes. I asked you to stay knowing this was coming and didn\'t tell you. That was mine to carry and I got it wrong. Here is what I did with the design time you earned me: the guild charter is yours to write — with real authority, and here is what real means."', q:2, fb:'Owning a retention-knowing is the most expensive sentence in this game and the only one that repurchases trust. The charter must be real authority, not compensation theater.', to:'end' },
       { t:'Defend the design: "The guild is more influence, not less. You\'re reading it in the worst frame."', q:-1, fb:'You have answered a betrayal-shaped question with spin. The frame she quoted is the one she will repeat — and she is the one people believe.', to:'end' },
       { t:'Blame the secrecy rule: "I was forbidden from sharing until Monday."', q:-1, fb:'True and useless: the rule explains the silence, not the retention ask inside the silence. She knows the difference.', to:'end' },
       { t:'Offer a title bump and comp correction on the spot.', q:-2, fb:'You just priced her trust in dollars at the exact moment she told you it wasn\'t about dollars — and every future retention conversation now has this one as precedent.', to:'end' } ] },
    'r2-damaged':{ text:'By Thursday: two of Dana\'s four reports have asked HR about transfer windows "preemptively". Dana has gone professionally silent — performing meetings, withholding herself. The ADKAR diagnosis: awareness high, desire at 1. Your move?',
      opts:[
       { t:'Work the desire block directly and individually: Dana first, truthful conversation about what she lost and what is genuinely hers (charter authority, succession path); then her four reports individually — desire is repaired one honest conversation at a time, never by memo.', q:2, fb:'You correctly refused to fix a desire problem with more information. ADKAR is sequential; only stage-appropriate investment moves it.', to:'end' },
       { t:'Launch a vision deck tour: all-hands roadshow on the new structure benefits.', q:-2, fb:'Awareness-investment against a desire block is the canonical change-management failure. The room will clap politely and keep interviewing.', to:'end' },
       { t:'Offer Dana a written retention package now, before she shops.', q:-1, fb:'The counter-offer muscle again: money against a meaning problem. You will rent her presence for two quarters at maximum price.', to:'end' },
       { t:'Accept the losses as natural reorg churn and harden the timeline.', q:-2, fb:'"Natural churn" is what leaders call the injury report they authored. Dana\'s silent professionalism is the loudest alarm your org has this quarter.', to:'end' } ] }
   },

/* ── 5. ENGINE — the case spine ─────────────────────────────────
   One registration point; every routed module receives a REAL,
   linked record; each write is recorded in the case ledger. */
const Engine = {};
function ledgerAdd(c, module, kind, id, label){ c.ledger.push({ module, kind, id, label, d: todayStr() }); }
function caseEvent(c, kind, text){ c.events.push({ d: todayStr(), k: kind, t: text }); }
function addTask(t){ const task = Object.assign({ id: uid('t'), done: false, cancelled: false, doneAt: null, caseId: null, personId: null, source: 'manual', createdAt: todayStr() }, t); S.tasks[task.id] = task; return task; }

Engine.createCase = function(vals){
  /* idempotency: identical open case (same type/person/title today) → return it */
  const dupe = list('cases').find(c => c.status!=='closed' && c.type===vals.type && c.title===vals.title && (c.personId||null)===(vals.personId||null) && c.createdAt===todayStr());
  if(dupe) return { c: dupe, dupe: true };
  const type = CASE_TYPES[vals.type];
  const sev = vals.severity || type.defSev;
  const c = {
    id: uid('c'), type: vals.type, title: vals.title, details: vals.details||'',
    severity: sev, personId: vals.personId||null, teamId: vals.teamId||null,
    createdAt: todayStr(), status: 'open', sla: addDays(todayStr(), FW.sla(sev)),
    closedAt: null, outcome: null, lesson: null,
    classification: { cyn: FW.cynefin(vals).domain, quadrant: FW.eisenhower(vals).quadrant, slaDays: FW.sla(sev) },
    ledger: [], events: [], sigPrior: null, escalated: false, escReasons: []
  };
  S.cases[c.id] = c;
  const p = c.personId ? get('people', c.personId) : null;

  /* ── ESCALATION HARD-STOP ── automation ends here, on purpose */
  const escTest = FW.escalate(vals);
  if(escTest.hit){
    c.escalated = true; c.escReasons = escTest.reasons;
    const t1 = addTask({ title:'Contact HR / ER partner today — legal-grade case, automation stopped', due: todayStr(), caseId: c.id, personId: c.personId, source:'escalation' });
    ledgerAdd(c,'_tasks','task',t1.id,t1.title);
    const t2 = addTask({ title:'Log verbatim facts + timestamps only (no opinions, no conclusions) in the evidence log', due: todayStr(), caseId: c.id, personId: c.personId, source:'escalation' });
    ledgerAdd(c,'_evidence-prep','task',t2.id,'Verbatim fact logging');
    const e = { id: uid('e'), personId: c.personId, caseId: c.id, kind:'case', date: todayStr(), text:'CASE REGISTERED (escalated): '+c.title+(c.details?' — '+c.details:''), source:'engine' };
    S.evidence[e.id]=e; ledgerAdd(c,'evidence','evidence',e.id,'Case evidence entry (verbatim)');
    caseEvent(c,'escalated','Escalation test tripped — playbook suspended. Route: HR/ER, not scripts.');
    S.telemetry.casesCreated++;
    save(); render();
    return { c, escalated: true };
  }

  /* ── FULL ROUTING ── */
  const rt = type.route;
  type.play.forEach(([off, text])=>{ const t = addTask({ title: text, due: addDays(todayStr(), off), caseId: c.id, personId: c.personId, source:'playbook' }); ledgerAdd(c,'playbook','task',t.id,text.slice(0,70)); });
  /* departure cascades per bus-factor capability — one KT task per capability,
     not one playbook line hoping a human expands it */
  if(vals.type==='departure'&&vals.personId){
    const dp=get('people',vals.personId);
    (dp&&dp.criticalFor||[]).forEach(cap=>{ const tk=addTask({ title:'Knowledge-transfer "'+cap+'": pair '+(dp.name.split(' ')[0])+' with the successor — 3 sessions before exit', due:addDays(todayStr(),2), caseId:c.id, personId:c.personId, source:'playbook' }); ledgerAdd(c,'busfactor','task',tk.id,'KT sessions for "'+cap+'"'); });
  }

  const e = { id: uid('e'), personId: c.personId, caseId: c.id, kind:'case', date: todayStr(), text:'CASE: '+c.title+(c.details?' — '+c.details:''), source:'engine' };
  S.evidence[e.id]=e; ledgerAdd(c,'evidence','evidence',e.id,'Evidence entry written');

  if(p && rt.sig && Object.keys(rt.sig).length){
    c.sigPrior = Object.assign({}, p.signals);
    Object.keys(rt.sig).forEach(k=>{ p.signals[k] = clamp((p.signals[k]||0)+rt.sig[k], 0, 8); });
    ledgerAdd(c,'signals','signal',p.id,'Signal flags '+Object.keys(rt.sig).map(k=>k+' +'+rt.sig[k]).join(', ')+' → flight risk re-scored '+(p.leave?'(leave: recorded, nags paused)':FW.flightRisk(p).score));
  }

  if(p && rt.oo){ 
    const future = list('oneonones').filter(o=>o.personId===p.id && o.status==='scheduled' && o.date>=todayStr()).sort((a,b)=>a.date>b.date?1:-1);
    if(rt.oo==='sched' && !future.length && !p.leave){
      const cad = FW.cadence(p).score;
      const oo = { id: uid('o'), personId: p.id, date: addDays(todayStr(), Math.min(3, cad)), status:'scheduled', agenda:[{ id: uid('a'), text:'Case: '+c.title, source:'case', done:false }], commitments:[], notes:'', mood:0, grow:{g:'',r:'',o:'',w:''} };
      S.oneonones[oo.id]=oo; ledgerAdd(c,'oneonones','oneonone',oo.id,'1:1 scheduled '+fmt(oo.date)+' (case on agenda)');
    } else if(future.length){
      const oo = future[0];
      oo.agenda.push({ id: uid('a'), text:'Case: '+c.title, source:'case', done:false });
      ledgerAdd(c,'oneonones','agenda',oo.id,'Agenda item injected into 1:1 on '+fmt(oo.date));
    }
  }

  if(p && rt.fb){
    const fb = { id: uid('f'), personId: p.id, caseId: c.id, kind: rt.fb==='praise'?'praise':'course', status:'draft',
      createdAt: todayStr(), deliveredAt: null, s: c.details.slice(0,90), b:'', i:'', next:'' };
    S.feedback[fb.id]=fb; ledgerAdd(c,'feedback','feedback',fb.id,(fb.kind==='praise'?'Praise':'Correction')+' draft (SBI) pre-filled — deliver within 72h');
  }

  if(rt.risk){
    const labels={attrition:'Key-person departure risk'};
    const rk = { id: uid('rk'), title: labels[c.type]||type.label+' — '+c.title.slice(0,50), p: rt.risk[0], i: rt.risk[1], owner:'You', mitigation:'Case playbook in progress', created: todayStr(), nextReview: addDays(todayStr(), 14), caseId: c.id, status:'open' };
    S.risks[rk.id]=rk; ledgerAdd(c,'risks','risk',rk.id,'Risk register entry P'+rk.p+'×I'+rk.i+', review '+fmt(rk.nextReview));
  }

  if(rt.comms){
    const tpl = COMM_TEMPLATES[rt.comms];
    const cm = { id: uid('cm'), kind: rt.comms, subject: tpl.subj, body: tpl.body, status:'draft', created: todayStr(), caseId: c.id, audience:'' };
    S.comms[cm.id]=cm; ledgerAdd(c,'comms','comms',cm.id,'Comms draft ('+rt.comms+') staged in Governance');
  }

  if(rt.decision && DECISION_WORTHY.has(c.type)){
    const d = { id: uid('d'), title:'How to resolve: '+c.title.slice(0,60), type:'two-way', driver:'You', approver:'', consulted:'', informed:'', context:c.details.slice(0,200), options:'', choice:'', confidence:6, premortem:['','',''], date: todayStr(), reviewDate: addDays(todayStr(), 14), status:'open', outcome:'', grade:0, caseId: c.id };
    S.decisions[d.id]=d; ledgerAdd(c,'decisions','decision',d.id,'Decision record opened + review gate '+fmt(d.reviewDate));
  }

  if(rt.diag){
    const dg = { id: uid('dg'), personId: c.personId, caseId: c.id, status:'assess', created: todayStr(), votes:null, top:null, mgrOwned:null, notes:'' };
    S.diagnoses[dg.id]=dg; ledgerAdd(c,'performance','diagnosis',dg.id,'4-cause diagnosis opened in Performance — run it before any coaching path');
  }

  if(rt.adkar){
    const ak = { id: uid('ak'), title: c.title.slice(0,60), caseId: c.id, created: todayStr(), status:'open', awareness:0, desire:0, knowledge:0, ability:0, reinforcement:0 };
    S.adkars[ak.id]=ak; ledgerAdd(c,'change','adkar',ak.id,'ADKAR record created — score it to find the first blocked stage');
  }

  caseEvent(c,'created','Case registered — routed to '+c.ledger.length+' modules. Judgment stays with you.');
  S.telemetry.casesCreated++;
  save(); render();
  return { c, escalated: false };
};
const DECISION_WORTHY = new Set(['attrition','conflict','perf_pattern','promotion','cross_team','missed_goal','meeting_debt','hiring','departure']);

Engine.closeCase = function(id, vals){
  const c = get('cases', id); if(!c || c.status==='closed') return;
  c.status='closed'; c.closedAt=todayStr(); c.outcome=vals.outcome; c.lesson=vals.lesson;
  let orphans=0;
  list('tasks').forEach(t=>{ if(t.caseId===id && !t.done && !t.cancelled && t.source==='playbook'){ t.cancelled=true; orphans++; } });
  if(c.sigPrior && c.personId){ const p=get('people',c.personId); if(p){ Object.keys(c.sigPrior).forEach(k=>{ p.signals[k]=c.sigPrior[k]; }); caseEvent(c,'restored','Signal flags restored to pre-case values'); } }
  const j = { id: uid('j'), date: todayStr(), kind:'lesson', text:'CASE CLOSED — '+CASE_TYPES[c.type].label+': '+c.title+'\nOutcome: '+vals.outcome+'\nLesson: '+vals.lesson };
  S.journal[j.id]=j; ledgerAdd(c,'journal','journal',j.id,'Lesson written to journal');
  const vt = addTask({ title:'Verify case outcome held (30d): '+c.title.slice(0,60), due: addDays(todayStr(),30), caseId: id, personId: c.personId, source:'verification' });
  ledgerAdd(c,'verification','task',vt.id,'30-day verification scheduled');
  caseEvent(c,'closed','Closed with outcome + lesson. '+orphans+' orphaned playbook tasks cancelled. SLA '+(c.closedAt<=c.sla?'met':'breached ('+daysBetween(c.sla,c.closedAt)+'d over)')+'.');
  S.telemetry.casesClosed++;
  save(); render();
};
Engine.reopenCase = function(id, why){
  const c=get('cases',id); if(!c) return;
  c.status='open'; c.closedAt=null; c.reopenedAt=todayStr();
  /* SLA resets at re-open: the old deadline enforced a closure hypothesis that
     already failed. Carrying it forward makes every re-open born breached. */
  c.sla=addDays(todayStr(), (c.classification&&c.classification.slaDays)||FW.sla(c.severity));
  caseEvent(c,'reopened','Re-opened'+(why?': '+why:'')+' — SLA reset to '+fmt(c.sla)+'.');
  save(); render();
};

/* 1:1 agenda assembly — six signal sources, always fresh */
Engine.agendaFor = function(pid){
  const items=[]; const p=get('people',pid); if(!p) return items;
  const lastDone=list('oneonones').filter(o=>o.personId===pid&&o.status==='done').sort((a,b)=>a.date>b.date?-1:1)[0];
  if(lastDone) (lastDone.commitments||[]).filter(cm=>!cm.done).forEach(cm=>items.push({ text:'Carried commitment'+(daysBetween(cm.due,todayStr())>0?' ('+daysBetween(cm.due,todayStr())+'d overdue)':'' )+' ['+(cm.mine===false?'theirs':'yours')+']: '+cm.text, source:'commitment' }));
  if(lastDone && lastDone.mood && lastDone.mood<=2) items.push({ text:'Last session mood was '+lastDone.mood+'/5 — open with "what would make this week a 4?"', source:'mood' });
  list('cases').filter(c=>c.status==='open'&&c.personId===pid).forEach(c=>items.push({ text:'Open case ('+CASE_TYPES[c.type].label+'): '+c.title+' — '+rel(c.sla), source:'case' }));
  list('feedback').filter(f=>f.personId===pid&&f.status==='draft').forEach(f=>{ const age=daysBetween(f.createdAt,todayStr()); if(age>=3) items.push({ text:'Undelivered '+f.kind+' feedback ageing '+age+'d — deliver or dump it', source:'feedback' }); });
  if(!p.leave){ const fr=FW.flightRisk(p); fr.drivers.slice(0,2).forEach(d=>{ const def=SIG_DEFS.find(x=>x[0]===d.k); items.push({ text:'Flight driver: '+def[1].split('—')[0].trim()+' at '+d.v+'/8 — ask about it directly', source:'risk' }); }); }
  if(p.start){ const tenure=daysBetween(p.start,todayStr()); if(tenure<90){ const stage=tenure<30?'30':tenure<60?'60':'90'; items.push({ text:'Ramp stage day-'+stage+' ('+tenure+'d in): review milestone evidence, not vibes', source:'ramp' }); } }
  if(p.devPlan&&p.devPlan.reviewAt){ const dD=daysBetween(todayStr(),p.devPlan.reviewAt); if(dD<=7){ const sk=p.devPlan.skills||[]; items.push({ text:'Dev plan review: '+sk.filter(x=>x.done).length+'/'+sk.length+' actions done ('+(dD<=0?Math.abs(dD)+'d overdue':'due '+fmt(p.devPlan.reviewAt))+') — ask what the plan caused, not whether it exists', source:'devplan' }); } }
  const wins=list('evidence').filter(e=>e.personId===pid&&(e.kind==='result'||e.kind==='recognition')&&daysBetween(e.date,todayStr())<45);
  const praised=list('feedback').filter(f=>f.personId===pid&&f.kind==='praise'&&f.deliveredAt&&daysBetween(f.deliveredAt,todayStr())<45).map(f=>(f.s||'').toLowerCase());
  wins.forEach(w=>{ if(!praised.some(pr=>pr && w.text.toLowerCase().includes(pr.slice(0,20)))) items.push({ text:'Unpraised win to deliver: '+w.text.slice(0,80), source:'praise' }); });
  return items;
};
Engine.nextOO = function(pid){ return list('oneonones').filter(o=>o.personId===pid&&o.status==='scheduled'&&o.date>=todayStr()).sort((a,b)=>a.date>b.date?1:-1)[0]||null; };
Engine.scheduleOO = function(pid, dateISO){

/* ── skip-levels: the manager-of-managers intelligence instrument ──
   Doctrine enforced in code: themes travel, quotes never. Every action
   routes THROUGH the lead (their 1:1), never around them. */
Engine.SKIP_CADENCE = 90;
/* reporting tree — managerId is the structure; everything else derives */
Engine.managerOf = function(p){ return (p&&p.managerId)?get('people',p.managerId):null; };
Engine.isDirect = function(p){ return !!p&&!p.managerId; };
Engine.directReports = function(id){ return activePeople().filter(p=>p.managerId===id); };
Engine.subtree = function(id){ const out=[]; const st=[id]; let guard=0; while(st.length&&guard++<500){ const cur=st.pop(); Engine.directReports(cur).forEach(x=>{ out.push(x.id); st.push(x.id); }); } return out; };
Engine.leadReports = function(lead){ return lead&&lead.id?Engine.directReports(lead.id):[]; };
Engine.skipLast = function(pid){ return list('skips').filter(s=>s.personId===pid&&s.status==='done').sort((a,b)=>a.date>b.date?-1:1)[0]||null; };
Engine.skipNext = function(pid){ return list('skips').filter(s=>s.personId===pid&&s.status==='scheduled'&&s.date>=todayStr()).sort((a,b)=>a.date>b.date?1:-1)[0]||null; };
Engine.skipCoverage = function(lead){
  const r=Engine.leadReports(lead);
  if(!r.length) return { n:0, covered:0, pct:100, stale:[] };
  const stale=r.filter(p=>{ const l=Engine.skipLast(p.id); return !l||daysBetween(l.date,todayStr())>Engine.SKIP_CADENCE; });
  return { n:r.length, covered:r.length-stale.length, pct:Math.round((r.length-stale.length)/r.length*100), stale };
};
Engine.skipsForLead = function(leadId){ const ids=Engine.leadReports(get('people',leadId)||{}).map(p=>p.id); return list('skips').filter(s=>ids.indexOf(s.personId)>=0); };
/* lead signal — composite read of a lead built from THEIR team's skip-levels */
FW.leadSignal = function(skips){
  const recent=(skips||[]).filter(s=>s.status==='done'&&daysBetween(s.date,todayStr())<=120);
  if(!recent.length) return { score:null, band:'unmeasured', bandLabel:'NO SKIP DATA', bandTone:'warn',
    reasoning:['No skip-levels held with this lead\u2019s reports in 120 days. You are evaluating a lead using only what the lead tells you.'],
    actions:['Book one skip-level per report this quarter. Themes only, never attributed — the instrument dies the first time it is used as evidence.'] };
  const dim=k=>avg(recent.map(s=>Number((s.signals||{})[k])||3));
  const d={ decisionStall:dim('decisionStall'), creditFlow:dim('creditFlow'), growthClear:dim('growthClear'), leadSupport:dim('leadSupport') };
  const labels={ decisionStall:'Decisions move without stalling on the lead', creditFlow:'Credit flows honestly up and down', growthClear:'Growth paths are clear to the team', leadSupport:'The team feels supported by the lead' };
  const score=Math.round(avg([d.decisionStall,d.creditFlow,d.growthClear,d.leadSupport])/5*100);
  const keys=Object.keys(d); let w=keys[0]; keys.forEach(k=>{ if(d[k]<d[w]) w=k; });
  const fixes={ decisionStall:'Decisions queue at this lead. Coach the L-ladder: move two recurring decision types to their reports at L5-L6 with written boundaries.',
    creditFlow:'Credit is not flowing. In your next 1:1 with the lead, ask them to name who did the last three good things — if they cannot, that is the coaching.',
    growthClear:'Their team cannot see a path. Require one dated development plan per report within 30 days, reviewed with you.',
    leadSupport:'The team does not feel supported. This is the trust equation one level down — work it with the lead as THEIR development item, not as an accusation.' };
  return { score, band:score>=75?'strong':score>=55?'watch':'weak', bandLabel:(score>=75?'STRONG':score>=55?'WATCH':'WEAK')+' · '+recent.length+' skips/120d',
    bandTone:score>=75?'ok':score>=55?'warn':'risk',
    reasoning:keys.map(k=>labels[k]+': '+r1(d[k])+'/5').concat(['Weakest dimension drives the prescription. Themes aggregated from '+recent.length+' sessions — no individual is identifiable in this score.']),
    actions:[fixes[w]] };
};

/* team intake — the 30-day ritual of inheriting a team, as dated tasks */
Engine.teamInherit = function(tid){
  const t=get('teams',tid); if(!t) return 0;
  const plan=[[1,'Meet every member 1:1 — 15 minutes each, listening only, zero decisions'],
    [2,'Run the Edmondson psych-safety scan (evidence, not vibes)'],
    [5,'Map critical-for capabilities and bus-factor holders on person pages'],
    [7,'Read the working agreement — or write one in 15 minutes'],
    [10,'Goal touch: state the team\u2019s top-3 goals and dates aloud, invite correction'],
    [14,'Expectations talk: five bullets of your standards, delivered once, kept visibly'],
    [30,'Book the first retro inside this window — drift compounds quietly after day 30']];
  plan.forEach(([off,text])=>addTask({ title:'Team intake ('+t.name+'): '+text, due:addDays(todayStr(),off), teamId:tid, source:'inherit' }));
  t.inheritedAt=todayStr();
  return plan.length;
};
/* team composite health — weighted, explainable */
Engine.teamHealth = function(t){
  const ps=FW.psych(t), dy=FW.dys(t), bf=FW.busFactor(t);
  const members=activePeople().filter(p=>p.teamId===t.id);
  const cases=list('cases').filter(c=>c.status==='open'&&c.teamId===t.id);
  const sevPenalty=Math.min(20, cases.reduce((a,c)=>a+c.severity,0)*2);
  const flightAvg=members.filter(p=>!p.leave).length? avg(members.filter(p=>!p.leave).map(p=>FW.flightRisk(p).score)) : 0;
  const cadScope=members.filter(p=>!p.managerId||p.level==='lead');
  const cadCover=cadScope.length? cadScope.filter(p=>p.leave||Engine.nextOO(p.id)).length/cadScope.length*100 : 100;
  const parts=[ ['Psychological safety', ps.score==null?40:ps.score, .30],
    ['Dysfunction ladder', dy.score, .25],
    ['Bus factor', bf.score>=3?10:bf.score===2?40:bf.score===1?70:100, .15],
    ['Retention pressure', 100-flightAvg, .15],
    ['Cadence coverage', cadCover, .15] ];
  let score=parts.reduce((a,p)=>a+p[1]*p[2],0); score=clamp(Math.round(score-sevPenalty),0,100);
  parts.sort((a,b)=>a[1]-b[1]);
  const band=score>=75?'healthy':score>=55?'strained':'failing';
  const reasoning=parts.map(p=>p[0]+' '+Math.round(p[1])+'/100 (weight '+Math.round(p[2]*100)+'%)');
  if(sevPenalty) reasoning.push('Open-case severity drag: −'+sevPenalty+' pts ('+cases.length+' open).');
  const actions=[];
  const worst=parts[0][0];
  if(worst==='Psychological safety') actions.push(ps.assessed?ps.actions[0]:'Run the psych-safety scan — you are managing this team blind.');
  if(worst==='Dysfunction ladder') actions.push(dy.actions[0]);
  if(worst==='Bus factor') actions.push(bf.actions[0]||'Tag critical capabilities on person pages.');
  if(worst==='Retention pressure') actions.push('Average flight risk '+Math.round(flightAvg)+' — run stay-interviews top-down, starting with the highest score.');
  if(worst==='Cadence coverage') actions.push('Book 1:1s for the uncovered members — the cadence sweep on Weekly review does it in one click.');
  return { score, band, bandLabel:band.toUpperCase(), reasoning, actions, parts, stage: FW.tuckman(t) };
};

/* 30/60/90 ramp generator — writes real dated tasks + a plan record */
Engine.rampGen = function(pid){
  const p=get('people',pid); const start=p.start||todayStr();
  const plan={ id: uid('pl'), kind:'ramp', personId: pid, created: todayStr(), status:'active', milestones:[
    { day:30, text:'Delivers scoped work with guidance; knows the map: people, systems, escalation paths', done:false },
    { day:60, text:'Delivers independently; gives and receives feedback; owns one small surface end-to-end', done:false },
    { day:90, text:'Full-load autonomy; first development plan agreed; peer trust established', done:false } ] };
  S.plans[plan.id]=plan;
  plan.milestones.forEach(m=>{ addTask({ title:'Ramp day-'+m.day+' review ('+p.name+'): '+m.text.slice(0,60), due: addDays(start, m.day), personId: pid, source:'ramp' }); });
  addTask({ title:'Ramp kickoff 1:1 ('+p.name+'): set 30-day milestone in observable terms', due: addDays(start,2), personId: pid, source:'ramp' });
  return plan;
};

function mentorScan(){
  const out=[];
  RULES.forEach(r=>{ let ctx=null; try{ ctx=r.when(); }catch(e){ ctx=null; }
    if(ctx){ const key=snoozeKey(r.id,ctx); const adv=r.adv(ctx);
      out.push({ id:r.id, icon:r.icon, cat:r.cat, w:r.w, key, snoozedUntil:S.snoozes[key]||null, title:adv.title, why:adv.why, tone:adv.tone||'warn', actions:(adv.actions||[]).map(a=>({label:a[0],kind:a[1],arg:a[2]})) }); } });
  S.telemetry.ruleRuns++;
  out.sort((a,b)=>b.w-a.w);
  return out;
}
function openAdvisories(){ return mentorScan().filter(a=>!snoozed(a.key)); }

const DAILY_REPS=['Write one SBI correction you owe someone, in under 90 seconds, adjective-free.','Ask one report "what are you not telling me?" and hold the silence seven seconds.','Cancel one meeting and send the decision log instead.','Find one unpraised win in the evidence log and deliver it today.','Take one decision off a lead\'s desk and hand it back with L6 authority and boundaries.','Admit one mistake you made this month, in a room, by name.','Read your last three journal entries and find the pattern you keep avoiding.','Block two hours for Q2 work before the calendar fills with other people\'s Q1.','Ask a skip-level report "what has the team stopped saying?" and just listen.','Re-score one person\'s trust sliders against this week\'s evidence, not last quarter\'s memory.','Send one stakeholder in manage-closely a no-ask update in their metric\'s language.','Name one decision you are stalling, classify its door, act accordingly today.','Kill one commitment publicly and name the slot it frees.','Run the avoided-conversation field: write the name. Then open their 1:1.','Review one delegation: is the reported reality matching the boundary conditions?'];

function dailyBrief(){
  const advisories=openAdvisories();
  const t=todayStr();
  S.trends[t]={ total:advisories.length, risk:advisories.filter(a=>a.tone==='risk').length, w:advisories.reduce((a,x)=>a+x.w,0) };
  const ks=Object.keys(S.trends).sort(); while(ks.length>60){ delete S.trends[ks.shift()]; }
  save();
  const todayOOs=list('oneonones').filter(o=>o.status==='scheduled'&&o.date===t).sort((a,b)=>a.date>b.date?1:-1);
  const overdueTasks=list('tasks').filter(x=>!x.done&&!x.cancelled&&x.due<t).sort((a,b)=>a.due>b.due?1:-1);
  const commitments=[];
  list('oneonones').filter(o=>o.status==='done').forEach(o=>(o.commitments||[]).forEach(cm=>{ if(!cm.done&&cm.due<t) commitments.push({ o, cm }); }));
  const load=FW.load();
  const doy=Math.floor((new Date() - new Date(new Date().getFullYear(),0,0))/86400000);
  const day=new Date().getDay();
  const focus=advisories.slice(0,3).map(a=>({ title:a.title, why:a.why.split('.')[0]+'.' }));
  return { advisories, todayOOs, overdueTasks, commitments, load, rep:DAILY_REPS[doy%DAILY_REPS.length], isFriday:day===5, focus };
}

/* command palette — one keystroke to anything. Routes, people, teams, open
   cases, and the actions worth reaching without navigating. */
function paletteItems(){
  const items=[];
  NAV.forEach(g=>g[1].forEach(r=>items.push({ t:r[1], s:'go · '+g[0].toLowerCase(), go:r[0], ic:r[2] })));
  activePeople().forEach(p=>items.push({ t:p.name, s:(p.role||'person')+(p.teamId?' · '+teamName(p.teamId):''), go:'/person/'+p.id, ic:'user' }));
  list('teams').forEach(t=>items.push({ t:t.name, s:'team', go:'/team/'+t.id, ic:'grid' }));
  openCases().forEach(c=>items.push({ t:c.title, s:'open case · '+CASE_TYPES[c.type].label, go:'/case/'+c.id, ic:'briefcase' }));
  [['Register a case','open-case','zap'],['Cadence sweep — book all 1:1s','cadence-sweep','calendar'],['Task triage','open-triage','clock'],
   ['Guided weekly review','review-commit','refresh'],['Journal entry','journal-new','pen'],['Draft SBI feedback','newfb','message'],
   ['Schedule skip-level','skip-new','eye'],['Log a decision','dec-new','bookmark'],['New delegation','del-new','share'],
   ['4-cause diagnosis','diag-new','gauge'],['Run integrity audit','integrity-run','shield'],['Export backup','export','download']].forEach(a=>items.push({ t:a[0], s:'action', act:a[1], ic:a[2] }));
  return items;
}
function openPalette(){
  const all=paletteItems();
  const row=i=>'<div class="checkline pal-row" data-i="'+i.idx+'" style="cursor:pointer"><span style="color:var(--acc);display:grid;place-items:center;width:18px">'+ic(i.ic)+'</span><span style="flex:1;min-width:0"><b style="font-size:12.5px">'+esc(i.t)+'</b><div style="font-size:10.5px;color:var(--faint)">'+esc(i.s)+'</div></span></div>';
  modal(modalHead('Jump to anything','type to filter · Enter opens the first result')+'<div class="modal-body">'+
    '<input class="in" id="pal-q" placeholder="person, team, case, module, action…" autocomplete="off">'+
    '<div id="pal-list" style="margin-top:10px;max-height:52vh;overflow-y:auto">'+all.slice(0,12).map((x,idx)=>row(Object.assign({idx},x))).join('')+'</div></div>');
  setTimeout(()=>{
    const q=document.getElementById('pal-q'), lst=document.getElementById('pal-list');
    let view=all.slice(0,12).map((x,idx)=>Object.assign({},x,{idx:all.indexOf(x)}));
    const paint=()=>{ const term=q.value.toLowerCase().trim();
      const hits=(term? all.filter(x=>(x.t+' '+x.s).toLowerCase().indexOf(term)>=0) : all).slice(0,30);
      view=hits.map(x=>Object.assign({},x,{ idx:all.indexOf(x) }));
      lst.innerHTML=view.length? view.map(row).join('') : '<div style="padding:16px;text-align:center;color:var(--faint);font-size:12.5px">Nothing matches. The record may not exist yet.</div>'; };
    const fire=i=>{ const it=all[i]; if(!it) return; closeModal(); if(it.go) go(it.go); else if(it.act&&Actions[it.act]) Actions[it.act](); };
    q.oninput=paint;
    q.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); if(view.length) fire(view[0].idx); } };
    lst.onclick=e=>{ const r=e.target.closest('.pal-row'); if(r) fire(parseInt(r.dataset.i,10)); };
    q.focus();
  },60);
}

function buildCatchup(since){
  const inW=d=>d&&d>=since&&d<=todayStr(); const days=daysBetween(since,todayStr());

  const oc=list('cases').filter(c=>c.createdAt>=since), cc=list('cases').filter(c=>c.closedAt&&c.closedAt>=since);
  L.push('','CASES — '+oc.length+' opened · '+cc.length+' closed');
  oc.slice(0,8).forEach(c=>L.push('  + '+CASE_TYPES[c.type].label+': '+c.title.slice(0,60)+' (sev '+c.severity+')'));
  cc.slice(0,5).forEach(c=>L.push('  ✓ '+c.title.slice(0,60)));
  const movers=activePeople().map(p=>{ const h=(p.frHistory||[]).filter(x=>x.d>=since); if(h.length<2) return null; const d=h[h.length-1].s-h[0].s; return Math.abs(d)>=8?{ name:p.name, d }:null; }).filter(Boolean).sort((a,b)=>b.d-a.d);
  L.push('','FLIGHT MOVERS ≥8 pts: '+(movers.length?movers.map(m=>m.name+' '+(m.d>0?'+':'')+m.d).join(' · '):'none on record'));
  const fbd=list('feedback').filter(f=>f.deliveredAt&&inW(f.deliveredAt));
  L.push('FEEDBACK: '+fbd.length+' delivered ('+fbd.filter(f=>f.kind==='praise').length+' praise / '+fbd.filter(f=>f.kind==='course').length+' correction)');
  L.push('EVIDENCE: '+list('evidence').filter(e=>inW(e.date)).length+' logged · tasks done: '+list('tasks').filter(t=>t.doneAt&&inW(t.doneAt)).length);
  const dv=list('decisions').filter(d=>inW(d.date)), drv=list('decisions').filter(d=>d.status==='reviewed'&&d.reviewDate&&inW(d.reviewDate));
  L.push('DECISIONS: '+dv.length+' logged · '+drv.length+' reviewed');
  const hired=list('candidates').filter(c=>c.status==='hired'&&c.closedAt&&inW(c.closedAt));
  L.push('HIRED: '+(hired.length?hired.map(c=>c.name).join(', '):'none'));
  const adv=openAdvisories();
  L.push('','PRESSURE NOW: '+adv.length+' advisories ('+adv.filter(a=>a.tone==='risk').length+' risk-grade)');
  const ks=Object.keys(S.trends).sort().filter(k=>k<=since); const t0=ks[ks.length-1];
  if(t0) L.push('PRESSURE TREND: '+S.trends[t0].total+' → '+adv.length+' open total');
  const th=list('teams').map(t=>({ name:t.name, arr:(S.healthTrends||{})[t.id]||[] })).filter(x=>x.arr.length>=2).map(x=>({ name:x.name, d:x.arr[x.arr.length-1].s-x.arr[x.arr.length-2].s })).filter(x=>Math.abs(x.d)>=8);
  if(th.length) L.push('TEAM HEALTH MOVERS: '+th.map(x=>x.name+' '+(x.d>0?'+':'')+x.d).join(' · '));
  L.push('','READ ORDER: risk-grade advisories first, then SLA pressure, then the caught-up cases. The daily brief already ranked them.');
  return L.join('\n');
}

  L.push('');

  L.push('');
