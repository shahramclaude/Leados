<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LeadOS — Leadership Operating System</title>
<style>
:root{
--bg:#0a0b0e;--bg2:#0e1015;--panel:#13151c;--panel2:#191c25;--line:#232733;--line2:#303645;
--ink:#ebe9e2;--ink2:#b9bdc7;--mut:#8b909c;--dim:#606673;
--amber:#e6a93d;--red:#e06760;--green:#6cbb7d;--blue:#6fa4f6;--violet:#a78ff2;--teal:#58bab0;
--mono:"SF Mono",ui-monospace,Menlo,Consolas,"Liberation Mono",monospace;
--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--rad:10px}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark}
body{background:var(--bg);color:var(--ink);font:14px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(900px 400px at 80% -10%,rgba(230,169,61,.05),transparent),radial-gradient(700px 500px at -10% 110%,rgba(111,164,246,.04),transparent)}
::selection{background:rgba(230,169,61,.35)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg2);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:70px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
input:focus,select:focus,textarea:focus{outline:1px solid var(--amber);border-color:var(--amber)}
input[type=checkbox]{width:auto;accent-color:var(--amber)}
input[type=range]{accent-color:var(--amber)}
label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:12px 0 5px}
.ks{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mono{font-family:var(--mono);font-feature-settings:"tnum"}
.num{font-variant-numeric:tabular-nums}
.ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
#app{display:grid;grid-template-columns:228px 1fr;min-height:100vh}
#rail{border-right:1px solid var(--line);background:var(--bg2);padding:18px 10px 40px;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:40}
#rail .mark{display:flex;align-items:center;gap:10px;padding:2px 8px 16px;border-bottom:1px solid var(--line);margin-bottom:12px}
#rail .mark .lg{width:26px;height:26px;border:1px solid var(--amber);border-radius:8px;display:grid;place-items:center;color:var(--amber)}
#rail .mark b{font-size:15px;letter-spacing:.02em}
#rail .mark span{display:block;font-size:9.5px;color:var(--mut);letter-spacing:.16em;text-transform:uppercase}
#rail .sec{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);padding:15px 10px 5px}
#rail a{display:flex;align-items:center;gap:9px;padding:6.5px 10px;border-radius:8px;color:var(--ink2);font-size:13px}
#rail a:hover{background:var(--panel2);color:var(--ink)}
#rail a.on{background:var(--panel2);color:var(--amber);box-shadow:inset 2px 0 0 var(--amber)}
#rail a .n{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--mut);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:0 7px}
#rail a .n.hot{color:#131007;background:var(--amber);border-color:var(--amber)}
#main{min-width:0}
#top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:10px 22px;border-bottom:1px solid var(--line);background:rgba(10,11,14,.9);backdrop-filter:blur(10px)}
#top .crumb{font-size:13px;color:var(--mut)}
#top .crumb b{color:var(--ink)}
#savechip{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--mut);display:flex;align-items:center;gap:6px;white-space:nowrap}
#savechip.bad{color:var(--red)}
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:7px 13px;font-size:13px;color:var(--ink);transition:border-color .15s,filter .15s,transform .1s}
.btn:hover{border-color:var(--dim)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--amber);border-color:var(--amber);color:#151007;font-weight:600}
.btn.pri:hover{filter:brightness(1.07)}
.btn.dan{color:var(--red);border-color:rgba(224,103,96,.42)}
.btn.gn{color:var(--green);border-color:rgba(108,187,125,.42)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.ghost{border-color:transparent;color:var(--mut)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line2)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
#view{padding:26px 30px 70px;max-width:1200px;animation:vf .22s ease}
@keyframes vf{from{opacity:.35;transform:translateY(4px)}}
h1{font-size:24px;font-weight:650;letter-spacing:-.015em}
h2{font-size:16px;font-weight:620;margin:0 0 4px}
h3{font-size:13.5px;font-weight:620}
.sub{color:var(--mut);font-size:13px;margin-top:4px;max-width:72ch}
.pagehead{margin-bottom:22px;display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.pagehead .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fill,minmax(350px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(275px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);padding:16px;transition:border-color .15s}
.card.hi{border-color:var(--line2);background:var(--panel2)}
.card.warn{border-color:rgba(224,103,96,.45)}
.card.good{border-color:rgba(108,187,125,.4)}
.card.am{border-color:rgba(230,169,61,.4)}
.card .ch{display:flex;align-items:center;gap:8px;margin-bottom:10px;color:var(--ink2)}
.card .ch .ic{color:var(--mut)}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.ellip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt{margin-top:14px}.mt2{margin-top:22px}.mb{margin-bottom:14px}
.mut{color:var(--mut)}.small{font-size:12px}.tiny{font-size:11px}
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;border:1px solid var(--line2);border-radius:20px;padding:2px 9px;color:var(--ink2);white-space:nowrap}
.chip.rd{color:var(--red);border-color:rgba(224,103,96,.45)}
.chip.gn{color:var(--green);border-color:rgba(108,187,125,.4)}
.chip.am{color:var(--amber);border-color:rgba(230,169,61,.45)}
.chip.bl{color:var(--blue);border-color:rgba(111,164,246,.4)}
.chip.vi{color:var(--violet);border-color:rgba(167,143,242,.4)}
.chip.tl{color:var(--teal);border-color:rgba(88,186,176,.4)}
.chip.solid{background:var(--red);border-color:var(--red);color:#170a09;font-weight:700}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.bar{height:6px;background:var(--bg2);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:var(--green)}
.bar.mid i{background:var(--amber)}.bar.bad i{background:var(--red)}.bar.bl i{background:var(--blue)}
.runway{height:8px;border-radius:6px;background:var(--bg2);position:relative;overflow:hidden}
.runway i{position:absolute;top:0;bottom:0;left:0;border-radius:6px}
.empty{border:1px dashed var(--line2);border-radius:var(--rad);padding:22px;color:var(--mut);font-size:13px;background:rgba(19,21,28,.4)}
.empty b{color:var(--ink2)}
.divider{height:1px;background:var(--line);margin:18px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:13px}
.kv dt{color:var(--mut)}.kv dd{color:var(--ink)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{text-align:left;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:600;padding:7px 10px;border-bottom:1px solid var(--line)}
.t td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.t tr:last-child td{border-bottom:0}
.t tr.click:hover{background:var(--panel2);cursor:pointer}
.list .li{display:flex;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);align-items:flex-start}
.list .li:last-child{border-bottom:0}
.basis{font-size:12px;color:var(--mut);border-left:2px solid var(--line2);padding-left:10px;margin-top:6px}
.whyline{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:6px}
.whyline b{color:var(--mut);font-weight:500}
.note-warn{font-size:11.5px;color:var(--mut);border:1px solid var(--line);background:var(--bg2);border-radius:8px;padding:7px 10px;margin-top:10px}
.sev{font-family:var(--mono);font-size:10.5px;border-radius:5px;padding:1px 7px;font-weight:700}
.s1{background:rgba(111,164,246,.16);color:var(--blue)}.s2{background:rgba(88,186,176,.16);color:var(--teal)}
.s3{background:rgba(230,169,61,.18);color:var(--amber)}.s4,.s5{background:rgba(224,103,96,.18);color:var(--red)}
#toasts{position:fixed;right:18px;bottom:18px;z-index:90;display:flex;flex-direction:column;gap:8px;max-width:400px}
.toast{background:var(--panel2);border:1px solid var(--line2);border-left:3px solid var(--amber);border-radius:9px;padding:10px 14px;font-size:13px;box-shadow:0 12px 32px rgba(0,0,0,.5);animation:up .25s ease}
.toast.err{border-left-color:var(--red)}.toast.ok{border-left-color:var(--green)}
@keyframes up{from{transform:translateY(8px);opacity:0}}
#mback{position:fixed;inset:0;background:rgba(4,5,7,.72);backdrop-filter:blur(5px);z-index:80;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:6vh 16px}
#mback.open{display:flex}
#modal{background:var(--panel);border:1px solid var(--line2);border-radius:14px;width:min(700px,100%);padding:22px 24px;box-shadow:0 24px 80px rgba(0,0,0,.6);animation:mz .18s ease}
#modal.wide{width:min(880px,100%)}
@keyframes mz{from{transform:scale(.985);opacity:.4}}
.mhead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.mhead h2{font-size:18px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.preview{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:12.5px;margin-top:14px}
.preview h4{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-bottom:8px}
.preview .li{display:flex;gap:8px;padding:4px 0;align-items:flex-start}
#capwrap{position:sticky;bottom:0;z-index:20;margin:30px -30px -70px;padding:14px 30px 18px;background:linear-gradient(transparent,var(--bg) 32%)}
#capture{display:flex;gap:8px;background:var(--panel2);border:1px solid var(--line2);border-radius:12px;padding:10px 12px;align-items:center}
#capture input{border:0;background:transparent;padding:4px 6px}
#capture input:focus{outline:none}
#capture .hint{font-family:var(--mono);font-size:10px;color:var(--dim);white-space:nowrap}
#pal{position:fixed;inset:0;z-index:85;background:rgba(4,5,7,.62);display:none;align-items:flex-start;justify-content:center;padding-top:12vh}
#pal.open{display:flex}
#palbox{width:min(580px,92%);background:var(--panel2);border:1px solid var(--line2);border-radius:14px;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.6)}
#palbox input{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:14px 16px;font-size:15px;background:var(--panel)}
#pallist{max-height:46vh;overflow-y:auto;padding:8px}
#pallist .pi{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:8px;font-size:13px;cursor:pointer;color:var(--ink2)}
#pallist .pi.on{background:var(--bg2);color:var(--ink);box-shadow:inset 2px 0 0 var(--amber)}
#pallist .pi .tag{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--dim)}
.nine{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.nine div{aspect-ratio:2.1;background:var(--bg2);border:1px solid var(--line);border-radius:6px;font-size:10px;color:var(--dim);display:flex;align-items:center;justify-content:center;text-align:center;padding:4px;position:relative}
.nine div.here{border-color:var(--amber);color:var(--amber);background:rgba(230,169,61,.08)}
.nine div.clickable{cursor:pointer}
.nine div.clickable:hover{border-color:var(--dim)}
.gate{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:8px;background:var(--panel)}
.sig{font-family:var(--mono);font-size:10px;font-weight:700;border-radius:5px;padding:2px 8px}
.sig.live{color:var(--green);background:rgba(108,187,125,.12)}.sig.pend{color:var(--dim);background:var(--bg2)}
.ledg{position:relative;padding-left:18px}
.ledg:before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:1px;background:var(--line2)}
.ledg .li{position:relative;padding:6px 0 6px 4px;font-size:12.5px}
.ledg .li:before{content:"";position:absolute;left:-16px;top:12px;width:7px;height:7px;border-radius:50%;background:var(--panel);border:2px solid var(--dim)}
.ledg .li.hl:before{border-color:var(--amber)}
.lane{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:22px 0 8px;display:flex;align-items:center;gap:8px}
.rulecard{display:flex;gap:12px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:12px 14px;margin-bottom:8px;align-items:flex-start}
.rulecard.firing{border-color:rgba(230,169,61,.5)}
.rulecard.locked{border-color:rgba(224,103,96,.55);background:rgba(224,103,96,.04)}
.rulecard.pos{border-color:rgba(108,187,125,.35)}
.rulecard.clear{opacity:.55}
.rulecard.sleep{opacity:.75}
kbd{font-family:var(--mono);font-size:10.5px;background:var(--bg2);border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--ink2)}
.meter{height:10px;background:var(--bg2);border-radius:6px;overflow:hidden}.meter i{display:block;height:100%;background:var(--green)}
.seat{display:flex;gap:12px;border:1px solid var(--line);border-radius:10px;padding:13px 14px;background:var(--panel);margin-bottom:10px;align-items:flex-start}
.seat.gap{border-color:rgba(224,103,96,.5)}
.seat.thin{border-color:rgba(230,169,61,.45)}
.rdy{font-family:var(--mono);font-size:10px;font-weight:700;border-radius:5px;padding:2px 8px}
.rdy.now{color:var(--green);background:rgba(108,187,125,.12)}.rdy.y1{color:var(--amber);background:rgba(230,169,61,.12)}.rdy.y2{color:var(--dim);background:var(--bg2)}
.spark{display:block}
@media print{#rail,#top,#capwrap,#toasts,.no-print{display:none!important}#app{display:block}#view{max-width:100%;padding:0;animation:none}body{background:#fff;color:#111}body:before{display:none}.card{border-color:#ccc;background:#fff}}
@media(max-width:900px){#app{grid-template-columns:1fr}#rail{display:none}#view{padding:18px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
<nav id="rail"></nav>
<div id="main">
<header id="top">
<div class="crumb" id="crumb">LeadOS</div>
<div class="row" style="gap:8px;margin-left:auto">
<button class="btn sm" id="top-case">Register case <kbd>C</kbd></button>
<button class="btn sm ghost" id="top-pal" title="Command palette">⌘K</button>
</div>
<div id="savechip"></div>
</header>
<main id="view"></main>
</div>
</div>
<div id="capwrap" class="no-print" style="display:none"><div id="capture"><span id="capic"></span><input id="capin" placeholder="case: … · commit: @name … by +3 · owe: … · praise: … · note: … · win: …" autocomplete="off"><span class="hint">verbs: case commit owe praise note win</span></div></div>
<div id="toasts" class="no-print"></div>
<div id="mback"><div id="modal"></div></div>
<div id="pal"><div id="palbox"><input id="palin" placeholder="Jump to module, person, open case, command…" autocomplete="off"><div id="pallist"></div></div></div>
<noscript><div style="padding:40px;font-family:sans-serif">LeadOS is a client-side application and needs JavaScript. No data ever leaves this browser.</div></noscript>
<script>
'use strict';
/* ============================================================
LeadOS v13.0 — single file. Vanilla JS. Zero network.
Store key: leados.v6 (lineage key, intentionally unrenamed).
Record version: v:7 (migrates v1..v6 -> v7 additively).
Layers: U -> ICONS -> TXT -> FW pure models -> STORE ->
RULES/AUDITS/TESTS -> IMPORT/EXPORT -> SEED -> ENG write-paths
(the case spine + talent spine) -> VIEWS -> ACT/FORMS -> BOOT.
============================================================ */
/* ---------- U: utilities ---------- */
const U={
esc:s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),
uid:p=>p+'-'+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3),
pad:n=>String(n).padStart(2,'0'),
iso(d){return d.getFullYear()+'-'+U.pad(d.getMonth()+1)+'-'+U.pad(d.getDate())},
today(){return U.iso(new Date())},
mk(d){const[a,b,c]=String(d||'').split('-').map(Number);return new Date(a||1970,(b||1)-1,c||1)},
D(off){const d=new Date();d.setDate(d.getDate()+off);return U.iso(d)},
addD(d,off){const x=U.mk(d);x.setDate(x.getDate()+off);return U.iso(x)},
days(a,b){return Math.round((U.mk(b)-U.mk(a))/86400000)},
age(d){return U.days(d,U.today())},
ago(d){const n=U.age(d);return n<=0?'today':n===1?'1d ago':n+'d ago'},
inD(d){const n=U.days(U.today(),d);return n<0?Math.abs(n)+'d overdue':n===0?'today':n===1?'in 1d':'in '+n+'d'},
fmtD(d){if(!d)return'—';const[a,b,c]=String(d).split('-');return c+' '+['—','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+b||1]+' '+a},
ym(d){return String(d||'').slice(0,7)},
clamp:(a,b,v)=>Math.max(a,Math.min(b,v)),
num:(v,f)=>{const n=Number(v);return Number.isFinite(n)?n:f},
mean:a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:0,
fmtB:n=>n<1024?n+' B':(n/1024).toFixed(1)+' KB',
pct:n=>Math.round(n*100)+'%',
first:s=>String(s||'').trim().split(/\s+/)[0]||'—',
trunc:(s,n)=>{s=String(s||'');return s.length>n?s.slice(0,n-1)+'…':s},
uidRe:/^[a-z]+-[a-z0-9]{3,}[a-z0-9]{3}$/
};
const $=s=>document.querySelector(s);
const esc=U.esc,uid=U.uid,today=U.today,D=U.D,addD=U.addD,days=U.days,age=U.age,ago=U.ago,inD=U.inD,fmtD=U.fmtD,clamp=U.clamp,num=U.num;
/* ---------- ICONS: inline SVG, lucide-style geometry, zero network ---------- */
const ICONS={
zap:'<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>',
radar:'<circle cx="12" cy="12" r="2"/><path d="M12 10V4"/><path d="M12 14v6"/><path d="M4.9 7.1l4.2 4.2"/><path d="M14.8 14.8l4.3 4.2"/><path d="M2 12h4"/><path d="M18 12h4"/>',
flag:'<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/>',
users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
user:'<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
layers:'<polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/>',
msg:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
compass:'<circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>',
door:'<path d="M13 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><polyline points="9 7 4 12 9 17"/><line x1="4" y1="12" x2="14" y2="12"/>',

const FW={
slope(sessions){const m=(sessions||[]).filter(s=>s.mood&&!s.estimated).map(s=>({at:s.at,v:(num(s.mood.energy,3)+num(s.mood.morale,3)+num(s.mood.load,3))/3})).sort((a,b)=>a.at<b.at?-1:1);
if(m.length<4)return null;const mid=Math.floor(m.length/2),a=U.mean(m.slice(0,mid).map(x=>x.v)),b=U.mean(m.slice(mid).map(x=>x.v));
return b-a>0.25?'up':a-b>0.25?'down':'flat'},
flight(p,S,now){if(!p)return{score:0,band:'LOW',ledger:[],top:null};const Dv=p.flight&&p.flight.drivers||{};const W={change:22,manager:18,load:16,growth:14,recog:12,signal:18};
const led=[];let sc=0;
for(const k of['change','manager','load','growth','recog']){const v=clamp(0,3,num(Dv[k],0));if(v>0){const pts=Math.round(v/3*W[k]);sc+=pts;led.push({k,v,pts})}}
const sess=S.sessions.filter(s=>s.personId===p.id&&s.mood&&!s.estimated);const sl=FW.slope(sess);
if(sl==='down'){sc+=W.signal;led.push({k:'telemetry declining',v:3,pts:W.signal})}
else if(sl==='up'){led.push({k:'telemetry rising',v:0,pts:0})}
else if(sess.length<4){led.push({k:'telemetry thin ('+sess.length+' measured)',v:0,pts:0})}
const open=S.cases.filter(c=>c.who===p.id&&c.status==='open').length;
if(open>=2){sc+=8;led.push({k:open+' open cases on this person',v:2,pts:8})}
sc=clamp(0,100,sc);led.sort((a,b)=>b.pts-a.pts);
const FIX={change:'Give context: what is stable, what changes, what stays theirs to decide.',manager:'This one is yours: raise 1:1 quality, deliver the ageing feedback, clear their blockers in 48h.',load:'Rebalance concretely: kill one commitment or one meeting this week, on the record.',growth:'Co-contract one stretch task with a deadline and visibility — not a vague someday.',recog:'Specific, dated recognition within 48h — praise the behavior, not the person.','telemetry declining':'Do not interrogate the slope. Run one honest 1:1 whose only agenda is them.','telemetry rising':'Keep doing what you are doing; say so out loud.'};
const top=led.find(l=>l.pts>0)||null;
return{score:sc,band:sc>=60?'HIGH':sc>=30?'MED':'LOW',ledger:led,top:top?{driver:top.k,fix:FIX[top.k]||'Address the top driver in your next 1:1.'}:null,sessions:sess.length}},
trust(c,r,i,s){const den=Math.max(1,num(s,1));const v=(num(c,0)+num(r,0)+num(i,0))/den;
const parts={credibility:num(c,0),reliability:num(r,0),intimacy:num(i,0)};const weakest=Object.keys(parts).sort((a,b)=>parts[a]-parts[b])[0];
const FIXW={credibility:'Close the knowledge gap publicly: present your model of the domain, admit what you do not know.',reliability:'Ship three small promises on time in a row. Reliability is streaks, not speeches.',intimacy:'Ask one level deeper in the next 1:1, then stay silent five seconds longer.'};
return{v:Math.round(v*10)/10,band:v>=7?'HIGH':v>=4?'BUILDING':'LOW',weakest,fix:FIXW[weakest]}},
krCur(kr){const ci=kr.ci||[];return ci.length?num(ci[ci.length-1].v,kr.s):num(kr.s,0)},
krScore(kr){const s=num(kr.s,0),t=num(kr.tgt,100),c=FW.krCur(kr);if(t===s)return 0;

conf(kr){const ci=(kr.ci||[]).filter(x=>num(x.c,null)!=null);if(ci.length<2)return null;

goalStatus(g,now){const krs=g.krs||[];if(!krs.length)return{st:'watch',why:['no key results defined'],pct:0};

cynefin(type,sev,ethics){if(ethics)return{dom:'SEALED',move:'Not a leadership case. Four wires only; HR owns the room, today.'};

nine(p,now){const pm={low:1,mid:2,high:3};const perf=pm[p.nine&&p.nine.p]||2,pot=pm[p.nine&&p.nine.pot]||2;

const LSKEY='leados.v6'; /* lineage key — intentionally NOT renamed at v7: renaming keys orphans every existing user's data. Record version inside is the source of truth. */
const RECV=7;
let S=null,RECOVERY=false,LASTSAVE='';
const blank=()=>({v:RECV,log:[],snooze:{},identity:{name:'',tookRole:''},teams:[],people:[],cases:[],tasks:[],sessions:[],feedbacks:[],evidence:[],delegations:[],mediations:[],handoffs:[],goals:[],decisions:[],commitments:[],pulses:[],edmondson:[],dysf:{cur:1,ev:{}},meetings:[],stakes:[],wins:[],coachings:[],lessons:[],aars:[],rituals:[],academy:{done:{},notes:{}},roles:[],packets:[],gatesDone:{},studied:{},reviewSeenAt:null,exportedAt:null});
const COLL=['teams','people','cases','tasks','sessions','feedbacks','evidence','delegations','mediations','handoffs','goals','decisions','commitments','pulses','edmondson','meetings','stakes','wins','coachings','lessons','aars','rituals','roles','packets'];
function guard(r){r=r&&typeof r==='object'&&!Array.isArray(r)?r:blank();
COLL.forEach(k=>{if(!Array.isArray(r[k]))r[k]=[]});
['log'].forEach(k=>{if(!Array.isArray(r[k]))r[k]=[]});
['snooze','identity','academy','gatesDone','studied'].forEach(k=>{if(!r[k]||typeof r[k]!=='object'||Array.isArray(r[k]))r[k]=(k==='identity'?{name:'',tookRole:''}:k==='academy'?{done:{},notes:{}}:{})});
if(!r.dysf||typeof r.dysf!=='object')r.dysf={cur:1,ev:{}};
r.people.forEach(p=>{if(!p.nine)p.nine={p:'mid',pot:'mid',at:today()};if(!p.flight)p.flight={drivers:{}};if(!p.trust)p.trust={c:5,r:5,i:5,s:3};if(!p.at)p.at=today();if(!num(p.cad,0))p.cad=14});
r.v=RECV;return r}
function migrate(rec){const from=num(rec.v,1);let r=rec;
for(let v=from;v<RECV;v++){
if(v<6){ /* v1..v5 -> v6: additive defaults (guarded rebuild) */ r=guard(Object.assign(blank(),r)); r.v=6; (r.log=r.log||[]).push({at:today(),t:'migration v'+v+'→v6: additive defaults only — no record rewritten'})}
if(v===6){ /* v6 -> v7: succession + advocacy layers arrive */ if(!Array.isArray(r.roles))r.roles=[]; if(!Array.isArray(r.packets))r.packets=[];
if(!r.gatesDone)r.gatesDone={}; if(!r.studied)r.studied={};
r.people=r.people||[];r.people.forEach(p=>{if(!p.at)p.at=today()});
r.v=7; r.log.push({at:today(),t:'migration v6→v7: added succession seats + advocacy packets (empty). All existing records untouched.'})}
}
return guard(r)}

function paintSaveChip(failed,bytes){const c=$('#savechip');if(!c)return;
if(RECOVERY){c.className='';c.textContent='RECOVERY — not saving';return}
if(failed){c.className='bad';c.innerHTML=icon('warn',13)+' WRITE FAILED · '+U.fmtB(bytes||0)+' — export now, then free space';return}
c.className='';c.textContent=(LASTSAVE||'not saved yet')+(storeBytes()?' · '+U.fmtB(storeBytes()):'')}
function save(){if(RECOVERY||!S)return;const raw=JSON.stringify(S);
try{localStorage.setItem(LSKEY,raw);LASTSAVE='saved '+new Date().toTimeString().slice(0,5);paintSaveChip(false)}
catch(e){paintSaveChip(true,raw.length);toast('WRITE FAILED ('+U.fmtB(raw.length)+') — quota or privacy mode. Export immediately from #/data, then prune.','err')}}
function loadStore(){let raw=null;try{raw=localStorage.getItem(LSKEY)}catch(e){return{bootErr:'localStorage unreadable: '+e.message}}
if(raw==null)return{state:null};
let parsed=null;try{parsed=JSON.parse(raw)}catch(e){
const side=LSKEY+'.corrupt-'+Date.now();try{localStorage.setItem(side,raw)}catch(e2){}
return{corrupt:side}}
if(!parsed||typeof parsed!=='object'||Array.isArray(parsed)){const side=LSKEY+'.corrupt-'+Date.now();try{localStorage.setItem(side,raw)}catch(e2){}return{corrupt:side}}
if(num(parsed.v,0)>RECV)return{newer:parsed.v};
if(num(parsed.v,0)<RECV){const m=migrate(parsed);m.log.push({at:today(),t:'boot migration v'+parsed.v+'→v'+RECV+' applied — additive only'});return{state:m}}
return{state:guard(parsed)}}

function runRules(S,now){const firing=[],sleeping=[],clear=[];
for(const rule of RULES){let r=null;try{r=rule.test(S,now)}catch(e){r=null}
const sz=S.snooze[rule.id];
if(r){if(sz&&sz>=now&&!rule.locked){sleeping.push({rule,msg:r.msg,refs:r.refs||[],wake:sz})}else firing.push({rule,msg:r.msg,refs:r.refs||[]})}
else clear.push(rule)}
firing.sort((a,b)=>(b.rule.locked?1:0)-(a.rule.locked?1:0)||CATS.indexOf(a.rule.cat)-CATS.indexOf(b.rule.cat));
return{firing,sleeping,clear}}

const AUDITS=[
{id:'ethics-wires',name:'Ethics wire-set sealed',what:'Ethics cases may carry exactly the sealed wires (intake/evidence/hr-task/agenda) plus closure. Anything else is a leak.',
test:S=>S.cases.filter(c=>c.ethics).flatMap(c=>{const bad=[];
(c.ledger||[]).forEach(l=>{if(!SEALED_WIRES.concat(['closure','verify','note']).includes(l.kind))bad.push(c.id+': stray wire "'+l.kind+'"')});
S.tasks.filter(t=>t.caseId===c.id&&t.src!=='hr').forEach(t=>bad.push(c.id+': non-hr task "'+U.trunc(t.what,30)+'"'));
S.decisions.filter(d=>d.caseId===c.id).forEach(d=>bad.push(c.id+': decision stub attached'));
S.goals.filter(g=>g.atRisk&&g.atRisk.caseId===c.id).forEach(g=>bad.push(c.id+': goal flag attached'));
return bad}),
repair:S=>{let n=0;S.cases.filter(c=>c.ethics).forEach(c=>{c.ledger=(c.ledger||[]).filter(l=>SEALED_WIRES.concat(['closure','verify','note']).includes(l.kind)||(n++,false));
S.tasks.filter(t=>t.caseId===c.id&&t.src!=='hr').forEach(t=>{t.st='canceled';n++});S.decisions=S.decisions.filter(d=>!(d.caseId===c.id&&(n++,true)));
S.goals.filter(g=>g.atRisk&&g.atRisk.caseId===c.id).forEach(g=>{g.atRisk=null;n++})});return n}},
{id:'dup-cases',name:'Duplicate open cases',what:'Identical open case (same type, person, normalized title) must be refused at commit. A surviving pair means intake was bypassed.',
test:S=>{const seen={},bad=[];S.cases.filter(c=>c.status==='open').forEach(c=>{const k=c.type+'|'+(c.who||'')+'|'+String(c.title||'').toLowerCase().replace(/\s+/g,' ').trim();if(seen[k])bad.push('dup: '+c.id+' ≅ '+seen[k]);else seen[k]=c.id});return bad}},
{id:'telemetry-honest',name:'Telemetry honesty (executes a probe)',what:'Synthetic series with estimated injections must produce the same slope as the series minus them; stored moods in 1..5.',
test:S=>{const bad=[];const base=[{at:'2025-01-01',mood:{energy:2,morale:2,load:2}},{at:'2025-01-05',mood:{energy:2,morale:3,load:2}},{at:'2025-01-09',mood:{energy:4,morale:4,load:4}},{at:'2025-01-13',mood:{energy:4,morale:5,load:4}}];
const inj=base.concat([{at:'2025-01-03',mood:{energy:5,morale:5,load:5},estimated:true},{at:'2025-01-11',mood:{energy:1,morale:1,load:1},estimated:true}]);
if(FW.slope(inj)!==FW.slope(base))bad.push('probe failed: estimated records moved the slope');
S.sessions.forEach(s=>{if(s.mood)['energy','morale','load'].forEach(k=>{if(num(s.mood[k],3)<1||num(s.mood[k],3)>5)bad.push(s.id+': mood.'+k+' out of range')})});
return bad},
repair:S=>{let n=0;S.sessions.forEach(s=>{if(s.mood)['energy','morale','load'].forEach(k=>{const v=s.mood[k];s.mood[k]=clamp(1,5,num(v,3));if(v!==s.mood[k])n++})});return n}},
{id:'sla-coherent',name:'SLA coherence',what:'case.slaDue must equal FW.sla(sev, openedAt) unless a re-open restarted the clock from the re-open date.',
test:S=>S.cases.filter(c=>c.status==='open'&&!c.ethics).flatMap(c=>{const reopen=(c.ledger||[]).filter(l=>l.kind==='verify'&&/re-open/i.test(l.text)).pop();
const base=reopen?c.slaDue&&(c.ledger[c.ledger.length-1]||{}).at:null;
const expected=FW.sla(c.sev,c.openedAt).due;
return(reopen?false:c.slaDue!==expected)?[c.id+': slaDue '+c.slaDue+' ≠ policy '+expected]:[]}),
repair:S=>{let n=0;S.cases.filter(c=>c.status==='open'&&!c.ethics).forEach(c=>{const e=FW.sla(c.sev,c.openedAt).due;if(c.slaDue!==e){c.slaDue=e;n++}});return n}},
{id:'goal-flag-bidir',name:'Goal flags both directions',what:'goal.atRisk must name a live case that names the goal back. Dead flags and one-way wires are severed links.',

function validateImport(text){if(typeof text!=='string')return{err:'empty input'};
let o;try{o=JSON.parse(text)}catch(e){return{err:'not JSON ('+e.message+')'}}
if(!o||typeof o!=='object'||Array.isArray(o))return{err:'root is not a record object'};
if(typeof o.v!=='number')return{err:'record has no numeric version v'};
if(o.v>RECV)return{err:'record is v:'+o.v+' — NEWER than this build (v:'+RECV+'). Silent downgrade refused.'};
if(o.v<1)return{err:'record version v:'+o.v+' is invalid'};
try{return{o:migrate(o)}}catch(e){return{err:'migration failed: '+e.message}}}

(o.delegations||[]).forEach(d=>{d.personId=rw(d.personId)});

save();return n}

nine:{p:'mid',pot:'mid',at:today()},flight:{drivers:{change:0,manager:0,load:0,growth:0,recog:0}},trust:{c:5,r:5,i:5,s:3}};

/* ---------- DELEGATED LISTENERS ---------- */
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-f]');if(!f)return;e.preventDefault();
/* Named inputs like id/title/name collide with built-in form properties. Resolve fields through f.elements first; bind methods to the real form. One fix, whole class gone. */
const fx=new Proxy(f,{get:(t,k)=>{if(k==='elements')return t.elements;const el=t.elements&&t.elements[k];const v=(el!=null&&typeof k==='string')?el:t[k];return typeof v==='function'?v.bind(t):v}});
const sub=e.submitter&&e.submitter.dataset&&e.submitter.dataset.fA?e.submitter.dataset.fA:null;
try{FORMS[f.dataset.f](fx,sub)}catch(err){console.error('[LeadOS] form handler failed:',err);toast('Handler error (see console): '+err.message,'err')}});
document.addEventListener('click',e=>{
const go=e.target.closest('tr[data-go]');if(go){location.hash=go.dataset.go;return}
const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a;
if(ACT[a]){e.preventDefault();ACT[a](el)}});
document.addEventListener('change',e=>{
const mdl=e.target.closest('#fb-model');
if(mdl){const form=mdl.closest('form');const vals=[];for(let i=0;i<4;i++)vals.push(form['p'+i]?form['p'+i].value:'');
$('#fb-parts').innerHTML=FB_MODELS[mdl.value].map((ph,i)=>'<label>'+ph.split(' — ')[0]+'<span class="tiny dim"> — '+esc(ph.split(' — ')[1]||'')+'</span></label><textarea name="p'+i+'">'+esc(vals[i]||'')+'</textarea>').join('');return}
const fi=e.target.closest('input[data-import]');if(!fi||!fi.files[0])return;
const mode=fi.dataset.import;const file=fi.files[0];const r=new FileReader();
r.onload=()=>{const v=validateImport(r.result);
if(v.err){toast('Import refused loud, state untouched: '+v.err,'err');fi.value='';return}
if(mode==='replace'){confirm2('Replace current state with this backup (v:'+v.o.v+')? A safety export downloads first.',()=>{exportJSON();S=v.o;log('import replaced state');runAudits(S,true);save();render();toast('State replaced — post-import audit ran.','ok')})}
else{const n=mergeImport(v.o);render();toast('Merged — '+n+' ids re-minted, graph rewired, audits re-run.','ok')}
fi.value=''};
r.readAsText(file)});
document.addEventListener('input',e=>{
if(e.target.closest('#growf')){const f=e.target.closest('form');const q=FW.growQ({g:f.g.value,r:f.r.value,o:f.o.value,w:f.w.value});
const s1=$('#growq');if(s1)s1.textContent='quality '+q.score+'/100';const s2=$('#growq-miss');if(s2)s2.innerHTML=q.missing.map(m=>'· '+esc(m)).join('<br>');return}
if(e.target.closest('#ci-form')){const f=e.target.closest('form');MODAL_CTX.ci={type:f.type.value,sev:+f.sev.value,who:f.who.value,teamId:f.teamId.value,title:f.title.value,facts:f.facts.value,goalId:f.goalId.value};
const pv=$('#ci-prev');if(pv)pv.innerHTML=casePrev(MODAL_CTX.ci);return}});
document.addEventListener('keydown',e=>{const typing=/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.target.isContentEditable;
if((e.key==='/'&&!typing)||((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k')){e.preventDefault();openPal();return}
if(typing)return;
if(e.key==='Escape'){closeModal();closePal();return}
if(e.key.toLowerCase()==='c'){e.preventDefault();ACT['open-case']({});return}
const num2={'1':'today','2':'signal','3':'cases','4':'people','5':'oneonones','6':'feedback','7':'coach','8':'decisions','9':'aar','0':'review'}[e.key];
if(num2)location.hash='#/'+num2});
$('#capin').addEventListener('keydown',e=>{if(e.key!=='Enter')return;const v=e.target.value;if(ENG.capture(v)){e.target.value='';render()}});
$('#top-case').onclick=()=>ACT['open-case']({});
$('#top-pal').onclick=()=>openPal();
/* ---------- PALETTE (keyboard selection is VISIBLE — v12 bug fixed here) ---------- */
function openPal(){PAL_ITEMS=[
...ROUTES.map(r=>({t:r.t,tag:'module',go:()=>location.hash='#/'+r.r})),
...S.people.map(p=>({t:p.name,tag:'person',go:()=>location.hash='#/person/'+p.id})),
...S.cases.filter(c=>c.status==='open').slice(0,8).map(c=>({t:c.title,tag:'case sev-'+c.sev,go:()=>location.hash='#/case/'+c.id})),
{t:'Register case',tag:'command · C',go:()=>ACT['open-case']({})},
{t:'Export JSON backup',tag:'command',go:()=>exportJSON()},
{t:'Run self-tests',tag:'command',go:()=>location.hash='#/about'}];
PAL_SEL=0;$('#pal').classList.add('open');const inp=$('#palin');inp.value='';
const draw=()=>{const q=inp.value.toLowerCase();const f=PAL_ITEMS.filter(i=>i.t.toLowerCase().includes(q)).slice(0,12);PAL_CUR=f;
$('#pallist').innerHTML=f.map((i,x)=>'<div class="pi'+(x===PAL_SEL?' on':'')+'" data-x="'+x+'">'+icon(i.tag.startsWith('person')?'user':i.tag.startsWith('case')?'layers':i.tag==='module'?'grid':'zap',14)+esc(i.t)+'<span class="tag">'+i.tag+'</span></div>').join('');
document.querySelectorAll('#pallist .pi').forEach(el=>el.onclick=()=>{closePal();f[+el.dataset.x].go()})};
let PAL_CUR=[];
inp.oninput=()=>{PAL_SEL=0;draw()};
inp.onkeydown=e=>{const f=PAL_CUR||[];
if(e.key==='ArrowDown'){e.preventDefault();PAL_SEL=Math.min(PAL_SEL+1,f.length-1);draw()}
if(e.key==='ArrowUp'){e.preventDefault();PAL_SEL=Math.max(PAL_SEL-1,0);draw()}
if(e.key==='Enter'&&f[PAL_SEL]){closePal();f[PAL_SEL].go()}
if(e.key==='Escape')closePal()};
draw();setTimeout(()=>inp.focus(),30)}
function closePal(){$('#pal').classList.remove('open')}
$('#pal').addEventListener('mousedown',e=>{if(e.target.id==='pal')closePal()});
/* ---------- BOOT: trust nothing, announce everything ---------- */
function renderRecovery(kind,ref){RECOVERY=true;
$('#rail').innerHTML='<div class="mark"><div class="lg">'+icon('warn',15)+'</div><div><b>LeadOS</b><span>recovery</span></div></div>';
$('#view').innerHTML='<div class="pagehead"><div><h1>Store needs a decision</h1><div class="sub">Recovery is a decision, not a boot side-effect. Nothing has been written over your data.</div></div></div>'+
(kind==='corrupt'?'<div class="card warn"><div class="ch">'+icon('warn')+' THE LIVE STORE IS CORRUPT</div>'+
'<div class="small">The bytes at <span class="mono">'+LSKEY+'</span> do not parse. They are preserved untouched, and a copy sits at <span class="mono">'+esc(ref)+'</span> for forensics. The app is running on a blank in-memory state that <b>will not be saved</b> until you decide.</div>'+
'<div class="row mt wrap"><button class="btn" id="rc-dl">'+icon('dl',14)+' Download the damaged copy</button><button class="btn dan" id="rc-clean">Start clean (keeps damaged key)</button><label class="btn sm" style="cursor:pointer">'+icon('ul',13)+' Import a backup<input type="file" id="rc-imp" accept="application/json,.json" style="display:none"></label></div></div>'
:'<div class="card warn"><div class="ch">'+icon('warn')+' NEWER RECORD (v:'+esc(ref)+')</div>'+
'<div class="small">This browser holds a store from a newer LeadOS than this file (v:'+RECV+'). A silent downgrade is refused. Load the newer file, or start clean — the original stays untouched meanwhile.</div>'+
'<div class="row mt"><button class="btn dan" id="rc-clean">Start clean (keeps original key)</button></div></div>');
const dl=$('#rc-dl');if(dl)dl.onclick=()=>{const raw=localStorage.getItem(ref)||'';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([raw],{type:'application/json'}));a.download='leados-damaged.json';a.click()};
const cl=$('#rc-clean');if(cl)cl.onclick=()=>{RECOVERY=false;S=guard(blank());log('recovery decision: start clean; damaged key preserved at '+ref);save();route()};
const im=$('#rc-imp');if(im)im.onchange=()=>{const file=im.files[0];const r=new FileReader();r.onload=()=>{const v=validateImport(r.result);
if(v.err){toast('Import refused: '+v.err,'err');return}
RECOVERY=false;S=v.o;log('recovery decision: imported backup over corrupt store');save();route()};r.readAsText(file)}}
function boot(){
try{const tt=runSelfTests();window.__TESTS=tt;const bad=tt.filter(t=>!t.ok);if(bad.length)console.warn('[LeadOS] SELF-TEST FAILURES:',bad)}catch(e){console.warn('[LeadOS] self-test harness failed:',e)}
const res=loadStore();
if(res.corrupt){S=guard(blank());renderRecovery('corrupt',res.corrupt);return}
if(res.newer){S=guard(blank());renderRecovery('newer',res.newer);return}
if(res.bootErr){S=guard(blank());toast(res.bootErr+' — running WITHOUT persistence (private mode?). Writes will fail visibly.','err')}
else if(res.state){S=res.state;log('boot ok — '+LSKEY+' record v:'+S.v+' · '+U.fmtB(storeBytes()))
if(S.log.some(l=>/migration/.test(l.t)&&l.at===today()))save()}
else{S=guard(blank());seed();save()}
ENG.sweep();
if(!location.hash)location.hash='#/today';
route()}
window.addEventListener('hashchange',route);
boot();
</script>
