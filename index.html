  @keyframes fadeIn{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

  [data-reduced-data="true"] .table-fallback{ display:block !important; }
  .table-fallback{ display:none; }
  [data-theme="dark"]{ color-scheme:dark; }

<script>
/* ============================================================================
   PROVENANCE — READ BEFORE TRUSTING ANY CLAIM ABOUT github.com/wbweve/Leados
   (full ledger duplicated in AI-SESSION-LOG.md and the in-app #/about route)

   - This sandbox had NO pre-existing index.html / README.md / AI-SESSION-LOG.md
     before this session (verified directly: three read attempts, three failures).
     There is no local "Part 1–6" build here to extend, so this file is an
     ORIGINAL, standalone implementation of the Part 7 (a11y) + Part 8 (workers)
     specs pasted into this session's prompt.

   - github.com/wbweve/Leados was inspected directly this session via the GitHub
     REST Contents API (base64 blob, decoded — not the HTML-render fetch path,
     which is documented upstream to silently strip <script> content):
       VERIFIED, this session, right now: the repo is real/public/actively
       committed; its main-branch index.html decodes to a genuine HTML/JS app
       (Tailwind CDN, inline <style>, div#app, LS_KEY='leados:events', title
       "LeadOS — Monte Carlo Decision Engine", a reseed button, "part 6" label)
       — i.e. a DIFFERENT app (Part 6, Monte Carlo) than what this file builds
       (Parts 7–8, accessibility + workers). It currently reports
       sha 162c0a7006a44ade2c5647ec3f370fc4cd801a88, size 36754 bytes.
     CONTRADICTED: that 36754-byte figure matches NEITHER of two earlier
       figures claimed elsewhere for "the same file" (56,046 bytes per an
       older README/in-file comment, and 47,831 bytes per a more recent one).
       The repo's commit history shows index.html overwritten by roughly ten
       "Add files via upload" commits within single short windows (e.g. a
       ~2.5h span on 2026-10-17), and the file's own commit log traces back to
       an even earlier "LeadCore application" rename (2026-10-11, unverified
       beyond the commit message text). The most defensible conclusion: this
       path is a frequently-overwritten moving target, and any single
       byte-count/sha claim about it is a snapshot valid only at the instant
       it was queried — not a stable fact about "the repo."
     Because the upstream file implements an unrelated app with no
     accessibility-profile or worker spec in it at all, there is nothing to
     copy, fork, port, or contradict from it for Parts 7–8 specifically; this
     build's a11y/worker code is 100% sourced from the spec pasted into THIS
     prompt.

   - Two gaps in the pasted Part 7/8 spec, disclosed before they're used below:
       1) LEADOS.a11y.apply() branches on highContrast/forcedColors,
          reducedData, and screenReader — but detect() also returns
          reducedMotion and darkMode, which apply() never does anything with.
          Shipping detected-but-never-applied flags seemed worse than a small,
          disclosed addition, so this build adds two extra branches (reduced
          motion → zeroes --dur-* vars; dark mode → sets data-theme) clearly
          marked "ADDED" in code, separate from the verbatim spec.
       2) applyCognitiveReduction() calls LEADOS.ui.densityManager.set(...),
          a module never defined anywhere in the spec. Rather than silently
          dropping the call or letting it throw, this build adds a minimal,
          disclosed LEADOS.ui.densityManager stub.
       3) "### Worker Performance Architecture" in the Part 8 spec is a
          heading followed by "Computation timing (all operations):" and
          nothing else — the same empty-heading pattern this project's own
          prior README flagged for a "Genome View" section and a "Monte Carlo
          Visualization" section. The timing-comparison UI under #/workers
          here is therefore ORIGINAL, not from the spec.
       4) The spec's worker runs from a separate file, 'js/worker-engine.js'.
          This task requires a single index.html, so the worker is instead
          built from an in-page string and loaded via Blob + createObjectURL.
          This is a packaging change only — the postMessage protocol, the
          "pure functions only, no DOM/localStorage" rule, and the id-based
          promise matching are all implemented exactly as specified.
       5) The worker's method switch references 'correlate', 'search.buildIndex',
          and 'synthesis.generate' — none of those modules (LEADOS.correlate /
          LEADOS.search / LEADOS.synthesis) were specified in any part given to
          this session. Rather than fabricate them, both the worker and the
          main-thread fallback return a structured
          { notImplemented:true, reason:'...' } object for those methods. They
          are NOT wired into any button in the UI, to avoid implying they work.
       6) The Part 7/8 spec assumes a pre-existing "144 rules" engine and an
          events/decisions schema from earlier parts not given to this session.
          Since there is no local prior build, this file reconstructs a small,
          ORIGINAL decision+scenario event schema (named/shaped the same way
          the Part-6 README, read this session, describes it) and an
          ORIGINAL, clearly small (7-rule, not 144-rule) illustrative engine,
          so LEADOS.workers has real work to offload. Labeled accordingly
          everywhere in-app (#/about) rather than presented as "the" 144 rules.
   ============================================================================ */

(function(){
  "use strict";

  const LS_KEY = 'leados:a11y-worker-events'; // original to this build — see note #6 above

  // ---------------------------------------------------------------------
  // Minimal event log (original schema — reconstructed shape, not copied)
  // ---------------------------------------------------------------------
  function loadEvents(){
    try { return JSON.parse(localStorage.getItem(LS_KEY)) || []; }
    catch(e){ return []; }
  }
  function saveEvents(events){ localStorage.setItem(LS_KEY, JSON.stringify(events)); }
  function uid(){ return Math.random().toString(36).slice(2,10); }
  function todayISO(){ return new Date().toISOString().slice(0,10); }
  function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }

  function seedDemo(){
    const t = todayISO();
    const mk = (daysAgo)=>{ const d=new Date(); d.setDate(d.getDate()-daysAgo); return d.toISOString().slice(0,10); };
    const events = [
      { id: uid(), type:'decision.logged', at: mk(34), title:'APAC market expansion',
        breakeven: 150000,
        scenarios: [
          { name:'Strong uptake', probability:0.35, outcome_value: 420000, cost_if_true: 180000 },
          { name:'Moderate uptake', probability:0.45, outcome_value: 210000, cost_if_true: 180000 },
          { name:'Weak uptake', probability:0.20, outcome_value: 60000,  cost_if_true: 180000 }
        ]
      },
      { id: uid(), type:'decision.logged', at: mk(9), title:'Hire VP of Sales',
        breakeven: null,
        scenarios: [
          { name:'Hits plan', probability:0.3, outcome_value: 500000, cost_if_true: 260000 }
        ]
      },
      { id: uid(), type:'decision.logged', at: mk(2), title:'Switch infrastructure vendor',
        breakeven: 0,
        scenarios: [
          { name:'Smooth migration', probability:0.5, outcome_value: 90000, cost_if_true: 40000 },
          { name:'Rocky migration',  probability:0.5, outcome_value: -20000, cost_if_true: 40000 }
        ]
      }
    ];
    saveEvents(events);
    return events;
  }

  // ---------------------------------------------------------------------
  // LEADOS namespace
  // ---------------------------------------------------------------------
  const LEADOS = window.LEADOS = {};

  LEADOS.events = {
    project(state){
      const events = (state && state.events) || [];
      const decisionById = {};
      events.filter(e=>e.type==='decision.logged').forEach(e=>{ decisionById[e.id] = Object.assign({}, e, {resolved:false}); });
      events.filter(e=>e.type==='decision.resolved').forEach(e=>{
        if (decisionById[e.decisionId]) decisionById[e.decisionId].resolved = true;
      });
      const allDecisions = Object.values(decisionById).sort((a,b)=> new Date(b.at)-new Date(a.at));
      return {
        allDecisions,
        openDecisions: allDecisions.filter(d=>!d.resolved),
        closedDecisions: allDecisions.filter(d=>d.resolved),
        decisionById,
        state: { events }
      };
    }
  };

  // ---------------------------------------------------------------------
  // LEADOS.monteCarlo — RECONSTRUCTED to match this session's reading of the
  // upstream Part-6 README's description (seeded Mulberry32 PRNG, ±20% noise
  // per iteration, percentile/histogram/interpretation output, optional
  // breakeven probability). No Part-6 source file existed in this sandbox to
  // copy from — this is original code written to satisfy that description,
  // not a verbatim carry-over. Not financial modeling or actuarial science.
  // ---------------------------------------------------------------------
  LEADOS.monteCarlo = {
    _prng(seed){
      let a = seed >>> 0;
      return function(){
        a |= 0; a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    },
    simulate(scenarios, iterations=1000, seed=42, breakeven=null){
      if (!scenarios || !scenarios.length) {
        return { error: 'No scenarios supplied' };
      }
      const rand = this._prng(seed);
      const outcomes = [];
      const totalProb = scenarios.reduce((s,x)=>s+x.probability,0) || 1;
      for (let i=0;i<iterations;i++){
        const r = rand() * totalProb;
        let cum = 0, chosen = scenarios[scenarios.length-1];
        for (const s of scenarios){ cum += s.probability; if (r <= cum){ chosen = s; break; } }
        const noise = 1 + (rand()*0.4 - 0.2); // ±20% noise — disclosed assumption
        const value = (chosen.outcome_value - (chosen.cost_if_true||0)) * noise;
        outcomes.push(value);
      }
      outcomes.sort((a,b)=>a-b);
      const n = outcomes.length;
      const mean = outcomes.reduce((a,b)=>a+b,0)/n;
      const variance = outcomes.reduce((a,b)=>a+Math.pow(b-mean,2),0)/n;
      const std = Math.sqrt(variance);
      const pct = p => outcomes[Math.min(n-1, Math.max(0, Math.floor(p*n)))];
      const probPositive = outcomes.filter(v=>v>0).length/n;
      const probAboveBreakeven = (breakeven===null || breakeven===undefined) ? null
        : outcomes.filter(v=>v>breakeven).length/n;
      const result = {
        n, mean, median: pct(0.5), std,
        worst: outcomes[0], p10: pct(0.10), p25: pct(0.25), p75: pct(0.75), p90: pct(0.90), best: outcomes[n-1],
        probPositive, probAboveBreakeven,
        histogram: this._buildHistogram(outcomes),
        seed, iterations
      };
      result.interpretation = this._interpret(result);
      result.label = 'Sensitivity simulation driven entirely by your own probability estimates — not a financial forecast or actuarial model.';
      return result;
    },
    _buildHistogram(outcomes, buckets=10){
      const min = outcomes[0], max = outcomes[outcomes.length-1];
      const span = (max-min) || 1;
      const counts = new Array(buckets).fill(0);
      outcomes.forEach(v=>{
        let idx = Math.floor(((v-min)/span)*buckets);
        if (idx>=buckets) idx = buckets-1;
        if (idx<0) idx = 0;
        counts[idx]++;
      });
      return counts.map((c,i)=>({ from: min+ (span*i/buckets), to: min+(span*(i+1)/buckets), count:c }));
    },
    _interpret(r){
      if (r.probPositive >= 0.8) return 'Most simulated outcomes are positive — this decision looks favorable under your stated scenarios.';
      if (r.probPositive <= 0.2) return 'Most simulated outcomes are negative — revisit assumptions before committing.';
      return 'Outcomes are mixed; the spread between P10 and P90 suggests real uncertainty worth narrowing before committing.';
    }
  };

  // ---------------------------------------------------------------------
  // LEADOS.engine — ORIGINAL, illustrative 7-rule subset (NOT the "144
  // rules" referenced by the Part 7/8 spec — those were never supplied to
  // this session). Exists only so LEADOS.workers has real work to offload.
  // ---------------------------------------------------------------------
  LEADOS.engine = {
    rules: [
      { id:'STALE_DECISION', domain:'decisions', severity:2,
        test:(d,today)=> daysBetween(d.at,today) > 21,
        title:(d)=>`"${d.title}" has been open ${daysBetween(d.at, todayISO())} days without resolution` },
      { id:'LOW_CONFIDENCE', domain:'decisions', severity:1,
        test:(d)=> Math.max(...d.scenarios.map(s=>s.probability)) < 0.4,
        title:(d)=>`"${d.title}" has no dominant scenario (top probability < 40%)` },
      { id:'NEGATIVE_EXPECTED_VALUE', domain:'decisions', severity:3,
        test:(d)=> d.scenarios.reduce((s,x)=>s + x.probability*(x.outcome_value-(x.cost_if_true||0)),0) < 0,
        title:(d)=>`"${d.title}" has a negative probability-weighted expected value` },
      { id:'WIDE_SPREAD', domain:'decisions', severity:2,
        test:(d)=>{
          const vals = d.scenarios.map(s=>s.outcome_value-(s.cost_if_true||0));
          const spread = Math.max(...vals)-Math.min(...vals);
          const meanAbs = Math.abs(vals.reduce((a,b)=>a+b,0)/vals.length)||1;
          return spread > meanAbs*3;
        },
        title:(d)=>`"${d.title}" has a very wide outcome spread across scenarios` },
      { id:'PROB_SUM_OFF', domain:'data', severity:3,
        test:(d)=> Math.abs(d.scenarios.reduce((s,x)=>s+x.probability,0) - 1) > 0.02,
        title:(d)=>`"${d.title}"'s scenario probabilities do not sum to 100%` },
      { id:'SINGLE_SCENARIO', domain:'decisions', severity:1,
        test:(d)=> d.scenarios.length <= 1,
        title:(d)=>`"${d.title}" has only one scenario logged — consider adding alternatives` },
      { id:'NO_BREAKEVEN', domain:'decisions', severity:1,
        test:(d)=> d.breakeven===null || d.breakeven===undefined,
        title:(d)=>`"${d.title}" has no breakeven value set` }
    ],
    run(P, today){
      const findings = [];
      P.openDecisions.forEach(d=>{
        this.rules.forEach(rule=>{
          try{
            if (rule.test(d, today)) {
              findings.push({ id: uid(), ruleId: rule.id, decisionId: d.id, domain: rule.domain,
                               severity: rule.severity, title: rule.title(d) });
            }
          } catch(e){ /* a malformed decision shouldn't crash the whole engine run */ }
        });
      });
      return findings;
    }
  };

  // ---------------------------------------------------------------------
  // LEADOS.ui.densityManager — minimal disclosed stub (see provenance note #2)
  // ---------------------------------------------------------------------
  LEADOS.ui = {
    densityManager: {
      _level: 'COMPACT',
      set(level){ this._level = level; document.documentElement.setAttribute('data-density', level.toLowerCase()); }
    }
  };

  // ---------------------------------------------------------------------
  // LEADOS.a11y — implemented from the Part 7 spec. Verbatim sections are
  // marked; the two additions (reducedMotion/darkMode handling) are marked
  // "ADDED" per provenance note #1.
  // ---------------------------------------------------------------------
  LEADOS.a11y = {
    _screenReaderDetected: false,

    detect(){
      return {
        reducedMotion: window.matchMedia('(prefers-reduced-motion: reduce)').matches,
        highContrast: window.matchMedia('(prefers-contrast: more)').matches,
        forcedColors: window.matchMedia('(forced-colors: active)').matches,
        darkMode: window.matchMedia('(prefers-color-scheme: dark)').matches,
        reducedData: window.matchMedia('(prefers-reduced-data: reduce)').matches,
        screenReader: this._screenReaderDetected || null
      };
    },

    apply(profile){
      if (profile.highContrast || profile.forcedColors) {
        document.documentElement.style.setProperty('--border-width', '2px');
        document.documentElement.setAttribute('data-high-contrast', 'true');
      } else {
        document.documentElement.style.removeProperty('--border-width');
        document.documentElement.removeAttribute('data-high-contrast');
      }

      if (profile.reducedData) {
        document.documentElement.setAttribute('data-reduced-data', 'true');
      } else {
        document.documentElement.removeAttribute('data-reduced-data');
      }

      if (profile.screenReader) {
        document.documentElement.setAttribute('data-screen-reader', 'true');
        this._setupLiveRegions();
      } else {
        document.documentElement.removeAttribute('data-screen-reader');
      }

      // ADDED — not in the pasted spec's apply(), see provenance note #1
      if (profile.reducedMotion) {
        document.documentElement.style.setProperty('--dur-fast','0ms');
        document.documentElement.style.setProperty('--dur-normal','0ms');
        document.documentElement.style.setProperty('--dur-slow','0ms');
      } else if (!document.documentElement.hasAttribute('data-cognitive-reduction')) {
        document.documentElement.style.removeProperty('--dur-fast');
        document.documentElement.style.removeProperty('--dur-normal');
        document.documentElement.style.removeProperty('--dur-slow');
      }
      document.documentElement.setAttribute('data-theme', profile.darkMode ? 'dark' : 'light'); // ADDED
    },

    _liveRegions: {},
    _setupLiveRegions(){
      if (!document.getElementById('ar-polite')) {
        const polite = document.createElement('div');
        polite.id = 'ar-polite';
        polite.setAttribute('role','status');
        polite.setAttribute('aria-live','polite');
        polite.setAttribute('aria-atomic','false');
        polite.className = 'sr-only';
        document.body.appendChild(polite);
        this._liveRegions.polite = polite;
      }
      if (!document.getElementById('ar-assertive')) {
        const assertive = document.createElement('div');
        assertive.id = 'ar-assertive';
        assertive.setAttribute('role','alert');
        assertive.setAttribute('aria-live','assertive');
        assertive.setAttribute('aria-atomic','true');
        assertive.className = 'sr-only';
        document.body.appendChild(assertive);
        this._liveRegions.assertive = assertive;
      }
    },

    announce(message, priority='polite'){
      this._setupLiveRegions(); // ADDED guard: spec only builds regions when screenReader=true;
                                 // this build also lets the manual demo buttons work pre-detection.
      const region = this._liveRegions[priority];
      if (!region) return;
      region.textContent = '';
      requestAnimationFrame(()=>{
        region.textContent = message;
      });
      window.dispatchEvent(new CustomEvent('leados:announce', { detail:{ message, priority, at: Date.now() } })); // ADDED, for the sighted live-region mirror
    },

    applyDyslexiaFriendly(){
      document.documentElement.style.setProperty('--letter-spacing-body','0.05em');
      document.documentElement.style.setProperty('--line-height-body','1.8');
      document.documentElement.style.setProperty('--word-spacing','0.1em');
      document.documentElement.style.setProperty('--font-body','Arial, Helvetica, "Liberation Sans", sans-serif');
      document.documentElement.style.setProperty('--text-align','left');
    },

    applyCognitiveReduction(){
      document.documentElement.setAttribute('data-cognitive-reduction','true');
      document.documentElement.style.setProperty('--dur-fast','0ms');
      document.documentElement.style.setProperty('--dur-normal','0ms');
      document.documentElement.style.setProperty('--dur-slow','0ms');
      LEADOS.ui.densityManager.set('COMFORTABLE');
      document.documentElement.setAttribute('data-monochrome-domains','true');
      document.documentElement.setAttribute('data-hide-nudges','true');
      document.documentElement.style.setProperty('--btn-padding','10px 20px');
    },

    reset(){
      document.documentElement.removeAttribute('data-cognitive-reduction');
      document.documentElement.removeAttribute('data-monochrome-domains');
      document.documentElement.removeAttribute('data-hide-nudges');
      ['--border-width','--letter-spacing-body','--line-height-body','--word-spacing','--font-body',
       '--text-align','--dur-fast','--dur-normal','--dur-slow','--btn-padding'].forEach(p=>{
        document.documentElement.style.removeProperty(p);
      });
      document.documentElement.removeAttribute('data-high-contrast');
      document.documentElement.removeAttribute('data-reduced-data');
      document.documentElement.removeAttribute('data-screen-reader');
    }
  };

  // ---------------------------------------------------------------------
  // LEADOS.focus — implemented verbatim from the Part 7 spec.
  // ---------------------------------------------------------------------
  LEADOS.focus = {
    _history: [],
    _traps: [],

    moveTo(element, { record = true, scroll = true } = {}){
      if (!element || !element.focus) return;
      if (record && document.activeElement) this._history.push(document.activeElement);
      element.focus({ preventScroll: !scroll });
      if (LEADOS.a11y._liveRegions.polite) {
        const label = element.getAttribute('aria-label') ||
          (element.getAttribute('aria-labelledby') && document.getElementById(element.getAttribute('aria-labelledby'))?.textContent) ||
          element.textContent?.trim().slice(0,50);
        if (label) LEADOS.a11y.announce(`Focused: ${label}`);
      }
    },

    returnToPrevious(){
      const prev = this._history.pop();
      if (prev && document.contains(prev)) prev.focus({ preventScroll:false });
      else this._focusFirstFocusable(document.querySelector('#main'));
    },

    trap(container){
      const focusable = this._getFocusable(container);
      if (!focusable.length) return;
      const first = focusable[0], last = focusable[focusable.length-1];
      const handler = (e)=>{
        if (e.key !== 'Tab') return;
        if (e.shiftKey) { if (document.activeElement===first){ last.focus(); e.preventDefault(); } }
        else { if (document.activeElement===last){ first.focus(); e.preventDefault(); } }
      };
      container.addEventListener('keydown', handler);
      first.focus();
      const trap = { container, handler, release: ()=>{
        container.removeEventListener('keydown', handler);
        this._traps = this._traps.filter(t=>t!==trap);
      }};
      this._traps.push(trap);
      return trap;
    },

    _getFocusable(container){
      return [...container.querySelectorAll(
        'a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'
      )].filter(el=>!el.closest('[aria-hidden="true"]') && !el.closest('[hidden]'));
    },

    _focusFirstFocusable(container){
      const first = this._getFocusable(container || document.body)[0];
      if (first) first.focus();
    }
  };

  // ---------------------------------------------------------------------
  // LEADOS.workers — adapted from the Part 8 spec. Packaging change only:
  // the worker body is inlined via Blob instead of 'js/worker-engine.js'
  // (single-file delivery constraint — see provenance note #4). Protocol,
  // timeout/fallback behavior, and the pure-function-copy rule are intact.
  // ---------------------------------------------------------------------
  const WORKER_SRC = `
self.onmessage = function(e){
  var data = e.data, id = data.id, method = data.method, payload = data.payload;
  try {
    var result;
    if (method === 'project') {
      result = project(payload.state);
    } else if (method === 'engine.run') {
      var P = project(payload.state);
      result = engineRun(P, payload.today);
    } else if (method === 'montecarlo') {
      result = monteCarlo(payload.scenarios, payload.iterations, payload.seed, payload.breakeven);
    } else if (method === 'search.buildIndex' || method === 'temporal.profile' || method === 'synthesis.generate' || method === 'correlate') {
      result = { notImplemented: true, reason: 'No spec for ' + method + ' was supplied to this session (see AI-SESSION-LOG.md).' };
    } else {
      result = { notImplemented: true, reason: 'Unknown method: ' + method };
    }
    self.postMessage({ id: id, result: result, error: null });
  } catch (err) {
    self.postMessage({ id: id, result: null, error: err.message });
  }

function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }

function project(state){
  var events = (state && state.events) || [];
  var decisionById = {};
  events.filter(function(e){return e.type==='decision.logged';}).forEach(function(e){
    decisionById[e.id] = Object.assign({}, e, {resolved:false});
  });
  events.filter(function(e){return e.type==='decision.resolved';}).forEach(function(e){
    if (decisionById[e.decisionId]) decisionById[e.decisionId].resolved = true;
  });
  var allDecisions = Object.values(decisionById).sort(function(a,b){ return new Date(b.at)-new Date(a.at); });
  return {
    allDecisions: allDecisions,
    openDecisions: allDecisions.filter(function(d){return !d.resolved;}),
    closedDecisions: allDecisions.filter(function(d){return d.resolved;}),
    decisionById: decisionById,
    state: { events: events }
  };
}

function mulberry32(seed){
  var a = seed >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function buildHistogram(outcomes, buckets){
  buckets = buckets || 10;
  var min = outcomes[0], max = outcomes[outcomes.length-1];
  var span = (max-min) || 1;
  var counts = new Array(buckets).fill(0);
  outcomes.forEach(function(v){
    var idx = Math.floor(((v-min)/span)*buckets);
    if (idx>=buckets) idx = buckets-1;
    if (idx<0) idx = 0;
    counts[idx]++;
  });
  return counts.map(function(c,i){ return { from: min+(span*i/buckets), to: min+(span*(i+1)/buckets), count:c }; });
}

function interpretMC(r){
  if (r.probPositive >= 0.8) return 'Most simulated outcomes are positive — this decision looks favorable under your stated scenarios.';
  if (r.probPositive <= 0.2) return 'Most simulated outcomes are negative — revisit assumptions before committing.';
  return 'Outcomes are mixed; the spread between P10 and P90 suggests real uncertainty worth narrowing before committing.';
}

function monteCarlo(scenarios, iterations, seed, breakeven){
  iterations = iterations || 1000; seed = (seed===undefined?42:seed);
  if (!scenarios || !scenarios.length) return { error: 'No scenarios supplied' };
  var rand = mulberry32(seed);
  var outcomes = [];
  var totalProb = scenarios.reduce(function(s,x){return s+x.probability;},0) || 1;
  for (var i=0;i<iterations;i++){
    var r = rand() * totalProb;
    var cum = 0, chosen = scenarios[scenarios.length-1];
    for (var j=0;j<scenarios.length;j++){ cum += scenarios[j].probability; if (r <= cum){ chosen = scenarios[j]; break; } }
    var noise = 1 + (rand()*0.4 - 0.2);
    outcomes.push((chosen.outcome_value - (chosen.cost_if_true||0)) * noise);
  }
  outcomes.sort(function(a,b){return a-b;});
  var n = outcomes.length;
  var mean = outcomes.reduce(function(a,b){return a+b;},0)/n;
  var variance = outcomes.reduce(function(a,b){return a+Math.pow(b-mean,2);},0)/n;
  var std = Math.sqrt(variance);
  function pct(p){ return outcomes[Math.min(n-1, Math.max(0, Math.floor(p*n)))]; }
  var probPositive = outcomes.filter(function(v){return v>0;}).length/n;
  var probAboveBreakeven = (breakeven===null||breakeven===undefined) ? null : outcomes.filter(function(v){return v>breakeven;}).length/n;
  var result = {
    n: n, mean: mean, median: pct(0.5), std: std,
    worst: outcomes[0], p10: pct(0.10), p25: pct(0.25), p75: pct(0.75), p90: pct(0.90), best: outcomes[n-1],
    probPositive: probPositive, probAboveBreakeven: probAboveBreakeven,
    histogram: buildHistogram(outcomes), seed: seed, iterations: iterations
  };
  result.interpretation = interpretMC(result);
  result.label = 'Sensitivity simulation driven entirely by your own probability estimates — not a financial forecast or actuarial model.';
  return result;
}

var RULES = [
  { id:'STALE_DECISION', domain:'decisions', severity:2, test:function(d,today){ return daysBetween(d.at,today) > 21; },
    title:function(d,today){ return '"'+d.title+'" has been open '+daysBetween(d.at,today)+' days without resolution'; } },
  { id:'LOW_CONFIDENCE', domain:'decisions', severity:1, test:function(d){ return Math.max.apply(null,d.scenarios.map(function(s){return s.probability;})) < 0.4; },
    title:function(d){ return '"'+d.title+'" has no dominant scenario (top probability < 40%)'; } },
  { id:'NEGATIVE_EXPECTED_VALUE', domain:'decisions', severity:3,
    test:function(d){ return d.scenarios.reduce(function(s,x){ return s + x.probability*(x.outcome_value-(x.cost_if_true||0)); },0) < 0; },
    title:function(d){ return '"'+d.title+'" has a negative probability-weighted expected value'; } },
  { id:'WIDE_SPREAD', domain:'decisions', severity:2,
    test:function(d){
      var vals = d.scenarios.map(function(s){ return s.outcome_value-(s.cost_if_true||0); });
      var spread = Math.max.apply(null,vals)-Math.min.apply(null,vals);
      var meanAbs = Math.abs(vals.reduce(function(a,b){return a+b;},0)/vals.length)||1;
      return spread > meanAbs*3;
    },
    title:function(d){ return '"'+d.title+'" has a very wide outcome spread across scenarios'; } },
  { id:'PROB_SUM_OFF', domain:'data', severity:3,
    test:function(d){ return Math.abs(d.scenarios.reduce(function(s,x){return s+x.probability;},0) - 1) > 0.02; },
    title:function(d){ return '"'+d.title+'"\\'s scenario probabilities do not sum to 100%'; } },
  { id:'SINGLE_SCENARIO', domain:'decisions', severity:1, test:function(d){ return d.scenarios.length <= 1; },
    title:function(d){ return '"'+d.title+'" has only one scenario logged — consider adding alternatives'; } },
  { id:'NO_BREAKEVEN', domain:'decisions', severity:1, test:function(d){ return d.breakeven===null || d.breakeven===undefined; },
    title:function(d){ return '"'+d.title+'" has no breakeven value set'; } }
];

function engineRun(P, today){
  var findings = [];
  P.openDecisions.forEach(function(d){
    RULES.forEach(function(rule){
      try{
        if (rule.test(d, today)) {
          findings.push({ id: Math.random().toString(36).slice(2,10), ruleId: rule.id, decisionId: d.id,
                           domain: rule.domain, severity: rule.severity, title: rule.title(d, today) });
        }
      } catch(e){}
    });
  });
  return findings;
}

    _worker: null,
    _pending: new Map(),
    _idCounter: 0,
    _blobUrl: null,

    init(){
      if (!window.Worker) { this._worker = null; return; }
      try {
        const blob = new Blob([WORKER_SRC], { type:'application/javascript' });
        this._blobUrl = URL.createObjectURL(blob);
        this._worker = new Worker(this._blobUrl);
        this._worker.onmessage = (e)=>{
          const { id, result, error } = e.data;
          const entry = this._pending.get(id);
          if (!entry) return;
          this._pending.delete(id);
          if (error) entry.reject(new Error(error));
          else entry.resolve(result);
        };
        this._worker.onerror = ()=>{ /* leave pending to time out and fall back */ };
      } catch(e){ this._worker = null; }
    },

    terminate(){
      if (this._worker) { this._worker.terminate(); this._worker = null; }
      if (this._blobUrl) { URL.revokeObjectURL(this._blobUrl); this._blobUrl = null; }
    },

    async compute(method, payload, mainThreadFallback){
      if (!this._worker) return { usedWorker:false, result: mainThreadFallback() };
      const id = ++this._idCounter;
      return new Promise((resolve)=>{
        this._pending.set(id, {
          resolve: (result)=> resolve({ usedWorker:true, result }),
          reject: ()=> resolve({ usedWorker:false, result: mainThreadFallback() })
        });
        const timeout = setTimeout(()=>{
          if (this._pending.has(id)) {
            this._pending.delete(id);
            resolve({ usedWorker:false, result: mainThreadFallback(), timedOut:true });

        }, 5000);
        this._worker.postMessage({ id, method, payload });

  function viewAccessibility(){
    const profile = LEADOS.a11y.detect();
    const row = (k,v)=>`<tr class="border-t border-slate-100"><td class="py-1.5 pr-4 text-slate-500">${k}</td><td class="py-1.5 mono">${v===null?'unknown':String(v)}</td></tr>`;
    return `
      <div class="fade-in space-y-6">
        <div class="card bg-white rounded-xl p-4">
          <div class="font-semibold mb-2">Auto-detected profile (live, OS/browser media queries)</div>
          <table class="text-sm w-full max-w-md">
            ${row('reducedMotion', profile.reducedMotion)}
            ${row('highContrast', profile.highContrast)}
            ${row('forcedColors', profile.forcedColors)}
            ${row('darkMode', profile.darkMode)}
            ${row('reducedData', profile.reducedData)}
            ${row('screenReader (self-reported — see disclosure)', profile.screenReader)}
          </table>
          <label class="flex items-center gap-2 text-sm mt-3">
            <input type="checkbox" id="srSelfReport"> I use a screen reader (manual, since reliable JS auto-detection isn't possible)
          </label>
        </div>

        <div class="card bg-white rounded-xl p-4 space-y-2">
          <div class="font-semibold mb-1">Manual accessibility modes</div>
          <div class="flex flex-wrap gap-2">
            <button id="btnDyslexia" class="btn tap-shrink bg-slate-900 text-white rounded-lg text-xs">Apply dyslexia-friendly mode</button>
            <button id="btnCognitive" class="btn tap-shrink bg-slate-900 text-white rounded-lg text-xs">Apply cognitive-reduction mode</button>
            <button id="btnResetA11y" class="btn tap-shrink bg-slate-100 rounded-lg text-xs">Reset to defaults</button>
          </div>
          <p class="text-xs text-slate-400">Dyslexia-friendly and cognitive-reduction are manual-only per spec — "too complex and personal to infer."</p>
        </div>

        <div class="card bg-white rounded-xl p-4 space-y-2">
          <div class="font-semibold mb-1">Live region / announcer test</div>
          <div class="flex gap-2">
            <button id="btnAnnouncePolite" class="btn tap-shrink bg-slate-100 rounded-lg text-xs">Announce (polite)</button>
            <button id="btnAnnounceAssertive" class="btn tap-shrink bg-rose-100 text-rose-800 rounded-lg text-xs">Announce (assertive)</button>
            <label class="flex items-center gap-1 text-xs text-slate-500"><input type="checkbox" id="toggleLiveDebug"> show sighted mirror</label>
          </div>
        </div>

        <div class="card bg-white rounded-xl p-4 space-y-2">
          <div class="font-semibold mb-1">Focus management demo</div>
          <button id="btnOpenModal" class="btn tap-shrink bg-slate-900 text-white rounded-lg text-xs">Open focus-trapped modal</button>
        </div>
      </div>

      <div id="modalRoot"></div>`;
  }

  function viewWorkers(logEntries){
    const rows = logEntries.slice().reverse().map(e=>`
      <tr class="border-t border-slate-100">
        <td class="py-1.5 pr-3 mono text-xs">${e.method}</td>
        <td class="py-1.5 pr-3 text-xs">${e.usedWorker?'<span class="text-emerald-700">worker</span>':'<span class="text-amber-700">fallback</span>'}${e.timedOut?' (timeout)':''}</td>
        <td class="py-1.5 mono text-xs">${e.ms.toFixed(1)}ms</td>
      </tr>`).join('');
    return `
      <div class="fade-in space-y-6">
        <div class="disclosure rounded-lg p-4 text-sm">
          The "Worker Performance Architecture" sub-heading in the pasted Part 8 spec had no body (same empty-heading
          pattern noted elsewhere in this project's history) — this timing table is original.
        </div>
        <div class="card bg-white rounded-xl p-4 flex items-center justify-between">
          <div>
            <div class="font-semibold">Worker status</div>
            <div class="text-sm text-slate-500 mono">${LEADOS.workers._worker ? 'active' : 'not running (main-thread fallback mode)'}</div>
          </div>
          <div class="flex gap-2">
            <button id="btnTerminateWorker" class="btn tap-shrink bg-slate-100 rounded-lg text-xs">Terminate (simulate failure)</button>
            <button id="btnRestartWorker" class="btn tap-shrink bg-slate-900 text-white rounded-lg text-xs">(Re)start worker</button>
          </div>
        </div>
        <div class="card bg-white rounded-xl p-4">
          <div class="font-semibold mb-2">Not implemented (disclosed, not wired to UI)</div>
          <p class="text-sm text-slate-500">correlate · search.buildIndex · temporal.profile · synthesis.generate — no spec was
          supplied for these in the parts given to this session. The worker returns a structured
          <code class="mono">{notImplemented:true, reason}</code> for them rather than throwing or fabricating output.</p>
        </div>
        <div class="card bg-white rounded-xl p-4">
          <div class="font-semibold mb-2">Computation log</div>
          <table class="w-full text-sm">
            <thead><tr class="text-left text-xs text-slate-400"><th class="pb-2">method</th><th class="pb-2">path</th><th class="pb-2">time</th></tr></thead>
            <tbody>${rows || `<tr><td class="py-3 text-slate-400" colspan="3">Run a Monte Carlo or engine computation to populate this log.</td></tr>`}</tbody>
          </table>
        </div>
      </div>`;
  }

  function viewLog(events){
    return `
      <div class="fade-in space-y-4">
        <div class="flex gap-2">
          <button id="exportBtn" class="btn tap-shrink bg-slate-100 rounded-lg text-xs">Export JSON</button>
        </div>
        <pre class="card bg-white rounded-xl p-4 text-xs overflow-auto max-h-[70vh]">${JSON.stringify(events,null,2).replace(/</g,'&lt;')}</pre>
      </div>`;
  }

  function viewAbout(){
    return `
      <div class="fade-in space-y-4 text-sm leading-relaxed">
        <div class="verified rounded-lg p-4">
          <b>Verified, directly, this session:</b> github.com/wbweve/Leados is real, public, and actively committed
          (traced back through "Add files via upload" / "Update index.html" / rename-from-"LeadCore" commits).
          Its current main-branch <code>index.html</code> (queried via the GitHub Contents API, base64-decoded)
          is a genuine, different app — "LeadOS — Monte Carlo Decision Engine" (Part 6), LS_KEY
          <code>leados:events</code> — currently sha <code>162c0a7006a44ade2c5647ec3f370fc4cd801a88</code>, 36754 bytes.
        </div>
        <div class="contradicted rounded-lg p-4">
          <b>Contradicted this session:</b> that 36754-byte figure matches neither of two earlier figures claimed
          elsewhere for "the same file" (56,046 and 47,831 bytes). Given ~10 same-day overwrite commits in the repo's
          history, the most defensible read is that this path is a frequently-overwritten moving target — any single
          byte-count/sha claim about it is a snapshot valid only at query time, not a stable fact. This was not
          resolved further (not every intermediate commit was diffed).
        </div>
        <div class="disclosed rounded-lg p-4">
          <b>Original / disclosed in this build:</b> the event + decision/scenario schema, demo seed data, all UI,
          the 7-rule illustrative engine (not "144 rules" — never supplied), the Monte Carlo functions
          (reconstructed from this session's reading of the upstream README's description, not copied — no Part 6
          source existed locally), the Blob-based worker packaging, the two added LEADOS.a11y branches
          (reducedMotion, darkMode), and the LEADOS.ui.densityManager stub. LEADOS.a11y and LEADOS.focus are
          implemented verbatim from the spec pasted into this session's prompt; LEADOS.workers is adapted only in
          how the worker file is packaged (Blob vs. external file).
        </div>
        <div>This sandbox had <b>no pre-existing files</b> before this session (verified: three failed reads of
        index.html / README.md / AI-SESSION-LOG.md). Full ledger in AI-SESSION-LOG.md.</div>
      </div>`;
  }

  // ---------------------------------------------------------------------
  // Wiring
  // ---------------------------------------------------------------------
  let workerLog = [];
  let lastFindings = [], lastFindingsTiming = null;

  async function timed(promiseFn){
    const t0 = performance.now();
    const out = await promiseFn();
    const ms = performance.now() - t0;
    return Object.assign({}, out, { ms });
  }

  function currentState(){ return { events: loadEvents() }; }

  function router(){
    renderNav();
    const hash = location.hash || '#/today';
    const titleEl = document.getElementById('routeTitle');
    const view = document.getElementById('main');
    const state = currentState();
    const P = LEADOS.events.project(state);
    document.getElementById('eventCountTag').textContent = state.events.length;
    document.getElementById('workerStatusTag').textContent = LEADOS.workers._worker ? 'running' : 'fallback';

    if (hash === '#/today') { titleEl.textContent='Today'; view.innerHTML = viewToday(P); }
    else if (hash === '#/decisions') { titleEl.textContent='Decisions'; view.innerHTML = viewDecisions(P); wireDecisions(); }
    else if (hash === '#/findings') { titleEl.textContent='Findings'; view.innerHTML = viewFindings(P, lastFindings, lastFindingsTiming); wireFindings(); }
    else if (hash === '#/accessibility') { titleEl.textContent='Accessibility'; view.innerHTML = viewAccessibility(); wireAccessibility(); }
    else if (hash === '#/workers') { titleEl.textContent='Worker diagnostics'; view.innerHTML = viewWorkers(workerLog); wireWorkersView(); }
    else if (hash === '#/log') { titleEl.textContent='Event log'; view.innerHTML = viewLog(state.events); wireLog(state); }
    else if (hash === '#/about') { titleEl.textContent='Provenance / About'; view.innerHTML = viewAbout(); }
    else { titleEl.textContent='Not found'; view.innerHTML = '<div class="p-6 text-slate-400">Unknown route.</div>'; }
  }

  function wireDecisions(){
    document.getElementById('addScenario').onclick = ()=>{
      const container = document.getElementById('scenarioRows');
      const idx = container.children.length;
      container.insertAdjacentHTML('beforeend', scenarioRowsHtml(idx));
    };
    document.getElementById('logDecision').onclick = ()=>{
      const title = document.getElementById('newTitle').value.trim();
      if (!title) { toast('Enter a title first'); return; }
      const breakevenRaw = document.getElementById('newBreakeven').value;
      const scenarios = [...document.querySelectorAll('.scenario-row')].map(row=>({
        name: row.querySelector('.s-name').value || 'Scenario',
        probability: parseFloat(row.querySelector('.s-prob').value)||0,
        outcome_value: parseFloat(row.querySelector('.s-outcome').value)||0,
        cost_if_true: parseFloat(row.querySelector('.s-cost').value)||0
      }));
      const events = loadEvents();
      events.push({ id: uid(), type:'decision.logged', at: todayISO(), title,
                    breakeven: breakevenRaw===''?null:parseFloat(breakevenRaw), scenarios });
      saveEvents(events);
      toast('Decision logged');
      router();
    };
    document.querySelectorAll('.run-mc').forEach(btn=>{
      btn.onclick = async ()=>{
        const state = currentState();
        const P = LEADOS.events.project(state);
        const d = P.decisionById[btn.dataset.id];
        if (!d) return;
        btn.textContent = 'Running…';
        const out = await timed(()=>LEADOS.workers.runMonteCarlo(d.scenarios, 2000, 42, d.breakeven));
        workerLog.push({ method:'montecarlo', usedWorker: out.usedWorker, timedOut: out.timedOut, ms: out.ms });
        document.getElementById('mcResult').innerHTML = renderMonteCarloResult(d, out, out.result);
        LEADOS.a11y.announce(`Monte Carlo complete for ${d.title}. ${out.result.interpretation||''}`);
        btn.textContent = 'Run Monte Carlo';
      };
    });
  }

  function wireFindings(){
    document.getElementById('runEngineBtn').onclick = async ()=>{
      const state = currentState();
      const out = await timed(()=>LEADOS.workers.runEngine(state, todayISO()));
      workerLog.push({ method:'engine.run', usedWorker: out.usedWorker, timedOut: out.timedOut, ms: out.ms });
      lastFindings = out.result;
      lastFindingsTiming = out;
      LEADOS.a11y.announce(`Engine run complete. ${lastFindings.length} findings.`);
      router();
      location.hash = '#/findings';
    };
  }

  function wireAccessibility(){
    document.getElementById('srSelfReport').onchange = (e)=>{
      LEADOS.a11y._screenReaderDetected = e.target.checked;
      LEADOS.a11y.apply(LEADOS.a11y.detect());
      router();
    };
    document.getElementById('btnDyslexia').onclick = ()=>{ LEADOS.a11y.applyDyslexiaFriendly(); toast('Dyslexia-friendly mode applied'); };
    document.getElementById('btnCognitive').onclick = ()=>{ LEADOS.a11y.applyCognitiveReduction(); toast('Cognitive-reduction mode applied'); router(); };
    document.getElementById('btnResetA11y').onclick = ()=>{ LEADOS.a11y.reset(); toast('Reset to defaults'); router(); };
    document.getElementById('btnAnnouncePolite').onclick = ()=> LEADOS.a11y.announce('Polite update: finding list refreshed.', 'polite');
    document.getElementById('btnAnnounceAssertive').onclick = ()=> LEADOS.a11y.announce('Assertive alert: a critical risk finding was detected.', 'assertive');
    document.getElementById('toggleLiveDebug').onchange = (e)=>{ document.getElementById('liveDebug').classList.toggle('hidden', !e.target.checked); };
    document.getElementById('btnOpenModal').onclick = ()=>{
      const root = document.getElementById('modalRoot');
      root.innerHTML = `
        <div class="fixed inset-0 bg-black/40 flex items-center justify-center z-40" id="modalOverlay">
          <div class="bg-white rounded-xl p-6 w-96 card" role="dialog" aria-modal="true" aria-labelledby="modalTitle" id="modalBox">
            <div id="modalTitle" class="font-semibold mb-2">Focus-trapped modal</div>
            <p class="text-sm text-slate-500 mb-4">Tab/Shift+Tab stays inside this dialog. Closing returns focus to the button that opened it.</p>
            <input class="card rounded px-2 py-1 text-sm w-full mb-3" placeholder="Try tabbing through me">
            <div class="flex justify-end gap-2">
              <button id="modalCancel" class="btn tap-shrink bg-slate-100 rounded-lg text-xs">Cancel</button>
              <button id="modalOk" class="btn tap-shrink bg-slate-900 text-white rounded-lg text-xs">OK</button>
            </div>
          </div>
        </div>`;
      const box = document.getElementById('modalBox');
      const trapHandle = LEADOS.focus.trap(box);
      const close = ()=>{ trapHandle.release(); root.innerHTML=''; LEADOS.focus.returnToPrevious(); };
      document.getElementById('modalCancel').onclick = close;
      document.getElementById('modalOk').onclick = close;
      document.getElementById('modalOverlay').addEventListener('keydown', (e)=>{ if (e.key==='Escape') close(); });
    };
  }

  function wireWorkersView(){
    document.getElementById('btnTerminateWorker').onclick = ()=>{ LEADOS.workers.terminate(); toast('Worker terminated — next run falls back to main thread'); router(); };
    document.getElementById('btnRestartWorker').onclick = ()=>{ LEADOS.workers.init(); toast('Worker (re)started'); router(); };
  }

  function wireLog(state){
    document.getElementById('exportBtn').onclick = ()=>{
      const blob = new Blob([JSON.stringify(state.events,null,2)], {type:'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = 'leados-events.json'; a.click();
    };
  }

  document.getElementById('reseedBtn').onclick = ()=>{ seedDemo(); lastFindings=[]; lastFindingsTiming=null; toast('Demo log reseeded'); router(); };

  // Live region mirror UI (sighted demo aid)
  window.addEventListener('leados:announce', (e)=>{
    const list = document.getElementById('liveDebugList');
    if (!list) return;
    const row = document.createElement('div');
    row.innerHTML = `<b>[${e.detail.priority}]</b> ${e.detail.message}`;
    list.prepend(row);
    while (list.children.length > 5) list.removeChild(list.lastChild);
  });

  // React to live OS-level preference changes
  ['(prefers-reduced-motion: reduce)','(prefers-contrast: more)','(forced-colors: active)',
   '(prefers-color-scheme: dark)','(prefers-reduced-data: reduce)'].forEach(q=>{
    window.matchMedia(q).addEventListener('change', ()=>{ LEADOS.a11y.apply(LEADOS.a11y.detect()); if (location.hash==='#/accessibility') router(); });
  });

  window.addEventListener('hashchange', router);
  window.addEventListener('DOMContentLoaded', ()=>{
    if (!loadEvents().length) seedDemo();
    LEADOS.workers.init();
    LEADOS.a11y.apply(LEADOS.a11y.detect());
    router();
  });
})();
</script>
</body>
</html>
