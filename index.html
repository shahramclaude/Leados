<style>
:root{--ink:#0A0B0E;--ink2:#0E1014;--panel:#13161C;--panel2:#171B22;--panel3:#1D222B;--line:#242A34;--line2:#2E3542;--txt:#E9E6DF;--dim:#9B968B;--faint:#6B675E;--acc:#E2A63D;--acc2:#F2C569;--acc-dim:rgba(226,166,61,.13);--ok:#63B98B;--ok-dim:rgba(99,185,139,.13);--risk:#DE6B54;--risk-dim:rgba(222,107,84,.14);--warn:#E2A63D;--warn-dim:rgba(226,166,61,.13);--info:#7C9CC9;--info-dim:rgba(124,156,201,.14);--vio:#A78BDB;--vio-dim:rgba(167,139,219,.13);--r:12px;--rl:16px;--fu:'Inter',system-ui,sans-serif;--fd:'Fraunces',Georgia,serif;--fm:'IBM Plex Mono',ui-monospace,monospace}
*{box-sizing:border-box}html{scrollbar-color:var(--line2) var(--ink)}

.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}

.chip.ok{background:var(--ok-dim);color:var(--ok);border-color:rgba(99,185,139,.3)}.chip.risk{background:var(--risk-dim);color:var(--risk);border-color:rgba(222,107,84,.32)}.chip.warn{background:var(--warn-dim);color:var(--warn);border-color:rgba(226,166,61,.32)}.chip.info{background:var(--info-dim);color:var(--info);border-color:rgba(124,156,201,.32)}.chip.vio{background:var(--vio-dim);color:var(--vio);border-color:rgba(167,139,219,.32)}.chip.acc{background:var(--acc-dim);color:var(--acc2);border-color:rgba(226,166,61,.35)}.chip.hard{background:var(--risk);color:#fff;border-color:var(--risk)}
.meter{height:6px;border-radius:6px;background:var(--panel3);overflow:hidden}.meter i{display:block;height:100%;border-radius:6px;background:var(--ok);transition:width .5s cubic-bezier(.22,.8,.3,1)}
.meter.warn i{background:var(--warn)}.meter.risk i{background:var(--risk)}.meter.info i{background:var(--info)}.meter.acc i{background:var(--acc)}.meter.vio i{background:var(--vio)}
.meter-row{display:flex;align-items:center;gap:10px;font-size:12px;padding:3px 0}.meter-row .meter{flex:1}.meter-row b{font-family:var(--fm);font-size:12px;min-width:38px;text-align:right}.meter-row>span{width:160px;color:var(--dim);font-size:11.5px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.frow{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}

/* ══ 1. STORE ═════════════════════════════════════════════════════ */

function save(){try{S.telemetry.writes++;localStorage.setItem(LS_KEY,JSON.stringify(S));SAVE_FAIL=null;}catch(e){SAVE_FAIL=e.message;S.telemetry.failWrites++;toast('Write failed: '+e.message+' — export now.','risk');}}
function load(){try{const r=localStorage.getItem(LS_KEY);if(!r)return false;const d=JSON.parse(r);if(!d||d.v!==4)return false;COLL.forEach(c=>{if(!Array.isArray(d[c]))d[c]=[];});S=d;return true;}catch(e){return false;}}
function quotaInfo(){try{const b=(localStorage.getItem(LS_KEY)||'').length;return{bytes:b,pct:b/(5*1024*1024)};}catch(e){return{bytes:0,pct:0};}}

function todayStr(d){d=d||new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function addDays(d,n){const t=new Date(d+'T12:00:00');t.setDate(t.getDate()+n);return todayStr(t);}
function db(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000);}
function age(d){return Math.max(0,db(d,todayStr()));}
function fmt(d){if(!d)return'—';const t=new Date(d+'T12:00:00');return t.toLocaleDateString(undefined,{month:'short',day:'numeric'});}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function rnd(a,b){return a+Math.random()*(b-a);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function get(c,id){return list(c).find(o=>o.id===id)||null;}
function put(c,o){S[c].push(o);return o;}
function del(c,id){S[c]=list(c).filter(o=>o.id!==id);}

function sparkSVG(vals,cls){if(!vals||vals.length<2)return'<span style="color:var(--faint);font-size:11px">—</span>';const w=120,h=30,min=Math.min.apply(null,vals),max=Math.max.apply(null,vals),rg=(max-min)||1;const pts=vals.map((v,i)=>(i/(vals.length-1)*w).toFixed(1)+','+(h-3-((v-min)/rg)*(h-8)).toFixed(1)).join(' ');return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none"><polyline class="'+(cls||'')+'" points="'+pts+'"/></svg>';}

/* form builders */

/* ══ 3. FW — pure models (38; no I/O, no mutation) ═══════════════ */
const FW={
escKeywords:['harass','discriminat','assault','safety','medical','fraud','legal','lawsuit','retaliat','threat','self-harm','suicid','whistleblow','drugs','violence','weapon','terminat','pip','severance','ethic','complaint','hr '],
escTest(text){const t=String(text||'').toLowerCase();return FW.escKeywords.filter(k=>t.includes(k));},
sla(sev){return[null,14,10,7,3][clamp(sev,1,4)]||7;},
cynefin(notes,sev){const t=String(notes||'').toLowerCase();if(FW.escTest(t).length)return'chaotic — act first, contain, then sense';if(sev>=4)return'chaotic — act first, contain, then sense';if(/unclear|unknown|experiment|novel|first time/.test(t))return'complex — probe small, sense, respond';if(/process|repeat|runbook|known/.test(t))return'clear — apply the known playbook';return'complicated — analyze with the people closest to the work';},
eisenhower(sev,dueIn){const urgent=dueIn<=3||sev>=4,important=sev>=3;if(urgent&&important)return'Q1 do now';if(important)return'Q2 schedule — where leadership lives';if(urgent)return'Q3 delegate hard';return'Q4 drop';},
trustScore(t){if(!t)return null;const v=((t.c+t.r+t.i)/3-t.s)*100/7;return{score:clamp(Math.round(v+50),0,100),label:v>2?'strong':v>0?'building':'fragile: self-orientation is eating you'};},
flightRisk(p,ctx){const d=[];const add=(k,pts,note)=>{if(pts>0)d.push({k,pts,note});};const m=(p.mood||[]);if(m.length>=3)add('mood',clamp(Math.round((6.5-FW.moodSlope(m).avg)*10),0,22),'mood avg '+FW.moodSlope(m).avg.toFixed(1));if(!p.trust)add('trust',6,'trust unassessed');else if(FW.trustScore(p.trust).score<45)add('trust',14,'trust fragile');const last=ctx.last1on1;if(!last)add('contact',12,'no 1:1 on record');else if(age(last.date)>ctx.cadence*1.5)add('contact',10,(age(last.date))+'d silent vs '+ctx.cadence+'d cadence');const ev=(ctx.evidence||[]);if(!ev.length)add('evid',5,'zero evidence ledger entries');const nb=p.nineBox;if(nb&&nb.perf>=7&&nb.pot>=7&&!p.dev)add('dev',12,'high performer, no dev plan');else if(!p.dev)add('dev',4,'no dev plan');const oc=ctx.openCases||0;if(oc)add('case',oc*5,oc+' open case(s) on this person');const dl=ctx.deleg||0;if(dl===0&&p.lead)add('growth',8,'lead with zero active delegations');if(p.rampChecks&&p.rampChecks.some(r=>!r.done&&r.d<todayStr()))add('ramp',7,'ramp gate missed');const score=clamp(d.reduce((a,x)=>a+x.pts,4),0,100);return{score,drivers:d.sort((a,b)=>b.pts-a.pts)};},
moodSlope(mood){if(!mood||!mood.length)return{slope:0,avg:5,label:'no data'};const ms=mood.slice(-6),n=ms.length;let sx=0,sy=0,sxy=0,sxx=0;ms.forEach((m,i)=>{sx+=i;sy+=m.v;sxy+=i*m.v;sxx+=i*i;});const sl=n>1?(n*sxy-sx*sy)/(n*sxx-sx*sx||1):0;const avg=sy/n;return{slope:sl,avg,label:sl<-0.25?'falling':sl>0.25?'brightening':'flat'};},
blendedPulse(o,e,l,s){return clamp(Math.round(((o+e+(11-l)+s)/4*10)*1)/1,0,100)/10;},
edmondson(arr){if(!arr||arr.length!==7)return null;const rev={2:1,4:1,6:1};let sum=0;arr.forEach((v,i)=>{sum+=rev[(i+1)]?(8-v):v;});return{score:Math.round(sum/49*100),weakest:arr.reduce((w,v,i)=>{const s=rev[(i+1)]?(8-v):v;return s<w.s?{i:i+1,s}:w;},{i:0,s:99})};},
fiveDys(arr){if(!arr||arr.length!==5)return null;const names=['Absence of trust','Fear of conflict','Lack of commitment','Avoidance of accountability','Inattention to results'];let cur=100,broken=null;for(let i=0;i<5;i++){const v=arr[i]*20;if(broken)continue;if(v<60){broken={idx:i,name:names[i],score:v};break;}cur=Math.min(cur,v);}return broken?{broken,health:Math.round(cur)}:{broken:null,health:Math.round(arr.reduce((a,v)=>a+v*20,0)/5)};},
tuckman(team){if(team.stageOverride)return{stage:team.stage,why:'your call — override set'};const ps=FW.edmondson(team.psychScan);const fd=FW.fiveDys(team.fiveDys);if(!ps)return{stage:'forming',why:'no psych scan yet — run the scan'};if(ps.score<50)return{stage:'storming',why:'psych safety '+ps.score+'% — conflict is live under the surface'};if(fd&&fd.broken&&fd.broken.idx>=3)return{stage:'norming',why:'trust/conflict ok, accountability wobbling'};return{stage:'performing',why:'safety '+ps.score+'% and no broken layer'};},
busFactor(team,people){if(!team)return[];const caps={};people.filter(p=>p.teamId===team.id&&!p.archived).forEach(p=>(p.criticalFor||[]).forEach(c=>{caps[c]=(caps[c]||0)+1;}));return Object.keys(caps).map(c=>({cap:c,n:caps[c],critical:caps[c]===1})).sort((a,b)=>a.n-b.n);},
nineBox(p){if(!p.nineBox)return{label:'unstamped',cell:null};const{perf,pot}=p.nineBox;const a=perf>=7?'High':perf>=4?'Solid':'Low',b=pot>=7?'High':pot>=4?'Growth':'Established';const map={'Low-Established':'risk — manage honestly','Low-Growth':'misplaced or new','Low-High':'enigma — diagnose before betting','Solid-Established':'core — keep trusted','Solid-Growth':'workhorse rising','Solid-High':'near star — stretch now','High-Established':'expert anchor','High-Growth':'future star','High-High':'star — protect & delegate up'};return{label:map[a+'-'+b],cell:a+'/'+b};},
krProgress(kr){const start=kr.start==null?0:kr.start;if(kr.dir==='down'){if(kr.target>=start)return kr.cur<=kr.target?100:0;return clamp(Math.round((start-kr.cur)/(start-kr.target)*100),0,100);}const span=kr.target-start;if(!span)return kr.cur>=kr.target?100:0;return clamp(Math.round((kr.cur-start)/span*100),0,100);},
goalProgress(g){if(!g.krs||!g.krs.length)return 0;const w=g.krs.reduce((a,k)=>a+(k.weight||1),0);return Math.round(g.krs.reduce((a,k)=>a+FW.krProgress(k)*(k.weight||1),0)/w);},
leaderLoad(ctx){const oc=ctx.openCases||0,ot=ctx.overdueTasks||0,ad=ctx.advisories||0,ppl=ctx.people||0;const score=clamp(Math.round(oc*9+ot*3+ad*1.5+ppl*4),0,100);return{score,label:score>70?'red — drop something today':score>45?'amber — protect Q2 time':'green',parts:[['open cases',oc],['overdue tasks',ot],['live advisories',ad],['people span',ppl]]};},
teamHealth(team,ctx){const ps=FW.edmondson(team.psychScan);const fd=FW.fiveDys(team.fiveDys);const goals=(ctx.goals||[]).filter(g=>g.teamId===team.id&&g.status==='open');const gp=goals.length?Math.round(goals.reduce((a,g)=>a+FW.goalProgress(g),0)/goals.length):50;const oc=(ctx.cases||[]).filter(c=>c.teamId===team.id&&c.status==='open').length;const mood=ctx.moodAvg||5;const score=clamp(Math.round((ps?ps.score*0.35:17.5)+(fd?fd.health*0.25:12.5)+gp*0.2+(10-clamp(oc*3,0,10))*2+(mood*10)*0.1),0,100);return{score,parts:[['psych safety',ps?ps.score:0],['dysfunctions',fd?fd.health:0],['goals',gp],['case pressure',clamp(100-oc*30,0,100)],['mood',Math.round(mood*10)]]};},
powerInterest(sh){const hi=v=>v>=6;if(hi(sh.power)&&hi(sh.interest))return{q:'manage closely',play:'weekly touch, pre-wire every decision, no surprises'};if(hi(sh.power))return{q:'keep satisfied',play:'consult before you commit; they can kill you from the sidelines'};if(hi(sh.interest))return{q:'keep informed',play:'use them as early-warning radar'};return{q:'monitor',play:'quarterly is plenty'};},
stancePlay(st){return{champion:'Equip them: they sell better than you do.',neutral:'Small win first — make the yes cheap.',skeptic:'Pre-wire 1:1, surface their objection before the room does.',blocker:'Never debate in public; map their interest, move third-party.'}[st]||'';},
calibration(decs){const done=decs.filter(d=>d.review&&d.review<todayStr()&&d.outcome!=null);if(done.length<3)return{label:'insufficient data — grade 3+ reviewed decisions',rate:null,drift:null};const hits=done.filter(d=>d.outcome==='right').length/done.length*100;const conf=done.reduce((a,d)=>a+d.conf,0)/done.length*10;const drift=Math.round(conf-hits);return{rate:Math.round(hits),conf:Math.round(conf),drift,label:drift>15?'overconfident — your 8s behave like 6s':drift<-15?'sandbagging — trust your calls more':'calibrated'};},
adkarGap(r){if(!r.adkar) return null;const seq=['a','d','k','r','i'],names={a:'Awareness: they do not know why',d:'Desire: they know, they will not',k:'Knowledge: willing but clueless how',r:'Ability: knows how, cannot do it under load',i:'Reinforcement: it worked, now it is sliding back'};for(const k of seq){if(!r.adkar[k])return{gap:k,label:names[k]};}return null;},
cadenceFor(p){const fl=FW.flightRiskCache?null:null;let d=p.lead?14:21;if(!p.trust)d-=4;else if(FW.trustScore(p.trust).score<45)d-=7;if(p.startDate&&age(p.startDate)<91)d=7;const s=FW.moodSlope(p.mood);if(s.label==='falling')d-=7;return clamp(d,7,30);},
slii(skill,will){const lvl=skill<=4&&will<=4?1:skill<=4?2:will<=4?3:4;return{dev:lvl==1?'D1 enthusiastic beginner':lvl==2?'D2 struggling learner':lvl==3?'D3 reluctant contributor':'D4 peak performer',style:lvl==1?'L1-L2 tell & show':lvl==2?'L3-L4 walk it together':lvl==3?'L5 check in on a cadence':'L6-L7 hand it off fully',rec:lvl};},
replacementCost(p){return Math.round((p.salary||90000)*0.75);},
bench(lead,people,deles){const pool=people.filter(p=>p.id!==lead.id&&!p.archived&&(p.managerId===lead.id||p.lead));return pool.map(p=>{const nb=FW.nineBox(p);const ov=(p.criticalFor||[]).filter(c=>(lead.criticalFor||[]).includes(c)).length;const trust=p.trust?FW.trustScore(p.trust).score:40;const bestDel=deles.filter(d=>d.personId===p.id&&d.status==='active').reduce((m,d)=>Math.max(m,d.level),0);const ready=clamp(Math.round(((p.nineBox?(p.nineBox.perf+p.nineBox.pot)*5:40))*0.4+trust*0.25+Math.min(ov,2)*10+bestDel*5),0,100);const next=bestDel<4?'a real L4+ delegation':ov===0?'share one of the lead\'s capabilities':'run one solo decision with you shadowing';return{person:p,ready,overlap:ov,next,label:nb.label};}).sort((a,b)=>b.ready-a.ready);},
praiseBalance(fb,personId){const mine=fb.filter(f=>f.personId===personId&&f.status==='delivered'&&age(f.deliveredAt||f.created)<=60);if(!mine.length)return{pct:null,n:0,zone:'no signal'};const p=mine.filter(f=>f.kind==='praise').length/mine.length*100;return{pct:Math.round(p),n:mine.length,zone:p>=60&&p<=85?'healthy':p<60?'too corrective':'corrections avoided'};},
timeMix(entries){const tot=entries.reduce((a,e)=>a+e.hrs,0)||1;const tgt={leading:30,delegating:20,thinking:20,doing:15,managingUp:15};const cur={};entries.forEach(e=>cur[e.kind]=(cur[e.kind]||0)+e.hrs/tot*100);const off=Object.keys(tgt).map(k=>({kind:k,cur:Math.round(cur[k]||0),tgt:tgt[k],delta:Math.round((cur[k]||0)-tgt[k])}));return{off,worst:off.sort((a,b)=>Math.abs(b.delta)-Math.abs(a.delta))[0]};},
conflictTemp(c){const notes=(c.notes||'')+' '+(c.timeline||[]).map(t=>t.t).join(' ');const hot=/shout|yell|personal|insult|quit|hr|threat|refus/i.test(notes);const base=(c.severity||3)*18;return clamp(base+(age(c.opened)>(c.sla||7)?15:0)+(hot?18:0),0,100);},
coachQuality(s){let sc=0;const dig=v=>/[0-9]|%|deadline|by\s|date/.test((v||'').toLowerCase());if((s.g||'').length>10)sc+=dig(s.g)?30:18;if((s.r||'').length>10)sc+=20;if((s.o||'').split(/[\n;]/).filter(x=>x.trim().length>4).length>=3)sc+=25;else if((s.o||'').length>10)sc+=12;if((s.w||'').length>8)sc+=dig(s.w)?25:12;return{score:sc,label:sc>=75?'coaching-grade':sc>=45?'thin — sharpen specificity':'a chat, not coaching'};},
batnaStrength(n){let sc=20;if((n.ours&&n.ours.batna||'').length>8)sc+=30;else sc-=10;if(n.ours&&n.ours.reservation!=null&&n.ours.reservation!=='')sc+=20;if((n.theirs&&n.theirs.guess||'').length>8)sc+=15;if((n.concessions||[]).length)sc+=15;return{score:clamp(sc,0,100),zopa:n.ours&&n.theirs&&n.ours.reservation!=null&&n.theirs.walkaway!=null?('ZOPA window: '+n.ours.reservation+' ↔ '+n.theirs.walkaway):'ZOPA unknown — one side is a black box'};},
aarQuality(a){let sc=0;if((a.expected||'').length>10)sc+=20;if((a.happened||'').length>10)sc+=20;if(/because|since|due to|caused/i.test(a.why||''))sc+=25;else if((a.why||'').length>10)sc+=8;if((a.improve||[]).filter(i=>i.text&&i.owner).length)sc+=35;else if((a.improve||[]).length)sc+=15;return{score:clamp(sc,0,100),label:sc>=75?'learning captured':sc>=45?'shallow — "why" needs causality':'anecdote, not an AAR'};},
meetingCost(m,hourly){return Math.round((m.mins/60)*m.attendees*(m.freq||1)*48*hourly);},
meetingVerdict(m,hourly){const c=FW.meetingCost(m,hourly);if(m.decisions&&m.decisions.length)return{cost:c,verdict:'pays rent — produces decisions',tone:'ok'};if(/status|sync|update/i.test(m.title))return{cost:c,verdict:'kill or async — status travels by doc',tone:'risk'};return{cost:c,verdict:c>20000?'expensive habit — demand a decision portfolio':'watch',tone:'warn'};},
energyScore(e){if(!e)return null;return Math.round((e.focus+e.stamina+e.mood+e.clarity)/4*10);},
commitmentDebt(os){const yours=[],theirs=[];os.filter(o=>o.status!=='cancelled').forEach(o=>(o.commitments||[]).forEach(c=>{if(!c.done&&c.due<todayStr())(c.owedBy==='you'?yours:theirs).push({c,oo:o});}));return{yours,theirs};},
spanHealth(you,people){const directs=people.filter(p=>p.managerId===(you&&you.id));const leads=directs.filter(p=>p.lead).length;return{directs:directs.length,leads,label:directs.length>9?'overloaded span':directs.length===0?'no one mapped':'workable'};},
casePressure(open){return clamp(open.reduce((a,c)=>a+(c.severity||3)*3+(age(c.opened)>(c.sla||7)?4:0),0),0,100);},
whyChain(text){const lines=String(text||'').split(/\n/).map(s=>s.trim()).filter(Boolean);const whys=lines.filter(l=>/^why/i.test(l)||/^because/i.test(l));return{valid:lines.length>=5&&whys.length>=3,depth:lines.length};}};
/* context builders used by models */
function ctxFor(p){const oo=list('oneonones').filter(o=>o.personId===p.id&&o.status==='done').sort((a,b)=>b.date<a.date?-1:1);return{last1on1:oo[0]||null,cadence:FW.cadenceFor(p),evidence:list('evidence').filter(e=>e.personId===p.id),openCases:openCases().filter(c=>c.personId===p.id).length,deleg:list('delegations').filter(d=>d.personId===p.id&&d.status==='active').length};}
function teamCtx(t){const ms=activePeople().filter(p=>p.teamId===t.id);const moods=ms.flatMap(p=>(p.mood||[]).slice(-1));return{goals:list('goals'),cases:list('cases'),moodAvg:moods.length?moods.reduce((a,m)=>a+m.v,0)/moods.length:5};}
/* ══ 4. CONTENT — case types · scripts · qbank · lessons · scenarios ══ */
const CASE_TYPES={
conflict:{label:'Interpersonal conflict',sla:7,wires:['evidence','mediation','oneonone','comms'],pb:[['Get each story separately — 20 min each, no verdicts',1],['Run structured mediation (frame → interests → agreement)',3],['Embed agreement where it bites: working agreement / review norm',5],['Verify the air is clear in next 1:1s, not by vibe',7]],fm:['Calling it a "personality clash" and hoping — it metastasizes.','Mediating before each side feels heard — the agreement will not hold a week.','Airing it in a team meeting: public airing is escalation, not resolution.']},
flight_risk:{label:'Flight risk / retention',sla:5,wires:['evidence','oneonone','sbi','risk'],pb:[['27-minute stay conversation: what would make you leave tomorrow?',1],['Remove the top friction driver within 72h — visibly',2],['Deliver one recognition that names the specific craft',2],['Re-stamp nine-box and dev plan with them in the room',5],['Log what they told you verbatim — it is evidence, not memory',5]],fm:['Counter-offering money for a meaning problem — buys 90 days at 2× cost.','Telling them they are a flight risk. You just taught them the market signal.','Fixing it in private silence; they never notice the fix.']},
perf_concern:{label:'Performance concern',sla:14,wires:['evidence','diag','sbi','oneonone'],pb:[['Run the 4-cause diagnosis BEFORE any coaching word',1],['Fix what is manager-owned (system/clarity) first — it is blocked otherwise',3],['Deliver SBI correction with concrete artifact',5],['Set 30/60/90 checkpoints with them, dated',7]],fm:['Coaching a system problem — you will coach forever and fix nothing.','Vague "be more senior" feedback — no artifact, no change, no defense later.','Skipping the paper trail until you need it; then it looks manufactured. Because it was.']},
goal_slip:{label:'Goal / OKR slippage',sla:7,wires:['decision','comms','goalcheck'],pb:[['Re-forecast honestly: hit, stretch-miss, or dead?',1],['Decide: descope, re-date, or double-down — record with rationale',2],['Tell stakeholders before they ask',3],['Retro the estimation error, not the people',7]],fm:['Hoping it recovers — slippage at 60% elapsed is a decision, not a surprise.','Quietly editing the KR — the team learns goals are fiction.','A heroic save that burns the team: you won the goal, lost the people.']},
decision_needed:{label:'Decision pending',sla:7,wires:['decision'],pb:[['Frame: Type 1 (one-way) or Type 2 (reversible)? Say it out loud',1],['Type 1 → premortem mandatory before the call',2],['Decide, stamp confidence, set review gate, tell the DACI',4]],fm:['Treating a reversible call like a cathedral — speed IS the strategy for Type 2.','A Type 1 with no premortem is not a decision, it is a wish.','Deciding by exhaustion: last voice in the room wins.']},
ethics_hr:{label:'Escalation-class (HR/legal)',sla:0,escalation:true,pb:[],fm:['Investigating it yourself. You are not a detective; you are now a witness.','Promising confidentiality you cannot keep — promise CARE, not secrecy.','Writing opinions in the record. Verbatim facts only; adjectives are exhibits.']},
departure:{label:'Resignation / departure',sla:21,wires:['kt','bench','pipeline','risk','comms'],pb:[['Accept with grace in the first hour — the org watches how you lose people',1],['One knowledge-transfer task per critical capability, owned & dated',2],['Read the succession bench; name interim owner same week',3],['Open the requisition with the actual gap, not the old job ad',5],['Exit conversation: what would have kept you? Log verbatim',14]],fm:['Guilt-tripping the leaver — your remaining team is taking notes.','KT as a single "handover doc" ritual — 80% of critical knowledge is tribal.','Backfilling the person instead of the work; roles should be re-cut on exit.']},
hiring_block:{label:'Hiring / pipeline block',sla:14,wires:['stakeholder','decision'],pb:[['Name the real block: approval, bar, comp, or funnel?',1],['One decider, one date — escalate with options not problems',3],['Widen one funnel lane within the week',7]],fm:['Raising the bar mid-search to avoid a decision — candidates smell it.','Panel of 8 interviewers means nobody owns the no.','Letting a finalist rot 3 weeks; the market notices.']},
stakeholder_block:{label:'Stakeholder resistance',sla:10,wires:['stakeholder','comms'],pb:[['Map power×interest and stance — is it the person or the incentive?',1],['Pre-wire: surface their objection privately before any room meets',3],['Reframe in THEIR metric, or escalate the trade-off honestly',7]],fm:['Debating in the group meeting — you just made their block public identity.','Going around them silently; blockers promoted to enemies.','Mistaking a resourced "how" problem for a values "no".']},
workload:{label:'Workload / burnout signal',sla:7,wires:['decision','oneonone'],pb:[['Load audit: what stops this week, by name?',1],['Decide what YOU personally absorb vs escalate vs drop',2],['Say the stopped things out loud to the team',3]],fm:['"Push through the sprint" — the sprint has lasted 8 months.','Quietly absorbing load yourself; you become the single point of failure.','Cutting the recovery, not the work: deleting 1:1s to make room.']},
delegation_fail:{label:'Delegation failure',sla:10,wires:['risk','oneonone'],pb:[['Debrief with the ladder: which level, which boundary broke?',1],['Diagnose skill vs will vs boundary — coach the one that failed',3],['Re-delegate a smaller rep within 2 weeks or admit the level was wrong',7]],fm:['Taking it all back permanently — you just capped the org at your calendar.','Blaming the delegate when the boundary conditions were never stated.','Micromanaging the redo; that is the same failure wearing a helmet.']},
team_health:{label:'Team health dip',sla:14,wires:['comms','oneonone'],pb:[['Run the Edmondson scan plus a pulse — measure before diagnosing',1],['Name the dip in the team, ask what the data misses',3],['One structural fix, dated, owned by you',7],['Retro in 30d: did the fix hold?',30]],fm:['A pizza-shaped intervention for a trust-shaped problem.','Surveying without acting: the second survey response rate tells you everything.','Reading the scan alone and keeping the results secret from the team.']},
cross_team:{label:'Cross-team friction',sla:10,wires:['stakeholder','decision','comms'],pb:[['Write the shared goal in one sentence both leads sign',1],['Map the dependency that keeps biting — make it an explicit contract',3],['Escalate the trade-off upward once, with options, if peers deadlock',7]],fm:['CC-your-boss as an opening move — that is a declaration of war, not escalation.','Letting ICs fight the lead-level battle in tickets.','Two teams, two truths: no shared metric means no shared reality.']},
recognition_gap:{label:'Recognition gap',sla:7,wires:['sbi'],pb:[['Audit the last 30 days: who shipped quietly and got silence?',1],['Deliver two specific SBIs this week — praise with the craft named',3],['Make one win visible upward with the owner CC\'d',5]],fm:['Recognition clustering on the loud — quiet high performers leave first.','Praise inflation: "great job" means nothing; "the retry logic in PR 412" means everything.','Only recognizing heroics — you are arson-proofing your culture, and arsonists get applause.']},
crisis:{label:'Crisis / incident',sla:2,wires:['comms','decision','risk','oneonone'],pb:[['STABILIZE (0–24h): name incident commander, stop the bleeding, log timeline',1],['ASSESS: facts vs rumors in two columns; who is hurt, what is broken',1],['COMMUNICATE: what we know / don\'t know / next update time — then keep it',2],['RECOVER: re-sequence work around the hole; watch the responder burnout',4],['REVIEW: blameless AAR within 7 days —5 whys to a systemic cause',7]],fm:['Communicating once: silence after hour 4 is a rumor generator.','Hero mode: the commander making every call at minute 300 is the next incident.','Skipping the AAR because "we were busy" — you paid for the lesson, at least collect it.']}};
/* scripts — guardrailed, parameterized */
const SCRIPTS=[
{id:'oneonone-opener',name:'1:1 opener (cadence restart)',guard:null,params:[['person','Who'],['topic','Live topic you already know about']],body:p=>'Look — '+p.person+', I want to reset how we use this time.\n\nThis hour is yours, not a status report. Status I can read anywhere. What I cannot read anywhere is: what is slowing you down, what you are not telling me, and where I am the bottleneck.\n\nGround rules from my side: I will not take notes to use against you, I will bring my own failures here first, and commitments we make get dates — mine included.\n\nSo: what is the thing you hoped I would not ask about today? Start there.'},
{id:'sbi-praise',name:'SBI praise (craft-named)',guard:null,params:[['person','Who'],['situation','Situation'],['behavior','The specific behavior'],['impact','The impact']],body:p=>p.person+', quick one — in '+p.situation+', you '+p.behavior+'.\n\nThe effect: '+p.impact+'.\n\nI am naming it because that specific move is the bar, and you set it. Do more of exactly that.'},
{id:'sbi-correction',name:'SBI correction (artifact-first)',guard:'Corrections older than 72h lose 80% of their effect and gain 100% of the awkwardness. Deliver now or decide consciously to let it go — both are choices, silence is not.',params:[['person','Who'],['situation','Situation'],['behavior','Behavior (observable, no adjectives)'],['impact','Impact'],['ask','The ask going forward']],body:p=>'Can I give you a hard one, '+p.person+'? I am telling you because I believe you can fix it, not to punish you.\n\nIn '+p.situation+', '+p.behavior+'. The impact was '+p.impact+'.\n\nGoing forward I need: '+p.ask+'.\n\nWhat is your read on it? I may be missing context and I want it.'},
{id:'delegation-brief',name:'Delegation brief (level-tagged)',guard:null,params:[['person','Who'],['task','The outcome, not the steps'],['level','Ladder level L1–L7'],['boundaries','Boundary conditions'],['checkpoint','First checkpoint date']],body:p=>p.person+', I am handing you: '+p.task+'.\n\nLevel: '+p.level+' — which means this much rope, stated out loud.\n\nBoundaries, non-negotiable: '+p.boundaries+'.\n\nFirst checkpoint '+p.checkpoint+' — you bring options, not status. Everything between now and then is yours, including the mistakes that fit inside the boundaries. That is the point.'},
{id:'tough-news',name:'Tough news (missed promotion / raise)',guard:'Never deliver tough news in a hallway, never on Friday 5pm, never with false hope. Clarity is the kindness.',params:[['person','Who'],['decision','The decision'],['reason','The honest reason'],['gap','The specific gap'],['path','The path and timeline if it exists']],body:p=>p.person+', the answer on '+p.decision+' is no. You deserve the why in plain words.\n\nThe reason: '+p.reason+'. The gap between here and yes: '+p.gap+'.\n\n'+p.path+'\n\nTake the time you need — today, tomorrow, the rest of the week. Then, if you want, we build the plan together or I help you find the right door. Both are on the table, and me saying that out loud is deliberate.'},
{id:'mediation-frame',name:'Mediation opening frame',guard:'If either party mentions harassment, discrimination, safety, or medical — STOP this script, register an escalation-class case, contact HR today. You are a manager, not an investigator.',params:[['a','Party A'],['b','Party B']],body:p=>p.a+', '+p.b+' — thanks for coming. My job here is not to judge who is right. It is to get us to an agreement you both keep when I am not in the room.\n\nRules: each of you speaks uninterrupted, we talk about observable behavior and impact — not character, not intent — and we do not leave without something concrete.\n\nFirst, each of you gets five minutes: what happened, from your chair. No interruptions. '+p.a+', you start.'},
{id:'pushback-up',name:'Respectful pushback upward',guard:null,params:[['boss','To whom'],['ask','Their ask'],['cost','The honest cost'],['alt','Your alternative']],body:p=>p.boss+', I want to push back on '+p.ask+' — once, clearly, and then I will commit either way.\n\nThe cost as I see it: '+p.cost+'.\n\nWhat I would do instead: '+p.alt+'.\n\nIf the answer is still yes, it is yes — you will get my full execution and none of the quiet sabotage. I just owe you my honest read before the call is made.'},
{id:'separation',name:'Separation / PIP',guard:'STOP. This script deliberately does not exist. Register an escalation-class case, contact HR, and follow the legal process in your jurisdiction. Automating a termination script is how managers end up as defendants.'}];
/* question bank */
const QBANK={
grow:{g:['What would make this quarter a genuine win for you — not for me, for you?','If we were sitting here in 6 months, what would you want to be true that is not true today?','What is the goal underneath the goal you just named?','What does "done brilliantly" look like, in one observable sentence?','Whose standard are you chasing with this goal — is it yours?','If you could only keep one of the three goals you listed, which survives?','What would you attempt if you knew your manager had you covered?','How will we both know, without argument, that you got there?','What part of this goal scares you slightly? (Good. That is probably the real one.)','Scale 1–10: how much do you actually want this — and what would make it an 8?'],r:['Where are you honestly today against that — numbers, not vibes?','What have you already tried? What did each attempt teach?','What is within your control here, and what have you been treating as fixed?','Who has solved this before that you could steal shamelessly from?','What is the story you are telling yourself about why this is hard?','What would your harshest honest peer say is the real blocker?','What data would change your mind about this situation?','What is this problem costing you right now — weekly, concretely?','On a scale of 1–10, how much of this is skill vs will vs system?','What have you not told me yet because it is awkward?'],o:['If you had my job for a day, what would you do about this?','Give me three options — one safe, one bold, one you think I will hate.','What would you do if the constraint you keep naming disappeared?','What is the smallest experiment that would tell us something real by Friday?','Who could you borrow as a resource that you have not asked?','What would the best person you know do here in the first hour?','If you could only do one thing, what moves the needle most?','What option are you not naming because it requires a hard conversation?','Reverse it: what would guarantee failure? (Now don\'t do th /* academy — 12 lessons, 6 arcs */
const LESSONS=[
{arc:'FOUNDATIONS',id:'l1',title:'1:1s are not status meetings',body:'<h4>The failure mode</h4>New managers inherit the 1:1 and immediately fill it with project status — because status is safe and they are scared of the silence. Six months later their people are disengaged and they do not know why: the one hour where trust compounds was spent on what a dashboard already says.<h4>The model</h4>The 1:1 is the direct\'s meeting. Your agenda items go last. The compounding topics are: career, obstacles you can remove, feedback in both directions, and how they actually are. Keep commitments visible — yours especially; a manager who owes three favors is teaching the org that commitments are decorative.<h4>The practice</h4>Open with their topic. Log commitments with <i>owed-by</i> tags and dates. Never cancel — move, but never cancel. Two consecutive cancels is a trust event, not a calendar event.',checks:[['Your direct goes quiet in 1:1s for three weeks. The most likely cause?','Their topics were repeatedly bumped by yours — the meeting became yours again'],['What is the strongest signal a 1:1 is working?','They bring the hard thing first, without being asked'],['Canceling a 1:1 twice in a row primarily tells the direct…','That they are the lowest-priority use of your hour'],['The correct owner of the 1:1 agenda is…','The direct — you bring rigor, they bring content']]},
{arc:'FOUNDATIONS',id:'l2',title:'Feedback is a habit, not an event',body:'<h4>The failure mode</h4>Feedback hoarded until review season arrives stale, surprising, and useless — to the person and, later, to you in a grievance conversation where "there were concerns" meets "which you never said aloud."<h4>The model</h4>SBI: Situation, Behavior, Impact. Observable, adjective-free, fast. Praise within 48h, corrections within 72h. Watch your ratio: 60–85% praise is the healthy zone — not because feelings, but because correction lands only in accounts with deposits. Correction verification matters more than delivery: check at +21 days whether the behavior actually changed; "it changed" and "it did not" are both data.<h4>The practice</h4>Draft SBI the day you see the thing. Let the app age your drafts. Deliver, then log effect at 21 days.',checks:[['A draft correction ages 9 days. Best move?','Deliver it today with "I should have said this sooner" — or consciously drop it'],['Healthy praise/correction zone?','60–85% praise'],['+21d verification exists because…','Delivered ≠ changed; only the +21d observation closes the loop'],['"You were careless in the deploy" fails SBI because…','"Careless" is an adjective about character, not observable behavior']]},
{arc:'POWER',id:'l3',title:'The delegation ladder',body:'<h4>The failure mode</h4>Two symmetrical disasters: delegation theater (you "delegate" but keep every real call — L3 cosplaying as L6) and abdication dressed as trust (L7 to a D1 beginner, then shock at the crater). Both produce the same manager: overwhelmed, indispensable, and the ceiling of their org.<h4>The model</h4>SLII: match the ladder level to skill×will for THAT task. L1 tell → L4 walk together → L7 fully theirs. Boundary conditions are the contract — "escalate if spend > $5k" is a delegation; unmanaged hope is not. Failure is data: debrief which level and which boundary broke, then re-delegate a smaller rep within two weeks or you have taught the org that mistakes end careers.<h4>The practice</h4>Every delegation record gets: level, boundaries, dated checkpoints, debrief verdict. The app warns on skill/will mismatch.',checks:[['Your best delegate fails visibly. The correct next move?','Debrief the level/boundary break, then re-delegate a smaller rep'],['L7 to someone new at the task is…','Abdication — mismatch is a manager error, not a delegate error'],['Boundary conditions exist to…','Make "mine vs escalate" explicit BEFORE the pressure moment'],['Delegation theater is detected by…','Decisions returning to you regardless of the stated level']]},
{arc:'POWER',id:'l4',title:'Managing up without losing yourself',body:'<h4>The failure mode</h4>Manager-of-managers who either parrot upward (their team loses respect, then information stops flowing down) or rebel theatrically (their boss stops trusting, budget disappears). Both blame "politics" for what is actually a skills gap.<h4>The model</h4>Bring options, not problems. Push back once, clearly, with cost + alternative — then commit fully or document the disagreement and execute anyway. The 60-second upward brief: what happened, what it costs, what I did, what I need, by when. Your boss should never learn about your fire from someone else\'s boss.<h4>The practice</h4>Weekly brief, 60 seconds, always. Pre-wire big asks 24h early. Never surprise upward.',checks:[['You disagree with a strategic call. Sequence?','Push back once with cost+alternative, then execute fully or document'],['The first rule of upward news is…','They hear it from you first, always'],['"Optionless escalation" fails because…','You transferred the thinking you were hired to do'],['A 60-second brief contains…','What happened, cost, action taken, need, deadline']]},
{arc:'CONFLICT',id:'l5',title:'Mediation: positions to interests',body:'<h4>The failure mode</h4>Managers either referee (pick a winner, manufacture an enemy) or paper over ("you two work it out" — they won\'t; that is why it reached you). Unmediated conflict between seniors compounds interest weekly.<h4>The model</h4>Six stages: frame (rules + no-intent-talk) → stories (uninterrupted, observable only) → interests underneath positions → options on paper → agreement with dates → follow-up at 14 days. The agreement is only real when it lands somewhere structural — a review norm, a working agreement, an ownership split. Escalation-class content (harassment, discrimination, safety) hard-stops mediation instantly: HR path, same day.<h4>The practice</h4>Use the mediation module; it enforces the stage order and writes the 14-day verification for you.',checks:[['Mid-mediation someone says "that\'s just how he is". You…','Redirect to observable behavior + impact, not character'],['Harassment surfaces mid-session. Correct move?','Stop immediately, register escalation-class case, HR same day'],['An agreement holds only when…','It is embedded in a structure and verified at +14d'],['"Interests under positions" means…','" I need launch authority" may actually be "I need my judgment trusted"']]},
{arc:'CONFLICT',id:'l6',title:'The brilliant jerk calculation',body:'<h4>The failure mode</h4>Keeping the brilliant jerk because of output. The math you are not doing: their output is visible; the three people quietly interviewing because of them are not — yet. The tax arrives in one quarter as attrition, and you will call it "bad luck with hiring."<h4>The model</h4>Name the behavior with SBI, attach the actual cost (who is quiet, who is gone, what collaboration died), set one bounded behavior expectation with a date, and mean it. If the behavior does not change, no output justifies the second conversation — because the org heard the first one and drew conclusions about what you will tolerate.<h4>The practice</h4>Log the observed cost as evidence entries; the ledger is what lets you act with a clear spine later.',checks:[['The hidden cost of the brilliant jerk is…','The attrition and silence they cause, which is invisible until exit interviews'],['The first intervention is…','SBI with the observed cost attached, one bounded expectation, one date'],['After the first conversation fails, a second-chance loop signals…','That performance excuses behavior — to everyone watching'],['Why log evidence entries instead of relying on memory?','Memory rewrites itself; the ledger is what you read when the decision is hard']]},
{arc:'TALENT',id:'l7',title:'Nine-box honesty',body:'<h4>The failure mode</h4>Nine-box inflation: everyone a star, nobody told the truth, succession plans that are fan fiction. The box you fear — Low/Established — is the one your honesty owes a conversation to.<h4>The model</h4>Performance is observed evidence; potential is judged on learning rate, appetite, and scope-handling. Stamp quarterly. The stamp is a commitment device: each cell has a mandated move — stars get stretched, workhorses get developed, the bottom corner gets a diagnosis (misplaced? new? or the honest talk). A stale stamp is a lie of omission.<h4>The practice</h4>Quarterly ritual, evidence-checked. The app expires stamps at 120 days on purpose.',checks:[['Nine-box inflation primarily costs…','The honest conversations that never happen'],['Potential is best assessed by…','Learning rate + appetite + scope, not current performance'],['A stamp older than a quarter is…','A decision you are not standing behind anymore'],['High perf / low potential deserves…','The expert-anchor path with explicit status — not fake promotion hopes']]},
{arc:'TALENT',id:'l8',title:'Succession is a process, not a slide',body:'<h4>The failure mode</h4>Bus factor of one on your critical capability, and a "succession plan" that is a name in a slide deck who has never been given a single rep. When the departure lands — it always lands — you discover readiness was theater.<h4>The model</h4>Bench readiness is derived, not declared: nine-box trajectory × delegation ladder depth × capability overlap × trust. Readiness is built by reps — real delegated outcomes with real stakes inside real boundaries. The next-rep column matters more than the score: a name without a next planned rep is a wish.<h4>The practice</h4>The team page derives your bench continuously. Departure cases write the readout into the case record automatically.',checks:[['A succession plan fails theater-check when…','The named successor has zero completed reps at the required level'],['Ready-now is built by…','Completed delegated outcomes, rising ladder levels, capability overlap'],['Departure + empty bench means…','You paid tuition; the readout in the case record is the lesson'],['The most important column on the bench is…','Next rep — the actual planned rep, dated']]},
{arc:'JUDGMENT',id:'l9',title:'Type 1 doors and premortems',body:'<h4>The failure mode</h4>Two failure speeds: agonizing over reversible calls while competitors lap you, and strolling through one-way doors on vibes. Most new managers get both wrong simultaneously — slow where speed is strategy, fast where slowness is survival.<h4>The model</h4>Type 1 (one-way): premortem mandatory — "it is 12 months later and this failed; why?" Each imagined failure becomes a tracked risk row automatically. Type 2 (two-way): decide by Tuesday with a review gate; the cost of a wrong reversible call is bounded, the cost of a slow one compounds. Stamp confidence at decision time; your calibration drift (overconfident vs sandbagging) is measured across gates and shown back to you without mercy.<h4>The practice</h4>Journal every real decision. The engine refuses a Type 1 without a premortem — deliberately.',checks:[['Type 2 decisions should be made…','Fast, with a review gate — speed is the strategy'],['Premortem outputs become…','Dated P×I risk rows, automatically'],['Your confidence stamp is graded by…','Calibration drift across reviewed decisions'],['A Type 1 with no premortem is…','Refused by the engine — and by you, once burned']]},
{arc:'JUDGMENT',id:'l10',title:'The after-action review',body:'<h4>The failure mode</h4>Teams "retro" by vibes: what went well / what went badly, action items nobody owns, same failure next quarter. The org pays full tuition and never collects the lesson.<h4>The model</h4>AAR discipline: what was EXPECTED (numbers) vs what HAPPENED (numbers), the causal WHY (5-whys until a system cause, never a scapegoat), what we SUSTAIN, what we IMPROVE — each improvement owned by a name and a date, converted to tasks automatically. Quality is scored: causality, specificity, ownership. An AAR older than the incident\'s glow — 7 days — loses half its value to memory rewrite.<h4>The practice</h4>Closing a significant case arms an AAR task; the journal keeps the lesson permanently.',checks:[['The AAR why-ladder stops at…','A systemic cause you can fix — never "person X screwed up"'],['Improvements are real when…','Owned by one name with a date and converted to tracked tasks'],['AAR within 7 days because…','Memory rewrites causality optimistically within a week'],['Expected-vs-happened requires…','Numbers stated before the outcome was known']]},
{arc:'SELF',id:'l11',title:'Your load is a strategy document',body:'<h4>The failure mode</h4>The new manager-of-managers absorbs everything: every escalation, every conflict, every "quick question." Six months in they are the bottleneck with a heartbeat, making their worst decisions on their emptiest days.<h4>The model</h4>Load is measurable: cases, overdue commitments, advisory pressure, span — the app computes it daily, because you will lie to yourself about it. Time mix matters more than hours: manager-of-managers targets ~30% leading, 20% delegating, 20% thinking — a week at 60% doing is a week of management debt. Energy telemetry (focus/stamina/mood/clarity) slopes DOWN before performance does; it is your leading indicator.<h4>The practice</h4>Weekly time-mix stamp, energy check-ins. The mentor rules nag when the mix decays.',checks:[['Your personal overload first shows up as…','Worse decisions and slower 1:1 cadence — before missed deadlines'],['Doing >50% of your week as an IC signals…','Delegation failure upward AND downward'],['Energy telemetry matters because…','It slopes down before output does — leading, not lagging'],['Time-mix targets exist to…','Force the leading/thinking hours that have no external deadline']]},
{arc:'SELF',id:'l12',title:'Candour and conflict style',body:'<h4>The failure mode</h4>Every manager has a conflict default — most either avoid (issues surface as explosions weeks later) or compete (they "win" every argument and lose every relationship, then wonder why information stopped reaching them).<h4>The model</h4>TKI shorthand: competing, collaborating, compromising, avoiding, accommodating — none is wrong, each is wrong as a DEFAULT. Core discipline: care personally + challenge directly. The quadrant most managers live in is ruinous empathy — caring without challenging — which feels kind and is, in fact, a betrayal: the person hears the truth last and loudest, in the room where it costs them most.<h4>The practice</h4>The self-check in #/self prompts the uncomfortable stamps. Answer honestly; the app keeps no secrets from you but keeps yours well.',checks:[['Ruinous empathy is…','Caring without challenging — feels kind, is betrayal'],['Your conflict default becomes a problem when…','It is reflexive rather than chosen per situation'],['Challenge directly requires first…','Evidence of care the other person actually believes'],['Information stops flowing to managers who…','Win every argument']]},
];

{q:'The SBI happened. Two weeks later: behavior unchanged, output still elite. You…',opts:[['Second conversation, softer — he is carrying the roadmap','The org heard the first deadline pass. You just re-priced your word.',0],['Escalate to PIP immediately — zero tolerance','Legal-grade move without evidence ledger or HR alignment; you are now exposed and HR is annoyed.',1],['Act on the stated expectation, loop HR, start succession readout on his capabilities','Consequence with a spine: evidence-ledgered, HR-aligned, bench-read. This is the job.',3]]},

{q:'Immediate next move…',opts:[['Promise confidentiality fully — she asked for trust','You cannot keep that promise; breaking it later is worse than honesty now.',1],['Promise care not secrecy, log verbatim, register escalation-class case, contact HR today','Exactly the doctrine: verbatim facts, zero investigation, HR same day.',3],['Quietly observe the lead for a few weeks to confirm','You are not a detective; delay converts you from reporter to concealer.',0]]},

{q:'Three weeks later, HR confirms policy breach; lead exits. The skip-report\'s identity stayed sealed. Your close-out…',opts:[['Announce the departure with the real reason — transparency','Never. Dignity + legal exposure; reasons stay sealed.',0],['Team comms: departure + continuity plan + your door open; private thanks to the reporter via HR channel','Continuity for the many, protection for the one, nothing else.',3],['Do nothing — HR handles communication','Your team, your vacuum; rumors fill what you leave empty.',1]]}]},

{q:'Bench readout says: 24 months to grow a replacement. The org wants a plan Friday. You…',opts:[['Promise an internal successor to look decisive','Naming an unready successor is two losses: the role and the person you set on fire.',0],['Split the role: interim owner per capability, real delegations with reps dated, external search opened, risk row on overlap','Honest decomposition: continuity via structure, development via reps, truth upward.',3],['Absorb both capabilities yourself while searching','You just made the bus factor exactly one again — you.',1]]},

{q:'You know nothing official yet. 11:05. You…',opts:[['Say nothing until you have facts — speculation spreads panic','The vacuum you leave is filled by the rumor; silence IS a statement.',1],['Email the team everything including the rumor detail','Amplifying the rumor with your authority makes it true in the retelling.',0],['Acknowledge fast: I\'ve heard it too, here\'s what I know/don\'t, here\'s when I update next — then chase facts with your boss','Crisis doctrine: acknowledge, timestamp the next update, keep it. Facts from the source, not the rumor mill.',3]]},

{q:'Two weeks later: 15% cut confirmed, hitting one of your teams. Communication…',opts:[['Group email to everyone, efficient and fair to all','Efficiency is not the value here; dignity is. People find out one-to-one, first.',0],['Affected people first, 1:1, HR present, then leads, then team — same day, no Friday-afternoon drip','Sequence honors people: no one learns their fate from a calendar invite.',3],['Delay a week while you "optimize the list"','Every day of delay is paid for by the people who already know someone is doomed.',1]]}]}

/* ══ 5. ENGINE — case spine, propagation ledger, closures, cascades ══ */
const WIRE_LABEL={evidence:'verbatim evidence entry pre-created',mediation:'6-stage mediation protocol armed',oneonone:'1:1 scheduled plus agenda injected',comms:'guardrailed comms draft (send-or-kill)',sbi:'SBI feedback draft pre-created',risk:'P×I risk row with review date',decision:'decision record with review gate',diag:'4-cause diagnosis gate in Performance',kt:'knowledge-transfer tasks per critical capability',bench:'succession bench readout into timeline',pipeline:'backfill requisition opened',stakeholder:'stakeholder pre-wire prompts',goalcheck:'goal review task armed'};
const Engine={
createCase(d){
const dup=openCases().find(c=>c.type===d.type&&c.title.trim().toLowerCase()===String(d.title||'').trim().toLowerCase()&&String(c.personId||'')===String(d.personId||'')&&String(c.teamId||'')===String(d.teamId||''));
if(dup)return{case:dup,dup:true};
const T=CASE_TYPES[d.type]||CASE_TYPES.conflict;
const escHits=T.escalation?['type:'+d.type]:FW.escTest((d.title||'')+' '+(d.notes||''));
const sev=clamp(+d.severity||3,1,4);
const c={id:uid('c'),type:d.type,title:d.title||T.label,severity:sev,personId:d.personId||null,teamId:d.teamId||null,notes:d.notes||'',opened:todayStr(),sla:T.escalation?0:(d.sla!=null?d.sla:FW.sla(sev)),status:'open',escalated:escHits.length>0,timeline:[{d:todayStr(),t:'Case registered. '+(cynefine(d.notes,sev)),k:'acc'}],ledger:[],links:[],closedAt:null,outcome:null,lesson:null,verifiedAt:null};
if(c.escalated){
c.timeline.push({d:todayStr(),t:'ESCALATION CLASS ('+escHits.join(', ')+'). Automation hard-stopped: no playbook, no advice. Record + verbatim evidence + HR contact only. The judgment is yours and HR\'s — not the app\'s.',k:'risk'});
put('cases',c);
const ev=put('evidence',{id:uid('e'),personId:c.personId,caseId:c.id,kind:'verbatim',text:d.notes||'(record what was said, word for word — no adjectives, no interpretation)',at:todayStr()});
c.ledger.push({module:'Evidence',route:'/person/'+c.personId,label:'verbatim evidence entry',col:'evidence',id:ev.id});
const t=put('tasks',{id:uid('t'),title:'Contact HR today — '+c.title,why:'escalation-class case; delay converts reporter into concealer',due:todayStr(),status:'open',caseId:c.id,personId:c.personId,teamId:c.teamId,module:'cases',kind:'hr',created:todayStr(),doneAt:null});
c.ledger.push({module:'Tasks',route:'/today',label:'HR-contact task dated today',col:'tasks',id:t.id});
save();return{case:c};
}
put('cases',c);
(T.pb||[]).forEach(p=>{const t=put('tasks',{id:uid('t'),title:p[0],why:T.label+' playbook',due:addDays(todayStr(),p[1]),status:'open',caseId:c.id,personId:c.personId,teamId:c.teamId,module:'cases',kind:'playbook',created:todayStr(),doneAt:null});c.ledger.push({module:'Tasks',route:'/today',label:'playbook: '+p[0].slice(0,48),col:'tasks',id:t.id});});
(T.wires||[]).forEach(w=>{(WIRES[w]||(()=>[]))(c).forEach(l=>c.ledger.push(l));});
/* cross-links — two live cases on one scope is signal, never coincidence */
const related=openCases().filter(x=>x.id!==c.id&&((c.personId&&x.personId===c.personId)||(c.teamId&&x.teamId===c.teamId)));
related.forEach(x=>{const why=c.personId&&x.personId===c.personId?'same person':'same team';c.links.push({id:x.id,why});x.links.push({id:c.id,why});x.timeline.push({d:todayStr(),t:'Cross-linked to “'+c.title+'” ('+why+') — two live cases on one scope is signal.',k:'info'});});
if(related.length)c.timeline.push({d:todayStr(),t:'Cross-linked '+related.length+' open case(s): '+related.map(x=>'“'+x.title+'”').join(', ')+'. Pattern pressure is noted by the mentor.',k:'info'});
c.timeline.push({d:todayStr(),t:c.ledger.length+' writes fanned out: '+(c.ledger.map(l=>l.module).filter((v,i,a)=>a.indexOf(v)===i).join(' · ')),k:'ok'});
save();return{case:c};
},
closeCase(cid,outcome,lesson){
const c=get('cases',cid);if(!c)return;
c.status='closed';c.closedAt=todayStr();c.outcome=outcome;c.lesson=lesson;
let killed=0;openTasks().forEach(t=>{if(t.caseId===cid&&t.kind!=='verify'){t.status='cancelled';killed++;}});
put('journal',{id:uid('j'),at:todayStr(),kind:'case-lesson',type:c.type,text:lesson});

function scanMentor(){
S.telemetry.ruleRuns++;
const found=[];
RULES.forEach(r=>{try{(r.find()||[]).forEach(f=>{f.rule=r.id;f.sev=r.sev;f.w=r.sev*r.w;f.ns=r.ns;found.push(f);});}catch(e){S.telemetry.lastViewError='rule '+r.id+': '+e.message;}});
const key=f=>f.rule+'|'+(f.who||'');
const unsnoozed=found.filter(f=>{const s=S.settings.snoozes[key(f)];return f.ns||!s||s<todayStr();});
unsnoozed.sort((a,b)=>b.w-a.w);
/* daily pressure snapshot, capped at 60 */
const pr=S.telemetry.pressure||(S.telemetry.pressure=[]);
const today=todayStr();
const last=pr[pr.length-1];
const pv=FW.casePressure(openCases());
if(!last||last.d!==today){pr.push({d:today,v:pv});if(pr.length>60)pr.splice(0,pr.length-60);}else last.v=pv;
MentorCache=unsnoozed;
if(!SAVE_FAIL)mutSilent(()=>{});
return unsnoozed;
}

Routes['/people']=function(){
const ps=activePeople().sort((a,b)=>FW.flightRisk(b,ctxFor(b)).score-FW.flightRisk(a,ctxFor(a)).score);
let hx=pageHead('People','Eight weighted flight drivers per person, computed live. The person page is the instrument panel — everything else is a summary.')+'<div class="adv-actions" style="margin-bottom:14px">'+btn('person-new','','Add person','plus','btn-acc')+'</div>';
if(!ps.length)return hx+card('users','Nobody here yet',empty('users','Add your first direct','the org assembles from here')+btn('person-new','','Add person','plus','btn-acc'));
hx+='<div class="card"><table class="tbl"><thead><tr><th></th><th>Name</th><th>Role / team</th><th>Flight</th><th>Trust</th><th>Nine-box</th><th>Mood 6w</th><th>Last 1:1</th><th>Open cases</th></tr></thead><tbody>'+ps.map(p=>{const fl=FW.flightRisk(p,ctxFor(p));const tr=FW.trustScore(p.trust);const nb=FW.nineBox(p);const last=list('oneonones').filter(o=>o.personId===p.id&&o.status==='done').sort((a,b)=>a.date<b.date?1:-1)[0];const oc=openCases().filter(c=>c.personId===p.id).length;
return '<tr class="rowlink" data-r="/person/'+p.id+'"><td style="width:60px">'+ring(fl.score,'var(--'+(fl.score>=65?'risk':fl.score>=40?'warn':'ok')+')')+'</td><td><b style="font-size:13.5px">'+esc(p.name)+'</b>'+(p.lead?' '+chipEl('acc','LEAD'):'')+(p.managerId&&get('people',p.managerId)?'<br><span style="font-size:10.5px;color:var(--faint)">→ '+esc(pname(p.managerId))+'</span>':'')+'</td><td style="font-size:11.5px;color:var(--dim)">'+esc(p.role)+'<br>'+esc(tname(p.teamId))+'</td><td style="font-size:11px;color:var(--dim)">'+(fl.drivers[0]?esc(fl.drivers[0].k)+': '+esc(fl.drivers[0].note):'stable')+'</td><td>'+(tr?chipEl(tr.score>=60?'ok':tr.score>=45?'warn':'risk',tr.score+' '+tr.label):chipEl('info','unassessed'))+'</td><td style="font-size:11px;color:var(--dim)">'+nb.label+'</td><td style="width:110px">'+sparkSVG((p.mood||[]).slice(-6).map(m=>m.v),FW.moodSlope(p.mood).label==='falling'?'risk':FW.moodSlope(p.mood).label==='brightening'?'ok':'')+'</td><td style="font-size:11px;color:'+(last&&age(last.date)>FW.cadenceFor(p)?'var(--risk)':'var(--faint)')+'">'+(last?fmt(last.date)+' · '+age(last.date)+'d':'never')+'</td><td>'+(oc?chipEl('warn',oc+' live','flame'):'<span style="color:var(--faint);font-size:11px">—</span>')+'</td></tr>';}).join('')+'</tbody></table></div>';
const un=ps.filter(p=>!(p.mood||[]).length||!p.trust);
if(un.length)hx+=card('gauge','Under-instrumented — one-click fixes',un.map(p=>'<div class="adv" style="padding:8px 4px;border:none;border-bottom:1px solid rgba(36,42,52,.6)"><div style="flex:1">'+plink(p)+' <span style="color:var(--faint);font-size:11.5px">'+'missing: '+(!(p.mood||[]).length?'mood ':'')+(!p.trust?'trust':'')+'</span></div>'+ (!(p.mood||[]).length?btn('pulse-oneclick',p.id,'quick pulse','heart','btn-sm'):'')+(!p.trust?' '+rbtn('/person/'+p.id,'stamp trust','gauge','btn-sm btn-ghost'):'')+'</div>').join(''),'','flying without instruments is a choice');
return hx;
};

Routes['/person']=function(id){

const oc=openCases().filter(c=>c.personId===p.id),ev=list('evidence').filter(e=>e.personId===p.id).sort((a,b)=>a.at<b.at?1:-1);
let hx=pageHead(esc(p.name)+(p.lead?' '+chipEl('acc','LEAD'):''),esc(p.role)+' · '+esc(tname(p.teamId))+(p.managerId?' · reports to '+esc(pname(p.managerId)):'')+' · started '+(p.startDate||'—')+(p.archived?' · ARCHIVED':'')+(p.leaveUntil?' · on leave until '+p.leaveUntil:''));
hx+='<div class="adv-actions" style="margin-bottom:16px">'+btn('case-open-p',p.id,'Register case','flame','btn-acc btn-sm')+btn('book-1on1',p.id,'Book 1:1','chat','btn-sm')+btn('fb-new',p.id,'Draft SBI','msg','btn-sm')+btn('hr-packet',p.id,'HR packet','doc','btn-ghost btn-sm')+(p.archived?btn('unarchive',p.id,'Un-archive','refresh','btn-sm'):btn('archive-p',p.id,'Archive','archive','btn-ghost btn-sm'))+'</div>';
if(oc.length>1)hx+=reco('risk','<b>'+oc.length+' live cases on one person.</b> Two live cases on one scope is signal, never coincidence — read them together before acting on either.');
hx+=grid('g4',
card('flame','Flight risk','<div style="display:flex;gap:14px;align-items:center">'+ring(fl.score)+'<div style="flex:1">'+fl.drivers.slice(0,3).map(d=>'<div style="font-size:11px;padding:2px 0;color:var(--dim)">'+chipEl('risk','+'+d.pts)+' '+d.k+': '+esc(d.note)+'</div>').join('')+'</div></div><div style="margin-top:8px">'+sparkSVG((p.flightHist||[]).concat([{v:fl.score}]).slice(-8).map(x=>x.v),riskTone(fl.score))+'</div>','','8 drivers, live'),
card('gauge','Trust equation',tr?'<div style="display:flex;gap:14px;align-items:center">'+ring(tr.score,tr.score>=60?'var(--ok)':tr.score>=45?'var(--warn)':'var(--risk)')+'<div style="font-size:11.5px;color:var(--dim)">(C'+p.trust.c+'+R'+p.trust.r+'+I'+p.trust.i+') / self-orientation '+p.trust.s+'<br>'+tr.label+'<br><span style="font-size:10.5px;color:var(--faint)">stamped '+p.trust.at+'</span></div></div>':empty('gauge','Never stamped','you are flying without instruments')+ '<div style="margin-top:8px">'+btn('trust-open',p.id,'Stamp trust','gauge','btn-sm')+'</div>','','credibility+reliability+intimacy − self-orientation'),
card('perf','Nine-box','<div style="font-size:12.5px"><b>'+nb.label+'</b><br><span style="color:var(--faint);font-size:11px">'+(p.nineBox?'perf '+p.nineBox.perf+' · pot '+p.nineBox.pot+' · '+p.nineBox.at+(age(p.nineBox.at)>120?' — STALE':''):'unstamped')+'</span></div><div style="margin-top:8px">'+btn('nb-open',p.id,p.nineBox?'Re-stamp':'Stamp','perf','btn-sm')+'</div>','','quarterly honesty'),
card('heart','Mood pulse','<div style="display:flex;gap:14px;align-items:center"><div class="focus-num" style="font-size:24px">'+(p.mood&&p.mood.length?p.mood[p.mood.length-1].v.toFixed(1)+'<span style="font-size:12px;color:var(--faint)">/10</span>':'—')+'</div><div style="font-size:11px;color:var(--dim)">'+ms.label+' · avg '+ms.avg.toFixed(1)+'<br>'+((p.mood||[]).length)+' readings</div></div><div style="margin-top:8px">'+sparkSVG((p.mood||[]).slice(-8).map(m=>m.v),ms.label==='falling'?'risk':'')+btn('pulse-add-open',p.id,'Log pulse','heart','btn-sm btn-ghost')+'</div>','','blended overall×energy×load×support'));
hx+=grid('g2',
card('spark','Development plan',p.dev?'<b style="font-size:13px">'+esc(p.dev.goal)+'</b><div style="font-size:12px;color:var(--dim);margin:6px 0;white-space:pre-wrap">'+esc(p.dev.actions)+'</div><div style="font-size:10.5px;color:var(--faint);font-family:var(--fm)">set '+p.dev.at+(age(p.dev.at)>90?' — STALE':'')+'</div>':empty('target','No dev plan','growth conversations are retention infrastructure')+'<div style="margin-top:8px">'+btn('dev-open',p.id,'Set / update plan','target','btn-sm')+' '+btn('coach-new',p.id,'GROW session','coach','btn-sm btn-ghost')+'</div>','',''),
card('clock','30/60/90 ramp gates',p.rampChecks?p.rampChecks.map(r=>'<div class="checkline '+(r.done?'done':'')+'" data-a="ramp-toggle" data-arg="'+p.id+'|'+r.d+'"><span class="cbox">'+ic('check')+'</span><span style="flex:1">'+esc(r.note)+'</span><span style="font-family:var(--fm);font-size:10px;color:'+(!r.done&&r.d<todayStr()?'var(--risk)':'var(--faint)')+'">'+fmt(r.d)+'</span></div>').join('')+'<div class="adv-actions" style="margin-top:8px">'+btn('ramp-rearm',p.id,'(Re)arm 30/60/90','refresh','btn-sm btn-ghost')+'</div>':empty('cal','No ramp gates','re-armable — new role, new team, new scope')+'<div style="margin-top:8px">'+btn('ramp-rearm',p.id,'Arm gates','plus','btn-sm btn-ghost')+'</div>','','new hires ramp on inspections, not intentions'));
hx+=grid('g2',
card('doc','Evidence ledger — '+ev.length,ev.slice(0,9).map(e=>'<div class="adv" style="padding:8px 4px;border:none;border-bottom:1px solid rgba(36,42,52,.6)"><div class="w">'+fmt(e.at)+'</div><div style="flex:1">'+chipEl(e.kind.startsWith('feedback')?'vio':e.kind==='verbatim'?'risk':'info',e.kind)+'<div style="font-size:12px;margin-top:3px;color:var(--dim);line-height:1.5">'+esc(e.text)+'</div></div></div>').join('')+'<div class="adv-actions" style="margin-top:8px">'+btn('evidence-add-open',p.id,'Log evidence','plus','btn-sm')+'</div>','','written as if read aloud in the grievance room'),
card('neg','Replacement economics','<dl class="kv"><dt>Replacement cost</dt><dd><b>'+money(FW.replacementCost(p))+'</b> (0.75× salary — recruiting, ramp, lost throughput)</dd><dt>Retention ROI</dt><dd>Every $1 of flight-driver removal protects ~'+money(FW.replacementCost(p)/4)+'</dd><dt>Live delegations</dt><dd>'+list('delegations').filter(d=>d.personId===p.id&&d.status==='active').map(d=>'L'+d.level+' “'+esc(d.title)+'”').join(' · ')+'</dd><dt>Critical for</dt><dd>'+((p.criticalFor||[]).join(' · ')||'—')+'</dd></dl>','',''));
const oo=list('oneonones').filter(o=>o.personId===p.id).sort((a,b)=>a.date<b.date?1:-1).slice(0,5);
if(oo.length)hx+=card('chat','Recent sessions',oo.map(o=>'<div class="adv" style="padding:8px 4px;border:none;border-bottom:1px solid rgba(36,42,52,.6)"><div class="w">'+fmt(o.date)+'</div><div style="flex:1">'+chipEl(o.status==='done'?'ok':'acc',o.status)+' <span style="font-size:12px;color:var(--dim)">'+esc((o.notes||'').slice(0,90))+'</span>'+(o.commitments&&o.commitments.length?'<div style="font-size:11px;margin-top:3px">'+o.commitments.map(cm=>chipEl(cm.done?'ok':cm.due<todayStr()?'risk':'warn',(cm.owedBy==='you'?'you: ':'them: ')+cm.text.slice(0,34))).join(' ')+'</div>':'')+'</div></div>').join(''));
hx+='<div class="adv-actions" style="margin-top:6px">'+btn('leave-set',p.id,p.leaveUntil?'Clear leave':'Mark leave','cal','btn-ghost btn-sm')+'</div>';
return hx;
};

Routes['/negotiate']=function(){
const ns=list('negs').sort((a,b)=>a.created<b.created?1:-1);
let hx=pageHead('Negotiation lab','BATNA before words. Your Best Alternative is your spine: if it is weak, strengthen it BEFORE the table, not at it. ZOPA unknown = one side is a black box — probe first.')+'<div class="adv-actions" style="margin-bottom:14px">'+btn('neg-new','','Prep a negotiation','plus','btn-acc')+'</div>';
if(!ns.length)hx+=card('scale','Nothing in prep',empty('scale','Every raise request, vendor square-off, and scope fight','deserves 10 minutes here before the room'));
else hx+=ns.map(n=>{const sc=FW.batnaStrength(n);return '<div class="card"><div style="display:flex;gap:14px;align-items:center">'+ring(sc.score,(sc.score>=70?'var(--ok)':sc.score>=45?'var(--warn)':'var(--risk)'))+'<div style="flex:1"><b style="font-family:var(--fd);font-size:16px">'+esc(n.title)+'</b> '+chipEl(n.status==='open'?'acc':'ok',n.status)+' <span style="font-size:11px;color:var(--faint);font-family:var(--fm)">review '+fmt(n.reviewAt)+'</span><div style="font-size:12px;color:var(--dim);margin-top:4px">'+esc(sc.zopa)+' · BATNA: '+esc((n.ours.batna||'UNNAMED — that is the emergency'))+'</div>'+((n.concessions||[]).length?'<div style="margin-top:4px">'+n.concessions.map(c=>chipEl('vio','give '+esc(c.give)+' ← get '+esc(c.get))).join(' ')+'</div>':'')+'</div>'+btn('neg-edit',n.id,'Open','scale','btn-acc btn-sm')+'</div></div>';}).join('');
hx+=card('book','The doctrine',reco('info','1 · Name YOUR walk-away alternative in one sentence; if you cannot, you are the mark.<br>2 · Set reservation point BEFORE the room — anchors move brains.<br>3 · Guess THEIR interest, not their position.<br>4 · Every concession trades: give X to get Y by when. Unilateral concessions are donations.<br>5 · Raising the stakes via a live case? Register it — negotiations connected to cases get comms drafts.'));
return hx;
};

'<div class="frow"><div>'+field('Their interest (under their position)',fin('ng-guess',n?n.theirs.guess:'',''))+'</div><div>'+field('Their walk-away (best guess)',fin('ng-walk',n?n.theirs.walkaway:'',''))+'</div></div>'+

btn('neg-save',nid||'','Commit prep','scale','btn-acc')+(n?' '+btn('neg-comms',n.id,'→ comms draft','msg','btn-ghost btn-sm')+' '+btn('neg-close',n.id,'Concluded','archive','btn-ghost btn-sm'):'')+MEND,true);window.negLive();['ng-target','ng-resv','ng-batna','ng-guess','ng-walk'].forEach(ii=>{const e=el(ii);if(e)e.addEventListener('input',window.negLive);});};
