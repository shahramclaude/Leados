/* ── WEEKLY REVIEW — the assembled loop ─────────────────────────*/
Routes.review = { title: 'Weekly review', sub: 'the loop, assembled', fn() {
  const w0 = addDays(todayStr(), -7), w60 = addDays(todayStr(), -60);
  const inWeek = d => d && d >= w0;
  const opened = list('cases').filter(c => inWeek(c.createdAt));
  const closed = list('cases').filter(c => inWeek(c.closedAt));
  const closedEver = list('cases').filter(c => c.closedAt);
  const onTime = closedEver.filter(c => c.closedAt <= c.sla).length;
  const adherence = closedEver.length ? Math.round(onTime / closedEver.length * 100) : 100;
  const tasksDone = list('tasks').filter(t => t.doneAt && inWeek(t.doneAt) && !t.cancelled).length;
  const oosHeld = list('oneonones').filter(o => o.status === 'done' && inWeek(o.date));
  const oosCancelled = list('oneonones').filter(o => o.status === 'cancelled' && inWeek(o.date)).length;
  const moodVals = oosHeld.filter(o => o.mood).map(o => o.mood);
  const avgMood = moodVals.length ? round1(moodVals.reduce((a, b) => a + b, 0) / moodVals.length) : null;
  const fbWeek = list('feedback').filter(f => f.deliveredAt && inWeek(f.deliveredAt));
  const praise = fbWeek.filter(f => f.kind === 'praise').length, course = fbWeek.filter(f => f.kind === 'course').length;
  const decsWeek = list('decisions').filter(d => d.status === 'reviewed' && inWeek(d.reviewDate));
  const cal = FW.decisionCalibration();
  const journalWeek = list('journal').filter(j => inWeek(j.date)).length;
  const snoozeCount = Object.keys(S.snoozes || {}).filter(k => S.snoozes[k] >= todayStr()).length;
  const reviews = Object.values(S.reviews || {}).sort((a, b) => a.week > b.week ? -1 : 1);

  /* verdict narrative — assembled, not prose-blobbed */
  const verdicts = [];
  verdicts.push({ t: opened.length + ' cases opened, ' + closed.length + ' closed this week · lifetime SLA adherence ' + adherence + '%' + (adherence < 70 ? ' — breached SLAs mean cases are aging into dormancy; close small or staff harder' : ''), tone: adherence < 70 ? 'risk' : 'ok' });
  if (oosCancelled > 0) verdicts.push({ t: oosCancelled + ' 1:1' + (oosCancelled > 1 ? 's' : '') + ' cancelled this week. Cancel twice at the same person and you have announced their rank.', tone: 'risk' });
  if (avgMood != null && avgMood <= 2.5) verdicts.push({ t: 'Average 1:1 mood ' + avgMood + '/5 — the room is heavier than your case list suggests. Probe energy, not status.', tone: 'warn' });
  if (fbWeek.length === 0) verdicts.push({ t: 'Zero feedback delivered this week. Silence is a signal you are sending — people fill it with their own narrative.', tone: 'warn' });
  else if (course > 0 && praise === 0) verdicts.push({ t: 'All correction, no praise this week (' + praise + ':' + course + '). That pattern buys compliance and sells engagement.', tone: 'warn' });
  if (decsWeek.length === 0 && list('decisions').some(d => d.status === 'open' && d.reviewDate < todayStr())) verdicts.push({ t: 'Decisions sit past their review gates. An unreviewed decision journal is a diary.', tone: 'warn' });
  if (journalWeek === 0) verdicts.push({ t: 'No journal entries this week — the reflection loop skipped. Two honest lines count.', tone: 'warn' });
  if (snoozeCount > 8) verdicts.push({ t: snoozeCount + ' advisories snoozed. Snoozing without acting is a queue of avoided judgement — triage them today.', tone: 'warn' });
  if (!verdicts.some(v => v.tone !== 'ok')) verdicts.push({ t: 'Clean week by the numbers. Spend the surplus on someone\u2019s growth — the app has flagged nobody because you are ahead of it.', tone: 'ok' });

  /* case-pattern statistics */
  const byType = {};
  list('cases').forEach(c => {
    const b = byType[c.type] = byType[c.type] || { n: 0, closed: 0, breach: 0, days: 0 };
    b.n++; if (c.closedAt) { b.closed++; b.days += daysBetween(c.createdAt, c.closedAt); if (c.closedAt > c.sla) b.breach++; }
  });
  const repeats = {};
  list('cases').filter(c => c.createdAt >= w60).forEach(c => { if (c.personId) { repeats[c.personId] = repeats[c.personId] || []; repeats[c.personId].push(c.type); } });
  const repeatPeople = Object.keys(repeats).filter(pid => repeats[pid].length >= 2);

  /* cadence sweep readiness */
  const noFuture = list('people').filter(p => !p.archived && !list('oneonones').some(o => o.personId === p.id && o.status === 'scheduled' && o.date >= todayStr()));
  const focus = dailyBrief().focus.slice(0, 3);

  return pageHead('Weekly review', 'window: ' + fmtDate(w0) + ' → ' + fmtDate(todayStr()) + (reviews.length ? ' · ' + reviews.length + ' past reviews' : ' · first review'),
    '<button class="btn btn-acc" data-action="review-commit"><i data-lucide="signature"></i>Run the guided review</button>') +

  '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">' +
    '<div class="card stat"><span>Cases</span><b>' + opened.length + ' → ' + closed.length + '</b><em>opened → closed · SLA ' + adherence + '%</em></div>' +
    '<div class="card stat"><span>1:1s held</span><b>' + oosHeld.length + (oosCancelled ? ' <i style="font-size:13px;color:var(--risk)">(-' + oosCancelled + ')</i>' : '') + '</b><em>' + (avgMood != null ? 'avg mood ' + (avgMood || '—') + '/5' : 'none this week') + ' · tasks done ' + tasksDone + '</em></div>' +
    '<div class="card stat"><span>Feedback</span><b>' + fbWeek.length + '</b><em>' + praise + ' praise : ' + course + ' correction</em></div>' +
    '<div class="card stat"><span>Journal</span><b>' + journalWeek + '</b><em>entries · calibration: ' + cal.value + '</em></div>' +
  '</div>' +

  '<div class="card" style="margin-bottom:14px"><div class="card-title"><i data-lucide="activity"></i>Advisory pressure trend <span class="sub">persisted daily · how hard the system has been pushing back</span></div>' +
    (() => { const ks = Object.keys(S.trends || {}).sort().slice(-45);
      if (!ks.length) return '<div class="empty" style="padding:14px">Trend builds from tomorrow — one point per day, kept 60.</div>';
      const tot = ks.map(k => S.trends[k].total), rsk = ks.map(k => S.trends[k].risk), wts = ks.map(k => Math.round(S.trends[k].w / 10));
      return '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;align-items:end">' +
        '<div><div style="font-size:10.5px;font-family:var(--font-m);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:4px">Open advisories</div>' + spark(tot, 200, 40, 'var(--acc)') + '<div style="font-size:12px;margin-top:4px">now <b>' + tot[tot.length - 1] + '</b> · min ' + Math.min.apply(null, tot) + ' · max ' + Math.max.apply(null, tot) + '</div></div>' +
        '<div><div style="font-size:10.5px;font-family:var(--font-m);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:4px">Risk-grade</div>' + spark(rsk, 200, 40, 'var(--risk)') + '<div style="font-size:12px;margin-top:4px">now <b>' + rsk[rsk.length - 1] + '</b></div></div>' +
        '<div><div style="font-size:10.5px;font-family:var(--font-m);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:4px">Weighted pressure ÷10</div>' + spark(wts, 200, 40, 'var(--info)') + '<div style="font-size:12px;margin-top:4px">now <b>' + wts[wts.length - 1] + '</b></div></div></div>'; })() + '</div>' +

  '<div class="h-sec">The read <small>assembled verdicts, not vibes</small></div>' +
  verdicts.map(v => '<div class="reco ' + v.tone + '" style="margin-bottom:8px">' + v.t + '</div>').join('') +

  '<div style="display:grid;grid-template-columns:1.25fr 1fr;gap:12px;margin-top:20px;align-items:start"><div>' +
    '<div class="card"><div class="card-title"><i data-lucide="bar-chart-3"></i>Case statistics <span class="sub">pattern, not incident</span></div>' +
    (Object.keys(byType).length ? '<table class="tbl"><thead><tr><th>Type</th><th>N</th><th>Closed</th><th>Avg days</th><th>Breach</th></tr></thead><tbody>' +
      Object.keys(byType).sort((a, b) => byType[b].n - byType[a].n).map(k => { const b = byType[k]; return '<tr><td>' + CASE_TYPES[k].label + '</td><td>' + b.n + '</td><td>' + b.closed + '</td><td>' + (b.closed ? Math.round(b.days / b.closed) + 'd' : '—') + '</td><td>' + (b.breach ? '<span class="chip risk">' + b.breach + '</span>' : '<span class="chip ok">0</span>') + '</td></tr>'; }).join('') + '</tbody></table>'
    : '<div class="empty">No case history yet.</div>') +
    (repeatPeople.length ? '<div class="reco risk" style="margin-top:10px"><b>Repeat-case pattern (60d):</b> ' + repeatPeople.map(pid => personName(pid) + ' (' + repeats[pid].map(t => CASE_TYPES[t].label.split(' ')[0].toLowerCase()).join(', ') + ')').join(' · ') + ' — two-plus cases on one person stops being incidents and becomes a structural question: diagnose system/role/clarity, not the person.</div>' : '') + '</div>' +

    '<div class="card" style="margin-top:12px"><div class="card-title"><i data-lucide="trending-up"></i>Exposure now <span class="sub">what next week inherits</span></div>' +
    list('people').filter(p => !p.archived).map(p => ({ p, fr: FW.flightRisk(p) })).sort((a, b) => b.fr.score - a.fr.score).slice(0, 4).map(x =>
      '<div style="display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px"><span style="min-width:110px">' + esc(x.p.name) + '</span><div class="meter ' + (x.fr.score >= 45 ? 'risk' : x.fr.score >= 25 ? 'warn' : '') + '" style="flex:1"><i style="width:' + x.fr.score + '%"></i></div><b style="font-family:var(--font-m);font-size:12px">' + x.fr.score + '</b></div>').join('') +
    (decisionsOverdueCount() ? '<div class="reco warn" style="margin-top:10px">' + decisionsOverdueCount() + ' decision gate(s) overdue — review before committing next week\u2019s plan.</div>' : '') + '</div>' +
  '</div><div>' +
    '<div class="card hl"><div class="card-title"><i data-lucide="calendar-sync"></i>Cadence sweep <span class="sub">one click, full coverage</span></div>' +
      '<div style="font-size:12.5px;color:var(--dim);line-height:1.7">' + (noFuture.length ? '<b>' + noFuture.length + ' report' + (noFuture.length > 1 ? 's' : '') + '</b> have no future 1:1 scheduled: ' + noFuture.map(p => esc(p.name)).join(', ') + '. The sweep books each at their model-recommended cadence.' : 'Every report has a 1:1 on the books. Cadence is instrumentation — it is currently green.') + '</div>' +
      (noFuture.length ? '<button class="btn btn-acc" style="margin-top:10px" data-action="cadence-sweep">Book ' + noFuture.length + ' 1:1s at cadence</button>' : '') + '</div>' +
    '<div class="card" style="margin-top:12px"><div class="card-title"><i data-lucide="compass"></i>Engine\u2019s suggested top-3 <span class="sub">yours to ratify in the guided review</span></div>' +
      focus.map((f, i) => '<div style="display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:12.5px"><span class="focus-num" style="font-size:19px">' + (i + 1) + '</span><div><b>' + f.title + '</b><div style="color:var(--dim);font-size:11.5px">' + f.why + '</div></div></div>').join('') +
      '<button class="btn" style="width:100%;justify-content:center;margin-top:10px" data-action="review-commit"><i data-lucide="signature"></i>Commit my week</button></div>' +
    (reviews.length ? '<div class="card" style="margin-top:12px"><div class="card-title"><i data-lucide="history"></i>Last review <span class="sub">' + fmtDateFull(reviews[0].week) + '</span></div>' +
      '<dl class="kv"><dt>Wins</dt><dd>' + esc((reviews[0].wins || '—').slice(0, 200)) + '</dd><dt>Misses</dt><dd>' + esc((reviews[0].misses || '—').slice(0, 200)) + '</dd><dt>Avoided</dt><dd>' + esc((reviews[0].avoided || '—').slice(0, 120)) + '</dd><dt>Top-3 set</dt><dd style="white-space:pre-wrap">' + esc((reviews[0].top3 || '—').slice(0, 300)) + '</dd></dl></div>' : '') +
  '</div></div>';
}};
function decisionsOverdueCount() { return list('decisions').filter(d => d.status === 'open' && d.reviewDate < todayStr()).length; }

Actions['cadence-sweep'] = () => {
  const noFuture = list('people').filter(p => !p.archived && !list('oneonones').some(o => o.personId === p.id && o.status === 'scheduled' && o.date >= todayStr()));
  if (!noFuture.length) { toast('Cadence already green.', 'ok'); return; }
  mut(() => { noFuture.forEach(p => { const cad = FW.cadence(p); const oo = { id: uid('o'), personId: p.id, date: addDays(todayStr(), Math.min(7, cad.score)), status: 'scheduled', agenda: [], commitments: [], notes: '', mood: 0, grow: { g: '', r: '', o: '', w: '' } }; S.oneonones[oo.id] = oo; }); });
  toast(noFuture.length + ' 1:1s booked at model cadence. Use Auto-agenda on each before the session.', 'ok');
};
Actions['review-commit'] = () => {
  const focus = dailyBrief().focus.slice(0, 3).map(f => f.title + ' — ' + f.why).join('\n');
  openForm({
    title: 'Guided weekly review — commit the week', wide: true,
    intro: 'The engine assembled the numbers; now the judgement. Four fields, five minutes. This review writes to your journal and converts your top-3 into dated tasks.',
    fields: [
      { key: 'wins', label: 'Wins — what did the SYSTEM do well this week?', type: 'textarea' },
      { key: 'misses', label: 'Misses — what did you avoid, drop, or handle late?', type: 'textarea' },
      { key: 'avoided', label: 'The avoided conversation — name it (this is the most important field)', type: 'textarea', help: 'Every leader carries exactly one. Naming it weekly is how it stops compounding.' },
      { key: 'top3', label: 'Next week top-3 (one per line — engine suggestion prefilled, ratify or replace)', type: 'textarea', required: true, value: focus }
    ],
    submitLabel: 'Commit review', onSubmit: v => {
      mut(() => {
        const w0 = addDays(todayStr(), -7);
        S.reviews = S.reviews || {};
        const id = uid('rv');
        S.reviews[id] = { id, week: todayStr(), wins: v.wins, misses: v.misses, avoided: v.avoided, top3: v.top3 };

        S.journal[j.id] = j;
        v.top3.split('\n').map(s => s.trim()).filter(Boolean).slice(0, 3).forEach(line => {
          const t = { id: uid('t'), title: '★ Weekly top-3: ' + line.slice(0, 80), due: addDays(todayStr(), 5), done: false, source: 'weekly', caseId: null };
          S.tasks[t.id] = t;
        });
      });
      toast('Week committed: journal written, top-3 tasks dated ' + fmtDate(addDays(todayStr(), 5)) + '.', 'ok');
    }
  });
};

document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable) return;
  if (document.getElementById('modal-root').innerHTML) return;
  if (e.key === 'c' || e.key === 'C') { e.preventDefault(); openCaseIntake(); }
  const nums = { '1': '/today', '2': '/inbox', '3': '/cases', '4': '/people', '5': '/teams', '6': '/oneonones', '7': '/feedback', '8': '/decisions', '9': '/academy', '0': '/review' };

});
