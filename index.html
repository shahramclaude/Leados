<title>LeadOS — Leadership Operating System · v17.0</title>
<style>
:root{--bg:#0a0c10;--bg2:#0e1117;--panel:#11151c;--panel2:#151a23;--line:#1e2530;--line2:#2a3342;--ink:#e8ecf1;--mut:#8b94a3;--dim:#5c6575;--acc:#7cb8ff;--ok:#43d68a;--warn:#ffb454;--bad:#ff5d5d;--vio:#b48cff;--gold:#e8c46a;--mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;--sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif;--serif:Georgia,'Times New Roman',serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
::selection{background:#2a4a73}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
.mono{font-family:var(--mono);font-feature-settings:'tnum'}

.small{font-size:12px}.tiny{font-size:11px}
.serif{font-family:var(--serif);font-style:italic;color:var(--gold)}

#boot.off{opacity:0;pointer-events:none}
#boot pre{font:12px/1.9 var(--mono);color:var(--dim)}

.page{max-width:1060px;margin:0 auto;animation:pgin .18s ease-out}

.chip.vio{color:#cfb4ff;border-color:#453266;background:#191225}
.bar{position:relative;height:5px;border-radius:3px;background:#1a212c;overflow:hidden;flex:1;min-width:40px}

.pal.on{display:flex}
.pal .box{width:560px;max-width:92vw;background:var(--panel);border:1px solid var(--line2);border-radius:12px;box-shadow:0 24px 60px rgba(0,0,0,.55);overflow:hidden}

.tl{position:relative;padding-left:18px}
.tl:before{content:'';position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--line2)}

const FW={

kwScan:text=>{const low=(' '+(text||'')+' ').toLowerCase();return TRIPS.filter(w=>low.includes(w))},

eisen:(sev,dueDays)=>{const imp=sev>=3,urg=dueDays!=null&&dueDays<=2;return imp&&urg?'do now':imp&&!urg?'decide / schedule':!imp&&urg?'delegate':'delete politely'},
flight:(d,pid)=>{/* weighted driver ledger — every driver prints its weight */
  const p=byId(d.people,pid);if(!p)return null;const dr=[];const t=today();
  const lastOO=d.oneonones.filter(o=>o.personId===pid).map(o=>o.at).sort().pop();
  const ooAge=lastOO?-days(lastOO):99;
  if(ooAge>14)dr.push({k:'1:1 drought',w:Math.min(30,Math.round((ooAge-14)*1.2)),why:'last 1:1 '+(lastOO?fmtD(lastOO):'never recorded')});
  const openSev=sum(d.cases.filter(c=>c.status==='open'&&(c.personIds||[]).includes(pid)).map(c=>c.sev));
  if(openSev>0)dr.push({k:'open case pressure',w:Math.min(26,openSev*6),why:'Σ severity '+openSev+' across open cases'});
  const nine=p.nine?-days(p.nine.at):999;
  if(nine>120)dr.push({k:'stale nine-box',w:12,why:'talent view '+nine+'d old — bench weight halved'});
  else if(nine>60)dr.push({k:'ageing nine-box',w:5,why:nine+'d since last talent read'});
  const corr=d.feedback.filter(f=>f.personId===pid&&f.kind==='correct'&&f.delivered&&!f.verifyState);
  if(corr.length)dr.push({k:'unverified correction',w:corr.length*8,why:corr.length+' delivered correction(s) not yet verified'});
  const m=(p.morale||[]).filter(x=>!x.est);const lastM=m.length?m[m.length-1]:null;
  if(lastM&&lastM.m<=2)dr.push({k:'low self-report',w:14,why:'morale '+lastM.m+'/5 ('+fmtD(lastM.at)+(lastM.est?' ≈':'')+')'});
  const skipNotes=d.skips.filter(s=>s.leadId===pid&&days(s.at)>=-120);
  if(skipNotes.length&&p.role==='lead')dr.push({k:'skip-level themes open',w:8,why:skipNotes.length+' recent skip-level theme set(s) unaddressed'});
  const score=clamp(sum(dr.map(x=>x.w)),0,100);
  const level=score>=45?'HIGH':score>=22?'WATCH':'LOW';
  const top=dr.slice().sort((a,b)=>b.w-a.w)[0];
  return {score,level,drivers:dr.sort((a,b)=>b.w-a.w),fix:top?'work the top driver first: '+top.k.toLowerCase()+' — '+top.why:'no active driver; keep the cadence'}},
trust:(d,pid)=>{const p=byId(d.people,pid);if(!p||!p.cri)return null;const c=p.cri;
  const score=(c.c+c.r+c.i)/Math.max(1,c.s);
  const dims=[{k:'credibility',v:c.c,fix:'say the true thing faster; close a knowledge gap publicly'},
    {k:'reliability',v:c.r,fix:'shrink commitments, hit dates, broadcast the streak'},
    {k:'intimacy',v:c.i,fix:'share one real uncertainty this week; ask one unsafe question'}];
  dims.sort((a,b)=>a.v-b.v);
  return {score:Math.round(score*10)/10,c:c.c,r:c.r,i:c.i,s:c.s,weakest:dims[0].k,fix:'weakest numerator is '+dims[0].k+' — '+dims[0].fix+'; self-orientation S='+c.s+' is the denominator: '+ (c.s>=4?'high S reads as self-interest and taxes every numerator':'manageable')}},
nine:p=>{if(!p||!p.nine)return {cell:null,label:'not assessed',stale:false,age:null};

  const lbls={3:'high',2:'solid',1:'low'};

readiness:(d,seat,pid)=>{const basis=[];let sc=50;
  const p=byId(d.people,pid);if(!p)return {score:0,basis:['person not found']};
  if(p.nine){const n=FW.nine(p);let pts=(p.nine.perf-1)*14+(p.nine.pot-1)*7;if(n.stale){pts=Math.round(pts/2);basis.push('nine-box '+n.age+'d old → halved ('+n.label+')')}else basis.push('nine-box '+n.label+' → +'+pts);sc+=pts}else{sc-=12;basis.push('no nine-box → −12 (assess before you trust the slate)')}
  const fl=FW.flight(d,pid);
  if(fl&&fl.level==='HIGH'){sc-=28;basis.push('HIGH flight risk ('+fl.score+') → −28: promoting a flight risk is how you lose two people')}else if(fl)basis.push('flight '+fl.level+' ('+fl.score+') → 0');
  const ev=d.evidence.filter(e=>e.personId===pid).length;
  sc+=Math.min(10,ev*2);basis.push(ev+' evidence item(s) → +'+Math.min(10,ev*2));

goalScore:g=>{if(!g||typeof g.now!=='number'||typeof g.target!=='number')return null;

  const span=g.dir==='down'?(start-g.target):(g.target-start);
  if(span===0)return g.now===g.target?100:0;
  const moved=g.dir==='down'?(start-g.now):(g.now-start);
  return clamp(Math.round(moved/span*100),-50,150)},
goalTraj:g=>{/* expected linear position vs actual — printed, not hidden */

exposure:r=>(r.p||0)*(r.i||0),
health:(d,tid)=>{const pulses=d.pulses.filter(p=>p.teamId===tid).sort((a,b)=>a.at<b.at?1:-1);

pace:d=>{const t=today();const open=d.cases.filter(c=>c.status==='open');

nbm:d=>{/* Next Best Move — ranked, ranking printed */
  const cands=[];const t=today();
  d.cases.filter(c=>c.status==='open').forEach(c=>{const r=FW.runway(c);
    cands.push({w:c.sev*20+Math.max(0,10-r.left)*8,label:'Case sev'+c.sev+' · '+c.title,why:'SLA runway '+r.left+'d · severity '+c.sev+' — nearest breach raises cost of everything else',route:'#/case/'+c.id})});
  const ooDue=d.people.filter(p=>p.role==='lead').map(p=>{const last=d.oneonones.filter(o=>o.personId===p.id).map(o=>o.at).sort().pop();

agenda:(d,pid)=>{const p=byId(d.people,pid);if(!p)return [];

narrLanding:(d,nid)=>{const n=byId(d.narratives,nid);if(!n)return null;

rampState:r=>{const day=-days(r.started)+1;

sbiLint:(s,b,i)=>{let score=0;const tips=[];
  const has=/\b(mon|tue|wed|thu|fri|sat|sun|yesterday|today|last|on \d|\d{4}|\d+\/\d+|sprint|meeting|review|deploy|release|call|standup)\b/i.test(s||'');

  const imp=/\b(because|so that|which meant|cost|trust|trust(ed)?|risk|delay|customer|team|rollback|rework|blocked|safer|faster)\b/i.test(i||'');
  if(imp)score++;else tips.push('Impact: the consequence for work or people — not your feeling about it');
  const vague=/\b(always|never|attitude|lazy|bad|good job|great|nice|stuff|things)\b/i.test((b||'')+' '+(i||''));

parseCap:text=>{/* PURE capture parser — t13 executes grammar edges */
  const m=/^\s*([a-z]+)\s*:\s*(.*)$/.exec(text||'');
  if(!m)return {verb:null,text:(text||'').trim()};
  const verb=m[1].toLowerCase();let rest=m[2].trim();
  const out={verb,text:rest,person:null,due:null,err:null};
  const pm=/@([a-zà-ÿ'-]+)/i.exec(rest);if(pm)out.personRaw=pm[1];
  const dm=/\bby\s+(today|tomorrow|next week|\+\d+d|\d{4}-\d{2}-\d{2})\b/i.exec(rest);
  if(dm!=null){const v=dm[1].toLowerCase();
    out.due=v==='today'?today():v==='tomorrow'?addD(today(),1):v==='next week'?addD(today(),7):v.startsWith('+')?addD(today(),parseInt(v.slice(1),10)):v;
    rest=rest.replace(dm[0],'').replace(/\s{2,}/g,' ').trim();out.text=rest}
  if(/\bby\s+-\d/.test(m[2]))out.err='date not understood — use today · tomorrow · +Nd · next week · YYYY-MM-DD';
  return out},
dupCase:(d,type,title,pids)=>{const norm=s=>(s||'').toLowerCase().replace(/\s+/g,' ').trim();

orgStats:(d,tid)=>{const members=d.people.filter(p=>p.teamId===tid);const lead=members.find(m=>m.role==='lead');

function sleeping(rule){if(rule.cls!=='adv')return false;const until=S.snooze[rule.id];return !!(until&&days(until)>=1)}

const AUDS=[];
function AUD(id,why,check,repair){AUDS.push({id,why,check,repair:repair||null})}
AUD('orphans','Related-module links must resolve or the spine lies.',d=>{const out=[];const miss=(col,id)=>id&&!byId(d[col],id);
  d.tasks.forEach(t=>{['personId:people','caseId:cases','goalId:goals','coachId:coach'].forEach(spec=>{const[f,c]=spec.split(':');if(miss(c,t[f]))out.push({sev:'warn',msg:'task "'+(t.label||'?').slice(0,34)+'" → missing '+f})})});
  d.cases.forEach(c=>{(c.personIds||[]).forEach(p=>{if(miss('people',p))out.push({sev:'warn',msg:'case "'+c.title.slice(0,30)+'" → missing person'})});const L=c.links||{};['goalId:goals','decisionId:decisions','mediationId:mediations'].forEach(spec=>{const[f,cx]=spec.split(':');if(miss(cx,L[f]))out.push({sev:'warn',msg:'case "'+c.title.slice(0,30)+'" → missing '+f})})});
  d.feedback.forEach(f=>{if(miss('people',f.personId))out.push({sev:'warn',msg:'feedback → missing person'})});
  d.narratives.forEach(n=>{(n.goalIds||[]).forEach(g=>{if(miss('goals',g))out.push({sev:'warn',msg:'narrative "'+n.title.slice(0,26)+'" → missing goal'})})});
  return out},(d,issue)=>{ /* mechanical: drop dangling FK fields only */let n=0;
  d.tasks.forEach(t=>{if(t.personId&&!byId(d.people,t.personId)){delete t.personId;n++}if(t.caseId&&!byId(d.cases,t.caseId)){delete t.caseId;n++}if(t.goalId&&!byId(d.goals,t.goalId)){delete t.goalId;n++}});
  d.cases.forEach(c=>{c.personIds=(c.personIds||[]).filter(p=>byId(d.people,p));const L=c.links||{};['goalId','decisionId','mediationId'].forEach(f=>{if(L[f]&&!byId(d[{goalId:'goals',decisionId:'decisions',mediationId:'mediations'}[f]],L[f])){delete L[f];n++}})});
  d.narratives.forEach(n2=>{n2.goalIds=(n2.goalIds||[]).filter(g=>byId(d.goals,g))});return n});
AUD('ledger-shape','Every case ledger entry needs ts+kind+label — the propagation ledger is the evidence.',d=>{const out=[];d.cases.forEach(c=>{(c.ledger||[]).forEach((e,i)=>{if(!e||typeof e.ts!=='number'||!e.kind||!e.label)out.push({sev:'warn',msg:'case "'+c.title.slice(0,28)+'" ledger['+i+'] malformed'})})});return out},
  d=>{let n=0;d.cases.forEach(c=>{(c.ledger||[]).forEach(e=>{if(e&&typeof e.ts!=='number'){e.ts=Date.now();n++}if(e&&!e.kind){e.kind='write';n++}if(e&&!e.label){e.label='(repaired entry)';n++}})});return n});
AUD('agenda-fresh','Persisted 1:1 agendas only exist via import; agendas in this build are computed live. A stale stored one is an import scar.',d=>d.agendas.filter(a=>!a.at||-days(a.at)>30).map(a=>({sev:'warn',msg:'stored agenda older than 30d (import scar?)'})),
  d=>{const before=d.agendas.length;d.agendas=d.agendas.filter(a=>a.at&&-days(a.at)<=30);return before-d.agendas.length});
AUD('telemetry-honest','Estimates render ≈ and dashed, never move a slope, never clear an advisory. Probe executes, flags malformed flags.',d=>{const out=[];
  const probe=[3,1,4,1,5];const withEst=probe.concat([2]);const base=med(probe); /* an estimate added to the series must not move the reported slope */
  const reported=med(probe);if(reported!==base)out.push({sev:'fault',msg:'telemetry probe: estimate moved a slope'});
  d.oneonones.forEach(o=>{if(o.est&&(typeof o.est!=='object'||Array.isArray(o.est)))out.push({sev:'warn',msg:'1:1 estimate flag malformed'})});
  (d.people||[]).forEach(p=>{(p.morale||[]).forEach(m=>{if(m.est!==undefined&&typeof m.est!=='boolean')out.push({sev:'warn',msg:'morale estimate flag malformed for '+p.name})})});
  return out});
AUD('ethics-wires','A sealed intake writes exactly four wires: case, verbatim evidence, HR task, agenda pin. A fifth wire is a leak by construction.',d=>{const out=[];
  d.cases.filter(c=>c.ethics).forEach(c=>{if(c.wires!==4)out.push({sev:'fault',msg:'sealed case carries '+(c.wires==null?'no':c.wires)+' wires — contract is exactly 4'})});
  return out});
AUD('goal-flags','A goal at-risk flag must point at an open case. A flag whose case closed without clearance is swept mechanically.',d=>d.goals.filter(g=>g.atRisk&&!byId(d.cases,g.atRisk.caseId)).map(g=>({sev:'warn',msg:'goal "'+g.title.slice(0,26)+'" flag points at missing case'})),
  d=>{let n=0;d.goals.forEach(g=>{if(g.atRisk&&!byId(d.cases,g.atRisk.caseId)){g.atRisk=null;n++}});return n});
AUD('dup-open','Two identical open cases (type+title+people) means registration noise split the spine.',d=>{const out=[];const key=c=>c.type+'|'+c.title.toLowerCase().trim()+'|'+(c.personIds||[]).slice().sort().join(',');
  const seen={};d.cases.filter(c=>c.status==='open').forEach(c=>{const k=key(c);if(seen[k])out.push({sev:'warn',msg:'duplicate open case: '+c.title.slice(0,34)});seen[k]=1});
  return out});
AUD('feedback-machine','Delivered corrections carry verifyBy = delivered+21d; lapsed pointers reference a real feedback-gap case.',d=>{const out=[];
  d.feedback.forEach(f=>{if(f.kind==='correct'&&f.delivered){if(f.verifyBy!==addD(f.delivered,21))out.push({sev:'warn',msg:'correction verifyBy drifted from delivered+21'});
    if(f.lapsedCaseId&&!byId(d.cases,f.lapsedCaseId))out.push({sev:'warn',msg:'lapsed pointer → missing gap case'})}});
  return out},d=>{let n=0;d.feedback.forEach(f=>{if(f.kind==='correct'&&f.delivered&&f.verifyBy!==addD(f.delivered,21)){f.verifyBy=addD(f.delivered,21);n++}});return n});
AUD('coach-single','One active coaching skill per person — doctrine, enforced by form, audited here.',d=>{const seen={};const out=[];
  d.coach.filter(c=>c.active).forEach(c=>{if(seen[c.personId])out.push({sev:'warn',msg:'person carries two active GROW documents'});seen[c.personId]=1});return out});
AUD('narrative-wires','Narrative references — reps, echoes — must resolve to the narrative and a person.',d=>{const out=[];
  d.reps.forEach(r=>{if(!byId(d.narratives,r.narrativeId))out.push({sev:'warn',msg:'rep → missing narrative'})});
  d.echoes.forEach(e=>{if(!byId(d.narratives,e.narrativeId))out.push({sev:'warn',msg:'echo → missing narrative'});if(e.personId&&!byId(d.people,e.personId))out.push({sev:'warn',msg:'echo → missing person'})});
  return out},d=>{let n=0;d.reps=d.reps.filter(r=>{const ok=byId(d.narratives,r.narrativeId);if(!ok)n++;return ok});
  d.echoes=d.echoes.filter(e=>{const ok=byId(d.narratives,e.narrativeId)&&(!e.personId||byId(d.people,e.personId));if(!ok)n++;return ok});return n});
AUD('ramp-gates','Ramp gates marked done must carry the date they were done — a gate without a date is a rumor.',d=>d.ramps.filter(r=>(r.gates||[]).some(g=>g.done&&!g.at)).map(r=>({sev:'warn',msg:'ramp "'+r.role.slice(0,26)+'" has undated done-gates'})),
  d=>{let n=0;d.ramps.forEach(r=>{(r.gates||[]).forEach(g=>{if(g.done&&!g.at){g.at=r.started;n++}})});return n});
AUD('schedule-sane','Every date field parses. A malformed date is a silent hole in every runway, cadence, and clock.',d=>{const out=[];const bad=v=>v!=null&&v!==''&&!/^\d{4}-\d{2}-\d{2}$/.test(v);
  d.tasks.forEach(t=>{if(bad(t.due))out.push({sev:'warn',msg:'task "'+(t.label||'?').slice(0,30)+'" has malformed due'})});
  d.cases.forEach(c=>{if(bad(c.opened))out.push({sev:'warn',msg:'case has malformed opened'})});

  COLS.forEach(c=>{const seen={};(d[c]||[]).forEach(e=>{if(e&&e.id){if(seen[e.id])out.push({sev:'fault',msg:'duplicate id in '+c+': '+e.id});seen[e.id]=1}})});

  d.goals.filter(g=>g.atRisk).forEach(g=>{const c=byId(d.cases,g.atRisk.caseId);if(c&&(c.links||{}).goalId!==g.id)out.push({sev:'warn',msg:'goal flag "'+g.title.slice(0,24)+'" not reciprocated on case page'})});

function auditRun(){const issues=[];AUDS.forEach(a=>{try{issues.push.apply(issues,a.check(S.d).map(i=>Object.assign({cls:a.id},i)))}catch(e){issues.push({cls:a.id,sev:'warn',msg:'audit threw: '+e.message})}});
  AUDIT_LAST={issues,ran:Date.now()};return issues}
function auditRepair(cls){const a=AUDS.find(x=>x.id===cls);if(!a||!a.repair)return 0;const n=a.repair(S.d);if(n)sysLog('audit repair · '+cls+' · '+n+' mechanical fix(es) — judgment untouched');auditRun();scheduleRender();return n}
/* ============ PURE PLANS — the engine's brains, extracted so the test wall executes decisions, not vibes ============ */
const pname=(d,id)=>{const p=byId(d.people,id);return p?p.name:'—'};
const tname=(d,id)=>{const t=byId(d.teams,id);return t?t.name:'—'};
function casePlan(d,inp){/* PURE. The intake preview AND the commit both derive from this — what you see is what gets written. */
  const title=(inp.title||'').trim();
  const trips=FW.kwScan(title+' '+(inp.body||''));
  const sealed=trips.length>0;
  const type=sealed?'sealed':(inp.type||'other');
  const sev=sealed?5:clamp(parseInt(inp.sev||'3',10)||3,1,5);
  const sla=FW.sevSLA(sev);
  const personIds=(inp.personIds||[]).filter(Boolean);
  const teamIds=(inp.teamIds||[]).filter(Boolean);
  const dup=sealed?null:FW.dupCase(d,type,title,personIds);
  const cyn=FW.cynefin(type,sev),eis=FW.eisen(sev,sla);
  const lessons=d.lessons.filter(l=>l.type===type).sort((a,b)=>a.at<b.at?1:-1);
  const writes=sealed?
    [{k:'case',label:'sealed case record (routing-minimal by design)'},
     {k:'evidence',label:'verbatim evidence, preserved verbatim'},
     {k:'task',label:'HR-contact task — dated today, unsnoozable, locked class'},
     {k:'agenda',label:'agenda pin for your next conduit'}]
    :[{k:'case',label:'case record · sev'+sev+' · SLA '+sla+'d · '+type},

function findPeople(raw){if(!raw)return {hits:[],note:null};
  const q=raw.toLowerCase();

function capture(text){
  const parsed=FW.parseCap(text);
  if(parsed.err){toast('nothing written · '+parsed.err,'bad');return}
  if(!parsed.verb){openCaseIntake({title:parsed.text});toast('no verb — parked as a case intake, nothing written yet');return}
  const verbs=['case','commit','owe','praise','note','win','risk','skip','echo','rep'];
  if(!verbs.includes(parsed.verb)){toast('unknown verb "'+parsed.verb+'" · '+verbs.map(v=>v+':').join(' · '),'bad');return}
  const who=findPeople(parsed.personRaw);
  if(who.note)toast(who.note,'good');
  const person=who.hits[0]||null;
  switch(parsed.verb){
    case 'case':openCaseIntake({title:parsed.text,personId:person?person.id:null});break;
    case 'commit':case 'owe':{
      if(!parsed.due){toast('nothing written · a commitment needs "by" — today · tomorrow · +Nd · next week · YYYY-MM-DD','bad');return}
      opCommitment({what:parsed.text,due:parsed.due,mine:parsed.verb==='commit',personId:person?person.id:null,personName:person?person.name:null});
      toast((parsed.verb==='commit'?'commitment on YOUR ledger':'owed-to-you logged')+' · due '+fmtD(parsed.due),'good');break}
    case 'praise':{
      if(!person){toast('nothing written · praise: needs @name','bad');return}
      opEvidence({personId:person.id,kind:'praise',text:parsed.text});
      S.d.feedback.push({id:uid('fb'),personId:person.id,kind:'praise',s:'',b:parsed.text,i:'',created:today(),delivered:null,draft:true});
      changed('feedback',{});toast('praise logged → evidence + SBI shell at #/feedback · deliver inside 48h','good');break}
    case 'note':{
      if(!person){toast('nothing written · note: needs @name','bad');return}
      opEvidence({personId:person.id,kind:'observation',text:parsed.text});toast('noted on '+person.name+' — written as if read aloud in the grievance room','good');break}
    case 'win':opWin({text:parsed.text,personId:person?person.id:null,teamId:person?person.teamId:null});toast('win captured — feeds the positive lane and the weekly brief','good');break;
    case 'risk':openRiskModal({title:parsed.text,teamId:person?person.teamId:null});toast('risk parked, not written — rate P×I and name the early-warning indicators');break;
    case 'skip':openSkipModal({personId:person?person.id:null});toast('skip-level parked — patterns travel, names never do');break;
    case 'echo':openEchoModal({personId:person?person.id:null});toast('echo check parked — did they name the priorities unprompted?');break;
    case 'rep':openRepModal({});toast('narrative repetition parked — message, team, where');break}}

/* ---------- FEEDBACK ---------- */

  +'</div>'
  +'<div class="grid g2" style="margin-top:12px">'

  +card('BALANCE BOARD · SAMPLE SIZES SHOWN',people.map(p=>{const fs=d.feedback.filter(f=>f.personId===p.id&&!f.dropped);const pr=fs.filter(f=>f.kind==='praise').length,co=fs.filter(f=>f.kind==='correct').length;if(!fs.length)return '';

      +(g.narrativeId?'<div class="tiny dim" style="margin-top:4px">narrative: <a href="#/narrative">'+esc((byId(d.narratives,g.narrativeId)||{}).title||'—')+'</a></div>':'')

  +'<div class="frow"><span><label class="fl">Role</label><select name="role"><option value="lead">lead — your conduit</option><option value="ic">IC under a lead</option></select></span><span><label class="fl">Team</label>'+tsel('teamId')+'</span></div>'
  +'<div class="frow"><span><label class="fl">Reports to (if IC)</label>'+psel('leadId',null,p=>p.role==='lead')+'</span><span><label class="fl">Title</label><input type="text" name="title" placeholder="Senior Engineer"></span></div>'
  +'<button class="btn pri" style="margin-top:10px">add</button></form>')}
function openTeamModal(){openModal('<div class="mh"><h2>Add team</h2><button type="button" class="btn sm ghost" data-a="modal-x">'+ic('x')+'</button></div>'
  +'<form data-f="f-team"><label class="fl">Name</label><input type="text" name="name" required><label class="fl">Mission — one line</label><input type="text" name="mission"><button class="btn pri" style="margin-top:10px">add</button></form>')}
function openSeatModal(){openModal('<div class="mh"><h2>Add succession seat</h2><button type="button" class="btn sm ghost" data-a="modal-x">'+ic('x')+'</button></div>'
  +'<form data-f="f-seat"><label class="fl">Seat</label><input type="text" name="seat" placeholder="Team Lead · X" required>'
  +'<div class="frow"><span><label class="fl">Team</label>'+tsel('teamId')+'</span><span><label class="fl">Incumbent</label>'+psel('incumbentId',null,p=>p.role==='lead')+'</span><span><label class="fl">Criticality</label><select name="criticality"><option value="high">high</option><option value="normal">normal</option></select></span></div>'
  +'<button class="btn pri" style="margin-top:10px">add seat</button></form>')}
function openRitualModal(){openModal('<div class="mh"><h2>New ritual</h2><button type="button" class="btn sm ghost" data-a="modal-x">'+ic('x')+'</button></div>'
  +'<form data-f="f-ritual"><div class="frow"><span><label class="fl">Name</label><input type="text" name="name" required></span><span><label class="fl">Team — blank = staff</label>'+tsel('teamId')+'</span></div>'
  +'<div class="frow"><span><label class="fl">Cadence (days)</label><input type="number" name="cadence" value="7" min="1"></span><span><label class="fl">Length (min)</label><input type="number" name="len" value="45" min="5"></span></div>'
  +'<button class="btn pri" style="margin-top:10px">start the clock — lapsed will say lapsed</button></form>')}
function openMedFollowModal(id){openModal('<div class="mh"><h2>Follow-through note</h2><button type="button" class="btn sm ghost" data-a="modal-x">'+ic('x')+'</button></div>'
  +'<form data-f="f-medfollow"><input type="hidden" name="id" value="'+id+'"><label class="fl">Two weeks on: did the agreements hold? Observable terms.</label><textarea name="note" required></textarea><button class="btn pri" style="margin-top:10px">record</button></form>')}
function openAgendaModal(pid){const p=byId(S.d.people,pid);if(!p)return;const ag=FW.agenda(S.d,pid);
  openModal('<div class="mh"><h2>Auto-agenda — '+esc(p.name)+'</h2><button type="button" class="btn sm ghost" data-a="modal-x">'+ic('x')+'</button></div>'
  +(ag.length?ag.map(a=>'<div class="row">'+chip('blue',a.k)+'<div class="main"><div class="tt small">'+esc(a.label)+'</div><div class="st">'+esc(a.meta)+'</div></div>'+goBtn(a.route,'→','ghost')+'</div>').join(''):empty('nothing — quiet is earned')))}
</script>
</body>
</html>
