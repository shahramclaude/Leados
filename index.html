<script>
/* ======================================================================

// toggleable "signal board" — original to this build
const SIGNAL_DEFS = [

  {rule:'R4', sev:3,personId:'p3',active:true},
  {rule:'R73',sev:3,personId:null,active:false},
  {rule:'R7', sev:4,personId:'p2',active:false},
  {rule:'R1', sev:4,personId:'p1',active:false},
  {rule:'R19',sev:5,personId:'p6',active:false},
  {rule:'R20',sev:5,personId:null,active:false},
  {rule:'R103',sev:5,personId:null,active:false},
  {rule:'R104',sev:4,personId:null,active:false},
  {rule:'R17',sev:3,personId:null,active:false},
  {rule:'R74',sev:4,personId:null,active:false},
  {rule:'R14',sev:3,personId:null,active:false},
  {rule:'R88',sev:4,personId:null,active:false},
  {rule:'R39',sev:3,personId:null,active:false},
  {rule:'R62',sev:3,personId:null,active:false},
  {rule:'R125',sev:5,personId:null,active:false},
  {rule:'R129',sev:4,personId:'p6',active:false},
  {rule:'R145',sev:3,personId:null,active:false},
  {rule:'R157',sev:4,personId:null,active:false}
];

const STATE = {
  hour: new Date().getHours(),
  fatigue: 20,
  runwayMonths: 9,
  boardSoon: false,
  sprintDue: false,
  signals: JSON.parse(JSON.stringify(SIGNAL_DEFS)),
  sessionStart: Date.now()
};

function synthP(){
  return {
    people: PEOPLE,
    state: { events: [] }, // kept for shape-compatibility with the pasted spec's P.state.events reads
    openDecisions: [
      {id:'d1', title:'Approve Q3 pricing change', stakes:5},

}
const today = () => new Date().toISOString();

/* ======================================================================
   NAMESPACE
   ====================================================================== */
const LEADOS = {};

/* ---------- tiny infra stubs the pasted spec assumes exist ---------- */
LEADOS.store = {
  _audit: [],
  auditLive(type, detail){
    this._audit.unshift({ts:new Date().toLocaleTimeString(), type, detail});
    if(this._audit.length>200) this._audit.length = 200;
    if(document.getElementById('route-audit')?.classList.contains('hidden')===false) renderAudit();

};
LEADOS.haptics = { onEvent(name){ if(navigator.vibrate) try{navigator.vibrate(name.includes('critical')?[40,30,40]:15);}catch(e){} } };
LEADOS.ui = {
  toast(title, kind='info', action=null){
    const stack = document.getElementById('toast-stack');
    const el = document.createElement('div');
    const color = kind==='critical' ? 'border-red-600 bg-red-950/80' : kind==='warn' ? 'border-amber-600 bg-amber-950/60' : 'border-slate-700 bg-slate-900/90';
    el.className = `toast-enter border ${color} rounded-lg px-3 py-2 text-xs shadow-xl cursor-pointer`;
    el.innerHTML = `<div class="font-medium text-slate-100">${title}</div>${action?`<div class="text-[10px] text-indigo-400 mt-1">↳ ${action.type||''}</div>`:''}`;
    el.onclick = ()=>{ el.remove(); if(action) executeAction(action); };
    stack.prepend(el);
    setTimeout(()=>el.remove(), 7000);
  },
  showBanner(n){
    const b = document.getElementById('situation-banner');
    const old = b.dataset.forced;
    b.dataset.forced = '1';
    b.classList.remove('hidden');
    b.innerHTML = `<div class="flex items-center gap-2"><span class="dot" style="--dc:#ef4444"></span><b>${n.title}</b><span class="text-slate-500">— ${n.why||''}</span></div>
      <button class="text-slate-500 hover:text-slate-200" onclick="this.parentElement.dataset.forced='';renderToday();">dismiss</button>`;
  },
  updateBadge(){ updateNotifBadge(); }
};
LEADOS.signals = { enqueue(n){
  const card = document.getElementById('interrupt-card');
  card.innerHTML = `<div class="text-red-400 text-xs uppercase tracking-wide mb-1">Critical — requires response</div>
    <div class="text-lg font-semibold mb-2">${n.title}</div>

    <div class="flex gap-2">
      <button id="interrupt-ack" class="px-3 py-1.5 bg-red-600 hover:bg-red-500 rounded text-xs font-medium">Acknowledge & open</button>
      <button id="interrupt-snooze" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 rounded text-xs">Snooze 15m</button>
    </div>`;
  document.getElementById('interrupt-overlay').classList.remove('hidden');
  document.getElementById('interrupt-ack').onclick = ()=>{ document.getElementById('interrupt-overlay').classList.add('hidden'); if(n.action) executeAction(n.action); };
  document.getElementById('interrupt-snooze').onclick = ()=>{ document.getElementById('interrupt-overlay').classList.add('hidden'); LEADOS.notifications._snoozed.set(n.id, new Date(Date.now()+15*60000).toISOString()); };
}};
LEADOS.workQueue = {
  _items: [
    {id:'w1', type:'board.narrative.draft', title:'Board narrative draft — Q3', reviewed:false},
    {id:'w2', type:'risk.register.export', title:'Risk register export (8 domains)', reviewed:false}
  ],
  pending(){ return this._items.filter(i=>!i.reviewed); },
  markReviewed(id){ const it=this._items.find(i=>i.id===id); if(it) it.reviewed=true; }

LEADOS.flightRisk = { computeFlightRisk(P){
  const highRisk = P.people.filter(p=>p.riskScore>=0.6).map(p=>({person:p, riskScore:p.riskScore}));
  return { highRisk };
}};
LEADOS.finIntel = { runwayStatus(){ return { runway_months: STATE.runwayMonths }; } };
LEADOS.predict = { buildPrefireCalendar(){
  const items = [
    {key:'okr-review', title:'Quarterly OKR review', daysUntil:2},

}};
LEADOS.autonomous = { runWorkflows(){ return { cascade: [] }; } };

/* ---------- circadian / fatigue (illustrative heuristics, NOT validated) ---------- */
LEADOS.circadian = {
  getCurrentProfile(){
    const h = STATE.hour;
    if(h>=7 && h<12) return {name:'Morning analytical peak', analytical:0.92, best_for:'high-stakes analysis'};
    if(h>=12 && h<14) return {name:'Post-lunch dip', analytical:0.45, best_for:'low-stakes admin'};
    if(h>=14 && h<18) return {name:'Afternoon execution window', analytical:0.68, best_for:'execution & 1:1s'};
    if(h>=18 && h<21) return {name:'Evening wind-down', analytical:0.5, best_for:'reflection & planning'};
    return {name:'Low-capacity window', analytical:0.3, best_for:'deferral'};
  },
  label:'Illustrative circadian bands — not a validated chronobiology model.'
};
LEADOS.fatigue = { get sessionFatigue(){ return STATE.fatigue; } };

/* ---------- minimal "engine" producing findings from the signal board ---------- */
LEADOS.engine = { run(P, t){
  const findings = STATE.signals.filter(s=>s.active).map(s=>{
    const rule = RULES[s.rule];
    const key = s.rule + (s.personId?(':'+s.personId):'');
    return {
      key, rule:s.rule, domain:rule.domain, sev:s.sev, title:rule.title,
      personId:s.personId, score: s.sev*10 + (s.personId?2:0)
    };
  });
  return { findings };
}, _days(a,b){ return Math.round((new Date(b)-new Date(a))/864e5); } };

/* ======================================================================
   PART 1 — ATTENTION MODELING ENGINE  (kept close to the pasted spec)
   ====================================================================== */
LEADOS.attention = {
  _heatmap: new Map(),
  _tracking: false,
  _currentEntry: null,
  _entryStart: null,
  startTracking(){
    if(this._tracking) return;
    this._tracking = true;
    document.addEventListener('pointerenter', (e)=>{
      const key = this._elementKey(e.target);
      if(!key) return;
      this._currentEntry = key; this._entryStart = Date.now();
      if(!this._heatmap.has(key)) this._heatmap.set(key, {totalDwellMs:0, enterCount:0, clickCount:0});
      this._heatmap.get(key).enterCount++;
    }, {passive:true, capture:true});
    document.addEventListener('pointerleave', (e)=>{
      if(!this._currentEntry || !this._entryStart) return;
      const dwellMs = Date.now() - this._entryStart;
      if(dwellMs > 200){
        const entry = this._heatmap.get(this._currentEntry);
        if(entry) entry.totalDwellMs += dwellMs;
      }
      this._currentEntry = null; this._entryStart = null;
    }, {passive:true, capture:true});
    document.addEventListener('click', (e)=>{
      const key = this._elementKey(e.target);
      if(!key) return;
      if(!this._heatmap.has(key)) this._heatmap.set(key, {totalDwellMs:0, enterCount:0, clickCount:0});
      this._heatmap.get(key).clickCount++;
      this._persistHeatmap();
    }, {passive:true});
  },
  _elementKey(el){
    if(!el || !el.closest) return null;
    const fin = el.closest('[data-key]'); if(fin) return 'finding:'+fin.dataset.key;
    const rule = el.closest('[data-rule]'); if(rule) return 'rule:'+rule.dataset.rule;
    const person = el.closest('[data-person-id]'); if(person) return 'person:'+person.dataset.personId;
    const navItem = el.closest('[data-route]'); if(navItem) return 'nav:'+navItem.dataset.route;
    const play = el.closest('[data-play-id]'); if(play) return 'playbook:'+play.dataset.playId;
    return null;
  },
  getAttentionScores(){
    const scores = {};
    this._heatmap.forEach((data,key)=>{
      const score = (data.clickCount*10) + (data.totalDwellMs/1000*2) + (data.enterCount*0.5);
      scores[key] = {...data, score};
    });
    return scores;
  },
  getCurrentFocus(){
    const scores = this.getAttentionScores();
    if(!Object.keys(scores).length) return null;
    const top = Object.entries(scores).sort(([,a],[,b])=>b.score-a.score)[0];
    return {key:top[0], type:top[0].split(':')[0], id:top[0].split(':')[1], score:top[1].score, dwellSeconds:Math.round(top[1].totalDwellMs/1000)};
  },
  getIgnoredFindings(all){
    const scores = this.getAttentionScores();
    return all.filter(f=>{ const s = scores['finding:'+f.key]; return !s || s.totalDwellMs < 5000; });
  },
  _persistHeatmap(){
    try{ sessionStorage.setItem('leados:attention', JSON.stringify(Object.fromEntries(this._heatmap.entries()))); }catch(e){}
  },
  restore(){
    const stored = sessionStorage.getItem('leados:attention');
    if(!stored) return;
    try{ Object.entries(JSON.parse(stored)).forEach(([k,v])=>this._heatmap.set(k,v)); }catch(e){}
  }
};

/* ======================================================================
   PART 2 — GENERATIVE LAYOUT ENGINE (kept close to the pasted spec;
   applyLayout extended with a content renderer, which the spec itself
   never defines — disclosed as a necessary addition)
   ====================================================================== */
LEADOS.layout = {
  generateLayout(findings, P, t, viewport, attentionScores){
    const situation = this._classifySituation(findings, P, t);
    const hierarchy = this._computeInformationHierarchy(findings, situation, attentionScores);
    const layout = this._solveLayout(hierarchy, viewport, situation);
    return {
      situation, hierarchy, layout,
      cssSpec: this._generateCSSSpec(layout, situation),
      domSpec: this._generateDOMSpec(hierarchy, layout),
      label: 'Generative layout from information situation analysis. Situation: '+situation.type+'. Density: '+situation.density+'.'
    };
  },
  _classifySituation(findings, P, t){
    const sev5 = findings.filter(f=>f.sev===5);
    const circadian = LEADOS.circadian.getCurrentProfile(t);
    const fatigue = LEADOS.fatigue.sessionFatigue;
    const hour = STATE.hour;
    if(sev5.length>=2) return {type:'MULTI_CRISIS', density:'MAXIMUM', description:'Multiple simultaneous critical findings — war-room layout', layoutMode:'GRID_2_CRISIS'};
    if(sev5.length===1) return {type:'SINGLE_CRISIS', density:'HIGH', description:'One critical finding dominates — focused response layout', layoutMode:'HERO_CRISIS'};
    if(STATE.boardSoon) return {type:'BOARD_PREP', density:'STRUCTURED', description:'Board meeting approaching — narrative preparation layout', layoutMode:'BOARD_PREP_SPLIT'};
    if(STATE.sprintDue) return {type:'SPRINT_CLOSE', density:'OPERATIONAL', description:'Sprint closing — execution accountability layout', layoutMode:'SPRINT_ACCOUNTABILITY'};
    if(hour>=7 && hour<12 && circadian.analytical>=0.9) return {type:'DEEP_WORK', density:'MAXIMUM', description:'Morning peak — full intelligence surface', layoutMode:'ANALYTICS_FULL'};
    if(fatigue>=60) return {type:'FATIGUE_REDUCED', density:'MINIMUM', description:'High decision fatigue — essentials only layout', layoutMode:'SIMPLIFIED'};
    return {type:'STANDARD', density:'STANDARD', description:'Standard leadership view', layoutMode:'STANDARD_SPLIT'};
  },
  _computeInformationHierarchy(findings, situation, attentionScores){
    const ranked = findings.map(f=>{
      const attention = attentionScores['finding:'+f.key];
      const attentionDeficit = attention ? Math.max(0, f.score - attention.score/10) : f.score;
      const situationRelevance = (situation.type==='BOARD_PREP' && ['R103','R104','R88','R39'].includes(f.rule)) ? 2 :
        (situation.type==='SPRINT_CLOSE' && ['R73','R74','R75','R81'].includes(f.rule)) ? 2 : 1;
      return {finding:f, hierarchyScore: attentionDeficit*situationRelevance, zone:this._assignZone(f, situation)};
    }).sort((a,b)=>b.hierarchyScore-a.hierarchyScore);
    return {
      primary: ranked.filter(r=>r.zone==='PRIMARY').slice(0,3),
      secondary: ranked.filter(r=>r.zone==='SECONDARY').slice(0,6),
      ambient: ranked.filter(r=>r.zone==='AMBIENT'),
      all: ranked
    };
  },
  _assignZone(f, situation){
    if(f.sev>=5) return 'PRIMARY';
    if(f.sev>=4) return situation.type==='SINGLE_CRISIS' ? 'SECONDARY' : 'PRIMARY';
    if(f.sev>=3) return 'SECONDARY';
    return 'AMBIENT';
  },
  _solveLayout(hierarchy, viewport, situation){
    const {width:w, height:h} = viewport;
    const solvers = {
      HERO_CRISIS: () => ({
        hero:{x:0,y:0,w:w,h:Math.round(h*0.42),content:'crisis-card', finding:hierarchy.primary[0]?.finding},
        secondary:{x:0,y:Math.round(h*0.42),w:Math.round(w*0.6),h:Math.round(h*0.58),content:'finding-list'},
        panel:{x:Math.round(w*0.6),y:Math.round(h*0.42),w:w-Math.round(w*0.6),h:Math.round(h*0.58),content:'playbook-ready'}
      }),
      GRID_2_CRISIS: () => ({
        crisis1:{x:0,y:0,w:Math.round(w*0.5),h:Math.round(h*0.5),content:'crisis-card', finding:hierarchy.primary[0]?.finding},
        crisis2:{x:Math.round(w*0.5),y:0,w:w-Math.round(w*0.5),h:Math.round(h*0.5),content:'crisis-card', finding:hierarchy.primary[1]?.finding},
        triage:{x:0,y:Math.round(h*0.5),w:w,h:h-Math.round(h*0.5),content:'finding-triage'}
      }),
      BOARD_PREP_SPLIT: () => ({
        narrative:{x:0,y:0,w:Math.round(w*0.55),h:h,content:'board-narrative-builder'},
        risk:{x:Math.round(w*0.55),y:0,w:w-Math.round(w*0.55),h:Math.round(h*0.5),content:'risk-register'},
        synthesis:{x:Math.round(w*0.55),y:Math.round(h*0.5),w:w-Math.round(w*0.55),h:h-Math.round(h*0.5),content:'synthesis-paragraph'}
      }),
      SPRINT_ACCOUNTABILITY: () => ({
        exec:{x:0,y:0,w:Math.round(w*0.6),h:h,content:'finding-list-full'},
        actions:{x:Math.round(w*0.6),y:0,w:w-Math.round(w*0.6),h:h,content:'action-queue'}
      }),
      ANALYTICS_FULL: () => ({
        intel:{x:0,y:0,w:Math.round(w*0.32),h:h,content:'intelligence-digest'},
        findings:{x:Math.round(w*0.32),y:0,w:Math.round(w*0.38),h:h,content:'finding-list-full'},
        inference:{x:Math.round(w*0.7),y:0,w:w-Math.round(w*0.7),h:h,content:'inference-panel'}
      }),
      SIMPLIFIED: () => ({
        three:{x:0,y:0,w:w,h:Math.round(h*0.4),content:'the-three-only'},
        actions:{x:0,y:Math.round(h*0.4),w:w,h:h-Math.round(h*0.4),content:'action-queue'}
      }),
      STANDARD_SPLIT: () => ({
        rail:{x:0,y:0,w:0,h:h,content:'nav-rail'},
        main:{x:0,y:0,w:Math.round(w*0.56),h:h,content:'today-finding-list'},
        panel:{x:Math.round(w*0.56),y:0,w:w-Math.round(w*0.56),h:h,content:'intelligence-panel'}
      })
    };
    return (solvers[situation.layoutMode] || solvers.STANDARD_SPLIT)();
  },
  _generateCSSSpec(layout, situation){
    let css = `/* GENERATIVE LAYOUT: ${situation.type} */\n/* Generated ${new Date().toISOString()} */\n/* ${situation.description} */\n\n`;
    Object.entries(layout).forEach(([zone,g])=>{
      css += `[data-zone="${zone}"] { position:absolute; left:${g.x}px; top:${g.y}px; width:${g.w}px; height:${g.h}px; }\n`;
    });
    return css;
  },
  _generateDOMSpec(hierarchy, layout){
    return Object.entries(layout).map(([zone,g])=>({
      zone, content:g.content, finding:g.finding||null,
      className: 'zone zone-'+zone+' zone-content-'+(g.content||'empty').replace(/[^a-z0-9-]/g,'-')
    }));
  },
  applyLayout(spec){
    const {cssSpec, domSpec} = spec;
    let style = document.getElementById('leados-generative-layout');
    if(!style){ style = document.createElement('style'); style.id='leados-generative-layout'; document.head.appendChild(style); }
    style.textContent = cssSpec;
    const workspace = document.getElementById('leados-workspace');
    workspace.innerHTML = '';
    workspace.dataset.layout = spec.situation.layoutMode;
    workspace.dataset.situation = spec.situation.type;
    domSpec.forEach(zone=>{
      const el = document.createElement('div');
      el.dataset.zone = zone.zone;
      el.className = 'zone fade-in '+zone.className;
      el.dataset.content = zone.content;
      if(zone.finding) el.dataset.findingKey = zone.finding.key;
      workspace.appendChild(el);
      renderZoneContent(el, zone, spec.hierarchy);
    });
    LEADOS.store.auditLive('layout.generated', spec.situation.type+':'+spec.situation.layoutMode);
  }
};

/* ======================================================================
   PART 3 — PROACTIVE INTELLIGENCE SURFACE (kept close to the pasted spec)
   ====================================================================== */
LEADOS.proactive = {
  computeNextActions(P, t, attentionScores){
    const findings = LEADOS.engine.run(P,t).findings;
    const ignored = LEADOS.attention.getIgnoredFindings(findings);
    const flightRisk = LEADOS.flightRisk.computeFlightRisk(P,t);
    const circadian = LEADOS.circadian.getCurrentProfile(t);
    const fatigue = LEADOS.fatigue.sessionFatigue;
    const actions = [];

    findings.filter(f=>f.sev===5).forEach(f=>{
      actions.push({priority:100, type:'CRITICAL_RESPONSE', title:f.title, why:'Critical finding unaddressed',
        action:{type:'open-playbook', findingKey:f.key}, timeRequired:'15-30 min', bestWindow:'NOW — sev 5 has no optimal window'});
    });
    flightRisk.highRisk.forEach(r=>{
      actions.push({priority:80, type:'RETENTION_ACTION', title:`Schedule 1:1 with ${r.person.name} (flight risk ${Math.round(r.riskScore*100)}%)`,
        why:'Elevated flight risk + no recent 1:1 = compounding signal', action:{type:'quick-capture', eventType:'oneonone.logged', personId:r.person.id},
        timeRequired:'30-60 min', bestWindow:'Today or tomorrow'});
    });
    ignored.filter(f=>f.sev>=3).slice(0,3).forEach(f=>{
      actions.push({priority:50, type:'ATTENTION_REDIRECT', title:`Review "${f.title}" — not yet examined`, why:`Sev-${f.sev} finding with 0 recorded attention`,
        action:{type:'focus-finding', findingKey:f.key}, timeRequired:'5 min to read', bestWindow: circadian.analytical>0.7?'Now (analytical peak)':'Morning peak'});
    });
    if(circadian.analytical>=0.9 && fatigue<40){
      const complex = (P.openDecisions||[]).filter(d=>d.stakes>=4);
      if(complex.length) actions.push({priority:70, type:'COGNITIVE_OPTIMAL', title:`Optimal window for: "${complex[0].title}"`,
        why:'Morning analytical peak + low fatigue = best cognitive window', action:{type:'open-decision', decisionId:complex[0].id}, timeRequired:'30-90 min', bestWindow:'NOW — closes by 12:00'});
    }
    const pending = LEADOS.workQueue.pending();
    if(pending.length) actions.push({priority:60, type:'REVIEW_PREPARED_WORK', title:`${pending.length} prepared work item(s) awaiting review`,
      why:'System prepared these autonomously — review takes < 5 min', action:{type:'open-work-queue'}, timeRequired:'5-10 min', bestWindow:'Any time'});

    return {actions: actions.sort((a,b)=>b.priority-a.priority).slice(0,5), cognitiveContext:{profile:circadian.name, fatigue, optimalFor:circadian.best_for}};
  },
  generateNowSurface(P,t){
    const res = this.computeNextActions(P,t, LEADOS.attention.getAttentionScores());
    const top = res.actions[0];
    if(!top) return {surface:'CLEAR', headline:'No immediate action required.', subline:'All critical findings addressed. Monitoring continues.', cognitiveContext:res.cognitiveContext, fullQueue:[]};
    return {surface:top.type, headline:top.title, subline:top.why, action:top.action, timeRequired:top.timeRequired, bestWindow:top.bestWindow, cognitiveContext:res.cognitiveContext, fullQueue:res.actions};
  }
};

/* ======================================================================
   PART 4 — COMMAND INTELLIGENCE (kept close to the pasted spec)
   ====================================================================== */
LEADOS.commandIntel = {
  INTENTS: {
    GIVE_FEEDBACK:{patterns:[/give feedback to (.+)/i,/feedback for (.+)/i,/fb (.+)/i], extract:m=>({personName:m[1]}), action:ctx=>`open-quick-capture:feedback.given:person:${ctx.personId||'?'}`},
    LOG_1ON1:{patterns:[/1[:\-]?1 with (.+)/i,/one[- ]on[- ]one (.+)/i,/oo1 (.+)/i], extract:m=>({personName:m[1]}), action:ctx=>`open-quick-capture:oneonone.logged:person:${ctx.personId||'?'}`},
    LOG_DECISION:{patterns:[/decided (.+)/i,/decision: (.+)/i,/we decided (.+)/i], extract:m=>({decision:m[1]}), action:ctx=>`open-quick-capture:strategy.decision:prefill:${ctx.decision}`},
    ASSESS_PERSON:{patterns:[/how is (.+) doing/i,/status of (.+)/i,/(.+) risk/i,/check on (.+)/i], extract:m=>({personName:m[1]||m[2]}), action:ctx=>`navigate:/roster#person:${ctx.personId||'?'}`},
    FIND_PLAYBOOK:{patterns:[/how (should|do) I (.+)/i,/what to do about (.+)/i,/playbook for (.+)/i], extract:m=>({topic:m[2]||m[1]}), action:ctx=>`search-playbooks:${ctx.topic}`},
    EXPLAIN_FINDING:{patterns:[/why (is|am I seeing) (.+)/i,/explain (.+)/i,/what does (.+) mean/i], extract:m=>({topic:m[2]||m[1]}), action:ctx=>`explain:${ctx.topic}`},
    SIMULATE:{patterns:[/what if (.+)/i,/scenario: (.+)/i,/simulate (.+)/i], extract:m=>({scenario:m[1]}), action:ctx=>`open-simulation:${ctx.scenario}`},
    RUN_WARGAME:{patterns:[/wargame (.+)/i,/competitive scenario (.+)/i,/war game (.+)/i], extract:m=>({scenario:m[1]}), action:ctx=>`open-playbook:wargame-scenario:prefill:${ctx.scenario}`},
    COUNTERFACTUAL:{patterns:[/what if we had (.+)/i,/what would have happened if (.+)/i], extract:m=>({hypothetical:m[1]}), action:ctx=>`open-counterfactual:${ctx.hypothetical}`}
  },
  resolve(query, P){
    const normalized = query.trim();
    if(!normalized) return null;
    for(const [name, intent] of Object.entries(this.INTENTS)){
      for(const pattern of intent.patterns){
        const match = normalized.match(pattern);
        if(match){
          const extracted = intent.extract(match);
          let personId = null;
          if(extracted.personName){ const p = this._resolvePersonName(extracted.personName, P); if(p) personId = p.id; }
          return {intent:name, extracted:{...extracted, personId}, action:intent.action({...extracted, personId}), confidence: match[0].length/normalized.length};
        }
      }
    }
    return {intent:'SEARCH', action:`search:${normalized}`, confidence:0.5};
  },
  _resolvePersonName(query, P){
    const q = query.toLowerCase().trim();
    let m = P.people.find(p=>p.name.toLowerCase()===q); if(m) return m;
    m = P.people.find(p=>p.name.toLowerCase().startsWith(q)); if(m) return m;
    let best=Infinity, bp=null;
    P.people.forEach(p=>{ const d=this._editDistance(q,p.name.toLowerCase()); if(d<best && d<=3){best=d;bp=p;} });
    return bp;
  },
  _editDistance(a,b){
    const dp = Array.from({length:a.length+1},(_,i)=>Array.from({length:b.length+1},(_,j)=>i===0?j:j===0?i:0));
    for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++) dp[i][j] = a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
    return dp[a.length][b.length];
  }
};

/* ======================================================================
   PART 5 — ADAPTIVE NOTIFICATIONS (kept close to the pasted spec)
   ====================================================================== */
LEADOS.notifications = {
  _delivered: new Set(),
  _snoozed: new Map(),
  _log: [],
  computeQueue(findings, P, t){
    const circadian = LEADOS.circadian.getCurrentProfile(t);
    const fatigue = LEADOS.fatigue.sessionFatigue;
    const candidates = [];
    findings.forEach(f=>{
      const id = 'finding:'+f.key+':'+Math.round(f.score*10);
      if(!this._delivered.has(id)){
        candidates.push({id, type:'FINDING', severity:f.sev, title:f.title, finding:f,
          requiresMorningPeak:f.sev>=4, requiresLowFatigue:f.sev>=4,
          form: f.sev>=5?'INTERRUPT':f.sev>=4?'BANNER':f.sev>=3?'TOAST':'AMBIENT',
          action:{type:'focus-finding', key:f.key}});
      }
    });
    LEADOS.workQueue.pending().forEach(item=>{
      const id = 'workqueue:'+item.id;
      if(!this._delivered.has(id)) candidates.push({id, type:'WORK_READY', severity:3, title:`${item.type}: ready for review`, workItem:item, form:'TOAST', requiresMorningPeak:false, requiresLowFatigue:false, action:{type:'open-work-queue'}});
    });
    (LEADOS.predict.buildPrefireCalendar(P,t)||[]).filter(pf=>pf.daysUntil<=2).forEach(pf=>{
      const id = 'prefire:'+pf.key+':'+pf.daysUntil;
      if(!this._delivered.has(id)) candidates.push({id, type:'PREFIRE', severity:2, title:`In ${pf.daysUntil}d: ${pf.title}`, form:'AMBIENT', requiresMorningPeak:false, requiresLowFatigue:false, action:{type:'navigate', route:'today'}});
    });

    const filtered = candidates.filter(n=>{
      if(this._snoozed.has(n.id)){ if(new Date(t) < new Date(this._snoozed.get(n.id))) return false; this._snoozed.delete(n.id); }
      if(n.severity<4){ const focus = LEADOS.attention.getCurrentFocus(); if(focus && n.finding){ const sameDomain = n.finding.domain === (focus.id||'').split(':')[0]; if(focus.type==='finding' && !sameDomain) return false; } }
      if(n.requiresMorningPeak && circadian.analytical<0.7){ if(n.severity<5){ this._snoozed.set(n.id, this._nextMorningPeak()); return false; } }
      if(fatigue>=70 && n.severity<5) return false;
      return true;
    });

    const recentDeliveries = this._delivered.size;
    const allowed = Math.max(0, 3 - (recentDeliveries % 3));
    const queue = filtered.slice(0, allowed).sort((a,b)=>b.severity-a.severity);
    return {queue, deferred: filtered.length - queue.length, snoozed: this._snoozed.size,
      label:`${filtered.length} candidate notifications. ${queue.length} delivered. ${filtered.length-queue.length} rate-limited. (Rate-limit heuristic kept as written in the pasted spec — disclosed as non-monotonic, not hardened.)`};
  },
  deliver(n){
    this._delivered.add(n.id);
    this._log.unshift({...n, ts:new Date().toLocaleTimeString()});
    if(this._log.length>100) this._log.length = 100;
    switch(n.form){
      case 'INTERRUPT': LEADOS.signals.enqueue({level:9, ...n}); break;
      case 'BANNER': LEADOS.ui.showBanner(n); break;
      case 'TOAST': LEADOS.ui.toast(n.title, n.severity>=4?'warn':'info', n.action); break;
      case 'AMBIENT': LEADOS.ui.updateBadge(n); break;
    }
    LEADOS.haptics.onEvent(n.severity>=5?'finding.critical_new':'finding.snoozed');
    LEADOS.store.auditLive('notification.delivered:'+n.type, n.title.slice(0,60));
    updateNotifBadge();
  },
  _nextMorningPeak(){ const d=new Date(); d.setDate(d.getDate()+1); d.setHours(8,0,0,0); return d.toISOString(); }
};

/* ======================================================================
   PART 6 — ORGANIZATIONAL HEALTH SCORE (kept close to the pasted spec;
   trend uses a load-time snapshot as the "30d ago" baseline since this
   build has no real historical event log — disclosed simplification)
   ====================================================================== */
LEADOS.healthScore = {
  _baseline: null,
  compute(P, t){
    const findings = LEADOS.engine.run(P,t).findings;
    const domains = {
      PEOPLE: (()=>{ const s5=findings.filter(f=>f.sev===5&&['R1','R7','R19','R20','R21'].includes(f.rule)).length; const s4=findings.filter(f=>f.sev===4&&['R1','R4','R7','R10'].includes(f.rule)).length; return Math.max(0,100-s5*30-s4*15); })(),
      FINANCIAL: (()=>{ const s5=findings.filter(f=>f.sev>=4&&['R103','R104','R105','R106','R107'].includes(f.rule)).length; const rw=LEADOS.finIntel.runwayStatus(P,t); const rr = rw.runway_months<3?40:rw.runway_months<6?20:0; return Math.max(0,100-s5*25-rr); })(),
      EXECUTION: (()=>{ const v=findings.some(f=>f.rule==='R73'); const sla=findings.some(f=>f.rule==='R17'); const sp=findings.some(f=>f.rule==='R74'); return Math.max(0,100-(v?35:0)-(sla?25:0)-(sp?15:0)); })(),
      STRATEGY: (()=>{ const si=findings.filter(f=>f.rule==='R14').length; const ow=findings.filter(f=>f.rule==='R3').length; const th=findings.filter(f=>f.rule==='R147'||f.rule==='R153').length; return Math.max(0,100-si*20-ow*10-th*15); })(),
      GOVERNANCE: (()=>{ const nc=findings.some(f=>f.rule==='R88'); const gg=findings.filter(f=>['R30','R31','R39'].includes(f.rule)).length; return Math.max(0,100-(nc?50:0)-gg*15); })(),
      CULTURE: (()=>{ const ps=findings.filter(f=>f.rule==='R62').length; const si=findings.filter(f=>f.rule==='R58').length; const vf=findings.filter(f=>f.rule==='R56').length; return Math.max(0,100-ps*30-si*15-vf*20); })(),
      RESILIENCE: (()=>{ const ca=findings.some(f=>f.rule==='R125'&&f.sev>=4); const kp=findings.filter(f=>f.rule==='R129').length; const im=findings.some(f=>f.rule==='INF-003-IMMUNE'); return Math.max(0,100-(ca?40:0)-kp*15-(im?20:0)); })(),
      MARKET: (()=>{ const wr=findings.some(f=>f.rule==='R157'); const lc=findings.some(f=>f.rule==='R158'); const bs=findings.some(f=>f.rule==='R145'); return Math.max(0,100-(wr?20:0)-(lc?25:0)-(bs?15:0)); })()
    };
    const overall = Math.round(Object.values(domains).reduce((a,b)=>a+b,0)/8);
    return {
      overall, grade: overall>=90?'A':overall>=80?'B':overall>=70?'C':overall>=60?'D':'F', domains,
      lowestDomain: Object.entries(domains).sort(([,a],[,b])=>a-b)[0],
      highestDomain: Object.entries(domains).sort(([,a],[,b])=>b-a)[0],
      trend: this._computeTrend(overall),
      label:'Each domain: 100 − (finding penalties). Score only improves by resolving findings; logging events alone cannot move it. Penalty weights are heuristic/illustrative, not validated.'
    };
  },
  _computeTrend(overall){
    if(this._baseline===null) this._baseline = overall;
    const delta = overall - this._baseline;
    return {delta, direction: delta>0?'IMPROVING':delta<0?'DECLINING':'STABLE',
      label:`Since session start (demo baseline — no real 30d event history exists in this build): ${delta>0?'+':''}${delta} points.`};
  }
};

/* ======================================================================
   APP CHROME / RENDERING  (original — not part of the pasted spec)
   ====================================================================== */
let route = 'today';

function domainDot(d){ return `<span class="dot" data-domain="${d}"></span>`; }

function findingCard(f, {compact=false}={}){
  const rule = RULES[f.rule];
  const person = f.personId ? PEOPLE.find(p=>p.id===f.personId) : null;
  return `<div class="finding-card fade-in bg-slate-900/60 border border-slate-800 rounded-lg px-3 py-2 ${f.sev>=5?'border-red-600':f.sev===4?'border-amber-600/70':''}" data-key="${f.key}" data-rule="${f.rule}">

      <div class="flex items-center gap-2 text-xs">${domainDot(f.domain)}<span class="text-slate-500">${f.domain}</span><span class="mono text-slate-600">${f.rule}</span></div>

    </div>
    <div class="${compact?'text-xs':'text-sm'} mt-1 text-slate-100">${f.title}</div>
    ${person?`<div class="text-[10px] text-slate-500 mt-1">↳ ${person.name}</div>`:''}
  </div>`;
}

function bestPlaybookFor(domain){ return PLAYBOOKS.find(p=>p.domain===domain) || PLAYBOOKS[0]; }

/* ---------- orchestration ---------- */
function recompute(){
  const P = synthP();
  const t = today();
  const {findings} = LEADOS.engine.run(P, t);

  if(route==='today'){
    const workspaceEl = document.getElementById('leados-workspace');
    const vp = {width: workspaceEl.clientWidth||900, height: workspaceEl.clientHeight||600};
    const spec = LEADOS.layout.generateLayout(findings, P, t, vp, LEADOS.attention.getAttentionScores());
    LEADOS.layout.applyLayout(spec);
    const banner = document.getElementById('situation-banner');
    if(banner.dataset.forced !== '1'){
      banner.classList.remove('hidden');
      banner.innerHTML = `<div class="flex items-center gap-2 flex-wrap"><span class="font-medium">${spec.situation.type}</span><span class="text-slate-500">${spec.situation.description}</span><span class="mono text-[10px] text-slate-600">layout: ${spec.situation.layoutMode}</span></div>
        <button class="text-slate-500 hover:text-slate-200" onclick="toggleCssViewer()">view generated CSS</button>`;
    }
    window._lastCss = spec.cssSpec;
  }
  renderNowSurface(P, t);
  updateHealthWidget(P, t);
  runNotifications(findings, P, t);
  renderAttentionFocus();
  if(route==='control') renderControl();
  if(route==='roster') renderRoster();
  if(route==='playbooks') renderPlaybooks();
  if(route==='workqueue') renderWorkQueue();
  if(route==='audit') renderAudit();
  if(route==='about') renderAbout();
}
function renderToday(){ recompute(); }

function toggleCssViewer(){
  const banner = document.getElementById('situation-banner');
  let pre = document.getElementById('css-viewer');
  if(pre){ pre.remove(); return; }
  pre = document.createElement('pre');
  pre.id = 'css-viewer';
  pre.className = 'fixed top-24 right-4 w-96 max-h-96 overflow-auto bg-black/90 border border-slate-700 rounded-lg p-3 text-[10px] mono z-40';
  pre.textContent = window._lastCss || '';
  document.body.appendChild(pre);
}

function renderNowSurface(P,t){

  } else {
    el.innerHTML = `<div class="bg-indigo-950/40 border border-indigo-800 rounded-lg p-3 mb-3">
      <div class="text-[10px] uppercase text-indigo-400">${n.surface.replace(/_/g,' ')}</div>

function updateHealthWidget(P,t){
  const hs = LEADOS.healthScore.compute(P,t);
  document.getElementById('health-score').textContent = hs.overall;
  document.getElementById('health-grade').textContent = hs.grade;
  document.getElementById('health-score').className = 'font-bold text-lg leading-none ' + (hs.overall>=80?'text-emerald-400':hs.overall>=60?'text-amber-400':'text-red-400');
  const dd = document.getElementById('health-dropdown');
  dd.innerHTML = `<div class="text-sm font-medium mb-2">Organizational Health — ${hs.overall}/100 (${hs.grade})</div>

function updateNotifBadge(){
  const n = LEADOS.notifications._log.length;
  const badge = document.getElementById('notif-badge');
  if(n>0){ badge.classList.remove('hidden'); badge.textContent = n>99?'99+':n; } else badge.classList.add('hidden');
  const dd = document.getElementById('notif-dropdown');
  dd.innerHTML = `<div class="text-sm font-medium mb-2">Notifications</div>
    <div class="space-y-2">${LEADOS.notifications._log.slice(0,20).map(x=>`<div class="text-xs bg-slate-900/50 rounded px-2 py-2"><div class="flex justify-between"><span class="font-medium">${x.title}</span><span class="text-slate-600 text-[10px]">${x.ts}</span></div><div class="text-slate-500 text-[10px] mt-0.5">${x.form} · sev ${x.severity}</div></div>`).join('') || '<div class="text-slate-600 text-xs">No notifications delivered yet.</div>'}</div>`;
}

function runNotifications(findings,P,t){
  const q = LEADOS.notifications.computeQueue(findings, P, t);
  q.queue.forEach(n => LEADOS.notifications.deliver(n));
}

function renderAttentionFocus(){
  const f = LEADOS.attention.getCurrentFocus();
  const el = document.getElementById('attention-focus');
  el.innerHTML = f ? `attn.focus → <span class="text-indigo-400">${f.key}</span><br>dwell ${f.dwellSeconds}s · score ${f.score.toFixed(1)}` : 'attn.focus → none yet (hover the workspace)';
}

/* ---------- command execution (stubbed where the spec left no renderer) ---------- */
function executeAction(action){
  if(!action || !action.type) return;
  LEADOS.store.auditLive('action.executed', JSON.stringify(action).slice(0,80));
  switch(action.type){
    case 'navigate':
      if(action.route) setRoute(action.route);
      else if(action.type==='navigate' && String(action).includes('roster')) setRoute('roster');
      break;
    case 'open-playbook': setRoute('playbooks'); LEADOS.ui.toast('Opened matching playbook (stub — no full playbook engine in this build)'); break;
    case 'focus-finding': LEADOS.ui.toast('Focused finding '+(action.findingKey||action.key||'')); setRoute('today'); break;
    case 'open-work-queue': setRoute('workqueue'); break;
    case 'open-decision': LEADOS.ui.toast('Opened decision '+(action.decisionId||'')+' (stub — no decision workflow in this build)'); break;
    case 'quick-capture': LEADOS.ui.toast('Quick capture stub: '+(action.eventType||'')+' for '+(action.personId||'')); break;
    default: LEADOS.ui.toast('Action: '+JSON.stringify(action).slice(0,60));
  }
}

/* command palette wiring */
const cmdkOverlay = document.getElementById('cmdk-overlay');
const cmdkInput = document.getElementById('cmdk-input');
const cmdkResult = document.getElementById('cmdk-result');
function openCmdk(){ cmdkOverlay.classList.remove('hidden'); cmdkInput.value=''; cmdkResult.innerHTML=''; cmdkInput.focus(); }
function closeCmdk(){ cmdkOverlay.classList.add('hidden'); }
document.getElementById('btn-cmdk').onclick = openCmdk;
document.addEventListener('keydown', e=>{
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); cmdkOverlay.classList.contains('hidden') ? openCmdk() : closeCmdk(); }
  if(e.key==='Escape') closeCmdk();
});
cmdkOverlay.addEventListener('click', e=>{ if(e.target===cmdkOverlay) closeCmdk(); });
cmdkInput.addEventListener('input', ()=>{
  const r = LEADOS.commandIntel.resolve(cmdkInput.value, synthP());
  if(!r){ cmdkResult.innerHTML=''; return; }
  cmdkResult.innerHTML = `<div class="flex items-center justify-between"><span class="text-indigo-400 font-medium">${r.intent}</span><span class="mono text-[10px]">confidence ${(r.confidence*100).toFixed(0)}%</span></div>
    <div class="mono text-[10px] text-slate-500 mt-1 break-all">${r.action}</div>
    <div class="text-[10px] text-slate-600 mt-2">↵ to execute</div>`;
});
cmdkInput.addEventListener('keydown', e=>{
  if(e.key==='Enter'){
    const r = LEADOS.commandIntel.resolve(cmdkInput.value, synthP());
    if(r){ LEADOS.store.auditLive('command.resolved:'+r.intent, r.action); routeFromActionString(r.action); }
    closeCmdk();
  }
});
function routeFromActionString(action){
  if(action.startsWith('navigate:/roster')) setRoute('roster');
  else if(action.startsWith('search-playbooks')) setRoute('playbooks');
  else if(action.startsWith('open-quick-capture')) LEADOS.ui.toast('Quick capture stub: '+action);
  else if(action.startsWith('explain')) LEADOS.ui.toast('Explain stub: '+action.replace('explain:',''));
  else if(action.startsWith('open-simulation')||action.startsWith('open-counterfactual')||action.startsWith('open-playbook')) LEADOS.ui.toast('Stub (no engine for this in current build): '+action);
  else LEADOS.ui.toast('Search: '+action.replace('search:',''));
}

/* ---------- routing ---------- */
function setRoute(r){
  route = r;
  document.querySelectorAll('.route').forEach(el=>el.classList.add('hidden'));
  document.getElementById('route-'+r).classList.remove('hidden');
  document.getElementById('situation-banner').classList.toggle('hidden', r!=='today');
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('bg-slate-800', b.dataset.route===r));

}

  document.getElementById('fatigue-slider').oninput = e=>{ STATE.fatigue=+e.target.value; document.getElementById('fatigue-val').textContent=STATE.fatigue; recompute(); };
  document.getElementById('runway-slider').oninput = e=>{ STATE.runwayMonths=+e.target.value; document.getElementById('runway-val').textContent=STATE.runwayMonths+'mo'; recompute(); };
  document.getElementById('board-check').onchange = e=>{ STATE.boardSoon=e.target.checked; recompute(); };
  document.getElementById('sprint-check').onchange = e=>{ STATE.sprintDue=e.target.checked; recompute(); };

  document.querySelectorAll('.preset-btn').forEach(b=>{
    b.className = 'preset-btn text-xs px-3 py-1.5 bg-slate-800 hover:bg-indigo-700 rounded border border-slate-700';
    b.onclick = ()=>applyPreset(b.dataset.p);
  });

  const table = document.getElementById('signal-table');
  table.innerHTML = STATE.signals.map((s,i)=>{
    const rule = RULES[s.rule];
    return `<div class="flex items-center gap-3 text-xs bg-slate-900/40 rounded px-2 py-1.5" data-rule="${s.rule}">
      <input type="checkbox" ${s.active?'checked':''} onchange="STATE.signals[${i}].active=this.checked;recompute()">
      <span class="w-14 mono text-slate-500">${s.rule}</span>
      ${domainDot(rule.domain)}
      <span class="flex-1">${rule.title}</span>
      <select class="bg-slate-800 rounded text-[10px] px-1" onchange="STATE.signals[${i}].sev=+this.value;recompute()">
        ${[3,4,5].map(v=>`<option value="${v}" ${s.sev===v?'selected':''}>sev ${v}</option>`).join('')}
      </select>
    </div>`;
  }).join('');
}
function applyPreset(p){
  STATE.signals.forEach(s=>s.active=false);
  STATE.boardSoon=false; STATE.sprintDue=false; STATE.fatigue=20; STATE.hour=9;
  const on = (rule,sev)=>{ const s=STATE.signals.find(s=>s.rule===rule); if(s){s.active=true; if(sev)s.sev=sev;} };
  if(p==='multi'){ on('R19',5); on('R20',5); }
  else if(p==='single'){ on('R125',5); }
  else if(p==='board'){ STATE.boardSoon=true; on('R39'); on('R88'); }
  else if(p==='sprint'){ STATE.sprintDue=true; on('R73'); on('R74'); }
  else if(p==='deep'){ STATE.hour=9; STATE.fatigue=10; on('R21'); on('R4'); }
  else if(p==='fatigued'){ STATE.fatigue=75; on('R21'); }
  else if(p==='standard'){ on('R21'); on('R4'); }
  renderControl(); recompute();
}
