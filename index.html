<!--
  Modules load synchronously in dependency order — no build step, no async race.
  The guard below is the boot registry check: any missing js module → fatal
  banner naming the path; your data (localStorage "leados:data") is untouched.
-->
<script src="js/store.js"></script>
<script src="js/events.js"></script>
<script src="js/engine.js"></script>
<script src="js/playbooks.js"></script>
<script src="js/health.js"></script>
<script src="js/ui.js"></script>
<script>
(function () {
  'use strict';
  var EXPECTED = {
    store: 'js/store.js', events: 'js/events.js', engine: 'js/engine.js',
    playbooks: 'js/playbooks.js', health: 'js/health.js', ui: 'js/ui.js'
  };
  function fatal(missing) {
    var d = document.createElement('div');
    d.id = 'fatal';
    d.innerHTML = '<div class="box"><h1>LeadOS did not boot</h1><p>Missing module(s): <code>' +
      missing.join('</code>, <code>') + '</code></p>' +
      '<p>The boot registry guard halted before any store operation ran. Your data (<code>leados:data</code> in localStorage) is untouched. Restore the file(s) and reload. Rename this file to test the guard — then rename it back.</p></div>';
    document.body.appendChild(d);
  }
  function go() {
    var missing = [];
    Object.keys(EXPECTED).forEach(function (k) {
      if (!window.LEADOS || !LEADOS._mod || !LEADOS._mod[k]) missing.push(EXPECTED[k]);
    });
    if (missing.length) { fatal(missing); return; }
    try { LEADOS.ui.boot(); }
    catch (e) {
      var d = document.createElement('div');
      d.id = 'fatal';
      d.innerHTML = '<div class="box"><h1>LeadOS crashed during boot</h1><p><code>' +
        String(e && e.message ? e.message : e).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }) +
        '</code></p><p>Your data in <code>leados:data</code> has not been written to during this boot. If this persists, check <code>#/data</code> quarantine from a previous session or clear the key after exporting.</p></div>';
      document.body.appendChild(d);
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go);
  else go();
})();
</script>
</body>
</html>
