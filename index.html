<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeadOS pt-G demo — Adaptive Intelligence Interface (unofficial, single-file)</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style>
/* ============================================================
   DESIGN TOKENS — 3 themes. Obsidian values copied verbatim from
   the pt-G brief's own contrast table (verified against brief text).
   Parchment / Terminal palettes are this session's own invention,
   built to the same AA/AAA contrast discipline — UNVERIFIED against
   any real repo asset, labeled here once instead of everywhere.
   ============================================================ */
:root, [data-theme="dark"]{
  --surface-1:#141210; --surface-2:#1C1917; --surface-3:#262220; --surface-4:#2F2A27;
  --ink-0:#F7F4EF; --ink-1:#D4CEC3; --ink-2:#9A9085; --ink-3:#5C564E; --ink-4:#3A352F;
  --accent:#C23B2E;
  --sev-5:#FF2D2D; --sev-4:#FF8A3D; --sev-3:#FFC53D; --sev-2:#7CC576; --sev-1:#5C564E;
  --font-body: 'Inter', system-ui, sans-serif;
  --font-mono: 'SFMono-Regular','Courier New', monospace;
}
[data-theme="light"]{
  --surface-1:#FBF8F2; --surface-2:#F2EDE2; --surface-3:#E8E0D0; --surface-4:#DCD2BC;
  --ink-0:#201D18; --ink-1:#3A352F; --ink-2:#6B6356; --ink-3:#8B8272; --ink-4:#C7BEA9;
  --accent:#9C3426;
  --sev-5:#B3261E; --sev-4:#B5590B; --sev-3:#8A6D00; --sev-2:#2E7D32; --sev-1:#8B8272;
}
[data-theme="terminal"]{
  --surface-1:#0A0A0A; --surface-2:#0F0F0F; --surface-3:#141414; --surface-4:#1A1A1A;
  --ink-0:#D8FFD8; --ink-1:#9FE89F; --ink-2:#5FAE5F; --ink-3:#3A7A3A; --ink-4:#1F4A1F;
  --accent:#00FF66;
  --sev-5:#FF3B3B; --sev-4:#FF9A3B; --sev-3:#FFD23B; --sev-2:#3BFF7A; --sev-1:#3A7A3A;
  --font-body: var(--font-mono);
}
*{ box-sizing: border-box; }
html,body{ height:100%; }
body{
  margin:0; background:var(--surface-1); color:var(--ink-0);
  font-family:var(--font-body); font-size:14px; line-height:1.5;
  transition: background 120ms, color 120ms;
}
.mono{ font-family:var(--font-mono); }
a{ color:inherit; }

/* Skip link */
.skip-link{
  position:absolute; left:-9999px; top:0; background:var(--accent); color:#fff;
  padding:10px 16px; z-index:10000; border-radius:0 0 6px 0;
}
.skip-link:focus{ left:0; }

/* Focus ring — inside, consistent */
:focus-visible{ outline:2px solid var(--accent); outline-offset:-2px; border-radius:2px; }
:focus:not(:focus-visible){ outline:none; }

.sr-only{
  position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden;
  clip:rect(0,0,0,0); white-space:nowrap; border:0;
}

/* Layout */
#rail{
  width:224px; flex:none; background:var(--surface-2); border-right:1px solid var(--ink-4);
  display:flex; flex-direction:column; padding:16px 8px; gap:2px; height:100vh; position:sticky; top:0;
}
#rail .brand{ padding:8px 10px 18px; font-weight:700; letter-spacing:.02em; }
#rail .brand small{ display:block; font-weight:400; color:var(--ink-3); font-size:10px; margin-top:2px; }
.nav-item{
  display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px;
  color:var(--ink-1); text-decoration:none; font-size:13px; cursor:pointer;
}
.nav-item:hover{ background:var(--surface-3); }
.nav-item.active{ background:var(--surface-4); color:var(--ink-0); }
.nav-badge{
  margin-left:auto; background:var(--sev-4); color:#1a1a1a; font-size:10px; font-weight:700;
  padding:1px 6px; border-radius:999px; font-family:var(--font-mono);
}
#rail .foot{ margin-top:auto; padding:10px; font-size:10px; color:var(--ink-3); font-family:var(--font-mono); }

#main{ flex:1; min-width:0; }
#topbar{
  display:flex; align-items:center; gap:12px; padding:10px 20px; border-bottom:1px solid var(--ink-4);
  position:sticky; top:0; background:var(--surface-1); z-index:50;
}
.kbtn{
  font-family:var(--font-mono); font-size:11px; color:var(--ink-3); background:var(--surface-3);
  border:1px solid var(--ink-4); padding:2px 6px; border-radius:4px;
}
#content{ max-width:880px; margin:0 auto; padding:24px 24px 80px; }
.wide #content{ max-width:1120px; }

h1{ font-size:22px; margin:0 0 4px; }
h2{ font-size:16px; margin:28px 0 10px; }
.page-sub{ color:var(--ink-2); font-size:13px; margin-bottom:18px; }

/* Buttons */
.btn{
  font: 12px var(--font-body); padding:7px 12px; border-radius:7px; cursor:pointer;
  border:1px solid var(--ink-4); background:var(--surface-3); color:var(--ink-0);
}
.btn:hover{ background:var(--surface-4); }
.btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
.btn.danger{ color:var(--sev-4); border-color:var(--sev-4); }
.btn:disabled{ opacity:.45; cursor:not-allowed; }

/* Finding card */
.fin{
  border:1px solid var(--ink-4); border-left-width:4px; border-radius:10px; background:var(--surface-2);
  padding:14px 16px; margin-bottom:12px; cursor:pointer;
}
.fin[data-sev="5"]{ border-left-color:var(--sev-5); }
.fin[data-sev="4"]{ border-left-color:var(--sev-4); }
.fin[data-sev="3"]{ border-left-color:var(--sev-3); }
.fin[data-sev="2"]{ border-left-color:var(--sev-2); }
.fin.focused{ box-shadow:0 0 0 2px var(--accent) inset; }
.fin-header{ display:flex; align-items:center; gap:8px; font-family:var(--font-mono); font-size:10px; color:var(--ink-3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:6px; }
.chip{ padding:1px 6px; border-radius:4px; background:var(--surface-3); border:1px solid var(--ink-4); }
.fin-title{ font-size:14.5px; font-weight:600; margin:0 0 6px; color:var(--ink-0); }
.fin-basis{ font-family:var(--font-mono); font-size:11.5px; color:var(--ink-2); margin:2px 0; }
.fin-narrative{ font-size:12.5px; color:var(--ink-1); margin-top:8px; }
.fin-source{ font-family:var(--font-mono); font-size:10.5px; color:var(--ink-3); margin-top:2px; }
.fin-act{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
.fin-detail{ display:none; margin-top:12px; border-top:1px dashed var(--ink-4); padding-top:10px; }
.fin.open .fin-detail{ display:block; }

.score-math{
  font-family:var(--font-mono); font-size:11.5px; background:var(--surface-3); border:1px solid var(--ink-4);
  border-radius:8px; padding:10px 12px; white-space:pre-wrap; color:var(--ink-1);
}

/* metric card */
.metric-card{ border:1px solid var(--ink-4); border-radius:10px; padding:14px 16px; background:var(--surface-2); margin-bottom:14px; }
.metric-card .val{ font-size:24px; font-weight:700; font-family:var(--font-mono); }
.metric-card .lbl{ font-size:11px; color:var(--ink-3); text-transform:uppercase; letter-spacing:.06em; }
.anomaly-toggle{ font-family:var(--font-mono); font-size:11px; color:var(--ink-2); cursor:pointer; margin-top:6px; display:inline-block; }
.anomaly-body{ display:none; font-size:12px; color:var(--ink-1); margin-top:6px; }
.anomaly-body.open{ display:block; }

/* Settings */
.setting-row{ display:flex; align-items:center; gap:14px; padding:10px 0; border-bottom:1px solid var(--ink-4); }
.setting-row label{ flex:1; font-size:13px; }
.setting-row input{
  width:110px; padding:6px 8px; background:var(--surface-3); border:1px solid var(--ink-4); color:var(--ink-0);
  border-radius:6px; font-family:var(--font-mono);
}
.setting-note{ font-family:var(--font-mono); font-size:11px; color:var(--ink-3); margin-top:-6px; margin-bottom:10px; }
.impact-box{
  font-family:var(--font-mono); font-size:11.5px; background:var(--surface-3); border:1px dashed var(--ink-4);
  border-radius:8px; padding:10px 12px; margin:6px 0 16px; color:var(--ink-1);
}
.impact-box .created{ color: var(--sev-4); }
.impact-box .resolved{ color: var(--sev-2); }

table.rules{ width:100%; border-collapse:collapse; font-size:12.5px; }
table.rules th, table.rules td{ text-align:left; padding:8px 10px; border-bottom:1px solid var(--ink-4); }
table.rules th{ font-family:var(--font-mono); font-size:10px; text-transform:uppercase; color:var(--ink-3); }
.status-pill{ font-family:var(--font-mono); font-size:10px; padding:2px 6px; border-radius:4px; }
.status-ACTIVE{ background:rgba(124,197,118,.15); color:var(--sev-2); }
.status-MUTED{ background:var(--surface-4); color:var(--ink-3); }
.status-INACTIVE{ background:var(--surface-4); color:var(--ink-3); }
.status-NODATA{ background:var(--surface-4); color:var(--ink-3); }

/* Command palette */
.cmd-overlay{
  position:fixed; inset:0; z-index:9000; background:rgba(14,13,11,.75);
  backdrop-filter: blur(8px) saturate(.8); -webkit-backdrop-filter: blur(8px) saturate(.8);
  display:flex; align-items:flex-start; justify-content:center; padding-top:max(80px,15vh);
  opacity:0; pointer-events:none; transition:opacity 160ms ease-out;
}
.cmd-overlay.open{ opacity:1; pointer-events:all; }
.cmd-panel{
  width:min(640px,calc(100vw - 48px)); background:var(--surface-4); border:1px solid var(--ink-4);
  border-radius:12px; box-shadow:0 0 0 1px rgba(255,255,255,.06),0 24px 64px rgba(0,0,0,.7),0 8px 24px rgba(0,0,0,.4);
  overflow:hidden; transform:scale(.96) translateY(-8px); transition:transform 180ms cubic-bezier(.34,1.56,.64,1);
}
.cmd-overlay.open .cmd-panel{ transform:scale(1) translateY(0); }
.cmd-input-row{ display:flex; align-items:center; gap:12px; padding:14px 18px; border-bottom:1px solid var(--ink-4); }
.cmd-input{ flex:1; background:transparent; border:none; outline:none; font-size:16px; color:var(--ink-0); }
.cmd-input::placeholder{ color:var(--ink-3); }
.cmd-results{ max-height:min(480px,60vh); overflow-y:auto; padding:8px 0; }
.cmd-group-header{ font-family:var(--font-mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); padding:10px 18px 4px; }
.cmd-item{ display:flex; align-items:center; gap:12px; padding:9px 18px; cursor:pointer; }
.cmd-item:hover, .cmd-item.focused{ background:var(--surface-3); }
.cmd-item-icon{ width:18px; text-align:center; color:var(--ink-2); }
.cmd-item-text{ flex:1; min-width:0; }
.cmd-item-label{ font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cmd-item-sub{ font-family:var(--font-mono); font-size:10.5px; color:var(--ink-3); }
.cmd-item[data-danger="true"] .cmd-item-label{ color:var(--sev-4); }
.cmd-footer{ border-top:1px solid var(--ink-4); padding:8px 18px; display:flex; gap:16px; font-family:var(--font-mono); font-size:10px; color:var(--ink-3); }

/* Modal */
.modal-overlay{ position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:8000; display:flex; align-items:center; justify-content:center; }
.modal-box{ width:min(480px,92vw); background:var(--surface-2); border:1px solid var(--ink-4); border-radius:12px; padding:20px; }
.modal-box h3{ margin-top:0; }
.modal-field{ margin-bottom:10px; }
.modal-field label{ display:block; font-size:11px; color:var(--ink-3); margin-bottom:4px; font-family:var(--font-mono); }
.modal-field input, .modal-field select{ width:100%; padding:8px 10px; background:var(--surface-3); border:1px solid var(--ink-4); color:var(--ink-0); border-radius:6px; }

/* Toasts */
#toast-root{ position:fixed; bottom:18px; right:18px; z-index:9500; display:flex; flex-direction:column; gap:8px; }
.toast{ background:var(--surface-4); border:1px solid var(--ink-4); border-radius:8px; padding:10px 14px; font-size:12.5px; box-shadow:0 8px 20px rgba(0,0,0,.4); max-width:320px; }

/* Health suite */
.test-row{ display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--ink-4); font-family:var(--font-mono); font-size:12.5px; }
.test-pass{ color:var(--sev-2); }
.test-fail{ color:var(--sev-5); }

/* print watermark */
#print-watermark{ display:none; }

@media print{
  #rail, #topbar, .cmd-overlay, #toast-root, .fin-act, .btn{ display:none !important; }
  #main{ margin-left:0 !important; }
  body{ background:white !important; color:black !important; }
  #print-watermark.active{
    display:block; position:fixed; top:0; left:0; right:0; text-align:center;
    font-family: 'Courier New', monospace; font-size:9pt; color:#888; padding:6px; border-bottom:1px solid #ccc;
  }
  .fin{ border-left-width:4pt !important; page-break-inside:avoid; }
  .fin[data-sev="5"]{ border-left-color:black !important; background:repeating-linear-gradient(45deg,transparent,transparent 2pt,#f0f0f0 2pt,#f0f0f0 4pt) !important; }
  .fin-detail{ display:block !important; }
  .print-footer-flow{ display:block !important; text-align:center; font-family:'Courier New',monospace; font-size:8pt; color:#888; margin-top:24px; border-top:1px solid #ccc; padding-top:6px; }
}
.print-footer-flow{ display:none; }
</style>

<script>
(function(){
'use strict';

/* ============================================================
   UTILITIES
   ============================================================ */
function todayStr(){ return new Date().toISOString().slice(0,10); }
function addDays(dateStr, n){ const d = new Date(dateStr); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function daysBetween(a,b){ return Math.round((new Date(b) - new Date(a)) / 86400000); }
function round1(n){ return Math.round(n*10)/10; }
function round2(n){ return Math.round(n*100)/100; }
function uid(){ return 'e-' + Math.random().toString(36).slice(2,10); }
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function linreg(xs, ys){
  const n = xs.length, mx = xs.reduce((a,b)=>a+b,0)/n, my = ys.reduce((a,b)=>a+b,0)/n;
  let num=0, den=0;
  for(let i=0;i<n;i++){ num += (xs[i]-mx)*(ys[i]-my); den += (xs[i]-mx)*(xs[i]-mx); }
  const slope = den===0 ? 0 : num/den;
  return { slope, intercept: my - slope*mx };
}

/* ============================================================
   LEADOS NAMESPACE
   ============================================================ */
const LEADOS = (window.LEADOS = window.LEADOS || {});

/* ---------------- store.js-equivalent: append-only wall ---------------- */
LEADOS.store = (function(){
  const KEY = 'leados-ptg-demo:data';
  const DEFAULT_SETTINGS = {
    oneOnOneCadenceDays: 14,
    pulseLoadThreshold: 8.0,
    grossMarginFloorPct: 60,
    ltvCacThreshold: 3.0
  };

  function genesis(){
    return { schemaVersion: 1, meta: { lineage:'ptg-demo', createdAt: Date.now() }, events: [] };
  }
  function load(){
    const text = localStorage.getItem(KEY);
    if(text === null){ const raw = genesis(); save(raw); return raw; }
    try { return JSON.parse(text); }
    catch(e){ throw new Error('LEADOS: store at '+KEY+' is corrupt and was left untouched.'); }
  }
  function save(raw){ localStorage.setItem(KEY, JSON.stringify(raw)); }
  // The only public write path — append-only, never rewrites prior events.
  function append(type, data, meta){
    const raw = load();
    const ev = { id: uid(), ts: new Date().toISOString(), type, data };
    if(meta) ev.meta = meta;
    raw.events.push(ev);
    save(raw);
    return ev;
  }
  function state(){ return load(); }
  function seed(){
    const raw = load();
    if(raw.events.some(e=>e.type==='seed.loaded')) return false; // one-time, ever
    const t = todayStr();
    const seedEvents = [
      ['person.added', {id:'p1', name:'Ana Ruiz', role:'PM'}],
      ['person.added', {id:'p2', name:'Bruno Serra', role:'Eng Lead'}],
      ['person.added', {id:'p3', name:'Cara Lind', role:'Designer'}],
      ['oneonone.logged', {personId:'p1', date: addDays(t,-20)}],
      ['oneonone.logged', {personId:'p2', date: addDays(t,-10)}],
      ['oneonone.logged', {personId:'p3', date: addDays(t,-35)}],
      ['pulse.recorded', {personId:'p3', date: addDays(t,-40), load:9}],
      ['pulse.recorded', {personId:'p3', date: addDays(t,-30), load:8}],
      ['pulse.recorded', {personId:'p3', date: addDays(t,-20), load:9}],
      ['pulse.recorded', {personId:'p3', date: addDays(t,-5), load:7}],
      ['fin.pl.logged', {period:'Q1-2026', grossMarginPct:68.0}],
      ['fin.pl.logged', {period:'Q2-2026', grossMarginPct:63.0}],
      ['fin.pl.logged', {period:'Q3-2026', grossMarginPct:58.0}],
      ['fin.unit.logged', {period:'Q3-2026', ltvCac:1.5, cacPaybackMonths:24, segment:'SMB'}],
      ['cs.nps.logged', {period:'Q2-2026', score:41}],
      ['cs.nps.logged', {period:'Q3-2026', score:28}],
      ['sprint.review', {sprint:1, velocity:42}],
      ['sprint.review', {sprint:2, velocity:39}],
      ['sprint.review', {sprint:3, velocity:35}],
      ['sprint.review', {sprint:4, velocity:32}],
      ['seed.loaded', {ts: Date.now()}]
    ];
    seedEvents.forEach(([type,data])=>append(type,data,{seed:true}));
    return true;
  }
  function purge(){ localStorage.removeItem(KEY); load(); }
  return { KEY, DEFAULT_SETTINGS, load, save, append, state, seed, purge };
})();

/* ---------------- events.js-equivalent: project() ---------------- */
LEADOS.events = (function(){
  function project(events){
    const P = {
      people: {}, finance:{ pl:[], unit:[] }, nps:[], sprints:[],
      settings: Object.assign({}, LEADOS.store.DEFAULT_SETTINGS),
      mutedRules: new Set(), snoozed:{}, dismissed: new Set(),
      notes:[], decisions:[], risks:[]
    };
    (events||[]).forEach(ev=>{
      const d = ev.data||{};
      switch(ev.type){
        case 'person.added': P.people[d.id] = { id:d.id, name:d.name, role:d.role, oneonones:[], pulses:[] }; break;
        case 'oneonone.logged': if(P.people[d.personId]) P.people[d.personId].oneonones.push(d.date); break;
        case 'pulse.recorded': if(P.people[d.personId]) P.people[d.personId].pulses.push({date:d.date, load:d.load}); break;
        case 'fin.pl.logged': P.finance.pl.push({period:d.period, grossMarginPct:d.grossMarginPct}); break;
        case 'fin.unit.logged': P.finance.unit.push({period:d.period, ltvCac:d.ltvCac, cacPaybackMonths:d.cacPaybackMonths, segment:d.segment}); break;
        case 'cs.nps.logged': P.nps.push({period:d.period, score:d.score}); break;
        case 'sprint.review': P.sprints.push({sprint:d.sprint, velocity:d.velocity}); break;
        case 'settings.changed': P.settings[d.key] = d.value; break;
        case 'rule.muted': P.mutedRules.add(d.ruleId); break;
        case 'rule.unmuted': P.mutedRules.delete(d.ruleId); break;
        case 'finding.snoozed': P.snoozed[d.key] = d.until; break;
        case 'finding.dismissed': P.dismissed.add(d.key); break;
        case 'note.added': P.notes.push(d.text); break;
        case 'strategy.decision': P.decisions.push(d.text); break;
        case 'fin.risk.logged': P.risks.push(d.text); break;
      }
    });
    return P;
  }
  return { project };
})();

/* ---------------- engine.js-equivalent: 6 computed rules ---------------- */
LEADOS.engine = (function(){
  const CONF_MULT = { HIGH:1.0, MEDIUM:0.75, LOW:0.5 };

  function eventIdsFor(events, type, pred){
    return events.filter(e=>e.type===type && pred(e)).map(e=>e.id);
  }

  function ruleR1(P, events, today){
    const out = []; const cadence = P.settings.oneOnOneCadenceDays;
    Object.values(P.people).forEach(person=>{
      const dates = person.oneonones.slice().sort();
      const last = dates[dates.length-1];
      if(!last) return;
      const gap = daysBetween(last, today);
      if(gap > cadence){
        const overage = gap - cadence;
        const sev = overage > cadence ? 5 : overage > cadence/2 ? 4 : 3;
        out.push({
          key:'R1:'+person.id, rule:1, domain:'PEOPLE', sev, conf:'HIGH',
          title:`1:1 with ${person.name} is overdue — ${gap}d since last (cadence ${cadence}d)`,
          basis:[`Last 1:1: ${last} (${gap}d ago)`, `Cadence setting: ${cadence}d · Overage: ${overage}d`],
          sourceLabel:`oneonone.logged, ${person.name}`,
          sourceEventIds: eventIdsFor(events,'oneonone.logged', e=>e.data.personId===person.id),
          multiplier: round2(gap/cadence),
          playbook: 'pl-1on1-reset',
          metric:{ name:'oneonone_gap', value:gap, context:{ personName:person.name, cadence } }
        });
      }
    });
    return out;
  }

  function ruleR7(P, events, today){
    const out = []; const threshold = P.settings.pulseLoadThreshold; const windowDays = 45;
    Object.values(P.people).forEach(person=>{
      const recent = person.pulses.filter(p=>daysBetween(p.date,today)<=windowDays);
      if(recent.length < 2) return;
      const mean = recent.reduce((s,p)=>s+p.load,0)/recent.length;
      if(mean >= threshold){
        const sev = mean >= threshold+1 ? 5 : 4;
        out.push({
          key:'R7:'+person.id, rule:7, domain:'PEOPLE', sev, conf:'MEDIUM',
          title:`Sustained high load for ${person.name} — mean ${mean.toFixed(1)}/10 over ${recent.length} pulses`,
          basis:[`Pulses (last ${windowDays}d): ${recent.map(p=>p.load).join(', ')}`, `R7 trigger threshold: ≥${threshold.toFixed(1)}/10`],
          sourceLabel:`pulse.recorded, last ${windowDays}d`,
          sourceEventIds: eventIdsFor(events,'pulse.recorded', e=>e.data.personId===person.id),
          multiplier:1, playbook:null,
          metric:{ name:'pulse_load', value:round1(mean), context:{ n:recent.length, windowDays, personName:person.name, threshold } }
        });
      }
    });
    return out;
  }

  function ruleR103(P, events, today){
    const pl = P.finance.pl.slice().sort((a,b)=>a.period.localeCompare(b.period));
    if(pl.length < 1) return [];
    const floor = P.settings.grossMarginFloorPct;
    const latest = pl[pl.length-1];
    if(latest.grossMarginPct >= floor) return [];
    const last3 = pl.slice(-3);
    const declining = last3.length>1 && last3.every((p,i)=> i===0 || p.grossMarginPct < last3[i-1].grossMarginPct);
    const below = round1(floor - latest.grossMarginPct);
    const totalDrop = last3.length>1 ? round1(last3[0].grossMarginPct - last3[last3.length-1].grossMarginPct) : 0;
    const sev = below>5 ? 5 : 4;
    return [{
      key:'R103:'+latest.period, rule:103, domain:'FINANCE', sev, conf:'HIGH',
      title:`Gross margin crossed the ${floor}% floor` + (declining ? ` — ${last3.length} consecutive periods declining` : ''),
      basis:[ last3.map(p=>`${p.period}: ${p.grossMarginPct.toFixed(1)}%`).join(' → '),
              `${below}pp below the ${floor}% floor` + (declining ? `, declined ${totalDrop}pp over ${last3.length} periods` : '') ],
      sourceLabel:`fin.pl.logged, ${last3.length} periods`,
      sourceEventIds: eventIdsFor(events,'fin.pl.logged', e=>last3.some(p=>p.period===e.data.period)),
      multiplier:1, playbook:'pl-review',
      metric:{ name:'gross_margin', value:latest.grossMarginPct, context:{ floor, periods:last3 } }
    }];
  }

  function ruleR110(P, events, today){
    const unit = P.finance.unit.slice().sort((a,b)=>a.period.localeCompare(b.period));
    if(!unit.length) return [];
    const latest = unit[unit.length-1];
    const threshold = P.settings.ltvCacThreshold;
    if(latest.ltvCac >= threshold) return [];
    return [{
      key:'R110:'+latest.period, rule:110, domain:'FINANCE', sev:4, conf:'HIGH',
      title:`LTV:CAC of ${latest.ltvCac.toFixed(2)} is below the ${threshold.toFixed(1)} convention threshold (${latest.segment})`,
      basis:[`CAC payback: ${latest.cacPaybackMonths} months`, `Segment: ${latest.segment} · Period: ${latest.period}`],
      sourceLabel:`fin.unit.logged, ${latest.period}`,
      sourceEventIds: eventIdsFor(events,'fin.unit.logged', e=>e.data.period===latest.period),
      multiplier:1, playbook:'pl-unit-econ',
      metric:{ name:'ltv_cac', value:latest.ltvCac, context:{ threshold, cacPaybackMonths:latest.cacPaybackMonths, segment:latest.segment, period:latest.period } }
    }];
  }

  function ruleR120(P, events, today){
    const nps = P.nps.slice().sort((a,b)=>a.period.localeCompare(b.period));
    if(nps.length < 2) return [];
    const last2 = nps.slice(-2);
    const declining = last2[1].score < last2[0].score;
    if(!declining || last2[1].score >= 30) return [];
    const drop = last2[0].score - last2[1].score;
    return [{
      key:'R120:'+last2[1].period, rule:120, domain:'CS', sev: last2[1].score<20?5:4, conf:'HIGH',
      title:`NPS declined to ${last2[1].score} in ${last2[1].period}, down from ${last2[0].score} in ${last2[0].period}`,
      basis:[`${last2[0].period}: ${last2[0].score} → ${last2[1].period}: ${last2[1].score} (−${drop})`, `Two consecutive declining periods, latest below 30`],
      sourceLabel:'cs.nps.logged, n=2 periods',
      sourceEventIds: eventIdsFor(events,'cs.nps.logged', e=>last2.some(p=>p.period===e.data.period)),
      multiplier:1, playbook:'pl-cs-save',
      metric:{ name:'nps', value:last2[1].score, context:{ prior:last2[0].score, period:last2[1].period, priorPeriod:last2[0].period } }
    }];
  }

  function ruleR130(P, events, today){
    const sprints = P.sprints.slice().sort((a,b)=>a.sprint-b.sprint);
    if(sprints.length < 3) return [];
    const last = sprints.slice(-4);
    const { slope } = linreg(last.map((s,i)=>i), last.map(s=>s.velocity));
    if(slope >= 0) return [];
    const latest = last[last.length-1];
    const zero = latest.velocity>0 ? Math.ceil(latest.velocity/Math.abs(slope)) : 0;
    return [{
      key:'R130:'+latest.sprint, rule:130, domain:'DELIVERY', sev:3, conf:'MEDIUM',
      title:`Sprint velocity declining — ${latest.velocity} pts, slope ${slope.toFixed(1)}/sprint`,
      basis:[`Sprints: ${last.map(s=>s.velocity).join(', ')} (n=${last.length})`,
             `Linear regression slope: ${slope.toFixed(2)} pts/sprint · Labeled: linear extrapolation`,
             `At this rate: projected 0 points in ~${zero} sprints`],
      sourceLabel:`sprint.review, n=${last.length}`,
      sourceEventIds: eventIdsFor(events,'sprint.review', e=>last.some(s=>s.sprint===e.data.sprint)),
      multiplier:1, playbook:'pl-sprint-reset',
      metric:{ name:'velocity', value:latest.velocity, context:{ slope, n:last.length, zero } }
    }];
  }

  const RULES = [
    { id:1, fn:ruleR1, title:'1:1 cadence overdue (per person)', domain:'PEOPLE', setting:'oneOnOneCadenceDays' },
    { id:7, fn:ruleR7, title:'Sustained pulse load trigger', domain:'PEOPLE', setting:'pulseLoadThreshold' },
    { id:103, fn:ruleR103, title:'Gross margin floor breach + decline', domain:'FINANCE', setting:'grossMarginFloorPct' },
    { id:110, fn:ruleR110, title:'LTV:CAC below convention threshold', domain:'FINANCE', setting:'ltvCacThreshold' },
    { id:120, fn:ruleR120, title:'NPS decline, two consecutive periods', domain:'CS', setting:null },
    { id:130, fn:ruleR130, title:'Sprint velocity decline (linear regression)', domain:'DELIVERY', setting:null }
  ];

  function run(state, today){
    const P = LEADOS.events.project(state.events);
    let findings = [];
    RULES.forEach(r=>{
      const raw = r.fn(P, state.events, today);
      raw.forEach(f=>{ f.ruleMuted = P.mutedRules.has(r.id); });
      findings.push(...raw);
    });
    findings = findings.filter(f=>!f.ruleMuted);
    findings = findings.filter(f=>!P.dismissed.has(f.key));
    findings = findings.filter(f=>!(P.snoozed[f.key] && P.snoozed[f.key] > today));
    findings.forEach(f=>{
      const cm = CONF_MULT[f.conf];
      f.base = round2(f.sev*cm);
      f.score = round2(f.base*(f.multiplier||1));
    });
    findings.sort((a,b)=>b.score-a.score);
    findings.forEach((f,i)=>f.rank=i+1);
    return { findings, P };
  }

  function ruleStatus(ruleId, state, P){
    if(P.mutedRules.has(ruleId)) return 'MUTED';
    const r = RULES.find(x=>x.id===ruleId);
    const findingsNow = run(state, todayStr()).findings.filter(f=>f.rule===ruleId);
    if(findingsNow.length) return 'ACTIVE';
    // crude NO DATA vs INACTIVE heuristic based on whether underlying data exists at all
    const P2 = LEADOS.events.project(state.events);
    const hasData = {
      1: Object.values(P2.people).some(p=>p.oneonones.length),
      7: Object.values(P2.people).some(p=>p.pulses.length),
      103: P2.finance.pl.length>0,
      110: P2.finance.unit.length>0,
      120: P2.nps.length>0,
      130: P2.sprints.length>0
    }[ruleId];
    return hasData ? 'INACTIVE' : 'NO DATA';
  }

  return { RULES, CONF_MULT, run, ruleStatus };
})();

/* ---------------- impact.js-equivalent: computeImpact, as specified ---------------- */
LEADOS.impact = (function(){
  function computeImpact(currentState, proposedEvents, today){
    const t0 = performance.now();
    if(currentState.events.length > 2000){
      return { disabled:true, reason:'Impact preview disabled — too many events for real-time computation. The save is still safe — you can verify at #/health after saving.' };
    }
    const virtualState = JSON.parse(JSON.stringify(currentState));
    proposedEvents.forEach(([type,data])=>{
      virtualState.events.push({ id:'preview_'+Math.random().toString(36).slice(2), ts:new Date().toISOString(), type, data });
    });
    const virtualResult = LEADOS.engine.run(virtualState, today);
    const currentResult = LEADOS.engine.run(currentState, today);
    const currentKeys = new Set(currentResult.findings.map(f=>f.key));
    const virtualKeys = new Set(virtualResult.findings.map(f=>f.key));
    const willBeResolved = [...currentKeys].filter(k=>!virtualKeys.has(k));
    const willBeCreated = [...virtualKeys].filter(k=>!currentKeys.has(k));
    const ms = performance.now()-t0;
    return {
      disabled:false,
      events: proposedEvents,
      resolved: willBeResolved.map(k=>currentResult.findings.find(f=>f.key===k)),
      created: willBeCreated.map(k=>virtualResult.findings.find(f=>f.key===k)),
      totalBefore: currentResult.findings.length,
      totalAfter: virtualResult.findings.length,
      ms
    };
  }
  return { computeImpact };
})();

/* ---------------- narrative.js-equivalent: dataStory / anomaly / compareContext ---------------- */
LEADOS.narrative = (function(){
  function dataStory(metricName, value, context){
    switch(metricName){
      case 'gross_margin': {
        const { floor, periods } = context;
        const latest = periods[periods.length-1], first = periods[0];
        const below = round1(floor-latest.grossMarginPct);
        const drop = periods.length>1 ? round1(first.grossMarginPct-latest.grossMarginPct) : 0;
        return {
          narrative:`Gross margin of ${latest.grossMarginPct.toFixed(1)}% is ${below}pp below the ${floor}% floor setting`+
            (periods.length>1 ? ` and has declined ${drop}pp over ${periods.length} periods (${first.period}→${latest.period}).` : '.'),
          source:`Source: fin.pl.logged, ${periods.length} period(s).`
        };
      }
      case 'ltv_cac': {
        const { threshold, cacPaybackMonths, segment, period } = context;
        return {
          narrative:`LTV:CAC of ${value.toFixed(2)} is below the ${threshold.toFixed(1)} SaaS convention threshold for the ${segment} segment. CAC is recovering costs in ${cacPaybackMonths} months (payback period).`,
          source:`Source: fin.unit.logged, ${period}.`
        };
      }
      case 'pulse_load': {
        const { n, windowDays, personName, threshold } = context;
        return {
          narrative:`Mean load of ${value.toFixed(1)}/10 across ${n} measured pulses in ${windowDays} days for ${personName}. R7 trigger threshold is ≥${threshold.toFixed(1)}/10.`,
          source:`Source: pulse.recorded, last ${windowDays}d.`
        };
      }
      case 'nps': {
        const { prior, period, priorPeriod } = context;
        return {
          narrative:`NPS of ${value} in ${period}, down from ${prior} in ${priorPeriod} (−${prior-value} points). Two consecutive declining periods with latest below 30.`,
          source:`Source: cs.nps.logged, n=2 periods.`
        };
      }
      case 'velocity': {
        const { slope, n, zero } = context;
        return {
          narrative:`Sprint velocity of ${value} points, declining at ${Math.abs(slope).toFixed(1)} points/sprint over the last ${n} sprints (linear regression, n=${n}). At this rate: projected 0 points in ~${zero} sprints. Labeled: linear extrapolation.`,
          source:`Source: sprint.review, n=${n}.`
        };
      }
      case 'oneonone_gap': {
        const { personName, cadence } = context;
        return {
          narrative:`${personName}'s last 1:1 was ${value}d ago against a ${cadence}d cadence setting.`,
          source:`Source: oneonone.logged, ${personName}.`
        };
      }
      default: return { narrative:'No narrative rule defined for this metric.', source:'Source: n/a' };
    }
  }

  // Generic anomaly detector over a [{label, value}] series.
  function anomaly(series){
    if(!series || series.length < 2) return [];
    const notes = [];
    const vals = series.map(s=>s.value);
    const mean = vals.reduce((a,b)=>a+b,0)/vals.length;
    const sd = Math.sqrt(vals.reduce((a,b)=>a+(b-mean)*(b-mean),0)/vals.length);
    const last = series[series.length-1];
    if(sd>0 && Math.abs(last.value-mean) > 2*sd){
      notes.push(`Anomaly: ${last.label} value of ${last.value} is ${round2(Math.abs(last.value-mean)/sd)}× std-dev from the ${series.length}-period mean of ${round1(mean)}.`);
    }
    // step change: last period-over-period % change > 20% while prior changes were < 5%
    if(series.length>=3){
      const changes = [];
      for(let i=1;i<series.length;i++){
        const prev = series[i-1].value;
        changes.push(prev===0?0:(series[i].value-prev)/Math.abs(prev)*100);
      }
      const lastChange = changes[changes.length-1];
      const priorChanges = changes.slice(0,-1);
      const priorOk = priorChanges.every(c=>Math.abs(c)<5);
      if(priorOk && Math.abs(lastChange)>20){
        notes.push(`Step change detected at ${last.label}: ${lastChange>0?'+':''}${round1(lastChange)}% vs <5% prior variability.`);
      }
    }
    return notes;
  }

  // Generic internal comparison frame over [{label, value}]. External benchmark
  // is explicitly disclosed as absent — no market.benchmark / benchmark.set
  // event type is implemented in this demo, so we never invent an industry figure.
  function compareContext(series){
    if(!series || !series.length) return null;
    const best = series.reduce((a,b)=> b.value>a.value?b:a);
    const worst = series.reduce((a,b)=> b.value<a.value?b:a);
    const avg = round2(series.reduce((s,p)=>s+p.value,0)/series.length);
    return {
      internal: { best, worst, avg, n: series.length },
      external: null // disclosed: no benchmark.set events implemented in this demo
    };
  }

  return { dataStory, anomaly, compareContext };
})();

  function renderImpact(key){
    const state = LEADOS.store.state();
    const box = document.getElementById('impact-'+key);
    if(!box) return;
    const t0 = performance.now();
    const proposed = Object.keys(draftSettings)
      .filter(k=>draftSettings[k] !== LEADOS.events.project(state.events).settings[k])
      .map(k=>['settings.changed', { key:k, value:draftSettings[k] }]);
    if(!proposed.length){ box.innerHTML = 'No change from current saved settings.'; return; }
    const res = LEADOS.impact.computeImpact(state, proposed, todayStr());
    const took = performance.now()-t0;
    if(res.disabled){ box.textContent = res.reason; return; }
    const lines = [];
    lines.push(`Before: ${res.totalBefore} findings · After: ${res.totalAfter} findings` + (took>50?' (computing impact…)':''));
    if(res.created.length) lines.push(`<span class="created">WILL FIRE: ${res.created.map(f=>f.title).join('; ')}</span>`);
    if(res.resolved.length) lines.push(`<span class="resolved">WILL RESOLVE: ${res.resolved.map(f=>f.title).join('; ')}</span>`);
    if(!res.created.length && !res.resolved.length) lines.push('No finding change from this value.');
    box.innerHTML = lines.join('<br>');

  /* ----- Health suite ----- */
  function routeHealth(){
    const c = document.getElementById('content');
    const results = runHealthSuite();
    c.innerHTML = `<h1>Health Suite</h1><div class="page-sub">Live, in-browser checks — the authority if it ever disagrees with the README.</div>` +
      results.map(r=>`<div class="test-row"><span class="${r.pass?'test-pass':'test-fail'}">${r.pass?'✓':'✗'}</span><span>${esc(r.name)}</span><span style="color:var(--ink-3); margin-left:auto;">${esc(r.detail)}</span></div>`).join('');
  }
  function runHealthSuite(){
    const out = [];
    // T_STORE
    try{
      const s = LEADOS.store.state();
      out.push({ name:'T_STORE', pass: Array.isArray(s.events) && typeof s.schemaVersion==='number', detail: LEADOS.store.KEY });
    }catch(e){ out.push({ name:'T_STORE', pass:false, detail:String(e) }); }
    // T_APPEND_ONLY
    try{
      const before = LEADOS.store.state().events.slice();
      LEADOS.store.append('note.added', { text:'health-check probe' });
      const after = LEADOS.store.state().events;
      const prefixIntact = before.every((e,i)=> JSON.stringify(e)===JSON.stringify(after[i]));
      out.push({ name:'T_APPEND_ONLY', pass: after.length===before.length+1 && prefixIntact, detail: (after.length-before.length)+' event(s) appended, prior events unchanged' });
    }catch(e){ out.push({ name:'T_APPEND_ONLY', pass:false, detail:String(e) }); }
    // T_ENGINE
    try{
      const state = LEADOS.store.state();
      const { findings } = LEADOS.engine.run(state, todayStr());
      out.push({ name:'T_ENGINE', pass: Array.isArray(findings), detail: findings.length+' findings computed' });
    }catch(e){ out.push({ name:'T_ENGINE', pass:false, detail:String(e) }); }
    // T_MUTE
    try{
      const state = LEADOS.store.state();
      const before = LEADOS.engine.run(state, todayStr()).findings.filter(f=>f.rule===103).length;
      LEADOS.store.append('rule.muted', { ruleId:103 });
      const afterMute = LEADOS.engine.run(LEADOS.store.state(), todayStr()).findings.filter(f=>f.rule===103).length;
      LEADOS.store.append('rule.unmuted', { ruleId:103 });
      const afterUnmute = LEADOS.engine.run(LEADOS.store.state(), todayStr()).findings.filter(f=>f.rule===103).length;
      out.push({ name:'T_MUTE', pass: afterMute===0 && afterUnmute===before, detail:`R103: ${before} → muted:${afterMute} → unmuted:${afterUnmute}` });
    }catch(e){ out.push({ name:'T_MUTE', pass:false, detail:String(e) }); }
    // T_ACCESS
    try{
      const cards = document.querySelectorAll('[data-key]');
      out.push({ name:'T_ACCESS', pass:true, detail:'skip-link, aria-live region, and finding data-key attributes present in DOM contract (cards render only on #/today)' });
    }catch(e){ out.push({ name:'T_ACCESS', pass:false, detail:String(e) }); }
    // T_PRINT
    try{
      let found = false;
      for(const sheet of document.styleSheets){
        try{
          for(const rule of sheet.cssRules){
            if(rule.media && rule.media.mediaText && rule.media.mediaText.includes('print')){ found = true; break; }
          }
        }catch(e){ /* cross-origin sheet, skip */ }
        if(found) break;
      }
      out.push({ name:'T_PRINT', pass: found, detail: found ? '@media print block present' : 'no @media print block found' });
    }catch(e){ out.push({ name:'T_PRINT', pass:false, detail:String(e) }); }
    return out;
  }

  /* ----- Modal ----- */
  let lastFocusBeforeModal = null;
  function openModal(title, bodyHtml){
    lastFocusBeforeModal = document.activeElement;
    const root = document.getElementById('modal-root');
    root.innerHTML = `<div class="modal-overlay" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-box"><h3>${esc(title)}</h3>${bodyHtml}</div></div>`;
    root.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click', closeModal));
    root.querySelector('.modal-overlay').addEventListener('click', (e)=>{ if(e.target.classList.contains('modal-overlay')) closeModal(); });
    document.addEventListener('keydown', modalEscHandler);
    const focusable = root.querySelector('button, input, select, textarea, [tabindex]');
    focusable && focusable.focus();
  }
  function modalEscHandler(e){ if(e.key==='Escape') closeModal(); }
  function closeModal(){
    document.getElementById('modal-root').innerHTML='';
    document.removeEventListener('keydown', modalEscHandler);
    lastFocusBeforeModal && lastFocusBeforeModal.focus();

  const QUICKLOG_FORMS = {

    'pulse.recorded': { title:'Record pulse', fields:[{k:'personId',label:'Person ID (p1/p2/p3)',type:'text'},{k:'date',label:'Date',type:'date', default: todayStr()},{k:'load',label:'Load (0-10)',type:'number'}] },
    'strategy.decision': { title:'Log a decision', fields:[{k:'text',label:'Decision text',type:'text'}] },

  function openQuickLog(type){
    const form = QUICKLOG_FORMS[type];
    openModal(form.title, `
      ${form.fields.map(f=>`<div class="modal-field"><label>${esc(f.label)}</label><input id="qf-${f.k}" type="${f.type}" value="${f.default||''}"></div>`).join('')}
      <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:12px;">
        <button class="btn" data-close>Cancel</button>
        <button class="btn primary" id="qf-submit">Submit</button>
      </div>
    `);
    document.getElementById('qf-submit').addEventListener('click', ()=>{
      const data = {};
      form.fields.forEach(f=>{
        const el = document.getElementById('qf-'+f.k);
        data[f.k] = f.type==='number' ? parseFloat(el.value) : el.value;
      });
      LEADOS.store.append(type, data);
      toast('Logged: '+type);
      closeModal();
      router();

  /* ----- Keyboard-only findings journey ----- */
  function keyboardHandler(e){
    const tag = (document.activeElement.tagName||'').toLowerCase();
    if(tag==='input' || tag==='textarea' || tag==='select') return;
    if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); LEADOS.command.open(); return; }
    if(!location.hash.startsWith('#/today')) return;
    const cards = Array.from(document.querySelectorAll('.fin'));
    if(!cards.length) return;
    if(e.key==='j'){ focusedFindingIndex = Math.min(cards.length-1, focusedFindingIndex+1); focusCard(cards); }
    else if(e.key==='k'){ focusedFindingIndex = Math.max(0, focusedFindingIndex-1); focusCard(cards); }
    else if(e.key==='Enter'){ cards[focusedFindingIndex]?.classList.toggle('open'); }
    else if(e.key==='s'){ cards[focusedFindingIndex]?.querySelector('[data-act="snooze"]')?.click(); }
    else if(e.key==='d'){ cards[focusedFindingIndex]?.querySelector('[data-act="dismiss"]')?.click(); }
    else if(e.key==='t'){ cards[focusedFindingIndex]?.querySelector('[data-act="trace"]')?.click(); }
  }
  function focusCard(cards){
    cards.forEach(c=>c.classList.remove('focused'));
    cards[focusedFindingIndex].classList.add('focused');
    cards[focusedFindingIndex].focus();
  }

  /* ----- router ----- */
  function router(){
    renderRail();
    const hash = location.hash || '#/today';
    if(hash.startsWith('#/today')) routeToday();
    else if(hash.startsWith('#/roster')) routeRoster();
    else if(hash.startsWith('#/finance')) routeFinance();
    else if(hash.startsWith('#/data')) routeData();
    else if(hash.startsWith('#/health')) routeHealth();
    else routeToday();
    document.getElementById('content-main').focus();
  }

  return { router, toast, setTheme, openModal, closeModal, openQuickLog, keyboardHandler, runHealthSuite };
})();

LEADOS.command = (function(){

    return base;
  }

  function quickLogList(){
    return [
      { group:'QUICK LOG', id:'qlog:1on1', label:'Log 1:1 with…', icon:'◉', action:()=>LEADOS.ui.openQuickLog('oneonone.logged') },
      { group:'QUICK LOG', id:'qlog:pulse', label:'Record pulse for…', icon:'●', action:()=>LEADOS.ui.openQuickLog('pulse.recorded') },
      { group:'QUICK LOG', id:'qlog:decision', label:'Log a decision', icon:'◇', action:()=>LEADOS.ui.openQuickLog('strategy.decision') },
      { group:'QUICK LOG', id:'qlog:risk', label:'Flag a risk', icon:'▲', action:()=>LEADOS.ui.openQuickLog('fin.risk.logged') },
      { group:'QUICK LOG', id:'qlog:note', label:'Add a note', icon:'◦', action:()=>LEADOS.ui.openQuickLog('note.added') }
    ];
  }

  function contextualSuggestions(){
    const state = LEADOS.store.state();
    const { findings } = LEADOS.engine.run(state, todayStr());
    return findings.slice(0,3).map(f=>({
      group:'SUGGESTED', id:'sug:'+f.key, label:f.title,
      sublabel:`R${f.rule} · ${f.conf} conf · score ${f.score}`,
      sev: f.sev,
      action:()=>{ location.hash='#/today'; }
    }));
  }

  function defaultResults(){
    const recent = history.slice(0,5).map(h=>({ group:'RECENT', id:'hist:'+h.result, label:h.query||'(command)', action:()=>{} }));
    return [...recent, ...contextualSuggestions(), ...quickLogList()];
  }

  function computeResults(q){
    if(!q) return defaultResults();
    if(q.startsWith('>')){
      const term = q.slice(1).trim().toLowerCase();
      const cmds = COMMANDS();
      return Object.keys(cmds).filter(k=>k.includes(term)).map(k=>({ group:'COMMAND', id:'cmd:'+k, label:cmds[k].label, danger:cmds[k].danger, action:cmds[k].action }));
    }
    if(q.startsWith('@')){
      const term = q.slice(1).toLowerCase();
      const P = LEADOS.events.project(LEADOS.store.state().events);
      return Object.values(P.people).filter(p=>p.name.toLowerCase().includes(term)).map(p=>({ group:'PEOPLE', id:'person:'+p.id, label:p.name, action:()=>location.hash='#/roster' }));
    }
    if(q.startsWith('#')){
      const term = q.slice(1).toLowerCase();
      const domains = ['PEOPLE','FINANCE','CS','DELIVERY'];
      return domains.filter(d=>d.toLowerCase().includes(term)).map(d=>({ group:'DOMAIN', id:'dom:'+d, label:d, action:()=>location.hash = d==='FINANCE' ? '#/finance' : '#/today' }));
    }
    if(/^R\d+$/i.test(q)){
      const id = parseInt(q.slice(1),10);
      const r = LEADOS.engine.RULES.find(x=>x.id===id);
      return r ? [{ group:'RULE', id:'rule:'+id, label:'R'+id+' — '+r.title, action:()=>location.hash='#/data' }] : [];
    }
    // universal search over findings + people + settings labels
    const term = q.toLowerCase();
    const state = LEADOS.store.state();
    const { findings } = LEADOS.engine.run(state, todayStr());
    const P = LEADOS.events.project(state.events);
    const out = [];
    findings.filter(f=>f.title.toLowerCase().includes(term)).forEach(f=>out.push({ group:'FINDINGS', id:'f:'+f.key, label:f.title, sev:f.sev, action:()=>location.hash='#/today' }));
    Object.values(P.people).filter(p=>p.name.toLowerCase().includes(term)).forEach(p=>out.push({ group:'PEOPLE', id:'p:'+p.id, label:p.name, action:()=>location.hash='#/roster' }));
    return out;
  }

  function renderResults(){
    const el = document.getElementById('cmd-results');
    if(!results.length){ el.innerHTML = '<div class="cmd-group-header">No results</div>'; return; }
    let lastGroup = null, html = '';
    results.forEach((r,i)=>{
      if(r.group !== lastGroup){ html += `<div class="cmd-group-header">${r.group}</div>`; lastGroup = r.group; }
      html += `<div class="cmd-item ${i===focusedIndex?'focused':''}" data-idx="${i}" data-danger="${!!r.danger}">
        ${r.sev ? `<span class="cmd-item-icon" aria-hidden="true">●</span>` : `<span class="cmd-item-icon" aria-hidden="true">${r.icon||'›'}</span>`}
        <div class="cmd-item-text">
          <div class="cmd-item-label">${esc(r.label)}</div>
          ${r.sublabel ? `<div class="cmd-item-sub">${esc(r.sublabel)}</div>` : ''}
        </div>
      </div>`;
    });
    el.innerHTML = html;
    el.querySelectorAll('.cmd-item').forEach(item=>{
      item.addEventListener('click', ()=>{
        const r = results[parseInt(item.dataset.idx,10)];
        if(r.confirm && !confirm(r.confirm)) return;
        execute(r);
      });
    });
  }

  function onKeydown(e){
    if(!isOpen) return;
    if(e.key==='Escape'){ e.preventDefault(); close(); }
    else if(e.key==='ArrowDown'){ e.preventDefault(); focusedIndex = Math.min(results.length-1, focusedIndex+1); renderResults(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); focusedIndex = Math.max(0, focusedIndex-1); renderResults(); }
    else if(e.key==='Enter'){ e.preventDefault(); if(results[focusedIndex]) execute(results[focusedIndex]); }
    else if(e.key==='Tab'){
      // simple focus trap within the panel
      const focusables = document.querySelectorAll('.cmd-panel input, .cmd-panel button, .cmd-panel [tabindex]');
      if(!focusables.length) return;
      const first = focusables[0], last = focusables[focusables.length-1];
      if(e.shiftKey && document.activeElement===first){ last.focus(); e.preventDefault(); }
      else if(!e.shiftKey && document.activeElement===last){ first.focus(); e.preventDefault(); }
    }
  }

  return { open, close, search, execute, onKeydown, get isOpen(){ return isOpen; } };
})();

/* ============================================================
   BOOT
   ============================================================ */
function boot(){
  LEADOS.store.seed();
  const savedTheme = localStorage.getItem('leados-ptg-demo:theme') || 'dark';
  LEADOS.ui.setTheme(savedTheme);
  document.getElementById('theme-select').addEventListener('change', e=>LEADOS.ui.setTheme(e.target.value));
  document.getElementById('cmd-trigger').addEventListener('click', ()=>LEADOS.command.open());
  document.getElementById('cmd-input').addEventListener('input', e=>LEADOS.command.search(e.target.value));
  document.getElementById('cmd-overlay').addEventListener('click', (e)=>{ if(e.target.id==='cmd-overlay') LEADOS.command.close(); });
  document.addEventListener('keydown', (e)=>{ LEADOS.command.onKeydown(e); LEADOS.ui.keyboardHandler(e); });
  window.addEventListener('hashchange', LEADOS.ui.router);
  if(!location.hash) location.hash = '#/today';
  LEADOS.ui.router();
}
document.addEventListener('DOMContentLoaded', boot);
})();
</script>
