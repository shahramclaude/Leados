<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeadOS — Leadership Operating System</title>
<style>
/* ============ DESIGN SYSTEM — LeadOS session-10 ============ */
:root{
  --bg:#0c0f14; --bg2:#10141b; --panel:#131822; --panel2:#171e2b; --panel3:#1c2434;
  --line:#232c3d; --line2:#2d3a52; --ink:#e8edf6; --ink2:#9aa8bf; --ink3:#5d6c85;
  --acc:#e9b44c; --acc2:#f4cd7e; --acc-dim:#5a4a22;
  --red:#e5484d; --red-dim:#4a1d20; --amber:#f0a13c; --amber-dim:#463015;
  --green:#3fb68b; --green-dim:#123a2c; --blue:#5b9cf5; --blue-dim:#16283f;
  --violet:#9a7ff0; --violet-dim:#241f3d; --cyan:#4cc9d9; --cyan-dim:#123a40;
  --mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
  --sans:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --r:10px; --r2:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
::selection{background:var(--acc-dim);color:var(--acc2)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(233,180,76,.12)}
textarea{resize:vertical;min-height:72px}
label{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin:10px 0 4px}
svg.i{flex:none;vertical-align:-3px}
kbd.k{font-family:var(--mono);font-size:10px;background:var(--panel3);border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--ink2)}
/* ---- layout ---- */
#app{display:grid;grid-template-columns:228px 1fr;grid-template-rows:52px 1fr;height:100vh}
#topbar{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--bg2);border-bottom:1px solid var(--line)}
#brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:.02em;font-size:15px}
#brand .logo{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--acc),#a97a25);display:grid;place-items:center;color:#181206}
#saved{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink3)}
#saved.bad{color:var(--red);font-weight:700}
#nav{overflow-y:auto;padding:14px 10px 30px;background:var(--bg2);border-right:1px solid var(--line)}
#nav .grp{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);padding:14px 10px 6px;font-weight:700}
#nav a{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-weight:500;margin:1px 0;border:1px solid transparent}
#nav a:hover{background:var(--panel);color:var(--ink)}
#nav a.on{background:var(--panel2);color:var(--acc2);border-color:var(--line)}
#nav a .bdg{margin-left:auto;font-family:var(--mono);font-size:10px;background:var(--panel3);border-radius:20px;padding:0 7px;line-height:18px;color:var(--ink2)}
#nav a .bdg.hot{background:var(--red-dim);color:var(--red)}
#main{overflow-y:auto;padding:26px 30px 80px;scroll-behavior:smooth}
.wrap{max-width:1120px;margin:0 auto}
#datestamp{font-family:var(--mono);font-size:11px;color:var(--ink3)}
/* ---- components ---- */
.ph{display:flex;align-items:flex-end;gap:14px;margin:0 0 18px;flex-wrap:wrap}
.ph h1{font-size:24px;font-weight:800;letter-spacing:-.01em}
.ph .sub{color:var(--ink2);font-size:13px;margin-bottom:2px}
.ph .sp{flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:16px 18px;margin-bottom:14px}
.card.tight{padding:12px 14px}
.card.hl{border-color:var(--line2);background:var(--panel2)}
.ctitle{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-bottom:10px;display:flex;align-items:center;gap:7px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.row.wrap{flex-wrap:wrap}
.muted{color:var(--ink2)} .dim{color:var(--ink3)} .small{font-size:12px} .tiny{font-size:11px}
.mono{font-family:var(--mono)}
strong{font-weight:700}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:9px;font-weight:600;font-size:13px;border:1px solid var(--line2);background:var(--panel2);transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--acc);color:var(--acc2)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#181206}
.btn.pri:hover{background:var(--acc2);color:#181206}
.btn.dan{border-color:var(--red);color:var(--red);background:transparent}
.btn.dan:hover{background:var(--red-dim)}
.btn.ok{border-color:var(--green);color:var(--green)}
.btn.ok:hover{background:var(--green-dim)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:7px}
.btn.gh{border-color:transparent;background:transparent;color:var(--ink2)}
.btn.gh:hover{color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;border:1px solid var(--line2);color:var(--ink2);line-height:1.6;white-space:nowrap}
.chip.red{background:var(--red-dim);border-color:transparent;color:#ff9d9f}
.chip.amber{background:var(--amber-dim);border-color:transparent;color:#ffc87e}
.chip.green{background:var(--green-dim);border-color:transparent;color:#7fe3bd}
.chip.blue{background:var(--blue-dim);border-color:transparent;color:#9cc4fb}
.chip.violet{background:var(--violet-dim);border-color:transparent;color:#c4b3f8}
.chip.gold{background:var(--acc-dim);border-color:transparent;color:var(--acc2)}
.chip.plain{background:var(--panel3);border-color:transparent}
table.tb{width:100%;border-collapse:collapse;font-size:13px}
.tb th{text-align:left;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);padding:8px 10px;border-bottom:1px solid var(--line);font-weight:700}
.tb td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tb tr:last-child td{border-bottom:0}
.tb tr.hov:hover td{background:var(--panel2)}
.tb tr.clk{cursor:pointer}
.bar{height:7px;border-radius:6px;background:var(--panel3);overflow:hidden;min-width:50px}
.bar>i{display:block;height:100%;border-radius:6px;background:var(--green);transition:width .4s}
.bar>i.warn{background:var(--amber)} .bar>i.bad{background:var(--red)} .bar>i.gold{background:var(--acc)} .bar>i.blue{background:var(--blue)}
.listit{display:flex;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);align-items:flex-start}
.listit:last-child{border-bottom:0}
.tick{width:8px;height:8px;border-radius:8px;margin-top:7px;flex:none}
.empty{padding:34px 20px;text-align:center;color:var(--ink3);border:1px dashed var(--line2);border-radius:var(--r2);font-size:13px}
.empty .big{font-size:15px;color:var(--ink2);font-weight:600;margin-bottom:4px}
.stat{padding:14px 16px}
.stat .n{font-size:26px;font-weight:800;font-family:var(--mono);letter-spacing:-.02em}
.stat .l{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.hr{height:1px;background:var(--line);margin:14px 0;border:0}
/* pace banner */
.pace{display:flex;align-items:center;gap:16px;border-radius:var(--r2);padding:14px 18px;border:1px solid;margin-bottom:18px;flex-wrap:wrap}
.pace.GREEN{background:var(--green-dim);border-color:#1e5c46}
.pace.STEADY{background:var(--blue-dim);border-color:#274b75}
.pace.LOADED{background:var(--amber-dim);border-color:#7a531d}
.pace.REDLINE{background:var(--red-dim);border-color:#7a2b2e}
.pace .word{font-weight:800;letter-spacing:.1em;font-size:13px;font-family:var(--mono)}
/* stepper */
.steps{display:flex;gap:0;margin:6px 0 14px;flex-wrap:wrap}
.step{flex:1;min-width:90px;text-align:center;position:relative;padding-top:22px;font-size:11px;color:var(--ink3);font-weight:600}
.step::before{content:'';position:absolute;top:8px;left:50%;transform:translateX(-50%);width:14px;height:14px;border-radius:20px;background:var(--panel3);border:2px solid var(--line2)}
.step::after{content:'';position:absolute;top:14px;left:calc(-50% + 9px);width:calc(100% - 18px);height:2px;background:var(--line2)}
.step:first-child::after{display:none}
.step.done{color:var(--green)} .step.done::before{background:var(--green);border-color:var(--green)} .step.done::after{background:var(--green)}
.step.now{color:var(--acc2)} .step.now::before{background:var(--acc);border-color:var(--acc);box-shadow:0 0 0 4px rgba(233,180,76,.18)}
/* modal + palette */
#modalHost{position:fixed;inset:0;display:none;z-index:80}
#modalHost.on{display:block}
.mback{position:absolute;inset:0;background:rgba(5,7,10,.72);backdrop-filter:blur(3px)}
.mbox{position:relative;margin:5vh auto 0;max-width:640px;width:calc(100% - 40px);max-height:86vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:22px 24px;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:pop .18s ease-out}
.mbox.wide{max-width:860px}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}}
.mbox h2{font-size:17px;font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:10px}
.mbox .msub{color:var(--ink2);font-size:12.5px;margin-bottom:10px}
.mfoot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
/* toasts */
#toasts{position:fixed;right:18px;bottom:18px;z-index:100;display:flex;flex-direction:column;gap:8px;max-width:360px}
.toast{background:var(--panel2);border:1px solid var(--line2);border-left:3px solid var(--acc);border-radius:10px;padding:11px 14px;font-size:13px;box-shadow:0 12px 34px rgba(0,0,0,.5);animation:pop .2s;display:flex;gap:9px;align-items:flex-start}
.toast.ok{border-left-color:var(--green)} .toast.bad{border-left-color:var(--red)}
/* form rows */
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.check{display:flex;gap:9px;align-items:flex-start;padding:8px 0;font-size:13px}
.check input{width:auto;margin-top:3px}
.note{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:8px;padding:10px 13px;font-size:12.5px;color:var(--ink2);margin:10px 0}
.note.warn{border-left-color:var(--amber);background:var(--amber-dim);color:#ffd9a1}
.note.bad{border-left-color:var(--red);background:var(--red-dim);color:#ffb4b5}
.note.ok{border-left-color:var(--green);background:var(--green-dim);color:#a9ecd2}
.sig{font-family:var(--mono);font-size:10px;padding:1px 7px;border-radius:5px;font-weight:700;letter-spacing:.05em}
.sig.live{background:var(--green-dim);color:var(--green)}
.sig.pend{background:var(--panel3);color:var(--ink3)}
.qcard{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--panel2);cursor:pointer;font-size:13px}
.qcard:hover{border-color:var(--acc)}
.qcard.sel{border-color:var(--acc);background:var(--acc-dim)}
.wireline{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.wireline:last-child{border-bottom:0}
.wireline .wk{font-family:var(--mono);font-size:10px;color:var(--ink3);min-width:96px;text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.slabar{display:flex;align-items:center;gap:9px}
.slab{position:relative;height:8px;flex:1;background:var(--panel3);border-radius:6px;overflow:visible;min-width:60px}
.slab>i{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
.slab .today{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink2)}
.spark{display:block}
.gridbox{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px}
.perscell{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--panel2);cursor:pointer}
.perscell:hover{border-color:var(--acc)}
.triad{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;width:96px}
.triad div{aspect-ratio:1;border-radius:4px;border:1px solid var(--line2);display:grid;place-items:center;font-size:9px;color:var(--ink3);cursor:pointer;background:var(--panel3)}
.triad div.hot{background:var(--acc);color:#181206;border-color:var(--acc);font-weight:800}
.triad div.stale{opacity:.4}
.tourq{font-size:15px;font-weight:600;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);margin-bottom:8px}
.lessonck{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:var(--panel2)}
.lessonck .opt{display:block;padding:7px 10px;border-radius:7px;cursor:pointer;margin-top:4px;border:1px solid transparent;font-size:13px}
.lessonck .opt:hover{background:var(--panel3)}
.lessonck .opt.right{border-color:var(--green);background:var(--green-dim)}
.lessonck .opt.wrong{border-color:var(--red);background:var(--red-dim)}
.capgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.topnav2{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab2{padding:7px 13px;border-radius:9px;border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink2);cursor:pointer}
.tab2.on{background:var(--panel2);color:var(--acc2);border-color:var(--line2)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px;border:2px solid var(--bg)}
@media (max-width:960px){
  #app{grid-template-columns:64px 1fr}
  #nav a span.t,#nav .grp{display:none}
  #nav a .bdg{display:none}
  .grid2,.grid3,.grid4,.frow,.frow3{grid-template-columns:1fr}
  #main{padding:18px 14px 60px}
}
</style>
</head>
<body>
<div id="app">
  <div id="topbar"></div>
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div id="modalHost"><div class="mback"></div><div class="mbox" id="mbox"></div></div>
<div id="toasts"></div>
<script>
'use strict';
/* ================= UTIL ================= */
const U={
  esc:s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),
  uid:p=>(p||'x')+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,7),
  today:()=>new Date().toISOString().slice(0,10),
  now:()=>new Date().toISOString(),
  addD:(iso,n)=>{const d=new Date((iso||U.today())+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)},
  dB:(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5), // days from a to b
  age:iso=>U.dB(iso,U.today()),
  fmt:iso=>{if(!iso)return '—';const d=new Date(iso+'T12:00:00');return d.toLocaleDateString('en-US',{month:'short',day:'numeric'})},
  fmtY:iso=>{if(!iso)return '—';return new Date(iso+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})},
  dow:iso=>new Date(iso+'T12:00:00').toLocaleDateString('en-US',{weekday:'short'}),
  clamp:(v,a,b)=>Math.max(a,Math.min(b,v)),
  avg:a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0,
  sum:a=>a.reduce((x,y)=>x+y,0),
  pct:(a,b)=>b?Math.round(100*a/b):0,
  plural:(n,w)=>n+' '+w+(n===1?'':'s'),
  href:p=>location.hash=p,
  copy:t=>{try{navigator.clipboard.writeText(t)}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}},
  deb:(f,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>f(...a),ms)}},
  download:(name,text)=>{const b=new Blob([text],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),800)},
  titleCase:s=>s.replace(/\w\S*/g,t=>t[0].toUpperCase()+t.slice(1))
};
/* ICON — inline lucide-style stroke icons, zero network dependency */
const IC={
  home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-6h6v6"/>',
  zap:'<path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/>',
  brief:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M3 12h18"/>',
  net:'<circle cx="12" cy="5" r="2.4"/><circle cx="5" cy="18" r="2.4"/><circle cx="19" cy="18" r="2.4"/><path d="M12 7.4v4.1M12 11.5 6.5 16M12 11.5 17.5 16"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.4 3.2-5 6.5-5s5.9 1.6 6.5 5"/><circle cx="17.5" cy="9" r="2.6"/><path d="M16.5 14.6c2.8.2 4.5 1.7 5 4.4"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c.8-4 3.8-6 7.5-6s6.7 2 7.5 6"/>',
  msgs:'<path d="M4 5h16v9H9l-5 4V5z"/><path d="M8 9h8M8 12h5"/>',
  msq:'<path d="M4 5h16v12H9l-5 4V5z"/><path d="M9 9h6M9 12.5h4"/>',
  compass:'<circle cx="12" cy="12" r="9"/><path d="m15 9-2.2 4.8L8 16l2.2-4.8L15 9z"/>',
  hand:'<path d="M7 11V6a1.6 1.6 0 0 1 3.2 0v4M10.2 10V4.4a1.6 1.6 0 0 1 3.2 0V10M13.4 10V5.6a1.6 1.6 0 0 1 3.2 0V12"/><path d="M7 11c-1.8-.4-3 .8-2.4 2.6L7.4 20c.5 1.3 1.7 2 3.1 2h4.4c1.7 0 3.1-1 3.7-2.6l1.4-3.9c.6-1.8-.6-3.1-2.4-2.8l-1 .3"/><path d="M7 13.5V11"/>',
  flag:'<path d="M5 21V4"/><path d="M5 4c4-2 7 2 12 0v9c-5 2-8-2-12 0"/>',
  branch:'<circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="8" r="2.5"/><path d="M6 8.5v7M18 10.5c0 4-5 3.5-8 5"/>',
  pulse:'<path d="M3 12h4l2.5-6 4 12 2.5-6H21"/>',
  rotate:'<path d="M3 12a9 9 0 1 0 2.6-6.4"/><path d="M3 4v5h5"/>',
  calck:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 9.5h18"/><path d="m9.5 15 2 2 3.5-4"/>',
  book:'<path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v17.5H6.5A2.5 2.5 0 0 0 4 22V4.5z"/><path d="M8 7h8M8 11h6"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
  db:'<ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5V18.5c0 1.7 3.6 3 8 3s8-1.3 8-3V5.5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>',
  check:'<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>',
  warn:'<path d="M12 3 2.5 20h19L12 3z"/><path d="M12 9.5v4.5M12 17.5h.01"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5.5l3.5 2"/>',

teamPulse(st,leadId){const tp=st.pulses.filter(p=>p.teamId===leadId).sort((a,b)=>a.at<b.at?1:-1)[0];
  if(tp)return {pulse:tp,scoped:true};
  const org=st.pulses.filter(p=>!p.teamId).sort((a,b)=>a.at<b.at?1:-1)[0];
  return {pulse:org||null,scoped:false,note:org?'Org-wide pulse — no team-scoped reading yet':null};},
/* --- 26 bench score --- */
benchScore(st,person){const reasons=[];let sc=0;
  const nb=FW.nineBox(person.nineBox);
  if(person.nineBox?.perf){let bnb=(person.nineBox.perf+person.nineBox.pot)*5;
    if(nb.stale){bnb=Math.round(bnb/2);reasons.push(['Nine-box stamp stale >120d — halved ('+nb.band+' → ×0.5)']);}
    else reasons.push(['Nine-box '+nb.band+' ('+person.nineBox.perf+'/'+person.nineBox.pot+')']);
    sc+=U.clamp(bnb,0,30);}
  else reasons.push(['No nine-box stamp — succession is guesswork']);
  const dels=st.delegations.filter(d=>d.personId===person.id&&d.verdict);
  const aut=dels.filter(d=>d.verdict==='autonomous'&&d.rung>=4).length;
  if(aut){sc+=Math.min(25,aut*12);reasons.push([U.plural(aut,'autonomous verdict')+' at rung 4-5']);}
  const bou=dels.filter(d=>d.verdict==='bounced').length;if(bou){sc-=bou*8;reasons.push([U.plural(bou,'bounced delegation')+' — readiness doubt']);}
  const grows=st.sessions.filter(s=>s.personId===person.id&&s.kind==='grow'&&s.quality!=null);
  if(grows.length){const q=U.avg(grows.map(g=>g.quality));sc+=q>=70?12:q>=50?6:0;reasons.push(['Coaching arc avg quality '+Math.round(q)+'%']);}
  const fr=FW.flightRisk(st,person);if(fr.band==='HIGH'){sc-=20;reasons.push(['Flight risk HIGH — promoting a leaver']);}
  else if(fr.band==='MEDIUM'){sc-=8;reasons.push(['Flight risk MEDIUM']);}
  const load=FW.loadPressure(st,person.id);if(load.band==='REDLINE'){sc-=10;reasons.push(['Already at redline load — promotion would break them or the team']);}
  sc=U.clamp(Math.round(sc),0,100);
  return {score:sc,band:sc>=62?'READY NOW':sc>=34?'READY IN 6M':'GAP',reasons};},
teamBench(st,lead){const directs=st.people.filter(p=>p.managerId===lead.id);
  const scored=directs.map(d=>({p:d,b:FW.benchScore(st,d)})).sort((a,b)=>b.b.score-a.b.score);
  const best=scored[0];
  return {candidates:scored,verdict:best?best.b.band:'GAP',
    reason:best?(best.b.reasons[0]||'No drivers on record'):'No direct reports — the bench is empty by definition'};},
/* --- 27 transition signals + score --- */
transitionSignals(st){const tr=st.transition;const stakes=tr.stakeholders||[];
  const hiInf=stakes.filter(s=>s.influence>=4);
  const toured=hiInf.filter(s=>s.touredAt);
  const maps=stakes.length>=4&&hiInf.length>=1;
  const wins=(tr.wins||[]).length;
  const conduits=st.people.filter(p=>p.isLead);
  const conduitOk=conduits.length>0&&conduits.every(l=>{const last=st.sessions.filter(s=>s.personId===l.id&&s.kind==='1:1').map(s=>s.at).sort().pop();return last&&U.age(last)<=(l.cadenceDays||7)*1.5});
  const decisions=st.decisions.filter(d=>U.age(d.at)<=90).length;
  const verdicts=st.delegations.filter(d=>d.verdict).length;
  const leads=st.people.filter(p=>p.isLead);
  const benches=leads.map(l=>FW.teamBench(st,l).verdict);
  const dayNo=st.me.startDate?U.age(st.me.startDate):0;
  return {dayNo,
    map:maps,tourPct:hiInf.length?toured.length/hiInf.length:0,tourCount:stakes.filter(s=>s.touredAt).length,
    sessions3:st.sessions.filter(s=>s.kind==='tour').length>=3,
    baseGoals:st.goals.filter(g=>g.status==='active').length>=1,
    conduit:conduitOk,wins,decisionIn90:decisions>=1,verdicts:verdicts>=1,
    benchStated:leads.length>0&&benches.every(b=>b),
    seg:{diag:dayNo<=30,align:dayNo>30&&dayNo<=60,exec:dayNo>60}};},
transitionScore(st){const gates=Object.values(st.transition.gates||{}).filter(g=>g.closed).length;
  return {closed:gates,total:12,pct:Math.round(100*gates/12)};},
/* --- 28 estimated-aware week spark data (pressure: case sev opened per wk, 8 back) --- */
pressureSeries(st){const out=[];for(let w=7;w>=0;w--){const start=U.addD(U.today(),-7*(w+1)+1),end=U.addD(U.today(),-7*w);
    const v=st.cases.filter(c=>c.opened>=start&&c.opened<=end).reduce((a,c)=>a+c.sev,0);
    out.push({w:w===0?'now':'-'+w+'w',v});}
  return out;}
};

  const tour=kind==='tour';const grow=kind==='grow';
  Modal.open(`<h2>${icon(tour?'map':grow?'compass':'msgs',18)} ${tour?'Listening-tour session':grow?'GROW coaching':'Session'} — ${U.esc(p.name)}</h2>
  <div class="msub">${tour?'Five questions. Listen; do not defend. Follow-through lands on their agenda.':grow?'Quality score is live. Thin stages are called out, not vibes.':'The agenda below is machine-assembled from live sources and is consumed on finish.'}</div>
  ${tour?`<label>Stakeholder (off-chart allowed)</label><select id="s_stake"><option value="">— not on the map —</option>${(ST.transition.stakeholders||[]).map(s=>`<option value="${s.id}" ${opts.stakeId===s.id?'selected':''}>${U.esc(s.name)} (${s.role})</option>`).join('')}</select>
  <div style="margin:10px 0">${TOUR_Q.map((q,i)=>`<div class="tourq">${i+1}. ${q}</div>`).join('')}</div>
  <label>What you heard (patterns, not verdicts)</label><textarea id="s_notes"></textarea>`:''}
  ${grow?`<div id="gbox">
  <label>Goal — one concrete outcome</label><textarea id="g_g"></textarea>
  <label>Reality — facts, dates, artifacts</label><textarea id="g_r"></textarea>
  <label>Options — one per line, ≥2</label><textarea id="g_o"></textarea>
  <label>Will — first step + date</label><textarea id="g_w"></textarea>
  <div id="gscore"></div></div>`:''}
  ${agenda.length?`<div class="ctitle">Auto-assembled agenda (${agenda.length}) — tick what you covered</div>
  ${agenda.map(a=>`<label class="check"><input type="checkbox" class="s_ag" value="${a.id}" style="width:auto"><span>${U.esc(a.text)} <span class="chip plain tiny">${a.src}</span></span></label>`).join('')}`:''}
  <label>Openers (pick energy, not all)</label>
  <div class="gridbox">${OPENERS.map(o=>`<div class="qcard" data-ins="s_free">${U.esc(o)}</div>`).join('')}</div>
  <label>Free notes — commitments made here should become loops (commit: @name … by …)</label><textarea id="s_free"></textarea>
  <div class="frow3"><div><label>Energy <span class="dim tiny">(telemetry)</span></label><input type="range" min="1" max="5" step="1" value="3" class="s_sl" id="s_e"></div>
  <div><label>Morale</label><input type="range" min="1" max="5" step="1" value="3" class="s_sl" id="s_m"></div>
  <div><label>Load stress</label><input type="range" min="1" max="5" step="1" value="3" class="s_sl" id="s_l"></div></div>
  <div class="note">Sliders untouched → stored as <strong>estimated</strong> (≈ chip, never moves a slope). Touch any slider to make the whole reading real.</div>
  <div class="mfoot"><button class="btn gh" data-act="closeModal">Cancel</button><button class="btn pri" id="s_done">${icon('check',14)} Finish & file</button></div>`,true);
  let touched=false;document.querySelectorAll('.s_sl').forEach(s=>s.addEventListener('input',()=>touched=true));
  document.querySelectorAll('[data-ins]').forEach(q=>q.onclick=()=>{const ta=document.getElementById(q.dataset.ins);ta.value=(ta.value?ta.value+'\n':'')+q.textContent.trim()+' — '});
  if(grow){const score=()=>{const q=FW.growQuality({g:gv('g_g'),r:gv('g_r'),o:gv('g_o'),w:gv('g_w')});
    document.getElementById('gscore').innerHTML=`<div class="row"><div class="bar" style="flex:1"><i class="${q.score>=70?'':'warn'} gold" style="width:${q.score}%"></i></div><span class="mono small">${q.score}%</span></div>${q.tips.map(t=>`<div class="tiny muted">${icon('warn',11)} ${t}</div>`).join('')}`};
    const gv=id=>document.getElementById(id).value;
    ['g_g','g_r','g_o','g_w'].forEach(id=>document.getElementById(id).addEventListener('input',score));score()}
  document.getElementById('s_done').onclick=()=>{
    const s={id:U.uid('s'),personId,kind:kind==='1:1'?'1:1':kind,at:U.today(),
      notes:(document.getElementById('s_free')?.value||'')+(tour?('\n[TOUR] '+(document.getElementById('s_notes')?.value||'')):''),
      mood:{energy:+document.getElementById('s_e')?.value||3,morale:+document.getElementById('s_m')?.value||3,load:+document.getElementById('s_l')?.value||3,estimated:!touched},
      agendaDone:[...document.querySelectorAll('.s_ag:checked')].map(c=>c.value)};
    if(grow){s.quality=FW.growQuality({g:gv2('g_g'),r:gv2('g_r'),o:gv2('g_o'),w:gv2('g_w')}).score;
      s.agendaDone=[];s.notes='G:'+gv2('g_g')+'\nR:'+gv2('g_r')+'\nO:'+gv2('g_o')+'\nW:'+gv2('g_w')}
    function gv2(id){return document.getElementById(id)?.value||''}
    if(tour){const sid=document.getElementById('s_stake')?.value;
      commit(st=>{ENG.finishSession(s);
        if(sid){const sk=st.transition.stakeholders.find(x=>x.id===sid);if(sk)sk.touredAt=s.at;sk&&(sk.linkedId=p.id)}
        st.agenda.unshift({id:U.uid('a'),personId,text:'Tour follow-through: close the loop on what you heard (one action, one date)',source:'tour:'+s.id,at:U.now(),consumed:false});
        Modal.close()},'Tour logged — stakeholder stamped, follow-through queued on '+p.name.split(' ')[0]+'’s agenda.');
      return}
    commit(st=>{ENG.finishSession(s);Modal.close()},(kind==='1:1'?'1:1 filed':grow?'GROW arc filed — quality '+s.quality+'%':'Session filed')+(s.mood.estimated?' · telemetry estimated (≈)':''));};
},
composer(pre){pre=pre||{};
  const MODELS={SBI:[['s','Situation — when, where, which artifact'],['b','Behavior — observable only, no character words'],['i','Impact — the consequence, measurable']],
   AID:[['a','Action — what was done, observable'],['i','Impact — the consequence, measurable'],['d','Desired change — one behavior, one date']],
   COIN:[['c','Context — when, where'],['o','Observation — observable only'],['i','Impact — measurable'],['n','Next step — one behavior, one date']]};
  Modal.open(`<h2>${icon('msq',18)} ${pre.fid?'Edit draft':'Compose feedback'}</h2>
  <div class="msub">Live lint underneath. Vague slides off; specific lands. Praise ships inside 48h, corrections 72h.</div>
  <div class="frow3"><div><label>Person</label><select id="fb_p">${personOpts(pre.personId)}</select></div>
  <div><label>Kind</label><select id="fb_k"><option value="praise" ${pre.kind==='praise'?'selected':''}>Praise</option><option value="correction" ${pre.kind==='correction'?'selected':''}>Correction</option></select></div>
  <div><label>Model</label><select id="fb_m">${Object.keys(MODELS).map(m=>`<option ${pre.model===m?'selected':''}>${m}</option>`).join('')}</select></div></div>
  <div id="fb_parts"></div><div id="fb_lint"></div>
  <div class="mfoot"><button class="btn gh" data-act="closeModal">Cancel</button>
  <button class="btn" id="fb_draft">${icon('pen',14)} Save draft</button>
  <button class="btn pri" id="fb_deliver">${icon('send',14)} Deliver now (verification armed)</button></div>`,true);
  const $=id=>document.getElementById(id);
  const readParts=()=>{const m=$('fb_m').value;const o={};MODELS[m].forEach(([k])=>o[k]=$('f_'+k)?.value||'');return o};
  const drawParts=()=>{const m=$('fb_m').value;
    $('fb_parts').innerHTML=MODELS[m].map(([k,lab])=>`<label style="text-transform:none;font-size:12px;letter-spacing:0;color:var(--ink2)"><strong style="color:var(--acc2)">${k.toUpperCase()}</strong> · ${lab}</label><textarea id="f_${k}" rows="2">${U.esc(pre.parts?.[k]||(k==='s'&&pre.seed?pre.seed:''))}</textarea>`).join('');
    if(pre.seed)m==='SBI'&&($('f_s').value=pre.seed);
    MODELS[m].forEach(([k])=>$('f_'+k).addEventListener('input',lint));lint();};
  const lint=()=>{const q=FW.fbLint($('fb_m').value,readParts());
    $('fb_lint').innerHTML=`<div class="row" style="margin-top:10px"><div class="bar" style="flex:1"><i class="gold ${q.score>=70?'':'warn'}" style="width:${q.score}%"></i></div><span class="mono small">${q.score}% lint</span></div>
    ${q.tips.slice(0,4).map(t=>`<div class="tiny muted" style="margin-top:3px">${icon('warn',11)} ${U.esc(t)}</div>`).join('')}`};
  $('fb_m').onchange=()=>{pre.parts=readParts();drawParts()};drawParts();
  const file=asDelivered=>{const pid=$('fb_p').value;if(!pid){toast('Pick a person — feedback without a recipient is a diary.','bad');return}
    const kind=$('fb_k').value,m=$('fb_m').value,parts=readParts();
    if(Object.values(parts).some(v=>v.trim().length<3)){toast('Fill every segment — a partial '+m+' is a riddle.','bad');return}
    commit(st=>{let f;
      if(pre.fid){f=st.feedback.find(x=>x.id===pre.fid);Object.assign(f,{personId:pid,kind,model:m,parts,created:f.created||U.today()})}
      else{f={id:U.uid('f'),personId:pid,kind,model:m,parts,status:'draft',created:U.today()};st.feedback.unshift(f)}
      if(asDelivered){f.status='delivered';f.deliveredAt=U.today();
        if(kind==='correction'){f.verifyAt=U.addD(U.today(),21);
          st.tasks.unshift({id:U.uid('t'),fb:f.id,title:'Verify correction held (+21d): '+(parts.b||parts.a||'').slice(0,60)+' → '+(ENG.person(pid)?.name||''),due:f.verifyAt,origin:'fbverify',done:false,route:'#/feedback'})}
        if(kind==='praise'){const p=ENG.person(pid);p&&p.evidence.unshift({id:U.uid('e'),at:U.now(),text:'[Praise delivered] '+Object.values(parts).join(' · '),caseId:null})}}
      Modal.close()},asDelivered?(kind==='correction'?'Delivered — verification armed +21d.':'Delivered — inside the 48h window.'):'Draft saved — the shelf-life clock is running.');};
  $('fb_draft').onclick=()=>file(false);$('fb_deliver').onclick=()=>file(true);}
};

const V={};
const ph=(t,sub,acts)=>`<div class="ph"><div><h1>${t}</h1>${sub?`<div class="sub">${sub}</div>`:''}</div><div class="sp"></div>${acts||''}</div>`;
const sparkSvg=(pts,w=120,h2=30)=>{const mx=Math.max(...pts.map(p=>p.v),1);const step=w/Math.max(pts.length-1,1);
  const d=pts.map((p,i)=>`${i===0?'M':'L'}${(i*step).toFixed(1)},${(h2-3-(p.v/mx)*(h2-8)).toFixed(1)}`).join(' ');
  return `<svg class="spark" width="${w}" height="${h2}" viewBox="0 0 ${w} ${h2}"><path d="${d}" fill="none" stroke="var(--acc)" stroke-width="1.6"/>${pts.map((p,i)=>`<circle cx="${(i*step).toFixed(1)}" cy="${(h2-3-(p.v/mx)*(h2-8)).toFixed(1)}" r="1.8" fill="var(--acc)"/>`).join('')}</svg>`};

V.signal=()=>{

  const catCount={};RULES.forEach(r=>catCount[r.cat]=(catCount[r.cat]||0)+1);
  const row=a=>`<div class="card tight ${a.locked?'':''}" style="${a.locked?'border-color:var(--red)':''}">
    <div class="row between wrap"><div class="row">${a.locked?`<span class="chip red">${icon('lock',11)} LOCKED</span>`:sevChip(a.sev)}<span class="chip plain tiny">${a.cat}</span></div>
    <div class="row">${a.locked?'':`<button class="btn sm gh" data-act="snooze" data-id="${a.id}" data-days="3">3d</button><button class="btn sm gh" data-act="snooze" data-id="${a.id}" data-days="7">7d</button>`}

    <div style="font-weight:700;margin:6px 0 2px">${a.title} ${a.n>1?`<span class="chip gold tiny">×${a.n}</span>`:''}</div>
    <div class="small muted">${a.body}</div>
    ${a.hits.slice(0,6).map(h=>`<div class="small" style="padding:2px 0"><a href="${h.route}">${icon('chev',12)} ${U.esc(h.label)}</a></div>`).join('')}${a.hits.length>6?`<div class="tiny dim">+${a.hits.length-6} more</div>`:''}</div>`;
  return ph('Signal',RULES.length+' rules live · '+rest.length+' firing · '+locked.length+' locked · '+pos.length+' positive','')+
  (locked.length?`<div class="ctitle" style="color:var(--red)">${icon('lock',13)} Locked — these cannot be snoozed, only resolved</div>${locked.map(row).join('')}`:'')+
  `<div class="ctitle">Firing now — severity order</div>${rest.map(row).join('')||'<div class="empty"><div class="big">Full clear</div>Not the absence of problems — the absence of <em>undetected</em> ones.</div>'}
  <div class="ctitle" style="color:var(--green);margin-top:16px">${icon('spark',13)} Positive signals (detection-only mentors produce risk-averse operators)</div>
  ${pos.map(a=>`<div class="card tight" style="border-color:#1e5c46"><div class="row between"><div><div style="font-weight:700">${a.title}</div><div class="small muted">${a.body}</div></div><button class="btn sm gh" data-act="nav" data-to="${a.route}">${icon('chev',12)}</button></div></div>`).join('')||'<div class="empty">No positive signals this run — conditions are computed, not flattered.</div>'}

  <div class="tiny dim">→ ${U.esc(ENG.person(d.personId)?.name||'?')} · rung ${d.rung} · ${U.fmt(d.verdictAt||d.at)}</div></div>`).join('')||'<div class="empty">No verdicts — the bench reads nothing.</div>'}</div>`};
ACT.delNew=()=>{Modal.open(`<h2>${icon('hand',17)} Delegate — the outcome, not the anxiety</h2>
  <label>Task / outcome (one line)</label><input id="dl_t">
  <div class="frow"><div><label>To</label><select id="dl_p">${personOpts()}</select></div>
  <div><label>Checkpoint date (required)</label><input type="date" id="dl_c" value="${U.addD(U.today(),7)}"></div></div>
  <div class="frow"><div><label>Skill on THIS task: <span id="dl_sv" class="mono">3</span></label><input type="range" id="dl_s" min="1" max="5" value="3"></div>
  <div><label>Will on THIS task: <span id="dl_wv" class="mono">3</span></label><input type="range" id="dl_w" min="1" max="5" value="3"></div></div>
  <div id="dl_diag"></div>
  <label>Rung you hand over</label><select id="dl_r">${RUNGS.map((r,i)=>`<option value="${i+1}">R${i+1} — ${r[0]}</option>`).join('')}</select>

  <div class="mfoot"><button class="btn gh" data-act="closeModal">Cancel</button><button class="btn pri" id="dl_ok">${icon('check',14)} Contract it</button></div>`,true);
  const upd=()=>{const s=FW.slii(+document.getElementById('dl_s').value,+document.getElementById('dl_w').value);
    document.getElementById('dl_sv').textContent=document.getElementById('dl_s').value;document.getElementById('dl_wv').textContent=document.getElementById('dl_w').value;
    document.getElementById('dl_diag').innerHTML=`<div class="note">${icon('compass',13)} <strong>${s.d} → ${s.style}</strong> · suggested rung ${s.rung}. ${s.note}</div>`;
    const rc=FW.rungCheck(s,+document.getElementById('dl_r').value);
    document.getElementById('dl_warn').innerHTML=`<div class="note ${rc.tone==='red'?'bad':rc.tone==='amber'?'warn':'ok'}" style="margin-top:8px">${rc.msg}</div>`;};
  ['dl_s','dl_w','dl_r'].forEach(id=>document.getElementById(id).addEventListener('input',upd));upd();
  document.getElementById('dl_ok').onclick=()=>{const t=document.getElementById('dl_t').value.trim(),b=document.getElementById('dl_b').value.trim(),c=document.getElementById('dl_c').value;

    commit(st=>{st.delegations.unshift({id:U.uid('d'),personId:document.getElementById('dl_p').value,task:t,skill:+document.getElementById('dl_s').value,will:+document.getElementById('dl_w').value,rung:+document.getElementById('dl_r').value,boundary:b,checkpointAt:c,at:U.today(),verdict:null});
    const p=ENG.person(document.getElementById('dl_p').value);
    st.agenda.unshift({id:U.uid('a'),personId:document.getElementById('dl_p').value,text:'Delegation contracted: '+t+' (rung '+document.getElementById('dl_r').value+', checkpoint '+U.fmt(c)+')',source:'delegation',at:U.now(),consumed:false});
    Modal.close()},'Contracted — boundary, rung, checkpoint. On their agenda too.')}};
ACT.delVerdict=d=>{const del=ST.delegations.find(x=>x.id===d.id);
  Modal.open(`<h2>Verdict — ${U.esc(del.task)}</h2><div class="msub">Verdicts are succession evidence. The bench reads them; flight risk reads them. Be honest: “needed support” is data, not failure.</div>
  <label>Note (one line — shared in dev conversations later)</label><input id="dv_n">
  <div class="grid3" style="margin-top:10px">

/* ---------- MEDIATION ---------- */
const MED_STAGES=['Set the frame','Each side speaks','Interests named','Agreement drafted','Commitments dated','Filed + verified'];
V.mediation=()=>{const list=ST.mediations;
  return ph('Mediation','Six stages, order enforced. Gates 1 & 4 need written notes. Protected ground → halt to HR in one write.',`<button class="btn pri" data-act="medNew">${icon('plus',14)} New mediation</button>`)+
  (list.length?list.map(m=>`<div class="card ${m.halted?'':'hk'}" style="${m.halted?'border-color:var(--red)':''}">
  <div class="row between wrap"><div><strong style="font-size:15px">${U.esc(m.title)}</strong> <span class="dim small">${U.esc(ENG.person(m.a)?.name||m.a)} ⇄ ${U.esc(ENG.person(m.b)?.name||m.b)}</span></div>
  <div class="row">${m.agreement?'<span class="chip green">agreement filed</span>':m.halted?'<span class="chip red">halted → HR</span>':`<span class="chip gold">${MED_STAGES[m.stage]}</span>`}
  ${!m.halted&&!m.agreement?`<button class="btn sm dan" data-act="medHalt" data-id="${m.id}">${icon('shield',12)} Halt to HR</button>`:''}</div></div>
  ${m.halted?`<div class="note bad">${icon('shield',13)} Halted ${U.fmt(m.haltedAt)}: ${U.esc(m.haltReason)} — the HR escalation case holds the record.</div>`:
  m.agreement?`<div class="note ok">${icon('check',13)} ${U.esc(m.agreement)} — verification armed +14d${m.verified?', held.':'.'}<br><span class="tiny">Evidence filed to both parties' ledgers.</span></div>`:
  `<div class="steps" style="margin-top:10px">${MED_STAGES.map((s,i)=>`<div class="step ${i<m.stage?'done':i===m.stage?'now':''}">${i+1}</div>`).join('')}</div>
  <div class="row between wrap"><div class="small dim">Stage ${m.stage+1} of 6: <strong>${MED_STAGES[m.stage]}</strong>${[0,3].includes(m.stage)?' — gate: written notes required':''}</div>

  ${Object.keys(m.notes||{}).map(k=>`<div class="tiny muted" style="padding:2px 0"><span class="chip plain tiny">${MED_STAGES[k]}</span> ${U.esc(m.notes[k])}</div>`).join('')}`}
  </div>`).join(''):'<div class="empty"><div class="big">No mediations</div>Conflicts under sev 4 get a norms conversation first — a mediation is a protocol, not a vibe.</div>')};
ACT.medNew=()=>{Modal.open(`<h2>${icon('scale',17)} New mediation</h2>
  <label>Title — the conflict in one neutral line</label><input id="md_t">
  <div class="frow"><div><label>Party A</label><select id="md_a">${personOpts()}</select></div><div><label>Party B</label><select id="md_b">${personOpts()}</select></div></div>
  <div class="note">${icon('shield',13)} If protected-class content surfaces at any stage — harassment, discrimination, safety, medical, fraud, legal, retaliation, threat, assault, accommodation — the protocol halts to an HR case in one write. Neutrality is not impartiality about law.</div>
  <div class="mfoot"><button class="btn gh" data-act="closeModal">Cancel</button><button class="btn pri" id="md_ok">Stage 1: set the frame</button></div>`);
  document.getElementById('md_ok').onclick=()=>{const a=document.getElementById('md_a').value,b=document.getElementById('md_b').value;

    commit(st=>{st.mediations.unshift({id:U.uid('m'),title:document.getElementById('md_t').value||'Mediation '+U.today(),a,b,stage:0,notes:{},at:U.today(),movedAt:U.today()});Modal.close()},'Frame set — the clock is running.')}};
ACT.medAdv=d=>{const m=ST.mediations.find(x=>x.id===d.id);const gate=[0,3].includes(m.stage);
  Modal.open(`<h2>Advance → “${MED_STAGES[m.stage+1]}”</h2>${gate?`<div class="note warn">Gate stage — written notes close it. “${MED_STAGES[m.stage]}” with no notes never happened.</div>`:`<div class="msub">Notes optional at this stage, recommended anyway.</div>`}

  <div class="mfoot"><button class="btn gh" data-act="closeModal">Back</button><button class="btn pri" id="ma_ok">Advance</button></div>`);

  <div class="frow3"><div><label>Unit</label><input id="gl_u" placeholder="%, days, count"></div><div><label>Deadline</label><input id="gl_dl" type="date" value="${U.addD(U.today(),84)}"></div><div><label>Owner (optional)</label><select id="gl_o"><option value="">— you —</option>${personOpts()}</select></div></div>

  document.getElementById('gl_ok').onclick=()=>{const t=document.getElementById('gl_t').value.trim();
    if(t.length<4){toast('A goal needs a name the team can repeat.','bad');return}
    commit(st=>{st.goals.unshift({id:U.uid('g'),title:t,dir:document.getElementById('gl_d').value,start:+document.getElementById('gl_s').value,target:+document.getElementById('gl_g').value,unit:document.getElementById('gl_u').value,deadline:document.getElementById('gl_dl').value,ownerId:document.getElementById('gl_o').value||null,created:U.today(),checkins:[],status:'active',atRisk:null});Modal.close()},'Goal set — first check-in inside 14 days or it is a wish.')}};
ACT.goalCheck=d=>{const g=ST.goals.find(x=>x.id===d.id);
  Modal.open(`<h2>Check-in — ${U.esc(g.title)}</h2>
  <label>Current value (${U.esc(g.unit||'units')}) — last: ${FW.krCurrent(g)}</label><input id="gk_v" type="number" step="any" value="${FW.krCurrent(g)}">
  <label>Confidence we hit the target (1–5): <span id="gk_cv" class="mono">3</span></label><input id="gk_c" type="range" min="1" max="5" value="3">
  <label>What changed / what blocks</label><input id="gk_n">

  document.getElementById('gk_c').oninput=e=>document.getElementById('gk_cv').textContent=e.target.value;
  document.getElementById('gk_ok').onclick=()=>{commit(st=>{const x=st.goals.find(y=>y.id===g.id);
    x.checkins.push({at:U.today(),value:+document.getElementById('gk_v').value,confidence:+document.getElementById('gk_c').value,note:document.getElementById('gk_n').value});
    Modal.close()},'Checked in — the trajectory just updated.')}};
ACT.goalGrade=d=>{const g=ST.goals.find(x=>x.id===d.id);
  Modal.open(`<h2>Grade — ${U.esc(g.title)}</h2><div class="msub">Silent expiry is how teams learn dates are wishes. Grade it, and the causal lesson is mandatory — “we tried hard” is not a cause.</div>
  <div class="grid3"><div class="qcard" data-g="achieved"><strong>Achieved</strong><div class="tiny dim">Target met.</div></div>
  <div class="qcard" data-g="partial"><strong>Partial</strong><div class="tiny dim">Moved, not met.</div></div>
  <div class="qcard" data-g="missed"><strong>Missed</strong><div class="tiny dim">Did not move — say why.</div></div></div>
  <label>Causal lesson — the mechanism, not the mood</label><textarea id="gg_l" rows="2"></textarea>
  <div class="mfoot"><button class="btn gh" data-act="closeModal">Cancel</button></div>`);
  document.querySelectorAll('[data-g]').forEach(el=>el.onclick=()=>{const l=document.getElementById('gg_l').value.trim();
    if(l.length<10){toast('The causal lesson is the tuition. One mechanism, named.','bad');return}
    commit(st=>{const x=st.goals.find(y=>y.id===g.id);x.status='graded';x.grade=el.dataset.g;x.lesson=l;
    st.lessons.unshift({id:U.uid('l'),at:U.today(),text:l,source:'Goal graded '+el.dataset.g+': '+x.title});Modal.close()},'Graded '+el.dataset.g+' — lesson journaled.')})};
/* ---------- DECISIONS ---------- */
V.decisions=()=>{const cal=FW.decisionCalibration(ST);const open=ST.decisions.filter(d=>!d.decided);const done=ST.decisions.filter(d=>d.decided);
  return ph('Decisions','Type-1 doors get rigor; Type-2 doors get speed. Both get dates and recorded reasons.',`<button class="btn pri" data-act="decNew">${icon('plus',14)} New decision</button>`)+
  `<div class="grid3"><div class="card stat"><div class="n">${open.length}</div><div class="l">Undecided</div></div>
  <div class="card stat"><div class="n" style="color:${open.some(d=>d.deadline<U.today())?'var(--red)':'var(--ink)'}">${open.filter(d=>d.deadline<U.today()).length}</div><div class="l">Rotting past date</div></div>
  <div class="card stat"><div class="n">${cal.hit===null?'—':cal.hit+'%'}</div><div class="l">Calibration (≥4/5) · n=${cal.n}</div></div></div>
  ${cal.note?`<div class="note">${icon('hist',13)} ${cal.note}${cal.byType[1]!==null?` Type-1 hit ${cal.byType[1]}% · Type-2 hit ${cal.byType[2]}%.`:''}</div>`:''}
  ${open.map(d=>`<div class="card tight"><div class="row between wrap"><div class="row"><span class="chip ${d.type===1?'violet':'blue'} tiny">TYPE-${d.type} ${d.type===1?'one-way':'revolving'}</span><strong>${U.esc(d.title)}</strong>${d.caseId?`<a class="chip gold tiny" href="#/case/${d.caseId}">from case</a>`:''}</div>
  <div class="row"><span class="chip ${d.deadline<U.today()?'red':'plain'} tiny">${d.deadline<U.today()?'ROTTING '+Math.abs(U.dB(d.deadline,U.today()))+'d':'due '+U.fmt(d.deadline)}</span>
  <button class="btn sm" data-act="decRedate" data-id="${d.id}">Re-date +reason</button><button class="btn sm pri" data-act="decDecide" data-id="${d.id}">Decide</button></div></div>
  <div class="tiny dim" style="margin-top:4px">${U.esc(d.context||'')}</div>
  ${(d.premortem||[]).length?`<div class="tiny dim" style="margin-top:4px">Premortem (${d.premortem.length}${d.type===1&&d.premortem.length<3?' <span style="color:var(--red)">— below floor of 3</span>':''}): ${d.premortem.map(U.esc).join(' · ')}</div>`:d.type===1?'<div class="tiny" style="color:var(--red)">Type-1 with zero premortem — below the floor.</div>':''}
  ${(d.reHistory||[]).length?`<div class="tiny dim">Re-dated ×${d.reHistory.length}: ${d.reHistory.map(r=>U.fmt(r.from)+'→'+U.fmt(r.to)+' (“'+U.esc(r.reason)+'”)').join(' | ')}</div>`:''}</div>`).join('')||'<div class="empty"><div class="big">Nothing undecided</div>Suspicious. Either you are decisive, or the decisions are ambient.</div>'}
  ${done.length?`<div class="ctitle" style="margin-top:14px">Decided — outcomes feed calibration</div>${done.slice(0,10).map(d=>`<div class="card tight"><div class="row between wrap"><div class="row"><span class="chip ${d.type===1?'violet':'blue'} tiny">T${d.type}</span><strong>${U.esc(d.title)}</strong></div>
  <div class="row">${d.rating?`<span class="chip ${d.rating>=4?'green':d.rating>=3?'amber':'red'} tiny">${d.rating}/5</span>`:`<button class="btn sm" data-act="decRate" data-id="${d.id}">Rate outcome</button>`}<span class="tiny dim">${U.fmt(d.decidedAt)}</span></div></div>
  <div class="small muted">${U.esc(d.decision||'')}${d.rating&&d.rateNote?` <span class="tiny dim">— ${U.esc(d.rateNote)}</span>`:''}</div></div>`).join('')}`:''}`};
ACT.decNew=()=>{Modal.open(`<h2>${icon('branch',17)} New decision</h2>
  <label>Decision in one line</label><input id="dc_t">
  <div class="frow"><div><label>Door type</label><select id="dc_ty"><option value="2">Type-2 — reversible, decide fast</option><option value="1">Type-1 — one-way, premortem first</option></select></div>
  <div><label>Deadline</label><input id="dc_dl" type="date" value="${U.addD(U.today(),7)}"></div></div>
  <label>Context — what makes this hard</label><textarea id="dc_c" rows="2"></textarea>
  <label>Premortem — one failure hypothesis per line <span class="tiny dim">(Type-1: ≥3 enforced here and re-checked by audit)</span></label><textarea id="dc_p" rows="4" placeholder="${PREMORTEM[0]}"></textarea>
  <div class="mfoot"><button class="btn gh" data-act="closeModal">Cancel</button><button class="btn pri" id="dc_ok">Record decision</button></div>`,true);
  document.getElementById('dc_ok').onclick=()=>{const t=document.getElementById('dc_t').value.trim();
    const pm=document.getElementById('dc_p').value.split('\n').map(x=>x.trim()).filter(Boolean);
    const ty=+document.getElementById('dc_ty').value;
    if(t.length<5){toast('Name the decision.','bad');return}
    if(ty===1&&pm.length<3){toast('Type-1 door: three failure hypotheses minimum. The form enforces it; the audit re-checks it.','bad');return}
    commit(st=>{st.decisions.unshift({id:U.uid('d'),title:t,type:ty,context:document.getElementById('dc_c').value,premortem:pm,deadline:document.getElementById('dc_dl').value,at:U.today(),reHistory:[],decided:false});Modal.close()},'Recorded with a date. Dates without reasons are wishes.')}};
ACT.decRedate=d=>{const dec=ST.decisions.find(x=>x.id===d.id);
  Modal.open(`<h2>Re-date — reason required</h2><div class="msub">Re-dating is legal; silent slipping is not. The history is calibration data.</div>
  <label>New date</label><input type="date" id="dr_d" value="${U.addD(U.today(),7)}">
  <label>Why — dependency, information, or priority?</label><input id="dr_r">
  <div class="mfoot"><button class="btn gh" data-act="closeModal">Cancel</button><button class="btn pri" id="dr_ok">Re-date</button></div>`);
  document.getElementById('dr_ok').onclick=()=>{const r=document.getElementById('dr_r').value.trim();
    if(r.length<6){toast('Reason required. “Waiting” is not a reason; it is a symptom.','bad');return}
    commit(st=>{const x=st.decisions.find(y=>y.id===dec.id);x.reHistory.push({from:x.deadline,to:document.getElementById('dr_d').value,reason:r,at:U.today()});x.deadline=document.getElementById('dr_d').value;Modal.close()},'Re-dated — on the record.')}};
ACT.decDecide=d=>{const dec=ST.decisions.find(x=>x.id===d.id);
  Modal.open(`<h2>Decide — ${U.esc(dec.title)}</h2>
  <label>The decision + rationale (future-you will read this)</label><textarea id="dd_d" rows="3"></textarea>
  <div class="mfoot"><button class="btn gh" data-act="closeModal">Not yet</button><button class="btn pri" id="dd_ok">Decided</button></div>`);
  document.getElementById('dd_ok').onclick=()=>{const v=document.getElementById('dd_d').value.trim();
    if(v.length<8){toast('Decision + why. The why is the asset.','bad');return}
    commit(st=>{const x=st.decisions.find(y=>y.id===dec.id);x.decided=true;x.decision=v;x.decidedAt=U.today();Modal.close()},'Decided. Outcome grading opens in 30 days.')}};
ACT.decRate=d=>{const dec=ST.decisions.find(x=>x.id===d.id);
  Modal.open(`<h2>Grade the outcome — ${U.esc(dec.title)}</h2>
  <label>With hindsight: 1 = disaster … 5 = clearly right</label><input id="de_r" type="range" min="1" max="5" value="4">
  <label>One line — what the outcome taught</label><input id="de_n">
  <div class="mfoot"><button class="btn gh" data-act="closeModal">Cancel</button><button class="btn pri" id="de_ok">Grade</button></div>`);
  document.getElementById('de_ok').onclick=()=>{commit(st=>{const x=st.decisions.find(y=>y.id===dec.id);x.rating=+document.getElementById('de_r').value;x.rateNote=document.getElementById('de_n').value;Modal.close()},'Graded — calibration updated.')}};
/* ---------- HEALTH ---------- */
V.health=()=>{const pulses=[...ST.pulses].sort((a,b)=>a.at<b.at?1:-1);const last=pulses[0];const prev=pulses[1];
  const scans=[...ST.safety].sort((a,b)=>a.at<b.at?1:-1);const ls=scans[0];
  const comp=FW.healthComposite(last,ls&&FW.edmondson(ls.items));const bus=FW.busRisk(ST);
  return ph('Team Health','You get the culture you instrument. Org-wide readings launder team fractures — scope your pulses.',
  `<button class="btn" data-act="pulseGo">${icon('pulse',14)} Run pulse</button><button class="btn" data-act="edmondGo">Edmondson scan</button><button class="btn" data-act="capAdd">Capability</button>`)+
  `<div class="grid3"><div class="card stat"><div class="n" style="color:${comp.band==='CRITICAL'?'var(--red)':comp.band==='STRAINED'?'var(--amber)':'var(--green)'}">${comp.value===null?'—':comp.value}</div><div class="l">Composite · ${comp.band}</div></div>
  <div class="card stat"><div class="n">${ls?ls.score:'—'}</div><div class="l">Safety · ${ls?ls.band:'never scanned'}</div></div>
  <div class="card stat"><div class="n" style="color:${bus.thin.length?'var(--amber)':'var(--green)'}">${bus.thin.length}</div><div class="l">Single-point capabilities ${bus.critCount?'/ '+bus.critCount+' critical':''}</div></div></div>
  <div class="card"><div class="ctitle">${icon('pulse',13)} Fortnight pulse — 6 dimensions, deltas from last reading</div>
  ${last?`<div class="tiny dim" style="margin-bottom:8px">Latest: ${U.fmtY(last.at)} · ${last.teamId?'team of '+U.esc(ENG.person(last.teamId)?.name||''):'org-wide'}</div>
  ${PULSE_DIMS.map(d=>{const v=last.dims[d[0]];const pv=prev&&prev.teamId===last.teamId?prev.dims[d[0]]:null;const dl=pv!==null?v-pv:null;
  return `<div class="slabar" style="padding:5px 0"><span style="min-width:120px" class="small">${d[0]}</span><div class="bar" style="flex:1"><i class="${v<=2?'bad':v<=3?'warn':''}" style="width:${v*20}%"></i></div><span class="mono tiny dim">${v}/5</span>${dl!==null?`<span class="chip ${dl<0?'red':dl>0?'green':'plain'} tiny">${dl>0?'+':''}${dl}</span>`:'<span class="dim tiny">first</span>'}</div><div class="tiny dim" style="padding-bottom:4px">${d[1]}</div>`}).join('')}
  ${last.note?`<div class="note">${U.esc(last.note)}</div>`:''}`:'<div class="empty"><div class="big">No readings</div>Thirty seconds of sliders buys you an honest fortnight.</div>'}
  ${pulses.length>1?`<hr class="hr"><div class="ctitle">Reading history</div>${pulses.slice(0,6).map(p=>`<div class="small" style="padding:2px 0">${icon('clock',11)} ${U.fmtY(p.at)} · ${p.teamId?U.esc(ENG.person(p.teamId)?.name||'')+'’s team':'org-wide'} · avg ${U.avg(Object.values(p.dims)).toFixed(1)}</div>`).join('')}`:''}</div>
  <div class="grid2"><div class="card"><div class="ctitle">${icon('shield',13)} Edmondson — psychological safety (reverse-scored 2/4/6)</div>
  ${ls?`<div class="mono" style="font-size:26px;font-weight:800">${ls.score}<span class="dim" style="font-size:13px"> /7 · ${ls.band}</span></div>
  <div class="tiny dim">${U.fmtY(ls.at)} · ${ls.teamId?U.esc(ENG.person(ls.teamId)?.name||'')+'’s team':'org-wide'}</div>
  <div class="note ${ls.band==='FRAGILE'?'bad':ls.band==='MODERATE'?'warn':'ok'}" style="margin-top:8px">${ls.band==='FRAGILE'?'Bad news is being suppressed somewhere. You are buying silence you cannot see.':ls.band==='MODERATE'?'People speak — cautiously. Thank the next bearer of bad news, publicly.':'Speaking up is cheap here. Protect it — it is load-bearing.'}</div>`:'<div class="empty">Seven items, two minutes, once a month. Cheaper than the first surprise resignation.</div>'}
  <hr class="hr"><div class="ctitle">Five dysfunctions — ladder advances only on written notes</div>
  ${DYSF.map((d,i)=>{const st=ST.dysf||{stage:0,notes:{}};const done=(st.notes||{})[i];const lockedi=i>(st.stage||0);
  return `<div class="listit"><div class="tick" style="background:${done?'var(--green)':lockedi?'var(--line2)':'var(--acc)'}"></div>
  <div style="flex:1"><div class="small"><strong>${i+1}. ${d[0]}</strong> ${done?`<span class="chip green tiny">evidence ${U.fmt(done.at)}</span>`:lockedi?'<span class="chip plain tiny">locked</span>':'<span class="chip gold tiny">current</span>'}</div>
  <div class="tiny dim">${d[1]}</div>${done?`<div class="tiny muted">“${U.esc(done.text)}”</div>`:''}
  ${!done&&!lockedi?`<form data-form="dysf" class="row" style="margin-top:4px"><input name="dn" placeholder="Written evidence for this stage…"><button class="btn sm">Advance ladder</button></form>`:''}</div></div>`}).join('')}</div>
  <div class="card"><div class="ctitle">${icon('net',13)} Capability map — bus factor, honestly (${ST.capabilities.length})</div>
  ${bus.band!=='OK'?`<div class="note ${bus.band==='HIGH'?'bad':'warn'}">${icon('warn',13)} ${bus.thin.map(c=>'<strong>'+U.esc(c.name)+'</strong>').join(', ')} — critical, ≤1 holder. Cross-train or document; choose one, this month.</div>`:ST.capabilities.length?'<div class="note ok">Every critical capability has depth.</div>':''}
  <div class="capgrid">${ST.capabilities.map(c=>{const holders=(c.holders||[]).map(h=>ENG.person(h)).filter(Boolean);
  return `<div class="card tight" style="margin:0;${c.critical>=2&&holders.length<=1?'border-color:var(--amber)':''}"><div class="row between"><strong class="small">${U.esc(c.name)}</strong><span class="chip ${c.critical>=3?'red':c.critical>=2?'amber':'plain'} tiny">${'●'.repeat(c.critical)}${'○'.repeat(3-c.critical)}</span></div>
  <div class="tiny dim" style="margin-top:4px">${holders.length?holders.map(h=>U.esc(h.name)).join(', '):'<span style="color:var(--red)">NO HOLDERS</span>'}</div>
  <div class="row" style="margin-top:6px"><button class="btn sm gh" data-act="capTune" data-id="${c.id}">${icon('pen',11)}</button><button class="btn sm gh" data-act="capDel" data-id="${c.id}">${icon('trash',11)}</button></div></div>`}).join('')||'<div class="empty">Map what only one person knows.</div>'}</div></div></div>`};
ACT.pulseGo=()=>{Modal.open(`<h2>${icon('pulse',17)} Fortnight pulse</h2>
  <label>Scope</label><select id="pu_t"><option value="">Org-wide</option>${personOpts(null,true).replace(/value="([^"]+)"/g,'value="$1"')}</select>
  ${PULSE_DIMS.map(d=>`<label>${d[0]} — ${d[1]}: <span id="pu_${d[0]}v" class="mono">3</span></label><input type="range" min="1" max="5" value="3" id="pu_${d[0]}" oninput="document.getElementById('pu_${d[0]}v').textContent=this.value">`).join('')}
  <label>One-line note (what would move the lowest bar?)</label><input id="pu_n">
  <div class="mfoot"><button class="btn gh" data-act="closeModal">Cancel</button><button class="btn pri" id="pu_ok">Record reading</button></div>`,true);
  document.getElementById('pu_ok').onclick=()=>{const dims={};PULSE_DIMS.forEach(d=>dims[d[0]]=+document.getElementById('pu_'+d[0]).value);
    commit(st=>{st.pulses.unshift({id:U.uid('pu'),at:U.today(),teamId:document.getElementById('pu_t').value||null,dims,note:document.getElementById('pu_n').value});Modal.close()},'Reading recorded — deltas computed against the last reading of the same scope.')}};
ACT.edmondGo=()=>{Modal.open(`<h2>${icon('shield',17)} Edmondson safety scan — 7 items</h2><div class="msub">Answer for the team as it is, not as announced. Items 2/4/6 reverse-scored.</div>
  <label>Scope</label><select id="ed_t"><option value="">Org-wide</option>${personOpts(null,true)}</select>
  ${EDMONDSON.map((q,i)=>`<div class="small" style="margin-top:10px">${i+1}. ${q.replace(' (R)','')}${[2,4,6].includes(i+1)?' <span class="chip plain tiny">reverse</span>':''}</div><input type="range" min="1" max="7" value="4" id="ed_${i}">`).join('')}
  <div class="mfoot"><button class="btn gh" data-act="closeModal">Cancel</button><button class="btn pri" id="ed_ok">Score</button></div>`,true);
  document.getElementById('ed_ok').onclick=()=>{const items=[...Array(7)].map((_,i)=>+document.getElementById('ed_'+i).value);
    const s=FW.edmondson(items);
    commit(st=>{st.safety.unshift({id:U.uid('ed'),at:U.today(),teamId:document.getElementById('ed_t').value||null,items,score:s.score,band:s.band});Modal.close()},'Safety: '+s.score+'/7 — '+s.band+'.')}};
FORMS.dysf=(fd)=>{const n=fd.get('dn');if(!n||n.trim().length<8){toast('Evidence required — the ladder does not move on attendance.','bad');return}
  commit(st=>{const stg=st.dysf.stage||0;if(!st.dysf.notes)st.dysf.notes={};st.dysf.notes[stg]={text:n,at:U.today()};st.dysf.stage=stg+1},'Ladder advanced — stage '+(ST.dysf.stage)+' of 5.')};
ACT.capAdd=()=>{Modal.open(`<h2>Capability</h2><label>Name — what only someone knows</label><input id="cp_n">
  <label>Criticality (1–3): <span id="cp_cv" class="mono">2</span></label><input type="range" min="1" max="3" value="2" id="cp_c" oninput="document.getElementById('cp_cv').textContent=this.value">
  <label>Holders (ctrl-click multiple)</label><select id="cp_h" multiple size="5">${personOpts()}</select>
  <div class="mfoot"><button class="btn gh" data-act="closeModal">Cancel</button><button class="btn pri" id="cp_ok">Add</button></div>`);
  document.getElementById('cp_ok').onclick=()=>{const n=document.getElementById('cp_n').value.trim();if(!n)return;
    commit(st=>{st.capabilities.push({id:U.uid('cp'),name:n,critical:+document.getElementById('cp_c').value,holders:[...document.getElementById('cp_h').selectedOptions].map(o=>o.value)});Modal.close()})}};
ACT.capTune=d=>{const c=ST.capabilities.find(x=>x.id===d.id);
  Modal.open(`<h2>Holders — ${U.esc(c.name)}</h2><select id="ct_h" multiple size="${Math.min(ST.people.length,6)}">${ST.people.map(p=>`<option value="${p.id}" ${c.holders.includes(p.id)?'selected':''}>${U.esc(p.name)}</option>`).join('')}</select>
  <label>Criticality</label><input type="range" min="1" max="3" value="${c.critical}" id="ct_c">
  <div class="mfoot"><button class="btn pri" id="ct_ok">Save</button></div>`);
  document.getElementById('ct_ok').onclick=()=>commit(st=>{const x=st.capabilities.find(y=>y.id===c.id);

ACT.capDel=d=>commit(st=>{st.capabilities=st.capabilities.filter(c=>c.id!==d.id)});
/* ---------- AAR ---------- */
V.aar=()=>{const owed=ST.cases.filter(c=>c.status==='closed'&&c.sev>=4&&c.wires.some(w=>w.kind==='aar-arm')&&!ST.aars.some(a=>a.caseId===c.id));
  return ph('After-Action Reviews','Expected vs happened — in NUMBERS. Blameless or it is a tribunal. Improvements become owned, dated loops.',`<button class="btn pri" data-act="aarNew">${icon('plus',14)} New AAR</button>`)+
  (owed.length?`<div class="card" style="border-color:var(--amber)"><div class="ctitle" style="color:var(--amber)">${icon('warn',13)} Tuition-unpaid lane — sev-4+ closures still owing an AAR</div>

    cols.forEach(k=>(j[k]||[]).forEach(r=>{if(r&&r.id){map[r.id]=U.uid('m');r.id=map[r.id]}}));
