<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeadOS — Leadership Operating System · v14.0</title>
<!-- LeadOS v14 · one file · zero network dependency · all state in this browser.
     Storage lineage: key 'leados.v6' (never renamed on purpose), record v:8.
     Doctrine: pure models (now is always an argument) · ledgered writes · no faked certainty. -->
<style>
:root{
  --bg:#0a0d12; --bg2:#0e1219; --panel:#121723; --panel2:#161d2b; --line:#212a3a; --line2:#2b3648;
  --ink:#dde5ef; --dim:#8b98a9; --faint:#5b6878;
  --amber:#f0b64c; --red:#f25d5d; --green:#46c98a; --blue:#66aaff; --violet:#a98ef5; --teal:#4ecdc4;
  --mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.45;-webkit-font-smoothing:antialiased}
::selection{background:#2b3a55}
a{color:var(--blue);text-decoration:none}
button{font-family:inherit}
#app{display:flex;min-height:100vh}
/* rail */
#rail{width:176px;flex:0 0 176px;background:var(--bg2);border-right:1px solid var(--line);padding:14px 10px;position:sticky;top:0;height:100vh;overflow-y:auto}
#rail .brand{font-family:var(--mono);font-weight:700;letter-spacing:.5px;font-size:14px;padding:4px 8px 12px;border-bottom:1px solid var(--line);margin-bottom:8px;display:flex;align-items:center;gap:7px}
#rail .brand .dot{width:8px;height:8px;border-radius:2px;background:var(--amber)}
#rail a{display:flex;align-items:center;gap:8px;color:var(--dim);padding:6px 8px;border-radius:7px;font-size:12.5px;margin:1px 0}
#rail a:hover{background:var(--panel);color:var(--ink)}
#rail a.on{background:var(--panel2);color:var(--ink);box-shadow:inset 2px 0 0 var(--amber)}
#rail a svg{width:14px;height:14px;flex:0 0 14px}
#rail .rbadge{margin-left:auto;font-family:var(--mono);font-size:10px;background:var(--red);color:#fff;border-radius:9px;padding:1px 6px;min-width:17px;text-align:center}
#rail .rbadge.pos{background:#1d3a2f;color:var(--green)}
#rail .rlabel{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:12px 8px 4px}
/* main */
#main{flex:1;min-width:0}
#top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;background:rgba(10,13,18,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:9px 18px}
#top .wm{font-family:var(--mono);font-size:12px;color:var(--faint);letter-spacing:.08em;white-space:nowrap}
#cap{flex:1;max-width:560px;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
#cap input{flex:1;background:none;border:0;outline:0;color:var(--ink);font-size:12.5px;font-family:var(--mono)}
#cap input::placeholder{color:var(--faint)}
#savestate{font-family:var(--mono);font-size:11px;color:var(--faint);white-space:nowrap}
#savestate.bad{color:var(--red);font-weight:700}
#view{padding:20px 22px 90px;max-width:1180px}
/* generic */
.h1{font-size:20px;font-weight:700;letter-spacing:-.02em;margin-bottom:2px}
.h2{font-size:14px;font-weight:700;margin:0 0 8px}
.sub{font-size:12px;color:var(--dim)}
.dim{color:var(--dim)} .faint{color:var(--faint)} .small{font-size:11.5px}
.mono{font-family:var(--mono)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.card.tight{padding:10px 14px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:980px){.g2,.g3,.g4{grid-template-columns:1fr}#rail{width:56px;flex-basis:56px}#rail a span,#rail .rlabel{display:none}}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-family:var(--mono);padding:2px 8px;border-radius:20px;border:1px solid var(--line2);color:var(--dim);white-space:nowrap}
.c-amber{color:var(--amber);border-color:#4d3f22;background:#221c10}
.c-red{color:var(--red);border-color:#543030;background:#241114}
.c-green{color:var(--green);border-color:#2a4a3a;background:#0f2018}
.c-blue{color:var(--blue);border-color:#2c425f;background:#101a29}
.c-violet{color:var(--violet);border-color:#3d3358;background:#1a1428}
.c-teal{color:var(--teal);border-color:#2c4a48;background:#0f1f1e}
.lockchip{background:var(--red);color:#fff;border:0;font-weight:700}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line2);color:var(--ink);border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer}
.btn:hover{border-color:var(--dim)}
.btn.pri{background:var(--amber);border-color:var(--amber);color:#171205;font-weight:700}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{background:#2a1214;border-color:#543030;color:var(--red)}
.btn.sm{padding:3px 9px;font-size:11px;border-radius:6px}
.btn:disabled{opacity:.4;cursor:not-allowed}
svg.ic{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--faint);padding:6px 10px;border-bottom:1px solid var(--line);font-weight:600}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:hover td{background:rgba(255,255,255,.015)}
.tbl tr:last-child td{border-bottom:0}
/* forms */
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;color:var(--ink);font-size:13px;font-family:inherit;outline:0}
.field textarea{min-height:74px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--amber)}
.field .hint{font-size:11px;color:var(--faint);margin-top:4px;font-style:normal;font-style:normal}
.segpick{display:flex;gap:6px;flex-wrap:wrap}
.segpick button{background:var(--bg2);border:1px solid var(--line2);color:var(--dim);border-radius:7px;padding:5px 11px;font-size:12px;cursor:pointer}
.segpick button.on{border-color:var(--amber);color:var(--amber);background:#221c10}
/* modal */
#modalroot{position:fixed;inset:0;z-index:60;display:none}
#modalroot.open{display:block}
.mback{position:absolute;inset:0;background:rgba(4,6,10,.7);backdrop-filter:blur(3px)}
.modal{position:relative;max-width:640px;margin:6vh auto 0;background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:20px 22px;max-height:86vh;overflow-y:auto;box-shadow:0 24px 70px rgba(0,0,0,.55)}
.modal.wide{max-width:860px}
.modal h3{font-size:16px;margin-bottom:2px}
.mclose{position:absolute;top:12px;right:12px;background:none;border:0;color:var(--faint);cursor:pointer;padding:4px}
.mclose:hover{color:var(--ink)}
/* toasts */
#toasts{position:fixed;right:16px;bottom:16px;z-index:80;display:flex;flex-direction:column;gap:8px;max-width:380px}
.toast{background:var(--panel2);border:1px solid var(--line2);border-left:3px solid var(--amber);border-radius:10px;padding:10px 14px;font-size:12.5px;box-shadow:0 8px 28px rgba(0,0,0,.4);animation:tin .18s ease-out}
.toast.ok{border-left-color:var(--green)} .toast.bad{border-left-color:var(--red)}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
/* lanes */
.lanebar{display:flex;align-items:center;gap:8px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:18px 0 8px}
.lanebar::after{content:'';flex:1;height:1px;background:var(--line)}
.empty{padding:26px 18px;text-align:center;color:var(--faint);font-size:12.5px;border:1px dashed var(--line2);border-radius:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .n{font-family:var(--mono);font-size:22px;font-weight:700}
.kpi .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--faint)}
.bar{height:6px;background:var(--bg2);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.slabar{position:relative;height:8px;background:var(--bg2);border-radius:5px}
.slabar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.slabar .today{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.voucher{font-family:var(--mono);font-size:11px;color:var(--faint)}
.grievice{font-style:italic;color:var(--faint);font-size:11.5px}
/* nine box */
.nine{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;max-width:330px}
.nine button{aspect-ratio:1.35;background:var(--bg2);border:1px solid var(--line2);border-radius:8px;color:var(--faint);font-size:10.5px;cursor:pointer;font-family:var(--mono)}
.nine button.on{border-color:var(--amber);color:var(--amber);background:#221c10}
.nine button:hover{border-color:var(--dim)}
.ninelab{display:flex;justify-content:space-between;max-width:330px;font-size:10px;color:var(--faint);margin-top:4px;font-family:var(--mono)}
/* heat matrix */
.heat{display:grid;grid-template-columns:auto repeat(5,1fr);gap:4px;align-items:stretch}
.heat .hc{min-height:64px;border-radius:8px;border:1px solid var(--line);padding:5px;display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start}
.heat .hd{font-size:9.5px;color:var(--faint);display:flex;align-items:center;justify-content:center;font-family:var(--mono);padding:2px 4px}
.heatdot{font-family:var(--mono);font-size:10px;padding:2px 6px;border-radius:5px;cursor:pointer;border:1px solid transparent}
/* banner */
.banner{background:#241114;border:1px solid #543030;border-left:3px solid var(--red);color:#f3c1c1;border-radius:10px;padding:12px 16px;margin-bottom:14px;font-size:12.5px}
.banner.amber{background:#221c10;border-color:#4d3f22;border-left-color:var(--amber);color:#ecd9ac}
/* tests */
.tpass{color:var(--green)} .tfail{color:var(--red)}
.logline{font-family:var(--mono);font-size:11px;color:var(--dim);padding:3px 0;border-bottom:1px solid var(--line)}
.logline .t{color:var(--faint);margin-right:8px}
details.basis{margin-top:6px}
details.basis summary{cursor:pointer;font-size:11px;color:var(--blue)}
details.basis .bd{font-size:11.5px;color:var(--dim);background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:5px;font-family:var(--mono)}
.gap{display:block;height:10px}
.timeline{border-left:2px solid var(--line2);margin:8px 0 0 4px;padding-left:16px}
.timeline .tev{position:relative;padding:0 0 12px;font-size:12.5px}
.timeline .tev::before{content:'';position:absolute;left:-22px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--panel);border:2px solid var(--line2)}
.timeline .tev.hot::before{border-color:var(--amber)}
.stamp{font-family:var(--mono);font-size:10.5px;color:var(--faint);border:1px dashed var(--line2);border-radius:6px;padding:2px 7px}
.lie{color:var(--red);font-style:italic}
hr.sep{border:0;border-top:1px solid var(--line);margin:14px 0}
</style>
</head>
<body>
<div id="app">
  <nav id="rail"></nav>
  <div id="main">
    <header id="top">
      <div class="wm">LeadOS v14</div>
      <div id="cap"><input id="capin" placeholder="capture: case: · commit: @name … by +3 · owe: · praise: · note: · win: · risk:" spellcheck="false"></div>
      <span id="savestate" class="mono">—</span>
      <button class="btn sm" data-a="palette">/ palette</button>
      <button class="btn sm pri" data-a="newcase">C · case</button>
    </header>
    <main id="view"></main>
  </div>
</div>
<div id="modalroot"></div>
<div id="toasts"></div>
<script>
'use strict';
/* ============================================================ UTIL (impure clustered: clock, dom) */
const U={
  today(){return new Date().toISOString().slice(0,10)},
  nowIso(){return new Date().toISOString()},
  addD(iso,n){const d=new Date(iso+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)},
  days(a,b){return Math.round((new Date(b+'T00:00:00Z')-new Date(a+'T00:00:00Z'))/864e5)}, /* b-a */
  age(iso,now){return iso?U.days(iso,now):null},
  fmt(iso){if(!iso)return '—';const d=new Date(iso.length>10?iso:iso+'T00:00:00Z');return d.toUTCString().slice(5,16)},
  esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))},
  num(x,d){x=parseFloat(x);return isFinite(x)?x:(d==null?0:d)},
  clamp(x,a,b){return Math.max(a,Math.min(b,x))},
  uid(p){S.seq=(S.seq||1000)+1;return p+'-'+S.seq},
  person(id){return S.people.find(p=>p.id===id)||null},
  team(id){return S.teams.find(t=>t.id===id)||null},
  pname(id){const p=U.person(id);return p?p.name:'(gone)'},
  byId(a,id){return a.find(x=>x.id===id)||null},
  kb(bytes){return (bytes/1024).toFixed(1)+' KB'},
  plural(n,w){return n+' '+w+(n===1?'':'s')},
};
const $=s=>document.querySelector(s);
/* ============================================================ ICONS (inline lucide-path style — zero network) */
const ICONS={
  dash:'<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',
  signal:'<path d="M2 20h.01"/><path d="M7 20v-4"/><path d="M12 20v-8"/><path d="M17 20V8"/><path d="M22 4v16"/>',
  cases:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 15l2 2 4-4"/>',
  people:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  oneo:'<path d="M17 8h.01"/><path d="M21 12a9 9 0 1 1-4.5-7.8"/><path d="M8 12h.01"/><path d="M12 16h.01"/>',
  fb:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  goal:'<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
  dec:'<path d="M12 2v20"/><path d="M2 12h20"/><circle cx="12" cy="12" r="9"/>',
  hand:'<path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/><path d="M12 8v8"/><path d="M8.5 10.5 12 8l3.5 2.5"/>',
  risk:'<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  talent:'<path d="M6 9a6 6 0 0 0 12 0V5a6 6 0 0 0-12 0z"/><path d="M6 9H4a2 2 0 0 1-2-2V6"/><path d="M18 9h2a2 2 0 0 0 2-2V6"/><path d="M12 15v3"/><path d="M8 21h8"/><path d="M9 18h6"/>',
  data:'<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>',
  about:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
  plus:'<path d="M12 5v14"/><path d="M5 12h14"/>',
  x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  alert:'<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
  flame:'<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>',
  arrow:'<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
  dl:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/>',
};
function ic(n,st){return '<svg class="ic" viewBox="0 0 24 24"'+(st?' style="'+st+'"':'')+'>'+(ICONS[n]||ICONS.about)+'</svg>'}
/* ============================================================ FW — PURE MODELS. No clock reads: `now` is always an argument. No S mutations. */
const FW={};
/* severity → SLA runway (days to first move) */
FW.slaDays=sev=>sev>=5?1:sev>=4?2:sev>=3?4:14;
/* days left on a case's runway; negative = breach. same-day counted as >=1 at start via >= comparisons in rules */
FW.slaLeft=(c,now)=>{const due=U.addD(c.openedAt.slice(0,10),FW.slaDays(c.sev));return U.days(now,due)};
/* Cynefin triage from text+sev. Returns {domain, move} */
FW.cynefin=(txt,sev)=>{
  const t=(txt||'').toLowerCase();
  if(sev>=4||/\b(outage|down|breach|blew up|exploded|furious|walked out|resigned|quit today|production|p0|sev\s?1)\b/.test(t))
    return {domain:'CHAOTIC',move:'Act first to stabilize. One owner, one order, then sense. No committees.'};
  if(/\b(again|keeps|pattern|third time|recurring|always|every sprint|chronic)\b/.test(t))
    return {domain:'COMPLEX',move:'Probe: run the smallest safe experiment and watch what the system does back.'};
  if(/\b(how do|should we|process|template|standard|checklist|runbook|onboard)\b/.test(t))
    return {domain:'CLEAR',move:'Apply the known practice. Write it down so the next leader skips this case.'};
  return {domain:'COMPLICATED',move:'Analyze: get the expert fact pattern before you move. Sense → analyze → respond.'};
};
/* Eisenhower quadrant from sev and runway */
FW.eisen=(sev,slaLeft)=>{const imp=sev>=3,urg=slaLeft<=2;
  return imp&&urg?{q:'DO',n:'Important + urgent — this is today.'}:imp?{q:'SCHEDULE',n:'Important, not yet urgent — date it or it becomes someone’s emergency.'}:urg?{q:'DELEGATE',n:'Urgent, low importance — hand it to a lead with a boundary.'}:{q:'DROP',n:'Neither — say no out loud and close it.'};};
/* hard-stop trip words. Returns matched words, verbatim logged. */
FW.TRIPS=['harassment','discrimination','safety','medical','fraud','legal','retaliation','self-harm','threat','assault','accommodation','racism','sexual','abuse','violence'];
FW.tripScan=txt=>{const t=(txt||'').toLowerCase();return FW.TRIPS.filter(w=>t.includes(w))};
/* morale slope over MEASURED entries only (estimates never move a slope). returns {perWeek, n} or null */
FW.slope=(series,now)=>{const m=(series||[]).filter(e=>!e.estimated);if(m.length<2)return null;
  const xs=m.map(e=>U.days(m[0].at.slice(0,10),e.at.slice(0,10))),ys=m.map(e=>e.v);
  const n=xs.length,xm=xs.reduce((a,b)=>a+b,0)/n,ym=ys.reduce((a,b)=>a+b,0)/n;
  let num=0,den=0;for(let i=0;i<n;i++){num+=(xs[i]-xm)*(ys[i]-ym);den+=(xs[i]-xm)*(xs[i]-xm)}
  if(!den)return null;return {perWeek:(num/den)*7,n};};
/* Flight risk: weighted driver ledger. Advisory, basis printed. */
FW.flight=(p,S,now)=>{
  const dr=[];let score=0;
  const measured=(p.mood||[]).filter(e=>!e.estimated);
  const sl=FW.slope(p.mood,now);
  if(sl&&sl.perWeek<=-0.4){score+=22;dr.push({k:'morale',w:22,why:'measured morale falling '+sl.perWeek.toFixed(1)+'/wk over '+U.plural(sl.n,'pulse')})}
  else if(measured.length&&measured[measured.length-1].v<=2){score+=14;dr.push({k:'morale',w:14,why:'last measured pulse '+measured[measured.length-1].v+'/5'})}

/* engine */
function isSnoozed(id,now){const u=S.snoozes[id];return !!u&&u>=now}
function EVAL(S0,now){
  const out={locked:[],firing:[],positive:[],sleeping:[]};
  for(const r of RULES){
    let hit=null;try{hit=r.test(S0,now)}catch(e){hit=null}
    if(!hit)continue;
    const row={id:r.id,msg:hit.msg,route:hit.route||'#/today',why:r.why,clears:r.clears};
    if(r.lane==='lock'){out.locked.push(row);continue}
    if(isSnoozed(r.id,now)){out.sleeping.push(Object.assign({until:S.snoozes[r.id]},row));continue}
    if(r.lane==='pos')out.positive.push(row);else out.firing.push(row);
  }
  return out;
}

function updCasePrev(){

  const btn=$('#casecommit');if(btn)btn.textContent=ethics?'commit — sealed escalation (four wires only)':'commit — write the routed records';

 'snooze':f=>{const d=fd(f);const until=d.get('until');if(!until||until<U.today())return toast('Snooze is dated forward, never amnesia.','bad');

 'person':f=>{const d=fd(f);const name=(d.get('name')||'').trim();if(!name)return toast('Name required — nothing written.','bad');

 'casenote':f=>{const c=U.byId(S.cases,f.dataset.id);if(!c)return;const text=(fd(f).get('text')||'').trim();if(!text)return toast('Empty note — nothing written.','bad');

 'casetask':f=>{const c=U.byId(S.cases,f.dataset.id);if(!c)return;const d=fd(f);const what=(d.get('what')||'').trim();if(!what)return toast('Empty task — nothing written.','bad');

 'caseclose':f=>{const c=U.byId(S.cases,f.dataset.id);if(!c)return;const d=fd(f);

 'fb':f=>{const d=fd(f);if(sbiScore(f)<2)return toast('Lint refuses: name at least 2 of 3 SBI parts specifically (≥8 chars each). Nothing written.','bad');
   S.feedback.push({id:U.uid('f'),personId:d.get('personId'),kind:d.get('kind'),model:'SBI',s:(d.get('s')||'').trim(),b:(d.get('b')||'').trim(),i:(d.get('i')||'').trim(),state:'pending',at:U.today(),deliveredAt:'',verifyBy:'',verifyState:'',lapsedCaseId:'',draft:false});
   logSys('feedback staged for '+U.pname(d.get('personId'))+' ('+d.get('kind')+') — '+(d.get('kind')==='praise'?'48h':'72h')+' clock started','feedback');save();closeModal();render();toast('Staged. Clock running: '+(d.get('kind')==='praise'?'48h':'72h')+'.','ok')},
 'goal':f=>{const d=fd(f);const title=(d.get('title')||'').trim();if(!title)return toast('Title required — nothing written.','bad');

 'decide':f=>{const x=U.byId(S.decisions,f.dataset.id);if(!x)return;const d=fd(f);

 'redate':f=>{const x=U.byId(S.decisions,f.dataset.id);if(!x)return;const d=fd(f);

 'decgrade':f=>{const x=U.byId(S.decisions,f.dataset.id);if(!x)return;const d=fd(f);

 'handoff':f=>{const d=fd(f);const need=(d.get('need')||'').trim();if(!need)return toast('The need, observably — or nothing written.','bad');
   if(d.get('fromTeam')===d.get('toTeam'))return toast('Both sides are the same team — that is a task, not a handoff. Nothing written.','bad');
   const h={id:U.uid('h'),fromTeam:d.get('fromTeam'),toTeam:d.get('toTeam'),fromLead:d.get('fromLead'),toLead:d.get('toLead'),need,by:d.get('by')||U.addD(U.today(),7),state:'asked',askedAt:U.today(),heat:0};

   logSys('handoff asked: '+need.slice(0,50)+' — acceptance commitment auto-written to '+U.pname(h.toLead),'handoff');save();closeModal();render();toast('Asked, on the record. The receiving lead already holds a dated accept-or-decline.','ok')},
 'risk':f=>{const d=fd(f);const title=(d.get('title')||'').trim();if(!title)return toast('Title required — nothing written.','bad');
   const now=U.today();const p=U.clamp(U.num(d.get('p'),3),1,5),i=U.clamp(U.num(d.get('i'),3),1,5);

 'riskmit':f=>{const r=U.byId(S.risks,f.dataset.id);if(!r)return;const d=fd(f);const what=(d.get('what')||'').trim();if(!what)return;

   logSys('mitigation added to risk '+r.title+': '+what,'risk');save();MD.risk(r.id);render()},
 'riskreview':f=>{const r=U.byId(S.risks,f.dataset.id);if(!r)return;const d=fd(f);
   r.p=U.clamp(U.num(d.get('p'),r.p),1,5);r.i=U.clamp(U.num(d.get('i'),r.i),1,5);

 'riskedit':f=>{const r=U.byId(S.risks,f.dataset.id);if(!r)return;const d=fd(f);
   r.title=(d.get('title')||'').trim()||r.title;r.desc=(d.get('desc')||'').trim();r.ownerId=d.get('ownerId')||'';r.ewi=(d.get('ewi')||'').trim();
   logSys('risk fields edited: '+r.title,'risk');save();closeModal();render()},
 'riskretire':f=>{const r=U.byId(S.risks,f.dataset.id);if(!r)return;const d=fd(f);const lesson=(d.get('lesson')||'').trim();
   if(!lesson)return toast('Retiring is graded like a goal: the causal lesson is mandatory.','bad');

   logSys('risk retired '+r.outcome+': '+r.title,'risk');save();closeModal();render();toast('Retired as '+d.get('outcome')+' — lesson journaled.','ok')},
 'seat':f=>{const d=fd(f);const sid=f.dataset.id;const title=(d.get('title')||'').trim();if(!title)return toast('Seat title required.','bad');
   let st=sid?U.byId(S.seats,sid):null;

   st.title=title;st.teamId=d.get('teamId')||'';st.criticality=U.num(d.get('criticality'),2);st.holderId=d.get('holderId')||'';st.coverId=d.get('coverId')||'';st.updatedAt=U.today();
   logSys('seat '+(sid?'re-stamped':'created')+': '+title,'talent');save();closeModal();render();toast('Seat saved — staleness clock restarted.','ok')},
 'slate':f=>{const st=U.byId(S.seats,f.dataset.id);if(!st)return;const d=fd(f);
   st.slate=st.slate.filter(x=>x.personId!==d.get('personId'));
   st.slate.push({personId:d.get('personId'),horizon:d.get('horizon'),assignedAt:U.today()});st.updatedAt=U.today();
   logSys('slate: '+U.pname(d.get('personId'))+' → '+st.title+' ('+d.get('horizon')+') — your call, on the record','talent');save();closeModal();render();toast('Slate updated. The advisory math will show its basis; the assignment stays yours.','ok')},
 'aar':f=>{const c=U.byId(S.cases,f.dataset.id);if(!c)return;const d=fd(f);
   const whys=[d.get('w1'),d.get('w2'),d.get('w3'),d.get('w4'),d.get('w5')].map(x=>(x||'').trim()).filter(Boolean);
   if(whys.length<3)return toast('Five-whys needs at least three — shallower is opinion.','bad');
   const nameHit=whys.find(w=>S.people.find(p=>w.includes(p.name.split(' ')[0])&&p.name.split(' ')[0].length>2));
   if(nameHit&&!d.get('blameless'))return toast('A why contains a person’s first name (“'+nameHit+'”). That is the blame stop-condition — either check the box declaring the timeline room-safe, or rewrite it as a system condition.','bad');
   const imp=(d.get('imp1')||'').trim();const aar={id:U.uid('a'),caseId:c.id,expected:(d.get('expected')||'').trim(),happened:(d.get('happened')||'').trim(),whys,imp:[],at:U.today(),quality:0};
   if(imp){const t={id:U.uid('k'),what:imp,who:d.get('impw1')||'me',dir:(d.get('impw1')||'me')==='me'?'mine':'theirs',by:d.get('impb1')||U.addD(U.today(),7),done:false,caseId:c.id};S.tasks.push(t);aar.imp.push({what:imp,taskId:t.id})}
   aar.quality=Math.min(100,Math.round(whys.length/5*50)+(aar.expected&&aar.happened?25:0)+(aar.imp.length?25:0));
   S.aars.push(aar);c.aarId=aar.id;
   S.lessons.push({id:U.uid('l'),text:'AAR on “'+c.title+'”: '+whys[whys.length-1],at:U.today(),src:'aar '+aar.id});
   logSys('AAR filed for case '+c.id+' — quality '+aar.quality+'/100, '+U.plural(aar.imp.length,'improvement commitment'),'aar');save();closeModal();render();toast('AAR filed — tuition paid. Quality '+aar.quality+'/100.','ok')},

/* ============================================================ LISTENERS + BOOT */
document.addEventListener('click',e=>{
  const pal=e.target.closest('[data-pal]');if(pal){const it=PAL_ITEMS[+pal.dataset.pal];if(it){closeModal();it.run()}return}
  const sv=e.target.closest('[data-sev]');if(sv){const f=$('#f-case');if(f){f.querySelector('[name=sev]').value=sv.dataset.sev;document.querySelectorAll('#sevpick button').forEach(b=>b.classList.toggle('on',b===sv));updCasePrev()}return}
  const cf=e.target.closest('[data-conf]');if(cf){const f=cf.closest('form');if(f){f.querySelector('[name=conf]').value=cf.dataset.conf;document.querySelectorAll('#confpick button').forEach(b=>b.classList.toggle('on',b===cf))}return}
  const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a;
  if(a==='modal-x'){closeModal();return}
  if(ACT[a])ACT[a](el,e);
});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-f]');if(!f)return;e.preventDefault();const h=FORMS[f.dataset.f];if(h)h(f)});
document.addEventListener('input',e=>{const el=e.target.closest('[data-i]');if(el&&LIVE[el.dataset.i])LIVE[el.dataset.i](el,e)});
document.addEventListener('change',e=>{
  const el=e.target.closest('[data-change="import"]');if(!el)return;const file=el.files&&el.files[0];if(!file)return;
  const rd=new FileReader();rd.onload=()=>{window.__importRaw=String(rd.result||'');
    const v=validateImport(window.__importRaw);
    if(!v.ok){toast(v.err,'bad');return}
    openModal('<h3>Import — record v'+v.rec.v+'</h3><div class="sub">How should these '+U.plural(v.rec.cases.length,'case')+', '+U.plural(v.rec.people.length,'person')+', '+U.plural(v.rec.risks.length,'risk')+' join this browser?</div><div class="gap"></div>'+
    '<div class="row"><button class="btn pri" data-a="import-replace">replace everything</button><button class="btn" data-a="import-merge">merge (ids re-minted)</button><button class="btn" data-a="modal-x">cancel — touch nothing</button></div>')};
  rd.readAsText(file);el.value='';
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeModal();return}
  const palOpen=!!$('#palin');
  if(palOpen){
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const n=(window.__palvis||[]).length;if(!n)return;PAL_SEL=(PAL_SEL+(e.key==='ArrowDown'?1:-1)+n)%n;drawPal();return}
    if(e.key==='Enter'){e.preventDefault();const v=window.__palvis||[];const x=v[PAL_SEL];if(x){closeModal();PAL_ITEMS[x.idx].run()}return}
    return; /* while palette is open, other shortcuts don't fire */
  }
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement||{}).tagName||'');
  if(e.key==='Enter'&&document.activeElement&&document.activeElement.id==='capin'){const v=document.activeElement.value;document.activeElement.value='';if(v.trim())capture(v);return}
  if(typing)return;
  if(e.key==='/'||(e.key.toLowerCase()==='k'&&(e.ctrlKey||e.metaKey))){e.preventDefault();openPalette();return}
  if(e.key==='C'){e.preventDefault();ACT.newcase();return}
  if(/^[0-9]$/.test(e.key)){const idx=e.key==='0'?9:parseInt(e.key)-1;const dest=NAV[idx];if(dest)go(dest[0]);return}
});
window.addEventListener('hashchange',()=>{window.__abouttests=undefined;render()});
function boot(){
  const st=loadStore();
  window.__TM=true;try{window.__testfails=runTests()}finally{window.__TM=false}
  if(window.__testfails.length)console.warn('[LeadOS] self-test failures:',window.__testfails);
  if(st==='fresh'&&!RECOVERY){S=SEED(U.today())}
  try{AUDITS.run(true)}catch(e){S.auditFaults=['audit engine threw: '+e.message]}
  try{ENG.sweep(U.today())}catch(e){console.warn('[LeadOS] sweep:',e)}
  save();render();
}
boot();
