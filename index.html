<script>
/* =========================================================================
   LEADOS — single-file sandbox
   Part 1: minimal org model (people, pulses, feedback, growth plans,
           1:1 cadence, conflicts) — synthetic/seeded, built fresh in this
           environment (see AI-SESSION-LOG.md: no prior index.html existed
           in this project; "Part 1" referenced by the task's Part 2 spec
           was never delivered here, so its data shapes are reconstructed
           from what LEADOS.simulation's own code expects).
   Part 2: LEADOS.simulation — discrete-event / Monte-Carlo organizational
           simulation, reproduced from the task's pasted spec essentially
           verbatim (see AI-SESSION-LOG.md §3), plus a Playbook + View UI.
   ========================================================================= */
const LEADOS = {};

// ---------------------------------------------------------------- util ---
LEADOS.util = {
  uid: () => Math.random().toString(36).slice(2, 10),
  todayISO: () => new Date().toISOString().slice(0, 10),
  clamp: (v, min, max) => Math.max(min, Math.min(max, v)),
  daysAgo: (n) => new Date(Date.now() - n * 86400000).toISOString(),
  fmtDate: (ts) => new Date(ts).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }),
  round1: (v) => Math.round(v * 10) / 10,
};

// ------------------------------------------------------------- engine ---
// Minimal projection builder: raw localStorage state -> the "P" shape
// LEADOS.simulation.initAgents() expects. This shape is INFERRED from
// the field names used inside the Part 2 spec (P.directs, P.skips,
// P.pulsesByPerson, P.feedbackByPerson, P.openPlans, P.oneononeLast,
// P.state.events) — it is not copied from any verified prior LEADOS
// build, because none was found/accessible to this session. See
// AI-SESSION-LOG.md.
LEADOS.engine = {
  _days(a, b) {
    return Math.round((new Date(b).getTime() - new Date(a).getTime()) / 86400000);
  },
  buildProjection(state, today) {
    const pulsesByPerson = {};
    state.pulses.forEach(pu => { (pulsesByPerson[pu.personId] ||= []).push(pu); });
    const feedbackByPerson = {};
    state.feedback.forEach(f => { (feedbackByPerson[f.personId] ||= []).push(f); });
    const oneononeLast = {};
    state.oneonones.forEach(o => {
      const prev = oneononeLast[o.personId];
      if (!prev || new Date(o.ts) > new Date(prev.ts)) oneononeLast[o.personId] = o;
    });
    return {
      directs: state.people.filter(p => p.type === 'direct'),
      skips: state.people.filter(p => p.type === 'skip'),
      pulsesByPerson,
      feedbackByPerson,
      openPlans: state.plans.filter(p => p.open),
      oneononeLast,
      state: { events: state.events },
    };
  },
};

// --------------------------------------------------------- monteCarlo ---
LEADOS.monteCarlo = {
  // Deterministic seeded PRNG (mulberry32). Chosen so Monte Carlo runs are
  // reproducible across reloads for the same seed index — not a claim of
  // statistical rigor, just repeatability for a toy demo.
  _prng(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  },
};

// ========================================================================
// LEADOS.simulation — reproduced from the task's pasted Part 2 spec.
// UNVERIFIED PROVENANCE: this object is taken from this conversation's own
// prompt text, not from github.com/wbweve/Leados (no file matching this
// code — identifiers like stepAgents/initAgents/flightSignal — was found
// in anything actually fetched from that repo this session). Treated the
// same way earlier sessions in that repo's own log treated their pasted
// briefs: implemented as described, labeled as a heuristic/unvalidated
// model, not presented as verified prior art.
// ========================================================================
LEADOS.simulation = {

  initAgents(P, today) {
    return P.directs.concat(P.skips).map(person => {
      const recentPulses = (P.pulsesByPerson[person.id] || [])
        .filter(pu => LEADOS.engine._days(pu.ts, today) <= 30);

      const meanMood = recentPulses.length ?
        recentPulses.reduce((a, b) => a + b.mood, 0) / recentPulses.length : 6;
      const meanLoad = recentPulses.filter(p => p.load !== undefined).length ?
        recentPulses.reduce((a, b) => a + (b.load || 5), 0) / recentPulses.length : 6;

      const feedback = (P.feedbackByPerson[person.id] || [])
        .filter(f => LEADOS.engine._days(f.ts, today) <= 90);

      return {
        id: person.id,
        name: person.name,
        mood: meanMood,
        load: meanLoad,
        engagement: Math.max(1, meanMood * 0.8 + (10 - meanLoad) * 0.2),
        performance: 7,
        flightRisk: 0,
        hasGrowthPlan: P.openPlans.some(pl => pl.personId === person.id),
        cadenceRatio: (() => {
          const last = P.oneononeLast[person.id];
          const cadence = person.cadenceDays || 14;
          return last ? LEADOS.engine._days(last.ts, today) / cadence : 2;
        })(),
        feedbackBalance: feedback.length ?
          feedback.filter(f => f.polarity === 'positive').length / feedback.length : 0.7,
        recentConflicts: P.state.events.filter(e =>
          e.type === 'conflict.logged' &&
          (e.data.person1Id === person.id || e.data.person2Id === person.id) &&
          LEADOS.engine._days(e.ts, today) <= 30
        ).length,
        history: []
      };
    });
  },

  stepAgents(agents, intervention, week, rand) {
    return agents.map(agent => {
      const next = { ...agent, history: [...agent.history] };

      if (agent.load > 7.5) {
        next.mood = Math.max(1, agent.mood - rand() * 0.4);
      } else if (agent.load < 5) {
        next.mood = Math.min(10, agent.mood + rand() * 0.2);
      }

      if (agent.cadenceRatio > 1.5) {
        next.engagement = Math.max(1, agent.engagement - 0.3);
        next.cadenceRatio += 0.25;
      } else {
        next.engagement = Math.min(10, agent.engagement + 0.1);
      }

      if (!agent.hasGrowthPlan) {
        next.engagement = Math.max(1, agent.engagement - 0.15);
      }

      if (agent.recentConflicts > 0) {
        next.mood = Math.max(1, agent.mood - 0.3 * agent.recentConflicts);
        next.recentConflicts = Math.max(0, agent.recentConflicts - 0.5);
      }

      if (intervention && intervention.personIds.includes(agent.id)) {
        switch (intervention.type) {
          case 'IMPROVE_1ON1_CADENCE':
            next.cadenceRatio = 1.0;
            next.engagement = Math.min(10, agent.engagement + 0.8);
            break;
          case 'ADD_GROWTH_PLAN':
            next.hasGrowthPlan = true;
            next.engagement = Math.min(10, agent.engagement + 0.6);
            break;
          case 'GIVE_CORRECTIVE_FEEDBACK':
            next.performance = Math.min(10, agent.performance + 0.5);
            next.mood = Math.max(1, agent.mood - 0.3);
            break;
          case 'GIVE_POSITIVE_FEEDBACK':
            next.mood = Math.min(10, agent.mood + 0.4);
            next.engagement = Math.min(10, agent.engagement + 0.2);
            break;
          case 'REDUCE_LOAD':
            next.load = Math.max(1, agent.load - 2);
            next.mood = Math.min(10, agent.mood + 0.5);
            break;
          case 'PROMOTE':
            next.mood = Math.min(10, agent.mood + 2);
            next.engagement = Math.min(10, agent.engagement + 2);
            next.flightRisk = Math.max(0, agent.flightRisk - 0.4);
            break;
        }
      }

      const flightSignal =
        (1 - next.engagement / 10) * 0.35 +
        (1 - next.mood / 10) * 0.35 +
        Math.min(1, next.cadenceRatio / 3) * 0.20 +
        (next.hasGrowthPlan ? 0 : 0.10);

      next.flightRisk = Math.min(1, flightSignal);

      next.performance = Math.max(1, Math.min(10,
        agent.performance * 0.7 + next.engagement * 0.3
      ));

      next.history.push({
        week,
        mood: Math.round(next.mood * 10) / 10,
        load: Math.round(next.load * 10) / 10,
        engagement: Math.round(next.engagement * 10) / 10,
        flightRisk: Math.round(next.flightRisk * 100) / 100
      });

      return next;
    });
  },

  run(P, today, params = {}) {
    const {
      weeks = 12,
      seeds = 50,
      interventions = []
    } = params;

    const scenarios = {};

    scenarios.STATUS_QUO = this._runScenario(
      P, today, weeks, seeds, [], 'Status quo — no interventions'
    );

    interventions.forEach(intervention => {
      const key = 'INTERVENTION:' + intervention.type + (intervention.suffix || '');
      scenarios[key] = this._runScenario(
        P, today, weeks, seeds, [intervention],
        intervention.description || intervention.type
      );
    });

    const ranked = Object.entries(scenarios)
      .map(([key, result]) => ({
        scenario: key,
        expectedTeamEngagement: result.finalMean.engagement,
        expectedFlightRisk: result.finalMean.flightRisk,
        expectedAttritionProb: result.attritionProbability,
        label: result.label,
        confidenceInterval: result.confidenceInterval,
      }))
      .sort((a, b) => a.expectedAttritionProb - b.expectedAttritionProb);

    return {
      scenarios,
      ranking: ranked,
      bestIntervention: ranked.find(r => r.scenario !== 'STATUS_QUO'),
      label: `Organizational simulation: ${weeks} weeks x ${seeds} Monte Carlo seeds. ` +
             `Each seed uses a different random draw for stochastic effects. ` +
             `Labeled: agent parameters are heuristic. ` +
             `Behavioral coefficients are not empirically validated for your org.`
    };
  },

  _runScenario(P, today, weeks, seeds, interventions, label) {
    const allSeedResults = [];

    for (let seed = 0; seed < seeds; seed++) {
      const rand = LEADOS.monteCarlo._prng(seed * 1000 + 42);
      let agents = this.initAgents(P, today);

      for (let week = 1; week <= weeks; week++) {
        agents = this.stepAgents(agents, interventions[0], week, rand);
      }

      const finalEngagement = agents.reduce((a, ag) => a + ag.engagement, 0) / agents.length;
      const finalFlightRisk = agents.reduce((a, ag) => a + ag.flightRisk, 0) / agents.length;
      const anyHighRisk = agents.some(ag => ag.flightRisk > 0.7);

      allSeedResults.push({
        finalEngagement,
        finalFlightRisk,
        attrition: anyHighRisk,
        finalAgents: agents
      });
    }

    const meanEngagement = allSeedResults.reduce((a, r) => a + r.finalEngagement, 0) / seeds;
    const meanFlightRisk = allSeedResults.reduce((a, r) => a + r.finalFlightRisk, 0) / seeds;
    const attritionProbability = allSeedResults.filter(r => r.attrition).length / seeds;

    return {
      label,
      finalMean: {
        engagement: Math.round(meanEngagement * 10) / 10,
        flightRisk: Math.round(meanFlightRisk * 100) / 100
      },
      attritionProbability: Math.round(attritionProbability * 100) / 100,
      confidenceInterval: {
        engagement_p10: this._percentile(allSeedResults.map(r => r.finalEngagement), 0.10),
        engagement_p90: this._percentile(allSeedResults.map(r => r.finalEngagement), 0.90)
      },
      seedCount: seeds,
      sampleFinalAgents: allSeedResults[0].finalAgents, // seed-0 snapshot, for the per-agent table (NOT a Monte Carlo mean)
    };
  },

  _percentile(values, p) {
    const sorted = [...values].sort((a, b) => a - b);
    return Math.round(sorted[Math.floor(p * sorted.length)] * 10) / 10;
  },

  // --- Added in this delivery (NOT part of the pasted spec above) ------
  // Non-invasive extensions used only by the View: a single deterministic
  // seed run that keeps the week-by-week history, for charting. The
  // headline numbers shown in the ranking table always come from the
  // unmodified Monte Carlo functions above, never from this helper.
  weeklyTrajectory(P, today, weeks, intervention, seed = 0) {
    const rand = LEADOS.monteCarlo._prng(seed * 1000 + 42);
    let agents = this.initAgents(P, today);
    const weekly = [{ week: 0,
      engagement: LEADOS.util.round1(agents.reduce((a, x) => a + x.engagement, 0) / agents.length),
      mood: LEADOS.util.round1(agents.reduce((a, x) => a + x.mood, 0) / agents.length),
      flightRisk: LEADOS.util.round1((agents.reduce((a, x) => a + x.flightRisk, 0) / agents.length) * 100) / 100,
    }];
    for (let week = 1; week <= weeks; week++) {
      agents = this.stepAgents(agents, intervention, week, rand);
      weekly.push({
        week,
        engagement: LEADOS.util.round1(agents.reduce((a, x) => a + x.engagement, 0) / agents.length),
        mood: LEADOS.util.round1(agents.reduce((a, x) => a + x.mood, 0) / agents.length),
        flightRisk: Math.round((agents.reduce((a, x) => a + x.flightRisk, 0) / agents.length) * 100) / 100,
      });
    }
    return { weekly, agents };
  },

  // "Current" (un-simulated) flight-risk estimate, using the same formula
  // as week-0 of stepAgents, for dashboards — added in this delivery.
  estimateCurrent(P, today) {
    return this.initAgents(P, today).map(a => {
      const flightSignal =
        (1 - a.engagement / 10) * 0.35 +
        (1 - a.mood / 10) * 0.35 +
        Math.min(1, a.cadenceRatio / 3) * 0.20 +
        (a.hasGrowthPlan ? 0 : 0.10);
      return { ...a, flightRisk: Math.min(1, flightSignal) };
    });
  },
};

// --------------------------------------------------------------- store ---
LEADOS.store = {
  KEY: 'leados:v1', // new key — this project had no prior state (see AI-SESSION-LOG.md)
  load() {
    try {
      const raw = localStorage.getItem(this.KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) { /* fall through to reseed */ }
    const seeded = LEADOS.seed.generate();
    this.save(seeded);
    return seeded;
  },
  save(state) { localStorage.setItem(this.KEY, JSON.stringify(state)); },
  reset() { const s = LEADOS.seed.generate(); this.save(s); return s; }
};

// ---------------------------------------------------------------- seed ---
// Fully synthetic roster/history, fabricated for this demo. Disclosed:
// not real organizational data, not derived from the real repo (no such
// data was found there either — see AI-SESSION-LOG.md).
LEADOS.seed = {
  generate() {
    const rand = LEADOS.monteCarlo._prng(7);
    const people = [
      { id: 'p1', name: 'Maya Chen',       type: 'direct', role: 'Staff Engineer',  cadenceDays: 7 },
      { id: 'p2', name: 'Jordan Blake',    type: 'direct', role: 'Senior PM',       cadenceDays: 14 },
      { id: 'p3', name: 'Priya Nair',      type: 'direct', role: 'Engineering Mgr', cadenceDays: 14 },
      { id: 'p4', name: 'Sam Okafor',      type: 'direct', role: 'Product Designer',cadenceDays: 14 },
      { id: 'p5', name: 'Elena Rossi',     type: 'direct', role: 'Data Scientist',  cadenceDays: 21 },
      { id: 'p6', name: 'Tariq Hassan',    type: 'direct', role: 'Support Lead',    cadenceDays: 14 },
      { id: 'p7', name: 'Nina Kowalski',   type: 'skip',   role: 'Senior Engineer', cadenceDays: 21 },
      { id: 'p8', name: 'Diego Alvarez',   type: 'skip',   role: 'Engineer II',     cadenceDays: 30 },
      { id: 'p9', name: 'Faye Thompson',   type: 'skip',   role: 'Analyst',         cadenceDays: 30 },
    ];

    // profile: [baseMood, baseLoad]
    const profile = {

    const pulses = [];

      { id: LEADOS.util.uid(), personId: 'p7', title: 'Mentorship rotation for junior engineers', ts: LEADOS.util.daysAgo(30), open: true },
      // p3, p4, p6, p8, p9 deliberately left without an open plan

    const oneonones = [
      { id: LEADOS.util.uid(), personId: 'p1', ts: LEADOS.util.daysAgo(5),  note: 'Quick sync, on track.' },
      { id: LEADOS.util.uid(), personId: 'p2', ts: LEADOS.util.daysAgo(20), note: 'Roadmap pressure discussed.' },
      { id: LEADOS.util.uid(), personId: 'p3', ts: LEADOS.util.daysAgo(27), note: 'Overdue — rescheduled twice.' },
      { id: LEADOS.util.uid(), personId: 'p4', ts: LEADOS.util.daysAgo(10), note: 'Design feedback loop review.' },
      { id: LEADOS.util.uid(), personId: 'p5', ts: LEADOS.util.daysAgo(16), note: 'Conflict follow-up.' },
      { id: LEADOS.util.uid(), personId: 'p6', ts: LEADOS.util.daysAgo(41), note: 'Overdue — support load spike.' },
      { id: LEADOS.util.uid(), personId: 'p7', ts: LEADOS.util.daysAgo(18), note: 'Skip-level check-in.' },
      { id: LEADOS.util.uid(), personId: 'p8', ts: LEADOS.util.daysAgo(34), note: 'Skip-level check-in.' },

    return { people, pulses, feedback, plans, oneonones, events };

// ------------------------------------------------------------- charts ---
LEADOS.charts = {
  line(canvas, cfg) {
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);
    const pad = { l: 34, r: 12, t: 12, b: 22 };
    const plotW = W - pad.l - pad.r, plotH = H - pad.t - pad.b;
    const yMin = cfg.yMin ?? 0, yMax = cfg.yMax ?? 10;
    const n = (cfg.series[0] && cfg.series[0].data.length) || 1;
    const x = i => pad.l + (i / ((n - 1) || 1)) * plotW;
    const y = v => pad.t + plotH - ((v - yMin) / (yMax - yMin)) * plotH;

    ctx.strokeStyle = '#1e293b'; ctx.fillStyle = '#64748b'; ctx.font = '10px sans-serif'; ctx.lineWidth = 1;
    for (let g = 0; g <= 4; g++) {
      const v = yMin + (g / 4) * (yMax - yMin);
      const yy = y(v);
      ctx.beginPath(); ctx.moveTo(pad.l, yy); ctx.lineTo(W - pad.r, yy); ctx.stroke();
      ctx.fillText(v.toFixed(1), 2, yy + 3);
    }

    cfg.series.forEach(s => {
      ctx.strokeStyle = s.color; ctx.lineWidth = 2; ctx.beginPath();
      s.data.forEach((v, i) => { const xx = x(i), yy = y(v); if (i === 0) ctx.moveTo(xx, yy); else ctx.lineTo(xx, yy); });
      ctx.stroke();
    });

    ctx.fillStyle = '#64748b';
    (cfg.xLabels || []).forEach((lab, i) => {
      if (i % Math.ceil(n / 8 || 1) === 0) ctx.fillText(String(lab), x(i) - 4, H - 6);
    });
  },
};

// ================================================================ app ===
let STATE = LEADOS.store.load();
let TAB = 'today';
let SIM = { params: { weeks: 12, seeds: 40 }, type: 'IMPROVE_1ON1_CADENCE', targets: new Set(), result: null, chartScenarioKey: null };

function P() { return LEADOS.engine.buildProjection(STATE, new Date()); }
function allPeople() { return STATE.people; }
function personName(id) { const p = STATE.people.find(x => x.id === id); return p ? p.name : id; }

function save() { LEADOS.store.save(STATE); render(); }

function riskColor(r) { return r > 0.7 ? '#ef4444' : r > 0.4 ? '#f59e0b' : '#22c55e'; }

function render() {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="min-h-screen flex">
      <aside class="w-56 shrink-0 bg-slate-900/60 border-r border-slate-800 flex flex-col">
        <div class="px-4 py-4 border-b border-slate-800">
          <div class="text-lg font-bold text-sky-400">LEADOS</div>
          <div class="text-[11px] text-slate-500">Leadership OS — sandbox</div>
        </div>
        <nav class="flex-1 py-2">
          ${navBtn('today', 'Today')}
          ${navBtn('people', 'People')}
          ${navBtn('pulses', 'Pulses')}
          ${navBtn('feedback', 'Feedback')}
          ${navBtn('growth', 'Growth Plans')}
          ${navBtn('oneonones', '1:1 Cadence')}
          ${navBtn('conflicts', 'Conflicts')}
          ${navBtn('simulation', 'Simulation ★')}
          ${navBtn('about', 'About / Provenance')}
        </nav>
        <div class="p-3 border-t border-slate-800">
          <button onclick="window.resetData()" class="w-full text-xs bg-slate-800 hover:bg-slate-700 rounded px-2 py-1.5">Reset synthetic data</button>

        ${renderTab()}

  `;
  afterRenderHooks();
}

function navBtn(key, label) {
  return `<button onclick="window.setTab('${key}')" class="navbtn w-full text-left px-4 py-2 text-sm text-slate-300 hover:bg-slate-800/60 ${TAB === key ? 'active' : ''}">${label}</button>`;
}

function renderTab() {
  switch (TAB) {
    case 'today': return renderToday();
    case 'people': return renderPeople();
    case 'pulses': return renderPulses();
    case 'feedback': return renderFeedback();
    case 'growth': return renderGrowth();
    case 'oneonones': return renderOneOnOnes();
    case 'conflicts': return renderConflicts();
    case 'simulation': return renderSimulation();
    case 'about': return renderAbout();
    default: return '';
  }
}

// ----------------------------------------------------------- Today ---
function renderToday() {
  const p = P();
  const agents = LEADOS.simulation.estimateCurrent(p, new Date());
  const avgMood = LEADOS.util.round1(agents.reduce((a, x) => a + x.mood, 0) / agents.length);
  const avgLoad = LEADOS.util.round1(agents.reduce((a, x) => a + x.load, 0) / agents.length);
  const overdue = agents.filter(a => a.cadenceRatio > 1.5).length;
  const noPlan = agents.filter(a => !a.hasGrowthPlan).length;
  const highRisk = agents.filter(a => a.flightRisk > 0.7).length;

  return `
    <h1 class="text-2xl font-bold text-white mb-1">Today</h1>
    <p class="text-sm text-slate-400 mb-6">Current (un-simulated) snapshot, computed with the same agent formulas the simulation uses at week 0.</p>
    <div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-8">
      ${statCard('Team size', agents.length, '')}
      ${statCard('Avg mood', avgMood, '/ 10')}
      ${statCard('Avg load', avgLoad, '/ 10')}
      ${statCard('1:1s overdue', overdue, 'people')}
      ${statCard('No growth plan', noPlan, 'people')}
    </div>
    <h2 class="text-lg font-semibold text-white mb-3">Roster snapshot ${highRisk ? `<span class="tag text-red-400 ml-2">${highRisk} high flight-risk</span>` : ''}</h2>
    <div class="overflow-x-auto rounded-lg border border-slate-800">
      <table class="w-full text-sm">
        <thead class="bg-slate-900/60 text-slate-400 text-xs uppercase">
          <tr><th class="text-left p-2">Name</th><th class="text-left p-2">Role</th><th class="p-2">Mood</th><th class="p-2">Load</th><th class="p-2">Engagement</th><th class="p-2">Flight risk</th></tr>
        </thead>
        <tbody>
          ${agents.map(a => {
            const person = STATE.people.find(x => x.id === a.id);
            return `<tr class="border-t border-slate-800">
              <td class="p-2 font-medium text-white">${a.name}</td>
              <td class="p-2 text-slate-400">${person.role}</td>
              <td class="p-2 text-center">${LEADOS.util.round1(a.mood)}</td>
              <td class="p-2 text-center">${LEADOS.util.round1(a.load)}</td>
              <td class="p-2 text-center">${LEADOS.util.round1(a.engagement)}</td>
              <td class="p-2 w-32">
                <div class="riskbar"><div style="width:${a.flightRisk*100}%; background:${riskColor(a.flightRisk)}"></div></div>
                <div class="text-[10px] text-center text-slate-400">${Math.round(a.flightRisk*100)}%</div>
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
    <div class="mt-6 text-xs text-slate-500 border border-slate-800 rounded p-3">
      <b>Unverified / heuristic:</b> mood, load, engagement, cadenceRatio, feedbackBalance and flightRisk are all derived
      from fixed coefficients in the pasted Part 2 spec (e.g. flight risk = 0.35×mood-gap + 0.35×engagement-gap +
      0.20×cadence-overdue + 0.10×no-plan). These weights are illustrative, not fit to any real attrition data.
    </div>
  `;
}
function statCard(label, value, unit) {
  return `<div class="bg-slate-900/60 border border-slate-800 rounded-lg p-4">
    <div class="text-xs text-slate-400">${label}</div>
    <div class="text-2xl font-bold text-white">${value} <span class="text-xs text-slate-500 font-normal">${unit}</span></div>
  </div>`;
}

// -------------------------------------------------------- Simulation ---
const INTERVENTION_DEFS = [
  { type: 'IMPROVE_1ON1_CADENCE', label: 'Fix 1:1 cadence', desc: 'Reset overdue 1:1s to on-cadence' },
  { type: 'ADD_GROWTH_PLAN', label: 'Add growth plan', desc: 'Open a growth plan for everyone missing one' },
  { type: 'GIVE_CORRECTIVE_FEEDBACK', label: 'Corrective feedback', desc: 'Direct, specific corrective feedback (short-term mood dip, performance up)' },
  { type: 'GIVE_POSITIVE_FEEDBACK', label: 'Positive feedback', desc: 'Recognize recent wins' },
  { type: 'REDUCE_LOAD', label: 'Reduce load', desc: 'Rebalance workload for overloaded people' },
  { type: 'PROMOTE', label: 'Promote', desc: 'Promotion / scope increase for a specific person' },
];

function renderSimulation() {
  const p = P();
  const people = STATE.people;
  const result = SIM.result;

  return `
    <h1 class="text-2xl font-bold text-white mb-1">Organizational simulation</h1>
    <p class="text-sm text-slate-400 mb-6">Discrete-event, weekly-step, Monte Carlo simulation of your team 90 days forward. Reproduced from the task's pasted <code>LEADOS.simulation</code> spec — see About tab for provenance.</p>

    <div class="grid lg:grid-cols-3 gap-6">
      <div class="lg:col-span-1 bg-slate-900/60 border border-slate-800 rounded-lg p-4 space-y-4">
        <h2 class="font-semibold text-white">Run parameters</h2>
        <label class="block text-xs text-slate-400">Weeks forward
          <input id="simWeeks" type="number" min="4" max="26" value="${SIM.params.weeks}" class="w-full mt-1 bg-slate-800 rounded px-2 py-1 text-sm" />
        </label>
        <label class="block text-xs text-slate-400">Monte Carlo seeds
          <input id="simSeeds" type="number" min="10" max="300" value="${SIM.params.seeds}" class="w-full mt-1 bg-slate-800 rounded px-2 py-1 text-sm" />

        <select id="simType" class="w-full bg-slate-800 rounded px-2 py-1 text-sm">
          ${INTERVENTION_DEFS.map(d => `<option value="${d.type}" ${SIM.type===d.type?'selected':''}>${d.label}</option>`).join('')}
        </select>
        <div class="text-xs text-slate-500">Target people:</div>
        <div class="max-h-40 overflow-y-auto space-y-1 border border-slate-800 rounded p-2">
          ${people.map(person => `
            <label class="flex items-center gap-2 text-xs text-slate-300">
              <input type="checkbox" class="simTarget" value="${person.id}" ${SIM.targets.has(person.id) ? 'checked' : ''} />
              ${person.name}
            </label>`).join('')}
        </div>
        <div class="flex gap-2">
          <button onclick="window.simSelectAll()" class="text-xs bg-slate-800 hover:bg-slate-700 rounded px-2 py-1">All</button>
          <button onclick="window.simSelectAtRisk()" class="text-xs bg-slate-800 hover:bg-slate-700 rounded px-2 py-1">At-risk only</button>
          <button onclick="window.simSelectNone()" class="text-xs bg-slate-800 hover:bg-slate-700 rounded px-2 py-1">None</button>
        </div>
        <button onclick="window.runSim()" class="w-full bg-sky-600 hover:bg-sky-500 text-white rounded px-3 py-2 text-sm font-medium">Run: status quo vs. this intervention</button>
        <button onclick="window.runPlaybook()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white rounded px-3 py-2 text-sm font-medium">Run full playbook (compare all 6)</button>
        <p class="text-[11px] text-slate-500">"Full playbook" applies each intervention type uniformly to the whole team for comparability — an acknowledged simplification; use the manual run to target specific people (e.g. a single promotion).</p>
      </div>

      <div class="lg:col-span-2 space-y-6">
        ${result ? renderSimResults(result) : `<div class="text-slate-500 text-sm border border-dashed border-slate-800 rounded-lg p-8 text-center">Run a simulation to see results.</div>`}
      </div>
    </div>
  `;
}

function renderSimResults(result) {
  const chartKey = SIM.chartScenarioKey || (result.ranking[0] && result.ranking[0].scenario);
  const chosenScenario = result.scenarios[chartKey];
  const chosenIntervention = chosenScenario && chosenScenario.sampleFinalAgents ? SIM.lastInterventions[chartKey] : null;
  const trajB = chosenIntervention ? LEADOS.simulation.weeklyTrajectory(P(), new Date(), SIM.params.weeks, chosenIntervention) : null;

  return `
    <div class="bg-slate-900/60 border border-slate-800 rounded-lg p-4">
      <h2 class="font-semibold text-white mb-1">${result.bestIntervention ? '★ Recommended' : ''}</h2>
      ${result.bestIntervention ? `
        <div class="text-sm text-emerald-400 font-medium">${result.bestIntervention.label}</div>
        <div class="text-xs text-slate-400">Lowest projected attrition probability: ${(result.bestIntervention.expectedAttritionProb*100).toFixed(0)}% vs status quo ${(result.scenarios.STATUS_QUO.attritionProbability*100).toFixed(0)}%</div>
      ` : `<div class="text-xs text-slate-500">Status quo only run.</div>`}
    </div>

    <div class="bg-slate-900/60 border border-slate-800 rounded-lg p-4">
      <h2 class="font-semibold text-white mb-3">Scenario ranking (by projected attrition probability)</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="text-slate-400 text-xs uppercase">
            <tr><th class="text-left p-2">Scenario</th><th class="p-2">Engagement (final)</th><th class="p-2">Flight risk (final)</th><th class="p-2">Attrition prob.</th><th class="p-2">Eng. p10–p90</th><th class="p-2">Chart</th></tr>
          </thead>
          <tbody>
            ${result.ranking.map(r => `
              <tr class="border-t border-slate-800 ${r.scenario === chartKey ? 'bg-slate-800/40' : ''}">
                <td class="p-2 text-white">${r.label}</td>
                <td class="p-2 text-center">${r.expectedTeamEngagement}</td>
                <td class="p-2 text-center" style="color:${riskColor(r.expectedFlightRisk)}">${(r.expectedFlightRisk*100).toFixed(0)}%</td>
                <td class="p-2 text-center font-semibold" style="color:${riskColor(r.expectedAttritionProb)}">${(r.expectedAttritionProb*100).toFixed(0)}%</td>
                <td class="p-2 text-center text-slate-400">${r.confidenceInterval.engagement_p10} – ${r.confidenceInterval.engagement_p90}</td>
                <td class="p-2 text-center"><button onclick="window.simChart('${r.scenario}')" class="text-xs text-sky-400 hover:underline">view</button></td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
      <p class="text-[11px] text-slate-500 mt-2">"Attrition probability" here = share of Monte Carlo seeds in which at least one agent ends above 0.7 flight risk — a modeling proxy, not a validated attrition forecast.</p>
    </div>

    <div class="bg-slate-900/60 border border-slate-800 rounded-lg p-4">
      <h2 class="font-semibold text-white mb-1">Weekly trajectory — Status Quo vs. ${chosenScenario ? chosenScenario.label : '—'}</h2>
      <p class="text-[11px] text-slate-500 mb-3">Illustrative single-seed path (seed 0), shown for intuition only — the ranking table above uses the full Monte Carlo mean, not this single path.</p>
      <canvas id="simCanvas" width="640" height="220"></canvas>
      <div class="flex gap-4 text-xs mt-2">
        <span class="flex items-center gap-1"><span class="w-3 h-1.5 inline-block bg-sky-400"></span> Status quo engagement</span>
        ${trajB ? `<span class="flex items-center gap-1"><span class="w-3 h-1.5 inline-block bg-emerald-400"></span> Intervention engagement</span>` : ''}
        <span class="flex items-center gap-1"><span class="w-3 h-1.5 inline-block bg-red-400"></span> Status quo flight risk ×10</span>
        ${trajB ? `<span class="flex items-center gap-1"><span class="w-3 h-1.5 inline-block bg-amber-400"></span> Intervention flight risk ×10</span>` : ''}
      </div>
    </div>

    <div class="bg-slate-900/60 border border-slate-800 rounded-lg p-4">
      <h2 class="font-semibold text-white mb-3">Per-agent final state — ${chosenScenario ? chosenScenario.label : '—'} <span class="text-[11px] text-slate-500 font-normal">(single-seed snapshot, seed 0)</span></h2>
      ${listTable(['Name', 'Mood', 'Load', 'Engagement', 'Performance', 'Flight risk'],
        (chosenScenario ? chosenScenario.sampleFinalAgents : []).map(a => [
          a.name, LEADOS.util.round1(a.mood), LEADOS.util.round1(a.load), LEADOS.util.round1(a.engagement), LEADOS.util.round1(a.performance),
          `<span style="color:${riskColor(a.flightRisk)}">${Math.round(a.flightRisk*100)}%</span>`
        ]))}
    </div>

    <div class="text-xs text-slate-500 border border-slate-800 rounded p-3">${result.label}</div>
  `;
}

function afterRenderHooks() {
  if (TAB === 'simulation' && SIM.result) {
    const canvas = document.getElementById('simCanvas');
    if (canvas) {
      const chartKey = SIM.chartScenarioKey || (SIM.result.ranking[0] && SIM.result.ranking[0].scenario);
      const intervention = SIM.lastInterventions ? SIM.lastInterventions[chartKey] : null;
      const trajA = LEADOS.simulation.weeklyTrajectory(P(), new Date(), SIM.params.weeks, null);
      const series = [
        { label: 'SQ engagement', color: '#38bdf8', data: trajA.weekly.map(w => w.engagement) },
        { label: 'SQ risk x10', color: '#f87171', data: trajA.weekly.map(w => w.flightRisk * 10) },
      ];
      if (intervention) {
        const trajB = LEADOS.simulation.weeklyTrajectory(P(), new Date(), SIM.params.weeks, intervention);
        series.push({ label: 'INT engagement', color: '#34d399', data: trajB.weekly.map(w => w.engagement) });
        series.push({ label: 'INT risk x10', color: '#fbbf24', data: trajB.weekly.map(w => w.flightRisk * 10) });
      }
      LEADOS.charts.line(canvas, { series, yMin: 0, yMax: 10, xLabels: trajA.weekly.map(w => 'w' + w.week) });
    }
  }
}

// ----------------------------------------------------------- actions ---
window.setTab = (t) => { TAB = t; render(); };
window.resetData = () => { if (confirm('Reset all synthetic data?')) { STATE = LEADOS.store.reset(); SIM.result = null; render(); } };

window.addPerson = (form) => {
  const fd = new FormData(form);
  STATE.people.push({ id: LEADOS.util.uid(), name: fd.get('name'), role: fd.get('role'), type: fd.get('type'), cadenceDays: Number(fd.get('cadenceDays')) || 14 });
  save();
};
window.removePerson = (id) => { STATE.people = STATE.people.filter(p => p.id !== id); save(); };

window.addPulse = (form) => {
  const fd = new FormData(form);
  STATE.pulses.push({ id: LEADOS.util.uid(), personId: fd.get('personId'), ts: new Date().toISOString(), mood: Number(fd.get('mood')), load: Number(fd.get('load')) });
  save();
};

window.addFeedback = (form) => {
  const fd = new FormData(form);
  STATE.feedback.push({ id: LEADOS.util.uid(), personId: fd.get('personId'), ts: new Date().toISOString(), polarity: fd.get('polarity'), note: fd.get('note') || '' });
  save();
};

window.addPlan = (form) => {
  const fd = new FormData(form);
  STATE.plans.push({ id: LEADOS.util.uid(), personId: fd.get('personId'), title: fd.get('title'), ts: new Date().toISOString(), open: true });
  save();
};
window.togglePlan = (id) => { const pl = STATE.plans.find(p => p.id === id); if (pl) pl.open = !pl.open; save(); };

window.addOneOnOne = (form) => {
  const fd = new FormData(form);
  STATE.oneonones.push({ id: LEADOS.util.uid(), personId: fd.get('personId'), ts: new Date().toISOString(), note: fd.get('note') || '' });
  save();
};

window.addConflict = (form) => {
  const fd = new FormData(form);
  STATE.events.push({ id: LEADOS.util.uid(), type: 'conflict.logged', ts: new Date().toISOString(), data: { person1Id: fd.get('person1Id'), person2Id: fd.get('person2Id'), note: fd.get('note') || '' } });
  save();
};

window.simSelectAll = () => { SIM.targets = new Set(STATE.people.map(p => p.id)); render(); };
window.simSelectNone = () => { SIM.targets = new Set(); render(); };
window.simSelectAtRisk = () => {
  const agents = LEADOS.simulation.estimateCurrent(P(), new Date());
  SIM.targets = new Set(agents.filter(a => a.flightRisk > 0.4).map(a => a.id));
  render();
};

function readSimParamsFromDOM() {
  const w = document.getElementById('simWeeks'); const s = document.getElementById('simSeeds'); const t = document.getElementById('simType');
  if (w) SIM.params.weeks = LEADOS.util.clamp(Number(w.value) || 12, 4, 26);
  if (s) SIM.params.seeds = LEADOS.util.clamp(Number(s.value) || 40, 10, 300);
  if (t) SIM.type = t.value;
  SIM.targets = new Set(Array.from(document.querySelectorAll('.simTarget:checked')).map(el => el.value));
}

window.runSim = () => {
  readSimParamsFromDOM();
  const def = INTERVENTION_DEFS.find(d => d.type === SIM.type);
  const intervention = { type: SIM.type, personIds: Array.from(SIM.targets), description: `${def.label} → ${Array.from(SIM.targets).map(personName).join(', ') || '(no targets selected)'}` };
  const result = LEADOS.simulation.run(P(), new Date(), { weeks: SIM.params.weeks, seeds: SIM.params.seeds, interventions: [intervention] });
  SIM.result = result;
  SIM.lastInterventions = { STATUS_QUO: null, ['INTERVENTION:' + intervention.type]: intervention };
  SIM.chartScenarioKey = 'INTERVENTION:' + intervention.type;
  render();
};

window.runPlaybook = () => {
  readSimParamsFromDOM();
  const agents = LEADOS.simulation.estimateCurrent(P(), new Date());
  const allIds = STATE.people.map(p => p.id);
  const overdueIds = agents.filter(a => a.cadenceRatio > 1.3).map(a => a.id);
  const noPlanIds = agents.filter(a => !a.hasGrowthPlan).map(a => a.id);
  const overloadedIds = agents.filter(a => a.load > 7).map(a => a.id);
  const topPerson = agents.slice().sort((a, b) => (b.engagement - b.flightRisk) - (a.engagement - a.flightRisk))[0];

  const interventions = [
    { type: 'IMPROVE_1ON1_CADENCE', personIds: overdueIds.length ? overdueIds : allIds, description: 'Fix 1:1 cadence for overdue people' },
    { type: 'ADD_GROWTH_PLAN', personIds: noPlanIds.length ? noPlanIds : allIds, description: 'Add growth plan for people missing one' },
    { type: 'GIVE_CORRECTIVE_FEEDBACK', personIds: allIds, description: 'Corrective feedback, team-wide' },
    { type: 'GIVE_POSITIVE_FEEDBACK', personIds: allIds, description: 'Positive feedback, team-wide' },
    { type: 'REDUCE_LOAD', personIds: overloadedIds.length ? overloadedIds : allIds, description: 'Reduce load for overloaded people' },
    { type: 'PROMOTE', personIds: topPerson ? [topPerson.id] : [], description: `Promote ${topPerson ? topPerson.name : '(no candidate)'}` },
  ];

  const result = LEADOS.simulation.run(P(), new Date(), { weeks: SIM.params.weeks, seeds: SIM.params.seeds, interventions });
  SIM.result = result;
  SIM.lastInterventions = { STATUS_QUO: null };
  interventions.forEach(iv => { SIM.lastInterventions['INTERVENTION:' + iv.type] = iv; });
  SIM.chartScenarioKey = result.ranking.find(r => r.scenario !== 'STATUS_QUO').scenario;
  render();
};

window.simChart = (key) => { SIM.chartScenarioKey = key; render(); };
