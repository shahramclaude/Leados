<script>
/* ============================================================================
   LEADOS — single-file vanilla build. "Part 5: The Organizational Genome."

   PROVENANCE, SHORT VERSION (full ledger in AI-SESSION-LOG.md):
   - github.com/wbweve/Leados was fetched directly this session via the
     GitHub REST Contents API (base64 blob, NOT the HTML-rendering path,
     which was tested first and found to silently strip <script> content —
     see AI-SESSION-LOG.md §0 for why that fetch method was abandoned).
   - VERIFIED this session: repo is real/public; root tree has ~30 .tsx
     files + README.md (10,553 B) + AI-SESSION-LOG.md (10,973 B) +
     AI-SESSION-LOG.append.md + SESSION-3.patch.md; root index.html is a
     real HTML document (Tailwind CDN, inline <style>, div#app, a <script>
     starting "const LEADOS = {}") of exactly 56,046 bytes per the Contents
     API, sha 7579e91a...
   - CONTRADICTED: that same repo's own README.md (fetched independently)
     claims index.html is ~37,575 bytes; its own AI-SESSION-LOG.md claims
     86,898 bytes with constants DECAY/CORRELATION_WINDOW_DAYS that don't
     appear in what this session fetched; the README also quotes a THIRD
     claim of a "14-line Vite/React stub." Four mutually-inconsistent
     descriptions of one file path now exist, including this session's.
     None is treated as ground truth beyond what was verified directly.
   - This sandbox had NO prior index.html/README/AI-SESSION-LOG before this
     session — there was no "Part 1-4" build here to extend. So this file
     is an ORIGINAL implementation of the pasted Part 5 "Organizational
     Genome" spec, not a copy, fork, or continuation of wbweve/Leados'
     own code (which, per the above, implements a different Part 5 —
     "long-term memory + leverage compare" — over a different, simpler
     findings/decisions schema with no people roster, plans, or
     delegations). Reusing that schema would have required silently
     dropping most of the pasted genome spec; instead this build defines
     its own event-sourced data model shaped to match what the spec
     assumes (P.directs, P.decisionById, P.openPlans,
     P.delegationsOpenByPerson, etc.), built from scratch and disclosed.
   - The pasted spec's "### Genome View (in #/self)" section was supplied
     only as a heading with no body — the view below is ORIGINAL, built to
     surface the spec'd `identify()` output, not copied from anywhere.
   ========================================================================= */

const LEADOS = {};
const LS_KEY = 'leados:events';
const uid = (p) => p + '_' + Math.random().toString(36).slice(2, 9);
const todayISO = () => new Date().toISOString();
const fmtDate = (iso) => new Date(iso).toLocaleDateString(undefined, { year:'numeric', month:'short', day:'numeric' });
const fmtDateTime = (iso) => new Date(iso).toLocaleString(undefined, { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
const clamp01 = (x) => Math.max(0, Math.min(1, x));

/* ---------------------------------------------------------------------------
   STORE: append-only event log, durable in localStorage. Nothing derived is
   ever stored — every view recomputes via LEADOS.core.project(). ORIGINAL.
--------------------------------------------------------------------------- */
LEADOS.store = {
  load() { try { return JSON.parse(localStorage.getItem(LS_KEY) || '[]'); } catch { return []; } },
  save(events) { localStorage.setItem(LS_KEY, JSON.stringify(events)); },
  add(event) { const events = this.load(); events.push(event); this.save(events); return events; },
  wipe() { localStorage.removeItem(LS_KEY); },
};

/* ---------------------------------------------------------------------------
   ENGINE: tiny date helpers the pasted spec calls directly
   (LEADOS.engine._days). ORIGINAL.
--------------------------------------------------------------------------- */
LEADOS.engine = {
  _days(a, b) { return Math.max(1, Math.round((new Date(b) - new Date(a)) / 86400000)); }
};

/* ---------------------------------------------------------------------------
   CORE: projects the raw event log into the shape the genome spec assumes:
   P.directs, P.decisionById, P.openDecisions, P.openPlans,
   P.delegationsOpenByPerson, P.openGoals, P.state.events, P.state.meta.
   ORIGINAL data model — built to match the pasted spec's assumptions,
   since no such schema was verifiable upstream (see provenance note above).
--------------------------------------------------------------------------- */
LEADOS.core = {
  project(events, today = todayISO()) {
    const sorted = events
      .filter(e => new Date(e.ts) <= new Date(today))
      .sort((a, b) => new Date(a.ts) - new Date(b.ts));

    const directs = [];
    const decisionById = {};
    const plansById = {};
    const delegationsById = {};
    const goalsById = {};

    sorted.forEach(e => {
      switch (e.type) {
        case 'direct.added':
          directs.push({ id: e.id, name: e.name, role: e.role }); break;
        case 'decision.logged':
        case 'strategy.decision':
          decisionById[e.id] = { ...e, resolved: false, premortem: false }; break;
        case 'decision.premortem':
          if (decisionById[e.decisionId]) decisionById[e.decisionId].premortem = true; break;
        case 'decision.resolved':
          if (decisionById[e.decisionId]) decisionById[e.decisionId].resolved = true; break;
        case 'plan.created':
          plansById[e.id] = { ...e, completed: false }; break;
        case 'plan.completed':
          if (plansById[e.planId]) plansById[e.planId].completed = true; break;
        case 'delegation.created':
          delegationsById[e.id] = { ...e, completed: false }; break;
        case 'delegation.completed':
          if (delegationsById[e.delegationId]) delegationsById[e.delegationId].completed = true; break;
        case 'goal.set':
          goalsById[e.id] = { ...e, completed: false }; break;
        case 'goal.completed':
          if (goalsById[e.goalId]) goalsById[e.goalId].completed = true; break;
      }
    });

    const openDecisions = Object.values(decisionById).filter(d => !d.resolved);
    const openPlans = Object.values(plansById).filter(p => !p.completed);
    const openGoals = Object.values(goalsById).filter(g => !g.completed);
    const delegationsOpenByPerson = {};
    Object.values(delegationsById).forEach(d => {
      if (!d.completed) (delegationsOpenByPerson[d.personId] = delegationsOpenByPerson[d.personId] || []).push(d);
    });

    return {
      state: { events: sorted, meta: { createdAt: sorted[0]?.ts || today } },
      directs, decisionById, openDecisions, openPlans, openGoals, delegationsOpenByPerson,
      plansById, delegationsById, goalsById,
    };
  }
};

/* ---------------------------------------------------------------------------
   KNOWLEDGE: buildPersonalPatterns — called by genome.identify() but its
   result is a dead variable in the pasted snippet (never read again there).
   Implemented here as a real per-direct engagement summary and surfaced in
   the #/self "Team Engagement" panel, since otherwise it would do nothing.
   ORIGINAL, not specified by the pasted spec.
--------------------------------------------------------------------------- */
LEADOS.knowledge = {
  buildPersonalPatterns(P, today) {
    return P.directs.map(d => {
      const mine = P.state.events.filter(e => e.personId === d.id);
      const oneonones = mine.filter(e => e.type === 'oneonone.logged').length;
      const conflicts = mine.filter(e => e.type === 'conflict.logged').length;
      const feedbacks = mine.filter(e => e.type === 'feedback.given').length;
      const last = mine.length ? mine[mine.length - 1] : null;
      return {
        personId: d.id, name: d.name, role: d.role,
        oneonones, conflicts, feedbacks,
        openPlans: P.openPlans.filter(p => p.personId === d.id).length,
        openDelegations: (P.delegationsOpenByPerson[d.id] || []).length,
        lastInteractionAt: last ? last.ts : null,
      };
    });
  }
};

/* ---------------------------------------------------------------------------
   ORG PHYSICS: measureResonance / measureOrgEntropy. The pasted spec calls
   both but supplies no formula for either. ORIGINAL formulas, disclosed:

   resonance(type) = recency-weighted frequency (half-life 30 days) of that
     event type, normalized per week of org history. Answers "how alive is
     this signal right now," not just "how often has it ever happened."

   orgEntropy = normalized Shannon entropy of the event-type distribution
     over the trailing 90 days. Low entropy = narrow/repetitive behavior;
     high entropy = wide behavioral variety.
--------------------------------------------------------------------------- */
LEADOS.orgPhysics = {
  measureResonance(type, P, today) {
    const events = P.state.events.filter(e => e.type === type);
    if (!events.length) return { type, score: 0, count: 0, label: 'dormant' };
    const now = new Date(today).getTime();
    let weighted = 0;
    events.forEach(e => {
      const ageDays = (now - new Date(e.ts).getTime()) / 86400000;
      weighted += Math.pow(0.5, ageDays / 30);
    });
    const weeks = Math.max(1, LEADOS.engine._days(P.state.meta.createdAt, today) / 7);
    const score = Math.round((weighted / weeks) * 100) / 100;
    return {
      type, score, count: events.length,
      label: score > 0.5 ? 'resonant' : score > 0.1 ? 'present' : 'faint'
    };
  },

  measureOrgEntropy(P, today) {
    const cutoff = new Date(today).getTime() - 90 * 86400000;
    const recent = P.state.events.filter(e => new Date(e.ts).getTime() >= cutoff);
    if (!recent.length) return { value: 0, bits: 0, typesActive: 0, label: 'insufficient data' };
    const counts = {};
    recent.forEach(e => counts[e.type] = (counts[e.type] || 0) + 1);
    const n = recent.length;
    const types = Object.keys(counts);
    let H = 0;
    types.forEach(t => { const p = counts[t] / n; H -= p * Math.log2(p); });
    const maxH = Math.log2(types.length || 1);
    const normalized = maxH > 0 ? H / maxH : 0;
    return {
      value: Math.round(normalized * 100) / 100,
      bits: Math.round(H * 100) / 100,
      typesActive: types.length,
      label: normalized > 0.8 ? 'high variety — many behavior types active'
           : normalized > 0.5 ? 'moderate variety'
           : 'narrow / repetitive'
    };
  }
};

/* ---------------------------------------------------------------------------
   TEMPORAL FIELD: buildTemporalProfile. ORIGINAL — spec calls it, supplies
   no formula. Labeled illustrative-only because seed timestamps here are
   synthetic/back-dated, not real usage telemetry.
--------------------------------------------------------------------------- */
LEADOS.temporalField = {
  buildTemporalProfile(P, today) {
    const byHour = new Array(24).fill(0);
    const byDow = new Array(7).fill(0);
    const ts = P.state.events.map(e => new Date(e.ts).getTime()).sort((a, b) => a - b);
    P.state.events.forEach(e => {
      const d = new Date(e.ts);
      byHour[d.getHours()]++; byDow[d.getDay()]++;
    });
    const gaps = [];
    for (let i = 1; i < ts.length; i++) gaps.push((ts[i] - ts[i - 1]) / 86400000);
    const mean = gaps.length ? gaps.reduce((a, b) => a + b, 0) / gaps.length : 0;
    const variance = gaps.length ? gaps.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / gaps.length : 0;
    return {
      byHour, byDow,
      peakHour: byHour.indexOf(Math.max(...byHour)),
      peakDow: byDow.indexOf(Math.max(...byDow)),
      meanGapDays: Math.round(mean * 10) / 10,
      gapStdevDays: Math.round(Math.sqrt(variance) * 10) / 10,
      label: 'illustrative only — seed timestamps are synthetic/back-dated, not real usage data'
    };
  }
};

/* ---------------------------------------------------------------------------
   GENOME — implemented verbatim per the pasted Part 5 spec (identify,
   _computeTrait, _generateGenomeProfile). Because this sandbox's data
   model was built from scratch to match what this code assumes, no
   adaptation of the trait logic itself was necessary or performed.
--------------------------------------------------------------------------- */
LEADOS.genome = {

  identify(P, today) {
    const patterns = LEADOS.knowledge.buildPersonalPatterns(P, today);
    const resonance = Object.fromEntries(
      ['oneonone.logged', 'conflict.logged', 'decision.logged',
       'goal.set', 'feedback.given', 'plan.created'].map(type => [
        type, LEADOS.orgPhysics.measureResonance(type, P, today)
      ])
    );
    const entropy = LEADOS.orgPhysics.measureOrgEntropy(P, today);
    const temporal = LEADOS.temporalField.buildTemporalProfile(P, today);

    const traits = {
      'decisive': this._computeTrait(
        P.openDecisions.length / Math.max(1, Object.keys(P.decisionById).length),
        0.3, 'inverse'
      ),
      'deliberate': this._computeTrait(
        (P.state.events.filter(e => e.type === 'decision.premortem').length) /
        Math.max(1, P.state.events.filter(e => e.type === 'strategy.decision').length),
        0.5
      ),
      'high_feedback': this._computeTrait(
        P.state.events.filter(e => e.type === 'feedback.given').length /
        Math.max(1, P.directs.length * 4),
        1.0
      ),
      'conflict_avoidant': this._computeTrait(
        P.state.events.filter(e => e.type === 'conflict.logged').length /
        Math.max(1, P.state.events.filter(e =>
          e.type === 'oneonone.logged' || e.type === 'meeting.logged'
        ).length),
        0.05, 'inverse'
      ),
      'developer': this._computeTrait(
        P.openPlans.length / Math.max(1, P.directs.length),
        0.5
      ),
      'delegation_heavy': this._computeTrait(
        Object.values(P.delegationsOpenByPerson).reduce((a, b) => a + b.length, 0) /
        Math.max(1, P.directs.length),
        2.0
      ),
      'metric_driven': this._computeTrait(
        P.state.events.filter(e =>
          ['fin.kpi.logged', 'product.metric.logged', 'ops.sla.logged',
           'mfg.yield.logged', 'cs.nps.logged'].includes(e.type)
        ).length / Math.max(1, P.state.events.length),
        0.1
      ),
      'crisis_experienced': this._computeTrait(
        P.state.events.filter(e => e.type === 'crisis.detected').length,
        2
      ),
      'self_aware': this._computeTrait(
        P.state.events.filter(e =>
          ['reflection.logged', 'energy.logged', 'leadership.self',
           'decision.calibration'].includes(e.type)
        ).length / Math.max(1,
          Math.floor(LEADOS.engine._days(
            P.state.meta.createdAt || P.state.events[0]?.ts || today, today
          ) / 7)
        ),
        1.0
      ),
    };

    const activeTrait = Object.entries(traits)
      .filter(([, v]) => v.expressed)
      .map(([name]) => name);

    return {
      traits, activeTrait, patterns, resonance, entropy, temporal,
      profile: this._generateGenomeProfile(activeTrait, P, today),
      label: 'Organizational genome derived from event log patterns. ' +
             'Labeled: these traits reflect logged behavior, not psychological assessment. ' +
             'n=' + P.state.events.length + ' events.'
    };
  },

  _computeTrait(ratio, threshold, direction = 'direct') {
    const expressed = direction === 'direct' ? ratio >= threshold : ratio <= threshold;
    return {
      ratio: Math.round(ratio * 100) / 100,
      threshold, expressed,
      strength: expressed ? Math.min(1, Math.abs(ratio - threshold) / threshold) : 0,
    };
  },

  _generateGenomeProfile(traits, P, today) {
    const hasAll = (required) => required.every(t => traits.includes(t));

    if (hasAll(['decisive', 'delegation_heavy', 'metric_driven'])) return {
      name: 'OPERATING EXECUTIVE',
      description: 'High-velocity decision maker who delegates deeply and tracks outputs ' +
        'meticulously. The risk: speed can outrun team capability. The strength: execution discipline.',
      watchFor: 'delegation without development',
      sourceTraits: ['decisive', 'delegation_heavy', 'metric_driven']
    };

    if (hasAll(['developer', 'high_feedback', 'self_aware'])) return {
      name: 'DEVELOPMENTAL LEADER',
      description: 'Invests disproportionately in people growth through feedback, planning, ' +
        'and reflection. The risk: may optimize for people over outcomes. The strength: ' +
        'organizational capability building.',
      watchFor: 'under-accountability for results',
      sourceTraits: ['developer', 'high_feedback', 'self_aware']
    };

    if (hasAll(['deliberate', 'self_aware', 'metric_driven']) && !traits.includes('decisive')) return {
      name: 'ANALYTICAL LEADER',
      description: 'Data-first, reflective, thorough. Premortems decisions and tracks metrics ' +
        'with discipline. The risk: analysis can delay decisions. The strength: decision ' +
        'quality and self-awareness.',
      watchFor: 'decision deferral and analysis paralysis',
      sourceTraits: ['deliberate', 'self_aware', 'metric_driven']
    };

    if (traits.includes('conflict_avoidant') && traits.includes('high_feedback')) return {
      name: 'HARMONY SEEKER',
      description: 'Invests in positive relationships and avoids named conflict. Feedback is ' +
        'given but difficult conversations may be softened. The risk: conflict suppression ' +
        'accumulates and erupts. The strength: team cohesion and psychological safety.',
      watchFor: 'feedback that avoids the real issue',
      sourceTraits: ['conflict_avoidant', 'high_feedback']
    };

    if (traits.includes('crisis_experienced') && traits.includes('decisive')) return {
      name: 'CRISIS FORGED',
      description: 'Has operated through multiple crisis events and responds with speed. ' +
        'Pattern recognition for failure modes is high. The risk: sees crises where there are ' +
        'routine problems. The strength: fast containment, calm under pressure.',
      watchFor: 'over-crisis-classification of normal problems',
      sourceTraits: ['crisis_experienced', 'decisive']
    };

    return {
      name: 'DEVELOPING PATTERN',
      description: `Your leadership pattern is still forming in the data ` +
        `(${P.state.events.length} events). The archetypes above require more event data ` +
        `across more domains to classify.`,
      watchFor: null,
      sourceTraits: traits
    };
  }
};

/* ---------------------------------------------------------------------------
   SEED DATA — fabricated/illustrative, disclosed. Produces ~120 days of
   backdated events across 5 directs so every trait/view has something to
   show on first load. Re-run any time via "wipe & reseed."
--------------------------------------------------------------------------- */
LEADOS.seed = {
  NAMES: [['Amara Chen','Eng Lead'],['Diego Ruiz','PM'],['Priya Nair','Design'],
          ['Jonas Keller','Ops'],['Faith Mwangi','Finance']],
  DOMAINS: ['people','product','finance','ops','strategy'],
  generate() {
    const rand = Math.random;
    const events = [];
    const now = Date.now();
    const at = (daysAgo, hour) => {
      const d = new Date(now - daysAgo * 86400000);
      d.setHours(hour ?? (8 + Math.floor(rand() * 9)), Math.floor(rand() * 60), 0, 0);
      return d.toISOString();
    };
    const directs = this.NAMES.map(([name, role]) => ({ id: uid('p'), name, role }));
    directs.forEach(d => events.push({ id: d.id, type: 'direct.added', ts: at(120), name: d.name, role: d.role }));

    const openDecisionIds = [];
    for (let day = 118; day >= 0; day--) {
      const r = rand();
      // 1:1s and feedback — weighted toward being frequent (developmental bias)
      if (r < 0.35) {
        const p = directs[Math.floor(rand() * directs.length)];
        events.push({ id: uid('e'), type: 'oneonone.logged', ts: at(day), personId: p.id, note: '1:1 check-in' });
      }
      if (rand() < 0.3) {
        const p = directs[Math.floor(rand() * directs.length)];
        events.push({ id: uid('e'), type: 'feedback.given', ts: at(day), personId: p.id, note: 'feedback exchange', tone: rand() < 0.7 ? 'positive' : 'developmental' });
      }
      if (rand() < 0.04) {
        const p = directs[Math.floor(rand() * directs.length)];
        events.push({ id: uid('e'), type: 'conflict.logged', ts: at(day), personId: p.id, note: 'named disagreement' });
      }
      if (rand() < 0.03) {
        const id = uid('pl');
        const p = directs[Math.floor(rand() * directs.length)];
        events.push({ id, type: 'plan.created', ts: at(day), personId: p.id, title: 'growth plan' });
      }
      if (rand() < 0.08) {
        const id = uid('dl');
        const p = directs[Math.floor(rand() * directs.length)];
        events.push({ id, type: 'delegation.created', ts: at(day), personId: p.id, task: 'delegated task' });
        if (rand() < 0.4) events.push({ id: uid('e'), type: 'delegation.completed', ts: at(Math.max(0, day - Math.floor(rand() * 10))), delegationId: id });
      }
      if (rand() < 0.15) {
        const id = uid('d');
        const isStrategy = rand() < 0.3;
        const domain = this.DOMAINS[Math.floor(rand() * this.DOMAINS.length)];
        events.push({ id, type: isStrategy ? 'strategy.decision' : 'decision.logged', ts: at(day), title: (isStrategy ? 'Strategic' : 'Operational') + ' decision', domain, note: 'decision logged' });
        if (isStrategy && rand() < 0.55) events.push({ id: uid('e'), type: 'decision.premortem', ts: at(day), decisionId: id, risks: 'identified risks' });
        openDecisionIds.push({ id, day });
      }
      if (rand() < 0.2) {
        const kinds = ['fin.kpi.logged', 'product.metric.logged', 'ops.sla.logged', 'mfg.yield.logged', 'cs.nps.logged'];
        events.push({ id: uid('e'), type: kinds[Math.floor(rand() * kinds.length)], ts: at(day), value: Math.round(rand() * 100), note: 'metric snapshot' });
      }
      if (rand() < 0.015) events.push({ id: uid('e'), type: 'crisis.detected', ts: at(day), note: 'crisis event', severity: 1 + Math.floor(rand() * 4) });
      if (rand() < 0.2) events.push({ id: uid('e'), type: 'reflection.logged', ts: at(day), note: 'reflection' });
      if (rand() < 0.15) events.push({ id: uid('e'), type: 'energy.logged', ts: at(day), level: 1 + Math.floor(rand() * 5) });
      if (rand() < 0.08) events.push({ id: uid('e'), type: 'leadership.self', ts: at(day), note: 'self-note' });
      if (rand() < 0.07) {
        const p = directs[Math.floor(rand() * directs.length)];
        events.push({ id: uid('g'), type: 'goal.set', ts: at(day), personId: p.id, title: 'quarterly goal', targetDate: at(Math.max(0, day - 60)) });
      }
    }
    // resolve roughly 70% of logged decisions, at a later (closer-to-now) day
    openDecisionIds.forEach(({ id, day }) => {
      if (rand() < 0.7) {
        const resolveDay = Math.max(0, day - Math.floor(rand() * 20));
        events.push({ id: uid('e'), type: 'decision.resolved', ts: at(resolveDay), decisionId: id });
        if (rand() < 0.4) events.push({ id: uid('e'), type: 'decision.calibration', ts: at(resolveDay), decisionId: id, prediction: 'expected outcome', actual: 'actual outcome' });
      }
    });
    return events.sort((a, b) => new Date(a.ts) - new Date(b.ts));
  }
};

function wireQuickLog(container, P) {
  const typeSel = container.querySelector('#logType');
  const fieldsEl = container.querySelector('#logFields');
  const renderFields = () => {
    const def = EVENT_DEFS[typeSel.value];
    fieldsEl.innerHTML = def.fields.map(f => fieldInput(f, P)).join('');
  };
  typeSel.innerHTML = Object.entries(EVENT_DEFS).map(([k, v]) => `<option value="${k}">${v.label}</option>`).join('');
  typeSel.addEventListener('change', renderFields);
  renderFields();
  container.querySelector('#logSubmit').addEventListener('click', () => {
    const type = typeSel.value;
    const def = EVENT_DEFS[type];
    const event = { id: uid('e'), type, ts: todayISO() };
    def.fields.forEach(f => {
      const el = container.querySelector('#f_' + f);
      let v = el.value;
      if (f === 'value' || f === 'level' || f === 'severity') v = Number(v);
      event[f] = v;
    });
    if (type === 'decision.logged' || type === 'strategy.decision') event.id = uid('d');
    if (type === 'plan.created') event.id = uid('pl');
    if (type === 'delegation.created') event.id = uid('dl');
    if (type === 'goal.set') event.id = uid('g');
    LEADOS.store.add(event);
    toast('Logged: ' + def.label);
    render();
  });
}

function render() {
  const route = location.hash || '#/today';
  renderNav(route);
  document.getElementById('todayTag').textContent = fmtDate(todayISO());
  const P = currentP();
  document.getElementById('eventCountTag').textContent = P.state.events.length;
  const view = document.getElementById('view');
  const titleMap = Object.fromEntries(ROUTES);
  document.getElementById('routeTitle').textContent = titleMap[route] || 'Today';

  let html = '';
  if (route === '#/today') html = viewToday(P);
  else if (route === '#/people') html = viewPeople(P);
  else if (route === '#/decisions') html = viewDecisions(P);
  else if (route === '#/self') html = viewSelf(P);
  else if (route === '#/log') html = viewLog(P);
  else if (route === '#/about') html = viewAbout();
  else html = viewToday(P);

  view.innerHTML = `<div class="fade-in">${html}</div>`;

  if (route === '#/today' || route === '#/decisions') wireQuickLog(view, P);
  if (route === '#/log') {
    document.getElementById('exportBtn').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(P.state.events, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = 'leados-events.json'; a.click();
    });
  }
}
