<style>
:root{
  --bg:#0b0d10; --bg2:#0f1216; --panel:#13171d; --panel2:#171c23; --line:#232a33; --line2:#2c3540;
  --tx:#e8ecf1; --tx2:#9aa6b2; --tx3:#5f6c7a;
  --acc:#f0a33c; --acc-dim:rgba(240,163,60,.14);
  --ok:#3fce8e; --ok-dim:rgba(63,206,142,.12);
  --info:#58b7f9; --info-dim:rgba(88,183,249,.12);
  --warn:#f0a33c; --warn-dim:rgba(240,163,60,.12);
  --bad:#f2616e; --bad-dim:rgba(242,97,110,.12);
  --mono:ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark}
body{background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
::selection{background:rgba(240,163,60,.25)}
a{color:var(--info);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 2px rgba(240,163,60,.15)}
textarea{min-height:72px;resize:vertical}
label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);margin:0 0 5px 1px;font-weight:600}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#252d37;border-radius:5px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

#boot{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:200;transition:opacity .25s}
#boot.gone{opacity:0;pointer-events:none}
.boot-inner{font-family:var(--mono);font-size:12px;color:var(--tx2);width:min(520px,90vw)}
.boot-inner b{color:var(--acc);font-weight:700;letter-spacing:.2em}
.boot-row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed #1c222a}
.boot-row span:last-child{color:var(--tx3)}

#shell{display:grid;grid-template-columns:228px 1fr;grid-template-rows:46px 1fr;height:100vh}
#topbar{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--bg2)}
#topbar .brand{font-family:var(--mono);font-weight:700;letter-spacing:.18em;font-size:13px}
#topbar .brand i{color:var(--acc);font-style:normal}
#topbar .crumb{color:var(--tx3);font-size:12px}
.pill{font-family:var(--mono);font-size:10.5px;padding:3px 9px;border-radius:99px;border:1px solid var(--line2);color:var(--tx2);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.pill.ok{color:var(--ok);border-color:rgba(63,206,142,.35)}
.pill.bad{color:var(--bad);border-color:rgba(242,97,110,.45);background:var(--bad-dim)}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}
#quotaWrap{margin-left:auto;display:flex;align-items:center;gap:10px}
#quotaMeter{width:130px;height:5px;background:#1c232c;border-radius:3px;overflow:hidden}
#quotaMeter>div{height:100%;background:var(--ok);border-radius:3px;transition:width .3s}
#quotaTxt{font-family:var(--mono);font-size:10.5px;color:var(--tx3)}

#nav{border-right:1px solid var(--line);background:var(--bg2);overflow-y:auto;padding:10px 8px 30px}
.nav-group{margin:14px 6px 5px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx3);font-weight:700}
.nav-item{display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:7px;color:var(--tx2);font-size:13px;cursor:pointer;border:1px solid transparent;margin-bottom:1px}
.nav-item:hover{color:var(--tx);background:var(--panel)}
.nav-item.active{color:var(--acc);background:var(--acc-dim);border-color:rgba(240,163,60,.22)}
.nav-item svg{flex:none;opacity:.85}
.nav-item .n{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--tx3);background:#1b2129;padding:1px 6px;border-radius:8px}
.nav-item .n.hot{color:var(--bad);background:var(--bad-dim)}

#app{overflow-y:auto;padding:22px 26px 80px;position:relative}
.page-head{display:flex;align-items:baseline;gap:14px;margin-bottom:4px;flex-wrap:wrap}
.page-head h1{font-size:20px;font-weight:650;letter-spacing:-.01em}
.page-head .sub{color:var(--tx3);font-size:12.5px}

.grid{display:grid;gap:14px}
.grid.c2{grid-template-columns:1fr 1fr}
.grid.c3{grid-template-columns:repeat(3,1fr)}

@media(max-width:760px){#shell{grid-template-columns:64px 1fr}.nav-item span.lbl,.nav-group{display:none}.nav-item .n{display:none}.nav-item{justify-content:center;padding:8px 0}.grid.c2,.grid.c3,.grid.c4{grid-template-columns:1fr}}

.stat{font-family:var(--mono);font-size:26px;font-weight:600;letter-spacing:-.02em}

.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.muted{color:var(--tx2)}.dim{color:var(--tx3)}.small{font-size:12px}.tiny{font-size:11px}
.mono{font-family:var(--mono)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;border:1px solid var(--line2);color:var(--tx2);white-space:nowrap}
.chip.ok{color:var(--ok);border-color:rgba(63,206,142,.35);background:var(--ok-dim)}

<script>
'use strict';
/* ============================================================
   LeadOS — Session 2. Single file, vanilla JS, zero network.
   Convention: every core function takes (s, ...) where s is a
   state object. The live app passes STATE; self-tests pass
   in-memory fixtures. No core function touches localStorage.
   Only save()/loadState() do. This is what makes #/health real.
   ============================================================ */

const LS_KEY = 'leados:data';
const SCHEMA = 2;
const ASSUMED_QUOTA = 5 * 1024 * 1024; // assumed floor, NOT a measured browser limit (not queryable from JS); stated in README
let STATE = null;
let RECOVERY = null;          // populated by loadState() when a parse/shape/version failure was quarantined
let LAST_SAVE_OK = true, LAST_SAVE_ERR = null;

/* ---------------- utils ---------------- */
const $ = sel => document.querySelector(sel);
const $$ = sel => Array.from(document.querySelectorAll(sel));
function uid(p){ return (p||'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function clamp(n,a,b){ return Math.max(a, Math.min(b, n)); }
function utcDay(iso){ if(!iso) return null; const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(iso); if(!m) return null; return Date.UTC(+m[1], +m[2]-1, +m[3]); }
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function nowISO(){ return new Date().toISOString(); }
function addDaysISO(iso, n){ const u=utcDay(iso); if(u==null) return null; const d=new Date(u + n*86400000); return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0'); }
function daysSince(iso, ref){ const a=utcDay(iso), b=utcDay(ref||todayISO()); if(a==null||b==null) return null; return Math.floor((b-a)/86400000); }
function fmtDate(iso){ if(!iso) return '—'; const d=daysSince(iso); const base=iso.slice(0,10); if(d===0) return base+' · today'; if(d===1) return base+' · yesterday'; if(d!=null&&d>1&&d<45) return base+' · '+d+'d ago'; return base; }
function daysWord(n){ if(n==null) return '—'; if(n<0) return Math.abs(n)+'d overdue'; if(n===0) return 'today'; if(n===1) return 'tomorrow'; return 'in '+n+'d'; }
function avg(arr){ const a=arr.filter(x=>typeof x==='number'&&!isNaN(x)); return a.length? a.reduce((x,y)=>x+y,0)/a.length : null; }
function round1(n){ return n==null? null : Math.round(n*10)/10; }
function pct(n,d){ return d? Math.round(100*n/d) : 0; }
function slopeSign(points){ // least-squares slope sign over equally spaced points; null if <2
  const ys=points.filter(p=>p!=null); if(ys.length<2) return null;
  const n=ys.length; let sx=0,sy=0,sxy=0,sxx=0;
  ys.forEach((y,i)=>{ sx+=i; sy+=y; sxy+=i*y; sxx+=i*i; });
  const den=n*sxx-sx*sx; if(!den) return 0; return (n*sxy-sx*sy)/den;
}
function byId(arr,id){ return (arr||[]).find(x=>x.id===id) || null; }
function personName(s,id){ const p=byId(s.people,id); return p? p.name : '(unknown person)'; }
function seatName(s,id){ const x=byId(s.seats,id); return x? x.title : '(unknown seat)'; }
function deepClone(o){ return JSON.parse(JSON.stringify(o)); }
function bytesOf(str){ try{ return new Blob([str]).size; }catch(e){ return str.length; } }
function fmtBytes(n){ if(n<1024) return n+' B'; if(n<1048576) return (n/1024).toFixed(1)+' KB'; return (n/1048576).toFixed(2)+' MB'; }
function isISODate(v){ return typeof v==='string' && /^\d{4}-\d{2}-\d{2}$/.test(v) && utcDay(v)!=null; }
function arr(v){ return Array.isArray(v)? v : []; }

/* confidence: the trust contract. Never claim more than the data supports. */
function trendOf(points){ // points = chronologically ordered measured numeric values
  const ys=(points||[]).filter(p=>typeof p==='number'&&!isNaN(p));
  if(ys.length<3) return { trend:null, conf:'none', why:'fewer than 3 measured data points ('+ys.length+') — no trend claimed' };
  const m=slopeSign(ys);
  const trend = m==null? null : (m > 0.08? 'rising' : m < -0.08? 'falling' : 'flat');
  const conf = ys.length<=3? 'low' : ys.length<=6? 'medium' : 'high';
  return { trend, slope:round1(m), conf, why: ys.length+' measured points, least-squares slope '+round1(m)+' → '+conf+' confidence (rule: ≤3 low, 4–6 medium, ≥7 high)' };
}

/* ---------------- icons (original stroke glyphs, no CDN) ---------------- */

/* ---------------- default state & validation ---------------- */
function defaultState(){
  return {
    meta:{ schemaVersion:SCHEMA, seeded:false, createdAt:nowISO(), migrationLog:[], auditLog:[], writeFailures:0, startDate:todayISO() },
    people:[], oneOnOnes:[], pulses:[], goals:[], cases:[], decisions:[], feedback:[],
    delegations:[], escalations:[], risks:[], rituals:[], talent:[], seats:[],
    meetings:[], meetingWeeks:[],
    arrival:{ bossExpectations:[], listeningTour:[], earlyWins:[] },
    skiplevels:[], calibrations:[],
    events:[]
  };
}
const COLLECTIONS = ['people','oneOnOnes','pulses','goals','cases','decisions','feedback','delegations','escalations','risks','rituals','talent','seats','meetings','meetingWeeks','skiplevels','calibrations','events'];
/* Structural validation: the documented v1/v2 contract. Anything else is refused, never guessed. */
function validateStateShape(v){
  if(!v || typeof v!=='object' || Array.isArray(v)) return { ok:false, reason:'root is not an object' };
  if(!v.meta || typeof v.meta!=='object') return { ok:false, reason:'missing meta object' };
  if(typeof v.meta.schemaVersion!=='number') return { ok:false, reason:'meta.schemaVersion missing or not a number' };
  const need = ['people','oneOnOnes','goals','cases','decisions','feedback','delegations','escalations','risks','rituals','talent','events'];
  for(const c of need) if(!Array.isArray(v[c])) return { ok:false, reason:'collection "'+c+'" missing or not an array' };
  for(const p of v.people) if(!p || typeof p.id!=='string' || typeof p.name!=='string') return { ok:false, reason:'a person lacks string id/name' };
  for(const o of v.oneOnOnes) if(!o || typeof o.id!=='string' || typeof o.personId!=='string') return { ok:false, reason:'a 1:1 lacks string id/personId' };
  for(const c of v.cases) if(!c || typeof c.id!=='string' || typeof c.type!=='string') return { ok:false, reason:'a case lacks string id/type' };
  return { ok:true };
}

/* ---------------- storage: quarantine-first, never overwrite blind ---------------- */
function readRaw(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function trySetItem(k, v){ // THE single write path production code uses; self-test T3 exercises this exact function
  try{ localStorage.setItem(k, v); LAST_SAVE_OK=true; LAST_SAVE_ERR=null; return { ok:true }; }
  catch(e){ LAST_SAVE_OK=false; LAST_SAVE_ERR=(e && (e.name||e.message)) || 'unknown write error'; return { ok:false, err:LAST_SAVE_ERR }; }
}
function quarantine(label, raw){
  const key = LS_KEY + '.' + label + '.' + Date.now();
  const r = trySetItem(key, raw); // if this ALSO fails (quota), we still never overwrite the live key
  return r.ok? key : null;
}
function listRelatedKeys(){
  const out=[]; try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k && (k===LS_KEY||k.indexOf(LS_KEY+'.')===0||k.indexOf('leados')===0)) out.push({key:k, bytes:bytesOf(localStorage.getItem(k)||'')}); } }catch(e){}
  out.sort((a,b)=>a.key.localeCompare(b.key)); return out;
}

/* ---------------- migrations ----------------
   0→1: normalize the documented Session-1-era collections (adds fields the docs name).
   1→2: add v2 collections (seats, calibrations, skiplevels, meetingWeeks, arrival),
        goal dependency edges, pulse provenance flags. Pure field ADDs — no rewriting history. */
const MIGRATIONS = {
  0: s => { // defensive: a pre-versioned blob that still has meta
    const d=defaultState();
    for(const c of COLLECTIONS) if(s[c]===undefined) s[c]=deepClone(d[c]);
    if(!s.arrival) s.arrival=deepClone(defaultState().arrival);
    s.meta.schemaVersion=1;
    s.meta.migrationLog=arr(s.meta.migrationLog); s.meta.migrationLog.push({at:nowISO(), step:'0→1', note:'normalized pre-versioned blob to documented v1 collections'});
    return s;
  },
  1: s => {
    const d=defaultState();
    if(!Array.isArray(s.seats)) s.seats=[]; if(!Array.isArray(s.calibrations)) s.calibrations=[];
    if(!Array.isArray(s.skiplevels)) s.skiplevels=[]; if(!Array.isArray(s.meetingWeeks)) s.meetingWeeks=[];
    if(!s.arrival||typeof s.arrival!=='object') s.arrival=deepClone(d.arrival);
    for(const k of ['bossExpectations','listeningTour','earlyWins']) if(!Array.isArray(s.arrival[k])) s.arrival[k]=[];
    for(const g of s.goals) if(!Array.isArray(g.blockedByGoalIds)) g.blockedByGoalIds=[];
    for(const e of s.events) if(!e.at) e.at=nowISO();
    s.meta.migrationLog=arr(s.meta.migrationLog);
    s.meta.migrationLog.push({at:nowISO(), step:'1→2', note:'added seats/calibrations/skip-levels/arrival/dependency edges (Session 2). No v1 record was rewritten; fields only added.'});
    s.meta.schemaVersion=2;
    return s;
  }
};
function migrateToCurrent(s){
  let v = s.meta.schemaVersion;
  while(v < SCHEMA){
    if(!MIGRATIONS[v]) throw new Error('no migration path from schema v'+v);
    s = MIGRATIONS[v](s); v = s.meta.schemaVersion;
  }
  return s;
}

function loadState(){
  const raw = readRaw(LS_KEY);
  if(raw==null) return { state: defaultState(), recovery:null, migrated:false };
  let parsed;
  try{ parsed = JSON.parse(raw); }
  catch(e){
    const qk=quarantine('corrupt', raw);
    return { state: defaultState(), recovery:{ label:'corrupt', key:qk, detail:'JSON.parse threw: '+(e&&e.message) }, migrated:false };
  }
  const shape = validateStateShape(parsed);
  if(!shape.ok){
    const qk=quarantine('malformed', raw);
    return { state: defaultState(), recovery:{ label:'malformed', key:qk, detail:'shape validation refused: '+shape.reason }, migrated:false };
  }
  const v = parsed.meta.schemaVersion;
  if(v > SCHEMA){
    const qk=quarantine('superseded', raw);
    return { state: defaultState(), recovery:{ label:'superseded', key:qk, detail:'file is schema v'+v+', this build understands up to v'+SCHEMA+'. Not downgraded, not guessed at.' }, migrated:false };
  }
  if(v < SCHEMA){
    try{
      const out = migrateToCurrent(parsed);
      return { state: out, recovery:null, migrated:true };
    }catch(e){
      const qk=quarantine('migration-failed', raw);
      return { state: defaultState(), recovery:{ label:'migration-failed', key:qk, detail:String(e&&e.message||e) }, migrated:false };
    }
  }
  return { state: parsed, recovery:null, migrated:false };
}

function save(){
  STATE.meta = STATE.meta || {};
  const body = JSON.stringify(STATE);
  const r = trySetItem(LS_KEY, body);
  if(!r.ok){ STATE.meta.writeFailures=(STATE.meta.writeFailures||0)+1; toast('Write failed: '+r.err+'. State preserved in memory; export a backup from #/data before closing.', 'bad', 9000); }
  renderTopbar();
  return r.ok;
}

/* ---------------- integrity audit: repair, never drop; log every repair ---------------- */
function integrityAudit(s){
  const log=[]; const at=nowISO();
  const pids=new Set(s.people.map(p=>p.id));
  const nullIf=(owner,field,label)=>{ if(owner[field]!=null && !pids.has(owner[field])){ log.push({at, what:label+' '+owner.id+': dangling '+field+' "'+owner[field]+'" set to null (record kept, reference cleared)'}); owner[field]=null; } };
  s.oneOnOnes.forEach(o=>nullIf(o,'personId','oneOnOne'));
  s.pulses.forEach(o=>nullIf(o,'personId','pulse'));
  s.feedback.forEach(o=>nullIf(o,'personId','feedback'));
  arr(s.talent).forEach(o=>nullIf(o,'personId','talent'));
  s.delegations.forEach(o=>nullIf(o,'delegateId','delegation'));
  s.goals.forEach(o=>nullIf(o,'ownerId','goal'));
  arr(s.skiplevels).forEach(o=>nullIf(o,'leadId','skiplevel'));
  arr(s.calibrations).forEach(o=>nullIf(o,'personId','calibration'));
  const gids=new Set(s.goals.map(g=>g.id));
  s.goals.forEach(g=>{ g.blockedByGoalIds=arr(g.blockedByGoalIds).filter(id=>{ if(!gids.has(id)||id===g.id){ log.push({at, what:'goal '+g.id+': dangling/self dependency "'+id+'" pruned from blockedByGoalIds'}); return false; } return true; }); });
  const cids=new Set(s.cases.map(c=>c.id));
  s.escalations.forEach(e=>{ if(e.caseId!=null && !cids.has(e.caseId)){ log.push({at, what:'escalation '+e.id+': dangling caseId cleared'}); e.caseId=null; } });
  s.decisions.forEach(d=>{ if(d.caseId!=null && !cids.has(d.caseId)){ log.push({at, what:'decision '+d.id+': dangling caseId cleared'}); d.caseId=null; } });
  const seatIds=new Set(arr(s.seats).map(x=>x.id));
  s.seats.forEach(x=>{ nullIf(x,'holderId','seat'); x.successorIds=arr(x.successorIds).filter(id=>{ if(!pids.has(id)){ log.push({at, what:'seat '+x.id+': unknown successor "'+id+'" pruned'}); return false;} return true; }); });
  s.cases.forEach(c=>{ c.linkedIds=c.linkedIds||{}; c.personIds=arr(c.personIds).filter(id=>{ if(!pids.has(id)){ log.push({at, what:'case '+c.id+': unknown personId pruned from case parties'}); return false;} return true; }); });
  s.meta.auditLog=arr(s.meta.auditLog).concat(log).slice(-400);
  return log;
}

/* ---------------- shared event/data layer ("case spine" writes here, every module emits) ---------------- */
function emit(s, kind, refType, refId, msg, extra){
  s.events.unshift(Object.assign({ id:uid('ev'), at:nowISO(), kind, refType, refId, msg }, extra||{}));
  if(s.events.length>400) s.events.length=400;
}

  emit(s,'seed','meta','seed','Demo data seeded (all seed rows tagged; removable from #/data)');
  return true;
}

/* ---------------- CASE SPINE: one registration fans out in ONE state transaction ---------------- */
const SLA = { 5:1, 4:3, 3:7, 2:14, 1:30 }; // severity → days
const CASE_TYPES = ['conflict','decision','goal','feedback','incident','oneonone','general'];

function registerCase(s, p){
  const c={ id:uid('case'), type:p.type||'general', title:p.title||'(untitled case)',
    personIds:arr(p.personIds), severity:clamp(+p.severity||3,1,5), status:'open',
    createdAt:p.createdAt||todayISO(), closedAt:null, linkedIds:{ escalationIds:[], decisionIds:[], feedbackIds:[], goalIds:[], riskIds:[], oneOnOneIds:[] },
    log:[{ at:nowISO(), msg:'Case registered ('+(p.type||'general')+', severity '+clamp(+p.severity||3,1,5)+')' }] };
  s.cases.unshift(c);
  const names=c.personIds.map(id=>personName(s,id));
  // fan-out by type — deterministic, inspectable, all in this transaction
  if(c.type==='conflict' || c.type==='incident'){
    const e={ id:uid('esc'), caseId:c.id, title:'Escalation: '+c.title, severity:c.severity, openedAt:c.createdAt, status:'open', resolvedAt:null, slaDays:SLA[c.severity] };
    s.escalations.unshift(e); c.linkedIds.escalationIds.push(e.id);
    c.log.push({ at:nowISO(), msg:'Escalation opened with SLA '+SLA[c.severity]+'d (severity '+c.severity+')' });
  }
  if(c.type==='incident' && c.severity>=4){
    const r={ id:uid('r'), title:'Incident follow-up risk: '+c.title, likelihood:3, impact:c.severity, owner:names[0]||'You', reviewAt:addDaysISO(todayISO(),7), status:'open', notes:'Auto-raised by case spine (incident S'+c.severity+'). Review and adjust.', caseId:c.id };
    s.risks.unshift(r); c.linkedIds.riskIds.push(r.id);
    c.log.push({ at:nowISO(), msg:'Risk register entry auto-raised (incident severity ≥4)' });
  }
  if(c.type==='goal' && p.goalId && byId(s.goals,p.goalId)){ c.linkedIds.goalIds.push(p.goalId); }
  names.forEach(n=>emit(s,'case','case',c.id,'Case “'+c.title+'” involves '+n, { caseId:c.id }));
  emit(s,'case','case',c.id,'Case registered: '+c.type+' · S'+c.severity+' · '+c.title, { caseId:c.id });
  return c; // caller persists via save(); tests pass a fixture state
}

function caseBlockers(s, id){
  const c=byId(s.cases,id); if(!c) return { error:'case not found' };
  const openEsc=s.escalations.filter(e=>e.caseId===id && e.status==='open');
  const undelivered=s.feedback.filter(f=>f.caseId===id && f.status!=='delivered');
  const blockers=[];
  openEsc.forEach(e=>blockers.push('open escalation “'+e.title+'” (SLA '+e.slaDays+'d, opened '+e.openedAt+')'));
  undelivered.forEach(f=>blockers.push('feedback to '+personName(s,f.personId)+' is still drafted, not delivered'));
  return { c, blockers };
}
function closeCase(s, id, opt){
  const b=caseBlockers(s,id); if(!b.c) return { ok:false, error:'case not found' };
  if(b.c.status==='closed') return { ok:false, error:'already closed' };
  if(b.blockers.length && !(opt&&opt.override)) return { ok:false, blockers:b.blockers };
  if(opt&&opt.dryrun) return { ok:true, wouldOverride:!!b.blockers.length }; // preview path: no mutation
  b.c.status='closed'; b.c.closedAt=todayISO();
  b.c.log.push({ at:nowISO(), msg: b.blockers.length? 'Closed with OVERRIDE. Open links at close: '+b.blockers.join(' | ') : 'Closed cleanly — no open links.' });
  emit(s,'case','case',b.c.id,'Case closed'+(b.blockers.length?' (override)':'')+': '+b.c.title, { caseId:b.c.id });
  return { ok:true, overridden:!!b.blockers.length };
}

/* ---------------- decisions: severity ≥4 forces a premortem ---------------- */
function createDecision(s, p){
  if(p.caseId){
    const c=byId(s.cases,p.caseId);
    if(c && c.severity>=4 && (!p.premortem || !String(p.premortem).trim()))
      return { ok:false, need:'premortem', error:'Severity '+c.severity+' case: a premortem (“it failed — why?”) is required before a decision can be recorded. Refusing to let you skip it is the point.' };
  }
  const d={ id:uid('dec'), caseId:p.caseId||null, title:p.title, context:p.context||'', options:arr(p.options), chosen:p.chosen, rationale:p.rationale||'', premortem:p.premortem||null, decidedAt:todayISO(), reviewAt:p.reviewAt||addDaysISO(todayISO(),30), outcome:null };
  s.decisions.unshift(d);
  if(d.caseId){ const c=byId(s.cases,d.caseId); if(c){ c.linkedIds.decisionIds.push(d.id); c.log.push({at:nowISO(),msg:'Decision recorded: '+d.title+' → '+d.chosen}); } }
  emit(s,'decision','decision',d.id,'Decided: '+d.title+' → '+d.chosen, { decisionId:d.id, caseId:d.caseId });
  return { ok:true, decision:d };
}

/* ---------------- goal dependencies: cycle refusal with named path ---------------- */
function depPath(s, fromId, targetId){ // DFS following blockedByGoalIds; returns array of ids or null
  const seen=new Set();
  function dfs(cur, trail){
    if(cur===targetId) return trail.concat(cur);
    if(seen.has(cur)) return null; seen.add(cur);
    const g=byId(s.goals,cur); if(!g) return null;
    for(const nx of arr(g.blockedByGoalIds)){ const r=dfs(nx, trail.concat(cur)); if(r) return r; }
    return null;
  }
  return dfs(fromId,[]);
}
function addGoalDep(s, goalId, blockerId){
  const g=byId(s.goals,goalId), b=byId(s.goals,blockerId);
  if(!g||!b) return { ok:false, error:'unknown goal' };
  if(goalId===blockerId) return { ok:false, error:'a goal cannot block itself' };
  const path=depPath(s, goalId, blockerId); // does goalId (transitively) block blockerId already?
  if(path) return { ok:false, cycle:true, path:path.map(id=>byId(s.goals,id)?byId(s.goals,id).title:id), error:'dependency cycle refused: '+path.map(id=>byId(s.goals,id)?byId(s.goals,id).title:id).join(' → ')+' → '+b.title };
  if(!arr(g.blockedByGoalIds).includes(blockerId)){ g.blockedByGoalIds.push(blockerId); emit(s,'goal','goal',goalId,'Dependency added: “'+b.title+'” blocks “'+g.title+'”',{goalId}); }
  return { ok:true };
}
function goalLate(s,g){ const t=todayISO(); return g && g.status!=='done' && g.due && utcDay(g.due)<utcDay(t); }
function goalBlockedByLate(s,g){ return arr(g?g.blockedByGoalIds:[]).map(id=>byId(s.goals,id)).filter(x=>x&&goalLate(s,x)); }

/* ---------------- calibration: no lock without named evidence ---------------- */
function calibrationBlockers(s, cal){
  const lacks=[];
  if(!cal.proposal || !String(cal.proposal).trim()) lacks.push('a written level/promotion proposal');
  const ev=(cal.evidence&&cal.evidence.goalIds||[]).length + (cal.evidence&&cal.evidence.feedbackIds||[]).length + (cal.evidence&&cal.evidence.winIds||[]).length;
  if(ev<1) lacks.push('at least one linked evidence artifact (goal, delivered feedback, or verified win) — a narrative with zero artifacts behind it does not go into a calibration room');
  const t=s.talent.find(x=>x.personId===cal.personId);
  if(!t) lacks.push('a nine-box placement on the talent grid');
  return lacks;
}

/* ---------------- module computations (live, never cached) ---------------- */
function lastDoneOneOnOne(s, personId){ return s.oneOnOnes.filter(o=>o.personId===personId && o.status==='done').sort((a,b)=>b.date.localeCompare(a.date))[0]||null; }
function nextPlannedOneOnOne(s, personId){ const t=todayISO(); return s.oneOnOnes.filter(o=>o.personId===personId && o.status==='planned').sort((a,b)=>a.date.localeCompare(b.date))[0]||null; }
function oneOnOneOverdueDays(s, personId){
  const done=lastDoneOneOnOne(s,personId);
  if(!done) return { never:true };
  const cad=done.cadenceDays||14; const since=daysSince(done.date); const over=since-cad;
  return { never:false, since, cadence:cad, overdue:over>0? over:0, dueIn: over>0? -over: -over };
}
function measuredPulses(s, personId){ return s.pulses.filter(p=>p.personId===personId && !p.estimated && typeof p.mood==='number').sort((a,b)=>a.at.localeCompare(b.at)); }
function escDays(e){ const opened=e.openedAt; const elapsed=daysSince(opened)||0; const remaining=e.slaDays-elapsed; return { elapsed, remaining, breached:e.status==='open'&&remaining<0, dueSoon:e.status==='open'&&remaining>=0&&remaining<=2 }; }
function ritualStatus(s,r){ if(!r.lastDoneAt) return { never:true }; const since=daysSince(r.lastDoneAt); const over=since-(r.cadenceDays||7); return { never:false, since, overdue:over>0?over:0 }; }
function arrivalDay(s){ return (daysSince(s.meta.startDate)||0)+1; }
function listeningCoverage(s){ const leads=s.people.filter(p=>p.isLead); const all=s.people; const done=new Set(arr(s.arrival.listeningTour).map(x=>x.personId)); const cov=all.length? all.filter(p=>done.has(p.id)).length/all.length : 0; return { total:all.length, done:done.size, frac:cov }; }
function seatCoverage(s){ return arr(s.seats).map(x=>({ seat:x, holder:x.holderId?personName(s,x.holderId):null, successors:arr(x.successorIds).length, exposed:!x.holderId||arr(x.successorIds).length===0 })); }

/* narrative radar: stated signals (text sources) vs instruments (computed facts) */
const THEME_LEX = { workload:['load','workload','overtime','busy','stretched','capacity'], priority:['priority','priorities','unclear','direction','focus','confusing'], growth:['growth','growth path','career','promotion','scope','learning'], conflict:['conflict','friction','tension','dispute','blame'], process:['process','meetings','bureaucracy','overhead','approval','slow'] };
function countThemes(s){
  const hits={}; const add=(txt)=>{ const low=String(txt||'').toLowerCase(); for(const th in THEME_LEX) if(THEME_LEX[th].some(w=>low.indexOf(w)>=0)) hits[th]=(hits[th]||0)+1; };
  s.pulses.forEach(p=>{ if(p.note) add(p.note); });
  arr(s.arrival.listeningTour).forEach(x=>add(x.notes||''));
  arr(s.skiplevels).forEach(x=>arr(x.themes).concat([x.signals||'']).forEach(add));
  s.cases.forEach(c=>{ if(c.type==='conflict') hits.conflict=(hits.conflict||0)+1; });
  return hits;
}
function radarRows(s){
  const themes=countThemes(s); const rows=[];
  const lastWeek=s.meetingWeeks.slice().sort((a,b)=>b.weekOf.localeCompare(a.weekOf))[0];
  const slippedGoals=s.goals.filter(g=>goalLate(s,g)).length;
  const breachedEsc=s.escalations.filter(e=>escDays(e).breached).length;
  if((themes.workload||0)>=2 && lastWeek && lastWeek.meetingHours>0 && lastWeek.focusHours/ Math.max(1,lastWeek.meetingHours+lastWeek.focusHours) < 0.2)
    rows.push({ theme:'workload', stated:themes.workload+' stated mentions (pulse notes / skip-levels / listening tour)', instrument:'focus time '+Math.round(100*lastWeek.focusHours/Math.max(1,lastWeek.meetingHours+lastWeek.focusHours))+'% of logged week '+lastWeek.weekOf+' (below 20% threshold)', conf:'medium', why:'instrument is one logged week — not a trend; stated side has '+themes.workload+' mentions' });
  if((themes.priority||0)>=2 && slippedGoals>=1)
    rows.push({ theme:'priority', stated:themes.priority+' stated mentions of unclear priorities', instrument:slippedGoals+' goal(s) past due with status ≠ done', conf: slippedGoals>=3?'medium':'low', why:'goals slipping is a lagging instrument; sample is small at '+slippedGoals });
  if((themes.conflict||0)>=2 && breachedEsc>=1)
    rows.push({ theme:'conflict', stated:themes.conflict+' conflict signals (incl. open conflict cases)', instrument:breachedEsc+' escalation(s) past SLA', conf:'medium', why:'both sides measured today, not cached' });
  return rows;
}

/* ---------------- findings engine ("what to do next, when, why") ---------------- */
/* Each rule: scan returns findings; basis prints the exact data read; conf never exceeds data support. */
const RULES = [
  { id:'R1', name:'overdue 1:1', scan:(s)=>s.people.map(p=>{ const o=oneOnOneOverdueDays(s,p.id);
      if(o.never) return { rule:'R1', who:p.id, what:'No 1:1 has ever been logged with '+p.name, sev:2, conf:{label:'high',why:'list of completed 1:1s is empty for this person — deterministic'}, basis:'read '+s.oneOnOnes.filter(x=>x.personId===p.id&&x.status==='done').length+' completed 1:1(s) for '+p.name, when:'now', link:'#/oneonones' };
      if(o.overdue>0) return { rule:'R1', who:p.id, what:'1:1 with '+p.name+' is '+o.overdue+'d overdue ('+o.cadence+'d cadence)', sev:o.overdue>7?3:2, conf:{label:'high',why:'pure date arithmetic from last logged 1:1 + cadence'}, basis:'last done '+done0(s,p.id)+' · cadence '+o.cadence+'d · today − last = '+o.since+'d', when:o.overdue+'d overdue', link:'#/oneonones' };
      return null; }).filter(Boolean) },
  { id:'R2', name:'escalation SLA', scan:(s)=>s.escalations.filter(e=>e.status==='open').map(e=>{ const d=escDays(e);
      if(d.breached) return { rule:'R2', what:'Escalation “'+e.title+'” is '+Math.abs(d.remaining)+'d past SLA', sev:4, conf:{label:'high',why:'SLA ladder is fixed (S'+e.severity+'='+e.slaDays+'d), computed from today’s date — never cached'}, basis:'opened '+e.openedAt+' · SLA '+e.slaDays+'d · elapsed '+d.elapsed+'d', when:Math.abs(d.remaining)+'d over', link:'#/escalations' };
      if(d.dueSoon) return { rule:'R2', what:'Escalation “'+e.title+'” hits SLA in '+d.remaining+'d', sev:3, conf:{label:'high',why:'same fixed ladder, computed today'}, basis:'opened '+e.openedAt+' · SLA '+e.slaDays+'d · remaining '+d.remaining+'d', when:d.remaining+'d left', link:'#/escalations' };
      return null; }).filter(Boolean) },
  { id:'R3', name:'delegation decay', scan:(s)=>s.delegations.filter(d=>d.status==='active').map(d=>{ const since=daysSince(d.lastCheckinAt); const over=since-d.checkinEveryDays;
      return over>0? { rule:'R3', what:'Check in on “'+d.task+'” ('+personName(s,d.delegateId)+') — '+over+'d past your own '+d.checkinEveryDays+'d rhythm', sev:2, conf:{label:'high',why:'last check-in date and cadence are both facts you entered'}, basis:'last check-in '+d.lastCheckinAt+' · every '+d.checkinEveryDays+'d · level '+d.level+'/5 empowerment', when:over+'d over', link:'#/delegation' } : null; }).filter(Boolean) },
  { id:'R4', name:'goal risk', scan:(s)=>{ const out=[];
      s.goals.filter(g=>g.status!=='done').forEach(g=>{
        if(!g.ownerId) out.push({ rule:'R4', what:'Goal “'+g.title+'” has NO owner — unowned goals silently die', sev:3, conf:{label:'high',why:'ownerId is null in the record — structural defect, not inference'}, basis:'ownership field is empty · team '+g.team+' · due '+g.due, when:'defect', link:'#/goals' });
        if(goalLate(s,g)) out.push({ rule:'R4', what:'Goal “'+g.title+'” is past due ('+g.due+'), progress '+g.progress+'%', sev:3, conf:{label:'high',why:'due date vs today, status ≠ done'}, basis:'due '+g.due+' · progress '+g.progress+'% · owner '+personName(s,g.ownerId), when:Math.abs(daysSince(g.due))+'d over', link:'#/goals' });
        goalBlockedByLate(s,g).forEach(b=>out.push({ rule:'R4', what:'“'+g.title+'” is blocked by “'+b.title+'”, which is past due', sev:3, conf:{label:'high',why:'explicit dependency edge you declared + blocker is late (date math)'}, basis:g.title+' ←blocked-by← '+b.title+' (due '+b.due+')', when:'blocked', link:'#/goals' }));
      }); return out; } },
  { id:'R5', name:'ritual lapse', scan:(s)=>s.rituals.map(r=>{ const st=ritualStatus(s,r);
      if(st.never) return { rule:'R5', what:'Ritual “'+r.name+'” has never been logged', sev:2, conf:{label:'high',why:'no lastDoneAt recorded'}, basis:'created but never marked done', when:'now', link:'#/rituals' };
      if(st.overdue>0) return { rule:'R5', what:'Ritual “'+r.name+'” lapsed '+st.overdue+'d ago ('+r.cadenceDays+'d cadence)', sev:2, conf:{label:'high',why:'date arithmetic on lastDoneAt'}, basis:'last done '+r.lastDoneAt+' · cadence '+r.cadenceDays+'d', when:st.overdue+'d over', link:'#/rituals' };
      return null; }).filter(Boolean) },
  { id:'R6', name:'pulse decline', scan:(s)=>s.people.map(p=>{ const mp=measuredPulses(s,p.id); const vals=mp.slice(-7).map(x=>x.mood); const t=trendOf(vals);
      if(t.trend==='falling'){ const est=s.pulses.filter(x=>x.personId===p.id&&x.estimated).length;
        return { rule:'R6', what:p.name+'’s measured pulse is declining — address at your next touchpoint', sev:3, conf:{label:t.conf, why:t.why}, basis:vals.length+' measured pulses, last '+fmtDate(mp[mp.length-1].at)+' · '+est+' estimated pulse(s) excluded by design', when:'this week', link:'#/person/'+p.id }; }
      return null; }).filter(Boolean) },
  { id:'R7', name:'arrival clock', scan:(s)=>{ const day=arrivalDay(s); const out=[];
      const unagreed=arr(s.arrival.bossExpectations).filter(e=>!e.agreedAt);
      if(day>=14 && unagreed.length) out.push({ rule:'R7', what:unagreed.length+' boss expectation(s) still not explicitly agreed ('+unagreed.map(e=>'“'+e.text+'”').join(', ')+')', sev:2, conf:{label:'high',why:'day '+day+' of arrival ≥ 14 and agreedAt is null — two facts, not judgment'}, basis:'arrival day '+day+' · expectations without agreedAt: '+unagreed.length, when:'day '+day, link:'#/arrival' });

      else if(day<60 && cov.frac<0.6) { const need=Math.ceil(0.6*cov.total)-cov.done; out.push({ rule:'R7', what:'Listening tour: '+pct(cov.done,cov.total)+'% covered, '+Math.max(0,need)+' more conversation(s) needed by day 60', sev:1, conf:{label:'medium',why:'target is a heuristic (60% by day 60), stated as one'}, basis:cov.done+' of '+cov.total+' covered · day '+day+' of 90', when:daysWord(60-day), link:'#/arrival' }); }
      const unv=arr(s.arrival.earlyWins).filter(w=>!w.verifiedBy);
      unv.forEach(w=>out.push({ rule:'R7', what:'Early win “'+w.title+'” is UNVERIFIED — it does not count until someone else confirms it', sev:1, conf:{label:'high',why:'verifiedBy field is empty; rule is absolute: a win nobody else saw is a claim, not a win'}, basis:'claimed '+w.claimedAt+' · verifiedBy: none', when:'before review', link:'#/arrival' }));
      return out; } },
  { id:'R8', name:'skip-level gap', scan:(s)=>s.people.filter(p=>p.isLead).map(l=>{ const last=s.skiplevels.filter(x=>x.leadId===l.id).sort((a,b)=>b.at.localeCompare(a.at))[0];
      const since=last? daysSince(last.at) : null;
      if(since===null || since>45) return { rule:'R8', what:'No skip-level with '+l.name+'’s team '+(since===null?'ever':'in '+since+'d')+' — you are flying on their narration alone', sev:2, conf:{label:'medium',why:'45d is a stated cadence heuristic, not a law; the gap itself is exact'}, basis:'last skip-level with '+l.name+'’s team: '+(last? last.at : 'never'), when: since>60?'long over':'due', link:'#/skip' };
      return null; }).filter(Boolean) },
  { id:'R9', name:'meeting load', scan:(s)=>{ const w=s.meetingWeeks.slice().sort((a,b)=>b.weekOf.localeCompare(a.weekOf))[0]; if(!w) return [];
      const total=w.meetingHours+w.focusHours; const fr=total? w.focusHours/total:1; if(fr<0.2) return [{ rule:'R9', what:'Focus time was '+Math.round(fr*100)+'% of logged week '+w.weekOf+' — under the 20% floor', sev:2, conf:{label:'medium',why:'ONE logged week is a data point, not a trend — stated plainly'}, basis:'meetings '+w.meetingHours+'h · focus '+w.focusHours+'h · weekOf '+w.weekOf, when:'this week', link:'#/meetings' }]; return []; } },
  { id:'R10', name:'seat exposure', scan:(s)=>seatCoverage(s).filter(x=>x.exposed).map(x=>({ rule:'R10', what:x.holder? 'Seat “'+x.seat.title+'” ('+x.holder+') has NO named successor' : 'Seat “'+x.seat.title+'” has no holder AND no successor', sev:3, conf:{label:'high',why:'successorIds list is empty — structural, not inferred'}, basis:'seats checked: '+s.seats.length+' · this seat successors: '+x.successors, when:'before it happens', link:'#/talent' })) },
  { id:'R11', name:'drafted feedback', scan:(s)=>s.feedback.filter(f=>f.status==='drafted').map(f=>{
      const nx=nextPlannedOneOnOne(s,f.personId); return { rule:'R11', what:'Undelivered feedback for '+personName(s,f.personId)+(nx? ' — queued onto 1:1 on '+nx.date : ' — and NO 1:1 is scheduled to deliver it in'), sev:2, conf:{label:'high',why:'status field + 1:1 schedule are facts'}, basis:'drafted '+fmtDate(f.createdAt)+' · next planned 1:1: '+(nx?nx.date:'none'), when: nx? daysWord((utcDay(nx.date)-utcDay(todayISO()))/86400000) : 'unscheduled', link:'#/feedback' }; }) },
  { id:'R12', name:'decision review', scan:(s)=>s.decisions.filter(d=>!d.outcome && d.reviewAt && utcDay(d.reviewAt)<=utcDay(todayISO())).map(d=>({ rule:'R12', what:'Decision “'+d.title+'” is due for outcome review — did “'+d.chosen+'” work?', sev:2, conf:{label:'high',why:'reviewAt ≤ today and outcome null'}, basis:'decided '+d.decidedAt+' · reviewAt '+d.reviewAt+' · outcome: not recorded', when:'due', link:'#/decisions' })) },
  { id:'R13', name:'risk review', scan:(s)=>s.risks.filter(r=>r.status==='open'&&r.reviewAt&&utcDay(r.reviewAt)<=utcDay(todayISO())).map(r=>({ rule:'R13', what:'Risk “'+r.title+'” (L'+r.likelihood+'×I'+r.impact+'='+(r.likelihood*r.impact)+') is due for review', sev:2, conf:{label:'high',why:'reviewAt ≤ today'}, basis:'score '+r.likelihood*r.impact+'/25 · reviewAt '+r.reviewAt, when:'due', link:'#/risks' })) }
];
function done0(s,pid){ const d=lastDoneOneOnOne(s,pid); return d? d.date : '(none)'; }
function collectFindings(s){
  const out=[]; for(const r of RULES){ try{ out.push.apply(out, r.scan(s).map(f=>(f.ruleName=r.name, f))); }catch(e){ out.push({ rule:r.id, what:'Rule '+r.id+' failed to evaluate: '+(e&&e.message), sev:0, conf:{label:'high',why:'the failure itself is shown rather than hidden'}, basis:String(e&&e.stack||e).slice(0,200), when:'—', link:'#/health', failed:true }); } }
  return out.sort((a,b)=>b.sev-a.sev);
}

/* ============================================================
   IMPORT / EXPORT core
   ============================================================ */
function stableStringify(v){
  if(Array.isArray(v)) return '['+v.map(stableStringify).join(',')+']';
  if(v && typeof v==='object') return '{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+stableStringify(v[k])).join(',')+'}';
  return JSON.stringify(v);
}
function mintImportIds(imp){ // remap every id + rewire known foreign keys; returns {state, map}
  const map={}; const idOf=(old,p)=>{ if(typeof old!=='string'||!old) return old; if(!map[old]) map[old]=uid(p); return map[old]; };
  const out=deepClone(imp);
  // pass 1: mint ids for every record in every known collection
  for(const c of COLLECTIONS) for(const r of arr(out[c])) if(r && typeof r.id==='string') r.id=idOf(r.id, c.slice(0,3));
  for(const k of ['bossExpectations','listeningTour','earlyWins']) for(const r of arr(out.arrival&&out.arrival[k])) if(r&&typeof r.id==='string') r.id=idOf(r.id,'ar');
  // pass 2: rewire FK fields through the map
  const rw=v=> (typeof v==='string' && map[v])? map[v] : v;
  out.oneOnOnes.forEach(r=>r.personId=rw(r.personId));
  out.pulses.forEach(r=>r.personId=rw(r.personId));
  out.feedback.forEach(r=>{ r.personId=rw(r.personId); r.caseId=rw(r.caseId); });
  out.talent.forEach(r=>r.personId=rw(r.personId));
  out.delegations.forEach(r=>r.delegateId=rw(r.delegateId));
  out.goals.forEach(r=>{ r.ownerId=rw(r.ownerId); r.blockedByGoalIds=arr(r.blockedByGoalIds).map(rw); });
  out.escalations.forEach(r=>r.caseId=rw(r.caseId));
  out.decisions.forEach(r=>r.caseId=rw(r.caseId));
  out.risks.forEach(r=>{ if(r.caseId) r.caseId=rw(r.caseId); });
  out.seats.forEach(r=>{ r.holderId=rw(r.holderId); r.successorIds=arr(r.successorIds).map(rw); });
  out.skiplevels.forEach(r=>r.leadId=rw(r.leadId));
  out.calibrations.forEach(r=>{ r.personId=rw(r.personId); if(r.evidence){ r.evidence.goalIds=arr(r.evidence.goalIds).map(rw); r.evidence.feedbackIds=arr(r.evidence.feedbackIds).map(rw); r.evidence.winIds=arr(r.evidence.winIds).map(rw); } });
  out.cases.forEach(r=>{ r.personIds=arr(r.personIds).map(rw); if(r.linkedIds) for(const k in r.linkedIds) r.linkedIds[k]=arr(r.linkedIds[k]).map(rw); });
  arr(out.arrival&&out.arrival.listeningTour).forEach(r=>r.personId=rw(r.personId));
  return { state:out, map };
}
function importMerge(target, imp){ // target mutated; returns stats
  const m=mintImportIds(imp); const st={ added:0, remapped:Object.keys(m.map).length };
  for(const c of COLLECTIONS){ if(!Array.isArray(m.state[c])) continue; for(const r of m.state[c]){ target[c].push(r); st.added++; } }
  for(const k of ['bossExpectations','listeningTour','earlyWins']) for(const r of arr(m.state.arrival&&m.state.arrival[k])) target.arrival[k].push(r);
  emit(target,'import','meta','import','Import merged: '+st.added+' records, '+st.remapped+' ids re-minted and re-wired');
  return st;
}

function sparklineSVG(entries, opts){
  const w=opts&&opts.w||220, h=opts&&opts.h||46, pad=5;
  if(!entries.length) return '<span class="dim tiny">no data</span>';
  const xs=i=> pad + (entries.length===1? (w-2*pad)/2 : i*(w-2*pad)/(entries.length-1));
  const ys=v=> h-pad - (clamp(v,1,5)-1)/4*(h-2*pad);
  const pts=entries.map((e,i)=>xs(i).toFixed(1)+','+ys(e.mood).toFixed(1)).join(' ');
  const bIdx=entries.findIndex(e=>e.en!=null); // where the 4-question instrument begins
  let svg='<svg class="spark" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'">';
  [1,3,5].forEach(v=>{ svg+='<line x1="0" x2="'+w+'" y1="'+ys(v)+'" y2="'+ys(v)+'" stroke="#1e2630" stroke-width="1"/>'; });
  if(bIdx>0) svg+='<line x1="'+xs(bIdx)+'" x2="'+xs(bIdx)+'" y1="2" y2="'+(h-2)+'" stroke="var(--warn)" stroke-width="1" stroke-dasharray="3,3"/>';
  svg+='<polyline points="'+pts+'" fill="none" stroke="var(--info)" stroke-width="1.6" stroke-linejoin="round"/>';
  entries.forEach((e,i)=>{ svg+='<circle cx="'+xs(i)+'" cy="'+ys(e.mood)+'" r="'+(e.estimated?2:2.8)+'" fill="'+(e.estimated?'var(--tx3)':'var(--info)')+'"'+(e.estimated?' stroke-dasharray="1,1"':'')+'><title>'+e.at+' · mood '+e.mood+(e.estimated?' (estimate — excluded from trends)':'')+'</title></circle>'; });
  svg+='</svg>';
  const legend=(bIdx>0? '<div class="legend">dashed line = 4-question pulse instrument begins; earlier points are single-question readings — display continuity, NOT a person change</div>':'')
    +((entries.some(e=>e.estimated))? '<div class="legend">hollow/grey dots = estimated pulses (untouched sliders) — displayed but never counted in any trend</div>':'');
  return svg+legend;
}

function completeOneOnOne(o){
  if(!o) return;
  const drafted=STATE.feedback.filter(f=>f.personId===o.personId&&f.status==='drafted');
  openModal({ title:'Complete 1:1 with '+personName(STATE,o.personId), wide:true, submitLabel:'Complete & write records', locked:false, body:
    '<div class="notice info small">Closing this writes records, not vibes: the 1:1 becomes history, drafted SBI you tick becomes <b>delivered</b> (dated today), and the four sliders below write a pulse entry. <b>If you do not touch the sliders, the pulse is recorded as an estimate</b> — displayed for continuity but permanently excluded from every trend. That is the instrument-trust rule, applied at the write path.</div>'
    + fRow('Notes from the conversation','<textarea name="notes">'+esc(o.notes||'')+'</textarea>')
    + (drafted.length? fRow('Mark delivered SBI','<div class="checks">'+drafted.map(f=>'<span class="ck" data-v="'+f.id+'" onclick="this.classList.toggle(\'on\')">'+esc(f.s.slice(0,60))+'</span>').join('')+'</div>','Ticked items are stamped deliveredAt = today and leave the auto-agenda.') : '')
    + ['mood — overall','energy','load (1 light … 5 heavy)','support felt'].map((lbl,i)=>{ const keys=['mood','energy','load','support'];
       return '<div class="range-row"><span class="small">'+lbl+'</span><input class="pls-range" type="range" min="1" max="5" step="1" value="3" name="'+keys[i]+'" data-num="1"><output id="ro_'+keys[i]+'">3</output></div>'; }).join('')
    +'<div class="tiny dim">The untouched-slider estimate rule exists because defaults would otherwise be written as if measured — fabricated telemetry feeding every trend this app computes.</div>',
    onMount(box){ box.querySelectorAll('.pls-range').forEach(r=>{ r.addEventListener('input',()=>{ box.dataset.plsTouched='1'; const out=box.querySelector('#ro_'+r.name); if(out) out.textContent=r.value; }); }); },
    onSubmit(v, boxEl){
      o.status='done'; o.notes=v.notes||''; o.date=todayISO();
      const f=$('#modalBox'); const touched=f && f.dataset.plsTouched==='1';
      const entry={ id:uid('pu'), personId:o.personId, at:todayISO(), mood:+v.mood, energy:+v.energy, load:+v.load, support:+v.support, source:'1:1-close' };
      if(!touched) entry.estimated=true; // absence of the flag = measured. Never write estimated:false.
      STATE.pulses.push(entry);
      const fbox=$('#modalForm'); let deliveredN=0;
      if(fbox){ fbox.querySelectorAll('.ck.on').forEach(ck=>{ const fb=byId(STATE.feedback,ck.dataset.v); if(fb){ fb.status='delivered'; fb.deliveredAt=todayISO(); deliveredN++; emit(STATE,'feedback','feedback',fb.id,'SBI delivered to '+personName(STATE,fb.personId)+' (during 1:1)'); } }); }
      emit(STATE,'1:1','oneOnOne',o.id,'1:1 completed with '+personName(STATE,o.personId)+(touched?' (measured pulse)':' (pulse flagged estimated — sliders untouched)')+(deliveredN? ' · '+deliveredN+' SBI delivered':''));
      save(); renderApp();
      toast(touched? 'Pulse recorded as measured.' : 'Pulse recorded as ESTIMATE — sliders were untouched. It will display but never move a trend.', touched?'ok':'warn', 5000);
    }});
}

    +'</div>';

    $('[data-a="dec"]',app).onclick=()=>decisionForm(c);

function tryCloseCase(c){
  const pre=closeCase(STATE,c.id,{dryrun:true}); // same code path, mutation skipped (dryrun branch in closeCase)
  if(pre.ok===false && pre.blockers){
    // refusal returns before any mutation (ordering asserted by T6) — nothing to undo
    openModal({ title:'Close refused — open links named', danger:true, submitLabel:'Override and close anyway', body:
      '<div class="recovery"><h3>'+pre.blockers.length+' open link(s) block a clean close</h3><ul style="margin:6px 0 0 18px">'+pre.blockers.map(b=>'<li class="small">'+esc(b)+'</li>').join('')+'</ul></div>'
      +'<div class="small dim">Overriding does not resolve those records — it closes the case and writes an explicit <b>OVERRIDE</b> entry into the case log naming exactly what was open. That asymmetry is deliberate: closing is cheap to do and forever visible.</div>',
      onSubmit(){ const r=closeCase(STATE,c.id,{override:true}); if(r.ok){ save(); renderApp(); toast('Case closed with override — logged','warn'); } }});
    return;
  }
  const r=closeCase(STATE,c.id,{});
  if(r.ok){ save(); renderApp(); toast('Case closed clean — no open links','ok'); }
  else toast(r.error||'Could not close','bad');
}

function scanSeed(){ let n=0; for(const c of COLLECTIONS) n+=STATE[c].filter(r=>r&&r.seed).length; return n; }
function exportJSON(){
  const blob=new Blob([JSON.stringify(STATE,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='leados-backup-'+todayISO()+'.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  toast('Exported full state as JSON','ok');

function readImport(file){
  const err=(m)=>{ const el=document.getElementById('importErr'); if(el){ el.style.display='block'; el.innerHTML='<h3>Import refused — with the exact reason</h3><div class="small">'+esc(m)+'</div>'; } toast('Import refused: '+m,'bad',7000); };
  const rd=new FileReader();
  rd.onload=()=>{
    let v; try{ v=JSON.parse(String(rd.result)); }catch(e){ return err('File is not valid JSON: '+e.message); }
    const shape=validateStateShape(v); if(!shape.ok) return err('Shape validation refused the file: '+shape.reason);
    if(v.meta.schemaVersion>SCHEMA) return err('File is schema v'+v.meta.schemaVersion+'; this build understands up to v'+SCHEMA+'. Newer data is not downgraded or guessed at.');
    let migrated;
    try{ migrated=migrateToCurrent(v); }catch(e){ return err('Migration to v'+SCHEMA+' failed safely: '+(e&&e.message)); }
    if(stableStringify(migrated)===stableStringify(STATE)) return err('This file is byte-identical (after normalization) to your CURRENT live state. Importing it would be a no-op that looks like a restore. Refused.');
    const snap=JSON.stringify(STATE);
    const qk=quarantine('pre-import', snap);
    openModal({ title:'Import: how to combine?', wide:true, hideSubmit:true, body:
      '<div class="notice info small">Snapshot of your current state written to <span class="mono">'+esc(qk||'(quarantine failed — aborting would be the safe move)')+'</span>. File validated'+(v.meta.schemaVersion<SCHEMA?' and migrated v'+v.meta.schemaVersion+'→v'+SCHEMA:'')+'. Choose:</div>'
      +'<div class="grid c2"><div class="card"><h3>Merge</h3><p class="small dim">Every imported record gets a fresh id; known foreign keys (personId, caseId, blockedByGoalIds, linkedIds…) are rewired. Existing data stays. T13-tested.</p><button class="btn primary" id="impMerge">Merge</button></div>'
      +'<div class="card"><h3>Replace</h3><p class="small dim">Current state is dropped; imported file becomes the state (snapshot above protects you). Use for restore-after-wipe.</p><button class="btn danger" id="impReplace">Replace</button></div></div>',
      onMount(){ document.getElementById('impMerge').onclick=()=>{ const st=importMerge(STATE, migrated); integrityAudit(STATE); save(); closeModal(); renderApp(); toast('Imported: '+st.added+' records merged, '+st.remapped+' ids re-minted','ok',6000); };
        document.getElementById('impReplace').onclick=()=>{ migrated.meta.seeded=true; STATE=migrated; integrityAudit(STATE); save(); closeModal(); renderApp(); toast('State replaced with import. Pre-import snapshot is in quarantine keys.','ok',6000); }; }});
  };
  rd.readAsText(file);
}
function purgeSeed(){
  openModal({ title:'Purge seed demo data?', danger:true, submitLabel:'Purge '+scanSeed()+' rows', body:'<div class="notice">Only rows still tagged <span class="mono">seed:true</span> are removed. Real data you created is untouched. Orphaned references left behind are repaired by the integrity audit on next boot — and logged.</div>',
    onSubmit(){ let n=0; for(const c of COLLECTIONS){ const before=STATE[c].length; STATE[c]=STATE[c].filter(r=>!(r&&r.seed)); n+=before-STATE[c].length; }
      emit(STATE,'data','meta','purge','Purged '+n+' seed rows'); save(); renderApp(); }});
}
function wipeAll(){
  openModal({ title:'Erase EVERYTHING?', danger:true, submitLabel:'Erase permanently', body:
    '<div class="recovery"><h3>This deletes every record in LeadOS for this browser.</h3><div class="small">A final export is strongly advised. Seeding will NOT return (meta.seeded survives as true — permanent by design). Type <b>ERASE</b> below.</div></div>'
    +fRow('Confirmation','<input name="conf" placeholder="type ERASE">'),
    onSubmit(v){ if(v.conf!=='ERASE'){ toast('Type ERASE exactly','warn'); return false; }
      const old=STATE; STATE=defaultState(); STATE.meta.seeded=true; STATE.meta.auditLog=(old.meta.auditLog||[]).slice(-50); emit(STATE,'data','meta','wipe','All data erased by explicit user action');
      save(); renderApp(); }});
}

/* ============================================================
   BOOT
   ============================================================ */
function boot(){
  const res=loadState(); STATE=res.state; RECOVERY=res.recovery;
  let dirty=res.migrated;
  const repairs=integrityAudit(STATE); if(repairs.length) dirty=true;
  if(seedIfFirstRun(STATE)) dirty=true;
  if(dirty) save(); else renderTopbar();
  LAST_TESTS=runSelfTests();
  $('#shell').style.visibility='';
  renderApp();
  const b=$('#boot'); setTimeout(()=>{ b.classList.add('gone'); setTimeout(()=>b.remove(),300); }, 620);
  if(RECOVERY) toast('Storage recovery: '+RECOVERY.label+' — see banner on Today / Data','bad',9000);
  else if(res.migrated) toast('Storage migrated to schema v'+SCHEMA+' — migration steps logged on the Data page','ok',6000);
  if(repairs.length) toast(repairs.length+' dangling reference(s) repaired at boot (nulled, never dropped) — logged on Data page','warn',7000);
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot); else boot();
</script>
</body>
