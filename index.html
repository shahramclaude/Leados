return '<div class="slabar"><div class="slab"><i style="width:'+s.pct+'%;background:'+(tone==='bad'?'var(--red)':tone==='warn'?'var(--amber)':'var(--green)')+'"></i></div><span class="tiny mono dim">'+(s.breached?U.plural(U.age(c.slaDue),'day')+' over':s.left+'d left')+'</span></div>';},
personCell:(p,extra)=>{const f=FW.flightRisk(ST,p);return '<div class="perscell" data-href="#/person/'+p.id+'"><div class="row between"><strong class="small">'+U.esc(p.name)+'</strong>'+bandChip(f.band)+'</div><div class="tiny dim">'+U.esc(p.role||'')+(p.isLead?' · lead':'')+'</div>'+(extra||'')+'<div class="tiny dim" style="margin-top:4px">flight '+f.score+' · cadence '+(p.cadenceDays||14)+'d</div></div>';},
wires:ws=>ws.length?ws.map(w=>'<div class="wireline"><span class="wk">'+U.esc(w.kind)+'</span><div><div>'+U.esc(w.label)+'</div><div class="tiny dim">'+U.fmt(w.at?w.at.slice(0,10):null)+(w.ref===null&&w.route===null?' · revoked':'')+'</div></div>'+(w.route?'<span style="margin-left:auto"><button class="btn sm gh" data-href="'+w.route+'">'+icon('chev',14)+'</button></span>':'')+'</div>').join(''):'<div class="tiny dim">No wires — this case touched nothing. That is either a very small case or a broken ledger.</div>',
caseRow:(c,withScope)=>{const ct=CONTENT.caseTypes[c.type]||{label:c.type};const linked=(c.links||[]).filter(l=>{const o=Q.caseById(l);return o&&o.status==='open';}).length;
return '<tr class="hov clk" data-href="#/case/'+c.id+'"><td>'+sevChip(c.sev)+'</td><td><div><strong class="small">'+U.esc(c.title)+'</strong>'+(c.type==='ethics'?' '+icon('lock',11):'')+'</div><div class="tiny dim">'+ct.label+(withScope?' · '+U.esc(Q.scopeName(c.scope)):'')+(linked?' · <span style="color:var(--amber)">linked pattern</span>':'')+'</div></td><td style="min-width:150px">'+(c.status==='open'?H.slaBar(c):'<span class="tiny dim">closed '+U.fmt(c.closedAt)+(c.verified?' · verified':'')+'</span>')+'</td><td class="tiny dim mono">'+U.fmt(c.opened)+'</td></tr>';},
advRow:a=>{const tone=a.locked?'red':a.positive?'green':a.sev>=3?'amber':'plain';
return '<div class="listit"><div class="tick" style="background:'+(a.locked?'var(--red)':a.positive?'var(--green)':a.sev>=3?'var(--amber)':'var(--blue)')+'"></div><div style="flex:1"><div class="row wrap" style="gap:8px"><span class="chip '+tone+'">S'+a.sev+'</span>'+(a.locked?'<span class="chip red">'+icon('lock',10)+' locked</span>':'')+(a.positive?'<span class="chip green">positive</span>':'')+'<strong class="small">'+a.title+'</strong></div><div class="small muted" style="margin-top:3px">'+a.why+'</div></div><div class="row">'+(!a.locked?'<button class="btn sm gh" data-act="adv-snooze" data-id="'+a.id+'" data-d="3" title="Snooze 3 days — dated, never amnesia">3d</button><button class="btn sm gh" data-act="adv-snooze" data-id="'+a.id+'" data-d="7" title="Snooze 7 days">7d</button>':'')+'<button class="btn sm" data-href="'+a.route+'">Open</button></div></div>';},
taskRow:t=>{const late=!t.done&&!t.cancelled&&t.due<U.today();
return '<div class="listit"><button class="btn sm '+(t.done?'ok':'')+'" data-act="task-toggle" data-id="'+t.id+'" '+(t.cancelled?'disabled':'')+'>'+(t.done?icon('check',12):'')+'</button><div style="flex:1;opacity:'+(t.cancelled?.45:1)+'"><div class="small" style="'+(t.done||t.cancelled?'text-decoration:line-through':'')+'">'+U.esc(t.title)+'</div><div class="tiny dim">'+t.origin+(late?' · <span style="color:var(--red)">'+U.plural(U.age(t.due),'day')+' over</span>':' · due '+U.fmt(t.due))+(t.origin==='hr'?' · <span style="color:var(--red)">HR — unsnoozable</span>':'')+'</div></div>'+(t.caseId?'<button class="btn sm gh" data-href="#/case/'+t.caseId+'">'+icon('chev',13)+'</button>':'')+'</div>';},
spark:(vals,w,h,color)=>{w=w||180;h=h||36;const mx=Math.max.apply(null,vals.concat([1])),mn=Math.min.apply(null,vals.concat([0]));
const rng=(mx-mn)||1;const pts=vals.map((v,i)=>[Math.round(i/(Math.max(1,vals.length-1))*(w-4))+2,Math.round(h-4-((v-mn)/rng)*(h-8))]);
return '<svg class="spark" width="'+w+'" height="'+h+'"><polyline fill="none" stroke="'+(color||'var(--acc)')+'" stroke-width="2" points="'+pts.map(p=>p.join(',')).join(' ')+'"/>'+pts.map(p=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="2" fill="'+(color||'var(--acc)')+'"/>').join('')+'</svg>';},
triad:p=>{const nb=p.nineBox;const cur=nb&&nb.at?[+nb.perf,+nb.pot]:null;const stale=cur&&U.age(nb.at)>120;
let s='<div class="triad" title="Nine-box: performance × potential — click a cell to re-stamp (today)">';
for(let r=3;r>=1;r--)for(let c=1;c<=3;c++){s+='<div data-act="nb-set" data-id="'+p.id+'" data-pf="'+c+'" data-pt="'+r+'" class="'+(cur&&cur[0]===c&&cur[1]===r?'hot':'')+(stale&&cur&&cur[0]===c&&cur[1]===r?' stale':'')+'">'+(cur&&cur[0]===c&&cur[1]===r?'●':'')+'</div>';}
return s+'</div>'+(stale?'<div class="tiny" style="color:var(--amber)">stale · '+U.age(nb.at)+'d — halves the bench stamp</div>':'');}
};

/* ---- case intake: live pre-commit classification, ethics double-commit ---- */
caseIntake(pre){pre=pre||{};
const scopeOpts='<option value="">— no scope —</option>'+ST.people.map(p=>'<option value="person:'+p.id+'" '+(pre.scope&&pre.scope.id===p.id?'selected':'')+'>'+U.esc(p.name)+(p.isLead?' (lead)':'')+'</option>').join('')+ST.people.filter(p=>p.isLead).map(l=>'<option value="team:'+l.id+'">Team of '+U.esc(l.name.split(' ')[0])+'</option>').join('')+'<option value="org:org">Whole org</option>';
Modal.open('<h2>'+icon('brief',17)+'Register a case</h2><div class="msub">Register once — the engine routes evidence, agenda, drafts, tasks and flags. The preview below is computed live; nothing is written until commit.</div>'
+'<form id="mf" onsubmit="return false">'
+'<label>Type</label><select name="type" id="ciType">'+Object.keys(CONTENT.caseTypes).map(k=>'<option value="'+k+'" '+(pre.type===k?'selected':'')+'>'+CONTENT.caseTypes[k].label+'</option>').join('')+'</select>'
+'<label>Title — behavioral, dated, read-aloud fair</label><input name="title" id="ciTitle" value="'+U.esc(pre.title||'')+'" placeholder="Leo skipped regression on R41/R42 under deadline pressure">'
+'<label>Detail (verbatim evidence welcome)</label><textarea name="detail" id="ciDetail" placeholder="What was observed, when, by whom. Write it as if read aloud in the grievance room.">'+U.esc(pre.detail||'')+'</textarea>'
+'<div class="frow"><div><label>Scope</label><select name="scope" id="ciScope">'+scopeOpts+'</select></div>'
+'<div><label>Severity</label><select name="sev" id="ciSev">'+[1,2,3,4,5].map(s=>'<option value="'+s+'" '+(+pre.sev===s?'selected':'')+'>S'+s+' — '+['noise','watch','act this week','act today','drop everything'][s-1]+'</option>').join('')+'</select></div></div>'
+'<div id="ciGoalRow"><label>Link a goal (goal-risk only)</label><select name="goalId" id="ciGoal"><option value="">— none —</option>'+ST.goals.filter(g=>g.status==='active').map(g=>'<option value="'+g.id+'">'+U.esc(g.title)+'</option>').join('')+'</select></div>'
+'<div id="ciPreview" class="card tight hl" style="margin-top:12px"></div>'
+'<div id="ciEthics"></div>'
+'</form>'+'<div class="mfoot"><button class="btn" data-act="modal-x">Cancel</button><button class="btn pri" id="ciCommit" data-act="case-commit">Commit case</button></div>',true);
const upd=()=>{const type=document.getElementById('ciType').value,title=document.getElementById('ciTitle').value,detail=document.getElementById('ciDetail').value,sev=+document.getElementById('ciSev').value,sv=document.getElementById('ciScope').value,gid=document.getElementById('ciGoal').value;
const scope=sv?{kind:sv.split(':')[0],id:sv.split(':')[1]}:null;
const cl=ENG.classify(type,title,detail,sev,scope,gid);
document.getElementById('ciGoalRow').style.display=type==='goal-risk'?'':'none';
let html='<div class="ctitle">Live pre-commit classification</div>'
+'<div class="row wrap" style="gap:8px;margin-bottom:8px"><span class="chip blue">'+cl.cyn.domain+'</span><span class="chip violet">'+cl.eis.q+'</span><span class="chip gold">SLA '+cl.slaDays+'d → due '+U.fmt(cl.slaDue)+'</span>'+(cl.eff!==type?'<span class="chip red">RECLASSIFIED → HR escalation</span>':'')+'</div>'
+'<div class="small muted">'+U.esc(cl.cyn.move)+' · '+U.esc(cl.eis.hint)+'</div>';
if(cl.hits.length)html+='<div class="note bad">'+icon('lock',13)+' Protected-class signal: <strong>'+cl.hits.join(', ')+'</strong>. Registration will re-classify to HR escalation, strip all automation except verbatim evidence + today\'s HR task, and require your acknowledgment twice. The machine never mediates this.</div>';
if(cl.dup)html+='<div class="note warn">Duplicate refused: an identical open case exists — <button class="btn sm" data-href="#/case/'+cl.dup.id+'">open it</button>. Two open records on one truth is how rot starts.</div>';
if(cl.lesson)html+='<div class="note">Lesson journaled at the last closed '+CONTENT.caseTypes[cl.eff].label.toLowerCase()+' case ('+U.fmt(cl.lessonAt)+'): “'+U.esc(cl.lesson)+'”</div>';
html+='<div class="ctitle" style="margin-top:8px">Exact writes on commit ('+cl.writes.length+')</div><div class="tiny dim">'+cl.writes.map(w=>'· '+U.esc(w)).join('<br>')+'</div>';
document.getElementById('ciPreview').innerHTML=html;
const et=document.getElementById('ciEthics');
if(cl.hits.length){et.innerHTML='<label class="check"><input type="checkbox" id="ciAck"><span class="small">I have read the trip-words above. I understand this re-classifies to an HR escalation with sealed wires, and that the humanity of that room is mine. First acknowledgment.</span></label><label class="check"><input type="checkbox" id="ciAck2"><span class="small">Second, deliberate acknowledgment: I will contact HR today.</span></label>';
document.getElementById('ciCommit').textContent='Commit HR escalation (sealed)';document.getElementById('ciCommit').className='btn dan';}
else{et.innerHTML='';const b=document.getElementById('ciCommit');b.textContent='Commit case';b.className='btn pri';}};
['ciType','ciTitle','ciDetail','ciSev','ciScope','ciGoal'].forEach(id=>{document.getElementById(id).addEventListener('input',upd);});
upd();},

const imps=[];let badLine=null;
lines.forEach(l=>{const m=l.match(/^@([a-zÀ-ÿ]+)\s*[·\-—]\s*(.+?)\s*[·\-—]\s*(\d{4}-\d{2}-\d{2})/i);
if(!m){badLine=l;return;}
const p=ST.people.find(x=>x.name.split(' ')[0].toLowerCase()===m[1].toLowerCase());
imps.push({ownerId:p?p.id:null,text:m[2],due:m[3],bad:!p});});
if(badLine){toast('Improvement line unparseable: "'+badLine.slice(0,40)+'". Format: @firstname · what · YYYY-MM-DD.','bad');return;}
if(!imps.length){toast('An AAR with no improvement is a story. One owned, dated improvement minimum.','bad');return;}

const aar={id:U.uid('a'),at:U.today(),caseId:mfVal('caseId')||null,title:mfVal('title')||'AAR',what:mfVal('what'),
expQ:mfVal('expQ'),actQ:mfVal('actQ'),expT:mfVal('expT'),actT:mfVal('actT'),expC:mfVal('expC'),actC:mfVal('actC'),
whys:[1,2,3,4,5].map(i=>mfVal('why'+i)).filter(Boolean),blameless:true,improvements:imps};
const q=FW.aarQ(aar);
commit(st=>{st.aars.unshift(aar);
imps.forEach(i=>st.commitments.unshift({id:U.uid('cm'),direction:'owed',personId:i.ownerId,text:i.text,due:i.due,status:'open',at:U.now(),source:'aar'}));
if(aar.caseId&&Q.caseById(aar.caseId))ENG.pushWire(Q.caseById(aar.caseId),'aar-arm','AAR filed — tuition paid ('+q.score+'/8)','#/aar',aar.id);
store.logEvent('AAR filed: '+aar.title.slice(0,40)+' · quality '+q.score+'/8 · '+imps.length+' improvements → commitments');});
Modal.close();toast('AAR filed ('+q.score+'/8 '+q.band.toLowerCase()+'). Improvements are now owned, dated commitments — the engine chases them like any other debt.','ok');},

/* ================= IMPORT — v:6 only; replace with confirmation, merge with re-minted ids + rewired graph ================= */
const IMPORT={
validate(txt){try{const j=JSON.parse(txt);
if(!j||typeof j!=='object'||Array.isArray(j))return{ok:false,err:'Not a LeadOS record — refused before touching state.'};
if(j.v!==6)return{ok:false,err:'Record declares v:'+j.v+' — this build imports v:6 only. Older exports: open them in the build that wrote them. State untouched.'};
return{ok:true,data:store.guard(JSON.parse(JSON.stringify(j)))};}catch(e){return{ok:false,err:'JSON parse failed: '+e.message+'. State untouched.'}}},
remap(j){const map={};
const cols=['people','cases','tasks','sessions','agenda','feedback','delegations','mediations','goals','decisions','pulses','safety','capabilities','aars','commitments','lessons','teamNotes','rituals','meetings'];
cols.forEach(k=>(j[k]||[]).forEach(r=>{if(r&&r.id){map[r.id]=U.uid('m');r.id=map[r.id];}}));
const walk=o=>{if(Array.isArray(o)){o.forEach(walk);return;}if(!o||typeof o!=='object')return;
Object.keys(o).forEach(k=>{const v=o[k];
if(typeof v==='string'){if(map[v])o[k]=map[v];
else if(v.indexOf('/')>-1){const tail=v.split('/').pop();if(map[tail])o[k]=v.slice(0,v.length-tail.length)+map[tail];}}
else walk(v);});};
cols.forEach(k=>walk(j[k]||[]));walk(j.dysf||{});walk(j.transition||{});walk(j.academy||{});
return{j,cols};},
merge(j){const pack=IMPORT.remap(j);let n=0;
pack.cols.forEach(k=>{ST[k]=ST[k].concat(pack.j[k]||[]);n+=(pack.j[k]||[]).length;});
ST.lessons=ST.lessons.concat(pack.j.lessons||[]);
return n;}
};
FORMS.importStart=txt=>{const v=IMPORT.validate(txt);
if(!v.ok){toast(v.err,'bad');return;}
const counts=['people','cases','feedback','goals','decisions','commitments'].map(k=>((v.data[k]||[]).length)+' '+k).join(' · ');
Modal.open('<h2>'+icon('up',17)+'Import v:6 record</h2><div class="msub">Validated: '+counts+'. Choose the merge contract — replace wipes, merge appends with re-minted ids and a rewired person graph (managerId, scopes, links, wire refs, every person pointer). Either way a post-import audit runs.</div><form id="mf" onsubmit="return false"><label class="check"><input type="radio" name="mode" value="merge" checked><span class="small"><strong>Merge</strong> — ids re-minted, nothing overwritten, append-only (no per-record dedupe beyond ids — stated limit)</span></label><label class="check"><input type="radio" name="mode" value="replace"><span class="small"><strong>Replace</strong> — current state wiped first. Export first if you have any doubt.</span></label></form>'+Modals.foot('import-run','Import',true));
window._impData=v.data;};
Object.assign(ACTIONS,{
'recovery-export':()=>{if(window._corruptBk){try{U.download('leados-damaged.json',localStorage.getItem(window._corruptBk)||'');}catch(e){toast('Could not read the damaged copy: '+e.message,'bad');}}
Modal.close();U.href('#/data');},
'import-run':()=>{const mode=(document.querySelector('[name="mode"]:checked')||{value:'merge'}).value;
const data=window._impData;if(!data){Modal.close();return;}
if(mode==='replace'){ST=store.guard(JSON.parse(JSON.stringify(data)));STOR_finalizeBoot(ST);
