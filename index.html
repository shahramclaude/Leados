<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LeadOS — Leadership Operating System</title>
<style>
/* ============ DESIGN SYSTEM — LeadOS v11 (dark ops console, zero network) ============ */
:root{
--bg:#0c0f14;--bg2:#10141b;--panel:#131822;--panel2:#171e2b;--panel3:#1c2434;
--line:#232c3d;--line2:#2d3a52;--ink:#e8edf6;--ink2:#9aa8bf;--ink3:#5d6c85;
--acc:#e9b44c;--acc2:#f4cd7e;--acc-dim:#5a4a22;
--red:#e5484d;--red-dim:#4a1d20;--amber:#f0a13c;--amber-dim:#463015;
--green:#3fb68b;--green-dim:#123a2c;--blue:#5b9cf5;--blue-dim:#16283f;
--violet:#9a7ff0;--violet-dim:#241f3d;
--mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
--sans:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
--r:10px;--r2:14px}
html{color-scheme:dark}body,h1,h2,h3,h4,p,ul,ol,dl,dd,figure,table{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
*,*::before,*::after{box-sizing:border-box}
::selection{background:var(--acc-dim);color:var(--acc2)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(233,180,76,.12)}
textarea{resize:vertical;min-height:70px}
label{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin:10px 0 4px}
svg.i{flex:none;vertical-align:-3px}
kbd.k{font-family:var(--mono);font-size:10px;background:var(--panel3);border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--ink2)}
#app{display:grid;grid-template-columns:230px 1fr;grid-template-rows:52px 1fr;height:100vh}
#topbar{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--bg2);border-bottom:1px solid var(--line)}
#brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15px}
#brand .logo{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--acc),#a97a25);display:grid;place-items:center;color:#181206}
#saved{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink3)}
#saved.bad{color:var(--red);font-weight:700}
#nav{overflow-y:auto;padding:14px 10px 30px;background:var(--bg2);border-right:1px solid var(--line)}
#nav .grp{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);padding:14px 10px 6px;font-weight:700}
#nav a{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-weight:500;margin:1px 0;border:1px solid transparent}
#nav a:hover{background:var(--panel);color:var(--ink)}
#nav a.on{background:var(--panel2);color:var(--acc2);border-color:var(--line)}
#nav a .bdg{margin-left:auto;font-family:var(--mono);font-size:10px;background:var(--panel3);border-radius:20px;padding:0 7px;line-height:18px;color:var(--ink2)}
#nav a .bdg.hot{background:var(--red-dim);color:var(--red)}
#main{overflow-y:auto;padding:26px 30px 80px;scroll-behavior:smooth}
.wrap{max-width:1120px;margin:0 auto}
#datestamp{font-family:var(--mono);font-size:11px;color:var(--ink3)}
.ph{display:flex;align-items:flex-end;gap:14px;margin:0 0 18px;flex-wrap:wrap}
.ph h1{font-size:24px;font-weight:800;letter-spacing:-.01em}
.ph .sub{color:var(--ink2);font-size:13px;margin-bottom:2px}
.ph .sp{flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:16px 18px;margin-bottom:14px}
.card.tight{padding:12px 14px}
.card.hl{border-color:var(--line2);background:var(--panel2)}
.ctitle{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-bottom:10px;display:flex;align-items:center;gap:7px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.row.wrap{flex-wrap:wrap}
.muted{color:var(--ink2)}.dim{color:var(--ink3)}.small{font-size:12px}.tiny{font-size:11px}.mono{font-family:var(--mono)}
strong{font-weight:700}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:9px;font-weight:600;font-size:13px;border:1px solid var(--line2);background:var(--panel2);transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--acc);color:var(--acc2)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#181206}
.btn.pri:hover{background:var(--acc2)}
.btn.dan{border-color:var(--red);color:var(--red);background:transparent}
.btn.dan:hover{background:var(--red-dim)}
.btn.ok{border-color:var(--green);color:var(--green)}
.btn.ok:hover{background:var(--green-dim)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:7px}
.btn.gh{border-color:transparent;background:transparent;color:var(--ink2)}
.btn.gh:hover{color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;border:1px solid var(--line2);color:var(--ink2);line-height:1.6;white-space:nowrap}
.chip.red{background:var(--red-dim);border-color:transparent;color:#ff9d9f}
.chip.amber{background:var(--amber-dim);border-color:transparent;color:#ffc87e}
.chip.green{background:var(--green-dim);border-color:transparent;color:#7fe3bd}
.chip.blue{background:var(--blue-dim);border-color:transparent;color:#9cc4fb}
.chip.violet{background:var(--violet-dim);border-color:transparent;color:#c4b3f8}
.chip.gold{background:var(--acc-dim);border-color:transparent;color:var(--acc2)}
.chip.plain{background:var(--panel3);border-color:transparent}
table.tb{width:100%;border-collapse:collapse;font-size:13px}
.tb th{text-align:left;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);padding:8px 10px;border-bottom:1px solid var(--line);font-weight:700}
.tb td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tb tr:last-child td{border-bottom:0}
.tb tr.hov:hover td{background:var(--panel2)}
.tb tr.clk{cursor:pointer}
.bar{height:7px;border-radius:6px;background:var(--panel3);overflow:hidden;min-width:50px}
.bar>i{display:block;height:100%;border-radius:6px;background:var(--green);transition:width .4s}
.bar>i.warn{background:var(--amber)}.bar>i.bad{background:var(--red)}.bar>i.gold{background:var(--acc)}.bar>i.blue{background:var(--blue)}
.listit{display:flex;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);align-items:flex-start}
.listit:last-child{border-bottom:0}
.tick{width:8px;height:8px;border-radius:8px;margin-top:7px;flex:none}
.empty{padding:34px 20px;text-align:center;color:var(--ink3);border:1px dashed var(--line2);border-radius:var(--r2);font-size:13px}
.empty .big{font-size:15px;color:var(--ink2);font-weight:600;margin-bottom:4px}
.stat{padding:14px 16px}.stat .n{font-size:26px;font-weight:800;font-family:var(--mono);letter-spacing:-.02em}
.stat .l{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.hr{height:1px;background:var(--line);margin:14px 0;border:0}
.pace{display:flex;align-items:center;gap:16px;border-radius:var(--r2);padding:14px 18px;border:1px solid;margin-bottom:18px;flex-wrap:wrap}
.pace.GREEN{background:var(--green-dim);border-color:#1e5c46}
.pace.STEADY{background:var(--blue-dim);border-color:#274b75}
.pace.LOADED{background:var(--amber-dim);border-color:#7a531d}
.pace.REDLINE{background:var(--red-dim);border-color:#7a2b2e}
.pace .word{font-weight:800;letter-spacing:.1em;font-size:13px;font-family:var(--mono)}
.steps{display:flex;gap:0;margin:6px 0 14px;flex-wrap:wrap}
.step{flex:1;min-width:90px;text-align:center;position:relative;padding-top:22px;font-size:11px;color:var(--ink3);font-weight:600}
.step::before{content:'';position:absolute;top:8px;left:50%;transform:translateX(-50%);width:14px;height:14px;border-radius:20px;background:var(--panel3);border:2px solid var(--line2)}
.step::after{content:'';position:absolute;top:14px;left:calc(-50% + 9px);width:calc(100% - 18px);height:2px;background:var(--line2)}
.step:first-child::after{display:none}
.step.done{color:var(--green)}.step.done::before{background:var(--green);border-color:var(--green)}.step.done::after{background:var(--green)}
.step.now{color:var(--acc2)}.step.now::before{background:var(--acc);border-color:var(--acc);box-shadow:0 0 0 4px rgba(233,180,76,.18)}
#modalHost{position:fixed;inset:0;display:none;z-index:80}
#modalHost.on{display:block}
.mback{position:absolute;inset:0;background:rgba(5,7,10,.72)}
.mbox{position:relative;margin:5vh auto 0;max-width:640px;width:calc(100% - 40px);max-height:86vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:22px 24px;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:pop .18s ease-out}
.mbox.wide{max-width:880px}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}}
.mbox h2{font-size:17px;font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:10px}
.mbox .msub{color:var(--ink2);font-size:12.5px;margin-bottom:10px}
.mfoot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
#toasts{position:fixed;right:18px;bottom:18px;z-index:100;display:flex;flex-direction:column;gap:8px;max-width:360px}
.toast{background:var(--panel2);border:1px solid var(--line2);border-left:3px solid var(--acc);border-radius:10px;padding:11px 14px;font-size:13px;box-shadow:0 12px 34px rgba(0,0,0,.5);animation:pop .2s;display:flex;gap:9px;align-items:flex-start}
.toast.ok{border-left-color:var(--green)}.toast.bad{border-left-color:var(--red)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.check{display:flex;gap:9px;align-items:flex-start;padding:8px 0;font-size:13px}
.check input{width:auto;margin-top:3px}
.note{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:8px;padding:10px 13px;font-size:12.5px;color:var(--ink2);margin:10px 0}
.note.warn{border-left-color:var(--amber);background:var(--amber-dim);color:#ffd9a1}
.note.bad{border-left-color:var(--red);background:var(--red-dim);color:#ffb4b5}
.note.ok{border-left-color:var(--green);background:var(--green-dim);color:#a9ecd2}
.sig{font-family:var(--mono);font-size:10px;padding:1px 7px;border-radius:5px;font-weight:700;letter-spacing:.05em}
.sig.live{background:var(--green-dim);color:var(--green)}
.sig.pend{background:var(--panel3);color:var(--ink3)}
.qcard{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--panel2);cursor:pointer;font-size:13px}
.qcard:hover{border-color:var(--acc)}
.qcard.sel{border-color:var(--acc);background:var(--acc-dim)}
.wireline{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.wireline:last-child{border-bottom:0}
.wireline .wk{font-family:var(--mono);font-size:10px;color:var(--ink3);min-width:98px;text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.slabar{display:flex;align-items:center;gap:9px}
.slab{position:relative;height:8px;flex:1;background:var(--panel3);border-radius:6px;min-width:60px}
.slab>i{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
.gridbox{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.perscell{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--panel2);cursor:pointer}
.perscell:hover{border-color:var(--acc)}
.triad{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;width:96px}
.triad div{aspect-ratio:1;border-radius:4px;border:1px solid var(--line2);display:grid;place-items:center;font-size:9px;color:var(--ink3);cursor:pointer;background:var(--panel3)}
.triad div.hot{background:var(--acc);color:#181206;border-color:var(--acc);font-weight:800}
.triad div.stale{opacity:.4}
.lessonck{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:var(--panel2)}
.lessonck .opt{display:block;padding:7px 10px;border-radius:7px;cursor:pointer;margin-top:4px;border:1px solid transparent;font-size:13px}
.lessonck .opt:hover{background:var(--panel3)}
.lessonck .opt.right{border-color:var(--green);background:var(--green-dim)}
.lessonck .opt.wrong{border-color:var(--red);background:var(--red-dim)}
.topnav2{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab2{padding:7px 13px;border-radius:9px;border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink2);cursor:pointer}
.tab2.on{background:var(--panel2);color:var(--acc2);border-color:var(--line2)}
.capline{position:fixed;left:0;right:0;bottom:0;background:var(--bg2);border-top:1px solid var(--line2);padding:10px 16px;z-index:60;display:flex;gap:10px;align-items:center}
.capline input{background:var(--panel);border-color:var(--line2);font-family:var(--mono);font-size:13px}
#palette{position:fixed;inset:0;z-index:90;display:none;background:rgba(5,7,10,.6)}
#palette.on{display:block}
.pbox{max-width:560px;margin:12vh auto 0;background:var(--panel);border:1px solid var(--line2);border-radius:14px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.pbox input{border:0;border-radius:0;border-bottom:1px solid var(--line);padding:14px 16px;font-size:15px;background:var(--panel)}
.pitem{display:flex;gap:10px;align-items:center;padding:10px 16px;cursor:pointer;color:var(--ink2);border-left:2px solid transparent}
.pitem:hover,.pitem.sel{background:var(--panel2);color:var(--ink);border-left-color:var(--acc)}
.pitem .mono{margin-left:auto;font-size:10px;color:var(--ink3)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px;border:2px solid var(--bg)}
@media(max-width:960px){#app{grid-template-columns:64px 1fr}#nav a span.t,#nav .grp{display:none}#nav a .bdg{display:none}.grid2,.grid3,.grid4,.frow,.frow3{grid-template-columns:1fr}#main{padding:18px 14px 90px}}
</style>
</head>
<body>
<div id="app">
<header id="topbar"></header>
<nav id="nav"></nav>
<main id="main"><div class="wrap" id="viewHost"></div></main>
</div>
<div id="capRoot"></div>
<div id="modalHost"><div class="mback" data-act="modal-x"></div><div id="modalBox"></div></div>
<div id="palette"></div>
<div id="toasts"></div>
<script>
'use strict';
/* ================= UTIL ================= */
const U={
esc:s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),
uid:p=>(p||'x')+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,7),
today:()=>new Date().toISOString().slice(0,10),
now:()=>new Date().toISOString(),
addD:(iso,n)=>{const d=new Date((iso||U.today())+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)},
dB:(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5),
age:iso=>U.dB(iso,U.today()),
fmt:iso=>{if(!iso)return '—';return new Date(iso+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})},
fmtY:iso=>{if(!iso)return '—';return new Date(iso+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})},
dow:iso=>new Date(iso+'T12:00:00').toLocaleDateString('en-US',{weekday:'short'}),
clamp:(v,a,b)=>Math.max(a,Math.min(b,v)),
avg:a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0,
sum:a=>a.reduce((x,y)=>x+y,0),
pct:(a,b)=>b?Math.round(100*a/b):0,
plural:(n,w)=>n+' '+w+(n===1?'':'s'),
href:p=>location.hash=p,
copy:t=>{try{navigator.clipboard.writeText(t)}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(_){/*noop*/}ta.remove()}},
download:(name,text)=>{const b=new Blob([text],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),800)},
titleCase:s=>s.replace(/\w\S*/g,t=>t[0].toUpperCase()+t.slice(1))
};
/* ICON — inline lucide-style stroke icons, zero network dependency (file must run from disk) */
const IC={
home:'<path d="M3 9.5 12 3l9 6.5V20a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22v-8h6v8"/>',
zap:'<path d="M13 2 3 14h9l-1 8 10-12h-9z"/>',
brief:'<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>',
branch:'<path d="M6 3v12"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/>',
users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
user:'<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
msgs:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
msq:'<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8z"/>',
compass:'<circle cx="12" cy="12" r="10"/><path d="m16.24 7.76-2.12 6.36-6.36 2.12 2.12-6.36z"/>',
hand:'<path d="M18 11V6a2 2 0 0 0-4 0v5"/><path d="M14 10V4a2 2 0 0 0-4 0v6"/><path d="M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/>',
flag:'<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><path d="M4 22v-7"/>',
pulse:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
rotate:'<path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>',
calck:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><path d="m9 16 2 2 4-4"/>',
book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
db:'<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>',
check:'<path d="M20 6 9 17l-5-5"/>',
x:'<path d="M18 6 6 18M6 6l12 12"/>',

/* ================= FW — pure model library: no I/O, no mutation, counted live on #/about ================= */
const FW={
/* 1 — flight risk: weighted driver ledger 0..100 */
flightRisk(st,p){const dr=[];let score=0;
const ms=st.sessions.filter(s=>s.personId===p.id&&s.mood&&!s.mood.estimated).sort((a,b)=>a.at<b.at?-1:1);
const sl=FW.moodSlope(ms.map(s=>({at:s.at,v:s.mood.morale,est:s.mood.estimated})));
if(sl!==null&&sl<=-1.2){const w=22;score+=w;dr.push(['Morale slope '+sl+'/wk across '+ms.length+' measured pulses',w]);}
const last=st.sessions.filter(s=>s.personId===p.id&&(s.kind==='1:1'||s.kind==='tour')).map(s=>s.at).sort().pop();
const cad=p.cadenceDays||14;const gap=last?U.age(last):999;
if(gap>cad*1.5){const w=18;score+=w;dr.push([last?('No 1:1 in '+gap+'d (cadence '+cad+'d)'):'Never had a recorded session',w]);}
const broken=st.commitments.filter(c=>c.direction==='owe'&&c.personId===p.id&&c.status==='broken').length;
if(broken){const w=Math.min(20,broken*10);score+=w;dr.push([U.plural(broken,'commitment')+' you made to them broke',w]);}
const cases=st.cases.filter(c=>c.status==='open'&&c.scope&&c.scope.kind==='person'&&c.scope.id===p.id);
if(cases.length){const w=Math.min(20,cases.length*8+Math.max.apply(null,cases.map(c=>c.sev))*2);score+=w;dr.push([U.plural(cases.length,'open case')+' on record (max sev '+Math.max.apply(null,cases.map(c=>c.sev))+')',w]);}
const nb=p.nineBox;
if(!nb||!nb.at){score+=10;dr.push(['Nine-box never stamped — effort invisible',10]);}
else if(U.age(nb.at)>120){score+=7;dr.push(['Nine-box stamp stale ('+U.age(nb.at)+'d; halves their bench stamp)',7]);}
const bounced=st.delegations.filter(d=>d.personId===p.id&&d.verdict==='bounced').length;
if(bounced){score+=8;dr.push([U.plural(bounced,'delegation')+' bounced back — disengagement or overload',8]);}
const owed=st.commitments.filter(c=>c.direction==='owed'&&c.personId===p.id&&c.status==='broken').length;
if(owed){const w=Math.min(12,owed*6);score+=w;dr.push(['They broke '+U.plural(owed,'commitment')+' to you — reliability wobble',w]);}
score=U.clamp(Math.round(score),0,100);
return{score,band:score>=55?'HIGH':score>=28?'MEDIUM':'LOW',drivers:dr.sort((a,b)=>b[1]-a[1])};},
/* 2 — KR current value */
krCurrent(g){const cs=(g.checkins||[]).slice().sort((a,b)=>a.at<b.at?-1:1);return cs.length?+cs[cs.length-1].value:+g.start;},
/* 3 — direction-aware KR score vs time fraction */
krScore(g){const dir=g.dir||'up';const cur=FW.krCurrent(g);const s=+g.start,t=+g.target;let prog;
if(dir==='up')prog=t===s?0:(cur-s)/(t-s);
else if(dir==='down')prog=s===t?0:(s-cur)/(s-t);
else prog=cur<=t?1:t===0?0:t/cur;
const span=Math.max(1,U.dB(g.created,g.deadline));const timeFrac=U.clamp(U.age(g.created)/span,0,1);
return{prog:U.clamp(prog,0,1.25),timeFrac,delta:prog-timeFrac};},
/* 4 — confidence slope across check-ins (1..5 scale, per week) */
confSlope(g){const cs=(g.checkins||[]).filter(c=>c.confidence!=null);
if(cs.length<2)return null;
const t0=cs[0].at;const pts=cs.map(c=>({x:U.dB(t0,c.at)/7,y:+c.confidence}));
const mx=U.avg(pts.map(p=>p.x)),my=U.avg(pts.map(p=>p.y));
let num=0,den=0;pts.forEach(p=>{num+=(p.x-mx)*(p.y-my);den+=(p.x-mx)*(p.x-mx)});
return den?Math.round(num/den*100)/100:0;},
/* 5 — goal status: graded > case-flag > expired > confidence > delta */
goalStatus(st,g){
if(g.status==='graded')return{label:'GRADED',tone:'blue',k:FW.krScore(g),cs:FW.confSlope(g)};
const k=FW.krScore(g),cs=FW.confSlope(g);
const atRisk=st.cases.some(c=>c.status==='open'&&(c.wires||[]).some(w=>w.kind==='goal-flag'&&w.ref===g.id));
if(atRisk)return{label:'AT RISK (CASE)',tone:'red',k,cs};
if(U.age(g.deadline)>0)return{label:'EXPIRED',tone:'red',k,cs};
if(cs!==null&&cs<=-0.6)return{label:'SLIPPING CONF',tone:'amber',k,cs};
if(k.delta>=-.05)return{label:'ON TRACK',tone:'green',k,cs};
if(k.delta>=-.25)return{label:'BEHIND',tone:'amber',k,cs};
return{label:'OFF TRACK',tone:'red',k,cs};},
/* 6 — Edmondson 7-item psychological safety, reverse-scored 2/4/6 (1-indexed) */
edmondson(items){const rev=[1,3,5];let sum=0;
for(let i=0;i<7;i++){const v=+items[i]||0;sum+=rev.indexOf(i)>-1?8-v:v;}
const avg=sum/7;return{score:Math.round(avg*100)/100,band:avg>=5.5?'STRONG':avg>=4?'MODERATE':'FRAGILE'};},
/* 7 — SLII development level → leadership style + suggested delegation rung (1..5) */
slii(skill,will){const s=+skill,w=+will;
if(s<4&&w>=4)return{d:'D1',style:'S1 · Directing',rung:1,note:'High enthusiasm, low competence. Tell them exactly how; a short leash is kind, not cruel.'};
if(s<4&&w<4)return{d:'D2',style:'S2 · Coaching',rung:2,note:'Some competence, commitment dipped. Explain the why, ask before you tell, watch closely.'};
if(s>=4&&w<4)return{d:'D3',style:'S3 · Supporting',rung:3,note:'Competent, confidence wobbles. Share decisions, ask their recommendation first.'};
return{d:'D4',style:'S4 · Delegating',rung:5,note:'High skill, high will. Hand it over with a boundary and a checkpoint — then stay out.'};},
/* 8 — delegation rung mismatch, both directions */
rungCheck(r,sug){r=+r;
if(r>=sug+2)return{tone:'red',msg:'Over-delegation: suggested rung '+sug+', you chose '+r+'. Abandoning a developing person to the outcome is how trust drowns.'};
if(r<=sug-2)return{tone:'amber',msg:'Under-delegation: suggested rung '+sug+', you chose '+r+'. You are holding work they could grow into — that caps the bench.'};

/* 9 — GROW session quality 0..8 */
growQ(g){let sc=0;const L=s=>(s||'').trim().length;
if(L(g.goal)>12)sc+=2;if(L(g.reality)>20)sc+=2;
const opts=(g.options||'').split(/\n|;|•/).filter(o=>o.trim().length>6);if(opts.length>=2)sc+=2;

/* 10 — AAR quality 0..8 */
aarQ(a){let sc=0;const notes=[];
const nums=[a.expQ,a.actQ,a.expT,a.actT,a.expC,a.actC].filter(v=>v!==''&&v!=null&&!isNaN(+v));
if(nums.length>=4)sc+=2;else notes.push('Expected-vs-happened needs numbers, not adjectives — fill at least 4 of 6 fields.');
const wh=(a.whys||[]).filter(w=>(w||'').trim().length>4);
if(wh.length>=3)sc+=2;else notes.push('5-whys chain has fewer than 3 real links.');
if(a.blameless){sc+=1}else notes.push('Blameless check unconfirmed — if a name appears as a cause, the AAR is theater.');
const imps=(a.improvements||[]).filter(i=>i.text&&i.ownerId&&i.due);
if(imps.length&&imps.length===(a.improvements||[]).length)sc+=2;else notes.push('Every improvement needs an owner and a date, or it is a wish.');
if((a.what||'').trim().length>20)sc+=1;
return{score:sc,band:sc>=7?'RIGOROUS':sc>=5?'SOLID':sc>=3?'THIN':'WEAK',notes};},
/* 11 — SBI/AID/COIN composer lint */
sbiLint(f){const out=[];const t=Object.keys(f.parts||{}).map(k=>f.parts[k]).join(' ').toLowerCase();
const hasWhen=/\b(mon|tue|wed|thu|fri|week|today|yesterday|q[1-4]|r\d+|release|meeting|standup|review|retro)/.test(t);
out.push({ok:hasWhen,msg:hasWhen?'Anchored to a time/place — specific.':'When/where is vague. "Lately" is not a situation.'});
const vague=/\b(attitude|lazy|always|never|toxic|bad|nice|great job|awesome)\b/.test(t);
out.push({ok:!vague,msg:!vague?'Behavior described without verdict words.':'Contains a verdict word (attitude/always/never…). Describe the observable act.'});
const impact=/\b(\d+%|\$|customer|client|user|prod|release|team|stakeholder|defect|revenue|trust|deadline)/.test(t);
out.push({ok:impact,msg:impact?'Impact names stakes or numbers.':'Impact is abstract — name who or what it touched.'});
return{score:out.filter(o=>o.ok).length,checks:out};},
/* 12 — trust equation (credibility+reliability+intimacy)/self-orientation */
trustEq(t){const c=+t.c||1,r=+t.r||1,i=+t.i||1,so=+t.so||1;
const score=Math.round((c+r+i)/so*100)/100;
const nums=[['Credibility',c],['Reliability',r],['Intimacy',i]].sort((a,b)=>a[1]-b[1]);
const band=score>=7?'STRONG':score>=4?'STABLE':score>=2?'WATCH':'FRAGILE';
return{score,band,weakest:nums[0],fix:nums[0][0]==='Credibility'?'Say "I don\'t know" once this week, then come back with the answer.':nums[0][0]==='Reliability'?'Pick one commitment to them and close it before its date — visibly.':'Ask one question about their week that has nothing to do with the work.'};},
/* 13 — feedback balance last 30d */
fbBalance(st){const cut=U.addD(U.today(),-30);
const ds=st.feedback.filter(f=>f.status==='delivered'&&f.deliveredAt>=cut);
const p=ds.filter(f=>f.kind==='praise').length,c=ds.filter(f=>f.kind!=='praise').length;
const tot=p+c;const ratio=tot?p/tot:null;
const zone=ratio===null?'NO DATA':ratio>=0.6&&ratio<=0.85?'IN ZONE 60–85%':ratio<0.6?'CORRECTION-HEAVY':'PRAISE-ONLY RISK';
return{p,c,tot,ratio,zone};},
/* 14 — decision calibration with sample-size honesty */
calibration(st){const gs=st.decisions.filter(d=>d.decided&&d.rating!=null);
if(!gs.length)return{n:0,avg:null,note:'No graded outcomes yet.'};
const av=U.avg(gs.map(d=>+d.rating));
return{n:gs.length,avg:Math.round(av*100)/100,note:gs.length<5?'Sample of '+gs.length+' — a trend, not a verdict. Grade more outcomes before trusting this number.':av>=3.5?'Outcomes holding. Watch whether premortems predicted the misses.':'Outcomes under 3.5 — your premortems are not pessimistic enough, or re-dates are hiding commitment rot.'};},
/* 15 — Cynefin classification with move hint */
cynefin(type,text){const t=(text||'').toLowerCase();
if(type==='crisis'||/outage|incident|down|breached|p0|sev1|data loss|security/.test(t))return{domain:'CHAOTIC',move:'Act first — stabilize, then sense. No root-cause debate inside the fire.'};
if(type==='ethics')return{domain:'CHAOTIC',move:'Act — remove immediate harm, escalate, document verbatim. Never mediate protected-class content.'};
if(type==='conflict'||type==='performance'||type==='behavior')return{domain:'COMPLICATED',move:'Sense–analyze–respond: gather both accounts and evidence, then decide. Expertise helps; delay does not.'};
if(type==='ramp'||type==='goal-risk'||type==='delegation-fail')return{domain:'COMPLEX',move:'Probe — run a small safe-to-fail experiment (one task, one checkpoint) before concluding.'};
return{domain:'COMPLICATED',move:'Analyze with evidence, decide, record the rationale.'};},
/* 16 — Eisenhower quadrant from sev + SLA runway */
eisenhower(sev,daysLeft){const urgent=sev>=4||daysLeft<=1;const important=sev>=3||daysLeft<=4;

if(!urgent&&important)return{q:'Q2 · SCHEDULE',hint:'Book it this week with a date, or it becomes Q1 with interest.'};
if(urgent&&!important)return{q:'Q3 · DELEGATE',hint:'Urgent for someone — hand it down with a rung and a checkpoint.'};

/* 17 — pulse composite across 6 dims */
healthComp(dims){const ks=['clarity','workload','energy','progress','trust','purpose'];
const vals=ks.map(k=>({k,v:+dims[k]||0}));const avg=U.avg(vals.map(x=>x.v));

/* 18 — bus risk per capability */
busRisk(cap){const h=(cap.holders||[]).length;

if(h===1&&cap.critical>=3)return{band:'CRITICAL',tone:'red',msg:'One holder, critical-3. Any resignation is an incident.'};

/* 19 — load pressure from open cases (sev-weighted) */
loadPress(st){const open=st.cases.filter(c=>c.status==='open');

const critN=open.filter(c=>c.sev>=4).length;if(critN)sc+=critN*8;
const bre=open.filter(c=>FW.caseSla(c).breached).length;if(bre){sc+=bre*6;parts.push(U.plural(bre,'SLA breach'));}
if(critN)parts.push(U.plural(critN,'critical case'));

/* 20 — case SLA runway: elapsed % from opened to due */
caseSla(c){const span=Math.max(1,U.dB(c.opened,c.slaDue));
const left=U.dB(U.today(),c.slaDue);const el=U.clamp(U.dB(c.opened,U.today())/span,0,1);

/* 21 — nine-box band + staleness */
nineBox(nb){if(!nb||!nb.at)return{band:'UNRATED',stale:true,age:null};
const p=+nb.perf,o=+nb.pot;const age=U.age(nb.at);const stale=age>120;
const band=p>=3&&o>=3?'STAR':p>=3?'WORKHORSE':o>=3?'ROUGH DIAMOND':p<=1&&o<=1?'MISFIT':'CORE';

/* 22 — estimated-aware morale slope (per week); estimated entries never move it */
moodSlope(entries){const mm=(entries||[]).filter(e=>!e.est&&e.v!=null).sort((a,b)=>a.at<b.at?-1:1);
if(mm.length<3)return null;
const t0=mm[0].at;const pts=mm.map(e=>({x:U.dB(t0,e.at)/7,y:+e.v}));
const mx=U.avg(pts.map(p=>p.x)),my=U.avg(pts.map(p=>p.y));
let num=0,den=0;pts.forEach(p=>{num+=(p.x-mx)*(p.y-my);den+=(p.x-mx)*(p.x-mx)});
return den?Math.round(num/den*100)/100:0;},
/* 23 — five-dysfunctions sequencer: advances only on written evidence */
dysfSeq(st){const stages=['Absence of trust','Fear of conflict','Lack of commitment','Avoidance of accountability','Inattention to results'];
const done=stages.map((s,i)=>!!(st.dysf&&st.dysf.notes&&st.dysf.notes[i]&&st.dysf.notes[i].text));
let cur=stages.findIndex((s,i)=>!done[i]);if(cur===-1)cur=stages.length;
return{stages,done,cur:Math.min(cur,stages.length-1),all:stages.every((s,i)=>done[i])};},
/* 24 — commitment debt both directions */
commDebt(st){const open=st.commitments.filter(c=>c.status==='open');
const youO=open.filter(c=>c.direction==='owe'&&c.due<U.today());
const themO=open.filter(c=>c.direction==='owed'&&c.due<U.today());
return{youOverdue:youO,themOverdue:themO,

/* 25 — pace governor */
pace(st){const lp=FW.loadPress(st);const debt=FW.commDebt(st);
const od=st.tasks.filter(t=>!t.done&&!t.cancelled&&t.due<U.today()).length;
const meet=FW.meetCost(st.meetings||[]);
let sc=lp.score+od*2+debt.youOverdue.length*3;
if(meet.youMin>=720)sc+=10;
sc=U.clamp(sc,0,100);
const band=sc<25?'GREEN':sc<45?'STEADY':sc<65?'LOADED':'REDLINE';
const why=[];if(lp.critN||lp.parts.length)why.push(lp.parts.join(' · '));

if(debt.youOverdue.length)why.push(U.plural(debt.youOverdue.length,'commitment you owe')+' past due');
if(meet.youMin>=720)why.push(Math.round(meet.youMin/60)+'h/wk of your calendar in recurring meetings');
if(lp.open)why.push(U.plural(lp.open,'open case'));
const advice={GREEN:'Capacity exists — invest it in Q2 work: bench, delegation, prevention. Calm is a resource; spend it forward.',
STEADY:'Normal load. Protect 1:1 cadence and your weekly ritual; they are the first things load eats.',
LOADED:'Above sustainable. Defer one thing explicitly today — silent slippage is how trust dies.',
REDLINE:'Do not start anything new. Stabilize the critical cases, renegotiate dates out loud, and say no to the next request.'}[band];
return{score:sc,band,why,advice};},
/* 26 — team pulse with stated fallback */
teamPulse(st,teamId){const sc=st.pulses.filter(p=>(p.teamId||null)===(teamId||null)).sort((a,b)=>a.at<b.at?1:-1)[0];
if(sc)return{pulse:sc,fallback:false};
if(teamId){const org=FW.teamPulse(st,null);return{pulse:org.pulse,fallback:true};}
return{pulse:null,fallback:false};},
/* 27 — org rollup per lead */
orgRollup(st,lead){const members=st.people.filter(p=>p.managerId===lead.id);
const open=st.cases.filter(c=>c.status==='open'&&c.scope&&((c.scope.kind==='team'&&c.scope.id===lead.id)||(c.scope.kind==='person'&&members.some(m=>m.id===c.scope.id))));
const flights=members.map(m=>({m,f:FW.flightRisk(st,m)})).sort((a,b)=>b.f.score-a.f.score);
const tp=FW.teamPulse(st,lead.id);
const span=members.length;
return{members,open,flights,pulse:tp.pulse,fallback:tp.fallback,span,spanTone:span>7?'red':span>5?'amber':'green'};},
/* 28 — bench score for succession into a lead seat */
benchScore(st,p){const reasons=[];let sc=0;
const nb=FW.nineBox(p.nineBox);
if(nb.band==='UNRATED'){reasons.push('Nine-box never stamped — the bench cannot judge what leadership has not looked at.');}
else{let pts=(+p.nineBox.perf+ +p.nineBox.pot)*10;if(nb.stale){pts=Math.round(pts/2);reasons.push('Nine-box stamp is '+nb.age+'d old — staleness halves its weight.');}sc+=pts;}
const autos=st.delegations.filter(d=>d.personId===p.id&&d.verdict==='autonomous').length;
if(autos){const pts=Math.min(16,autos*8);sc+=pts;reasons.push(U.plural(autos,'autonomous delegation')+' — has carried weight without rescue.');}
const bounced=st.delegations.filter(d=>d.personId===p.id&&d.verdict==='bounced').length;
if(bounced)reasons.push(U.plural(bounced,'bounced delegation')+' — growth edge not yet proven.');
const t=FW.trustEq(p.trust||{c:1,r:1,i:1,so:1});sc+=Math.round(Math.min(10,t.score));
const fl=FW.flightRisk(st,p);sc-=Math.round(fl.score/8);
const coachN=st.sessions.filter(s=>s.personId===p.id&&s.kind==='coach').length;
if(coachN)sc+=Math.min(6,coachN*3);
sc=U.clamp(sc,0,100);
const verdict=sc>=62?'READY NOW':sc>=38?'READY IN 6M':'GAP';
if(verdict==='GAP')reasons.push('Gap is closable: +'+(62-sc)+' points via two autonomous delegations and a current nine-box.');
return{score:sc,verdict,reasons};},
/* 29 — team bench across leads' members */
teamBench(st,lead){const ms=st.people.filter(p=>p.managerId===lead.id);
return ms.map(m=>({m,b:FW.benchScore(st,m)})).sort((a,b)=>b.b.score-a.b.score);},
/* 30 — transition score 0..100 from gates */
transScore(st){const tr=st.transition;const all=CONTENT.gates;
const closed=all.filter(g=>tr.gates&&tr.gates[g.id]&&tr.gates[g.id].closed).length;
const pctU=U.pct(closed,all.length);
const day=tr.started?U.age(tr.started)+1:0;
return{pct:pctU,closed,total:all.length,day,phase:day<=30?1:day<=60?2:3};},
/* 31 — 8-week sev-weighted case pressure series */
pressSeries(st){const weeks=[];for(let w=7;w>=0;w--){
const a=U.addD(U.today(),-7*w-6),b=U.addD(U.today(),-7*w);
const sc=st.cases.filter(c=>c.opened>=a&&c.opened<=b).reduce((x,c)=>x+c.sev,0);
const cl=st.cases.filter(c=>c.closedAt&&c.closedAt>=a&&c.closedAt<=b).length;
weeks.push({wk:b,sc,cl});}
return weeks;},
/* 32 — meeting load cost */
meetCost(ms){let youMin=0;const rows=(ms||[]).map(m=>{
const pm=(+m.minutes||0)*(+m.attendees||1);youMin+=+m.minutes||0;
return{m,personMin:pm,killed:m.verdict==='kill'};});
const live=rows.filter(r=>!r.killed);const liveYou=U.sum(live.map(r=>+r.m.minutes||0));
return{rows,youMin:liveYou,personMin:U.sum(live.map(r=>r.personMin))};},
/* 33 — staff-ritual agenda, computed purely from state */
ritualAgenda(st){const leads=st.people.filter(p=>p.isLead);
const perLead=leads.map(l=>{const roll=FW.orgRollup(st,l);
const hot=roll.flights.filter(f=>f.f.band==='HIGH');
return{lead:l,open:roll.open.length,maxSev:roll.open.length?Math.max.apply(null,roll.open.map(c=>c.sev)):0,hot:hot.length,
span:roll.span,
line:(roll.open.length?U.plural(roll.open.length,'open case')+' (max sev '+Math.max.apply(null,roll.open.map(c=>c.sev))+')':'no open cases')+' · '+U.plural(hot.length,'high flight risk')}}).sort((a,b)=>(b.maxSev*10+b.hot)-(a.maxSev*10+a.hot));
const org=[];
st.decisions.filter(d=>!d.decided&&d.deadline<U.today()).forEach(d=>org.push({k:'decision',t:'Ratify or kill: "'+d.title+'" — past its deadline ('+U.fmt(d.deadline)+'). Decisions rot silently.'}));
st.cases.filter(c=>c.status==='closed'&&c.sev>=4&&!st.aars.some(a=>a.caseId===c.id)).forEach(c=>org.push({k:'tuition',t:'Tuition unpaid: sev-'+c.sev+' case "'+c.title+'" closed without its AAR.'}));
const hc=st.pulses.length?FW.healthComp(st.pulses.slice().sort((a,b)=>a.at<b.at?1:-1)[0].dims):null;
if(hc&&hc.crit.length)org.push({k:'health',t:'Org pulse critical on: '+hc.crit.join(', ')+' — name one structural fix, not a pep talk.'});
st.goals.filter(g=>g.status==='active'&&FW.goalStatus(st,g).tone==='red').forEach(g=>org.push({k:'goal',t:'Goal "'+g.title+'" is '+FW.goalStatus(st,g).label.toLowerCase()+' — unblock, re-scope, or kill it in front of the leads.'}));
const dev=st.cases.filter(c=>c.status==='closed'&&c.lesson&&!c.ritualed).sort((a,b)=>a.closedAt<b.closedAt?1:-1)[0]||null;
return{perLead,org,dev};},
/* 34 — the machine's single answer */
nextBest(st,firing){const locked=firing.filter(a=>a.locked);
if(locked.length){const a=locked.sort((x,y)=>y.sev-x.sev)[0];
return{title:a.title,why:'Locked class outranks everything — this is the one the machine will not let sink. ('+a.why+')',route:a.route,cta:'Go now',tone:'bad'};}
const sev3=firing.filter(a=>!a.positive&&a.sev>=3).sort((a,b)=>b.sev-a.sev)[0];
if(sev3)return{title:sev3.title,why:'Highest-severity live advisory (sev '+sev3.sev+'). '+sev3.why,route:sev3.route,cta:'Handle it',tone:'warn'};
const task=st.tasks.filter(t=>!t.done&&!t.cancelled).sort((a,b)=>a.due<b.due?-1:1)[0];
if(task&&task.due<=U.today())return{title:task.title,why:'Oldest dated task — due '+U.fmt(task.due)+(task.due<U.today()?' ('+U.plural(U.age(task.due),'day')+' over)':'')+'. The queue respects dates; so should the day.',route:task.route||'#/today',cta:'Open',tone:'warn'};
const pos=firing.filter(a=>a.positive)[0];
if(pos)return{title:pos.title,why:'Nothing is burning and something is working — reinforcing the working is also the job. '+pos.why,route:pos.route,cta:'Reinforce',tone:'ok'};
if(task)return{title:task.title,why:'Next dated task ('+U.fmt(task.due)+'). Loose tasks die; dated ones land.',route:task.route||'#/today',cta:'Open',tone:''};
return{title:'Hold the cadence: run your next due 1:1 with evidence, not vibes.',why:'No advisories, no dated tasks. An unfed mentor is a screensaver — capture what happened today (case: / commit: / praise: / note: / win:).',route:'#/oneonones',cta:'Cadence',tone:'ok'};}
};

{id:'L1',arc:'The Seat',title:'You are the price of admission',body:'Your old job made you excellent at producing. This job pays you for multiplying. Every hour you spend doing instead of teaching is an hour taxed from five people. The first discipline of the seat: before any task, ask "who grows if I hand this down with a boundary?" The second: your calendar is your strategy made visible. Whatever you claim to value must appear on it, recurring, or it is a wish.',checks:[{q:'A critical deploy breaks. Two leads can handle it. You could handle it faster. You…',o:['Take it — speed matters, teach later','Assign a lead with a tight checkpoint and coach after','Split it: you stabilize, they watch'],a:1},{q:'Your calendar is best described as…',o:['A record of what happened to you','Your strategy made visible — values appear as recurring blocks','A list of meetings others booked'],a:1},{q:'The hour you spend doing work a report could do costs…',o:['One hour','One hour plus the growth of everyone who watches you do it','Nothing — you are fastest'],a:1}]},

{id:'L4',arc:'The People',title:'Correction is a scalpel, not a volume knob',body:'The SBI frame exists because behavior changes when the person can see it: Situation (one, dated), Behavior (observable, no verdict words), Impact (stakes, numbers, names of those affected). Deliver within 72 hours or the lesson decays into folklore. Then the part everyone skips: +21 days later, verify with an artifact, not a feeling. A correction without verification is a complaint. Three failed corrections is not a louder correction — it is a different case entirely.',checks:[{q:'Which is a behavior?',o:['"You were dismissive"','"You interrupted Priya twice before she finished the risk list"','"You have an attitude problem"'],a:1},{q:'A correction delivered, never verified, is…',o:['Complete — you said your piece','A complaint — the loop never closed','Best practice for seniors'],a:1},{q:'The +21d verification exists because…',o:['HR policy','Behavior change shows (or does not) in about three weeks of artifacts','It rounds to a month'],a:1}]},
{id:'L5',arc:'The System',title:'Decisions are assets; treat them like code',body:'Type-1 doors (one-way) get premortems and deadlines held tight; type-2 doors (reversible) get decided fast and graded later. Both get recorded: context, options, the call, the date. A decision that is re-dated twice without a written reason is not delayed — it is unmade, expensively, in secret. Grading outcomes is not self-flagellation; it is the only calibration loop a decision-maker has.',checks:[{q:'A type-2 (reversible) decision sits undecided for 9 days. The failure is…',o:['Nothing — caution is free','Speed: reversible doors are cheap to walk back, expensive to hover at','The premortem was too short'],a:1},{q:'Re-dating a decision requires…',o:['A new date','A new date and a written reason, on the record','Approval from above'],a:1},{q:'Outcome grading primarily serves…',o:['Accountability reviews','Your calibration — the only feedback loop deciding has','The archive'],a:1}]},
{id:'L6',arc:'The Self',title:'The machine serves judgment, never replaces it',body:'An advisory system trains you in two directions at once: what to notice, and — if you let it — what to stop noticing. The contract: the machine owns detection, sequencing, record-keeping, and escalation timing. You own the call, the words, and the room. When you disagree with an advisory, snooze it with a date, not a deletion — disagreement recorded is judgment exercised; disagreement silent is sleepwalking. Trust here means auditability, and you are the auditor.',checks:[{q:'The app ranks an advisory you disagree with at the top. Correct move:',o:['Act on it — the rules know more','Snooze it with a date and your reasoning; revisit when the date lands','Ignore it and let it age'],a:1},{q:'"The app owns escalation timing" means…',o:['It contacts HR for you','It hard-stops the workflow and makes you choose consciously, with the record showing you chose','It decides what is ethics-adjacent'],a:1},{q:'The deepest risk of a mentor app is…',o:['Bad data','A compliant operator who collapses when reality deviates from script','Notification noise'],a:1}]}

{id:'skip-never',cat:'people',sev:1,title:()=>'No skip-level in 90+ days — you are flying on conduit alone',why:()=>'Skip-levels calibrate what your leads tell you. Calibrate, never adjudicate: listen, then coach the lead on what you heard.',route:()=>'#/oneonones',test:st=>{const skips=st.sessions.filter(s=>s.kind==='skip');return st.people.some(p=>p.managerId&&!skips.some(s=>s.personId===p.id&&U.age(s.at)<=90));}},
/* org */
{id:'span-pressure',cat:'org',sev:2,title:st=>{const l=ST.people.filter(p=>p.isLead).find(l=>Q.membersOf(l.id).length>7);return 'Span pressure: '+(l?l.name+' carries '+Q.membersOf(l.id).length+' reports':'a lead is past 7 reports');},why:()=>'Past seven reports, 1:1s turn triage and feedback thins. The fix is structural: split the team or promote a lead under them — bench first.',route:()=>'#/org',test:st=>ST.people.some(p=>p.isLead&&Q.membersOf(p.id).length>7)},
{id:'bench-thin',cat:'org',sev:2,title:st=>{const l=ST.people.filter(p=>p.isLead).find(l=>{const b=FW.teamBench(st,l);return b.length&&b[0].b.verdict==='GAP';});return 'Bench gap behind '+(l?l.name:'a lead seat')+' — no READY successor',why:()=>'If a lead resigned Monday, who sits in that chair Wednesday? GAP with no plan is a resignation you have not received yet.',route:()=>'#/org',test:st=>ST.people.some(p=>p.isLead&&(()=>{const b=FW.teamBench(st,p);return b.length&&b[0].b.verdict==='GAP';})())},
/* transition */
{id:'tour-gap',cat:'transition',sev:2,title:st=>{const s=(st.transition.stakeholders||[]).find(s=>s.stance<0&&!s.touredAt);return 'Hostile stakeholder unheard'+(s?': '+s.name+' ('+s.role+')':'');},why:()=>'The name you least want to tour is the tour that moves the protocol. Opponents briefed late become blockers briefed never.',route:()=>'#/transition',test:st=>!!(st.transition.started&&U.age(st.transition.started)>13&&(st.transition.stakeholders||[]).some(s=>s.stance<0&&!s.touredAt))},
{id:'gate-lag',cat:'transition',sev:2,title:st=>{const ts=FW.transScore(st);return 'Transition day '+ts.day+' — '+ts.closed+'/'+ts.total+' gates closed (behind the protocol line)';},why:()=>'Gates are evidence-gated hints, not truth — but falling behind the line with pending signals means the rooms are happening and the record is not, or nothing is happening at all. Both are information.',route:()=>'#/transition',test:st=>{if(!st.transition.started)return false;const ts=FW.transScore(st);if(ts.day>95)return false;return ts.closed<Math.floor(U.clamp(ts.day,0,90)/90*ts.total)-1;}},
{id:'transition-stall',cat:'transition',sev:1,title:()=>'No transition gate closed in 21 days',why:()=>'Stalls are decisions. Either the protocol is wrong (re-plan explicitly) or the protocol is right and unfed (feed it this week).',route:()=>'#/transition',test:st=>{if(!st.transition.started)return false;const closes=CONTENT.gates.map(g=>st.transition.gates&&st.transition.gates[g.id]&&st.transition.gates[g.id].closed?st.transition.gates[g.id].at:null).filter(Boolean).sort().pop();return closes?U.age(closes)>21:U.age(st.transition.started)>21;}},
{id:'win-banked',cat:'transition',sev:1,positive:true,title:st=>{const w=(st.transition.wins||[])[0];return 'Win banked recently: "'+(w?w.text.slice(0,52):'')+(w&&w.text.length>52?'…':'')+'"';},why:()=>'Early wins banked publicly buy the authority for the hard moves later. Bank them, attribute them to the team.',route:()=>'#/transition',test:st=>(st.transition.wins||[]).some(w=>U.age(w.at)<=14)},
/* feedback */
{id:'fb-praise-age',cat:'feedback',sev:2,title:st=>{const f=st.feedback.filter(f=>f.kind==='praise'&&f.status==='draft'&&U.age(f.created)>=2);return U.plural(f.length,'praisedraft'.replace('draft',' draft'))+' stale past 48h';},why:()=>'Praise has a half-life of about 48 hours. Delivered late it teaches "my wins surface on your schedule".',route:()=>'#/feedback',test:st=>st.feedback.some(f=>f.kind==='praise'&&f.status==='draft'&&U.age(f.created)>=2)},
{id:'fb-corr-age',cat:'feedback',sev:3,title:st=>{const f=st.feedback.filter(f=>f.status==='draft'&&f.kind!=='praise'&&U.age(f.created)>=3);return U.plural(f.length,'correction draft')+' past the 72h decay line';},why:()=>'A correction older than 72 hours delivers as folklore: emotionally hot, factually cold. Refresh the evidence or drop it honestly.',route:()=>'#/feedback',test:st=>st.feedback.some(f=>f.status==='draft'&&f.kind!=='praise'&&U.age(f.created)>=3)},
{id:'fb-verify-due',cat:'feedback',sev:2,title:st=>{const f=st.feedback.find(f=>f.kind!=='praise'&&f.status==='delivered'&&f.verifyAt&&f.verifyAt<=U.today()&&!f.lapsedCaseId&&f.verifyAt>=U.addD(U.today(),-7));return 'Correction verification due'+(f?' — '+Q.first(f.personId)+', delivered '+U.fmt(f.deliveredAt):'');},why:()=>'Delivered is not changed. The +21d check with one observable artifact is what separates feedback from complaint.',route:()=>'#/feedback',test:st=>st.feedback.some(f=>f.kind!=='praise'&&f.status==='delivered'&&f.verifyAt&&f.verifyAt<=U.today()&&!f.lapsedCaseId&&f.verifyAt>=U.addD(U.today(),-7))},
{id:'fb-lapsed-grace',cat:'feedback',sev:3,title:st=>{const f=st.feedback.find(f=>f.kind!=='praise'&&f.status==='delivered'&&f.verifyAt&&f.verifyAt<U.today()&&f.verifyAt>=U.addD(U.today(),-7)&&!f.lapsedCaseId);return 'Verification lapsing'+(f?' for '+Q.first(f.personId):'')+' — machine arm opens a case at +7d grace';},why:()=>'The machine opens a feedback-breakdown case at day 7 of lapse, idempotently and announced. Acting before then is the cheaper path.',route:()=>'#/feedback',test:st=>st.feedback.some(f=>f.kind!=='praise'&&f.status==='delivered'&&f.verifyAt&&f.verifyAt<U.today()&&f.verifyAt>=U.addD(U.today(),-7)&&!f.lapsedCaseId)},
{id:'fb-balance-off',cat:'feedback',sev:1,title:st=>'Feedback balance out of zone: '+FW.fbBalance(st).zone.toLowerCase(),why:()=>'30-day delivered ratio outside 60–85% praise. Correction-heavy teams get compliant and quiet; praise-only teams get fragile and surprised.',route:()=>'#/feedback',test:st=>{const b=FW.fbBalance(st);return b.tot>=4&&(b.ratio<0.6||b.ratio>0.85);}},
{id:'praise-flow',cat:'feedback',sev:1,positive:true,title:st=>U.plural(st.feedback.filter(f=>f.kind==='praise'&&f.status==='delivered'&&U.age(f.deliveredAt)<=14).length,'praise')+' delivered in 14 days',why:()=>'Specific, evidence-backed praise is the cheapest retention instrument that exists — and the machine confirms you are using it.',route:()=>'#/feedback',test:st=>st.feedback.filter(f=>f.kind==='praise'&&f.status==='delivered'&&U.age(f.deliveredAt)<=14).length>=3},
/* commitments */
{id:'comm-debt-you',cat:'commitments',sev:2,title:st=>U.plural(FW.commDebt(st).youOverdue.length,'commitment you owe')+' past due — your word is the asset under management',why:()=>'Ranked above their debt on purpose: a mentor that only audits downward trains its user to audit downward. Close it or renegotiate it out loud, today.',route:()=>'#/today',test:st=>FW.commDebt(st).youOverdue.length>0},
{id:'comm-debt-them',cat:'commitments',sev:1,title:st=>U.plural(FW.commDebt(st).themOverdue.length,'commitment owed to you')+' past due',why:()=>'Chase it or release it explicitly — silently dropped commitments teach the org that dates are decorative.',route:()=>'#/today',test:st=>FW.commDebt(st).themOverdue.length>0},
{id:'comm-broken-you',cat:'commitments',sev:3,title:st=>U.plural(FW.commDebt(st).youBroken.length,'commitment')+' you broke on the record',why:()=>'A broken commitment unacknowledged is a withdrawal with interest from every trust equation on your board. Name it to the person and re-commit with a date.',route:()=>'#/today',test:st=>FW.commDebt(st).youBroken.length>0},
{id:'comm-broken-them',cat:'commitments',sev:1,title:st=>U.plural(FW.commDebt(st).themBroken.length,'commitment')+' broken toward you',why:()=>'Pattern, not incident, after the second one: feed the reliability numerator on their trust page, and say the pattern out loud once.',route:()=>'#/today',test:st=>FW.commDebt(st).themBroken.length>0},
/* cases */
{id:'case-sla-breach',cat:'cases',sev:4,title:st=>{const c=st.cases.filter(c=>c.status==='open'&&FW.caseSla(c).breached).sort((a,b)=>a.slaDue<b.slaDue?-1:1)[0];return 'SLA breached: "'+(c?c.title.slice(0,48):'')+'" ('+(c?U.plural(U.age(c.slaDue),'day'):'')+' over)';},why:()=>'The runway bars exist so nothing breaches quietly. A breached SLA is not a failure of the record — it is a failure of the last three days.',route:st=>{const c=st.cases.filter(c=>c.status==='open'&&FW.caseSla(c).breached).sort((a,b)=>a.slaDue<b.slaDue?-1:1)[0];return '#/case/'+(c?c.id:'');},test:st=>st.cases.some(c=>c.status==='open'&&FW.caseSla(c).breached)},
{id:'case-sla-tight',cat:'cases',sev:2,title:st=>{const c=st.cases.filter(c=>c.status==='open'&&!FW.caseSla(c).breached&&FW.caseSla(c).left<=1)[0];return c?'"'+c.title.slice(0,46)+'" hits its SLA within a day':'SLA tight';},why:()=>'Tomorrow against the wall beats yesterday through it. Move now or consciously re-sequence — drift chooses for you.',route:st=>{const c=st.cases.filter(c=>c.status==='open'&&!FW.caseSla(c).breached&&FW.caseSla(c).left<=1)[0];return '#/case/'+(c?c.id:'');},test:st=>st.cases.some(c=>c.status==='open'&&!FW.caseSla(c).breached&&FW.caseSla(c).left<=1)},
{id:'case-pattern',cat:'cases',sev:2,title:st=>{const c=st.cases.find(c=>c.status==='open'&&(c.links||[]).some(l=>{const o=Q.caseById(l);return o&&o.status==='open';}));return c?'Two live cases share one scope: "'+c.title.slice(0,40)+'"':'Linked live cases detected';},why:()=>'Two open cases on one person or team is a pattern with a single root. Solve the root or register the meta-case.',route:st=>{const c=st.cases.find(c=>c.status==='open'&&(c.links||[]).some(l=>{const o=Q.caseById(l);return o&&o.status==='open';}));return '#/case/'+(c?c.id:'');},test:st=>st.cases.some(c=>c.status==='open'&&(c.links||[]).some(l=>{const o=Q.caseById(l);return o&&o.status==='open';}))},
{id:'case-verify-due',cat:'cases',sev:2,title:st=>{const c=st.cases.find(c=>c.status==='closed'&&c.verifyAt&&c.verifyAt<=U.today()&&!c.verified);return c?'+30d verification due: "'+c.title.slice(0,44)+'"':'Case verification due';},why:()=>'Closed is a claim; verified is the evidence. Held, or re-opened on the record — there is no third option that keeps the ledger honest.',route:st=>{const c=st.cases.find(c=>c.status==='closed'&&c.verifyAt&&c.verifyAt<=U.today()&&!c.verified);return '#/case/'+(c?c.id:'');},test:st=>st.cases.some(c=>c.status==='closed'&&c.verifyAt&&c.verifyAt<=U.today()&&!c.verified)},
{id:'tuition-unpaid',cat:'cases',sev:3,title:st=>{const c=st.cases.find(c=>c.status==='closed'&&c.sev>=4&&!st.aars.some(a=>a.caseId===c.id));return 'Tuition unpaid: sev-'+(c?c.sev:'?')+' case closed without its AAR';},why:()=>'Every sev-4+ event is tuition. Skipping the AAR means paying it again next quarter with interest and morale.',route:st=>{const c=st.cases.find(c=>c.status==='closed'&&c.sev>=4&&!st.aars.some(a=>a.caseId===c.id));return '#/case/'+(c?c.id:'#/aar');},test:st=>st.cases.some(c=>c.status==='closed'&&c.sev>=4&&!st.aars.some(a=>a.caseId===c.id))},
/* delegation */
{id:'del-checkpoint',cat:'delegation',sev:2,title:st=>{const d=st.delegations.find(d=>!d.verdict&&d.checkpointAt<U.today());return 'Delegation checkpoint overdue'+(d?': '+Q.first(d.personId)+' · "'+d.task.slice(0,36)+'"':'');},why:()=>'A checkpoint that slides silently is abdication wearing a delegation costume. Verdict it: autonomous, supported, or bounced — all three are data.',route:()=>'#/delegation',test:st=>st.delegations.some(d=>!d.verdict&&d.checkpointAt<U.today())},
{id:'rung-mismatch',cat:'delegation',sev:2,title:st=>{const d=st.delegations.find(d=>!d.verdict&&FW.rungCheck(d.rung,FW.slii(d.skill,d.will).rung).tone==='red');return d?'Over-delegated: '+Q.first(d.personId)+' holds rung '+d.rung+' on a rung-'+FW.slii(d.skill,d.will).rung+' diagnosis':'Rung mismatch live';},why:()=>'Handing rung-5 ownership to a rung-2 diagnosis is how crises are manufactured. Re-contract on the record before the checkpoint teaches it for you.',route:()=>'#/delegation',test:st=>st.delegations.some(d=>!d.verdict&&FW.rungCheck(d.rung,FW.slii(d.skill,d.will).rung).tone==='red')},
{id:'del-thin',cat:'delegation',sev:1,title:()=>'No new delegation contracted in 30 days',why:()=>'A leader of leads who delegates nothing becomes the bottleneck with a title. What are you doing today that grows no one?',route:()=>'#/delegation',test:st=>st.people.length>0&&!st.delegations.some(d=>U.age(d.at)<=30)},
{id:'autonomy-trend',cat:'delegation',sev:1,positive:true,title:st=>U.plural(st.delegations.filter(d=>d.verdict==='autonomous'&&U.age(d.verdictAt||d.at)<=60).length,'autonomous verdict')+' in 60 days',why:()=>'Work held without rescue is the bench growing on schedule. Say so to the person, by name, with the artifact.',route:()=>'#/delegation',test:st=>st.delegations.filter(d=>d.verdict==='autonomous'&&U.age(d.verdictAt||d.at)<=60).length>=2},
/* goals */
{id:'goal-checkin-stale',cat:'goals',sev:2,title:st=>{const g=st.goals.find(g=>g.status==='active'&&(!g.checkins.length||U.age(g.checkins[g.checkins.length-1].at)>14));return g?'No check-in on "'+g.title+'" for 14+ days':'Goal check-ins stale';},why:()=>'A goal without fresh numbers is a poster, not a plan. Check-ins are two numbers and one sentence — the discipline is the cheap part.',route:()=>'#/goals',test:st=>st.goals.some(g=>g.status==='active'&&(!g.checkins.length||U.age(g.checkins[g.checkins.length-1].at)>14))},
{id:'goal-expired',cat:'goals',sev:2,title:st=>{const g=st.goals.find(g=>g.status==='active'&&g.deadline<U.today());return g?'"'+g.title+'" expired ungraded — '+U.plural(U.age(g.deadline),'day')+' ago':'Goal expired ungraded';},why:()=>'Ungraded expired goals teach the org that deadlines are weather. Grade it with the causal lesson — achieved, partial, or missed all count.',route:()=>'#/goals',test:st=>st.goals.some(g=>g.status==='active'&&g.deadline<U.today())},
{id:'goal-conf-fall',cat:'goals',sev:2,title:st=>{const g=st.goals.find(g=>g.status==='active'&&FW.confSlope(g)!==null&&FW.confSlope(g)<=-1);return g?'Confidence collapsing on "'+g.title+'" (slope '+FW.confSlope(g)+'/wk)':'Confidence collapsing on a goal';},why:()=>'Confidence is the leading indicator — owners go quiet weeks before deadlines move. Ask what they know that the numbers do not.',route:()=>'#/goals',test:st=>st.goals.some(g=>g.status==='active'&&FW.confSlope(g)!==null&&FW.confSlope(g)<=-1)},
{id:'goal-atcase',cat:'goals',sev:3,title:st=>{const g=st.goals.find(g=>g.status==='active'&&g.atRisk&&Q.caseById(g.atRisk)&&Q.caseById(g.atRisk).status==='open');return g?'"'+g.title+'" rides on an open case ("'+Q.caseById(g.atRisk).title.slice(0,32)+'…")':'Goal held hostage by open case';},why:()=>'The flag is wired: the goal cannot honestly report green while its case is open. Close the case or re-scope the goal — one of them is the real work.',route:st=>{const g=st.goals.find(g=>g.status==='active'&&g.atRisk&&Q.caseById(g.atRisk)&&Q.caseById(g.atRisk).status==='open');return '#/case/'+(g?g.atRisk:'');},test:st=>st.goals.some(g=>g.status==='active'&&g.atRisk&&Q.caseById(g.atRisk)&&Q.caseById(g.atRisk).status==='open')},
/* decisions */
{id:'dec-rotting',cat:'decisions',sev:2,title:st=>{const d=st.decisions.find(d=>!d.decided&&d.deadline<U.today());return 'Decision rotting: "'+(d?d.title.slice(0,44)+'" — '+U.plural(U.age(d.deadline),'day')+' past deadline':'"');},why:()=>'Rotting decisions get made anyway — by drift, by the loudest voice, by events. Decide, or re-date with a written reason on the record.',route:()=>'#/decisions',test:st=>st.decisions.some(d=>!d.decided&&d.deadline<U.today())},
{id:'dec-redate-loop',cat:'decisions',sev:2,title:st=>{const d=st.decisions.find(d=>!d.decided&&(d.reHistory||[]).length>=3);return 'Re-date loop: "'+(d?d.title.slice(0,40)+'" re-dated '+d.reHistory.length+' times':'"');},why:()=>'Three written re-dates means the reason nobody writes is "afraid to be wrong". A bad decision graded beats a perfect one retired by silence.',route:()=>'#/decisions',test:st=>st.decisions.some(d=>!d.decided&&(d.reHistory||[]).length>=3)},
{id:'door1-slow',cat:'decisions',sev:2,title:st=>{const d=st.decisions.find(d=>!d.decided&&d.type===1&&U.age(d.at)>7);return 'One-way door open 7+ days'+(d?': "'+d.title.slice(0,38)+'"':'');},why:()=>'Type-1 doors deserve the premortem AND the deadline. If it needs more time it was misclassified or under-staffed — say which.',route:()=>'#/decisions',test:st=>st.decisions.some(d=>!d.decided&&d.type===1&&U.age(d.at)>7)},
/* health */
{id:'pulse-overdue',cat:'health',sev:2,title:()=>'Org pulse older than 14 days — flying on stale instruments',why:()=>'The fortnight pulse is six sliders and one sentence. Instruments you do not read are decorations you dust.',route:()=>'#/health',test:st=>!st.pulses.length||U.age(st.pulses.slice().sort((a,b)=>a.at<b.at?1:-1)[0].at)>14},
{id:'dim-critical',cat:'health',sev:3,title:st=>{const latest=st.pulses.slice().sort((a,b)=>a.at<b.at?1:-1)[0];const h=latest?FW.healthComp(latest.dims):null;return h&&h.crit.length?('Org pulse critical on: '+h.crit.join(', ')):'Pulse dimension critical';},why:()=>'Any dimension at 2 or below is a descriptor of next quarter\'s attrition email, written early. Structural fix, not pep talk.',route:()=>'#/health',test:()=>{const latest=ST.pulses.slice().sort((a,b)=>a.at<b.at?1:-1)[0];return latest&&FW.healthComp(latest.dims).crit.length>0;}},
{id:'safety-fragile',cat:'health',sev:3,title:st=>{const s=st.safety.slice().sort((a,b)=>a.at<b.at?1:-1)[0];return 'Psychological safety '+ (s?s.band.toLowerCase():'fragile') +' (Edmondson '+(s?s.score:'—')+')';},why:()=>'Low safety means your data is already lying to you: bad news dies before it reaches you. Work the ladder from trust, not from metrics.',route:()=>'#/health',test:()=>{const s=ST.safety.slice().sort((a,b)=>a.at<b.at?1:-1)[0];return s&&s.band==='FRAGILE';}},
{id:'safety-stale',cat:'health',sev:1,title:()=>'Edmondson scan older than 60 days',why:()=>'Safety moves slowly until it moves suddenly. Quarterly is the minimum honest sampling rate.',route:()=>'#/health',test:()=>{const s=ST.safety.slice().sort((a,b)=>a.at<b.at?1:-1)[0];return !s||U.age(s.at)>60;}},
{id:'dysf-stall',cat:'health',sev:1,title:st=>{const d=FW.dysfSeq(st);return 'Dysfunctions ladder parked at "'+d.stages[d.cur]+'"';},why:()=>'The ladder advances on written evidence only. If evidence stopped, either the work stopped or the honesty did — both deserve a look.',route:()=>'#/health',test:st=>{const d=FW.dysfSeq(st);if(d.all)return false;const lastNote=(st.dysf.notes&&Object.keys(st.dysf.notes).length)?st.dysf.notes[Math.max.apply(null,Object.keys(st.dysf.notes).map(Number))]:null;const ref=lastNote?lastNote.at:(st.dysf.since||st.me.startDate);return ref?U.age(ref)>45:false;}},
/* mediation */
{id:'med-stall',cat:'mediation',sev:2,title:st=>{const m=st.mediations.find(m=>!m.halted&&!m.resolved&&U.age(m.movedAt||m.at)>14);return m?'Mediation stalled at stage '+(m.stage+1)+' ("'+m.title.slice(0,36)+'")':'Mediation stalled';},why:()=>'Mediation has a shelf life. Past two weeks in one stage, the parties conclude the process is the punishment.',route:()=>'#/mediation',test:st=>st.mediations.some(m=>!m.halted&&!m.resolved&&U.age(m.movedAt||m.at)>14)},
/* coach */
{id:'coach-thin',cat:'coach',sev:1,title:()=>'No coaching session logged in 30 days',why:()=>'Telling produces compliance; coaching produces judgment — and judgment is the thing you cannot hire back. One GROW rep a week keeps the muscle.',route:()=>'#/coach',test:st=>st.people.length>0&&!st.sessions.some(s=>s.kind==='coach'&&U.age(s.at)<=30)},
/* ritual + meetings */
{id:'ritual-overdue',cat:'rhythm',sev:2,title:()=>'Staff ritual not held in 8+ days',why:()=>'The weekly hour where your leads align is the operating system\'s heartbeat. Skip two and the teams start syncing by rumor.',route:()=>'#/ritual',test:st=>ST.people.some(p=>p.isLead)&&!(st.rituals||[]).some(r=>r.heldAt&&U.age(r.heldAt)<=8)},
{id:'meet-load',cat:'rhythm',sev:2,title:st=>'Recurring meetings eat '+Math.round(FW.meetCost(st.meetings).youMin/60)+'h/wk of your calendar',why:()=>'Twelve-plus hours of recurring meetings is a second job on top of leading. The kill list is on #/ritual — every kept meeting should argue for its seat.',route:()=>'#/ritual',test:st=>FW.meetCost(st.meetings).youMin>=720},
{id:'meet-kill-pending',cat:'rhythm',sev:1,title:st=>U.plural((st.meetings||[]).filter(m=>!m.verdict).length,'recurring meeting')+' never verdicted (keep / fix / kill)',why:()=>'Meetings inherit immortality by default. A verdict ledger forces each one to earn its recurrence at least once.',route:()=>'#/ritual',test:st=>(st.meetings||[]).some(m=>!m.verdict)},
/* rhythm / system */
{id:'export-overdue',cat:'system',sev:2,title:()=>'No backup export in 14+ days — the only copy of everything is in one browser profile',why:()=>'localStorage is cleared with site data, dies with the profile, and never apologizes. Export is 4KB of insurance on #/data.',route:()=>'#/data',test:st=>!st.exports.lastAt||U.age(st.exports.lastAt)>14},
{id:'review-overdue',cat:'system',sev:2,title:()=>'Weekly review not stamped in 7+ days',why:()=>'The review loop is the actual course substitute — experience without the loop is just repetition. 60 seconds, stamped, on #/review.',route:()=>'#/review',test:st=>!st.lastReviewAt||U.age(st.lastReviewAt)>7},
{id:'example-live',cat:'system',sev:1,title:()=>'Example org still loaded — real decisions pollute demo data',why:()=>'Everything currently on screen is a rehearsal. Set your identity on #/data, then erase the example when your real org arrives.',route:()=>'#/data',test:st=>!!st.examples},
{id:'store-pressure',cat:'system',sev:2,title:()=>'Storage past 70% of the ~5MB budget',why:()=>'Quota failures surface as WRITE FAILED in the top bar — that is the loud failure. Prune from #/data before you meet it mid-crisis.',route:()=>'#/data',test:()=>store.sizeKB>3500}
];
const RULES_HLP={

};

/* ================= INTEGRITY — executable audit classes, on demand; count live ================= */
const INTEGRITY={
_cache:{at:0,res:[]},
runCached(){if(Date.now()-INTEGRITY._cache.at>4000){INTEGRITY._cache={at:Date.now(),res:INTEGRITY.run(ST)};}return INTEGRITY._cache.res;},
invalidate(){INTEGRITY._cache.at=0;},
classes:[
{id:'ethics-wires',title:'Ethics wires sealed',desc:'An ethics case may carry only evidence + hr-task wires. Anything else means automation touched protected content.',fixable:true},
{id:'dup-cases',title:'Duplicate cases',desc:'Identical open case (type + title + scope) must not exist twice.',fixable:false},
{id:'wire-refs',title:'Wire referents',desc:'Every ledger wire with a ref must resolve to a live record. Dangling wires get de-referenced honestly, never deleted silently.',fixable:true},
{id:'goal-flags',title:'Goal flag owners',desc:'A goal at-risk flag must point at an open case that points back.',fixable:true},
{id:'verify-arms',title:'Closure verification armed',desc:'Every closed case carries a +30d verify state (verified or still armed).',fixable:true},
{id:'telemetry-honest',title:'Telemetry honesty (executed probe)',desc:'Estimated pulses must not move the mood slope. Runs FW.moodSlope on a synthetic series with estimated entries and asserts invariance — plus range checks.',fixable:false},
{id:'commitment-shape',title:'Commitment shape',desc:'direction ∈ {owe,owed}, status ∈ {open,done,broken}, ISO due, resolvable person.',fixable:false},
{id:'premortem-floor',title:'Premortem floor',desc:'Undecided type-1 decisions need ≥3 premortem entries (the form enforces it; this catches imports).',fixable:false},
{id:'case-sla',title:'Case SLA sanity',desc:'Open case slaDue ≥ opened, sev known, type known.',fixable:true},
{id:'ledger-shape',title:'Ledger shape',desc:'Every wire has id/kind/label/at.',fixable:false},
{id:'session-shape',title:'Session shape',desc:'kind ∈ {1:1,tour,skip,coach}, ISO date, mood values within 1–5 when present.',fixable:false},
{id:'agenda-people',title:'Agenda referents',desc:'Agenda items resolve to live people.',fixable:true},
{id:'bench-computable',title:'Bench smoke test',desc:'FW.benchScore must not throw on any real person and must return a known verdict.',fixable:false},
{id:'person-graph',title:'Manager graph',desc:'managerId resolves or is null; no self-management; no cycles of length ≤ 4.',fixable:true},
{id:'storage-shape',title:'Storage shape',desc:'Record declares v:6, collections are arrays, JSON round-trips.',fixable:false}
],
run(st){return INTEGRITY.classes.map(cl=>({id:cl.id,title:cl.title,desc:cl.desc,fixable:cl.fixable,faults:INTEGRITY['a_'+cl.id.replace(/-/g,'_')](st)}));},
repair(st,id){const fn=INTEGRITY['r_'+id.replace(/-/g,'_')];return fn?fn(st):'No mechanical repair — this class requires a human call.';},
a_ethics_wires(st){const f=[];st.cases.filter(c=>c.type==='ethics').forEach(c=>{(c.wires||[]).forEach(w=>{if(CONTENT.ethicsWires.indexOf(w.kind)<0)f.push('Ethics case "'+c.title.slice(0,30)+'" carries a '+w.kind+' wire — automation leaked onto protected content.');});});return f;},
r_ethics_wires(st){let n=0;st.cases.filter(c=>c.type==='ethics').forEach(c=>{const bad=(c.wires||[]).filter(w=>CONTENT.ethicsWires.indexOf(w.kind)<0);
bad.forEach(w=>{n++;if(w.kind==='agenda'||w.kind==='cascade')st.agenda=st.agenda.filter(a=>a.id!==w.ref);
if(w.kind==='playbook'||w.kind==='closure-verify')st.tasks=st.tasks.filter(t=>t.id!==w.ref);
if(w.kind==='sbi')st.feedback=st.feedback.filter(x=>x.id!==w.ref);
if(w.kind==='decision-stub')st.decisions=st.decisions.filter(x=>x.id!==w.ref);
if(w.kind==='goal-flag')st.goals.forEach(g=>{if(g.atRisk===c.id)g.atRisk=null;});
if(w.kind==='team-note')st.teamNotes=st.teamNotes.filter(x=>x.id!==w.ref);});
c.wires=(c.wires||[]).filter(w=>CONTENT.ethicsWires.indexOf(w.kind)>=0);});
return n?'Revoked '+n+' wire record(s) — records removed, not just ledger lines.':'Nothing to repair.';},
a_dup_cases(st){const f=[];const seen={};st.cases.filter(c=>c.status==='open').forEach(c=>{const k=c.type+'|'+c.title.trim().toLowerCase()+'|'+(c.scope?c.scope.kind+':'+c.scope.id:'-');if(seen[k])f.push('Duplicate open case: "'+c.title.slice(0,34)+'" ×2 — merge them by hand.');else seen[k]=1;});return f;},
a_wire_refs(st){const f=[];st.cases.forEach(c=>(c.wires||[]).forEach(w=>{if(!w.ref)return;
if(!INTEGRITY._resolve(st,w))f.push('Case "'+c.title.slice(0,28)+'" wire ['+w.kind+'] dangles — referent gone.');}));return f;},
_resolve(st,w){const pools=[[st.tasks],[st.agenda],[st.feedback],[st.decisions],[st.goals],[st.teamNotes]];
for(const pool of pools){if(pool[0].some(r=>r.id===w.ref))return true;}
return st.people.some(p=>(p.evidence||[]).some(e=>e.id===w.ref));},
r_wire_refs(st){let n=0;st.cases.forEach(c=>{(c.wires||[]).forEach(w=>{if(w.ref&&!INTEGRITY._resolve(st,w)){w.label+=' (referent revoked '+U.fmt(U.today())+')';w.ref=null;w.route=null;n++;}})});return n?'De-referenced '+n+' dangling wire(s) — the ledger keeps the line, honestly marked revoked.':'Nothing to repair.';},
a_goal_flags(st){const f=[];st.goals.forEach(g=>{if(g.atRisk){const c=Q.caseById(g.atRisk);if(!c)f.push('Goal "'+g.title.slice(0,26)+'" flags a missing case.');else if(c.status!=='open')f.push('Goal "'+g.title.slice(0,26)+'" holds a flag owned by a closed case.');if(c&&!(c.wires||[]).some(w=>w.kind==='goal-flag'&&w.ref===g.id))f.push('Goal "'+g.title.slice(0,26)+'" flag has no return wire on the case.');}});return f;},
r_goal_flags(st){let n=0;st.goals.forEach(g=>{if(g.atRisk){const c=Q.caseById(g.atRisk);if(!c||c.status!=='open'){g.atRisk=null;n++;}}});return n?'Cleared '+n+' orphaned goal flag(s). Flags are owned by their closure — or cleared by this repair.':'Nothing to repair.';},
a_verify_arms(st){const f=[];st.cases.filter(c=>c.status==='closed').forEach(c=>{if(!c.verified&&!c.verifyAt)f.push('Closed case "'+c.title.slice(0,28)+'" has no verification armed — closure was not checked.');});return f;},
r_verify_arms(st){let n=0;st.cases.filter(c=>c.status==='closed'&&!c.verified&&!c.verifyAt).forEach(c=>{c.verifyAt=U.addD(c.closedAt||U.today(),30);const t=ENG.taskAdd(st,'Verify fix held (+30d): "'+c.title+'"',c.verifyAt,{caseId:c.id,origin:'verify',route:'#/case/'+c.id});ENG.pushWire(c,'closure-verify','Verification re-armed by audit repair (+30d from closure)','#/case/'+c.id,t.id);n++;});return n?'Re-armed '+n+' verification loop(s), dated from the original closure.':'Nothing to repair.';},
a_telemetry_honest(st){const f=[];const base=[{at:'2026-01-01',v:4},{at:'2026-01-08',v:3},{at:'2026-01-15',v:3},{at:'2026-01-22',v:2}];
const withEst=base.concat([{at:'2026-01-03',v:1,est:true},{at:'2026-01-18',v:5,est:true}]);
const a1=FW.moodSlope(base),a2=FW.moodSlope(withEst);
if(a1!==a2)f.push('PROBE FAILED: slope moved under estimated entries ('+a1+' → '+a2+'). Instruments are lying.');
st.sessions.forEach(s=>{if(s.mood){['energy','morale','load'].forEach(k=>{if(s.mood[k]!=null&&(s.mood[k]<1||s.mood[k]>5))f.push('Session '+s.at+' has '+k+'='+s.mood[k]+' out of 1–5.');});
if(s.mood.estimated!=null&&typeof s.mood.estimated!=='boolean')f.push('Session '+s.at+' estimated flag is not boolean.');}});
return f;},
a_commitment_shape(st){const f=[];st.commitments.forEach(c=>{if(['owe','owed'].indexOf(c.direction)<0)f.push('Commitment with bad direction: "'+(c.text||'').slice(0,26)+'"');
if(['open','done','broken'].indexOf(c.status)<0)f.push('Commitment with bad status: "'+(c.text||'').slice(0,26)+'"');
if(!/^\d{4}-\d{2}-\d{2}$/.test(c.due||''))f.push('Commitment with non-ISO due: "'+(c.text||'').slice(0,26)+'"');
if(c.personId&&!Q.person(c.personId))f.push('Commitment references a removed person.');});return f;},
a_premortem_floor(st){const f=[];st.decisions.forEach(d=>{if(!d.decided&&d.type===1&&(d.premortem||[]).length<3)f.push('Type-1 decision "'+d.title.slice(0,30)+'" undecided with '+(d.premortem||[]).length+'/3 premortem entries (import bypassed the form).');});return f;},
a_case_sla(st){const f=[];st.cases.forEach(c=>{if(!CONTENT.caseTypes[c.type])f.push('Case "'+(c.title||'').slice(0,26)+'" has unknown type "'+c.type+'".');
if(c.status==='open'&&c.slaDue<c.opened)f.push('Case "'+c.title.slice(0,26)+'" slaDue precedes opened.');if(!c.sev||c.sev<1||c.sev>5)f.push('Case "'+(c.title||'').slice(0,26)+'" has bad sev.');});return f;},
r_case_sla(st){let n=0;st.cases.forEach(c=>{if(c.status==='open'&&c.slaDue<c.opened){c.slaDue=U.addD(c.opened,CONTENT.slaDays[c.sev]||7);n++;}});return n?'Re-computed '+n+' SLA date(s) from opened + severity table.':'Nothing to repair.';},
a_ledger_shape(st){const f=[];st.cases.forEach(c=>(c.wires||[]).forEach(w=>{if(!w.id||!w.kind||!w.label||!w.at)f.push('Malformed wire on case "'+c.title.slice(0,24)+'" (kind: '+(w.kind||'?')+').');}));return f;},
a_session_shape(st){const f=[];st.sessions.forEach(s=>{if(['1:1','tour','skip','coach'].indexOf(s.kind)<0)f.push('Session '+s.id.slice(0,10)+' unknown kind "'+s.kind+'".');
if(!/^\d{4}-\d{2}-\d{2}$/.test(s.at||''))f.push('Session has non-ISO date.');});return f;},
a_agenda_people(st){const f=[];st.agenda.forEach(a=>{if(a.personId&&!Q.person(a.personId))f.push('Agenda item targets a removed person: "'+a.text.slice(0,30)+'"');});return f;},
r_agenda_people(st){const n=st.agenda.filter(a=>a.personId&&!Q.person(a.personId)).length;st.agenda=st.agenda.filter(a=>!a.personId||Q.person(a.personId));return n?'Dropped '+n+' agenda item(s) whose person no longer exists.':'Nothing to repair.';},
a_bench_computable(st){const f=[];st.people.forEach(p=>{try{const b=FW.benchScore(st,p);if(['READY NOW','READY IN 6M','GAP'].indexOf(b.verdict)<0)f.push('Bench verdict out of set for '+p.name);}catch(e){f.push('benchScore threw on '+p.name+': '+e.message);}});return f;},
a_person_graph(st){const f=[];const seen=new Set(st.people.map(p=>p.id));
st.people.forEach(p=>{if(p.managerId&&!seen.has(p.managerId))f.push(p.name+' reports into a dangling managerId.');
if(p.managerId===p.id)f.push(p.name+' manages themselves.');
let cur=p,depth=0,vis=new Set([p.id]);while(cur&&cur.managerId&&depth<5){cur=Q.person(cur.managerId);if(!cur)break;if(vis.has(cur.id)){f.push('Management cycle through '+p.name+'.');break;}vis.add(cur.id);depth++;}});return f.slice(0,8);},
r_person_graph(st){let n=0;const seen=new Set(st.people.map(p=>p.id));st.people.forEach(p=>{if((p.managerId&&!seen.has(p.managerId))||p.managerId===p.id){p.managerId=null;n++;}});return n?'Cut '+n+' dangling manager link(s) to null — reporting lines need a human decision anyway.':'Nothing to repair.';},
a_storage_shape(st){const f=[];if(st.v!==6)f.push('Record is not v:6.');['people','cases','tasks','sessions','agenda','feedback','delegations','goals','decisions','commitments'].forEach(k=>{if(!Array.isArray(st[k]))f.push('Collection '+k+' is not an array.');});
try{const s=JSON.stringify(st);JSON.parse(s);}catch(e){f.push('State does not round-trip through JSON: '+e.message);}return f;}
};
