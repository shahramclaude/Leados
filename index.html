<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LeadOS — Leadership Operating System · v15.0</title>
<style>
:root{
  --ink:#0e1013; --ink2:#14171c; --ink3:#1b1f26; --line:#272c36; --line2:#333a47;
  --tx:#e8e6e0; --tx2:#a9a59a; --tx3:#6f6b62;
  --amber:#e0a457; --amber2:#f2c384; --red:#e0604f; --red2:#ff8a76;
  --green:#7fb685; --blue:#7fa8c9; --violet:#a58ec9;
  --mono:'SF Mono',ui-monospace,'Cascadia Code',Consolas,Menlo,monospace;
  --sans:-apple-system,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--ink);color:var(--tx);font:14px/1.55 var(--sans);overflow-x:hidden}
::selection{background:rgba(224,164,87,.28)}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px;border:2px solid var(--ink)}
::-webkit-scrollbar-track{background:transparent}

/* ── shell ─────────────────────────────── */
#app{display:grid;grid-template-columns:212px 1fr;min-height:100vh}
#rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--ink2);padding:18px 12px 14px;z-index:30}
#rail .brand{display:flex;align-items:center;gap:9px;padding:2px 8px 16px;border-bottom:1px solid var(--line)}
#rail .brand b{font:700 14px/1 var(--sans);letter-spacing:.02em}
#rail .brand small{display:block;font:10px var(--mono);color:var(--tx3);margin-top:3px;letter-spacing:.06em}
#rail .brand .dot{width:9px;height:9px;border-radius:2.5px;background:var(--amber);box-shadow:0 0 12px rgba(224,164,87,.55);flex:none}
#nav{display:flex;flex-direction:column;gap:1px;margin-top:12px;overflow-y:auto;flex:1}
#nav button{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:7px;color:var(--tx2);font-size:12.5px;letter-spacing:.01em;text-align:left;transition:color .15s,background .15s;position:relative}
#nav button svg{width:15px;height:15px;flex:none;opacity:.75}
#nav button:hover{color:var(--tx);background:rgba(255,255,255,.035)}
#nav button.on{color:var(--amber2);background:rgba(224,164,87,.09)}
#nav button.on::before{content:"";position:absolute;left:-12px;top:20%;bottom:20%;width:2.5px;background:var(--amber);border-radius:2px}
#nav button .n{margin-left:auto;font:10px var(--mono);color:var(--tx3)}
#nav button .kbd{margin-left:auto;font:9.5px var(--mono);color:var(--tx3);border:1px solid var(--line);border-radius:4px;padding:0 4px}
#rail .foot{font:10px var(--mono);color:var(--tx3);padding:12px 8px 0;border-top:1px solid var(--line);line-height:1.8}
#main{min-width:0;display:flex;flex-direction:column}
#top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:11px 22px;border-bottom:1px solid var(--line);background:rgba(14,16,19,.86);backdrop-filter:blur(12px)}
#top h1{font:600 15px/1.2 var(--sans);letter-spacing:.01em}
#top h1 small{display:block;font:10.5px var(--mono);color:var(--tx3);font-weight:400;margin-top:2px}
#top .spacer{flex:1}
#savestate{font:10.5px var(--mono);color:var(--tx3);white-space:nowrap}
#savestate.bad{color:var(--red2);font-weight:700}
#top .tbtn{display:flex;align-items:center;gap:7px;border:1px solid var(--line2);border-radius:8px;padding:6px 12px;font-size:12px;color:var(--tx2);transition:.15s}
#top .tbtn:hover{color:var(--tx);border-color:var(--amber)}
#top .tbtn.hot{background:var(--amber);color:#1a1206;border-color:var(--amber);font-weight:600}
#top .tbtn.hot:hover{background:var(--amber2)}
#top .tbtn svg{width:14px;height:14px}
#view{padding:26px 30px 90px;max-width:1180px;width:100%;margin:0 auto}

/* ── primitives ────────────────────────── */
.vhead{margin-bottom:22px}
.vhead h2{font:650 22px/1.15 var(--sans);letter-spacing:-.015em}
.vhead p{color:var(--tx2);font-size:12.8px;margin-top:6px;max-width:760px}
.vhead p b{color:var(--amber2);font-weight:600}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1020px){.g3,.g4{grid-template-columns:1fr 1fr}}
@media(max-width:680px){.g2,.g3,.g4{grid-template-columns:1fr}}
.card{background:var(--ink2);border:1px solid var(--line);border-radius:12px;padding:16px 18px;position:relative}
.card.lift{transition:transform .18s,border-color .18s}
.card.lift:hover{transform:translateY(-2px);border-color:var(--line2)}
.card h3{font:600 12px/1.3 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--tx3);margin-bottom:12px}
.card h3 .q{font:10px var(--mono);letter-spacing:0;text-transform:none;color:var(--tx3);margin-left:8px}
.knum{font:650 30px/1 var(--mono);letter-spacing:-.03em}
.knum small{font-size:12px;color:var(--tx3);font-weight:400;letter-spacing:0}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:none}
.row .grow{flex:1;min-width:0}
.row .t{font-size:13px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font:11px var(--mono);color:var(--tx3);margin-top:2px}
.clickable{cursor:pointer}
.clickable:hover .t{color:var(--amber2)}
.chip{display:inline-flex;align-items:center;gap:5px;font:600 10px var(--mono);letter-spacing:.05em;padding:2px 8px;border-radius:20px;border:1px solid var(--line2);color:var(--tx2);white-space:nowrap;text-transform:uppercase}
.chip.red{color:var(--red2);border-color:rgba(224,96,79,.4);background:rgba(224,96,79,.08)}
.chip.amber{color:var(--amber2);border-color:rgba(224,164,87,.4);background:rgba(224,164,87,.08)}
.chip.green{color:var(--green);border-color:rgba(127,182,133,.4);background:rgba(127,182,133,.08)}
.chip.blue{color:var(--blue);border-color:rgba(127,168,201,.4);background:rgba(127,168,201,.08)}
.chip.violet{color:var(--violet);border-color:rgba(165,142,201,.4);background:rgba(165,142,201,.08)}
.chip.ghost{opacity:.55}
.dotc{width:7px;height:7px;border-radius:50%;flex:none;display:inline-block}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--amber);border-radius:3px}
.bar.thin{height:3px}
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--ink3);border:1px solid var(--line2);border-radius:8px;padding:7px 14px;font-size:12.5px;font-weight:550;color:var(--tx);transition:.15s}
.btn:hover{border-color:var(--amber);color:var(--amber2)}
.btn.pri{background:var(--amber);border-color:var(--amber);color:#1a1206;font-weight:650}
.btn.pri:hover{background:var(--amber2);color:#1a1206}
.btn.danger:hover{border-color:var(--red);color:var(--red2)}
.btn.sm{padding:4px 10px;font-size:11.5px;border-radius:6px}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn svg{width:13px;height:13px}
.field{margin-bottom:13px}
.field label{display:block;font:600 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;background:var(--ink);border:1px solid var(--line2);border-radius:8px;padding:8px 11px;font-size:13px;color:var(--tx);outline:none;transition:border-color .15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--amber)}
.field textarea{min-height:74px;resize:vertical;line-height:1.5}
.field .hint{font-size:11px;color:var(--tx3);margin-top:5px;line-height:1.5}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.note{font-size:12px;color:var(--tx2);background:rgba(224,164,87,.06);border:1px solid rgba(224,164,87,.22);border-radius:8px;padding:9px 12px;line-height:1.55}
.note b{color:var(--amber2)}
.note.blue{background:rgba(127,168,201,.06);border-color:rgba(127,168,201,.25)}
.note.blue b{color:var(--blue)}
.note.red{background:rgba(224,96,79,.06);border-color:rgba(224,96,79,.3)}
.note.red b{color:var(--red2)}
.empty{text-align:center;padding:44px 20px;color:var(--tx3)}
.empty .ic{margin:0 auto 10px;width:34px;height:34px;color:var(--tx3);opacity:.6}
.empty b{display:block;color:var(--tx2);font-size:13.5px;margin-bottom:4px}
.empty p{font-size:12px;max-width:380px;margin:0 auto 14px}
.timeline{position:relative;padding-left:18px}
.timeline::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1.5px;background:var(--line2)}
.tl{position:relative;padding:0 0 16px}
.tl::before{content:"";position:absolute;left:-16.5px;top:7px;width:8px;height:8px;border-radius:50%;background:var(--ink3);border:2px solid var(--line2)}
.tl.hot::before{border-color:var(--amber);box-shadow:0 0 8px rgba(224,164,87,.5)}
.tl .when{font:10px var(--mono);color:var(--tx3);letter-spacing:.04em}
.tl .what{font-size:12.5px;margin-top:2px}
table.tt{width:100%;border-collapse:collapse;font-size:12.5px}
table.tt th{font:600 10px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--tx3);text-align:left;padding:7px 10px;border-bottom:1px solid var(--line2)}
table.tt td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.tt tr:last-child td{border-bottom:none}
.mono{font-family:var(--mono)}
.mut{color:var(--tx3)} .mut2{color:var(--tx2)}
.small{font-size:11.5px}
.hbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sect{margin-top:26px}
.sect>h3{font:600 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--tx3);margin-bottom:10px;display:flex;align-items:center;gap:10px}
.sect>h3::after{content:"";flex:1;height:1px;background:var(--line)}
.sev{font:700 10px var(--mono);width:20px;height:20px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.sev.s5{background:rgba(224,96,79,.18);color:var(--red2)}.sev.s4{background:rgba(224,150,87,.18);color:var(--amber2)}
.sev.s3{background:rgba(224,190,87,.14);color:#d8c577}.sev.s2{background:rgba(127,168,201,.14);color:var(--blue)}
.sev.s1{background:rgba(127,182,133,.14);color:var(--green)}
.nbox{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.nbox .cell{aspect-ratio:2.1;background:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px 7px;font:9.5px var(--mono);color:var(--tx3);display:flex;flex-direction:column;gap:3px;overflow:hidden;cursor:pointer;transition:border-color .15s;min-height:52px}
.nbox .cell:hover{border-color:var(--amber)}
.nbox .cell .who{font:600 10.5px var(--sans);color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.heat{display:grid;grid-template-columns:auto repeat(5,1fr);gap:3px;font:9.5px var(--mono);align-items:center}
.heat .hcell{aspect-ratio:1.6;border-radius:5px;display:flex;flex-direction:column;justify-content:center;padding:2px 6px;font:9.5px var(--mono);border:1px solid transparent;overflow:hidden}
.heat .ax{color:var(--tx3);text-align:right;padding-right:6px}
.spark{display:block;width:100%;height:34px}
.canvas{position:relative}
canvas.chart{display:block;width:100%}

/* ── modal / palette / toast ───────────── */
#modalroot:empty{display:none}
.modalbk{position:fixed;inset:0;background:rgba(8,9,11,.72);backdrop-filter:blur(4px);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:6vh 18px 18px;overflow-y:auto;animation:fade .18s ease}
.modal{background:var(--ink2);border:1px solid var(--line2);border-radius:14px;width:100%;max-width:620px;box-shadow:0 30px 80px rgba(0,0,0,.55);animation:up .22s cubic-bezier(.2,.9,.3,1)}
.modal.wide{max-width:860px}
.modal .mhead{display:flex;align-items:center;gap:10px;padding:16px 20px 0}
.modal .mhead h3{font:650 15.5px var(--sans);flex:1;letter-spacing:-.01em}
.modal .mbody{padding:16px 20px 20px}
.modal .mfoot{display:flex;justify-content:flex-end;gap:9px;padding:0 20px 18px}
.mclose{color:var(--tx3);padding:4px;border-radius:6px}
.mclose:hover{color:var(--tx)}
.mclose svg{width:16px;height:16px}
#toasts{position:fixed;bottom:20px;right:20px;z-index:80;display:flex;flex-direction:column;gap:8px;max-width:380px}
.toast{background:var(--ink3);border:1px solid var(--line2);border-left:3px solid var(--amber);border-radius:9px;padding:10px 14px;font-size:12.5px;box-shadow:0 12px 40px rgba(0,0,0,.5);animation:up .25s ease;line-height:1.45}
.toast.err{border-left-color:var(--red)}
.toast.ok{border-left-color:var(--green)}
.toast b{font-weight:650}
.palette{position:fixed;inset:0;background:rgba(8,9,11,.7);backdrop-filter:blur(4px);z-index:70;display:flex;justify-content:center;align-items:flex-start;padding-top:12vh;animation:fade .15s}
.palette .pbox{width:100%;max-width:560px;background:var(--ink2);border:1px solid var(--line2);border-radius:13px;box-shadow:0 30px 80px rgba(0,0,0,.6);overflow:hidden;animation:up .2s cubic-bezier(.2,.9,.3,1)}
.palette input{width:100%;background:transparent;border:none;border-bottom:1px solid var(--line);padding:15px 18px;font-size:15px;outline:none;color:var(--tx)}
.palette .pitems{max-height:46vh;overflow-y:auto;padding:6px}
.palette .pitem{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;font-size:13px;cursor:pointer}
.palette .pitem .hint{margin-left:auto;font:10px var(--mono);color:var(--tx3)}
.palette .pitem.sel{background:rgba(224,164,87,.12);box-shadow:inset 2.5px 0 0 var(--amber)}
.palette .pitem svg{width:14px;height:14px;color:var(--tx3)}
.palette .phelp{border-top:1px solid var(--line);padding:8px 14px;font:10px var(--mono);color:var(--tx3)}
#qbar{position:relative;flex:1;max-width:420px}
#qbar input{width:100%;background:var(--ink);border:1px solid var(--line2);border-radius:8px;padding:6.5px 12px 6.5px 32px;font-size:12.5px;color:var(--tx);outline:none}
#qbar input:focus{border-color:var(--amber)}
#qbar svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--tx3)}
#banner{background:rgba(224,96,79,.1);border-bottom:1px solid rgba(224,96,79,.35);color:var(--red2);padding:9px 22px;font:11.5px var(--mono);display:flex;gap:12px;align-items:center}
#banner.warn{background:rgba(224,164,87,.08);border-color:rgba(224,164,87,.3);color:var(--amber2)}
@keyframes fade{from{opacity:0}}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
.print-in{animation:up .3s cubic-bezier(.2,.9,.3,1) backwards}
@media(max-width:860px){#app{grid-template-columns:1fr}#rail{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .2s;width:212px}#rail.open{transform:none}#burger{display:flex!important}#view{padding:18px 16px 80px}}
#burger{display:none;align-items:center;justify-content:center;width:34px;height:34px;border:1px solid var(--line2);border-radius:8px;color:var(--tx2)}
.grievance{font:italic 400 11.5px var(--sans);color:var(--tx3);border-left:2.5px solid var(--line2);padding-left:10px;margin:4px 0 14px;line-height:1.5}
</style>
</head>
<body>
<div id="app">
  <nav id="rail"></nav>
  <div id="main">
    <div id="banner" style="display:none"></div>
    <header id="top">
      <button id="burger" data-a="nav-toggle" aria-label="menu"></button>
      <h1 id="tophead">LeadOS<small>—</small></h1>
      <div class="spacer"></div>
      <div id="qbar"><input id="qinput" placeholder="capture: case: … · commit: @name … by friday · / for palette" autocomplete="off" spellcheck="false"></div>
      <span id="savestate">—</span>
      <button class="tbtn hot" data-a="case-new" id="casebtn"></button>
    </header>
    <main id="view"></main>
  </div>
</div>
<div id="modalroot"></div>
<div id="toasts"></div>
<script>
'use strict';
/* ================================================================
   LeadOS v15.0 — session-15 build
   Lineage: storage contract `leados.v6` preserved (record v:9).
   Kernel → models → engine → rules → audits → tests → views.
   No network. No framework. No credentials. File-double-click app.
   ================================================================ */
/* ── 0. utilities ───────────────────────────────────────────── */
const U={
  uid(p){return (p||'x')+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);},
  esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));},
  words(s){return String(s||'').toLowerCase().replace(/[^a-z0-9\s'-]/g,' ').split(/\s+/).filter(Boolean);},
  clamp(n,a,b){n=Number(n)||0;return Math.max(a,Math.min(b,n));},
  first(s){return String(s||'').trim().split(/\s+/)[0]||'';},
  hash(s){let h=0;s=String(s);for(let i=0;i<s.length;i++){h=((h<<5)-h+s.charCodeAt(i))|0;}return (h>>>0).toString(36);},
  arr(o){return o?Object.values(o):[];},
  byId(o,id){return o&&id&&o[id]?o[id]:null;},
  pl(n,s){return n===1?s:s+'s';},
};
const D={
  today(){return new Date().toISOString().slice(0,10);},
  add(iso,n){const d=new Date((iso||D.today())+'T12:00:00');d.setDate(d.getDate()+(n||0));return d.toISOString().slice(0,10);},
  days(a,b){// whole days from a to b (b−a)
    if(!a||!b) return null;
    const ms=new Date(b+'T12:00:00')-new Date(a+'T12:00:00');
    return Math.round(ms/864e5);
  },
  ago(iso){const n=D.days(iso,D.today());return n==null?'—':n===0?'today':n===1?'yesterday':n+'d ago';},
  inN(iso){const n=D.days(D.today(),iso);return n==null?'—':n<0?Math.abs(n)+'d overdue':n===0?'today':n===1?'tomorrow':'in '+n+'d';},
  overdue(iso){return !!iso&&D.days(iso,D.today())>0;},
  parse(s){// today · tomorrow · +Nd · next week · YYYY-MM-DD · weekday names · "friday"
    if(!s) return null; s=String(s).trim().toLowerCase();
    if(/^today$/.test(s)) return D.today();
    if(/^tomorrow$/.test(s)) return D.add(D.today(),1);
    let m=s.match(/^\+(\d+)\s*d?$/); if(m) return D.add(D.today(),+m[1]);
    if(/^next week$/.test(s)) return D.add(D.today(),7);
    m=s.match(/^(20\d\d)[-/.](\d{1,2})[-/.](\d{1,2})$/);
    if(m){const iso=m[1]+'-'+String(+m[2]).padStart(2,'0')+'-'+String(+m[3]).padStart(2,'0');
      return isNaN(new Date(iso+'T12:00:00'))?null:iso;}
    const wd={sunday:0,monday:1,tuesday:2,wednesday:3,thursday:4,friday:5,saturday:6};
    if(wd[s]!=null){let n=(wd[s]-new Date().getDay()+7)%7; if(n===0)n=7; return D.add(D.today(),n);}
    return null;
  }
};

/* ── 1. storage contract ──────────────────────────────────────
   KEY 'leados.v6' is the lineage key: intentionally never renamed
   (verified from repo README + session log). Record carries truth:
   v:9. Migrations additive, stepwise, announced in syslog.
   Corrupt bytes quarantined, never clobbered. Newer records held. */
const STORE={
  KEY:'leados.v6', TARGET:9, lastWrite:0, RECOVERY:null, byteLen:0, failed:0,
  blank(){return {v:this.TARGET,identity:{name:'',role:'',clockStart:''},seeded:false,seedTag:'',
    people:{},teams:{},cases:{},goals:{},risks:{},seats:{},tasks:{},sessions:{},feedback:{},
    evidence:{},decisions:{},handoffs:{},aars:{},lessons:{},delegations:{},meds:{},rituals:{},
    reviews:{},transition:null,snooze:{},syslog:[],auditFaults:[],evlog:[],
    settings:{exportLast:'',captureN:0},meta:{created:D.today()}};},
  ensureV7(r){['people','teams','cases','goals','seats','tasks','sessions','feedback','evidence',
    'decisions','handoffs','aars','lessons'].forEach(k=>{if(!r[k]||typeof r[k]!=='object'||Array.isArray(r[k]))r[k]={};});
    if(!r.identity)r.identity={name:'',role:'',clockStart:''};
    if(!Array.isArray(r.syslog))r.syslog=[];
    if(!r.snooze)r.snooze={};
    if(!r.settings)r.settings={exportLast:'',captureN:0};
    return r;},
  MIG:[

    {to:8,label:'v7 → v8 · +risks{} +auditFaults[] (per v14 storage contract)',fn:r=>{if(!r.risks||typeof r.risks!=='object'||Array.isArray(r.risks))r.risks={};if(!Array.isArray(r.auditFaults))r.auditFaults=[];return r;}},
    {to:9,label:'v8 → v9 · +delegations{} +meds{} +rituals{} +reviews{} +transition +evlog[] (session-15 surface)',fn:r=>{
      ['delegations','meds','rituals','reviews'].forEach(k=>{if(!r[k]||typeof r[k]!=='object'||Array.isArray(r[k]))r[k]={};});
      if(!Array.isArray(r.evlog))r.evlog=[];
      if(!('transition' in r))r.transition=null;return r;}},
  ],
  log(r,kind,msg){r.syslog.push({t:new Date().toISOString(),kind,msg});
    if(r.syslog.length>400)r.syslog=r.syslog.slice(-400);},
  load(){
    let raw=null;
    try{raw=localStorage.getItem(this.KEY);}catch(e){}
    if(raw==null){const b=this.blank();this.log(b,'boot','first boot — blank record v'+this.TARGET+' created');return b;}
    let rec;
    try{rec=JSON.parse(raw);}catch(e){
      const side=this.KEY+'.corrupt-'+Date.now();
      try{localStorage.setItem(side,raw);}catch(e2){}
      const b=this.blank();this.RECOVERY={kind:'corrupt',side,bytes:raw.length};
      this.log(b,'recovery','corrupt bytes ('+raw.length+' B) quarantined at '+side+' — main key untouched; blank state held in memory only, NOT saved, until you decide');
      return b;
    }
    if(!rec||typeof rec!=='object'||Array.isArray(rec)||typeof rec.v!=='number'){
      const b=this.blank();this.RECOVERY={kind:'shape',side:null,bytes:raw.length};
      this.log(b,'recovery','record present but not a LeadOS record (no numeric v) — held, not saved');
      return b;
    }
    if(rec.v>this.TARGET){
      const b=this.blank();this.RECOVERY={kind:'newer',side:null,bytes:raw.length,have:rec.v};
      this.log(b,'recovery','record v'+rec.v+' is newer than this build (v'+this.TARGET+') — held for your decision; silent downgrade refused');
      return b;
    }
    let chain=[];
    while(rec.v<this.TARGET){
      const step=this.MIG.find(s=>s.to===rec.v+1);
      if(!step){this.RECOVERY={kind:'chain',have:rec.v};break;}
      rec=step.fn(rec);rec.v=step.to;chain.push(step.label);
    }
    chain.forEach(l=>this.log(rec,'migrate',l));
    return rec;
  },
  save(){// write-guard __TM: self-test fixtures never reach storage
    if(window.__TM) return;
    if(this.RECOVERY) return; // blank state must not clobber a held record
    try{
      const s=JSON.stringify(window.S);
      localStorage.setItem(this.KEY,s);
      this.byteLen=s.length;this.lastWrite=Date.now();this.failed=0;
      S.meta.lastSave=D.today();
    }catch(e){
      this.failed=this.byteLen||JSON.stringify(window.S).length;
      BUS.emit('write:failed',{bytes:this.failed});
    }
  },
  kb(){const n=this.failed||this.byteLen||JSON.stringify(window.S).length;return (n/1024).toFixed(1);},
  saveMark(){
    const el=document.getElementById('savestate');if(!el)return;
    if(this.failed){el.className='bad';el.textContent='WRITE FAILED · '+this.kb()+' KB — export now, then prune (#/data)';return;}
    el.className='';const d=new Date(this.lastWrite||Date.now());
    el.textContent='saved '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+' · '+this.kb()+' KB';
  }
};

/* ── 2. FW — pure models (no state, no DOM) ───────────────────
   Every number LeadOS shows is traceable to one of these.        */
const FW={
  clamp:U.clamp,
  cynefin(text){const w=U.words(text);
    const has=(...ws)=>ws.some(x=>w.includes(x));
    if(has('harassment','discrimination','safety','fraud','legal','threat','assault','abuse','violence'))
      return {d:'crisis',move:'act first, contain, escalate — this build routes these words to the sealed ethics path before commit'};
    if(has('conflict','argument','tension','blame','missed','broken','sick','resigned','quit','incident','outage'))
      return {d:'complex',move:'probe-sense-respond: run the playbook, gather evidence, decide after'};
    if(has('decision','choose','tradeoff','architect','strategy','plan','budget','hire','promote'))
      return {d:'complicated',move:'sense-analyze-respond: consult your leads, write the decision record'};
    return {d:'clear',move:'sense-categorize-respond: apply the known practice, close, journal the lesson'};},
  eisen(sev,dated){const urgent=sev>=4||!!(dated&&D.days(D.today(),dated)<=2);
    return sev>=4?(urgent?1:2):sev===3?(urgent?1:3):(urgent?3:4);},
  quadrant(q){return {1:'do · urgent+important',2:'schedule · important',3:'delegate · urgent',4:'drop · neither'}[q]||'—';},
  sla(sev){return sev>=5?1:sev===4?2:sev===3?4:14;},
  specLint(text){// SBI specificity 0..3: situation anchor, observable behavior, impact verb
    const w=U.words(text);let s=0;
    const sit=['yesterday','today','meeting','standup','review','call','demo','retrospective','retro','deploy','handoff','monday','tuesday','wednesday','thursday','friday','week','launch','planning'];
    const beh=['said','wrote','shipped','missed','interrupted','delivered','asked','stayed','documented','escalated','answered','committed','reviewed','tested','presented','owned','helped','blocked','unblocked','fixed','arrived'];
    const imp=['because','which','so that','meant','caused','blocked','unblocked','delayed','saved','risked','confused','helped','hurt','slowed','accelerated'];
    if(sit.some(x=>w.includes(x)))s++;
    if(beh.some(x=>w.includes(x)))s++;
    if(imp.some(x=>w.join(' ').includes(x))||imp.some(i=>w.includes(i)))s++;
    return s;},
  slope(series){// per-day slope of [{t:ISO,v:n}] — null if <3 measured points
    const pts=(series||[]).filter(p=>p&&p.t&&typeof p.v==='number'&&!p.estimated);
    if(pts.length<3)return null;
    const t0=new Date(pts[0].t+'T12:00:00')/864e5;
    const xs=pts.map(p=>new Date(p.t+'T12:00:00')/864e5-t0),ys=pts.map(p=>p.v);
    const n=xs.length,mx=xs.reduce((a,b)=>a+b,0)/n,my=ys.reduce((a,b)=>a+b,0)/n;
    let num=0,den=0;for(let i=0;i<n;i++){num+=(xs[i]-mx)*(ys[i]-my);den+=(xs[i]-mx)*(xs[i]-mx);}
    return den?num/den:0;},
  trend(series){const s=FW.slope(series);if(s==null)return'→';return s>0.08?'↑':s<-0.08?'↓':'→';},
  flight(p,S){// weighted driver ledger — advisory instrument, basis always printed
    const dr=[];
    const open=U.arr(S.cases).filter(c=>!c.closed&&(c.personId===p.id||c.aboutId===p.id)).length;
    if(open)dr.push({k:'open cases',w:Math.min(open*9,27),t:open+' open '+U.pl(open,'case')+' touching this person'});
    const pulses=(p.mood||[]).filter(m=>!m.estimated);
    const sl=FW.slope(p.mood);
    if(sl!=null&&sl<-0.05)dr.push({k:'pulse slope',w:18,t:'measured pulse slope '+sl.toFixed(2)+'/d over '+pulses.length+' readings'});
    const last=(p.mood||[]).slice(-1)[0];
    if(last&&!last.estimated&&last.v<=2)dr.push({k:'last pulse low',w:14,t:'last measured pulse '+last.v+'/5 ('+D.ago(last.t)+')'});
    const lastS=U.arr(S.sessions).filter(x=>x.personId===p.id&&x.done).sort((a,b)=>b.date.localeCompare(a.date))[0];
    const gap=lastS?D.days(lastS.date,D.today()):999;
    if(gap>18)dr.push({k:'1:1 gap',w:gap>30?20:12,t:lastS?('no 1:1 in '+gap+'d'):'no 1:1 on record'});
    const low=U.arr(S.feedback).filter(f=>f.subjectId===p.id&&f.kind!=='praise');
    const now=U.arr(S.feedback).filter(f=>f.subjectId===p.id);
    if(now.length>=3&&low.length/now.length>0.8)dr.push({k:'feedback tone',w:10,t:low.length+' of '+now.length+' feedback items are corrections'});
    const stale=FW.ninebox(p);if(stale.halved)dr.push({k:'stale nine-box',w:6,t:'nine-box not revisited in >120d — bench evidence halved by doctrine'});
    const score=U.clamp(dr.reduce((a,d)=>a+d.w,0),0,100);
    const band=score>=50?'HIGH':score>=26?'WATCH':'LOW';
    const top=dr.slice().sort((a,b)=>b.w-a.w)[0];
    return {score,band,drivers:dr.sort((a,b)=>b.w-a.w),top,
      fix:top?('Intervene on '+top.k+' first: '+top.t+'. Write the intervention before you write anything else about this person.'):'No intervention indicated; invest in growth, not risk.'};},
  trust(p){const t=p.trust||{c:3,r:3,i:3,s:3};
    const val=((t.c+t.r+t.i)/Math.max(t.s,1));const num=[['credibility',t.c],['reliability',t.r],['intimacy',t.i]].sort((a,b)=>a[1]-b[1]);
    return {val:Math.round(val*10)/10,weakest:num[0][0],
      fix:'Weakest numerator: '+num[0][0]+'. '+(num[0][0]==='credibility'?'Demonstrate command of one thing they care about this week — specifically, in their domain language.':num[0][0]==='reliability'?'Close one small commitment visibly and early; say the date, hit the date.':'Spend one 1:1 on them, not the work: aspirations, constraints, what they protect.')};},
  ninebox(p){const a=p.ninebox||{perf:2,pot:2,at:''};
    const age=a.at?D.days(a.at,D.today()):9999;
    return {perf:U.clamp(a.perf||2,1,3),pot:U.clamp(a.pot||2,1,3),at:a.at||'',age,halved:age>120};},
  readiness(seat,cand,S){const basis=[];let sc=50;
    const nb=FW.ninebox(cand);
    sc+=(nb.perf-2)*14+(nb.pot-2)*10;
    basis.push('nine-box '+nb.perf+'/'+nb.pot+(nb.halved?' (stale '+nb.age+'d → halved)':''));
    if(nb.halved)sc=sc*0.75;
    const fr=FW.flight(cand,S);
    if(fr.band==='HIGH'){sc-=28;basis.push('flight risk HIGH (−28): a promotion into this seat may be an exit trigger, not a retention move');}
    else if(fr.band==='WATCH'){sc-=10;basis.push('flight risk WATCH (−10)');}
    const open=U.arr(S.cases).filter(c=>!c.closed&&c.sev>=4&&(c.personId===cand.id||c.aboutId===cand.id)).length;
    if(open){sc-=open*12;basis.push(open+' open sev≥4 case(s) (−'+open*12+')');}
    const ev=U.arr(S.evidence).filter(e=>e.personId===cand.id).length;
    sc+=Math.min(ev*2,10);basis.push(ev+' evidence item(s) on record (+'+Math.min(ev*2,10)+')');
    return {score:U.clamp(Math.round(sc),0,100),basis};},
  krScore(goal){const krs=goal.krs||[];if(!krs.length)return 0;
    const sc=krs.map(k=>{const span=(k.target-k.start)||1;
      const prog=k.dir==='down'?((k.start-(k.cur!=null?k.cur:k.start))/(k.start-k.target||1)*span)/span:((k.cur!=null?k.cur:k.start)-k.start)/span;
      return U.clamp(prog,0,1);});
    return Math.round(sc.reduce((a,b)=>a+b,0)/sc.length*100);},
  confSlope(goal){const cs=(goal.checkins||[]).map(c=>({t:c.t,v:c.conf}));return FW.slope(cs);},
  exposure(r){const p=U.clamp(r.p||3,1,5),i=U.clamp(r.i||3,1,5),x=p*i;
    return {p,i,x,band:x>=16?'SEVERE':x>=9?'HIGH':x>=4?'WATCH':'LOW'};},
  delegHealth(dg,S){const basis=[];let sc=70;
    if(!dg.checkEvery){sc-=18;basis.push('no check-in cadence set — delegation without a heartbeat is abdication (−18)');}
    else{const last=dg.lastCheck;const gap=last?D.days(last,D.today()):dg.checkEvery+1;
      if(gap>dg.checkEvery){sc-=20;basis.push('check-in overdue by '+(gap-dg.checkEvery)+'d (−20)');}
      else basis.push('check-in cadence held ('+dg.checkEvery+'d)');}
    if(!dg.rights||!dg.rights.length){sc-=25;basis.push('no decision rights written — scope is a rumor (−25)');}
    else basis.push(dg.rights.length+' decision right(s) in writing');
    (dg.takebacks||[]).forEach(tb=>{sc-=10;basis.push('take-back on '+tb.t+' counts against the pattern (−10)');});
    if(dg.drift){sc-=15;basis.push('scope drift reported: work arriving outside the written rights (−15)');}
    return {score:U.clamp(sc,0,100),basis,
      band:sc>=70?'HELD':sc>=45?'LOOSENING':'FAILING'};},
  ritualCov(S){// cadence doctrine for a leader of leads vs what rituals exist
    const need=[
      {k:'staff',label:'weekly staff meeting with all your leads',every:7},
      {k:'skip',label:'skip-level touch per team',every:30},
      {k:'retro',label:'team retrospective per team per month',every:31},
      {k:'align',label:'quarterly priorities alignment',every:92}];
    const rits=U.arr(S.rituals);
    return need.map(n=>{
      const r=rits.find(x=>x.kind===n.k);
      if(!r)return Object.assign({missing:true,cadence:n.every},n);
      const gap=r.lastDone?D.days(r.lastDone,D.today()):9999;
      return Object.assign({missing:false,overdue:gap>r.everyDays*1.5,gap,ritual:r},n);
    });},
  transStage(S){const t=S.transition;if(!t)return null;
    const gates=[['learn','Days 1–30 · Learn: listen, map the seams, change nothing structural'],
                 ['align','Days 31–60 · Align: set expectations, renegotiate decision rights'],
                 ['act','Days 61–90 · Act: move one visible thing per team, journal why']];
    const idx=Math.max(0,gates.findIndex(g=>g[0]===t.stage));
    const day=S.identity.clockStart?U.clamp(D.days(S.identity.clockStart,D.today())+1,1,90):null;
    return {stage:t.stage,stageIdx:idx,day,gates};},
  aasl(k){return k;} // anchor: audit-safe append of system log (kept pure by name)
};

/* ── 3. shared event/data layer ───────────────────────────────
   BUS = runtime fan-out (new in v15: v14 documented "no pub/sub
   event bus by design — the ledger is the event log". Position:
   with five new modules subscribing to case/feedback/goal writes,
   runtime subscription is now load-bearing; the propagation ledger
   remains the DURABLE event log. Both ship; they serve different
   failure modes.) */
const BUS={
  subs:{},
  on(ev,fn){(this.subs[ev]=this.subs[ev]||[]).push(fn);},
  emit(ev,payload){
    if(window.S&&S.evlog){S.evlog.push({t:new Date().toISOString(),ev,ref:(payload&&payload.id)||''});
      if(S.evlog.length>160)S.evlog=S.evlog.slice(-160);}
    (this.subs[ev]||[]).concat(this.subs['*']||[]).forEach(fn=>{try{fn(payload,ev);}catch(e){console.error('BUS',ev,e);}});
  }
};

/* ── 5. ENG — writes. Every write is one transaction that fans
   out across modules and records each hop on the record itself. */
const ENG={
  ETHICS:['harassment','harass','discriminat','retaliat','self-harm','suicide','threat','assault','accommodat','racis','sexual','abuse','violence','fraud','legal','medical','safety concern','whistle'],
  trip(text){const low=String(text||'').toLowerCase();return ENG.ETHICS.filter(k=>low.includes(k));},
  TYPES:{oneonone:'1:1 surfaced',conflict:'conflict',performance:'performance',delivery:'delivery miss',
    incident:'incident',decision:'needs a decision',goal:'goal at risk',feedback:'feedback breakdown',
    commitment:'commitment broken',wellbeing:'wellbeing',ethics:'sealed · ethics/HR',risk:'risk materialized'},
  playbook(type,personId,caseId){
    const mk=(title,due,extra)=>Object.assign({id:U.uid('tk'),kind:'playbook',title,personId:personId||'',caseId,due,done:false,doneAt:null,created:D.today()},extra||{});
    const d1=D.add(D.today(),1),d3=D.add(D.today(),3);
    return ({
      conflict:[mk('separate conversation with each party — interests, not positions',d1),mk('joint session only after both positions are on record',d3)],
      performance:[mk('gather two concrete, dated examples before any conversation',d1),mk('deliver the correction inside 72h of evidence (feedback module)',d3)],
      delivery:[mk('confirm customer/team impact in writing',d1),mk('post-incident: schedule the AAR if sev≥4',d3)],
      incident:[mk('declare, mitigate, communicate — timeline starts now',D.today()),mk('AAR owed within 5 days of resolution',D.add(D.today(),5))],
      goal:[mk('state the at-risk goal and the blocking constraint in the next staff meeting',d1)],
      feedback:[mk('re-deliver or re-frame the correction — breakdown means it did not land',d1)],
      decision:[mk('open the decision record with options and a decide-by date',d1)],
      commitment:[mk('name the broken commitment to its owner and re-date with a reason',d1)],
      oneonone:[mk('log what the 1:1 surfaced; agree the next step with the person',d1)],
      wellbeing:[mk('private conversation first; work adjustment second; record only facts',d1)],
      risk:[mk('declare the materialized risk to affected teams',D.today())],
      ethics:[]
    })[type]||[mk('first response within the SLA runway',d1)];},
  normTitle(t){return U.words(t).join(' ');},
  findDup(draft){return U.arr(S.cases).find(c=>!c.closed&&c.type===draft.type&&
    (c.personId||'')===(draft.personId||'')&&ENG.normTitle(c.title)===ENG.normTitle(draft.title))||null;},
  wire(c,kind,label,route,refId){c.ledger.push({t:D.today(),kind,label,route:route||'#/cases',refId:refId||''});
    BUS.emit('case:wire',{id:c.id,kind});},
  registerCase(draft){
    const dup=ENG.findDup(draft);
    if(dup)return {refused:'dup',dup};
    const trips=ENG.trip((draft.title||'')+' '+(draft.desc||''));
    if(trips.length&&draft.type!=='ethics'){
      if(draft.ethicsAck!==2)return {needEthics:trips};
      draft.type='ethics';
    }
    if(draft.type==='ethics'&&draft.ethicsAck!==2)return {needEthics:trips.length?trips:['(manual ethics intake)']};
    const c={id:U.uid('c'),type:draft.type,sev:U.clamp(draft.sev||3,1,5),title:draft.title.trim(),
      desc:(draft.desc||'').trim(),personId:draft.personId||'',aboutId:draft.aboutId||'',
      teamId:draft.teamId||'',xteams:draft.xteams||[],opened:D.today(),due:D.add(D.today(),FW.sla(draft.sev||3)),
      closed:null,verifyAt:null,verifyHeld:null,sealed:draft.type==='ethics',goalId:draft.goalId||'',
      flaggedBy:'',linkedMed:'',lapsedCaseId:'',xlinks:[],ledger:[]};
    S.cases[c.id]=c;
    ENG.wire(c,'case','case registered ('+c.type+' · sev '+c.sev+' · SLA '+FW.sla(c.sev)+'d → due '+c.due+')','#/case/'+c.id,c.id);
    if(c.sealed){ // EXACTLY four wires. The audit class ethics-wires polices this.
      const eid=U.uid('ev');
      S.evidence[eid]={id:eid,personId:c.aboutId||c.personId,caseId:c.id,t:D.today(),text:'[sealed intake] '+c.title+(c.desc?' — '+c.desc:'')};
      ENG.wire(c,'evidence','verbatim evidence sealed on the person record','#/person/'+(c.aboutId||c.personId),eid);
      const tk={id:U.uid('tk'),kind:'hr-contact',title:'contact HR today — sealed case '+c.title,personId:c.aboutId||c.personId,caseId:c.id,due:D.today(),done:false,doneAt:null,created:D.today(),locked:true};
      S.tasks[tk.id]=tk;ENG.wire(c,'task','unsnoozable HR-contact task dated TODAY','#/today',tk.id);
      c.agendaPin=true;ENG.wire(c,'agenda','agenda pin — surfaces in your next 1:1 with this person','#/oneonones',c.id);
      c.cascadeNote='Sealed. No further writes. The machine stays out of HR territory by design.';
      ENG.wire(c,'seal','sealed: no playbook, no cascade, no cross-links — exactly 4 wires','#/signal',c.id);
    }else{
      const ev={id:U.uid('ev'),personId:c.aboutId||c.personId,caseId:c.id,t:D.today(),text:c.desc||c.title};
      S.evidence[ev.id]=ev;ENG.wire(c,'evidence','verbatim evidence on the person record','#/person/'+ev.personId,ev.id);
      ENG.playbook(c.type,c.personId,c.id).forEach(tk=>{S.tasks[tk.id]=tk;ENG.wire(c,'task','playbook: '+tk.title+' (due '+tk.due+')','#/today',tk.id);});
      if(c.type==='performance'||c.type==='feedback'){
        const fb={id:U.uid('fb'),kind:'correction',subjectId:c.aboutId||c.personId,fromId:'',sbi:'',deliveredAt:null,created:D.today(),verifyAt:null,held:null,caseId:c.id,draft:true};
        S.feedback[fb.id]=fb;ENG.wire(c,'feedback','SBI correction draft queued — 72h delivery clock running','#/feedback',fb.id);}
      if(c.sev>=4){
        const dec={id:U.uid('d'),title:(c.title.length>80?c.title.slice(0,77)+'…':c.title)+' — what do we decide?',type:'t2',opened:D.today(),decideBy:D.add(D.today(),10),options:[],premortem:[],choice:null,rationale:'',decidedAt:null,caseId:c.id,history:[{t:D.today(),what:'stub opened from case '+c.id+' (sev≥4 doctrine)'}],graded:null};
        S.decisions[dec.id]=dec;ENG.wire(c,'decision','decision stub opened (sev≥4 → a call is owed)','#/decisions',dec.id);}
      if(c.goalId&&S.goals[c.goalId]){
        const g=S.goals[c.goalId];g.atRisk=true;g.flaggedBy=c.id;
        ENG.wire(c,'goal','goal '+g.title+' flagged AT RISK (owned: only this case\u2019s closure clears it)','#/goals',g.id);}
      if(c.teamId){
        const tm=S.teams[c.teamId];
        if(tm&&tm.leadId&&tm.leadId!==c.personId){
          const tk={id:U.uid('tk'),kind:'cascade',title:'case on your team: '+c.title+' (sev '+c.sev+') — own the first move',personId:tm.leadId,caseId:c.id,due:D.add(D.today(),1),done:false,doneAt:null,created:D.today()};
          S.tasks[tk.id]=tk;ENG.wire(c,'task','cascade to owning lead '+ENG.pname(tm.leadId)+' (due tomorrow)','#/person/'+tm.leadId,tk.id);}}
      U.arr(S.cases).forEach(o=>{if(o.id!==c.id&&!o.closed&&((o.personId&&o.personId===c.personId&&c.personId)||(o.aboutId&&o.aboutId===c.aboutId&&c.aboutId)||(o.teamId&&o.teamId===c.teamId&&c.teamId))){
        o.xlinks.push(c.id);c.xlinks.push(o.id);}});
      if(c.xlinks.length)ENG.wire(c,'link','cross-linked to '+c.xlinks.length+' open case(s) on shared scope','#/cases',c.id);
    }
    STORE.log(S,'case','registered '+c.id+' ('+c.type+') sev'+c.sev+' — '+c.ledger.length+' wires');
    AUD.run('ethics-wires');
    BUS.emit('case:opened',{id:c.id});STORE.save();
    return {ok:c};
  },
  closeCase(id,outcome,lesson){
    const c=S.cases[id];if(!c||c.closed)return {err:'not open'};
    if(!outcome||!outcome.trim())return {err:'outcome is mandatory — closure is checked, not assumed'};
    if(!lesson||!lesson.trim())return {err:'lesson is mandatory — the next version of you reads this'};
    let orphans=0;
    U.arr(S.tasks).forEach(t=>{if(t.caseId===id&&!t.done){t.done=true;t.doneAt=D.today();t.cancelled=true;orphans++;}});
    let flagsCleared=0;
    U.arr(S.goals).forEach(g=>{if(g.flaggedBy===id){g.flaggedBy='';g.atRisk=false;flagsCleared++;}});
    // foreign closures never clear flags they don't own (tested: t6)
    c.closed=D.today();c.outcome=outcome.trim();
    c.verifyAt=D.add(D.today(),30); // verify armed for every closed case, unconditionally
    const ls={id:U.uid('ls'),type:c.type,t:D.today(),text:lesson.trim(),caseId:id};
    S.lessons[ls.id]=ls;
    ENG.wire(c,'close','closed: '+outcome.trim()+' · orphans cancelled: '+orphans+' · goal flags cleared: '+flagsCleared+' (owned only)','#/case/'+id,id);
    ENG.wire(c,'lesson','lesson journaled to the case-type playbook','#/cases',ls.id);
    if(c.sev>=4){c.aarDue=D.add(D.today(),7);ENG.wire(c,'aar','AAR owed by '+c.aarDue+' (sev≥4) — advisory holds until it exists','#/about',id);}
    STORE.log(S,'case','closed '+id+' — outcome+lesson on record; verify +30d armed');
    BUS.emit('case:closed',{id});STORE.save();return {ok:c};
  },
  verifyCase(id,held){
    const c=S.cases[id];if(!c||!c.closed)return;
    if(held===true){c.verifyHeld=true;c.verifyAt=null;
      ENG.wire(c,'verify','+30d verification: HELD — the fix stayed fixed','#/case/'+id,id);}
    else{c.closed=null;c.verifyAt=null;c.reopens=(c.reopens||0)+1;c.due=D.add(D.today(),FW.sla(c.sev));
      ENG.wire(c,'reopen','honest re-open: verification failed — SLA clock restarted, on the record','#/case/'+id,id);
      BUS.emit('case:reopened',{id});}
    STORE.save();},
  aar(id,answers){
    const c=S.cases[id];if(!c)return;
    const a={id:U.uid('aar'),caseId:id,t:D.today(),answers};
    S.aars[a.id]=a;c.aarDue=null;
    const ls={id:U.uid('ls'),type:c.type,t:D.today(),text:answers.change||answers.learn||'(AAR with no change declared — audit will ask why)',caseId:id};
    S.lessons[ls.id]=ls;
    ENG.wire(c,'aar','AAR complete — lesson: '+(answers.learn||'—').slice(0,90),'#/cases',a.id);
    BUS.emit('aar:done',{id:a.id});STORE.save();},
  pname(pid){const p=U.byId(S.people,pid);return p?p.name:'—';},
  tname(tid){const t=U.byId(S.teams,tid);return t?t.name:'—';},
  addTask(t){t.id=U.uid('tk');t.created=D.today();t.done=false;t.doneAt=null;S.tasks[t.id]=t;BUS.emit('task:added',{id:t.id});STORE.save();return t;},
  addEvidence(personId,text,caseId){const e={id:U.uid('ev'),personId,caseId:caseId||'',t:D.today(),text};
    S.evidence[e.id]=e;BUS.emit('evidence:added',{id:e.id});STORE.save();return e;},
  addFeedback(f){f.id=U.uid('fb');f.created=D.today();S.feedback[f.id]=f;BUS.emit('feedback:added',{id:f.id});STORE.save();return f;},
  deliverFeedback(id){
    const f=S.feedback[id];if(!f)return;
    f.deliveredAt=D.today();f.draft=false;
    if(f.kind==='correction'&&!f.verifyAt)f.verifyAt=D.add(D.today(),21);
    BUS.emit('feedback:delivered',{id});STORE.save();},
  goalCheckin(id,conf,note,curVals){
    const g=S.goals[id];if(!g)return;
    (g.krs||[]).forEach((k,i)=>{if(curVals&&curVals[i]!=null&&curVals[i]!==''&&!isNaN(+curVals[i]))k.cur=+curVals[i];});
    g.checkins.push({t:D.today(),conf:U.clamp(+conf,1,10),note:note||''});
    BUS.emit('goal:checkin',{id});STORE.save();},
  gradeGoal(id,grade,lesson){
    const g=S.goals[id];if(!g)return{err:'missing'};
    if(!lesson||!lesson.trim())return{err:'expired goals are graded only with a CAUSAL lesson — what actually moved the number?'};
    g.graded={t:D.today(),grade,lesson:lesson.trim()};g.atRisk=false;g.flaggedBy='';
    S.lessons[U.uid('ls')]={id:U.uid('ls'),type:'goal',t:D.today(),text:'['+grade+'] '+g.title+' — '+lesson.trim()};
    BUS.emit('goal:graded',{id});STORE.save();return{ok:g};},
  decide(id,choice,rationale){
    const d=S.decisions[id];if(!d)return{err:'missing'};
    if(d.type==='t1'&&(d.premortem||[]).filter(Boolean).length<3)return{err:'type-1 door: premortem ≥3 required before deciding (form + audit enforce)'};
    if(!rationale||!rationale.trim())return{err:'rationale mandatory — future-you is the audience'};
    d.choice=choice;d.rationale=rationale.trim();d.decidedAt=D.today();
    d.history.push({t:D.today(),what:'decided: '+choice+' — '+rationale.trim()});
    BUS.emit('decision:made',{id});STORE.save();return{ok:d};},
  redateDecision(id,nd,reason){
    const d=S.decisions[id];if(!d)return{err:'missing'};
    if(!reason||!reason.trim())return{err:'re-dating requires a recorded reason, rendered in history'};
    d.decideBy=nd;d.history.push({t:D.today(),what:'re-dated to '+nd+' — reason: '+reason.trim()});
    BUS.emit('decision:redated',{id});STORE.save();return{ok:d};},
  handoffAccept(id,how){
    const h=S.handoffs[id];if(!h)return;
    if(how==='accept'){h.acceptedAt=D.today();
      const t=U.arr(S.tasks).find(t=>t.handoffId===id&&!t.done);if(t){t.done=true;t.doneAt=D.today();}
      h.ledger.push({t:D.today(),kind:'accept',label:h.acceptedBy?ENG.pname(h.acceptedBy)+' accepted: '+h.criteria:'accepted',route:'#/handoffs'});
    }else{h.countered=D.today();h.ledger.push({t:D.today(),kind:'counter',label:'countered — silence clock reset',route:'#/handoffs'});}
    BUS.emit('handoff:'+how,{id});STORE.save();},
  handoffDone(id){
    const h=S.handoffs[id];if(!h)return{err:'missing'};
    if(!h.acceptedAt)return{err:'ledger lie refused: “done” requires “accepted” first. A handoff nobody agreed to own is not done, it is abandoned.'};
    h.doneAt=D.today();h.ledger.push({t:D.today(),kind:'done',label:'done — acceptance criteria met: '+h.criteria,route:'#/handoffs'});
    BUS.emit('handoff:done',{id});STORE.save();return{ok:h};},
  riskMitigation(id,mt){
    const r=S.risks[id];if(!r)return;
    mt.id=U.uid('mt');mt.done=false;r.mitigations.push(mt);BUS.emit('risk:changed',{id});STORE.save();},
  riskRetire(id,how,lesson){
    const r=S.risks[id];if(!r)return{err:'missing'};
    if(how==='realized'){
      const c=ENG.registerCase({type:'incident',sev:Math.max(3,U.clamp(r.i,1,5)),title:'[materialized] '+r.title,desc:'Risk “'+r.title+'” realized. EWI was: '+(r.ewi||'—')+'. '+lesson,teamId:(r.teams||[])[0]||'',xteams:r.teams||[]});
      r.retired={t:D.today(),how,lesson:lesson||'',caseId:c.ok?c.ok.id:''};
      BUS.emit('risk:materialized',{id});STORE.save();return{ok:r,case:c.ok};
    }
    if(!lesson||!lesson.trim())return{err:'graded retirement needs the lesson — what did watching this risk teach?'};
    r.retired={t:D.today(),how,lesson:lesson.trim()};
    S.lessons[U.uid('ls')]={id:U.uid('ls'),type:'risk',t:D.today(),text:'['+how+'] '+r.title+' — '+lesson.trim()};
    BUS.emit('risk:retired',{id});STORE.save();return{ok:r};},
  medAdvance(id,data){
    const m=S.meds[id];if(!m)return{err:'missing'};
    if(data.posA)m.positions[m.partyA]=data.posA;
    if(data.posB)m.positions[m.partyB]=data.posB;
    if(data.caucusWith&&data.caucusNote)m.caucuses.push({t:D.today(),withId:data.caucusWith,note:data.caucusNote});
    if(data.joint){m.joint={t:D.today(),note:data.joint};m.stage='joint';}
    if(data.agreement){m.agreement={t:D.today(),text:data.agreement,witness:data.witness||''};m.stage='agreement';m.verifyAt=D.add(D.today(),14);}
    m.ledger.push({t:D.today(),kind:'step',label:data.label||'mediation updated',route:'#/conflicts'});
    BUS.emit('med:updated',{id});STORE.save();return{ok:m};},
  medVerify(id,held){
    const m=S.meds[id];if(!m)return;
    if(held){m.held=true;m.verifyAt=D.add(D.today(),16);m.heldCount=(m.heldCount||0)+1;
      if(m.heldCount>=2){m.closed=D.today();m.stage='closed';}}
    else{m.stage='reopened';m.verifyAt=null;m.heldCount=0;
      const c=S.cases[m.caseId];if(c&&c.closed){c.closed=null;c.due=D.add(D.today(),FW.sla(c.sev));
        ENG.wire(c,'reopen','mediation agreement failed at +14d verification — case honestly re-opened','#/case/'+c.id,c.id);}}
    m.ledger.push({t:D.today(),kind:'verify',label:held?'verification held ('+m.heldCount+'/2)':'agreement failed — reopened',route:'#/conflicts'});
    BUS.emit('med:verified',{id});STORE.save();},
  delegCheck(id,note){
    const dg=S.delegations[id];if(!dg)return;
    dg.lastCheck=D.today();(dg.checks=dg.checks||[]).push({t:D.today(),note:note||''});

/* ── 6. RULES — the signal engine. Every rule states why it
   exists and when it clears. Three locked advisories cannot be
   snoozed: escalation-open, hr-task-due, integrity-fault.        */
const R={list:[],
def(id,lane,pri,name,why,clears,route,run){this.list.push({id,lane,pri,name,why,clears,route,run});},
eval(){
  const out={locked:[],alert:[],pos:[],sleeping:[],live:[]};
  this.list.forEach(r=>{
    let hits=[];try{hits=r.run()||[];}catch(e){hits=[];console.error('rule',r.id,e);}
    if(!hits.length)return;
    const until=S.snooze[r.id];
    if(until&&D.days(D.today(),until)>=0&&r.lane!=='locked'){out.sleeping.push({r,hits,until});return;}
    const pack={r,hits};
    out.live.push(pack);
    (r.lane==='locked'?out.locked:r.lane==='pos'?out.pos:out.alert).push(pack);});
  return out;}
};

/* ── 7. next best move — ranked, with its ranking printed ───── */
function buildNBM(ev){
  const buckets=['locked','SLA breach','your debt','risk exposure','oldest dated','positive','signal'];
  let cand=[];
  ev.locked.forEach(p=>p.hits.forEach(h=>cand.push({b:0,r:p.r,h})));
  ev.alert.forEach(p=>p.hits.forEach(h=>cand.push({b:p.r.pri,r:p.r,h})));
  if(!cand.length)ev.pos.forEach(p=>p.hits.forEach(h=>cand.push({b:7,r:p.r,h})));
  if(!cand.length)return null;
  cand.sort((a,b)=>a.b-b.b||((b.h.sev||0)-(a.h.sev||0)));
  const top=cand[0];
  return {label:top.h.label,route:top.h.route||top.r.route,rule:top.r.name,why:top.r.why,
    ranking:'ranked #1 of '+cand.length+' live signals. Bucket order: '+buckets.join(' > ')+'. This one sits in “'+buckets[Math.min(top.b,6)]+'”.'};
}

/* ── 8. AUDITS — executable integrity classes ───────────────── */
const AUD={list:[],
def(id,name,run,repair){this.list.push({id,name,run,repair:repair||null});},
run(id){const a=this.list.find(x=>x.id===id);if(!a)return[];
  let f=[];try{f=a.run()||[];}catch(e){f=[{msg:'audit itself threw: '+e.message}];}
  f.forEach(x=>x.cls=id);
  S.auditFaults=(S.auditFaults||[]).filter(x=>x.cls!==id).concat(f);
  return f;},
runAll(){S.auditFaults=[];let all=[];
  this.list.forEach(a=>{let f=[];try{f=a.run()||[];}catch(e){f=[{msg:'audit threw: '+e.message}];}
    f.forEach(x=>x.cls=a.id);all=all.concat(f);});
  S.auditFaults=all;STORE.log(S,'audit','sweep: '+this.list.length+' classes → '+all.length+' fault(s)');
  return all;},
repair(id){const a=this.list.find(x=>x.id===id);
  if(!a||!a.repair)return {err:'no safe repair exists for this class — it requires judgment, and the machine refuses to fake it'};
  const n=a.repair();STORE.log(S,'audit','safe-repair '+id+' → '+n+' fix(es)');this.run(id);BUS.emit('audit:repaired',{id});STORE.save();
  return {ok:n};}
};

AUD.def('telemetry-honest','estimates never move a slope',()=>{

const IM={
check(text,fixture){// returns parsed record ready-to-merge or null (refusal said aloud by caller)
  let j;try{j=JSON.parse(text);}catch(e){return null;}
  if(!j||typeof j!=='object'||Array.isArray(j))return null;
  if(typeof j.v!=='number')return null;
  if(j.v>STORE.TARGET)return null;

  while(rec.v<STORE.TARGET){const st=STORE.MIG.find(s=>s.to===rec.v+1);if(!st)return null;rec=st.fn(rec);rec.v=st.to;}
  return rec;},
merge(cur,inc){// re-mint every id, rewire the whole graph through one map
  const map={};const colls=['people','teams','cases','goals','risks','seats','tasks','sessions','feedback','evidence','decisions','handoffs','aars','lessons','delegations','meds','rituals','reviews'];
  colls.forEach(k=>{cur[k]=cur[k]||{};U.arr(inc[k]).forEach(rec=>{
    const nid=U.uid(k.slice(0,2));map[rec.id]=nid;cur[k][nid]=Object.assign({},rec,{id:nid});});});
  colls.forEach(k=>U.arr(cur[k]).forEach(rec=>{ // rewire ALL records: existing ids are not in map, so map[x]||x is identity for them
    ['personId','aboutId','subjectId','toId','leadId','caseId','goalId','flaggedBy','fromTeam','toTeam','teamId','acceptedBy','requestedBy','cover','withId','partyA','partyB'].forEach(f=>{if(rec[f]&&map[rec[f]])rec[f]=map[rec[f]];});
    ['xteams','teams','xlinks','attendees'].forEach(f=>{if(Array.isArray(rec[f]))rec[f]=rec[f].map(x=>map[x]||x);});
    if(Array.isArray(rec.slate))rec.slate.forEach(s=>{if(s.pid&&map[s.pid])s.pid=map[s.pid];});
    if(Array.isArray(rec.mitigations))rec.mitigations.forEach(m=>{if(m.owner&&map[m.owner])m.owner=map[m.owner];});
    if(Array.isArray(rec.ledger))rec.ledger.forEach(w=>{if(w.refId&&map[w.refId])w.refId=map[w.refId];});
  }));

/* ── 11. capture grammar ────────────────────────────────────── */
const CAP={
findPerson(tok){tok=(tok||'').replace(/^@/,'').toLowerCase();if(!tok)return null;
  const hits=U.arr(S.people).filter(p=>p.name.toLowerCase().startsWith(tok)||U.first(p.name).toLowerCase()===tok);
  return {person:hits[0]||null,collide:hits.length>1?hits.length:0};},
splitBy(body){const m=body.match(/\bby\s+(.+)$/);if(!m)return{body,due:null,raw:null};
  const due=D.parse(m[1]);return{body:body.slice(0,m.index).trim(),due:due||(m[1]?'_BAD':'') ,raw:m[1]};},
run(text){
  text=String(text||'').trim();if(!text)return{err:'empty'};
  const vm=text.match(/^([a-z]+)\s*:\s*(.+)$/is);
  if(!vm)return{intake:{type:'',title:text}};
  const verb=vm[1].toLowerCase();let body=vm[2].trim();
  if(verb==='case'){
    const trips=ENG.trip(body);
    return{intake:{type:trips.length?'ethics':'',title:body}};}
  if(verb==='commit'||verb==='owe'){
    const at=body.match(/^@(\S+)\s+(.+)$/s);
    let personId='';let rest=body;
    if(at){const f=CAP.findPerson(at[1]);if(!f.person)return{err:'no person matches @'+at[1]+' — nothing written'};
      personId=f.person.id;rest=at[2];if(f.collide)return{warn:'@'+at[1]+' matched '+f.collide+' people — used '+f.person.name+' (first match), fix by full name',_go:{verb,personId,rest}};}
    const sb=CAP.splitBy(rest);
    if(sb.due==='_BAD')return{err:'“by '+sb.raw+'” is not a date I understand (today · tomorrow · +Nd · friday · YYYY-MM-DD) — nothing written'};
    ENG.addTask({kind:verb==='commit'?'mine':'theirs',title:sb.body,personId,due:sb.due||null,caseId:''});
    return{ok:(verb==='commit'?'commitment on you':'owed by '+ENG.pname(personId))+' logged'+(sb.due?' · due '+sb.due:' (undated — it will nag as oldest dated)')};}
  if(verb==='praise'||verb==='note'){
    const at=body.match(/^@(\S+)\s+(.+)$/s);if(!at)return{err:verb+': needs @name — nothing written'};
    const f=CAP.findPerson(at[1]);if(!f.person)return{err:'no person matches @'+at[1]+' — nothing written'};
    if(verb==='praise'){
      const fb=ENG.addFeedback({kind:'praise',subjectId:f.person.id,fromId:'',sbi:at[2],deliveredAt:null,verifyAt:null,held:null});
      return{ok:'praise queued for '+f.person.name+' — deliver inside 48h (#/feedback)'};}
    ENG.addEvidence(f.person.id,at[2],'');
    return{ok:'note logged on '+f.person.name+' (evidence ledger)'};}
  if(verb==='win'){const l={id:U.uid('ls'),type:'win',t:D.today(),text:body};
    S.lessons[l.id]=l;STORE.save();BUS.emit('win',{id:l.id});
    return{ok:'win logged — it will show in the positive lane and the weekly review'};}
  if(verb==='risk'){return{intakeRisk:{title:body}};}
  return{intake:{type:'',title:text}};}
};

/* ── 12. boot sweep — idempotent, on the record ─────────────── */
function sweep(){
  // feedback verification lapsed past 7d grace → auto-open breakdown case (idempotent via lapsedCaseId)
  U.arr(S.feedback).forEach(f=>{
    if(f.kind==='correction'&&f.deliveredAt&&f.verifyAt&&f.held==null&&!f.lapsedCaseId&&D.days(f.verifyAt,D.today())>7){
      const r=ENG.registerCase({type:'feedback',sev:3,title:'correction with '+ENG.pname(f.subjectId)+' did not hold (+21d verification lapsed past grace)',
        desc:'Auto-opened by the boot sweep: correction delivered '+f.deliveredAt+', verification due '+f.verifyAt+', 7-day grace expired. The machine\u2019s arm, on the record.',
        personId:'',aboutId:f.subjectId});
      if(r.ok){f.lapsedCaseId=r.ok.id;
        STORE.log(S,'sweep','auto-opened feedback-breakdown case '+r.ok.id+' (lapsed '+f.verifyAt+')');
        BUS.emit('sweep:lapsed',{id:r.ok.id});}}
  });
  AUD.runAll();
  STORE.save();
}

  pts.forEach((p,i)=>{const seg=X(Math.max(i-1,0))+','+Y(pts[Math.max(i-1,0)].v)+' '+X(i)+','+Y(p.v);
    if(i===0)return;
    if(p.estimated||pts[i-1].estimated)dash+=(dash?' ':'')+seg;else solid+=(solid?' ':'')+seg;});
  return '<svg class="spark" viewBox="0 0 '+W+' '+HG+'" preserveAspectRatio="none">'+
    '<polyline points="'+pts.map((p,i)=>X(i)+','+Y(p.v)).join(' ')+'" fill="none" stroke="var(--line2)" stroke-width="1"/>'+
    (solid?'<polyline points="'+solid+'" fill="none" stroke="var(--amber)" stroke-width="1.8"/>':'')+
    (dash?'<polyline points="'+dash+'" fill="none" stroke="var(--amber)" stroke-width="1.5" stroke-dasharray="3 3" opacity=".55"/>':'')+
    pts.map((p,i)=>'<circle cx="'+X(i)+'" cy="'+Y(p.v)+'" r="'+(p.estimated?2:2.6)+'" fill="'+(p.estimated?'none':'var(--amber2)')+'" stroke="var(--amber2)" stroke-width="1" '+(p.estimated?'stroke-dasharray="2 2"':'')+'/>').join('')+'</svg>'+
    (pts.some(p=>p.estimated)?'<div class="mut small mono">≈ dashed = estimated reading (never moves the slope)</div>':'');},
griev:'<div class="grievance">Write every note as if it will be read aloud in the grievance room. Facts, dates, observable behavior — no mind-reading.</div>'
};

V.people=(arg,ev)=>{

  const rows=ps.sort((a,b)=>(b.lead-a.lead)||FW.flight(b,S).score-FW.flight(a,S).score).map(p=>{
    const fr=FW.flight(p,S),tr=FW.trust(p),nb=FW.ninebox(p);
    const open=U.arr(S.cases).filter(c=>!c.closed&&(c.aboutId===p.id||c.personId===p.id)).length;

    '<div class="grow"><div style="font:650 19px/1.2 var(--sans)">'+U.esc(p.name)+'</div><div class="s mono mut" style="margin-top:4px">'+U.esc(p.role)+' · '+ENG.tname(p.teamId)+' · last 1:1 '+(last?D.ago(last.date):'never')+'</div></div>'+
    '<button class="btn sm" data-a="person-edit" data-id="'+id+'">edit</button></div>'+
    '<div class="hbar" style="margin-top:14px">'+
    '<button class="btn pri" data-a="case-new-person" data-id="'+id+'">'+icon('plus')+'case on this person</button>'+
    '<button class="btn" data-a="fb-new" data-id="'+id+'">'+icon('message')+'feedback</button>'+
    '<button class="btn" data-a="oo-start" data-id="'+id+'">'+icon('calendar')+'finish-log a 1:1</button>'+
    '<button class="btn" data-a="deleg-new" data-id="'+id+'">'+icon('key')+'delegate</button></div></div>'+
  '<div class="grid g3 sect print-in" style="animation-delay:.05s">'+
    H.biz('<h3>Flight risk <span class="q">advisory — weighted drivers shown</span></h3>'+
      '<div class="knum" style="color:'+(fr.band==='HIGH'?'var(--red2)':fr.band==='WATCH'?'var(--amber2)':'var(--green)')+'">'+fr.score+'<small> /100 · '+fr.band+'</small></div>'+
      (fr.drivers.length?fr.drivers.map(d=>'<div class="row"><div class="grow"><div class="t">'+U.esc(d.k)+'</div><div class="s">'+U.esc(d.t)+'</div></div><span class="mono small" style="color:var(--amber2)">+'+d.w+'</span></div>').join(''):'<div class="mut small" style="margin:8px 0">no drivers firing</div>')+
      '<div class="note" style="margin-top:10px"><b>Intervention:</b> '+U.esc(fr.fix)+'</div>')+
    H.biz('<h3>Trust equation <span class="q">(C+R+I)/S — weakest numerator first</span></h3>'+
      '<div class="knum">'+tr.val+'<small> /15 max</small></div>'+
      [['credibility',p.trust.c],['reliability',p.trust.r],['intimacy',p.trust.i],['self-orientation',p.trust.s]].map(k=>'<div class="row"><div class="grow"><div class="t">'+k[0]+(k[0]==='self-orientation'?' <span class="mut small">(denominator — lower is better)</span>':'')+'</div></div><span class="hbar">'+[1,2,3,4,5].map(n=>'<button class="dotc" data-a="trust-set" data-id="'+id+'" data-k="'+k[0][0]+'" data-n="'+n+'" style="width:13px;height:13px;border-radius:50%;background:'+(n<=k[1]?(k[0]==='self-orientation'?'var(--red)':'var(--amber)'):'var(--ink3)')+';border:1px solid var(--line2)"></button>').join('')+'</span></div>').join('')+
      '<div class="note blue" style="margin-top:10px"><b>Fix:</b> '+U.esc(tr.fix)+'</div>')+
    H.biz('<h3>Nine-box <span class="q">click a cell — '+(nb.halved?'<span style="color:var(--red2)">stale '+nb.age+'d → halved weight</span>':'fresh')+'</span></h3>'+
      '<div class="nbox">'+[3,2,1].map(pot=>[1,2,3].map(perf=>{
        const me=nb.perf===perf&&nb.pot===pot;
        return '<div class="cell" data-a="ninebox-set" data-id="'+id+'" data-perf="'+perf+'" data-pot="'+pot+'" style="'+(me?'border-color:var(--amber);background:rgba(224,164,87,.08)':'')+'">'+
        '<span>p'+pot+'·f'+perf+'</span>'+(me?'<span class="who">'+U.esc(U.first(p.name))+'</span>':'')+'</div>';}).join('')).join('')+'</div>'+

  '</div>'+

  '</div>'+
  '<div class="grid g2 sect print-in" style="animation-delay:.11s">'+
    H.biz('<h3>Cases <span class="q">'+cases.filter(c=>!c.closed).length+' open</span></h3>'+
     (cases.length?cases.slice(0,6).map(c=>'<div class="row clickable" data-a="go" data-r="#/case/'+c.id+'">'+H.sev(c.sev)+'<div class="grow"><div class="t">'+U.esc(c.title)+'</div><div class="s">'+c.type+' · '+D.ago(c.opened)+(c.closed?' · closed':'')+'</div></div>'+H.runway(c)+'</div>').join(''):'<div class="mut small">none on record</div>'))+
    H.biz('<h3>Evidence ledger <span class="q">facts with dates — grievance-room standard</span></h3>'+H.griev+
     (ev.length?ev.slice(0,7).map(e=>'<div class="row"><div class="grow"><div class="t small">'+U.esc(e.text)+'</div><div class="s">'+e.t+(e.caseId?' · <a href="#/case/'+e.caseId+'" class="mut2">case '+e.caseId+'</a>':'')+'</div></div></div>').join(''):'<div class="mut small">empty — notes land here from capture (<span class="mono">note: @'+U.first(p.name).toLowerCase()+' …</span>) or the button below</div>')+
     '<form data-f="ev-add" data-id="'+id+'" style="margin-top:10px"><div class="hbar"><input name="text" required placeholder="observable fact, dated context…" style="flex:1;background:var(--ink);border:1px solid var(--line2);border-radius:8px;padding:7px 11px;font-size:12.5px;outline:none"><button class="btn sm pri">log</button></div></form>')+
  '</div>'+
  '<div class="grid g2 sect print-in" style="animation-delay:.14s">'+
    H.biz('<h3>Feedback <span class="q">'+(fb.filter(f=>!f.deliveredAt).length)+' undelivered</span></h3>'+
     (fb.length?fb.slice(0,5).map(f=>'<div class="row"><span class="dotc" style="background:'+(f.kind==='praise'?'var(--green)':f.kind==='correction'?'var(--amber)':'var(--blue)')+'"></span><div class="grow"><div class="t small">'+U.esc((f.sbi||'(draft — write the SBI)').slice(0,90))+'</div><div class="s">'+f.kind+' · '+(f.deliveredAt?'delivered '+D.ago(f.deliveredAt):'written '+D.ago(f.created)+' · <b style="color:var(--amber2)">undelivered</b>')+(f.kind==='correction'&&f.verifyAt?' · verify '+D.inN(f.verifyAt):'')+'</div></div></div>').join(''):'<div class="mut small">none — praise decays unwritten too</div>'))+
    H.biz('<h3>Ledger position <span class="q">debts + delegations</span></h3>'+
     (debtsIn.length?debtsIn.map(t=>'<div class="row"><div class="grow"><div class="t small">owes: '+U.esc(t.title)+'</div><div class="s">'+(t.due?D.inN(t.due):'undated')+'</div></div><button class="btn sm" data-a="task-done" data-id="'+t.id+'">'+icon('check',11)+'</button></div>').join(''):'<div class="mut small">no open debts</div>')+
     (dgs.length?dgs.map(d=>{const dh=FW.delegHealth(d,S);return '<div class="row"><div class="grow"><div class="t small">delegated: '+U.esc(d.title)+'</div><div class="s">health '+dh.score+' · '+dh.band+' · cadence '+d.checkEvery+'d</div></div><button class="btn sm" data-a="nav" data-r="delegation">open</button></div>';}).join(''):''))+
