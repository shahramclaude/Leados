<style>

/* ══ 3. FW — pure scoring models (no I/O, no mutation) ══════════ */
const FW={
clamp(v,a,b){return Math.max(a,Math.min(b,v));},
/* flight risk: 8 weighted drivers → 0..100 + top drivers + recommended move */
flightRisk(p,c){let s=0;const drv=[];
 const add=(w,cond,label,move)=>{if(cond){s+=w;drv.push({w,label,move});}};
 const now=todayStr();
 add(19,c.slope!==null&&c.slope<=-0.6,'mood trending down across '+c.moodN+' pulses','career-conversation SBI this week — name the trend, ask what would re-energize');
 add(15,c.daysSince11>=28,'no 1:1 in '+c.daysSince11+'d','book one today — silence is not consent, it is absence of data');
 add(13,c.trust&&c.trust.s>=6,'trust equation: self-orientation '+(c.trust?c.trust.s:'—')+' dominating','two kept micro-commitments before any big promise — rebuild ledger first');
 add(12,c.openCases>=2,c.openCases+' open cases on this person','clear or de-scope one — stacked pressure reads as being managed AT');
 add(11,c.nineStale,'nine-box stamp older than 120d','re-stamp — staleness here means you stopped thinking about their trajectory');
 add(10,c.debt>=2,c.debt+' commitments owed THEM are overdue','pay the debt or renegotiate it explicitly; quiet breakage is the loud signal');
 add(9,c.rampMissed,'a ramp gate passed unmet','name it in the 1:1 — missed gates that go unmentioned become the story');
 add(8,c.pulseLow,'latest pulse below 4/10','ask, then listen for the second answer');
 if(c.moodN===0&&c.daysSince11>=14){s+=3;drv.push({w:3,label:'under-instrumented: no pulse, no recent 1:1',move:'a leader flying blind on a person is a risk, full stop'});}
 s=FW.clamp(Math.round(s),2,98);
 drv.sort((a,b)=>b.w-a.w);
 return {score:s,tier:s>=70?'critical':s>=45?'watch':'steady',drivers:drv.slice(0,3),move:drv.length?drv[0].move:'keep cadence — the absence of signals is also a signal'};},
trustEq(t){if(!t)return null;const s=(t.c+t.r+t.i)/Math.max(1,t.s);return {v:Math.round(s*10),label:t.s>=6?'self-orientation bleeding':s>=5?'solid':'strong',top:[['credibility',t.c],['reliability',t.r],['intimacy',t.i],['self-orientation',t.s]].sort((a,b)=>b[1]-a[1])[0][0]};},
nineBoxCell(perf,pot){const b=v=>v<=3?0:v<=6?1:2;return b(perf)+b(pot)*3;},
nineBoxLabel(i){return ['Underperformer — coach or exit','Dilemma — potential unconverted','Growth puzzle','Effective — core contributor','Core star — ready for scope','High impact pro','Trusted pro — deepen mastery','Future star — stretch now','Star — succession candidate'][i]||'—';},
edmondson(a){/* 7 items, 1-7; items 2,4,6 reverse-scored */const rs=[0,1,0,1,0,1,0];const sc=a.map((v,i)=>rs[i]?8-v:v);const tot=sc.reduce((x,y)=>x+y,0);return {score:Math.round(tot/49*100),raw:tot,weakest:sc.indexOf(Math.min.apply(null,sc)),verdict:tot>=38?'safe enough to surface bad news':tot>=28?'performative safety — dissent is curated':'fear is tax you are paying silently'};},
EDM_Q:['If you make a mistake on this team, it is held against you.','Members of this team are able to bring up problems and tough issues.','People on this team sometimes reject others for being different.','It is safe to take a risk on this team.','It is difficult to ask other members of this team for help.','No one on this team would deliberately act in a way that undermines my efforts.','Working with members of this team, my unique skills and talents are valued and utilized.'],
fiveDys(a){/* [trust,conflict,commitment,accountability,results] 1-5 */const L=['absence of trust','fear of conflict','lack of commitment','avoidance of accountability','inattention to results'];let first=-1;for(let i=0;i<5;i++)if(a[i]==null||a[i]<3.5){first=i;break;}return {first,label:first===-1?'pyramid holding — audit it anyway':L[first],seq:first===-1?'—':'fix in sequence: '+L.slice(Math.max(0,first-1),first+2).join(' → ')};},
busFactor(team,people){const caps={};people.forEach(p=>(p.criticalFor||[]).forEach(c=>{(caps[c]=caps[c]||[]).push(p)}));return Object.keys(caps).map(k=>({cap:k,holders:caps[k],bus:caps[k].length})).sort((a,b)=>a.bus-b.bus);},
teamHealth(t,c){/* psych, dysf, goals, bus, casePressure blended */let s=0,n=0;
 if(c.psych!=null){s+=c.psych*.35;n+=.35;}
 if(c.dysFirst===-1){s+=80*.2;n+=.2;}else if(c.dysFirst!=null){s+=(80-c.dysFirst*18)*.2;n+=.2;}
 if(c.goal!=null){s+=c.goal*.2;n+=.2;}
 if(c.bus1===0){s+=90*.15;n+=.15;}else{s+=Math.max(10,60-c.bus1*22)*.15;n+=.15;}
 s+=FW.clamp(100-c.casePressure*18,5,100)*.1;n+=.1;
 const v=n?Math.round(s/n):null;return {score:v,verdict:v==null?'uninstrumented':v>=70?'healthy':v>=45?'straining':'critical'};},
krScore(kr){/* direction-aware 0..100 */const span=Math.abs(kr.target-kr.start)||Math.abs(kr.target)||1;if(kr.dir==='down'){return FW.clamp(Math.round((kr.start-kr.cur)/span*100),0,100);}return FW.clamp(Math.round((kr.cur-kr.start)/span*100),0,100);},
krTrajectory(kr){const h=kr.hist||[];if(h.length<2)return null;const a=h[h.length-2].v,b=h[h.length-1].v;const good=kr.dir==='down'?b<a:b>a;return {good,delta:Math.abs(b-a)};},
goalScore(g){const k=g.krs||[];if(!k.length)return null;const tw=k.reduce((x,y)=>x+(y.weight||1),0);return Math.round(k.reduce((x,y)=>x+FW.krScore(y)*(y.weight||1),0)/tw);},
riskScore(p,i){const v=p*i;return {v,tier:v>=15?'critical':v>=9?'high':v>=4?'managed':'low'};},
decisionCal(ds){const done=ds.filter(d=>d.status==='scored'&&d.conf!=null&&d.outcomeConf!=null);if(done.length<3)return null;const drift=done.reduce((x,d)=>x+(d.conf-d.outcomeConf),0)/done.length;return {n:done.length,drift:+drift.toFixed(1),verdict:drift>=2?'systematic overconfidence — demand premortems':drift<=-2?'underconfidence — you are slower than reality needs':'calibrated'};},
growQuality(o){let s=0;const bits=[];const gl=(o.g||'');
 if(/\d/.test(gl)||/by\s+\w+\s*\d/i.test(gl)){s+=30;bits.push('goal has a number or a date');}else if(gl.length>12){s+=14;bits.push('goal stated but not measurable');}
 const opts=(o.o||'').split('\n').map(x=>x.trim()).filter(Boolean);
 if(opts.length>=3){s+=30;bits.push(opts.length+' options on the table');}else if(opts.length==2){s+=16;bits.push('two options is a dilemma, not a choice');}else if(opts.length===1){s+=6;bits.push('one option is a foregone conclusion');}
 if((o.r||'').length>20){s+=15;bits.push('reality examined, not assumed');}
 const w=o.w||'';if(/\d{4}-\d{2}-\d{2}|\bby\s+\w+day\b|\bby\s+\w+\s*\d/i.test(w)){s+=25;bits.push('way-forward dated');}else if(w.length>10){s+=10;bits.push('way-forward vague — undated intention is a wish');}
 return {score:FW.clamp(s,0,100),bits,label:s>=70?'coaching-grade':s>=45?'functional':'a chat, not coaching'};},
batnaStrength(n){let s=0;const bits=[];
 if((n.ours.reservation||'').length>4){s+=30;bits.push('reservation point set BEFORE the room');}
 if((n.ours.batna||'').length>6){s+=25;bits.push('walkaway exists and is real');}
 if((n.theirs.guess||'').length>6){s+=15;bits.push('their interest probed, not guessed at the table');}
 if((n.theirs.walkaway||'').length>2){s+=10;bits.push('their walkaway estimated — ZOPA readable');}
 const cs=(n.concessions||[]).filter(c=>c.give&&c.get);
 if(cs.length&&cs.every(c=>c.when)){s+=20;bits.push('every give has a get and a by-when');}else if(cs.length){s+=10;bits.push('concessions planned but undated — they decay');}
 return {score:FW.clamp(s,0,100),bits,label:s>=70?'walk in':s>=45?'prep more':'do NOT enter the room yet'};},
aarQuality(a){let s=0;const bits=[];
 const num=/\d/;if(num.test(a.expected||'')&&num.test(a.actual||'')){s+=35;bits.push('expected vs happened both carry numbers');}else s+=8;
 const chain=FW.whyChain(a.whys||[]);s+=Math.round(chain.score*.4);
 if((a.improve||'').split('\n').filter(Boolean).length>=1&&/\d{4}-\d{2}-\d{2}|by\s+\w+day/i.test(a.improve||'')){s+=15;bits.push('improvement is dated');}
 if(/blame|fault|lazy|stupid/i.test(a.actual+' '+(a.whys||[]).join(' '))){s=Math.min(s,30);bits.push('blame detected — AAR is a learning instrument, not a weapon');}
 return {score:FW.clamp(s,0,100),bits,label:s>=70?'tuition paid':s>=45?'partial tuition':'re-run it'};},
whyChain(whys){const w=whys.map(x=>(x||'').trim()).filter(Boolean);let s=0;if(w.length>=4)s+=40;else if(w.length>=3)s+=25;else s+=w.length*6;const causal=/because|so that|which meant|therefore|due to|led to|so we|so the/i;if(w.filter(x=>causal.test(x)).length>=2){s+=30;}if(/because|why/i.test(w[w.length-1]||''))s+=10;return {score:FW.clamp(s,0,100),depth:w.length};},
meetingCost(m,rate){const hrs=m.mins/60*(m.freq||1)*52*m.attendees;return {annual:Math.round(hrs*rate),hours:Math.round(hrs)};},
meetingVerdict(m,rate){const c=FW.meetingCost(m,rate);const hasDec=(m.decisions||[]).some(d=>(d||'').trim());
 if(!hasDec&&(m.purpose||'').length<8)return {v:'kill-or-async',why:'no owned decision, no stated purpose — this is a memo with lights',c};
 if(!hasDec)return {v:'watch',why:'purpose exists but no decision owner — one more status round and it is ash',c};
 if(c.annual>60000)return {v:'watch',why:'pays rent but the rent is '+money(c.annual)+'/yr — audit the attendee list',c};
 return {v:'pays rent',why:'owned decisions, bounded cost',c};},
conflictTemp(openCases,people){const t=openCases.filter(c=>c.type==='conflict');let s=t.length*22;const escalated=t.filter(c=>c.sev>=4).length;s+=escalated*14;return FW.clamp(s+(people>8?5:0),0,100);},
energyBlend(e){if(!e)return null;return Math.round((e.focus+e.stamina+e.mood+e.clarity)/4*10);},
energyTrend(log){if(log.length<3)return null;const a=log.slice(-3).reduce((x,e)=>x+FW.energyBlend(e),0)/3;const b=log.slice(0,Math.max(1,log.length-3)).reduce((x,e)=>x+FW.energyBlend(e),0)/Math.max(1,log.length-3);return a-b;},
loadIndex(c){/* open sev, overdue, upcoming sessions, commitments */let v=c.openCases.reduce((x,k)=>x+k.sev*6,0)+c.overdueTasks*5+c.thisWeekSessions*2+Math.min(15,c.brokenYou*5);return {v:FW.clamp(v,0,100),verdict:v>=75?'overloaded — say no to something this week or the app will watch you degrade':v>=45?'heavy but steerable':'sustainable'};},
casePressure(openCases){return FW.clamp(openCases.reduce((x,c)=>x+(c.sev>=4?2:1)+(age(c.opened)>c.sla?1.5:0),0),0,20);},
spanStats(people){const spans={};people.forEach(p=>{if(p.managerId){spans[p.managerId]=(spans[p.managerId]||0)+1;}});const arr=Object.keys(spans).map(id=>({id,n:spans[id]}));const wide=arr.filter(x=>x.n>8);return {spans,arr,wide,max:arr.length?Math.max.apply(null,arr.map(x=>x.n)):0};},
commitDebt(oo){const rows=[];oo.forEach(o=>(o.commitments||[]).forEach(cm=>{if(!cm.done&&cm.due<todayStr())rows.push({p:o.personId,cm});}));return {overdue:rows,you:rows.filter(r=>r.cm.owedBy==='you'),them:rows.filter(r=>r.cm.owedBy==='them')};},
moodSlope(mood){if(!mood||mood.length<2)return null;const n=mood.length;let sx=0,sy=0,sxy=0,sxx=0;mood.forEach((m,i)=>{sx+=i;sy+=m.v;sxy+=i*m.v;sxx+=i*i;});const den=n*sxx-sx*sx;if(!den)return null;return +((n*sxy-sx*sy)/den).toFixed(2);},
rampHealth(p){const rc=p.rampChecks||[];if(!rc.length)return null;const missed=rc.filter(r=>!r.done&&r.d<todayStr());const done=rc.filter(r=>r.done).length;return {missed:missed.length,done,total:rc.length,verdict:missed.length?'gate missed — name it':done===rc.length?'ramp complete':'on track'};},
delegateMatch(level,skill,will){const sug=skill>=7&&will>=7?6:skill>=7?5:skill>=5&&will>=6?4:skill>=5?3:2;const misp=level-sug;return {suggested:sug,verdict:misp>=2?'over-rotating: L'+level+' for someone ready for L'+sug+' — this is abdication':misp<=-2?'holding too tight: L'+level+' where L'+sug+' fits — this is hoarding':'level fits readiness'};},
classifyCase(type,sev,kwhit){const T=CASE_TYPES[type];const cyn=T.cyn;const sla=sev>=5?Math.min(T.sla,2):sev>=4?Math.min(T.sla,7):T.sla;const q=sev>=4?'Q1 · do now':sev>=3&&(sla>3)?'Q2 · schedule':'Q3 · delegate / Q4 · drop';
 return {cyn,sla,q,escalate:type==='ethics_hr'||kwhit.length>0};},
daysIn(text){const m=(text||'').match(/\b(\d+)d\b/i);return m?+m[1]:null;}};

{id:'oneonone',l:'1:1 opener (build, not status)',fields:[['name','Their name'],['gap','Days since last 1:1'],['topic','Their likely top-of-mind']],body:f=>[f.name+' — before we touch a single status line: what is {topic} doing to your week?'.replace('{topic}',f.topic||'everything'),'','I have two things, but yours come first. What is the one thing I can make easier in the next 7 days?','','(Last session was '+ (f.gap||'?') +' days ago. That number is mine to manage, not yours.)'],guards:['No status in the first ten minutes — status is async-able','End with a commitment YOU own, dated']},

const LESSONS=[
{arc:'The Job',id:'job1',t:'You are a multiplier now, badly',body:'<h4>The math that breaks new managers</h4>Your hands produced output. Your job no longer has output — it has throughput through other people. A manager reviewing code at 11pm is a failing system, not a dedicated one.<h4>The test</h4><blockquote>If you vanished for two weeks, what degrades? That list is your actual job description. Everything else you do is a hobby the team tolerates.</blockquote><ul><li>Measure yourself on decisions unblocked, not tasks finished.</li><li>Your calendar is the org chart of your attention — read it weekly.</li></ul>',checks:[['Your primary output as a manager-of-managers is:',['Shipped features','Decisions unblocked and leaders grown','Team happiness reports','Escalation speed'],1],['You vanished for 2 weeks and things degrade — that list is:',['A failure of your team','Your actual job description','A hiring signal','HR\'s problem'],1],['Coding at 11pm as a new manager usually means:',['High standards','A failing delegation system','Short-term heroics that scale','Commitment'],1]]},
{arc:'The Job',id:'job2',t:'Managing managers ≠ managing makers',body:'<h4>The distance problem</h4>You are now two layers from the work. Every fact reaches you curated by someone with incentives. Skip-levels, verbatim evidence, and pulse data exist because your direct line of sight is gone.<h4>Your leads are your product</h4><ul><li>A weak lead costs you their whole team, compounded — intervene at the lead, not the team.</li><li>Watch what they delegate: it reveals what they think the job is.</li><li>Never route around a lead to their report. Coach THROUGH them or replace the route, never bypass silently.</li></ul>',checks:[['Your facts about team health arrive:',['Raw and complete','Curated by people with incentives','From dashboards','From HR'],1],['A struggling lead\'s team is performing badly. First move:',['Talk to the team directly','Coach or intervene at the lead','Reorganize immediately','Wait a quarter'],1],['Routing around a lead to their reports is:',['Efficient','Undermining — coach through or replace the route','Fine if urgent','Skip-level best practice'],1]]},
{arc:'Trust',id:'trust1',t:'The trust equation is arithmetic',body:'<h4>(Credibility + Reliability + Intimacy) / Self-orientation</h4>Trust is not a vibe. It divides by how much of your behavior reads as self-interest. One "that deadline was really about MY review" resets months of reliability.<h4>Deposits and withdrawals</h4><ul><li>Kep micro-commitments are the highest-yield deposit — and the ledger in this app counts what you owe.</li><li>Bad news delivered early is a deposit; the same news late is a withdrawal with interest.</li></ul><blockquote>People rarely leave over one betrayal. They leave over the arithmetic.</blockquote>',checks:[['Trust divides by:',['Confidence','Self-orientation','Seniority','Volume'],1],['Highest-yield trust deposit:',['Grand gestures','Kept micro-commitments','Team events','Public praise'],1],['Bad news early is a deposit because:',['It hides risk','It proves you optimize their interests over your comfort','HR requires it','It tests loyalty'],1]]},
{arc:'Trust',id:'trust2',t:'Psychological safety is detected, not declared',body:'<h4>Edmondson\'s point</h4>You cannot announce safety. You measure it with behavior: do people bring bad news, admit mistakes, dissent in the room? The scan in this app reverse-scores the traps — a high "it is safe to take a risk" with a high "mistakes are held against you" means people are telling you what you want to hear.<h4>The morphology of fear</h4><ul><li>Meetings full of status, empty of disagreement: fear or futility, both on you.</li><li>Questions asked only in private: the room is not safe.</li><li>Your reaction to the NEXT bad news decides the following one.</li></ul>',checks:[['High safety score + high "mistakes held against you" means:',['Great culture','People are curating answers','Survey error','HR issue'],1],['Questions that arrive only in private signal:',['Introversion','The room is not safe','Efficiency','Respect'],1],['What decides whether you get bad news next time:',['Your reaction to this one','An open-door policy','Anonymous surveys','Nothing'],0]]},
{arc:'Decisions',id:'dec1',t:'Doors: one-way and two-way',body:'<h4>Bezos\'s monosyllable that saves quarters</h4>Type 1: irreversible, walk through slowly — premortem mandatory. Type 2: reversible, decide in minutes and learn. New managers invert this: agonize over reversible choices, sleepwalk through irreversible ones.<h4>The failure mode</h4><ul><li>Slow Type-2 decisions are not prudence, they are cost — the team stops bringing you choices.</li><li>A Type-1 without a premortem is gambling with extra steps. This app refuses to log one.</li></ul>',checks:[['Which deserves the premortem?',['Reversible choices','Irreversible choices','Cheap choices','Fast choices'],1],['Slow reversible decisions teach the team to:',['Think harder','Stop bringing you choices','Escalate more','Document more'],1],['Type 2 door strategy:',['Analyze deeply','Decide fast, learn, adjust','Delegate always','Avoid them'],1]]},
{arc:'Decisions',id:'dec2',t:'Premortems and the calibration ledger',body:'<h4>"It is six months later and this failed. Why?"</h4>Prospective hindsight surfaces what polite optimism hides — and the best premortem rows become P×I risks with dates, which this app converts automatically.<h4>Stamped confidence</h4>Every decision you log carries your confidence at write-time. At review, outcome gets scored. After three scored reviews you get a number: are you systematically overconfident? Most new managers are, by ~2 points on 10.<ul><li>Overconfidence → demand premortems of yourself.</li><li>Underconfidence → you are slower than reality needs; raise tempo.</li></ul>',checks:[['Premortem output belongs in:',['Meeting notes','The risk register with dates','HR file','Nowhere'],1],['Confidence is stamped:',['At review time','At write time','Never','By consensus'],1],['Systematic overconfidence of +2 means you should:',['Decide faster','Demand premortems of yourself','Delegate more','Trust instinct'],1]]},
{arc:'People',id:'ppl1',t:'Feedback is a gift with a shelf life',body:'<h4>SBI and the 48-hour rule</h4>Situation-Behavior-Impact keeps feedback about observable reality. Praise decays in 48h, corrections in 72h — after that you are delivering archaeology, and this app\'s aging clocks say so.<h4>Ratios and verification</h4><ul><li>60-85% positive per direct is the bandwidth of being heard — the balance board tracks it.</li><li>A correction without a +21d verification is a hope, not feedback.</li></ul>',checks:[['Corrections decay in:',['A week','72 hours','A quarter','Never'],1],['SBI keeps feedback about:',['Character','Observable reality','Intent','Potential'],1],['A correction without verification is:',['Still valid','A hope, not feedback','HR\'s job','Wasted breath'],1]]},
{arc:'People',id:'ppl2',t:'Flight risk: detect slope, not state',body:'<h4>Eight drivers, weighted</h4>Mood slope, 1:1 silence, self-orientation, stacked cases, stale nine-box, broken commitments owed them, missed ramp gates, low pulse. The number matters less than the driver list — each comes with a move.<h4>What never works</h4><ul><li>Counter-offers to a meaning problem.</li><li>Waiting for the resignation to manage retention.</li><li>Treating "I\'m fine" as data when the trend says otherwise.</li></ul>',checks:[['The flight model\'s job is to surface:',['A verdict','Drivers with moves','A fire list','Salary bands'],1],['A counter-offer fails when the driver is:',['Money','Meaning','Title','Office'],1],['"I\'m fine" vs a falling pulse trend — believe:',['The words','The trend','Neither','HR'],1]]},
{arc:'Conflict',id:'conf1',t:'Mediate or the conflict metastasizes',body:'<h4>The six-stage spine</h4>Frame → stories → interests → options → agreement → follow-up. Agreements embedded into structure (working agreement, ownership, norms) survive; promises made in your office evaporate.<h4>The ejection seat</h4><ul><li>Mediation is for task/process friction. Anything protected-class → stop, HR, now. This app hard-stops twice and means it.</li><li>Refereeing from summaries instead of hearing each side verbatim is how you become the third conflict.</li></ul>',checks:[['Agreements survive when embedded in:',['Memory','Structure — agreements, ownership, norms','Emails','Goodwill'],1],['Protected-class content surfaces mid-mediation:',['Continue carefully','Stop; convert to HR escalation','Take sides','Document then continue'],1],['Hearing only summaries makes you:',['Efficient','The third conflict','Fair','Informed'],1]]},
{arc:'Conflict',id:'conf2',t:'Radical candour is a quadrant, not a personality',body:'<h4>Care personally × challenge directly</h4>Care without challenge = ruinous empathy. Challenge without care = obnoxious aggression. Neither without either = manipulative insincerity — the most common new-manager failure, because it feels like peace.<h4>The practice</h4><ul><li>Name the quadrant you operated from this week — this app\'s mirror stamps it.</li><li>Move one conversation from empathy to candour per week; the ledger is in Feedback.</li></ul>',checks:[['Challenge without care is:',['Radical candour','Obnoxious aggression','Ruinous empathy','Directness'],1],['The most common new-manager quadrant:',['Candour','Manipulative insincerity','Aggression','Empathy'],1],['"Peace" that avoids hard conversations is usually:',['Harmony','Debt compounding','Culture','Wisdom'],1]]},
{arc:'Rhythm',id:'rhy1',t:'Cadence is the job made visible',body:'<h4>Why the app books your 1:1s for you</h4>Leads weekly, reports biweekly — not because conversation is magic, but because detection needs samples. Missed cadence = no telemetry = flying blind, and the rules engine nags accordingly.<h4>Agendas build themselves</h4>Six sources: carried items, commitments due, new evidence, open cases, flight drivers, skip themes. If your 1:1 has no agenda, you are having a chat. Chats are fine; they are not management.',checks:[['Cadence exists primarily for:',['Rapport','Detection — sample rate on reality','Compliance','Status'],1],['1:1 agendas here are built from:',['Templates','Six live sources','Last week\'s notes','HR'],1],['Missing cadence means:',['Rest','No telemetry — flying blind','Trust','Efficiency'],1]]},
{arc:'Rhythm',id:'rhy2',t:'The review loop is the course you never take',body:'<h4>Where leadership skill actually comes from</h4>Not from lessons like this one — from closing loops. Case → outcome → lesson → +30d verification → AAR on the big ones. Every closed loop is a rep; every unclosed one is tuition paid for a class you skipped.<h4>The weekly ritual</h4>Seven days of digest, one pressure trend, four ritual fields. Twenty minutes. The leaders who outgrow their peers are the ones whose review loop runs even when — especially when — the week was bad.',checks:[['Skill compounds through:',['Courses','Closed review loops','Seniority','Books'],1],['"Tuition unpaid" means:',['A course fee','A sev-4+ case closed without an AAR','Late invoices','Skipped 1:1'],1],['The loop runs especially when:',['Time permits','The week was bad','HR asks','Quarter end'],1]]}];
/* ══ 5. ENGINE — case spine, wires, cascades ═════════════════════ */
function activePeople(){return list('people').filter(p=>!p.archived);}
function leads(){return activePeople().filter(p=>p.lead);}
function reportsOf(id){return activePeople().filter(p=>p.managerId===id);}
function openCases(){return list('cases').filter(c=>c.status==='open');}
function openTasks(){return list('tasks').filter(t=>t.status==='open');}
function personName(id){const p=get('people',id);return p?p.name:'—';}
function teamName(id){const t=get('teams',id);return t?t.name:'—';}
function selfPerson(){return S.settings.selfId?get('people',S.settings.selfId):null;}
function mkTask(t,o){return put('tasks',Object.assign({id:uid('t'),title:t,status:'open',created:todayStr(),due:todayStr(),owner:'you',caseId:null,personId:null,doneAt:null,kind:'engine'},o||{}));}
function lastDone11(pid){const s=list('oneonones').filter(o=>o.personId===pid&&o.status==='done').sort((a,b)=>b.date.localeCompare(a.date))[0];return s||null;}
function commitmentsOf(pid){const rows=[];list('oneonones').forEach(o=>{if(o.personId!==pid)return;(o.commitments||[]).forEach(cm=>rows.push(Object.assign({session:o.date},cm)));});return rows;}
function ctxFor(p){
 const slope=FW.moodSlope(p.mood||[]);const d11=lastDone11(p.id);
 const debt=commitmentsOf(p.id).filter(cm=>cm.owedBy==='you'&&!cm.done&&cm.due<todayStr()).length;
 return {slope:slope,moodN:(p.mood||[]).length,daysSince11:d11?age(d11.date):30,trust:p.trust,openCases:openCases().filter(c=>c.personId===p.id).length,
 nineStale:!p.nineBox||age(p.nineBox.at)>120,debt:debt,rampMissed:(p.rampChecks||[]).some(r=>!r.done&&r.d<todayStr()),pulseLow:(p.mood&&p.mood.length&&p.mood[p.mood.length-1].v<4)||false,
 flight:p.flightHist};
}
function flightOf(p){return FW.flightRisk(p,ctxFor(p));}
/* — intake classification (pure-ish: reads S for dup + lesson) — */
function kwScan(text){const t=(text||'').toLowerCase();return ESC_KW.filter(k=>t.includes(k));}
function intakePreview(type,title,notes,sev,personId,teamId){
 const kwhit=kwScan((title||'')+' '+(notes||''));const cls=FW.classifyCase(type,sev,kwhit);const T=CASE_TYPES[type];
 const dup=openCases().find(c=>c.type===type&&c.personId===personId&&c.teamId===teamId&&(c.title||'').toLowerCase()===(title||'').toLowerCase());
 const lastClosed=list('cases').filter(c=>c.type===type&&c.status==='closed'&&c.lesson).sort((a,b)=>b.closedAt.localeCompare(a.closedAt))[0];
 return {kwhit,cls,T,dup,lastClosed,wires:cls.escalate?['escalation']:T.wires.slice()};
}
/* — WIRES: one kind = one real write path. Escalation is a STOP, not a wire. — */
const WIRES={
escalation(c,lg){/* hard-stop: only evidence + HR task, nothing else — by design */},
evidence(c,lg){c.evidence.push({d:todayStr(),t:c.notes,verbatim:true,src:'intake'});lg.push({k:'evidence',label:'verbatim evidence sealed ('+c.evidence.length+')',route:'/case/'+c.id});},
playbook(c,lg){CASE_TYPES[c.type].pb.forEach(pb=>{mkTask(pb[0],{caseId:c.id,personId:c.personId,due:addDays(todayStr(),Math.round(pb[1])),kind:'playbook'});});lg.push({k:'task',label:CASE_TYPES[c.type].pb.length+' playbook tasks dispatched',route:'/case/'+c.id});},
agenda(c,lg){lg.push({k:'agenda',label:'injected into '+personName(c.personId||null)+' 1:1 agenda (auto-source)',route:'/oneonones'});},
diag(c,lg){c.diag=null;lg.push({k:'diag',label:'4-cause diagnosis armed — BLOCKS closure',route:'/case/'+c.id});},
sbi(c,lg){const f=put('feedback',{id:uid('f'),personId:c.personId,kind:'correction',s:'',b:c.notes.slice(0,140),i:'',status:'draft',created:todayStr(),deliveredAt:null,verifyAt:null,verifyOutcome:null,caseId:c.id});lg.push({k:'sbi',label:'SBI draft composed — ageing clock running',route:'/feedback'});},
risk(c,lg){const r=put('risks',{id:uid('r'),title:c.title,p:3,i:3,caseId:c.id,personId:c.personId||null,status:'open',created:todayStr(),mitigation:null});lg.push({k:'risk',label:'P×I risk row opened (3×3 — re-score it)',route:'/portfolio'});},
decision(c,lg){const d=put('decisions',{id:uid('d'),title:'Call: '+c.title,type:2,owner:'you',daci:'',conf:6,premortem:[],decided:todayStr(),review:addDays(todayStr(),7),status:'open',created:todayStr(),redates:[],outcome:null,outcomeConf:null,caseId:c.id});lg.push({k:'decision',label:'decision row + review gate +7d',route:'/decisions'});},
med(c,lg){const m=put('mediations',{id:uid('m'),caseId:c.id,a:c.personId,b:null,teamId:c.teamId||null,stage:0,stages:{frame:'',stories:'',interests:'',options:'',agreement:'',embed:[]},status:'active',created:todayStr(),updated:todayStr()});c.medId=m.id;lg.push({k:'med',label:'6-stage mediation protocol armed',route:'/mediation'});},
comms(c,lg){const k=put('comms',{id:uid('cm'),kind:c.type==='crisis'?'crisis-note':c.type==='change_org'?'change-announce':'stakeholder-note',to:'',subject:CASE_TYPES[c.type].l+': '+c.title,body:'FACTS (verbatim, no adjectives):\n'+c.notes+'\n\nWHAT CHANGES:\n[fill precisely]\n\nWHAT DOES NOT CHANGE:\n[fill precisely]\n\nNEXT UPDATE: '+addDays(todayStr(),3),status:'draft',caseId:c.id,created:todayStr(),sentAt:null});lg.push({k:'comms',label:'guardrailed comms drafted (facts/change/next-update)',route:'/portfolio'});},
kt(c,lg){const p=c.personId?get('people',c.personId):null;const caps=p?(p.criticalFor||[]):[];caps.forEach(cap=>mkTask('KT plan: '+cap+' ('+p.name+')',{caseId:c.id,personId:p.id,due:addDays(todayStr(),5),kind:'kt'}));lg.push({k:'task',label:caps.length?caps.length+' KT tasks (one per critical capability)':'no critical capabilities registered',route:'/person/'+(p?p.id:'')});},
ramp(c,lg){const p=c.personId?get('people',c.personId):null;if(p){p.rampChecks=[{d:addDays(todayStr(),30),done:false,note:'30d: sees the whole board'},{d:addDays(todayStr(),60),done:false,note:'60d: owns a real outcome'},{d:addDays(todayStr(),90),done:false,note:'90d: trusted solo rep'}];lg.push({k:'ramp',label:'30/60/90 gates stamped on '+p.name,route:'/person/'+p.id});}},
goallink(c,lg){const g=list('goals').filter(x=>x.status==='open'&&(!c.teamId||x.teamId===c.teamId)).sort((a,b)=>(FW.goalScore(a)||100)-(FW.goalScore(b)||100))[0];if(g){c.goalId=g.id;lg.push({k:'goal',label:'linked to "'+g.title+'" ('+FW.goalScore(g)+'% trajectory)',route:'/portfolio'});}},
retro(c,lg){mkTask('Run retro (STOP/START) — '+CASE_TYPES[c.type].l,{caseId:c.id,due:addDays(todayStr(),5),kind:'retro'});lg.push({k:'retro',label:'retro engine armed (STOP/START → owned tasks)',route:'/team/'+(c.teamId||'')});},
stake(c,lg){lg.push({k:'stake',label:'stakeholder grid — update stance before next touch',route:'/portfolio'});},
prewire(c,lg){const sk=list('stakeholders').filter(s=>s.stance==='skeptic'||s.stance==='blocker');sk.forEach(s=>mkTask('Pre-wire '+s.name+' (24h before the room)',{caseId:c.id,due:addDays(todayStr(),2),kind:'prewire'}));lg.push({k:'task',label:sk.length?sk.length+' pre-wire tasks (skeptics first)':'no skeptics on the grid — add one if they exist',route:'/portfolio'});},
pipereq(c,lg){const r=put('pipeline',{id:uid('pi'),teamId:c.teamId||null,role:'Backfill: '+c.title,cands:[],outcome:null,opened:todayStr(),caseId:c.id});lg.push({k:'pipereq',label:'backfill requisition opened',route:'/pipeline'});},
bench(c,lg){c.timeline.push({d:todayStr(),t:Engine.benchReadout(c.personId),k:'info'});lg.push({k:'bench',label:'succession readout written to timeline',route:'/case/'+c.id});}
};
const Engine={
benchReadout(pid){const p=get('people',pid);if(!p)return 'bench: n/a';const caps=p.criticalFor||[];const bench=activePeople().filter(x=>x.id!==pid&&x.teamId===p.teamId&&(x.criticalFor||[]).some(c=>caps.includes(c)));if(!bench.length)return 'BENCH READOUT: no internal cover for '+caps.join(', ')+' — bus factor 1. External pipeline is the only hedge.';return 'BENCH READOUT: '+bench.map(b=>b.name).join(', ')+' partially cover ['+caps.join(', ')+']. Next rep: shadow one of their sessions this month.';},
createCase(inp){
 const pv=intakePreview(inp.type,inp.title,inp.notes,inp.sev,inp.personId||null,inp.teamId||null);
 if(pv.dup)return {ok:false,dup:pv.dup,preview:pv};
 const escalated=pv.cls.escalate;
 const c=put('cases',{id:uid('c'),type:inp.type,title:inp.title.trim(),sev:inp.sev,sla:pv.cls.sla,cyn:pv.cls.cyn,q:pv.cls.q,personId:inp.personId||null,teamId:inp.teamId||null,notes:(inp.notes||'').trim(),status:'open',opened:todayStr(),closedAt:null,outcome:null,lesson:null,verifiedAt:null,escalated:escalated,kwhits:pv.kwhit,diag:undefined,evidence:[],timeline:[{d:todayStr(),t:'Case registered — '+CASE_TYPES[inp.type].l+' · severity '+inp.sev+' · SLA '+pv.cls.sla+'d',k:'acc'}],ledger:[],links:[],goalId:null,medId:null});
 if(escalated){
  c.evidence.push({d:todayStr(),t:c.notes,verbatim:true,src:'intake'});
  mkTask('CONTACT HR TODAY — verbatim evidence attached. Do NOT investigate alone.',{caseId:c.id,due:todayStr(),kind:'hr'});
  c.ledger.push({k:'escalation',label:WIRE_META.escalation,route:'/case/'+c.id});
  c.timeline.push({d:todayStr(),t:'Escalation test fired'+(pv.kwhit.length?' (keywords: '+pv.kwhit.join(', ')+')':'')+' — automation halted by design. Judgment + HR own this.',k:'risk'});
 } else {
  CASE_TYPES[inp.type].wires.forEach(w=>{try{WIRES[w](c,c.ledger);}catch(e){c.ledger.push({k:'wire-fault',label:w+': '+e.message,route:'/data'});}});
  if(c.personId||c.teamId){
   const rel=openCases().filter(x=>x.id!==c.id&&((c.personId&&x.personId===c.personId)||(c.teamId&&x.teamId===c.teamId)));
   rel.forEach(x=>{c.links.push(x.id);x.links.push(c.id);});
   if(rel.length)c.timeline.push({d:todayStr(),t:'Cross-linked to '+rel.length+' other open case(s) on this scope — two live cases is signal, never coincidence.',k:'risk'});
  }
 }
 bump();MentorCache=null;save();
 return {ok:true,case:c,preview:pv};
},
closeCase(id,outcome,lesson){
 const c=get('cases',id);if(!c)return{ok:false,msg:'case gone'};
 if(!outcome||!lesson)return{ok:false,msg:'Outcome and lesson are mandatory — closure is checked, not assumed.'};
 if(c.type==='performance'&&!c.diag)return{ok:false,msg:'4-cause diagnosis not run. Closing a performance case without it is malpractice — the gate stands.'};
 openTasks().forEach(t=>{if(t.caseId===id){t.status='cancelled';t.doneAt=todayStr();}});
 c.status='closed';c.closedAt=todayStr();c.outcome=outcome;c.lesson=lesson;
 c.timeline.push({d:todayStr(),t:'CLOSED. Outcome: '+outcome,k:'ok'});
 put('journal',{id:uid('j'),at:todayStr(),kind:'case-lesson',type:c.type,text:lesson,caseId:id});
 const vt=mkTask('+30d verification: did the fix hold? — '+c.title,{caseId:id,due:addDays(todayStr(),30),kind:'verify'});
 let aar=null;
 if(c.sev>=4){aar=put('aars',{id:uid('a'),caseId:id,title:'AAR: '+c.title,expected:'',actual:'',whys:['','','','',''],improve:'',status:'draft',created:todayStr(),quality:0});c.timeline.push({d:todayStr(),t:'AAR armed (sev '+c.sev+') — tuition due.',k:'info'});}
 bump();MentorCache=null;save();
 return {ok:true,verify:vt,aar:aar};
},
reopenCase(id){const c=get('cases',id);if(!c)return;c.status='open';c.closedAt=null;c.timeline.push({d:todayStr(),t:'RE-OPENED — closure was premature. Harder verification owed.',k:'risk'});put('journal',{id:uid('j'),at:todayStr(),kind:'reopen',type:c.type,text:'Re-opened: '+c.title,caseId:id});bump();MentorCache=null;save();},
/* — 1:1 engine — */
scheduleOneOnOne(pid,date,src){
 const ex=list('oneonones').find(o=>o.personId===pid&&o.date===date&&o.status!=='done');
 if(ex)return ex;
 const p=get('people',pid);const next=list('oneonones').filter(o=>o.personId===pid&&o.status!=='done'&&o.date>=todayStr()).sort((a,b)=>a.date.localeCompare(b.date));
 if(next.length&&next[0].date<=date)return next[0];
 return put('oneonones',{id:uid('o'),personId:pid,date:date,status:'booked',agenda:[],notes:'',mood:null,moodDims:null,commitments:[],booked:todayStr(),src:src||'manual',moves:0});
},
agendaFor(pid){
 const items=[];const p=get('people',pid);if(!p)return items;
 commitmentsOf(pid).filter(cm=>!cm.done&&cm.due<=addDays(todayStr(),7)).forEach(cm=>items.push({src:cm.due<todayStr()?'OVERDUE commitment':'commitment',text:(cm.owedBy==='you'?'You owe them: ':'They owe you: ')+cm.text+' (due '+cm.due+')'}));
 list('feedback').filter(f=>f.personId===pid&&f.status==='delivered'&&age(f.deliveredAt)<=14).forEach(f=>items.push({src:'fresh evidence',text:'SBI delivered '+age(f.deliveredAt)+'d ago — ask how it landed'}));
 openCases().filter(c=>c.personId===pid).forEach(c=>items.push({src:'open case',text:sevGlyph(c.sev)+' '+c.title+' ('+age(c.opened)+'d old)'}));
 const fl=flightOf(p);if(fl.score>=45&&fl.drivers.length)items.push({src:'flight driver',text:fl.drivers[0].label+' → '+fl.drivers[0].move});
 list('skips').filter(sk=>sk.leadId===pid&&!sk.injected).forEach(sk=>{items.push({src:'skip theme · de-identified',text:'Theme from their team (de-identified): '+sk.theme});sk.injected=true;});
 (p.rampChecks||[]).filter(r=>!r.done&&r.d<=addDays(todayStr(),7)).forEach(r=>items.push({src:'ramp gate',text:r.note+' — due '+r.d}));
 return items;
},
completeOneOnOne(id,data){
 const o=get('oneonones',id);if(!o)return;
 o.status='done';o.notes=data.notes||'';o.mood=data.mood||null;o.moodDims=data.moodDims||null;o.commitments=(o.commitments||[]).concat(data.commitments||[]);
 const p=get('people',o.personId);
 if(p&&data.mood){p.mood=(p.mood||[]).concat([{d:todayStr(),v:data.mood}]).slice(-12);const ctx=ctxFor(p);p.flightHist=(p.flightHist||[]).concat([{d:todayStr(),v:FW.flightRisk(p,ctx).score}]).slice(-12);}
 if(p){const cad=p.lead?(S.settings.cadenceLead||7):(S.settings.cadenceRep||14);Engine.scheduleOneOnOne(p.id,addDays(todayStr(),cad),'auto-cadence');}
 bump();MentorCache=null;save();
},
/* — feedback — */
deliverFeedback(id){const f=get('feedback',id);if(!f)return;f.status='delivered';f.deliveredAt=todayStr();
 if(f.kind==='correction'){f.verifyAt=addDays(todayStr(),21);mkTask('+21d artifact check: did the behavior change? — with '+personName(f.personId),{personId:f.personId,due:f.verifyAt,kind:'fbverify',ref:id});}
 bump();MentorCache=null;save();},
verifyFeedback(id,outc){const f=get('feedback',id);if(!f)return;f.verifyOutcome=outc;
 if(outc==='changed'){put('journal',{id:uid('j'),at:todayStr(),kind:'feedback-held',text:'Correction to '+personName(f.personId)+' verified at +21d — artifact seen.'});
 }else{put('journal',{id:uid('j'),at:todayStr(),kind:'feedback-failed',text:'Correction to '+personName(f.personId)+' did NOT hold at +21d — case warranted.'});}
 bump();MentorCache=null;save();return outc;},
/* — decisions — */
premortemToRisks(d){(d.premortem||[]).filter(Boolean).forEach(line=>put('risks',{id:uid('r'),title:line,p:3,i:3,decisionId:d.id,caseId:d.caseId||null,personId:null,status:'open',created:todayStr(),mitigation:null}));bump();MentorCache=null;save();},
/* — hiring cascade — */
acceptCascade(pipeId,candIdx){
 const r=get('pipeline',pipeId);if(!r)return;const cd=r.cands[candIdx];if(!cd)return;
 const leadOfTeam=list('people').find(p=>p.teamId===r.teamId&&p.lead&&!p.archived);
 const p=put('people',{id:uid('p'),name:cd.name,role:r.role,teamId:r.teamId,managerId:leadOfTeam?leadOfTeam.id:(S.settings.selfId||null),lead:false,salary:0,startDate:todayStr(),archived:false,leaveUntil:null,mood:[],trust:null,nineBox:null,flightHist:[],criticalFor:[],dev:null,rampChecks:null});
 cd.stage='accepted';r.outcome='filled:'+cd.name;
 Engine.createCase({type:'onboarding',title:'Onboarding: '+cd.name+' ('+r.role+')',sev:2,personId:p.id,teamId:r.teamId,notes:'Accepted via pipeline. Day-1 contract owed: what good looks like at 30/60/90.'});
 Engine.scheduleOneOnOne(p.id,addDays(todayStr(),2),'accept-cascade');
 bump();MentorCache=null;save();return p;
},
/* — mediation — */
medAdvance(id,gateNote){
 const m=get('mediations',id);if(!m)return{ok:false};
 const ORDER=6;if(m.stage>=ORDER-1)return{ok:false,msg:'protocol complete'};
 if((m.stage===0||m.stage===3)&&gateNote!=='CLEAN'){ /* gates into stories(1) and agreement(4) */
  m.status='converted';m.updated=todayStr();
  const c=get('cases',m.caseId);
  if(c){c.escalated=true;c.type='ethics_hr';c.timeline.push({d:todayStr(),t:'Mediation hard-stop fired at stage '+(m.stage+1)+' — protected-class content surfaced. Converted to HR escalation.',k:'risk'});mkTask('CONTACT HR TODAY — mediation surfaced protected-class content.',{caseId:c.id,due:todayStr(),kind:'hr'});}
  bump();MentorCache=null;save();return{ok:true,converted:true};
 }
 m.stage++;m.updated=todayStr();bump();MentorCache=null;save();return{ok:true};
},
medEmbed(id,targets,text){
 const m=get('mediations',id);if(!m)return;m.stages.embed=targets;m.stages.agreement=text;m.status='embedded';m.updated=todayStr();
 targets.forEach(t=>{if(t==='working'&&m.teamId){const tm=get('teams',m.teamId);if(tm){tm.working=tm.working||{decisions:'',channels:'',urgency:'',conflict:'',sacred:'',extra:[],at:todayStr()};tm.working.extra=(tm.working.extra||[]).concat([{d:todayStr(),t:text}]);}}});
 const c=get('cases',m.caseId);if(c){c.evidence.push({d:todayStr(),t:'Mediation agreement: '+text,verbatim:true,src:'mediation'});c.timeline.push({d:todayStr(),t:'Agreement embedded into structure: '+targets.join('/'),k:'ok'});}
 mkTask('+14d mediation verification: is the agreement holding?',{caseId:m.caseId,due:addDays(todayStr(),14),kind:'medverify'});
 bump();MentorCache=null;save();
},
/* — AAR — */
aarCommit(id,data){
 const a=get('aars',id);if(!a)return{ok:false};
 const q=FW.aarQuality(data);
 if(q.score<45)return{ok:false,msg:'Quality '+q.score+' — this is not an AAR yet. '+q.bits.join(' · ')};
 Object.assign(a,data,{status:'done',quality:q.score,doneAt:todayStr()});
 (data.improve||'').split('\n').filter(Boolean).forEach(line=>{const dd=FW.daysIn(line)||7;mkTask(line.replace(/\s*by\s+\d+d/i,''),{due:addDays(todayStr(),dd),kind:'aar',ref:id});});
 const c=a.caseId?get('cases',a.caseId):null;if(c)c.timeline.push({d:todayStr(),t:'AAR committed — quality '+q.score+' ('+q.label+').',k:'ok'});
 put('journal',{id:uid('j'),at:todayStr(),kind:'aar',text:'AAR '+q.label+' ('+q.score+') on "'+a.title+'"',caseId:a.caseId});
 bump();MentorCache=null;save();return{ok:true,q};
},
catchUp(since){
 const ev=[];
 list('cases').forEach(c=>{if(c.opened>=since)ev.push({d:c.opened,t:'Case opened: '+c.title,k:'risk'});if(c.closedAt&&c.closedAt>=since)ev.push({d:c.closedAt,t:'Closed: '+c.title+' — lesson: '+(c.lesson||'—'),k:'ok'});});
 list('feedback').forEach(f=>{if(f.deliveredAt&&f.deliveredAt>=since)ev.push({d:f.deliveredAt,t:'SBI to '+personName(f.personId),k:'info'});});
 list('decisions').forEach(d=>{if(d.decided>=since)ev.push({d:d.decided,t:'Decision logged: '+d.title,k:'info'});});
 return ev.sort((a,b)=>b.d.localeCompare(a.d));
},
hrPacket(pid){
 const p=get('people',pid);if(!p)return'';
 const ev=list('feedback').filter(f=>f.personId===pid&&f.status==='delivered');
 const cs=list('cases').filter(c=>c.personId===pid);
 let out='HR PACKET — '+p.name+' ('+p.role+') · generated '+todayStr()+'\nCONFIDENTIAL — verbatim facts only, no adjectives.\n\n';
 out+='EVIDENCE LEDGER (delivered SBI):\n'+(ev.length?ev.map(f=>'- '+f.deliveredAt+' ['+f.kind+'] S: '+f.s+' | B: '+f.b+' | I: '+f.i+(f.verifyOutcome?' | +21d: '+f.verifyOutcome:'')).join('\n'):'none')+'\n\n';
 out+='CASES:\n'+(cs.length?cs.map(c=>'- '+c.opened+' '+CASE_TYPES[c.type].l+' sev'+c.sev+' → '+c.status+(c.lesson?' | lesson: '+c.lesson:'')).join('\n'):'none')+'\n';
 cs.forEach(c=>{if(c.evidence&&c.evidence.length)out+='\nVerbatim ('+c.title+'):\n'+c.evidence.map(e=>'· '+e.d+': '+e.t).join('\n')+'\n';});
 return out;
}};

/* ══ 6. MENTOR — detection rules, scanner, brief ════════════════ */
/* Each rule is executable. sev 1-5. ns = unsnoozable (escape valve welded shut). */
const RULES=[
{id:'integrity-fault',sev:5,ns:true,test(){const q=Integrity.quick();return q>0?{msg:'INTEGRITY: '+q+' critical fault class(es) in the store — the system of record is only as good as its invariants.',act:'int-run',arg:null,alabel:'Open audit'}:null;}},
{id:'escalation-open',sev:5,ns:true,test(){const n=openCases().filter(c=>c.escalated).length;return n?{msg:n+' escalation-class case(s) open. These are unsnoozable because "I\'ll deal with it Monday" is exactly how they become legal.',route:'/cases'}:null;}},
{id:'hr-task-due',sev:5,ns:true,test(){const n=openTasks().filter(t=>t.kind==='hr'&&t.due<=todayStr()).length;return n?{msg:n+' HR-contact task(s) due NOW. The escalation test created these for today, not for this week.',route:'/cases'}:null;}},
{id:'setup-missing',sev:5,test(){return !S.settings.selfId?{msg:'You are not in the system. A leadership OS without its operator is a museum — set yourself.',act:'open-setup',alabel:'Run setup wizard'}:null;}},
{id:'crisis-aging',sev:5,test(){const w=openCases().filter(c=>c.type==='crisis'&&age(c.opened)>=2).sort((a,b)=>b.opened-a.opened)[0];return w?{msg:'Crisis "'+w.title+'" is '+age(w.opened)+'d old against a 48h clock. If it is no longer a crisis, close it honestly; if it is, act like it.',route:'/case/'+w.id}:null;}},
{id:'case-sla',sev:4,test(){const late=openCases().filter(c=>age(c.opened)>c.sla);if(!late.length)return null;const w=late.sort((a,b)=>age(b.opened)-age(a.opened))[0];return{msg:late.length+' case(s) past SLA — worst: "'+w.title+'" at '+age(w.opened)+'d/'+w.sla+'d. Aging cases harden into culture.',route:'/case/'+w.id};}},
{id:'conflict-aging',sev:4,test(){const w=openCases().filter(c=>c.type==='conflict'&&age(c.opened)>7)[0];return w?{msg:'Conflict "'+w.title+'" is '+(age(w.opened))+'d old. Unmediated conflict metastasizes — the protocol is armed.',route:'/mediation'}:null;}},
{id:'flight-critical',sev:4,test(){const crit=activePeople().map(p=>({p,f:flightOf(p)})).filter(x=>x.f.score>=70).sort((a,b)=>b.f.score-a.f.score);if(!crit.length)return null;const x=crit[0];return{msg:'FLIGHT CRITICAL: '+x.p.name+' at '+x.f.score+'/100 — driver: '+x.f.drivers[0].label+'. Move: '+x.f.drivers[0].move+'.',route:'/person/'+x.p.id};}},
{id:'pressure-surge',sev:3,test(){const pr=S.settings.pressure||[];if(pr.length<7)return null;const a=pr.slice(-3).reduce((x,y)=>x+y.v,0)/3,b=pr.slice(-7,-3).reduce((x,y)=>x+y.v,0)/4;return b>0&&a>b*1.35?{msg:'Case pressure surged '+Math.round((a/b-1)*100)+'% in 3 days. Something upstream broke — find it before it finds you.',route:'/review'}:null;}},
{id:'debt-you',sev:4,test(){const d=FW.commitDebt(list('oneonones')).you;return d.length?{msg:'You owe '+d.length+' overdue commitment(s) — the ledger calls these broken-by-you. Trust arithmetic: self-orientation rising.',route:'/oneonones'}:null;}},
{id:'debt-them',sev:3,test(){const d=FW.commitDebt(list('oneonones')).them;return d.length>=2?{msg:d.length+' commitments owed TO you are overdue. Chase explicitly or renegotiate — silent accounts are how resentment is banked.',route:'/oneonones'}:null;}},
{id:'cadence-dead',sev:3,test(){const dead=activePeople().filter(p=>{const l=lastDone11(p.id);const lim=p.lead?14:28;return !l||age(l.date)>lim;});return dead.length?{msg:dead.length+' people past cadence ('+dead[0].name+(dead[0].lead?' — a LEAD':'')+' first). No telemetry = flying blind.',route:'/oneonones'}:null;}},
{id:'ninebox-stale',sev:2,test(){const n=activePeople().filter(p=>!p.nineBox||age(p.nineBox.at)>120).length;return n>=2?{msg:n+' nine-box stamps missing or older than 120d — succession reads are only as fresh as the stamps underneath.',route:'/performance'}:null;}},
{id:'trust-unstamped',sev:2,test(){const n=activePeople().filter(p=>p.lead&&!p.trust).length;return n?{msg:n+' lead(s) with no trust stamp. You are managing your most expensive relationships on vibes.',route:'/people'}:null;}},
{id:'psych-stale',sev:3,test(){const bad=list('teams').filter(t=>!t.psychScan||age(t.psychAt)>(t.stage==='storming'?45:90));return bad.length?{msg:'Team "'+bad[0].name+'" psych-safety data is '+(bad[0].psychAt?age(bad[0].psychAt)+'d old':'MISSING')+'. Safety is detected, not declared.',route:'/team/'+bad[0].id}:null;}},
{id:'busfactor',sev:3,test(){let hit=null;list('teams').forEach(t=>{const bf=FW.busFactor(t,activePeople().filter(p=>p.teamId===t.id));const one=bf.filter(b=>b.bus===1);if(one.length&&!hit)hit={t,cap:one[0]};});return hit?{msg:'Bus factor 1: "'+hit.cap.cap+'" lives only in '+hit.cap.holders[0].name+' (team '+hit.t.name+'). KT or pipeline — pick a hedge.',route:'/team/'+hit.t.id}:null;}},
{id:'goal-red',sev:3,test(){const w=list('goals').filter(g=>g.status==='open'&&g.deadline>=todayStr()&&(FW.goalScore(g)||0)<40)[0];return w?{msg:'Goal "'+w.title+'" scoring '+(FW.goalScore(g)||0)+'% with '+db(todayStr(),w.deadline)+'d left. Rescue, re-scope, or kill — silence is re-scoping by cowardice.',route:'/portfolio'}:null;}},
{id:'goal-expired',sev:3,test(){const n=list('goals').filter(g=>g.status==='open'&&g.deadline<todayStr()).length;return n?{msg:n+' goal(s) past deadline, ungraded. Expired goals demand a grade — that is where the lesson lives.',route:'/portfolio'}:null;}},
{id:'risk-critical',sev:3,test(){const w=list('risks').filter(r=>r.status==='open'&&FW.riskScore(r.p,r.i).v>=15)[0];return w?{msg:'Critical risk "'+w.title+'" (P'+w.p+'×I'+w.i+') open. Mitigation or acceptance — record which, on the record.',route:'/portfolio'}:null;}},
{id:'decision-gate',sev:3,test(){const w=list('decisions').filter(d=>d.status==='open'&&d.review<todayStr())[0];return w?{msg:'Decision "'+w.title+'" blew its review gate — a journal that is never re-read is a diary.',route:'/decisions'}:null;}},
{id:'fb-aging-corr',sev:3,test(){const w=list('feedback').filter(f=>f.status==='draft'&&f.kind==='correction'&&age(f.created)>3)[0];return w?{msg:'Correction draft to '+personName(w.personId)+' is '+age(w.created)+'d old — past 72h it is archaeology, not feedback.',route:'/feedback'}:null;}},
{id:'fb-aging-praise',sev:2,test(){const n=list('feedback').filter(f=>f.status==='draft'&&f.kind==='praise'&&age(f.created)>2).length;return n?{msg:n+' praise draft(s) stale — 48h shelf life. Delivered late, praise reads as obligation.',route:'/feedback'}:null;}},
{id:'fb-verify-due',sev:3,test(){const w=list('feedback').filter(f=>f.status==='delivered'&&f.kind==='correction'&&f.verifyAt&&f.verifyAt<todayStr()&&!f.verifyOutcome)[0];return w?{msg:'+21d verification overdue for '+personName(w.personId)+'. An unverified correction was a speech, not feedback.',route:'/feedback'}:null;}},
{id:'fb-balance',sev:2,test(){let bad=null;activePeople().forEach(p=>{const fs=list('feedback').filter(f=>f.personId===p.id&&f.status==='delivered');if(fs.length>=4){const pos=fs.filter(f=>f.kind==='praise').length/fs.length*100;if(pos<50||pos>95)bad={p,pos:Math.round(pos)};}});return bad?{msg:bad.p.name+': feedback balance '+bad.pos+'% positive — outside the 60-85% zone where people stay reachable.',route:'/feedback'}:null;}},
{id:'aar-unpaid',sev:4,test(){const w=list('aars').filter(a=>a.status==='draft')[0];return w?{msg:'TUITION UNPAID: "'+w.title+'" — a sev-4+ case closed without its AAR is an expensive lesson thrown away.',route:'/aar'}:null;}},
{id:'deleg-checkpoint',sev:3,test(){const w=list('delegations').filter(d=>d.status==='active'&&(d.checkpoints||[]).some(cp=>!cp.done&&cp.d<todayStr()))[0];return w?{msg:'Delegation "'+w.title+'" has an overdue checkpoint — boundaries without checkpoints are abdication.',route:'/delegation'}:null;}},
{id:'deleg-mismatch',sev:2,test(){const w=list('delegations').filter(d=>d.status==='active').map(d=>({d,m:FW.delegateMatch(d.level,d.skill,d.will)})).filter(x=>Math.abs(x.m.suggested-x.d.level)>=2)[0];return w?{msg:'Delegation "'+w.d.title+'" is at L'+w.d.level+' but readiness says L'+w.m.suggested+'. '+w.m.verdict+'.',route:'/delegation'}:null;}},
{id:'pipeline-stall',sev:2,test(){const w=list('pipeline').filter(r=>!r.outcome).map(r=>({r,st:r.cands.filter(c=>c.stage!=='accepted'&&c.stage!=='rejected'&&age(c.updated)>14)})).filter(x=>x.st.length)[0];return w?{msg:'Candidate '+w.st[0].name+' rotting in stage "'+w.st[0].stage+'" for '+age(w.st[0].updated)+'d. Candidates talk to other employers who move.',route:'/pipeline'}:null;}},
{id:'neg-rot',sev:2,test(){const w=list('negs').filter(n=>n.status==='open'&&n.reviewAt<todayStr())[0];return w?{msg:'Negotiation "'+w.title+'" past its review date — BATNAs rot. Re-validate your walkaway before the next touch.',route:'/negotiate'}:null;}},
{id:'coach-stale',sev:2,test(){const stale=leads().filter(p=>{const s=list('coach').filter(c=>c.personId===p.id).sort((a,b)=>b.created.localeCompare(a.created))[0];return !s||age(s.created)>45;});return stale.length?{msg:stale.length+' lead(s) with no GROW session in 45d+ ('+stale[0].name+' first). Cadence is management; coaching is development — you are only doing one.',route:'/coach'}:null;}},
{id:'med-stale',sev:3,test(){const w=list('mediations').filter(m=>m.status==='active'&&age(m.updated)>7)[0];return w?{msg:'Mediation idle '+age(w.updated)+'d at stage '+(w.stage+1)+'. Frozen protocols teach the parties that this is theatre.',route:'/mediation'}:null;}},
{id:'meeting-nodec',sev:2,test(){const n=list('meetings').filter(m=>FW.meetingVerdict(m,S.settings.rate||90).v==='kill-or-async').length;return n?{msg:n+' meeting(s) graded "kill-or-async" — no owned decision, no purpose. The designer shows the annualized bill.',route:'/meetings'}:null;}},
{id:'meeting-factory',sev:3,test(){const hrs=list('meetings').reduce((x,m)=>x+m.mins/60*(m.freq||1)*m.attendees,0);return hrs>60?{msg:'Meeting factory: '+Math.round(hrs)+' attendee-hours/week scheduled. That is a payroll line, not a calendar.',route:'/meetings'}:null;}},
{id:'skip-overdue',sev:2,test(){let n=0;leads().forEach(l=>{const reps=reportsOf(l.id);if(!reps.length)return;const last=list('skips').filter(s=>s.leadId===l.id).sort((a,b)=>b.at.localeCompare(a.at))[0];if(!last||age(last.at)>90)n+=reps.length;});return n?{msg:n+' skip-levels overdue (>90d). Two layers down is where the truth you are not being told lives.',route:'/skips'}:null;}},
{id:'energy-low',sev:3,test(){const e=list('energy').slice(-1)[0];return e&&FW.energyBlend(e)<45?{msg:'Your energy blend is '+FW.energyBlend(e)+'/100. Degraded operators make exactly the calls the gates exist to catch — defer what can be deferred, today.',route:'/self'}:null;}},
{id:'ramp-gate',sev:3,test(){const w=activePeople().filter(p=>(p.rampChecks||[]).some(r=>!r.done&&r.d<todayStr()))[0];return w?{msg:w.name+' has a ramp gate overdue. Missed gates that go unnamed become the story of "it just didn\'t work out".',route:'/person/'+w.id}:null;}},
{id:'span-wide',sev:2,test(){const w=FW.spanStats(activePeople()).wide[0];return w?{msg:personName(w.id)+' has '+w.n+' direct reports. Span >8 means someone is being managed by absence.',route:'/org'}:null;}},
{id:'export-overdue',sev:3,test(){const d=S.settings.lastExportAt;return (!d||age(d)>14)?{msg:d?'Last export '+age(d)+'d ago.':'Never exported. A single browser profile IS your disaster-recovery plan — refresh it.',act:'export',alabel:'Export now'}:null;}},
{id:'verify-backlog',sev:3,test(){const n=openTasks().filter(t=>t.kind==='verify'&&t.due<todayStr()).length;return n?{msg:n+' +30d closure verification(s) pending. Closed-unverified is Schrödinger\'s fix — open the box.',route:'/cases'}:null;}},
{id:'review-due',sev:1,test(){const day=new Date().getDay();const lw=list('reviews').slice(-1)[0];return(day===5||day===1)&&(!lw||age(lw.at)>6)?{msg:'Weekly review pending. Twenty minutes of loop-closing is the course — skip it and you are winging leadership.',route:'/review'}:null;}},

{id:'ok-mood-up',sev:0,tone:'ok',test(){const up=activePeople().filter(p=>{const s=FW.moodSlope(p.mood||[]);return s!==null&&s>0.5;})[0];return up?{msg:up.name+': pulse trend rising. Whatever you changed — notice it, name it, keep it.',route:'/person/'+up.id}:null;}},

{id:'ok-verified',sev:0,tone:'ok',test(){const n=list('cases').filter(c=>c.verifiedAt).length;return n?{msg:n+' closures verified at +30d. Fixes that survive reality — that is the whole product.',route:'/cases'}:null;}}];
function scanMentor(){
 const rev=S.telemetry.rev;
 if(MentorCache&&MentorCache.rev===rev)return MentorCache;
 const out=[];
 RULES.forEach(r=>{try{const res=r.test();if(res)out.push({id:r.id,sev:r.sev,ns:!!r.ns,tone:r.tone||'adv',msg:res.msg,route:res.route||null,act:res.act||null,arg:res.arg||null,alabel:res.alabel||null});}catch(e){/* a faulty rule must never kill the render — surfaced via integrity rule instead */}});
 const sn=S.settings.snoozes||{};
 const visible=out.filter(a=>a.ns||a.tone==='ok'||!sn[a.id]||sn[a.id]<todayStr());
 const deferred=out.filter(a=>!a.ns&&a.tone!=='ok'&&sn[a.id]&&sn[a.id]>=todayStr());
 visible.sort((a,b)=>b.sev-a.sev);
 /* daily pressure snapshot */
 const pr=S.settings.pressure||[];const pv=FW.casePressure(openCases());
 if(!pr.length||pr[pr.length-1].d!==todayStr()){pr.push({d:todayStr(),v:pv});S.settings.pressure=pr.slice(-60);save();}
 const R={rev,all:out,visible,deferred,pressure:pr};
 MentorCache=R;return R;
}
function advVisible(){return scanMentor().visible.filter(a=>a.tone!=='ok');}
function dailyBrief(){
 const sc=scanMentor();
 const top=[];sc.visible.filter(a=>a.tone!=='ok').slice(0,3).forEach(a=>top.push({k:'advisory',sev:a.sev,t:a.msg,route:a.route}));
 const today=openTasks().filter(t=>t.due<=todayStr()).sort((a,b)=>a.due.localeCompare(b.due));
 const sessions=list('oneonones').filter(o=>o.status!=='done'&&o.date<=addDays(todayStr(),2)).sort((a,b)=>a.date.localeCompare(b.date));
 const li=FW.loadIndex({openCases:openCases(),overdueTasks:openTasks().filter(t=>t.due<todayStr()).length,thisWeekSessions:list('oneonones').filter(o=>o.status!=='done'&&o.date<=addDays(todayStr(),7)).length,brokenYou:FW.commitDebt(list('oneonones')).you.length});
 return {top,today,sessions,load:li,scan:sc};

 const people=activePeople().filter(p=>p.teamId===id);const h=teamHealthOf(tm);const psy=tm.psychScan?FW.edmondson(tm.psychScan):null;const fd=tm.fiveDys?FW.fiveDys(tm.fiveDys):null;const bf=FW.busFactor(tm,people);
 let hx=pageHead(tm.name,'stage: '+(tm.stage||'unset')+(tm.stageOverride?' (overridden)':''));
 hx+='<div class="pillrow" style="margin-bottom:14px">'+chipEl('acc','health: '+(h.score==null?'n/a':h.score+' · '+h.verdict))+'<button data-r="/cases" class="chip">cases: '+openCases().filter(c=>c.teamId===id).length+' open</button>'+btn('case-open',null,'Case on this team','flame','btn-sm btn-ghost')+btn('psy-open',id,'Psych scan','heart','btn-sm btn-ghost')+btn('dys-open',id,'Five dysfunctions','layers','btn-sm btn-ghost')+btn('stage-open',id,'Stage override','flag','btn-sm btn-ghost')+'</div>';
 hx+=grid('g2',
  card('heart','Edmondson psych safety',psy?'<div class="focus-num">'+psy.score+'</div>'+chipEl(psy.score>=70?'ok':psy.score>=50?'warn':'risk',psy.verdict)+'<div style="margin-top:8px;font-size:12px;color:var(--dim)">weakest: "'+esc(FW.EDM_Q[psy.weakest])+'"</div>':'No scan on record. Fear is tax you are paying silently — measure it.'),
  card('layers','Five dysfunctions — sequential',fd?['absence of trust','fear of conflict','lack of commitment','avoidance of accountability','inattention to results'].map((l,i)=>meter(l,(tm.fiveDys[i]||0)*20,fd.first===i?'risk':(tm.fiveDys[i]||0)>=4?'ok':'warn',tm.fiveDys[i]||'—')).join('')+reco(fd.first===-1?'ok':'warn','<b>'+fd.label+'</b><br>'+fd.seq):'Unstamped. The pyramid is fixed in sequence or not at all.'));
 hx+=grid('g2',
  card('zap','Bus factor per capability',bf.length?'<table class="tbl"><tbody>'+bf.map(b=>'<tr><td>'+esc(b.cap)+'</td><td style="font-size:11px;color:var(--dim)">'+b.holders.map(p=>esc(p.name)).join(', ')+'</td><td>'+chipEl(b.bus===1?'risk':'ok','bus '+b.bus)+'</td></tr>').join('')+'</tbody></table>'+ (bf.some(b=>b.bus===1)?reco('risk','Bus-1 capability is a resignation away from a crisis — KT fan-out or pipeline.'):''):emptyBox('zap','No capabilities','Stamp criticalFor on people to light this up.')),
  card('users','Roster',people.length?people.map(p=>{const f=flightOf(p);return '<div class="rowline"><span class="grow"><a data-r="/person/'+p.id+'">'+esc(p.name)+'</a> <span class="mut">'+esc(p.role)+(p.lead?' · lead':'')+'</span></span>'+chipEl(f.score>=70?'risk':f.score>=45?'warn':'ok','flight '+f.score)+'</div>';}).join(''):emptyBox('user','Empty','Add people.'))+
   btn('person-add-team',id,'Add to this team','plus','btn-sm btn-ghost')));
 const gl=list('goals').filter(g=>g.teamId===id&&g.status==='open');
 if(gl.length)hx+=card('target','Open goals',gl.map(g=>{const sc=FW.goalScore(g);return '<div class="rowline"><span class="grow">'+esc(g.title)+'</span>'+chipEl(sc<40?'risk':sc<70?'warn':'ok',sc+'% · '+db(todayStr(),g.deadline)+'d left')+'</div>';}).join(''));
 const w=tm.working||{};
 hx+=card('doc','Working agreement — the structure mediation agreements embed into',
  '<div class="frow"><div>'+field('Decisions — who owns what call',fin('wa-dec',w.decisions||'',w.decisions||''))+field('Channels — where what lives',fin('wa-chan',w.channels||'',w.channels||''))+field('Urgency — what "urgent" means',fin('wa-urg',w.urgency||'',w.urgency||''))+'</div><div>'+field('Conflict — how we fight',fin('wa-conf',w.conflict||'',w.conflict||''))+field('Sacred — what we never break',fin('wa-sac',w.sacred||'',w.sacred||''))+'</div></div>'+
  ((w.extra||[]).length?'<b style="font-size:12px">Embedded amendments</b>'+w.extra.map(e=>'<div class="reco vio" style="font-size:12px"><b>'+e.d+'</b> · '+esc(e.t)+'</div>').join(''):'')+
  btn('wa-save',id,'Sign the agreement','check','btn-acc btn-sm'));
 hx+=card('refresh','Retro engine — STOP / START become owned, dated tasks',
  '<div class="frow"><div>'+field('STOP (one per line)',fta('rt-stop',''))+'</div><div>'+field('START (one per line)',fta('rt-start',''))+'</div></div>'+btn('rt-run',id,'Run retro → tasks','refresh','btn-acc btn-sm')+
  ((tm.retros||[]).slice(-2).map(r=>'<div style="margin-top:8px;font-size:11px;color:var(--faint);font-family:var(--fm)">'+r.at+': '+r.n+' actions dispatched</div>').join('')));
 return hx;
};

Actions['rt-run']=function(id){const stops=val('rt-stop').split('\n').filter(Boolean),starts=val('rt-start').split('\n').filter(Boolean);if(!stops.length&&!starts.length)return toast('A retro with no STOP/START is a meeting with snacks.','risk');mut(()=>{stops.concat(starts).forEach((line,i)=>mkTask((i<stops.length?'STOP: ':'START: ')+line,{due:addDays(todayStr(),7),kind:'retro',teamId:id}));const tm=get('teams',id);tm.retros=(tm.retros||[]).concat([{at:todayStr(),n:stops.length+starts.length}]);toast((stops.length+starts.length)+' retro actions dispatched as owned, dated tasks — not minutes.');});};
/* ╚ PERFORMANCE ╚ */
Routes['/performance']=function(){
 const ps=activePeople();const stale=ps.filter(p=>!p.nineBox||age(p.nineBox.at)>120);
 const cell=i=>{const lab=FW.nineBoxLabel(i);const inC=ps.filter(p=>p.nineBox&&FW.nineBoxCell(p.nineBox.perf,p.nineBox.pot)===i);return '<div class="cell'+(inC.length?' lit':'')+'">'+(inC.length?'<span class="n">'+inC.length+'</span>':'')+lab.split(' — ')[0]+'<br>'+inC.map(p=>esc(p.name.split(' ')[0])).join(', ')+'</div>';};
 return pageHead('Performance','diagnose before coaching · the board is a stamp, not a destiny')+
 grid('g3',stat(ps.filter(p=>p.nineBox).length+'/'+ps.length,'stamped','')+stat(stale.length,'stale/missing >120d',stale.length?'ritual owed':'fresh',stale.length?'risk':null)+stat(list('cases').filter(c=>c.type==='performance'&&c.status==='open').length,'open perf cases','each gated by 4-cause diagnosis'))+
 card('target','Nine-box board','<div style="display:grid;grid-template-columns:70px 1fr;gap:8px"><div style="font-size:10px;color:var(--faint);font-family:var(--fm);writing-mode:vertical-rl;transform:rotate(180deg);text-align:center">potential ↑</div><div><div class="grid9">'+[6,7,8,3,4,5,0,1,2].map(cell).join('')+'</div><div style="font-size:10px;color:var(--faint);font-family:var(--fm);text-align:center;margin-top:4px">performance → · buckets in 3-point bands (documented imprecision)</div></div></div>'+
 (stale.length?reco('warn','Stale stamps: '+stale.map(p=>esc(p.name)).join(', ')+' — click a person to re-stamp. Stale boards produce stale succession calls.'):''))+
 card('atri','Quarterly ritual panel','<table class="tbl"><tbody>'+[['Nine-box fresh',ps.length-stale.length,ps.length],['Trust stamped',ps.filter(p=>p.trust).length,ps.length],['Psych scan <90d',list('teams').filter(t=>t.psychAt&&age(t.psychAt)<=90).length,list('teams').length],['Dev plans',ps.filter(p=>p.dev&&p.dev.goal).length,ps.length]].map(r=>'<tr><td>'+r[0]+'</td><td>'+meter('',r[2]?Math.round(r[1]/r[2]*100):0,r[1]===r[2]?'ok':'warn',r[1]+'/'+r[2])+'</td></tr>').join('')+'</tbody></table>');
};

Routes['/org']=function(){
 const self=S.settings.selfId?get('people',S.settings.selfId):null;
 const exposure=p=>Math.round((p.salary||0)*flightOf(p).score/100);
 const node=(p,depth)=>{const reps=reportsOf(p.id);
  return '<div style="margin-left:'+(depth*18)+'px"><div class="rowline"><span class="grow">'+(depth?'└ ':'')+'<a data-r="/person/'+p.id+'"><b>'+esc(p.name)+'</b></a> <span class="mut">'+esc(p.role)+'</span></span>'+chipEl(flightOf(p).score>=70?'risk':flightOf(p).score>=45?'warn':'ok','exposure '+money(exposure(p)))+(reps.length?chipEl(reps.length>8?'risk':'info','span '+reps.length):'')+chipEl(openCases().filter(c=>c.personId===p.id).length?'warn':'ok',openCases().filter(c=>c.personId===p.id).length+' cases')+'</div>'+reps.map(r=>node(r,depth+1)).join('')+'</div>';};
 const bus1=[];list('teams').forEach(t=>FW.busFactor(t,activePeople().filter(p=>p.teamId===t.id)).filter(b=>b.bus===1).forEach(b=>bus1.push({t,c:b})));
 return pageHead('Org map','spans · flight exposure in money · bus-factor flags')+
 (self?card('branch','Span tree',node(self,0)):card('branch','Span tree','Set yourself (People → edit → manager none) or run the setup wizard.'))+
 grid('g2',
  card('flame','Flight exposure total','<div class="focus-num">'+money(activePeople().reduce((x,p)=>x+exposure(p),0))+'</div><div style="font-size:11.5px;color:var(--dim)">salary × flight score — what unmitigated departures would cost to replace</div>'),
  card('zap','Bus-factor-1 capabilities',bus1.length?bus1.map(b=>'<div class="rowline"><span class="grow">'+esc(b.c.cap)+' <span class="mut">'+b.t.name+'</span></span>'+chipEl('risk','only '+b.c.holders[0].name)+'</div>').join(''):reco('ok','Every critical capability has ≥2 holders. This is rarer than it should be — keep it.')));
};

 (ls.length?ls.map(l=>{const reps=reportsOf(l.id);if(!reps.length)return'';const last=list('skips').filter(s=>s.leadId===l.id).sort((a,b)=>b.at.localeCompare(a.at))[0];
  return card('layers',l.name+(l.teamId?' · '+teamName(l.teamId):''),'<div class="pillrow" style="margin-bottom:10px">'+(last?chipEl(age(last.at)>90?'risk':'ok','last round '+last.at+' ('+age(last.at)+'d ago)'):chipEl('risk','never run'))+(last?chipEl('info','signal: trust '+last.sig[0]+' · clarity '+last.sig[1]+' · load '+last.sig[2]+' · morale '+last.sig[3]):'')+'</div>'+reps.map(r=>'<div class="rowline"><span class="grow">'+esc(r.name)+'</span>'+btn('skip-run',l.id+'|'+r.id,'Run 5-question skip','play','btn-sm')+'</div>').join(''));}).join(''):emptyBox('layers','No leads with reports','Skips exist for manager-of-managers — add leads first.'))+

 const up=list('oneonones').filter(o=>o.status!=='done'&&o.date>=todayStr()).sort((a,b)=>a.date.localeCompare(b.date));
 const done=list('oneonones').filter(o=>o.status==='done').sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8);
 const debt=FW.commitDebt(list('oneonones'));
 return pageHead('1:1 runner','agendas build themselves from six live sources — a chat is not management')+
 '<div class="adv-actions" style="margin-bottom:14px">'+btn('oo-book-all',null,'Auto-book everyone at cadence','zap','btn-acc btn-sm')+'</div>'+
 grid('g3',stat(up.length,'booked ahead','')+stat(debt.you.length,'broken-by-you',debt.you.length?'pay or renegotiate':'clean',debt.you.length?'risk':null)+stat(debt.them.length,'owed-to-you overdue','chase explicitly'))+
 card('cal','Upcoming',up.length?up.slice(0,10).map(o=>{const ag=Engine.agendaFor(o.personId);return '<div class="rowline"><span class="mut">'+o.date+(o.moves>0?' · moved '+o.moves+'×':'')+'</span><span class="grow"><b>'+esc(personName(o.personId))+'</b>'+(ag.length?' <span style="color:var(--faint);font-size:11px">'+ag.length+' items queued: '+esc(ag[0].text.slice(0,60))+(ag.length>1?'…':'')+'</span>':' <span style="color:var(--faint);font-size:11px">clean slate</span>')+'</span>'+chipEl(o.src.indexOf('auto')===0||o.src==='seed-cadence'?'info':'acc',o.src)+btn('oo-run',o.id,'Run','play','btn-sm')+'</div>';}).join(''):emptyBox('cal','Nothing booked','Auto-book maintains cadence: leads 7d, reports 14d.'))+
 (debt.overdue.length?card('atri','Commitment debt','<b style="font-size:12px">Broken by you</b>'+debt.you.map(r=>'<div class="reco risk" style="font-size:12px">'+esc(r.cm.text)+' — owed '+personName(r.p)+' · '+age(r.cm.due)+'d late '+btn('cm-done',r.cm.id,'Pay','check','btn-ghost btn-sm')+'</div>').join('')+'<b style="font-size:12px">Owed to you</b>'+debt.them.map(r=>'<div class="reco warn" style="font-size:12px">'+esc(r.cm.text)+' — by '+personName(r.p)+' · '+age(r.cm.due)+'d late '+btn('cm-done',r.cm.id,'Came through','check','btn-ghost btn-sm')+'</div>').join(''),''):'')+
 card('doc','Recent sessions',done.length?done.map(o=>'<div class="rowline"><span class="mut">'+o.date+'</span><span class="grow"><b>'+esc(personName(o.personId))+'</b> · mood '+(o.mood||'—')+'</span>'+chipEl('info',(o.commitments||[]).length+' commitments')+'</div>').join(''):emptyBox('msg','No sessions yet','Run one — the runner stamps pulse, feeds flight slope, auto-books the next.'));
};

 const mh=el('modal-root').querySelector('.modal-body');
 mh.innerHTML=

Routes['/feedback']=function(){
 const baseOut=(function(){ const drafts=list('feedback').filter(f=>f.status==='draft');

 card('cir','Delivered — verification ledger',deliv.length?deliv.slice(0,12).map(f=>'<div class="rowline"><span class="grow"><b>'+esc(personName(f.personId))+'</b> · '+chipEl(f.kind==='praise'?'ok':'info',f.kind)+' '+esc(f.b.slice(0,70))+'</span><span class="mut">'+f.deliveredAt+'</span>'+(f.kind==='correction'?(f.verifyOutcome?chipEl(f.verifyOutcome==='changed'?'ok':'risk','+21d: '+f.verifyOutcome):(f.verifyAt<todayStr()?btn('fb-verify',f.id,'VERIFY NOW','atri','btn-sm btn-danger'):chipEl('info','verify '+f.verifyAt))):'')+'</div>').join(''):emptyBox('cir','Nothing delivered',''));})();
