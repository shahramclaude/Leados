<!doctype html>
<html lang="en">
<head>

<title>LeadOS pt-15 — Personal Leadership Architecture</title>
<!--
  LeadOS pt-15 · schema v15 · single-file build
  ---------------------------------------------------------------
  Physical files in this delivery: index.html, README.md, AI-SESSION-LOG.md
  Logical modules (IIFEs on window.LeadOS, load order enforced by boot guard):
    util · events · store · engine · leaderSelf · rules · playbooks · health · ui
  The brief names js/leadership_self.js the "22nd file". The delivery clause
  (constant since pt-7 upstream) ships ONE index.html; logical modules are
  listed in LeadOS.EXPECTED_MODULES and asserted by health claim C8.
  Non-negotiables: append-only event log · everything derived is recomputed
  per read · nothing derived is persisted · zero network calls, permanently.
-->
<style>
:root{
  --bg:#0a0c10; --panel:#10141b; --panel2:#151a23; --line:#1f2531; --line2:#2a3140;
  --ink:#d8dce4; --dim:#828b9c; --faint:#596274;
  --acc:#e8b44a; --acc2:#8ab4ff; --ok:#4ade80;
  --sev5:#ff5f5f; --sev4:#f87171; --sev3:#fb923c; --sev2:#eab308; --sev1:#64748b;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:"Inter",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font:14px/1.55 var(--sans)}
a{color:var(--acc2);text-decoration:none} a:hover{text-decoration:underline}
h1,h2,h3{font-weight:650;letter-spacing:.01em;margin:0 0 .5em}
h1{font-size:20px} h2{font-size:15px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim)} h3{font-size:14px}
code,.mono{font-family:var(--mono);font-size:12.5px}
#app{max-width:1160px;margin:0 auto;padding:0 20px 96px}
.topbar{position:sticky;top:0;z-index:20;background:rgba(10,12,16,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1160px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{font-family:var(--mono);font-size:13px;color:var(--acc);letter-spacing:.06em;white-space:nowrap}
.brand b{color:var(--ink)}
.brand .pt{color:var(--dim)}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav a{font-family:var(--mono);font-size:12.5px;color:var(--dim);padding:5px 10px;border-radius:6px}
nav a.on{color:var(--acc);background:#1a1f2a}
nav a:hover{color:var(--ink);text-decoration:none}
.topmeta{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint);white-space:nowrap}
.view{padding-top:26px;display:block}
.muted{color:var(--dim)} .faint{color:var(--faint)} .small{font-size:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:14px 0}
.panel.tight{padding:12px 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
@media(max-width:860px){.grid2,.grid3{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:190px 1fr;gap:4px 14px;font-size:13px}
.kv dt{color:var(--dim);font-family:var(--mono);font-size:12px}
.kv dd{margin:0}
.finding{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--sev3);border-radius:8px;padding:12px 16px;margin:10px 0}
.finding.sev5{border-left-color:var(--sev5)} .finding.sev4{border-left-color:var(--sev4)}
.finding.sev3{border-left-color:var(--sev3)} .finding.sev2{border-left-color:var(--sev2)}
.finding .fhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.badge{font-family:var(--mono);font-size:10.5px;padding:2px 7px;border-radius:4px;border:1px solid var(--line2);color:var(--dim);white-space:nowrap}
.badge.sev5{color:var(--sev5);border-color:#5a2a2a}.badge.sev4{color:var(--sev4);border-color:#5a2a2a}
.badge.sev3{color:var(--sev3);border-color:#55401f}.badge.sev2{color:var(--sev2);border-color:#4d431a}
.badge.sev1,.badge.nudge{color:var(--sev1)}
.badge.conf-HIGH{color:var(--ok)} .badge.conf-MEDIUM{color:var(--acc2)} .badge.conf-LOW{color:#b48ab7}
.badge.pb{color:var(--acc);border-color:#4d3d18}
.badge.recon{color:#b48ab7;border-color:#3d2a4d}
.finding .ftitle{font-weight:600}
.finding .fdetail{margin-top:6px;color:var(--dim);font-size:13px}
.finding .fdetail code{color:var(--ink)}
.finding .fw{margin-top:6px;font-size:12px;color:var(--faint);font-style:italic}
.sevnudge{opacity:.55;border-left-color:var(--sev1)!important}
.nudgebar{margin:12px 0 4px;padding:8px 12px;font-family:var(--mono);font-size:12px;color:var(--sev1);
  border:1px dashed var(--line2);border-radius:8px;cursor:pointer;background:transparent;width:100%;text-align:left}
.nudgebar:hover{color:var(--ink)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);text-align:left;padding:6px 10px;border-bottom:1px solid var(--line)}
td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
.pill{display:inline-block;font-family:var(--mono);font-size:11px;padding:1px 8px;border-radius:99px;border:1px solid var(--line2);color:var(--dim);margin:1px 2px}
.tier-ready-now{color:var(--ok);border-color:#1f4d33}.tier-ready-12m{color:#a3e635;border-color:#3d4d1a}
.tier-ready-24m{color:var(--acc);border-color:#4d3d18}.tier-developing{color:var(--sev3);border-color:#55401f}
.tier-not-on-path{color:var(--sev4);border-color:#5a2a2a}
.btn{font-family:var(--mono);font-size:12px;background:var(--panel2);color:var(--ink);border:1px solid var(--line2);border-radius:7px;padding:7px 14px;cursor:pointer}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.primary{background:#2a230f;border-color:#4d3d18;color:var(--acc)}
.btn.danger{border-color:#5a2a2a;color:var(--sev4)}
label{display:block;font-size:12px;color:var(--dim);margin:12px 0 4px;font-family:var(--mono)}
input[type=text],input[type=date],input[type=number],select,textarea{
  width:100%;background:#0c0f15;border:1px solid var(--line2);color:var(--ink);border-radius:7px;
  padding:8px 10px;font:13px var(--mono)}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
.prefill{font-family:var(--mono);font-size:12px;color:var(--dim);background:#0c0f15;border:1px solid var(--line);border-radius:8px;padding:12px 14px;white-space:pre-wrap;margin:10px 0}
.note{border:1px solid #4d431a;background:#1a1608;border-radius:8px;padding:10px 14px;font-size:12.5px;color:var(--sev2);margin:10px 0}
.note.info{border-color:#24406b;background:#0d1526;color:var(--acc2)}
.note.bad{border-color:#5a2a2a;background:#1d0e0e;color:var(--sev4)}
.tgroup{margin:22px 0 6px;font-family:var(--mono);font-size:12px;color:var(--acc);text-transform:uppercase;letter-spacing:.14em;border-bottom:1px solid var(--line);padding-bottom:6px}
tr.pass td:first-child{color:var(--ok)} tr.fail td:first-child{color:var(--sev5);font-weight:700}
tr.fail td{background:#160d0d}
.legend{font-size:11.5px;color:var(--faint);font-family:var(--mono)}
.gapviz{display:flex;gap:0;height:14px;border-radius:4px;overflow:hidden;border:1px solid var(--line2);margin:6px 0}
.gapviz>div{height:100%}
.hr{border:none;border-top:1px solid var(--line);margin:22px 0}
.toast{position:fixed;bottom:18px;right:18px;background:var(--panel2);border:1px solid var(--acc);color:var(--acc);
  font-family:var(--mono);font-size:12px;padding:10px 16px;border-radius:8px;z-index:99}
.timeline{border-left:2px solid var(--line2);margin:8px 0 8px 6px;padding-left:18px}
.timeline .tl{position:relative;padding:5px 0}
.timeline .tl:before{content:"";position:absolute;left:-23.5px;top:12px;width:9px;height:9px;border-radius:50%;background:var(--acc)}
.bench{display:grid;grid-template-columns:200px repeat(5,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:12.5px}
.bench>div{background:var(--panel);padding:8px 10px}
.bench .bh{font-family:var(--mono);font-size:10.5px;color:var(--faint);text-transform:uppercase}
.bootfail{max-width:860px;margin:60px auto;padding:24px;border:1px solid #5a2a2a;border-radius:10px;background:#140b0b}
</style>

<script>

/* ============================================================================
   MODULE 1/9 · util — pure helpers. No DOM, no storage, no network.
   ========================================================================== */
(function(){
const LeadOS = (window.LeadOS = window.LeadOS || {});
const DAY = 86400000;
function isoToday(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseDate(v){
  if(v===undefined||v===null||v==='') return null;
  if(typeof v==='number') return v;                       // epoch ms
  const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(v));
  if(m) return Date.UTC(+m[1],+m[2]-1,+m[3]);
  const t=Date.parse(v); return isNaN(t)?null:t;
}
function daysBetween(aMs,bMs){ return Math.floor((bMs-aMs)/DAY); }
function daysAgo(todayMs,dateVal){ const t=parseDate(dateVal); return t===null?null:daysBetween(t,todayMs); }
function addDays(dateVal,n){ const t=parseDate(dateVal); if(t===null) return null; const d=new Date(t+n*DAY); return d.toISOString().slice(0,10); }
function esc(s){ return String(s===undefined||s===null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function mean(xs){ const a=(xs||[]).filter(x=>typeof x==='number'&&!isNaN(x)); return a.length? a.reduce((s,x)=>s+x,0)/a.length : null; }
function groupBy(arr,fn){ const o={}; (arr||[]).forEach(x=>{ const k=fn(x); (o[k]=o[k]||[]).push(x); }); return o; }
function countBy(arr,fn){ const o={}; (arr||[]).forEach(x=>{ const k=fn(x); o[k]=(o[k]||0)+1; }); return o; }
function uniq(arr){ return Array.from(new Set(arr||[])); }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }
function sum(arr,fn){ return (arr||[]).reduce((s,x)=>s+fn(x),0); }
function words(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9\s-]/g,' ').split(/\s+/).filter(w=>w.length>2); }
function pct(n,d){ return d===0?null:Math.round(1000*n/d)/10; }
LeadOS.util = { DAY, isoToday, parseDate, daysBetween, daysAgo, addDays, esc, mean, groupBy, countBy, uniq, clamp, sum, words, pct };
})();

  'leader.exit.plan': { fam:'exitplan', since:'pt-15', verified:'brief',

function validate(type,payload){
  const errors=[]; const spec=REGISTRY[type];

/* ---------- avoidance pattern detector ---------- */
function avoidancePatterns(P){
  const windowDays=P.settings.avoidancePatternWindowDays;
  const sinceMs=P.todayMs-windowDays*U.DAY;
  const patterns=[];
  function named(matchTerms,subjectId,subjectLabel){
    return P.of('avoidance.named').filter(ev=>{
      const t=String(ev.payload.topic).toLowerCase();
      const kindHit=matchTerms.some(term=>t.indexOf(term)!==-1);
      if(!kindHit) return false;
      if(!subjectId) return true; /* non-person patterns (decision/financial) match on kind alone */
      const subj=String(subjectLabel||'').toLowerCase();
      return t.indexOf(subj)!==-1||t.indexOf(String(subjectId).toLowerCase())!==-1;
    });
  }
  /* named-matching is KIND-AWARE and SUBJECT-AWARE: naming "feedback for A" must
     neither suppress the conversation hypothesis for A (kind), nor the feedback
     hypothesis for C (subject). Terms are printed per pattern — auditable, not magic. */
  function add(kind,subjectId,subjectLabel,summary,evidence,alternative,matchTerms){
    patterns.push({kind,subjectId:subjectId||null,subject:subjectLabel||null,summary,evidence,alternative,
      named:named(matchTerms,subjectId,subjectLabel),matchTerms,
      label:AVOIDANCE_LABEL, windowDays});
  }
  /* 1 · feedback avoidance — T72 thresholds: strictly > 60d */
  const peopleIds=Object.keys(P.people);
  peopleIds.forEach(pid=>{
    const below=P.has('hr.performance.logged',ev=>ev.payload.personId===pid&&ev.payload.rating==='below');
    if(!below) return;
    const lastFb=P.lastDateOf('feedback.given',ev=>ev.payload.personId===pid);
    const d=lastFb?P.daysSince(lastFb):null;
    if(lastFb===null||d>60){
      add('feedback:'+pid,pid,P.personName(pid),
        'possible feedback avoidance — you may be avoiding giving feedback to '+P.personName(pid),
        ['hr.performance.logged rating=below on record', lastFb?('last feedback.given '+d+'d ago (threshold 60d, strict)'):'no feedback.given to this person in the entire log'],
        'alternative explanation: the feedback happened verbally, elsewhere, or the performance note was logged by someone else and is not yours to give',
        ['feedback']);
    }
  });
  /* 2 · difficult conversation avoidance — stakes ≥ 4 planned, completion < 50% for that person */
  const convsByPerson=U.groupBy(P.of('conv.planned').filter(ev=>ev.payload.personId),ev=>ev.payload.personId);
  Object.keys(convsByPerson).forEach(pid=>{
    const planned=convsByPerson[pid].filter(ev=>(ev.payload.stakes||0)>=4);
    if(!planned.length) return;
    const done=P.of('conv.completed').filter(ev=>ev.payload.personId===pid||planned.some(p=>p.ev&&p.payload.id===ev.payload.convId));
    const doneFor=P.of('conv.completed').filter(ev=>ev.payload.personId===pid);
    const rate=doneFor.length/planned.length;
    if(rate<0.5){
      add('conversation',pid,P.personName(pid),
        'high-stakes conversations with '+P.personName(pid)+' are consistently deferred',
        ['conv.planned with stakes ≥ 4: '+planned.length+' · conv.completed for this person: '+doneFor.length+' · completion '+Math.round(rate*100)+'% < 50%'],
        'alternative explanation: completions were logged without personId, or the conversations rolled into other meetings',
        ['conversation','conversa','talk with','discuss']);
    }
  });
  /* 3 · decision avoidance — narrative.drafted severity ≥ 4, no strategy.decision referencing it, > 14d */
  P.of('narrative.drafted').forEach(ev=>{
    const sev=ev.payload.severity;
    if(!(typeof sev==='number'&&sev>=4)) return;
    const decided=P.has('strategy.decision',e=>e.payload.narrativeId===ev.payload.id);
    const age=P.daysSince(P.evDate(ev));
    if(!decided&&age>14){
      add('decision',ev.payload.id,'“'+ev.payload.topic+'”',
        'a major decision may be deferred without being named',
        ['narrative.drafted id='+ev.payload.id+' severity='+sev+' drafted '+age+'d ago','no strategy.decision logged for it (threshold 14d)'],
        'alternative explanation: the decision was taken and logged under a different reference, or the draft is deliberately parked',
        ['decision','decide', String(ev.payload.topic||'').toLowerCase()]);
    }
  });
  /* 4 · people problem avoidance — below + no pip + no perf.discussed within 30d */
  peopleIds.forEach(pid=>{
    const below=P.of('hr.performance.logged').filter(ev=>ev.payload.personId===pid&&ev.payload.rating==='below');
    if(!below.length) return;
    const pip=P.has('hr.pip.started',ev=>ev.payload.personId===pid);
    const lastDiscuss=P.lastDateOf('perf.discussed',ev=>ev.payload.personId===pid);
    const dD=lastDiscuss?P.daysSince(lastDiscuss):null;
    if(!pip&&(lastDiscuss===null||dD>30)){
      add('people',pid,P.personName(pid),
        'a performance issue may be acknowledged privately but not addressed — '+P.personName(pid),
        ['hr.performance.logged rating=below ('+below.length+'×)','no hr.pip.started on record',lastDiscuss?('last perf.discussed '+dD+'d ago (threshold 30d)'):'no perf.discussed on record'],
        'alternative explanation: support is happening informally and deliberately not logged as a performance process',
        ['performance','pip']);
    }
  });
  /* 5 · financial avoidance — runway < 12m with no allocation decision in the same period/window */
  const runway=P.latest('fin.runway.logged');
  if(runway&&typeof runway.payload.months==='number'&&runway.payload.months<12){
    const period=runway.payload.period||null;
    const alloc=P.of('fin.allocation.decision').filter(ev=>{
      if(period&&ev.payload.period) return ev.payload.period===period;
      return U.parseDate(P.evDate(ev))>=sinceMs;
    });
    if(!alloc.length){
      add('financial',null,period||'latest runway',
        'runway is short and no capital allocation decision is recorded',
        ['fin.runway.logged months='+runway.payload.months+' < 12'+(period?(' period='+period):''),'no fin.allocation.decision '+(period?'in the same period':'in the avoidance window ('+windowDays+'d)')+' — same-period rule labeled'],
        'alternative explanation: the allocation decision was made in a board forum and simply not logged here',
        ['runway','allocation','budget','capital']);
    }
  }
  return patterns;
}

/* ---------- career arc analysis ---------- */
function careerArc(P){
  const ms=P.of('career.milestone').slice().sort((a,b)=>U.parseDate(P.evDate(a))-U.parseDate(P.evDate(b)));
  const horizonMonths=P.settings.careerHorizonMonths;
  const timeline=ms.map(ev=>({date:U.addDays(P.evDate(ev),0)||P.evDate(ev),type:ev.payload.type,note:ev.payload.note||''}));
  /* velocity: milestones per trailing 6-month half vs prior half (text, not visual) */
  let velocity={verdict:'insufficient data',note:'needs ≥ 2 milestones to compare halves'};
  if(ms.length>=2){
    const half1End=P.todayMs-182*U.DAY, half1Start=half1End-182*U.DAY, half0Start=half1Start-182*U.DAY;
    const inWindow=(a,b)=>ms.filter(ev=>{const t=U.parseDate(P.evDate(ev));return t>=a&&t<b;}).length;
    const recent=inWindow(half1Start,half1End)+inWindow(half1End,P.todayMs+1);
    const prior=inWindow(half0Start,half1Start);
    velocity={recent,prior,verdict:recent>prior?'accelerating':(recent<prior?'decelerating / plateauing':'steady'),
      note:'milestones in trailing 12 months ('+recent+') vs the 12 months before ('+prior+') — pace of milestone types, labeled heuristic'};
  }
  const future=timeline.filter(t=>U.parseDate(t.date)>P.todayMs&&U.parseDate(t.date)<=P.todayMs+horizonMonths*30*U.DAY);

      prompt:'Project yourself to the end of careerHorizonMonths ('+horizonMonths+' months). For each direction below, what is the cost of inaction over exactly that window?',

      let payload;
      try{ payload=JSON.parse(document.getElementById('evpayload').value); }catch(e){ msg.innerHTML='<div class="note bad">payload is not valid JSON: '+U.esc(e.message)+'</div>'; return; }
      try{ LeadOS.store.append(sel.value,payload); msg.innerHTML='<div class="note info">appended — re-render to see derivations update</div>'; toast('event appended'); render(); }
      catch(e){ msg.innerHTML='<div class="note bad">'+U.esc(e.message)+'</div>'; }
    };
  }};
}
/* ---------------- #/data ---------------- */
function viewData(run){
  const P=run.P;
  const selfTypes=['legacy.defined','legacy.reviewed','leadership.brand','leadership.value','succession.candidate','succession.reviewed','avoidance.named','avoidance.addressed','career.milestone','mentor.relationship','board.contribution','leader.exit.plan'];
  let out='<div class="view"><h1>Data</h1>';
  out+='<div class="kv panel"><dt>storage key</dt><dd class="mono">leados:data (the only one)</dd><dt>schema</dt><dd>v'+LeadOS.store.SCHEMA_VERSION+'</dd><dt>events</dt><dd>'+P.events.length+'</dd><dt>raw size</dt><dd class="mono">'+LeadOS.store.rawBytes()+' bytes</dd><dt>migrations applied</dt><dd class="mono">'+U.esc(JSON.stringify((LeadOS.store.load().meta||{}).migrationsApplied||[]))+'</dd><dt>migration repairs</dt><dd class="mono">'+U.esc(JSON.stringify((LeadOS.store.load().meta||{}).migrationRepairs||{}))+'</dd></div>';
  out+='<h2>Export</h2><div class="legend">data leaves this machine only when you export it — zero network calls, permanently</div><div style="margin:10px 0"><button class="btn" id="export">download export JSON</button></div>';
  out+='<div class="panel tight"><h3>#/self data section (in the export)</h3><div class="legend">clearly labeled as SELF-ASSESSMENT data, not operational data:</div><div class="mono small" style="margin-top:6px">'+selfTypes.map(t=>{const n=P.count(t);return t+': '+n;}).join(' · ')+'</div></div>';
  out+='<h2>Import gate</h2><div class="legend">nothing is trusted · ids rewired not overwritten · dangling references dropped, never invented · the report is returned, never persisted</div>';
  out+='<input type="file" id="importfile" accept=".json" style="margin:10px 0"/><div id="importmsg"></div>';
  out+='<h2>Danger</h2><button class="btn danger" id="resetbtn">reset store (user-initiated, confirm-gated)</button></div>';
  return {html:out,bind(){
    document.getElementById('export').onclick=()=>{
      const raw=LeadOS.store.load();
      const selfData={}; selfTypes.forEach(t=>{ selfData[t]=P.of(t).map(e=>e.payload); });
      const payload=JSON.stringify({schemaVersion:raw.schemaVersion,meta:raw.meta,events:raw.events,
        _self_section:{label:'SELF-ASSESSMENT data — reflection scores and stated intentions, NOT operational data. Never read as performance ratings.',data:selfData}},null,2);
      const blob=new Blob([payload],{type:'application/json'});
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='leados-export-'+U.isoToday()+'.json'; a.click();
      toast('export downloaded');
    };
    document.getElementById('importfile').onchange=(ev)=>{
      const file=ev.target.files[0]; if(!file) return;
      const reader=new FileReader();
      reader.onload=()=>{
        const msg=document.getElementById('importmsg');
        try{
          const parsed=JSON.parse(reader.result);
          const dry=LeadOS.store.mergeInto(parsed,{dryRun:true});
          const rep=LeadOS.store.mergeInto(parsed,{});
          msg.innerHTML='<div class="note info">import complete — considered '+rep.considered+' · imported '+rep.imported+' · rewired '+rep.rewired+' · skipped '+rep.skippedTotal+' ('+U.esc(JSON.stringify(rep._skipped))+')'+(rep.notes.length?'<br>notes: '+U.esc(rep.notes.slice(0,5).join(' | ')):'')+'</div>';
          render();
        }catch(e){ msg.innerHTML='<div class="note bad">import refused: '+U.esc(e.message)+'</div>'; }
      };
      reader.readAsText(file);
    };
    document.getElementById('resetbtn').onclick=()=>{
      if(confirm('Reset the LeadOS store? This removes localStorage key "leados:data" entirely. Export first if you care about the data.')){
        LeadOS.store.reset(); toast('store reset'); location.hash='#/today'; render();
      }
    };
  }};
}
/* ---------------- #/health ---------------- */
function viewHealth(){
  const results=LeadOS.health.runAll();
  const groups=[['T — unit tests (T71–T75)',results.filter(r=>/^T(7[1-5])/.test(r.id))],
    ['G — guardrails & integrations (G135–G144)',results.filter(r=>/^G/.test(r.id))],
    ['T12b — seed suite (adapted scope, printed)',results.filter(r=>/^T12b/.test(r.id))],
    ['C — architecture claims',results.filter(r=>/^C/.test(r.id))]];
  const fails=results.filter(r=>!r.pass);
  let out='<div class="view"><h1>Health <span class="muted small">the browser is the grader</span></h1>';
  out+='<div class="'+(fails.length?'note bad':'note info')+'">'+(fails.length?fails.length+' FAILING':'all '+results.length+' checks pass')
    +' · where README and this wall disagree, <b>this wall wins</b></div>';
  out+='<div class="note">G144/T12b scope: this file ships 13 rules (R135–R144 verified against the brief; R19/R61/R102 reconstructed, labeled). The brief’s “all 144 rules” requires R1–R134 from upstream’s 963,415-byte index.html — never fetched (tool truncation), so the wall asserts what ships, not what was asked.</div>';
  out+='<div style="margin:12px 0"><button class="btn primary" id="seedbtn">append T12b-A demonstration seed to live store</button> <span class="legend">append-only: seed events enter through the same validation gate as everything else; they make every rule fire on #/today</span></div>';
  groups.forEach(g=>{
    if(!g[1].length) return;
    out+='<div class="tgroup">'+U.esc(g[0])+'</div><table><tr><th style="width:70px"></th><th style="width:90px">id</th><th>check</th><th>evidence</th></tr>'+
      g[1].map(r=>'<tr class="'+(r.pass?'pass':'fail')+'"><td>'+(r.pass?'PASS':'FAIL')+'</td><td class="mono">'+r.id+'</td><td>'+U.esc(r.name)+'</td><td class="mono small muted">'+U.esc(r.detail)+'</td></tr>').join('')+'</table>';
  });
  out+='</div>';
  return {html:out,bind(){
    document.getElementById('seedbtn').onclick=()=>{
      if(!confirm('Append the T12b-A seed ('+LeadOS.health.buildSeed().length+' events) to the LIVE store? It fires every rule (that is its job). Append-only — to undo, reset from #/data.')) return;
      let n=0;
      try{ LeadOS.health.buildSeed().forEach(e=>{ LeadOS.store.append(e.type,e.payload,{seed:'T12b-A'}); n++; }); }
      catch(e){ toast('seed stopped: '+e.message); }
      toast('seed appended ('+n+' events)'); location.hash='#/today'; render();
    };
  }};
}
/* ---------------- router & boot ---------------- */
function render(){
  const app=document.getElementById('app');
  let hash=(location.hash||'#/today').replace(/^#\//,'');
  const parts=hash.split('/'); let v=parts[0]||'today'; const arg=parts[1];
  if(VIEWS.indexOf(v)===-1) v='today';
  document.querySelectorAll('#nav a').forEach(a=>{ a.className=a.getAttribute('data-v')===v?'on':''; });
  let view;
  try{
    if(v==='health'){ view=viewHealth(); }
    else{
      const run=LeadOS.engine.runRules(LeadOS.store.getEvents());
      view= v==='today'?viewToday(run): v==='self'?viewSelf(run): v==='playbooks'?viewPlaybooks(run,arg): v==='log'?viewLog(run): viewData(run);
    }
  }catch(e){ view={html:'<div class="bootfail"><h2>Render fault — printed, never swallowed</h2><pre class="mono" style="white-space:pre-wrap;color:var(--sev4)">'+U.esc(e.stack||e.message)+'</pre></div>',bind(){}}; }
  app.innerHTML=view.html; view.bind();
  const raw=LeadOS.store.load();
  document.getElementById('topmeta').textContent='schema v'+raw.schemaVersion+' · '+raw.events.length+' events · '+LeadOS.store.rawBytes()+' B · 0 network';
}
function boot(){
  const missing=LeadOS.EXPECTED_MODULES.filter(m=>!LeadOS[m]);
  if(missing.length){
    document.getElementById('app').innerHTML='<div class="bootfail"><h2>BOOT REFUSED — module guard</h2><p>Expected modules missing: <b>'+missing.join(', ')+'</b></p><p class="muted">Load order contract: '+LeadOS.EXPECTED_MODULES.join(' · ')+'</p></div>';
    return;
  }
  document.getElementById('nav').innerHTML=VIEWS.map(v=>'<a href="#/'+v+'" data-v="'+v+'">'+v+'</a>').join('');
  window.addEventListener('hashchange',render);
  LeadOS.store.load(); /* migrate if needed, before first render */
  render();
}
LeadOS.ui={boot,render};
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
})();
</script>
</body>
