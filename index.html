/* ---------- quick capture ---------- */
const DATISH={dueDate:1,reviewDate:1,expiryDate:1,closeDate:1,startedAt:1,resolvedAt:1,activatedAt:1,next_maintenance:1,nextReviewDate:1,detectedAt:1,startDate:1};
const CSV_ARRAYS={systems:1,goals:1,actions:1,dependsOn:1,responseTeam:1,learnings:1};
function captureForm(){
  const types=Object.keys(LeadOS.events.REGISTRY).filter(t=>['store.initialized','settings.changed','insight.acknowledged'].indexOf(t)===-1).sort();
  const t=ui.capType&&LeadOS.events.REGISTRY[ui.capType]?ui.capType:null;
  let fields='';
  if(t){
    const spec=LeadOS.events.REGISTRY[t];
    const mk=(f,kind,req)=>{
      const lab='<label>'+f+(req?' *':'')+'</label>';
      if(spec.e[f]) return '<div>'+lab+'<select data-cf="'+f+'" data-kind="'+kind+'"><option value="">—</option>'+spec.e[f].map(v=>'<option>'+v+'</option>').join('')+'</select></div>';
      if(kind==='b') return '<div>'+lab+'<select data-cf="'+f+'" data-kind="b"><option value="">—</option><option value="true">true</option><option value="false">false</option></select></div>';
      if(DATISH[f]) return '<div>'+lab+'<input type="date" data-cf="'+f+'" data-kind="ms"></div>';
      if(kind==='n') return '<div>'+lab+'<input type="number" step="any" data-cf="'+f+'" data-kind="n"></div>';
      if(kind==='a') return '<div class="full">'+lab+(CSV_ARRAYS[f]
        ?'<input data-cf="'+f+'" data-kind="csv" placeholder="comma-separated values">'
        :'<textarea rows="2" data-cf="'+f+'" data-kind="json" placeholder=\'[{"kr":"NRR to 110%","target":110,"unit":"%"}]\'></textarea>')+'</div>';
      return '<div>'+lab+'<input data-cf="'+f+'" data-kind="'+kind+'"'+(f==='ownerId'?' placeholder="name, or the word null (explicit-null is data)"':'')+'></div>';
    };
    fields='<div class="fgrid">'+Object.keys(spec.r).map(f=>mk(f,spec.r[f],true)).join('')+Object.keys(spec.o).map(f=>mk(f,spec.o[f],false)).join('')+'</div>';
  }
  return '<div class="caphead" style="margin-top:10px"><div style="min-width:260px;flex:1"><label>event type</label>'+
    '<select data-act-change="captype"><option value="">choose an event type…</option>'+
    types.map(x=>'<option'+(x===t?' selected':'')+'>'+x+'</option>').join('')+'</select></div></div>'+
    fields+
    (t?'<div style="margin-top:12px;display:flex;gap:8px;align-items:center"><button class="btn sm" data-act="capsave">'+icon('plus',12)+' append '+t+'</button></div>':'');
}
function collectCapture(){
  const spec=LeadOS.events.REGISTRY[ui.capType];
  if(!spec){ toast('choose an event type'); return null; }
  const payload={}, errs=[];
  $$('[data-cf]').forEach(el=>{
    const f=el.dataset.cf, kind=el.dataset.kind;
    let v=el.value.trim();
    if(v==='') return;
    if(kind==='n'){ v=Number(v); if(!isFinite(v)){ errs.push(f+' must be a number'); return; } }
    else if(kind==='ms'){ v=new Date(v+'T12:00:00Z').getTime(); }
    else if(kind==='b'){ v=(v==='true'); }
    else if(kind==='csv'){ v=v.split(',').map(s=>s.trim()).filter(Boolean); }
    else if(kind==='json'){ try{ v=JSON.parse(v); }catch(e){ errs.push(f+' is not valid JSON'); return; } if(!Array.isArray(v)){ errs.push(f+' must be a JSON array'); return; } }
    else if(v==='null'&&f==='ownerId'){ v=null; }
    payload[f]=v;
  });
  if(errs.length){ toast(errs[0]); return null; }
  const verdict=LeadOS.events.validate(ui.capType,payload);
  if(!verdict.ok){ toast('rejected: '+verdict.errors[0]); return null; }
  return payload;
}

/* ---------- shell & router ---------- */
function shell(ctx){
  const R=ctx.R;
  const nav=[
    ['#/today','activity','Today',null],
    ['#/signals','zap','Signals',R.findings.length],
    ['#/insights','layers','Insights',R.insights.active.length],
    ['#/heatmap','gauge','Heatmap',R.heat.cells.length?Math.max.apply(null,R.heat.cells.map(c=>c.score)):null],
    ['#/benchmarks','bars','Benchmarks',R.insights.active.filter(i=>i.kind==='benchmark-gap').length||null],
    ['#/conversations','link','Conversations',(ctx.P.openConvs||[]).length||null],
    ['#/org','grid','Organization',(ctx.P.openSilos||[]).length||null],
    ['#/decisions','check','Decisions',(ctx.P.openCommitments||[]).length||null],
    ['#/dossier','book','Dossier',null],
    ['#/playbooks','book','Playbooks',null],
    ['#/health','shield','Health',null],
    ['#/data','db','Data',null]
  ];
  const route=V[ui.route]?ui.route:'#/today';
  return '<aside class="rail">'+
    '<div class="brand"><b>LeadOS</b><span>pt-7 · universal</span></div>'+
    '<nav class="nav">'+nav.map(n=>'<a href="'+n[0]+'" class="'+(route===n[0]?'on':'')+'">'+icon(n[1])+' '+n[2]+(n[3]!==null?'<span class="n">'+(typeof n[3]==='number'?U.rd(n[3],1):n[3])+'</span>':'')+'</a>').join('')+'</nav>'+
    '<div class="railfoot">'+
      '<div class="gate" data-gatepill>'+icon('shield',12)+' <i></i> boot gate green</div>'+
      '<div class="keystat">leados:data · v5 · '+ctx.events.length+' events<br>derived per read · nothing cached</div>'+
    '</div></aside>'+
    '<main><div class="view" id="viewhost">'+V[route].render(ctx)+'</div>'+
    '<footer class="colophon"><span>LeadOS pt-7</span><span>append-only · no network · no accounts</span><span>#'+route.slice(2)+'</span><span>'+new Date(ctx.now).toISOString()+'</span></footer></main>';
}
function render(){
  let ctx;
  try{ ctx=readAll(); }
  catch(e){ gateWall('Store failed to load',e.message); return; }
  $('#app').innerHTML=shell(ctx);
}
function gateWall(title,detail){
  const g=$('#gatewall');
  g.hidden=false;
  g.innerHTML='<div class="box"><div class="kicker" style="color:var(--accent)">authority wall</div><h1>'+esc(title)+'</h1>'+
    '<p class="muted" style="margin-bottom:12px">Integrity checks halt rendering — the wall protects you from mistaking a broken system for a quiet one. Your data is untouched.</p>'+
    '<pre>'+esc(detail)+'</pre></div>';
}

/* ---------- actions ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(!b) return;
  const act=b.dataset.act;
  if(act==='chip'){ ui.chip=b.dataset.d; render(); }
  else if(act==='dossier'){ ui.dossier=b.dataset.id;
    if(location.hash!=='#/dossier') location.hash='#/dossier'; else render(); }
  else if(act==='heat'){ ui.heatSel=(ui.heatSel===b.dataset.d)?null:b.dataset.d; render(); }
  else if(act==='ack'){ ui.ackOpen=b.dataset.id; render(); }
  else if(act==='ackcancel'){ ui.ackOpen=null; render(); }
  else if(act==='findsup'){ ui.supOpen=b.dataset.key; render(); }
  else if(act==='supcancel'){ ui.supOpen=null; render(); }
  else if(act==='findsupdo'){
    const host=b.closest('.fin'), input=host&&host.querySelector('[data-supnote]');
    const note=input?input.value.trim():'';
    try{ LeadOS.store.append('signal.tagged',{eventId:b.dataset.key,tag:'suppress',note:note});
      ui.supOpen=null; toast('signal.tagged · suppress appended'); render(); }
    catch(err){ toast(err.message); } }
  else if(act==='findunsup'){
    try{ LeadOS.store.append('signal.tagged',{eventId:b.dataset.key,tag:'unsuppress',note:''});
      toast('signal.tagged · unsuppress appended'); render(); }
    catch(err){ toast(err.message); } }
  else if(act==='playrun'){
    const nid=b.dataset.id;
    if(ui.playRunner!==nid) ui.playDraft={};
    ui.playRunner=nid;
    if(b.dataset.ptype) ui.playDraft.type=b.dataset.ptype;
    if(b.dataset.pperson) ui.playDraft.personIds=b.dataset.pperson;
    const target=LeadOS.playbooks.INTERACTIVE[nid]&&LeadOS.playbooks.INTERACTIVE[nid].free?'#/conversations':'#/playbooks';
    if(location.hash!==target) location.hash=target; else render();
    window.scrollTo(0,0); }
  else if(act==='playcancel'){ ui.playRunner=null; ui.playDraft={}; render(); }
  else if(act==='playsubmit'){
    if(b.disabled) return;
    const id=b.dataset.id, spec=LeadOS.playbooks.INTERACTIVE[id];
    if(!spec) return;
    const ctx=readAll();
    if(!ctx.R.patterns.active.some(p=>p.name===spec.pattern)){ toast('pattern not active — submission disabled'); return; }
    const root=b.closest('.card');
    const values={}, errs=[];
    spec.fields(ctx.R,ctx.P).forEach(fd=>{
      if(fd.kind==='checks'){
        values[fd.key]=Array.prototype.slice.call(root.querySelectorAll('[data-pf="'+fd.key+'"]:checked')).map(el=>el.value);
        if(fd.req&&!values[fd.key].length) errs.push(fd.label+' is required');
        return;
      }
      const el=root.querySelector('[data-pf="'+fd.key+'"]');
      let v=el?String(el.value).trim():'';
      if(v===''){ if(fd.req) errs.push(fd.label+' is required'); return; }
      if(fd.kind==='number'){ v=Number(v); if(!isFinite(v)){ errs.push(fd.label+' must be a number'); return; } }
      if(fd.kind==='date'){ v=new Date(v+'T12:00:00Z').getTime(); if(!isFinite(v)){ errs.push(fd.label+' must be a date'); return; } }
      values[fd.key]=v;
    });
    if(errs.length){ toast(errs[0]); return; }
    let out;
    try{ out=spec.submit(values,ctx.R,ctx.P); }
    catch(e2){ toast('submit adapter threw: '+e2.message); return; }
    const evts=(out&&out.events)||[];
    if(!evts.length){ toast('nothing to append — the form produced no events (printed)'); return; }
    const preview=evts.map((e,i)=>{
      const v=LeadOS.events.validate(e.type,e.payload);
      return (i+1)+'. '+e.type+(v.ok?'':'  [WOULD BE REJECTED: '+v.errors[0]+']')+'\n   '+JSON.stringify(e.payload).slice(0,150);
    }).join('\n');
    if(!confirm('This playbook will append '+evts.length+' event(s). Review the specs:\n\n'+preview+'\n\nAppend all?')) return;
    let done=0, fail=null;
    for(const e of evts){ try{ LeadOS.store.append(e.type,e.payload); done++; }catch(ex){ fail=ex; break; } }
    toast('appended '+done+' of '+evts.length+(fail?' · FAILED: '+fail.message:'')+(done<evts.length?' · partial completion is possible — every successful append is in the audit tail':''));
    ui.playRunner=null; render(); }
  else if(act==='ackdo'){
    const host=b.closest('.ins'), input=host&&host.querySelector('[data-acknote]');
    const note=input?input.value.trim():'';
    const fp=host&&host.dataset?host.dataset.fp:'';
    const payload={insightId:b.dataset.id,note:note};
    if(fp) payload.fingerprint=fp;
    try{ LeadOS.store.append('insight.acknowledged',payload);
      ui.ackOpen=null; toast('insight.acknowledged appended (fingerprinted)'); render(); }
    catch(err){ toast(err.message); } }
  else if(act==='acktoday'){
    const payload={insightId:b.dataset.id,note:''};
    if(b.dataset.fp) payload.fingerprint=b.dataset.fp;
    try{ LeadOS.store.append('insight.acknowledged',payload);
      toast('acknowledged — '+b.dataset.id.slice(0,42)); render(); }
    catch(err){ toast(err.message); } }
  else if(act==='gotofinding'){
    ui.chip='ALL'; ui.focusFinding=b.dataset.key;
    if(location.hash!=='#/signals') location.hash='#/signals'; else render();
  }
  else if(act==='capsave'){
    const p=collectCapture(); if(!p) return;
    try{ LeadOS.store.append(ui.capType,p); toast(ui.capType+' appended'); render(); }
    catch(err){ toast(err.message); } }
  else if(act==='benchset'){
    const g=k=>{ const el=document.querySelector('[data-bf="'+k+'"]'); return el?el.value.trim():''; };
    const p={metric:g('metric'),value:Number(g('value')),unit:g('unit'),source:g('source'),period:g('period')};
    if(g('type')) p.type=g('type');
    try{ LeadOS.store.append('benchmark.set',p); toast('benchmark.set appended'); render(); }
    catch(err){ toast(err.message); } }
  else if(act==='setsave'){
    let n=0;
    try{
      $$('[data-setk]').forEach(el=>{
        const cur=el.value.trim(); if(cur==='') return;
        const k=el.dataset.setk;
        const folded=LeadOS.engine.settings(LeadOS.engine.project(LeadOS.store.getEvents()));
        if(String(folded[k])===cur) return;
        /* v6 settings are STRINGS — coercing them to Number would write NaN */
        const isStr=el.dataset.settype==='string';
        const en=LeadOS.store.SETTING_ENUMS[k];
        if(en&&en.indexOf(cur)===-1){ toast(k+' must be one of '+en.join('|')); return; }
        const val=isStr?cur:Number(cur);
        if(!isStr&&!isFinite(val)){ toast(k+' must be numeric'); return; }
        LeadOS.store.append('settings.changed',{key:k,value:val}); n++;
      });
      toast(n?n+' settings.changed appended':'no changes'); render();
    }catch(err){ toast(err.message); } }
  else if(act==='seed'){
    if(!confirm('Load the deterministic demo seed? This REPLACES the current log.')) return;
    try{ LeadOS.store.loadFixture(LeadOS.health.buildSeed(Date.now()),'demo-seed'); toast('demo seed loaded'); render(); }
    catch(err){ toast(err.message); } }
  else if(act==='purge'){
    if(!confirm('Purge leados:data and re-genesis? This cannot be undone.')) return;
    LeadOS.store.purge(); toast('store re-genesised'); render(); }
  else if(act==='export'){
    const blob=new Blob([JSON.stringify(LeadOS.store.exportRaw(),null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download='leados-export-'+new Date().toISOString().slice(0,10)+'.json';
    a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),500);
    toast('exported — data leaves only because you asked'); }
});
/* live preparation: re-render on input for runners that expose live() */
let liveTimer=null;
document.addEventListener('input',e=>{
  const el=e.target;
  if(!el.dataset||!el.dataset.pf||!ui.playRunner) return;
  const spec=LeadOS.playbooks.INTERACTIVE[ui.playRunner];
  if(!spec||!spec.live) return;
  ui.playDraft=ui.playDraft||{};
  ui.playDraft[el.dataset.pf]=el.value;
  const active=el.dataset.pf, pos=(el.selectionStart!==undefined)?el.selectionStart:null;
  clearTimeout(liveTimer);
  liveTimer=setTimeout(()=>{
    render();
    const again=document.querySelector('[data-pf="'+active+'"]');
    if(again){ again.focus(); if(pos!==null&&again.setSelectionRange){ try{ again.setSelectionRange(pos,pos); }catch(e2){} } }
  },220);
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.pf&&ui.playRunner){
    ui.playDraft=ui.playDraft||{};
    ui.playDraft[el.dataset.pf]=el.value;
    const spec=LeadOS.playbooks.INTERACTIVE[ui.playRunner];
    if(spec&&(spec.live||el.dataset.pf==='type'||el.dataset.pf==='convId'||el.dataset.pf==='personId')) render();
  }
  if(el.dataset&&el.dataset.actChange==='captype'){ ui.capType=el.value||null; render(); }
  if(el.dataset&&el.dataset.actFile==='import'&&el.files&&el.files[0]){
    const reader=new FileReader();
    reader.onload=()=>{
      let incoming; try{ incoming=JSON.parse(reader.result); }
      catch(err){ toast('not JSON: '+err.message); return; }
      try{
        const dry=LeadOS.store.mergeInto(incoming,{dryRun:true});
        if(!confirm('Import report (dry run)\nconsidered '+dry.considered+' · acceptable '+dry.acceptable+' · rewired '+dry.rewired+'\nskips '+JSON.stringify(dry._skipped)+'\n\nProceed with the real import?')) return;
        const rep=LeadOS.store.mergeInto(incoming,{});
        const host=document.querySelector('[data-importreport]');
        if(host) host.innerHTML='<div class="callout">'+icon('check')+'<div>imported '+rep.imported+' events · rewired '+rep.rewired+' ids · skipped '+rep.skippedTotal+' <span class="mono">'+esc(JSON.stringify(rep._skipped))+'</span>'+(rep.notes.length?'<br><span class="mono small">'+esc(rep.notes.slice(0,5).join(' · '))+'</span>':'')+'</div></div>';
        toast('import complete: '+rep.imported+' events'); render();
      }catch(err){ toast('import refused: '+err.message); }
    };
    reader.readAsText(el.files[0]);
  }
});
window.addEventListener('hashchange',()=>{
  const r=location.hash||'#/today';
  if(ui.route!==r){ ui.route=r; ui.heatSel=null; ui.ackOpen=null; ui.supOpen=null;
    if(r!=='#/playbooks') ui.playRunner=null;
    render(); }
});

/* ---------- boot ---------- */
(function boot(){
  /* module guard first — a missing module must name the path, not throw deep */
  const missing=LeadOS.EXPECTED_MODULES.filter(ns=>!LeadOS[ns]);
  if(missing.length){
    gateWall('Module registry incomplete — rendering halted',
      'EXPECTED: '+LeadOS.EXPECTED_MODULES.join(' · ')+'\nMISSING: '+missing.join(', ')+
      '\n\nEach module registers one LeadOS.* namespace in doctrinal load order.\nYour data is untouched.');
    return;
  }
  let res;
  try{ LeadOS.store.load(); res=LeadOS.health.runG(); }
  catch(e){ gateWall('The store failed integrity at load',e.message); return; }
  const broken=res.checks.filter((c,i)=>i<5&&!c.pass);
  if(broken.length){
    gateWall('Integrity gate failed — rendering halted',
      broken.map(c=>c.id+' '+c.name+'\n  ✗ '+c.why).join('\n\n'));
    return;
  }
  ui.route=location.hash||'#/today';
  if(!V[ui.route]) ui.route='#/today';
  render();
})();
})(); /* close module 9 */
