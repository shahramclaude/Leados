<style>
:root{
  --ink:#0b0d11; --panel:#12151c; --panel2:#171b24; --line:#232934; --line2:#2d3545;

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--ink);color:var(--txt);font:14px/1.5 -apple-system,"Segoe UI",Inter,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}

<body>

<div id="topbar">
  <span id="brand">LEADOS<small id="verlabel">·</small></span>
  <form id="captureForm" autocomplete="off">
    <div id="capture">
      <span class="faint mono tiny">&gt;</span>
      <input id="captureInput" placeholder="quick capture — try: case conflict, 1:1 Dana, fb Sam, goal Q3 retention, risk vendor…" />
    </div>
  </form>
  <span class="pill" id="pillHealth" title="self-test wall">health …</span>
  <span class="pill" id="pillSave">saved · …</span>

</div>

<div id="shell">
  <nav id="rail"></nav>

<div id="modalRoot"></div>

<script>
'use strict';
/* =========================================================================
   LEADOS — single-file leadership operating system. No framework, no
   network calls, no build step. All state in localStorage under KEY.
   This file was authored fresh this session (see AI-SESSION-LOG.md for why
   the prior repository history could not be verified and was not blindly
   extended). Every module below is real: CRUD + persistence + at least one
   cross-module wire, exercised by the in-app self-test wall at boot
   (see SELFTEST section) — open #/health to see it run in your own browser.
   ========================================================================= */

const KEY = 'leados:data';
const SCHEMA_VERSION = 1;
const QUOTA_FLOOR_BYTES = 5 * 1024 * 1024; // conservative assumed localStorage floor

// ---------- tiny utils ----------
let _uidc = 0;
function uid(){ return Date.now().toString(36)+'-'+(_uidc++).toString(36)+'-'+Math.random().toString(36).slice(2,7); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function nowTs(){ return Date.now(); }
function daysBetween(a,b){ if(!a||!b) return null; const d=(new Date(b)-new Date(a))/86400000; return Math.round(d*10)/10; }
function addDays(dateStr,n){ const d=new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function clamp(n,lo,hi){ return Math.max(lo,Math.min(hi,n)); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtBytes(n){ return (n/1024).toFixed(1)+' KB'; }
function deepClone(o){ return JSON.parse(JSON.stringify(o)); }
function byId(arr,id){ return (arr||[]).find(x=>x.id===id); }
function downloadText(filename, text, mime){
  const blob = new Blob([text], {type: mime||'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 200);
}

// =========================================================================
// SCHEMA / DEFAULT STATE
// =========================================================================
function defaultState(){
  return {
    meta: {
      schemaVersion: SCHEMA_VERSION,
      createdAt: nowTs(), lastSaved: null, lastExport: null,
      seeded: false, migrationLog: [], auditLog: []
    },
    identity: { name:'', role:'', orgName:'', startDate:'' },
    people: [],         // {id,name,role,team,isTeamLead,notes,createdAt,recognitions:0,pendingAgenda:[]}
    oneOnOnes: [],       // {id,personId,date,cadenceDays,notes,actionItems:[{text,done}],nextDate}
    pulses: [],          // {id,personId|null,date,mood,energy,note}
    goals: [],           // {id,title,ownerId,type,progress,status,dueDate,createdAt,riskFlag,riskReason,linkedCaseIds:[]}
    cases: [],           // {id,type,title,description,parties:[],severity,status,createdAt,closedAt,linkedIds:{}}
    decisions: [],       // {id,caseId,title,context,premortemDone,premortemRisks,decision,decidedAt,reviewDate,outcome,status}
    feedbackLog: [],     // {id,caseId,personId,situation,behavior,impact,date,delivered,addedToAgenda}
    delegations: [],     // {id,task,delegateId,authorityLevel,checkpoints:[],status,startedAt,dueAt,lastActivityAt}
    escalations: [],     // {id,caseId,title,severity,openedAt,slaDays,dueBy,status,resolvedAt,resolution}
    risks: [],           // {id,title,likelihood,impact,owner,mitigation,reviewDate,status,linkedCaseId}
    rituals: [],         // {id,name,type,cadenceDays,lastDone,owner}
    talent: [],          // {id,personId,performance,potential,bench,successorFor,notes}
    meetingAudit: [],    // {id,weekOf,hoursMeetings,hoursFocus,hoursOneOnOne,note}
    arrival: { expectationsExchangeDate:'', listeningTour:[], earlyWins:[] }, // listeningTour:{id,personId,done,date,notes}; earlyWins:{id,title,date,verifiedBy}
    feed: [],             // {id,ts,type,text,refId}
    snoozes: {}           // ruleKey -> untilTs
  };
}

// =========================================================================
// MIGRATIONS
// A record with no meta.schemaVersion at all never reaches here — it is
// quarantined as malformed by loadState(). This migration path exists for
// records that DO have a schemaVersion but an older/thinner shape (e.g. a
// future v2 that adds a collection). v0->v1 is exercised for real by
// self-test T1 against a synthetic fixture, not against live data.
// =========================================================================
const MIGRATIONS = {
  0: (s)=>{
    const d = defaultState();
    const merged = Object.assign({}, d, s);
    for(const k of Object.keys(d)){
      if(Array.isArray(d[k]) && !Array.isArray(merged[k])) merged[k] = [];
      if(typeof d[k]==='object' && d[k]!==null && !Array.isArray(d[k])){
        merged[k] = Object.assign({}, d[k], (s[k]&&typeof s[k]==='object')?s[k]:{});
      }
    }
    merged.meta = Object.assign({}, d.meta, s.meta||{}, {schemaVersion:1});
    merged.meta.migrationLog = (s.meta&&s.meta.migrationLog)||[];
    merged.meta.migrationLog.push({from:0,to:1,at:nowTs()});
    return merged;
  }
};
function migrate(state){
  let s = state;
  let guard = 0;
  while(s.meta.schemaVersion < SCHEMA_VERSION){
    const fn = MIGRATIONS[s.meta.schemaVersion];
    if(!fn) throw new Error('no migration from schema '+s.meta.schemaVersion);
    s = fn(s);
    guard++;
    if(guard > 50) throw new Error('migration loop guard tripped');
  }
  return s;
}

// FK fields used by integrity audit + merge-on-import rewiring.
const FK_SCALAR_FIELDS = ['personId','ownerId','delegateId','caseId','goalId','linkedCaseId','holderId','seatId','successorFor','whoId'];
const FK_ARRAY_FIELDS = ['parties','linkedCaseIds'];

function integrityAudit(state){
  const repairs = []; const fatal = [];
  const d = defaultState();
  for(const k of Object.keys(d)){
    if(Array.isArray(d[k]) && !Array.isArray(state[k])){ state[k]=[]; repairs.push('coerced '+k+' to []'); }
  }
  if(!state.identity || typeof state.identity!=='object'){ state.identity = d.identity; repairs.push('restored identity object'); }
  if(!state.arrival || typeof state.arrival!=='object'){ state.arrival = d.arrival; repairs.push('restored arrival object'); }
  if(!Array.isArray(state.arrival.listeningTour)) { state.arrival.listeningTour=[]; repairs.push('coerced arrival.listeningTour'); }
  if(!Array.isArray(state.arrival.earlyWins)) { state.arrival.earlyWins=[]; repairs.push('coerced arrival.earlyWins'); }
  if(!state.snoozes || typeof state.snoozes!=='object'){ state.snoozes={}; repairs.push('restored snoozes'); }
  // referential checks: null out dangling personId refs rather than drop records (data-preserving)
  const personIds = new Set((state.people||[]).map(p=>p.id));
  function checkRefs(arr, field){
    (arr||[]).forEach(rec=>{
      if(rec && rec[field] && !personIds.has(rec[field])){
        repairs.push(field+' on '+(rec.id||'?')+' pointed to missing person — cleared');
        rec[field] = null;
      }
    });
  }
  checkRefs(state.oneOnOnes,'personId');
  checkRefs(state.pulses,'personId');
  checkRefs(state.goals,'ownerId');
  checkRefs(state.delegations,'delegateId');
  checkRefs(state.feedbackLog,'personId');
  checkRefs(state.talent,'personId');
  return {repairs, fatal};
}

// =========================================================================
// LOAD / SAVE / QUOTA / CORRUPTION
// =========================================================================
let STATE = null;
let RECOVERY = null;      // {type, message} or null
let LAST_SAVE_OK = true;
let LAST_SAVE_ERR = null;

function quarantine(raw, label){
  try{ localStorage.setItem(KEY+'.'+label+'.'+Date.now(), raw); return true; }
  catch(e){ console.error('quarantine failed, disk likely full', e); return false; }
}

function loadState(){
  const raw = localStorage.getItem(KEY);
  if(raw === null){
    return { state: defaultState(), recovery: null };
  }
  let parsed;
  try{ parsed = JSON.parse(raw); }
  catch(e){
    quarantine(raw, 'corrupt');
    return { state: defaultState(), recovery: {type:'corrupt', message:'Saved data at "'+KEY+'" was not valid JSON (parse error: '+e.message+'). The raw bytes were copied to a quarantine key and the main key was left untouched. You are starting from a clean in-memory state; nothing on disk was overwritten.'} };
  }
  if(!parsed || typeof parsed !== 'object' || !parsed.meta || typeof parsed.meta.schemaVersion !== 'number'){
    quarantine(raw, 'malformed');
    return { state: defaultState(), recovery: {type:'malformed', message:'Saved data did not match the expected shape (missing meta.schemaVersion). Quarantined, main key untouched.'} };
  }
  if(parsed.meta.schemaVersion > SCHEMA_VERSION){
    quarantine(raw, 'superseded');
    return { state: defaultState(), recovery: {type:'superseded', message:'Saved data reports schema v'+parsed.meta.schemaVersion+', newer than this build (v'+SCHEMA_VERSION+') understands. Quarantined rather than guessed at. Use an older/newer build, or export+inspect the quarantine key from the console.'} };
  }
  let migrated;
  try{ migrated = migrate(parsed); }
  catch(e){
    quarantine(raw, 'migration-failed');
    return { state: defaultState(), recovery: {type:'migration-failed', message:'Migration threw: '+e.message+'. Quarantined, main key untouched.'} };
  }
  const audit = integrityAudit(migrated);
  if(audit.fatal.length){
    quarantine(raw, 'failed-audit');
    return { state: defaultState(), recovery: {type:'failed-audit', message:'Failed integrity audit: '+audit.fatal.join('; ')} };
  }
  if(audit.repairs.length){ migrated.meta.auditLog = (migrated.meta.auditLog||[]).concat(audit.repairs.map(r=>({at:nowTs(),r}))); }
  return { state: migrated, recovery: null, repairs: audit.repairs };
}

function trySetItem(storageLike, key, val){
  try{ storageLike.setItem(key, val); return {ok:true}; }
  catch(e){ return {ok:false, err:e}; }
}

function save(){
  STATE.meta.lastSaved = nowTs();
  const res = trySetItem(localStorage, KEY, JSON.stringify(STATE));
  LAST_SAVE_OK = res.ok;
  LAST_SAVE_ERR = res.ok ? null : res.err;
  renderTopPills();
  return res.ok;
}

function bytesUsed(){
  try{ return new Blob([JSON.stringify(STATE)]).size; } catch(e){ return JSON.stringify(STATE).length; }
}

// =========================================================================
// EVENT / FEED LAYER — every module writes through this so the activity
// stream and recommendation engine see it immediately. This is the "shared
// event/data layer": nothing updates a module without also appending here.
// =========================================================================
function emit(state, type, text, refId){
  state.feed.unshift({id:uid(), ts:nowTs(), type, text, refId: refId||null});
  if(state.feed.length > 500) state.feed.length = 500;
}

// =========================================================================
// CASE SPINE — register a case once, route it to every module that cares.
// This function is PURE with respect to its `state` argument (mutates only
// what is passed in) so it can be exercised in isolation by self-tests
// without touching the live STATE or localStorage.
// =========================================================================
const SLA_DAYS_BY_SEVERITY = {5:1, 4:3, 3:7, 2:14, 1:30};

function applyRegisterCase(state, payload){
  const c = {
    id: uid(),
    type: payload.type,                // conflict | decision | feedback | incident | goal-risk | recognition | note
    title: payload.title || '(untitled case)',
    description: payload.description || '',
    parties: Array.isArray(payload.parties) ? payload.parties.filter(Boolean) : [],
    severity: clamp(parseInt(payload.severity||3,10)||3, 1, 5),
    status: 'open',
    createdAt: nowTs(),
    closedAt: null,
    linkedIds: {}
  };
  state.cases.push(c);
  emit(state, 'case', 'Case registered: '+c.type+' — '+c.title, c.id);
  c.parties.forEach(pid=>{
    const p = byId(state.people, pid);
    if(p) emit(state, 'case', '('+p.name+') linked to case: '+c.title, c.id);
  });

  switch(c.type){
    case 'conflict': {
      const slaDays = SLA_DAYS_BY_SEVERITY[c.severity];
      const esc = {
        id: uid(), caseId: c.id, title: 'Resolve: '+c.title, severity: c.severity,
        openedAt: nowTs(), slaDays, dueBy: addDays(todayStr(), slaDays),
        status: 'open', resolvedAt: null, resolution: ''
      };
      state.escalations.push(esc);
      c.linkedIds.escalationId = esc.id;
      emit(state, 'escalation', 'Escalation opened from case "'+c.title+'", SLA '+slaDays+'d', esc.id);
      break;
    }
    case 'decision': {
      const dec = {
        id: uid(), caseId: c.id, title: c.title, context: c.description,
        premortemDone: false, premortemRisks: '', decision: '', decidedAt: null,
        reviewDate: addDays(todayStr(), 30), outcome: '', status: 'open',
        requiresPremortem: c.severity >= 4
      };
      state.decisions.push(dec);
      c.linkedIds.decisionId = dec.id;
      emit(state, 'decision', 'Decision stub opened from case "'+c.title+'"'+(dec.requiresPremortem?' — premortem required (sev '+c.severity+')':''), dec.id);
      break;
    }
    case 'feedback': {
      const fb = {
        id: uid(), caseId: c.id, personId: c.parties[0]||null,
        situation: payload.situation||'', behavior: payload.behavior||'', impact: payload.impact||'',
        date: todayStr(), delivered: false, addedToAgenda: false
      };
      state.feedbackLog.push(fb);
      c.linkedIds.feedbackId = fb.id;
      // route to the person's next open 1:1, or flag pendingAgenda on the person record
      const person = byId(state.people, fb.personId);
      const nextOO = (state.oneOnOnes||[]).filter(o=>o.personId===fb.personId && o.status!=='done')
        .sort((a,b)=>new Date(a.nextDate||a.date)-new Date(b.nextDate||b.date))[0];
      if(nextOO){
        nextOO.actionItems = nextOO.actionItems||[];
        nextOO.actionItems.push({text:'Deliver SBI feedback: '+c.title, done:false});
        fb.addedToAgenda = true;
        emit(state, 'feedback', 'SBI feedback queued onto next 1:1 agenda'+(person?(' for '+person.name):''), fb.id);
      } else if(person){
        person.pendingAgenda = person.pendingAgenda||[];
        person.pendingAgenda.push({text:'Deliver SBI feedback: '+c.title, caseId:c.id});
        emit(state, 'feedback', 'SBI feedback queued — no scheduled 1:1 yet for '+person.name+', flagged on dossier', fb.id);
      }
      break;
    }
    case 'incident': {
      const slaDays = SLA_DAYS_BY_SEVERITY[c.severity];
      const esc = { id: uid(), caseId: c.id, title: 'Incident: '+c.title, severity: c.severity,
        openedAt: nowTs(), slaDays, dueBy: addDays(todayStr(), slaDays), status:'open', resolvedAt:null, resolution:'' };
      state.escalations.push(esc);
      c.linkedIds.escalationId = esc.id;
      const risk = { id: uid(), title: 'Recurrence risk: '+c.title, likelihood: 3, impact: c.severity,
        owner: payload.owner||'', mitigation: '', reviewDate: addDays(todayStr(),14), status:'proposed', linkedCaseId: c.id };
      state.risks.push(risk);
      c.linkedIds.riskId = risk.id;
      emit(state, 'incident', 'Incident opened escalation + proposed risk entry', c.id);
      break;
    }
    case 'goal-risk': {
      const goal = byId(state.goals, payload.goalId);
      if(goal){
        goal.riskFlag = true;
        goal.riskReason = c.description || c.title;
        goal.linkedCaseIds = (goal.linkedCaseIds||[]).concat(c.id);
        c.linkedIds.goalId = goal.id;
        emit(state, 'goal', 'Goal flagged at risk: '+goal.title, goal.id);
      }
      break;
    }
    case 'recognition': {
      const person = byId(state.people, c.parties[0]);
      if(person){ person.recognitions = (person.recognitions||0) + 1; emit(state,'recognition','Recognition logged for '+person.name, c.id); }
      break;
    }
    default: break; // plain note case: filed, no routing — this is intentional, not a bug
  }
  return c;
}

function applyCloseCase(state, caseId, override){
  const c = byId(state.cases, caseId);
  if(!c) return {ok:false, reason:'case not found'};
  if(c.status === 'closed') return {ok:false, reason:'already closed'};
  const linkedEsc = c.linkedIds.escalationId ? byId(state.escalations, c.linkedIds.escalationId) : null;
  const linkedDec = c.linkedIds.decisionId ? byId(state.decisions, c.linkedIds.decisionId) : null;
  const openBlockers = [];
  if(linkedEsc && linkedEsc.status === 'open') openBlockers.push('linked escalation "'+linkedEsc.title+'" is still open');
  if(linkedDec && linkedDec.status === 'open') openBlockers.push('linked decision "'+linkedDec.title+'" has no recorded decision yet');
  if(openBlockers.length && !override){
    return {ok:false, reason:'refused: '+openBlockers.join('; ')+'. Resolve those first, or close with override.'};
  }
  c.status = 'closed'; c.closedAt = nowTs();
  emit(state, 'case', 'Case closed'+(override&&openBlockers.length?' (OVERRIDE, orphans left open: '+openBlockers.join('; ')+')':'')+': '+c.title, c.id);
  return {ok:true, overridden: !!(override && openBlockers.length)};
}

// =========================================================================
// RECOMMENDATION ENGINE — every rule returns 0..n items with an explicit
// basis ("why") and a confidence label derived from an explicit, printed
// rule (never a bare assertion). Each rule is wrapped individually so one
// malformed record cannot take down the whole feed (see self-test T7).
// =========================================================================
function confidenceFromSampleSize(n){
  if(n < 3) return {level:'low', rule:'fewer than 3 data points ('+n+')'};
  if(n < 8) return {level:'medium', rule:n+' data points — trend is indicative, not proven'};
  return {level:'high', rule:n+' data points — stable enough to trust the slope'};
}

const RULES = [
  // ---- 1:1 cadence ----
  function rule_oo_never(s){
    const out=[];
    s.people.forEach(p=>{
      const has = s.oneOnOnes.some(o=>o.personId===p.id);
      if(!has){
        out.push({id:'oo-never-'+p.id, severity:3, module:'1:1', title:'No 1:1 ever logged with '+p.name,
          why:[{basis:'people[].id has zero matching oneOnOnes[].personId', value:p.name}],
          confidence:{level:'high',rule:'absence of any record is a certain fact, not a trend'},
          link:'#/oneonones'});
      }
    });
    return out;
  },
  function rule_oo_overdue(s){
    const out=[];
    s.people.forEach(p=>{
      const mine = s.oneOnOnes.filter(o=>o.personId===p.id).sort((a,b)=>new Date(b.date)-new Date(a.date));
      if(!mine.length) return;
      const last = mine[0];
      const cadence = last.cadenceDays || 14;
      const overdueBy = daysBetween(last.date, todayStr()) - cadence;
      if(overdueBy > 0){
        out.push({id:'oo-overdue-'+p.id, severity: overdueBy>cadence? 4:3, module:'1:1',
          title: p.name+"'s 1:1 is "+overdueBy+'d overdue',
          why:[{basis:'last 1:1 on '+last.date+', cadence '+cadence+'d, today '+todayStr(), value: overdueBy+'d over'}],
          confidence:{level:'high', rule:'date arithmetic, not inference'}, link:'#/oneonones'});
      }
    });
    return out;
  },
  // ---- pulse ----
  function rule_pulse_stale(s){
    const out=[];
    s.people.forEach(p=>{
      const mine = s.pulses.filter(x=>x.personId===p.id).sort((a,b)=>new Date(b.date)-new Date(a.date));
      const last = mine[0];
      const age = last ? daysBetween(last.date, todayStr()) : null;
      if(!last || age>14){
        out.push({id:'pulse-stale-'+p.id, severity:2, module:'Pulse', title:'No recent pulse check on '+p.name,
          why:[{basis: last? ('last pulse '+age+'d ago'):'no pulse ever recorded', value: age}],
          confidence:{level:'high',rule:'absence/age is a fact'}, link:'#/pulse'});
      }
    });
    return out;
  },
  function rule_mood_slope(s){
    const out=[];
    s.people.forEach(p=>{
      const mine = s.pulses.filter(x=>x.personId===p.id).sort((a,b)=>new Date(a.date)-new Date(b.date));
      if(mine.length<2) return;
      const recent = mine.slice(-5);
      const slope = recent[recent.length-1].mood - recent[0].mood;
      const conf = confidenceFromSampleSize(recent.length);
      if(slope <= -2){
        out.push({id:'mood-slope-'+p.id, severity:4, module:'Pulse', title:'Mood trending down for '+p.name,
          why:[{basis:'mood '+recent[0].mood+' → '+recent[recent.length-1].mood+' over last '+recent.length+' check-ins', value:slope}],
          confidence:conf, link:'#/pulse'});
      }
    });
    return out;
  },
  // ---- goals ----
  function rule_goal_no_owner(s){
    return s.goals.filter(g=>g.status!=='done' && !g.ownerId).map(g=>({
      id:'goal-no-owner-'+g.id, severity:3, module:'Goals', title:'Goal has no owner: '+g.title,
      why:[{basis:'ownerId is empty', value:null}], confidence:{level:'high',rule:'field presence check'}, link:'#/goals'
    }));
  },
  function rule_goal_overdue(s){
    const out=[];
    s.goals.forEach(g=>{
      if(g.status==='done' || !g.dueDate) return;
      const over = daysBetween(g.dueDate, todayStr());
      if(over>0) out.push({id:'goal-overdue-'+g.id, severity:4, module:'Goals', title:'Goal overdue: '+g.title,
        why:[{basis:'due '+g.dueDate+', today '+todayStr(), value:over+'d over'}],
        confidence:{level:'high',rule:'date arithmetic'}, link:'#/goals'});
      else if(over>-7) out.push({id:'goal-due7-'+g.id, severity:2, module:'Goals', title:'Goal due within a week: '+g.title,
        why:[{basis:'due '+g.dueDate}], confidence:{level:'high',rule:'date arithmetic'}, link:'#/goals'});
    });
    return out;
  },
  function rule_goal_flagged(s){
    return s.goals.filter(g=>g.riskFlag && g.status!=='done').map(g=>({
      id:'goal-flag-'+g.id, severity:4, module:'Goals', title:'Goal flagged at risk: '+g.title,
      why:[{basis:'riskFlag set — reason: '+(g.riskReason||'not given')}], confidence:{level:'medium',rule:'a human asserted this, not computed'}, link:'#/goals'
    }));
  },
  // ---- cases / escalations ----
  function rule_escalation_breach(s){
    return s.escalations.filter(e=>e.status==='open' && daysBetween(e.dueBy, todayStr())>0).map(e=>({
      id:'esc-breach-'+e.id, severity:5, module:'Escalations', title:'SLA breached: '+e.title,
      why:[{basis:'due '+e.dueBy+', today '+todayStr()+', severity '+e.severity+' → '+SLA_DAYS_BY_SEVERITY[e.severity]+'d SLA'}],
      confidence:{level:'high',rule:'date arithmetic against a fixed SLA table'}, link:'#/escalations'
    }));
  },
  function rule_escalation_due_soon(s){
    return s.escalations.filter(e=>e.status==='open' && daysBetween(todayStr(), e.dueBy)>=0 && daysBetween(todayStr(), e.dueBy)<=1).map(e=>({
      id:'esc-due-'+e.id, severity:4, module:'Escalations', title:'SLA due within 24h: '+e.title,
      why:[{basis:'due '+e.dueBy}], confidence:{level:'high',rule:'date arithmetic'}, link:'#/escalations'
    }));
  },
  // ---- decisions ----
  function rule_decision_premortem(s){
    return s.decisions.filter(d=>d.status==='open' && d.requiresPremortem && !d.premortemDone).map(d=>({
      id:'dec-premortem-'+d.id, severity:4, module:'Decisions', title:'Premortem missing on high-severity decision: '+d.title,
      why:[{basis:'linked case severity ≥4 requires a premortem before deciding'}],
      confidence:{level:'high',rule:'policy check, not inference'}, link:'#/decisions'
    }));
  },
  function rule_decision_review_due(s){
    return s.decisions.filter(d=>d.status==='decided' && d.reviewDate && daysBetween(d.reviewDate, todayStr())>=0 && !d.outcome).map(d=>({
      id:'dec-review-'+d.id, severity:3, module:'Decisions', title:'Decision review due, no outcome recorded: '+d.title,
      why:[{basis:'review date '+d.reviewDate+' has passed'}], confidence:{level:'high',rule:'date arithmetic'}, link:'#/decisions'
    }));
  },
  // ---- feedback ----
  function rule_feedback_pending(s){
    return s.feedbackLog.filter(f=>!f.delivered && daysBetween(f.date, todayStr())>=3).map(f=>{
      const p = byId(s.people, f.personId);
      return {id:'fb-pending-'+f.id, severity:3, module:'Feedback', title:'SBI feedback drafted but not delivered'+(p?(' — '+p.name):''),
        why:[{basis:'drafted '+f.date+', '+daysBetween(f.date,todayStr())+'d ago, not marked delivered'}],
        confidence:{level:'high',rule:'date arithmetic'}, link:'#/feedback'};
    });
  },
  // ---- delegation ----
  function rule_delegation_decay(s){
    return s.delegations.filter(d=>d.status==='active').map(d=>{
      const lastAct = d.checkpoints.length ? d.checkpoints[d.checkpoints.length-1].date : d.startedAt;
      const age = daysBetween(lastAct, todayStr());
      if(age>10) return {id:'del-decay-'+d.id, severity: age>21?4:3, module:'Delegation', title:'No check-in on delegated task: '+d.task,
        why:[{basis:'last activity '+age+'d ago'}], confidence:{level:'high',rule:'date arithmetic'}, link:'#/delegation'};
      return null;
    }).filter(Boolean);
  },
  // ---- risks ----
  function rule_risk_review(s){
    return s.risks.filter(r=>r.status!=='closed' && r.reviewDate && daysBetween(r.reviewDate, todayStr())>=0).map(r=>({
      id:'risk-review-'+r.id, severity: r.likelihood*r.impact>=16?5:3, module:'Risks', title:'Risk review due: '+r.title,
      why:[{basis:'review date '+r.reviewDate+' passed; likelihood×impact='+(r.likelihood*r.impact)}],
      confidence:{level:'high',rule:'date arithmetic + stated L×I'}, link:'#/risks'
    }));
  },
  // ---- rituals ----
  function rule_ritual_lapsed(s){
    return s.rituals.filter(r=>{
      if(!r.lastDone) return true;
      return daysBetween(r.lastDone, todayStr()) > r.cadenceDays;
    }).map(r=>({
      id:'ritual-lapsed-'+r.id, severity:2, module:'Rituals', title:'Ritual lapsed: '+r.name,
      why:[{basis: r.lastDone? ('last done '+r.lastDone+', cadence '+r.cadenceDays+'d') : 'never logged as done'}],
      confidence:{level:'high',rule:'date arithmetic'}, link:'#/rituals'
    }));
  },
  // ---- talent / bench ----
  function rule_bench_empty(s){
    const criticalSeats = s.people.filter(p=>p.isTeamLead);
    return criticalSeats.filter(p=>{
      return !s.talent.some(t=>t.successorFor===p.id);
    }).map(p=>({
      id:'bench-empty-'+p.id, severity:3, module:'Talent', title:'No named successor for team-lead seat: '+p.name,
      why:[{basis:'isTeamLead=true and zero talent[].successorFor matches'}],
      confidence:{level:'high',rule:'absence check'}, link:'#/talent'
    }));
  },
  // ---- meeting load ----
  function rule_meeting_load(s){
    const mine = s.meetingAudit.slice().sort((a,b)=>new Date(b.weekOf)-new Date(a.weekOf))[0];
    if(!mine) return [];
    const total = (mine.hoursMeetings||0)+(mine.hoursFocus||0)+(mine.hoursOneOnOne||0);
    if(total>0 && mine.hoursFocus/total < 0.2){
      return [{id:'load-focus-floor-'+mine.id, severity:3, module:'Load', title:'Focus time below 20% of logged week',
        why:[{basis:'focus '+mine.hoursFocus+'h of '+total+'h logged ('+Math.round(100*mine.hoursFocus/total)+'%)'}],
        confidence:{level:'medium',rule:'single self-reported week; not a trend yet'}, link:'#/load'}];
    }
    return [];
  },
  // ---- arrival (first-90-days) ----
  function rule_arrival(s){
    const out=[];
    const start = s.identity.startDate;
    if(!start) return out;
    const day = daysBetween(start, todayStr());
    if(day==null || day<0) return out;
    if(day>=14 && !s.arrival.expectationsExchangeDate){
      out.push({id:'arr-exp-overdue', severity:4, module:'Arrival', title:'Expectations exchange with your boss is overdue',
        why:[{basis:'day '+Math.round(day)+' since start, no exchange date on file; threshold is day 14'}],
        confidence:{level:'high',rule:'date arithmetic against a fixed threshold'}, link:'#/arrival'});
    }
    const required = s.people.length; // boss is tracked via identity, seat-holders via people
    const done = s.arrival.listeningTour.filter(t=>t.done).length;
    const coverage = required>0 ? done/required : 0;
    if(day>=60 && coverage<0.6 && required>0){
      out.push({id:'arr-listen-thin', severity:3, module:'Arrival', title:'Listening tour coverage is thin: '+done+'/'+required+' ('+Math.round(coverage*100)+'%)',
        why:[{basis:'day '+Math.round(day)+', threshold is 60% coverage by day 60'}],
        confidence:{level:'high',rule:'exact fraction, not estimated'}, link:'#/arrival'});
    }
    const verifiedWins = s.arrival.earlyWins.filter(w=>w.verifiedBy);
    if(day>=45 && verifiedWins.length===0){
      out.push({id:'arr-win-none', severity:4, module:'Arrival', title:'No verified early win by day 45',
        why:[{basis:'day '+Math.round(day)+'; a win only you believe happened does not count until someone else confirms it'}],
        confidence:{level:'high',rule:'threshold check'}, link:'#/arrival'});
    }
    return out;
  }
];

function computeRecommendations(state){
  const items = [];
  RULES.forEach(fn=>{
    try{
      const r = fn(state) || [];
      r.forEach(x=>{ if(!state.snoozes[x.id] || state.snoozes[x.id] < nowTs()) items.push(x); });
    }catch(e){
      console.error('rule crashed, skipped (defensive isolation):', fn.name, e);
    }
  });
  items.sort((a,b)=> b.severity - a.severity);
  return items;
}

// =========================================================================
// MERGE-ON-IMPORT — re-mints ids, rewires known FK fields.
// =========================================================================
function mergeStates(base, incoming){
  const idMap = {};
  const collections = ['people','oneOnOnes','pulses','goals','cases','decisions','feedbackLog','delegations','escalations','risks','rituals','talent','meetingAudit'];
  collections.forEach(col=>{
    (incoming[col]||[]).forEach(rec=>{
      const clone = deepClone(rec);
      const newId = uid();
      idMap[rec.id] = newId;
      clone.id = newId;
      base[col].push(clone);
    });
  });
  collections.forEach(col=>{
    base[col].forEach(rec=>{
      FK_SCALAR_FIELDS.forEach(f=>{ if(rec[f] && idMap[rec[f]]) rec[f] = idMap[rec[f]]; });
      FK_ARRAY_FIELDS.forEach(f=>{ if(Array.isArray(rec[f])) rec[f] = rec[f].map(v=>idMap[v]||v); });
      if(rec.linkedIds){ Object.keys(rec.linkedIds).forEach(k=>{ if(idMap[rec.linkedIds[k]]) rec.linkedIds[k]=idMap[rec.linkedIds[k]]; }); }
    });
  });
  (incoming.feed||[]).forEach(f=>base.feed.push(Object.assign({}, f, {id:uid(), refId: idMap[f.refId]||f.refId})));
  base.feed.sort((a,b)=>b.ts-a.ts);
  return {idMap};
}

// =========================================================================
// SELF-TEST WALL — runs for real, in your browser, on every boot. Results
// are not persisted and not asserted blind; open #/health to see the
// assertion AND the actual computed value for each.
// =========================================================================
function runSelfTests(){
  const T = [];
  function test(id, desc, fn){
    try{ const r = fn(); T.push({id,desc,pass:!!r.pass,detail:r.detail}); }
    catch(e){ T.push({id,desc,pass:false,detail:'threw: '+e.message}); }
  }

  test('T1','v0→v1 migration fills missing collections and stamps version', ()=>{
    const fixture = {meta:{schemaVersion:0}, people:[{id:'p1',name:'Fixture'}]};
    const out = migrate(deepClone(fixture));
    return {pass: out.meta.schemaVersion===1 && Array.isArray(out.goals) && out.people.length===1,
      detail:'schemaVersion='+out.meta.schemaVersion+' goals is array='+Array.isArray(out.goals)+' people.length='+out.people.length};
  });

  test('T2','corrupt JSON is caught, not thrown to the UI', ()=>{
    let caught=false, val=null;
    try{ val = JSON.parse('{"a":'); }catch(e){ caught=true; }
    return {pass:caught, detail:'JSON.parse threw as expected: '+caught};
  });

  test('T3','quota-exceeded write is caught and reported, state not lost', ()=>{
    const fakeStorage = { setItem(){ const e=new Error('quota'); e.name='QuotaExceededError'; throw e; } };
    const res = trySetItem(fakeStorage, 'x', 'y');
    return {pass: res.ok===false && !!res.err, detail:'trySetItem returned ok='+res.ok+', err.name='+(res.err&&res.err.name)};
  });

  test('T4','export/import round trip is byte-identical on a sample record', ()=>{
    const sample = defaultState();
    sample.people.push({id:'p1',name:'Round Trip',isTeamLead:true});
    const json = JSON.stringify(sample);
    const back = JSON.parse(json);
    const equal = JSON.stringify(back)===json;
    return {pass: equal, detail:'stringify(parse(x))===x : '+equal};
  });

  test('T5','registering a conflict case creates a linked escalation and a feed entry (cross-module wire)', ()=>{
    const fx = defaultState();
    fx.people.push({id:'p1',name:'A'},{id:'p2',name:'B'});
    const before = fx.escalations.length;
    const c = applyRegisterCase(fx, {type:'conflict', title:'Test conflict', parties:['p1','p2'], severity:4});
    const after = fx.escalations.length;
    const linked = fx.escalations.find(e=>e.id===c.linkedIds.escalationId);
    return {pass: after===before+1 && !!linked && fx.feed.length>=2,
      detail:'escalations '+before+'→'+after+'; linked dueBy='+(linked&&linked.dueBy)+'; feed entries='+fx.feed.length};
  });

  test('T6','recommendation engine never throws on an empty state', ()=>{
    const r = computeRecommendations(defaultState());
    return {pass: Array.isArray(r), detail:'returned array of length '+r.length};
  });

  test('T7','a malformed record (goal with no owner, no due date) is isolated, not fatal', ()=>{
    const fx = defaultState();
    fx.goals.push({id:'g1', title:'broken goal'}); // missing ownerId, dueDate, status
    let threw=false, r=[];
    try{ r = computeRecommendations(fx); }catch(e){ threw=true; }
    const flagged = r.some(x=>x.id==='goal-no-owner-g1');
    return {pass: !threw && flagged, detail:'threw='+threw+', flagged-no-owner='+flagged+', total recs='+r.length};
  });

  test('T8','closing a case with an open linked escalation is refused unless overridden', ()=>{
    const fx = defaultState();
    fx.people.push({id:'p1',name:'A'},{id:'p2',name:'B'});
    const c = applyRegisterCase(fx, {type:'conflict', title:'Orphan test', parties:['p1','p2'], severity:3});
    const r1 = applyCloseCase(fx, c.id, false);
    const r2 = applyCloseCase(fx, c.id, true);
    return {pass: r1.ok===false && r2.ok===true, detail:'no-override ok='+r1.ok+' ("'+r1.reason+'"), override ok='+r2.ok};
  });

  test('T9','unknown quick-capture verb falls back to a plain case, nothing throws', ()=>{
    const parsed = parseCapture('garbage text with no verb');
    return {pass: parsed.verb==='case' && parsed.rest==='garbage text with no verb',
      detail:'verb='+parsed.verb+' rest="'+parsed.rest+'"'};
  });

  test('T10','merge-on-import re-mints ids and rewires a foreign key', ()=>{
    const base = defaultState();
    const incoming = defaultState();
    incoming.people.push({id:'old-p1', name:'Imported Person'});
    incoming.goals.push({id:'old-g1', title:'Imported Goal', ownerId:'old-p1', status:'open'});
    const {idMap} = mergeStates(base, incoming);
    const newGoal = base.goals.find(g=>g.title==='Imported Goal');
    const rewired = newGoal && newGoal.ownerId === idMap['old-p1'] && newGoal.ownerId !== 'old-p1';
    return {pass: !!rewired, detail:'ownerId after merge="'+(newGoal&&newGoal.ownerId)+'", expected mapped id (not "old-p1")'};
  });

  return T;
}

// =========================================================================
// QUICK CAPTURE PARSER
// =========================================================================
const CAPTURE_VERBS = {
  '1:1':'oneonone', 'oo':'oneonone', 'pulse':'pulse', 'goal':'goal', 'case':'case',
  'fb':'feedback', 'risk':'risk', 'dec':'decision', 'del':'delegation', 'esc':'escalation', 'rit':'ritual'
};
function parseCapture(text){
  text = (text||'').trim();
  const m = text.match(/^(\S+)\s+(.*)$/);
  if(m && CAPTURE_VERBS[m[1].toLowerCase()]){
    return {verb: CAPTURE_VERBS[m[1].toLowerCase()], rest: m[2]};
  }
  return {verb:'case', rest:text};
}

  state.goals.push({id:uid(), title:'Design system v2 adoption', ownerId:null, type:'team', progress:10, status:'open', dueDate:addDays(todayStr(),40), createdAt:nowTs(), riskFlag:false, riskReason:'', linkedCaseIds:[]});
  state.rituals.push({id:uid(), name:'Skip-level with Payments', type:'skip', cadenceDays:30, lastDone:addDays(todayStr(),-45), owner:'You'});
  state.rituals.push({id:uid(), name:'Team retro — Platform', type:'retro', cadenceDays:14, lastDone:addDays(todayStr(),-13), owner:'Sam'});
  applyRegisterCase(state, {type:'conflict', title:'Dana vs Sam on on-call ownership', description:'Disagreement over who owns payments on-call rotation after the merge.', parties:[dana.id, sam.id], severity:4});
  emit(state,'seed','Example org seeded on first boot — replace at #/data when your real org arrives.', null);
}

function boot(){
  const loaded = loadState();
  STATE = loaded.state;
  RECOVERY = loaded.recovery;
  if(!RECOVERY) seedIfFirstRun(STATE);
  SELFTEST_RESULTS = runSelfTests();
  save();
  renderRail();
  router();
  renderTopPills();
  window.addEventListener('hashchange', ()=>{ router(); renderRail(); });
}

function renderTopPills(){
  document.getElementById('verlabel').textContent = ' schema v'+SCHEMA_VERSION;
  const bytes = bytesUsed();
  const pct = Math.min(100, (bytes/QUOTA_FLOOR_BYTES)*100);
  const qp = document.getElementById('pillQuota');
  qp.textContent = pct.toFixed(2)+'% of 5MB';
  qp.className = 'pill' + (pct>=70?' warn':'');
  const sp = document.getElementById('pillSave');
  if(LAST_SAVE_OK){ sp.textContent = 'saved · '+fmtBytes(bytes); sp.className='pill ok'; }
  else { sp.textContent = 'WRITE FAILED'; sp.className='pill bad'; sp.title = (LAST_SAVE_ERR&&LAST_SAVE_ERR.message)||'quota exceeded'; }
  const hp = document.getElementById('pillHealth');
  const passed = SELFTEST_RESULTS.filter(t=>t.pass).length;
  hp.textContent = 'health '+passed+'/'+SELFTEST_RESULTS.length;
  hp.className = 'pill ' + (passed===SELFTEST_RESULTS.length ? 'ok':'bad');
  hp.onclick = ()=>{ location.hash = '#/health'; };
}

const NAV = [
  {grp:'', items:[['home','Home','home']]},
  {grp:'People', items:[['people','Roster','people'],['oneonones','1:1s','oneonones'],['pulse','Pulse','pulse']]},
  {grp:'Work', items:[['goals','Goals','goals'],['delegation','Delegation','delegation']]},
  {grp:'Judgment', items:[['cases','Cases','cases'],['decisions','Decisions','decisions'],['feedback','Feedback','feedback'],['escalations','Escalations','escalations'],['risks','Risks','risks']]},
  {grp:'Org', items:[['rituals','Rituals','rituals'],['talent','Talent & Bench','talent'],['load','Meeting Load','load'],['arrival','First 90 Days','arrival']]},
  {grp:'System', items:[['data','Data & Backup','data'],['health','System Health','health']]}
];
function countFor(route){
  if(!STATE) return 0;
  switch(route){
    case 'cases': return STATE.cases.filter(c=>c.status==='open').length;
    case 'escalations': return STATE.escalations.filter(e=>e.status==='open' && daysBetween(e.dueBy,todayStr())>0).length;
    case 'goals': return STATE.goals.filter(g=>g.riskFlag && g.status!=='done').length;
    default: return 0;
  }
}
function renderRail(){
  const current = (location.hash.slice(2)||'home').split('/')[0];
  let html = '';
  NAV.forEach(g=>{
    if(g.grp) html += '<div class="grp">'+esc(g.grp)+'</div>';
    g.items.forEach(([route,label])=>{
      const n = countFor(route);
      html += '<a href="#/'+route+'" class="'+(current===route?'on':'')+'">'+esc(label)+(n?'<span class="bub hot">'+n+'</span>':'')+'</a>';
    });
  });
  document.getElementById('rail').innerHTML = html;
}

  const required = STATE.people.length;
  const done = a.listeningTour.filter(t=>t.done).length;
  const verifiedWins = a.earlyWins.filter(w=>w.verifiedBy).length;
  return '<h1>First 90 Days</h1><p class="sub">The arrival contract. Every number here prints the exact formula behind it — this is a new leader-of-leaders instrument, not a generic dashboard.</p>'+

  '<form data-act="setStartDate" class="row"><input type="date" name="startDate" value="'+(start||'')+'" style="max-width:200px"><button class="pri" type="submit">Save</button></form>'+
  (day!=null? ('<p class="small" style="margin-top:8px">Day <b>'+Math.round(day)+'</b> since start. Phase: <b>'+phase+'</b> (computed as &lt;30 Diagnose, &lt;60 Align, &lt;90 Commit, else Operate).</p>') : '')+'</div>'+
  '<div class="card" style="margin-bottom:14px"><h2>Expectations exchange with your boss</h2>'+
  (a.expectationsExchangeDate? ('<p class="small">Done on '+a.expectationsExchangeDate+'.</p>') : '<p class="small muted">Not done yet. Overdue flag fires on Home at day 14.</p>')+
  '<form data-act="setExpectations" class="row"><input type="date" name="date" value="'+todayStr()+'"><button type="submit">Log exchange done today</button></form></div>'+
  '<div class="card" style="margin-bottom:14px"><h2>Listening tour — '+done+'/'+required+' ('+(required?Math.round(100*done/required):0)+'%)</h2>'+
  '<p class="small muted">Required set = everyone on your roster. 60% coverage is expected by day 60.</p>'+
  STATE.people.map(p=>{const t=a.listeningTour.find(x=>x.personId===p.id);
    return '<div class="row between small" style="margin-bottom:4px"><span>'+esc(p.name)+(t&&t.done?(' <span class="faint tiny">'+t.date+'</span>'):'')+'</span>'+
    (t&&t.done? '<span class="badge ok">done</span>' : '<a data-act="logListening" data-id="'+p.id+'" class="tiny">mark listened</a>')+'</div>';
  }).join('')+'</div>'+
  '<div class="card"><h2>Early wins — '+verifiedWins+' verified</h2>'+
  '<p class="small muted">A win only you believe happened is a story, not a win — it needs someone else\'s name on it.</p>'+
  '<form data-act="addEarlyWin" class="row"><input name="title" placeholder="win description" required><input name="verifiedBy" placeholder="verified by (optional, blank = unverified)"><button type="submit">Add</button></form>'+
  a.earlyWins.map(w=>'<div class="small" style="margin-top:6px">'+esc(w.title)+' — '+(w.verifiedBy?('<span class="badge ok">verified by '+esc(w.verifiedBy)+'</span>'):'<span class="badge mid">unverified</span>')+' <span class="faint tiny">'+w.date+'</span></div>').join('')+
  '</div>';
}

  return '<h1>Data &amp; Backup</h1><p class="sub">Everything lives in localStorage key <span class="mono">'+KEY+'</span>, schema v'+SCHEMA_VERSION+'.</p>'+
  '<div class="card" style="margin-bottom:14px"><h2>Storage</h2><p class="small">Using '+fmtBytes(bytes)+' ('+pct+'% of an assumed 5MB floor — actual browser limits vary; this is a conservative warning line, not a hard cap).</p>'+
  (LAST_SAVE_OK?'':'<div class="banner red">Last write FAILED. Your in-memory state is intact but not yet on disk. Export now before closing this tab.</div>')+'</div>'+
  '<div class="card" style="margin-bottom:14px"><h2>Export / Import</h2>'+
  '<button data-act="doExport" class="pri">Export full JSON backup</button> '+
  '<label class="btn" style="display:inline-flex"> Import JSON <input type="file" id="importFile" accept="application/json" style="display:none"></label>'+
  (STATE.meta.lastExport? ('<p class="tiny faint" style="margin-top:8px">Last export: '+new Date(STATE.meta.lastExport).toLocaleString()+'</p>') : '<p class="tiny faint" style="margin-top:8px">Never exported yet.</p>')+
  '</div>'+
  (legacy? ('<div class="card" style="margin-bottom:14px"><h2>Legacy key detected: <span class="mono">leados.v6</span></h2><p class="small">A prior build left data under a different key. Its internal schema was not independently verifiable by this session, so it is <b>not</b> auto-imported. You can download the raw bytes and inspect/migrate them by hand.</p><button data-act="downloadLegacy">Download raw leados.v6</button></div>') : '')+
  (quarantineKeys.length? ('<div class="card" style="margin-bottom:14px"><h2>Quarantined data ('+quarantineKeys.length+')</h2><p class="small">Corrupt or superseded saves are never deleted automatically.</p>'+quarantineKeys.map(k=>'<div class="small">'+k+' <a data-act="downloadQuarantine" data-key="'+k+'" class="tiny">download</a></div>').join('')+'</div>') : '')+
  '<div class="card"><h2>Danger zone</h2><button data-act="resetAll" class="danger">Erase everything and start clean</button></div>';
}

const ROUTES = {
  home:renderHome, people:renderPeople, person:renderPersonDossier, oneonones:renderOneOnOnes,
  pulse:renderPulse, goals:renderGoals, cases:renderCases, case:renderCaseDetail,
  decisions:renderDecisions, feedback:renderFeedback, delegation:renderDelegation,
  escalations:renderEscalations, risks:renderRisks, rituals:renderRituals, talent:renderTalent,
  load:renderLoad, arrival:renderArrival, data:renderData, health:renderHealth
};
function router(){
  const hash = location.hash.replace(/^#\/?/, '');
  const [route, id] = hash.split('/');
  const fn = ROUTES[route||'home'];
  const main = document.getElementById('main');
  try{
    main.innerHTML = fn ? fn(id) : '<h1>Not found</h1><p class="sub">Unknown route.</p>';
  }catch(e){
    main.innerHTML = '<div class="banner red"><b>This view failed to render.</b><br>'+esc(e.message)+'<br><span class="tiny">The rest of the app is unaffected — your data was not touched.</span></div>';
    console.error(e);
  }
  attachImportHandler();
}

function reRender(){ renderTopPills(); renderRail(); router(); }

const ACTIONS = {
  addPerson(data){
    STATE.people.push({id:uid(), name:data.name, role:data.role, team:data.team, isTeamLead: data.isTeamLead==='1', notes:data.notes, createdAt:nowTs(), recognitions:0, pendingAgenda:[]});
    emit(STATE,'person','Added '+data.name+' to roster');
    save(); reRender();
  },
  delPerson(data){
    STATE.people = STATE.people.filter(p=>p.id!==data.id);
    emit(STATE,'person','Removed a person from roster');
    save(); location.hash='#/people'; reRender();
  },
  addOneOnOne(data){
    STATE.oneOnOnes.push({id:uid(), personId:data.personId, date:data.date, cadenceDays:parseInt(data.cadenceDays||14,10), notes:data.notes, actionItems:[], nextDate:addDays(data.date,parseInt(data.cadenceDays||14,10)), status:'logged'});
    const p=byId(STATE.people,data.personId);
    emit(STATE,'oneonone','1:1 logged'+(p?(' with '+p.name):''));
    save(); reRender();
  },
  addPulse(data){
    STATE.pulses.push({id:uid(), personId:data.personId||null, date:data.date||todayStr(), mood:parseInt(data.mood,10), energy:parseInt(data.energy,10), note:data.note});
    emit(STATE,'pulse','Pulse logged');
    save(); reRender();
  },
  addGoal(data){
    STATE.goals.push({id:uid(), title:data.title, ownerId:data.ownerId||null, type:'team', progress:0, status:'open', dueDate:data.dueDate, createdAt:nowTs(), riskFlag:false, riskReason:'', linkedCaseIds:[]});
    emit(STATE,'goal','Goal added: '+data.title);
    save(); reRender();
  },
  updProgress(data, el){
    const g = byId(STATE.goals, data.id); if(!g) return;
    g.progress = parseInt(el.value,10);
    save(); // no full rerender needed but keep consistent
  },
  markGoalDone(data){
    const g = byId(STATE.goals, data.id); if(g){ g.status='done'; g.progress=100; emit(STATE,'goal','Goal marked done: '+g.title); }
    save(); reRender();
  },
  addCase(data, form){
    const partiesEl = form.querySelector('[name=parties]');
    const parties = partiesEl ? Array.from(partiesEl.selectedOptions).map(o=>o.value) : [];
    applyRegisterCase(STATE, Object.assign({}, data, {parties}));
    save(); reRender();
  },
  closeCase(data){
    const r = applyCloseCase(STATE, data.id, false);
    if(!r.ok){
      if(confirm('Close refused:\n'+r.reason+'\n\nForce close anyway? This will be logged as an override.')){
        applyCloseCase(STATE, data.id, true);
      } else { return; }
    }
    save(); reRender();
  },
  openDecisionForm(data){
    const d = byId(STATE.decisions, data.id); if(!d) return;
    openModal('<h2>Decide: '+esc(d.title)+'</h2>'+
      (d.requiresPremortem? '<label><input type="checkbox" id="pm" '+(d.premortemDone?'checked':'')+'> Premortem done (what could make this fail?)</label><textarea id="pmrisks" placeholder="premortem risks">'+esc(d.premortemRisks||'')+'</textarea>' : '')+
      '<label>Decision</label><textarea id="decText">'+esc(d.decision||'')+'</textarea>'+
      '<div style="margin-top:12px"><button id="saveDec" class="pri">Save</button> <button data-act="closeModal">Cancel</button></div>');
    document.getElementById('saveDec').onclick = ()=>{
      if(d.requiresPremortem){
        d.premortemDone = document.getElementById('pm').checked;
        d.premortemRisks = document.getElementById('pmrisks').value;
        if(!d.premortemDone){ alert('This decision requires a premortem before it can be marked decided (severity ≥4 on the source case).'); return; }
      }
      d.decision = document.getElementById('decText').value;
      d.decidedAt = nowTs(); d.status='decided';
      emit(STATE,'decision','Decision recorded: '+d.title);
      save(); closeModal(); reRender();
    };
  },
  markDelivered(data){
    const f = byId(STATE.feedbackLog, data.id); if(f){ f.delivered=true; emit(STATE,'feedback','SBI feedback marked delivered'); }
    save(); reRender();
  },
  addDelegation(data){
    STATE.delegations.push({id:uid(), task:data.task, delegateId:data.delegateId, authorityLevel:parseInt(data.authorityLevel||3,10), checkpoints:[], status:'active', startedAt:todayStr(), dueAt:data.dueAt, lastActivityAt:todayStr()});
    emit(STATE,'delegation','Delegated: '+data.task);
    save(); reRender();
  },
  checkinDelegation(data){
    const d = byId(STATE.delegations, data.id); if(!d) return;
    const note = prompt('Check-in note:')||'';
    d.checkpoints.push({date:todayStr(), note, status:'ok'});
    save(); reRender();
  },
  completeDelegation(data){
    const d = byId(STATE.delegations, data.id); if(d){ d.status='complete'; emit(STATE,'delegation','Delegation completed: '+d.task); }
    save(); reRender();
  },
  resolveEscalation(data){
    const e = byId(STATE.escalations, data.id); if(!e) return;
    const res = prompt('Resolution note:')||'';
    e.status='resolved'; e.resolvedAt=nowTs(); e.resolution=res;
    emit(STATE,'escalation','Escalation resolved: '+e.title);
    save(); reRender();
  },
  addRisk(data){
    STATE.risks.push({id:uid(), title:data.title, likelihood:parseInt(data.likelihood,10), impact:parseInt(data.impact,10), owner:data.owner, mitigation:data.mitigation, reviewDate:data.reviewDate, status:'open', linkedCaseId:null});
    emit(STATE,'risk','Risk logged: '+data.title);
    save(); reRender();
  },
  closeRisk(data){
    const r = byId(STATE.risks, data.id); if(r){ r.status='closed'; emit(STATE,'risk','Risk closed: '+r.title); }
    save(); reRender();
  },
  addRitual(data){
    STATE.rituals.push({id:uid(), name:data.name, type:'custom', cadenceDays:parseInt(data.cadenceDays||14,10), lastDone:null, owner:data.owner});
    emit(STATE,'ritual','Ritual added: '+data.name);
    save(); reRender();
  },
  markRitualDone(data){
    const r = byId(STATE.rituals, data.id); if(r){ r.lastDone = todayStr(); emit(STATE,'ritual','Ritual completed: '+r.name); }
    save(); reRender();
  },
  addTalent(data){
    let t = STATE.talent.find(x=>x.personId===data.personId);
    if(!t){ t = {id:uid(), personId:data.personId}; STATE.talent.push(t); }
    t.performance = parseInt(data.performance,10); t.potential = parseInt(data.potential,10);
    t.bench = data.bench==='1'; t.successorFor = data.successorFor||null;
    emit(STATE,'talent','Talent grid updated');
    save(); reRender();
  },
  addMeetingAudit(data){
    STATE.meetingAudit.push({id:uid(), weekOf:data.weekOf, hoursMeetings:parseFloat(data.hoursMeetings)||0, hoursFocus:parseFloat(data.hoursFocus)||0, hoursOneOnOne:parseFloat(data.hoursOneOnOne)||0, note:data.note});
    emit(STATE,'load','Meeting load logged for week of '+data.weekOf);
    save(); reRender();
  },
  setStartDate(data){
    STATE.identity.startDate = data.startDate;
    emit(STATE,'arrival','Arrival start date set to '+data.startDate);
    save(); reRender();
  },
  setExpectations(data){
    STATE.arrival.expectationsExchangeDate = data.date;
    emit(STATE,'arrival','Expectations exchange logged');
    save(); reRender();
  },
  logListening(data){
    let t = STATE.arrival.listeningTour.find(x=>x.personId===data.id);
    if(!t){ t={id:uid(), personId:data.id}; STATE.arrival.listeningTour.push(t); }
    t.done = true; t.date = todayStr();
    const p = byId(STATE.people, data.id);
    emit(STATE,'arrival','Listening stop completed'+(p?(' with '+p.name):''));
    save(); reRender();
  },
  addEarlyWin(data){
    STATE.arrival.earlyWins.push({id:uid(), title:data.title, date:todayStr(), verifiedBy:data.verifiedBy||null});
    emit(STATE,'arrival','Early win logged: '+data.title+(data.verifiedBy?' (verified)':' (unverified)'));
    save(); reRender();
  },
  snoozeRec(data){
    STATE.snoozes[data.id] = nowTs() + 7*86400000;
    save(); reRender();
  },
  doExport(){
    STATE.meta.lastExport = nowTs();
    save();
    downloadText('leados-export-'+todayStr()+'.json', JSON.stringify(STATE,null,2));
  },
  downloadLegacy(){
    const raw = localStorage.getItem('leados.v6');
    if(raw) downloadText('leados.v6.raw.json', raw);
  },
  downloadQuarantine(data){
    const raw = localStorage.getItem(data.key);
    if(raw) downloadText(data.key+'.json', raw);
  },
  resetAll(){
    if(!confirm('This erases ALL LeadOS data in this browser. Export a backup first unless you are certain. Continue?')) return;
    localStorage.removeItem(KEY);
    location.reload();
  },
  closeModal(){ closeModal(); }
};

document.addEventListener('submit', function(e){
  const f = e.target.closest('form[data-act]');
  if(!f) return;
  e.preventDefault();
  const data = Object.fromEntries(new FormData(f).entries());
  const act = ACTIONS[f.dataset.act];
  if(!act) return;
  const inModal = !!f.closest('.modal');
  act(data, f);
  if(inModal) closeModal(); else f.reset();
});

// no parallel/duplicate write path, so it cannot drift out of sync with them.

  const r = esc(rest||'');

  if(verb==='oneonone'){
    html = '<h2>Quick 1:1</h2><form data-act="addOneOnOne">'+
      '<label>Person</label><select name="personId" required><option value="">—</option>'+personOptions()+'</select>'+

      '<label>Owner</label><select name="ownerId"><option value="">— unowned —</option>'+personOptions()+'</select>'+
      '<label>Due date</label><input type="date" name="dueDate">'+

      '<label>Title</label><input name="title" value="'+r+'" required>'+

      '<div style="margin-top:10px"><button class="pri" type="submit">Register</button> <button type="button" data-act="closeModal">Cancel</button></div></form>';

      '<div style="margin-top:10px"><button class="pri" type="submit">Register</button> <button type="button" data-act="closeModal">Cancel</button></div></form>';

      '<form data-act="addCase"><input type="hidden" name="type" value="note"><input type="hidden" name="severity" value="2">'+

  }
  openModal(html);
}

function attachImportHandler(){
  const input = document.getElementById('importFile');
  if(!input) return;
  input.onchange = function(){
    const file = input.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(){
      let parsed;
      try{ parsed = JSON.parse(reader.result); }
      catch(e){ alert('Import refused: not valid JSON ('+e.message+').'); return; }
      if(!parsed.meta || typeof parsed.meta.schemaVersion!=='number'){ alert('Import refused: missing meta.schemaVersion.'); return; }
      if(parsed.meta.schemaVersion > SCHEMA_VERSION){ alert('Import refused: file is schema v'+parsed.meta.schemaVersion+', newer than this build (v'+SCHEMA_VERSION+').'); return; }
      try{ parsed = migrate(parsed); }catch(e){ alert('Import refused: migration failed — '+e.message); return; }
      const sameBytes = JSON.stringify(parsed)===JSON.stringify(STATE);
      if(sameBytes){ alert('Import skipped: file is byte-identical to current state.'); return; }
      const mode = confirm('Click OK to MERGE this import into current data (ids re-minted, links rewired).\nClick Cancel to instead REPLACE current data entirely.');
      const preimportRaw = JSON.stringify(STATE);
      localStorage.setItem(KEY+'.preimport-'+Date.now(), preimportRaw);
      if(mode){ mergeStates(STATE, parsed); emit(STATE,'import','Imported and merged a backup file'); }
      else { STATE = parsed; emit(STATE,'import','Replaced current data with an imported backup'); }
      save(); reRender();
      alert('Import complete.'+(mode?' Merged.':' Replaced.')+' Your pre-import state was saved to a quarantine key, just in case.');
    };
    reader.readAsText(file);
  };
}
