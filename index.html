<!DOCTYPE html>
<html lang="en">
<head>

<title>LeadOS — Leadership Operating System · v19.0</title>
<style>
/* LeadOS v19.0 — instrument-panel aesthetic. System fonts, zero network. */
:root{
--bg:#0b0e13; --panel:#11151d; --panel2:#151a24; --line:#232b3a; --line2:#2c364a;
--ink:#dfe6f0; --dim:#8b96a8; --faint:#5a6579; --amber:#e8b34b; --teal:#35d0ba;
--red:#f0655a; --green:#54c77c; --blue:#5aa2f0; --violet:#a78bfa; --mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
--sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45}
a{color:var(--blue);text-decoration:none}
code,.mono{font-family:var(--mono);font-size:12px}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;background:#0d1118;border:1px solid var(--line2);color:var(--ink);border-radius:6px;padding:7px 9px;width:100%;box-sizing:border-box}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--amber)}
textarea{min-height:64px;resize:vertical}
label{display:block;color:var(--dim);font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin:10px 0 4px}
input[type=range]{padding:0}
input[type=checkbox]{width:auto}
/* boot splash — static by doctrine: the legible contract */
#boot{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 600px at 50% -10%,#131a28 0%,var(--bg) 60%)}
#boot .box{font-family:var(--mono);font-size:13px;color:var(--dim);border:1px solid var(--line);background:rgba(17,21,29,.85);border-radius:10px;padding:26px 30px;min-width:430px;max-width:92vw}
#boot h1{margin:0 0 14px;font-size:15px;color:var(--ink);letter-spacing:.14em}
#boot .ln{display:flex;justify-content:space-between;gap:26px;padding:3px 0;border-bottom:1px dashed #1c2331}
#boot .ln b{color:var(--ink);font-weight:600}
#boot .ok{color:var(--green)} #boot .bad{color:var(--red)} #boot .warn{color:var(--amber)}
/* shell */
#app{display:none;min-height:100vh}
#app.on{display:grid;grid-template-columns:212px 1fr;grid-template-rows:54px 1fr;grid-template-areas:"nav top" "nav main";height:100vh}
#nav{grid-area:nav;background:#0d1118;border-right:1px solid var(--line);overflow-y:auto;padding:10px 8px 30px}
#nav .brand{font-family:var(--mono);font-size:12px;color:var(--amber);letter-spacing:.12em;padding:8px 10px 14px;border-bottom:1px solid var(--line);margin-bottom:8px}
#nav .brand small{display:block;color:var(--faint);letter-spacing:0;margin-top:3px;font-size:10px}
#nav a{display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:7px;color:var(--dim);font-size:13px}
#nav a:hover{background:var(--panel);color:var(--ink)}
#nav a.act{background:var(--panel2);color:var(--ink);box-shadow:inset 2px 0 0 var(--amber)}
#nav a .k{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--faint)}
#nav .grp{font-size:10px;color:var(--faint);letter-spacing:.14em;text-transform:uppercase;padding:12px 10px 4px}
#nav svg{width:15px;height:15px;flex:none}
#top{grid-area:top;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line);background:#0d1118}
#top .cap{flex:1;display:flex;align-items:center;gap:8px;background:#0a0d12;border:1px solid var(--line2);border-radius:8px;padding:6px 10px}
#top .cap input{border:none;background:transparent;padding:0}
#top .cap input:focus{outline:none}
#save-dot{font-family:var(--mono);font-size:11px;color:var(--dim);white-space:nowrap}
#save-dot.bad{color:var(--red);font-weight:700}
#main{grid-area:main;overflow-y:auto;padding:20px 24px 80px}
.view{max-width:1180px;margin:0 auto}
/* components */
.h{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0 0 2px}
.sub{color:var(--dim);font-size:12.5px;margin:0 0 16px}
.grid{display:grid;gap:12px}
.c2{grid-template-columns:1fr 1fr}.c3{grid-template-columns:repeat(3,1fr)}.c4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1100px){.c4,.c3{grid-template-columns:1fr 1fr}.c2{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.card.tight{padding:10px 12px}
.card h3{margin:0 0 8px;font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.09em;font-weight:600}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.mut{color:var(--dim)} .fnt{color:var(--faint)} .small{font-size:12px} .tiny{font-size:11px}
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;padding:2px 7px;border-radius:20px;border:1px solid var(--line2);color:var(--dim);white-space:nowrap}
.chip.red{color:#ffb0a9;border-color:#5a2b28;background:#2b1513}
.chip.amber{color:#f5d9a0;border-color:#5a4a28;background:#2b2113}
.chip.teal{color:#a9ece1;border-color:#1f4a44;background:#122b28}
.chip.green{color:#b9e8c9;border-color:#274a33;background:#142b1c}
.chip.blue{color:#bcd8f8;border-color:#2a3f5a;background:#131f2e}
.chip.violet{color:#d6c8fb;border-color:#40335e;background:#1d1730}
.chip.locked{color:#ffb0a9;border-color:var(--red)}
.chip.est{border-style:dashed}
.bar{height:6px;background:#1a2130;border-radius:4px;overflow:hidden;min-width:40px}
.bar i{display:block;height:100%;border-radius:4px;background:var(--teal)}
.btn{background:var(--panel2);border:1px solid var(--line2);color:var(--ink);border-radius:7px;padding:6px 12px;font-size:12.5px}
.btn:hover{border-color:var(--amber)}
.btn.pri{background:var(--amber);border-color:var(--amber);color:#1a1408;font-weight:600}
.btn.danger{border-color:#5a2b28;color:#ffb0a9}
.btn.ghost{background:transparent}
.btn.sm{padding:3px 9px;font-size:11.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
table.tb{width:100%;border-collapse:collapse;font-size:12.5px}
table.tb th{text-align:left;color:var(--faint);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;padding:6px 8px;border-bottom:1px solid var(--line)}
table.tb td{padding:7px 8px;border-bottom:1px solid #1a2130;vertical-align:top}
.num{font-family:var(--mono);font-size:12px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:3px 10px;font-size:12.5px}
.kv b{color:var(--dim);font-weight:500}
.avt{width:26px;height:26px;border-radius:50%;background:#1d2534;border:1px solid var(--line2);display:inline-flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10px;color:var(--dim);flex:none}
.sev{font-family:var(--mono);font-weight:700;font-size:11px;padding:1px 6px;border-radius:5px}
.sev.s5{background:#3d1714;color:#ff9d94}.sev.s4{background:#3d2a14;color:#f5c98a}.sev.s3{background:#33310f;color:#e8e08a}.sev.s2{background:#152b33;color:#8adbe8}.sev.s1{background:#1a2130;color:var(--dim)}
.doc-strip{border-left:3px solid var(--amber);background:#1a1607;padding:8px 12px;font-size:12px;color:#e8d6a8;border-radius:0 8px 8px 0;margin:0 0 14px}
.warn-strip{border-left:3px solid var(--red);background:#240f0e;padding:8px 12px;font-size:12px;color:#f0b4ae;border-radius:0 8px 8px 0;margin:0 0 14px}
.teal-strip{border-left:3px solid var(--teal);background:#0d1f1d;padding:8px 12px;font-size:12px;color:#a9ece1;border-radius:0 8px 8px 0;margin:0 0 14px}
.ledger{font-family:var(--mono);font-size:11px;color:var(--dim)}
.ledger .w{color:var(--teal)}
.rule-row{display:grid;grid-template-columns:16px 1fr auto;gap:10px;align-items:start;padding:9px 4px;border-bottom:1px solid #1a2130}
.dot{width:8px;height:8px;border-radius:50%;margin-top:6px}
.dot.red{background:var(--red);box-shadow:0 0 8px var(--red)} .dot.amber{background:var(--amber)} .dot.green{background:var(--green)} .dot.sleep{background:#2c364a}
.nbm{border:1px solid var(--line2);border-radius:10px;padding:12px 14px;background:linear-gradient(180deg,#151a24,#11151d)}
#modal-root{position:fixed;inset:0;display:none;align-items:flex-start;justify-content:center;background:rgba(5,7,10,.72);z-index:60;overflow-y:auto;padding:6vh 16px}
#modal-root.on{display:flex}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:12px;max-width:680px;width:100%;padding:18px 20px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.modal.wide{max-width:860px}
.modal h2{margin:0 0 4px;font-size:16px}
#toasts{position:fixed;right:16px;bottom:16px;z-index:80;display:flex;flex-direction:column;gap:8px;max-width:380px}
.toast{background:var(--panel2);border:1px solid var(--line2);border-left:3px solid var(--teal);border-radius:8px;padding:9px 12px;font-size:12.5px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.bad{border-left-color:var(--red)}
.toast.warn{border-left-color:var(--amber)}
.slider-val{font-family:var(--mono);font-size:12px;color:var(--amber);min-width:34px;text-align:right}
.quad{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.quad>div{background:var(--panel);padding:14px;min-height:110px}
.quad h4{margin:0 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim)}
.nine{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.nine button{background:var(--panel);border:none;color:var(--dim);padding:10px 4px;font-size:10.5px;font-family:var(--mono)}
.nine button.sel{background:#2b2113;color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
.heat{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.heat div{background:var(--panel);text-align:center;padding:6px 2px;font-family:var(--mono);font-size:10px}
.empty{border:1px dashed var(--line2);border-radius:10px;padding:22px;text-align:center;color:var(--faint);font-size:12.5px}
.banner-rec{background:#240f0e;border:1px solid #5a2b28;border-radius:10px;padding:12px 16px;margin-bottom:14px}
.timeline{position:relative;padding-left:18px;border-left:1px solid var(--line2);margin-left:6px}
.timeline .ev{position:relative;padding:0 0 14px}
.timeline .ev:before{content:"";position:absolute;left:-23px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--panel2);border:2px solid var(--line2)}
.timeline .ev.hot:before{border-color:var(--amber)}
.netmap{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
@media print{
 #nav,#top,#toasts,#modal-root,.noprint{display:none!important}
 #app.on{display:block;height:auto}
 #main{overflow:visible;padding:0}
 body{background:#fff;color:#111}
 .card,.nbm{border-color:#ccc;background:#fff;color:#111;break-inside:avoid}
 .h,.sub,td,th,.small,.tiny,.mut{color:#111!important}
 .chip{border-color:#999;color:#333}
}
</style>

let S=null, RECOVERY=null, WRITE_FAIL=null, LAST_SAVE=null, LAST_BYTES=0;
/* 25 domain collections + meta = 26 keys. The record version carries truth; key never renames. */
const SHAPE={
 meta:()=>({identity:{name:'',role:'Leader of leads',started:today()},exportedAt:null,seeded:null,snooze:{},trail:[],agendaPins:[],sys:[],week:snapSeed()}),
 people:()=>[], teams:()=>[], cases:()=>[], evidence:()=>[], tasks:()=>[],
 commitments:()=>[], feedback:()=>[], goals:()=>[], decisions:()=>[],
 handoffs:()=>[], risks:()=>[], pulses:()=>[], oneones:()=>[], seats:()=>[],
 promos:()=>[], plans:()=>[], delegs:()=>[], meds:()=>[], rituals:()=>[],
 snaps:()=>[], stakes:()=>[], lessons:()=>[], wins:()=>[], skips:()=>[],
 syslog:()=>[]
};
function snapSeed(){return{cursor:null}}
function fresh(){const o={v:REC};for(const k in SHAPE)o[k]=SHAPE[k]();return o}
/* guard: rebuild shape without destroying unknown keys (WIP keys ride along). */
function guard(o){
 const f=fresh(); const out=(o&&typeof o==='object')?{...o}:{};
 for(const k in SHAPE){
  const want=f[k];
  if(out[k]==null || (Array.isArray(want)&&!Array.isArray(out[k])) || (!Array.isArray(want)&&typeof out[k]!==typeof want)) out[k]=want;
 }
 out.meta={...f.meta,...(out.meta||{})};
 out.meta.snooze=(out.meta.snooze&&typeof out.meta.snooze==='object')?out.meta.snooze:{};
 out.meta.trail=Array.isArray(out.meta.trail)?out.meta.trail:[];
 out.meta.agendaPins=Array.isArray(out.meta.agendaPins)?out.meta.agendaPins:[];
 out.meta.sys=Array.isArray(out.meta.sys)?out.meta.sys:[];
 out.meta.identity={...f.meta.identity,...(out.meta.identity||{})};
 return out;
}
/* Migrations: additive ensure-steps v_n → v_n+1. They never rewrite existing
   records; unknown keys survive the guard-spread (t01 executes). v>REC is
   held for a human decision, never migrated down (t11/t12 execute). */
const MIG={};
for(let v=2;v<=REC;v++) MIG[v]=s=>{ s=guard(s); s.v=v;
 s.meta.trail.push({to:v,at:today(),note:'additive ensure-step — no record rewritten, unknown keys preserved'});
 logSys(`migration v${v-1}→v${v} (additive)`,s); return s; };
function logSys(msg,s){ (s||S).meta.sys.push({at:new Date().toISOString(),msg});
 if((s||S).meta.sys.length>200)(s||S).meta.sys=(s||S).meta.sys.slice(-200); }
function load(){
 let raw=null,storageDead=false;
 try{ raw=localStorage.getItem(KEY); }catch(e){ storageDead=true; }
 if(storageDead){ S=fresh(); RECOVERY={kind:'storage-dead',detail:'localStorage is not readable (private mode?). In-memory only; nothing will persist.'}; return; }
 if(raw==null){ S=seed(); try{localStorage.setItem(KEY,JSON.stringify(S));LAST_SAVE=new Date();LAST_BYTES=JSON.stringify(S).length;}catch(e){WRITE_FAIL={bytes:JSON.stringify(S).length,err:String(e)}} logSys('first boot — example org seeded'); return; }
 let rec=null;
 try{ rec=JSON.parse(raw); }catch(e){
  quarantine('corrupt',raw);
  S=fresh(); RECOVERY={kind:'corrupt',detail:'Stored bytes were not valid JSON. Original bytes copied to a side key, main key untouched, blank state NOT saved until you decide in #/data.'}; logSys('corrupt bytes quarantined — RECOVERY');
  return;
 }
 if(!rec||typeof rec!=='object'||typeof rec.v!=='number'||rec.v<1){
  quarantine('corrupt',raw);
  S=fresh(); RECOVERY={kind:'corrupt',detail:'Stored record has no readable version. Original bytes copied to a side key; nothing overwritten.'}; logSys('shapeless record quarantined — RECOVERY');
  return;
 }
 if(rec.v>REC){
  quarantine('superseded',raw);
  S=fresh(); RECOVERY={kind:'superseded',detail:`Record is v:${rec.v}, newer than this build (v:${REC}). Copied to a side key; main key untouched; in-memory blank not saved. Decide in #/data.`}; logSys(`superseded record v:${rec.v} preserved — RECOVERY`);
  return;
 }
 S=guard(rec);
 while(S.v<REC){ S=MIG[S.v+1](S); }
}
function quarantine(kind,raw){
 try{ localStorage.setItem(`${KEY}.${kind}-${Date.now()}`,raw); }catch(e){ console.error('quarantine failed',e); }
}
function save(){
 if(RECOVERY){ return false; } // RECOVERY gates save (t19 executes the refusal)
 const raw=JSON.stringify(S);
 try{
  localStorage.setItem(KEY,raw);
  LAST_SAVE=new Date(); LAST_BYTES=raw.length; WRITE_FAIL=null; return true;
 }catch(e){
  WRITE_FAIL={bytes:raw.length,err:String(e&&e.name||e)}; return false;
 }
}

function runRules(){
 const wake=today(); const out=[];
 for(const r of RULES){
  const hits=safe(r.test)||[]; const firing=hits.length>0;
  let sleepUntil=null;
  if(firing&&!r.lock&&S.meta.snooze[r.id]){
   if(wake>=S.meta.snooze[r.id]){ delete S.meta.snooze[r.id]; } else sleepUntil=S.meta.snooze[r.id];
  }
  out.push({id:r.id,why:r.why,clear:r.clear,lock:r.lock,pos:r.pos,sev:r.sev,cls:r.cls,hits,firing,sleepUntil});
 }
 LAST_RULES=out; return out;
}
/* ---------- skip-level instruments (v19) ---------- */
function skipCoverage(leadId,win){
 win=win||45; const members=reportsOf(leadId); const n=members.length;
 if(!n)return{n:0,met:0,pct:0,never:0};
 let met=0,never=0;
 for(const m of members){const l=lastSkip(m.id); if(!l){never++;continue} if(days(l.at)<=win)met++;}
 return{n,met,pct:met/n,never};
}
function skipThemes(teamId,within){
 within=within||60; const t=team(teamId); if(!t||!t.leadId)return[];
 const members=reportsOf(t.leadId);
 const acc={};
 for(const m of members){
  for(const k of S.skips.filter(s=>s.personId===m.id&&days(s.at)<=within)){
   for(const th of k.themes||[]){
    const sev=(THEME_SEV[th]||2)+((k.energy!=null&&k.energy<=2)?1:0);
    if(!acc[th])acc[th]={theme:th,people:new Set(),sev:0,last:'0000'};
    acc[th].people.add(m.id); acc[th].sev+=sev; if(k.at>acc[th].last)acc[th].last=k.at;
   }
  }
 }
 return Object.values(acc).map(t=>({theme:t.theme,n:t.people.size,sev:t.sev,last:t.last})).sort((a,b)=>b.n-a.n||b.sev-a.sev);
}
function themeEchoes(){
 const out=[];
 for(const t of S.teams){ for(const th of skipThemes(t.id,60)){ if(th.n>=3)out.push({teamId:t.id,theme:th.theme,n:th.n,sev:th.sev,last:th.last}); } }
 return out;
}
function skipThemeHeat(teamId){
 const members=reportsOf(team(teamId)?team(teamId).leadId:null);
 const sessions=S.skips.filter(k=>members.some(m=>m.id===k.personId)&&days(k.at)<=60);
 const sevΣ=sum(sessions.map(k=>sum((k.themes||[]).map(th=>(THEME_SEV[th]||2)+((k.energy!=null&&k.energy<=2)?1:0)))));
 return{heat:sessions.length?sevΣ/sessions.length:0,n:sessions.length,sessions};
}

function parseDatePhrase(x){

 if(x==='today')return today();
 if(x==='tomorrow')return addD(today(),1);

 const m=x.match(/^\+(\d+)d?$/); if(m)return addD(today(),+m[1]);

 return null;
}
function parseNameDate(rest){

 const nm=rest.match(/@([\w-]+)/);
 if(nm){
  const first=firstName(nm[1]);
  const pool=S.people.concat(S.stakes.map(s=>({...s,_stake:true})));
  const hits=pool.filter(p=>firstName(p.name)===first);
  if(hits.length){out.who=hits[0];out.collision=hits.length>1;}
  out.text=rest.replace(nm[0],'').trim();
 }
 const bm=out.text.match(/\bby\s+(.+)$/i);
 if(bm){
  const d=parseDatePhrase(bm[1]);
  if(!d){out.err=`could not parse date "${bm[1]}" — nothing written (dates: today · tomorrow · +Nd · next week · YYYY-MM-DD)`;return out;}
  out.due=d; out.text=out.text.replace(bm[0],'').trim();
 }
 return out;
}

function runTestsIsolated(){
 const snap=JSON.stringify({S,RECOVERY,LAST_RULES,LAST_AUDIT});
 const rs=[];
 for(const t of TESTS){
  const fails=[];
  const A=(c,m)=>{if(!c)fails.push(m||'assertion failed')};
  S._testing=true;
  try{t.fn(A)}catch(e){fails.push('threw: '+(e&&e.message||e))}
  const b=JSON.parse(snap);S=b.S;RECOVERY=b.RECOVERY;LAST_RULES=b.LAST_RULES;LAST_AUDIT=b.LAST_AUDIT;
  rs.push({id:t.id,name:t.name,ok:fails.length===0,fails});
 }
 S._testing=false;
 return rs;
}

VIEWS.signal=()=>{
 const rs=LAST_RULES;
 const locked=rs.filter(r=>r.lock&&r.firing);
 const firing=rs.filter(r=>!r.lock&&!r.pos&&r.firing&&!r.sleepUntil);
 const sleeping=rs.filter(r=>r.sleepUntil);
 const pos=rs.filter(r=>r.pos);
 const quiet=rs.filter(r=>!r.firing&&!r.pos);
 const rowR=r=>`<div class="rule-row">
  <span class="dot ${r.lock?'red':r.sleepUntil?'sleep':r.pos?'green':r.sev>=4?'red':r.sev>=2?'amber':'sleep'}"></span>
  <div><b class="small mono">${r.id}</b> ${r.lock?chip('locked — unsnoozable','locked'):''}
   <div class="tiny mut">why it exists: ${esc(r.why)}</div>
   ${r.firing&&r.hits.length?`<div class="tiny" style="color:#f5c98a">▸ ${r.hits.slice(0,3).map(h=>esc(String(h))).join(' · ')}${r.hits.length>3?` (+${r.hits.length-3} more)`:''}</div>`:''}
   <div class="tiny fnt">clears when: ${esc(r.clear)}</div></div>
  <div>${r.lock?'':r.firing&&!r.sleepUntil?`<button class="btn sm ghost" data-a="rule-snooze" data-id="${r.id}">snooze 7d</button>`:r.sleepUntil?chip('sleeping until '+r.sleepUntil,'blue'):''}</div>
 </div>`;
 return`<h1 class="h">Signal</h1><p class="sub">the full rule ledger — every advisory states why it exists and when it clears; quiet rows are earned by executable conditions</p>
 ${locked.length?`<div class="grp" style="color:var(--red)">LOCKED — cannot be snoozed</div>${locked.map(rowR).join('')}`:''}
 <div class="grp">ADVISORIES FIRING (${firing.length})</div>${firing.length?firing.map(rowR).join(''):'<div class="fnt small">none — the quiet is earned</div>'}
 ${sleeping.length?`<div class="grp">SLEEPING ON DATED SNOOZES (${sleeping.length})</div>${sleeping.map(rowR).join('')}<p class="tiny fnt">dated snoozes wake themselves on expiry day; only firing, non-locked rules can be snoozed — a smuggled snooze is an audit fault (snooze-legal)</p>`:''}
 <div class="grp">POSITIVE LANE</div>${pos.map(rowR).join('')}
 <div class="grp">QUIET — EXECUTABLE CONDITIONS CURRENTLY MET (${quiet.length})</div>${quiet.map(rowR).join('')}`;
};

 const praise=S.feedback.filter(f=>f.kind==='praise'&&f.state==='delivered').length;
 const corr=S.feedback.filter(f=>f.kind==='correction'&&f.state==='delivered').length;
 const n=praise+corr;

 <div class="grid c2">

   ${bar(n?praise/n:0.5,'var(--green)')}
   <div class="tiny fnt" style="margin-top:6px">ratios under n=6 are noise wearing a suit — the machine says so</div>`)}
 </div>
 ${drafts.length?card('Drafts — ageing clocks running',drafts.map(f=>{const age=days(f.at);const limit=f.kind==='praise'?2:3;
  return`<div class="row between small" style="padding:5px 0;border-bottom:1px dashed #1c2331">
  <span>${chip(f.kind,f.kind==='praise'?'green':'amber')} → ${relLink(f.toId)} — ${esc(f.b||'(unfinished)')} ${f.srcCase?`<a href="#/case/${f.srcCase}">${chip('from case','blue')}</a>`:''}</span>
  <span class="row">${chip(age+'d of '+(f.kind==='praise'?'48h':'72h'),age>=limit?'red':'amber')}
  <button class="btn sm" data-a="fb-deliver" data-id="${f.id}">deliver</button></span></div>`}).join('')):''}
 ${deliv.length?card('Delivered — verification arms at +21d for corrections',deliv.slice(0,10).map(f=>`<div class="row between small" style="padding:5px 0;border-bottom:1px dashed #1c2331">
  <span>${chip(f.kind,f.kind==='praise'?'green':'amber')} → ${relLink(f.toId)} <span class="fnt tiny">delivered ${f.delivered}</span></span>
  <span>${f.kind==='correction'?(f.verifyNote?chip('verified: '+f.verifyNote.slice(0,20),'green'):f.verifyAt?(f.verifyAt<today()&&f.lapsedCaseId?chip('lapsed → case opened','red'):chip('verify '+f.verifyAt,'blue')):''):''}
  ${f.kind==='correction'&&!f.verifyNote&&f.verifyAt?`<button class="btn sm ghost" data-a="fb-verify" data-id="${f.id}">mark verified</button>`:''}</span></div>`).join('')):''}`;
};
VIEWS.goals=()=>{
 return`<h1 class="h">Goals</h1><p class="sub">direction-aware KR scoring (down-metrics counted correctly) · confidence is the leading indicator · expired goals grade only with a causal lesson</p>
 <div class="row" style="justify-content:flex-end;margin-bottom:8px"><button class="btn" data-a="goal-add-show">${ic('plus',13)} goal</button></div><div id="goal-add-slot"></div>
 ${S.goals.length?S.goals.map(g=>{
  const pct=goalPct(g),arc=goalArc(g);const last=g.checkins[g.checkins.length-1];
  return`<div class="card" style="margin-bottom:10px"><div class="row between"><b><a href="#/person/${g.ownerId}">${esc(partyName(g.ownerId))}</a> — ${esc(g.title)}</b>
  <span class="row">${g.atRisk?`<a href="#/case/${g.atRisk}">${chip('AT RISK by case','red')}</a>`:''}${chip(g.state==='active'?(g.due<today()?'EXPIRED '+g.due:'due '+g.due):g.state,g.due<today()&&g.state==='active'?'red':'teal')}

  <table class="tb" style="margin:8px 0"><tr><th>KR</th><th>dir</th><th>start</th><th>now</th><th>target</th><th>progress</th></tr>
   ${g.krs.map(k=>`<tr><td>${esc(k.title)}</td><td>${chip(k.dir==='down'?'down-metric':'up','blue')}</td><td class="num">${k.start}</td><td class="num">${k.cur}</td><td class="num">${k.target}</td>
   <td style="min-width:120px">${bar(clamp(krPct(k),0,1))}<span class="tiny num">${Math.round(krPct(k)*100)}%</span></td></tr>`).join('')}</table>
  <div class="row between small"><span class="mut">trajectory vs waterfall: ${Math.round(pct*100)}% actual vs ${Math.round(arc.pct*100)}% expected <span class="fnt">(${arc.note})</span></span>

  <div class="row" style="margin-top:8px;gap:8px;justify-content:flex-end">

  </div></div>`}).join(''):empty('no goals — direction is the first artifact of leadership')}`;
};
VIEWS.decisions=()=>{

 ${done.length?`<h3 class="grp">Decided — grading & calibration</h3>${done.map(d=>`<div class="row between small" style="padding:6px 0;border-bottom:1px dashed #1c2331">
  <span>${chip('type-'+d.type,d.type===1?'red':'teal')} ${esc(d.title)} — <b>${esc(d.choice)}</b> <span class="fnt tiny">«${esc(d.rationale||'')}» decided ${d.decided}</span></span>

 ${card('Calibration — sample-size honesty',`<div class="row" style="gap:14px"><span style="font-size:24px" class="num">${cal.pct}%</span><span class="mut small">decisions graded good · n=${cal.n}${cal.honest?' — under n=5 this number is trivia, not signal, and the machine says so':' — enough to start reading'}</span></div>`)}`;
};

VIEWS.talent=()=>{
 const computedTop=seat=>{
  let best=null,bs=-1;
  for(const p of S.people){if(seat.holderId===p.id)continue;const r=readiness(p,seat);if(r.score>bs){bs=r.score;best=p;}}
  return best?{p:best,score:bs}:null;
 };
 return`<div class="row between"><h1 class="h">Succession</h1><button class="btn" data-a="seat-add-show">${ic('plus',13)} seat</button></div>
 <p class="sub">readiness prints its basis per row · assigned-vs-computed disagreement renders as <i>your call, on the record</i> — never smoothed</p>
 <div id="seat-add-slot"></div>
 ${S.seats.length?S.seats.map(s=>{
  const ct=computedTop(s); const first=s.slate.find(x=>x.pid);
  return`<div class="card" style="margin-bottom:10px"><div class="row between"><b>${esc(s.title)}</b>
  <span class="row">${chip('criticality: '+s.crit,s.crit==='high'?'red':'amber')}${chip('holder: '+partyName(s.holderId),'blue')}${/none/i.test(s.cover||'')||!s.cover?chip('NO emergency cover','red'):chip('cover: '+s.cover,'green')}</span></div>
  <form data-f="f-cover" class="row" style="margin:6px 0"><input type="hidden" name="id" value="${s.id}"><input name="cover" value="${esc(s.cover||'')}" placeholder="emergency cover — named human + ramp time"><button class="btn sm">set cover</button></form>
  <table class="tb"><tr><th>slate (assigned)</th><th>ready</th><th>computed readiness — basis printed</th></tr>
  ${s.slate.map((x,i)=>{const p=x.pid?person(x.pid):null;const r=p?readiness(p,s):null;
   return`<tr><td>${p?relLink(p.id):`<span class="fnt">${esc(x.ready)}</span>`} ${i===0&&p?chip('assigned #1','violet'):''}</td><td>${p?esc(x.ready):''}</td>
   <td>${r?`<span class="num">${r.score}</span> <span class="tiny fnt">${r.parts.map(pt=>`${pt[0]} ${pt[1]>0?'+':''}${pt[1]} (${pt[2]})`).join(' · ')}</span>`:'<span class="fnt tiny">external — no instrument basis</span>'}</td></tr>`}).join('')}</table>
  ${ct&&(!first||first.pid!==ct.p.id)?tealStrip(`<b>Your call, on the record:</b> the slate leads with ${first?partyName(first.pid):'no internal candidate'}, the instrument computes <b>${esc(ct.p.name)}</b> (${ct.score}) as strongest. The machine does not override you — it just refuses to hide the disagreement.`):''}
  <form data-f="f-slate-add" class="row" style="margin-top:6px"><input type="hidden" name="id" value="${s.id}"><select name="pid"><option value="">— external —</option>${personOpts()}</select><select name="ready"><option>now</option><option>1–2y</option><option>2–4y</option></select><button class="btn sm">add to slate</button></form>
  </div>`}).join(''):empty('no seats mapped — if you got hit by a bus Friday, who opens the laptop Monday?')}`;
};

VIEWS.health=()=>{

 return`<h1 class="h">Team health</h1><p class="sub">five dims per team · estimates marked ≈ dashed, never moving slopes · feeding signals printed · the weakest dim gets ONE concrete intervention, not five vague ones</p>
 <div class="grid c2">${S.teams.map(t=>{
  const p=lastPulse(t.id);const h=teamHeat(t);
  const weakest=p?Object.entries(p.dims).sort((a,b)=>a[1]-b[1])[0]:null;

  return`<div class="card"><div class="row between"><b>${esc(t.name)}</b><span class="row">${p?chip((p.estimated?'≈ ':'')+p.at,p.estimated?'amber':'teal',p.estimated):chip('no pulse','red')}${chip('heat '+h.heat,h.heat>=15?'red':h.heat>=8?'amber':'teal')}</span></div>
  ${p?Object.entries(p.dims).map(([d,v])=>{const sl=slopeOf(hist(d));return`<div class="row" style="gap:8px;margin:5px 0"><span class="tiny mut" style="width:90px">${d}</span>${bar(v/5,v<=2?'var(--red)':v<=3?'var(--amber)':'var(--green)')}<span class="num tiny">${v}${sl!==0?` <span class="${sl<0?'fnt':''}" style="color:${sl<0?'var(--red)':'var(--green)'}">${sl>0?'▲':'▼'}</span>`:''}</span></div>`}).join(''):'<div class="fnt small">no pulse on record — instruments read stale air</div>'}
  <div class="tiny fnt" style="margin:6px 0">feeding signals: ${h.terms.join(' · ')}</div>
  ${weakest?tealStrip(`weakest dim <b>${weakest[0]} (${weakest[1]}/5)</b> — ONE intervention: ${INTERV[weakest[0]]}`):''}

  </div>`}).join('')}</div>`;
};

function mountAbout(){
 const counts=[];
 counts.push(kv('rules',`${RULES.length} (${RULES.filter(r=>r.lock).length} locked · ${RULES.filter(r=>!r.lock&&!r.pos).length} advisory · ${RULES.filter(r=>r.pos).length} positive)`));
 counts.push(kv('audit classes',`${AUDS.length} (${AUDS.filter(a=>a.safe).length} safe-repair · ${AUDS.filter(a=>!a.safe).length} flag-for-judgment)`));
 counts.push(kv('self-tests',String(TESTS.length)));
 counts.push(kv('routes',`${ROUTES.length} nav + 2 detail (case · person)`));
 counts.push(kv('collections',`${Object.keys(SHAPE).length} keys (incl. meta) — computed via Object.keys(SHAPE)`));
 counts.push(kv('case types · playbook entries',`${CASE_TYPES.length} · ${PB_TOTAL}`));
 counts.push(kv('navigation verbs','dispatch surface below'));
 const fOrph=[]; const srcs=[];
 for(const k in VIEWS)srcs.push(String(VIEWS[k]));
 for(const b of MODAL_BUILDERS)srcs.push(String(b));
 for(const k in ACT)srcs.push(String(ACT[k]));
 const src=srcs.join('\n');
 for(const m of src.matchAll(/data-a="([\w-]+)"/g))if(!ACT[m[1]])fOrph.push('act:'+m[1]);
 for(const m of src.matchAll(/data-f="(f-[\w-]+)"/g))if(!FORMS[m[1]])fOrph.push('form:'+m[1]);
 counts.push(kv('dispatch surface',`${Object.keys(ACT).length} actions + ${Object.keys(FORMS).length} forms = ${Object.keys(ACT).length+Object.keys(FORMS).length}`));
 counts.push(kv('runtime orphan cross-read',fOrph.length?`<span style="color:var(--red)">${fOrph.join(', ')}</span>`:`<span style="color:var(--green)">zero orphans — every data-a/data-f in markup resolves (views + modals + action-built DOM scanned)</span>`));
 counts.push(kv('stub-shaped code','0 markers of the usual kind — «stub» appears only as the documented domain term «decision stub»'));
 q('#live-counts').innerHTML=counts.join('');
 const rs=runTestsIsolated(); WALL_RESULTS=rs;
 const bad=rs.filter(r=>!r.ok);
 q('#wall-results').innerHTML=`<div class="row" style="gap:8px;margin-bottom:8px">${chip(rs.length-bad.length+'/'+rs.length+' pass',bad.length?'red':'green')}</div>`
 +rs.map(r=>`<div class="row" style="gap:8px;padding:3px 0;border-bottom:1px dashed #1c2331"><span style="color:${r.ok?'var(--green)':'var(--red)'}">${ic(r.ok?'check':'x',12)}</span><div><b class="tiny mono">${r.id}</b> <span class="tiny mut">${esc(r.name)}</span>${r.ok?'':`<div class="tiny" style="color:#ffb0a9">${r.fails.map(esc).join(' · ')}</div>`}</div></div>`).join('');
}

FORMS['f-stake-expect']=(fd)=>{ const s=stake(fd.get('id')); if(s){s.expect=String(fd.get('expect')||'');BUS.emit('stake.expect');toast('their expectation captured in their words — the brief reads this first');} };
FORMS['f-skip']=(fd,f)=>{ const pid=fd.get('pid')||fd.get('personId'); const p=person(pid); if(!p){toast('session needs a person two levels down','bad');return;}
 const note=String(fd.get('note')||'');
 const trips=tripScan(note);
 if(trips.length&&!fd.get('ack')){
  q('#skip-trip').innerHTML=warnStrip(`<b>Hard stop on this note:</b> trip-words named: <b>${trips.join(', ')}</b>. The note stays your verbatim record, but saving requires acknowledgment — and the substance belongs on the sealed track via a case.`)
  +`<label class="row small" style="margin-top:6px"><input type="checkbox" name="ack" style="width:auto"> I acknowledge — record the note verbatim; I will route the substance (${trips.join(', ')}) to a sealed case</label>
  <button type="button" class="btn sm danger" style="margin-top:6px" data-a="skip-to-case">route the substance to a sealed case intake</button>`;
  toast('trip-words named — save held for acknowledgment; nothing written yet','bad'); return; }
 const k={id:uid('sk'),personId:pid,at:fd.get('at')||today(),energy:f._energyTouched?+fd.get('energy'):null,estimated:!f._energyTouched,themes:fd.getAll('themes'),note,follow:{}};
 S.skips.push(k);
 const fu=String(fd.get('follow')||'').trim(); if(fu){ const r=skipFollow(k.id,fu,String(fd.get('followDue')||'+3')); if(r.err)toast(r.err,'bad'); }
 closeModal(); BUS.emit('skip.log');
 toast(`session logged for ${p.name}${k.estimated?' — energy untouched, marked ≈ estimated':''}${(k.themes||[]).length?` · themes: ${k.themes.join(', ')}`:''}`); };
FORMS['f-identity']=(fd)=>{ S.meta.identity={name:String(fd.get('name')||'').trim(),role:String(fd.get('role')||'').trim(),started:fd.get('started')||today()};
 logSys('identity updated');BUS.emit('identity');toast('identity saved — the 90-day clock reads this'); };
FORMS['f-import']=(fd)=>{ const mode=fd.get('mode')==='merge'?'merge':'replace';
 const file=fd.get('file'); const raw=String(fd.get('json')||'').trim();
 const apply=text=>{ let obj=null; try{obj=JSON.parse(text)}catch(e){toast('not valid JSON — nothing touched','bad');return;}
  const r=importApply(obj,mode);
  if(r.err)toast('<b>Import refused, state untouched.</b> '+esc(r.err),'bad');
  else toast(mode==='merge'?'merged — every id re-minted, graph rewired, audits re-run':'state replaced — migration trail recorded'); };
 if(file&&file.size){ const rd=new FileReader(); rd.onload=()=>apply(String(rd.result)); rd.readAsText(file); return; }
 if(raw){apply(raw);return;}
 toast('nothing to import — paste JSON or choose a file','bad'); };
FORMS['f-prune']=(fd)=>{ if(String(fd.get('arm')||'').trim()!=='PRUNE'){toast('type PRUNE to arm — the word is the second confirmation','bad');return;}
 const bEv=S.evidence.length,bT=S.tasks.length,bS=S.snaps.length;
 S.evidence=S.evidence.filter(e=>days(e.at)<=180);
 S.tasks=S.tasks.filter(t=>!(t.status!=='open'&&t.due&&days(t.due)>90));
 S.snaps=S.snaps.slice(-12);
 const n=(bEv-S.evidence.length)+(bT-S.tasks.length)+(bS-S.snaps.length);
 logSys(`pruned ${n} records (evidence>${180}d: ${bEv-S.evidence.length}, closed tasks>90d: ${bT-S.tasks.length}, snapshots: ${bS-S.snaps.length})`);
 closeModal();runAudit();save();toast(`pruned ${n} records — counts on the log, nothing else touched`);render(); };
/* ---------- live lint helper ---------- */
function liveLint(f){ const fd=new FormData(f); const li=feedbackLint(fd.get('s'),fd.get('b'),fd.get('i'));
 const slot=q('#fb-lint'); if(slot)slot.innerHTML=`${chip('lint '+li.score+'/3',li.pass?'green':'red')} <span class="tiny mut">${li.notes.map(esc).join(' · ')||'specific, observable, consequential — good'}</span>`; }
/* ---------- global wiring ---------- */
document.addEventListener('click',e=>{ const a=e.target.closest('[data-a]'); if(!a)return;
 const fn=ACT[a.dataset.a]; if(fn){e.preventDefault();safe(()=>fn(a,e));} });
document.addEventListener('submit',e=>{ const f=e.target.closest('[data-f]'); if(!f)return;
 e.preventDefault(); const fn=FORMS[f.dataset.f]; if(fn)safe(()=>fn(new FormData(f),f)); });
document.addEventListener('input',e=>{ const el=e.target;
 if(el.matches('input[type="range"][data-out]')){ const o=q('#'+el.dataset.out); if(o)o.textContent=el.value;
  const f=el.closest('form'); if(f){f._touched=true; if(el.dataset.out==='sk-e')f._energyTouched=true;} }
 if(el.closest('form[data-f="f-fb-draft"]'))liveLint(el.closest('form'));
 if(el.id==='lesson-q'){ const qy=el.value.trim().toLowerCase();
  qa('.lesson-row').forEach(r=>{ r.style.display=!qy||r.textContent.toLowerCase().includes(qy)?'':'none'; }); }
});
document.addEventListener('keydown',e=>{
 const inField=/INPUT|TEXTAREA|SELECT/.test(document.activeElement&&document.activeElement.tagName||'');
 if(e.key==='Escape'){closeModal();return;}
 if((e.key==='k'&&(e.ctrlKey||e.metaKey))){e.preventDefault();paletteModal();return;}
 if(inField)return;
 if(e.key==='/'){e.preventDefault();const ci=q('#cap-input');if(ci)ci.focus();return;}
 if(e.key==='c'||e.key==='C'){openCaseIntake({});return;}
 if(/^[0-9]$/.test(e.key)){const r=ROUTES.find(r=>r[3]===e.key);if(r)location.hash='#/'+r[0];}
});
window.addEventListener('hashchange',scheduleRender);
/* ---------- boot ---------- */
function setBoot(id,txt,cls){ const el=q('#'+id); if(el){el.textContent=txt;el.className=cls||'';} }
function boot(){
 const step=(id,txt,cls,d)=>new Promise(r=>setTimeout(()=>{setBoot(id,txt,cls);r()},d));
 (async()=>{
  await step('bb-rec','probing '+(KEY)+' …','',150);
  safe(()=>load());
  if(RECOVERY)setBoot('bb-rec','RECOVERY — '+RECOVERY.kind,'warn'); else setBoot('bb-rec','record v:'+(S?S.v:'?'),'ok');
  await step('bb-mig',S&&S.meta.trail.length?('trail v'+S.meta.trail.map(t=>t.to).join(' → v')):'clean — no migration needed','ok',200);
  runAudit(); const laps=lapseSweep(); if(laps>0){logSys(`lapse machine opened ${laps} feedback-gap case(s) at boot`);save();}
  setBoot('bb-guard',LAST_AUDIT.some(a=>a.faults.length)?LAST_AUDIT.filter(a=>a.faults.length).length+' audit class(es) flag — see #/data':'guard pass — shape rebuilt, unknown keys preserved',LAST_AUDIT.some(a=>a.faults.length)?'warn':'ok');
  await step('bb-rules',RULES.length+' rules armed ('+RULES.filter(r=>r.lock).length+' locked)','ok',200);
  runRules(); const firing=LAST_RULES.filter(r=>r.firing&&!r.pos&&!r.sleepUntil).length;
  setBoot('bb-aud',AUDS.length+' audit classes · '+firing+' advisories firing','ok');
  await step('bb-tests',TESTS.length+' tests running in isolation…','',250);
  WALL_RESULTS=runTestsIsolated();
  const bad=WALL_RESULTS.filter(r=>!r.ok);
  setBoot('bb-tests',bad.length?(WALL_RESULTS.length-bad.length)+'/'+WALL_RESULTS.length+' — FAILURES: '+bad.map(b=>b.id).join(','):(WALL_RESULTS.length)+'/'+WALL_RESULTS.length+' pass',bad.length?'bad':'ok');
  setTimeout(()=>{ q('#boot').style.display='none'; APP_ON=true; q('#app').classList.add('on');
   if(!location.hash)location.hash='#/today'; render(); },bad.length?1400:650);
 })();
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
</script>
