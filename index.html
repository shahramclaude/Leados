<script>
/* ============================================================================
   LEADOS pt-Q — single-file sandbox build
   See AI-SESSION-LOG.md and the About tab for exactly what was verified
   against github.com/wbweve/Leados vs. what is original to this file.
   ============================================================================ */

const LS_KEY = 'leados:pt-Q:v1';

/* ---------------------------- tiny seeded RNG ---------------------------- */
function mulberry32(a){
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let rng = mulberry32(42);
const R = (lo, hi) => lo + rng() * (hi - lo);
const RI = (lo, hi) => Math.floor(R(lo, hi + 1));
const PICK = (arr) => arr[RI(0, arr.length - 1)];
const uid = (() => { let n = 0; return (p) => `${p}_${(n++).toString(36)}`; })();

/* ------------------------------- LEADOS core ------------------------------ */
const LEADOS = {};

LEADOS.engine = {
  // to - from, in days (can be fractional). Positive when `to` is chronologically after `from`.
  _days(from, to) { return (new Date(to) - new Date(from)) / 86400000; }
};

// Minimal, disclosed stand-in for a fuller wargame/financial module.
// The provided pt-Q spec calls LEADOS.wargame.* from LEADOS.performance but
// does not define it in this part — implemented here as original, labeled code.
LEADOS.wargame = {
  _computeVelocityMean(P, today, windowDays = 90) {
    const pts = P.state.events.filter(e => e.type === 'sprint.review' &&
      LEADOS.engine._days(e.ts, today) <= windowDays).map(e => e.data.velocity);
    return pts.length ? pts.reduce((a,b)=>a+b,0) / pts.length : null;
  },
  _latestMetric(P, key) {
    const logs = P.state.events.filter(e => e.type === 'fin.pl.logged' && e.data[key] !== undefined)
      .sort((a,b) => a.ts < b.ts ? -1 : 1);
    return logs.length ? logs[logs.length - 1].data[key] : null;
  },
  _computeWinRate(P, today, windowDays = 90) {
    const deals = P.state.events.filter(e => e.type === 'sales.deal.closed' &&
      LEADOS.engine._days(e.ts, today) <= windowDays);
    if (!deals.length) return null;
    const won = deals.filter(d => d.data.outcome === 'won').length;
    return won / deals.length;
  }
};

/* ------------------------------ PART 3: cascade --------------------------- */
LEADOS.cascade = {
  buildInformalNetwork(P, today) {
    const people = P.directs.concat(P.skips);
    const network = new Map();
    people.forEach(p => network.set(p.id, { person: p, in: [], out: [], totalInfluence: 0 }));

    const INFLUENCE_PAIRS = [
      { trigger: 'feedback.given', response: 'feedback.given', window: 7,
        label: 'Feedback-giving behavior spreads through the team' },
      { trigger: 'blocker.logged', response: 'blocker.logged', window: 14,
        label: 'Psychological safety to name blockers spreads from leaders' },
      { trigger: 'goal.progress', response: 'goal.progress', window: 21,
        label: 'Goal progress behavior cascades through the team' },
      { trigger: 'conflict.logged', response: 'conflict.logged', window: 30,
        label: 'Conflict spread through team proximity' }
    ];

    for (const pair of INFLUENCE_PAIRS) {
      const triggers = P.state.events.filter(e => e.type === pair.trigger);
      const responses = P.state.events.filter(e => e.type === pair.response);
      triggers.forEach(trigger => {
        const influencer = trigger.data.personId;
        if (!influencer || !network.has(influencer)) return;
        const influenced = responses.filter(response => {
          const responderId = response.data.personId;
          return responderId && responderId !== influencer &&
                 network.has(responderId) &&
                 LEADOS.engine._days(trigger.ts, response.ts) > 0 &&
                 LEADOS.engine._days(trigger.ts, response.ts) <= pair.window;
        });
        influenced.forEach(response => {
          const influenced_person = response.data.personId;
          const node = network.get(influencer);
          const existing = node.out.find(e => e.to === influenced_person && e.type === pair.trigger);
          if (!existing) {
            node.out.push({ to: influenced_person, type: pair.trigger, count: 1, label: pair.label });
            network.get(influenced_person).in.push({ from: influencer, type: pair.trigger, count: 1 });
            node.totalInfluence++;
          } else {
            existing.count++;
          }
        });
      });
    }

    network.forEach((node, personId) => {
      node.influenceScore = node.out.reduce((a, e) => a + e.count, 0);
      node.influencedByCount = node.in.reduce((a, e) => a + e.count, 0);
      const isDirectReport = P.directs.some(d => d.id === personId);
      node.isDarkMatter = node.influenceScore > 5 && !isDirectReport;
    });

    return {
      network,
      influenceLeaders: [...network.values()].sort((a,b) => b.influenceScore - a.influenceScore).slice(0, 5),
      darkMatter: [...network.values()].filter(n => n.isDarkMatter),
      label: 'Informal influence network from behavioral cascade patterns. ' +
             'Labeled: influence is inferred from event co-occurrence within time windows. ' +
             'Correlation \u2260 causation. A person may respond to the same stimulus, not to the person who preceded them.'
    };
  },

  predictCascade(message, network, P) {
    const senderNode = network.network.get(message.sender);
    if (!senderNode) return null;

    const directReach = senderNode.out.map(e => ({
      personId: e.to, person: network.network.get(e.to)?.person, channels: e.type, estimatedTime: 2
    }));

    const indirectReach = directReach.flatMap(direct => {
      const directNode = network.network.get(direct.personId);
      return (directNode?.out || []).map(e => ({
        personId: e.to, person: network.network.get(e.to)?.person, via: direct.person?.name, estimatedTime: 5
      }));
    }).filter(r => !directReach.some(d => d.personId === r.personId));

    const darkMatterInPath = network.darkMatter.filter(dm =>
      directReach.some(d => d.personId === dm.person?.id) ||
      indirectReach.some(i => i.personId === dm.person?.id)
    );

    const maxChainLength = 3;
    const distortionProbability = 1 - Math.pow(0.85, Math.min(maxChainLength, 3));

    return {
      message: message.content, sender: message.sender,
      directReach: directReach.length, indirectReach: indirectReach.length,
      totalReach: new Set([...directReach, ...indirectReach].map(r => r.personId)).size,
      cascadePath: { direct: directReach, indirect: indirectReach },
      darkMatterRisk: darkMatterInPath.length > 0 ? {
        present: true, influencers: darkMatterInPath.map(dm => dm.person?.name),
        risk: 'These informal influencers will shape the meaning of your message before it reaches their networks. Brief them first.'
      } : { present: false },
      distortionRisk: {
        probability: Math.round(distortionProbability * 100),
        mitigation: 'Communicate directly rather than relying on cascade. For critical messages: all-hands or written broadcast (not cascade).'
      },
      label: 'Information cascade prediction from informal influence network. ' +
             'Labeled: prediction from behavioral patterns, not social mapping. ' +
             'Distortion probability: approximation from Shannon (1948). ' +
             'Labeled: organizational communication is not a perfect information channel.'
    };
  }
};

/* ------------------------------ PART 4: meetings --------------------------- */
LEADOS.meetings = {
  computeMeetingCost(P, today, windowDays = 30) {
    const recentMeetings = P.state.events.filter(e =>
      e.type === 'meeting.logged' && LEADOS.engine._days(e.ts, today) <= windowDays);
    const costPerHour = P.settings.fullyLoadedCostPerHour || 150;
    let totalPersonHours = 0, totalDecisions = 0, totalActionItems = 0, clearOutcomes = 0;
    recentMeetings.forEach(m => {
      const attendees = m.data.attendees?.length || 1;
      const durationHrs = (m.data.durationMin || 60) / 60;
      totalPersonHours += attendees * durationHrs;
      totalDecisions += (m.data.decisions || []).length;
      totalActionItems += (m.data.actionItems || []).length;
      if (m.data.outcome === 'clear') clearOutcomes++;
    });
    const totalCost = totalPersonHours * costPerHour;
    const costPerDecision = totalDecisions ? totalCost / totalDecisions : null;
    const outcomeClarity = recentMeetings.length ? clearOutcomes / recentMeetings.length : null;
    return {
      totalPersonHours: Math.round(totalPersonHours),
      totalCost: Math.round(totalCost),
      totalMeetings: recentMeetings.length,
      totalDecisions, totalActionItems,
      costPerDecision: costPerDecision ? Math.round(costPerDecision) : null,
      outcomeClarity: outcomeClarity ? Math.round(outcomeClarity * 100) : null,
      closureRate: this._computeClosureRate(P, today),
      loadByPerson: this._computeMeetingLoadByPerson(recentMeetings, P),
      meetingHeavy: totalPersonHours > (P.people.length * 8 * 0.4 * (windowDays / 7)),
      label: `Meeting cost analysis: ${windowDays}d window. Cost assumption: \u20ac${costPerHour}/person-hour (fully loaded). ` +
             `Update in settings. Labeled: cost is estimated from logged meetings only \u2014 excludes meetings not logged in LeadOS.`
    };
  },

  computeDecisionVelocity(P, today) {
    const openDecisions = P.openDecisions || [];
    const closedDecisions = P.state.events.filter(e => e.type === 'decision.outcome');
    const timesToDecision = closedDecisions.map(outcome => {
      const original = P.state.events.find(e => e.type === 'strategy.decision' && e.id === outcome.data.decisionId);
      if (!original) return null;
      return LEADOS.engine._days(original.ts, outcome.ts);
    }).filter(x => x !== null);
    const meanTTD = timesToDecision.length ? timesToDecision.reduce((a,b)=>a+b,0) / timesToDecision.length : null;
    const aged = openDecisions.filter(d => LEADOS.engine._days(d.ts, today) > 21);
    return {
      openCount: openDecisions.length,
      closedCount: closedDecisions.length,
      meanTimeToDecision: meanTTD ? Math.round(meanTTD) : null,
      agedDecisions: aged.length,
      agedDecisionDetails: aged,
      velocity: closedDecisions.filter(d => LEADOS.engine._days(d.ts, today) <= 30).length,
      outcomeTracked: P.state.events.filter(e => e.type === 'decision.outcome').length,
      outcomePending: openDecisions.length - P.state.events.filter(e => e.type === 'decision.outcome').length,
      label: `Decision velocity from strategy.decision and decision.outcome events. ` +
             `Mean time to decision: ${meanTTD ? Math.round(meanTTD) + 'd' : 'N/A (no closed decisions)'}. ` +
             `${aged.length} decisions open > 21d.`
    };
  },

  _computeClosureRate(P, today) {
    const actionItems = P.state.events.filter(e => e.type === 'meeting.followup');
    const closed = actionItems.filter(a => a.data.closed).length;
    return actionItems.length ? Math.round(closed / actionItems.length * 100) : null;
  },

  _computeMeetingLoadByPerson(meetings, P) {
    const load = {};
    meetings.forEach(m => {
      (m.data.attendees || []).forEach(pid => {
        load[pid] = (load[pid] || 0) + (m.data.durationMin || 60) / 60;
      });
    });
    return Object.entries(load).map(([pid, hrs]) => ({
      person: P.peopleById?.[pid], hoursPerWeek: Math.round((hrs / 4.3) * 10) / 10
    })).sort((a,b) => b.hoursPerWeek - a.hoursPerWeek);
  }
};

/* --------------------------- PART 5: performance ---------------------------- */
LEADOS.performance = {
  buildPerformanceChain(P, today) {
    const activities = {
      oneOnOnes: P.state.events.filter(e => e.type === 'oneonone.logged' && LEADOS.engine._days(e.ts, today) <= 30).length,
      feedbackGiven: P.state.events.filter(e => e.type === 'feedback.given' && LEADOS.engine._days(e.ts, today) <= 30).length,
      sprintsCompleted: P.state.events.filter(e => e.type === 'sprint.review' && LEADOS.engine._days(e.ts, today) <= 30).length,
      decisionsLogged: P.state.events.filter(e => e.type === 'strategy.decision' && LEADOS.engine._days(e.ts, today) <= 30).length
    };
    const outputs = {
      velocityMean: LEADOS.wargame._computeVelocityMean(P, today),
      goalHitRate: this._computeGoalHitRate(P, today),
      feedbackLoop: activities.feedbackGiven / Math.max(1, P.directs.length),
      decisionVelocity: LEADOS.meetings.computeDecisionVelocity(P, today).velocity
    };
    const outcomes = {
      grossMargin: LEADOS.wargame._latestMetric(P, 'gross_margin_pct'),
      nps: LEADOS.wargame._latestMetric(P, 'nps_score'),
      winRate: LEADOS.wargame._computeWinRate(P, today),
      engagementMean: this._computeTeamEngagement(P, today)
    };
    const impact = {
      teamGrowth: this._computeTeamGrowthVector(P, today),
      retentionRate: this._computeRetentionRate(P, today),
      revenueVelocity: this._computeRevenueVelocity(P, today)
    };

    const chains = [];
    if (activities.oneOnOnes > 0 && outcomes.engagementMean !== null) {
      chains.push({
        chain: '1:1 cadence \u2192 team engagement \u2192 retention probability',
        activitySignal: activities.oneOnOnes + ' 1:1s this month',
        outputSignal: `Engagement: ${outcomes.engagementMean?.toFixed(1)}/10`,
        outcomeSignal: impact.retentionRate !== null ? `Retention rate: ${Math.round(impact.retentionRate * 100)}%` : 'No attrition data',
        causalStrength: 'ASSUMED (Gallup Q12 basis)',
        verification: 'Compare engagement before/after 1:1 cadence improvements'
      });
    }
    if (outputs.feedbackLoop !== null && outcomes.grossMargin !== null) {
      chains.push({
        chain: 'Feedback richness \u2192 team performance \u2192 financial outcomes',
        activitySignal: `${outputs.feedbackLoop.toFixed(1)} feedbacks/person/month`,
        outputSignal: `Goal hit rate: ${outputs.goalHitRate !== null ? Math.round(outputs.goalHitRate * 100) + '%' : 'N/A'}`,
        outcomeSignal: `Gross margin: ${outcomes.grossMargin}%`,
        causalStrength: 'ASSUMED (Kluger & DeNisi, 1996)',
        verification: 'Correlate feedback.given rate with subsequent sprint velocity'
      });
    }

    return {
      activities, outputs, outcomes, impact, chains,
      leadingIndicators: this._identifyLeadingIndicators(activities, outputs),
      laggingIndicators: this._identifyLaggingIndicators(outcomes, impact),
      label: 'Performance chain from event log measurements. Labeled: causal links between layers are theoretical. ' +
             'Correlation between layers is computable from your data. To confirm causation: annotate outcomes with causal.annotation events.'
    };
  },

  _identifyLeadingIndicators(activities, outputs) {
    const leaders = [];
    if (activities.oneOnOnes >= 4) leaders.push({ indicator: '1:1 cadence maintained', predicts: 'Engagement will hold or improve (7-21d lag)', confidence: 'ASSUMED', source: 'Hersey & Blanchard (1969)' });
    if (outputs.feedbackLoop >= 1) leaders.push({ indicator: '\u22651 feedback/person/month', predicts: 'Performance will improve (30-60d lag)', confidence: 'ASSUMED', source: 'Kluger & DeNisi (1996)' });
    if (outputs.velocityMean !== null && outputs.velocityMean > 0) leaders.push({ indicator: `Sprint velocity stable at ${Math.round(outputs.velocityMean)} pts`, predicts: 'Delivery dates will be met (next sprint)', confidence: 'EVIDENCED', source: 'Your sprint.review history' });
    return leaders;
  },

  _identifyLaggingIndicators(outcomes, impact) {
    const laggers = [];
    if (outcomes.grossMargin !== null) laggers.push({ indicator: 'Gross margin', value: outcomes.grossMargin + '%', lags: 'Revenue mix decisions by 30-90d' });
    if (outcomes.nps !== null) laggers.push({ indicator: 'NPS', value: outcomes.nps, lags: 'Customer experience by 30-60d' });
    if (impact.retentionRate !== null) laggers.push({ indicator: 'Retention rate', value: Math.round(impact.retentionRate * 100) + '%', lags: 'Engagement by 30-90d' });
    return laggers;
  },

  _computeGoalHitRate(P, today, limit) {
    let closedGoals = P.state.events.filter(e => e.type === 'goal.closed').sort((a,b) => a.ts < b.ts ? -1 : 1);
    if (limit) closedGoals = closedGoals.slice(-limit);
    const achieved = closedGoals.filter(e => e.data.result === 'achieved').length;
    return closedGoals.length ? achieved / closedGoals.length : null;
  },

  _computeTeamEngagement(P, today) {
    const recentPulses = P.state.events.filter(e => e.type === 'pulse.recorded' && LEADOS.engine._days(e.ts, today) <= 30);
    if (!recentPulses.length) return null;
    return recentPulses.reduce((a,e) => a + (e.data.mood||5), 0) / recentPulses.length;
  },

  _computeTeamGrowthVector(P, today) {
    const plans = P.openPlans;
    if (!plans.length) return null;
    const withProgress = plans.filter(pl => pl.spine.length > 1).length;
    return withProgress / plans.length;
  },

  _computeRetentionRate(P, today, windowDays = 365) {
    const startCount = P.state.events.filter(e => e.type === 'hr.started' && LEADOS.engine._days(e.ts, today) <= windowDays).length + P.people.length;
    const attritions = P.state.events.filter(e => e.type === 'hr.attrition.logged' && LEADOS.engine._days(e.ts, today) <= windowDays).length;
    return startCount ? 1 - (attritions / startCount) : null;
  },

  _computeRevenueVelocity(P, today) {
    const quarters = P.state.events.filter(e => e.type === 'fin.pl.logged').sort((a,b) => a.ts < b.ts ? -1 : 1).slice(-4);
    if (quarters.length < 2) return null;
    const latest = quarters[quarters.length-1].data.revenue;
    const prior = quarters[0].data.revenue;
    return prior ? (latest - prior) / prior : null;
  }
};

/* -------------------------- PART 6: compensation ---------------------------- */
LEADOS.compensation = {
  computeCompaRatios(P, today) {
    const latestComp = this._getLatestCompByPerson(P);
    const benchmarks = this._getLatestBenchmarks(P);
    return Object.entries(latestComp).map(([personId, comp]) => {
      const person = P.peopleById[personId];
      const benchmark = benchmarks[comp.band];
      const compaRatio = benchmark ? comp.baseSalary / benchmark.market50pct : null;
      return {
        person, comp, benchmark,
        compaRatio: compaRatio ? Math.round(compaRatio * 100) / 100 : null,
        position: compaRatio ?
          (compaRatio < 0.85 ? 'BELOW_MARKET' : compaRatio < 0.95 ? 'LOW_MARKET' : compaRatio < 1.05 ? 'AT_MARKET' : compaRatio < 1.15 ? 'ABOVE_MARKET' : 'WELL_ABOVE_MARKET') : 'NO_BENCHMARK',
        riskFlag: !!(compaRatio && compaRatio < 0.85),
        label: `Compa-ratio: actual/market_midpoint. < 0.85 = retention risk. > 1.15 = above market.`
      };
    });
  },

  analyzeEquityGaps(P, today) {
    const compaRatios = this.computeCompaRatios(P, today);
    const withData = compaRatios.filter(c => c.compaRatio !== null);
    if (withData.length < 4) {
      return { insufficient: true, message: 'Fewer than 4 people with compensation data. Equity analysis requires n \u2265 4 for any meaningful comparison.',
        label: 'Labeled: small n \u2192 high variance in group comparisons.' };
    }
    const byBand = {};
    withData.forEach(c => { const band = c.comp.band || 'UNKNOWN'; (byBand[band] ||= []).push(c.compaRatio); });
    const bandAnalysis = Object.entries(byBand).map(([band, ratios]) => ({
      band, n: ratios.length,
      mean: Math.round(ratios.reduce((a,b)=>a+b,0) / ratios.length * 100) / 100,
      spread: Math.round((Math.max(...ratios) - Math.min(...ratios)) * 100) / 100,
      belowMarket: ratios.filter(r => r < 0.85).length
    }));
    const allRatios = withData.map(c => c.compaRatio).sort((a,b)=>a-b);
    const p10 = allRatios[Math.floor(allRatios.length * 0.1)];
    const p90 = allRatios[Math.floor(allRatios.length * 0.9)];
    return {
      totalPeopleWithData: withData.length, bandAnalysis,
      overallSpread: { p10: Math.round(p10*100)/100, p90: Math.round(p90*100)/100 },
      atRisk: withData.filter(c => c.riskFlag).map(c => ({ person: c.person.name, compaRatio: c.compaRatio, band: c.comp.band })),
      label: 'Compensation equity analysis by band. Protected attribute analysis (gender, race, etc.) requires explicit consent and ' +
             'is governed by the platform\u2019s sensitive data rules. For protected attribute analysis: engage HR and legal counsel ' +
             'with appropriate data governance. This is a band-level analysis only.'
    };
  },

  analyzePromotionPatterns(P, today) {
    const promotions = P.state.events.filter(e => e.type === 'comp.logged' && e.data.reason === 'promo');
    const byBand = {};
    promotions.forEach(p => {
      const band = p.data.band || 'UNKNOWN';
      (byBand[band] ||= { count: 0, timeSinceLast: [] });
      byBand[band].count++;
      byBand[band].timeSinceLast.push(LEADOS.engine._days(p.ts, today));
    });
    const velocity = Object.entries(byBand).map(([band, data]) => ({
      band, promotionCount: data.count,
      meanDaysSincePromo: data.timeSinceLast.length ? Math.round(data.timeSinceLast.reduce((a,b)=>a+b,0) / data.timeSinceLast.length) : null
    }));
    const dueForReview = P.directs.concat(P.skips).filter(person => {
      const lastPromo = promotions.filter(p => p.data.personId === person.id).sort((a,b) => b.ts > a.ts ? 1 : -1)[0];
      const tenure = person.startDate ? LEADOS.engine._days(person.startDate, today) : null;
      const daysSincePromo = lastPromo ? LEADOS.engine._days(lastPromo.ts, today) : tenure;
      return daysSincePromo && daysSincePromo > 365;
    });
    return { totalPromotions: promotions.length, velocity, dueForReview, label: 'Promotion pattern analysis from comp.logged(reason=promo) events.' };
  },

  _getLatestCompByPerson(P) {
    const result = {};
    P.state.events.filter(e => e.type === 'comp.logged').sort((a,b) => a.ts < b.ts ? -1 : 1)
      .forEach(e => { result[e.data.personId] = e.data; });
    return result;
  },
  _getLatestBenchmarks(P) {
    const result = {};
    P.state.events.filter(e => e.type === 'comp.benchmark').sort((a,b) => a.ts < b.ts ? -1 : 1)
      .forEach(e => { result[e.data.band] = e.data; });
    return result;
  }
};

/* ----------------------- disclosed proxy: flight risk -----------------------
   R161 and R166 reference js/flight_risk.js and js/causal.js, which were
   named in the pt-Q spec's "New modules" list but whose source was not
   included in this part of the brief. Rather than invent an unverified
   module under that name, this is an explicit, labeled, simplified stand-in
   used only to make the referenced rules demonstrable in this sandbox. */
LEADOS.flightRiskProxy = {
  compute(P, today) {
    const people = P.directs.concat(P.skips);
    const compa = LEADOS.compensation.computeCompaRatios(P, today);
    return people.map(person => {
      const lastOneOnOne = P.state.events.filter(e => e.type === 'oneonone.logged' && e.data.personId === person.id)
        .sort((a,b) => a.ts < b.ts ? 1 : -1)[0];
      const daysSinceOneOnOne = lastOneOnOne ? LEADOS.engine._days(lastOneOnOne.ts, today) : 999;
      const pulses = P.state.events.filter(e => e.type === 'pulse.recorded' && e.data.personId === person.id &&
        LEADOS.engine._days(e.ts, today) <= 45);
      const meanMood = pulses.length ? pulses.reduce((a,e)=>a+e.data.mood,0)/pulses.length : null;
      const feedbackCount = P.state.events.filter(e => e.type === 'feedback.given' && e.data.aboutId === person.id &&
        LEADOS.engine._days(e.ts, today) <= 60).length;
      const comp = compa.find(c => c.person?.id === person.id);
      let score = 0;
      if (daysSinceOneOnOne > 14) score += 2;
      if (meanMood !== null && meanMood < 5.5) score += 2;
      if (feedbackCount === 0) score += 1;
      if (comp && comp.riskFlag) score += 2;
      const level = score >= 4 ? 'HIGH' : score >= 2 ? 'MEDIUM' : 'LOW';
      return { person, daysSinceOneOnOne: Math.round(daysSinceOneOnOne), meanMood, feedbackCount, compaRatio: comp?.compaRatio ?? null, score, level };
    });
  },
  label: 'SIMPLIFIED PROXY \u2014 not the js/flight_risk.js module named in the pt-Q spec (source not provided this part). ' +
         'Combines 1:1 recency, pulse mood, feedback frequency and compa-ratio into a 0-7 score. Original to this build, clearly not evidenced against real attrition.'
};

/* --------------------------------- rules R161-R175 -------------------------- */
function computeRules(P, today, ctx) {
  const { network, meetingCost, decisionVelocity, perfChain, compaRatios, equityGaps, promoPatterns, flightRisks } = ctx;
  const findings = [];
  const push = (id, title, severity, detail, labeled) => findings.push({ id, title, severity, detail, labeled });

  // R161
  flightRisks.filter(f => f.level === 'HIGH' && f.daysSinceOneOnOne > 14).forEach(f => {
    push('R161', `Flight risk HIGH: ${f.person.name} \u2014 no 1:1 in ${f.daysSinceOneOnOne}d`, 4,
      `Score ${f.score}/7. Mood ${f.meanMood !== null ? f.meanMood.toFixed(1) : 'n/a'}, feedback(60d)=${f.feedbackCount}, compa-ratio=${f.compaRatio ?? 'n/a'}.`,
      'Flight-risk score is a simplified proxy (see flightRiskProxy.label) \u2014 named, but based on synthetic data quality, not a validated model.');
  });

  // R162
  decisionVelocity.agedDecisionDetails.filter(d => (d.data.stakes || 0) >= 3).forEach(d => {
    push('R162', `Decision aged > 21d, stakes \u2265 3: "${d.data.title}"`, 3,
      `Open ${Math.round(LEADOS.engine._days(d.ts, today))}d, stakes=${d.data.stakes}.`, null);
  });

  // R163
  if (meetingCost.closureRate !== null && meetingCost.closureRate < 50) {
    push('R163', `Meeting action-item closure rate ${meetingCost.closureRate}% (< 50%)`, 3, 'From meeting.followup events.', null);
  }

  // R164
  meetingCost.loadByPerson.filter(l => l.hoursPerWeek > 16).forEach(l => {
    push('R164', `Meeting load > 40% for ${l.person?.name || 'unknown'}: ${l.hoursPerWeek}h/week`, 2, 'Threshold: >16h/week assumes a 40h week.', null);
  });

  // R165
  compaRatios.filter(c => c.riskFlag).forEach(c => {
    push('R165', `Compa-ratio < 0.85 for ${c.person.name} (${c.compaRatio})`, 4, `Band ${c.comp.band}. ${c.label}`, null);
  });

  // R166
  const pulsePeople = new Set(P.state.events.filter(e => e.type === 'pulse.recorded').map(e => e.data.personId));
  if (pulsePeople.size < 10) {
    push('R166', `Causal graph: only ${pulsePeople.size} people with pulse data (< 10)`, 1,
      'Correlational confidence is low with small n. This is expected for a team this size.',
      'No dedicated causal-graph module was provided this part; this check uses pulse.recorded coverage as a proxy for evidence depth.');
  }

  // R167
  if (decisionVelocity.velocity === 0) {
    push('R167', 'Decision velocity = 0 (no decisions closed in last 30d)', 2, `${decisionVelocity.openCount} decisions currently open.`, null);
  }

  // R168
  if (perfChain.leadingIndicators.length === 0) {
    push('R168', 'Performance chain: no leading indicators currently tracked', 2, 'No activity signals met threshold this period.', null);
  }

  // R169
  network.darkMatter.forEach(dm => {
    push('R169', `Informal network dark matter detected: ${dm.person.name}`, 2,
      `Influence score ${dm.influenceScore}, not a direct report.`, 'Inferred from event co-occurrence \u2014 correlation, not confirmed social mapping.');
  });

  // R170 (proxy: fires when any predicted cascade would cross a dark-matter node at max modeled chain depth)
  if (network.darkMatter.length > 0 && network.influenceLeaders.some(l => l.influenceScore > 0)) {
    push('R170', 'Information cascade length > 3 modeled for critical comms', 2,
      'Dark-matter influencers sit inside at least one predicted cascade path.',
      'Chain-length cap is fixed at 3 in this model (org-size assumption) \u2014 see cascade.predictCascade.');
  }

  // R171
  const outcomesWithoutAnnotation = P.state.events.filter(e => e.type === 'decision.outcome' &&
    !P.state.events.some(a => a.type === 'causal.annotation' && a.data.decisionId === e.data.decisionId));
  if (outcomesWithoutAnnotation.length > 0) {
    push('R171', `${outcomesWithoutAnnotation.length} decision outcome(s) logged without causal.annotation`, 1,
      'No causal.annotation events exist in this synthetic dataset \u2014 the practice is simply unused here.', null);
  }

  // R172
  promoPatterns.dueForReview.forEach(person => {
    const tenureDays = LEADOS.engine._days(person.startDate, today);
    const hasPlan = (P.openPlans || []).some(pl => pl.personId === person.id);
    if (tenureDays > 548 && hasPlan) {
      push('R172', `Promotion overdue > 18mo AND growth plan active: ${person.name}`, 3, `Tenure/time-since-promo \u2248 ${Math.round(tenureDays)}d.`, null);
    }
  });

  // R173
  const lastReview = P.state.events.filter(e => e.type === 'comp.review').sort((a,b) => a.ts < b.ts ? -1 : 1).pop();
  if (!lastReview || LEADOS.engine._days(lastReview.ts, today) > 548) {
    push('R173', `Compensation review cycle > 18 months${lastReview ? '' : ' (none logged)'}`, 2,
      lastReview ? `Last review ${Math.round(LEADOS.engine._days(lastReview.ts, today))}d ago.` : 'No comp.review events found.', null);
  }

  // R174
  const last3HitRate = LEADOS.performance._computeGoalHitRate(P, today, 3);
  if (last3HitRate !== null && last3HitRate < 0.5) {
    push('R174', `Goal hit rate ${Math.round(last3HitRate*100)}% for last 3 closed goals (< 50%)`, 3, null, null);
  }

  // R175
  if (meetingCost.costPerDecision !== null && meetingCost.costPerDecision > 5000) {
    push('R175', `Meeting cost per decision \u20ac${meetingCost.costPerDecision.toLocaleString()} (> \u20ac5,000)`, 2,
      null, 'Cost is an estimate from logged meetings at the configured \u20ac/person-hour rate.');
  }

  return findings.sort((a,b) => b.severity - a.severity);
}

  // sprint.review — velocity history
  for (let i = 0; i < 8; i++) addEv('sprint.review', daysAgoISO(seedAt, 7 + i * 14), { velocity: RI(28, 40) });

  // meeting.logged — Alicia overloaded (R164), mixed outcomes (R163 contributor)

  // meeting.followup — closure rate < 50% (R163)
  for (let i = 0; i < 16; i++) {
    addEv('meeting.followup', daysAgoISO(seedAt, RI(2, 25)), {
      meetingId: `meet_${RI(0,21)}`, actionItem: `Follow up ${i}`, ownerId: PICK(allPeople.map(p=>p.id)),

  decisionDefs.forEach((d, i) => {

    addEv('strategy.decision', daysAgoISO(seedAt, d.age), { title: d.title, stakes: d.stakes }, id);

/* --------------------------------- state I/O --------------------------------- */
function loadState() {
  const raw = localStorage.getItem(LS_KEY);
  if (raw) { try { return JSON.parse(raw); } catch (e) { /* fall through */ } }
  const s = seedState(42);
  localStorage.setItem(LS_KEY, JSON.stringify(s));
  return s;
}
function resetState() {
  const s = seedState(Date.now() % 1000000);
  localStorage.setItem(LS_KEY, JSON.stringify(s));
  return s;
}

function buildP(state) {
  const peopleById = {};
  state.people.directs.concat(state.people.skips).forEach(p => peopleById[p.id] = p);
  const events = state.events;
  const decisions = events.filter(e => e.type === 'strategy.decision');
  const outcomes = events.filter(e => e.type === 'decision.outcome');
  const openDecisions = decisions.filter(d => !outcomes.some(o => o.data.decisionId === d.id));
  return {
    directs: state.people.directs,
    skips: state.people.skips,
    people: state.people.directs.concat(state.people.skips),
    peopleById,
    state: { events },
    settings: state.settings,
    openDecisions,
    openPlans: state.openPlans
  };
}

function renderCascade() {
  const net = ANALYSIS.network;
  const senderOptions = P.directs.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
  return `

    <div class="card p-4">

      <tbody>${net.influenceLeaders.map(n => `<tr class="border-t border-gray-100"><td class="py-1">${n.person.name}</td><td>${n.influenceScore}</td><td>${n.influencedByCount}</td><td>${n.isDarkMatter?'<span class="text-amber-600 font-semibold">yes</span>':'—'}</td></tr>`).join('')}</tbody></table>
      ${labelTag(net.label)}
    </div>
    <div class="card p-4">
      <div class="font-semibold mb-2">Dark matter (high informal influence, not a direct report)</div>
      ${net.darkMatter.length ? `<ul class="text-sm list-disc pl-5 space-y-1">${net.darkMatter.map(dm => `<li><b>${dm.person.name}</b> (${dm.person.role}) — influence score ${dm.influenceScore}</li>`).join('')}</ul>` : '<div class="text-sm text-gray-500">None detected in this synthetic run.</div>'}
      ${labelTag('Correlation \u2260 causation: a person may respond to the same stimulus, not to the person who preceded them.')}
    </div>
  </div>
  <div class="card p-4">
    <div class="font-semibold mb-3">Predict a cascade</div>
    <div class="flex flex-wrap gap-2 items-end mb-3">
      <div><label class="text-xs text-gray-500 block mb-1">Sender</label><select id="castSender" class="border rounded-lg px-2 py-1.5 text-sm">${senderOptions}</select></div>
      <div><label class="text-xs text-gray-500 block mb-1">Trigger type</label><select id="castTrigger" class="border rounded-lg px-2 py-1.5 text-sm">
        <option value="feedback.given">feedback.given</option><option value="blocker.logged">blocker.logged</option>
        <option value="goal.progress">goal.progress</option><option value="conflict.logged">conflict.logged</option></select></div>
      <div class="flex-1 min-w-[200px]"><label class="text-xs text-gray-500 block mb-1">Message</label><input id="castMsg" class="border rounded-lg px-2 py-1.5 text-sm w-full" value="We are changing the sprint cadence starting next week."></div>
      <button class="bg-gray-900 text-white text-sm font-semibold px-3 py-1.5 rounded-lg" onclick="runCascade()">Predict →</button>
    </div>
    <div id="cascadeResult"></div>
  </div>`;
}

function runCascade() {
  const sender = document.getElementById('castSender').value;
  const content = document.getElementById('castMsg').value;
  const result = LEADOS.cascade.predictCascade({ sender, content, type: document.getElementById('castTrigger').value }, ANALYSIS.network, P);
  const el = document.getElementById('cascadeResult');
  if (!result) { el.innerHTML = '<div class="text-sm text-gray-500">This sender has no outgoing influence edges in the synthetic network.</div>'; return; }
  el.innerHTML = `
    <div class="grid md:grid-cols-3 gap-3 mb-3">
      ${statCard('Direct reach', result.directReach)}
      ${statCard('Indirect reach', result.indirectReach)}
      ${statCard('Distortion risk', result.distortionRisk.probability + '%')}
    </div>
    ${result.darkMatterRisk.present ? labelTag(`<b>Dark-matter risk:</b> ${result.darkMatterRisk.influencers.join(', ')} — ${result.darkMatterRisk.risk}`) : ''}
    ${labelTag(result.distortionRisk.mitigation, 'gray')}
    ${labelTag(result.label)}
  `;
}
window.runCascade = runCascade;
