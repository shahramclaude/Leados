<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeadOS · pt-2 — Leadership Operating System</title>
<meta name="description" content="Offline leadership mentor for new leaders of team leads. Vanilla JS, localStorage, no network.">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="boot-fatal" hidden></div>

<header id="topbar">
  <span class="brand">LEAD<span>O</span>S</span>
  <span class="top-meta" id="top-meta"></span>
  <span id="write-pill" class="pill pill-bad" hidden>WRITE FAILED</span>
</header>

<div id="shell">
  <nav id="rail">
    <a class="brand-lg" href="#/today">LEAD<span>O</span>S</a>
    <div id="rail-links">
      <a href="#/today" data-route="today"><i data-ic="today"></i>Today <b id="n-today"></b></a>
      <a href="#/roster" data-route="roster"><i data-ic="people"></i>Roster</a>
      <a href="#/playbooks" data-route="playbooks"><i data-ic="book"></i>Playbooks</a>
      <a href="#/health" data-route="health"><i data-ic="pulse"></i>Health</a>
      <a href="#/data" data-route="data"><i data-ic="db"></i>Data</a>
    </div>
    <div id="rail-foot">schema v2 · lineage pt<br>offline · one key · zero network</div>
  </nav>
  <main id="view" role="main"></main>
</div>

<div id="modal-root" hidden></div>
<div id="flash-root"></div>

<script src="js/store.js"></script>
<script src="js/events.js"></script>
<script src="js/engine.js"></script>
<script src="js/playbooks.js"></script>
<script src="js/ui.js"></script>
<script>
/* Boot registry guard (carried from pt-1 doctrine): every expected module
   must have registered itself. A missing file → fatal banner naming the
   path, data untouched, no half-boot. Plain synchronous scripts: no
   defer/async race by construction. */
(function () {
  var NEED = { store: 'js/store.js', events: 'js/events.js', engine: 'js/engine.js', playbooks: 'js/playbooks.js', ui: 'js/ui.js' };
  var fatal = document.getElementById('boot-fatal');
  var mods = (window.LEADOS && LEADOS._mod) || {};
  var missing = [];
  for (var k in NEED) if (!mods[k]) missing.push(NEED[k]);
  if (missing.length) {
    fatal.hidden = false;
    fatal.innerHTML = '<div class="fatal-box"><h1>LeadOS did not boot</h1>' +
      '<p>Missing module file(s): <code>' + missing.join(', ') + '</code>.</p>' +
      '<p>Your stored data under key <code>leados:data</code> was not touched. Restore the file(s) and reload.</p></div>';
    return;
  }
  LEADOS.ui.boot();
})();
</script>
</body>
</html>
