<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeadOS — Leadership Operating System · v16.0</title>
<style>
/* ============ LeadOS v16 design system — zero-network, system fonts ============ */
:root{
  --bg:#0a0d11; --bg2:#0d1117; --panel:#10151d; --panel2:#131926; --panel3:#0c1017;
  --line:#1d2530; --line2:#283242; --txt:#d8e0ea; --dim:#7d8a99; --faint:#4d5a68;
  --amber:#f0a93f; --amber2:#ffcf7d; --teal:#3fc6ae; --red:#e5645f; --red2:#ff8b84;
  --blue:#6aa9e9; --violet:#a08df2; --green:#4cc483; --pink:#e58bb1;
  --mono:ui-monospace,"SF Mono","Cascadia Code","Roboto Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:10px; --top:52px; --side:216px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{color-scheme:dark}
body{background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:14px;line-height:1.5;
  background-image:radial-gradient(1200px 500px at 80% -10%,rgba(60,90,140,.08),transparent),radial-gradient(900px 400px at -10% 110%,rgba(240,169,63,.05),transparent)}
::selection{background:rgba(240,169,63,.28)}
a{color:var(--blue);text-decoration:none} a:hover{text-decoration:underline}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--txt);background:var(--panel3);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(240,169,63,.12)}
textarea{min-height:74px;resize:vertical}
label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:12px 0 4px}
label:first-child{margin-top:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.dim{color:var(--dim)} .faint{color:var(--faint)} .small{font-size:12px} .xs{font-size:11px}
b,strong{font-weight:600}
h1,h2,h3,h4{font-weight:650;letter-spacing:-.01em}
::-webkit-scrollbar{width:10px;height:10px} ::-webkit-scrollbar-thumb{background:#232c38;border-radius:6px;border:2px solid var(--bg)} ::-webkit-scrollbar-track{background:transparent}
/* ---------- shell ---------- */
#top{position:fixed;inset:0 0 auto 0;height:var(--top);display:flex;align-items:center;gap:12px;padding:0 16px;
  background:rgba(10,13,17,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);z-index:60}
#brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
#brand .mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--amber),#c97f1b);display:grid;place-items:center;color:#16100a;box-shadow:0 0 18px rgba(240,169,63,.35)}
#saveState{margin-left:auto;display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--dim);white-space:nowrap}
#saveState.bad{color:var(--red2);font-weight:700}
#quota{width:110px;height:4px;background:var(--line);border-radius:3px;overflow:hidden}
#quota i{display:block;height:100%;background:var(--teal);width:0}
#quota.hot i{background:var(--red)}
#capWrap{flex:0 1 460px;position:relative}
#cap{background:var(--panel3);border-radius:9px;padding:7px 12px 7px 32px;font-size:13px}
#capWrap svg{position:absolute;left:9px;top:8px;opacity:.5}
.tbtn{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--line2);border-radius:8px;background:var(--panel);font-size:12px;font-weight:600;white-space:nowrap;transition:.15s}
.tbtn:hover{border-color:var(--amber);color:var(--amber2)}
.tbtn.warm{background:rgba(240,169,63,.12);border-color:rgba(240,169,63,.4);color:var(--amber2)}
.tbtn.danger{border-color:rgba(229,100,95,.5);color:var(--red2)}
#side{position:fixed;top:var(--top);left:0;bottom:0;width:var(--side);overflow-y:auto;padding:14px 10px;border-right:1px solid var(--line);background:var(--bg2)}
.navG{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:14px 10px 6px}
.navG:first-child{margin-top:0}
.navI{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;color:var(--dim);font-size:13px;cursor:pointer;border:1px solid transparent;position:relative}
.navI:hover{color:var(--txt);background:var(--panel)}
.navI.on{color:var(--amber2);background:rgba(240,169,63,.09);border-color:rgba(240,169,63,.25)}
.navI.on::before{content:"";position:absolute;left:-10px;top:6px;bottom:6px;width:3px;border-radius:2px;background:var(--amber)}
.navI .k{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--faint)}
.navI .dot{margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red)}
#main{margin-left:var(--side);padding:76px 26px 90px;min-height:100vh}
.wrap{max-width:1180px;margin:0 auto}
/* ---------- primitives ---------- */
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rowb{display:flex;gap:10px;align-items:center;justify-content:space-between}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1000px){.g3,.g4{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}}
.card{background:linear-gradient(180deg,var(--panel),var(--panel3));border:1px solid var(--line);border-radius:var(--r);padding:16px;position:relative}
.card.red{border-color:rgba(229,100,95,.45);box-shadow:inset 0 0 0 1px rgba(229,100,95,.12),0 0 24px rgba(229,100,95,.05)}
.card.amber{border-color:rgba(240,169,63,.4)}
.card.green{border-color:rgba(76,196,131,.4)}
.hline{height:1px;background:var(--line);margin:12px -16px}
.lbl{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);margin-bottom:8px;font-weight:700}
.big{font-size:26px;font-weight:700;letter-spacing:-.02em}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:650;padding:2px 8px;border-radius:20px;border:1px solid var(--line2);color:var(--dim);white-space:nowrap}
.chip.r{color:var(--red2);border-color:rgba(229,100,95,.5);background:rgba(229,100,95,.08)}
.chip.a{color:var(--amber2);border-color:rgba(240,169,63,.45);background:rgba(240,169,63,.09)}
.chip.g{color:#7fe0ae;border-color:rgba(76,196,131,.45);background:rgba(76,196,131,.08)}
.chip.b{color:#9ec7f2;border-color:rgba(106,169,233,.45);background:rgba(106,169,233,.08)}
.chip.v{color:#c3b8f8;border-color:rgba(160,141,242,.5);background:rgba(160,141,242,.1)}
.chip.t{color:#8fe3d4;border-color:rgba(63,198,174,.45);background:rgba(63,198,174,.08)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:9px;border:1px solid var(--line2);background:var(--panel2);font-weight:650;font-size:13px;transition:.15s;cursor:pointer}
.btn:hover{border-color:var(--amber);color:var(--amber2);transform:translateY(-1px)}
.btn.pri{background:linear-gradient(135deg,var(--amber),#d18d22);color:#181006;border-color:transparent}
.btn.pri:hover{color:#181006;box-shadow:0 4px 18px rgba(240,169,63,.35)}
.btn.dng{border-color:rgba(229,100,95,.55);color:var(--red2)}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 10px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
table.tb{width:100%;border-collapse:collapse;font-size:13px}
table.tb th{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
table.tb td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.tb tr:last-child td{border-bottom:none}
table.tb tr.clk{cursor:pointer} table.tb tr.clk:hover td{background:rgba(240,169,63,.04)}
.empty{padding:26px;text-align:center;color:var(--faint);font-style:italic;border:1px dashed var(--line2);border-radius:var(--r)}
.meter{height:6px;background:var(--line);border-radius:4px;overflow:hidden;min-width:60px}
.meter i{display:block;height:100%;border-radius:4px;background:var(--teal)}
.noteBar{font-size:11px;color:var(--faint);border-top:1px dashed var(--line);margin-top:10px;padding-top:8px}
.kbd{font-family:var(--mono);font-size:10px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--dim);background:var(--panel3)}
.sevDot{width:9px;height:9px;border-radius:3px;display:inline-block}
.tl{position:relative;padding-left:20px}
.tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl .ev{position:relative;padding:0 0 14px}
.tl .ev::before{content:"";position:absolute;left:-18px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--panel2);border:2px solid var(--amber)}
.tl .ev.dim::before{border-color:var(--line2)}
.sparkbox{display:flex;align-items:flex-end;gap:2px;height:30px}
.sparkbox i{flex:1;background:rgba(63,198,174,.5);border-radius:2px 2px 0 0;min-height:2px}
.sparkbox i.est{background:transparent;border-bottom:2px dashed rgba(63,198,174,.6);height:2px!important}
/* runway + heatmap + ninebox */
.runway{height:5px;border-radius:3px;background:var(--line);position:relative;overflow:hidden}
.runway i{position:absolute;inset:0 auto 0 0;border-radius:3px}
.heat{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.heat b{aspect-ratio:1.3;border-radius:5px;display:grid;place-items:center;font-size:10px;font-family:var(--mono);color:#0d0a06;cursor:default;position:relative}
.nine{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.nine button{aspect-ratio:1.5;border:1px solid var(--line);border-radius:7px;background:var(--panel3);color:var(--faint);font-size:10px;transition:.12s}
.nine button:hover{border-color:var(--amber)}
.nine button.on{background:rgba(240,169,63,.18);border-color:var(--amber);color:var(--amber2);font-weight:700}
/* modal / palette / toast */
#modalRoot{position:fixed;inset:0;z-index:90;display:none}
#modalRoot.on{display:grid;place-items:center;background:rgba(5,7,10,.72);backdrop-filter:blur(4px)}
.modal{width:min(720px,94vw);max-height:88vh;overflow-y:auto;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line2);border-radius:14px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:mIn .18s ease-out}
.modal.wide{width:min(900px,96vw)}
@keyframes mIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
#palRoot{position:fixed;inset:0;z-index:95;display:none;background:rgba(5,7,10,.6)}
#palRoot.on{display:block}
.pal{width:min(620px,92vw);margin:9vh auto 0;background:var(--panel2);border:1px solid var(--line2);border-radius:14px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.pal input{border:none;border-radius:0;background:transparent;padding:15px 18px;font-size:15px;border-bottom:1px solid var(--line)}
.pal input:focus{box-shadow:none;border-color:var(--line)}
.palList{max-height:52vh;overflow-y:auto;padding:6px}
.palI{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:8px;cursor:pointer;color:var(--dim)}
.palI.sel{background:rgba(240,169,63,.12);color:var(--txt);box-shadow:inset 2px 0 0 var(--amber)}
#toasts{position:fixed;right:18px;bottom:18px;z-index:120;display:flex;flex-direction:column;gap:8px;max-width:380px}
.toast{background:var(--panel2);border:1px solid var(--line2);border-left:3px solid var(--amber);padding:11px 14px;border-radius:10px;font-size:13px;box-shadow:0 12px 34px rgba(0,0,0,.5);animation:tIn .22s ease-out}
.toast.bad{border-left-color:var(--red)} .toast.good{border-left-color:var(--green)}
@keyframes tIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
/* boot + recovery */
#boot{position:fixed;inset:0;z-index:200;background:var(--bg);display:grid;place-items:center;transition:opacity .4s}
#boot.off{opacity:0;pointer-events:none}
.bootBox{width:min(520px,90vw);font-family:var(--mono);font-size:12px;color:var(--dim)}
.bootBox .ln{opacity:0;animation:bLn .3s forwards}
@keyframes bLn{to{opacity:1}}
#recov{position:fixed;inset:0;z-index:210;background:var(--bg);display:none;place-items:center}
#recov.on{display:grid}
/* nbm */
.nbm{border:1px solid rgba(240,169,63,.5);background:linear-gradient(135deg,rgba(240,169,63,.1),rgba(240,169,63,.02) 60%),var(--panel);border-radius:12px;padding:18px}
.rank{font-family:var(--mono);font-size:11px;color:var(--amber2);background:rgba(240,169,63,.1);border:1px dashed rgba(240,169,63,.35);border-radius:8px;padding:8px 10px;margin-top:10px}
.pace{display:flex;gap:3px}
.pace b{flex:1;height:26px;border-radius:4px;background:var(--panel3);border:1px solid var(--line);display:grid;place-items:center;font-size:10px;font-family:var(--mono);color:var(--faint)}
.pace b.hot{background:rgba(229,100,95,.15);border-color:rgba(229,100,95,.5);color:var(--red2)}
.pace b.warm{background:rgba(240,169,63,.12);border-color:rgba(240,169,63,.4);color:var(--amber2)}
.basis{font-size:11px;color:var(--dim);background:var(--panel3);border:1px solid var(--line);border-radius:7px;padding:6px 9px;margin-top:5px;font-family:var(--mono)}
.banner{border:1px solid rgba(229,100,95,.55);background:rgba(229,100,95,.08);border-radius:10px;padding:12px 16px;margin-bottom:16px;display:flex;gap:10px;align-items:center}
.banner .cb{margin-left:auto}
.pill-row{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:10px;font-family:var(--mono);color:var(--faint);border:1px solid var(--line);padding:1px 6px;border-radius:4px}
.growGrid{display:grid;grid-template-columns:64px 1fr;gap:8px 12px;align-items:start}
.growGrid b{font-size:11px;color:var(--amber2);letter-spacing:.08em;padding-top:7px}
.ladder{display:flex;gap:4px}
.ladder i{flex:1;height:8px;border-radius:3px;background:var(--line)}
.printOnly{display:none}
@media print{
  body{background:#fff;color:#111} #side,#top,#toasts,#palRoot,#modalRoot,.noPrint{display:none!important}
  #main{margin:0;padding:0} .card,.nbm{border-color:#ccc;background:#fff;color:#111;box-shadow:none}
  .printOnly{display:block} .dim,.faint,.lbl,.tag,.basis,.rank{color:#444}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
@media(max-width:860px){#side{display:none} #main{margin-left:0}}
</style>
</head>
<body>
<div id="boot"><div class="bootBox">
  <div style="color:var(--amber);font-weight:700;margin-bottom:10px">LEADOS v16.0 — boot sequence</div>
  <div class="ln" style="animation-delay:.05s">· storage lineage ............ <span id="b1">leados.v6</span></div>
  <div class="ln" style="animation-delay:.18s">· record version ............. <span id="b2">—</span></div>
  <div class="ln" style="animation-delay:.31s">· migrations ................. <span id="b3">checking</span></div>
  <div class="ln" style="animation-delay:.44s">· integrity sweep ............ <span id="b4">queued</span></div>
  <div class="ln" style="animation-delay:.57s">· rule engine ................ <span id="b5">queued</span></div>
  <div class="ln" style="animation-delay:.70s">· self-test wall ............. <span id="b6">queued</span></div>
</div></div>
<div id="recov"></div>

<header id="top">
  <div id="brand"><span class="mark"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg></span>LeadOS <span class="xs faint mono" id="verTag">v16.0</span></div>
  <button class="tbtn warm" id="topCase" title="Register a case (C)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Case</button>
  <div id="capWrap"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input id="cap" placeholder="capture: case: … · praise: @name … · owe: @name … by +3 · win: …  ( / for palette )" autocomplete="off"></div>
  <div id="saveState">—</div>

</header>

<nav id="side"></nav>
<main id="main"><div class="wrap" id="view"></div></main>

<div id="modalRoot"></div>
<div id="palRoot"><div class="pal"><input id="palIn" placeholder="type to filter — routes, actions, verbs" autocomplete="off"><div class="palList" id="palList"></div></div></div>
<div id="toasts"></div>

<script>
(function(){
'use strict';
/* =====================================================================
   LeadOS v16.0 — single-file leadership operating system
   Sections: utils · icons · schema+migrations · storage(cross-corrupt/quota)
   · bus+ledger · FW models · ENG engine · RULES · NBM · AUDITS · TESTS
   · VIEWS · MODALS · FORMS · ACT · capture · palette · keys · boot
   ===================================================================== */

/* ---------------- utils ---------------- */
var $=function(q,r){return (r||document).querySelector(q)};
var $$=function(q,r){return Array.prototype.slice.call((r||document).querySelectorAll(q))};
var DAY=864e5;
function pad(n){return (n<10?'0':'')+n}
function iso(d){d=d||new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return iso(new Date())}
function dFrom(s){var p=String(s||'').split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function addD(s,n){return iso(new Date(dFrom(s).getTime()+n*DAY))}
function days(a,b){return Math.round((dFrom(b||today())-dFrom(a))/DAY)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(p){return (p||'x')+'_'+Date.now().toString(36)+'_'+Math.floor(Math.random()*46656).toString(36)}
function clamp(n,a,b){return Math.max(a,Math.min(b,n))}
function avg(a){a=a.filter(function(x){return typeof x==='number'&&!isNaN(x)});return a.length?a.reduce(function(x,y){return x+y},0)/a.length:0}
function sum(a){return a.reduce(function(x,y){return x+y},0)}
function pl(n,w){return n+' '+w+(n===1?'':'s')}
function ago(d){var n=days(d);return n===0?'today':n===1?'yesterday':n+'d ago'}
function dl(raw){var b=new Blob([raw],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='leados-export-'+today()+'.json';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},400)}

/* ---------------- icons (inline lucide-style strokes) ---------------- */
function ic(n,s){s=s||16;return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none">'+(IC[n]||IC.dot)+'</svg>'}
var IC={
today:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>',
signal:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
cases:'<path d="m12 2 9 5-9 5-9-5 9-5z"/><path d="m3 12 9 5 9-5"/><path d="m3 17 9 5 9-5"/>',
people:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.2 3.4-5 6.5-5s5.7 1.8 6.5 5"/><circle cx="17.5" cy="9" r="2.5"/><path d="M16 14.6c2.8.2 4.8 1.9 5.5 4.9"/>',
oneonones:'<path d="M21 12a8 8 0 0 1-8 8H4l2-3a8 8 0 1 1 15-5z"/><path d="M9 11h6M9 14h3"/>',
feedback:'<path d="M4 5h16v11H9l-5 4V5z"/><path d="M12 8v4M12 14.5v.01"/>',
goals:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
decisions:'<path d="M6 3v6a6 6 0 0 0 12 0V3"/><path d="M6 3h12"/><circle cx="12" cy="18" r="3"/>',
handoffs:'<path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/>',
risks:'<path d="M12 3 2.5 20h19L12 3z"/><path d="M12 10v4M12 17v.01"/>',

};
function migrate(x){
 if(!x||typeof x!=='object'||Array.isArray(x))return {err:'not a LeadOS record'};
 var v=+x.v||1;
 if(v>RV)return {err:'newer',v:v};
 var s=JSON.parse(JSON.stringify(x)), steps=[];
 for(var i=v+1;i<=RV;i++){if(MIG[i]){s=MIG[i](s);steps.push('v'+(i-1)+'→v'+i)}}
 s.v=RV;
 s=guard(s);
 if(steps.length)syslogOn(s,'migration: '+steps.join(' · ')+' (additive; no record rewritten)');
 return {s:s,steps:steps};
}
function syslogOn(s,txt){s.log=s.log||[];s.log.push({d:today(),t:new Date().toTimeString().slice(0,5),txt:txt});if(s.log.length>600)s.log=s.log.slice(-600)}
function syslog(txt){syslogOn(S,txt)}

/* ---------------- storage: corrupt side-key · newer hold · quota ---------------- */
/* pure recovery decision — side-effect free so the self-test wall can execute it */
function parseRecord(raw){
 if(raw==null)return {first:true};
 var x;try{x=JSON.parse(raw)}catch(e){return {recov:'corrupt'}}
 if(x&&typeof x==='object'&&+x.v>RV)return {recov:'newer',v:+x.v};
 var m=migrate(x);
 if(m.err==='newer')return {recov:'newer',v:m.v};
 if(m.err)return {recov:'corrupt'};
 return {s:m.s,steps:m.steps};
}
function load(){
 var raw=null;try{raw=localStorage.getItem(KEY)}catch(e){}
 var r=parseRecord(raw);
 if(r.recov==='corrupt'&&raw!=null){try{localStorage.setItem(KEY+'.corrupt-'+Date.now(),raw)}catch(e){}}
 return r;
}
function byteSize(){try{var r=localStorage.getItem(KEY);return r?new Blob([r]).size:0}catch(e){return 0}}
function save(){
 if(__TM||RECOVERY)return;
 try{
   localStorage.setItem(KEY,JSON.stringify(S));
   WRITE_FAIL=false;
 }catch(e){
   WRITE_FAIL=true;syslog('WRITE FAILED: quota or storage error — export NOW, then prune (#/data)');
 }
 renderSave();
}
function renderSave(){
 var el=$('#saveState');if(!el)return;
 var b=byteSize(),kb=(b/1024).toFixed(1),pcs=Math.min(100,Math.round(b/(5*1024*1024)*100));
 var q=$('#quota');if(q){q.firstElementChild.style.width=pcs+'%';q.classList.toggle('hot',pcs>70);q.title='≈'+(b/1024).toFixed(0)+' KB of ≈5 MB ('+pcs+'%)'}
 if(WRITE_FAIL){el.className='bad';el.innerHTML='WRITE FAILED · '+kb+' KB — export now (#/data), then prune';return}
 el.className='';el.textContent='saved '+new Date().toTimeString().slice(0,5)+' · '+kb+' KB';
}

 runRitual:function(id,heldNote){var r=find('rituals',id);if(!r)return {err:'gone'};r.lastRun=today();if(heldNote)r.lastNote=heldNote;syslog('ritual held: '+r.name);BUS.emit('ritual',{id:id});return {r:r}},
 movePerson:function(pid,tid){var p=person(pid);if(!p||!team(tid))return {err:'invalid move'};var from=p.teamId;p.teamId=tid;

 listen:function(pid,done,note){var l=S.transition.listen.find(function(x){return x.pid===pid});if(!l){l={pid:pid,done:false,note:''};S.transition.listen.push(l)}

 taskDone:function(id,on){var t=find('tasks',id);if(!t)return;if(t.unsnoozable&&t.src==='ethics'&&on===false)return;t.done=on===undefined?!t.done:!!on;save();render()},
 snoozeRule:function(id,until){S.snoozes=S.snoozes.filter(function(s){return s.ruleId!==id});S.snoozes.push({ruleId:id,until:until});syslog('rule snoozed: '+id+' until '+until);BUS.emit('signal',{})},
 unsnooze:function(id){S.snoozes=S.snoozes.filter(function(s){return s.ruleId!==id});BUS.emit('signal',{})}

/* ---------------- advisory sweep (boot-time machine arm) ---------------- */
function sweepFeedback(silent){
 var out=[];
 S.feedback.forEach(function(f){
   if(f.kind==='correction'&&f.delivered&&!f.verifyState&&f.verifyAt&&days(f.verifyAt)>7&&!f.lapsedCaseId){
     var res=ENG.registerCase({title:'Feedback breakdown: correction did not land for '+pname(f.personId),type:'feedback-gap',sev:3,personId:f.personId,notes:'Automatically opened: correction delivered '+f.delivered+' lapsed its +21d verification plus 7-day grace. The arm only fires once per correction.'},true);
     if(res.c){f.lapsedCaseId=res.c.id;out.push(res.c.id);if(!silent)toast('Verification lapsed → feedback-gap case opened for '+pname(f.personId),'bad')}
   }
 });
 return out;
}
function sweepVerifies(){var n=0;S.cases.forEach(function(c){if(c.status==='closed'&&c.verifyState==='pending'&&c.verifyAt&&c.verifyAt<=today())n++});return n}

/* ---------------- RULES (advisory engine) ---------------- */
/* band: lock (unsnoozable) | adv | pos(positive lane). f(S) -> false | {sev:1..5, txt, route} */
var RULES=[];
function R(id,band,why,clear,f){RULES.push({id:id,band:band,why:why,clear:clear,f:f})}
function rstate(){S.snoozes=S.snoozes.filter(function(s){return s.until>=today()});return RULES.map(function(r){var hit=null;try{hit=r.f(S)}catch(e){hit={sev:1,txt:'rule fault: '+e.message,route:'#/signal'}}
  var sn=S.snoozes.find(function(s){return s.ruleId===id0(r)});function id0(x){return x.id}
  return {r:r,hit:hit,snoozed:sn?sn.until:null}})}
function firing(){return rstate().filter(function(x){return x.hit&&!x.snoozed})}
  R('escalation-open','lock','A sealed ethics escalation is the one record that outranks everything; leaving it open-and-unattended is how leaders lose the room permanently.','Clears when no sealed case sits without its HR task completed.',function(s){var bad=s.cases.filter(function(c){return c.sealed&&c.status==='open'&&s.tasks.some(function(t){return t.caseId===c.id&&t.src==='ethics'&&!t.done})});return bad.length?{sev:5,txt:pl(bad.length,'sealed escalation')+' awaiting HR contact — today, in person or voice',route:'#/cases'}:false});
  R('hr-task-due','lock','The HR-contact task is dated today and unsnoozable on purpose: the only failure mode that matters here is delay.','Clears when every ethics wire task is done.',function(s){var t=s.tasks.filter(function(t){return t.src==='ethics'&&!t.done&&!t.cancelNote});return t.length?{sev:5,txt:'HR contact task outstanding ('+pl(t.length,'wire')+') — the machine wrote exactly four wires for a reason',route:'#/today'}:false});
  R('integrity-fault','lock','If writes fail, every other instrument is reading fiction. Trust in the tool is the product.','Clears when localStorage accepts writes again.',function(s){return WRITE_FAIL?{sev:5,txt:'localStorage write failed — export now, then prune (#/data)',route:'#/data'}:false});

  R('sla-near','adv','The day before breach is the last cheap moment to move.','Clears when nothing sits ≤1 day from breach.',function(s){var n=s.cases.filter(function(c){return c.status==='open'&&!c.sealed&&FW.slaRun(c).left===0||FW.slaRun(c).left===1&&c.status==='open'&&!c.sealed}).length;return n?{sev:2,txt:pl(n,'case')+' within one day of SLA breach',route:'#/cases'}:false});
  R('verify-due','adv','Closure without verification is hope. The +30d check is what separates "handled" from "fixed".','Clears when no closed case awaits its verification verdict.',function(s){var n=s.cases.filter(function(c){return c.status==='closed'&&c.verifyState==='pending'&&c.verifyAt&&c.verifyAt<=today()}).length;return n?{sev:3,txt:pl(n,'closed case')+' waiting for the held/re-open verdict',route:'#/cases'}:false});
  R('aar-due','adv','Sev≥4 without an after-action review means the org paid for the lesson and declined to collect it.','Clears 14 days after closure if the AAR exists.',function(s){var bad=s.cases.filter(function(c){return c.sev>=4&&c.status==='closed'&&!c.aar&&days(c.closedAt||today())<=14});return bad.length?{sev:3,txt:pl(bad.length,'sev≥4 case')+' owes an AAR',route:'#/cases'}:false});

  R('session-planned','adv','A 1:1 with no next date is a goodbye in slow motion.','Clears when every report had a conduit within 21 days or has something dated ahead with you.',function(s){var bad=s.people.filter(function(p){var had=s.sessions.some(function(x){return x.personId===p.id&&days(x.at)<=21});var planned=s.tasks.some(function(t){return !t.done&&!t.cancelNote&&(t.personId===p.id||t.src==='case')&&t.due>=today()});return !had&&!planned});return bad.length?{sev:1,txt:pl(bad.length,'report')+' with no recent conduit and nothing dated ahead',route:'#/oneonones'}:false});
  R('feedback-ageing','adv','Praise older than 48h and corrections older than 72h lose most of their effect — delivery latency is the whole game.','Clears when the draft queue is empty or freshly written.',function(s){var old=s.feedback.filter(function(f){return !f.delivered&&days(f.at)> (f.kind==='praise'?2:3)});return old.length?{sev:3,txt:pl(old.length,'draft')+' going stale — oldest: '+ago(old.sort(function(a,b){return a.at<b.at?-1:1})[0].at),route:'#/feedback'}:false});
  R('balance-skew','adv','Correction-only climates read as threat; threat kills the candor you need for real signal.','Clears at ≥1 praise per 3 corrections over the trailing 30d with n≥6.',function(s){var f=s.feedback.filter(function(x){return x.at>addD(today(),-30)});if(f.length<6)return false;var pr=f.filter(function(x){return x.kind==='praise'}).length,co=f.length-pr;return co>=3&&pr*3<co?{sev:2,txt:'Feedback climate: '+pr+' praise vs '+co+' corrections in 30d (n='+f.length+')',route:'#/feedback'}:false});
  R('goal-stale','adv','A goal without a check-in in 14 days is a wish wearing a spreadsheet.','Clears when every active goal has a check-in ≤14d.',function(s){var bad=s.goals.filter(function(g){return g.status==='active'&&(!g.checkins.length||days(g.checkins[g.checkins.length-1].d)>14)});return bad.length?{sev:2,txt:pl(bad.length,'goal')+' without a check-in in 14d',route:'#/goals'}:false});
  R('goal-confidence','adv','Confidence is the leading indicator — the number moves after belief does.','Clears when no goal drops ≥2 confidence points across its last two check-ins.',function(s){var bad=s.goals.filter(function(g){var c=g.checkins;return g.status==='active'&&c.length>=2&&c[c.length-2].conf-c[c.length-1].conf>=2});return bad.length?{sev:3,txt:'Confidence falling: '+bad.map(function(g){return '"'+g.title.slice(0,26)+'"'}).join(', '),route:'#/goals'}:false});
  R('goal-expired','adv','Expired goals left open teach the org that deadlines are theater.','Clears when every past-due goal is graded with a causal lesson.',function(s){var bad=s.goals.filter(function(g){return g.status==='active'&&g.due<today()});return bad.length?{sev:3,txt:pl(bad.length,'goal')+' past due and ungraded',route:'#/goals'}:false});
  R('decision-overdue','adv','An unmade decision is still a decision — usually the worst available one.','Clears when no open decision sits past its by-date.',function(s){var bad=s.decisions.filter(function(d){return d.status==='open'&&d.by<today()});return bad.length?{sev:3,txt:pl(bad.length,'decision')+' past its by-date',route:'#/decisions'}:false});
  R('premortem-missing','adv','Type-1 doors do not reopen; the premortem is the price of the hinge.','Clears when every open type-1 decision has ≥3 premortem entries.',function(s){var bad=s.decisions.filter(function(d){return d.status==='open'&&d.door===1&&(d.premortem||[]).length<3});return bad.length?{sev:4,txt:pl(bad.length,'type-1 door')+' without a ≥3-entry premortem',route:'#/decisions'}:false});
  R('redate-pattern','adv','Two re-dates with reasons is honesty; three is avoidance with paperwork.','Clears when no decision carries ≥3 re-dates while still open.',function(s){var bad=s.decisions.filter(function(d){return d.status==='open'&&(d.redate||[]).length>=3});return bad.length?{sev:2,txt:'Re-date pattern: "'+bad[0].title.slice(0,40)+'" moved '+bad[0].redate.length+'×',route:'#/decisions'}:false});
  R('handoff-silent','adv','Silence on an offered handoff is cross-team debt accruing interest in the dark.','Clears when no offer sits unacknowledged >5 days.',function(s){var bad=s.handoffs.filter(function(h){return h.status==='offered'&&days(h.created)>5});return bad.length?{sev:3,txt:pl(bad.length,'silent handoff')+' (>5d unacknowledged)',route:'#/handoffs'}:false});
  R('handoff-stale','adv','Accepted past its date is debt with a name on it — yours, if you let it slide.','Clears when accepted work is done or renegotiated before need-by.',function(s){var bad=s.handoffs.filter(function(h){return h.status==='accepted'&&h.needBy<today()});return bad.length?{sev:3,txt:pl(bad.length,'accepted handoff')+' past need-by',route:'#/handoffs'}:false});

  R('risk-unowned','adv','An unowned risk is owned by whoever gets blamed — usually you.','Clears when every open risk has an owner.',function(s){var bad=s.risks.filter(function(r){return r.status==='open'&&!r.ownerId});return bad.length?{sev:4,txt:pl(bad.length,'risk')+' with no owner',route:'#/risks'}:false});
  R('risk-exposure','adv','Exposure ≥9 with not one completed mitigation is naked risk, by arithmetic.','Clears when every high-exposure risk has ≥1 done mitigation.',function(s){var bad=s.risks.filter(function(r){return r.status==='open'&&r.p*r.i>=9&&!r.mits.some(function(m){return m.done})});return bad.length?{sev:4,txt:pl(bad.length,'risk')+' at exposure ≥9 with zero completed mitigations',route:'#/risks'}:false});
  R('seat-vacant','adv','Critical seats without a "now" name are the org\'s single-threaded failure modes.','Clears when every seat with criticality ≥4 has a now-band slate entry.',function(s){var bad=s.seats.filter(function(x){return x.crit>=4&&!x.slates.some(function(sl){return sl.band==='now'})});return bad.length?{sev:4,txt:pl(bad.length,'critical seat')+' without a now-ready name',route:'#/talent'}:false});
  R('promo-stale','adv','A promotion case that ages without new evidence becomes a story people tell instead of a decision.','Clears when every open promotion case gained evidence or sponsorship in 14d.',function(s){var bad=s.promos.filter(function(p){return p.status==='open'&&days(p.created)>14});return bad.length?{sev:2,txt:pl(bad.length,'promotion case')+' idle >14d',route:'#/promote'}:false});
  R('delegate-floor','adv','If the average authority you hand out is ≤2.5, you are a bottleneck with a calendar. Delegation is a skill ladder, not a switch.','Clears when average delegation level >2.5 across active delegations with n≥4.',function(s){var a=s.delegations.filter(function(d){return d.status==='active'});return a.length>=4&&avg(a.map(function(d){return d.level}))<=2.5?{sev:3,txt:'Delegation floor: average authority '+avg(a.map(function(d){return d.level})).toFixed(1)+'/5 across '+a.length+' active items',route:'#/delegation'}:false});
  R('boomerang-open','adv','Work that comes back un-flagged trains you to re-take everything — the exact habit that keeps you from leading leads.','Clears when no delegation shows an unhandled return in the last 3 days.',function(s){var b=s.tasks.filter(function(t){return t.src&&t.src.indexOf('delegation:')===0&&t.title.indexOf('BOOMERANG')===0&&!t.done});return b.length?{sev:3,txt:pl(b.length,'boomerang')+' waiting for a re-brief or coaching move',route:'#/delegation'}:false});

  R('health-low','adv','Team health dims below 2.4/5 predict delivery trouble 4–6 weeks out — the cheapest intervention window you get.','Clears when no team pulse shows any dim <2.4 in the last 30d.',function(s){var bad=s.teams.filter(function(t){var h=FW.health(t.id);return h.dims&&(h.age===null||h.age<=30)&&Object.keys(h.dims).some(function(k){return h.dims[k]<2.4})});return bad.length?{sev:3,txt:'Health alert: '+bad.map(function(t){return t.name}).join(', '),route:'#/health'}:false});
  R('health-stale','adv','Health instruments older than 30 days are archaeology, not telemetry.','Clears when every team has a pulse ≤30d old.',function(s){var bad=s.teams.filter(function(t){var h=FW.health(t.id);return !h.last||h.age>30});return bad.length?{sev:1,txt:pl(bad.length,'team')+' without a health pulse in 30d',route:'#/health'}:false});
  R('transition-drift','adv','The first 90 days set the narrative; drifting past them without visible wins locks you in as "the observer".','Clears when (day≤90 ∧ listening tour ≥80% ∧ ≥2 early wins) or day<60.',function(s){var ph=FW.phase(s.identity.started);if(!ph||ph.d<60)return false;var lt=s.transition.listen;var done=lt.filter(function(l){return l.done}).length;var cov=lt.length?done/lt.length:0;return (ph.d>90&&s.transition.wins.length<2)||(ph.d>=60&&cov<0.8)?{sev:2,txt:'Transition drift: day '+ph.d+', tour '+Math.round(cov*100)+'%, '+pl(s.transition.wins.length,'early win')+' logged',route:'#/transition'}:false});

/* ---------------- NBM — Next Best Move with printed ranking ---------------- */
function nbm(){
  var cands=[];
  S.cases.filter(function(c){return c.status==='open'&&FW.slaRun(c).breach&&!c.sealed}).forEach(function(c){cands.push({score:40+c.sev*10,txt:'SLA breach: "'+c.title.slice(0,50)+'" — '+pl(-FW.slaRun(c).left,'day')+' past its '+c.sla+'d runway',why:'breach(40) + severity '+c.sev+'×10',route:'#/case/'+c.id,verb:'Work it'})});
  S.tasks.filter(function(t){return !t.done&&!t.cancelNote&&t.due<today()&&t.src!=='ethics'}).forEach(function(t){cands.push({score:30+clamp(days(t.due),0,10),txt:'Your overdue debt: "'+t.title.slice(0,50)+'" ('+ago(t.due)+')',why:'your-debt(30) + age '+clamp(days(t.due),0,10),route:'#/today',verb:'Clear it'})});

/* ---------------- capture grammar ---------------- */
function parseVerbDate(rest){var by=null;var m=rest.match(/\s+by\s+(today|tomorrow|\+\d+d?|next week|\d{4}-\d{2}-\d{2})\s*$/i);if(m){var w=m[1].toLowerCase();by=w==='today'?today():w==='tomorrow'?addD(today(),1):w==='next week'?addD(today(),7):w.charAt(0)==='+'?addD(today(),parseInt(w.slice(1))):w;rest=rest.slice(0,m.index)}return {text:rest.trim(),by:by}}
function findName(raw){var n=raw.replace(/^@/,'').toLowerCase();var hits=S.people.filter(function(p){return p.name.toLowerCase().indexOf(n)===0||p.name.split(' ')[0].toLowerCase()===n});if(hits.length>1)toast('Name collision "'+raw+'" — using '+hits[0].name+' (first match), audibly','');return hits[0]||null}
function CAPTURE(line){
 var raw=(line||'').trim();if(!raw)return {err:'empty'};
 var mi=raw.match(/^(\w+):\s*(.+)$/s);
 if(!mi){caseIntake({title:raw});return {err:'no verb — opened case intake prefilled',intake:true}}
 var verb=mi[1].toLowerCase(),body=mi[2].trim();
 function personPart(){var m2=body.match(/^(@\S+)\s+(.+)$/s);if(!m2)return {err:'@name required after '+verb+':'};var p=findName(m2[1]);if(!p)return {err:'no person matches '+m2[1]};return {p:p,rest:m2[2]}}
 switch(verb){
  case 'case':{caseIntake({title:body});return {intake:true}}
  case 'commit':case 'owe':{var pp=personPart();if(pp.err)return pp;var pd=parseVerbDate(pp.rest);if(!pd.by)return {err:'no parseable date — nothing written (try: by today / tomorrow / +3 / YYYY-MM-DD)'};if(!pd.text)return {err:'no commitment text — nothing written'};
    S.tasks.push({id:uid('t'),title:(verb==='commit'?'Commitment to ':'Follow up on debt owed by ')+pname(pp.p.id)+': '+pd.text.slice(0,60),due:pd.by,done:false,src:verb=== 'commit'?'commitment:to':'commitment:from',personId:pp.p.id,created:today()});save();render();return {ok:'debt ledgered ('+pd.by+') — both directions show on #/today, yours first'}}
  case 'praise':{var q=personPart();if(q.err)return q;var r=ENG.addFeedback(q.p.id,'praise','via quick capture '+today(),q.rest,'impact to be written in the draft before delivery — sharpen it on the feedback board');
    if(r.err)return {err:'capture sharpened into intake: '+r.err};return {ok:'praise drafted for '+pname(q.p.id)+' — 48h clock started; sharpen S/B/I before delivery'}}
  case 'note':{var q2=personPart();if(q2.err)return q2;var r2=ENG.addNote(q2.p.id,q2.rest,'capture');return r2.err?{err:r2.err}:{ok:'noted on '+pname(q2.p.id)+"'s record"}}
  case 'win':{ENG.win(body);return {ok:'win banked — feeds transition drift + the weekly review'}}
  case 'risk':{openModal(mHead('risk: quick capture','Quick capture does not fabricate a risk — it needs P, I, an owner and an early-warning indicator. Your text is parked below; finish it in the real form.')+'<div class="basis" style="font-family:var(--sans)">captured text: <b>'+esc(body)+'</b></div><div class="row" style="margin-top:10px"><button type="button" class="btn pri sm" data-a="risk-new">open the real form →</button></div>');return {ok:'routing to risk form — nothing written yet'}}
  default:return {err:'unknown verb "'+verb+'" — nothing written; try case:/commit:/owe:/praise:/note:/win:/risk:'}
 }
}

 var el=$('#recov');el.classList.add('on');
 el.innerHTML='<div class="card red" style="width:min(560px,92vw)"><h2>'+(kind==='corrupt'?'Storage corruption detected':'Record is newer than this build')+'</h2>'+
 '<div class="small dim" style="margin:10px 0">'+(kind==='corrupt'?'The bytes at <span class="mono">leados.v6</span> do not parse. They have been preserved untouched at a side key; the main key is still intact. A blank in-memory state has NOT been saved and cannot clobber your data while this screen is up.':
 'The record in storage is v:'+(meta&&meta.v)+' but this build understands up to v:'+RV+'. A silent downgrade is refused — downgrades are how schema corruption happens.')+'</div>'+
 '<div class="grid" style="gap:8px;margin-top:12px">'+
 (kind==='corrupt'?'<button class="btn" id="rvDl">'+ic('down',13)+' Download the damaged bytes (forensics)</button>':'')+
 '<label class="btn" style="cursor:pointer">'+ic('up',13)+' Import a backup (validated, v1–v'+RV+')<input type="file" id="rvImp" accept=".json" style="display:none"></label>'+
 '<button class="btn dng" id="rvClean">Start clean (severs the old record — export first if unsure)</button></div>'+
 '<div class="xs faint" style="margin-top:10px">This gate exists because "the app opened fine" is exactly how silent data loss announces itself.</div></div>';
 if(kind==='corrupt')$('#rvDl').addEventListener('click',function(){try{dl(localStorage.getItem(KEY)||'')}catch(e){}});
 $('#rvClean').addEventListener('click',function(){if(!confirm('Start clean? The old bytes'+(kind==='corrupt'?' remain quarantined at the side key.':' will be REPLACED on next save.')))return;
   if(kind==='newer'){try{localStorage.setItem(KEY+'.superseded-'+Date.now(),localStorage.getItem(KEY)||'')}catch(e){}}
   RECOVERY=null;$('#recov').classList.remove('on');S=guard(blank());syslog('clean start via recovery gate');save();render();toast('Clean record. The old bytes are quarantined at a side key.','good')});
 $('#rvImp').addEventListener('change',function(){if(this.files&&this.files[0])readImport(this.files[0],true)});
}
/* ---------------- import ---------------- */
document.addEventListener('change',function(e){
 if(e.target&&e.target.id==='impFile'&&e.target.files&&e.target.files[0])readImport(e.target.files[0],false);
});
function readImport(file,fromRecov){
 var rd=new FileReader();
 rd.onload=function(){
  var x;try{x=JSON.parse(rd.result)}catch(e){toast('Import refused: not JSON — nothing touched','bad');return}
  var m=migrate(x);
  if(m.err==='newer'){toast('Import refused: record v'+ (x.v||'?') +' is newer than this build (v'+RV+') — refusing the silent downgrade','bad');return}
  if(m.err){toast('Import refused: '+m.err+' — nothing touched','bad');return}
  var doMerge=function(){RECOVERY=null;$('#recov').classList.remove('on');var r=MERGE(x);if(r.err){toast('Merge failed: '+r.err,'bad');return}toast('Merged — every id re-minted, graph rewired through one map, audits re-ran','good');render()};
  var doReplace=function(){RECOVERY=null;$('#recov').classList.remove('on');S=m.s;syslog('import: replace ('+(m.steps&&m.steps.length?'migrated '+m.steps.join(', '):'direct v'+RV)+')');AUDIT_RUN();save();render();toast('Import complete — audits re-ran against the imported record','good')};
  if(fromRecov){doReplace();return}
  openModal(mHead('Import backup','Wrong shapes fail loudly without touching state. Choose the semantics:')+
  '<div class="grid" style="gap:10px"><button class="btn" id="impReplace"><b>Replace</b>&nbsp;— the backup becomes the whole record (safe if this browser is the stray)</button><button class="btn" id="impMerge"><b>Merge</b>&nbsp;— every imported id is re-minted and the graph rewired through one map (people/teams/cases/goals/risks/tasks…) then audits re-run. Use for combining two browsers.</button></div>');
  $('#impReplace').addEventListener('click',function(){closeModal();doReplace()});
  $('#impMerge').addEventListener('click',function(){closeModal();doMerge()});
 };
 rd.readAsText(file);
}

/* ---------------- boot ---------------- */
function boot(){
 var steps=[];
 try{
  $('#b3').textContent='reading';
  var l=load();
  if(l.recov){RECOVERY=l.recov;S=guard(blank());}
  else if(l.first){S=seed();steps.push('first boot → example org seeded');save();}
  else{S=l.s;if(l.steps&&l.steps.length)steps=l.steps;}
 }catch(e){S=guard(blank());RECOVERY='corrupt'}
 $('#b2').textContent='v:'+S.v;
 $('#b3').textContent=steps.length?steps.join(' · '):'none needed';
 $('#b4').textContent='running';AUDIT_RUN();$('#b4').textContent=AUDIT_FAULTS.length?pl(AUDIT_FAULTS.length,'fault')+' (see #/data)':'clean';
 $('#b5').textContent=RULES.length+' rules loaded';
 /* machine arm: verification-lapse sweep, idempotent */
 var opened=sweepFeedback(true);if(opened.length)toast('Verification lapsed → '+pl(opened.length,'feedback-gap case')+' auto-opened (on the record)','bad');
 /* self-test wall at every boot, behind the write-guard */
 var res=runTests();window.__testRes=res;var fails=res.filter(function(r){return !r.ok});
 $('#b6').textContent=fails.length?fails.length+' FAILING':'green ('+res.length+'/'+res.length+')';
 if(fails.length)toast(fails.length+' boot self-tests FAILING — see #/about before trusting this session','bad');
 render();renderSave();
 if(RECOVERY)renderRecov(RECOVERY,window.__recovMeta||{v:undefined});
 setTimeout(function(){var b=$('#boot');if(b){b.classList.add('off');setTimeout(function(){b.remove()},450)}},900);
}
/* stash meta for recovery render */
(function(){var raw=null;try{raw=localStorage.getItem(KEY)}catch(e){}
 if(raw){try{var x=JSON.parse(raw);if(x&&+x.v>RV)window.__recovMeta={v:+x.v}}catch(e){}}})();
boot();
})();
</script>
</body>
</html>
