<div id="toastRoot" class="fixed bottom-5 right-5 flex flex-col gap-2 z-50"></div>

<script>
/* =========================================================================
   LEADOS — single-file vanilla build. Part 5: Long-term memory + leverage
   comparison, layered on the sensory (Part 3) + working-memory (Part 4)
   modules from the prior parts of this same build.

   PROVENANCE, SHORT VERSION (full ledger in AI-SESSION-LOG.md and the
   in-app Provenance / About route):
   - This session fetched github.com/wbweve/Leados directly: repo metadata
     via api.github.com/repos/wbweve/Leados (VERIFIED real/public repo),
     the root git tree (VERIFIED dozens of files, mostly .tsx, far more
     than "three files"), and the raw contents of index.html, README.md
     and AI-SESSION-LOG.md via two independent methods (raw.githubusercontent.com
     and the GitHub Contents API's base64 blob).
   - Those two independent fetches of index.html AGREE with each other but
     CONTRADICT the upstream repo's own README.md, which claims main's
     index.html is a 14-line Vite/React stub. What this session actually
     received, twice, was a ~37.5KB vanilla single-file app (title
     "LeadOS — Sensory & Memory Build") structurally similar to this one.
     That figure also does not match a THIRD, older claim inside the
     upstream repo's own AI-SESSION-LOG.md of an 86,898-byte file with
     different named constants (DECAY, CORRELATION_WINDOW_DAYS). Three
     mutually-inconsistent descriptions of the same file; none is treated
     as ground truth here beyond what this session verified directly.
   - The "Long-Term Memory" spec given for this part (LEADOS.memory.longTerm,
     P.state.events, P.peopleById, LEADOS.engine.run, playbooks, goals,
     "R103"/"R14" finding IDs) assumes a richer data model than anything
     this session could verify upstream or built in the prior, simpler
     parts of THIS build (plain findings + decisions, no people roster,
     no goals engine, no playbooks). Rather than inventing a fake roster/
     engine to match the pasted spec literally, this build ADAPTS the
     spec's intent (episodic + semantic recall over the real event log)
     to the real, verifiable schema this app actually has. Every adaptation
     is marked ADAPTED below and in the About view.
   ========================================================================= */

const LEADOS = {};

/* ---------------------------------------------------------------------
   CORE: append-only event log, durable in localStorage.
   Nothing derived is stored — every view recomputes via project().
   project() now accepts an optional cutoff timestamp so long-term memory
   can reconstruct "what the org looked like at time T" (episodic context).
--------------------------------------------------------------------- */
LEADOS.core = {
  STORAGE_KEY: 'leados:events',
  DOMAINS: ['people','finance','ops','strategy','legal','product'],

  load() {
    try { return JSON.parse(localStorage.getItem(this.STORAGE_KEY)) || []; }
    catch (e) { return []; }
  },
  save(events) { localStorage.setItem(this.STORAGE_KEY, JSON.stringify(events)); },
  append(event) {
    const events = this.load();
    event.ts = event.ts || Date.now();
    event.seq = events.length;
    events.push(event);
    this.save(events);
    return event;
  },
  wipe() { localStorage.removeItem(this.STORAGE_KEY); },

  seedIfEmpty() {
    if (this.load().length) return;
    const now = Date.now();
    const day = 86400000;
    const seedFindings = [
      { key:'f1', domain:'people',   title:'Two resignations filed same week, same team', severity:5, ageDays:1  },
      { key:'f2', domain:'finance',  title:'Q3 burn 18% over forecast',                    severity:4, ageDays:3  },
      { key:'f3', domain:'ops',      title:'Vendor SLA breach, 3rd time this quarter',     severity:3, ageDays:16 },
      { key:'f4', domain:'strategy', title:'Competitor shipped overlapping feature',       severity:2, ageDays:10 },
      { key:'f5', domain:'legal',    title:'Contract renewal clause ambiguous',            severity:3, ageDays:14 },
      { key:'f6', domain:'product',  title:'Churn tick-up in enterprise tier',             severity:4, ageDays:2  },
      { key:'f7', domain:'people',   title:'Manager skip-level flags burnout on infra pod',severity:3, ageDays:8  },
    ];
    seedFindings.forEach(f => {
      this.append({ type:'finding.created', key:f.key, domain:f.domain, title:f.title, severity:f.severity, ts: now - f.ageDays*day });
    });
    // seed a couple of resolutions so resolution-rate memory has signal
    this.append({ type:'finding.resolved', key:'f3', ts: now - 2*day });
    this.append({ type:'finding.dismissed', key:'f4', ts: now - 4*day });
    // seed decisions, one tagged with a person (people-domain only, ADAPTED field)
    this.append({ type:'decision.logged', domain:'people', impact:3, reversibility:'reversible', person:'Dana K.', note:'Approved retention bonus for lead engineer', ts: now - 5*day });
    this.append({ type:'decision.logged', domain:'finance', impact:2, reversibility:'reversible', note:'Delayed non-critical vendor renewal to next quarter', ts: now - 9*day });
    this.append({ type:'decision.logged', domain:'people', impact:4, reversibility:'irreversible', person:'Dana K.', note:'Restructured infra pod reporting line', ts: now - 20*day });
  },

  // project(uptoTs): pure function, events -> current-state view, optionally
  // frozen at a point in time. Recomputed on every render / every recall.
  project(uptoTs) {
    const all = this.load();
    const events = uptoTs ? all.filter(e => e.ts <= uptoTs) : all;
    const findings = new Map();
    const decisions = [];
    const effortByKey = {};
    for (const e of events) {
      if (e.type === 'finding.created') {
        findings.set(e.key, { key:e.key, domain:e.domain, title:e.title, severity:e.severity, createdTs:e.ts, status:'open' });
      } else if (e.type === 'finding.snoozed' && findings.has(e.key)) {
        findings.get(e.key).status = 'snoozed';
      } else if (e.type === 'finding.dismissed' && findings.has(e.key)) {
        findings.get(e.key).status = 'dismissed';
      } else if (e.type === 'finding.resolved' && findings.has(e.key)) {
        findings.get(e.key).status = 'resolved';
      } else if (e.type === 'finding.effort_logged') {
        effortByKey[e.key] = e.effort;
      } else if (e.type === 'decision.logged') {
        decisions.push(e);
      }
    }
    return { events, findings: [...findings.values()], decisions, effortByKey };
  },

  // resolve a domain for ANY event in the log, incl. ones that only carry a key
  domainOf(event, findingsByKey) {
    if (event.domain) return event.domain;
    if (event.key && findingsByKey[event.key]) return findingsByKey[event.key].domain;
    return null;
  }
};

/* ---------------------------------------------------------------------
   HAPTICS — Web Vibration API, secondary confirmation channel only,
   never the sole carrier of information. Off by default. 3s fatigue
   guard enforced in code (principle -> literal runtime rule).
--------------------------------------------------------------------- */
LEADOS.haptics = {
  PATTERNS: {
    SUCCESS: [50,50,50], WARNING: [100,50,100], CRITICAL: [200,100,100,100,200],
    REJECTION: [300], NAVIGATION: [20], CONFIRMATION: [40,30,40],
    RESOLUTION: [30,20,50,20,100], DISMISSAL: [80,30,50,30,20],
  },
  _lastFire: 0,
  _enabled: localStorage.getItem('leados:haptics') === '1',
  play(name) {
    const pattern = this.PATTERNS[name];
    if (!pattern || !navigator.vibrate || !this._enabled) return;
    const now = Date.now();
    if (now - this._lastFire < 3000) return; // ADDED: fatigue guard, literally enforced
    this._lastFire = now;
    navigator.vibrate(pattern);
  },
  onEvent(eventType) {
    const map = {
      'form.submit.success':'SUCCESS', 'form.submit.error':'REJECTION',
      'finding.critical_new':'CRITICAL', 'finding.resolved':'RESOLUTION',
      'finding.dismissed':'DISMISSAL', 'finding.snoozed':'CONFIRMATION',
      'nav.change':'NAVIGATION', 'toast.warning':'WARNING',
    };
    this.play(map[eventType]);
  },
  setEnabled(v) { this._enabled = v; localStorage.setItem('leados:haptics', v ? '1':'0'); syncSensoryTags(); }
};

/* ---------------------------------------------------------------------
   AUDIO — pure Web Audio synthesis, no files. Off by default.
   Session-scoped cap of 3 distinct sounds enforced in code.
--------------------------------------------------------------------- */
LEADOS.audio = {
  _enabled: localStorage.getItem('leados:audio') === '1',
  ctx: null,
  init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
  tone(freq, dur, opts={}) {
    if (!this.ctx) return;
    const { volume=0.1, type='sine' } = opts;
    const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
    osc.type = type; osc.frequency.value = freq;
    gain.gain.setValueAtTime(volume, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + dur);
    osc.connect(gain).connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + dur);
  },
  SUCCESS() { [523.25,659.25,783.99].forEach((f,i)=>setTimeout(()=>this.tone(f,0.15,{volume:0.12}), i*60)); },
  WARNING() { this.tone(220,0.2,{volume:0.1}); setTimeout(()=>this.tone(311.13,0.2,{volume:0.1}),0); },
  CRITICAL() { [0,300,600].forEach(d=>setTimeout(()=>this.tone(80,0.25,{volume:0.2,type:'sawtooth'}), d)); },
  RESOLUTION() { [261.63,329.63,392.00,523.25].forEach((f,i)=>setTimeout(()=>this.tone(f,0.12,{volume:0.1}), i*80)); },
  NAVIGATION() { this.tone(800,0.02,{volume:0.08,type:'square'}); },
  TYPING_FOCUS() { this.tone(1200,0.01,{volume:0.04}); },
  _sessionPlayed() { try { return JSON.parse(sessionStorage.getItem('leados:audio:played')) || []; } catch(e){ return []; } },
  playSemantic(name) {
    if (!this._enabled || typeof this[name] !== 'function') return;
    const played = this._sessionPlayed();
    if (!played.includes(name) && played.length >= 3) { console.info('[audio restraint] 3 sounds already used, skipping', name); return; }
    if (!played.includes(name)) { played.push(name); sessionStorage.setItem('leados:audio:played', JSON.stringify(played)); }
    this[name]();
  },
  setEnabled(v) {
    this._enabled = v; localStorage.setItem('leados:audio', v ? '1':'0');
    if (v && !this.ctx) document.addEventListener('click', () => this.init(), { once:true });
    syncSensoryTags();
  }
};

LEADOS.sensory = {
  EVENT_TO_AUDIO: { 'form.submit.success':'SUCCESS','finding.critical_new':'CRITICAL','finding.resolved':'RESOLUTION','nav.change':'NAVIGATION','toast.warning':'WARNING' },
  fire(eventType) {
    LEADOS.haptics.onEvent(eventType);
    const a = this.EVENT_TO_AUDIO[eventType];
    if (a) LEADOS.audio.playSemantic(a);
  }
};

/* ---------------------------------------------------------------------
   MEMORY — working memory (session layer), per the Part 4 key list.
--------------------------------------------------------------------- */
LEADOS.memory = {
  session: {
    KEYS: { FOCUS:'leados:focus', HISTORY:'leados:nav-history', FAMILIARITY:'leados:familiar',
      FATIGUE:'leados:fatigue', DRAFT:'leados:draft:', SCROLL:'leados:scroll:', FILTERS:'leados:filters',
      PANEL:'leados:panel', SEARCH:'leados:search-hist', ATTENTION:'leados:attention', COMPARE:'leados:compare' },
    get(key) { try { return JSON.parse(sessionStorage.getItem(key)); } catch(e){ return null; } },
    set(key, value) { try { sessionStorage.setItem(key, JSON.stringify(value)); } catch(e){} },
    addToCompare(key) {
      const cur = this.get(this.KEYS.COMPARE) || [];
      if (cur.includes(key)) return;
      if (cur.length >= 2) cur.shift();
      cur.push(key); this.set(this.KEYS.COMPARE, cur);
    },
    removeFromCompare(key) { this.set(this.KEYS.COMPARE, (this.get(this.KEYS.COMPARE)||[]).filter(k=>k!==key)); },
    getComparePair() { return this.get(this.KEYS.COMPARE) || []; },
    pushHistory(route) {
      const h = this.get(this.KEYS.HISTORY) || [];
      h.push({ route, ts: Date.now() });
      while (h.length > 10) h.shift();
      this.set(this.KEYS.HISTORY, h);
    }
  },

  /* ---------------------------------------------------------------------
     LONG-TERM MEMORY — ADAPTED from the pasted Part 5 spec. The spec's
     LEADOS.memory.longTerm assumed P.state.events / P.peopleById /
     LEADOS.engine.run / an OKR-and-playbook knowledge layer. None of that
     exists in this build's verified, simpler schema (plain findings +
     decisions, no people roster, no goals engine). What follows keeps the
     spec's STRUCTURE (episodic recall with context + concurrency; semantic
     recall as domain/temporal/people/resolution patterns) but computes it
     against the real event log instead of a fictional one.
  --------------------------------------------------------------------- */
  longTerm: {
    // EPISODIC: specific events in time — "I remember when..."
    recallEpisodes(query = {}, maxResults = 10) {
      const all = LEADOS.core.load();
      const current = LEADOS.core.project();
      const findingsByKey = Object.fromEntries(current.findings.map(f => [f.key, f]));

      const events = all.filter(ev => {
        if (query.type && ev.type !== query.type) return false;
        if (query.domain && LEADOS.core.domainOf(ev, findingsByKey) !== query.domain) return false;
        if (query.dateRangeDays) {
          const ageDays = (Date.now() - ev.ts) / 86400000;
          if (ageDays > query.dateRangeDays) return false;
        }
        if (query.keywords && query.keywords.length) {
          const text = JSON.stringify(ev).toLowerCase();
          if (!query.keywords.every(kw => text.includes(kw.toLowerCase()))) return false;
        }
        return true;
      });

      return events
        .sort((a,b) => b.ts - a.ts)
        .slice(0, maxResults)
        .map(ev => ({
          event: ev,
          domain: LEADOS.core.domainOf(ev, findingsByKey),
          context: this._getEpisodicContext(ev, all),
          concurrent: all.filter(e => e !== ev && Math.abs(e.ts - ev.ts) <= 3*86400000).slice(0, 4)
        }));
    },

    // What was the organizational state at the moment this event occurred?
    _getEpisodicContext(event, allEvents) {
      const historical = LEADOS.core.project(event.ts);
      const open = historical.findings.filter(f => f.status === 'open').sort((a,b)=>b.severity-a.severity);
      return {
        openFindingsCount: open.length,
        topFinding: open[0] || null,
        decisionsLoggedSoFar: historical.decisions.length,
      };
    },

    // SEMANTIC: patterns and knowledge derived from episodes — "I know that..."
    recallSemanticPatterns() {
      return {
        domainActivity: this._computeDomainActivity(),
        temporalPatterns: this._computeTemporalPatterns(),
        recurringThemes: this._computeThemes(),      // ADAPTED, replaces buildPersonalPatterns (not available)
        subjectFrequency: this._computeSubjectFrequency(), // ADAPTED, replaces peopleFrequency (no people roster exists)
        resolutionRates: this._computeResolutionRates(),   // ADAPTED, replaces crystallizePlaybookEffectiveness
      };
    },

    _computeDomainActivity() {
      const all = LEADOS.core.load();
      const current = LEADOS.core.project();
      const findingsByKey = Object.fromEntries(current.findings.map(f => [f.key, f]));
      const counts = {};
      LEADOS.core.DOMAINS.forEach(d => counts[d] = 0);
      all.forEach(e => { const d = LEADOS.core.domainOf(e, findingsByKey); if (d) counts[d] = (counts[d]||0) + 1; });
      const total = all.length || 1;
      return Object.entries(counts).sort(([,a],[,b]) => b-a)
        .map(([domain,count]) => ({ domain, count, pct: Math.round(count/total*100) }));
    },

    _computeTemporalPatterns() {
      const all = LEADOS.core.load();
      const hourCounts = new Array(24).fill(0);
      all.forEach(e => hourCounts[new Date(e.ts).getHours()]++);
      const total = hourCounts.reduce((a,b)=>a+b,0) || 1;
      const peak = hourCounts.reduce((a,b,i) => b > hourCounts[a] ? i : a, 0);
      return { byHour: hourCounts, peakHour: peak, peakPct: Math.round(hourCounts[peak]/total*100) };
    },

    // ADAPTED: simple keyword frequency over finding titles + decision notes,
    // standing in for the unavailable "buildPersonalPatterns" knowledge module.
    _computeThemes() {
      const all = LEADOS.core.load();
      const stop = new Set(['the','a','an','of','to','in','on','for','and','or','is','this','that','with','same','over','its','was','are']);
      const freq = {};
      all.forEach(e => {
        const text = [e.title, e.note].filter(Boolean).join(' ').toLowerCase();
        text.split(/[^a-z0-9%]+/).forEach(w => {
          if (w.length < 4 || stop.has(w)) return;
          freq[w] = (freq[w]||0) + 1;
        });
      });
      return Object.entries(freq).sort(([,a],[,b])=>b-a).slice(0,8).map(([word,count])=>({word,count}));
    },

    // ADAPTED: this build has no people roster, so "person" is a free-text
    // tag only present on decision.logged events that chose to set one.
    _computeSubjectFrequency() {
      const all = LEADOS.core.load();
      const counts = {};
      all.forEach(e => { if (e.person) counts[e.person] = (counts[e.person]||0) + 1; });
      return Object.entries(counts).sort(([,a],[,b])=>b-a).map(([person,count])=>({person,count}));
    },

    // ADAPTED: resolution rate per domain = resolved / (resolved+dismissed+snoozed+still-open-but-old)
    _computeResolutionRates() {
      const current = LEADOS.core.project();
      const byDomain = {};
      LEADOS.core.DOMAINS.forEach(d => byDomain[d] = { resolved:0, dismissed:0, snoozed:0, open:0, total:0 });
      current.findings.forEach(f => {
        byDomain[f.domain].total++;
        byDomain[f.domain][f.status] = (byDomain[f.domain][f.status]||0) + 1;
      });
      return Object.entries(byDomain).map(([domain, c]) => ({
        domain, ...c,
        resolutionRatePct: c.total ? Math.round(c.resolved / c.total * 100) : null
      }));
    }
  }
};

/* ---------------------------------------------------------------------
   LEVERAGE — original scoring model for the Compare view, answering
   "which should I address first" by more than raw severity. The pasted
   spec DESCRIBES this requirement (leverage, time required, downstream
   impact) but, like the Part 4 compare-mode cutoff before it, does not
   hand over an executable formula — so this formula is a disclosed,
   original fill-in, not a recovered spec.

   score = (severity*2 + domainClusterSize*1.5 + log2(ageDays+1)) / effort
     - severity*2          : raw stated severity, still a real input, just
                             not the only one.
     - domainClusterSize*1.5: downstream impact proxy — how many OTHER open
                             findings share this domain (a symptom of a
                             wider pattern is worth more leverage to fix).
     - log2(ageDays+1)      : time-in-system, diminishing returns (a finding
                             twice as old isn't twice as urgent, but it does
                             matter more than a brand-new one).
     - / effort             : time required. Low=1 / Medium=3 / High=5,
                             user-set per finding via the Compare view and
                             persisted as a 'finding.effort_logged' event
                             (so it becomes part of the durable long-term
                             memory too, not a throwaway UI state).
--------------------------------------------------------------------- */
LEADOS.leverage = {
  EFFORT_LABELS: { 1:'Low', 3:'Medium', 5:'High' },
  score(finding, allOpenFindings, effortByKey) {
    const ageDays = Math.floor((Date.now() - finding.createdTs) / 86400000);
    const clusterSize = allOpenFindings.filter(f => f.domain === finding.domain && f.key !== finding.key).length;
    const severityPart = finding.severity * 2;
    const clusterPart = Math.round(clusterSize * 1.5 * 100) / 100;
    const agePart = Math.round(Math.log2(ageDays + 1) * 100) / 100;
    const effort = effortByKey[finding.key] || 3;
    const rawImpact = severityPart + clusterPart + agePart;
    const score = Math.round((rawImpact / effort) * 100) / 100;
    return { ageDays, clusterSize, severityPart, clusterPart, agePart, effort, rawImpact, score };
  },
  recommend(scoreA, scoreB, titleA, titleB) {
    const hi = scoreA.score >= scoreB.score ? { s: scoreA, t: titleA, other: scoreB } : { s: scoreB, t: titleB, other: scoreA };
    const margin = hi.other.score === 0 ? 1 : Math.abs(scoreA.score - scoreB.score) / Math.max(scoreA.score, scoreB.score);
    if (margin < 0.12) {
      return { tooClose: true, text: `Leverage scores are within ${Math.round(margin*100)}% of each other — too close to call on this formula alone. Use judgment on context not captured here (e.g. a boss's explicit ask, a looming deadline).` };
    }
    const deltas = {
      severity: hi.s.severityPart - hi.other.severityPart,
      cluster: hi.s.clusterPart - hi.other.clusterPart,
      age: hi.s.agePart - hi.other.agePart,
      effort: hi.other.effort - hi.s.effort,
    };
    const topFactor = Object.entries(deltas).sort(([,a],[,b]) => b-a)[0][0];
    const why = {
      severity: 'it is the more severe issue',
      cluster: 'it sits inside a bigger cluster of open issues in the same domain — fixing it likely has downstream effects on the others',
      age: 'it has been open far longer and is overdue',
      effort: 'it is comparatively cheap to address, so you get leverage per unit of time spent',
    }[topFactor];
    return { tooClose:false, winner: hi.t, text: `Address "${hi.t}" first — mainly because ${why}.` };
  }
};

/* =========================================================================
   APP SHELL: router, views, toasts.
   ========================================================================= */
const ROUTES = [
  ['today','Today'], ['domains','Domains'], ['decisions','Decisions'],
  ['compare','Compare'], ['memory','Memory Palace'], ['sensory','Sensory Lab'],
  ['log','Event Log'], ['about','Provenance / About'],
];

function currentRoute() { return (location.hash.replace('#/','') || 'today'); }

function toast(message, kind='info') {
  const el = document.createElement('div');
  const colors = { info:'bg-slate-900', warning:'bg-amber-600', critical:'bg-rose-700', success:'bg-emerald-700' };
  el.className = `toast ${colors[kind]||colors.info} text-white text-sm rounded-lg shadow-lg px-4 py-2.5 max-w-xs`;
  el.textContent = message;
  document.getElementById('toastRoot').appendChild(el);
  if (kind === 'warning') LEADOS.sensory.fire('toast.warning');
  setTimeout(() => { el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 3200);
}

function fmtAge(ts) {
  const d = Math.floor((Date.now()-ts)/86400000);
  return d <= 0 ? 'today' : d === 1 ? '1 day ago' : `${d} days ago`;
}
function sevLabel(s) { return s>=5?'Critical':s===4?'High':s===3?'Medium':'Low'; }
function sevColor(s) { return s>=5?'text-rose-600':s===4?'text-amber-600':'text-slate-500'; }

function renderNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = '';
  ROUTES.forEach(([key,label]) => {
    const btn = document.createElement('button');
    btn.className = 'nav-btn w-full text-left px-3 py-2 rounded-md hover:bg-slate-800 tap-shrink';
    btn.textContent = label;
    btn.onclick = () => { location.hash = '#/' + key; };
    if (currentRoute() === key) btn.classList.add('active');
    nav.appendChild(btn);
  });
}

function render() {
  const route = currentRoute();
  renderNav();
  document.getElementById('routeTitle').textContent = (ROUTES.find(r=>r[0]===route)||[,'Today'])[1];
  LEADOS.memory.session.set(LEADOS.memory.session.KEYS.FOCUS, route);
  LEADOS.memory.session.pushHistory(route);
  LEADOS.sensory.fire('nav.change');
  const view = document.getElementById('view');
  view.classList.remove('fade-in'); void view.offsetWidth; view.classList.add('fade-in');
  const renderers = { today:renderToday, domains:renderDomains, decisions:renderDecisions, compare:renderCompare, memory:renderMemory, sensory:renderSensory, log:renderLog, about:renderAbout };
  (renderers[route] || renderToday)();
  syncSensoryTags();
}

function renderToday() {
  const { findings } = LEADOS.core.project();
  const open = findings.filter(f => f.status === 'open').sort((a,b)=>b.severity-a.severity);
  const compare = LEADOS.memory.session.getComparePair();
  const view = document.getElementById('view');
  view.innerHTML = `
    <p class="text-sm text-slate-500 mb-4">${open.length} open finding${open.length===1?'':'s'} across ${LEADOS.core.DOMAINS.length} domains.</p>
    <div id="findingsGrid" class="space-y-3"></div>`;
  const grid = document.getElementById('findingsGrid');
  if (!open.length) { grid.innerHTML = `<div class="text-slate-400 text-sm italic py-10 text-center">No open findings. Quiet day.</div>`; return; }
  open.forEach(f => {
    const card = document.createElement('div');
    card.className = 'bg-white rounded-xl border border-slate-200 p-4 flex items-start justify-between gap-4 fade-in';
    const inCompare = compare.includes(f.key);
    card.innerHTML = `
      <div class="min-w-0">
        <div class="flex items-center gap-2 text-xs mb-1">
          <span class="uppercase tracking-wide text-slate-400">${f.domain}</span>
          <span class="font-semibold ${sevColor(f.severity)}">${sevLabel(f.severity)}</span>
          <span class="text-slate-400">${fmtAge(f.createdTs)}</span>
        </div>
        <div class="font-medium text-slate-800">${f.title}</div>
      </div>
      <div class="flex flex-col items-end gap-1.5 shrink-0">
        <button data-act="compare" class="tap-shrink text-xs px-2 py-1 rounded-md border ${inCompare?'border-emerald-400 text-emerald-700 bg-emerald-50':'border-slate-300 hover:bg-slate-50'}">${inCompare?'✓ Compare':'+ Compare'}</button>
        <div class="flex gap-1">
          <button data-act="snooze" class="tap-shrink text-[11px] px-2 py-1 rounded-md border border-slate-300 hover:bg-slate-50">Snooze</button>
          <button data-act="dismiss" class="tap-shrink text-[11px] px-2 py-1 rounded-md border border-slate-300 hover:bg-slate-50">Dismiss</button>
          <button data-act="resolve" class="tap-shrink text-[11px] px-2 py-1 rounded-md border border-slate-300 hover:bg-slate-50">Resolve</button>
        </div>
      </div>`;
    card.querySelector('[data-act="snooze"]').onclick = () => { LEADOS.core.append({type:'finding.snoozed', key:f.key}); LEADOS.sensory.fire('finding.snoozed'); toast('Finding snoozed'); renderToday(); };
    card.querySelector('[data-act="dismiss"]').onclick = () => { LEADOS.core.append({type:'finding.dismissed', key:f.key}); LEADOS.sensory.fire('finding.dismissed'); toast('Finding dismissed'); renderToday(); };
    card.querySelector('[data-act="resolve"]').onclick = () => { LEADOS.core.append({type:'finding.resolved', key:f.key}); LEADOS.sensory.fire('finding.resolved'); toast('Finding resolved','success'); renderToday(); };
    card.querySelector('[data-act="compare"]').onclick = () => { inCompare ? LEADOS.memory.session.removeFromCompare(f.key) : LEADOS.memory.session.addToCompare(f.key); renderToday(); };
    grid.appendChild(card);
  });
}

function renderDomains() {
  const { findings } = LEADOS.core.project();
  const open = findings.filter(f => f.status === 'open');
  const view = document.getElementById('view');
  view.innerHTML = `
    <p class="text-sm text-slate-500 mb-4">Heat = sum of open severities in that domain. Original to this build, disclosed — not an upstream formula.</p>
    <div id="domGrid" class="grid grid-cols-2 md:grid-cols-3 gap-3"></div>`;
  const grid = document.getElementById('domGrid');
  LEADOS.core.DOMAINS.forEach(d => {
    const items = open.filter(f => f.domain === d);
    const heat = items.reduce((s,f)=>s+f.severity,0);
    const intensity = Math.min(heat/15, 1);
    const div = document.createElement('div');
    div.className = 'rounded-xl border border-slate-200 p-4 bg-white';
    div.innerHTML = `
      <div class="text-xs uppercase tracking-wide text-slate-400 mb-1">${d}</div>
      <div class="text-2xl font-bold" style="color: rgba(190,18,60,${0.3+intensity*0.7})">${heat}</div>
      <div class="text-xs text-slate-500">${items.length} open · heat score</div>`;
    grid.appendChild(div);
  });
}

function renderDecisions() {
  const { decisions } = LEADOS.core.project();
  const view = document.getElementById('view');
  view.innerHTML = `
    <form id="decForm" class="bg-white rounded-xl border border-slate-200 p-4 mb-6 space-y-3 max-w-xl">
      <div class="grid grid-cols-2 gap-3">
        <select name="domain" id="decDomain" class="border border-slate-300 rounded-md px-2 py-1.5 text-sm">
          ${LEADOS.core.DOMAINS.map(d=>`<option value="${d}">${d}</option>`).join('')}
        </select>
        <select name="impact" class="border border-slate-300 rounded-md px-2 py-1.5 text-sm">
          <option value="1">Impact: Low</option><option value="2">Impact: Medium</option><option value="3" selected>Impact: High</option>
        </select>
      </div>
      <div class="flex gap-4 text-sm">
        <label class="flex items-center gap-1.5"><input type="radio" name="reversibility" value="reversible" checked> Reversible</label>
        <label class="flex items-center gap-1.5"><input type="radio" name="reversibility" value="irreversible"> Irreversible</label>
      </div>
      <div id="personWrap" class="hidden">
        <input name="person" placeholder="Who (optional — adapted field, people domain only)" class="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm">
      </div>
      <textarea name="note" rows="2" placeholder="What did you decide?" class="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm"></textarea>
      <button class="tap-shrink text-sm px-3 py-1.5 rounded-md bg-slate-900 text-white">Log decision</button>
      <p class="text-[11px] text-slate-400">Quadrant thresholds (impact ≥ 3 = "high") are original/fabricated for this build, disclosed rather than presented as a verified upstream rule.</p>
    </form>
    <div id="decList" class="space-y-2"></div>`;
  const personWrap = document.getElementById('personWrap');
  const syncPersonVisibility = () => personWrap.classList.toggle('hidden', document.getElementById('decDomain').value !== 'people');
  document.getElementById('decDomain').onchange = syncPersonVisibility;
  syncPersonVisibility();

  document.getElementById('decForm').onsubmit = (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const note = fd.get('note').trim();
    if (!note) { LEADOS.sensory.fire('form.submit.error'); toast('Decision text is required','critical'); return; }
    const payload = { type:'decision.logged', domain:fd.get('domain'), impact:Number(fd.get('impact')), reversibility:fd.get('reversibility'), note };
    const person = (fd.get('person')||'').trim();
    if (fd.get('domain') === 'people' && person) payload.person = person;
    LEADOS.core.append(payload);
    LEADOS.sensory.fire('form.submit.success'); toast('Decision logged','success');
    e.target.reset(); syncPersonVisibility(); renderDecisions();
  };

  const list = document.getElementById('decList');
  [...decisions].reverse().forEach(d => {
    const impactHigh = d.impact >= 3;
    const quadrant = impactHigh && d.reversibility==='reversible' ? 'Bold Bet' : impactHigh ? 'Point of No Return' : d.reversibility==='reversible' ? 'Quick Call' : 'Caution';
    const stale = (Date.now()-d.ts) > 21*86400000;
    const div = document.createElement('div');
    div.className = 'bg-white rounded-lg border border-slate-200 p-3 text-sm';
    div.innerHTML = `
      <div class="flex items-center gap-2 text-xs mb-1">
        <span class="uppercase text-slate-400">${d.domain}</span>
        <span class="font-semibold text-slate-700">${quadrant}</span>
        ${stale?'<span class="text-amber-600">· stale &gt;21d</span>':''}
        ${d.person?`<span class="text-slate-400">· ${d.person}</span>`:''}
      </div>
      <div>${d.note}</div>
      <div class="text-[11px] text-slate-400 mt-1">${fmtAge(d.ts)}</div>`;
    list.appendChild(div);
  });
}

function renderCompare() {
  const { findings, effortByKey } = LEADOS.core.project();
  const open = findings.filter(f => f.status === 'open');
  const pair = LEADOS.memory.session.getComparePair().map(k => findings.find(f=>f.key===k)).filter(Boolean);
  const view = document.getElementById('view');
  if (pair.length < 2) {
    view.innerHTML = `<div class="text-slate-500 text-sm bg-white border border-slate-200 rounded-xl p-6">
      Select two findings from Today ("+ Compare") to see a leverage-based recommendation.<br>Currently holding: ${pair.length}/2.
    </div>`;
    return;
  }
  const [a,b] = pair;
  const effortBtns = (f) => [1,3,5].map(v => `<button data-effort="${v}" data-key="${f.key}" class="eff-btn tap-shrink text-[11px] px-2 py-1 rounded-md border ${((effortByKey[f.key]||3)===v)?'bg-slate-900 text-white border-slate-900':'border-slate-300 hover:bg-slate-50'}">${LEADOS.leverage.EFFORT_LABELS[v]}</button>`).join('');
  const scoreA = LEADOS.leverage.score(a, open, effortByKey);
  const scoreB = LEADOS.leverage.score(b, open, effortByKey);
  const rec = LEADOS.leverage.recommend(scoreA, scoreB, a.title, b.title);

  const card = (f, s) => `
    <div class="bg-white rounded-xl border border-slate-200 p-4">
      <div class="text-xs uppercase text-slate-400 mb-1">${f.domain}</div>
      <div class="font-medium text-slate-800 mb-2">${f.title}</div>
      <div class="text-xs text-slate-500 mb-2">Severity ${sevLabel(f.severity)} · ${fmtAge(f.createdTs)} · ${s.clusterSize} other open finding(s) in this domain</div>
      <div class="text-xs font-semibold text-slate-600 mb-1">Effort required to address:</div>
      <div class="flex gap-1 mb-3">${effortBtns(f)}</div>
      <table class="w-full text-xs">
        <tr class="text-slate-400"><td>Severity component</td><td class="text-right font-mono">${s.severityPart}</td></tr>
        <tr class="text-slate-400"><td>Downstream cluster component</td><td class="text-right font-mono">${s.clusterPart}</td></tr>
        <tr class="text-slate-400"><td>Time-overdue component</td><td class="text-right font-mono">${s.agePart}</td></tr>
        <tr class="text-slate-500 border-t border-slate-100"><td>÷ effort (${LEADOS.leverage.EFFORT_LABELS[s.effort]})</td><td class="text-right font-mono">${s.effort}</td></tr>
        <tr class="font-bold text-slate-800 border-t border-slate-200"><td>Leverage score</td><td class="text-right font-mono">${s.score}</td></tr>
      </table>
    </div>`;

  view.innerHTML = `
    <div class="mb-4 rounded-xl p-4 ${rec.tooClose?'disclosure':'bg-slate-900 text-white'}">
      <div class="text-sm font-semibold">${rec.tooClose ? 'Too close to call' : 'Recommendation'}</div>
      <div class="text-sm mt-1">${rec.text}</div>
    </div>
    <div class="grid md:grid-cols-2 gap-4">${card(a,scoreA)}${card(b,scoreB)}</div>
    <div class="mt-4 flex items-center justify-between">
      <button id="clearCompare" class="tap-shrink text-xs px-3 py-1.5 rounded-md border border-slate-300 hover:bg-slate-50">Clear comparison</button>
      <p class="text-[11px] text-slate-400 max-w-md text-right">Leverage formula (severity + downstream cluster size + log-scaled age, divided by effort) is an original, disclosed fill-in — the brief describes the <em>goal</em> ("not severity alone") but not an executable formula.</p>
    </div>`;

  view.querySelectorAll('.eff-btn').forEach(btn => {
    btn.onclick = () => {
      LEADOS.core.append({ type:'finding.effort_logged', key:btn.dataset.key, effort:Number(btn.dataset.effort) });
      renderCompare();
    };
  });
  document.getElementById('clearCompare').onclick = () => { LEADOS.memory.session.set(LEADOS.memory.session.KEYS.COMPARE, []); renderCompare(); };
}

function renderLog() {
  const { events } = LEADOS.core.project();
  const view = document.getElementById('view');
  view.innerHTML = `
    <div class="flex gap-2 mb-3">
      <button id="exportBtn" class="tap-shrink text-xs px-3 py-1.5 rounded-md border border-slate-300 hover:bg-slate-50">Export JSON</button>
      <button id="wipeBtn" class="tap-shrink text-xs px-3 py-1.5 rounded-md border border-rose-300 text-rose-600 hover:bg-rose-50">Wipe + reseed</button>
    </div>
    <pre class="bg-slate-900 text-emerald-300 text-[11px] rounded-xl p-4 overflow-auto max-h-[60vh]">${JSON.stringify(events,null,2)}</pre>`;
  document.getElementById('exportBtn').onclick = () => {
    const blob = new Blob([JSON.stringify(events,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a'); link.href=url; link.download='leados-events.json'; link.click();
    URL.revokeObjectURL(url);
  };
  document.getElementById('wipeBtn').onclick = () => { LEADOS.core.wipe(); LEADOS.core.seedIfEmpty(); toast('Event log reset'); renderLog(); };
}

function syncSensoryTags() {
  const h = LEADOS.haptics._enabled, a = LEADOS.audio._enabled;
  document.getElementById('hapticStateTag').textContent = h ? 'ON' : 'off';
  document.getElementById('audioStateTag').textContent = a ? 'ON' : 'off';
  const qh = document.getElementById('quickHaptics'), qa = document.getElementById('quickAudio');
  qh.querySelector('span').textContent = h ? 'on' : 'off';
  qa.querySelector('span').textContent = a ? 'on' : 'off';
}
document.getElementById('quickHaptics').onclick = () => LEADOS.haptics.setEnabled(!LEADOS.haptics._enabled);
document.getElementById('quickAudio').onclick = () => LEADOS.audio.setEnabled(!LEADOS.audio._enabled);

window.addEventListener('hashchange', render);
LEADOS.core.seedIfEmpty();
if (!location.hash) location.hash = '#/today';
render();
</script>
