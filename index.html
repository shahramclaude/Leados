function openCaseIntake(pre){
  pre=pre||{};
  openForm({ title:'Register a case', sub:'classify → route → propagate, one write', wide:true, liveStop:true,
    intro:'Every related module receives this automatically. Preview below shows exactly what will be written — before you commit.',
    fields:[ { key:'type', label:'Type', type:'select', options:CASE_TYPE_ORDER.map(k=>[k,CASE_TYPES[k].label]), value:pre.type||'attrition', required:true },
      { key:'title', label:'Title', type:'text', required:true, ph:'What happened, in one honest sentence', value:pre.title||'' },
      { key:'details', label:'Details', type:'textarea', ph:'Facts, dates, quotes. Write as if read aloud in a grievance process.', value:pre.details||'' },
      { key:'severity', label:'Severity', type:'range', min:1, max:5, value:pre.severity||3, lo:'1 — niggle', hi:'5 — legal-grade', required:true, help:'1 niggle (log & queue) · 2 friction (small blast radius) · 3 material (cost accruing) · 4 critical (key person/team-level, daily attention) · 5 legal-grade (automation hard-stops, HR today)' },
      { key:'personId', label:'Primary person', type:'person', value:pre.personId||'' },
      { key:'teamId', label:'Team', type:'team', value:pre.teamId||'' } ],
    live:v=>{
      const t=CASE_TYPES[v.type]; if(!t) return '';
      let prior='';
      const lastClosed=list('cases').filter(c=>c.type===v.type&&c.status==='closed'&&c.lesson).sort((a,b)=>(a.closedAt||'')>(b.closedAt||'')?-1:1)[0];
      if(lastClosed) prior='<div style="margin-bottom:8px;padding:8px 12px;border-left:3px solid var(--acc);background:var(--acc-dim);border-radius:0 10px 10px 0;font-size:11.5px"><b>LAST TIME THIS TYPE FAILED/CLOSED ('+fmt(lastClosed.closedAt)+'):</b> '+esc(lastClosed.lesson.slice(0,200))+(lastClosed.lesson.length>200?'…':'')+'</div>';
      const sev=parseInt(v.severity)||t.defSev;
      const escT=FW.escalate({ type:v.type, title:v.title, details:v.details, severity:sev });
      const cyn=FW.cynefin({ type:v.type, title:v.title, details:v.details });
      const q=FW.eisenhower({ type:v.type, severity:sev });
      let out='<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">'+chip('CYNEFIN: '+cyn.domain,'info')+chip(q.quadrant, q.quadrant.startsWith('Q1')?'risk':'')+chip('SLA '+FW.sla(sev)+'d → '+fmt(addDays(todayStr(),FW.sla(sev))),'warn')+'</div>'+
        '<div style="font-size:11px;color:var(--faint);font-family:var(--font-m);margin:-2px 0 8px">'+(['','niggle — log and queue','friction — small blast radius','material — cost accruing weekly','CRITICAL — key person / team-level, daily attention','LEGAL-GRADE — automation hard-stops, HR today'])[sev]+'</div>';
      if(escT.hit){ return prior+out+'<b style="color:var(--risk)">ESCALATION — automation will hard-stop.</b><div style="margin-top:4px">'+escT.reasons.map(esc).join('<br>')+'</div><div style="margin-top:6px;color:var(--dim)">Playbook/feedback/routing will NOT run. Only: case record, verbatim evidence, and an HR-contact task. Judgment is entirely yours — with professionals.</div>'; }
      const writes=[]; const rt=t.route;
      writes.push(t.play.length+' dated playbook tasks'); writes.push('evidence entry');
      if(v.personId&&rt.oo) writes.push(rt.oo==='sched'?'1:1 scheduled (or agenda injected)':'agenda item injected');
      if(v.personId&&rt.fb) writes.push((rt.fb==='praise'?'praise':'correction')+' SBI draft');
      if(rt.risk) writes.push('risk-register entry P'+rt.risk[0]+'×I'+rt.risk[1]);
      if(rt.comms) writes.push('comms draft ('+rt.comms+')');
      if(rt.decision&&DECISION_WORTHY.has(v.type)) writes.push('decision record + review gate');
      if(rt.diag) writes.push('4-cause diagnosis record');
      if(rt.adkar) writes.push('ADKAR record');
      if(v.personId&&Object.keys(rt.sig||{}).length) writes.push('signal flags → flight-risk re-score');
      writes.push('journal lesson at closure + 30-day verification');
      return prior+out+'<b style="color:var(--acc2)">Will write to '+writes.length+' modules:</b><div style="margin-top:4px;color:var(--dim)">'+writes.map(w=>'• '+w).join('<br>')+'</div><div style="margin-top:6px;color:var(--faint);font-size:11px">The question this type asks: <i>'+esc(t.ask)+'</i></div>';
    },
    submitLabel:'Register & propagate', submitIcon:'zap',
    onSubmit:v=>{ const r=Engine.createCase({ type:v.type, title:v.title, details:v.details, severity:parseInt(v.severity), personId:v.personId||null, teamId:v.teamId||null });
      if(r.dupe){ toast('Identical open case already exists — entry refused as duplicate.','risk'); return; }
      if(r.escalated){ toast('Escalated: automation stopped at the app\u2019s limits. HR contact task is dated today.','risk'); }
      else toast('Case propagated: '+r.c.ledger.length+' linked writes across modules. Traceable in the ledger.','ok');
      go('/case/'+r.c.id); } });
}

Actions['retro-run']=function(tid){
  const t=get('teams',tid); if(!t) return;
  const members=activePeople().filter(p=>p.teamId===tid);
  const ps=FW.psych(t), dy=FW.dys(t);
  const hint=(ps.assessed?('weakest safety item: \u201c'+ps.items[ps.weakest]+'\u201d ('+t.psych[ps.weakest]+'/7)'):'safety not scanned yet')+' · failing rung: '+DYS_DEFS[dy.weakest][1].toLowerCase();
  const lastR=list('retros').filter(r=>r.teamId===tid).sort((a,b)=>a.date>b.date?-1:1)[0];
  const carried=lastR?(lastR.items||[]).filter(i=>!i.done):[];
  openForm({ title:'Team retro — '+t.name, sub:hint, wide:true,
    intro:'Three columns, honest items, one owner. Action items become dated tasks and travel to the next retro until closed or killed loudly. Doctrine: contributing conditions, never names.'+
      (carried.length?' '+carried.length+' item(s) are being carried from the last retro — killing one is a decision you say out loud.':''),
    fields:[ { key:'stop', label:'STOP — one per line', type:'textarea', ph:'meetings that end without a decision\nslipping deadlines without renegotiating them aloud' },
      { key:'start', label:'START — one per line', type:'textarea', ph:'decision log read aloud at sync close\n5 minutes of open floor after status' },
      { key:'cont', label:'CONTINUE — one per line', type:'textarea', ph:'blameless postmortems\nfriday demo' },
      { key:'ownerId', label:'Owner for the action items', type:'select', options:[{v:'',l:'— unowned (weakest option) —'}].concat(members.map(m=>({v:m.id,l:m.name}))), value:carried.length&&carried[0].ownerId?carried[0].ownerId:'' },
      { key:'days', label:'Action items due in (days)', type:'number', value:14, min:3, max:60 } ],
    live:v=>{ const n=[v.stop,v.start,v.cont].map(x=>String(x||'').split('\n').filter(s=>s.trim()).length).reduce((a,b)=>a+b,0); return n? n+' items total · STOP/START become dated tasks'+(v.ownerId?' owned by '+esc(personName(v.ownerId)):' — unowned action items die quietly')+'.' : 'Three columns; one honest item beats three decorative ones.'; },
    onSubmit:v=>{
      let taskCount=0;
      mut(()=>{
        const items=[];
        [['stop',v.stop],['start',v.start],['cont',v.cont]].forEach(pair=>{ String(pair[1]||'').split('\n').map(s=>s.trim()).filter(Boolean).forEach(text=>items.push({ col:pair[0], text, ownerId:v.ownerId||null, done:false })); });
        const id=uid('rt'); S.retros[id]={ id, teamId:tid, date:todayStr(), items, carried:carried.map(c=>({ col:c.col, text:c.text, ownerId:c.ownerId, done:c.done })), hint };
        const due=addDays(todayStr(),parseInt(v.days)||14);
        items.filter(i=>i.col!=='cont').forEach(i=>{ const tk=addTask({ title:'Retro '+(i.col==='stop'?'STOP':'START')+' ('+t.name+'): '+i.text.slice(0,70), due, personId:i.ownerId, source:'retro' }); i.taskId=tk.id; taskCount++; });
        carried.filter(c=>!c.done).forEach(c=>{ addTask({ title:'Retro carry ('+t.name+'): '+c.text.slice(0,80), due, personId:c.ownerId, source:'retro' }); taskCount++; });
      });
      toast(taskCount+' dated action items created'+(carried.length?(', '+carried.filter(c=>!c.done).length+' carried forward'):'')+'. They close as tasks or they come back.','ok');
    } });
};
Actions['retro-item']=(id,el)=>{ const r=get('retros',id); if(!r) return; const i=parseInt(el.dataset.arg||'-1',10); if(!(r.items&&r.items[i])) return;
  mut(()=>{ const it=r.items[i]; it.done=!it.done;

const PIPE_STAGES=[['sourced','Sourced'],['screen','Screen'],['loop','Loop'],['offer','Offer']];
const PIPE_SCORE_DIMS=[['evidence','Mission evidence — has done the actual job, at scale'],['craft','Craft depth — senior hands, not senior talk'],['leverage','Leverage — multiplies other people (mandatory for lead roles)'],['velocity','Learning velocity — loop speed under feedback'],['disagreement','Disagrees well — friction without poison'],['motivation','Motivation fit — their drivers meet your reality']];
function pipeVerdict(c){
  if(!c.scorecard||!c.scorecard.dims) return null;
  const vals=PIPE_SCORE_DIMS.map(d=>Number(c.scorecard.dims[d[0]])||0).filter(Boolean);
  if(vals.length<6) return null;
  const a=r1(avg(vals));
  return { avg:a, label:a>=3.5?'PURSUE':a>=2.75?'ONE MORE ROUND':'STOP', tone:a>=3.5?'ok':a>=2.75?'warn':'risk' };
}

  const teamLead=activePeople().filter(x=>x.level==='lead'&&x.teamId===c.teamId)[0];
  let newPid=null;
  openForm({ title:'Hire — '+c.name, sub:'one write: person + 30/60/90 ramp + first session', wide:true,
    intro:'Instrumentation from day one: the person record, the ramp plan with dated milestones, and the first 1:1 booked against the start date. A day-one hire should never spend a week socially guessing what "good" means here.',
    fields:[ { key:'name', label:'Full name', type:'text', required:true, value:c.name },
      { key:'role', label:'Role', type:'text', value:c.role||'' },
      { key:'level', label:'Level', type:'select', options:[['associate','Associate / junior'],['mid','Mid'],['senior','Senior'],['lead','Team lead / manager']], value:c.level||'mid' },
      { key:'teamId', label:'Team', type:'team', value:c.teamId||'' },
      { key:'managerId', label:'Reports to', type:'select', options:[{v:'',l:'You (direct report)'}].concat(activePeople().map(x=>({v:x.id,l:x.name+(x.level==='lead'?' (lead)':'')}))), value:teamLead?teamLead.id:'' },
      { key:'salary', label:'Base salary ('+S.settings.currency+')', type:'number', value:S.settings.salaryAvg },
      { key:'start', label:'Start date', type:'date', value:addDays(todayStr(),14), required:true } ],
    submitLabel:'Hire & instrument', submitIcon:'check',
    onSubmit:v=>{
      mut(()=>{ newPid=uid('p');
        S.people[newPid]={ id:newPid, name:v.name, role:v.role, level:v.level, teamId:v.teamId||null, managerId:v.managerId||null, start:v.start, salary:parseFloat(v.salary)||0, motivation:'', criticalFor:[], notes:'Hired via pipeline '+fmt(todayStr())+(pipeVerdict(c)?'; final scorecard '+pipeVerdict(c).avg+'/5':'')+'.', signals:{comp:0,stalled:0,burnout:0,conflict:0,disengaged:0,tenure:0,churn:0,market:3}, trust:null, sl2:{competence:3,commitment:9}, nineBox:null, archived:false, leave:false, frHistory:[] };
        Engine.rampGen(newPid);
        const oo=Engine.scheduleOO(newPid, addDays(v.start,3));
        oo.agenda.push({ id:uid('a'), text:'Day-3 environment check: access, buddy, first small win scoped', source:'ramp', done:false });
        c.status='hired'; c.closedAt=todayStr(); c.hiredPersonId=newPid; });
      toast('Hired: person, ramp plan, and first session minted in one write.','ok');
      if(newPid) setTimeout(()=>go('/person/'+newPid),150);
    } });
};
rule('pipe-stalled', 5, 'plus', 'governance', ()=>{ const l=list('candidates').filter(c=>c.status==='open'&&daysBetween((c.stagesAt||{})[c.stage]||c.created,todayStr())>14); return l.length?{ key:'pst', n:l.length, first:l[0] }:null; },
  ctx=>({ title:ctx.n+' candidate'+(ctx.n>1?'s':'')+' stalled 14d+ in stage', tone:'warn', why:'Oldest: '+ctx.first.name+' ('+ctx.first.stage+'). A stalled pipeline is a reputation: every great candidate is also being evaluated by three faster organizations.', actions:[['Open pipeline','nav','/pipeline']] }), null);

/* ── FEEDBACK — SBI composer, ageing, delivery-to-evidence ───── */
Routes['/feedback']=function(){
  const drafts=list('feedback').filter(f=>f.status==='draft').sort((a,b)=>a.createdAt>b.createdAt?1:-1);
  const delivered=list('feedback').filter(f=>f.status==='delivered').sort((a,b)=>a.deliveredAt>b.deliveredAt?-1:1).slice(0,10);
  return pageHead('Feedback','freshness is half the value · delivery writes to evidence',
    '<button class="btn btn-acc" data-action="newfb" data-id="">'+ic('plus')+'Draft SBI</button>')+
  '<div class="grid g2">'+
  '<div class="card"><div class="card-title">'+ic('clock')+'Drafts ageing<span class="sub">'+drafts.length+' · a 10d-old draft is a leadership confession</span></div>'+
    (drafts.length? drafts.map(f=>{ const age=daysBetween(f.createdAt,todayStr());
      return '<div style="padding:8px 0;border-bottom:1px dashed rgba(36,42,52,.5)"><div style="display:flex;gap:8px;align-items:center">'+chip(f.kind,f.kind==='praise'?'ok':'warn')+'<b style="font-size:12.5px;flex:1">'+esc(personName(f.personId))+'</b>'+chip(age+'d old',age>=7?'risk':age>=3?'warn':'')+'</div>'+
      '<div style="font-size:12px;color:var(--dim);margin:4px 0">S: '+esc(f.s||'—')+'</div>'+
      '<div style="display:flex;gap:6px"><button class="btn btn-sm" data-action="fb-edit" data-id="'+f.id+'">'+ic('pen')+'Edit</button><button class="btn btn-sm btn-acc" data-action="fb-deliver" data-id="'+f.id+'">'+ic('check')+'Mark delivered</button><button class="btn btn-sm btn-ghost" data-action="fb-delete" data-id="'+f.id+'">'+ic('trash')+'</button></div></div>'; }).join('')
    : '<div style="font-size:12.5px;color:var(--faint)">No drafts. Either you are current — or you are avoiding. The avoided-conversation field in the weekly review knows which.</div>')+'</div>'+
  '<div class="card"><div class="card-title">'+ic('scale')+'Balance per person<span class="sub">target zone ≈ 2–5 : 1, delivered 30d</span></div>'+
    activePeople().map(p=>{ const b=FW.feedbackBalance(p.id);
      return '<div style="display:flex;gap:10px;align-items:center;padding:5px 0;border-bottom:1px dashed rgba(36,42,52,.5)"><a href="#/person/'+p.id+'" style="min-width:110px;font-size:12.5px;color:var(--txt)">'+esc(p.name)+'</a><div style="flex:1">'+meter(b.band==='balanced'?100:b.band==='silent'?15:50, b.band==='balanced'?'ok':b.band==='silent'?'risk':'warn')+'</div><div style="font-family:var(--font-m);font-size:11px;color:var(--dim);white-space:nowrap">'+b.praise+':'+b.course+'</div>'+chip(b.band,b.band==='balanced'?'ok':b.band==='silent'?'risk':'warn')+'</div>'; }).join('')+'</div></div>'+
  secH('Delivered','each one also lives in the person\u2019s evidence log')+
  (delivered.length? delivered.map(f=>'<div class="card" style="padding:14px 16px"><div style="display:flex;gap:8px;align-items:center;margin-bottom:6px">'+chip(f.kind,f.kind==='praise'?'ok':'warn')+'<b>'+esc(personName(f.personId))+'</b><span class="tl-date">'+fmtFull(f.deliveredAt)+(f.caseId?' · from case':'')+'</span></div>'+
    '<div class="script-out" style="border:none;background:none;padding:0;font-size:12.5px">In '+esc(f.s)+', you '+esc(f.b)+'. The effect: '+esc(f.i)+'.'+(f.next?'\nGoing forward: '+esc(f.next):'')+'</div></div>').join('')
  : '<div class="card">'+empty('message','Nothing delivered yet','Delivered feedback is the only kind that exists. Drafts are intentions.')+'</div>');
};
function openFeedbackForm(personId, draftId, prefill){
  const f=Object.assign({ kind:'course', s:'', b:'', i:'', next:'' }, prefill||{}, draftId?get('feedback',draftId):{});
  openForm({ title:(draftId?'Edit':'Draft')+' SBI feedback', sub:'adjective-free zone · specifics only', wide:true,
    intro:'Situation → Behavior → Impact, then the ask. Behavior is observable; "careless" is a verdict, "missed the review deadline twice, dated" is behavior.',
    fields:[ { key:'personId', label:'Person', type:'person', required:true, value:personId||f.personId||'' },
      { key:'kind', label:'Kind', type:'select', options:[['praise','Praise / reinforce'],['course','Correction']], value:f.kind||'course' },
      { key:'s', label:'Situation — when / where', type:'text', required:true, value:f.s||'', ph:'Tuesday\u2019s sprint review, in front of both teams' },
      { key:'b', label:'Behavior — observable, no character adjectives', type:'textarea', required:true, value:f.b||'', ph:'you cut Ana off twice when she presented the cost model' },
      { key:'i', label:'Impact — the actual consequence', type:'textarea', required:true, value:f.i||'', ph:'she stopped contributing for the rest of the meeting; the room read it as cost questions being unwelcome' },
      { key:'next', label:'The ask going forward', type:'text', value:f.next||'', ph:'in reviews, let the presenter finish; questions land in the doc' } ],
    live:v=>{ if(!v.s&&!v.b) return ''; return '<div style="font-size:12.5px;line-height:1.7">LIVE PREVIEW — "'+(v.kind==='praise'?'One thing I want to name explicitly: ':'Something I want to address while it\u2019s fresh: ')+'in <b>'+esc(v.s||'…')+'</b>, you <b>'+esc(v.b||'…')+'</b>. The effect was <b>'+esc(v.i||'…')+'</b>.'+(v.next?' Going forward: '+esc(v.next)+'.':'')+'"</div>'; },
    submitLabel:draftId?'Save draft':'Save draft — deliver within 72h',
    onSubmit:v=>{ mut(()=>{ const id=draftId||uid('f');
      S.feedback[id]={ id, personId:v.personId, caseId:draftId?f.caseId:null, kind:v.kind, status:'draft', createdAt:draftId?f.createdAt:todayStr(), deliveredAt:null, s:v.s, b:v.b, i:v.i, next:v.next }; });
      toast((draftId?'Draft updated.':'Draft saved. '+(v.kind==='praise'?'':'Correction freshness decays — deliver within 72 hours.')),'ok'); } });
}
Actions['newfb']=(id)=>openFeedbackForm(id||null);
Actions['fb-edit']=(id)=>openFeedbackForm(null,id);
Actions['ev-praise']=(eid)=>{ const e=get('evidence',eid); if(!e) return; openFeedbackForm(e.personId,null,{ kind:'praise', s:e.text.slice(0,90) }); };
Actions['fb-delete']=(id)=>confirmDlg('Delete draft?','If it was real, it deserves delivery, not deletion.','Delete',()=>mut(()=>{ delete S.feedback[id]; }),true);
Actions['fb-deliver']=(id)=>{ let verifyDue=null;
  mut(()=>{ const f=get('feedback',id); if(!f) return; f.status='delivered'; f.deliveredAt=todayStr();
    const e={ id:uid('e'), personId:f.personId, caseId:f.caseId||null, kind:'feedback', date:todayStr(), text:'Feedback delivered ('+f.kind+'): in '+f.s+' — '+f.b, source:'engine' }; S.evidence[e.id]=e;
    /* corrections get a closure fuse: name-the-change verification, mirroring

/* ── DELEGATION — authority ladder, mismatch, checkpoints ────── */
Routes['/delegation']=function(){
  const act=list('delegations').filter(d=>d.status==='active').sort((a,b)=>a.nextCheckpoint>b.nextCheckpoint?1:-1);
  const done=list('delegations').filter(d=>d.status!=='active').sort((a,b)=>a.created>b.created?-1:1).slice(0,6);
  return pageHead('Delegation','the task is theirs; the level says how much authority rides along',
    '<button class="btn btn-acc" data-action="del-new">'+ic('plus')+'New delegation</button>')+
  '<div class="card" style="margin-bottom:14px"><div style="font-size:12px;color:var(--dim);display:flex;gap:10px;flex-wrap:wrap">'+DEL_LEVELS.map(l=>chip('L'+l[0]+' '+l[1].split(' — ')[0],'info')).join('')+'</div></div>'+
  secH('Active','checkpoints are your half of the contract')+
  (act.length? act.map(d=>{ const p=get('people',d.personId); const m=p?FW.delMatch(p,d.level):null; const overdue=d.nextCheckpoint<todayStr();
    return '<div class="card"><div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">'+(p?avatar(p):'')+'<div style="flex:1;min-width:200px"><b style="font-size:13.5px">'+esc(d.task)+'</b><div style="font-size:11.5px;color:var(--faint);margin-top:2px">'+esc(p?p.name:'—')+' · checkpoint every '+d.cadence+'d · boundaries: '+esc(d.boundaries||'none written (risky)')+'</div></div>'+
      chip('L'+d.level+' '+DEL_LEVELS[d.level-1][1].split('—')[0].trim(), m&&!m.ok?'risk':'info')+(m&&!m.ok?chip('MISMATCH vs '+m.dl,'risk'):'')+(overdue?chip('checkpoint overdue','risk'):chip('check '+fmt(d.nextCheckpoint),''))+
      '<div style="display:flex;gap:6px">'+(m&&!m.ok?'<button class="btn btn-sm btn-acc" data-action="del-relevel" data-id="'+d.id+'">'+ic('refresh')+'Re-level</button>':'')+'<button class="btn btn-sm" data-action="del-check" data-id="'+d.id+'">'+ic('check')+'Checkpoint</button><button class="btn btn-sm" data-action="del-debrief" data-id="'+d.id+'">'+ic('flag')+'Debrief</button></div></div>'+
      (m&&!m.ok?'<div style="margin-top:8px">'+reco('risk',m.actions[0])+'</div>':'')+'</div>'; }).join('')
  : '<div class="card">'+empty('share','Nothing delegated','If everything on your plate is yours, you are the bottleneck you complain about. The wizard matches authority level to readiness.','<button class="btn btn-acc" data-action="del-new">'+ic('plus')+'Delegate something real</button>')+'</div>')+
  (done.length? secH('Debriefed','outcomes classified')+'<div class="card" style="padding:8px 14px">'+done.map(d=>'<div style="display:flex;gap:8px;padding:6px 0;border-bottom:1px dashed rgba(36,42,52,.5);font-size:12.5px;align-items:center">'+chip(d.debrief||'closed', d.debrief==='done well'?'ok':d.debrief?'warn':'')+'<span style="flex:1">'+esc(d.task)+'</span><span class="tl-date">'+fmt(d.created)+'</span></div>').join('')+'</div>':'');
};

/* ── DECISIONS — doors, DACI, premortem gate, calibration ────── */
Routes['/decisions']=function(){
  const open=list('decisions').filter(d=>d.status==='open').sort((a,b)=>a.reviewDate>b.reviewDate?1:-1);
  const reviewed=list('decisions').filter(d=>d.status==='reviewed').sort((a,b)=>a.reviewDate>b.reviewDate?-1:1).slice(0,8);
  const cal=FW.calibration();
  return pageHead('Decision journal','predictions written down or it never happened',
    '<button class="btn btn-acc" data-action="dec-new">'+ic('plus')+'Log decision</button>')+
  '<div class="grid g3" style="margin-bottom:14px">'+
    statCard(open.length,'open decisions',open.filter(d=>d.reviewDate<todayStr()).length+' gates overdue')+
    statCard(cal.value,'calibration (pred−outcome)',cal.bandLabel)+
    statCard(open.filter(d=>d.type==='one-way').length,'one-way doors open', open.filter(d=>d.type==='one-way'&&(!d.premortem||!d.premortem.filter(x=>x.trim()).length)).length+' missing premortem')+
  '</div>'+
  (cal.actions&&cal.actions.length? reco(cal.band==='calibrated'?'ok':'', '<b>Calibration:</b> '+cal.actions[0]):'')+
  secH('Open','review gates force honesty on a date')+
  (open.length? open.map(d=>{ const overdue=d.reviewDate<todayStr(); const noPM=d.type==='one-way'&&(!d.premortem||!d.premortem.filter(x=>x.trim()).length);
    return '<div class="card"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><div style="flex:1;min-width:220px"><b style="font-size:13.5px">'+esc(d.title)+'</b>'+
      '<div style="font-size:11.5px;color:var(--faint);margin-top:2px">'+esc(d.choice||'choice pending')+' · logged '+fmt(d.date)+' · confidence '+d.confidence+'/10'+(d.driver?' · driver '+esc(d.driver):'')+'</div></div>'+
      chip(d.type==='one-way'?'TYPE 1 DOOR':'type 2 door',d.type==='one-way'?'risk':'info')+(noPM?chip('NO PREMORTEM','risk'):'')+(overdue?chip('gate '+daysBetween(d.reviewDate,todayStr())+'d over','risk'):chip('gate '+fmt(d.reviewDate),''))+
      '<button class="btn btn-sm" data-action="dec-redate" data-id="'+d.id+'" title="Re-date with a reason on record">'+ic('calendar')+'</button><button class="btn btn-sm '+(overdue?'btn-acc':'')+'" data-action="dec-review" data-id="'+d.id+'">'+ic('check')+'Review outcome</button></div>'+
      (d.context?'<div style="font-size:12px;color:var(--dim);margin-top:8px;border-top:1px dashed rgba(36,42,52,.5);padding-top:8px">'+esc(d.context)+'</div>':'')+
      (d.options?'<div style="font-size:11.5px;color:var(--faint);margin-top:6px">Rejected: '+esc(d.options)+'</div>':'')+
      (d.premortem&&d.premortem.filter(x=>x.trim()).length?'<div style="margin-top:6px">'+chip('premortem','warn')+'<span style="font-size:11.5px;color:var(--dim)"> '+d.premortem.filter(x=>x.trim()).map(esc).join(' · ')+'</span></div>':'')+
      ((d.consulted||d.informed)?'<div style="font-size:11px;color:var(--faint);margin-top:6px">DACI — approver: '+esc(d.approver||'you')+' · consulted: '+esc(d.consulted||'—')+' · informed: '+esc(d.informed||'—')+'</div>':'')+'</div>'; }).join('')
  : '<div class="card">'+empty('bookmark','No open decisions','Unlogged decisions are how organizations re-decide the same thing quarterly. Log one — the review gate does the teaching.','<button class="btn btn-acc" data-action="dec-new">'+ic('plus')+'Log a decision</button>')+'</div>')+
  secH('Reviewed','predicted vs delivered — the loop')+
  (reviewed.length? '<div class="card" style="padding:6px 14px"><table class="tbl"><thead><tr><th>Decision</th><th>Predicted</th><th>Outcome grade</th><th>Gap</th><th>When</th></tr></thead><tbody>'+reviewed.map(d=>{ const gap=r1(d.confidence/2-d.grade);
    return '<tr><td><b>'+esc(d.title.slice(0,50))+'</b><div style="font-size:11px;color:var(--faint)">'+esc((d.outcome||'').slice(0,80))+'</div></td><td>'+d.confidence+'/10</td><td>'+d.grade+'/5</td><td>'+chip((gap>0?'+':'')+gap, Math.abs(gap)>1?'warn':'ok')+'</td><td class="tl-date">'+fmt(d.reviewDate)+'</td></tr>'; }).join('')+'</tbody></table></div>':'<div class="card">'+empty('scale','No reviews yet','Calibration needs two reviewed decisions. The first gate you hit starts the loop.')+'</div>');
};

function parseKRs(str){
  return String(str||'').split('\n').map(l=>l.split('|').map(s=>s.trim())).filter(x=>x[0]).map(x=>{
    const t=parseFloat(x[1]), c=parseFloat(x[2]);
    const b=(x[3]!==undefined&&x[3]!=='')?parseFloat(x[3]):null;
    const raw=(x[4]||'').toLowerCase();
    const target=isNaN(t)?1:t, current=isNaN(c)?0:c;
    const dir=raw.charAt(0)==='d'?'down':raw.charAt(0)==='u'?'up':(current>target?'down':'up');
    return { text:x[0], target, current, start:(b==null||isNaN(b))?null:b, dir };
  });
}
function krsToText(krs){ return (krs||[]).map(k=>[k.text,k.target,k.current,(k.start==null?'':k.start),k.dir||''].join(' | ')).join('\n'); }

function renderLessonBody(text){
  const lines=text.split('\n'); let out='', inUl=false;
  const fmtInline=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<span class="tk">$1</span>');
  lines.forEach(l=>{
    if(l.startsWith('## ')){ if(inUl){out+='</ul>';inUl=false;} out+='<h4>'+fmtInline(l.slice(3))+'</h4>'; }
    else if(l.startsWith('> ')){ if(inUl){out+='</ul>';inUl=false;} out+='<blockquote>'+fmtInline(l.slice(2))+'</blockquote>'; }
    else if(l.startsWith('- ')){ if(!inUl){out+='<ul>';inUl=true;} out+='<li>'+fmtInline(l.slice(2))+'</li>'; }
    else if(l.trim()===''){ if(inUl){out+='</ul>';inUl=false;} }
    else { if(inUl){out+='</ul>';inUl=false;} out+='<p>'+fmtInline(l)+'</p>'; }
  });
  if(inUl) out+='</ul>';
  return out;
}

function simRun(scId, node, score, picks){
  const sc=SCENARIOS.find(x=>x.id===scId); if(!sc) return;
  if(node==='end'){
    const band=score>=5?'high':score>=3?'mid':'low';
    const prev=S.sims[scId];
    mut(()=>{ S.sims[scId]={ best:Math.max(score, prev?prev.best:0), plays:(prev?prev.plays:0)+1, at:todayStr(), lastBand:band, lastScore:score }; });
    modal(modalHead(sc.title+' — debrief', 'score '+score+' · '+(band==='high'?'exemplary':band==='mid'?'solid, with tuition paid':'costly'))+'<div class="modal-body">'+
    reco(band==='high'?'ok':band==='mid'?'':'risk', sc.verdicts[band])+
    (picks.length?'<div class="card-title" style="margin-top:12px">'+ic('clock')+'Your path</div>'+picks.map(p=>'<div style="font-size:12px;padding:6px 0;border-bottom:1px dashed rgba(36,42,52,.5)">'+chip((p.q>0?'+':'')+p.q, p.q>=2?'ok':p.q>=0?'warn':'risk')+' '+esc(p.t)+'</div>').join(''):'')+
    '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button class="btn" id="sim-arc">'+ic('gradcap')+'Open matching arc</button><button class="btn" id="sim-again">'+ic('refresh')+'Run again</button><button class="btn btn-acc" data-action="modal-close">Close</button></div></div>','wide');
    setTimeout(()=>{ document.getElementById('sim-again').onclick=()=>simRun(scId,'n1',0,[]);
      const ab=document.getElementById('sim-arc'); if(ab) ab.onclick=()=>{ closeModal(); go('/academy/curriculum'); }; },60);
    return;
  }
  const n=sc.nodes[node];
  modal(modalHead(sc.title, sc.tag+' · consequence branching')+'<div class="modal-body">'+
  '<div class="script-out" style="margin-bottom:14px">'+esc(n.text)+'</div><div id="sim-opts">'+
  n.opts.map((o,i)=>'<button class="simopt" data-i="'+i+'">'+esc(o.t)+'</button>').join('')+'</div>'+
  '<div id="sim-fb"></div><div style="display:flex;justify-content:flex-end;margin-top:8px"><button class="btn btn-acc" id="sim-next" style="display:none">'+ic('arrow')+'Continue</button></div></div>','wide');
  let done=false;
  setTimeout(()=>{
    document.querySelectorAll('.simopt').forEach(btn=>btn.onclick=()=>{
      if(done) return; done=true;
      const o=n.opts[parseInt(btn.dataset.i)]; picks.push({ t:o.t, q:o.q });
      document.querySelectorAll('.simopt').forEach(b=>{ b.disabled=true; if(b!==btn) b.style.opacity='.45'; });
      btn.classList.add(o.q>=2?'good':o.q<=0?'bad':'picked');
      document.getElementById('sim-fb').innerHTML='<div class="opt-fb">'+esc(o.fb)+'</div>';
      const nb=document.getElementById('sim-next'); nb.style.display=''; nb.onclick=()=>simRun(scId, o.to, score+o.q, picks);
    });
  },60);
}

const Integrity={
  entityCollections:['people','teams','cases','tasks','oneonones','skips','candidates','feedback','decisions','evidence','delegations','diagnoses','plans','goals','risks','stakeholders','meetings','comms','adkars','journal','retros'],
  _cache:null,
  audit:function(force){
    const stamp=(S.telemetry.writes||0)+':'+(S.telemetry.failedWrites||0)+':'+(S.telemetry.viewErrors||0)+':'+(SAVE_FAIL?1:0);
    if(!force&&this._cache&&this._cache.stamp===stamp) return this._cache.result;
    const checks=[];
    const add=(id,label,status,detail)=>checks.push({id,label,status,detail:detail||''});
    const sample=a=>a.slice(0,4).join(', ')+(a.length>4?' +'+(a.length-4):'');

    const required=this.entityCollections.concat(['lessons','sims','reviews','trends','snoozes','healthTrends']);
    const missing=required.filter(c=>!S[c]||typeof S[c]!=='object'||Array.isArray(S[c]));
    add('schema','State schema & collections',missing.length?'fail':'pass',missing.length?'Missing/invalid: '+sample(missing):required.length+' collections normalized · schema v'+S.v);

    try{ const raw=JSON.stringify(S); const rt=JSON.parse(raw); add('roundtrip','JSON round-trip',rt&&rt.v===S.v?'pass':'fail',Math.round(raw.length/1024)+' KB serialized and parsed'); }
    catch(e){ add('roundtrip','JSON round-trip','fail',e.message); }

    const keyMismatch=[];
    this.entityCollections.forEach(c=>Object.keys(S[c]||{}).forEach(k=>{ const r=S[c][k]; if(r&&r.id&&r.id!==k) keyMismatch.push(c+':'+k+'≠'+r.id); }));
    add('canonical','Collection key = record id',keyMismatch.length?'fail':'pass',keyMismatch.length?sample(keyMismatch):'Every directly addressable record has a canonical key');

    const treeIssues=[], cycles=[];
    list('people').forEach(p=>{
      if(p.managerId&&(!get('people',p.managerId)||p.managerId===p.id)) treeIssues.push(p.name+' → '+p.managerId);
      const seen={}, chain=[]; let cur=p, guard=0;
      while(cur&&cur.managerId&&guard++<100){ if(seen[cur.id]){ cycles.push(chain.concat(cur.name).join(' → ')); break; } seen[cur.id]=1; chain.push(cur.name); cur=get('people',cur.managerId); }
    });
    add('tree','Reporting tree',treeIssues.length||cycles.length?'fail':'pass',(treeIssues.length?'Dangling/self: '+sample(treeIssues)+'. ':'')+(cycles.length?'Cycles: '+sample(cycles):'No dangling managers or cycles'));

    const teamIssues=[];
    [['people','teamId'],['cases','teamId'],['goals','teamId'],['candidates','teamId'],['retros','teamId']].forEach(x=>list(x[0]).forEach(r=>{ if(r[x[1]]&&!get('teams',r[x[1]])) teamIssues.push(x[0]+':'+r.id+' → '+r[x[1]]); }));
    add('teams','Team references',teamIssues.length?'fail':'pass',teamIssues.length?sample(teamIssues):'All team links resolve');

    const personIssues=[];
    ['oneonones','skips','feedback','evidence','delegations','diagnoses','plans'].forEach(c=>list(c).forEach(r=>{ if(r.personId&&!get('people',r.personId)) personIssues.push(c+':'+r.id+' → '+r.personId); }));
    list('tasks').forEach(t=>{ if(t.personId&&!get('people',t.personId)) personIssues.push('tasks:'+t.id+' → '+t.personId); });
    list('cases').forEach(c=>{ if(c.personId&&!get('people',c.personId)) personIssues.push('cases:'+c.id+' → '+c.personId); });
    add('people-links','Person references',personIssues.length?'fail':'pass',personIssues.length?sample(personIssues):'All person links resolve (archived records remain valid)');

    const caseIssues=[];
    list('cases').forEach(c=>{ if(!CASE_TYPES[c.type]) caseIssues.push('unknown type '+c.type+' on '+c.id); });
    ['tasks','feedback','evidence','decisions','risks','comms','diagnoses','adkars'].forEach(coll=>list(coll).forEach(r=>{ if(r.caseId&&!get('cases',r.caseId)) caseIssues.push(coll+':'+r.id+' → '+r.caseId); }));
    add('case-links','Case types & references',caseIssues.length?'fail':'pass',caseIssues.length?sample(caseIssues):'Every case type and downstream caseId resolves');

    const kindMap={task:'tasks',evidence:'evidence',signal:'people',oneonone:'oneonones',agenda:'oneonones',feedback:'feedback',risk:'risks',comms:'comms',decision:'decisions',diagnosis:'diagnoses',adkar:'adkars',journal:'journal'};
    const ledgerIssues=[]; let ledgerN=0;
    list('cases').forEach(c=>(c.ledger||[]).forEach(l=>{ ledgerN++; const target=kindMap[l.kind]; if(target&&!l.prunedAt&&!get(target,l.id)) ledgerIssues.push(c.id+': '+l.kind+' '+l.id); }));
    add('ledger','Propagation ledger targets',ledgerIssues.length?'fail':'pass',ledgerIssues.length?sample(ledgerIssues):ledgerN+' ledger writes resolve or carry an explicit prune stamp');

    const retroIssues=[];
    list('retros').forEach(r=>(r.items||[]).forEach(i=>{ if(i.taskId&&!i.taskPrunedAt){ const t=get('tasks',i.taskId); if(!t) retroIssues.push(r.id+' missing task '+i.taskId); else if(!!t.done!==!!i.done) retroIssues.push(r.id+' state mismatch '+i.taskId); } }));
    add('retro-links','Retro item ↔ task links',retroIssues.length?'fail':'pass',retroIssues.length?sample(retroIssues):'Linked retro actions and tasks agree');

    const hireIssues=[];
    list('candidates').filter(c=>c.status==='hired').forEach(c=>{ if(!c.hiredPersonId||!get('people',c.hiredPersonId)) hireIssues.push(c.name+' → '+(c.hiredPersonId||'no person')); else if(!list('plans').some(p=>p.kind==='ramp'&&p.personId===c.hiredPersonId)) hireIssues.push(c.name+' has no ramp plan'); });
    add('hiring','Hiring cascade',hireIssues.length?'fail':'pass',hireIssues.length?sample(hireIssues):'Every hired candidate resolves to a person with a ramp plan');

    const contentIssues=[];
    Object.keys(CASE_TYPES).forEach(k=>{ const c=CASE_TYPES[k]; if(!c.label||!c.route||!Array.isArray(c.pitfalls)||(!c.esc&&(!Array.isArray(c.play)||!c.play.length))) contentIssues.push('case type '+k); });
    SCRIPTS.forEach(s=>{ if(!s.id||typeof s.tpl!=='function'||!Array.isArray(s.fields)) contentIssues.push('script '+(s.id||'?')); });
    LESSONS.forEach(l=>{ if(!l.id||!l.check||!l.drill) contentIssues.push('lesson '+(l.id||'?')); });
    const routeMissing=[]; NAV.forEach(g=>g[1].forEach(n=>{ if(typeof Routes[n[0]]!=='function') routeMissing.push(n[0]); }));
    contentIssues.push.apply(contentIssues,routeMissing.map(x=>'route '+x));
    add('contracts','Content & route contracts',contentIssues.length?'fail':'pass',contentIssues.length?sample(contentIssues):Object.keys(CASE_TYPES).length+' case types · '+SCRIPTS.length+' scripts · '+LESSONS.length+' lessons · '+SCENARIOS.length+' scenarios · routes wired');

    const modelIssues=[];
    const reduce=FW.krProgress({target:15,current:38,start:52,dir:'down'});
    if(reduce.pct>=100||reduce.pct<=0) modelIssues.push('reduce-KR progress '+reduce.pct+'% (expected partial)');
    if(!FW.escalate({type:'attrition',title:'',details:'',severity:5}).hit) modelIssues.push('severity-5 escalation did not hard-stop');
    if(FW.sla(5)!==1||FW.sla(1)!==21) modelIssues.push('SLA boundary contract changed');
    if(!FW.diagnose({skill:1,will:1,system:9,clarity:2}).mgrOwned) modelIssues.push('system diagnosis did not block coaching');
    if(FW.delMatch({sl2:{competence:9,commitment:9}},1).ok) modelIssues.push('D4/L1 mismatch accepted');
    add('models','Critical model contracts',modelIssues.length?'fail':'pass',modelIssues.length?sample(modelIssues):'Reduce-KR · escalation · SLA · diagnosis gate · delegation mismatch assertions pass');

    const q=quotaInfo();
    add('quota','Storage headroom',q.pct>=95?'fail':q.pct>=85?'warn':'pass',q.pct+'% used · '+Math.round(q.bytes/1024)+' KB; export before pruning');
    add('runtime','Runtime fault history',(SAVE_FAIL||S.telemetry.failedWrites)?'warn':(S.telemetry.viewErrors?'warn':'pass'),(SAVE_FAIL?'WRITE FAILURE ACTIVE · ':'')+(S.telemetry.failedWrites||0)+' failed writes lifetime · '+(S.telemetry.viewErrors||0)+' contained view faults'+(S.telemetry.lastViewError?' · last '+String(S.telemetry.lastViewError).slice(0,70):''));

    const errors=checks.filter(c=>c.status==='fail').length, warnings=checks.filter(c=>c.status==='warn').length;
    const result={at:new Date().toISOString(),errors,warnings,checks,status:errors?'fail':warnings?'warn':'pass'};
    this._cache={stamp,result}; return result;
  },
  repair:function(){
    const fixes=[];
    let rekeys=0;
    this.entityCollections.forEach(c=>Object.keys(S[c]||{}).forEach(k=>{ const r=S[c][k]; if(r&&r.id&&r.id!==k) rekeys++; }));
    migrate();
    if(rekeys) fixes.push('Re-keyed '+rekeys+' record'+(rekeys===1?'':'s')+' to canonical ids');
    list('people').forEach(p=>{
      if(p.managerId&&(!get('people',p.managerId)||p.managerId===p.id)){ fixes.push('Cleared invalid manager on '+p.name); p.managerId=null; }
      const seen={}; let cur=p, guard=0;
      while(cur&&cur.managerId&&guard++<100){ if(seen[cur.id]){ fixes.push('Broke reporting cycle at '+p.name); p.managerId=null; break; } seen[cur.id]=1; cur=get('people',cur.managerId); }
      if(p.teamId&&!get('teams',p.teamId)){ fixes.push('Cleared missing team on '+p.name); p.teamId=null; }
    });
    [['cases','teamId'],['goals','teamId'],['candidates','teamId'],['retros','teamId']].forEach(x=>list(x[0]).forEach(r=>{ if(r[x[1]]&&!get('teams',r[x[1]])){ fixes.push('Cleared missing team on '+x[0]+' '+r.id); r[x[1]]=null; } }));
    list('retros').forEach(r=>(r.items||[]).forEach(i=>{ if(i.taskId&&!i.taskPrunedAt){ const t=get('tasks',i.taskId); if(t&&!!t.done!==!!i.done){ t.done=!!i.done; t.doneAt=i.done?(t.doneAt||todayStr()):null; fixes.push('Reconciled retro task '+i.taskId); } } }));
    return fixes;
  },
  report:function(a){
    const lines=['LEADCORE INTEGRITY AUDIT — '+new Date(a.at).toLocaleString(),'Status: '+a.status.toUpperCase()+' · '+a.errors+' errors · '+a.warnings+' warnings',''];
    a.checks.forEach(c=>lines.push('['+c.status.toUpperCase()+'] '+c.label+' — '+c.detail));
    lines.push('','State version '+S.v+' · '+Object.keys(S.people||{}).length+' people · '+Object.keys(S.cases||{}).length+' cases · '+quotaInfo().pct+'% quota.');
    return lines.join('\n');
  }
};

if(S.settings.lastSeen!==todayStr()){ LAST_SEEN_PREV=S.settings.lastSeen||null; S.settings.lastSeen=todayStr(); }
S.telemetry.booted=(S.telemetry.booted||0)+1; save();
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-action]'); if(!el) return;
  const a=el.dataset.action;
  if(a==='overlay-close'&&el.classList.contains('overlay')){ closeModal(); return; }
  if(el.classList.contains('overlay')) return;
  if(Actions[a]){ e.preventDefault(); Actions[a](el.dataset.id, el); }
});
window.addEventListener('hashchange',()=>render());
document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  if(e.key==='Escape'){ if(document.getElementById('modal-root').innerHTML) closeModal(); return; }
  if((e.key==='k'||e.key==='K')&&(e.metaKey||e.ctrlKey)){ e.preventDefault(); if(!document.getElementById('modal-root').innerHTML) openPalette(); return; }
  if(tag==='input'||tag==='textarea'||tag==='select'||e.target.isContentEditable) return;
  if(document.getElementById('modal-root').innerHTML) return;
  if(e.key==='/'){ e.preventDefault(); openPalette(); return; }
  if(e.key==='c'||e.key==='C'){ e.preventDefault(); openCaseIntake(); }
  const nums={'1':'/today','2':'/inbox','3':'/cases','4':'/people','5':'/teams','6':'/oneonones','7':'/feedback','8':'/decisions','9':'/academy','0':'/review'};
  if(nums[e.key]&&!e.metaKey&&!e.ctrlKey&&!e.altKey) go(nums[e.key]);
});
if(!location.hash) location.hash='#/today';
render();
