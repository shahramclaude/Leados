<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeadOS — Leadership Operating System</title>
<meta name="description" content="Offline-first operating system for a leader of team leads. Vanilla JS, single file, localStorage. No framework, no network, no accounts.">
<style>
:root{
  --bg:#0b0c0f; --bg2:#101218; --panel:#14161d; --panel2:#191c25; --line:#242833; --line2:#2f3442;
  --ink:#e9e7e0; --ink2:#b9bcc4; --mut:#878d99; --dim:#5d636f;
  --amber:#e5a83c; --red:#e0655f; --green:#69b87a; --blue:#6ea3f4; --violet:#a48ef0; --teal:#57b8ab;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --rad:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
::selection{background:rgba(229,168,60,.3)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg2);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:1px solid var(--amber);border-color:var(--amber)}
label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:12px 0 5px}
.mono{font-family:var(--mono)}
.ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
/* layout */
#app{display:grid;grid-template-columns:224px 1fr;min-height:100vh}
#rail{border-right:1px solid var(--line);background:var(--bg2);padding:18px 10px 40px;position:sticky;top:0;height:100vh;overflow-y:auto}
#rail .mark{display:flex;align-items:center;gap:9px;padding:2px 8px 16px;border-bottom:1px solid var(--line);margin-bottom:12px}
#rail .mark b{font-size:15px;letter-spacing:.02em}
#rail .mark span{display:block;font-size:10px;color:var(--mut);letter-spacing:.14em;text-transform:uppercase}
#rail .sec{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);padding:14px 10px 5px}
#rail a{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-size:13px}
#rail a:hover{background:var(--panel2);color:var(--ink)}
#rail a.on{background:var(--panel2);color:var(--amber)}
#rail a .n{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--mut);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:1px 7px}
#rail a .n.hot{color:#0b0c0f;background:var(--amber);border-color:var(--amber)}
#main{min-width:0}
#top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:10px 22px;border-bottom:1px solid var(--line);background:rgba(11,12,15,.88);backdrop-filter:blur(10px)}
#top .crumb{font-size:13px;color:var(--mut)}
#top .crumb b{color:var(--ink)}
#savechip{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--mut);display:flex;align-items:center;gap:6px}
#savechip.bad{color:var(--red)}
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:7px 13px;font-size:13px;color:var(--ink)}
.btn:hover{border-color:var(--dim)}
.btn.pri{background:var(--amber);border-color:var(--amber);color:#141007;font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.dan{color:var(--red);border-color:rgba(224,101,95,.4)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.ghost{border-color:transparent;color:var(--mut)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line2)}
#view{padding:26px 30px 60px;max-width:1180px}
h1{font-size:24px;font-weight:650;letter-spacing:-.01em}
h2{font-size:16px;font-weight:620;margin:0 0 4px}
h3{font-size:13.5px;font-weight:620}
.sub{color:var(--mut);font-size:13px;margin-top:4px;max-width:70ch}
.pagehead{margin-bottom:22px;display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.pagehead .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);padding:16px}
.card.hi{border-color:var(--line2);background:var(--panel2)}
.card.warn{border-color:rgba(224,101,95,.45)}
.card.good{border-color:rgba(105,184,122,.4)}
.card .ch{display:flex;align-items:center;gap:8px;margin-bottom:10px;color:var(--ink2)}
.card .ch .ic{color:var(--mut)}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.mt{margin-top:14px}.mt2{margin-top:22px}.mb{margin-bottom:14px}
.mut{color:var(--mut)}.small{font-size:12px}.tiny{font-size:11px}
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;border:1px solid var(--line2);border-radius:20px;padding:2px 9px;color:var(--ink2);white-space:nowrap}
.chip.rd{color:var(--red);border-color:rgba(224,101,95,.45)}
.chip.gn{color:var(--green);border-color:rgba(105,184,122,.4)}
.chip.am{color:var(--amber);border-color:rgba(229,168,60,.45)}
.chip.bl{color:var(--blue);border-color:rgba(110,163,244,.4)}
.chip.vi{color:var(--violet);border-color:rgba(164,142,240,.4)}
.chip.solid{background:var(--red);border-color:var(--red);color:#170a09;font-weight:700}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.bar{height:6px;background:var(--bg2);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:var(--green)}
.bar.mid i{background:var(--amber)}.bar.bad i{background:var(--red)}
.runway{height:8px;border-radius:6px;background:var(--bg2);position:relative;overflow:hidden}
.runway i{position:absolute;top:0;bottom:0;left:0;border-radius:6px}
.empty{border:1px dashed var(--line2);border-radius:var(--rad);padding:22px;color:var(--mut);font-size:13px;background:rgba(20,22,29,.4)}
.empty b{color:var(--ink2)}
.divider{height:1px;background:var(--line);margin:18px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:13px}
.kv dt{color:var(--mut)}.kv dd{color:var(--ink)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{text-align:left;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:600;padding:7px 10px;border-bottom:1px solid var(--line)}
.t td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.t tr:last-child td{border-bottom:0}
.t tr.click:hover{background:var(--panel2);cursor:pointer}
.list .li{display:flex;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);align-items:flex-start}
.list .li:last-child{border-bottom:0}
.basis{font-size:12px;color:var(--mut);border-left:2px solid var(--line2);padding-left:10px;margin-top:6px}
.whyline{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:6px}
.whyline b{color:var(--mut);font-weight:500}
/* severity */
.sev{font-family:var(--mono);font-size:10.5px;border-radius:5px;padding:1px 7px;font-weight:700}
.s1{background:rgba(110,163,244,.16);color:var(--blue)}.s2{background:rgba(87,184,171,.16);color:var(--teal)}
.s3{background:rgba(229,168,60,.18);color:var(--amber)}.s4,.s5{background:rgba(224,101,95,.18);color:var(--red)}
/* toasts + modal */
#toasts{position:fixed;right:18px;bottom:18px;z-index:90;display:flex;flex-direction:column;gap:8px;max-width:380px}
.toast{background:var(--panel2);border:1px solid var(--line2);border-left:3px solid var(--amber);border-radius:9px;padding:10px 14px;font-size:13px;box-shadow:0 12px 32px rgba(0,0,0,.5);animation:up .25s ease}
.toast.err{border-left-color:var(--red)}.toast.ok{border-left-color:var(--green)}
@keyframes up{from{transform:translateY(8px);opacity:0}}
#mback{position:fixed;inset:0;background:rgba(5,6,8,.7);backdrop-filter:blur(4px);z-index:80;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:6vh 16px}
#mback.open{display:flex}
#modal{background:var(--panel);border:1px solid var(--line2);border-radius:14px;width:min(680px,100%);padding:22px 24px;box-shadow:0 24px 80px rgba(0,0,0,.6)}
#modal.wide{width:min(860px,100%)}
.mhead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.mhead h2{font-size:18px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.preview{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:12.5px;margin-top:14px}
.preview h4{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-bottom:8px}
.preview .li{display:flex;gap:8px;padding:4px 0;align-items:flex-start}
/* capture bar */
#capwrap{position:sticky;bottom:0;z-index:20;margin:26px -30px -60px;padding:14px 30px 18px;background:linear-gradient(transparent,var(--bg) 30%)}
#capture{display:flex;gap:8px;background:var(--panel2);border:1px solid var(--line2);border-radius:12px;padding:10px 12px;align-items:center}
#capture input{border:0;background:transparent;padding:4px 6px}
#capture input:focus{outline:none}
#capture .hint{font-family:var(--mono);font-size:10px;color:var(--dim);white-space:nowrap}
/* palette */
#pal{position:fixed;inset:0;z-index:85;background:rgba(5,6,8,.6);display:none;align-items:flex-start;justify-content:center;padding-top:12vh}
#pal.open{display:flex}
#palbox{width:min(560px,92%);background:var(--panel2);border:1px solid var(--line2);border-radius:14px;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.6)}
#palbox input{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:14px 16px;font-size:15px;background:var(--panel)}
#pallist{max-height:46vh;overflow-y:auto;padding:8px}
#pallist .pi{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:8px;font-size:13px;cursor:pointer;color:var(--ink2)}
#pallist .pi.on,#pallist .pi:hover{background:var(--bg2);color:var(--ink)}
#pallist .pi .tag{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--dim)}
/* ninebox */
.nine{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.nine div{aspect-ratio:2.1;background:var(--bg2);border:1px solid var(--line);border-radius:6px;font-size:10px;color:var(--dim);display:flex;align-items:center;justify-content:center;text-align:center;padding:4px;position:relative}
.nine div.here{border-color:var(--amber);color:var(--amber);background:rgba(229,168,60,.08)}
.nine .ylab{position:absolute;left:4px;top:3px;font-size:8px;opacity:.7}
/* funnel of gates */
.gate{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:8px;background:var(--panel)}
.sig{font-family:var(--mono);font-size:10px;font-weight:700;border-radius:5px;padding:2px 8px}
.sig.live{color:var(--green);background:rgba(105,184,122,.12)}.sig.pend{color:var(--dim);background:var(--bg2)}
/* ledger timeline */
.ledg{position:relative;padding-left:18px}
.ledg:before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:1px;background:var(--line2)}
.ledg .li{position:relative;padding:6px 0 6px 4px;font-size:12.5px}
.ledg .li:before{content:"";position:absolute;left:-16px;top:12px;width:7px;height:7px;border-radius:50%;background:var(--panel);border:2px solid var(--dim)}
.ledg .li.hl:before{border-color:var(--amber)}
/* lane headers on signal */
.lane{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:20px 0 8px;display:flex;align-items:center;gap:8px}
.rulecard{display:flex;gap:12px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:12px 14px;margin-bottom:8px;align-items:flex-start}
.rulecard.firing{border-color:rgba(229,168,60,.5)}
.rulecard.locked{border-color:rgba(224,101,95,.55);background:rgba(224,101,95,.04)}
.rulecard.pos{border-color:rgba(105,184,122,.35)}
.rulecard.clear{opacity:.55}
.spark{display:block}
kbd{font-family:var(--mono);font-size:10.5px;background:var(--bg2);border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--ink2)}
/* meter */
.meter{height:10px;background:var(--bg2);border-radius:6px;overflow:hidden}.meter i{display:block;height:100%;background:var(--green)}
/* brief print */
@media print{
  #rail,#top,#capwrap,#toasts,.no-print{display:none!important}
  #app{display:block}#view{max-width:100%;padding:0}
  body{background:#fff;color:#111}.card{border-color:#ccc;background:#fff}
}
@media(max-width:900px){#app{grid-template-columns:1fr}#rail{display:none}#view{padding:18px}}
</style>
</head>
<body>
<div id="app">
  <nav id="rail"></nav>
  <div id="main">
    <header id="top"></header>
    <main id="view"></main>
  </div>
</div>
<div id="capwrap" style="display:none"><div id="capture"></div></div>
<div id="toasts"></div>
<div id="mback"><div id="modal"></div></div>
<div id="pal"><div id="palbox"><input id="palin" placeholder="Jump to module, person, or command…" autocomplete="off"><div id="pallist"></div></div></div>
<noscript><p style="padding:40px">LeadOS is a client-side application and needs JavaScript. No data ever leaves this browser.</p></noscript>

<script>
'use strict';
/* ============================================================
   LeadOS v12.0 — "the build where code starts matching docs"
   Single file. Vanilla JS. localStorage key leados.v6 (record v:6).
   Layers: U utils -> FW pure models -> RULES/AUDITS/TESTS ->
   STORE (+migrations, quota, corrupt recovery) -> IMPORT/EXPORT ->
   SEED -> ENG write-paths (the case spine) -> VIEWS -> BOOT.
   ============================================================ */

/* ---------- U: utilities ---------- */
const U={
  esc:s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),
  uid:p=>p+'-'+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3),
  pad:n=>String(n).padStart(2,'0'),
  iso(d){return d.getFullYear()+'-'+U.pad(d.getMonth()+1)+'-'+U.pad(d.getDate())},
  today(){return U.iso(new Date())},
  mk(d){const[a,b,c]=String(d).split('-').map(Number);return new Date(a,(b||1)-1,c||1)},
  D(off){const d=new Date();d.setDate(d.getDate()+off);return U.iso(d)},
  days(a,b){return Math.round((U.mk(b)-U.mk(a))/86400000)},
  age(d){return U.days(d,U.today())},
  ago(d){const n=U.age(d);return n<=0?'today':n===1?'yesterday':n+'d ago'},
  inDays(d){const n=U.days(U.today(),d);return n<0?Math.abs(n)+'d overdue':n===0?'today':'in '+n+'d'},
  clamp:(v,a,b)=>Math.max(a,Math.min(b,v)),
  num:(v,f)=>{const n=Number(v);return Number.isFinite(n)?n:f},
  mean:a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:0,
  fmtB:n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(2)+' MB',
  pct:n=>Math.round(n*100)+'%',
};
const $=s=>document.querySelector(s);
const h=html=>{const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstElementChild};

/* ---------- ICONS: inline SVG, lucide geometry, zero network ---------- */
const ICONS={
  zap:'<path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/>',
  radar:'<path d="M12 20h.01"/><path d="M2 8.82a15 15 0 0 1 20 0"/><path d="M5 12.85a10 10 0 0 1 14 0"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/>',
  flag:'<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/>',
  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  user:'<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  layers:'<path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/>',
  msg:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  compass:'<circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>',
  door:'<path d="M18 20V6a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v14"/><path d="M2 20h20"/><path d="M14 12v.01"/>',
  target:'<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
  activity:'<path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"/>',
  clip:'<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M9 12h6"/><path d="M9 16h6"/>',
  cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',
  book:'<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
  scale:'<path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/>',
  warn:'<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  chek2:'<path d="M18 6 7 17l-5-5"/><path d="m22 10-7.5 7.5L13 16"/>',
  clock:'<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
  arrow:'<line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>',
  swap:'<path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/>',
  shield:'<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1 1 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>',
  fire:'<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>',
  db:'<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/>',

    const led=[];let sc=0;
    for(const k of['change','manager','load','growth','recog']){const v=U.clamp(U.num(D[k],0),0,3);if(v>0){const pts=Math.round(v/3*W[k]);sc+=pts;led.push({k,v,pts});}}

  },
  trust(c,r,i,s){ const den=Math.max(1,U.num(s,1));const v=(U.num(c,0)+U.num(r,0)+U.num(i,0))/den;
    const parts={credibility:U.num(c,0),reliability:U.num(r,0),intimacy:U.num(i,0)};const weakest=Object.keys(parts).sort((a,b)=>parts[a]-parts[b])[0];
    const FIXW={credibility:'Close the knowledge gap publicly: present the domain model, admit what you don’t know.','reliability':'Ship three small promises on time in a row. Reliability is streaks, not speeches.','intimacy':'Ask one level deeper in the next 1:1 and stay silent 5 seconds longer.'};

  krScore(kr){ const s=U.num(kr.s,0),t=U.num(kr.tgt,100),c=FW.krCur(kr); if(t===s)return 0;

  krCur(kr){ const ci=(kr.ci||[]);return ci.length?U.num(ci[ci.length-1].v,kr.s):U.num(kr.s,0);},
  conf(kr){ const ci=(kr.ci||[]).filter(x=>U.num(x.c,null)!=null); if(ci.length<2)return null;

  goalSt(g,now){ if(g.st==='done'||g.st==='graded')return{st:g.st,pct:100,why:g.st==='done'?'done':'graded'};

  edm(a){ if(!Array.isArray(a)||a.length!==7)return null;

  slii(sk,wi){ const s=U.clamp(U.num(sk,2),1,4),w=U.clamp(U.num(wi,2),1,4);

  aarQ(a){ let sc=0,miss=[];const hasN=s=>/\d/.test(s||'');

  slope(sessions){ const m=(sessions||[]).filter(s=>s.mood&&!s.estimated).map(s=>({at:s.at,v:(U.num(s.mood.energy,3)+U.num(s.mood.morale,3)+U.num(s.mood.load,3))/3})).sort((a,b)=>a.at<b.at?-1:1);

  cynefin(type,sev,ethics){ if(ethics)return{dom:'EF',move:'Not a leadership case. Sealed wire-set, HR owns the room, today.'};

  eisen(sev,dLeft){ const imp=sev>=3,urg=dLeft<=2; return imp&&urg?{q:'I',l:'Do first'}:imp?{q:'II',l:'Schedule'}:urg?{q:'III',l:'Delegate'}:{q:'IV',l:'Drop'};},
  sla(c,now){ const total=Math.max(1,U.days(c.opened,c.slaDue));const left=U.days(now,c.slaDue);

  fbBal(fbs){ const d=(fbs||[]).filter(f=>f.st==='delivered'&&U.days(f.deliveredAt||'9999',U.today())<=60);

  meetCost(ms){ const y=(ms||[]).filter(m=>!m.verdict||m.verdict!=='kill').reduce((s,m)=>s+U.num(m.min,0),0);

  pace(S,now){ let pts=0;const inp=[];

    for(const d of S.decisions.filter(d=>d.st==='pending'&&U.days(now,d.reviewAt)>3))cross.push({t:'decision',label:`Rotting decision: ${d.title} (${U.days(d.reviewAt,now)}d past review)`,route:'#/decisions'});
    for(const c of S.cases.filter(c=>c.sev>=4&&c.status==='closed'&&c.aarArmed&&!S.aars.find(a=>a.caseId===c.id)))cross.push({t:'tuition',label:`Tuition unpaid: ${c.title} has no AAR`,route:'#/aar'});
    for(const hp of S.handoffs.filter(x=>x.st!=='accepted'&&FW.depAge(x,now).stalled))cross.push({t:'handoff',label:`Stalled handoff: ${hp.what}`,route:'#/handoffs'});
    const pc=S.pulses.filter(p=>!p.teamId).sort((a,b)=>a.at<b.at?1:-1)[0];
    if(pc){for(const k of FW.health(pc).crit)cross.push({t:'pulse',label:`Org pulse critical: ${k}=2 or less`,route:'#/health'});}
    for(const g of S.goals.filter(g=>g.st!=='done'&&g.st!=='graded'&&FW.goalSt(g,now).st==='red'))cross.push({t:'goal',label:`Red goal: ${g.title}`,route:'#/goals'});
    const dev=S.cases.filter(c=>c.status==='closed'&&c.lesson&&!c.studied).sort((a,b)=>a.closedAt<b.closedAt?-1:1)[0]||null;
    return{lines,cross,dev:dev?{caseId:dev.id,title:dev.title,lesson:dev.lesson}:null};},
};

  run:S=>{const seen={},out=[];for(const c of S.cases.filter(c=>c.status==='open')){const k=c.type+'|'+(c.who||'')+'|'+(c.teamId||'');if(seen[k])out.push({msg:'duplicate open '+c.type+' on '+k+' ('+seen[k]+' / '+c.id+')',ref:c.id});else seen[k]=c.id;}return out;}},
 {id:'ethics-wires',name:'Ethics sealed wire-set',desc:'An ethics case may carry only: evidence verbatim, HR task, agenda note. Any other wire is revoked.',
  run:S=>{const out=[];const SEALED=['evidence','hr-task','agenda','intake'];
    for(const c of S.cases.filter(c=>c.type==='ethics')){for(const l of (c.ledger||[])){if(!SEALED.includes(l.kind))out.push({msg:c.id+' carries non-sealed wire “'+l.kind+'”',ref:c.id})} }
    for(const t of S.tasks.filter(t=>t.caseId&&t.kind!=='hr')){const c=S.cases.find(x=>x.id===t.caseId);if(c&&c.type==='ethics')out.push({msg:'non-HR task '+t.id+' hanging on ethics case '+c.id,ref:c.id});}

  repair:S=>{let n=0;const SEALED=['evidence','hr-task','agenda','intake'];

    n+=S.tasks.filter(t=>t.caseId&&t.kind!=='hr'&&S.cases.find(x=>x.id===t.caseId&&x.type==='ethics')).length;

/* ---------- STORE: schema v6, migrations, quota, corrupt recovery ---------- */
const LSKEY='leados.v6',VER=6;
let S=null,WRITEFAIL=null;
function blank(){return{v:VER,created:U.today(),seq:1,identity:{name:'',tookRole:''},log:[],
 people:[],teams:[],cases:[],tasks:[],sessions:[],feedbacks:[],decisions:[],goals:[],aars:[],commitments:[],evidence:[],meetings:[],rituals:[],handoffs:[],pulses:[],edmondson:[],coachings:[],delegations:[],mediations:[],stakes:[],tours:[],wins:[],lessons:[],
 snoozes:{},gates:{},dysf:{cur:1,ev:{}},academy:{done:{}},meta:{lastExport:null}};}
function guard(o){const b=blank();for(const k of Object.keys(b)){if(o[k]===undefined||o[k]===null)o[k]=b[k];
   else if(Array.isArray(b[k])&&!Array.isArray(o[k]))o[k]=[];
   else if(!Array.isArray(b[k])&&typeof b[k]==='object'&&typeof o[k]!=='object')o[k]=b[k];}return o;}
function migrate(o){ // additive only, v1..v5 -> v6, announced in the system log (writes o.log directly: global S is not yet wired during boot-time migration)
  const from=U.num(o.v,1);o=guard(o);
  const note=m=>o.log.unshift({at:U.today(),msg:m,ts:Date.now()});
  if(from<2){note('migration v1→v2: added decisions/goals defaults');}
  if(from<3){note('migration v2→v3: added commitments + evidence ledgers');}
  if(from<4){note('migration v3→v4: added mediations/delegations/coachings');}
  if(from<5){note('migration v4→v5: added pulses/edmondson/transition stores');}
  if(from<6){note('migration v5→v6: added rituals, meetings, handoffs (v12 collections) — additive, no record rewritten');}
  o.v=VER;return o;}
function storeBytes(){try{return(localStorage.getItem(LSKEY)||'').length}catch(e){return 0}}
function save(){ if(!S)return; try{const raw=JSON.stringify(S);localStorage.setItem(LSKEY,raw);WRITEFAIL=null;}
  catch(e){WRITEFAIL={msg:'Quota write failed — '+U.fmtB(JSON.stringify(S).length)+' would not fit in ~5MB. Remedy: #/data → export, then prune.',e:String(e)};}
  paintSaveChip();}
function paintSaveChip(){const c=$('#savechip');if(!c)return;
  if(WRITEFAIL){c.className='bad';c.innerHTML=icon('warn',13)+' WRITE FAILED — '+U.esc(WRITEFAIL.msg);c.title=WRITEFAIL.e||'';}
  else{const d=new Date();c.className='';c.innerHTML=icon('check',13)+' saved '+U.pad(d.getHours())+':'+U.pad(d.getMinutes())+' · '+U.fmtB(storeBytes());c.title='localStorage '+LSKEY;}}
function log(msg){ if(S){S.log.unshift({at:U.today(),msg,ts:Date.now()});S.log=S.log.slice(0,200);}}
function loadStore(){ // returns {state} | {corrupt:key} | {newer:v} — never throws, never guesses
  let raw=null;try{raw=localStorage.getItem(LSKEY)}catch(e){return{state:null,bootErr:'localStorage unavailable: '+e}}
  if(!raw)return{state:null};
  let o;try{o=JSON.parse(raw)}catch(e){
    const ck=LSKEY+'.corrupt-'+Date.now();try{localStorage.setItem(ck,raw)}catch(e2){}
    return{corrupt:ck};}
  if(!o||typeof o!=='object'){const ck=LSKEY+'.corrupt-'+Date.now();try{localStorage.setItem(ck,raw)}catch(e2){}return{corrupt:ck};}
  if(U.num(o.v,0)>VER)return{newer:o.v};
  if(U.num(o.v,0)<VER)o=migrate(o); else o=guard(o);
  return{state:o};}

function validateImport(txt){ let o;try{o=JSON.parse(txt)}catch(e){return{err:'Not JSON: '+e.message}}
  if(!o||typeof o!=='object'||Array.isArray(o))return{err:'Not a LeadOS record (root must be an object).'};
  if(o.v!==VER)return{err:'Record v:'+o.v+' — imports are v:'+VER+'-only. Migrate by hand or decline. State untouched.'};

function mergeImport(o){ // append with re-minted ids; graph rewired through one map
  const map={};const mint=id=>{if(!id)return id;if(!map[id])map[id]=id.split('-')[0]+'-m'+Math.random().toString(36).slice(2,8);return map[id];};
  for(const col of['people','teams','cases','tasks','sessions','feedbacks','decisions','goals','aars','commitments','evidence','meetings','rituals','handoffs','pulses','edmondson','coachings','delegations','mediations','stakes'])for(const r of(o[col]||[]))if(r&&r.id)mint(r.id);
  const R=id=>map[id]||id,clone=x=>JSON.parse(JSON.stringify(x));
  for(const p of o.people){p.id=R(p.id);p.teamId=R(p.teamId);p.mgr=R(p.mgr)||null;S.people.push(p);}

  for(const p of o.pulses){p.id=R(p.id);p.teamId=R(p.teamId)||'';S.pulses.push(p);}
  for(const e of o.edmondson){e.id=R(e.id);e.teamId=R(e.teamId)||'';S.edmondson.push(e);}
  for(const c of o.coachings){c.id=R(c.id);c.personId=R(c.personId);S.coachings.push(c);}
  for(const d of o.delegations){d.id=R(d.id);d.personId=R(d.personId);S.delegations.push(d);}
  for(const m of o.mediations){m.id=R(m.id);m.aId=R(m.aId);m.bId=R(m.bId);m.caseId=R(m.caseId)||'';S.mediations.push(m);}

 const draw=()=>{const q=inp.value.toLowerCase();const f=items.filter(i=>i.t.toLowerCase().includes(q)).slice(0,12);
  $('#pallist').innerHTML=f.map((i,x)=>`<div class="pi ${x===sel?'on':''}" data-x="${x}">${icon(i.tag.startsWith('person')?'user':i.tag.startsWith('case')?'layers':i.tag==='module'?'grid':'zap',14)}${esc(i.t)}<span class="tag">${i.tag}</span></div>`).join('');
  document.querySelectorAll('#pallist .pi').forEach(el=>el.onclick=()=>{closePal();f[+el.dataset.x].go();});window.__palf=f;};
 inp.oninput=()=>{sel=0;draw()};inp.onkeydown=e=>{const f=window.__palf||[];if(e.key==='ArrowDown'){sel=Math.min(sel+1,f.length-1);draw();}if(e.key==='ArrowUp'){sel=Math.max(sel-1,0);draw();}
  if(e.key==='Enter'&&f[sel]){closePal();f[sel].go();}if(e.key==='Escape')closePal();};
 draw();setTimeout(()=>inp.focus(),30);}
function closePal(){$('#pal').classList.remove('open');}

/* ---------- FORM HANDLERS (submit delegation) ---------- */
const FORMS={
 'case-intake':f=>{const p=window.__ci;const trips=ETHICS_WORDS.filter(w=>(p.title+' '+p.facts).toLowerCase().includes(w));

 'case-comms':f=>{const c=S.cases.find(x=>x.id===f.id.value);if(c){c.comms=f.comms.value;save();toast('Comms saved.');}},

 'drivers':f=>{const p=P(f.id.value);p.flight=p.flight||{drivers:{}};p.flight.drivers={change:+f.change.value,manager:+f.manager.value,load:+f.load.value,growth:+f.growth.value,recog:+f.recog.value};

  save();closeModal();render();toast('Draft saved — the ageing clock is running.');},
 'dec-new':f=>{S.decisions.push({id:U.uid('d'),title:f.title.value,door:+f.door.value,st:'pending',createdAt:U.today(),reviewAt:f.reviewAt.value,prem:f.prem.value.split('\n'),choice:'',rationale:'',decidedAt:null,outcome:'',grade:'',gradedAt:null,redates:[],caseId:''});

 'dec-decide':f=>{if(ENG.decide(f.id.value,f.choice.value,f.rationale.value)){closeModal();render();toast('Decided on the record.');}},
 'dec-redate':f=>{if(ENG.redate(f.id.value,f.to.value,f.reason.value)){closeModal();render();toast('Re-dated — reason is in the history, where it will be read.');}},
 'dec-prem':f=>{const d=S.decisions.find(d=>d.id===f.id.value);d.prem=f.prem.value.split('\n');save();closeModal();render();toast('Premortem saved — '+(d.prem.filter(x=>x.trim()).length)+'/3 lines.');},
 'goal-new':f=>{const krs=[0,1].map(i=>({id:'k'+(i+1),t:f['kr'+i].value,s:U.num(f['s'+i].value,0),tgt:U.num(f['t'+i].value,100),dir:f['d'+i].value,ci:[]})).filter(k=>k.t.trim());
  S.goals.push({id:U.uid('g'),title:f.title.value,teamId:f.teamId.value,due:f.due.value,st:'open',atRisk:null,closedAt:null,grade:'',causal:'',krs});
  save();closeModal();render();toast('Goal live — trajectory now has witnesses.');},
 'goal-checkin':f=>{ENG.checkIn(f.id.value,f.kr.value,f.v.value,f.c.value);closeModal();render();toast('Check-in stamped — confidence is the leading indicator, and you just moved it.');},
 'goal-grade':f=>{if(ENG.closeGoal(f.id.value,f.grade.value,f.causal.value)){closeModal();render();toast('Graded and journaled — causality on the record.');}},
 'aar':f=>{ENG.saveAAR({caseId:f.caseId.value,title:f.title.value,exp:f.exp.value,hap:f.hap.value,whys:f.whys.value,stop:f.stop.value,imps:f.imps.value});closeModal();render();toast('AAR saved — quality scored live; commitments written into the debt ledger.');},
 'ritual':f=>{const att=Object.keys(f).filter?S.people.filter(p=>p.role==='lead'&&f['att_'+p.id]&&f['att_'+p.id].checked).map(p=>p.id):[];

  closeModal();render();toast('Ritual stamped — commitments are in the debt ledger, dated.');},
 'meeting':f=>{S.meetings.push({id:U.uid('mt'),title:f.title.value,min:+f.min.value,att:+f.att.value,verdict:null,note:'',decisionId:null});save();render();toast(f.title.value+' logged — '+(f.min.value*f.att.value/60).toFixed(1)+' org-hours/wk. It owes a verdict now.');},
 'meet-fix':f=>{ENG.verdictMeeting(f.id.value,'fix',f.note.value);closeModal();render();toast('Fixed on the record.');},
 'handoff':f=>{const x={id:U.uid('h'),fromT:f.fromT.value,toT:f.toT.value,what:f.what.value,due:f.due.value,st:'open',at:U.today(),updAt:U.today(),notes:[{at:U.today(),t:'Registered'}],caseId:f.caseId.value,commId:''};
  const recv=TM(f.toT.value);if(recv&&recv.leadId){const c=ENG.addCommitment('them',recv.leadId,'Accept: '+f.what.value,f.due.value,'handoff');x.commId=c.id;}
  S.handoffs.push(x);log('handoff registered: '+f.what.value);save();closeModal();render();toast('Handoff live — the receiving lead owes acceptance, dated.');},
 'handoff-note':f=>{ENG.handoffNote(f.id.value,f.note.value);render();toast('Heartbeat noted — silence clock reset.');},

  S.mediations.push({id:U.uid('m'),aId:f.aId.value,bId:f.bId.value,st:1,updAt:U.today(),at:U.today(),caseId:f.caseId.value,agreement:'',fuAt:null,notes:{}});
  if(f.caseId.value){const c=S.cases.find(x=>x.id===f.caseId.value);if(c)ENG.ledger(c,'mediation','Mediation opened: '+firstName(f.aId.value)+' ↔ '+firstName(f.bId.value),'#/mediation');}
  save();closeModal();render();toast('Mediation open — stage 1, ground rules.');},
 'med-note':(f,sub)=>{const m=S.mediations.find(x=>x.id===f.id.value);
  if(sub==='med-save-note'){m.notes[m.st]=f.note.value;m.updAt=U.today();save();render();toast('Notes saved at stage '+m.st+'.');return;}
  if(sub==='med-finish'){if(m.st<6){toast('Reach stage 6 first — order is enforced.','err');return;}ACT['med-finish']({dataset:{id:m.id}});return;}

  save();closeModal();render();toast('Contract live: '+sl.style+' ('+sl.label+') at rung '+f.rung.value+' — mismatch warnings compute both directions.');},
 'stake':f=>{S.stakes.push({id:U.uid('st'),name:f.name.value,infl:+f.infl.value,stance:f.stance.value,heard:false,note:''});save();render();toast('On the map. Hostiles get heard first — rule.');},
 'win':f=>{S.wins.unshift({id:U.uid('w'),at:U.today(),text:f.text.value});save();render();toast('Banked.');},
 'gate':f=>{ENG.gate(f.id.value,f.note.value);render();},
 'pulse':f=>{S.pulses.push({id:U.uid('pu'),at:U.today(),teamId:f.teamId.value,dims:Object.fromEntries(PULSE_DIMS.map(k=>[k,+f[k].value]))});
  log('pulse stamped: '+U.today()+(f.teamId.value?' ('+tname(f.teamId.value)+')':' (org)'));save();render();toast('Pulse stamped — fortnight clock reset.');},
 'edmondson':f=>{const a=[0,1,2,3,4,5,6].map(i=>+f['a'+i].value);S.edmondson.push({id:U.uid('ed'),at:U.today(),teamId:f.teamId.value,a,score:FW.edm(a)});save();render();toast('Scan saved — composite '+FW.edm(a)+'/5 with 2/4/6 reverse-scored.');},

 'academy':f=>{const checks=[0,1,2].map(i=>!!(f['c'+i]&&f['c'+i].checked));
  if(!checks.every(Boolean)){toast('Three scored checks first — the lesson is not a vibe.','err');return;}

 'identity':f=>{S.identity={name:f.name.value.trim(),tookRole:f.tookRole.value};log('identity set: '+(S.identity.name||'—')+' · day one '+S.identity.tookRole);save();render();toast('Identity saved — the 90-day clock reads from this.');},
 'person-new':f=>{let teamId=f.teamId.value;
  if(teamId==='__new'){if(!f.newTeam.value.trim()){toast('Name the team, or pick an existing one.','err');return;}
   teamId=U.uid('t');S.teams.push({id:teamId,name:f.newTeam.value.trim(),leadId:''});}
  const p={id:U.uid('p'),name:f.name.value.trim(),role:f.role.value,teamId,mgr:f.mgr.value||null,cad:+f.cad.value||14,
   nine:{p:'mid',pot:'mid',at:U.today()},flight:{drivers:{change:0,manager:0,load:0,growth:0,recog:0}},trust:{c:5,r:5,i:5,s:3}};
  S.people.push(p);
  const t=TM(teamId);if(t&&f.role.value==='lead'&&!t.leadId)t.leadId=p.id;
  log('person added: '+p.name+' ('+p.role+(t?', '+t.name:'')+')');save();closeModal();render();toast(p.name+' added — flight ledger at zero, telemetry empty, nine-box dated today.');},
};
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-f]');if(!f)return;e.preventDefault();
 // Named inputs like id/title/name collide with built-in form properties (f.id === form's DOM id, f.title/f.name === attributes).
 // Resolve fields through f.elements first; bind methods to the real form. Caught by static trace, fixed at the delegation point.
 const fx=new Proxy(f,{get:(t,k)=>{if(k==='elements')return t.elements;const el=t.elements&&t.elements[k];const v=(el!=null&&typeof k==='string')?el:t[k];return typeof v==='function'?v.bind(t):v;}});
 const sub=e.submitter&&e.submitter.dataset&&e.submitter.dataset.fA?e.submitter.dataset.fA:null;
 FORMS[f.dataset.f](fx,sub);});
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a;
 if(a==='med-advance'||a==='med-finish'||a==='med-save-note')return; // handled by form submitter
 if(ACT[a])ACT[a](el);});
document.addEventListener('change',e=>{const mdl=e.target.closest('#fb-model');
 if(mdl){const form=mdl.closest('form');const vals=[form.p0?form.p0.value:'',form.p1?form.p1.value:'',form.p2?form.p2.value:'',form.p3?form.p3.value:''];
  $('#fb-parts').innerHTML=FB_MODELS[mdl.value].map((ph,i)=>`<label>${ph}</label><textarea name="p${i}" rows="2">${esc(vals[i]||'')}</textarea>`).join('');return;}
 const f=e.target.closest('input[data-import]');if(!f||!f.files[0])return;
 const mode=f.dataset.import;const file=f.files[0];const r=new FileReader();
 r.onload=()=>{const v=validateImport(r.result);
  if(v.err){toast('Import refused loud and untouched: '+v.err,'err');f.value='';return;}
  if(mode==='replace'){confirm2('Replace current state with this backup? A safety export downloads first.',()=>{exportJSON();S=v.o;log('import replaced state (v:6)');runAudits(S,true);save();render();toast('State replaced — import accepted, post-import audit ran.');});}
  else{const n=mergeImport(v.o);render();toast('Merged — '+n+' ids re-minted, graph rewired, audits re-run.');}
  f.value='';};
 r.readAsText(file);});
document.addEventListener('keydown',e=>{const typing=/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.target.isContentEditable;
 if((e.key==='/'&&!typing)||((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k')){e.preventDefault();openPal();return;}
 if(typing)return;
 if(e.key==='Escape'){closeModal();closePal();return;}
 if(e.key.toLowerCase()==='c'){e.preventDefault();ACT['open-case']({});return;}
 const num={'1':'today','2':'signal','3':'cases','4':'people','5':'oneonones','6':'feedback','7':'coach','8':'decisions','9':'aar','0':'review'}[e.key];
 if(num)location.hash='#/'+num;});

/* ---------- BOOT: trust nothing, announce everything ---------- */
let RECOVERY=false;
function renderRecovery(kind,ref){RECOVERY=true;
 $('#view').innerHTML=`<div class="pagehead"><div><h1>Store needs a decision</h1><div class="sub">Recovery is a decision, not a boot side-effect. Nothing has been written over your data.</div></div></div>
 <div class="card warn" style="max-width:640px">
  ${kind==='corrupt'?`<div class="ch">${icon('warn')} THE LIVE STORE IS CORRUPT</div>
   <div class="small">The bytes at <span class="mono">leados.v6</span> do not parse. They are preserved <b>untouched</b>, and a copy sits at <span class="mono">${esc(ref)}</span> for forensics. The app is running on a blank in-memory state that will <b>not</b> be saved until you decide.</div>
   <div class="row mt"><button class="btn sm" id="rc-dl">${icon('dl')}Download the damaged copy</button><button class="btn sm pri" id="rc-clean">Start clean (keeps damaged key)</button>
   <label class="btn sm">${icon('ul')}Import a backup<input type="file" accept=".json" style="display:none" id="rc-imp"></label></div>`
  :`<div class="ch">${icon('warn')} NEWER RECORD (v:${esc(ref)})</div>
   <div class="small">This browser holds a store from a newer LeadOS than this file. A silent downgrade is refused. Load the newer file, import the record, or start clean — the original stays untouched meanwhile.</div>
   <div class="row mt"><button class="btn sm pri" id="rc-clean">Start clean (keeps original key)</button></div>`}
 </div>`;
 const dl=$('#rc-dl');if(dl)dl.onclick=()=>{const raw=localStorage.getItem(ref)||'';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([raw],{type:'application/json'}));a.download='leados-damaged.json';a.click();};
 const cl=$('#rc-clean');if(cl)cl.onclick=()=>{RECOVERY=false;S=guard(blank());log('recovery decision: start clean; damaged key preserved');save();route();};
 const im=$('#rc-imp');if(im)im.onchange=()=>{const file=im.files[0];const r=new FileReader();r.onload=()=>{const v=validateImport(r.result);
  if(v.err){toast('Import refused: '+v.err,'err');return;}RECOVERY=false;S=v.o;log('recovery decision: imported backup over corrupt store');save();route();};r.readAsText(file);};}
function boot(){
 try{const tt=runSelfTests();const bad=tt.filter(t=>!t.ok);if(bad.length)console.warn('[LeadOS] SELF-TEST FAILURES:',bad);window.__TESTS=tt;}catch(e){console.warn('[LeadOS] self-test harness failed:',e);}
 const res=loadStore();
 if(res.corrupt){S=guard(blank());render();renderRecovery('corrupt',res.corrupt);return;}
 if(res.newer){S=guard(blank());render();renderRecovery('newer',res.newer);return;}
 if(res.bootErr){S=guard(blank());toast(res.bootErr+' — running without persistence','err');}
 else if(res.state){S=res.state;log('boot ok — '+LSKEY+' v:'+S.v+' · '+U.fmtB(storeBytes()));}
 else{S=blank();seed();save();}
 ENG.sweep();
 if(!location.hash)location.hash='#/today';
 route();paintSaveChip();
}
window.addEventListener('hashchange',route);
boot();
</script>
